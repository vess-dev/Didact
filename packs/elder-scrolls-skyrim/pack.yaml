id: elder-scrolls-skyrim
name: Skyrim (The Elder Scrolls 2e's campaigns and Holds)
kind: setting
version: 0.1.0
description: >-
  The setting of The Elder Scrolls 2e book, for either Elder Scrolls system (elder-scrolls-2e or
  grimscrolls): its ten campaign frames, from the cart at Helgen to the Hall of Valor, the Daedric
  Princes' fifteen bargains and a homestead of one's own; the nine Holds and Solstheim; and the
  canon they stand on. The Tamrielic calendar from the book's own moment, Sundas, 17 Last Seed, 4E
  201; canon that comes up in play as lore; the frames' places, people, threats (each system's
  numbers) and clocks, ready to start with one generator; the Holds with their capitals, Jarls
  and key locations; the factions; and the frames as searchable text.
# Only core: a setting enabled in a world whose system is elder-scrolls-2e or grimscrolls (or any
# other). Each system's numbers ride in the entries' `mechanics.<system>` blocks (GUIDE.md).
requires: {packs: [core]}
license:
  spdx: CC-BY-SA-4.0 AND LicenseRef-Grimscrolls
  redistributable: true
  attribution: >-
    The Elder Scrolls 2e is a fan work released under CC BY-SA 4.0. Rules chassis: Cairn Second
    Edition by Yochai Gal (cairnrpg.com), CC BY-SA 4.0. Conversion, tables and setting text: fan
    work, CC BY-SA 4.0; Elder Scrolls lore paraphrased from the community UESP wiki for
    non-commercial home use. This pack adapts the book's campaign frames and Holds to Didact's
