id: the-dark-brotherhood
type: quest
name: The Dark Brotherhood
tags: [the-dark-brotherhood, frame, main-campaign]
goal: "The party draws the eye of the Dark Brotherhood, Tamriel's most feared guild of assassins — worshippers
  of the Dread Father Sithis, bound by old tenets, and all but extinct in this Fourth Era. Abducted and
  \"recruited\" by the cell's leader Astrid, the party is initiated with a killing, taken into the Falkreath
  Sanctuary, and set to work on contracts. Then the silent corpse of the Night Mother speaks — and names
  one of them Listener, the voice through whom Sithis's will is heard. That elevation drags the family
  into the grandest contract in their history: the murder of Emperor Titus Mede II himself. But the family
  is rotten from within. A betrayer burns the Sanctuary to the ground, and the survivors must finish the
  Emperor aboard his warship the Katariah and rebuild from the ashes — or never finish at all."
date: Sundas, 17 Last Seed 4E 201
body: |-
  *A child prays the Black Sacrament in a candlelit room, and somewhere a knife answers. You answered. Now there is a sack over your head, a stranger's voice in the dark, and three bound captives kneeling on a dirty floor — and the only way out of this room is to decide, right now, what kind of killer you are.*

  ## GM notes

  **Date.** Sundas, 17 Last Seed 4E 201: 4E 201, the book's moment; no day of its own: whenever the Black Sacrament reaches the party. It is the calendar's start: a new campaign opens on it.

  **The frame's text:** `didact rules lookup the dark brotherhood pitch` (and `stakes`, `tone touchstones`, `arrival`, `the branch`, `plot beats`, `the place`, `cast`, `clocks`, `threats`, `rewards`, `climax`, `the destroyer's path`).

  **Stakes.** A family, an Emperor, and the party's souls. On the join-path, the Brotherhood either rises from its own ashes with the party as its Listener, or dies in the fire its own leader lit; the Empire loses its Emperor, and Skyrim's war tilts on the murder. On the other path, the party ends the Dark Brotherhood in Skyrim for good. The branch is the whole point. At the second beat, in the abandoned shack, the party chooses: kill one of the captives and join, or kill Astrid and walk out to destroy the Brotherhood for the Empire. The first choice is this entire campaign. The second is a short, cold demolition that ends everything below. Make the weight of that single knife land.

  **Arrival.** - **The Sacrament.** The party passes through Windhelm and hears of the orphan boy who has been praying for the Brotherhood behind a locked door (Beat 1).
  - **A background tie.** A PC with the Dark Brotherhood Assassin background is already family: they start at **Dark Brotherhood +1**, and it is *they* whom Astrid sends to bring the rest of the party to the shack.
  - **A stolen kill.** The party kills someone — a bandit, a thug, a cruel master — whose death the Brotherhood had already been paid for. Astrid comes to collect.

  **Plot beats.**

  1. **The Black Sacrament.** In Windhelm, a grieving orphan boy, **Aventus Aretino**, has performed the forbidden rite — surrounded by candles, a flayed effigy, a dagger, and human remains — praying for the Brotherhood to come. He begs the party to kill the cruel orphanage matron **Grelod the Kind** in Riften. Whether they do it or not, the prayer has already been heard. (A grounded, low-stakes opener that establishes the ritual and the world's cruelty.)
  2. **Abducted by Astrid.** The next time the party sleeps, they wake hooded in a derelict shack. **Astrid** is waiting. She tells them they've *stolen a kill* the Brotherhood was owed (Grelod's — or, if they let the matron live, some other death that drew her eye), and a life must be paid for a life. Three captives kneel bound and hooded before them. **THE BRANCH:** kill one to settle the debt and earn passage through the Black Door — or kill Astrid and take the other road. The Black Door's riddle is answered with *"Silence, my brother,"* and it swings open to the Sanctuary.
  3. **The Falkreath Sanctuary.** The party descends into the cliffside warren in the pine forest and meets the family: **Nazir** the Redguard contract-broker, the child-shaped vampire **Babette**, the dark conjurer **Gabriella**, the venomous old mage **Festus Krex**, and Astrid's werewolf husband **Arnbjorn**. Each PC is issued a suit of the black-and-red **Shrouded Armor** from the Sanctuary's wardrobe and given their first work. The family also includes the quiet Argonian Shadowscale **Veezara**. The Sanctuary should feel like *home* — that is the trap.
  4. **Contracts.** A run of small, varied jobs from Nazir teaches the toolkit of murder: poison, stealth, the staged accident, the open knife. Use these to explore the Holds and let the party develop a *style.* Somewhere in here the unhinged Keeper **Cicero** arrives, hauling a long black coffin and muttering to its occupant — the family is unsettled, Astrid most of all.
  5. **The Night Mother Speaks.** Astrid, suspicious of Cicero, asks the party to hide inside the Night Mother's coffin and eavesdrop. Instead the corpse *speaks* — to the listener within. *"Darkness rises when silence dies."* She names the eavesdropper **Listener**, the long-empty office, and bids them seek a nobleman, **Amaund Motierre**, at the ruin of **Volunruud**. Astrid is shaken: power in the Sanctuary has just shifted out of her hands.
  6. **The Grand Conspiracy.** At Volunruud, Amaund lays out the contract that will define the family: assassinate **Emperor Titus Mede II**, who is sailing to Skyrim. He hands over a sealed letter and a jeweled token (a noble's down-payment, appraised through a Thieves Guild fence). The plot is built one kill at a time — a wedding (the Emperor's cousin), the killing of **Commander Maro**'s son, framed as a traitor to break the commander of the **Penitus Oculatus**, and the murder of the famous chef the Gourmet to steal his identity and his writ of passage to the Emperor's table.
  7. **Cicero's Madness.** Mid-conspiracy, Cicero snaps — he attacks Astrid and flees to the long-shut **Dawnstar Sanctuary**, dragging the family's loyalties apart. Astrid lends the party her undying black mare, **Shadowmere**, to run him down. In Dawnstar they find the wounded Arnbjorn and a cornered Keeper. **Spare or kill Cicero** — the choice colors how the family fractures, and a Listener who heeds the Night Mother stays the blade.
  8. **The Betrayal.** The party returns from the false poisoning at Solitude to find the Falkreath Sanctuary aflame, the Black Door broken, and the **Penitus Oculatus** inside putting the family to the sword. Festus, Gabriella, Veezara, Arnbjorn die in the smoke. The party drags out the survivors and learns the unthinkable: **Astrid** sold them all to Commander Maro to save her own family — and it bought the family's destruction. They find her, dying and burned, on the altar of the wreck. She confesses, hands over the **Blade of Woe**, and begs for the mercy of a clean death. *"Hail Sithis."*
  9. **The Katariah.** The poisoning was a decoy; the true Emperor is alive aboard his warship, the **Katariah**, anchored off Solitude. (The party may first settle accounts with **Commander Maro** at the docks.) They board her — over the side, through the hold, up through the guards — and reach Titus Mede II. He does not fight. He has known they were coming, and asks only that they consider who *bought* his death and whether that schemer should outlive him. The party makes the kill, escapes, and may close the loop on Amaund Motierre, who waits at the Bannered Mare in Whiterun, before collecting the sealed urn of 20,000 Septims from the Volunruud dead-drop.
  10. **The Listener Rebuilds.** What is left of the family — Nazir, Babette, the Night Mother's coffin, perhaps a spared Cicero — gathers in the **Dawnstar Sanctuary**, its old Black Door reopened. The party, now **Listener**, holds the only working chapter of the Dark Brotherhood in Tamriel, a base of their own, and the prayers of the desperate humming in from across the province. The campaign ends not with a death but with a beginning: the family they chose to save, and the long red work ahead.

  **Climax.**

  The Emperor is alone in his cabin and the way out is the way you came, through the cold and the guards. Three shapes the ending can take:

  - **The Listener.** Make the kill, brave the freezing water again, and slip away. Settle accounts with Amaund Motierre in Whiterun (his own death cleans the ledger) and claim the urn of Septims at the Volunruud dead-drop. Return to Dawnstar, gather the family that survived, and reopen the Black Door. The Brotherhood lives because the party rebuilt it.
  - **The Hollow Crown.** Kill the Emperor but let Maro and Motierre live, or fail to gather the survivors. The contract is fulfilled and the purse is paid, but the family is a handful of ghosts and the party is a Listener with no one left to lead. A bleak, *earned* ending — the Warden describes the empty hearth.
  - **The Empty Coffin.** If the party spared the Emperor at his asking, or could not bring themselves to the kill at all, the conspiracy collapses, the Penitus Oculatus closes in, and the last Sanctuary dies with its work undone. The Night Mother goes silent. Sithis is not mocked twice.

  **Also in the frame:** The Branch (read this first); The Destroyer's Path (the alternate branch) (`didact rules lookup the dark brotherhood …`).

  **The frame's records.** `didact gen run elder-scrolls-skyrim.frame --prefill '{"frame": "The Dark Brotherhood"}' --auto` drafts the region, 5 places, 9 people, 1 threats, its factions and its clocks, for the world's system; `gen commit` writes them.

  **Not trackers.** The Listener's Standing: ambient, after Beat 5: each clean, signature kill that becomes a rumor nudges the party's Infamy (Elder Scrolls 2e: `didact do renown party=<it> step=down deed='…'`; Grimscrolls: fame, Chapter 9) and its standing as Listener.

  **Bestiary** (Elder Scrolls 2e / Grimscrolls): Draugr → `draugr` / `draugr`; Skeleton → `skeleton` / `skeleton`; Bandit → `bandit` / `bandits`; Vampire → `vampire` / `vampire-clan`.

  **Rewards in each system's catalog:** Blade of Woe (elder-scrolls-2e.blade-of-woe · grimscrolls.blade-of-woe); Shrouded Armor (elder-scrolls-2e.shrouded-armor · grimscrolls.shrouded-armor); Ancient Shrouded Armor (elder-scrolls-2e.ancient-shrouded-armor); Shadowmere (elder-scrolls-2e.shadowmere); Windshear (elder-scrolls-2e.windshear · grimscrolls.windshear).
source: campaigns/06-the-dark-brotherhood#pitch
