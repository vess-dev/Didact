  ## GM notes

  *Sanctuary Leader*

  The fierce, pragmatic Nord who leads the last Sanctuary and loves her family more than the tenets that bind it — which is exactly why she betrays it. Charismatic, controlling, doomed.

  Elder Scrolls 2e: 10 HP, 1 Armor, 13 STR, 15 DEX, 14 WIL, Blade of Woe (d6; see Unique Weapons), or a poisoned dagger (d6; the first creature it wounds each fight must pass a STR save or take 1d6 STR).

  Grimscrolls: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
