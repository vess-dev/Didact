tags: [the-thieves-guild, place]
mechanics:
  elder-scrolls-2e: {kind: poi}
body: |-
  ## GM notes

  The flooded sewer-warren beneath Riften, full of skeevers, lowlifes, and the desperate (it is also where the Blades' loremaster Esbern hides, in another tale). Two ways into the Guild: the long crawl through the Ratway, or a secret tomb door east of the Hall of the Dead.
source: campaigns/05-the-thieves-guild#the-place--riften--the-ratway
---
