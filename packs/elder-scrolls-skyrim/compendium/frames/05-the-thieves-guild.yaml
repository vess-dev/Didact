mechanics:
  elder-scrolls-2e: {kind: poi}
body: |-
  ## GM notes

  The Guild's true home behind the Flagon — a vaulted, water-floored hall of bunks, a strongbox vault, and the Guild Master's quarters. Empty bunks tell the story of the Guild's decline.
source: campaigns/05-the-thieves-guild#the-place--riften--the-ratway
