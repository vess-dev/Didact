body: |-
  ## GM notes

  Open stalls in the canal town's heart. Where Brynjolf works the crowd and the campaign begins. Madesi the Argonian jeweler, Brand-Shei the Dunmer trader, and Grelka the armorer keep stalls here.
source: campaigns/05-the-thieves-guild#the-place--riften--the-ratway
