type: monster
name: Nahkriin
aliases: [Nahkriin (the gatekeeper of Skuldafn)]
knowledge: secret
tags: [the-main-quest, threat]
mechanics:
  elder-scrolls-2e:
    category: 'Campaign: The Main Quest'
    hp: 12
    armor: 1
    STR: 8
    DEX: 13
    WIL: 18
    attacks:
    - {name: life-draining touch, damage: d8}
    - name: elemental bolt
      damage: d8
      qualities: [blast]
    impaired_by: [magic]
    critical: a death-curse strikes the target for 1d6 WIL. When he falls he drops the Nahkriin mask
      and the portal-staff.
  grimscrolls:
    category: Bosses of Tamriel
    tier: boss
    role: blaster
    sights: a coffin lid thrown the length of the hall
    sounds: a dry voice Shouting in the dragon tongue
    smells: lightning and embalming salts
    pools:
    - name: The Priest
      dice: 8
      traits: adrift above the floor, warded, and always backing away
      moves: [Lightning Down the Hall, Shout the Ranks Apart]
    - name: The Thralls in the Walls
      dice: 6
      traits: draugr who rise in shifts to feed their lord their own life
      moves: [Burst from the Niches, Kneel and Feed]
    - name: The Staff
      dice: 4
      traits: a wall of storm across the floor, and an atronach to hold the gap
      moves: [Wall of Storms, Atronach in the Gap]
    fail: It leaves the barrow with its dead behind it, and the nearest hold has a master it did not
      choose.
    wants: to rule again in the dragons' name — and never to see its mask on a living face
    note: "A linked challenge (6d + 4d + 8d): the Priest is locked while its thralls stand. Break the
      Staff or corner the Priest for a setup. Each is named for its mask, which outlasts it. **Morokei**
      of Labyrinthian holds the Staff of Magnus (+1t to work magic near him). **Nahkriin** keeps Alduin's
      portal at Skuldafn. **Hevnoraak** planned his own return, and the ghost jailing him in Valthume
      wants help."
body: |-
  ## GM notes

  *the gatekeeper of Skuldafn*

  The masked priest who holds the staff that powers Alduin's portal at Skuldafn (Beat 10). Magic against it is Impaired; immune to poison; it backpedals, throws Destruction bolts, raises nearby draugr, and shields itself with wards.

  Elder Scrolls 2e: 12 HP, 1 Armor, 8 STR, 13 DEX, 18 WIL, life-draining touch (d8), elemental bolt (d8, blast).

  The frame runs it as the Bestiary's Dragon Priest (`elder-scrolls-2e.dragon-priest`); the numbers are the same.

  Grimscrolls: its card is `grimscrolls.dragon-priest` (Dragon Priest), in this record's grimscrolls block.
source: campaigns/01-the-main-quest#nahkriin-the-gatekeeper-of-skuldafn
