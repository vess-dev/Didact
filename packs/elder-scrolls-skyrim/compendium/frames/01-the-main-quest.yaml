fields: {role: the ancient dragon who leads the Greybeards from the summit}
body: |-
  ## GM notes

  **Paarthurnax** — the ancient dragon who leads the Greybeards from the summit; once Alduin's lieutenant, he rebelled and taught mortals the Voice. Slow, sad, wise. The party's greatest dragon ally — *unless* the Blades force the issue (stat block in Threats, for the optional fight only).

  The party's mentor and greatest dragon ally. Provide this block only if the party chooses to kill him for the Blades (see Climax). He does not fight back in earnest against those he counts as kin — but he is an Ancient Dragon's equal if cornered. Killing him forfeits his counsel and weighs on the table; the Blades give no reward (their support resuming is the only "gain").

  Elder Scrolls 2e: 18 HP, 3 Armor, 18 STR, 13 DEX, 18 WIL, bite (d12), Fire Breath (d10, blast), detachment.

  Grimscrolls: its Face is `grimscrolls.paarthurnax` (Paarthurnax), in this record's grimscrolls block.
