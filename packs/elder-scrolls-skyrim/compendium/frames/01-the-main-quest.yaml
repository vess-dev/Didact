id: the-main-quest-alduin
type: monster
name: Alduin
aliases: ['Alduin, the World-Eater (final boss)', 'Alduin, the World-Eater']
knowledge: secret
tags: [the-main-quest, cast, threat]
mechanics:
  elder-scrolls-2e:
    category: 'Campaign: The Main Quest'
    hp: 18
    armor: 3
    STR: 18
    DEX: 14
    WIL: 18
    attacks:
    - {name: bite, damage: d12}
    - name: breath
      damage: d10
      qualities: [blast]
    - name: meteor storm
      damage: d8
      qualities: [blast]
    abilities:
    - "A detachment: individuals' attacks on it are Impaired (unless blast); its attacks on individuals
      are Enhanced and blast."
    - Beyond reach until Dragonrend. In the Time-Wound battle (Beat 8) and the Sovngarde finale 
      (Beat 11), Dragonrend is supplied by the Elder Scroll's vision and then by the three ancient 
      heroes; while they Shout in concert, Alduin is forced to earth and the party can fight him as 
      a grounded foe. Without that allied power he simply wheels overhead and flies off again, as he
      does at Helgen and Kynesgrove. No player Shout is ever required or granted.
    impaired_by: [fire, frost]
    critical: he devours the target's soul. They die, and their soul is his — unless he is slain 
      before the fight ends, which sets it free.
  grimscrolls:
    category: Named Threats & Legends
    tier: boss
    role: blaster
    sights: a black shape putting out the stars
    sounds: a Shout that makes the sky rain fire
    smells: ash on a barrow wind
    pools:
    - name: Alduin
      dice: 8
      traits: nothing harms him on the wing, and nothing kills him in the mortal world
      moves: [Fire from a Burning Sky, Seize and Toss]
    - name: His Risen Kin
      dice: 6
      traits: dragons Shouted back out of their burial mounds
      moves: [Raise the Mound, Send a Dragon in His Stead]
    - name: The Soul-Snare
      dice: 6
      traits: a mist across Sovngarde where he hunts the honored dead
      moves: [Devour the Lost, Draw the Mist Back]
    fail: He is fed. He returns from Sovngarde greater than the old heroes found him, and there is 
      no second prophecy.
    wants: 'dominion over the world he was made to end — pride is the flaw: clear his mist and he comes
      in a rage'
    note: "A linked challenge (6d + 6d + 8d), and a campaign's last act. Without Dragonrend, the mortal-made
      Shout that forces a dragon to know death, his pool can't drop. In the mortal world it can't drop
      below 1d: beaten there, he flees by the portal at Skuldafn. He dies only in Sovngarde, with the
      mist Shouted clear and the three heroes who first banished him beside you. No one takes his soul."
fields: {role: 'the World-Eater, eldest dragon, firstborn of Akatosh'}
body: |-
  ## GM notes

  **Alduin** — the World-Eater, eldest dragon, firstborn of Akatosh; raises the dead dragons and means to devour the world. The campaign's final foe (stat block in Threats).

  The firstborn of Akatosh, devourer of the world. Fire and frost damage against him are Impaired. He breathes both, calls down a storm of burning stones, and can raise a slain dragon to fight beside him.

  Elder Scrolls 2e: 18 HP, 3 Armor, 18 STR, 14 DEX, 18 WIL, bite (d12), breath (d10, blast), meteor storm (d8, blast), detachment (as in the Bestiary).

  Elder Scrolls 2e's Bestiary has the same stat block: `elder-scrolls-2e.alduin`.

  Grimscrolls: its card is `grimscrolls.alduin-the-world-eater` (Alduin, the World-Eater), in this record's grimscrolls block.
source: campaigns/01-the-main-quest#alduin-the-world-eater-final-boss
