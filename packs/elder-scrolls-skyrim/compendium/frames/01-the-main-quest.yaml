body: |-
  ## GM notes

  **Odahviing** — a great red dragon, proud and loyal to Alduin until the party out-fights and out-thinks him. Trapped at Dragonsreach, he becomes the party's mount to Skuldafn and a grudging ally (stat block in Threats).

  As an enemy (the Dragonsreach fight, Beat 9): a proud red dragon loyal to Alduin. Fight him down to roughly half his HP on the Great Porch, then the ancient yoke is sprung in the fiction and the fight ends with his neck pinned — do not require a save or a Shout to close the trap; the party's task is to survive and trip the mechanism. He breathes fire, and fire damage against him is Impaired.

  Elder Scrolls 2e: 16 HP, 3 Armor, 16 STR, 13 DEX, 18 WIL, bite (d10), Fire Breath (d10, blast), detachment.

  The frame runs it as the Bestiary's Elder Dragon (`elder-scrolls-2e.elder-dragon`); the numbers are the same.

  Grimscrolls: its card is `grimscrolls.dragon` (Dragon), in this record's grimscrolls block.
source: campaigns/01-the-main-quest#odahviing-the-dragon-ally
