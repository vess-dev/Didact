knowledge: secret
tags: [the-main-quest, clock]
kind: clock
size: 6
value: {value: 0, size: 6}
note: (d6) Alduin's growing power as he resurrects the dead. Ticks once each time a new dragon 
  attacks a settlement or a named dragon is resurrected (Mirmulnir, Sahloknir, each random dragon 
  the Warden drops on a town), and once whenever the party spends a whole session away from the main
  quest. At 1–3, dragon attacks are rare and the roads are merely dangerous. At 4–5, dragons appear 
  at burial mounds and over villages; the dead walk more boldly. At 6, the sky is wrong everywhere —
  dragon attacks are constant background dread until the party reaches Skuldafn. The clock stops 
  mattering once the party steps through the portal.
source: campaigns/01-the-main-quest#clocks
