body: |-
  ## GM notes

  *the Watchtower dragon*

  The first dragon the party fights on the ground (Beat 3), at the Western Watchtower with Irileth and a handful of Whiterun guards (run the guards as a friendly detachment that soaks a breath or two). Breathes fire.

  Elder Scrolls 2e: 12 HP, 2 Armor, 16 STR, 13 DEX, 16 WIL, bite (d10), breath (d8, blast), detachment.

  The frame runs it as the Bestiary's Dragon (`elder-scrolls-2e.dragon`); the numbers are the same.

