fields: {role: the ancient Volkihar who carries an Elder Scroll}
body: |-
  ## GM notes

  **Serana** — the ancient Volkihar who carries an Elder Scroll; a Daughter of Coldharbour. Sardonic, lonely, four thousand years out of time. **The party's companion the whole campaign, on either path** (see Rewards). Her arc is choosing her own side against both parents.

  The campaign's deep companion: an ancient Volkihar vampire and a powerful necromancer, sardonic and weary and slowly thawing. She walks with the party down either path. Run her as a companion (see Companions) — a named ally, hardier than a rolled one — with her Loyalty set by the Serana's Trust clock; her trick is necromancy: once per day, she raises a fresh corpse as a thrall (3 HP, its own weapon or d4) that crumbles at the scene's end.

  Elder Scrolls 2e: 8 HP, 1 Armor, 12 STR, 13 DEX, 17 WIL, draining bite (d6), Ice Spike (d8, ranged).

  Grimscrolls: its Face is `grimscrolls.serana` (Serana), in this record's grimscrolls block.
source: campaigns/08-dawnguard#serana
