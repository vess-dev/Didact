  ## GM notes

  **Isran** — founder of the Dawnguard. A grim, zealous Redguard who trusts no vampire, not even Serana, and would burn the world clean to be rid of them.

  The founder of the Dawnguard: a scarred, iron-willed Redguard zealot in heavy mail, sworn to end every vampire in Skyrim. An ally on the Dawnguard path, a furious foe on the Volkihar one.

  Elder Scrolls 2e: 10 HP, 2 Armor, 14 STR, 13 DEX, 15 WIL, Dawnguard warhammer (d10, bulky, two-handed) or crossbow (d8, bulky).

