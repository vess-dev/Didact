  elder-scrolls-2e: {kind: poi}
body: |-
  ## GM notes

  A boundless plane of Oblivion under a dead, bruise-purple sky, where soul-trapped souls drift as glowing wisps and the **Ideal Masters** hoard them. Bone towers, purple lightning, and the undead dragon **Durnehviir** patrolling the Boneyard. The living do not belong here.
source: campaigns/08-dawnguard#the-place
