tags: [dawnguard, place]
mechanics:
  elder-scrolls-2e: {kind: poi}
body: |-
  ## GM notes

  (*via Darkfall Cave*) A breathtaking glacial valley sealed from the world, blue ice and golden chantry-stone, frozen lakes and falls. Falmer and chaurus infest the ruins; **frost giants** wander the ice. Gelebor keeps the first wayshrine at the cave's mouth; five **wayshrines** ring the valley, leading to the **Inner Sanctum** where Vyrthur rules.
source: campaigns/08-dawnguard#the-place
