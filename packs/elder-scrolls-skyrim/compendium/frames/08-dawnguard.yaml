body: |-
  ## GM notes

  **Dexion Evicus** — a **Moth Priest** of the Cult of the Ancestor Moth, come north from the White-Gold Tower; the one man in Skyrim trained to read an Elder Scroll. Reading Serana's costs him his sight. A prize both sides seize.

  A mild Imperial Moth Priest, trained to read an Elder Scroll without being unmade — and blind from Beat 5 on. A captive, then a guide. He does not fight if he can help it.

  Elder Scrolls 2e: 6 HP, 13 STR, 11 DEX, 14 WIL, staff (d6).

  Grimscrolls: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
source: campaigns/08-dawnguard#dexion-evicus-moth-priest
