    hp: 14
    armor: 2
    STR: 18
    DEX: 9
    WIL: 8
    attacks:
    - name: ice-crusted club
      damage: d10
      qualities: [bulky]
    abilities:
    - "A detachment: individuals' attacks on it are Impaired (unless blast); its attacks on individuals
      are Enhanced and blast."
    - A detachment. Frost damage against it is Impaired. Its club sends a foe flying — a struck 
      target makes a STR save or is knocked prone and loses its next action.
    impaired_by: [frost]
    critical: the blow shatters bone; the target loses d6 STR.
