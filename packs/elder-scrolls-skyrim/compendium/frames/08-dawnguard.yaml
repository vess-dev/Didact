id: dawnguard-the-tyranny-clock
type: track
name: The Tyranny Clock
knowledge: secret
tags: [dawnguard, clock]
kind: clock
size: 6
value: {value: 0, size: 6}
note: '(d6) How close Harkon comes to the eternal night. Ticks each time the party hands him an advantage
  — a Scroll read in his service, the Bow brought to the castle, a Volkihar victory left unanswered. (On
  the Volkihar track the party is usually advancing this themselves.) At 6, if the climax has not resolved,
  Harkon enacts the prophecy: the sun dims over Skyrim, every vampire is emboldened, and the final assault
  begins on his terms.'
source: campaigns/08-dawnguard#clocks
