body: |-
  ## GM notes

  (*Dayspring Canyon*) A half-ruined keep in a green canyon, reached through a long tunnel that hides it from the world. The Dawnguard home base. Begins crumbling and grows — a forge, a war-troll pen, a crossbow range — as Isran's order rebuilds. Sunlit and safe; a vampire PC is *not* welcome here.
source: campaigns/08-dawnguard#the-place
