id: dawnguard-seranas-trust
type: track
name: Serana's Trust
knowledge: secret
tags: [dawnguard, clock]
kind: counter
min: 1
max: 5
value: 3
note: (a Loyalty track, 1–5) Serana begins at 3 (Trusting). She rises a step when the party shields 
  her from her father's plans, takes her counsel, or treats her as a person and not a relic; she 
  falls a step when they hand her to Isran's suspicion, threaten her mother, or treat her only as a 
  key. At 5 (Sworn) she gives the party the Bloodcursed arrows and stands at their shoulder in the 
  climax; at 1 (Wary) she may walk away before the Forgotten Vale, taking her Scroll with her.
source: campaigns/08-dawnguard#clocks
