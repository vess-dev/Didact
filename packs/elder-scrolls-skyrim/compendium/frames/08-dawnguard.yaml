id: dawnguard
type: quest
name: Dawnguard
aliases: [Dawnguard (DLC)]
tags: [dawnguard, frame, side-arc]
goal: |-
  A war that has slept for an age is stirring. Lord Harkon, master of the Volkihar vampire clan, means to enact the Tyranny of the Sun — an old elven prophecy that, fulfilled, would blot the sun from the sky forever and free his kind to hunt the day. To do it he needs three things: the Elder Scrolls that hold the prophecy, the lost Auriel's Bow, and the blood of his own daughter, a Daughter of Coldharbour. Against him stands the Dawnguard, an order of vampire-hunters scraped back together by the grim zealot Isran in the ruin of Fort Dawnguard.

  Into that gap walks the party. Sent to investigate vampire raids, they break open Dimhollow Crypt and free Serana — the ancient vampire who carries one of the Scrolls. From there the road forks hard, and the choice is the whole campaign: ride with the Dawnguard and hunt Harkon down, or take Harkon's gift, become a Vampire Lord, and enact the prophecy yourself. Either way the road runs the same haunted stations — the Soul Cairn where Serana's mother is exiled, the Forgotten Vale where the Bow is kept — and ends with one master of the night dead on a cathedral floor.
date: Sundas, 17 Last Seed 4E 201
body: |-
  *A **Dawnguard DLC** frame. Vampires are stealing folk from the roads, and a grim Redguard is rebuilding a fortress of vampire-hunters in a forgotten canyon. Crack open a Nordic crypt and you wake a four-thousand-year-old vampire who carries an Elder Scroll — and a secret her father would unmake the sun to keep. Before the arc is out you must choose: hunt the Volkihar with the Dawnguard, or drink Lord Harkon's blood and become one of the undying.*

  ## GM notes

  **Date.** Sundas, 17 Last Seed 4E 201: 4E 201, the book's moment; no day of its own: whenever the rumor of the vanished reaches the party. It is the calendar's start: a new campaign opens on it.

  **The frame's text:** `didact rules lookup dawnguard pitch` (and `stakes`, `tone touchstones`, `arrival`, `the branch`, `plot beats`, `the place`, `cast`, `clocks`, `threats`, `rewards`, `climax`).

  **Stakes.** The sun itself. If the Tyranny of the Sun is fulfilled, daylight fails over Skyrim and the Volkihar hunt the living forever; if it is thwarted, a vampire court four thousand years old is broken. Between those ends stands a woman out of time who must choose between her father, her mother, and the strangers who woke her — and a party that may end the campaign as hunters, or as monsters.

  **Arrival.** Rumor reaches the party in any tavern from Riften to Solitude: people are vanishing from the roads at night, and a new order of hunters in **Dayspring Canyon** is paying good Septims for anyone willing to fight the undead. Or a tattered **Vigilant of Stendarr** staggers up with his last breath, warning that the Hall of the Vigilant has been burned and "the ones who did it came for a crypt by Morthal." Either thread leads to **Fort Dawnguard** and Isran, who sends the party straight to **Dimhollow Crypt**.

  A PC with the Dawnguard Hunter background is already one of Isran's first recruits, and starts at **Dawnguard +1**. (If a PC is a Vampire Fledgling, Isran will not have them in his fort — but Serana will trust them faster, and Harkon's offer in Beat 3 lands as a homecoming.)

  **Plot beats.**

  1. **Dimhollow Crypt (shared).** Isran sends the party east of Morthal to learn why vampires want an old Nordic tomb. Inside, they trail a Volkihar raiding party led by **Lokil**, who is torturing a captured Vigilant for the way down. At the heart of the crypt stands a sealed stone monolith ringed by unlit braziers — a **brazier puzzle** (press the stud on the central pedestal, then push the braziers along their tracks until the violet fire reaches the outer ring). Solving it opens the monolith and frees **Serana**, who has slept here some four thousand years cradling an **Elder Scroll**. She asks only to be taken home. Lokil's vampires attack as the party leaves.
  2. **The Long Road Home (shared).** Serana asks to be escorted to **Castle Volkihar**, on an island in the Sea of Ghosts west of Solitude, reached by a ferryman at a ruined dock. Along the way she is wary, then warmer; she lets slip that she is a *Daughter of Coldharbour*, that her mother **Valerica** vanished long ago, and that she would rather not see her father at all. This is the beat to make the party *like* her before the fork.
  3. **Bloodline — the Choice (the branch).** In the great hall of Castle Volkihar, **Lord Harkon** receives his daughter coldly and the party warily. He reveals the **Tyranny of the Sun** and offers the party his blood — the **Vampire Lord** gift — to join the Volkihar. **Here the campaign forks.**
     - **Dawnguard track:** Refuse. Harkon casts the party out (or hunts them through the castle); they flee back to **Fort Dawnguard**, where Isran is rebuilding the order — *A New Order* begins.
     - **Volkihar track:** A PC accepts and is remade as a Vampire Lord (see the note above). Harkon welcomes them into the clan and sets them the same hunt — find the Scrolls and the Bow — only now in his service.
  4. **Mustering / The Court (the branch, parallel).** Each side gathers its strength and learns it needs a **Moth Priest** to read an Elder Scroll safely.
     - **Dawnguard track — *A New Order*:** Help Isran beat off a vampire assault on the fort, then recruit **Gunmar** (a smith and beast-tamer, found hunting a bear) and **Sorine Jurard** (an inventor of crossbows, found in the wilds). The fort wakes back into an order: a forge, armored war-trolls, and **crossbows** for the party.
     - **Volkihar track — the court:** Harkon's court of vampires (the adviser **Garan Marethi**, the alchemist, the smith) takes the party's measure. Harkon names them his hunters and sends them after the Moth Priest in his name.
  5. **The Moth Priest — *Prophet* (the branch, parallel).** A **Moth Priest** named **Dexion Evicus** has come north to read the Scrolls; both sides race for him. The trail runs through **Dragon Bridge** to **Forebears' Holdout**, where a vampire called **Malkus** has already taken him.
     - **Dawnguard track:** Rescue Dexion (kill Malkus) and bring him to the fort. He reads Serana's Scroll: a vision of **Auriel's Bow**, and word that **two more Scrolls** are needed to read the whole prophecy.
     - **Volkihar track:** Isran's hunters got there first — Malkus is dead and they are trying to free the priest. Kill them and **enthrall** Dexion, dragging him back to the castle to read the Scroll for Harkon. The vision is the same; the captive is yours.
  6. **The Soul Cairn — *Chasing Echoes* & *Beyond Death* (shared, welcome reversed).** Serana believes her mother **Valerica** fled into the **Soul Cairn** with a second Scroll. From a hidden courtyard beneath Castle Volkihar (reached by fighting through the undercroft and repairing a **moondial** — set the Half, Full, and Crescent crests), Serana's blood opens a portal to that bleak plane. **To cross alive you must be a vampire** — or let part of your soul be trapped (returnable later). In the Soul Cairn the party finds Valerica behind a barrier of three **Keepers**; slay them, follow her into the Boneyard, and face the undead dragon **Durnehviir**. They recover the **Blood Elder Scroll**. *(Welcome differs only in flavor: to the Dawnguard, Valerica is a grudging ally against her husband; to the Volkihar, she is a traitor to the clan — and Serana must choose her mother over her father either way.)*
  7. **The Ancestor Glade & the Forgotten Vale — *Unseen Visions* / *Touching the Sky* (shared).** The third Scroll — the **Elder Scroll (Dragon)** — lies in the Tower of Mzark beneath Alftand (the Main Quest, Beat 7), unless the party already carries it. With all three Scrolls, the party seeks the **Ancestor Glade** near Falkreath, harvests bark from a Canticle Tree, and draws the **Ancestor Moths** to sanctify a reader. Reading the three Scrolls together reveals the Bow's resting place: **Darkfall Cave**, and beyond it the hidden **Forgotten Vale**. There the last living Snow Elf, **Knight-Paladin Gelebor**, will give up **Auriel's Bow** only if the party cleanses the Vale's wayshrines and ends his corrupted brother, **Arch-Curate Vyrthur** — the vampire who *authored* the Tyranny of the Sun out of spite after an Initiate's bite made him a vampire and, as he saw it, Auri-El turned away. Kill Vyrthur; claim the **Bow** and **Sunhallowed arrows**.
  8. **Kindred Judgment — the Climax (the branch).** All three Scrolls, the Bow, and a Daughter of Coldharbour are now in play. The prophecy can be made or unmade.
     - **Dawnguard track:** Isran leads an assault on **Castle Volkihar**. The party storms the Cathedral and faces Harkon in **Vampire Lord** form. *Deny* him the sun.
     - **Volkihar track:** The party returns to the Cathedral to enact the prophecy at Harkon's altar — and discovers the rite was only ever meant to crown *him*. He demands the Bow; refuse, and he attacks. Either way, **Harkon dies** (the killing blow comes through his altar-ward, pierced by **Auriel's Bow**). See the **Climax** below for resolutions.

  **Climax.**

  The prophecy can be made or unmade, and Harkon must die either way. The Bow, the three Scrolls, and a Daughter of Coldharbour are all in play; Harkon shields himself at his blood-altar in the Cathedral of Castle Volkihar, in **Vampire Lord** form, and his ward blunts every mundane blow (attacks against him are _Impaired_) until it is broken (by **Auriel's Bow**, or by Isran's holy light). Three ways it can land:

  - **The Dawnguard ending — deny the sun.** Isran's order storms the castle; the party breaks the altar-ward, slays Harkon in his winged form, and the Tyranny of the Sun dies with him. Serana, freed of her father, may renounce her curse (sought through Falion in Morthal) or keep it — her choice, and the campaign's quiet last beat. The Dawnguard hold Castle Volkihar as a sun-lit garrison.
  - **The Volkihar ending — the crown was never yours.** The party gathered everything to enact the prophecy, only to find Harkon meant the eternal night for himself alone. They turn on him at his own altar. With his death the prophecy is theirs to enact — or to abandon. A party that *does* dim the sun rules a Skyrim of the undying, hunted forever by what's left of the Dawnguard and every Vigilant alive; a party that walks away keeps the power and spares the world. Garan Marethi (or Serana) holds the castle for the clan.
  - **Serana's ending — neither parent.** If Serana's Trust reached 5, give the table a third door: with the Bow in hand and both her parents' schemes in ruins, **Serana** herself ends it — refusing to be the key to anyone's prophecy, destroying the altar, and walking out into the snow beside the party as her own person at last. Harkon dies; the Tyranny of the Sun is unmade not by hunters or monsters but by the daughter both sides tried to use. This is the ending to aim a long campaign toward.

  Whatever the resolution, the sun comes up over the Sea of Ghosts — or it doesn't — and a four-thousand-year-old quarrel is finally, bloodily, over.

  **Also in the frame:** The Branch (read this before play) (`didact rules lookup dawnguard …`).

  **The frame's records.** `didact gen run elder-scrolls-skyrim.frame --prefill '{"frame": "Dawnguard"}' --auto` drafts the region, 7 places, 12 people, 3 threats, its factions and its clocks, for the world's system; `gen commit` writes them.

  **Bestiary** (Elder Scrolls 2e / Grimscrolls): Vampires → `vampire` / `vampire-clan`; Death Hounds → `death-hound` / `vampire-clan`; Gargoyles → `gargoyle` / `gargoyle`; Draugr → `draugr` / `draugr`; Bonemen → `boneman` / `the-dead-of-the-soul-cairn`; Mistmen → `boneman` / `the-dead-of-the-soul-cairn`; Wrathmen → `boneman` / `the-dead-of-the-soul-cairn`; Falmer → `falmer` / `falmer`; Chaurus → `chaurus` / `chaurus`; Frost Troll → `frost-troll` / `troll`.

  **Rewards in each system's catalog:** Auriel's Bow (elder-scrolls-2e.auriels-bow · grimscrolls.auriels-bow); Auriel's Shield (elder-scrolls-2e.auriels-shield · grimscrolls.auriels-shield); The Aetherial Crown (elder-scrolls-2e.aetherial-crown · grimscrolls.aetherial-crown); Aetherial Shield (elder-scrolls-2e.aetherial-shield); Aetherial Staff (elder-scrolls-2e.aetherial-staff); Aetherium Forge (grimscrolls.the-aetherium-forge); Zephyr (elder-scrolls-2e.zephyr · grimscrolls.zephyr); Harkon's Sword (elder-scrolls-2e.harkons-sword · grimscrolls.harkons-sword); Dawnguard armor (grimscrolls.dawnguard-armor); Dawnguard Rune Axe (elder-scrolls-2e.dawnguard-rune-axe).
