    sounds: a grunt felt in the chest
    smells: ripe cheese
    traits: [warns before it kills, one clean blow is enough]
    moves: [Overhead Club, Ground-Shaking Stomp]
    wants: its herd unharmed and its camp unvisited — it lets go whatever leaves
    note: 'A 6d elite, with mammoths beside it. It shakes the club, stomps, then swings: fair warning
      that the club lands at dire stakes, and the dropped travel upward. It will not enter water. A cow
      painted with spirals buys a farm its peace.'
body: |-
  ## GM notes

  A pale, hulking giant of the Forgotten Vale's ice fields, frost rimed across its hide. Solitary and territorial; it ignores those who keep their distance.

  Elder Scrolls 2e: 14 HP, 2 Armor, 18 STR, 9 DEX, 8 WIL, ice-crusted club (d10, bulky), detachment.

  Grimscrolls: its card is `grimscrolls.giant` (Giant), in this record's grimscrolls block.
