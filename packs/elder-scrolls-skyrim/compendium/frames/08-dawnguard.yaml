id: dawnguard-soul-cairn-keeper
type: monster
name: Soul Cairn Keeper
knowledge: secret
tags: [dawnguard, threat]
mechanics:
  elder-scrolls-2e:
    category: 'Campaign: Dawnguard'
    hp: 12
    armor: 2
    STR: 14
    DEX: 12
    WIL: 14
    attacks:
    - name: spectral greatsword
      damage: d10
      qualities: [bulky]
    - name: soul-fire bolt
      damage: d8
      qualities: [ranged]
    abilities:
    - Immune to poison; mundane attacks against it are Impaired; fire and sunlight against it are 
      Enhanced. While even one Keeper stands, the barrier around Valerica holds — drop all three to 
      free her.
    - 'When a Keeper falls it bursts in a gout of cold soul-fire: d6, blast, against everything adjacent.'
    impaired_by: [mundane]
    enhanced_by: [fire]
  grimscrolls:
    category: The Restless Dead & the Blighted
    tier: mook
    role: swarmer
    sights: black bones under a lightning sky
    sounds: a wind with voices in it
    smells: cold ash
    traits: [rises where a Master or conjurer wills, nothing left to lose]
    moves: [Ring of Black Bone, Frost From the Mist, Two-Handed Ruin]
    wants: your soul, kept — the Ideal Masters call it peace, and mean it
    note: '**Bonemen** are a 4d pool; **mistmen** float behind throwing frost; **wrathmen** are toughs
      in Nord plate. A **Keeper** is a 6d elite in dragonbone, draining penned souls to hold a barrier.
      Summoned ones vanish with their conjurer.'
body: |-
  ## GM notes

  A towering, faceless warden of the Boneyard, one of three who hold Valerica's barrier. Tall as two men, wrapped in tattered death-light.

  Elder Scrolls 2e: 12 HP, 2 Armor, 14 STR, 12 DEX, 14 WIL, spectral greatsword (d10, bulky), soul-fire bolt (d8, ranged).

  Grimscrolls: its card is `grimscrolls.the-dead-of-the-soul-cairn` (The Dead of the Soul Cairn), in this record's grimscrolls block.
source: campaigns/08-dawnguard#soul-cairn-keeper
