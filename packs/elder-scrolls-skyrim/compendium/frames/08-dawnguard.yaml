id: dawnguard-lord-harkon
type: monster
name: Lord Harkon
aliases: [Lord Harkon (Vampire Lord)]
knowledge: secret
tags: [dawnguard, cast, threat]
mechanics:
  elder-scrolls-2e:
    category: 'Campaign: Dawnguard'
    hp: 18
    armor: 1
    STR: 16
    DEX: 14
    WIL: 18
    attacks:
    - {name: raking claws, damage: '{d8, d8}kh1'}
    - name: Vampiric Drain
      damage: d8
      qualities: [blast, ranged]
    abilities:
    - Immune to poison; fire against him is Enhanced; sunlight leaves him Deprived. His drain heals 
      him for the damage dealt. Each round he may summon a Gargoyle, raise the dead, or Vampiric 
      Grip a foe (a STR save or be dragged in and lose its next action). While he hovers, melee from
      grounded foes is Impaired unless they reach him.
    - "The altar-ward: in the Cathedral, Harkon shields himself with a font of blood-magic — mundane attacks
      against him are Impaired until the ward is broken. Auriel's Bow (or the holy light of Isran's aura)
      shatters it; then he is vulnerable."
    impaired_by: [magic, mundane]
    enhanced_by: [fire]
    critical: his paralyzing bite drains d8 WIL and the target loses its next action.
  grimscrolls:
    category: Bosses of Tamriel
    tier: boss
    role: skirmisher
    sights: wings unfolding across a cathedral window
    sounds: your own pulse, loud and slowing
    smells: old blood on cold stone
    pools:
    - name: The Vampire Lord
      dice: 8
      traits: aloft to cast and landing only to claw; pressed, it is bats, then mist
      moves: [Drain Life Across the Hall, Grip and Hurl]
    - name: The Court
      dice: 6
      traits: thralls, fledglings, death hounds, and your own dead raised to join them
      moves: [Bar the Doors, Raise the Fallen]
    - name: The Gargoyles
      dice: 4
      traits: statues until it calls, and called again when broken
      moves: [Burst from the Plinth, Pin for the Master]
    fail: It leaves as mist with one of you taken for a thrall — and it knows the rest by name.
    wants: a court that fears it, a herd that feeds it, and no sun — it offers its blood to the 
      useful, once
    note: "A linked challenge (6d + 4d + 8d): the Lord is locked while its court stands. Sunlight or fire
      drops 1d before its pool rolls, and a narrow door is a setup against wings. **Lord Harkon** of Castle
      Volkihar (4E 201) retreats to a shielded blood altar: the first time his pool would drop, it doesn't,
      unless Auriel's Bow breaks the shield. He wants that bow, his daughter's blood, and the sun put
      out."
fields: {role: master of Castle Volkihar and the Volkihar clan}
body: |-
  ## GM notes

  **Lord Harkon** — master of Castle Volkihar and the Volkihar clan. An elegant, ancient Vampire Lord who means to enact the Tyranny of the Sun and rule the eternal night. Charming until he isn't.

  The master of Castle Volkihar in his towering, winged Vampire Lord form — an ancient blood-mage who would unmake the sun. The campaign's final foe on both paths.

  Elder Scrolls 2e: 18 HP, 1 Armor, 16 STR, 14 DEX, 18 WIL, raking claws (d8+d8), Vampiric Drain (d8, blast, ranged).

  Grimscrolls: its card is `grimscrolls.vampire-lord` (Vampire Lord), in this record's grimscrolls block.
