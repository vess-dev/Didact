body: |-
  ## GM notes

  A castle of black stone on a fog-bound island in the Sea of Ghosts, reached only by a ferryman. Elegant and rotten — a vampire court above, a flooded undercroft and a moondial **courtyard** below. The Volkihar home base, and the site of the climax. A mortal here walks among polite predators.
source: campaigns/08-dawnguard#the-place
