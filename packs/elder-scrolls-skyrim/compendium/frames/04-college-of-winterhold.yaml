id: college-of-winterhold-the-caller
type: monster
name: The Caller
aliases: [The Caller (Fellglow Keep)]
knowledge: secret
tags: [college-of-winterhold, threat]
mechanics:
  elder-scrolls-2e:
    category: 'Campaign: The College of Winterhold'
    hp: 6
    armor: 1
    STR: 8
    DEX: 11
    WIL: 14
    attacks:
    - {name: bound dagger, damage: d6}
    - name: elemental bolt
      damage: d8
      qualities: [ranged]
    abilities:
    - Run as a Necromancer from the Bestiary (6 HP, 1 Armor, 8 STR, 11 DEX, 14 WIL, bound dagger 
      (d6), elemental bolt (d8, ranged)), with a detachment of Skeletons and a few vampire thralls. 
      She would rather bargain for her life than die for Urag's books.
  grimscrolls:
    category: Outlaws & Cults
    tier: tough
    role: blaster
    sights: candles in a ruined chapel
    sounds: the click of walking bone
    smells: embalming salts and earth
    traits: [the dead stand in front, every corpse is a spare]
    moves: [Raise What You Just Killed, Frost from Behind the Bones]
    wants: bodies, black soul gems, and privacy — not witnesses, and never a fair fight
    note: The risen are a 4d pool that gets a die back when anything dies nearby; the coven behind 
      is 6d, and its dead fall with it. A **Worm Anchorite** leads a cell; an **Arch Necromancer** 
      is a 6d elite. Cornered, most trade a secret for their lives.
body: |-
  ## GM notes

  *Fellglow Keep*

  Run as a Necromancer from the Bestiary (6 HP, 1 Armor, 8 STR, 11 DEX, 14 WIL, bound dagger (d6), elemental bolt (d8, ranged)), with a detachment of Skeletons and a few vampire thralls. She would rather bargain for her life than die for Urag's books.

  Elder Scrolls 2e: 6 HP, 1 Armor, 8 STR, 11 DEX, 14 WIL, bound dagger (d6), elemental bolt (d8, ranged).

  The frame runs it as the Bestiary's Necromancer (`elder-scrolls-2e.necromancer`); the numbers are the same.

  Grimscrolls: its card is `grimscrolls.necromancer-coven` (Necromancer Coven), in this record's grimscrolls block.
source: campaigns/04-college-of-winterhold#the-caller-fellglow-keep
