id: college-of-winterhold
type: quest
name: The College of Winterhold
tags: [college-of-winterhold, frame, main-campaign]
goal: |-
  A campaign of scholars and secrets, for a party who would rather solve a magical catastrophe than swing a sword at it — though there is plenty of swinging to be done in the deep places. The party joins the last free school of magic in Skyrim, helps unearth a god's left-behind Eye beneath a frozen ruin, and watches a quiet Thalmor "advisor" turn that Eye into a weapon that murders the Arch-Mage and threatens to crack the province open. To stop him they must descend into the worst tomb in Hjaalmarch, take the Staff of Magnus from a dragon priest four thousand years dead, and bring it back to the Hall of the Elements for a final duel. The survivor of that duel becomes Arch-Mage.

  This frame assumes the party can cast — at least one PC should carry a Spell Tome, and the rest should be the sort who fall in with mages. It runs equally well as the campaign's spine or as a self-contained arc dropped into a wider Skyrim game.
date: Sundas, 17 Last Seed 4E 201
body: |-
  *"The Eye of Magnus does not answer to the College. It answers to whoever is willing to die for it — and to whoever is willing to kill."*

  ## GM notes

  **Date.** Sundas, 17 Last Seed 4E 201: 4E 201, the book's moment; no day of its own: whenever the party reaches the bridge at Winterhold. It is the calendar's start: a new campaign opens on it.

  **The frame's text:** `didact rules lookup the college of winterhold pitch` (and `stakes`, `tone touchstones`, `arrival`, `plot beats`, `the place`, `cast`, `clocks`, `threats`, `rewards`, `climax`).

  **Stakes.** The College of Winterhold is the only place in Skyrim where magic is taught openly. It clings to a spire of rock above the Sea of Ghosts, reached by a single long bridge, on the edge of a town the sea swallowed eighty years ago. The townsfolk blame the College for that disaster — the Great Collapse — and the mages have learned to keep their gates shut and their business their own. Into that uneasy quiet the College has lately taken on a Thalmor "advisor," Ancano, foisted on Arch-Mage Savos Aren as the price of being left alone. Nobody trusts him. Nobody can be rid of him. Then a dig at the nearby Nordic ruin of Saarthal breaks into a sealed vault and finds a thing that should not exist: a vast humming orb of pure magicka, older than the Nords, older than the elves — the Eye of Magnus, a fragment left behind when the god Magnus fled the world at the dawn of creation. No one knows what it does. No one knows how to turn it off. And one of the people standing closest to it is a Thalmor agent who has spent his whole posting waiting for exactly this. The stakes climb in three steps. First the Eye is a mystery the College wants to study. Then it is a danger the College cannot contain. Then Ancano binds himself to it, kills the Arch-Mage, and begins unmaking the town of Winterhold one anomaly at a time — and only the lost Staff of Magnus can master the Eye before it spreads past the town to the Hold and beyond.

  **Arrival.** Any one of these gets a party to the bridge at Winterhold:

  - **The obvious one.** A PC wants to learn magic, or learn *more* magic, and the College is the only school that will have them. They come to apply. A PC with the College Apprentice background is already enrolled, and starts at **College of Winterhold +1**.
  - **A tome to translate.** The party recovered a Spell Tome from a barrow that none of them can safely read — it smells of grave-cold, or only shows its letters in moonlight. **Urag gro-Shub**, the College librarian, is the one scholar in Skyrim who might identify it.
  - **A missing apprentice.** A merchant or a worried parent in Dawnstar or Windhelm hires the party to find a young mage who left to study at Winterhold and has not written home. (He is fine — for now. He becomes a useful tie inside the College.)
  - **Sent by another faction.** A Jarl's court wizard, or the Synod (the Imperial mages' order), wants eyes inside the independent College and pays the party to enroll and report.
  - **The cold road.** The party is simply crossing the worst Hold in Skyrim in winter, and the College is the only fire and roof for a day in any direction.

  **Plot beats.**

  1. **First Lessons.** At the bridge, the gate-keeper **Faralda** tests each would-be student: cast a spell, or talk your way past with a WIL save. Inside, **Mirabelle Ervine** gives a tour and starter robes; **Tolfdir** lectures in the Hall of the Elements and has the party raise a **Ward** against his (deliberately weak) firebolt. The party meets fellow apprentices — a shy Nord, a proud Dunmer noblewoman, an over-eager Khajiit — any of whom make good recurring ties. *Reward:* admission to the College (**College of Winterhold** becomes Trusted, +1, if it was not already); College robes (clothing, no Armor); a **Spell Tome: Lesser Ward** for the party's caster.
  2. **Under Saarthal.** Tolfdir takes the party to the **Saarthal** dig. Recovering artifacts, they find the **Saarthal Amulet** — and the moment it is touched, a hall seals shut around a PC. Escape means wearing the amulet and loosing a spell at the weakened wall. Deeper in, the Psijic monk **Nerien** freezes time to warn them: *"You should not have come here. What you have found will be sought by powers you cannot imagine."* Past him, behind a barrier of light, hums the **Eye of Magnus**, guarded by the draugr champion **Jyrik Gauldurson** (see Threats). The party reports back; the Arch-Mage orders the Eye studied — and that is when **Ancano** starts paying very close attention.
  3. **The Library and the Augur.** Two threads, run in either order, that turn "interesting artifact" into "looming catastrophe":
     - **Hitting the Books.** **Urag** reports that his books on Saarthal and the god Magnus were stolen by a washed-out apprentice, Orthorn, who fled to a necromancers' coven at **Fellglow Keep**. The party retrieves them from **the Caller** and her thralls — by force, trade, or persuasion.
     - **Good Intentions.** **Ancano** summons the party to "meet a visitor" — the Psijic **Quaranir**, who freezes time and tells them the Eye must be kept from *anyone's* use, and points them to the **Augur of Dunlain** in the Midden. The Augur delivers the campaign's thesis: the Eye cannot be contained. They need the **Staff of Magnus**.
     - *Reward:* each PC may take one **Skill Book** from the Arcanaeum's spares, with Urag's grudging thanks; a minor Relic from the Augur's chamber; the knowledge of what they must find.
  4. **The Synod and the Oculory.** **Mirabelle** reports that the **Synod** — the Imperial mages' order, the College's rivals — have been asking after the Staff and mentioned **Mzulft**. The party travels south to the Dwemer ruin, fights through automatons and a **Falmer** warren, takes the Oculory's focusing crystal from a **Falmer Warmonger** in the deeps, and reaches the dying Synod expedition. With the surly survivor **Paratus**, they work the **Oculory**: set the crystal, play fire and frost across the device, and rotate its bands until it throws a map of Skyrim across the dome, pinpointing the Staff in **Labyrinthian**. *Branch:* help Paratus freely and the Synod owes the party a favor (a later ally, or a discount on tomes); rob or abandon him and the Synod becomes a hostile rival. *The turn:* they return to find disaster has arrived ahead of them — **Ancano** has bound himself to the Eye and sealed it, and himself, inside a barrier of force.
  5. **The Eye Awakens.** The point of no return. **Savos Aren** confronts Ancano at the Eye and is killed by its unleashed power before the party's eyes. This is a fixed moment, not a winnable fight: a PC who throws themselves in is flung back for d6, and the Arch-Mage still dies. The Eye's energy lashes out, and **magic anomalies** spill from the Hall into the **town of Winterhold** below. With **Faralda** and the scholar **Arniel Gane**, the party must put them down before they kill the townsfolk — a running fight through the snow that buys the College time. *Branch — the price:* the eruption mortally wounds **Mirabelle Ervine**. By default she lives just long enough to hand the party the **Torc of Labyrinthian** (the key to the ruin) and **Savos Aren's Amulet**, then dies of her injuries while they are away. A merciful Warden may let quick Restoration save her at a cost (a Fatigue, a Scar, a spent Relic); a grim one lets her die at once. Either way, the party leaves for Labyrinthian with the Torc.
  6. **Labyrinthian.** The party crosses Hjaalmarch to **Labyrinthian** and descends into the dragon cult's ancient seat. **Visions of a young Savos Aren** and his fellow apprentices replay the day they came here and only he walked out — context, atmosphere, and a quiet warning. The ruin is thick with **Skeletons** and **draugr**, and a magicka-draining curse hangs over the deep halls: every Spell Tome channeled here calls for the duress WIL save, in or out of combat. Partway down, a **Skeletal Dragon** bursts from a buried courtyard.
  7. **Morokei.** At the ruin's heart, behind a shield of light fed by two enthralled wizards, waits the dragon priest **Morokei** — "Glorious," four thousand years dead and still draining the magicka of anyone who enters his sanctum (see Threats). *Branch — the Thalmor's last knife:* as the party takes the Staff, the Thalmor agent **Estormo** ambushes them — Ancano sent him to make sure the Staff never reaches the College. Beat him or talk him down; either way, they learn the Thalmor knew everything. *Reward:* the **Staff of Magnus** and the **Morokei** mask. The party returns to find **Tolfdir** holding the line at the College — and, by default, Mirabelle dead.
  8. **The Eye of Magnus.** The party climbs back into the **Hall of the Elements**, where **Ancano** stands fused to the Eye behind its force-field, the magicka pouring off him. See **Climax**.

  **Climax.**

  The Hall of the Elements, the Eye blazing, Ancano fused to it behind the force-field.

  - **Break the field.** A PC must turn the **Staff of Magnus** against the field — a spent charge, or a full action holding the beam (the Warden's call) — to collapse the barrier and leave Ancano exposed and reeling. Periodically he tries to re-seal it; a held burst of the Staff keeps it down.
  - **The duel.** Then it is a fight against the empowered Ancano (see Threats). When he drops, his stolen power detonates: d6 _blast_ to everyone nearby.
  - **The aftermath.** **Quaranir** and the Psijics appear and take the Eye away to safekeeping "where no mortal hand can misuse it" — and with **Tolfdir**, the College names the party (or its lead caster) **Arch-Mage of the College of Winterhold**.
  - **What becomes of the College.** Depending on how the party treated the Synod (Beat 4), the survivors, and the town of Winterhold during the anomalies (Beat 5), the College ends the campaign either rebuilt and respected — Renown shifts one step better, and the town's Reaction to the mages shifts a step warmer — or isolated and feared, with Jarl Korir and the townsfolk as Wary as ever. The title is the same; the welcome is not.

  ### Running Notes

  - **The Thalmor watch who reads what.** Ancano is the villain, but he is also a reminder that magic is political. The Thalmor's interest in the Eye, the College, and the party's tomes can seed a sequel, or tie into the Civil War and Main Quest arcs.
  - **No player Shouts.** The draugr lords use Shout-flavored attacks as creature abilities; the party gains no Thu'um from this campaign. Their power is the Staff, their tomes, and the Arch-Mage's seat.
  - **Magic is Cairn magic.** Every spell here is a **Spell Tome** (both hands, read aloud, +1 Fatigue, WIL save under duress) or a **Relic** (charges and a Recharge). The Labyrinthian curse and the Eye's force-field are scene rules laid on top of the game, never changes to it.
  - **Let the scholars be scholars.** The best moments here are not the boss fights but the parley with Urag, the Augur's riddle, Paratus at the broken Oculory, and the awful quiet after the Arch-Mage dies. Reward the players who think their way through the College as richly as the ones who fight through Labyrinthian.

  **The frame's records.** `didact gen run elder-scrolls-skyrim.frame --prefill '{"frame": "The College of Winterhold"}' --auto` drafts the region, 6 places, 8 people, 7 threats, its factions and its clocks, for the world's system; `gen commit` writes them.

  **Bestiary** (Elder Scrolls 2e / Grimscrolls): Draugr → `draugr` / `draugr`; Draugr Overlord → `draugr-overlord` / `draugr`; Skeleton → `skeleton` / `skeleton`; Necromancer → `necromancer` / `necromancer-coven`; Conjurer → `conjurer` / `hedge-wizards`; Vampire Thrall → `vampire-thrall` / `vampire-clan`; Falmer → `falmer` / `falmer`; Chaurus → `chaurus` / `chaurus`; Dwarven Spider → `dwarven-spider` / `dwarven-spider`; Dwarven Sphere → `dwarven-sphere` / `dwarven-sphere`; Ice Wraith → `ice-wraith` / `ice-wraith`; Frost Troll → `frost-troll` / `troll`.

  **Rewards in each system's catalog:** The Staff of Magnus (elder-scrolls-2e.staff-of-magnus · grimscrolls.staff-of-magnus); The Morokei mask (elder-scrolls-2e.morokei · grimscrolls.dragon-priest-mask); The Archmage's Robes (elder-scrolls-2e.archmages-robes · grimscrolls.archmages-robes); The Saarthal Amulet (elder-scrolls-2e.saarthal-amulet); Gauldur Amulet, Magicka Fragment (elder-scrolls-2e.gauldur-amulet-magicka-fragment · grimscrolls.gauldur-amulet); Savos Aren's Amulet (elder-scrolls-2e.savos-arens-amulet).
