fields: {role: 'Thalmor agent, the antagonist'}
body: |-
  ## GM notes

  *Thalmor agent, the antagonist*

  A coldly polite Altmer "advisor" who watches everything and answers to the Aldmeri Dominion, not the Arch-Mage. Until Beat 5 he is protected by the rules of hospitality, not by force: striking first paints the party as murderers.

  Elder Scrolls 2e: 6 HP, 1 Armor, 10 STR, 13 DEX, 14 WIL, elven sword (d8), Destruction bolt (d8, ranged); spells against him are Impaired.

  The frame runs it as the Bestiary's Thalmor Justiciar (`elder-scrolls-2e.thalmor-justiciar`); the numbers are the same.

  Grimscrolls: its card is `grimscrolls.thalmor-justiciars` (Thalmor Justiciars), in this record's grimscrolls block.
source: campaigns/04-college-of-winterhold#ancano--thalmor-agent-the-antagonist
