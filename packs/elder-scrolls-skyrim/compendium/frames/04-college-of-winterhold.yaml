id: college-of-winterhold-ancano-empowered-by-the-eye
type: monster
name: Ancano, empowered by the Eye
aliases: ['Ancano, empowered by the Eye (the final fight)']
knowledge: secret
tags: [college-of-winterhold, threat]
mechanics:
  elder-scrolls-2e:
    category: 'Campaign: The College of Winterhold'
    hp: 14
    armor: 2
    STR: 10
    DEX: 13
    WIL: 18
    attacks:
    - name: magicka lash
      damage: d10
      qualities: [blast]
    abilities:
    - Once per round, he draws on the Eye to heal 1d6 HP or to fling a PC back for d6. Spells 
      against him are Impaired. The Staff's beam strikes him at its full die, but while he is joined
      to the Eye it cannot silence him — the lash is the Eye's power, not a spell.
    - 'On taking Critical Damage, the stolen power gutters out of him in a shockwave as he dies: d6 blast
      to everyone nearby, friend and foe.'
    impaired_by: [magic]
body: |-
  ## GM notes

  *the final fight*

  The field: while the Eye's force-field stands, Ancano cannot be harmed at all — every attack and spell against him is wasted. Only the Staff of Magnus, turned against the field, drops it.

  Elder Scrolls 2e: 14 HP, 2 Armor, 10 STR, 13 DEX, 18 WIL, magicka lash (d10, blast).

  Grimscrolls: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
source: campaigns/04-college-of-winterhold#ancano-empowered-by-the-eye-the-final-fight
