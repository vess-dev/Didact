body: |-
  ## GM notes

  (*Winterhold*) A free-standing spire above the Sea of Ghosts, reached by one long ruined bridge with a single gate at the far end, kept by **Faralda**. **The Hall of the Elements** is the central domed chamber where lectures are held and, later, where the Eye is brought and the final duel fought. Off it lie the **Arcanaeum** (Urag's library), the Halls of Countenance and Attainment where the mages live, and the **Arch-Mage's Quarters** at the top — locked until the campaign's end, then the party's.
source: campaigns/04-college-of-winterhold#the-place
