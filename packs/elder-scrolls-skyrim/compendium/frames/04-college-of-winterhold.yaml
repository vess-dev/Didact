id: college-of-winterhold-the-skeletal-dragon
type: monster
name: The Skeletal Dragon
aliases: [The Skeletal Dragon (Labyrinthian)]
knowledge: secret
tags: [college-of-winterhold, threat]
mechanics:
  elder-scrolls-2e:
    category: 'Campaign: The College of Winterhold'
    hp: 12
    armor: 2
    STR: 16
    DEX: 13
    WIL: 16
    attacks:
    - {name: bite, damage: d10}
    - name: frost breath
      damage: d8
      qualities: [blast]
    abilities:
    - "A detachment: individuals' attacks on it are Impaired (unless blast); its attacks on individuals
      are Enhanced and blast."
    enhanced_by: [magic]
  grimscrolls:
    category: Bosses of Tamriel
    tier: boss
    role: blaster
    sights: a shadow crossing the whole valley
    sounds: a roar that arrives before the sound of wings
    smells: scorched pine and hot stone
    pools:
    - name: The Dragon
      dice: 8
      traits: armored in scale and pride, and reachable only once it is grounded
      moves: [Bite and Toss, Tail Sweep]
    - name: Its Wings
      dice: 6
      traits: bring it down with arrows, a ballista, a rival's challenge, or a Shout that names it 
        mortal
      moves: [Strafe the Line, Wheel Away]
    - name: Its Thu'um
      dice: 4
      traits: fire or frost in a single word; break its breath and you break its concentration
      moves: [Breath of Fire, Shout the Ranks Apart]
    fail: It takes to the sky with someone in its jaws — or it finishes the town it came for.
    wants: dominion, tribute, and to be answered — a dragon challenged or flattered in its own 
      tongue may prefer talk to killing
    note: "A linked challenge (6d + 4d + 8d): the Dragon itself is locked until it is grounded or goaded
      down. **Frost** dragons trade fire for ice. **Blood**, **Elder**, and **Ancient** dragons add a
      die to each part in turn; a **Revered** or **Legendary** one drains what it bites. A dragon's soul
      does not rest: unless a Dragonborn takes it, the bones can be raised again."
body: |-
  ## GM notes

  *Labyrinthian*

  All bone and no soul: it cannot fly, cannot be frightened, and magic against it is Enhanced. Scatter its bones when it falls, or it knits itself together again by the next day.

  Elder Scrolls 2e: 12 HP, 2 Armor, 16 STR, 13 DEX, 16 WIL, bite (d10), frost breath (d8, blast), detachment.

  The frame runs it as the Bestiary's Dragon (`elder-scrolls-2e.dragon`); the numbers are the same.

  Grimscrolls: its card is `grimscrolls.dragon` (Dragon), in this record's grimscrolls block.
source: campaigns/04-college-of-winterhold#the-skeletal-dragon-labyrinthian
