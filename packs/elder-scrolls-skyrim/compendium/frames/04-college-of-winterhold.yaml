type: monster
name: Jyrik Gauldurson
aliases: [Jyrik Gauldurson (Saarthal)]
knowledge: secret
tags: [college-of-winterhold, threat]
mechanics:
  elder-scrolls-2e:
    category: 'Campaign: The College of Winterhold'
    hp: 12
    armor: 3
    STR: 16
    DEX: 8
    WIL: 12
    attacks:
    - {name: ancient greatsword, damage: d10}
    critical: a death-curse strikes the target for 1d4 WIL.
  grimscrolls:
    category: The Restless Dead & the Blighted
    tier: mook
    role: protector
    sights: blue eyes opening in a wall niche
    sounds: ancient steel scraping stone
    smells: embalming spice and dust
    traits: [lies still until you pass, 'fights for the tomb, not its life']
    moves: [Rise Behind You, Shield the Sarcophagus]
    wants: the tomb unrobbed and its lord undisturbed — it has no interest in the world outside the 
      door
    note: "A crypt's worth is a 4d pool; **Restless** and **Wights** are toughs. A **Scourge** shouts
      — one word staggers a whole rank (+1t for a beat) — and a **Deathlord** is a 6d elite with ebony
      arms and a voice that disarms. Fire is the old answer: it drops 1d before the pool rolls."
body: |-
  ## GM notes

  *Saarthal*

  One of the three treacherous sons of the ancient Arch-Mage Gauldur, entombed at Saarthal. He is shielded by the Eye and takes no damage until Tolfdir severs the link — give the party a round or two of fighting through summoned Skeletons while Tolfdir works; then the shield drops and the real fight begins.

  Elder Scrolls 2e: 12 HP, 3 Armor, 16 STR, 8 DEX, 12 WIL, ancient greatsword (d10).

  The frame runs it as the Bestiary's Wight (`elder-scrolls-2e.wight`); the numbers are the same.

  Grimscrolls: its card is `grimscrolls.draugr` (Draugr), in this record's grimscrolls block.
source: campaigns/04-college-of-winterhold#jyrik-gauldurson-saarthal
