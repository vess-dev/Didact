body: |-
  ## GM notes

  *head of the College*

  A cautious, secretive Dunmer who has led the College for decades and carries a guilt he never speaks of: as a young apprentice he went into Labyrinthian with his friends and walked out the only survivor. He tolerates Ancano because defying the Thalmor openly could doom the College outright.

  Elder Scrolls 2e: 12 HP, 2 Armor, 10 STR, 12 DEX, 16 WIL, staff (d6), elemental bolt (d8, blast).

  Grimscrolls: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
source: campaigns/04-college-of-winterhold#arch-mage-savos-aren--head-of-the-college
