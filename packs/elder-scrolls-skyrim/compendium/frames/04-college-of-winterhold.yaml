id: college-of-winterhold-the-eyes-hunger
type: track
name: The Eye's Hunger
knowledge: secret
tags: [college-of-winterhold, clock]
kind: clock
size: 6
value: {value: 0, size: 6}
note: (d6) How far the Eye's power has spread since Ancano seized it. Ticks at the start of each 
  session after Beat 5, and whenever the party rests somewhere safe on the road to Labyrinthian. At 
  2, anomalies stalk the town of Winterhold by night; at 4, the townsfolk flee and the Jarl blames 
  the College; at 6, the Eye's field swallows the whole spire, and the final fight must be fought in
  a Hall where every Spell Tome forces the duress WIL save.
source: campaigns/04-college-of-winterhold#clocks
