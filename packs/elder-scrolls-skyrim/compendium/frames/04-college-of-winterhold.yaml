  ## GM notes

  *Winterhold*

  Living fragments of the Eye's magicka, flickering blue through the ruined town. Run a pack of four or more as a detachment. Weapons strike them normally; spells against them are Impaired.

  Elder Scrolls 2e: 3 HP, 12 STR, 12 DEX, 10 WIL, crackling surge (d8, blast).

  Grimscrolls: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
