name: The Long War
knowledge: secret
tags: [the-civil-war, clock]
kind: clock
size: 6
value: {value: 0, size: 6}
note: "(d6) Ticks each session the war drags on without a Hold changing hands, and whenever a truce stalls.
  At 4, the Thalmor openly \"advise\": Justiciars ride with the Legion's patrols and hunt Talos-worshippers
  in every town, whichever side the party serves. At 6, the Dominion has what it wanted — both armies
  are bled so thin that bandits, Forsworn, and dragons roam the Holds unchecked until the war is ended."
source: campaigns/02-the-civil-war#clocks
