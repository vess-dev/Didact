      damage: d8
      qualities: [ranged]
  grimscrolls:
    tier: elite
    role: trickster
    fact: 'First Emissary of the Thalmor in Skyrim: hostess of the best parties in Haafingar and keeper
      of the cells beneath them. She broke Ulfric Stormcloak under questioning once, and kept the file.
      (4E 201)'
body: |-
  ## GM notes

  The smiling, ruthless head of the Thalmor in Skyrim, mistress of the embassy above Solitude, who keeps a dossier on everyone who matters — Ulfric included. Rarely fought; mostly a voice at a party and a hand behind the war. If the optional truce convenes, she insists on a seat at the table and savors the deadlock.

  Elder Scrolls 2e: 8 HP, 1 Armor, 10 STR, 12 DEX, 16 WIL, bound dagger (d6), Destruction bolt (d8, ranged).

  Grimscrolls: its Face is `grimscrolls.elenwen` (Elenwen), in this record's grimscrolls block.
source: campaigns/02-the-civil-war#elenwen-first-emissary
