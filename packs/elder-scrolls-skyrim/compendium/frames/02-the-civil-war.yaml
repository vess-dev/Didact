id: the-civil-war
type: quest
name: The Civil War
tags: [the-civil-war, frame, main-campaign]
goal: |-
  The White-Gold Concordat that ended the Great War bought the Empire peace at a price: the worship of Talos — the Nord hero-emperor turned god — was outlawed across the Empire, to satisfy the elves of the Aldmeri Dominion. To a devout Nord this is the theft of a god. Ulfric Stormcloak, Jarl of Windhelm, made it a war: he challenged High King Torygg to single combat and killed him, and now leads the Stormcloaks — the Sons and Daughters of Skyrim — to throw off the Empire, win the province its independence, and worship Talos in the open.

  Against him stand General Tullius and the Imperial Legion, sent from Cyrodiil to crush the rebellion and hold Skyrim together under one law and one crown. To the Legion, Ulfric is a king-killer and an opportunist whose rising weakens the only power that can stand against the elves when the Concordat's truce inevitably breaks.

  The party joins one side and fights it to the end. The war moves Hold by Hold — fort skirmishes and contested ground, the hinge Battle for Whiterun, then a grinding reconquest, and finally an assault on the enemy's own capital: Solitude for the Stormcloaks, Windhelm for the Legion. When the dust settles, Jarls have fallen and been replaced, a victor sits the throne, and the common folk sing the party's name (or curse it).
date: Sundas, 17 Last Seed 4E 201
body: |-
  *Skyrim is two countries wearing one map. In Windhelm a Jarl who killed his king calls himself a liberator; in Solitude a general from the south calls that murder. Between them lie seven more Holds, and every one of them is choosing — or being made to choose. You will ride for one banner, take a fort in the snow, hold the gates of Whiterun while the city burns around you, and at the end you will stand in the enemy's capital and watch a man kneel. Somewhere above Solitude, behind warded glass, a smiling elf reads the casualty lists and is well pleased.*

  ## GM notes

  **Date.** Sundas, 17 Last Seed 4E 201: Out of Helgen, the opening it shares with the Main Quest; or the day the party first enlists. It is the calendar's start: a new campaign opens on it.

  **The frame's text:** `didact rules lookup the civil war pitch` (and `stakes`, `tone touchstones`, `arrival`, `the branch`, `plot beats`, `the place`, `cast`, `clocks`, `threats`, `rewards`, `climax`).

  **Stakes.** Skyrim's future is the prize: an independent kingdom of Nords under Ulfric, or a province held inside a battered Empire under Tullius. Jarls will fall, cities will burn, and whichever banner wins, the losing half of Skyrim will remember who carried the other one. The hidden hand. Neither army is the true winner. The Thalmor — the High Elf supremacists who forced the Concordat — publicly back the Empire and privately want the war to last as long and bleed as freely as possible. A long civil war keeps Men killing Men, weakens whoever wins, and leaves the Dominion stronger for the next war it actually means to fight. The Warden should let this surface slowly: a captured dispatch, a Thalmor "advisor" too pleased by a stalemate, an embassy dossier (see the Main Quest's Diplomatic Immunity) that names Ulfric himself as a Thalmor asset whose rebellion serves their ends whether he knows it or not. Victory for either banner is real — but the elves win something too, and a sharp party will notice.

  **Arrival.** Any one of these puts the party on the road to a recruiter. Pick the one that fits the table, or let a background do it.

  - **Out of Helgen.** The classic opening (shared with the Main Quest): the party are bound prisoners at Helgen when a dragon levels the town. They flee with **Ralof** (a Stormcloak) or **Hadvar** (an Imperial soldier) — and the man they ran beside is the first to ask them to enlist. (This only sets who *asks first*; the party may still choose the other side.)
  - **A background tie.** A **Stormcloak Soldier** or **Imperial Legionnaire** background starts that faction at **+1** (Trusted) and the opposite at **−1** (Distrusted), and points straight at the muster.
  - **A Hold under threat.** The party's home or a settlement they've cleared sits in a contested Hold (see *Settlements*). A war-party is coming for the road it stands on; the only protection on offer comes with a banner attached.
  - **Coin and grievance.** Both armies pay, both are recruiting, and a sellsword party can be talked into a cause over enough mead — or hired by a Jarl to carry a war-message that drags them in.

  **Plot beats.**

  1. **Beat 1 — Joining (the muster).** Run the initiation for the chosen side, above. The point of the beat is the *oath* and the first taste of the other ranks: introduce the recruiter who will assign the party's missions (**Galmar** for the Stormcloaks, **Rikke** for the Legion) and let the party meet a common soldier or two so the later dead have faces.
  2. **Beat 2 — The Jagged Crown (both sides).** The first true mission, and it is the *same dungeon* for both armies — a race for a relic (its card is in **Relics**: The Jagged Crown). Long ago the High Kings of Skyrim wore the **Jagged Crown**, a circlet of dragon-bone and teeth; whoever recovers it wears the legitimacy of old Skyrim. It lies in the Nordic ruin of **Korvanjund**. - The party rides out with a war-band (**Ralof** is along for the Stormcloaks; **Hadvar** for the Legion) and finds the *enemy* faction already at the ruin. Fight through them and into the barrow.
  - Inside: a **Hall of Stories** door-puzzle (the claw-door's three rings: Fox, Moth, Dragon), draugr in the dark, and a **Draugr Overlord** crowned and waiting in the crypt.
  - Take the Crown. Carry it back to **Ulfric** (Stormcloaks) or **Tullius** (Legion). *This is the last moment a party may switch banners.* **Reward:** the army's gratitude (Ulfric's open thanks; from Tullius only a "Good work, soldier"); the Crown itself goes to the war-leader, not the party.
  3. **Beat 3 — Message to Whiterun (the spark).** Whiterun is the neutral heart of Skyrim, and its Jarl, **Balgruuf the Greater**, has kept his Hold out of the war as long as he can. Both sides need it; the war cannot be won around it. The party carries the demand that ends his neutrality. - **Stormcloaks:** Carry **Ulfric's war axe** to Balgruuf — by old custom, to leave it is peace, to take it back is war. Balgruuf refuses the rebellion and returns the axe; the party brings it back to Ulfric, and the muster for the assault begins.
  - **Imperials:** Carry **Tullius's** message to Balgruuf. The Jarl, pressed, sides with the Empire and offers his own axe to Ulfric as a last gesture of peace; Ulfric rejects it. Warn Balgruuf the storm is coming, then report to the Legion command (**Legate Cipius**) to prepare the city's defense.
  - Either way, the courier's errand lights the fuse. **Beat 4 follows immediately.**
  4. **Beat 4 — The Battle for Whiterun (the hinge).** **This is the war's turning point** and the campaign's centerpiece. Whiterun falls to whoever wins here, and with it the strategic heart of the province. Run it as a proper set-piece: a night assault on a walled city, fire on the thatch, soldiers in the streets, the fight climbing district by district to the great hall of **Dragonsreach**. - **Stormcloak assault.** Orders from **Ulfric**; a briefing with **Galmar** at the Stormcloak camp outside the walls. The party storms the gate, fights through the **Plains** and **Wind** Districts under Imperial arrows, lowers a drawbridge or breaches a barricade, and pushes into Dragonsreach. **Balgruuf** fights to the last of his honor, then yields (he surrenders rather than die). The Stormcloaks install **Vignar Gray-Mane** — an aged ex-Companion and staunch rebel — as the new Jarl. **Reward:** a fine weapon from the quartermaster and the rank of **Ice-Veins**.
  - **Imperial defense.** Report to **Cipius**, then **Rikke**. The party holds the besieged city — manning barricades, defending the drawbridge, cutting down the Stormcloak detachment as it pours through the gate until the attack breaks. **Balgruuf** gives a speech of thanks; **Whiterun stays with the Empire**, Balgruuf keeps his seat, and the Legion now owns the center of the map. **Reward:** the rank of **Quaestor** and a fine weapon from the quartermaster. > **Renown.** Whichever way it goes, the Battle for Whiterun is *public* and sung about. **Renown +1** (one step, the cap per session) — a band that held or took the Jewel of the North is suddenly **Known**, then **Renowned** as the war goes on. Whiterun folk on the losing side will remember the party's banner.
  5. **Beat 5 — Reconquest, Hold by Hold (the long campaign).** With Whiterun decided, the war becomes a grind across the remaining Holds. This is the **Liberation of Skyrim** (Stormcloak) or the **Reunification of Skyrim** (Imperial) — the same engine under two names: the war-leader assigns one contested Hold at a time, and the party takes it, usually by storming its **fort** (the *fort skirmish*: a stat-block courtyard battle, a commander to kill, a garrison to break). **Taking the Reach** is the bloodiest of these — Markarth is bitterly contested, riddled with Forsworn, and changes hands hard. Run three to five of these as the table's appetite allows; each is a self-contained fort or field mission paying gear, and the first two a rank-step. Use The Holds as the map and let the party's victories *flip the Jarls*: | Hold (capital) | Early Jarl & lean | Falls to → installs |
  |---|---|---|
  | **Whiterun** | Balgruuf (neutral→Imperial) | Stormcloaks → **Vignar Gray-Mane** (decided in Beat 4) |
  | **Eastmarch** (Windhelm) | **Ulfric** (Stormcloak capital) | Legion → **Brunwulf Free-Winter** (the final assault) |
  | **Haafingar** (Solitude) | **Elisif the Fair** (Imperial capital) | does not fall unless the rebellion wins all (the final assault) |
  | **The Reach** (Markarth) | **Igmund** (Imperial) | Stormcloaks → **Thongvor Silver-Blood**; contested, Forsworn-ridden |
  | **Falkreath** | **Siddgeir** (Imperial) | Stormcloaks → **Dengeir** (his uncle) |
  | **Hjaalmarch** (Morthal) | **Idgrod Ravencrone** (Imperial, indifferent) | Stormcloaks → **Sorli the Builder** |
  | **The Pale** (Dawnstar) | **Skald the Elder** (Stormcloak) | Legion → **Brina Merilis** |
  | **The Rift** (Riften) | **Laila Law-Giver** (Stormcloak) | Legion → **Maven Black-Briar** |
  | **Winterhold** | **Korir** (Stormcloak) | Legion → **Kraldar** | - **Stormcloak path** ends by taking **Haafingar** — the assault on **Fort Hraggstad** opens the road to Solitude.
  - **Imperial path** ends by taking **Eastmarch** — the assault on **Fort Amol** opens the road to Windhelm. Each fall is a public deed in that Hold: **Faction Reputation** with the party's army holds at **Trusted (+1)** until the capital falls; a deposed Jarl's loyalists turn cold while the installed Jarl's people turn warm. A **Bounty** the party carried in a flipped Hold may be quietly forgiven by a grateful new Jarl — or pursued harder by a hostile one. > **The optional truce.** If the table is also running the Main Quest, the dragon crisis may force a ceasefire (the *Season Unending* talks at High Hrothgar). The war *pauses* — unless the enemy capital is the last city standing. Use it to complicate the map: a Hold or two may change hands at the negotiating table rather than on the field, and the Thalmor's emissary **Elenwen** may insist on a seat, a small, telling sign of who profits from the bloodletting.
  6. **Beat 6 — The Final Assault (the enemy capital).** The war ends in the foe's own throne-room. This is a second great set-piece to mirror Whiterun: a charge through a defended city to a last stand in the great hall, the enemy commanders fought in sequence, and the war-leader's foe brought to his knees. - **Battle for Solitude (Stormcloak victory).** After Fort Hraggstad, orders from **Galmar**; the party hears **Ulfric's** speech at the gates, then fights up through Solitude to **Castle Dour**. **Legate Rikke** dies covering the retreat; **General Tullius** is beaten into submission. Ulfric offers the party the killing stroke — *behead Tullius yourself, or let Ulfric do it.* Skyrim is independent. **Elisif** is kept on as Jarl of a now-rebel Solitude (a mercy, and a leash). **Reward:** a sword from Ulfric's own armory; the rank of **Stormblade**; Stormcloaks → **Sworn (+2)**.
  - **Battle for Windhelm (Imperial victory).** After Fort Amol, **Tullius's** speech; the party charges the gates and fights through the ancient City of Kings to the **Palace of the Kings**. **Galmar Stone-Fist** dies at his Jarl's side; **Ulfric** is forced to his knees. Tullius offers the party the stroke — *behead Ulfric yourself, or let Tullius do it.* The rebellion is broken; the fair-minded **Brunwulf Free-Winter** — a friend to the city's abused Dunmer — is installed as the new Jarl of Eastmarch. **Reward:** an enchanted sword from Tullius; the rank of **Legate**; the party made **Thane of Eastmarch** with property in Windhelm; Legion → **Sworn (+2)**. > **The last beat is a person.** Whoever kneels — Tullius or Ulfric — let the party look him in the eye. Sparing-and-imprisoning is on the table; so is the headsman. **Renown +1** for ending the war in public; and one quiet scene afterward where a Thalmor agent, or a captured dispatch, makes plain that the Dominion counted this war a victory of its own. The cheering crowd does not know that yet.

  **Climax.**

  The enemy capital falls. Two endings, mirror images:

  - **A Free Skyrim (Stormcloak).** The Empire is thrown out; Ulfric rules, the Talos shrines reopen, and the Nords have their independence. The party are heroes of the rebellion — **Stormblade**, **Sworn**, **Renowned**. And in the quiet after, the cost: a Skyrim cut off and exhausted, its Dunmer no freer than before, and a Thalmor dossier that named Ulfric their asset all along. The elves wanted the Empire weakened in the north. They got it.
  - **A Reunified Skyrim (Imperial).** The rebellion is broken; Ulfric's head rolls or he rots in a cell, Brunwulf rules a kinder Windhelm, and the province is whole under one law. The party are heroes of the Legion — **Legate**, **Sworn**, **Renowned**, **Thane of Eastmarch**. And the cost: the Concordat still stands, Talos is still outlawed, and the elves still smile — for a province held together by the Empire is a province the Empire's masters, the Thalmor, still circle. The war that "ended" only set the table for the next one.

  Either way, a man knelt and the party chose whether he died. Either way, somewhere above Solitude, an emissary closes a dossier, satisfied. The Dragon Crisis is still in the sky — and the truest war, the one the elves are actually fighting, has not yet begun.

  **Also in the frame:** The Branch — Choosing a Side & Joining (`didact rules lookup the civil war …`).

  **The frame's records.** `didact gen run elder-scrolls-skyrim.frame --prefill '{"frame": "The Civil War"}' --auto` drafts the region, 9 places, 20 people, 0 threats, its factions and its clocks, for the world's system; `gen commit` writes them.

  **Bestiary** (Elder Scrolls 2e / Grimscrolls): Draugr → `draugr` / `draugr`; Draugr Overlord → `draugr-overlord` / `draugr`; Ice Wraith → `ice-wraith` / `ice-wraith`; Bandit → `bandit` / `bandits`; Forsworn → `forsworn` / `forsworn`; Forsworn Briarheart → `forsworn-briarheart` / (no Grimscrolls card); Hagraven → `hagraven` / `hagraven`; Dragon → `dragon` / `dragon`.
