    wants: Skyrim free and Talos worshipped openly — a brave foe is a recruit not yet met
    note: A warband is a 4d pool that fights worst when baited. Its officer, a **Stormblade** at 
      best, is a tough who will honor a challenge to single combat and its result. Share their mead 
      or point them at a Thalmor and you have friends. The rising is 4E 201's.
body: |-
  ## GM notes

  Fur-and-mail rebels, mostly Nords, fighting for Talos and a free Skyrim. Bands of four or more are a detachment; a unit fields a standard-bearer and an officer in heavier mail (2 Armor, sword d8).

  Elder Scrolls 2e: 5 HP, 1 Armor, 13 STR, 12 DEX, 10 WIL, war axe (d8) or hunting bow (d6).

  Grimscrolls: its card is `grimscrolls.stormcloak-warband` (Stormcloak Warband), in this record's grimscrolls block.
source: campaigns/02-the-civil-war#stormcloak-soldier
