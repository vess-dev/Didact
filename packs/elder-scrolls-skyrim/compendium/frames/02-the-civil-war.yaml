id: the-civil-war-whiteruns-neutrality
type: track
name: Whiterun's Neutrality
knowledge: secret
tags: [the-civil-war, clock]
kind: clock
size: 4
value: {value: 0, size: 4}
note: '(d4) Ticks with each mission the party runs before Beat 3. At 4, the Stormcloaks strike before
  the Legion can garrison the city: a Legion party finds Whiterun already fallen and runs Beat 4 as the
  attackers. (A Stormcloak party is the attacker either way — for them the clock only measures how much
  warning Balgruuf has had.)'
source: campaigns/02-the-civil-war#clocks
