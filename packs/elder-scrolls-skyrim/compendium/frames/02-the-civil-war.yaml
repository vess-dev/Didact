id: the-civil-war-thalmor-justiciar
type: monster
name: Thalmor Justiciar
knowledge: secret
tags: [the-civil-war, cast, threat]
mechanics:
  elder-scrolls-2e:
    category: 'Campaign: The Civil War'
    hp: 6
    armor: 1
    STR: 10
    DEX: 13
    WIL: 14
    attacks:
    - {name: elven sword, damage: d8}
    - name: Destruction bolt
      damage: d8
      qualities: [ranged]
    abilities:
    - "The long war: the Justiciar is never quite where the party can pin a betrayal on them. A captured
      dispatch or embassy dossier in their keeping reveals the Dominion's true game — that a Skyrim bled
      white by its own war is exactly what the elves want."
  grimscrolls:
    category: Orders & Armies
    tier: tough
    role: tactician
    sights: spotless black-and-gold robes
    sounds: a question as if to a child
    smells: hot lightning
    traits: [the Concordat shields them, blinded by contempt]
    moves: [Read the Warrant, Lightning from Behind Shields]
    wants: heretics in chains, and names — obedience suits them better than a fight
    note: A patrol is a 6d pool; drop the **Justiciar**, its wizard and mind, and the soldiers 
      withdraw to report. Answer civilly, deny Talos, and they pass with a sneer. Kill them and a 
      death squad follows (*6d The Thalmor Find You*). After the Great War only.
body: |-
  ## GM notes

  A black-and-gold agent of the Aldmeri Dominion: a hunter of Talos-worshippers who turns up at the edges of the war, "advising" the Empire and quietly pleased by every stalemate. Casts Destruction at range and cuts with an enchanted blade.

  Elder Scrolls 2e: 6 HP, 1 Armor, 10 STR, 13 DEX, 14 WIL, elven sword (d8), Destruction bolt (d8, ranged) (as in the Bestiary).

  Elder Scrolls 2e's Bestiary has the same stat block: `elder-scrolls-2e.thalmor-justiciar`.

  Grimscrolls: its card is `grimscrolls.thalmor-justiciars` (Thalmor Justiciars), in this record's grimscrolls block.
source: campaigns/02-the-civil-war#thalmor-justiciar
