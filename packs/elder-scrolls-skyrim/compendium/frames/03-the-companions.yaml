  grimscrolls:
    tier: elite
    role: protector
    fact: "Harbinger of the Companions: old, ailing, and a werewolf who has decided he would rather see
      Sovngarde than Hircine's Hunting Grounds. He wants the cure before he dies, or failing that, after.
      (4E 201, Whiterun)"
fields: {role: 'Harbinger, weary and wise'}
body: |-
  ## GM notes

  **Kodlak Whitemane** — Harbinger, weary and wise; wants his soul freed from Hircine before he dies. The heart of the story. *Dies at Beat 6 — this cannot be prevented.*

  Old and scarred, calm where younger warriors rage; speaks of honor, the soul, and Sovngarde. Beast-blooded, but he fights it.

  Elder Scrolls 2e: 10 HP, 2 Armor, 14 STR, 12 DEX, 15 WIL, Skyforge greatsword (d12); Beast Form claws (d6+d6), bite (d8).

  Grimscrolls: its Face is `grimscrolls.kodlak-whitemane` (Kodlak Whitemane), in this record's grimscrolls block.
source: campaigns/03-the-companions#kodlak-whitemane-harbinger
