body: |-
  ## GM notes

  *at the Flame*

  The beast torn loose from Kodlak's soul when a Glenmoril head burns in the Flame of the Harbinger — a ghostly, savage wolf-shape, all the Hunt and none of the man.

  Elder Scrolls 2e: 12 HP, 1 Armor, 16 STR, 14 DEX, 8 WIL, spectral claws (d6+d6), bite (d8).

  Grimscrolls: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
