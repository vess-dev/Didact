body: |-
  ## GM notes

  **Aela the Huntress** — Circle, and the truest believer in the wolf; glories in the Hunt, will never take the cure. Drives the revenge arc. Potential follower.

  Lithe, war-painted, restless; happiest on a hunt and proudest of the wolf.

  Elder Scrolls 2e: 8 HP, 1 Armor, 13 STR, 16 DEX, 11 WIL, ancient Nord bow (d6) or hunting knife (d6); Beast Form claws (d6+d6), bite (d8).

  Grimscrolls: its card is `grimscrolls.the-companions` (The Companions), in this record's grimscrolls block.
