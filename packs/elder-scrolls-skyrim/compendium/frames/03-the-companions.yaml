name: The Silver Hand Clock
knowledge: secret
tags: [the-companions, clock]
kind: clock
size: 6
value: {value: 0, size: 6}
note: (d6) How close the hunters are to gutting Jorrvaskr. Advance it when the party kills Silver 
  Hand in the open (Gallows Rock, ambush sites), when a beast-blooded PC transforms where it can be 
  witnessed and reported, or when the party lingers in Whiterun between barrow-jobs. The hall falls 
  when this clock fills (never before Kodlak has sent the party to the Coven in Beat 5) or when they
  return from the Coven, whichever comes first. It is a pressure gauge on the murder that will come,
  not a way to dodge it.
source: campaigns/03-the-companions#clocks
