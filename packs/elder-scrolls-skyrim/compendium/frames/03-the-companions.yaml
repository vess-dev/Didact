id: the-companions
type: quest
name: The Companions
tags: [the-companions, frame, main-campaign]
goal: "In the Wind District of Whiterun stands Jorrvaskr, the overturned hull of a longship that has been
  a mead hall for nearly five thousand years — home of the Companions, warriors-for-hire who keep faith
  with the band of Ysgramor. They take all comers who can swing a blade. But the inner Circle carry a
  secret: they are werewolves, beast-blooded through an old pact with the Glenmoril Witches in the name
  of Hircine, Prince of the Hunt. Their Harbinger, old Kodlak Whitemane, has come to dread the bargain
  — when a beast-blooded Companion dies, his soul hunts forever in Hircine's Hunting Grounds rather than
  feasting in Sovngarde, and Kodlak wants free of it before he dies. He will not get the chance. The Silver
  Hand — fanatic werewolf-hunters — are closing in, and they mean to gut Jorrvaskr and take the shards
  of Ysgramor's lost axe, Wuuthrad, with them."
date: Sundas, 17 Last Seed 4E 201
body: |-
  *An old warrior dies afraid of where his soul will go. The mead hall that raised the heroes of Skyrim hides a curse under its floor — the inner Circle run with wolves, sold to a Daedric Prince of the Hunt — and the only people who can break the bargain are the witches who struck it and the hunters who want every werewolf in Skyrim skinned.*

  ## GM notes

  **Date.** Sundas, 17 Last Seed 4E 201: 4E 201, the book's moment; no day of its own: whenever the party reaches Jorrvaskr. It is the calendar's start: a new campaign opens on it.

  **The frame's text:** `didact rules lookup the companions pitch` (and `stakes`, `tone touchstones`, `arrival`, `plot beats`, `the beast-blood`, `the place`, `cast`, `clocks`, `threats`, `rewards`, `climax`).

  **Stakes.** The party comes up through the ranks, is offered the beast-blood, and inherits a dying man's last wish. Kodlak's murder cannot be prevented — it is the hinge of the story — but everything after is the party's to settle: whether to embrace the wolf or seek the cure, whether the Circle's secret survives, and whether one old Nord's soul reaches Sovngarde or hunts forever under the moons. By the end, the party's own beast-blood is the central question, and the Harbinger's chair is empty for them to fill.

  **Arrival.** The party is in or near **Whiterun**. Pick a hook:

  - **The giant at the farm.** Out on the tundra, **Aela**, **Farkas**, and the whelp **Ria** are squaring off against a **giant** that has wandered onto Pelagia Farm. They could use a fourth blade. Fight well and Aela tells you where warriors drink.
  - **Word of work.** A caravan guard, a tavern-keeper at the Bannered Mare, or a Hold guard mentions that Jorrvaskr "always needs strong arms," and the pay is honest.
  - **Faction tie.** A PC with the Companion background already belongs to the hall and starts at **Companions +1**; a Nord Reaver, Housecarl, or Sellsword has heard the old stories and means to earn a seat at that table.

  However they arrive, the road ends at the doors of Jorrvaskr, where Kodlak Whitemane is waiting to size them up.

  **Plot beats.**

  1. **Take Up Arms.** The party reaches Jorrvaskr and speaks with Harbinger Kodlak. He has them **spar with Vilkas** in the yard to take their measure (a friendly bout — first to yield, no Scars). Earn a place as a whelp. Run errands that show the hall's shape: carry Vilkas's sword to **Eorlund Gray-Mane** at the **Skyforge**, deliver a shield to Aela, let **Farkas** show the party their bunks. One radiant job (clear a bandit den, recover a stolen heirloom) proves they're worth blooding.
  2. **Proving Honor.** **Skjor** sends the party after a fragment of **Wuuthrad**, with **Farkas** as escort, into **Dustman's Cairn**. Deep in the crypt a lever seals the party behind a gate — and the **Silver Hand** spring their ambush. Farkas **transforms into a werewolf** before the party's eyes, tears the hunters apart, and frees them. *The secret is out:* some Companions are beasts. Fight on through the draugr to the inner chamber, take the **Fragment of Wuuthrad** from the altar (a Word Wall thrums there — ancient noise, nothing the party can use), and carry it home. Kodlak formally inducts the party into the Companions.
  3. **The Underforge.** **Skjor** wants a word away from Kodlak's ears. After dark he leads the party beneath the Skyforge to the **Underforge**, where **Aela** waits in beast form by a stone basin. This is the **offering of the beast-blood**: Skjor opens Aela's wolf-vein into the font and invites the party to drink and join the Circle. **This is the campaign's first real fork — see *The Beast-Blood* below.** Whoever drinks blacks out and comes to outside the walls, having run as a wolf in the night, with Aela grinning beside the kill.
  4. **The Silver Hand's Den.** Skjor means to strike the Silver Hand while the party's blood is hot — he marches on their stronghold at **Gallows Rock** ahead of the party. By the time the party and Aela catch up, the hunters were ready for him: the party fights through cages of tortured, dying werewolves and the hunter-captain **Krev the Skinner**, and finds **Skjor dead**, hung for skinning. The war with the Silver Hand is now blood for blood.
  5. **Blood's Honor.** Kodlak takes the party aside and confesses what eats at him: the Circle's lycanthropy came from a **pact with the Glenmoril Witches**, and a beast-blooded soul belongs to **Hircine's Hunting Grounds**, not Sovngarde. He wants the **cure**, for himself and for any who'll take it — and the cure begins with a **witch's head**. Send the party to the **Glenmoril Coven** in the Falkreath pines to kill a witch and take her head. (A thorough party takes *several* heads — one per Circle member who might want curing later.)
  6. **The Fall of Jorrvaskr.** The party returns to find **Jorrvaskr attacked and Kodlak dead** — the Silver Hand struck the hall while the Circle was scattered, killed the old man, and **stole the recovered Fragments of Wuuthrad**. This beat is the hinge: Kodlak's death is not preventable. The hall is in mourning and fury; **Vilkas** and **Aela** are wild with grief.
  7. **Purity of Revenge.** With **Vilkas**, hunt the Silver Hand to their den at **Driftshade Refuge** near Dawnstar. Cut through the hunters and their traps, put down the caged beasts, and **recover the stolen Fragments of Wuuthrad**. Vilkas tells the party to bring everything to the Skyforge — it is time to lay the Harbinger to rest.
  8. **Glory of the Dead.** At Kodlak's pyre, the party gives every fragment to **Eorlund**, who **reforges Wuuthrad** on the Skyforge. The Circle — **Aela, Farkas, Vilkas**, and the party — carry the axe north to **Ysgramor's Tomb** in Winterhold. Set Wuuthrad in the hands of Ysgramor's statue to open the inner door. Fight through Companion ghosts and skittering frostbite spiders to the **Flame of the Harbinger**, where **Kodlak's ghost** waits, still beast-tangled. Cast a **Glenmoril witch's head** into the Flame: Kodlak's wolf-spirit tears loose as a beast to be put down. Defeat it, and the old man is **freed to Sovngarde**. The Companions name the party **Harbinger**.

  **Climax.**

  The Flame of the Harbinger in Ysgramor's Tomb, Wuuthrad reforged and set in the founder's hands, the Circle at the party's back, and Kodlak's beast-tangled ghost waiting. Cast a Glenmoril witch's head into the Flame and the old man's wolf-spirit tears loose to be put down. Beat it, and Kodlak walks free to Sovngarde at last. Then the party decides what they are:

  - **Embrace the wolf.** The party keep the beast-blood (or take it now, at the font, if they held back). The Companions ride on as Hircine's own — fierce, feared, and damned to the Hunting Grounds when they fall. Aela is glad of it. The Ring of Hircine, if found, is theirs to make the wolf limitless.
  - **Seek the cure.** With heads enough, the beast-blooded PCs burn the curse out of themselves as they did for Kodlak — mortal again, Sovngarde-bound, the bargain with Hircine broken. The Companions become what Kodlak wanted them to be: warriors, not beasts.
  - **A divided hall.** The party need not agree. Some keep the wolf, some take the cure, some never drank — and the Companions go on as a brotherhood that holds together across the difference, the way it always did. Either way, the chair at the head of the table is the party's now, and Jorrvaskr's doors stand open to all comers who can swing a blade.

  **Also in the frame:** The Beast-Blood (the central branch) (`didact rules lookup the companions …`).

  **The frame's records.** `didact gen run elder-scrolls-skyrim.frame --prefill '{"frame": "The Companions"}' --auto` drafts the region, 8 places, 8 people, 2 threats, its factions and its clocks, for the world's system; `gen commit` writes them.

  **Bestiary** (Elder Scrolls 2e / Grimscrolls): Giant → `giant` / `giant`; Draugr → `draugr` / `draugr`; Draugr Overlord → `draugr-overlord` / `draugr`; Ghost → `ghost` / `ghost-and-wraith`; Hagraven → `hagraven` / `hagraven`; Frostbite Spider → `frostbite-spider` / `frostbite-spider`; Giant Frostbite Spider → `frostbite-spider` / `frostbite-spider`; Werewolf → `werewolf` / `werewolf-pack`; Bandit → `bandit` / `bandits`; Wolf → `wolf` / `wolf-pack`.

  **Rewards in each system's catalog:** Wuuthrad (elder-scrolls-2e.wuuthrad · grimscrolls.wuuthrad); Ring of Hircine (elder-scrolls-2e.ring-of-hircine · grimscrolls.ring-of-hircine); The Shield of Ysgramor (elder-scrolls-2e.shield-of-ysgramor · grimscrolls.shield-of-ysgramor).
