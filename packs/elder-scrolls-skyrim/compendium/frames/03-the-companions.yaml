    critical: drives a silver stake home — STR loss he inflicts this round cannot be restored until 
      the wound is treated by a healer.
  grimscrolls:
    category: The Night's Children
    tier: mook
    role: tactician
    sights: wolf heads on pikes
    sounds: something large pacing a cage
    smells: silver polish and old straw
    traits: [silver on every blade, prepared for worse than you]
    moves: ['Net, Pin, and Question', Loose the Thing in the Cage]
    wants: every werewolf skinned and Jorrvaskr shamed — and, lately, any ransom going
    note: A lodge is a 4d pool; against the beast blood its blades land at high stakes. A leader 
      like **Krev the Skinner** is a tough who collects pelts. They deal for a werewolf's name or a 
      shard of Wuuthrad, and plain travelers can buy their way out (4E 201).
fields: {role: the Silver Hand captain at Gallows Rock}
body: |-
  ## GM notes

  **Krev the Skinner** — the Silver Hand captain at Gallows Rock; flays beasts for trophies.

  The butcher who commands Gallows Rock and skins beasts for trophies; he killed Skjor.

  Elder Scrolls 2e: 10 HP, 2 Armor, 14 STR, 13 DEX, 12 WIL, silver greatsword (d10, silver), crossbow (d8, bulky).

  Grimscrolls: its card is `grimscrolls.the-silver-hand` (The Silver Hand), in this record's grimscrolls block.
source: campaigns/03-the-companions#krev-the-skinner-silver-hand-captain
