    STR: 14
    DEX: 12
    WIL: 15
    attacks:
    - {name: Skyforge greatsword, damage: d12}
    - {name: Beast Form claws, damage: '{d6, d6}kh1'}
    - {name: bite, damage: d8}
    abilities:
    - 'Also: Beast Form claws (d6+d6), bite (d8).'
    - He will not transform if he can help it — the wolf is his shame. In a true crisis the Warden 
