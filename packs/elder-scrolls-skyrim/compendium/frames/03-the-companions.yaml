kind: counter
min: 0
max: 5
value: 0
note: (a tally of witches' heads, 0–5) Kodlak's progress toward peace, and the party's stock of 
  cures. Advance it for each Glenmoril witch's head the party carries out of the Coven. At the Flame
  of the Harbinger, each head spends to cure one soul — Kodlak's, or a beast-blooded PC's. Fewer 
  heads than willing souls means someone stays a wolf.
source: campaigns/03-the-companions#clocks
