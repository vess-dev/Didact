  ## GM notes

  The ancient forge on the rock above Jorrvaskr, hotter and older than any other in Skyrim, worked by **Eorlund Gray-Mane**, the finest smith in the Hold. Skyforge Steel comes from here; here Wuuthrad is reforged.
