type: monster
name: Vigilant of Stendarr
knowledge: secret
tags: [the-daedric-quests, threat]
mechanics:
  elder-scrolls-2e:
    category: 'Campaign: The Daedric Quests'
    hp: 6
    armor: 1
    STR: 13
    DEX: 11
    WIL: 13
    attacks:
    - {name: steel mace, damage: d8}
    - name: Sun Fire
      damage: d6
      qualities: [ranged]
      note: undead only
    abilities:
    - Against Daedra, the undead, and lycanthropes, a Vigilant's attacks are Enhanced. They will not
      be bargained with by anyone they have seen carrying a Daedric Artifact.
    critical: a burst of holy fire sears the target for an extra d4 damage and, against the undead 
      or Daedra, forces a WIL save or they flee.
  grimscrolls:
    category: The Night's Children
    tier: tough
    role: protector
    sights: robes over steel gauntlets
    sounds: a blessing like a warning
    smells: lamp oil and salve
    traits: [heal between blows, can smell a Daedric bargain]
    moves: [Ward the Line and Advance, Mace the Abomination]
    wants: Daedric relics destroyed, their keepers repentant — mercy is offered once, before the 
      mace
    note: A patrol is a 6d pool that gets a die back each scene unless its healer falls. A **Keeper 
      of the Vigil** leads each province. Surrender the relic or submit to questioning and no one 
      bleeds; vampires and the unrepentant get no terms.
body: |-
  ## GM notes

  A grim, robed hunter of the abominable, marked with Stendarr's hammer, who shows no mercy to Daedra, undead, or those who serve them. Patrols in pairs; four or more fight as a detachment.

  Elder Scrolls 2e: 6 HP, 1 Armor, 13 STR, 11 DEX, 13 WIL, steel mace (d8), Sun Fire (d6, ranged, undead only).

  Grimscrolls: its card is `grimscrolls.vigilants-of-stendarr` (Vigilants of Stendarr), in this record's grimscrolls block.
source: campaigns/07-the-daedric-quests#vigilant-of-stendarr
