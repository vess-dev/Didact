id: the-daedric-quests
type: quest
name: The Daedric Quests
tags: [the-daedric-quests, frame, side-arc]
goal: |-
  The Daedric Princes are the lords of Oblivion — immortal, unbound by the rules of the mortal world, and endlessly curious about those who must live by them. They cannot create, only meddle. So they meddle: they whisper through locked doors, slip pacts into a beggar's babble, leave a wonder on a shrine for whoever will earn it. What they want, always, is to be entertained — and to see what a mortal will do when the price of power is somebody else's soul.

  This module is a sandbox, not a campaign. It is fifteen self-contained quest frames, one per Daedric Prince, and between them they hand out sixteen Daedric Artifacts (Hircine's frame holds two). Drop them anywhere. A party hears a rumor, finds a beacon, reads a strange pamphlet, or simply wanders past a roadside shrine — and one of the Princes takes an interest. Each frame is built to run in a single session.
date: Sundas, 17 Last Seed 4E 201
body: |-
  *"The Princes do not love you. They are bored, and you are amusing."* — a Vigilant of Stendarr, before the inn burned

  ## GM notes

  **Date.** Sundas, 17 Last Seed 4E 201: 4E 201, the book's moment; a sandbox: each Prince's quest whenever a Prince takes an interest. It is the calendar's start: a new campaign opens on it.

  **The frame's text:** `didact rules lookup the daedric quests how the princes meddle with mortals` (and `nocturnal`, `the vigil of stendarr`, `quick reference`).

  **The Princes' quests** (each a quest of its own, brought in by the `daedric-quest` generator): Mehrunes Dagon: *Pieces of the Past* → Mehrunes' Razor (`the-daedric-quests-pieces-of-the-past`); Molag Bal: *The House of Horrors* → Mace of Molag Bal (`the-daedric-quests-the-house-of-horrors`); Sanguine: *A Night to Remember* → Sanguine Rose (`the-daedric-quests-a-night-to-remember`); Vaermina: *Waking Nightmare* → Skull of Corruption (`the-daedric-quests-waking-nightmare`); Hermaeus Mora: *Discerning the Transmundane* → Oghma Infinium (`the-daedric-quests-discerning-the-transmundane`); Sheogorath: *The Mind of Madness* → Wabbajack (`the-daedric-quests-the-mind-of-madness`); Malacath: *The Cursed Tribe* → Volendrung (`the-daedric-quests-the-cursed-tribe`); Peryite: *The Only Cure* → Spellbreaker (`the-daedric-quests-the-only-cure`); Hircine: *Ill Met by Moonlight* → Savior's Hide or Ring of Hircine (`the-daedric-quests-ill-met-by-moonlight`); Namira: *The Taste of Death* → Ring of Namira (`the-daedric-quests-the-taste-of-death`); Clavicus Vile: *A Daedra's Best Friend* → Masque of Clavicus Vile (`the-daedric-quests-a-daedras-best-friend`); Boethiah: *Boethiah's Calling* → Ebony Mail (`the-daedric-quests-boethiahs-calling`); Mephala: *The Whispering Door* → Ebony Blade (`the-daedric-quests-the-whispering-door`); Meridia: *The Break of Dawn* → Dawnbreaker (`the-daedric-quests-the-break-of-dawn`); Azura: *The Black Star* → Azura's Star or The Black Star (`the-daedric-quests-the-black-star`).

  **Also in the frame:** How the Princes Meddle With Mortals; Nocturnal — the Skeleton Key (cross-reference); The Vigil of Stendarr (foe & complication); Quick Reference — Prince, Quest, Artifact (`didact rules lookup the daedric quests …`).

  **The frame's records.** `didact gen run elder-scrolls-skyrim.frame --prefill '{"frame": "The Daedric Quests"}' --auto` drafts its threat (the Vigilant of Stendarr); each Prince's quest comes in on its own, for the world's system; `gen commit` writes them. A Prince's quest and its people: `didact gen run elder-scrolls-skyrim.daedric-quest --prefill '{"quest": "Pieces of the Past"}' --auto` (or let `--auto` pick).

  **Rewards in each system's catalog:** Mehrunes' Razor (elder-scrolls-2e.mehrunes-razor · grimscrolls.mehrunes-razor); Mace of Molag Bal (elder-scrolls-2e.mace-of-molag-bal · grimscrolls.mace-of-molag-bal); Sanguine Rose (elder-scrolls-2e.sanguine-rose · grimscrolls.sanguine-rose); Skull of Corruption (elder-scrolls-2e.skull-of-corruption · grimscrolls.skull-of-corruption); Oghma Infinium (elder-scrolls-2e.oghma-infinium · grimscrolls.oghma-infinium); Wabbajack (elder-scrolls-2e.wabbajack · grimscrolls.wabbajack); Volendrung (elder-scrolls-2e.volendrung · grimscrolls.volendrung); Spellbreaker (elder-scrolls-2e.spellbreaker · grimscrolls.spellbreaker); Savior's Hide (elder-scrolls-2e.saviors-hide · grimscrolls.saviors-hide); Ring of Hircine (elder-scrolls-2e.ring-of-hircine · grimscrolls.ring-of-hircine); Ring of Namira (elder-scrolls-2e.ring-of-namira · grimscrolls.ring-of-namira); Masque of Clavicus Vile (elder-scrolls-2e.masque-of-clavicus-vile · grimscrolls.masque-of-clavicus-vile); Ebony Mail (elder-scrolls-2e.ebony-mail · grimscrolls.ebony-mail); Ebony Blade (elder-scrolls-2e.ebony-blade · grimscrolls.ebony-blade); Dawnbreaker (elder-scrolls-2e.dawnbreaker · grimscrolls.dawnbreaker); Azura's Star (elder-scrolls-2e.azuras-star · grimscrolls.azuras-star); The Black Star (elder-scrolls-2e.the-black-star).
