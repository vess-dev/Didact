id: hearthfire
type: quest
name: Hearthfire
aliases: [Hearthfire (DLC)]
tags: [hearthfire, frame, side-arc]
goal: |-
  The party has fought, schemed, or hauled freight long enough that someone in a Hold's court knows their name. A Jarl (or, more often, the Jarl's Steward, who keeps the land-ledger) lets it be known that a parcel is for sale: a clearing in the pines, a defensible knuckle of marsh, a windswept shelf of tundra. Buy it, and it is yours to build on — a base of operations that is theirs, not an inn room rented by the night.

  What grows there is up to the party. On the page it is a homestead that starts at Population 1 / Defense 1 / Prosperity 1 with one of its eight slots already filled by the bare main hall, exactly as Settlements describes. In the fiction it climbs from a one-room cottage to a great house with wings and outbuildings, a smithy ringing, a garden ripe, children underfoot, and a housecarl at the door. The grand manor is the filled slots; the family is the rising Population; the standing is the Jarl's favor.

  ---
date: Sundas, 17 Last Seed 4E 201
body: |-
  *Skyrim belongs to the Nords — but a corner of it can belong to you. A stretch of cleared ground, a raised frame, a hearth lit against the dark, a roof over heads you have chosen to call kin.*

  ## GM notes

  **Date.** Sundas, 17 Last Seed 4E 201: 4E 201, the book's moment; between adventures, whenever the party can buy its land. It is the calendar's start: a new campaign opens on it.

  **The frame's text:** `didact rules lookup hearthfire premise` (and `acquiring a plot`, `building a downtime path`, `hiring the household`, `adopting children`, `troubles that come with a home`, `optional a spriggan in the woods`, `rewards`).

  **Also in the frame:** Acquiring a Plot; Building: a Downtime Path; Hiring the Household; Adopting Children; Troubles That Come With a Home; Optional: a Spriggan in the Woods (Lakeview) (`didact rules lookup hearthfire …`).

  **The frame's records.** `didact gen run elder-scrolls-skyrim.frame --prefill '{"frame": "Hearthfire"}' --auto` drafts the region, 3 places, 0 people, 6 threats, its factions and its clocks, for the world's system; `gen commit` writes them.
source: campaigns/10-hearthfire#hearthfire-dlc
