  ## GM notes

  *sworn guard*

  A Nord (or Redguard) warrior sworn to guard the manor and its lord; quarters in the hall and stands watch by night. Wears light armor and carries a shield (2 Armor; 1 when the shield is slung for the battleaxe).

  Elder Scrolls 2e: 6 HP, 2 Armor, 13 STR, 12 DEX, 11 WIL, steel sword (d8) or steel battleaxe (d10).

  Grimscrolls: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
