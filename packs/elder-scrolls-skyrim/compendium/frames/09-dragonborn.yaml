id: dragonborn
type: quest
name: Dragonborn
aliases: [Dragonborn (DLC)]
tags: [dragonborn, frame, side-arc]
goal: |-
  Four thousand years ago a Nord dragon-priest named Miraak was the first mortal to bear a dragon's soul. He learned to bend the will of dragons, betrayed his masters, and was dragged into the library-hell of Apocrypha by the Daedric Prince he served. He never died. Now his cultists hunt the roads of Skyrim for the "false Dragonborn," and on the island of Solstheim his enthralled servants chant in their sleep and haul stone to rebuild his temple. He means to walk back into the world through the corrupted All-Maker Stones, and he means to take the Last Dragonborn's soul to do it.

  The cultists believe that soul belongs to one of the party. (If your table's Dragonborn is a PC touched by Akatosh, they are right; if the Last Dragonborn is an NPC ally, the cult has simply come for the wrong people — or for the people standing beside the right one. Run the frame the same way.)

  To stop Miraak the party must free Solstheim's people, win the trust of the Skaal, and follow the Black Books into Apocrypha to confront Hermaeus Mora, Prince of forbidden knowledge — Miraak's old patron, and a far worse one. Mora will give them the power to face Miraak. He will name a price for it that no decent person should pay, and it will be paid anyway.
date: Sundas, 17 Last Seed 4E 201
body: |-
  *A masked killer falls at your feet whispering a name that is not yours — Miraak — and across the Sea of Ghosts an ash-choked island full of sleepwalkers builds his temple from the foundations of the world. To stop the First of your kind, you will trade with the Demon of Knowledge, and the bargain costs a good man his life.*

  ## GM notes

  **Date.** Sundas, 17 Last Seed 4E 201: 4E 201, the book's moment; no day of its own: whenever the Miraak cultists find the party. It is the calendar's start: a new campaign opens on it.

  **The frame's text:** `didact rules lookup dragonborn pitch` (and `stakes`, `tone touchstones`, `arrival`, `plot beats`, `bend will, as a story device`, `the black books, as relics`, `the place`, `cast`, `clocks`, `threats`, `rewards`, `climax`).

  **Stakes.** An island's freedom and a people's secret. If Miraak returns, Solstheim becomes his, and the First Dragonborn walks Tamriel again with the dragons at his call. To stop him, the Skaal must give up the knowledge they have guarded for four thousand years — and their shaman must give up his life. The party wins a victory that costs a friend, and earns the attention of a Prince who does not forget.

  **Arrival.** The hook finds the party anywhere in Skyrim. Two **Miraak Cultists** in bone-and-wood masks walk up out of a crowd or off the road, declare them the "false Dragonborn," and attack without a word of parley (use the Bestiary entry; they travel in pairs). On a corpse is a note — *Kill the false Dragonborn* — and orders pointing to **Solstheim**.

  Passage is bought at the **Windhelm docks** from **Gjalund Salt-Sage**, master of the *Northern Maiden*, who is reluctant, overcharges, and has been to the island lately and does not like to talk about it. The crossing of the Sea of Ghosts sets the party down at **Raven Rock**.

  A PC with the Skaal Hunter background has come home to find the Stones falling silent, and starts at **Skaal +1**; a Telvanni Mage may already know the way to Tel Mithryn.

  **Plot beats.**

  1. **The False Dragonborn.** Cultists attack on the Skyrim mainland. The party reads the note, finds the *Northern Maiden*, and sails for Raven Rock. **(Gate: leaving Skyrim.)**
  2. **Raven Rock & the Earth Stone.** A weathered Dunmer mining colony of House Redoran under the ash, ruled by Councilor Lleril Morvayn behind the great **Bulwark**. Miraak's name is on every tongue, spoken with fear or with the flat calm of the entranced. At the **Earth Stone** outside the walls, glassy-eyed townsfolk pile stone onto a half-built shrine and cannot be reasoned with. The party meets the Telvanni wizard **Neloth**, who studies the phenomenon with magnificent indifference to the people suffering it. The trail leads inland to the **Temple of Miraak**.
  3. **The Temple of Miraak.** A buried dragon-cult temple where enthralled Skaal labor in the dark. Here the party meets **Frea**, a Skaal warrior fighting to reach her people, who joins them. Deep below lies the first **Black Book**, *Waking Dreams*. Reading it pulls the reader bodily into **Apocrypha**, where **Miraak** appears — contemptuous, untouchable, *real* — and casts them back out. From now on, **whenever the party kills a dragon, Miraak's shade may appear and tear its soul away** before the Dragonborn can take it — a recurring beat, not a mechanic, that shows his reach.
  4. **The Fate of the Skaal.** Frea leads the party north to the **Skaal Village** on the snowbound north coast, where her father **Storn Crag-Strider**, the village shaman, holds the last people on the island still free of Miraak's spell — barely. Storn explains what must be done: the **All-Maker Stones** that ring the island have been corrupted into the engines of Miraak's return, and they must be cleansed. He sends the party to **Saering's Watch** to face a dragon and recover the lost words needed to do it. **(See "Bend Will, as a Story Device" below — this is where the first cleansing power is granted, *not* learned as a Shout.)**
  5. **Cleansing the Stones.** Corrupted stones stand across Solstheim — the **Wind Stone, Beast Stone, Sun Stone, Water Stone,** and the **Earth Stone** at Raven Rock. The sixth, the **Tree Stone** at the Temple's heart, stays in Miraak's grip until he dies (Beat 9). At each, the party uses the granted power to shatter Miraak's hold; the laborers wake confused, and something rises to punish the intrusion — a **Lurker** heaves up out of black water at most stones. Freeing the Beast Stone wins over a tribe of **Rieklings**; freeing the Earth Stone lifts the pall over Raven Rock. Each freed stone leaves a faint blessing on the land (see Rewards). **(Gate: the island must be freed before Mora will deal.)**
  6. **The Path of Knowledge.** With the stones free, only the Black Book that taught Miraak to bend dragons can show the way to him — and **Neloth** knows where it is: drowned in the flooded Dwemer ruin of **Nchardak**. The party restores the ruin's ancient steam-engines (a delve of water, clockwork, and Dwarven automatons) to raise the reading-room and claim the second Black Book, *Epistolary Acumen*.
  7. **The Gardener of Men — the Price.** Reading *Epistolary Acumen* brings the party before **Hermaeus Mora** himself: a horizon of green tentacles and unblinking eyes. He will grant the final measure of power to face Miraak — but he wants payment in kind: **the secret knowledge the Skaal have guarded for four thousand years**, the very thing that has kept them free of him. Only **Storn** can give it. When the party brings the Black Book to the village, Storn takes it, opens his mind to the Prince so his people will be spared — and **Mora kills him**, draining the secrets and the man together, in front of his daughter. Frea, grieving, tells the party to end Miraak. **(This is the emotional climax. Do not rush it. Storn knows the price from Beat 4 and chooses it.)**
  8. **At the Summit of Apocrypha.** The party reads *Waking Dreams* one last time and descends the green chapters of Apocrypha toward Miraak's tower, hunted by **Seekers** and **Lurkers**. At the final reach, a granted word **tames the dragon Sahrotaar** — who serves Miraak, and now turns — and he carries them to the summit.
  9. **The Duel.** **Miraak** fights at his tower, healing himself by devouring the dragons he commands. When he is nearly beaten, **Hermaeus Mora reaches up and kills his own champion** — discarding Miraak the instant he is no longer useful — and the soul Miraak spent four thousand years hoarding goes free. See **Climax**.

  **Climax.**

  The party reads *Waking Dreams* for the last time and walks the green chapters of Apocrypha to Miraak's tower, riding the tamed **Sahrotaar** to the summit. **Miraak** fights as a legend should — drinking spells, devouring his own dragons to heal, certain to the end that the world is his by right. The party cannot finish him while a dragon lives to mend him; they wear him down anyway, and at the last **Hermaeus Mora kills his own champion** — a casual, total betrayal — and the soul Miraak spent four thousand years hoarding is set loose (into the Dragonborn, if one stands among the party).

  They have won. Solstheim is free; the Skaal are saved; the First Dragonborn is ash. But **Storn is dead**, killed to buy that victory, and the Prince who killed him is the one who handed the party their power and now considers them *interesting*. Frea takes up her father's place at the well of the Skaal Village. Neloth goes back to his tower as though nothing of consequence has happened. And somewhere in the green dark, Hermaeus Mora watches the party leave with a thousand patient eyes — pleased, and waiting, because everyone who reads his Books comes back.

  **Also in the frame:** Bend Will, as a Story Device — NOT a Player Shout; The Black Books, as Relics — NOT Shouts (`didact rules lookup dragonborn …`).

