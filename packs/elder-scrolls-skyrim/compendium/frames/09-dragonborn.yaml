  **Bestiary** (Elder Scrolls 2e / Grimscrolls): Miraak Cultist → `miraak-cultist` / `dragon-cultists`; Seeker → `seeker` / `seeker`; Lurker → `lurker` / `lurker-daedra`; Riekling → `riekling` / `riekling`; Ash Spawn → `ash-spawn` / `ash-spawn`; Ash Guardian → `ash-guardian` / (no Grimscrolls card); Werebear → `werebear` / `werewolf-pack`; Netch → `netch` / `netch`; Ash Hopper → `ash-hopper` / `shalk-and-ash-hopper`; Bristleback → `bristleback` / `boar-and-bristleback`; Bandit → `bandit` / `bandits`; Dragon → `dragon` / `dragon`; Frost Dragon → `frost-dragon` / `dragon`; Dwarven Spider → `dwarven-spider` / `dwarven-spider`; Dwarven Sphere → `dwarven-sphere` / `dwarven-sphere`; Dwarven Ballista → `dwarven-ballista` / `dwarven-ballista`; Dwarven Centurion → `dwarven-centurion` / `dwarven-centurion`.

  **Rewards in each system's catalog:** Miraak's Sword (elder-scrolls-2e.miraaks-sword · grimscrolls.miraaks-sword); Miraak's Staff (elder-scrolls-2e.miraaks-staff); Miraak's Mask (elder-scrolls-2e.miraaks-mask); Miraak's Robes (elder-scrolls-2e.miraaks-robes); A Black Book (grimscrolls.black-book); Deathbrand Armor (elder-scrolls-2e.deathbrand-armor · grimscrolls.deathbrand-armor); Deathbrand Helm (elder-scrolls-2e.deathbrand-helm); Bloodscythe & Soulrender (elder-scrolls-2e.bloodscythe-and-soulrender · grimscrolls.soulrender-and-bloodscythe); Ahzidal (elder-scrolls-2e.ahzidal · grimscrolls.dragon-priest-mask); Dukaan (elder-scrolls-2e.dukaan · grimscrolls.dragon-priest-mask); Zahkriisos (elder-scrolls-2e.zahkriisos · grimscrolls.dragon-priest-mask); Hoarfrost (elder-scrolls-2e.hoarfrost).
