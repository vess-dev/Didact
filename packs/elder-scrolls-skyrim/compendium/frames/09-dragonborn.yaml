body: |-
  ## GM notes

  **Frea** — Storn's daughter, fighting to free her people; joins the party at the Temple and stays to the end. Brave, blunt, devoted to the All-Maker and her father. Becomes the village's shaman after Storn's death.

  Run her as a companion (see Companions) — a named ally, hardier than a rolled one — whose Loyalty starts at 4 — she needs the party. Her trick: once per day, her knowledge of the All-Maker lets an ally re-roll a failed WIL save against fear, charm, or a mind laid under someone else's will.

  Elder Scrolls 2e: 8 HP, 1 Armor, 13 STR, 14 DEX, 13 WIL, Nordic war axe (d8), hunting bow (d6, bulky).

  Grimscrolls: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
source: campaigns/09-dragonborn#frea-skaal-shaman-warrior-companion
