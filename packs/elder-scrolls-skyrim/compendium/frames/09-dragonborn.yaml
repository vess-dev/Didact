mechanics:
  elder-scrolls-2e: {kind: poi}
body: |-
  ## GM notes

  The realm of Hermaeus Mora: an endless library under a sick green sky, built of towering shelves, black water, and drifting pages, arranged in numbered Chapters. Nothing here is alive in any honest sense. **Seekers** drift the stacks; **Lurkers** heave up from the black pools. At its summit stands **Miraak's tower**.
source: campaigns/09-dragonborn#the-place--solstheim--apocrypha
