    abilities:
    - "He commands the dragons of Apocrypha: three are at the summit — Kruziikrel, Relonikiv, and the
      party's own tamed Sahrotaar — and each time he is brought to 0 HP he devours one to heal to full
      HP. Once per combat a foe his sword strikes acts Impaired next round; his staff (3 charges) erupts
      the ground in tentacles (d8, blast; STR save or be slowed)."
    - The discarding (scripted). Miraak cannot be finished while a dragon lives to heal him. Once 
      all three are spent and the party has worn him down to 0 HP again, Hermaeus Mora's tentacles 
      burst up through the floor and kill him outright — narrate the Prince's strike rather than a 
      clean kill.
    impaired_by: [magic]
    critical: he draws the target's soul toward his own — 1d6 WIL, and Miraak regains that many HP.
  grimscrolls:
    category: Named Threats & Legends
    tier: boss
    role: tactician
    sights: a gold mask worked with tentacles
    sounds: your own voice chanting his name
    smells: ink, brine, and old paper
    pools:
    - name: The Sleepers
      dice: 6
      traits: islanders drawn to the standing stones each night to raise his shrines
      moves: [Chant at the Stones, Cultists on the Road]
    - name: His Dragons
      dice: 6
      traits: three, ridden and bent to his will
      moves: [Strafe the Tower, Give Up a Soul to the Master]
    - name: Miraak
      dice: 8
      traits: sword, staff, and a Dragonborn's Voice, on a tower in Apocrypha
      moves: [Bend Will, Take the Soul You Earned]
    fail: '*8d The Temple Rises* — a timer; when it runs dry he walks out of Apocrypha, and Solstheim
      wakes as his.'
    wants: freedom from Hermaeus Mora, and Solstheim again — he fears his patron more than any hero
    note: "A linked challenge (6d + 6d + 8d). Miraak is locked in Apocrypha: the road is a Black Book,
      at Mora's price. While a dragon of his lives, the first time his pool would drop, it doesn't: he
      devours it and rises whole. Cleansing a stone with his own Shout frees its sleepers and gives the
      timer a die back. Mora is watching, and ends whichever champion fails him."
fields:
  role: the First Dragonborn, a Nord dragon-priest of the old cult who turned on his masters and was
    taken into Apocrypha by Hermaeus Mora four thousand years ago
body: |-
  ## GM notes

  **Miraak** — the First Dragonborn, a Nord dragon-priest of the old cult who turned on his masters and was taken into Apocrypha by Hermaeus Mora four thousand years ago. Proud, cold, and certain he is owed the world. He wears a tentacled mask and robes steeped in Mora's influence, and carries a writhing sword and staff. *Stat block under Threats.*

  He fights at his tower's summit, wreathed in green light, his mask and robes drinking spells before they land. Magic against him is Impaired, and the first spell that would harm him each scene simply does not.

  Elder Scrolls 2e: 18 HP, 3 Armor, 13 STR, 13 DEX, 18 WIL, Miraak's Sword (d8), Miraak's Staff (d8, blast).

  Grimscrolls: its card is `grimscrolls.miraak-the-first-dragonborn` (Miraak, the First Dragonborn), in this record's grimscrolls block.
source: campaigns/09-dragonborn#miraak-the-first-dragonborn
