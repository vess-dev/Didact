body: |-
  ## GM notes

  **Storn Crag-Strider** — the Skaal shaman, keeper of the knowledge needed to defeat Miraak and the rite that frees the first stone. He understands from the first that Mora's bargain will cost him his life, and he chooses to pay it so his people are spared. The campaign's heart.

  An aged, peaceful man; his power is rite and lore, not the blade. He works the All-Maker rite that grants the Voice of the Wind (Beat 4) and, in Beat 7, opens his mind to Hermaeus Mora to spare his people, dying as the Prince drains him. A quest-giver and a sacrifice, not a combatant; do not throw him into a fight.

  Elder Scrolls 2e: 6 HP, 8 STR, 8 DEX, 16 WIL, staff (d6).

  Grimscrolls: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
source: campaigns/09-dragonborn#storn-crag-strider-skaal-shaman
