id: dragonborn-hermaeus-mora
type: npc
name: Hermaeus Mora
aliases: [Hermaeus Mora — not a stat block]
knowledge: secret
tags: [dragonborn, cast]
fields: {role: not a stat block}
body: |-
  ## GM notes

  **Hermaeus Mora** — the Demon of Knowledge: a horizon of green tentacles and a thousand eyes, speaking in many overlapping voices. He owns Apocrypha and everything read into it. He uses Miraak, discards Miraak, and would use the party exactly the same way. **Not a fightable stat block** (see below).

  Mora is the realm of Apocrypha itself, not a creature to be fought. He has no HP and takes no damage; he acts by fiat — granting the word to tame Sahrotaar, demanding the Skaal's secrets, killing Storn, killing Miraak. If players insist on attacking him, their blows pass through tentacle and page and water and accomplish nothing, and the eyes only turn to regard them. **He is a force the party bargains with and cannot defeat.** That is the point.
source: campaigns/09-dragonborn#hermaeus-mora--not-a-stat-block
