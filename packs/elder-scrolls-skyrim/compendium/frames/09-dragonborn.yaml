fields:
  role: 'Master Wizard of House Telvanni at Tel Mithryn: brilliant, ancient, and serenely self-absorbed'
body: |-
  ## GM notes

  **Neloth** — Master Wizard of House Telvanni at Tel Mithryn: brilliant, ancient, and serenely self-absorbed. He studies the Stones as fascinating problems rather than tragedies, and alone knows where the second Black Book lies. A reliable, profoundly amoral ally.

  Magic against him is Impaired. He casts as a Dragon Priest does — wards, Destruction bolts, summoned aid — and is far more dangerous than his manner suggests. If a player provokes him, remember that he has lived for centuries by outliving everyone who tried.

  Elder Scrolls 2e: 12 HP, 1 Armor, 8 STR, 13 DEX, 18 WIL, staff (d6), Destruction bolt (d8, blast).

  Grimscrolls: its Face is `grimscrolls.master-neloth` (Master Neloth), in this record's grimscrolls block.
source: campaigns/09-dragonborn#neloth-telvanni-master-wizard-ally
