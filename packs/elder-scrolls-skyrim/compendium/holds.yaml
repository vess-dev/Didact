  ## GM notes

  **The capital of the Reach.** **Markarth**, the City of Stone, is built *into* a cliff atop the bones of a vast Dwemer city, all carved stone and rushing falls, dominated by the silver-rich Silver-Blood clan and the mine that feeds them.

  **In the Civil War frame.** (*the Reach*) The City of Stone over its Dwemer bones — *taking the Reach* is the campaign's hardest ground, contested between Legion, Stormcloak, and the ever-present Forsworn.
source: wardens-guide/the-holds#the-reach--capital-markarth
