table: frame-clocks
title: A frame's clocks, by number (the frame generator)
lookup: [frame, n]
source: campaigns/00-intro#how-to-use-these-frames
entries:
  the-main-quest:
    1:
      text: The World-Eater's Hunger
      data:
        id: the-main-quest-the-world-eaters-hunger
        es: true
        gs: pool
        pool: pressure
        dice: 6
        left: 6
        note: "(d6) Alduin's growing power as he resurrects the dead. Ticks once each time a new dragon
          attacks a settlement or a named dragon is resurrected (Mirmulnir, Sahloknir, each random dragon
          the Warden drops on a town), and once whenever the party spends a whole session away from the
          main quest. At 1–3, dragon attacks are rare and the roads are merely dangerous. At 4–5, dragons
          appear at burial mounds and over villages; the dead walk more boldly. At 6, the sky is wrong
          everywhere — dragon attacks are constant background dread until the party reaches Skuldafn.
          The clock stops mattering once the party steps through the portal. (Grimscrolls: roll the pool
          where the clock would tick; at 0d, what the clock's end says happens.)"
    2:
      text: The Blades' Patience
      data:
        id: the-main-quest-the-blades-patience
        es: true
        gs: pool
        pool: pressure
        dice: 4
        left: 3
        note: "(d4, starting at 1) How hard Delphine and Esbern press for Paarthurnax's death. Ticks the
          first time the party meets Paarthurnax, again when they recover the Elder Scroll, and again
          after the Time-Wound. At 4, the Blades issue the ultimatum (see Climax → The Paarthurnax Question)
          and withhold their support until it is answered. (Grimscrolls: roll the pool where the clock
          would tick; at 0d, what the clock's end says happens.)"
    3:
      text: The War in the Way
      data:
        id: the-main-quest-the-war-in-the-way
        es: false
        gs: ''
        pool: ''
        dice: 0
        left: 0
        note: ''
  the-civil-war:
    1:
      text: The Long War
      data:
        id: the-civil-war-the-long-war
        es: true
        gs: pool
        pool: pressure
        dice: 6
        left: 6
        note: "(d6) Ticks each session the war drags on without a Hold changing hands, and whenever a
          truce stalls. At 4, the Thalmor openly \"advise\": Justiciars ride with the Legion's patrols
          and hunt Talos-worshippers in every town, whichever side the party serves. At 6, the Dominion
          has what it wanted — both armies are bled so thin that bandits, Forsworn, and dragons roam the
          Holds unchecked until the war is ended. (Grimscrolls: roll the pool where the clock would tick;
          at 0d, what the clock's end says happens.)"
    2:
      text: Whiterun's Neutrality
      data:
        id: the-civil-war-whiteruns-neutrality
        es: true
        gs: pool
        pool: pressure
        dice: 4
        left: 4
        note: "(d4) Ticks with each mission the party runs before Beat 3. At 4, the Stormcloaks strike
          before the Legion can garrison the city: a Legion party finds Whiterun already fallen and runs
          Beat 4 as the attackers. (A Stormcloak party is the attacker either way — for them the clock
          only measures how much warning Balgruuf has had.) (Grimscrolls: roll the pool where the clock
          would tick; at 0d, what the clock's end says happens.)"
  the-companions:
    1:
      text: The Silver Hand Clock
      data:
        id: the-companions-the-silver-hand-clock
        es: true
        gs: pool
        pool: pressure
        dice: 6
        left: 6
        note: "(d6) How close the hunters are to gutting Jorrvaskr. Advance it when the party kills Silver
          Hand in the open (Gallows Rock, ambush sites), when a beast-blooded PC transforms where it can
          be witnessed and reported, or when the party lingers in Whiterun between barrow-jobs. The hall
          falls when this clock fills (never before Kodlak has sent the party to the Coven in Beat 5)
          or when they return from the Coven, whichever comes first. It is a pressure gauge on the murder
          that will come, not a way to dodge it. (Grimscrolls: roll the pool where the clock would tick;
          at 0d, what the clock's end says happens.)"
    2:
      text: The Harbinger's Hope
      data:
        id: the-companions-the-harbingers-hope
        es: true
        gs: entry
        pool: ''
        dice: 0
        left: 0
        note: ''
  college-of-winterhold:
    1:
      text: The Eye's Hunger
      data:
        id: college-of-winterhold-the-eyes-hunger
        es: true
        gs: pool
        pool: pressure
        dice: 6
        left: 6
        note: "(d6) How far the Eye's power has spread since Ancano seized it. Ticks at the start of each
          session after Beat 5, and whenever the party rests somewhere safe on the road to Labyrinthian.
          At 2, anomalies stalk the town of Winterhold by night; at 4, the townsfolk flee and the Jarl
          blames the College; at 6, the Eye's field swallows the whole spire, and the final fight must
          be fought in a Hall where every Spell Tome forces the duress WIL save. (Grimscrolls: roll the
          pool where the clock would tick; at 0d, what the clock's end says happens.)"
    2:
      text: Ancano's Suspicion
      data:
        id: college-of-winterhold-ancanos-suspicion
        es: true
        gs: pool
        pool: pressure
        dice: 4
        left: 4
        note: "(d4) Before Beat 5, ticks each time the party openly pries into Ancano's business or brings
          him news of the Eye. At 4, he moves early: Beat 5 begins at once, before the party has the Oculory's
          answer. (Grimscrolls: roll the pool where the clock would tick; at 0d, what the clock's end
          says happens.)"
  the-thieves-guild:
    1:
      text: The Guild's Luck
      data:
        id: the-thieves-guild-the-guilds-luck
        es: true
        gs: pool
        pool: resource
        dice: 6
        left: 6
        note: "(d6, counting down) Starts at 6. Loses a point whenever a Guild job goes wrong, a member
          is caught or killed, or a session passes without the party moving against Mercer after Beat
          4. At 3, the Cistern empties — only Delvin, Vex, Brynjolf, and Tonilia remain; at 1, Maven cuts
          the Guild loose and the Riften guard raids the Flagon. Returning the Key restores it to 6 at
          once. (Grimscrolls: roll the pool where the clock would tick; at 0d, what the clock's end says
          happens.)"
    2:
      text: Mercer's Head Start
      data:
        id: the-thieves-guild-mercers-head-start
        es: true
        gs: pool
        pool: pressure
        dice: 4
        left: 4
        note: "(d4) After Beat 4, ticks each session the party spends on anything but the hunt. At 4,
          Mercer has the Eyes of the Falmer and is gone from Irkngthand before the party arrives: they
          must chase him to the coast, a ship, and a last stand on the ice. (Grimscrolls: roll the pool
          where the clock would tick; at 0d, what the clock's end says happens.)"
  the-dark-brotherhood:
    1:
      text: The Tenets
      data:
        id: the-dark-brotherhood-the-tenets
        es: true
        gs: pool
        pool: pressure
        dice: 6
        left: 6
        note: "(d6) The Five Tenets forbid betraying the Brotherhood, disobeying the Night Mother, and
          the like. Tick when the party flagrantly breaks faith — refusing a named contract, harming the
          coffin, turning on family. At 6, the Wrath of Sithis falls: an unseen spectral assassin hunts
          the offender (use Astrid's block, hostile) until the debt is paid in blood. (Reset on a sincere
          act of atonement at the Night Mother's coffin.) (Grimscrolls: roll the pool where the clock
          would tick; at 0d, what the clock's end says happens.)"
    2:
      text: Suspicion
      data:
        id: the-dark-brotherhood-suspicion
        es: true
        gs: pool
        pool: pressure
        dice: 4
        left: 4
        note: "(d4, Beats 4–7) Ticks each time a contract is botched loudly, a witness lives, or a Hold's
          guards connect a death to the party. At 4, Commander Maro finds his opening — bring the betrayal
          of Beat 8 forward and make the fire harder. (Grimscrolls: roll the pool where the clock would
          tick; at 0d, what the clock's end says happens.)"
    3:
      text: The Listener's Standing
      data:
        id: the-dark-brotherhood-the-listeners-standing
        es: false
        gs: ''
        pool: ''
        dice: 0
        left: 0
        note: ''
  dawnguard:
    1:
      text: The Tyranny Clock
      data:
        id: dawnguard-the-tyranny-clock
        es: true
        gs: pool
        pool: pressure
        dice: 6
        left: 6
        note: "(d6) How close Harkon comes to the eternal night. Ticks each time the party hands him an
          advantage — a Scroll read in his service, the Bow brought to the castle, a Volkihar victory
          left unanswered. (On the Volkihar track the party is usually advancing this themselves.) At
          6, if the climax has not resolved, Harkon enacts the prophecy: the sun dims over Skyrim, every
          vampire is emboldened, and the final assault begins on his terms. (Grimscrolls: roll the pool
          where the clock would tick; at 0d, what the clock's end says happens.)"
    2:
      text: Serana's Trust
      data:
        id: dawnguard-seranas-trust
        es: true
        gs: entry
        pool: ''
        dice: 0
        left: 0
        note: ''
  dragonborn:
    1:
      text: The Sleepers' Toil
      data:
        id: dragonborn-the-sleepers-toil
        es: true
        gs: pool
        pool: pressure
        dice: 6
        left: 6
        note: "(d6) Ticks each session any of the five outer Stones remains corrupted. At 3, Storn's ward
          over the Skaal Village begins to fail, and a few villagers walk south in their sleep each night.
          At 6, the Temple of Miraak is finished: once per session, Miraak may reach through a sleeping
          PC's dreams (WIL save, or they wake having walked a mile toward the Temple, Deprived). (Grimscrolls:
          roll the pool where the clock would tick; at 0d, what the clock's end says happens.)"
    2:
      text: Mora's Regard
      data:
        id: dragonborn-moras-regard
        es: true
        gs: pool
        pool: pressure
        dice: 4
        left: 4
        note: "(d4) Ticks each time a PC reads a Black Book. At 4, the Prince has marked that reader:
          Seekers find them in their dreams, and one day Mora will ask for something in return — a seed
          for a campaign yet to come. (Grimscrolls: roll the pool where the clock would tick; at 0d, what
          the clock's end says happens.)"
---
