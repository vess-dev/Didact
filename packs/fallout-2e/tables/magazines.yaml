table: magazine-perks
title: What each magazine teaches
lookup: magazine
description: "Each perk magazine by its name (the compendium's), with the perk it teaches: `didact do
  read-magazine` reads it."
source: overseers-guide/perk-magazines#series
entries:
  'Guns and Bullets 1: Hold Steady':
    text: 'Commando: Attacks with an automatic or burst-fire rifle are not Impaired at long range.'
    data: {perk: Commando, id: guns-and-bullets-1}
  'Guns and Bullets 2: The Long Line':
    text: 'Rifleman: Attacks with a non-automatic rifle ignore 1 Armor.'
    data: {perk: Rifleman, id: guns-and-bullets-2}
  'Guns and Bullets 3: Pistol Grip':
    text: 'Gunslinger: Your first pistol attack in any combat is Enhanced.'
    data: {perk: Gunslinger, id: guns-and-bullets-3}
  'Guns and Bullets 4: The Cowboy Special':
    text: 'Cowboy: Attacks with a lever-action rifle or revolver step up one damage die (d6 → d8, cap
      d12).'
    data: {perk: Cowboy, id: guns-and-bullets-4}
  "Guns and Bullets 5: Volunteer's Manual":
    text: 'Grunt: Military-pattern weapons — service rifle, combat rifle, assault rifle, SMGs, combat
      shotgun, grenades — step up one damage die (d6 → d8, cap d12).'
    data: {perk: Grunt, id: guns-and-bullets-5}
  'Guns and Bullets 6: One Shot':
    text: 'Sniper: Ranged attacks against targets that have not yet noticed you are Enhanced.'
    data: {perk: Sniper, id: guns-and-bullets-6}
  'Guns and Bullets 7: The Clean Draw':
    text: 'Sure Shot: Your first ranged attack of any combat is never Impaired.'
    data: {perk: Sure Shot, id: guns-and-bullets-7}
  'Guns and Bullets 8: Reload Drill':
    text: 'Rapid Reload: Reloading a magazine- or cylinder-fed gun never costs you an action. Single-shot
      loaders (black powder, hold-out pistols) still take theirs.'
    data: {perk: Rapid Reload, id: guns-and-bullets-8}
  'Guns and Bullets 9: Follow-Through':
    text: 'Concentrated Fire: Once per combat, when you attack a target you also hit last round, the attack
      is Enhanced.'
    data: {perk: Concentrated Fire, id: guns-and-bullets-9}
  'Guns and Bullets 10: Red Mist':
    text: 'Bloody Mess: Damage you deal that reduces a target to 0 STR is described gruesomely. Its allies
      make an immediate Morale save, and the first such save each combat automatically fails.'
    data: {perk: Bloody Mess, id: guns-and-bullets-10}
  'Guns and Bullets 11: Big Iron':
    text: 'Heavy Gunner: Heavy weapons (minigun, Gatling laser, flamer, and the like) need no brace in
      your hands — your shots are not Impaired for firing unbraced or while moving.'
    data: {perk: Heavy Gunner, id: guns-and-bullets-11}
  'Guns and Bullets 12: Spray and Pray':
    text: 'And Stay Back: When you hit with a shotgun, the target is knocked back 10 feet and makes a
      STR save; on a fail it is knocked down and its next attack is Impaired.'
    data: {perk: And Stay Back, id: guns-and-bullets-12}
  'Guns and Bullets 13: Point and Shoot':
    text: 'Gun Fu: When your ranged attack reduces an enemy to 0 STR, your next ranged attack is Enhanced.'
    data: {perk: Gun Fu, id: guns-and-bullets-13}
  'Guns and Bullets 14: Shield Breaker':
    text: 'Penetrator: Your ranged attacks punch through light cover — shots through glass, thin walls,
      and brush are not Impaired for you.'
    data: {perk: Penetrator, id: guns-and-bullets-14}
  'Guns and Bullets 15: Reload by Feel':
    text: 'Quick Hands: Reloading never costs you an action, even with black-powder guns, and while you
      have a firearm in hand you may re-roll a failed first-round DEX save to act.'
    data: {perk: Quick Hands, id: guns-and-bullets-15}
  'Guns and Bullets 16: The Kill Stroke':
    text: "Better Criticals: When your attack reduces a target to 0 HP and spills into STR, the target's
      Critical Damage save counts as STR −2."
    data: {perk: Better Criticals, id: guns-and-bullets-16}
  'Tesla Science Magazine 1: Focused Beam':
    text: 'Laser Commander: Laser weapons step up one damage die (d6 → d8, cap d12). Fusion cell consumption
      is doubled.'
    data: {perk: Laser Commander, id: tesla-science-magazine-1}
  'Tesla Science Magazine 2: Capacitor Theory':
    text: 'Science!: Energy-weapon attacks are not Impaired at long range for the user. The user can also
      read, understand, and repair pre-war laboratory equipment.'
    data: {perk: Science!, id: tesla-science-magazine-2}
  'Tesla Science Magazine 3: Chain Reaction':
    text: 'Meltdown: When an energy-weapon attack reduces a target to 0 STR, the target explodes at the
      end of the round. Everything within 5 feet takes d6 damage.'
    data: {perk: Meltdown, id: tesla-science-magazine-3}
  'Tesla Science Magazine 4: Half Life':
    text: 'Nuclear Physicist: Fusion cores last twice as long for the user. Weapons the user wields that
      deal radiation damage step up one damage die (d6 → d8, cap d12).'
    data: {perk: Nuclear Physicist, id: tesla-science-magazine-4}
  'Tesla Science Magazine 5: The Mirror Coating':
    text: 'Refractor: You count as having +1 Armor against energy-weapon attacks (up to the cap of 3).'
    data: {perk: Refractor, id: tesla-science-magazine-5}
  'Tesla Science Magazine 6: The Prototype':
    text: 'The Prototype: Once per session, your next energy-weapon attack is Enhanced.'
    data: {perk: The Prototype, id: tesla-science-magazine-6}
  'Tesla Science Magazine 7: Cold Capacitors':
    text: 'Splash Damage: Plasma blast damage ignores 1 Armor, and when you roll the weapon die for how
      many targets a plasma blast catches, roll it twice and keep the higher.'
    data: {perk: Splash Damage, id: tesla-science-magazine-7}
  'Tesla Science Magazine 8: Terminal Analysis':
    text: 'Computer Whiz: Once per session, revive a dead or bricked pre-war terminal given a turn of
      work. The terminal will function for one scene before it dies again.'
    data: {perk: Computer Whiz, id: tesla-science-magazine-8}
  'Grognak the Barbarian 1: Iron Fist':
    text: 'Iron Fist: Unarmed attacks step up one damage die (d4 → d6, cap d12).'
    data: {perk: Iron Fist, id: grognak-the-barbarian-1}
  'Grognak the Barbarian 2: Big Leagues':
    text: 'Big Leagues: Melee attacks with bats, clubs, pipes, and sledges step up one damage die (d6
      → d8, cap d12).'
    data: {perk: Big Leagues, id: grognak-the-barbarian-2}
  'Grognak the Barbarian 3: The Slayer':
    text: 'The Slayer: For one combat per session, your melee attacks are never Impaired.'
    data: {perk: The Slayer, id: grognak-the-barbarian-3}
  'Grognak the Barbarian 4: Piercing Strike':
    text: 'Piercing Strike: Unarmed and melee attacks ignore 1 Armor.'
    data: {perk: Piercing Strike, id: grognak-the-barbarian-4}
  'Grognak the Barbarian 5: The Charge':
    text: 'Blitz: Once per combat, as your action, move up to 30 feet in a straight line beyond your normal
      movement and make one melee attack at the end of it.'
    data: {perk: Blitz, id: grognak-the-barbarian-5}
  'Grognak the Barbarian 6: No Retreat':
    text: 'Pain Train: While wearing power armor, you may spend an action to charge 40 feet; the first
      target you hit takes d10 damage and makes a DEX save — on a fail it is knocked down and its next
      attack is Impaired.'
    data: {perk: Pain Train, id: grognak-the-barbarian-6}
  'Grognak the Barbarian 7: Sunder':
    text: 'Unstoppable Force: Your melee attacks ignore cover — barricades, doorways, furniture — and
      ignore the 1 Armor a shield grants.'
    data: {perk: Unstoppable Force, id: grognak-the-barbarian-7}
  'Grognak the Barbarian 8: Thrown Steel':
    text: 'Heave Ho!: Thrown weapons and grenades have double effective range. Thrown weapons step up
      one damage die (d6 → d8, cap d12).'
    data: {perk: Heave Ho!, id: grognak-the-barbarian-8}
  'Grognak the Barbarian 9: The Open Palm':
    text: 'Paralyzing Palm: Once per combat, when you deal STR damage with an unarmed attack, the target
      makes a STR save or loses its next action, and attacks against it are Enhanced until it acts again.'
    data: {perk: Paralyzing Palm, id: grognak-the-barbarian-9}
  'Massachusetts Surgical Journal 1: Field Medicine':
    text: 'Medic: Stimpaks you apply restore an additional 1d6 STR.'
    data: {perk: Medic, id: massachusetts-surgical-journal-1}
  'Massachusetts Surgical Journal 2: Living Anatomy':
    text: 'Living Anatomy: Once per scene, when you look at a target, the Overseer tells you its current
      HP and one notable weakness.'
    data: {perk: Living Anatomy, id: massachusetts-surgical-journal-2}
  'Massachusetts Surgical Journal 3: Long Life':
    text: 'Life Giver: Gain a permanent +1 maximum HP.'
    data: {perk: Life Giver, id: massachusetts-surgical-journal-3}
  'Massachusetts Surgical Journal 4: Hardened Bones':
    text: 'Adamantium Skeleton: You never roll Broken or Crippled on the Scars table — re-roll those results.'
    data: {perk: Adamantium Skeleton, id: massachusetts-surgical-journal-4}
  'Massachusetts Surgical Journal 5: Gut Tolerance':
    text: 'Lead Belly: You take no Rads from drinking irradiated water or eating irradiated food.'
    data: {perk: Lead Belly, id: massachusetts-surgical-journal-5}
  'Massachusetts Surgical Journal 6: Clean Chemistry':
    text: 'Chem Resistant: Re-roll any failed save against addiction.'
    data: {perk: Chem Resistant, id: massachusetts-surgical-journal-6}
  'Massachusetts Surgical Journal 7: The Genome Table':
    text: 'Starched Genes: Whenever you gain a Rad Scar, you may re-roll the result on the Rad Scars table
      once and take either result.'
    data: {perk: Starched Genes, id: massachusetts-surgical-journal-7}
  'Massachusetts Surgical Journal 8: Fast Metabolism':
    text: 'Fast Metabolism: Once per day, when you restore HP from a short rest, you also heal 1 STR.'
    data: {perk: Fast Metabolism, id: massachusetts-surgical-journal-8}
  'Massachusetts Surgical Journal 9: Triage':
    text: 'Para Medic: Once per combat, you may stabilize a dying ally or apply a Stimpak to an ally without
      spending your action.'
    data: {perk: Para Medic, id: massachusetts-surgical-journal-9}
  'Live & Love 1: The Right Smile':
    text: 'Black Widow / Lady Killer / Confirmed Bachelor: +1 to Reaction rolls with NPCs attracted to
      you. The Overseer decides who qualifies.'
    data: {perk: Black Widow / Lady Killer / Confirmed Bachelor, id: live-and-love-1}
  'Live & Love 2: The Right Word':
    text: 'Inspirational: Once per scene, speak a short encouragement as an action: one ally within earshot
      may re-roll their next failed save.'
    data: {perk: Inspirational, id: live-and-love-2}
  'Live & Love 3: The Middle Ground':
    text: 'Impartial Mediation: When you stand between two disputing parties, Reaction rolls for both
      shift one step better.'
    data: {perk: Impartial Mediation, id: live-and-love-3}
  'Live & Love 4: The Good Neighbor':
    text: 'Local Leader: A settlement you have helped accepts you as temporary authority. Free lodging,
      a hireling, or one favor per visit.'
    data: {perk: Local Leader, id: live-and-love-4}
  'Live & Love 5: The Child Whisperer':
    text: 'Child at Heart: Children trust you on sight. Reaction rolls from any child shift one step better.'
    data: {perk: Child at Heart, id: live-and-love-5}
  'Live & Love 6: The Party':
    text: 'Party Boy / Party Girl: Alcohol has no ill effect on you and never causes you morning Fatigue.
      You always know where the party is.'
    data: {perk: Party Boy / Party Girl, id: live-and-love-6}
  "Live & Love 7: The Animal's Ear":
    text: 'Animal Friend: Once per scene, you may parley with a wasteland beast: make a WIL save; on a
      pass, it stands down. Most beasts will leave you alone unless starving.'
    data: {perk: Animal Friend, id: live-and-love-7}
  'RobCo Fun 1: Terminal Theory':
    text: 'Hacker: Once per session, bypass a single pre-war terminal without a save. Doors tied to it
      open.'
    data: {perk: Hacker, id: robco-fun-1}
  'RobCo Fun 2: Tin Man':
    text: 'Robotics Expert: Shut down a non-hostile pre-war robot with a turn of work. Once per combat,
      attempt it on a hostile robot as an action — the robot makes a WIL save to resist.'
    data: {perk: Robotics Expert, id: robco-fun-2}
  'RobCo Fun 3: Pocket Pal':
    text: "Comprehension: Pre-war books and magazines read by you grant a second useful fact (Overseer's
      pick)."
    data: {perk: Comprehension, id: robco-fun-3}
  'RobCo Fun 4: Pip-Pal Techniques':
    text: 'Pip-Pal Techniques: You can coax any damaged Pip-Boy into a limited working state given a Downtime
      Action and common tools.'
    data: {perk: Pip-Pal Techniques, id: robco-fun-4}
  'RobCo Fun 5: Data Dive':
    text: 'Retention: When you read a magazine, you may ask the Overseer one question about the world;
      the Overseer answers honestly as if the magazine contained a relevant article.'
    data: {perk: Retention, id: robco-fun-5}
  'Tumblers Today 1: The Tension Wrench':
    text: 'Infiltrator: Once per scene, bypass a mechanical lock without a lockpick.'
    data: {perk: Infiltrator, id: tumblers-today-1}
  'Tumblers Today 2: The Soft Step':
    text: "Light Step: Once per scene, when you would set off a mine or pressure plate, you don't."
    data: {perk: Light Step, id: tumblers-today-2}
  'Tumblers Today 3: The Shadow Walk':
    text: 'Sneak: Once per scene, you may re-roll a failed DEX save to move unnoticed.'
    data: {perk: Sneak, id: tumblers-today-3}
  'Tumblers Today 4: The Long Shadow':
    text: 'Silent Running: You can run at full pace without breaking stealth.'
    data: {perk: Silent Running, id: tumblers-today-4}
  'Tumblers Today 5: The Back Door':
    text: 'Locksmith: Open any mundane physical lock in a single turn with lockpicks.'
    data: {perk: Locksmith, id: tumblers-today-5}
  'Tumblers Today 6: Empty Pockets':
    text: "Pickpocket: You can lift a small item from a humanoid's pocket with a DEX save. On a success,
      the target does not notice until a full minute later."
    data: {perk: Pickpocket, id: tumblers-today-6}
  'Tumblers Today 7: The Night Walk':
    text: 'Ninja: Your first melee attack from stealth is Enhanced and ignores 1 Armor.'
    data: {perk: Ninja, id: tumblers-today-7}
  'Tumblers Today 8: The Sleeping City':
    text: 'Mister Sandman: Attacks against sleeping, unconscious, or restrained targets are Enhanced and
      silent — they do not wake nearby enemies or trigger encounter rolls.'
    data: {perk: Mister Sandman, id: tumblers-today-8}
  'Tales of a Junktown Jerky Vendor 1: The Long Scale':
    text: 'Cap Collector: Items you sell fetch 25% more caps than usual. Every merchant recognizes you.'
    data: {perk: Cap Collector, id: tales-of-a-junktown-jerky-vendor-1}
  'Tales of a Junktown Jerky Vendor 2: The Barter Eye':
    text: 'Fortune Finder: Find an extra 1d10 caps when searching any lootable room or body.'
    data: {perk: Fortune Finder, id: tales-of-a-junktown-jerky-vendor-2}
  'Tales of a Junktown Jerky Vendor 3: The Old Route':
    text: 'Traveler / Explorer: Automatically discover one hidden point of interest per region explored.
      The Overseer chooses which.'
    data: {perk: Traveler / Explorer, id: tales-of-a-junktown-jerky-vendor-3}
  'Tales of a Junktown Jerky Vendor 4: The Stockpile':
    text: 'Scrounger: Find one extra box of usable ammo whenever a ruin encounter would yield any.'
    data: {perk: Scrounger, id: tales-of-a-junktown-jerky-vendor-4}
  'Tales of a Junktown Jerky Vendor 5: The Back Room':
    text: 'Master Trader: You always know one specific settlement where any named common item can be bought,
      if it exists anywhere in the region.'
    data: {perk: Master Trader, id: tales-of-a-junktown-jerky-vendor-5}
  'Tales of a Junktown Jerky Vendor 6: Strong Arm':
    text: 'Strong Back: Up to two bulky items you carry take 1 slot each. (Your inventory is still capped
      at 10 slots.)'
    data: {perk: Strong Back, id: tales-of-a-junktown-jerky-vendor-6}
  'Tales of a Junktown Jerky Vendor 7: Light Pack':
    text: 'Packrat: While traveling along paved roads or trails, bulky items you carry count as normal
      (1 slot each).'
    data: {perk: Packrat, id: tales-of-a-junktown-jerky-vendor-7}
  'Wasteland Survival Guide 1: The Deep Breath':
    text: 'Aquaboy / Aquagirl: You cannot drown, and you ignore Rads from swimming.'
    data: {perk: Aquaboy / Aquagirl, id: wasteland-survival-guide-1}
  'Wasteland Survival Guide 2: Rad Shielding':
    text: 'Rad Resistant: Ignore the first Rad you would gain each day.'
    data: {perk: Rad Resistant, id: wasteland-survival-guide-2}
  'Wasteland Survival Guide 3: Rad Metabolism':
    text: 'Rad Absorption: At the end of each day of travel, clear one Rad.'
    data: {perk: Rad Absorption, id: wasteland-survival-guide-3}
  'Wasteland Survival Guide 4: The Wasteland Diet':
    text: 'The Wasteland Diet: Once per day, a meal of wasteland food also clears 1 Fatigue.'
    data: {perk: The Wasteland Diet, id: wasteland-survival-guide-4}
  'Wasteland Survival Guide 5: The Long Walk':
    text: "Long Haul: When you skip a night's sleep to keep traveling, you may consume one extra Ration:
      you do not take Fatigue or become Deprived for the lost sleep."
    data: {perk: Long Haul, id: wasteland-survival-guide-5}
  'Wasteland Survival Guide 6: The Lone Walk':
    text: 'Lone Wanderer: While traveling alone (no PCs, no hirelings, no companions), you cannot be surprised,
      and you gain +1 Armor (up to the cap of 3). The bonus vanishes the instant company arrives.'
    data: {perk: Lone Wanderer, id: wasteland-survival-guide-6}
  'Wasteland Survival Guide 7: The Roadmaster':
    text: 'Trail Sense: You cannot become lost on any path you have traveled before.'
    data: {perk: Trail Sense, id: wasteland-survival-guide-7}
  'Wasteland Survival Guide 8: The Wild Larder':
    text: "Them's Good Eatin': When you Supply for food, roll the bounty die one step higher. You always
      know which wasteland meat is safe."
    data: {perk: Them's Good Eatin', id: wasteland-survival-guide-8}
  'Wasteland Survival Guide 9: The Old Ways':
    text: 'Tribal Wisdom: You take no Rads from eating raw wasteland fauna, and your Supply actions always
      yield at least 1 Ration.'
    data: {perk: Tribal Wisdom, id: wasteland-survival-guide-9}
  'Unstoppables! 1: Iron Jaw':
    text: 'Toughness: +1 Armor, up to the cap of 3.'
    data: {perk: Toughness, id: unstoppables-1}
  'Unstoppables! 2: Quick Reflex':
    text: 'Action Boy / Action Girl: Once per session, take an extra action this round.'
    data: {perk: Action Boy / Action Girl, id: unstoppables-2}
  'Unstoppables! 3: The Daring Escape':
    text: "Grim Reaper's Sprint: Once per combat, when your attack reduces an enemy to 0 STR, immediately
      regain your action this round."
    data: {perk: Grim Reaper's Sprint, id: unstoppables-3}
  'Unstoppables! 4: The Lucky Streak':
    text: 'Four Leaf Clover: Once per combat, re-roll one damage die, taking the higher.'
    data: {perk: Four Leaf Clover, id: unstoppables-4}
  'Unstoppables! 5: The Mysterious Stranger':
    text: 'The Mysterious Stranger: Once per session, after an enemy attacks you, declare that a figure
      in a long coat steps from cover, fires a d12 pistol shot at that enemy, and vanishes before anyone
      turns around.'
    data: {perk: The Mysterious Stranger, id: unstoppables-5}
  'Unstoppables! 6: The Last Stand':
    text: 'Nerd Rage: When your STR drops below 5, you may invoke this perk: your melee and unarmed attacks
      deal Enhanced damage (d12) and you gain +1 Armor (up to the cap of 3) until the end of the scene.'
    data: {perk: Nerd Rage, id: unstoppables-6}
  'Unstoppables! 7: The Wall':
    text: 'Stonewall: You cannot be knocked down, shoved, grappled, or moved against your will by any
      force shorter than a deathclaw.'
    data: {perk: Stonewall, id: unstoppables-7}
  'Unstoppables! 8: The Dive':
    text: 'Hit the Deck: When an explosive is thrown at you and you see it coming, make a DEX save; on
      success you take no damage from it at all.'
    data: {perk: Hit the Deck, id: unstoppables-8}
  'Unstoppables! 9: The Banked Shot':
    text: 'Critical Banker: Once per session, declare that your next attack deals Enhanced damage regardless
      of weapon.'
    data: {perk: Critical Banker, id: unstoppables-9}
  'Unstoppables! 10: Feet on the Ground':
    text: 'Rooted: Once per combat, after you stand still for a full round, your next attack is Enhanced;
      you also gain +1 Armor (up to the cap of 3) until you move again.'
    data: {perk: Rooted, id: unstoppables-10}
  'Unstoppables! 11: Moving Target':
    text: 'Moving Target: When running at full speed, ranged attacks against you are Impaired.'
    data: {perk: Moving Target, id: unstoppables-11}
  'La Coiffe 1: The Cut':
    text: 'The Cut: Reaction rolls shift one step better on first meeting with any NPC who has seen you
      from a distance first.'
    data: {perk: The Cut, id: la-coiffe-1}
  'La Coiffe 2: The Stance':
    text: 'Terrifying Presence: Once per scene, force one humanoid target to make a WIL save or flee.
      Does not work twice on the same target.'
    data: {perk: Terrifying Presence, id: la-coiffe-2}
  'La Coiffe 3: The Mirror Trick':
    text: "The Mirror Trick: Once per session, you may redirect one NPC's hostile attention to a PC companion
      of your choosing at the start of an encounter. The companion must agree. Overseer arbitrates consequences."
    data: {perk: The Mirror Trick, id: la-coiffe-3}
  'Lying, Congressional Style 1: The Flat Denial':
    text: 'Confirmed Liar: Once per scene, when caught in a lie, force a WIL save on the listener. On
      a fail, they accept the lie anyway.'
    data: {perk: Confirmed Liar, id: lying-congressional-style-1}
  'Lying, Congressional Style 2: The Hook':
    text: 'Interrogator: Once per scene, force an unarmed NPC to make a WIL save when you question them.
      On a fail, they tell you one true thing they were hiding.'
    data: {perk: Interrogator, id: lying-congressional-style-2}
  'Lying, Congressional Style 3: The Handshake':
    text: 'The Handshake: Once per session, declare that an NPC owes you a small favor from a pre-war
      business transaction. The Overseer decides the size.'
    data: {perk: The Handshake, id: lying-congressional-style-3}
  'Lying, Congressional Style 4: The Filibuster':
    text: 'The Filibuster: Once per scene, when a hostile NPC is about to act against you in a social
      situation, they make an immediate WIL save; on a fail, your stream of convincing nonsense delays
      them for one round.'
    data: {perk: The Filibuster, id: lying-congressional-style-4}
  'Lying, Congressional Style 5: The Cold Stare':
    text: 'Intimidation: Once per scene, lock eyes with one humanoid target. The target makes a WIL save
      or complies with a single short demand (drop the weapon, back away, open the door). Fail or success,
      they will never forget your face.'
    data: {perk: Intimidation, id: lying-congressional-style-5}
  'Future Retro 1: The Measured Dose':
    text: "Chemist: Your chems last twice as long. As a Downtime Action, you can brew one common chem
      without a Chemistry Station or a chem cook's help."
    data: {perk: Chemist, id: future-retro-1}
  'Future Retro 2: The Safe Edge':
    text: 'The Safe Edge: You may ignore the first negative side effect of any chem you take each session
      (Fatigue, Deprived, nausea).'
    data: {perk: The Safe Edge, id: future-retro-2}
  'Future Retro 3: The Combined Dose':
    text: 'The Combined Dose: You may safely combine two chems at once. The Overseer determines the combined
      effect.'
    data: {perk: The Combined Dose, id: future-retro-3}
  'Future Retro 4: Pyromania':
    text: 'Pyromaniac: Fire and flame weapons you wield step up one damage die (capped at d12). You are
      immune to your own burning attacks.'
    data: {perk: Pyromaniac, id: future-retro-4}
  'Picket Fences 1: The Good Fence':
    text: 'The Good Fence: A settlement you helped build gains +1 Defense against the first raid each
      season.'
    data: {perk: The Good Fence, id: picket-fences-1}
  'Picket Fences 2: The Garden':
    text: 'Green Thumb: You can grow mutfruit or tato in any soil, given a Downtime Action. Yield is enough
      to feed one person per day.'
    data: {perk: Green Thumb, id: picket-fences-2}
  'Picket Fences 3: The Watering Hole':
    text: 'Water Witch: You can find clean water in any location that has any water. A turn of work.'
    data: {perk: Water Witch, id: picket-fences-3}
  'Picket Fences 4: The Workshop':
    text: 'Armorer: Given a Downtime Action and a workbench, you can add one modification to an armor
      piece (e.g., pocket, plate, padding). Overseer decides the effect, which is always small.'
    data: {perk: Armorer, id: picket-fences-4}
  'Picket Fences 5: The Forge':
    text: 'Blacksmith: Given a Downtime Action and a forge, you can add one modification to a melee weapon.
      Overseer decides the effect.'
    data: {perk: Blacksmith, id: picket-fences-5}
  'Total Hack 1: The Subway Route':
    text: 'The Subway Route: Once per session, you may declare that you know a subway or maintenance tunnel
      route between two nearby ruins. The Overseer confirms or adjusts.'
    data: {perk: The Subway Route, id: total-hack-1}
  'Total Hack 2: The Sealed Door':
    text: 'The Sealed Door: Open any single pre-war security door per session without a save or a keycard.'
    data: {perk: The Sealed Door, id: total-hack-2}
  'Total Hack 3: The Listening Post':
    text: 'The Listening Post: You may tap into any active pre-war radio broadcast within a few miles
      and listen in for one scene.'
    data: {perk: The Listening Post, id: total-hack-3}
  'Total Hack 4: The Back Channel':
    text: 'The Back Channel: Once per session, send a one-sentence message to any other PC or known NPC
      within a few miles via intercepted pre-war signals.'
    data: {perk: The Back Channel, id: total-hack-4}
  'Astoundingly Awesome Tales 1: The Mechanical Menace':
    text: 'The Mechanical Menace: Damage against any robot or turret is Enhanced on the first round of
      combat.'
    data: {perk: The Mechanical Menace, id: astoundingly-awesome-tales-1}
  'Astoundingly Awesome Tales 2: The Creeping Horror':
    text: 'Entomologist: Damage against radroaches, bloatflies, stingwings, giant ants, cazadores, and
      other insectoids is Enhanced.'
    data: {perk: Entomologist, id: astoundingly-awesome-tales-2}
  'Astoundingly Awesome Tales 3: The Ghoul Walker':
    text: "Ghoulish: Damage from radiation — a gamma gun, a glowing one's touch, a reactor flare — restores
      that much HP instead of harming you. You still gain Rads normally."
    data: {perk: Ghoulish, id: astoundingly-awesome-tales-3}
  'Astoundingly Awesome Tales 4: The Long Night':
    text: 'Night Person: At night, you may re-roll any failed DEX or WIL save once per scene.'
    data: {perk: Night Person, id: astoundingly-awesome-tales-4}
  'Astoundingly Awesome Tales 5: The Sun Stands High':
    text: 'Solar Powered: During daylight hours in open terrain, you regenerate 1 HP per watch of travel
      and 1 STR per full day of rest in sunlight. Does not function underground, at night, or in heavy
      cloud cover.'
    data: {perk: Solar Powered, id: astoundingly-awesome-tales-5}
  'Astoundingly Awesome Tales 6: The Cold Grave':
    text: "The Cold Grave: Once per session, you may declare that you have seen the thing that's haunting
      the current location before. The Overseer must describe it honestly to you."
    data: {perk: The Cold Grave, id: astoundingly-awesome-tales-6}
  'Astoundingly Awesome Tales 7: The Feast':
    text: 'Cannibal: You can eat the flesh of a humanoid corpse to restore 1d6 STR and clear 1 Fatigue.
      Each time you do, any NPC who witnesses it shifts their Reaction two steps worse — permanently.
      Ghouls and super mutants do not judge. Everyone else does.'
    data: {perk: Cannibal, id: astoundingly-awesome-tales-7}
  'Pioneers of the Wasteland 1: The Sharp Eye':
    text: 'Awareness: Once per scene, when you look directly at a living target for a moment, the Overseer
      tells you its current HP, STR, and one notable trait.'
    data: {perk: Awareness, id: pioneers-of-the-wasteland-1}
  'Pioneers of the Wasteland 2: The Open Road':
    text: 'Travel Light: While outdoors in Easy or Tough terrain, one bulky item you carry takes 1 slot.'
    data: {perk: Travel Light, id: pioneers-of-the-wasteland-2}
  'Pioneers of the Wasteland 3: The Map Hand':
    text: 'Trail Sense II: When lost, you may re-roll the lost check once and take the better result.'
    data: {perk: Trail Sense II, id: pioneers-of-the-wasteland-3}
  'Pioneers of the Wasteland 4: The Steady Foot':
    text: 'Tunnel Runner: Moving through cover or crouched does not slow you.'
    data: {perk: Tunnel Runner, id: pioneers-of-the-wasteland-4}
  'Pioneers of the Wasteland 5: The Sharp Ear':
    text: 'Stealth Girl: When you hide in stillness, you cannot be detected by ordinary patrols unless
      they are actively searching for you.'
    data: {perk: Stealth Girl, id: pioneers-of-the-wasteland-5}
  "The Armorer's Monthly 1: Shotgun Surgery":
    text: "Shotgun Surgeon: Shotgun attacks ignore 1 point of the target's Armor."
    data: {perk: Shotgun Surgeon, id: the-armorers-monthly-1}
  "The Armorer's Monthly 2: Gun Nut":
    text: "Gun Nut: You can build any unique modification to a common weapon during Downtime (Overseer's
      approval on effect). You may also repair any damaged firearm without parts."
    data: {perk: Gun Nut, id: the-armorers-monthly-2}
  "The Armorer's Monthly 3: Armor Up":
    text: 'Jury Rigging: Given a Downtime Action, you can repair any broken item by cannibalizing a similar
      one, regardless of exact match.'
    data: {perk: Jury Rigging, id: the-armorers-monthly-3}
  "The Armorer's Monthly 4: Powder Puncher":
    text: 'Demolition Expert: Thrown explosives and set explosives step up one damage die and always count
      as blast. You never accidentally trigger your own mines.'
    data: {perk: Demolition Expert, id: the-armorers-monthly-4}
  "The Armorer's Monthly 5: Handload":
    text: 'Hand Loader: Given a Downtime Action, craft one box of hand-loaded ammo (3 uses) from common
      components. The first shot you fire from each such box is Enhanced.'
    data: {perk: Hand Loader, id: the-armorers-monthly-5}
  "The Armorer's Monthly 6: Scrapper":
    text: 'Scrapper: Given a Downtime Action in any ruin, you find 1d6 extra Scrap.'
    data: {perk: Scrapper, id: the-armorers-monthly-6}
  "The Armorer's Monthly 7: Weapon Handling":
    text: 'Weapon Handling: A bulky weapon no longer hinders you in the hand — you move, sneak, and climb
      freely while carrying one (its slot cost is unchanged).'
    data: {perk: Weapon Handling, id: the-armorers-monthly-7}
  Almost Perfect:
    text: 'Almost Perfect: When you read it, re-roll the 3d6 for one of your attributes and keep the higher
      total (to a maximum of 18).'
    data: {perk: Almost Perfect, id: almost-perfect}
  The Complete Wasteland Survival Guide:
    text: 'The Complete Wasteland Survival Guide: Regenerate 1 HP per watch of travel. Supply actions
      produce one extra use of whatever they gather.'
    data:
      perk: The Complete Wasteland Survival Guide
      id: the-complete-wasteland-survival-guide
  The Courser's Handbook:
    text: "The Courser's Handbook: Once per session, ask the Overseer, \"Is there a synth in this scene?\"\
      \ and receive an honest answer."
    data: {perk: The Courser's Handbook, id: the-coursers-handbook}
  'Guns and Bullets: The Mysterious Magnum Retrospective':
    text: 'Guns and Bullets: The Mysterious Magnum Retrospective: While you carry the Mysterious Magnum
      (see Unique Weapons), any PC ally in the party dropping below 2 HP triggers the Mysterious Stranger
      effect from Unstoppables! Issue 5 without spending its use. This auto-trigger fires at most once
      per scene.'
    data:
      perk: 'Guns and Bullets: The Mysterious Magnum Retrospective'
      id: guns-and-bullets-the-mysterious-magnum-retrospective
  "Nerd Rage: The Director's Cut":
    text: "Nerd Rage: The Director's Cut: Replaces Unstoppables! Issue 6 if you know it (and uses the
      same Perk Slot). Nerd Rage may be invoked at any STR below your maximum, not just below 5. Your
      melee and unarmed attacks deal Enhanced damage (d12) and you gain +2 Armor (up to the cap of 3)
      until the end of the scene. Once per session while it lasts, damage that would reduce you below
      1 STR leaves you at 1 STR instead."
    data: {perk: "Nerd Rage: The Director's Cut", id: nerd-rage-the-directors-cut}
