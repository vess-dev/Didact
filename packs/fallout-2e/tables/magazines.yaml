  beyond the last issue (Unstoppables! has 11 issues; Grognak, the Massachusetts Surgical Journal, and
  the Wasteland Survival Guide have 9). Guns and Bullets, with 16 issues, is the only series that needs
  a d20; re-roll 17–20. Alternatively, the Overseer may simply pick an issue that fits the room, the NPC,
  or the moment.'
source: roll-tables/perk-magazines#which-issue-d12-within-a-series
