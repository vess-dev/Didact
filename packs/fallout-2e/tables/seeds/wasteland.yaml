# defining feature, local inhabitants and a rumor or legend.
table: wasteland-terrain
title: Wasteland Terrain Type
dice: d10
source: overseers-guide/wasteland-seeds#terrain-type-d10
entries:
  1: Ruined Suburb
  2: Pre-war Highway
  3: Badland Flats
  4: Dead Forest
  5: Irradiated Swamp
  6: Broken Farmland
  7: Glowing Crater
  8: Ashen Hills
  9: Industrial Ruins
  10: Salt Flats
