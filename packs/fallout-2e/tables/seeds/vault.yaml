# Fallout 2e, Overseer's Guide: Vault & Ruin Seeds (CC BY-SA 4.0). The same procedure as
# Cairn's dungeon seeds, so these keep the parent's dungeon-* ids and replace its tables. The
# book's two-column tables are split into one table per column, rolled separately.
table: dungeon-purpose-original-use
title: 'Vault & Ruin Purpose: Original Use'
description: Roll 1d20 for each column (dungeon-purpose-original-use, dungeon-purpose-built-by) and 
  combine the results.
dice: d20
source: overseers-guide/vault-seeds#purpose-roll-1d20-twice
entries:
  1: Vault-Tec Social Experiment (see the example at the end of this chapter)
  2: Nuclear Fallout Shelter, sold to paying families
  3: Research Lab — pharmaceuticals, cybernetics, FEV
  4: Weapons Test Site
  5: Pre-war Corporate Executive Bunker
  6: Biological Containment — FEV, pathogens, patient zero
  7: Military Command & Control
  8: Archive / Records Vault
  9: Robotics Production Line
  10: Power Armor Forge and Test Pit
  11: Hidden Residence for a wealthy pre-war family
  12: High-Security Financial Vault
  13: Dream-Mapping / Psychological Research Facility
  14: Quarantine Isolation Ward
  15: Military Outpost, later squatted
  16: Pre-war Satellite Uplink / Observatory
  17: Pilgrimage Site, Children of Atom–adopted
  18: Relic / Alien Artifact Containment
  19: Rogue Broadcast Transmitter still running
  20: Pre-war Treasure Vault — gold, bullion, patents
---
