table: dungeon-die-drop
title: Vault & Ruin Die Drop Table
description: The face of each room die (6–20 d6) dropped on the vault or ruin's map. Then roll that 
  room type's two tables.
dice: d6
source: overseers-guide/vault-seeds#die-drop-table
entries:
  1:
    text: Monster
    data: {room: monster, what: dungeon-monster-group, detail: dungeon-monster-activity}
  2-3:
    text: Lore
    data: {room: lore, what: dungeon-lore-room-type, detail: dungeon-lore-clue}
  4:
    text: Special
    data: {room: special, what: dungeon-special, detail: dungeon-special-feature}
  5-6:
    text: Trap
    data: {room: trap, what: dungeon-trap, detail: dungeon-trap-trigger}
