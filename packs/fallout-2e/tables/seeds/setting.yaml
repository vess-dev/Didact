# Fallout 2e, Overseer's Guide: Setting Seeds (CC BY-SA 4.0). A region's character, biggest
# threat and biggest opportunity (d10 each), and the d12 faction generator rolled twice
# (identity, then agenda). Placing points of interest and hooking the party have no tables.
table: setting-region-character
title: Region Character
dice: d10
source: overseers-guide/setting-seeds#region-character-d10
entries:
  1: Crossroads — caravans everywhere
  2: Border — two big factions eye each other
  3: Frontier — new settlements pushing outward
  4: Aftermath — a recent disaster has reshaped the region
  5: Isolated — no major roads in or out
  6: Besieged — a single threat dominates everything
  7: Booming — a recent discovery is drawing settlers
  8: Dying — the region is losing people every year
  9: Signal-sick — the radio, the terminals, or the water carries something wrong
  10: Forgotten — nobody on the outside has heard of this place
---
table: setting-threat
title: Biggest Threat
dice: d10
source: overseers-guide/setting-seeds#biggest-threat-d10
entries:
  1: A deathclaw pack lairing in the central ruin
  2: A raider warband under a charismatic chief
  3: A super mutant crusade
  4: A feral ghoul outbreak
  5: An Enclave recon operation
  6: A rogue pre-war AI broadcasting orders
  7: A chem cartel poisoning settlements
  8: A dying reactor leaking Rads into the water
  9: A cult with a prophecy about a specific date
  10: A synth infiltration nobody has proved yet
---
table: setting-opportunity
title: Biggest Opportunity
dice: d10
source: overseers-guide/setting-seeds#biggest-opportunity-d10
entries:
  1: A sealed vault with working systems
  2: A working water purifier plant
  3: A cache of fusion cores
  4: A pre-war library with intact records
  5: A lost caravan of trade goods
  6: An undisturbed pre-war military armory
  7: A grove of mutfruit, the only one for miles
  8: An auto-doc nobody else knows about
  9: A functioning pre-war radio broadcasting tower
  10: A map to a dozen smaller scores
---
table: setting-faction-identity
title: 'Faction Generator: Identity'
description: Roll 1d12 for each column (setting-faction-identity, setting-faction-agenda) and 
  combine the results.
dice: d12
source: overseers-guide/setting-seeds#faction-generator-d12-twice
entries:
  1: A caravan company (Crimson, Gun Runners, Happy Trails)
  2: A Minuteman-style settler militia
  3: A raider crew flying a spiked banner
  4: A Brotherhood of Steel chapter
  5: A desert tribe or canyon clan
  6: A Children of Atom cell
  7: An Enclave remnant operating in secret
  8: A ghoul community keeping their heads down
  9: A Railroad station, quietly moving synths
  10: A super mutant enclave, peaceful or otherwise
  11: An NCR or Legion frontier element
  12: A Followers of the Apocalypse clinic
---
table: setting-faction-agenda
title: 'Faction Generator: Agenda'
description: Roll 1d12 for each column (setting-faction-identity, setting-faction-agenda) and 
  combine the results.
dice: d12
source: overseers-guide/setting-seeds#faction-generator-d12-twice
entries:
  1: Trade monopoly
  2: Independence and mutual defense
  3: Tribute from the highways
  4: Pre-war technology recovery
  5: Sacred ground and ancestral claim
  6: A glowing prophecy about a specific date
  7: Orders from a pre-war chain of command
  8: Survival and recognition as people
  9: Escape routes and cover identities
  10: Territory and respect
  11: Expansion of the old flag
  12: Medicine, knowledge, a safer tomorrow
