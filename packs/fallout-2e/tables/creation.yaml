# Fallout 2e, Overseer's Guide: Creating Monsters (CC BY-SA 4.0). The book's four two-column
# tables, one table per column, under the parent's monster-* ids (they replace Cairn's, so
# the monster generator rolls these). Cairn's conversion lookups (monster-morale-to-wil,
# monster-saving-throw) have no Fallout counterpart: pack.yaml hides them.
table: monster-physique
title: 'Monster appearance: physique'
description: Roll 1d20 for each column (monster-physique, monster-feature) and combine the results.
dice: d20
source: overseers-guide/creating-monsters#appearance-roll-1d20-twice
entries:
  1: Albino
  2: Armored
  3: Bloated
  4: Emaciated
  5: Eyeless
  6: Fibrous
  7: Gelatinous
  8: Glowing
  9: Hardened
  10: Headless
  11: Hunched
  12: Iridescent
  13: Leaking
  14: Multi-eyed
  15: Scaled
  16: Segmented
  17: Skeletal
  18: Slimy
  19: Translucent
  20: Twisted
