# Crafting recipes (players-guide/crafting): generated by fo_crafting.py; do not edit by hand.
table: recipes
title: Crafting recipes
lookup: recipe
description: 'Every recipe in Crafting, by name: what it needs (station, Scrap, caps, Downtime Actions)
  and what it makes, for `didact do craft who=<pc> recipe=<name>`. Chems cost 2d6 × `cost_x` caps of reagents
  and yield 1d4 doses; ammo makes up to three batches of one line a Downtime Action.'
source: players-guide/crafting#crafting
entries:
