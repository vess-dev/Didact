# Settlement buildings (overseers-guide/settlements): generated by fo_crafting.py; do not edit by hand.
table: settlement-buildings
title: Settlement buildings
lookup: building
description: "The building menu, by name: what each does, the attribute it raises, whether it's petty
  (no slot) or needs power, for `didact do build`. The Overseer may invent new ones."
source: overseers-guide/settlements#building-slots
entries:
  Walls & Gate:
    text: 'Walls & Gate: +1 Defense. Required for any Defense above 2.'
    data:
      category: Defense
      raises: defense
      effect: +1 Defense. Required for any Defense above 2.
  Watchtowers:
    text: 'Watchtowers: +1 Defense if paired with Walls. Settlers post rotating lookouts; raids are detected
      one watch early.'
    data:
      category: Defense
      effect: +1 Defense if paired with Walls. Settlers post rotating lookouts; raids are detected 
        one watch early.
  Guard Post:
    text: 'Guard Post: +1 Defense. A named settler with a gun and a shift schedule. Militia upgrades one
      weapon tier.'
    data:
      category: Defense
      raises: defense
      effect: +1 Defense. A named settler with a gun and a shift schedule. Militia upgrades one 
        weapon tier.
  Turret Line:
    text: 'Turret Line: +1 Defense. Requires Power Generator. Laser and heavy variants cost an extra Downtime
      Action to install.'
    data:
      category: Defense
      variants: pipe, laser, or heavy
      raises: defense
      power: true
      effect: +1 Defense. Requires Power Generator. Laser and heavy variants cost an extra Downtime 
        Action to install.
  Armory:
    text: "Armory: +1 Defense. Militia upgrades one weapon tier, and the party may draw one free common
      weapon (Overseer's pick from the Marketplace) once per visit (limit 1 per PC per season)."
    data:
      category: Defense
      raises: defense
      effect: +1 Defense. Militia upgrades one weapon tier, and the party may draw one free common 
        weapon (Overseer's pick from the Marketplace) once per visit (limit 1 per PC per season).
  Farm Plots:
    text: 'Farm Plots: +1 Industry. Rations are free for the party in good standing. Failed crops on an
      Extreme weather week.'
    data:
      category: Production & Industry
      variants: mutfruit, tato, corn, razorgrain
      raises: industry
      effect: +1 Industry. Rations are free for the party in good standing. Failed crops on an 
        Extreme weather week.
  Brahmin Pen:
    text: 'Brahmin Pen: +1 Population. Caravans stop here for free. Settlement feeds itself.'
    data:
      category: Production & Industry
      raises: population
      effect: +1 Population. Caravans stop here for free. Settlement feeds itself.
  Water Pump:
    text: 'Water Pump: +1 Industry at 1 Population. Provides unlimited dirty water; add a purifier to
      make it clean.'
    data:
      category: Production & Industry
      variants: hand-cranked
      effect: +1 Industry at 1 Population. Provides unlimited dirty water; add a purifier to make it
        clean.
  Industrial Water Purifier:
    text: 'Industrial Water Purifier: +1 Industry. Clears 1 Rad per day from anyone who drinks here. Produces
      trade-grade purified water as a resource.'
    data:
      category: Production & Industry
      variants: RobCo or pre-war water chip
      raises: industry
      effect: +1 Industry. Clears 1 Rad per day from anyone who drinks here. Produces trade-grade 
        purified water as a resource.
  Scrap Heap:
    text: 'Scrap Heap: +1 Industry. Passive trickle: settlers deliver 1d6 Scrap each visit.'
    data:
      category: Production & Industry
      raises: industry
      effect: '+1 Industry. Passive trickle: settlers deliver 1d6 Scrap each visit.'
  Junk Fence:
    text: 'Junk Fence: A broker who buys salvage at 60% value with no questions asked. Stacks with a Trading
      Post.'
    data:
      category: Production & Industry
      variants: trader outpost
      effect: A broker who buys salvage at 60% value with no questions asked. Stacks with a Trading 
        Post.
  Power Generator:
    text: 'Power Generator: Powers one (small), three (medium), or six (core) electric buildings per week.
      Required for turrets, lit signs, workshops, and most advanced crafting.'
    data:
      category: Production & Industry
      variants: small, medium, or fusion-core
      effect: Powers one (small), three (medium), or six (core) electric buildings per week. 
        Required for turrets, lit signs, workshops, and most advanced crafting.
  Lit Signs & Streetlamps:
    text: 'Lit Signs & Streetlamps: petty building. Requires power. Reaction rolls in the settlement shift
      one step better on first visit; against night raids, the settlement gains +1 Defense.'
    data:
      category: Production & Industry
      petty: true
      power: true
      effect: petty building. Requires power. Reaction rolls in the settlement shift one step better
        on first visit; against night raids, the settlement gains +1 Defense.
  Weapons Workbench:
    text: "Weapons Workbench: +1 Industry. Unlocks the Craft Downtime Action for ammo, explosives, and
      weapon mods on-site — see the Firearm, Energy, and Melee & Unarmed mod tables in Player's Guide
      → Crafting."
    data:
      category: Crafting & Workshops
      raises: industry
      effect: +1 Industry. Unlocks the Craft Downtime Action for ammo, explosives, and weapon mods 
        on-site — see the Firearm, Energy, and Melee & Unarmed mod tables in Player's Guide → 
        Crafting.
  Armor Workbench:
    text: "Armor Workbench: Unlocks the Craft Downtime Action for light and medium armor mods on-site
      — see the Light & Medium Armor Mods table in Player's Guide → Crafting. Broken armor can also be
      repaired here (see Crafting → Repairs)."
    data:
      category: Crafting & Workshops
      effect: Unlocks the Craft Downtime Action for light and medium armor mods on-site — see the 
        Light & Medium Armor Mods table in Player's Guide → Crafting. Broken armor can also be 
        repaired here (see Crafting → Repairs).
  Power Armor Station:
    text: "Power Armor Station: A T-shaped frame stand. Power armor may be unstowed, rebuilt, or swapped
      between suits here. Required to install Power Armor Mods (see Player's Guide → Crafting). Requires
      Power Generator."
    data:
      category: Crafting & Workshops
      power: true
      effect: A T-shaped frame stand. Power armor may be unstowed, rebuilt, or swapped between suits
        here. Required to install Power Armor Mods (see Player's Guide → Crafting). Requires Power 
        Generator.
  Chemistry Station:
    text: 'Chemistry Station: Unlocks the Craft Downtime Action for chems on-site. A chem cook working
      here pays half the usual reagent cost per batch.'
    data:
      category: Crafting & Workshops
      effect: Unlocks the Craft Downtime Action for chems on-site. A chem cook working here pays 
        half the usual reagent cost per batch.
  Cooking Station:
    text: 'Cooking Station: Raw meat from the bestiary becomes edible Rations. A Cooking Station attached
      to a Farm Plot makes one Ration free to every settler per day.'
    data:
      category: Crafting & Workshops
      effect: Raw meat from the bestiary becomes edible Rations. A Cooking Station attached to a 
        Farm Plot makes one Ration free to every settler per day.
  Clinic:
    text: 'Clinic: Settlers heal Attributes in three days instead of seven. Stimpaks available for half
      price. A visiting PC may roll a single Cure an Addiction attempt here for free.'
    data:
      category: Social & Amenities
      effect: Settlers heal Attributes in three days instead of seven. Stimpaks available for half 
        price. A visiting PC may roll a single Cure an Addiction attempt here for free.
  Bar / Saloon:
    text: "Bar / Saloon: Settler spirits lift; the rumor mill runs. Reaction rolls on first visit shift
      one step better. The party may always hear a fresh rumor here, Overseer's pick."
    data:
      category: Social & Amenities
      effect: Settler spirits lift; the rumor mill runs. Reaction rolls on first visit shift one 
        step better. The party may always hear a fresh rumor here, Overseer's pick.
  General Store:
    text: 'General Store: +1 Industry. Merchant restocks when the party visits. Party may sell one unused
      loot item at full market price once per session.'
    data:
      category: Social & Amenities
      raises: industry
      effect: +1 Industry. Merchant restocks when the party visits. Party may sell one unused loot 
        item at full market price once per session.
  Trading Post:
    text: 'Trading Post: +1 Industry. Full caravan turnaround — caravans route through this settlement
      automatically. Pairs with Brahmin Pen for compound effect.'
    data:
      category: Social & Amenities
      raises: industry
      effect: +1 Industry. Full caravan turnaround — caravans route through this settlement 
        automatically. Pairs with Brahmin Pen for compound effect.
  Jukebox / Radio Set:
    text: 'Jukebox / Radio Set: petty building. A pre-war radio that plays Diamond City Radio, Galaxy
      News Radio, or whatever the Overseer decides. Settlement detachments automatically pass their first
      Morale save per raid.'
    data:
      category: Social & Amenities
      petty: true
      effect: petty building. A pre-war radio that plays Diamond City Radio, Galaxy News Radio, or 
        whatever the Overseer decides. Settlement detachments automatically pass their first Morale 
        save per raid.
  Shrine / Meeting Hall:
    text: "Shrine / Meeting Hall: The settlement's culture hardens. The town automatically passes WIL
      saves against panic during raids. A PC may use this as the target of a Downtime Strengthening Ties
      action with the whole settlement."
    data:
      category: Social & Amenities
      effect: The settlement's culture hardens. The town automatically passes WIL saves against 
        panic during raids. A PC may use this as the target of a Downtime Strengthening Ties action 
        with the whole settlement.
  Schoolhouse:
    text: 'Schoolhouse: +1 Population over the next season. Children grow up literate enough to read a
      terminal.'
    data:
      category: Social & Amenities
      effect: +1 Population over the next season. Children grow up literate enough to read a 
        terminal.
  Picnic Area / Gardens:
    text: "Picnic Area / Gardens: petty building. Settler spirits lift, and a night's rest here counts
      as a full night's safe sleep (clears Fatigue) even when the settlement is under threat."
    data:
      category: Social & Amenities
      petty: true
      effect: petty building. Settler spirits lift, and a night's rest here counts as a full night's
        safe sleep (clears Fatigue) even when the settlement is under threat.
  Beds:
    text: 'Beds: +1 Population cap. Without enough beds, new settlers do not stay.'
    data:
      category: Housing & Infrastructure
      variants: barracks
      effect: +1 Population cap. Without enough beds, new settlers do not stay.
  Private Cottages:
    text: 'Private Cottages: +1 Population, costs a full slot but settlers are more loyal; population
      cannot drop below 1 from a single raid.'
    data:
      category: Housing & Infrastructure
      raises: population
      effect: +1 Population, costs a full slot but settlers are more loyal; population cannot drop 
        below 1 from a single raid.
  Recruitment Radio Beacon:
    text: 'Recruitment Radio Beacon: +1 Population per season. Broadcasts a pre-war signal. Faction patrols
      (good and bad) take notice.'
    data:
      category: Housing & Infrastructure
      effect: +1 Population per season. Broadcasts a pre-war signal. Faction patrols (good and bad) 
        take notice.
  Observation Post:
    text: 'Observation Post: Raids are detected a full day early. The settlement may prepare — a prepared
      settlement automatically repels any raid rated below its Defense.'
    data:
      category: Signal & Command
      effect: Raids are detected a full day early. The settlement may prepare — a prepared 
        settlement automatically repels any raid rated below its Defense.
  Faction Liaison Office:
    text: 'Faction Liaison Office: Choose a friendly faction. The settlement counts as one reputation
      step better with that faction, and one step worse with the opposed faction.'
    data:
      category: Signal & Command
      effect: Choose a friendly faction. The settlement counts as one reputation step better with 
        that faction, and one step worse with the opposed faction.
  Holotape Archive:
    text: 'Holotape Archive: A library of recovered holotapes. A PC spending a Downtime Action here may
      attempt a Research action without needing to find a new Source first.'
    data:
      category: Signal & Command
      effect: A library of recovered holotapes. A PC spending a Downtime Action here may attempt a 
        Research action without needing to find a new Source first.
  Training Yard:
    text: 'Training Yard: +1 Defense. Militia drill weekly. Any PC who spends a Downtime Action here may
      pick up a single signature combat technique (a named maneuver tied to a specific weapon type) from
      the resident sergeant.'
    data:
      category: Signal & Command
      raises: defense
      effect: +1 Defense. Militia drill weekly. Any PC who spends a Downtime Action here may pick up
        a single signature combat technique (a named maneuver tied to a specific weapon type) from 
        the resident sergeant.
  Memorial:
    text: 'Memorial: petty building. A list of settlers lost, carved in metal or stone. Settlers hold
      together after a raid — population loss from a critically bad raid is halved, rounded up.'
    data:
      category: Signal & Command
      petty: true
      effect: petty building. A list of settlers lost, carved in metal or stone. Settlers hold 
        together after a raid — population loss from a critically bad raid is halved, rounded up.
