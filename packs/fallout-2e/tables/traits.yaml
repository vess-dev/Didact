table: bonds
title: Bonds
dice: d20
source: players-guide/character-creation#7-bonds
entries:
  1:
    text: A dead uncle left you a Gold-Plated Bar (400 caps, heavy, cold). The note that came with 
      it said, "Spend it and they will find you."
    data:
      name: Gold-Plated Bar
      gear:
      - {name: Gold-Plated Bar, note: '400 caps, heavy, cold'}
  2:
    text: You were mailed a Pre-war Compass (petty) that always points toward something deep in the 
      Glow. You don't know what. Take 15 caps.
    data:
      name: Pre-war Compass
      gear:
      - name: Pre-war Compass
        size: petty
        note: always points toward something deep in the Glow
      caps: 15
  3:
    text: You carry a Cracked Locket (petty) with a faded photograph of someone you loved. They went
      into the tunnels ten years ago. You think they're still alive down there.
    data:
      name: Cracked Locket
      gear:
      - name: Cracked Locket
        size: petty
        note: a faded photograph of someone who went into the tunnels
  4:
    text: You found a Reflective Shard (petty) in the sand. Hold it to sunlight and you see a place 
      you've never been — a cold corridor lit in green. Sometimes something looks back.
    data:
      name: Reflective Shard
      gear:
      - {name: Reflective Shard, size: petty}
  5:
    text: You pulled a trader out of a canyon flood once. She gave you a Dog Whistle. Blow it near 
      water, and a scarred mongrel will find you. Once.
    data:
      name: Dog Whistle
      gear:
      - name: Dog Whistle
        size: petty
        note: blow it near water, and a scarred mongrel will find you, once
  6:
    text: You inherited a Journal from your father. It writes itself at night — in his handwriting, 
      in his voice, describing your day. It is never wrong.
    data:
      name: The Journal That Writes Itself
      gear:
      - {name: Journal, note: "writes itself at night, in your father's hand"}
  7:
    text: You carry half of a Vault-Tec Master Key (petty). They say joined with its twin, it opens 
      any door in any vault.
    data:
      name: Half a Vault-Tec Master Key
      gear:
      - {name: Vault-Tec Master Key (half), size: petty}
  8:
    text: You received a Letter (petty) claiming you are the heir of one of the pre-war families 
      that built the Enclave. It names a meeting place, three months out, deep in the ashlands.
    data:
      name: Letter of Enclave Heirship
      gear:
      - name: Letter
        size: petty
        note: names you heir of an Enclave family; a meeting place, three months out
  9:
    text: You owe a debt to a local boss. You carry their Brass Token (petty). It's protection — and
      it's a leash.
    data:
      name: Brass Token
      gear:
      - {name: Brass Token, size: petty, note: "a local boss's: protection, and a leash"}
  10:
    text: You were dosed with an experimental pre-war nanite culture during a botched lab raid. It 
      talks to you in your head in a clipped corporate voice and wants to be taken to its parent 
      facility. It occupies one slot but clears 1 Rad each day. It wants you alive — for now.
    data:
      name: Nanite Culture
      gear:
      - {name: Nanite Culture, note: occupies one slot; clears 1 Rad each day}
  11:
    text: A drunk at the crossroads told you a ruined facility holds a working fusion core the size 
      of a fist. He drew you A Wrinkled Map (petty). It's marked with a red circle.
    data:
      name: Wrinkled Map
      gear:
      - {name: Wrinkled Map, size: petty, note: a red circle round a ruined facility}
  12:
    text: You met a dying courier in a ditch. They asked you to deliver a Sealed Envelope (petty) to
      a woman known only as The Listener, somewhere in the southern glowstates.
    data:
      name: Sealed Envelope for The Listener
      gear:
      - name: Sealed Envelope
        size: petty
        note: for a woman known only as The Listener
  13:
    text: You once left a wounded yao guai in a gully. You still see it, sometimes, in the corner of
      your eye — a trick of post-traumatic wiring, your settlement's medic said. You cannot become 
      Panicked when alone.
    data: {name: The Wounded Yao Guai}
  14:
    text: You promised a child in your settlement you'd bring back something no one had ever seen. 
      Take a Bottle-Cap Charm (petty) they pressed into your hand.
    data:
      name: Bottle-Cap Charm
      gear:
      - {name: Bottle-Cap Charm, size: petty}
  15:
    text: A pre-war auto-doc mistook you for a different patient and installed a Lead Battery Cell 
      in your chest. It grows heavier by one slot each month. Until it is removed by someone who 
      knows what they're doing, you cannot truly die — the cell is keeping your heart beating.
    data:
      name: Lead Battery Cell
      gear:
      - name: Lead Battery Cell
        size: petty
        note: 'in your chest; its weight is the burden counter: one slot more each month'
      burden: 1
  16:
    text: You pulled a Rifle Bullet (petty) from a mass grave and wear it on a cord. It's still 
      warm. Held against a fresh wound, it keeps the wearer from bleeding out for one extra hour 
      beyond any Scar's normal timer. Once per session. You can feel it watching you.
    data:
      name: Rifle Bullet
      gear:
      - name: Rifle Bullet
        size: petty
        note: on a cord; once per session, held to a fresh wound, an extra hour before any Scar's 
          timer kills
  17:
    text: The Minutemen did your family a service and left you a dried Blue Petal (petty) as 
      payment. When it turns black, the favor is called in.
    data:
      name: Blue Petal
      gear:
      - name: Blue Petal
        size: petty
        note: dried; when it turns black, the Minutemen call in the favor
  18:
    text: A wandering musician stayed with your family one winter and left behind A Small Guitar. 
      Something rattles inside that isn't a tuning peg.
    data:
      name: Small Guitar
      gear:
      - {name: Small Guitar, note: something rattles inside}
  19:
    text: A white crow landed on your windowsill in a dream and dropped a Bone Splinter (petty). You
      woke with it in your hand. It smells faintly of sulfur. Lucky, maybe.
    data:
      name: Bone Splinter
      gear:
      - {name: Bone Splinter, size: petty, note: smells faintly of sulfur}
  20:
    text: You were in the wrong place when a pre-war experiment on perception-altering chemistry 
      leaked. Glass nearby you cracks when you are under stress. The pieces, when you pick them up, 
      sometimes show you a frame of something that hasn't happened yet.
    data: {name: The Cracking Glass}
---
table: omens
title: Omens
dice: d20
source: players-guide/character-creation#8-omens
entries:
  1:
    text: The river that feeds three settlements has turned black and sour. An old prospector blames
      a ruin the kids have started exploring.
    data: {name: The Black River}
  2:
    text: Rad storms have arrived a full season early. Lightning patterns etched into metal roofs 
      look almost like a map.
    data: {name: The Early Storms}
  3:
    text: A pre-war hospital's automated PA system came back online last week. Every morning at 0600
      it announces a surgery scheduled for Dr. Halsey in Operating Room 3. Anyone who answers the 
      announcement does not come back out.
    data: {name: Surgery for Dr. Halsey}
  4:
    text: Caravan guards in the south say lights in the sky are taking brahmin out of the fields. A 
      Zetan scout party is operating in the region. Nobody wants to say the word alien out loud.
    data: {name: Lights in the Sky}
  5:
    text: The birds have left the eastern wastes. Hunters report a tall, thin grey figure standing 
      on ridges at dusk, watching. It does not move when shot at.
    data: {name: The Grey Watcher}
  6:
    text: A pre-war Nuka-Cola vending machine in a ruined subway has begun dispensing Nuka-Cola 
      Quantum again. Fresh. Nobody has found the mechanism inside. Pilgrims are already gathering.
    data: {name: The Quantum Machine}
  7:
    text: A constant distant hum is keeping a whole town awake. Tinkers say the frequency matches an
      Institute relay signal. It's getting louder each week. It is also coming closer.
    data: {name: The Hum}
  8:
    text: The oldest mutfruit tree in a farming settlement has started weeping a red sap that tests 
      positive for pre-war motor oil. The settlement's brewer is bottling it. Nobody has asked the 
      brewer what she's doing with it.
    data: {name: The Weeping Tree}
  9:
    text: The moon is going red. A pre-war reactor core beneath the nearest city has begun to bleed.
      The Brotherhood of Steel has already sent a scout.
    data: {name: The Red Moon}
  10:
    text: A rogue pre-war satellite in decaying orbit has begun painting a green laser grid across 
      the night sky. People say they can read the grid. Some of them say they can answer it.
    data: {name: The Laser Grid}
  11:
    text: A night-blooming flower nobody has cataloged is sprouting in the glowing craters. Pilgrims
      from the Children of Atom are harvesting the blooms. They dream afterward, and they do not 
      wake alone.
    data: {name: The Night-Blooming Flower}
  12:
    text: Brahmin in a dozen settlements panic at moonrise. A pre-war Anchorage-era army howls from 
      inside a sealed mountain base each full moon — a loop of a thousand voices that should not be 
      running after two hundred years.
    data: {name: The Howling Mountain}
  13:
    text: Giant ants are boiling out of a pre-war subway station in numbers no nest should hold. The
      settlement downslope has begun to evacuate. Someone is feeding the nest.
    data: {name: The Boiling Nest}
  14:
    text: Hunters who kill a white-furred yao guai are found dead at home a week later. A Legion 
      frumentarius has been sighted in the hills, wearing a yao guai pelt as a cloak.
    data: {name: The White Yao Guai}
  15:
    text: Laughter is coming out of the storm drains of the capital ruin. At night it turns to 
      weeping. A pre-war AI running the city's sewer system has been broadcasting the same recorded 
      child's voice for two centuries. Something else is starting to answer it.
    data: {name: Laughter in the Drains}
  16:
    text: A pre-war Vault-Tec emergency satellite thought dead since 2077 has started broadcasting 
      on Channel 16. The broadcast is a single word — RETURN — repeated in thirty languages, every 
      hour on the hour.
    data: {name: RETURN}
  17:
    text: An old apple tree at the center of a settlement withered overnight. When they cut the 
      trunk open, a functioning Institute synth component was inside — still warm, still ticking. 
      Nobody knows how long it had been growing there.
    data: {name: The Ticking Heartwood}
  18:
    text: A pre-war park statue is leaking a red fluid from its base. An Enclave surveyor tested it 
      and left the same night without his pack. No child has been born in that settlement in a year.
      The fluid smells like FEV.
    data: {name: The Bleeding Statue}
  19:
    text: Wildlife in the region has gone either aggressive or silent. A deathclaw matriarch has 
      moved into a ruined Vault-Tec research site and begun calling the smaller beasts to her. No 
      one who has gone up the hill has come back.
    data: {name: The Matriarch on the Hill}
  20:
    text: 'Every child in the border settlements has started waking at 0317 each night repeating the same
      sentence: "A fire is coming, and it will take everything." The settlement medics blame a leaking
      Institute broadcast. The mothers do not.'
    data: {name: A Fire Is Coming}
