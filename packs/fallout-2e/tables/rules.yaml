# Tables the core rules and procedures roll (players-guide/core-rules, procedures, rad-scars):
# Fallout's Scars, Ruin and Wasteland Events and weather replace Cairn's under the parent's ids,
# so the parent's rules that roll them keep working; the Rad Scars, ghoulification and chem
# tables are new. Hand-written: the rules read their `data`.
table: scars
title: Scars
lookup: hp_lost
description: >-
  Looked up by the HP lost in the attack that took a PC to exactly 0 HP. The book's table stops
  at 12; more HP lost (max HP can pass 12) reads as 12, Doomed. `didact do scar who=<pc> lost=<n>`
  rolls where, which limb or which attribute, and applies it.
source: players-guide/core-rules#scars-table
entries:
  1:
    text: "Close Shave. A round clipped something. Roll 1d6 for where: 1 neck, 2 hand, 3 eye, 4 chest, 5 leg, 6 ear. Then roll 1d6 — if higher than max HP, replace."
    data: {kind: close-shave}
  2:
    text: "Concussed. Your helmet rang like a gong. Describe how you shake it off. Roll 1d6; if higher than max HP, replace."
    data: {kind: concussed}
  3:
    text: "Flung Clear. A blast tossed you through the rubble. You're winded, bruised, and Deprived until you rest a few hours. Then roll 1d6 and add it to max HP."
    data: {kind: flung-clear}
  4:
    text: "Broken. Roll 1d6: 1–2 leg (crushed under debris), 3–4 arm (wrong angle), 5 rib (a raider's rebar), 6 jaw (a ghoul's fist). When mended, roll 2d6; if higher than max HP, replace."
    data: {kind: broken}
  5:
    text: "Rad-Necrotic Wound. Something radioactive got into the cut and it's not healing clean. When it finally clears — RadAway, auto-doc, a pre-war antibiotic — roll 2d6; if higher than max HP, replace."
    data: {kind: rad-necrotic-wound}
  6:
    text: "Scrambled. A nearby mini nuke, a plasma burst, a chem overdose — your head is still rattling. Roll 1d6: 1–2 STR, 3–4 DEX, 5–6 WIL. Roll 3d6; if higher than current value of that attribute, replace."
    data: {kind: scrambled}
  7:
    text: "Crippled. A round to the knee, a super sledge to the hip, or a bear trap that wouldn't let go. You cannot walk unassisted until you get serious medical help. After full recovery, roll 3d6; if higher than max DEX, replace."
    data: {kind: crippled}
  8:
    text: "Burst Eardrums. A frag grenade too close, or the shriek of a Tesla arc. Deaf until extraordinary aid. Make a WIL save; on a success, max WIL +1d4."
    data: {kind: burst-eardrums}
  9:
    text: "Shell-Shocked. Something in your mind comes loose — the sound of an incoming missile, the last radio broadcast from the old world, whatever it was. Roll 3d6; if higher than max WIL, replace."
    data: {kind: shell-shocked}
  10:
    text: "Severed. You lose a limb or an eye (Overseer's choice). A prosthetic or a cybernetic graft in a big settlement can restore some function. Make a WIL save; on a success, max WIL +1d6."
    data: {kind: severed}
  11:
    text: "Bleeding Out. Gut shot. Deprived, immobile. You die in one hour without aid — a Stimpak, a bandage, an auto-doc. On recovery, roll 2d6 and replace your max HP with the result."
    data: {kind: bleeding-out}
  12:
    text: "Doomed. Death breathed on your neck in a pre-war bunker nobody's walked out of. If you fail your next Critical Damage save, you die horribly. If you pass, roll 3d6; if higher than max HP, replace."
    data: {kind: doomed}
  13-999:
    text: "Doomed (the book's table stops at 12 HP lost; more reads as 12). Death breathed on your neck in a pre-war bunker nobody's walked out of. If you fail your next Critical Damage save, you die horribly. If you pass, roll 3d6; if higher than max HP, replace."
    data: {kind: doomed}
---
