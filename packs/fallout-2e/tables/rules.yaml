table: reactions
title: Reactions
description: >-
  2d6 for a stranger whose mood is unclear; party karma adds its value (karma=n). Past the ends,
  the first or last rung.
dice: "2d6 + default(@karma, 0)"
clamp: true
source: players-guide/core-rules#reactions
entries:
  2: Hostile
  3-5: Wary
  6-8: Curious
  9-11: Kind
  12: Helpful
