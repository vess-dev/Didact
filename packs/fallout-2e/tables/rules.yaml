table: weather-effects
title: Weather effects
lookup: weather
description: >-
  What the day's weather does to travel. Rad weather: when Stormy or worse weather hits a region
  that holds a hot zone, it is rad-rain or a rad storm, and the Fatigue it would inflict is a Rad
  instead (the Overseer says so before the party chooses).
source: players-guide/procedures#weather-effects
entries:
  Clear: {text: "Good travel (sunny, overcast, mild).", data: {watches: 0, fatigue: 0, step: 0}}
  Fair: {text: "Good travel (sunny, overcast, mild).", data: {watches: 0, fatigue: 0, step: 0}}
  Cold: {text: "No effect if sheltered or dressed for it; prolonged exposure without shelter is a hazard (chilly): `didact do exposure`.", data: {watches: 0, fatigue: 0, step: 0, exposure: true}}
  Hot: {text: "No effect if sheltered or dressed for it; prolonged exposure without shelter is a hazard (warm): `didact do exposure`.", data: {watches: 0, fatigue: 0, step: 0, exposure: true}}
  Gusty: {text: "No effect if sheltered or dressed for it; prolonged exposure without shelter is a hazard (breezy).", data: {watches: 0, fatigue: 0, step: 0, exposure: true}}
  Dusty: {text: "Add a Fatigue or add +1 watch (dust storm, thunder, driving rain).", data: {watches: 1, fatigue: 0, step: 0, either: true}}
  Harsh: {text: "Add a Fatigue or add +1 watch (dust storm, thunder, driving rain).", data: {watches: 1, fatigue: 0, step: 0, either: true}}
  Stormy: {text: "Add a Fatigue or +1 watch. Terrain difficulty up one step (lightning, flooding, rad-rain).", data: {watches: 1, fatigue: 0, step: 1, either: true, rad_weather: true}}
  Extreme: {text: "Add a Fatigue and +1 watch. Terrain difficulty up one step (blizzard, firestorm, rad storm).", data: {watches: 1, fatigue: 1, step: 1, rad_weather: true}}
  Catastrophic: {text: "Travel impossible for most parties (full rad storm, atomic squall, tidal surge).", data: {impassable: true, rad_weather: true}}
