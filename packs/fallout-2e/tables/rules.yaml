table: dungeon-events
title: Ruin Events
description: >-
  Roll when the party spends more than one exploration cycle in a room, moves hurriedly through
  one, enters a new area, level or zone, or makes a loud disturbance (`didact do dungeon-turn`).
dice: d6
source: players-guide/procedures#ruin-events
entries:
  1: {text: "Encounter: Roll on the encounter table. Possibly hostile — check Reactions.", data: {kind: encounter}}
  2: {text: "Sign: A clue, spoor, scorch mark, old corpse, fresh footprint, or abandoned nest.", data: {kind: sign}}
  3: {text: "Environment: Ceiling collapses, a water pipe bursts, a generator backfires, a radiation leak spreads.", data: {kind: environment}}
  4: {text: "Loss: A torch blows out, a program crashes, a battery dies, a door seals itself. Resolve before moving on.", data: {kind: loss}}
  5: {text: "Exhaustion: The party must rest (triggering another roll on this table), add a Fatigue, or consume a Ration.", data: {kind: exhaustion}}
  6: {text: "Quiet: Safe. For now.", data: {kind: quiet}}
---
table: wilderness-events
title: Wasteland Events
dice: d6
source: players-guide/procedures#wasteland-events
entries:
  1: {text: "Encounter: Roll on the terrain encounter table. Use Reactions.", data: {kind: encounter}}
  2: {text: "Sign: A clue: spent casings, a cold campfire, a distant plume of smoke, an old Pip-Boy recording.", data: {kind: sign}}
  3: {text: "Environment: Weather or terrain shifts.", data: {kind: environment}}
  4: {text: "Loss: A resource cost: a wheel breaks, a water flask cracks, a horse throws a shoe, an ambush forces a detour.", data: {kind: loss}}
  5: {text: "Exhaustion: A barrier: rockfall, deep mud, a collapsed bridge. Spend another Wilderness Action, add a Fatigue, or both.", data: {kind: exhaustion}}
  6: {text: "Discovery: Food, caps, fuel, a secret. The Overseer may reveal the primary feature of the next point instead.", data: {kind: discovery}}
