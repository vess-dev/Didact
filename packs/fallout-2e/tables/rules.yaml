table: rad-scars
title: Rad Scars
description: >-
  When a Rad Scar save fails, roll 1d20: 1–10 is a Minor Rad Scar, 11–20 a Major one. Roll once
  and keep it (`didact do rad-scar-save` rolls and applies it).
dice: d20
source: players-guide/rad-scars#minor-rad-scars-1d20-results-110
entries:
  1: {text: "Patchy Hair Loss. Cosmetic, but strangers stare: −1 to first-meeting Reaction rolls.", data: {name: Patchy Hair Loss, grade: minor}}
  2: {text: "Radiation Burns. A stretch of skin is permanently raw and pink. −1 max HP.", data: {name: Radiation Burns, grade: minor, hp: -1}}
  3: {text: "Cracked Teeth. Chronic pain. −1 max WIL.", data: {name: Cracked Teeth, grade: minor, WIL: -1}}
  4: {text: "Rotgut. One day each week, you are Deprived unless you drink purified water.", data: {name: Rotgut, grade: minor}}
  5: {text: "Shakes. When Deprived, ranged attacks are Impaired.", data: {name: Shakes, grade: minor}}
  6: {text: "Tumored. A visible soft growth has appeared somewhere on your body (Overseer picks where). It does not hurt. It makes fitted armor sit wrong — any body armor you wear provides 1 less Armor (minimum 0) until it has been re-cut around the growth at an Armor Workbench (one Craft action and 1 Scrap per suit). Strangers notice.", data: {name: Tumored, grade: minor}}
  7: {text: "Milky Eye. One eye clouds permanently. −1 max DEX.", data: {name: Milky Eye, grade: minor, DEX: -1}}
  8: {text: "Radio Hum. Within 40 ft of a live pre-war terminal or robot, you always know it is there.", data: {name: Radio Hum, grade: minor}}
  9: {text: "Leathered Skin. You may re-roll a failed STR save against environmental damage (heat, cold, rad burn) once per scene. You look visibly changed.", data: {name: Leathered Skin, grade: minor}}
  10: {text: "Dry Mouth. You can no longer taste food. You gain no benefit from cooked Meals (see Crafting).", data: {name: Dry Mouth, grade: minor}}
  11: {text: "Glowing Marrow. Once per session, when you would roll on the Scars table, you may take 1 Rad to instead treat that roll as a Close Shave (row 1).", data: {name: Glowing Marrow, grade: major}}
  12: {text: "Rad-Clever. You detect hot zones at twice normal range without a Geiger counter.", data: {name: Rad-Clever, grade: major}}
  13: {text: "Withered Hand. Your grip is weakened on one side. Any two-handed weapon you wield — rifle, super sledge, heavy weapon — is Impaired unless braced against a wall, the ground, a bipod, or power-armor servos.", data: {name: Withered Hand, grade: major}}
  14: {text: "Pale Eyes. You cannot see clearly in direct sunlight. Ranged attacks at midday outdoors are Impaired.", data: {name: Pale Eyes, grade: major}}
  15: {text: "Scabbed-Over Ear. You are deaf on one side. You cannot detect threats approaching from that direction by sound alone.", data: {name: Scabbed-Over Ear, grade: major}}
  16: {text: "Mutfruit Smell. Bloatflies, bloodbugs, and mirelurk hatchlings track you at short range.", data: {name: Mutfruit Smell, grade: major}}
  17: {text: "Thinned Blood. The first Scar you roll in any session gains +1 HP Lost on the lookup (maximum 12).", data: {name: Thinned Blood, grade: major}}
  18: {text: "Radiant. You glow faintly in pitch dark. Stealth in darkness is impossible. Allies within 20 ft gain a soft light.", data: {name: Radiant, grade: major}}
  19: {text: "Pre-war Memory. Once per session the Overseer tells you something true about the pre-war world you could not possibly know.", data: {name: Pre-war Memory, grade: major}}
  20: {text: "Ghoul-Kissed. Counts as two Rad Scars toward ghoulification — a PC who rolls this while already carrying any other Rad Scar reaches the three-Scar threshold and rolls for ghoulification at the next long rest. +1 max HP, −1 max WIL.", data: {name: Ghoul-Kissed, grade: major, count: 2, hp: 1, WIL: -1}}
---
table: ghoulification
title: Ghoulification
description: >-
  A PC with three Rad Scars rolls 1d6 at the next long rest (`didact do ghoulify who=<pc>`; the
  long rest rolls it by itself). With two or more Rad Scars, a PC who wants to become a ghoul may
  skip the roll and take result 1.
dice: d6
source: players-guide/core-rules#rad-scars--ghoulification
entries:
  1-3: {text: "Ghoulify. Their background converts to Ghoul (keep attributes, HP, perks, gear). Their face and skin change. They stop rolling for Rad Scars, though Rads still fill their slots. They may re-roll Bonds if they wish.", data: {kind: ghoulify}}
  4-5: {text: "Resist. The transformation stalls. One of their Rad Scars may be re-rolled at the Overseer's option, but a new one will come. Flag this PC — the next one sticks.", data: {kind: resist}}
  6: {text: "Break bad. The PC becomes a feral ghoul under the Overseer's control. The player makes a new character. The old one may be fought later.", data: {kind: feral}}
---
table: chems
title: Medical supplies and chems
lookup: chem
description: >-
  What each medical supply and chem does (players-guide/marketplace#medical--chems), for
  `didact do chem who=<pc> chem=<name>`: healing, Rads cleared, Fatigue, addiction. Chems are
  petty, consumed on use, and never cause Rads. The backgrounds' medkits (a slot, 3 uses) heal
  as a Stimpak does.
source: players-guide/marketplace#medical--chems
entries:
  Stimpak: {text: "Heals 1d6 STR. The wasteland's universal painkiller.", data: {heal: 1d6}}
  Medi-Kit: {text: "A background's medical kit, one slot: 3 uses, each heals 1d6 STR as a Stimpak.", data: {heal: 1d6, stimpak: true}}
  Followers Medical Kit: {text: "The Followers Scholar's kit, one slot: 3 uses, each heals 1d6 STR as a Stimpak.", data: {heal: 1d6, stimpak: true}}
  Combat Medkit: {text: "The Enclave Defector's kit, one slot: 3 uses, each heals 1d6 STR as a Stimpak.", data: {heal: 1d6, stimpak: true}}
  Super Stimpak: {text: "Heals full STR. Adds 1 Fatigue after use.", data: {heal: full, fatigue: 1}}
  RadAway: {text: "Clears 1 Rad. Non-addictive.", data: {clear_rads: 1}}
  Rad-X: {text: "Immune to the next Rad exposure: a dose negates the next Rad from any source. Non-addictive.", data: {rad_x: true}}
  Antivenom: {text: "Cures cazador, nightstalker and radscorpion poison: any creature venom.", data: {cures: venom}}
  Healing powder: {text: "Tribal remedy. Heals 1d4 STR. Blurs vision: ranged attacks Impaired for one scene.", data: {heal: 1d4, effect: "ranged attacks are Impaired for one scene"}}
  Addictol: {text: "Cures one addiction immediately. Non-addictive.", data: {cure: true}}
  Fixer: {text: "Cures one addiction immediately. Non-addictive.", data: {cure: true}}
  Med-X: {text: "Ignore a single Scar's onset for one scene. Addictive.", data: {addictive: true, effect: "ignore a single Scar's onset for one scene"}}
  Psycho: {text: "Your attacks deal Enhanced damage for one combat. Addictive.", data: {addictive: true, effect: "attacks deal Enhanced damage for one combat (mode=enhanced)"}}
  Buffout: {text: "Immune to Critical Damage for one scene. Addictive.", data: {addictive: true, effect: "immune to Critical Damage for one scene"}}
  Mentats: {text: "Cannot fail WIL saves against deception or confusion for one scene. Addictive.", data: {addictive: true, effect: "cannot fail WIL saves against deception or confusion for one scene"}}
  Berry Mentats: {text: "A berry-flavored batch; works as Mentats: cannot fail WIL saves against deception or confusion for one scene. Addictive.", data: {addictive: true, effect: "cannot fail WIL saves against deception or confusion for one scene"}}
  Jet: {text: "Take an extra action this round. Addictive, inhaled.", data: {addictive: true, effect: "an extra action this round"}}
  Turbo: {text: "You automatically pass the first-round DEX save to act this combat. Addictive.", data: {addictive: true, effect: "automatically passes the first-round DEX save to act this combat"}}
  Day Tripper: {text: "Reaction rolls shift one step better for one scene. Addictive.", data: {addictive: true, effect: "Reaction rolls shift one step better for one scene"}}
  Calmex: {text: "First attack from stealth this scene deals Enhanced damage. Addictive.", data: {addictive: true, effect: "the first attack from stealth this scene is Enhanced"}}
  Overdrive: {text: "For one combat, any target your attacks push past 0 HP automatically fails its Critical Damage save. Only one dose per session has any effect. Addictive.", data: {addictive: true, effect: "for one combat, targets your attacks push past 0 HP automatically fail their Critical Damage save (one dose per session has any effect)"}}
  Steady: {text: "Ranged attacks are not Impaired for one scene. Addictive.", data: {addictive: true, effect: "ranged attacks are not Impaired for one scene"}}
  Cateye: {text: "For one scene, see in darkness as clearly as in daylight; bright sun washes the world grey until it wears off. Not addictive.", data: {effect: "sees in darkness as in daylight for one scene; bright sun washes the world grey"}}
  Hydra: {text: "Mends one Broken or Crippled Scar over a single night's rest instead of weeks. Addictive.", data: {addictive: true, effect: "mends one Broken or Crippled Scar over a single night's rest (then `didact do scar-heal`)"}}
  Ultrajet: {text: "Take an extra action this round and the next. Works on ghouls. Addictive; its addiction save counts as STR −2.", data: {addictive: true, save_bonus: -2, effect: "an extra action this round and the next"}}
