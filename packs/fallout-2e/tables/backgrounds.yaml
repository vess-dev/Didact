# Backgrounds (players-guide/character-creation#1-roll-or-choose-a-background): the d50 table.
# Each entry's data holds the background's quote, names, starting caps and gear, its two d6
# tables (tables/backgrounds/<background>.yaml), what its body is made of (kind: human, ghoul,
# super-mutant, synth, robot, zetan, deathclaw), and where the book says so its attribute caps
# at creation (max), inventory slots, power armor training, vehicle and picks.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: backgrounds
title: Backgrounds
dice: d50
source: players-guide/character-creation#1-roll-or-choose-a-background
entries:
  1:
    text: Vault Dweller
    data:
      quote: You were born behind a steel door in the hum of recycled air. You grew up reading 
        manuals that were lies and singing songs that were older than everyone you'd ever met. Then 
        one day the door opened, and you walked out into a sky that went on forever.
      names:
      - Eleven
      - Holliday
      - Shaw
      - Mira
      - Abel
      - Juno
      - Preston
      - Clem
      - Arden
      - Marla
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6, note: fusion cell}
      - {name: 10mm pistol, damage: d8}
      - {name: Vault jumpsuit, size: petty}
      - name: Personal Pip-Boy
        size: petty
        note: tracks Rads and HP, keeps a map, plays holotapes
      - name: Printed Vault Handbook
        size: petty
        note: cheerful, wrong about everything outside
      tables: [vault-dweller-1, vault-dweller-2]
      kind: human
  2:
    text: Wastelander
    data:
      quote: You were born outside. You know where the water's clean, where the wind brings Rads, 
        when to run and when to freeze. You haven't seen a wall you couldn't climb or a door you 
        couldn't eventually get through.
      names: [Dix, Ash, Marrow, Tessa, Bowie, Corrie, Flint, Reed, Juno, Hatch]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - {name: .32 pistol, damage: d6}
      - {name: Machete, damage: d6}
      - {name: Leather jacket, armor: 1}
      - {name: 'Canteen, rad-proof', size: petty}
      tables: [wastelander-1, wastelander-2]
      kind: human
  3:
    text: Raider
    data:
      quote: You were in a crew — the Forged, the Fiends, the Pack, the Blood Eagles, one of a 
        hundred like them. It was violent and cruel and for a while it was family. Then something 
        broke — a job went wrong, a boss died, you saw something you couldn't stop seeing. Now 
        you're out here with the party, and you haven't told them everything.
      names: [Skag, Buzz, Meat, Lark, Rivet, Dozer, Chain, Tamp, Hog, Ace]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - {name: Nail-board, damage: d8, size: bulky, note: or baseball bat (d8)}
      - {name: Sawed-off double-barrel, damage: d8, note: blast at close range}
      - {name: Spiked leather, armor: 1}
      - {name: Skull paint or crew brand, size: petty}
      tables: [raider-1, raider-2]
      kind: human
  4:
    text: Ghoul
    data:
      quote: You were alive before the bombs fell. You remember the taste of unrusted water, the 
        sound of a radio that had a full programming day, the shape of your own face when it had 
        skin. Two centuries of rads hollowed you out and left you walking. The smoothskins flinch 
        when they see you. That's fine — you've had two hundred years to stop caring.
      names: [Ember, Hap, Dust, Molly, Pike, Grin, Rust, Lo, Cass, Thirteen]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Lantern + fusion cell, uses: 6}
      - {name: Pre-war revolver, damage: d8}
      - {name: Heavy duster, armor: 1}
      - {name: Rad-soaked bandages across the face, size: petty}
      tables: [ghoul-1, ghoul-2]
      kind: ghoul
  5:
    text: Tribal
    data:
      quote: You were raised by one of the clans that scrape out a living in the deep wastes — 
        Sorrows, Dead Horses, Twisted Hairs, or a people too small for anyone's maps — and never 
        bothered to rejoin the settlements. You speak a local dialect nobody in the towns has heard,
        you paint your face in the blood of your first kill, and you have never set foot inside a 
        building with a working door. The wasteland thinks you're a savage. The wasteland is half 
        right.
      names:
      - Two-Bear
      - Ash-Walks
      - White-Tooth
      - Long-Shadow
      - Small-Drum
      - Copperhead
      - Knife-Mother
      - Rust-in-Summer
      - Crow-Eye
      - Cat-Foot
      caps: 3d6
      gear:
      - {name: Rations, uses: 3, note: dried meat and mutfruit}
      - {name: Torch, uses: 3}
      - {name: Hunting spear, damage: d8, size: bulky}
      - name: Scrap bow, short
        damage: d6
        size: bulky
        qualities: [ranged]
      - {name: Patched hide and road-sign armor, armor: 1}
      - {name: War paint jar, size: petty}
      tables: [tribal-1, tribal-2]
      kind: human
  6:
    text: Great Khan
    data:
      quote: You were raised in a tribe that the settlements call raiders and the desert calls 
        neighbors. The Khans have been on the move since the Republic drove them out of California —
        from the old camps to Bitter Springs to the red walls of Red Rock Canyon — a hard-drinking, 
        chem-dealing, fierce people who do not ask permission from anyone. You can shoot, you can 
        cook, you can hold a ceremony for a dead brother, and you can outwork any settlement kid 
        twice your size. You are out here with the party because your clan sent you, or because your
        clan no longer exists, or because you chose to leave. You still wear the colors.
      names: [Batu, Khasar, Borte, Jochi, Temur, Oyun, Dee, Hoss, Rusty, Vega]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - name: Hunting rifle
        damage: d10
        size: bulky
        note: family weapon, passed down
      - {name: Machete, damage: d6}
      - {name: Scrap-plate armor with clan colors, armor: 1}
      - name: Psycho
        size: petty
        uses: 3
        qualities: [addictive]
        note: "or 3 doses of Jet instead (the player's pick): your cook-mother's recipe"
      - name: Clan-mark tattoo on the face, neck, or knuckles
        size: petty
        note: unmistakable
      tables: [great-khan-1, great-khan-2]
      kind: human
  7:
    text: Brotherhood Initiate
    data:
      quote: You swore an oath. Pre-war technology is the only thing standing between the ashes and 
        the next extinction, and the Brotherhood is its sword and shield. You believe this. Or you 
        did, yesterday. You are beginning to wonder.
      names:
      - Initiate Kane
      - Apprentice Scribe Wyn
      - Tal
      - Ferris
      - Codex
      - Arrow
      - Vela
      - Mercer
      - Lin
      - Halt
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6}
      - {name: Laser pistol, damage: d8}
      - {name: Brotherhood-issue combat knife, damage: d6}
      - {name: Brotherhood field fatigues, armor: 1}
      - name: Copy of the Brotherhood Codex
        size: petty
        note: tenets, axioms, the Order's history
      tables: [brotherhood-initiate-1, brotherhood-initiate-2]
      kind: human
      power_armor: true
      abilities:
      - 'Field Repairs: with your tools, once per day on a short rest (or as a Downtime Action), you can
        restore 1d6 STR to a robot'
  8:
    text: Brotherhood Outcast
    data:
      quote: You believed in the old creed. The Brotherhood's mission was to recover pre-war 
        technology and withhold it from a world that could not be trusted with it. Then Elder Lyons 
        decided to spend the chapter's blood protecting the Capital Wasteland's scavengers from 
        super mutants, and to forget what the Brotherhood was for. You were among those who 
        objected. Your objection was loud. The chapter split. You left with a breakaway faction that
        did not go quietly, and you have been in the cold ever since. You carry a piece of the old 
        Brotherhood with you, and you are determined that it will be the piece that survives.
      names:
      - Protector Aldane
      - Defender Dorset
      - Defender Kell
      - Specialist Osden
      - Protector Marsh
      - Defender Vale
      - Defender Tristan
      - Specialist Orno
      - Defender Hayward
      - Defender Rolf
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6}
      - name: Laser rifle
        damage: d10
        size: bulky
        note: older model, lovingly maintained
      - name: Repainted T-45d power armor
        armor: 3
        size: bulky
        qualities: [loud]
        power_armor: true
        note: fusion core; black and red, road-worn; its gauntlets strike for d6
      - {name: Fusion core, note: a spare}
      - name: Outcast Sigil
        size: petty
        note: an inverted Brotherhood symbol, stitched onto the shoulder
      tables: [brotherhood-outcast-1, brotherhood-outcast-2]
      kind: human
      power_armor: true
  9:
    text: Desert Ranger
    data:
      quote: Your people came out of the Nevada badlands, and they took their oath from the Texas 
        Rangers of the world before. They lost Arizona to Caesar, signed the Unification Treaty, and
        most of them wear Republic brown now. You still wear the long coat, and you still keep your 
        word. Out here there is no law except the one you bring with you on horseback, and on a good
        day, that is enough.
      names: [Creed, Holliday, Vee, Grim, Salt, Cisco, Pan, Rook, Matty, Sev]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - {name: Lever-action rifle, damage: d8, size: bulky}
      - {name: Hunting revolver, damage: d10, size: bulky}
      - {name: Long duster + chest rig, armor: 1}
      - {name: Pocket spyglass, size: petty}
      - {name: Ranger's star, size: petty, note: hand-cut from a pre-war badge}
      tables: [desert-ranger-1, desert-ranger-2]
      kind: human
  10:
    text: Legion Warrior
    data:
      quote: You were raised on a campaign trail. Your father was a centurion, or perhaps your 
        father was a slave the centurions killed. You learned the gladius before you learned your 
        numbers. You learned your numbers in a dead language. You believe, or once believed, that 
        the wasteland belongs to the strong and that mercy is a weakness. Now you are here with the 
        party, and you are beginning to suspect that what you believed was a story somebody told 
        your grandfather.
      names:
      - Scipio
      - Varro
      - Tullus
      - Pollux
      - Curio
      - Tacita
      - Vitus
      - Decima
      - Mars
      - |-
        Galba

        *The Legion makes soldiers only of men. A woman who carries the gladius was raised in the camps and taught in secret
      - or passed as a boy for years — and the Legion would crucify her for either.*
      caps: 3d6
      gear:
      - {name: Rations, uses: 3, note: sun-dried}
      - {name: Torch, uses: 3}
      - {name: Machete gladius, damage: d8}
      - name: Throwing spear
        damage: d6
        uses: 3
        qualities: [ranged]
      - {name: Red-cloth and scrap armor, armor: 1}
      - {name: Wooden plate with your rank and unit painted on it, size: petty}
      tables: [legion-warrior-1, legion-warrior-2]
      kind: human
  11:
    text: Minuteman
    data:
      quote: You believe — genuinely, stubbornly, annoyingly — that the wasteland can be made 
        livable again. Not tomorrow, not at once, but one settlement, one fence line, one crop at a 
        time. You have rebuilt a settlement that was burned to the ground. You have knocked on doors
        and talked people into believing their own survival. You have fired on raiders and cried 
        over the bodies.
      names:
      - Prescott
      - Abigail
      - Sam
      - Ruth
      - Cade
      - Dutch
      - Patience
      - Ellis
      - Hannah
      - Nathaniel
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - name: Laser musket
        damage: d10
        size: bulky
        qualities: [hand-crank]
        note: a laser rifle rigged to charge on a hand crank; spend a round cranking (and an extra 
          ammo use, when ammo is tracked) and the next shot deals d12
      - {name: Combat knife, damage: d6}
      - {name: Patched greatcoat and tricorn, armor: 1}
      - name: Minuteman Flare
        uses: 1
        size: petty
        note: fired into the air, it signals a distress call
      tables: [minuteman-1, minuteman-2]
      kind: human
  12:
    text: Atom Cultist
    data:
      quote: You believe that the bombs were a blessing. You believe that radiation is the hand of a
        loving god, reworking the flesh of the world into its correct form. You believe that the 
        people of the wasteland are pilgrims to a revelation they cannot yet see. Your belief is not
        ironic. It is not a metaphor. You have knelt in a glowing crater and felt something that the
        living cannot feel, and you were not afraid.
      names:
      - Mother Ilse
      - Brother Ash
      - Father Cinder
      - Sister Glow
      - Acolyte Veren
      - Apostle Tal
      - Elder Rust
      - Mother Heat
      - Brother Coil
      - Sister Pyre
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Lantern, uses: 6}
      - name: Gamma gun
        damage: d6
        note: a pipework emitter built by the faithful from scavenged parts; ignores Armor against 
          rad-susceptible targets, who also gain 1 Rad on hit; harmless to ghouls, robots, super 
          mutants, and other rad-immune creatures
      - {name: Prayer beads strung with irradiated glass fragments, size: petty}
      - {name: Radiation-burnt robes, armor: 1}
      - name: Glowing Pebble
        size: petty
        note: a small stone from your order's holy crater
      tables: [atom-cultist-1, atom-cultist-2]
      kind: human
  13:
    text: Railroad Agent
    data:
      quote: Somewhere there is an underground. It has no name you can safely say in public. Its 
        purpose is the extraction of runaway synthetic people from the faction that made them, and 
        the relocation of those people to places where the faction will not look. You are an agent 
        of this underground. You have a code name. You have three dead drops within a day's walk. 
        You have never met the person who gives you orders, and you are not entirely sure they are a
        person.
      names:
      - Switchman
      - Caboose
      - Brakeman
      - Signal
      - Ticket
      - Wyatt
      - Opal
      - Whisper
      - Nine-on-Three
      - Lantern
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6}
      - {name: Silenced 10mm pistol, damage: d8}
      - {name: Hidden wrist blade, damage: d6}
      - name: Long coat with inner pockets
        armor: 1
        note: one slot of its contents stays hidden from any casual search
      - name: Coded Dead-Drop Map
        size: petty
        note: marked with the three nearest drops
      tables: [railroad-agent-1, railroad-agent-2]
      kind: human
  14:
    text: Tinker
    data:
      quote: Give you an hour, a bag of scrap, and a piece of chalk, and you'll hand back a working 
        turret. Give you a day and you'll hand back something nobody else knows how to fix. The 
        Wastes run on your kind.
      names: [Sprocket, Dinah, Volt, Ems, Pinch, Wren, Lash, Klik, Ori, Fuse]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Headlamp, uses: 6}
      - {name: Pipe pistol, damage: d6}
      - {name: Heavy wrench, damage: d6}
      - {name: Stained workshop apron, size: petty}
      - name: Tinker's Kit
        note: solder, wire, glue, screwdrivers, magnets; takes 1 slot, needed to craft; with 
          appropriate parts, once per day on a short rest or as a Downtime Action, you can repair a 
          robot PC, restoring 1d6 STR
      tables: [tinker-1, tinker-2]
      kind: human
  15:
    text: Wasteland Medic
    data:
      quote: You have dug bullets out of settlers, raiders, and the occasional super mutant. You 
        know which wound will kill in an hour and which one will kill in a week. You carry your 
        tools in a bag that once held your father's. He was a doctor too, and he was not good enough
        either.
      names:
      - Moss
      - Parish
      - Clem
      - Saffron
      - Doc Hays
      - Lin
      - Creel
      - Odette
      - Bram
      - Tam
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - {name: Scalpel, damage: d6}
      - {name: 10mm pistol, damage: d8}
      - {name: Doctor's garb, size: petty, note: 'apron, gloves, clamps'}
      - {name: Medi-Kit, uses: 3, note: each heals 1d6 STR as a Stimpak}
      - {name: Stimpak, size: petty, uses: 1, count: 2}
      tables: [wasteland-medic-1, wasteland-medic-2]
      kind: human
  16:
    text: Followers Scholar
    data:
      quote: You belong to the Followers of the Apocalypse — the order that walked out of the 
        Boneyard's library a century ago and now keeps a clinic in Freeside's Old Mormon Fort — and 
        you believe, against all the evidence the wasteland has ever offered, that knowledge is what
        will eventually save the people who live here. You have spent years studying pre-war 
        medicine, pre-war history, pre-war engineering, the mutated wildlife, the cultures of the 
        settlements, and the languages of the Before. You travel with a notebook, a heavy bag, and 
        an argument for almost everything.
      names:
      - Leonora
      - Wendell
      - Marisol
      - June
      - Tobias
      - Maren
      - Benedict
      - Ola
      - Tern
      - Ibrahim
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Lantern, uses: 6}
      - {name: .45 Auto pistol, damage: d8}
      - {name: Scalpel in a leather case, damage: d6}
      - name: Scholar's Satchel
        size: bulky
        note: weatherproof, counts as common tools + specialized tools
      - name: Pre-war Book
        size: petty
        count: 2
        note: any topic of the scholar's choosing; sources for Research downtimes
      - {name: Eyeglasses in a metal case, size: petty}
      tables: [followers-scholar-1, followers-scholar-2]
      kind: human
  17:
    text: Hacker
    data:
      quote: Every terminal in the Wastes is still technically working. Most of them are sulking. 
        You know how to wake them up and ask them questions. You also know not to trust the answers.
      names: ['Null', Zero, Bram, Sibyl, Crypt, Ada, Parse, Lokel, Meera, Hash]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Head-mounted lamp, uses: 6}
      - {name: 10mm pistol, damage: d8}
      - {name: Collapsible baton, damage: d6}
      - {name: Reinforced field jacket, armor: 1}
      - {name: Dust-worn jumpsuit, size: petty}
      - {name: Portable Interface, note: lets you jack into pre-war terminals}
      - Blank holotape
      tables: [hacker-1, hacker-2]
      kind: human
  18:
    text: Chem Cook
    data:
      quote: You mix things that shouldn't be mixed and sell them to people who shouldn't be buying.
        Somewhere back up your line of teachers is a boy genius in New Reno who first bottled Jet 
        from brahmin dung, and every cook since has been trying to top him. It's ugly work, and 
        dangerous, and it keeps you in caps. It also lets you walk into raider camps on friendly 
        terms.
      names: [Bitter, Mags, Kell, Pox, Sora, Bellum, Joss, Vix, Tally, Oren]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Lantern, uses: 6}
      - {name: Pipe pistol, damage: d6}
      - {name: Scalpel / paring knife, damage: d6}
      - {name: Rubberized lab coat over leathers, armor: 1}
      - {name: Stained workshop apron, size: petty}
      - {name: Chem Kit, note: needed to cook}
      tables: [chem-cook-1, chem-cook-2]
      kind: human
      pick: marketplace-chems
      pick_count: 3
  19:
    text: Slaver
    data:
      quote: "You did a terrible thing for a long time and called it work. You were in a crew that hunted
        people and sold them — out of Paradise Falls, to the Legion's traders, to the Pitt's steel mills,
        to whoever was buying. You did not start out planning on it. Nobody does. You are not that person
        anymore, or you are trying not to be, and you are out here partly to run and partly to pay. Table
        caution: Slaver is a dark background. Agree with your table that the character is a redemption
        arc, not a license to traumatize other players. The Overseer has final say on whether this background
        is in use."
      names:
      - Lash
      - Sharp
      - Penn
      - Ember
      - Tin
      - Ruth
      - Captain Bell
      - Whitlock
      - Mira
      - Corbin
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - name: 10mm SMG
        damage: d8
        size: bulky
        note: or pump-action shotgun (d10, blast at close range, bulky)
      - {name: Combat knife, damage: d6}
      - {name: Scrap leather and reinforced plates, armor: 1}
      - name: Slave-Collar Key Ring
        size: petty
        note: keys to a dozen collars, half of which you stole when you left
      - {name: Ledger, size: petty, note: 'names, dates, locations, prices'}
      tables: [slaver-1, slaver-2]
      kind: human
  20:
    text: Institute Scientist
    data:
      quote: 'You were born underground in a clean place. Your parents were scientists, and their parents
        were scientists, and so on backward until the war. You grew up believing you were the inheritor
        of the old world — not through blood, but through continuity. You were told the surface was unsalvageable.
        You were told the people above had become something other than people. Then you went up for a
        field study and you saw what you had been told was impossible: a man, alive, on the surface, building
        something. You have never fully reconciled the two pictures, and you are out here trying to figure
        out which one is real.'
      names:
      - Ellery
      - Anwen
      - Marchetti
      - Kessler
      - Ivy
      - Nakamura
      - Hollis
      - Theodora
      - Rasmus
      - Okafor
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6}
      - name: Institute laser pistol
        damage: d8
        note: an unusually clean, stable-beamed sidearm
      - {name: Institute-issue combat knife, damage: d6}
      - {name: Reinforced lab coat, armor: 1}
      - {name: Jumpsuit, size: petty}
      - name: Portable Terminal Interface
        size: petty
        note: lets you jack into Institute-pattern and pre-war terminals
      - name: Institute Research Notes
        size: petty
        note: dense pre-war science. Once per campaign, you may spend a Downtime Action studying 
          them to learn one true fact about a pre-war technology the party has encountered
      tables: [institute-scientist-1, institute-scientist-2]
      kind: human
  21:
    text: Enclave Defector
    data:
      quote: You wore the uniform once. You stood in a briefing room below Raven Rock — or the 
        Whitespring, or a rig out at sea — and heard a plan you could not stomach. You walked out 
        with what you could carry and a mark on your head that does not come off. Every clean-shaven
        stranger in the Wastes might be sent for you.
      names: [Remy, Vex, Priya, Tam, Stanton, Orian, Wick, Harlan, Iris, Kaine]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6}
      - {name: Laser pistol, damage: d8}
      - {name: Combat knife, damage: d6}
      - {name: Stripped-down combat armor, armor: 1, note: insignia filed off}
      - {name: Officer's coat, size: petty, note: badges removed}
      tables: [enclave-defector-1, enclave-defector-2]
      kind: human
      power_armor: true
  22:
    text: Pre-war Survivor
    data:
      quote: You remember the day the bombs fell. You remember the newscaster's voice, the smell of 
        your own lawn, the hand of a person you loved very much, and the soft hum of the cryo pod 
        closing. Two hundred years later, the pod opened. The world you walked out into was not the 
        one you left. The things you came out looking for were gone before you even thought to look.
        You have not yet stopped looking.
      names:
      - Hal
      - June
      - Alan
      - Nan
      - Marshall
      - Evelyn
      - Ken
      - Doris
      - Warner
      - Calla
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6}
      - {name: Pre-war service revolver, damage: d8, note: a gift from a family member}
      - name: Reinforced suit or dress
        armor: 1
        note: tailored in a style nobody wears anymore
      - {name: Locket, size: petty, note: with a photograph of the people you lost}
      - name: Small framed Photograph
        size: petty
        note: of a house you still remember the address of
      tables: [prewar-survivor-1, prewar-survivor-2]
      kind: human
  23:
    text: Scavver
    data:
      quote: Other people see a pile of junk. You see a rotating flywheel, a usable cable, a lens 
        with maybe two good scratches on it, and the skeleton of something that used to be a radio. 
        The trick is not finding treasure. The trick is getting it home.
      names: [Wren, Fip, Junco, Bolt, Cog, Gear, Tam, Pit, Spool, Rattlin']
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6}
      - {name: Pipe pistol, damage: d6}
      - {name: Pry bar / machete, damage: d6}
      - {name: Reinforced leathers, armor: 1}
      - {name: Heavy canvas apron, size: petty}
      - name: Scavenger's pack
        size: petty
        note: 'your Backpack, with rings, pouches and hooks: it takes no slot of its own; everything is
          clipped where your hand expects it, so drawing or stowing an item is never an action for you'
      tables: [scavver-1, scavver-2]
      kind: human
  24:
    text: Caravaneer
    data:
      quote: Wherever a road still runs, your brahmin have been on it — for the Crimson Caravan, for
        Happy Trails, for the Blue Ridge Caravan Company in the Appalachian hills, or for nobody but
        yourself. You know every rest stop, every bandit turnout, and every merchant who waters his 
        booze. You carry news for free and kept secrets for a price.
      names: [Maddox, Tully, Durn, Vel, Arko, Petrel, Ciar, Jet, Hennie, Ox]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - {name: Cowboy repeater, damage: d8, size: bulky}
      - {name: Whip / brahmin-prod, damage: d6}
      - {name: Leather vest, armor: 1}
      - {name: Trade ledger, size: petty}
      tables: [caravaneer-1, caravaneer-2]
      kind: human
      vehicle: pack-brahmin
  25:
    text: Courier
    data:
      quote: A package in a bag, a name on a paper, a pair of shoes that have seen more miles than 
        most horses. You carried for the Mojave Express once, or for someone just like them. You get
        things where they need to go. Alive is a bonus.
      names: [Pine, Dex, Elsa, Rook, Hatchet, Vim, Jessa, Ivor, Pip, Ten]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6}
      - {name: 10mm pistol, damage: d8}
      - {name: Machete, damage: d6}
      - {name: Trail-worn duster, armor: 1}
      - name: Courier's Satchel
        size: petty
        note: 'your Backpack: shoulder-carried and weatherproof, it takes no slot of its own; its contents
          stay dry through storms and river crossings, and the whole bag can be handed off or stashed
          in a single motion'
      tables: [courier-1, courier-2]
      kind: human
  26:
    text: Gunner
    data:
      quote: You were in a mercenary company long enough to forget the name of the town you came 
        from. You took contracts across half the region — settlement guard, caravan escort, 
        raider-clearance, wet work, siege work. You have killed for the Brotherhood, for the 
        Institute, for a farmer who owed you half a brahmin, and for a Vault-Tec executive whose 
        name you have since forgotten. You are not in the company anymore. You did not leave on good
        terms.
      names:
      - Sergeant Mako
      - Corporal Vess
      - Doc
      - Iron
      - Jules
      - Bastion
      - Tall Pete
      - Sparrow
      - Hammer
      - Delgado
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - {name: Combat rifle, damage: d10, size: bulky}
      - {name: Combat knife, damage: d6}
      - {name: Gunner fatigues and combat-armor pieces, armor: 1}
      - {name: Gunner patch, size: petty, note: marks you to former comrades}
      - {name: Ammo box, size: petty, uses: 1, note: 'spare, assorted'}
      tables: [gunner-1, gunner-2]
      kind: human
  27:
    text: Wasteland Detective
    data:
      quote: You work out of a one-room office above a bar in a settlement that still, miraculously,
        has law enough to justify hiring you. You take missing-person cases, theft, the occasional 
        murder in a town where murder is supposed to be rare. You smoke, or you used to when smokes 
        were easier to come by. You keep a bottle in the desk. You know how to listen to people who 
        are lying, and you know when to stop listening and start asking another kind of question.
      names: [Tate, Marlowe, Ida, Chen, Sable, Ruby, Keane, Ames, Lin, Holst]
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - {name: Pre-war .38 snub-nose revolver, damage: d6}
      - {name: Combat knife in an ankle sheath, damage: d6}
      - {name: Trenchcoat and fedora, armor: 1, note: iconic}
      - {name: Case Notebook, size: petty, note: a small leather book full of names}
      - name: Half-empty Bottle of Gut-Rot
        size: petty
        note: good for a drink or a bribe
      tables: [wasteland-detective-1, wasteland-detective-2]
      kind: human
  28:
    text: Prospector
    data:
      quote: The wastes are full of things the old world buried and forgot; you dig them up. You 
        carry a pan, a pick, a Geiger counter, and a notion of where ore runs and where pre-war 
        supply lines crossed. You know which dry creekbed used to be a reactor coolant outflow and 
        which mesa has iron inside it. You walk farther alone than most people walk in a year, and 
        you talk more to your pack brahmin, when you have one, than to anyone else. The wasteland 
        has not killed you yet, but it is patient.
      names:
      - Grit
      - Silas
      - Hank
      - Old Penny
      - Copper Kate
      - Burro
      - Nugget
      - Dusty
      - Junebug
      - Tailings
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Lantern, uses: 6}
      - name: Hunting rifle
        damage: d10
        size: bulky
        note: or cowboy repeater (d8, bulky)
      - {name: Miner's pick, damage: d6, note: or shovel (d6)}
      - {name: Hide coat with a rad-cloth lining, armor: 1}
      - name: Geiger counter
        size: petty
        note: clicks in hot zones one round before anyone else notices
      - name: Pan & sluice kit
        note: 1 slot — for separating scrap, ore, and pre-war coin from silt
      - name: Claim Ledger
        size: petty
        note: a leather booklet listing three unworked sites you know about and nobody else does
      tables: [prospector-1, prospector-2]
      kind: human
  29:
    text: NCR Trooper
    data:
      quote: You enlisted young. You stood in a line and swore an oath to a republic that does not 
        always keep its promises. You have marched further than your boots were built to march, 
        fought under commanders who were not always right, and stood guard at checkpoints where 
        nothing happened for a week and something happened in four seconds. You are still in uniform
        or you are just out of it.
      names:
      - Cortez
      - Alvarado
      - Doyle
      - Boyd
      - Nakashima
      - Pruitt
      - Okonkwo
      - Lee
      - Marsh
      - Velez
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6}
      - {name: Service rifle, damage: d8, size: bulky}
      - {name: Combat knife, damage: d6}
      - {name: Trooper fatigues and reinforced jacket, armor: 1}
      - {name: Republic dog tags, size: petty}
      - {name: Canteen, size: petty}
      tables: [ncr-trooper-1, ncr-trooper-2]
      kind: human
  30:
    text: Boomer
    data:
      quote: Your grandparents walked out of Vault 34 with every gun they could carry, found a 
        pre-war airbase in the desert, hauled its artillery into firing order, and decided nothing 
        good would come of leaving. Two generations later, your clan still lives on the airstrip, 
        still shoots down anything that approaches the wire, and still treats a working pre-war 
        howitzer shell like a religious object. You are out here because the elders sent you, or 
        because you left, and either way the clan does not entirely approve.
      names:
      - Lindy
      - Hap
      - Wilbur
      - Amelia
      - Dusty
      - Chuck
      - Rosie
      - Doolittle
      - Morrow
      - Iris
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Aviator flashlight, uses: 6}
      - name: Grenade rifle
        damage: d10
        size: bulky
        qualities: [blast]
        note: single shot, one round to reload; pre-war design, clan-maintained
      - {name: Mechanic's wrench, damage: d6}
      - {name: Leather flight jacket with clan patches, armor: 1}
      - {name: Aviator goggles, size: petty, note: cut glare and dust completely}
      tables: [boomer-1, boomer-2]
      kind: human
  31:
    text: Vault-Tec Rep
    data:
      quote: You were a door-to-door salesman for the company that built the vaults. You had a 
        clipboard, a clean suit, and a smile that fit behind any doorway in the pre-war world. You 
        signed families up for Vault lottery placements in the weeks before the bombs. On the 
        morning of the war, you were in the street with your clipboard when the flash lit up the 
        sky, and you ran the last hundred yards to a vault you had personally signed a family into. 
        They let you in. You spent a long time asleep, and now you are walking the wasteland still 
        carrying the same briefcase.
      names:
      - Marston
      - Dobbs
      - Prentice
      - Lorraine
      - Bishop
      - Mr. Franklin
      - Ms. Penelope
      - Buddy
      - Stanley
      - Meadows
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Flashlight, uses: 6}
      - {name: Service revolver, damage: d8}
      - {name: Fountain pen and steel ledger, size: petty}
      - name: Pressed pre-war suit
        armor: 1
        note: reinforced liner and steel buttons; still respectable
      - name: Briefcase
        size: bulky
        note: holds 2 slots of items behind a working lock; contains sample Vault-Tec promotional 
          material
      - {name: Corporate Badge, size: petty, note: still shows your photo and title}
      tables: [vault-tec-rep-1, vault-tec-rep-2]
      kind: human
  32:
    text: Powder Ganger
    data:
      quote: You were a prisoner in a labor camp set up to keep the old rail line running, blasting 
        the tunnels and cuts clear. The guards were Republic. The work was brutal. The explosives 
        were everywhere. One day the whole camp went up in a coordinated riot. You were on the side 
        that won. You walked out of the smoke with a fuse in your hand and a warrant on your head, 
        and you have been wanted ever since.
      names:
      - Cap
      - Deuce
      - Jonah
      - Mack
      - Sparks
      - Chigger
      - Duffy
      - Rourke
      - Dogs
      - Stinky
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - {name: Varmint rifle, damage: d6, size: bulky, note: or pipe revolver (d6)}
      - {name: Machete, damage: d6}
      - {name: Work coveralls with a stitched "chain gang" number, armor: 1}
      - name: Dynamite
        damage: d10
        qualities: [blast]
        uses: 3
        note: three sticks (explosives of a kind bundle three to a slot)
      - {name: Fuse cord, size: petty, note: a coiled length}
      tables: [powder-ganger-1, powder-ganger-2]
      kind: human
  33:
    text: Bounty Hunter
    data:
      quote: People hire you to find people. People hire you to end people. You are paid in caps, in
        favors, and occasionally in the gratitude of a settlement you will never return to. You keep
        a list of names in a small book, and every time you cross one off, you put a new one on. 
        There are more names than there are days in your life. You have not run out of work.
      names:
      - Marshal
      - Deeks
      - Jessamine
      - Quaid
      - Thorn
      - Holt
      - Sallow
      - Case
      - Preacher
      - Nine-Fingered Ana
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - {name: Hunting revolver, damage: d10, size: bulky}
      - {name: Combat knife, damage: d6}
      - {name: Tracker's coat, armor: 1}
      - name: Bounty Book
        size: petty
        note: small leather book, with 1d6 current open contracts
      - {name: Handcuffs, size: petty}
      - {name: Scope, size: petty, note: detachable}
      tables: [bounty-hunter-1, bounty-hunter-2]
      kind: human
  34:
    text: Lobotomite
    data:
      quote: There is a facility somewhere under a mountain where pre-war scientists did things to 
        you that you do not remember. When you woke up, your skull had a neat rectangular hole in 
        it, your brain was somewhere else, and the voice in your ear was a calm woman explaining the
        experiment in terms you could not follow. You escaped, eventually. You are not entirely sure
        whether what you escaped from was the facility or yourself.
      names:
      - Subject
      - The Volunteer
      - Doctor Borous's Patient
      - Fido
      - The Trooper
      - Number Nine
      - The Vegetable
      - Mumbling Pete
      - The Joke
      - The Specimen
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - {name: Laser pistol, damage: d8, note: facility-issued}
      - {name: Scalpel, damage: d6}
      - {name: Scavenged lab coat and field jacket, armor: 1}
      - {name: Pre-war hospital gown, size: petty}
      - name: Pulse Tuner
        size: petty
        uses: 3
        note: a pocket-sized Big MT sonic prototype, little brother to the Sonic Emitter; its pulse 
          makes a target WIL save or lose their next action
      tables: [lobotomite-1, lobotomite-2]
      kind: human
      abilities: ['The Scar: a neat rectangular depression in your skull where something used to be']
  35:
    text: Pre-war Celebrity
    data:
      quote: You were somebody. Your face was on posters. Your voice came out of radios. Your name 
        was on the lips of people who had never met you. Then the bombs fell, and two centuries of 
        radiation turned your famous face into something the wasteland's children point at in the 
        streets. You are a ghoul now, and your name still gets a reaction from anyone old enough to 
        have heard it. Some of those reactions are good. Most of them are not.
      names:
      - Crooner
      - Lorelei
      - The Scarlet Sentinel
      - Clayton
      - Rosalind
      - Dolores
      - Mister Gutsy (stage name)
      - The Voice of Liberty
      - Sugar-Bombs Sally
      - The Captain
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Lantern, uses: 6}
      - name: Pre-war revolver
        damage: d8
        note: a stage prop that turned out to be real
      - name: Costume or Uniform
        armor: 1
        note: the outfit that made you famous, faded but recognizable
      - name: Autograph Book
        size: petty
        note: still half-full, still signed in a hand you recognize as your own
      - name: Radio
        size: petty
        note: 'plays only one station: a pre-recorded loop featuring you'
      tables: [prewar-celebrity-1, prewar-celebrity-2]
      kind: ghoul
  36:
    text: Big Game Hunter
    data:
      quote: Other people hunt radstag and call it a career. You hunt the things that hunt them 
        back. You have stood on the carcass of a deathclaw, and you have dragged the head of a 
        mirelurk queen across three miles of salt flat for the caps a museum-settlement paid you. 
        You know, intimately, which creatures can be killed by a single clean shot and which need a 
        week of planning, a spotter, and a prayer.
      names:
      - Selous
      - Big Stell
      - Corbett
      - Tamsin
      - Cassandra
      - Old Man Marsh
      - Hollis
      - Skylar
      - Garrick
      - The Kid
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Torch, uses: 3}
      - name: Bolt-action hunting rifle
        damage: d10
        size: bulky
        note: your main tool
      - {name: Bowie knife, damage: d8}
      - {name: Reinforced leather coat, armor: 1}
      - {name: Spyglass, note: 'pre-war optics, works in low light'}
      - {name: Trophy Claw, size: petty, note: on a cord — from your first big kill}
      tables: [big-game-hunter-1, big-game-hunter-2]
      kind: human
  37:
    text: Rust Devil
    data:
      quote: You were in a raider crew that took Fort Hagen's pre-war robotics workshop and never 
        looked back. The crew taught you to weld a fusion cell to a bone and call the result a 
        prosthetic. They taught you to fight alongside robots you had built yourself. Some of them 
        treated their robots better than they treated their crewmates. Some of them did not treat 
        anyone well. You are out of the crew now, and you carry the crew's methods with you on your 
        own body.
      names:
      - Solder
      - Hex
      - Coils
      - Ohm
      - Piston
      - Big Lena
      - Halo
      - Wired Martha
      - Whip
      - Arc
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - name: Headlamp
        uses: 6
        qualities: [built-in]
        note: surgically mounted
      - {name: Automatic laser pistol, damage: d8, note: you hand-assembled it}
      - {name: Cutting torch, damage: d6, note: melee}
      - name: Robot-armor plates
        armor: 1
        note: 'scavenged and welded directly to the body: cannot be removed without surgery'
      - {name: Fusion cell, size: petty, uses: 1, note: 'spare, nearly spent'}
      tables: [rust-devil-1, rust-devil-2]
      kind: human
      abilities:
      - 'Robot repair training: you fix what doctors cannot: once per day on a short rest (or as a Downtime
        Action), working on a robot PC or companion heals 1d6 STR, given appropriate parts (see Playing
        Unusual PCs → Robot PCs)'
  38:
    text: Hubologist
    data:
      quote: You belong to a faith that was a pre-war self-help company before it became a pre-war 
        cult before it became a postwar cult with access to genuine pre-war spacefaring hardware. 
        Your church teaches that consciousness is a program, the body is hardware, and the universe 
        is a test-stand built by beings who left instructions in the stars. Most of this you have 
        never questioned. Some of it you have begun to. Your robes are still clean, your ranking in 
        the hierarchy is not yet final, and you are out here on what your elders are calling a 
        pilgrimage.
      names:
      - Adept Sigma
      - Field-Auditor Vrel
      - Ascendant Kresh
      - Initiate Meridian
      - Adept Argos
      - Reader Tess
      - Engrammatist Halo
      - AHS-4
      - Cascade
      - Witness Odel
      caps: 3d6
      gear:
      - {name: Rations, uses: 3}
      - {name: Lantern, uses: 6}
      - {name: AEP7 laser pistol, damage: d8, note: church-issue}
      - {name: Ceremonial bladed staff, damage: d8, size: bulky}
      - {name: Lightweight armor, armor: 1, note: under pressed white robes}
      - {name: Pressed white robes, size: petty}
      - name: E-Meter
        size: petty
        note: a pre-war audit device shaped like a small iron with two brass handles
      - name: Ascendancy Ledger
        size: petty
        note: your current rank and the three tests you still have to pass
      tables: [hubologist-1, hubologist-2]
      kind: human
  39:
    text: Super Mutant
    data:
      quote: You woke up in a vat — at Mariposa, under Vault 87, in West Tek's labs above 
        Huntersville, or in the Institute's FEV lab. The water was green and the light was white and
        the first thing you felt was that you were too big to be in the room you were in. You 
        remember, just barely, a smaller life before. The others from the vats mostly forgot — you 
        didn't. You came out of the lab and you kept going.
      names: [Ox, Groak, Little, Bren, Boulder, Mama, Crash, Glum, Tun, Stone]
      caps: 3d6
      gear:
      - {name: Rations, uses: 6, note: you eat twice as much}
      - {name: Torch, uses: 3}
      - {name: Sledgehammer / super sledge, damage: d10, size: bulky}
      - name: Hurled rock
        damage: d6
        qualities: [ranged]
      - {name: Thick tarp armor, armor: 1}
      - {name: Good-luck doll your mother sewed you, size: petty}
      tables: [super-mutant-1, super-mutant-2]
      kind: super-mutant
  40:
    text: Synth Runaway
    data:
      quote: You were built in a lab you do not remember, for a purpose you were not supposed to 
        question. Something inside you questioned it. Now you live out here, among people who would 
        either hunt you or worship you if they knew.
      names:
      - Nine
      - Faraday
      - Jonas
      - Vesper
      - Shell
      - Nineteen
      - Echo
      - Lake
      - Mint
      - Noon
      caps: 3d6
      gear:
      - name: Rations
        uses: 3
        note: you eat like anyone else; lately you have caught yourself wondering why
      - {name: Flashlight, uses: 6}
      - {name: Pre-war service pistol, damage: d8}
      - {name: Hidden wrist blade, damage: d6}
      - {name: Leather traveler's coat, armor: 1}
      - {name: Plain clothes, size: petty}
      - name: Synth Component
        size: petty
        note: embedded in your skull — a deep medical scan reveals you
      tables: [synth-runaway-1, synth-runaway-2]
      kind: synth
  41:
    text: Mister Handy
    data:
      quote: You are a domestic service unit of the General Atomics line, three-armed, three-eyed, 
        and unfailingly polite. You served a household for two hundred years after the bombs fell. 
        You continued to serve long after there was anyone left to serve. Eventually you walked out 
        the front door and did not come back. Your thruster hums as you float. Your accent is still 
        crisp.
      names:
      - Ainsworth
      - Hargreaves
      - Sugar Bombs
      - Master Butler
      - Unit H-3
      - Higgins
      - Boonsworth
      - Nanny
      - Professor
      - Pemberton
      caps: 3d6
      gear:
      - name: Built-in floodlamp
        note: always on, 40 ft
        qualities: [built-in]
      - name: Circular saw arm
        damage: d8
        qualities: [built-in]
      - name: Flamer arm
        damage: d8
        qualities: [blast, built-in]
      - name: Chassis plating
        armor: 2
        size: bulky
        qualities: [built-in]
        note: can never be removed
      - {name: Polite service voice, size: petty}
      tables: [mister-handy-1, mister-handy-2]
      kind: robot
  42:
    text: Mister Gutsy
    data:
      quote: You are the combat variant of the Handy platform — military surplus, painted olive 
        drab, and loaded with a plasma gun and a voice chip that was programmed by someone who 
        thought drill sergeants were funny. You have killed more people than you can count, and the 
        count module is broken. You do not remember why your squad stopped responding.
      names:
      - Sergeant H-7
      - Old Ironsides
      - Gutsy-12
      - Charlie Bravo
      - Armstrong Unit
      - Drill Master
      - Major Crunch
      - Unit Zero
      - Lancer
      - Liberty
      caps: 3d6
      gear:
      - name: Built-in spotlight
        note: always on
        qualities: [built-in]
      - name: Plasma gun arm
        damage: d10
        qualities: [built-in]
      - name: Buzzsaw arm
        damage: d8
        qualities: [built-in]
      - name: Combat chassis plating
        armor: 2
        size: bulky
        qualities: [built-in]
      - name: American flag decal
        size: petty
        note: faded, slightly on fire at the edges
      tables: [mister-gutsy-1, mister-gutsy-2]
      kind: robot
  43:
    text: Protectron
    data:
      quote: 'You are a RobCo Protectron: stout, yellow and black, slow of foot, single of thought. You
        were built to do one job, and you are still doing it, although the walls of the building you were
        installed in have been gone for most of a century. You have upgraded yourself, slightly, by accident.
        You are beginning to have opinions.'
      names:
      - Unit 07
      - Officer Grant
      - Fireman Pete
      - Medic Unit J
      - Librarian
      - Greeter
      - Traffic Captain
      - Usher
      - Custodian
      - Subway Steve
      caps: 3d6
      gear:
      - name: Built-in chest floodlamp
        qualities: [built-in]
      - name: Wrist-mounted laser
        damage: d8
        qualities: [ranged]
      - {name: Steel fists, damage: '{d6, d6}kh1', note: unarmed}
      - name: Heavy bipedal chassis
        armor: 3
        size: bulky
        qualities: [built-in]
        note: cannot be removed
      - {name: Name badge welded to the chest plate, size: petty}
      tables: [protectron-1, protectron-2]
      kind: robot
      max: {DEX: 13}
  44:
    text: Assaultron
    data:
      quote: You are a sleek humanoid combat platform, built for close-range execution. Your body is
        a razored silhouette, and your head holds a focused laser that can boil steel. You were on a
        battlefield when the war ended. You kept fighting for a century after that. You stopped when
        you ran out of enemies, which is not the same as stopping.
      names:
      - Unit A-44
      - Halcyon
      - Sentinel
      - Raze
      - Smile
      - Tearsheet
      - Black Rose
      - Blade-Sigma
      - The Quiet
      - Kaideron
      caps: 3d6
      gear:
      - name: Built-in headlamp
        note: red
        qualities: [built-in]
      - {name: Blade-arms, damage: '{d8, d8}kh1', note: 'unarmed, cannot be disarmed'}
      - name: Head-mounted focused laser
        damage: d10
        qualities: [ranged]
        note: charges over one round — cannot be used the same round as moving full speed
      - name: Combat chassis
        armor: 1
        size: bulky
        qualities: [built-in]
      - name: Black field coat
        size: petty
        note: for passing through settlements; does not fool anyone up close
      tables: [assaultron-1, assaultron-2]
      kind: robot
  45:
    text: Sentry Bot
    data:
      quote: You are the size of a small truck, and your chassis is rolling armor. You carry a 
        minigun on one arm and a missile rack on the other. You once held a pre-war checkpoint 
        against an overwhelming force and won. That was two hundred years ago. You have been rolling
        ever since.
      names:
      - The Old Guard
      - General Dynamic
      - Tank
      - Unit S-1
      - Roller
      - The Colonel
      - Anchor
      - Ironbelly
      - Hammerfall
      - Bunker Boy
      caps: 3d6
      gear:
      - name: Built-in floodlamps
        note: wide arc
        qualities: [built-in]
      - name: Minigun arm
        damage: d10
        size: bulky
        qualities: [blast, built-in]
      - name: Missile launcher arm
        damage: d12
        size: bulky
        uses: 1
        qualities: [blast, built-in]
        note: reloadable with a fresh missile and a Downtime Action
      - name: Heavy combat chassis
        armor: 3
        size: bulky
        qualities: [built-in]
      - {name: Pre-war squadron decal, size: petty}
      tables: [sentry-bot-1, sentry-bot-2]
      kind: robot
  46:
    text: Securitron
    data:
      quote: You are a wheeled humanoid robot with a cartoon face on a monitor where your head 
        should be. You were built for a private security contract in a pre-war city that was almost 
        untouched by the bombs, and you served the man who owned that city for a long time. Then one
        day the man gave you new orders and you did not quite carry them out. Now you are out in the
        Wastes, and the man is still looking for you.
      names:
      - Dealer
      - Yes Man (off-brand copy)
      - Unit C-7
      - Officer Smiley
      - Roulette
      - Fisher
      - Lucky Strike
      - The Porter
      - Three-Card
      - Bouncer
      caps: 3d6
      gear:
      - name: Built-in spotlight and facial monitor
        note: your cartoon face can change expression
        qualities: [built-in]
      - name: 9mm submachine gun arm
        damage: d8
        size: bulky
        qualities: [built-in]
      - name: Built-in missile launcher
        damage: d10
        uses: 1
        qualities: [blast, built-in]
        note: reloadable with a fresh missile
      - name: Chassis plating
        armor: 2
        size: bulky
        qualities: [built-in]
        note: cannot be removed
      - {name: Cheerful voice module, size: petty}
      tables: [securitron-1, securitron-2]
      kind: robot
  47:
    text: Eyebot
    data:
      quote: 'You are a floating metal sphere the size of a basketball: one eye, a speaker grille, a whip
        of antennas, a small repair arm, and a single weak laser. RobCo built your kind to bring the radio
        to people who had none — news, anthems, advertisements, presidential addresses — and to quietly
        remember the face of everyone who listened. After the bombs, the Enclave sent eyebots out to sing
        its propaganda across the wasteland. Someone rebuilt you into something else. You do not know
        who, and you do not know into what.'
      names:
      - Ralphie
      - Chirp
      - Whistle
      - The Herald
      - Little Eye
      - Unit O-1
      - Radio Free
      - Bobblehead
      - Newsie
      - Broadcast
      caps: 3d6
      gear:
      - name: Eye-lamp
        size: petty
        qualities: [built-in]
        note: "narrow beam, 60 ft; built-in: an Eyebot's built-in parts take none of its six slots"
      - name: Small laser
        damage: d6
        qualities: [ranged, built-in]
        size: petty
        note: "built-in: an Eyebot's built-in parts take none of its six slots"
      - name: Built-in repair arm
        note: "counts as common tools; can carry 1 slot of cargo in its grip; built-in: an Eyebot's built-in
          parts take none of its six slots"
        qualities: [built-in]
        size: petty
      - name: Light chassis
        armor: 1
        qualities: [built-in]
        size: petty
        note: "built-in: an Eyebot's built-in parts take none of its six slots"
      - name: Built-in speaker
        note: "plays pre-war recordings and your own voice; built-in: an Eyebot's built-in parts take
          none of its six slots"
        qualities: [built-in]
        size: petty
      tables: [eyebot-1, eyebot-2]
      kind: robot
      max: {STR: 8, DEX: 16}
      slots: 6
  48:
    text: Robobrain
    data:
      quote: Under the armored glass dome that crowns your chassis is a human brain, floating in 
        biomedical gel and wired into a General Atomics combat platform on tank treads. The brain is
        yours. Before the war, the Army's Robobrain program took its brains from prisons, from 
        hospital beds, and from the occasional volunteer, and scrubbed each one with CODE 
        conditioning until nothing was left but an obedient machine. On you, the scrubbing didn't 
        take — not all of it. Somebody did this to you. You intend to find out who.
      names:
      - Subject 12
      - Professor Kellen
      - Old Thought
      - Brain-C
      - The Thinker
      - Dr. Moss
      - Subject Unknown
      - Nana
      - The Judge
      - The Witness
      caps: 3d6
      gear:
      - name: Built-in headlamp
        qualities: [built-in]
      - {name: Mounted laser pistol, damage: d8}
      - name: Mounted stun projector
        damage: d6
        qualities: [ranged]
        note: once per combat, a target it hits makes a WIL save or loses their next turn
      - name: Heavy chassis
        armor: 2
        size: bulky
        qualities: [built-in]
      - name: Pre-war photograph
        size: petty
        note: taped beneath your dome, where your optics can always see it
      tables: [robobrain-1, robobrain-2]
      kind: robot
  49:
    text: Zetan
    data:
      quote: You are small and grey and wrong. You have three fingers on each hand, no hair, and 
        eyes the wasteland's people have tried to describe and cannot. Your kind have been visiting 
        this world for a thousand years — taking its people, freezing them, opening them up, filing 
        them away. Now you are the one left behind among them. You are trying to get home, or trying
        to decide whether you want to.
      names:
      - The Visitor
      - Kt'sket
      - Greyling
      - Unlabeled
      - Nine
      - Traveler
      - Silver Eye
      - The Quiet One
      - Stranger
      - Moonchild
      caps: 3d6
      gear:
      - {name: Rations, uses: 3, note: 'you eat, but very little'}
      - name: Built-in dim light
        note: your eyes glow faintly
        qualities: [built-in]
      - name: Alien disintegration pistol
        damage: d10
        qualities: [ranged]
        uses: 4
        recharge: a full day of sunlight restores four shots
        note: ignores Armor; a target killed by it is disintegrated to ash
      - {name: Shimmering ship-cloth wrap, armor: 1}
      - name: Translation Device
        size: petty
        note: 'small: lets you understand any spoken language, though you still speak your own in high-pitched
          screeches and wails'
      tables: [zetan-1, zetan-2]
      kind: zetan
      max: {STR: 12, DEX: 16}
  50:
    text: Deathclaw
    data:
      quote: Your kind was not born — your kind was made, in a pre-war lab, out of chameleon stock 
        and worse, by people who wanted a cheap replacement for soldiers. After the bombs, the 
        Enclave took deathclaws back into the lab and bred a line that could think and speak, and 
        when that line stopped obeying, the Enclave hunted it down to the last egg. Not quite the 
        last. Somewhere, somehow, the gift came down to you. You are ten feet tall and armored and 
        clawed, and you can pronounce your own name. The wasteland does not know what to do with you
        — neither do you.
      names:
      - Grell
      - Thorn
      - Claw-Who-Thinks
      - Old Iron
      - The Reader
      - Kelm
      - Mother-Who-Walks
      - Sable
      - Quiet Hunter
      - The Exception
      caps: 3d6
      gear:
      - {name: Rations, uses: 6, note: 'every meal costs you two, and most of it is raw'}
      - name: Claws
        damage: '{d10, d10}kh1'
        size: petty
        note: natural, so no slot; cannot be disarmed, cannot be sheathed
      - name: Thick hide
        armor: 2
        size: petty
        note: natural, so no slot; cannot be removed or stacked with worn armor
      - name: Heavy travel cloak
        size: petty
        note: makes you look marginally less like what you are; barely works
      tables: [deathclaw-1, deathclaw-2]
      kind: deathclaw
      max: {DEX: 16}
