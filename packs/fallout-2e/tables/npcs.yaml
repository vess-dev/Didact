table: first-names
title: NPC names
description: "What `didact name npc` rolls: a row of the d10 Name table, then one name from that row,
  ready to use (a pre-war leftover, an earned name, an epithet, a vault-suit nickname, a faction rank
  and name, a ghoul's pre-war name, a pre-war title, an initial or a number). Wasteland NPCs go by one
  name."
dice: d10
source: overseers-guide/npc-tables#name-d10
entries:
  1: {table: npc-name-1}
  2: {table: npc-name-2}
  3: {table: npc-name-3}
