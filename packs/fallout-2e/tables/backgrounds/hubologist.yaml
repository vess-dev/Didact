# Hubologist (backgrounds/hubologist): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: hubologist-1
title: Why are you on the road?
dice: d6
source: backgrounds/hubologist
entries:
  1:
    text: The Pilgrimage. You were sent on a long walk across the region to visit a series of sites 
      the church has marked as sacred, most of them pre-war observatories, launch pads, and radio 
      arrays. They are marked on your Pilgrim's Chart (petty). One of them is not on any other map 
      you have ever seen.
    data:
      gear:
      - {name: Pilgrim's Chart, size: petty}
  2: The Audit. You were running a mobile audit clinic for the church — a cross between confession 
    and therapy, with the E-Meter as the instrument. A client told you something about a senior 
    Hubologist that the church does not want you to have heard. You left before they could ask you 
    what. It would ruin him.
  3: The Recovery. The church believes that a specific piece of pre-war aerospace hardware is hidden
    in a ruin. You were sent to retrieve it. You are not sure you want to give it to them when you 
    find it.
  4: The Schism. You were on the losing side of an internal argument over doctrine. You left under a
    cloud. Senior Hubologists you meet will recognize your face and react with caution. Junior ones 
    treat you with suspicion.
  5:
    text: The Doubt. You read a pre-war physics textbook that the church had not yet gotten around 
      to burning. You have questions the church cannot answer, and you are in the field because you 
      needed distance from the compound. You kept the Textbook (petty), a source for Research.
    data:
      gear:
      - {name: Textbook, size: petty}
  6: The Mission. Word reached the church that a sect of ghouls in the Mojave, the Bright 
    Brotherhood, launched themselves into the sky from the old REPCONN test site. You were sent to 
    learn how they did it, and to bring the method home. You have a direction. You do not yet have a
    target.
---
table: hubologist-2
title: What does church training still give you?
dice: d6
source: backgrounds/hubologist
entries:
  1: 'The E-Meter Read: Once per scene, you may hook a willing or restrained NPC up to your E-Meter for
    a minute of audit. They must make a WIL save or reveal one true thing about themselves you did not
    know. It works once per NPC.'
  2: 'Star Chart Mind: You have memorized the pre-war star charts the church uses as navigation aids.
    When traveling at night under open sky, you cannot become lost, so long as the stars are out. By day
    the charts do you no good.'
  3: "The Ascendant's Calm: Once per session, when you fail a WIL save against panic or fear, you may
    re-roll it. The church conditioned the first flinch out of you. They also conditioned other things
    out of you."
  4: "Pre-war Aerospace: The church trains its adepts on the old space program's manuals. You can identify
    any spacecraft component on sight, and you can work satellite dishes, radio telescopes, orbital-tracking
    consoles, and launch controls without a save."
  5: "The Sermon: Once per session, you can preach the church's teachings to a crowd for a scene. Listeners
    who fail a WIL save become curious about Hubology: their Reaction to you becomes Curious, or one step
    better if it was already Curious or better."
  6: 'The Vision: You had a vision once, during your novitiate, that you have never told anyone. The vision
    was accurate. Once per session, you may ask the Overseer a single yes/no question about the future
    of the current situation, and the Overseer must answer honestly.'
