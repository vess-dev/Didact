table: bounty-hunter-1
title: What was your first contract?
dice: d6
source: backgrounds/bounty-hunter
entries:
  1: The Raider Chief. A settlement hired you to bring in a raider chief's head. You brought in the 
    head, and the Regulators paid you again for his finger. You still take raider contracts as your 
    preferred work, and the Regulators' duster-and-hat men treat you as one of their own.
  2: The Deserter. An army wanted a deserter back. You found him in a settlement that was sheltering
    him. You let him go and lied to the army about where you had looked. You still have the caps, 
    and you still have the guilt.
  3: The Husband. A wife hired you to find her husband, who had walked into the wasteland one 
    morning and never come back. You found him. He had reasons. You did not tell the wife 
    everything, but you told her enough.
  4:
    text: The Wrong Target. You killed the wrong person on a contract. Nobody caught you. You have 
      been careful ever since. Take a Photograph (petty) of the wrong target, which you keep as a 
      reminder.
    data:
      gear:
      - {name: Photograph, size: petty}
  5: The Unkillable. A contract you could not finish — the target was too tough, too smart, or too 
    far. They are still out there. They know your name. They are on the first page of your Bounty 
    Book, under a thick black line.
  6: The Easy One. Your first contract was trivially easy and paid well — Talon Company wanted a man
    dead, and he never saw you coming. You found out afterward he had done nothing at all. Talon 
    Company still sends you work, and still thinks you'll take it.
---
table: bounty-hunter-2
title: What makes you better at finding people than other hunters?
dice: d6
source: backgrounds/bounty-hunter
entries:
  1: "The Trail: You cannot lose a trail less than a day old in any terrain. Given a fresh clue, you may
    declare a target's direction and approximate distance once per session; the Overseer confirms."
  2: "The Fixers: You know a fixer in every major settlement within a week's travel. They sell you names,
    rumors, and occasionally a bed."
  3: "The Cuff: You can subdue a humanoid who doesn't see it coming with a single action (d4 damage; the
    target makes a STR save or is knocked unconscious for one hour)."
  4: 'The Long Scope: Attacks with any ranged weapon from more than 80 feet are not Impaired for distance.
    Once per combat, your first shot at a target more than 80 feet away is Enhanced.'
  5: 'The Reputation: Once per session, in a settlement that has heard of you, you may present your credentials
    and a hostile NPC makes a WIL save or backs down from a confrontation. Works once per settlement.'
  6: "The Quiet Word: When you look a target in the eyes and tell them a specific fact about their past,
    they make a WIL save or freeze for one round — no action. Once per combat. The Overseer tells you
    the fact if you don't have one."
