table: powder-ganger-2
title: What does a Powder Ganger do best?
dice: d6
source: backgrounds/powder-ganger
entries:
  1: 'Dynamite Hand: Lighting and throwing a stick of dynamite is one action for you, and you can throw
    it twice as far as anyone else. You have never once set one off by mistake.'
  2: "The Fuse Cut: Given a turn of work, you can turn any thrown explosive into a timed explosive — a
    target sees it land and thinks it's a dud for one round before it detonates."
  3: 'The Chain: You can build a chain of linked explosives from any stack of dynamite given a Downtime
    Action. When one goes off, they all go off, even if separated by distance — for a single detonation.'
  4: 'Tunnel Rat: Tight tunnels, dust, and smoke never Impair your attacks. You know how to breathe through
    a rag of ash, and you can tell at a glance which timbers will hold and which way out is safe.'
  5: 'The Blasting Eye: You can look at a section of wall or rock and tell the Overseer exactly where
    to put the charge to bring it down cleanly. If you have the explosive, you get the hole where you
    want it.'
  6: "Gang Sign: You know the Powder Ganger hand signals and chalk marks. Any route another gang has marked
    as safe or dangerous, you can read at a glance. Once per session you may declare you recognize a gang's
    mark at a current location, and the Overseer tells you what it means."
