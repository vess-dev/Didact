table: powder-ganger-1
title: What did the riot do to you?
dice: d6
source: backgrounds/powder-ganger
entries:
  1: The Kingmaker. You were the one who planned the riot. You built the detonator and timed the 
    charges. The other inmates still owe you. Across the region, old Powder Gangers will open a door
    for you if you give the sign.
  2: "The Runner. You set off the first charge and ran. You did not look back. You have spent the time
    since running, and settlements with Republic ties have a standing bounty on your head. Running is
    the one thing you're better at than blasting: once per session, you automatically pass a save to escape,
    outrun, or shake a pursuer."
  3: The Gangster. You stayed with the crew after the riot and ran a stretch of highway for a year. 
    You have killed caravan guards. You have let caravans through for a bribe. You walked out when 
    the crew started eating its own, and you still know every toll point, ambush cut, and buried 
    stash on that road.
  4:
    text: The Burnt One. A charge went off too close. You lost an ear, half your face, and three 
      fingers on your off hand. You are still dangerous. Take a Blackened Rag (petty) you wear 
      across your face. Fire and explosions have already taken what they can from you — once per 
      session, you may ignore the first Critical Damage you take from a fire or explosion, shrugging
      it off where it would drop another man.
    data:
      gear:
      - {name: Blackened Rag, size: petty}
  5:
    text: 'The Reformed One. You have stopped running dynamite for a living. You do not want to be a Powder
      Ganger anymore, and the crew does not accept resignations. You kept the Remote Detonator (petty)
      you built for them and never handed over: it sets off any charge you have wired within a hundred
      yards.'
    data:
      gear:
      - {name: Remote Detonator, size: petty}
  6:
    text: The Blueprint. You memorized the layout of the rail tunnels you were forced to blast. You 
      know where crates of dynamite are still stashed underground. Take a Sketch Map (petty).
    data:
      gear:
      - {name: Sketch Map, size: petty}
