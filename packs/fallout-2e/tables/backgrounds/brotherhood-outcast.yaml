table: brotherhood-outcast-1
title: What was the last straw?
dice: d6
source: backgrounds/brotherhood-outcast
entries:
  1:
    text: The Aid Shipment. Your Elder authorized the distribution of Stimpaks to a settlement dying
      of disease. You and your faction believed this was a betrayal of the oath. You walked out the 
      gate that night with 3 Stimpaks from the crate you refused to hand over.
    data:
      gear:
      - {name: Stimpak, size: petty, uses: 1, count: 3}
  2:
    text: The Ghoul. Your Elder accepted a ghoul into the chapter as a scribe. The ghoul was 
      competent and loyal. You could not accept this. The ghoul is still in the chapter, still loyal
      — and the night before you left, the ghoul slipped you a sheaf of handwritten Maintenance 
      Notes (petty) for your suit. With them, every fusion core runs your armor twice as long. This 
      is the bitter part.
    data:
      gear:
      - {name: Maintenance Notes, size: petty}
  3:
    text: The Ruling. The Elder heard arguments on whether to recover a specific relic or defend a 
      settlement from raiders. Defense won; you were the minority. You took the shelved Mission 
      Folder (petty) with you — the relic's last known location, and the patrol route that would 
      have reached it.
    data:
      gear:
      - {name: Mission Folder, size: petty}
  4:
    text: The Weapon. Your chapter recovered a pre-war weapon of significant power. Your Elder 
      ordered it destroyed rather than catalogued. You and a small group stole it the night before 
      the destruction. You have it now — the Overseer picks one pre-war energy or heavy weapon worth
      up to 500 caps from the Marketplace. Your old chapter wants it back.
    data: {pick: outcast-weapons}
  5:
    text: The Fallen. Your mentor was killed in a raid you believe was preventable. The Elder 
      disagreed. You left with a small band the same week. You carry your mentor's Combat Knife 
      (d6).
    data:
      gear:
      - {name: Combat Knife, damage: d6}
  6:
    text: The Heresy. You discovered that a senior member of your chapter was, in fact, a Gen-3 
      synth. The Elder refused to act. You left with the only proof — a Scanner Readout (petty) 
      nobody would look at. The synth is still in the chapter.
    data:
      gear:
      - {name: Scanner Readout, size: petty}
