table: brotherhood-outcast-2
title: What part of the old creed do you still carry?
dice: d6
source: backgrounds/brotherhood-outcast
entries:
  1: "The Codex: You hold the Codex by heart, and with it the Order's records of pre-war military hardware.
    Once per session you may ask the Overseer whether a specific piece of pre-war tech you are looking
    for exists in the current ruin. The Overseer answers honestly."
  2: "The Unbroken Oath: You refused to break the Brotherhood's first oath. Once per session, you may
    re-roll a failed WIL save against charm, persuasion, or compulsion from anyone outside the Brotherhood."
  3:
    text: "The Purist's Hand: You reject chems outright — no Psycho, no Jet, no Buffout, no Mentats. In
      exchange, your body runs clean: Stimpaks heal you 2d6 STR instead of 1d6, and you cannot be addicted.
      The cost is real — when the party is popping chems before a fight, you stand there with nothing
      but your training."
    data:
      immune: [addiction]
      stimpak: 2d6
  4: 'The Old Drill: Every Brotherhood Outcast is power-armor trained; your drilling went further. Once
    per scene, while in power armor, you may sprint, climb, or move quietly for one round — pick one.'
  5: 'The Watch: You can name, on sight, every pre-war robot model, every mod bolted onto it, and every
    synth generation that shows its wiring. Gen-3s show nothing, and you have made it your business to
    catch them anyway: once per session, after watching someone for a full scene, you may ask the Overseer,
    "Is this person a synth?"'
  6: 'The Keeper: You trained under a now-dissolved suborder that taught hands-on mastery of pre-war hardware
    — calibration, maintenance rituals, the dozen small tricks an original operator would have known.
    Once per session, when you declare a single pre-war relic "secured for the Brotherhood," it works
    at full pre-war spec while in your hands — and only in your hands. If it is a weapon, attacks with
    it are Enhanced for the rest of the scene; if it is a charged device, it gains one extra use this
    session; if it is broken, you may treat it as functional for one decisive action.'
