# Wastelander (backgrounds/wastelander): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: wastelander-1
title: What taught you to survive?
dice: d6
source: backgrounds/wastelander
entries:
  1:
    text: 'The Long Walk. When you were six, your family walked the old interstates from the Capital Wasteland
      to the Commonwealth, chasing a rumor of clean water. You remember every mile. Take a Hand-Drawn
      Map (petty) of the highways no merchant has: while the party follows an old interstate, or a beaten
      trail that branches off one, it cannot get lost.'
    data:
      gear:
      - {name: Hand-Drawn Map, size: petty}
  2:
    text: The Fire. The Forged came down from the Saugus Ironworks and burned your settlement when 
      you were twelve. You pulled your little brother out from under a burning roof. Take a scorched
      Fire Axe (d10, bulky) and a slow-burning rage. Fire never makes you Panic.
    data:
      gear:
      - {name: Fire Axe, damage: d10, size: bulky}
  3: The Ghoul Year. A feral wave came boiling out of the old metro tunnels and took your county in 
    a single season. You learned to read them — the twitch before the lunge, the lucid ones from the
    gone. Feral ghouls never catch you by surprise, and you can always tell a lucid ghoul from one 
    who is sliding feral.
  4:
    text: The Flood. Raiders blew the dam above your town, the way Thorpe's gang drowned Charleston 
      in the old Appalachian stories, and you were the only one who could swim. Take 100 feet of 
      Rope (coiled tight, 1 slot) and a Grappling Hook. Swimming never costs you a save unless the 
      water is churning, burning, or full of something with teeth.
    data:
      gear:
      - {name: Rope, note: '100 feet, coiled tight, 1 slot'}
      - Grappling hook
  5: 'The Quiet Winter. Everyone you knew starved or froze the winter the caravans stopped coming. You
    can find food anywhere: when you take the Supply action, roll the Supply die one step higher (d4 →
    d6, d6 → d8, and so on).'
  6:
    text: The Old Man. He wasn't your father. He taught you anyway. Take his Hunting Rifle (d10, 
      bulky) with a brass nameplate on the stock. You know the name. You never say it.
    data:
      gear:
      - {name: Hunting Rifle, damage: d10, size: bulky}
---
table: wastelander-2
title: What do you carry that marks you?
dice: d6
source: backgrounds/wastelander
entries:
  1:
    text: 'Coat of Teeth: A cloak sewn with yao guai and radstag teeth. Cold weather never makes you Deprived,
      and raiders and tribals who see it take you for one of the dangerous ones: their first Reaction
      to you is one step better.'
    data:
      gear:
      - {name: Coat of Teeth, note: a cloak sewn with yao guai and radstag teeth}
  2:
    text: "Sand Goggles: Pre-war aviator's goggles. You see clearly through sandstorms, rad storms, and
      heavy smoke; your attacks in such conditions are not Impaired."
    data:
      gear:
      - {name: Sand Goggles, size: petty, note: pre-war aviator's goggles}
  3:
    text: 'Crow Whistle: A carved bone whistle. Blow it and crows answer from miles off. Where they circle,
      something has died in the last day — you can find any fresh corpse, battlefield, or ambush site
      within a mile before anyone else does.'
    data:
      gear:
      - {name: Crow Whistle, size: petty, note: a carved bone whistle}
  4:
    text: "Dog Named Gristle: A rangy, scarred mongrel. 3 HP, 10 STR, 14 DEX, 5 WIL, bite (d6). Follows
      simple commands, and points silently at anything it doesn't like."
    data: {companion: gristle}
  5:
    text: "Rad Beads: A string of discolored beads that tick when Rads are near. A poor man's Geiger counter,
      always ticking at least a little: you always know before you step into a hot zone."
    data:
      gear:
      - {name: Rad Beads, note: a string of discolored beads that tick when Rads are near}
  6: "Wasteland Tattoos: A record of every place you've been, worked into ink by old-timers along the
    trade roads. Wastelanders you've never met recognize the work: their first Reaction to you is one
    step better, and they'll tell you what's waiting down the road."
