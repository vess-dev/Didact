table: slaver-2
title: What does your past still give you?
dice: d6
source: backgrounds/slaver
entries:
  1: "Dead Drop Network: You know where your old crew stashes supplies. Once per session you may raid
    one: roll once on the Loot Roll Tables' Random Gear and once on Chem Stash. They will notice eventually."
  2: 'Crew Jargon: You speak the coded language of slavers and collar-runners across the region. You can
    safely move through their territories if you play the part.'
  3: 'The Collar: You know how to disarm a slave-collar without triggering it. A single turn of work.
    You have freed eleven people this way; you know where the twelfth one is.'
  4: 'Old Grudges, Old Favors: You know three specific slavers who hate you, and two who owe you favors.
    The Overseer names them.'
  5: "Trade Signs: You spot the marks of recent slave traffic at a glance — a chain-scrape on a doorframe,
    a brand on a cold campfire stone, fresh shallow graves off the path. When such signs exist within
    a watch's travel, the Overseer tells you plainly."
  6: 'The Hard Voice: Once per session, you may threaten a person so specifically and quietly that they
    make a WIL save or comply immediately with a simple, non-self-destructive demand (move, talk, hand
    something over). It never works twice on the same person.'
