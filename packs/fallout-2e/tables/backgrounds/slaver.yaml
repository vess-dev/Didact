table: slaver-1
title: Why did you stop, and what are you paying off?
dice: d6
source: backgrounds/slaver
entries:
  1: The Face. One of the people in a shipment reminded you of someone you had loved. You broke the 
    collars and walked. Now you are tracking down and freeing every person your old crew still holds
    — a list of sixteen names. Four remain. The crew is hunting you.
  2: The Crew. You were betrayed by your own crew boss — you were on the next shipment. You killed 
    the boss and walked. Now you intend to kill every member of your former crew. A list of nine 
    names. Six remain.
  3:
    text: The Child. A child escaped your camp. You were sent to bring them back. You let them go. 
      Take A Small Shoe (petty) the child left behind. Now you are trying to return each captured 
      person to the settlement you took them from. Most of the settlements are gone. You improvise.
    data:
      gear:
      - {name: Small Shoe, size: petty}
  4:
    text: "The Ledger. You read the ledger and saw the name of a childhood friend. You walked out before
      dawn. Take the Torn Ledger Page (petty) with your friend's name on it. You have attached yourself
      to one specific person in the party and silently sworn their life is your penance: once per session,
      you may take a hit meant for them."
    data:
      gear:
      - {name: Torn Ledger Page, size: petty}
  5: The Promise. You promised a dying prisoner you would carry a message to their family. The 
    family has since built a small settlement of freed captives, and you are trying to help it 
    survive as an act of restitution. Name it. You send caps there when you can; its people will 
    hide you, and once per session you can send word for help.
  6: 'The Reckoning. You were stopped by someone who should have killed you and did not. You do not know
    why they spared you. You do not believe you can be forgiven. You intend to keep doing good work until
    something in the wasteland ends you: once per session, when you put yourself at risk to save a stranger,
    you automatically pass the first save it costs you.'
