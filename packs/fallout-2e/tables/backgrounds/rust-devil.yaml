# Rust Devil (backgrounds/rust-devil): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: rust-devil-1
title: What part of you is not flesh anymore?
dice: d6
source: backgrounds/rust-devil
entries:
  1: The Arm. Your right arm from the elbow down is a pre-war robot limb. Unarmed strikes with it 
    are d8. It can interface directly with pre-war terminals through a retractable cable.
  2: The Eye. Your right eye is a pre-war assaultron optical core. You can see clearly in total 
    darkness up to 40 feet. Spend a turn studying a pre-war robot and your next attack against it is
    Enhanced — the core shows you the seam where the armor plating meets. Your pupil is a burning 
    red point.
  3: The Spine. Your spine has been reinforced with welded steel and servo-supports. You cannot be 
    knocked down or thrown, and heavy loads and hard labor never make you Deprived. You also set off
    metal detectors at a hundred feet.
  4: The Voice. Your vocal cords have been replaced with a robotic voice module tuned to pre-war 
    command frequencies. Once per session, you may broadcast a short order on an unaware pre-war 
    robot's channel; it follows the order once, as if from its old foreman. Your ordinary speech 
    comes out in a flat factory monotone.
  5: The Legs. Both of your legs below the knee are sentry-bot tread assemblies. You move at normal 
    pace on open ground, and Tough or Perilous terrain does not slow you. You cannot climb ladders 
    or swim.
  6: The Heart. Your heart was replaced with a pre-war mini-reactor when the original one gave out. 
    You ignore the first Rad per day from any source, you do not need to sleep, and you need a fresh
    fusion cell installed at your core every two weeks or you die.
---
table: rust-devil-2
title: What did the workshop teach you that the crew did not?
dice: d6
source: backgrounds/rust-devil
entries:
  1: 'Build Your Own: Given a Downtime Action and common parts, you can build a small hovering robot companion:
    a floating camera drone with a weak laser (2 HP, 8 STR, 14 DEX, 4 WIL, laser (d6)). If destroyed,
    you can build another next Downtime.'
  2: "Robot Butcher: The crew stripped robots for parts, and so did you. You can identify any robot's
    model and factory specs at a glance, and you know where its seams are: your attacks against robots
    step up one damage die (capped at d12)."
  3: 'Limb Mod: Given a Downtime Action and a workshop, you can install a small cybernetic upgrade into
    yourself or another willing target. The Overseer determines the mechanical effect, which is always
    small and usually useful.'
  4: 'Hack-in-Place: Once per session, you may wire yourself directly into any damaged pre-war robot within
    reach and issue it a simple one-sentence command. The robot follows the command once, then powers
    down.'
  5: 'The Scream: Once per scene, you can emit a piercing machine-noise that scrambles electronic sensors.
    Cameras, eyebots, and automated turrets in earshot make a WIL save or shut off for one round.'
  6: "Reliable Failure: When you take Critical Damage, one of your working augments breaks instead. You
    lose that augment's benefit until you repair it (a Downtime Action at a Workshop), but you take no
    other Critical effect. With no working augment left, Critical Damage takes you like anyone else."
