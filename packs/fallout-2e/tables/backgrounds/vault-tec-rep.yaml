table: vault-tec-rep-1
title: Which vault did you run to?
dice: d6
source: backgrounds/vault-tec-rep
entries:
  1: The Nearest Door. You ran to the closest vault whose location you had memorized. They opened. 
    You spent two centuries in cryo. You have no idea why they chose to wake you.
  2: Your Own Sale. You ran to a family you had personally signed up that morning. They were already
    inside. They let you in out of politeness. You owe them more than you can ever repay. The family
    line is still alive, in a settlement somewhere. You are looking for them.
  3: The Executive. You were with a senior Vault-Tec executive when the bombs fell. He got you both 
    into an executive vault. He is still alive. He is somewhere in the wasteland and he is not the 
    same.
  4:
    text: The Closed Door. You pounded on a vault door that did not open. A door two blocks over 
      did. That is the entire reason you are alive. Take a Brass Plaque (petty) with the name of the
      first vault, which you carry as penance.
    data:
      gear:
      - {name: Brass Plaque, size: petty}
  5: "The Wrong Vault. The vault you ran to was not the one you had been assigned to. The vault's Overseer
    was not pleased. You spent a very long time working off the debt, and you learned what the place was
    really for: pick a vault from the Vaults book — you know its Hidden."
  6: The Sealed Office. You did not run to a vault. You ran to a Vault-Tec regional office, sealed 
    yourself inside, and lived on vending-machine snacks for an unreasonable number of weeks before 
    a company team found you and put you on ice in the executive cryo bay, "for your own safety." 
    The weeks before the ice changed you. You still know the office's access codes, and the office 
    is still there.
---
table: vault-tec-rep-2
title: What does a Vault-Tec salesman carry, even after two centuries?
dice: d6
source: backgrounds/vault-tec-rep
entries:
  1: 'The Pitch: Once per scene, you may deliver a short enthusiastic sales pitch to any NPC. The listener
    must make a WIL save or their Reaction shifts one step better for the rest of the scene. Works once
    per NPC.'
  2:
    text: 'The Clipboard: A pre-war Vault-Tec clipboard with clean sheets and a working pen. People believe
      you are official when you carry it. Once per session, you may claim to be performing a corporate
      survey and an NPC will answer one question honestly.'
    data:
      gear:
      - {name: Clipboard, note: 'pre-war Vault-Tec, with clean sheets and a working pen'}
  3:
    text: "Demonstration Override: Vault-Tec gave its salesmen a single override card for opening a model
      vault's door to prospective buyers. Yours was never used. It opens the main door of any Vault-Tec
      vault — once."
    data:
      gear:
      - name: Demonstration Override Card
        uses: 1
        note: opens the main door of any Vault-Tec vault, once
  4: 'The Ledger: You remember the names and vault assignments of every family you personally signed up.
    Once per session, you may ask the Overseer whether a specific named pre-war family survived and in
    which vault. The Overseer answers honestly.'
  5: 'The Tour: You memorized the full layout of your first vault. You have been slowly mapping every
    vault you can find, comparing them to the original training materials. You always know which direction
    the reactor is in, and where the cryo wing would be.'
  6: 'The Corporate Secret: You know one specific thing the company did that it should not have. Once
    per campaign, you may reveal this secret publicly — the Overseer decides what happens, but it is always
    significant.'
