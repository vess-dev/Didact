table: super-mutant-1
title: What does your body do that a human's does not?
dice: d6
source: backgrounds/super-mutant
entries:
  1: Big. You cannot sneak past a guard at normal range. You also cannot be grappled by anything 
    shorter than you. All your unarmed damage is d8 instead of d4.
  2:
    text: Hard. You have a thick hide. +1 Armor permanently (this stacks with worn armor, up to the 
      max of 3).
    data:
      gear:
      - name: Thick hide
        armor: 1
        size: petty
        note: '+1 Armor permanently: your own hide, so no slot; stacks with worn armor up to 3'
  3: Slow Burn. Radiation doesn't just spare you — it feeds you. The first time each scene the 
    environment would give a human a Rad (a hot zone, a rad storm, a mouthful of glowing water), 
    roll the Die of Fate; on a 4+, you heal 1 STR.
  4:
    text: Pressure Blood. You do not bleed out. Your Scar rolls never use the Bleeding Out entry — 
      re-roll. However, cold terrain counts as one step harder for you on the Terrain Difficulty 
      ladder.
    data:
      immune: [bleeding-out]
  5: Two Tongues. You can speak clearly, and you can also speak the low growling language of super 
    mutants. Super mutant Reactions toward you shift one step better.
  6: Deep Lungs. You can hold your breath for ten minutes. You can wade through toxic smoke unharmed
    for a single turn and ignore the first dose of a chem cloud each scene.
