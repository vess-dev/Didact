table: super-mutant-2
title: What do people see when they see you?
dice: d6
source: backgrounds/super-mutant
entries:
  1: "The Friend: Children aren't afraid of you. Once per settlement, a child will lead you to a place
    adults do not want you to go."
  2: 'The Warhammer: You were once hired as a living weapon. Take a Contract Brand burned into your shoulder.
    Any mercenary who sees it recognizes your old crew and will usually parley first.'
  3:
    text: 'The Burden: You were a protector. Take a Small Photograph (petty) of the family you used to
      live with. They are in a settlement you cannot bring yourself to visit.'
    data:
      gear:
      - {name: Small Photograph, size: petty}
  4: "The Monster: The first settlement you try to enter each session refuses you until you prove yourself
    somehow; after you do, that settlement always lets you in. Enemies size you up first, too: once per
    combat, you can roar and draw every enemy's next attack onto yourself."
  5:
    text: 'The Survivor: You carry Three Worn Tokens around your neck — taken from people who tried to
      kill you and failed. Raider Reactions toward you shift one step worse, and any hired killer who
      recognizes them must pass a Morale save before coming at you.'
    data:
      gear:
      - {name: Worn Tokens, note: 'three, around your neck'}
  6: 'The Listener: Despite your size, people tell you things. When you first enter a new settlement,
    the Overseer tells you one rumor for free.'
