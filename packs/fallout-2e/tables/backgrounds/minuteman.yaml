table: minuteman-1
title: What did you do when the settlement you founded needed you most?
dice: d6
source: backgrounds/minuteman
entries:
  1:
    text: You Held the Line. You and three other defenders held the gate of a small settlement 
      against a raider warband for an entire night. Two of the other defenders died. Take a Militia 
      Armband (petty) from one of them. Behind a wall, a gate, or a barricade you are defending, you
      cannot be Panicked.
    data:
      gear:
      - {name: Militia Armband, size: petty}
  2:
    text: You Went to Talk. You walked unarmed into the raider camp and negotiated a withdrawal. The
      deal held for a year before it broke. Take the Truce Token (petty) the raider chief gave you; 
      show it once, and that chief's raiders will talk before they shoot. The chief is still alive.
    data:
      gear:
      - {name: Truce Token, size: petty}
  3:
    text: You Rebuilt. Your settlement was burned to the ground, and you rebuilt it from ash. Every 
      nail, every board. Take A Small Bag of Pre-war Nails (petty, worth more than caps in some 
      places). The settlers there start at Idolized and will shelter you against any pursuer short 
      of their own death.
    data:
      gear:
      - name: Small Bag of Pre-war Nails
        size: petty
        note: worth more than caps in some places
  4:
    text: You Lost It. The settlement you founded is gone, the way Quincy went when the Gunners came
      over the walls. You were away when it happened. Take the Key to the Root Cellar (petty). The 
      key still works.
    data:
      gear:
      - {name: Key to the Root Cellar, size: petty}
  5: 'You Recruited. You walked every settlement in the region and recruited a militia of sixteen people.
    Ten are still alive. You know their names and where each of them lives: once per session, one of them
    turns up in the next settlement you reach, ready to stand with you for a day.'
  6:
    text: You Killed for It. The settlement demanded one last act from you before it was safe. You 
      did it. You do not talk about it. Take a Blood-Stained Flare (petty). It still works.
    data:
      gear:
      - {name: Blood-Stained Flare, size: petty}
---
table: minuteman-2
title: What do you do that no raider has learned to do?
dice: d6
source: backgrounds/minuteman
entries:
  1: 'Laser Musket Overcharge: You may overcrank your musket past its safety stop: an overcranked shot
    also ignores 1 Armor, and once per combat you may overcrank without spending the round.'
  2: 'The Recruitment Speech: Once per session, you may give a short speech to a non-hostile settlement
    and gain a temporary Minuteman Militia for one scene: 2d4 armed volunteers, each 3 HP, 11 STR, 12
    DEX, 11 WIL, pipe rifle (d6, bulky).'
  3: 'The Flare: When you fire a Minuteman Flare into the sky within sight of a settlement you have helped
    in the past, a militia scouting party (1d4 militiamen) arrives by the next watch.'
  4: "Trail Sense: You know every back road, alternate route, and hidden farmstead within a day's walk
    of any settlement you have ever visited. Inside that ring, you cannot become lost. Past it, you walk
    by map and prayer like anybody else."
  5: 'Settlement Builder: Given a Downtime Action and common tools, you can erect a basic defensive position,
    a working still, or a functional water pump. Settlements you have built this in will welcome you permanently.'
  6: 'Leadership: Once per scene, name a single ally in line of sight. For the rest of the scene they
    cannot become Panicked. You still can.'
