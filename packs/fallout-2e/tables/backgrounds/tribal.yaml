# Tribal (backgrounds/tribal): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: tribal-1
title: What did your elders teach you?
dice: d6
source: backgrounds/tribal
entries:
  1:
    text: Reading the Wind. You can smell a rad storm a full watch before it arrives, and you know 
      which direction the hot air is coming from. You start with a Carved Horn (petty) you blow as a
      warning.
    data:
      gear:
      - {name: Carved Horn, size: petty}
  2: The Quiet Foot. You were trained to cross gravel and dead leaves without a sound. When you 
    scout ahead alone, nothing hears you coming, and the party can never be surprised by anything 
    you walked into first.
  3:
    text: The Mender's Plants. You know twenty wasteland plants by hand and which to chew, burn, or 
      bind into a wound. Take an Herb Pouch of broc flower and xander root, ground the old Arroyo 
      way (3 uses — each restores 1d4 STR to one target and clears 1 Rad).
    data:
      gear:
      - name: Herb Pouch
        uses: 3
        note: broc flower and xander root; each use restores 1d4 STR to one target and clears 1 Rad
  4: The Hunter's Mark. You learned to track on rock, in rain, across concrete. Once per session, 
    you may ask the Overseer "Has someone been here recently, and which way did they go?" and the 
    Overseer answers honestly.
  5:
    text: The Clan Drum. You carry a Skin Drum (petty). Beaten slowly at camp, it keeps wild animals
      within half a mile away for the night. If something attacks you before dawn anyway, it is not 
      an animal.
    data:
      gear:
      - {name: Skin Drum, size: petty}
  6: "The Long Oath. You swore to your elders never to enter a vault — the Vault-Tec tombs where the old
    world buried its children alive. Break the oath and lose 1 max WIL for good. Keep it, and the old
    world's tricks slide off you: once per session, re-roll a failed WIL save against a machine's voice
    — a robot's orders, a hologram, a pre-war recording, a terminal's warning."
---
table: tribal-2
title: What do you carry in your pack that the ruin people don't understand?
dice: d6
source: backgrounds/tribal
entries:
  1:
    text: "The Father's Page: A page torn from the journals of the survivalist the Sorrows call the Father
      in the Caves. Once per session, in canyon or cave country, you may say you know where he left a
      cache, a spring, or a safe cave; the Overseer places one within a day's walk."
    data:
      gear:
      - {name: The Father's Page, note: torn from the journals of the Father in the Caves}
  2:
    text: 'Claw of the First Kill: Your grandmother pulled it off a deathclaw she killed alone. Bound
      to a bone grip, it fights as a d8 knife. Once per session, a hostile creature that sees it must
      make a WIL save or hesitate — it loses its next action.'
    data:
      gear:
      - name: Claw of the First Kill
        damage: d8
        note: "a deathclaw's claw on a bone grip: it fights as a d8 knife"
  3:
    text: "Blinding Ash: A small leather bag of black ash from a town that burned before you were born.
      Thrown at a target's face: DEX save or blinded for one round — their attacks are Impaired, and attacks
      against them are Enhanced. 1 use."
    data:
      gear:
      - name: Blinding Ash
        uses: 1
        note: "thrown at a target's face: DEX save or blinded for one round"
  4:
    text: 'Clean-Water Skin: A waterskin filled at a hidden pre-war aquifer your clan guards — the water
      there runs through undamaged filtration bedrock and is cleaner than any RadAway. Drinking it once
      clears all Rads, and then the skin is empty. You must refill it at the same source.'
    data:
      gear:
      - name: Clean-Water Skin
        uses: 1
        keep: true
        note: drinking it once clears all Rads; refill it at the same source
  5:
    text: "Smoke Pipe: A brahmin-bone pipe and a pouch of the sedating herb your clan cures (3 uses).
      Pass it around a campfire: up to three people who share it with you make a WIL save or nod off for
      an hour. You've built up a tolerance. They haven't."
    data:
      gear:
      - name: Smoke Pipe
        uses: 3
        keep: true
        note: a brahmin-bone pipe and a pouch of your clan's sedating herb
  6: "Marked Skin: Your tattoos are your clan's history and its treaties, inked by the elders. Other tribals
    read them at a glance: their Reactions to you shift one step better."
