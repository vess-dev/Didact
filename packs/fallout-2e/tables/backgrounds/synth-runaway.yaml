table: synth-runaway-1
title: What gave you away to yourself?
dice: d6
source: backgrounds/synth-runaway
entries:
  1: The Scar. A wound you took years ago healed wrong. The skin beneath is perfectly smooth and 
    cold. You started checking other places. Most of you is smooth.
  2:
    text: The Photograph. In a settlement's records you found a photograph of someone with your face
      and your name, who disappeared the year you think you were born. You look exactly the same. 
      Take the Photograph (petty). You were built to replace them, and somebody out there still 
      misses them.
    data:
      gear:
      - {name: Photograph, size: petty}
  3: The Voice. A voice speaks in your head sometimes, giving you instructions in a calm, measured 
    tone. You have begun not to follow them. It does not like that.
  4: The Dream. You dreamed the same dream every night for a week, and in the dream a man with no 
    face said a code phrase. Repeating it aloud now causes you to faint and wake with orders you do 
    not remember receiving.
  5:
    text: The Other You. You met someone who looked exactly like you, and had your name, and had a 
      different past. Take a Small Ring (petty) they gave you before they died.
    data:
      gear:
      - {name: Small Ring, size: petty}
  6: The Key. The component in your skull still carries an Institute clearance you never asked for. 
    Institute-pattern doors and terminals open at your touch, even ones you have never seen before. 
    You don't know why yet, and you don't know who is notified when they do.
---
table: synth-runaway-2
title: What unsettles even your friends?
dice: d6
source: backgrounds/synth-runaway
entries:
  1: 'Precise Hand: Your first melee attack against a target you have studied for at least a minute is
    Enhanced.'
  2: 'Clean Sleep: You do not need sleep, but you need to power down for one hour each night. During that
    hour you are helpless. Anyone watching you closely will notice.'
  3: 'Perfect Memory: You forget nothing you have heard. Once per session, the Overseer must give you
    word-for-word recall of a conversation the party had with any NPC.'
  4: 'White Blood: You bleed synth fluid, thin and milky-white, and you heal slower than you should. You
    can hide it for a while. If a wound shows your blood in public, Reactions from that settlement shift
    one step worse, permanently — but a synth who sees it will trust you absolutely.'
  5: 'Unshakable: You cannot become Panicked, and you automatically pass WIL saves against charm-like
    effects. However, the Overseer may, once per session, hand you a short note to read and act out —
    a buried subroutine overriding you.'
  6: 'Uncanny Stillness: You can stand perfectly still for hours. While you hold perfectly still, you
    automatically pass DEX saves to stay hidden from normal means of detection — patrols, motion sensors,
    even trained dogs.'
