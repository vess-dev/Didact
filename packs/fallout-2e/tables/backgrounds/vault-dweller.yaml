# Vault Dweller (backgrounds/vault-dweller): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: vault-dweller-1
title: Why did you leave the vault?
dice: d6
source: backgrounds/vault-dweller
entries:
  1:
    text: The Water Chip. Your vault's water-purification chip is dying, the way Vault 13's did in 
      the old stories, and the Overseer drew your name by lottery. Take the Burned-Out Water Chip 
      you have to match and a page of specifications in the Overseer's hand. You can tell at a 
      glance whether any pump, purifier, or water chip still works. Every day you are gone, the 
      vault gets thirstier.
    data:
      gear:
      - name: Burned-Out Water Chip
        note: with a page of specifications in the Overseer's hand
  2:
    text: "The Experiment. You got into the Overseer's terminal and read the sealed orders. Your vault
      was never a shelter — it was one of Vault-Tec's experiments, and you were the variable. You took
      the Overseer's Ring of Service Keys on the way out: Vault-Tec cut every maintenance hatch and supply
      locker in every vault to the same few patterns, and one of these keys always fits. You don't talk
      about what you read. (Pick your vault from the Vaults book, or let the Overseer choose.)"
    data:
      gear: [Ring of Service Keys]
  3:
    text: The One Who Left First. Your sibling slipped out through the maintenance tunnel one night 
      and never came back, and the Overseer struck their name from the census. Take their Photograph
      (petty) — a place name is written on the back in their hand — and a growing certainty that the
      Overseer knows more than he said.
    data:
      gear:
      - {name: Photograph, size: petty}
  4:
    text: The Exile. The vault voted you out, the way vaults do when the numbers stop adding up. You
      don't talk about why. Take your grandfather's .357 Service Revolver (d8) and a Sealed Envelope
      (petty) the Overseer pressed into your hand at the door, "for when you need it." Its contents 
      are the Overseer's to decide, the day you finally open it.
    data:
      gear:
      - {name: .357 Service Revolver, damage: d8}
      - {name: Sealed Envelope, size: petty}
  5:
    text: Reclamation Day. The door opened on a schedule set before the war — the way Vault 76 
      opened, a quarter-century after the bombs; yours waited far longer. No warning, just the 
      gear-wheel rolling back and half the vault walking out beside you. Take a Vault Door Key 
      (petty) that won't open the door again, no matter what you try, and the Water-Purification 
      Tablets (3 uses) every dweller got at the door; each makes a canteen of dirty water safe to 
      drink.
    data:
      gear:
      - {name: Vault Door Key, size: petty}
      - {name: Water-Purification Tablets, uses: 3}
  6:
    text: "The Radio. Your Pip-Boy caught a station nobody in the vault had ever heard — a woman singing
      in a language nobody spoke — and you followed it out the door. Take a Wind-up Radio that still picks
      her up, mostly at night. It pulls in every other broadcast too: once per session, you can listen
      in on a nearby faction's radio traffic for a scene."
    data:
      gear: [Wind-up Radio]
---
table: vault-dweller-2
title: What did your G.O.A.T. say you were good for?
description: Vault-Tec's Generalized Occupational Aptitude Test sorts vault teenagers into their 
  life's work at sixteen, and every one of them argues with the result.
dice: d6
source: backgrounds/vault-dweller
entries:
  1: "Jukebox Technician: You kept the vault's appliances alive. You can hot-wire or repair any pre-war
    household machine in about ten minutes with common tools. Whenever you open one up, roll the Die of
    Fate: on a 4+, someone hid something inside it."
  2: 'Pip-Boy Programmer: You spent your shifts in the archives and the terminal banks. You read Mandarin,
    Russian, and Latin, which nobody out here needs until they do: you can translate any written material
    in a turn, and you know what the labels on pre-war chems actually mean.'
  3:
    text: "Clinical Test Subject: The vault doctor took one look at your result and made you an assistant
      instead, so you'd stop complaining. Take a Medi-Kit (3 uses, each heals 1d6 STR as a Stimpak). You
      know which berries will kill you, and which chems will only make you wish they had."
    data:
      gear:
      - {name: Medi-Kit, uses: 3, note: each heals 1d6 STR as a Stimpak}
  4:
    text: "Tattoo Artist: In the test's arithmetic, a steady hand meant small guns. You got a BB gun for
      your tenth birthday like every kid in the vault and grew up on the security wing's range, firing
      down narrow concrete corridors. Pistol attacks indoors, underground, or in tight corridors are never
      Impaired for distance or bad cover; out under open sky, you shoot like anybody else. Take a spare
      box of rounds (petty)."
    data:
      gear:
      - {name: Box of small-caliber rounds, size: petty, uses: 3, note: spare}
  5:
    text: 'Waste Management Specialist: You kept the pumps, pipes, and garbage burners running on spit
      and wire. Take a Multi-Tool and Duct Tape (3 uses). Given time and parts, you can jury-rig anything,
      and once per session you can coax one last use out of an item that has just run out or broken.'
    data:
      gear:
      - Multi-Tool
      - {name: Duct tape, size: petty, uses: 3}
  6: "Vault Loyalty Inspector: Your job was reading everyone's file, and you read every file the vault
    kept. Once per session, you can declare you read about something before — a building layout, a pre-war
    protocol, a passcode format — and it turns out to be true. The Overseer decides the scope."
