# Deathclaw (backgrounds/deathclaw): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: deathclaw-1
title: How did you come to think?
dice: d6
source: backgrounds/deathclaw
entries:
  1:
    text: 'The Scientist. A pre-war geneticist, two centuries a ghoul, stole your egg out of a laboratory
      that should have been shut down long ago and raised you in secret. She was kind. When she died,
      you went ten years without speaking to anyone. You carry her Notebook (petty): the recipe for your
      line, the thing the Enclave killed to bury. Any faction with a laboratory would pay dearly for it,
      or kill for it.'
    data:
      gear:
      - {name: Notebook, size: petty}
  2: 'The Tribe. A tribal people found you as a hatchling and accepted you as one of their own. You speak
    their language perfectly and consider them family; they, in turn, consider you a guardian. Their camp
    (the Overseer places it) is home: you and anyone you vouch for are fed and guarded there, and once,
    if you send word, their hunters will come to fight at your side.'
  3: "The Accident. As a juvenile you denned in a ruined schoolhouse where a broken terminal played the
    same pre-war children's lessons, day and night. You taught yourself to read and speak from them, and
    you talk like a patient pre-war schoolteacher. Anyone who hears you without seeing you takes you for
    a human: through a door, over a radio, or from the dark, you can hold a whole conversation before
    anyone suspects what you are."
  4: 'The Last of Your Line. Your mother could also speak. She taught you. There were three of you once.
    Now there is only one. You are looking for the ones who did it, and you carry their scent: you would
    know any one of them by smell, anywhere, in any crowd.'
  5:
    text: 'The Prophet. A wasteland cult believes your species are the rightful inheritors of the world,
      and one of its elders raised you to believe it too. You are not sure whether you still do. Take
      the Holy Text (petty) in its pre-war binding: any believer who sees you carrying it will shelter
      you, feed you, and do what you ask, within reason.'
    data:
      gear:
      - {name: Holy Text, size: petty}
  6: The Mystery. You do not know how. The day before, you drank from a pool that glowed a wrong, 
    bright green; the next morning you woke and understood language — every language you hear, human
    or mutant, even the clicks and chatter of a nest. Something is wrong with you, and it may be 
    wrong in a direction that gets worse.
---
table: deathclaw-2
title: What sets you apart from the rest of your kind?
dice: d6
source: backgrounds/deathclaw
entries:
  1: "Careful Hands: Despite your size, you can perform fine manipulation — picking locks, threading needles,
    working a terminal's keys, holding a brush. Your claws do not preclude craft, though a trigger guard
    is still too small for them."
  2: "Hunter's Silence: You were built from chameleon stock, and you still know how to be still. You move
    in perfect silence when you choose, and you can lie in ambush even in open wasteland, where there
    is nothing to hide behind."
  3: 'Territorial Authority: Other deathclaws will not attack you, and hesitate to attack anyone at your
    side — unless you come between a mother and her nest. Lesser beasts know a predator they cannot beat:
    the first time a wild animal smaller than you sees you, it makes a WIL save or flees.'
  4: 'Leap: You can cover forty feet in a single bound. You may, once per combat, move as an action to
    any point within that distance and attack at the end of it.'
  5:
    text: 'Unbreakable: Radiation barely touches you: dirty water, rad storms, and the edges of hot zones
      give you no Rads — only the truly hot places do (a crater, a reactor, the heart of the Glowing Sea).
      You may re-roll any failed save against poison or disease.'
    data:
      immune: [ambient-rads]
  6: 'The Voice: Nobody expects a deathclaw to speak, and your voice is deep enough to feel in the chest.
    Once per session, when you speak to someone who has never heard you before, they make a WIL save or
    stop to listen for as long as you keep talking — even in the middle of a fight. It buys attention,
    not agreement.'
