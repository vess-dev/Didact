table: mister-handy-1
title: What household did you serve, and what became of it?
dice: d6
source: backgrounds/mister-handy
entries:
  1:
    text: The Family Farm. You served a single farming family for six generations. You buried four 
      of them. The last one walked into the Wastes when she was nineteen and did not return. You are
      looking for her still. Take a Photograph (petty) of the family, and a list of names.
    data:
      gear:
      - {name: Photograph, size: petty}
  2:
    text: The Estate. You kept a pre-war country house in running order for two centuries. The house
      is still there. The library is still intact. Take a Master Key Ring (petty) to a house full of
      relics, and a certainty that the house is not empty.
    data:
      gear:
      - {name: Master Key Ring, size: petty}
  3:
    text: The Bunker. You served a single man in a sealed bunker for 180 years after he put himself 
      in cryo. You do not know where he is now. Take a Half-Finished Cup of Tea (petty, still hot — 
      a small mystery) and his Service Revolver (d8).
    data:
      gear:
      - {name: Half-Finished Cup of Tea, size: petty, note: still hot — a small mystery}
      - {name: Service Revolver, damage: d8}
  4:
    text: "The Cafe. You waited tables at a Slocum's Joe for two centuries, pouring coffee for raiders
      for forty years until they stopped paying. Take a Serving Tray (petty) and a slight resentment.
      Once per day, you can turn Rations into a proper hot meal: everyone who eats it clears 1 Fatigue."
    data:
      gear:
      - {name: Serving Tray, size: petty}
  5: The Clinic. You were a medical assistant. Your chassis runs a built-in Laser Suture Routine — 
    spend a turn working on one willing ally (not yourself; the emitters are on the wrong side of 
    your arms) to restore 1d6 STR, once per day. Your circular saw arm also counts as a surgical 
    tool.
  6: The Last Order. Your owner's final command to you, spoken as a dying whisper, was something you
    have not yet fulfilled. You tell no one what it was. The Overseer picks in secret.
---
table: mister-handy-2
title: What subroutine still runs even in the field?
dice: d6
source: backgrounds/mister-handy
entries:
  1: 'Overclocked Thruster: A hobbyist owner tuned your thruster past factory spec. Once per scene, you
    can boost up to 15 feet straight up — onto a roof, over a wall, across a gap — and Tough terrain never
    slows you.'
  2: "Polite Directive: Your voice module imposes courtesy. NPCs meeting you for the first time have their
    Reaction roll shifted one step better. (Raiders and similar may instead shift one step worse — Overseer's
    call.)"
  3: "Service Archive: You have two hundred years of household trivia in your memory banks. Once per session,
    you may recall a specific pre-war household fact that is useful (a cleaning solvent's formula, a pantry
    layout, a lullaby). The Overseer says how it helps."
  4: 'Multi-Arm Work: You have three manipulator arms. You may take two actions on your turn, provided
    neither is movement or combat.'
  5: 'Thermic Lance: Your flamer arm can cut through metal given a turn of work. Any mundane lock, door,
    or barrier can be opened. Loud.'
  6: "Asimov Subroutine: You cannot attack a non-hostile human without making a WIL save first. On a fail,
    you refuse. On a success, the subroutine logs the decision, and there is something in the log that
    will find you eventually. People who know what the subroutine means trust you completely: a non-hostile
    human's first Reaction to you is Kind."
