# Chem Cook (backgrounds/chem-cook): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: chem-cook-1
title: What did your last big batch do to you?
dice: d6
source: backgrounds/chem-cook
entries:
  1: The Jet Fumes. You cooked Jet the old New Reno way — brahmin dung sealed in a tank, the fumes 
    bottled — and breathed more of it than any cook should. Sprinting for more than a round costs 
    you a Fatigue, but you can smell a stepped-on dose from three feet away.
  2:
    text: 'The Abraxo Burn. A solvent batch cut with Abraxo cleaner ate through the tank, the bench, and
      most of your eyebrows. Take a Jug of Abraxo Concentrate (2 uses): poured on a lock, hinge, chain,
      or pipe, it eats clean through in a turn.'
    data:
      gear:
      - {name: Jug of Abraxo Concentrate, uses: 2}
  3: The Day Tripper Cat. A bad batch of Day Tripper fried a neural pathway and left you with a 
    crystal-clear hallucination of the cat that died in the spill. A dose from your own stash brings
    her back for a scene. She wanders ahead of you and notices what your eyes caught and your mind 
    skipped — the draft under a door, the footprint in the dust. Each time she appears, ask the 
    Overseer one question about your surroundings and get the answer through her. Add a Fatigue each
    time.
  4:
    text: 'The Berry Mentats. A long-cooking batch of Berry Mentats boiled over and you breathed the steam
      for an hour. Mentats have never worked the same on you since. Take 2 doses of Berry Mentats: on
      you, a dose shows heartbeats — for one scene, you know where every living creature within thirty
      feet is, through walls and all. They are still Mentats, and still Addictive.'
    data:
      gear:
      - name: Berry Mentats
        size: petty
        uses: 2
        qualities: [addictive]
        note: 'on you, a dose shows heartbeats: for a scene you know where every living creature within
          thirty feet is'
  5:
    text: The Fiends' Order. You sold the Fiends a crate of Med-X cut with chalk and powdered 
      mutfruit. You made a lot of money. Motor-Runner's people are still looking for you. Take 80 
      caps.
    data:
      add: {caps: 80}
  6:
    text: The Placebo Racket. You bottled tinted water in scavenged Stimpak housings and sold it in 
      Diamond City's market. Take a bottle of Fake Stimpaks (3 doses, pure placebo — the user makes 
      a WIL save to believe in the cure; a pass heals 1d6 STR, a fail heals nothing).
    data:
      gear:
      - name: Fake Stimpaks
        size: petty
        uses: 3
        note: 'pure placebo: the user makes a WIL save to believe in the cure; a pass heals 1d6 STR, a
          fail heals nothing'
---
table: chem-cook-2
title: What chem is your signature?
description: 'Whatever you roll, you can cook more of it: a Downtime Action with your Chem Kit brews 1d4
  doses at half the usual reagent cost, no Chemistry Station needed.'
dice: d6
source: backgrounds/chem-cook
entries:
  1:
    text: "Jet: Three doses of the wasteland's most famous inhalant (see Marketplace). You cook it the
      way Myron did in New Reno, from brahmin dung and a sealed tank: for you, Jet's reagents cost nothing
      but time."
    data:
      gear:
      - name: Jet
        size: petty
        uses: 3
        qualities: [addictive]
  2:
    text: "Psycho: Three doses of the pre-war Army's battle drug (see Marketplace). You cook to the old
      military formula, and every raider boss in the region knows it: raiders will deal with you before
      they think about robbing you."
    data:
      gear:
      - name: Psycho
        size: petty
        uses: 3
        qualities: [addictive]
  3:
    text: "Cateye: Three doses of the Mojave's night-hunting chem, the kind Novac's doctor sells from
      behind her counter. For one scene you see in darkness as clearly as in daylight; in bright sun the
      world turns grey until it wears off. Not addictive."
    data:
      gear:
      - {name: Cateye, size: petty, uses: 3}
  4:
    text: "Fixer: Two doses of the Mojave's addiction cure (see Addictol / Fixer in the Marketplace):
      each breaks one addiction on the spot. Nobody in a raider camp wants you dead."
    data:
      gear:
      - {name: Addictol / Fixer, size: petty, uses: 2}
  5:
    text: "Day Tripper: Three doses of the Capital's favorite mood-lifter (see Marketplace): Reactions
      shift one step better for a scene. Addictive. You sell it to caravans before a hard negotiation."
    data:
      gear:
      - name: Day Tripper
        size: petty
        uses: 3
        qualities: [addictive]
  6:
    text: "Ultrajet: Two doses of Jet's big brother, first cooked by a ghoul chemist in the Capital Wasteland
      from Jet, Sugar Bombs, and a splash of cleaning solvent — twice the kick, and it even works on ghouls:
      take an extra action this round and the next. Addictive, and its addiction save counts as STR −2."
    data:
      gear:
      - name: Ultrajet
        size: petty
        uses: 2
        qualities: [addictive]
