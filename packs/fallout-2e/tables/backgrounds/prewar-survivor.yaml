table: prewar-survivor-2
title: What of the old world do you still carry?
dice: d6
source: backgrounds/prewar-survivor
entries:
  1: 'The Name: You know the full legal name and social security number of every person you knew before
    the war. Once per session, you may declare that a specific pre-war fact about a named individual is
    true, and the Overseer will confirm or bend it into truth.'
  2: "The Address: You remember the location of your home, and it is on the map. The Overseer decides
    what's left of it — but under the floor, in the wall, or in the backyard, the cache you hid before
    the war is still there: 1d6 × 20 caps of pre-war valuables and one genuinely useful thing."
  3: 'The Training: You were a soldier, a cop, or a guardsman in the old world. At the start of a combat
    you saw coming, before first-round DEX saves are rolled, you may shout a single warning action — "down,"
    "left," "behind the pillar" — even if you then fail your DEX save to act in the first round.'
  4: 'The Oath: You swore, at some point, to uphold something — a profession, a faith, a marriage, a flag.
    The oath still binds you. Once per session, you may declare that your oath applies to the current
    situation. For that scene, your STR, DEX, and WIL each count as 1 higher for saves.'
  5:
    text: "The Instrument: You were a musician, and your instrument survived cryo with you. Take the Instrument
      (1 slot). Playing it in a settlement shifts Reaction rolls one step better and nets you a free night's
      bed."
    data:
      gear:
      - {name: Instrument, note: it survived cryo with you}
  6: "The Accent: Your speech patterns are unmistakably pre-war. Ghouls old enough to remember the Before
    recognize it on first hearing and extend immediate trust. Most other wastelanders think you're crazy."
