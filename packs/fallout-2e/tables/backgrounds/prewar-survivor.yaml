table: prewar-survivor-1
title: Who did you leave behind?
dice: d6
source: backgrounds/prewar-survivor
entries:
  1: Your Spouse. Through the frost on the glass you watched them close their eyes in the pod across
    from yours. When you woke, their pod stood open and empty, and a trail of footprints in the dust
    led out into the world. You are looking for them. The Overseer knows whether they are still 
    alive.
  2:
    text: Your Child. A baby. A toddler. A teenager. Somebody who needed you. You remember the last 
      thing they said to you, and the last thing you said back. Take the Stuffed Toy (petty) they 
      were holding when the pods closed. A cold voice tells you they could not have survived. A 
      warmer voice says they might.
    data:
      gear:
      - {name: Stuffed Toy, size: petty}
  3:
    text: Your Best Friend. Not blood, but close enough that blood didn't matter. You made a promise
      the morning of the war and you have not yet fulfilled it. You carry A Folded Note (petty) in 
      their handwriting.
    data:
      gear:
      - {name: Folded Note, size: petty}
  4:
    text: Your Crew. You were a member of something — a unit, a club, a band, a research team. Six 
      of you went into cryo. You are the only one still walking. Take a Group Photograph (petty). 
      You have met one of them already, and they are not the person they were.
    data:
      gear:
      - {name: Group Photograph, size: petty}
  5: 'Your Profession. You were someone specific: a surgeon, a pilot, a teacher, a chef, a lawyer, a police
    officer. Your old certifications would hang on a wall. The wasteland does not care. Pick your old
    job: once per session, your training lets you do one thing no wastelander of that trade could — a
    real operation, a real landing, a real loophole — without a save.'
  6: "The World. You did not have much waiting for you before the bombs either. You slept through the
    apocalypse and woke up in another one. At least this one's yours. You have no grief to carry: once
    per session, re-roll a failed WIL save against despair or fear."
