# Brotherhood Initiate (backgrounds/brotherhood-initiate): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: brotherhood-initiate-1
title: Why are you alone in the Wastes?
dice: d6
source: backgrounds/brotherhood-initiate
entries:
  1:
    text: A Retrieval. You are in the field to recover a specific pre-war artifact. Take a Sealed 
      Writ (petty) from the Elders describing the vault-level database your chapter believes holds 
      it. Any Brotherhood patrol that reads the writ must give you food, ammunition, and a night's 
      shelter. Return with the artifact, and you are a Knight.
    data:
      gear:
      - {name: Sealed Writ, size: petty}
  2:
    text: Dishonor. You lost a brother in a raid on a facility you insisted was safe. You were sent 
      to perform a year of penance in the field. Take the Burned-Out Power Fist (d8, bulky) of the 
      man who died.
    data:
      gear:
      - {name: Burned-Out Power Fist, damage: d8, size: bulky}
  3:
    text: 'The Summons. A distant chapter went silent — the way the Mojave chapter sealed itself inside
      its Hidden Valley bunker and stopped answering the Elders. You were sent to investigate. Take a
      Radio Hailer (petty, 3 uses): each use puts you through to the nearest Brotherhood station for one
      exchange. The silent chapter has answered exactly once, with static and a scream.'
    data:
      gear:
      - {name: Radio Hailer, size: petty, uses: 3}
  4:
    text: Doubt. You read a record you weren't cleared to read. It described something the Order did
      — a purged ghoul settlement, a town burned for what it had seen, a chapter's own scribes left 
      to die — that you cannot reconcile with your oath. Take the Copied Page (petty); the Overseer 
      decides exactly what it says. You haven't decided what to do.
    data:
      gear:
      - {name: Copied Page, size: petty}
  5:
    text: The Escort. You were assigned to a scribe who was murdered on the road three days in. Take
      their Research Case (bulky) of half-finished notes. The killer is ahead of you.
    data:
      gear:
      - {name: Research Case, size: bulky}
  6:
    text: "Exile. You loved someone you weren't supposed to — an outsider, a ghoul, a synth. Take your
      Ceremonial Sash (petty), stripped of rank, and the knowledge that you cannot go home. You still
      know the chapter's passphrases: once, before word of your exile spreads, you can talk your way through
      a Brotherhood checkpoint."
    data:
      gear:
      - {name: Ceremonial Sash, size: petty}
---
table: brotherhood-initiate-2
title: What piece of the Order's knowledge is yours to keep?
dice: d6
source: backgrounds/brotherhood-initiate
entries:
  1:
    text: "Targeting HUD: A power armor helmet's targeting lens, rewired to clip onto any goggles. While
      worn, ranged attacks at long range are not Impaired. It burns one use of a fusion cell per day."
    data:
      gear:
      - name: Targeting HUD
        note: a power armor helmet's targeting lens that clips onto any goggles; burns one use of a 
          fusion cell per day
  2:
    text: 'Field Medkit: Brotherhood-issue. 3 uses. Each use restores 1d6 STR to one character and adds
      1 Fatigue to the patient. Known only to scribes. Will not regenerate lost limbs.'
    data:
      gear:
      - name: Field Medkit
        uses: 3
        note: each use restores 1d6 STR to one character and adds 1 Fatigue to the patient
  3: 'The Codex Rite: You were trained to speak the secret shutdown word of a specific robot model (choose:
    Protectron, Securitron, Sentry Bot). Once per session, speak it: the target makes a WIL save or shuts
    down for an hour.'
  4:
    text: 'Laser Bracer: A wrist-mounted single-shot laser (d10, 1 charge). Recharge: a full fusion cell.'
    data:
      gear:
      - name: Laser Bracer
        damage: d10
        uses: 1
        recharge: a full fusion cell
        note: a wrist-mounted single-shot laser
  5:
    text: "The Scribe's Primer: A holotape primer on pre-war technical shorthand, recorded by a Brotherhood
      scribe for initiates. Given a turn to study it, you can read any pre-war schematic, military code,
      or service manual, and work unfamiliar pre-war machinery without a save."
    data:
      gear:
      - name: The Scribe's Primer
        note: a holotape primer on pre-war technical shorthand
  6: 'The Oath: You swore to the Tech. Once per session, when you touch a pre-war device, you may ask
    the Overseer: "Does this still work, and if not, what would it take?" The Overseer answers honestly.'
