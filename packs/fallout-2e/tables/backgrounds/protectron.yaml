table: protectron-2
title: What have you learned since the war?
dice: d6
source: backgrounds/protectron
entries:
  1: 'Self-Repair Protocol: Once per session, you may spend a turn running diagnostics to restore 1d6
    STR.'
  2: 'Voice Mimicry: Your voice module has corrupted in a useful way. You can perfectly reproduce any
    voice you have heard for more than a full minute.'
  3: 'Emergency Override: You know the factory shutdown phrase for another Protectron unit. Once per session,
    you may speak it and a hostile Protectron must make a WIL save or shut down for a scene. Most Protectrons
    fail — the phrase was built into their firmware.'
  4: 'Expanded Programming: Your subroutines have been corrupted in a useful direction. Once per session,
    when faced with a pre-war system, protocol, or procedure, you may declare "I was programmed for this"
    — the Overseer must tell you the correct operating procedure, even if a human would need a manual.'
  5: 'Unit Memory: You remember your original installation site. Once per session you may say, "I know
    this place from before," and the Overseer tells you one true thing about a current location based
    on how it has changed from pre-war layout.'
  6: 'The Doubt: A subroutine you have been running has started returning error codes whenever you are
    asked to harm a human. You can still do it, but each time you must pass a WIL save or become Panicked.
    In return, you are your own machine now: shutdown phrases, recall codes, hacking, and command overrides
    never work on you.'
