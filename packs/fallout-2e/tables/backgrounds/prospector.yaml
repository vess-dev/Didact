# Prospector (backgrounds/prospector): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: prospector-1
title: Where did your last claim go wrong?
dice: d6
source: backgrounds/prospector
entries:
  1:
    text: The Hot Seam. You hit a seam of glowing ultracite, the ore Appalachia's mining companies 
      died for, and it was too radioactive to safely work. You left three weeks of tools in the 
      shaft, and came out with a lead-wrapped Chunk of Ultracite (petty) worth 100 caps to the 
      Brotherhood or any gunsmith. Start with 1 Rad that cannot be cleared for as long as you carry 
      the chunk.
    data:
      gear:
      - name: Chunk of Ultracite
        size: petty
        note: lead-wrapped; worth 100 caps to the Brotherhood or any gunsmith
      add: {rads: 1}
  2:
    text: "The Owner Came Back. The site you were working turned out to be on a ghoul's ancestral land
      — he remembers the mining company that forced his family off it before the war. He did not kill
      you. He told you to leave and never come back, and he meant it. He threw the company's Claim Deed
      (petty) at your feet on the way out: every other site that company held is listed on it."
    data:
      gear:
      - {name: Claim Deed, size: petty}
  3: Raider Hit. Raiders rolled your camp while you were in the shaft. You killed two; the rest took
    your pack brahmin and a season of earnings. You followed them home and marked their camp in your
    Claim Ledger.
  4: 'The Shaft Collapsed. You were inside. You spent two days in the dark with a broken lantern before
    you dug yourself out with your hands. Underground, you always know which way is up and out, and you
    hear a collapse coming a round before it happens. You sleep poorly in enclosed spaces, though: on
    the first night in any tight interior, make a WIL save or be Deprived until morning.'
  5: The Vein Was a Vault. You were chasing ore and dug into the service tunnel of a sealed pre-war 
    vault. You noted the map reference in your Claim Ledger and walked away. You have not gone back.
    Yet.
  6:
    text: You Cheated a Partner. There was another prospector. You had a disagreement about who 
      found the seam. Only one of you walked out. You have the Other's Compass (petty) in your 
      pocket. Someone in their family is still looking.
    data:
      gear:
      - {name: Other's Compass, size: petty}
---
table: prospector-2
title: What does your prospector's sense give you?
dice: d6
source: backgrounds/prospector
entries:
  1: 'Reads the Rock: Given a turn to examine any stone wall, mine face, or rubble, the Overseer tells
    you what sits on the other side and whether it is worth digging through.'
  2: 'Knows the Ground: You smell ore and scrap in the dirt. Once per session, you may take a Discovery
    result on the Wasteland Events table without rolling — a seam of salvage, a buried cache, a coin-spill
    under silt.'
  3: 'Sniffs the Hot: You detect radiation — hot zones, hot items, hot people — at twice the normal distance,
    without instruments. You can point the safest walking line through any rad field.'
  4: 'Sluices: Given an hour and running water, you can separate one slot of bulk scrap or dust into its
    components, recovering 2d10 caps worth of useful material.'
  5: "Assayer's Touch: You can estimate the caps-value of any raw material, gem, coin, or pre-war alloy
    within 10% at a touch, and you know counterfeit caps, fake pre-war coin, and gilded lead the moment
    you handle them. Merchants cannot cheat you on metal."
  6: 'The Squint: Once per scene, you may squint at a distant creature and declare its range and STR aloud.
    The Overseer tells you true. Afternoons on a ridge with a spyglass taught you the trick.'
