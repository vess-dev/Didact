# Robobrain (backgrounds/robobrain): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: robobrain-1
title: Who did this to you, and what do you remember of them?
dice: d6
source: backgrounds/robobrain
entries:
  1:
    text: The Laboratory. A General Atomics research site — the Sierra Army Depot, the Boston 
      facility hidden under a RobCo service center, a hospital wing at Point Lookout. You remember a
      white coat, a clipboard, and a name. Take A List of Four Names (petty) — the scientists you 
      believe were responsible. Three are long dead. One is somehow still alive.
    data:
      gear:
      - {name: List of Four Names, size: petty}
  2:
    text: 'The Stockade. You were a soldier doing hard time in a military prison, and the Army offered
      you a way out: a program it called "combat enhancement." You remember the briefing room and the
      form you signed. Take your Pre-war Dog Tags (petty); the name on them is listed as killed in action.
      Your service number still works — any US Army terminal accepts it, and lets you in with the clearance
      you had.'
    data:
      gear:
      - {name: Pre-war Dog Tags, size: petty}
  3:
    text: "The Prisoner. You were on death row for a crime you did not commit when the program came looking
      for \"high-intelligence candidates.\" You remember the judge's face. Take your Sentencing Paper
      (petty); the court that issued it no longer exists. Twelve years inside taught you how every cage
      is built: given a turn, your claws open any cell door, cuff, or cage."
    data:
      gear:
      - {name: Sentencing Paper, size: petty}
  4:
    text: The Volunteer. You paid for this. Like the millionaires who bought themselves Robobrain 
      bodies in Vault 118, you wanted to live forever, and you did not understand what you were 
      signing. Take the Receipt (petty); the sum on it would have bought a city block. You paid for 
      the premium model, too — your chassis repairs itself. Once per day, an hour of diagnostics and
      1 Scrap restore 1d6 STR.
    data:
      gear:
      - {name: Receipt, size: petty}
  5:
    text: "The Vault. Vault-Tec bought a few Robobrains for vault security. When your vault's unit broke
      down, the Overseer found a replacement among the residents with the highest test scores — and the
      clinic had the machine for it. You remember the Overseer's smile. Take your Vault Resident ID (petty):
      your old vault's door and every one of its security systems still read you as a resident, whatever
      is living inside now."
    data:
      gear:
      - {name: Vault Resident ID, size: petty}
  6:
    text: The Blank. The conditioning worked on you. You remember nothing of who you were; your 
      earliest memory is waking up in a jar. Take an Index Card (petty) with a single phrase written
      in your own old handwriting. It is a password. Somewhere in the region is the terminal it 
      opens, and on that terminal is your file.
    data:
      gear:
      - {name: Index Card, size: petty}
---
table: robobrain-2
title: What does your old mind still know that the wasteland has forgotten?
dice: d6
source: backgrounds/robobrain
entries:
  1: 'Polyglot: You speak every pre-war language you once knew, and you once knew several. You can read
    any pre-war written material without effort.'
  2: 'Academic Specialty: Pick one: medicine, engineering, biology, chemistry, history, mathematics. You
    are an expert. Questions in your field never need a roll — the Overseer simply tells you what a pre-war
    expert would know. Applying that knowledge under pressure (surgery in a firefight, math with a timer
    running) still calls for a save.'
  3: 'Personal Connection: A descendant of someone you knew lives in a settlement in the region; the Overseer
    picks. Once they learn who you are, that family treats you as Idolized under the Faction Reputation
    rules — they will shelter you, feed you, and vouch for you within their own circle.'
  4: "Pre-war Map: You have a perfect mental map of one pre-war city (Overseer or player picks). It is
    two hundred years out of date, but the bones of a city don't move: there, the party never gets lost,
    and you always know the nearest subway entrance, storm drain, or service tunnel."
  5: "The Terminal Whisper: You can jack straight into a pre-war terminal with a cable from your manipulator
    and read it the way a mind reads, without a save. It takes a full turn of standing still, cable exposed
    — an easy target. Locked files open too, but the terminal's security pushes back into living tissue:
    each one you force costs you 1 Fatigue."
  6: 'Painful Accuracy: Your brain still runs on pre-war logic, and it is sometimes right. Once per session
    you may ask the Overseer, "What is the most likely explanation for what I am seeing?" and receive
    a genuinely accurate answer.'
