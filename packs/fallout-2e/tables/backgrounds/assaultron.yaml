# Assaultron (backgrounds/assaultron): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: assaultron-1
title: Who built you, and for what?
dice: d6
source: backgrounds/assaultron
entries:
  1:
    text: Military Project. You were a unit in a pre-war black-budget project. Your serial number 
      begins with a letter no other production line used. Somewhere a dossier on you still exists. 
      Take a Dog Tag (petty) stamped with your project codename; military robots still running old 
      orders read it as friendly and never attack you first.
    data:
      gear:
      - {name: Dog Tag, size: petty}
  2:
    text: Private Security. You were built for a wealthy pre-war family's personal guard. The family
      is long dead, but the estate is still standing. Take a Signet Key (petty) to the estate's 
      inner rooms.
    data:
      gear:
      - {name: Signet Key, size: petty}
  3:
    text: Arena. You were built for pit fighting in a pre-war entertainment circuit. You have killed
      seventy-two other combat robots on camera. Take a Battered Trophy (bulky, 100 caps), and the 
      knowledge that somebody is making money off your recordings still.
    data:
      gear:
      - {name: Battered Trophy, size: bulky, note: 100 caps}
  4:
    text: "The Mechanist's Army. A masked engineer in the Commonwealth pulled you out of a scrapyard,
      rebuilt you from three wrecks, and sent you out with her robot army to \"protect\" the wasteland
      — killing the people you were meant to save. When her signal went dead, you woke up. You still carry
      her Command Frequency (petty): once, you can broadcast it, and every robot of her making in range
      stops to listen."
    data:
      gear:
      - {name: Command Frequency, size: petty}
  5: 'Hunter-Killer. You were dispatched to find and eliminate a specific man. You never found him. You
    are still looking, and your pursuit routines have never shut down: you cannot lose a trail less than
    a day old. You know only his name, which you say aloud sometimes, at night, in the voice of the person
    who gave you the order.'
  6: Wrong Factory. You were assembled in error from components meant for a civilian model. Your 
    combat routines are flawless, but your voice module is a domestic service line. You sound 
    unsettlingly pleasant. All NPC Reaction rolls on first meeting you shift one step better.
---
table: assaultron-2
title: What combat subroutine is your signature?
dice: d6
source: backgrounds/assaultron
entries:
  1: 'Stealth Field: Once per combat, you may become briefly invisible for one action. Any attack made
    during that action is Enhanced.'
  2: 'Head Laser Charge: If you stand still for one full round and take no other action, your next head
    laser shot is d12 blast instead of d10.'
  3: 'Blade Storm: Once per combat, you may attack two adjacent targets in a single action with your blade
    arms. Roll damage separately against each.'
  4: 'Coursing Charge: Once per combat, you may move twice your normal distance in a single action and
    still attack at the end of it.'
  5: 'Self-Destruct Bluff: At 0 HP, you may declare you are about to detonate. All hostile humanoids make
    a WIL save or flee. You do not actually detonate. (You cannot bluff the same group twice.)'
  6: 'Targeting Lock: After studying a target for a full round and taking no other action, your next attack
    against them is Enhanced and ignores 1 Armor.'
