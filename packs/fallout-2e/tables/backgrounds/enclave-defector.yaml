# Enclave Defector (backgrounds/enclave-defector): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: enclave-defector-1
title: What did you refuse to do?
dice: d6
source: backgrounds/enclave-defector
entries:
  1: The List. You were given a kill list of settlement leaders, with the intelligence file on each.
    You burned it. You still remember every name, and one of them is probably running the nearest 
    town. Once per session, the Overseer tells you one secret the Enclave had on a leader you meet.
  2:
    text: "The Release. You were assigned to carry one of President Eden's modified-FEV vials to the purifier
      at Project Purity — the virus that would kill every wastelander with a trace of mutation in them.
      You never delivered it. Take its Sealed Steel Case (bulky; do not open): proof of the plan, and
      a death sentence for anyone it touches."
    data:
      gear:
      - name: Sealed Steel Case
        size: bulky
        note: "do not open: one of President Eden's modified-FEV vials, proof of the plan"
  3: The Child. You were told to execute a subject in a lab who turned out to be a child. You 
    brought her out. She is in a settlement now, and you check on her sometimes. She knows things 
    about the Enclave that she doesn't know she knows.
  4:
    text: "The Signal. You were the communications officer who would have sent the go signal for an operation.
      Take your Officer's Sidearm (a 10mm, d8) and the Codebook (petty) you never handed back: once, you
      can put a false order out on an Enclave frequency, and whoever hears it will believe it."
    data:
      gear:
      - {name: Officer's Sidearm, damage: d8, note: a 10mm}
      - {name: Codebook, size: petty}
  5:
    text: The Oath. You simply decided the oath you swore was not to your superiors but to the 
      people they were ordering you against. Take a Field Commission Letter (petty) signed by a 
      general who is probably dead. Any U.S. Army holdout or automated military checkpoint accepts 
      it as proof that you are an officer — once.
    data:
      gear:
      - {name: Field Commission Letter, size: petty}
  6:
    text: The Door. You refused to close a bulkhead on a squad that was still alive. Take a Squad 
      Patch (petty) from each of the five. You still know their names. Two of them deserted after 
      you; once, either will come if you call.
    data:
      gear:
      - {name: Squad Patch, size: petty, count: 5, note: one from each of the five}
---
table: enclave-defector-2
title: What of your old training still serves you?
dice: d6
source: backgrounds/enclave-defector
entries:
  1: 'Perimeter Sense: You cannot be surprised in the open. When camping in the wasteland, your watch
    automatically spots an approaching encounter.'
  2: 'Command Voice: Once per session, a single person must make a WIL save or obey a short, clear order
    of yours (a command they would reasonably follow: drop it, run, stop, get down). It never works twice
    on the same person.'
  3: "Power Armor Certified: Every Enclave Defector is power-armor trained; you were certified on the
    X-01 and Hellfire lines, down to their security. Once per session, you can override a power armor
    suit's lockouts — a Brotherhood owner-code, a sealed frame, a rigged core — and climb in."
  4:
    text: 'Field Medicine: You start with a Combat Medkit (3 uses, each heals 1d6 STR as a Stimpak) and
      can stabilize a dying ally in a single turn with no save.'
    data:
      gear:
      - {name: Combat Medkit, uses: 3, note: each heals 1d6 STR as a Stimpak}
  5: 'Surveillance Eye: You can spot a tail. Once per session, you may ask the Overseer, "Am I being followed?"
    The Overseer answers honestly and, if you are, tells you one true fact about your tail.'
  6: 'The Archive: You memorized a list of facility codes. Once per session, when the party encounters
    a pre-war security door, you may declare you know a valid code. There is a chance it triggers an alarm
    instead — the Overseer decides.'
