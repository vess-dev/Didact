table: boomer-1
title: What did the clan hand you on your way out the gate?
dice: d6
source: backgrounds/boomer
entries:
  1:
    text: A Crate of Shells. A small wooden crate (bulky) holding 2 frag grenades and 2 sticks of 
      long-fuse dynamite (each d10, blast, 1 use). The elders packed it themselves. You suspect they
      did not expect to see you again.
    data:
      gear:
      - name: Crate of Shells
        size: bulky
        note: a small wooden crate holding the grenades and dynamite
      - name: Frag grenade
        damage: d10
        size: petty
        qualities: [blast]
        uses: 2
        note: two, in the crate
      - name: Long-fuse dynamite
        damage: d10
        size: petty
        qualities: [blast, timer]
        uses: 2
        note: two sticks, in the crate
  2:
    text: "The Old Hangar Keys. You are the clan's designated outside-the-wire scavenger. Take a Ring
      of Keys to the hangar's outer sheds. Up to four times a year you may slip back in to resupply: a
      fresh bandolier of 40mm rounds for the grenade rifle and 1d4 frag grenades each visit."
    data:
      gear:
      - {name: Ring of Keys, note: to the hangar's outer sheds}
  3:
    text: A Recovered Warhead. You left with a single intact pre-war warhead strapped to your back. 
      It is too heavy (bulky, 2 slots), too dangerous to sell, and too valuable to abandon. The 
      Overseer knows who wants it.
    data:
      gear:
      - name: Pre-war Warhead
        size: bulky
        note: 'intact: too dangerous to sell, too valuable to abandon'
  4:
    text: A Letter. Your mother wrote you a letter the night before you left. It is sealed. You have
      not opened it. You do not know what is in it. (petty)
    data:
      gear:
      - {name: Letter, size: petty, note: 'from your mother: sealed, unopened'}
  5:
    text: A Radio. A clan-band shortwave radio tuned to a frequency the rest of the wasteland does 
      not know. You can speak to the elders once a week if you find a signal. Each call brings a 
      scolding, a prayer, and a single piece of useful information.
    data:
      gear:
      - name: Shortwave Radio
        note: clan-band, tuned to a frequency the rest of the wasteland does not know
  6: A Name to Kill. An old grudge the clan passed to you before you left. A specific person, in a 
    specific direction. The clan will consider you honorable again if you finish it. You do not have
    to.
---
table: boomer-2
title: What did growing up on an artillery range teach you?
dice: d6
source: backgrounds/boomer
entries:
  1: 'Angle and Windage: Your ranged attacks with explosive weapons (grenades, rockets, thrown demolitions)
    are never Impaired at long range.'
  2: 'Pre-war Aviation: You can identify any pre-war aircraft or Vertibird wreckage on sight, and you
    know what parts are still salvageable. Once per session you may declare that a specific ruined wreck
    has one intact valuable component.'
  3: 'The Fuse: You can build a pipe bomb or improvised explosive from common parts (1 Scrap each) in
    a single turn, not a Downtime Action. Your improvised explosives deal d8 blast.'
  4: "Gunner's Ear: You can tell, by sound alone, the caliber and direction of any firearm discharge within
    half a mile."
  5: "Forward Observer: You were raised calling shots for the clan's howitzers. Once per session, when
    you fire an explosive at a target you have spent a full round ranging, the attack is Enhanced and
    its blast catches everything within 15 feet of the point you chose."
  6: 'Thick Skin: You have been near many explosions. You take half damage from your own blast attacks,
    and any Scar roll caused by an explosion is made at HP-Lost one lower on the table.'
