table: courier-1
title: What was the job that almost killed you?
dice: d6
source: backgrounds/courier
entries:
  1:
    text: The Box. You were hired to deliver a lead-lined box across three days of wasteland. You 
      opened it. You shouldn't have. Inside was a single red Sierra Madre Chip (petty), and ever 
      since, every third night, you dream of a white city under a red cloud and a woman's voice 
      singing begin again. Once, when you are truly lost, the dream will show you the way.
    data:
      gear:
      - {name: Sierra Madre Chip, size: petty}
  2:
    text: The Name. You were told only a name and a town. When you arrived, the recipient had been 
      dead for a week and the town for longer. Take 50 caps you were paid up front, and the name, 
      which you still speak sometimes.
    data:
      add: {caps: 50}
  3:
    text: The Kid. The package was a child. She's now in a safe settlement. Take a Folded Drawing 
      (petty) she made of the two of you.
    data:
      gear:
      - {name: Folded Drawing, size: petty}
  4:
    text: The Ambush. You lived. The package didn't. Take a Charred Letter (petty) and the faces of 
      the six people who did it.
    data:
      gear:
      - {name: Charred Letter, size: petty}
  5:
    text: "The Spear. You took a super mutant's spear through the thigh and walked eight miles with the
      package on your back. Your max STR is 1 lower forever. You didn't break that day, and you won't
      again: while you carry a delivery, you cannot be Panicked."
    data:
      max: {STR: -1}
  6:
    text: The Last One. You were contracted to deliver one thing before you quit the life. You 
      haven't quit yet. Take the Sealed Package (1 slot). It rattles.
    data:
      gear:
      - {name: Sealed Package, note: it rattles}
---
table: courier-2
title: What gets you through every run?
dice: d6
source: backgrounds/courier
entries:
  1: 'Mile-Eater Stride: Once per day of travel, you may turn a +1 watch penalty from weather or terrain
    into no penalty at all.'
  2: "Route Memory: You have delivered to every settlement within three weeks' travel, and you know the
    back way into each — a gap in the wall, a friendly guard, a drainage pipe nobody watches."
  3:
    text: 'Hideout Gun: A Hold-out Pistol (d6, see Marketplace) sewn into the strap of your satchel. No
      search short of a strip-search finds it, and drawing it takes no time at all.'
    data:
      gear:
      - {name: Hold-out pistol, damage: d6, note: sewn into the strap of your satchel}
  4: "Courier's Oath: When you accept a delivery, name its destination: you always know the fastest safe
    route there, and while you carry the package you can travel one extra watch each day without becoming
    Deprived."
  5: 'The Rumor Tongue: You can learn a rumor in a settlement in five minutes. Once per settlement, the
    Overseer must tell you one true local rumor.'
  6: "Dead Drops: You have a network of cache spots across the region. Once per session, you may declare
    that you have a dead drop nearby containing one item you're known to carry. The Overseer decides whether
    it's still there."
