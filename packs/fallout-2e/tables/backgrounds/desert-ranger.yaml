# Desert Ranger (backgrounds/desert-ranger): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: desert-ranger-1
title: What did the Ranger oath cost you?
dice: d6
source: backgrounds/desert-ranger
entries:
  1:
    text: "Arizona. You rode with the last Desert Ranger companies east of the Colorado when Caesar's
      Legion rolled them up. Take the Pre-war Riot Shield (+1 Armor) you held at the ford: while you hold
      it and did not move this round, you cannot be moved or knocked down. The Legion remembers the coat
      — their Reactions to you shift one step worse."
    data:
      gear:
      - {name: Pre-war Riot Shield, armor: 1}
  2:
    text: Tycho's Line. Your grandfather learned the trade from the same Desert Ranger family that 
      raised Tycho, the ranger who walked beside the first Vault Dweller. Take his Old-World Gun 
      Kit. Once per day, after a half-hour cleaning, attacks with that weapon are Enhanced until one
      of them deals STR damage.
    data:
      gear: [Old-World Gun Kit]
  3: 'The Unification Treaty. When the Desert Rangers signed their names beside the NCR Rangers, you were
    there to witness it — and you kept the coat instead of the brown. NCR Rangers treat you as kin: their
    Reactions to you start at Kind, and any Ranger station will share water, ammunition, and news.'
  4:
    text: New Canaan. You were one of the last Rangers pulled back out of Utah, and you watched the 
      smoke go up over New Canaan when the White Legs came. You bury what you kill now. Take an 
      extra 40 caps; you always lay two caps on the eyes of the fallen, and somehow the caps always 
      come back.
    data:
      add: {caps: 40}
  5:
    text: A Ranger's Word. A contract is a contract. Take your Oath Book (petty), a battered 
      notebook of every promise you've made and kept. Once per session, when you give your word to 
      someone who knows what a Ranger is, they believe you absolutely. Break a promise written in 
      it, and no one who knows the Rangers will take your word again.
    data:
      gear:
      - {name: Oath Book, size: petty}
  6:
    text: The Ledger. Rangers keep a tally of every debt owed to the people they protect, and yours 
      is not settled. Take a Black Ledger of names and roll again on the Bonds table.
    data:
      gear:
      - {name: Black Ledger, note: of names}
      extra_bond: true
---
table: desert-ranger-2
title: Who carries you?
dice: d6
source: backgrounds/desert-ranger
entries:
  1:
    text: 'The Destrier (Horse): A warbred horse out of the last herds on the Nevada ranges. 6 HP, 1 Armor,
      hooves (d8). +2 slots, Standard speed (see Vehicles). Mean-tempered; bites strangers.'
    data: {companion: destrier}
  2:
    text: 'The Dustrider (Horse): Tough and surefooted on broken ground. Treat Tough or Perilous terrain
      as one step easier. 6 HP. +4 slots, Standard speed (see Vehicles).'
    data: {companion: dustrider}
  3:
    text: 'The Pack Brahmin: Slow, stubborn, strong — two heads, one opinion. 6 HP. +6 slots, or only
      +2 if it also carries a rider.'
    data: {vehicle: pack-brahmin}
  4:
    text: 'The Smart Mutt (Mongrel Dog): Not a mount but a partner. 3 HP, 10 STR, 14 DEX, 4 WIL, bite
      (d6). It understands simple signals and senses danger before you do. +0 slots.'
    data: {companion: smart-mutt}
  5:
    text: 'The Motorbike: A retrofit motorbike — use the Motorbike in Vehicles: 6 HP, 1 Armor, +3 slots,
      Fast, runs on gasoline. Loud enough that every raider for a mile hears it coming.'
    data: {vehicle: motorbike}
  6:
    text: "The Cyberdog: A pre-war Big MT cyberdog with its brain sealed in a jar on its back, bought
      off a drifter who didn't know what he had. Not a mount but a partner — use the Cyberdog in the Bestiary.
      It never sleeps, and it growls at anything with a Legion brand."
    data: {companion: big-mt-cyberdog}
