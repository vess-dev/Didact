table: big-game-hunter-1
title: What was the kill that made your name?
dice: d6
source: backgrounds/big-game-hunter
entries:
  1: The Deathclaw Matriarch. You took the matriarch of a nesting ground at 200 feet. Her horn 
    stands mounted in a settlement that treats you as a hero to this day (Idolized). The deathclaws 
    of that line still know your scent, and give you a wide berth — until the day one of them 
    decides otherwise.
  2: The Queen. A mirelurk queen in a flooded pre-war facility. You shot her twice and let the flood
    do the rest. The coastal settlement she was eating pays you tribute once a year — a crate of 
    supplies and a boat whenever you ask for one.
  3: The Alpha. An alpha yao guai that had been killing prospectors for a season. You tracked it for
    nine days, and the hunt changed you. You can wait motionless through a whole day without 
    becoming Deprived, and anything you ambush from cover is surprised.
  4:
    text: 'The Behemoth. You were part of a team that took down a super mutant behemoth. You fired the
      shot that made the kill, though the others will tell you they did. Take the Bone Plate (petty) from
      its jaw. Super mutants know what it means: on seeing it, a super mutant must pass a Morale save
      before it will fight you.'
    data:
      gear:
      - {name: Bone Plate, size: petty}
  5: "The Cazador Queen. A breeding swarm in the badlands. You burned the nest. You carry a scar from
    the swarm's last attack that still hurts when it rains, and your blood fought off the venom: re-roll
    any failed save against cazador or radscorpion poison."
  6: The One That Got Away. A specific creature that you tracked, shot, and lost. It is still out 
    there. You know its tracks. You know its preferred territory. You have been looking for a second
    chance for a long time.
