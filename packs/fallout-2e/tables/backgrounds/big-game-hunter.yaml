table: big-game-hunter-2
title: What does a hunter carry that a soldier doesn't?
dice: d6
source: backgrounds/big-game-hunter
entries:
  1: 'The Long Shot: Attacks with rifles at any range are never Impaired for distance. Once per combat,
    your first shot at a target is Enhanced.'
  2: 'The Call: You can identify and mimic the call of every major wasteland creature within the region.
    You can draw one closer. You can also drive one off, sometimes.'
  3: 'The Hide: You know how to break down a creature into useful parts in an hour. Any big game you kill
    — a beast of 6 HP or more — yields an additional 1d6 × 10 caps worth of hide, teeth, or organs, if
    there is a buyer.'
  4: "The Blind: Given a turn of work in any terrain, you can build a hunter's blind. While hidden in
    it, you cannot be detected by any creature without a specifically keen sense of smell (the Overseer
    decides)."
  5: "The Weak Spot: You know every creature's weakest point. Once per combat, declare that your next
    attack is targeted at a specific creature type's weak spot; the attack is Enhanced and ignores 1 Armor."
  6: 'The Old Grudge: You speak the name of the last prey that went down badly for you. Once per session,
    when facing a creature of the same type, your attacks against it are Enhanced and cannot be Impaired
    for the rest of the combat.'
