table: scavver-1
title: What was your best find — and your worst?
dice: d6
source: backgrounds/scavver
entries:
  1:
    text: A Pre-war Tool Kit. Still in its original case. Start with the Tool Kit (takes 1 slot). 
      While held, you can repair or disassemble any mechanical device without a save — the right 
      tool for every job. Your worst find is still waiting in one of the other boxes you haven't 
      opened.
    data:
      gear:
      - name: Tool Kit
        note: pre-war, in its original case; while held, repair or disassemble any mechanical device
          without a save
  2:
    text: A Working Robot. You sold it for a small fortune but kept the Control Chip (petty). It 
      lets you give one simple order per day to a dormant pre-war robot within reach. Buyer wants it
      back.
    data:
      gear:
      - {name: Control Chip, size: petty}
  3:
    text: A Truck of Stimpaks. You sold most. Kept 4 Stimpaks (each heals 1d6 STR). Every raider in 
      the county thinks you still have the truck.
    data:
      gear:
      - {name: Stimpak, size: petty, uses: 1, count: 4}
  4:
    text: A Safe. You cracked it and found a small Gold Bar (150 caps, bulky). You also found a 
      photograph of the man whose safe it was, who looked a lot like your father.
    data:
      gear:
      - {name: Gold Bar, size: bulky, note: 150 caps}
  5:
    text: A Map. Scrawled on wax paper in a dying man's hand. Take The Crumpled Map (petty), marking
      a cache in a place you have not yet visited.
    data:
      gear:
      - {name: Crumpled Map, size: petty}
  6:
    text: A Corpse. Not yet cold, carrying a Pre-war Pistol (d8). You took it. The killer saw you. 
      The killer has not caught up with you yet.
    data:
      gear:
      - {name: Pre-war Pistol, damage: d8}
