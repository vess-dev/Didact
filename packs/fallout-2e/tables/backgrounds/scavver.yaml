table: scavver-2
title: What does your scavver kit specialize in?
dice: d6
source: backgrounds/scavver
entries:
  1:
    text: 'Dowsing Rig: You can find buried metal within 30 feet by slow walking. Takes a turn per attempt.'
    data:
      gear: [Dowsing Rig]
  2:
    text: 'Salvage Hooks & Line: 50 feet of line and a set of grapple hooks (1 slot; counts as rope and
      grappling hook). You can fish one bulky item up out of a pit, a flooded cellar, or a collapsed floor
      without climbing down after it.'
    data:
      gear:
      - name: Salvage Hooks & Line
        note: 50 feet of line and a set of grapple hooks; counts as rope and grappling hook
  3: 'Lead-Lined Pack: One slot in your pack is shielded. Hot material stored there — a leaking fusion
    cell, a glowing rock, a rod from a reactor — gives off no Rads to you or anyone near you.'
  4:
    text: 'Hand Welder: Given a turn and 1 Scrap, you can weld two broken items into one working improvised
      tool. The Overseer decides exactly what it does, and how long it lasts.'
    data:
      gear: [Hand Welder]
  5:
    text: 'Cap-Weighed Scales: You can name the true value of any small item within 10% at a glance. Merchants
      cannot cheat you, and you get a tenth more than the asking price for anything you sell.'
    data:
      gear: [Cap-Weighed Scales]
  6:
    text: "Magnet Glove: A leather glove sewn with pre-war magnets. You can hold small metal objects fast
      to it, and disarm most unsecured metal tools from a target's hand with a DEX save."
    data:
      gear:
      - name: Magnet Glove
        size: petty
        note: a leather glove sewn with pre-war magnets
