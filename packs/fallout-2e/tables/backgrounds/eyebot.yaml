# Eyebot (backgrounds/eyebot): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: eyebot-1
title: What recordings do you still broadcast?
dice: d6
source: backgrounds/eyebot
entries:
  1: "Enclave Radio. You were one of the eyebots President Eden sent out to sing to the wasteland — marching
    bands, fireside chats, inspirational quotes — and your Enclave transponder still answers. Enclave
    soldiers and their robots take you for one of their broadcast units and won't fire on you until you
    give them cause. Anyone who has fought the Enclave knows that music: their first Reaction to you is
    one step worse."
  2: Morale Bulletins. You still carry the war news of 2077 — Anchorage reclaimed, the Chinese in 
    full retreat, victory by Christmas — in the steady voices of real announcers. Cut together, 
    those voices will say anything. Once per session, broadcast one fabricated announcement; every 
    NPC who hears it makes a WIL save or believes it for the rest of the scene.
  3: 'Field Hospital Guidance. You were issued to an Army field hospital, and your memory still holds
    its triage recordings — a calm pre-war voice that talked soldiers through the worst day of their lives.
    Once per session, you may talk an ally through treating a wound: they restore 1d6 STR without a Stimpak.
    The voice does the work; you just relay it.'
  4: The Ad Reel. RobCo leased you to advertisers, and most of your memory is still jingles — 
    Nuka-Cola, Sugar Bombs, Abraxo Cleaner, a reserved place in a Vault-Tec vault near you. Every ad
    ended with an address. In any pre-war town, you know where each store, warehouse, and factory 
    outlet stood and what it sold, which tells the party where the stock might still be.
  5: "Galaxy News Radio. Somewhere along the way you became a relay for a living station — Three Dog's
    GNR, or whichever voice carries your region's news: Diamond City Radio, Radio New Vegas, Julie on
    Appalachia Radio. The DJ knows your call-sign. Once per session, when the party does something worth
    talking about, you can phone it in; by the next day it is on every radio in range, and the first Reaction
    the party gets in any settlement that listens is one step better."
  6:
    text: "The Number Station. Your receiver has been locked for two hundred years on a Chinese intelligence
      frequency: groups of four numbers, read by a woman's voice, looping from a transmitter no one has
      found — the same network that ran Mama Dolce's and the listening posts around the capital. You have
      cracked one message. Take the Cipher Sheet (petty) you worked it out on: it gives the location of
      a Chinese safehouse in the region, sealed since the bombs. The numbers change once a week, and you
      are still working on the rest."
    data:
      gear:
      - {name: Cipher Sheet, size: petty}
---
table: eyebot-2
title: What do you do that no standard Eyebot ever did?
dice: d6
source: backgrounds/eyebot
entries:
  1: 'Silent Flight: Your thrusters are muffled. You move in near silence and can sneak — most robot chassis
    are far too loud to attempt it.'
  2: 'Military Sensors: Someone fitted you with a military sensor dish that reads heat, motion, and the
    particular hum of a stealth field. Within sixty feet, nothing cloaked — a Stealth Boy, a Chinese stealth
    suit, a nightkin — can hide from you, and you can show the party exactly where it is.'
  3: "Throw Your Voice: Once per scene, you can put any sound you have recorded — a gunshot, a deathclaw's
    roar, a sergeant barking orders — at a point within sixty feet. Anyone who hears it and fails a WIL
    save believes it came from there, and acts on that."
  4: 'Inspirational Mode: Once per scene, you may play a pre-war song — the Ink Spots, Bob Crosby, the
    standards every wasteland station still spins. One ally who can hear it is no longer Panicked.'
  5: 'Uplink: Once per session, you can hail any broadcasting machine within a hundred miles — a radio
    tower, a distress beacon, a satellite relay, another eyebot — and ask it one question about what it
    can see or hear. It answers truthfully. Whoever owns it now knows that someone asked, and roughly
    from where.'
  6: 'Onboard Workbench: A fold-out weapons bench and reloading press are packed into your casing. Wherever
    the party stops for a Downtime Action, it has a Weapons Workbench — repairs, mods, and ammunition,
    no settlement required.'
