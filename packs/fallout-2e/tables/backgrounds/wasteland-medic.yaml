# Wasteland Medic (backgrounds/wasteland-medic): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: wasteland-medic-1
title: Where did you learn to cut?
dice: d6
source: backgrounds/wasteland-medic
entries:
  1:
    text: Goodsprings. You swept floors and boiled bandages for the old doctor in Goodsprings — the 
      one who once dug two bullets out of a courier's skull and sent them walking. Take his spare 
      Doctor's Bag (3 uses; see Marketplace) and his habit of asking every patient to count backward
      from ten.
    data:
      gear:
      - {name: Doctor's bag, uses: 3, note: the old Goodsprings doctor's spare}
  2: Underworld. You worked the Chop Shop in Underworld, under the Museum of History, beside a ghoul
    doctor who kept two live glowing ones in an observation cell to study the turn. You can tell a 
    ghoul who is sliding toward feral a week before it happens, and ghouls know you as the medic who
    never flinched — their Reactions to you shift one step better.
  3:
    text: "The Responders. Your teacher learned from the Responders, Appalachia's volunteer first-aid
      corps, whose automated training holotapes still play in ruined fire stations. Take a Responder Field
      Kit (3 uses): each use restores 1d6 STR and also cures one poison or venom."
    data:
      gear:
      - {name: Responder Field Kit, uses: 3}
  4: "Vault 81. You were an orderly in Vault 81's infirmary — the vault that opens its door to trade,
    whose first Overseer walled off Vault-Tec's plague labs rather than let them be used on her people.
    You went into that sealed wing once, among its diseased test mole rats, and came out sick and alive.
    Your blood has fought off everything the wing could throw at it: re-roll any failed save against disease
    or infection."
  5:
    text: The New Vegas Medical Clinic. You worked the counter for the implant surgeon at the New 
      Vegas Medical Clinic and took your wages in surgery. Take a Sub-Dermal Armor Implant — pre-war
      polymer mesh stitched under the skin of your chest (1 Armor; wearing metal armor over it 
      disrupts the mesh and cancels the bonus).
    data:
      gear:
      - name: Sub-Dermal Armor Implant
        armor: 1
        note: pre-war polymer mesh stitched under the skin of your chest; metal armor worn over it 
          cancels the bonus
  6:
    text: 'Med-Tek. You picked through a pre-war Med-Tek Research lab and walked out with one of its Auto-Doc
      Arms strapped to your shoulder — a surgical manipulator with a little brain of its own (d8; bulky
      when not worn). It can move by itself anywhere in your line of sight: crawling along a floor, turning
      a key, passing you a clamp.'
    data:
      gear:
      - name: Auto-Doc Arm
        damage: d8
        note: bulky when not worn; a surgical manipulator with a little brain of its own
---
table: wasteland-medic-2
title: What one rare supply keeps your work possible?
dice: d6
source: backgrounds/wasteland-medic
entries:
  1:
    text: "Hydra: Three doses of the NCR field hospitals' limb-mender — a Supa Yum fruit-drink bottle
      with three vials taped around its middle, each piped up to the mouth. A dose mends one Broken or
      Crippled Scar over a single night's rest instead of weeks. Addictive."
    data:
      gear:
      - name: Hydra
        size: petty
        uses: 3
        qualities: [addictive]
        note: a Supa Yum bottle with three vials taped around its middle
  2:
    text: "Antivenom Recipe: You know the Mojave survivalist's trick: a nightstalker or cazador gland,
      boiled down and strained. Start with 3 doses of Antivenom (see Marketplace), and brew 1d4 more from
      any fresh gland with a turn of work over a fire."
    data:
      gear:
      - name: Antivenom
        size: petty
        uses: 3
        note: brew 1d4 more from any fresh gland with a turn of work over a fire
  3:
    text: 'Healing Salve: A tin of Appalachian salve boiled from fern flower and bloodleaf the way the
      Responders taught (3 uses). Restores full STR lost to burns, acid, or radiation sickness — and nothing
      else.'
    data:
      gear:
      - name: Healing Salve
        uses: 3
        note: restores full STR lost to burns, acid, or radiation sickness, and nothing else
  4:
    text: "Turbo: Four doses of the Mojave's favorite reflex chem (see Marketplace). A dose means you
      automatically pass the first-round DEX save to act this combat. Addictive: each dose forces a STR
      save; fail and you are addicted (1 Fatigue each morning until cured)."
    data:
      gear:
      - name: Turbo
        size: petty
        uses: 4
        qualities: [addictive]
  5:
    text: 'Hospital Respirator: A pre-war field respirator from a Vault-Tec clinic (bulky). You can work
      for an hour in toxic air or underwater, and keep a patient breathing through surgery that would
      otherwise kill them.'
    data:
      gear:
      - name: Hospital Respirator
        size: bulky
        note: a pre-war field respirator from a Vault-Tec clinic
  6:
    text: "Stimpak Diffuser: Two Appalachian aerosol canisters that burst a cloud of Stimpak mist over
      the people around you. As an action, pop one: every ally within arm's reach restores 1d6 STR."
    data:
      gear:
      - name: Stimpak Diffuser
        size: petty
        uses: 1
        count: 2
        note: "an aerosol canister: as an action, pop one and every ally within arm's reach restores 1d6
          STR"
