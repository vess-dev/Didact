# Institute Scientist (backgrounds/institute-scientist): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: institute-scientist-1
title: What did you come up to the surface for?
dice: d6
source: backgrounds/institute-scientist
entries:
  1:
    text: "A Census. You were sent to catalog surviving human populations and report back. You have filed
      no reports. Take a Leather Field Journal full of honest observations the Institute has never read:
      once per session, it holds an entry on the settlement you're entering — who leads it, who they hate,
      what they're short of."
    data:
      gear: [Leather Field Journal]
  2:
    text: A Recovery. You were sent to recover a specific missing synth — one of your colleague's 
      projects. Take the Tag Reader (petty) that pings when its implanted tracker is within a mile. 
      You have begun to doubt whether you should return it when you find it.
    data:
      gear:
      - {name: Tag Reader, size: petty}
  3:
    text: "A Specimen. You were to acquire biological samples of a specific wasteland creature — pick
      one: mirelurks, radscorpions, bloodbugs, yao guai. You have the sample. You have also begun to name
      the creature. You know its kind's every habit: they never surprise you, and you always know where
      the nearest nest is within a mile."
    data:
      gear:
      - {name: Biological Sample, note: of the creature you picked}
  4: "A Measurement. You were conducting a baseline radiation study. What you found did not match the
    Institute's records. You are not sure whether the records are wrong or whether the world is changing.
    Your readings taught you the weather: you always know a day in advance when a rad storm is coming."
  5:
    text: A Warning. Something in the Institute is broken. You fled to carry a warning to the 
      surface, not to your own people. You are not sure anyone on the surface will care. You have a 
      Sealed Data Chip (petty) you have not yet decrypted.
    data:
      gear:
      - {name: Sealed Data Chip, size: petty}
  6: 'A Doubt. You were born in a clean place and you grew up believing certain things. You do not believe
    them anymore. You walked out without orders, but you understand the people who give them: once per
    session, ask the Overseer what an Institute character truly intends, and get an honest answer.'
---
table: institute-scientist-2
title: What did your education actually give you?
dice: d6
source: backgrounds/institute-scientist
entries:
  1: 'BioScience Specialty: You can identify any organic creature, plant, or toxin by examination. Once
    per session you may ask the Overseer about a biological question relevant to the scene and receive
    a specific, accurate answer.'
  2: 'Synthetic Analysis: You can tell a Gen-3 synth from a human by examining them for five minutes uninterrupted.
    You can also tell when a synth is under remote command.'
  3:
    text: 'Field Relay: You carry an Institute Relay Beacon (1 use, petty). Activating it marks your location
      to the Institute, and anything they choose to send arrives within a day. The Institute will not
      send help, but they will send something.'
    data:
      gear:
      - {name: Institute Relay Beacon, uses: 1, size: petty}
  4:
    text: 'Clean Medicine: Take 2 Institute-grade Stimpaks (each heals 2d6 STR instead of 1d6). You can
      tell a clean dose from a cut or counterfeit one at a glance.'
    data:
      gear:
      - name: Institute-grade Stimpak
        size: petty
        uses: 1
        count: 2
        note: heals 2d6 STR instead of 1d6
  5:
    text: "Institute Clearance: Your Institute ID still works. Institute-pattern doors and terminals open
      for you, and Gen-1 and Gen-2 synths treat you as staff unless they have been ordered otherwise.
      It will keep working until someone below notices you're gone."
    data:
      gear:
      - name: Institute ID
        note: 'still works: Institute-pattern doors and terminals open for you'
  6: 'The Hard Truth: You know at least one thing about the Institute that the surface would riot to learn.
    Once per session you may reveal one such fact in conversation with an NPC. The Overseer decides how
    the NPC reacts.'
