# Railroad Agent (backgrounds/railroad-agent): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: railroad-agent-1
title: What was your last extraction?
dice: d6
source: backgrounds/railroad-agent
entries:
  1:
    text: The Successful One. You pulled a runaway synth out of a hostile settlement, got them a new
      face and new memories, and walked them to a safehouse a hundred miles away. They still leave a
      single scratched symbol in one of your dead drops every season. Take the Symbol-Stone (petty) 
      they gave you. They owe you their life, and once, they will risk it for you.
    data:
      gear:
      - {name: Symbol-Stone, size: petty}
  2:
    text: The One That Went Wrong. A Courser found you halfway through. You lost the runaway. You 
      lost a friend. You still have your friend's Broken Dog Tags (petty). You know the Courser's 
      face, and it knows yours.
    data:
      gear:
      - {name: Broken Dog Tags, size: petty}
  3: The Betrayal. The runaway you were extracting turned out to be an Institute plant — a Gen-3 
    infiltrator sent to find the safehouses. You killed it. You are certain it sent a signal before 
    it died. Something is coming.
  4: 'The Long Con. Your last extraction was years ago. You have been deep undercover in a settlement
    ever since, waiting for the next call: a house, a name, a trade, and friends who would lie for you
    without knowing why. Choose the settlement. When the call comes, you leave all of it behind.'
  5:
    text: The One You Failed. You were too slow. The runaway was captured before you reached them. 
      You carry a Photograph (petty) of their face. You have not given up on recovering them.
    data:
      gear:
      - {name: Photograph, size: petty}
  6: The One You Saved. A synth child. They do not yet know they are a synth. They are being raised 
    by a family in a settlement you've never set foot in, and once a year you watch them from half a
    mile off to make sure they're still all right.
---
table: railroad-agent-2
title: What does an agent carry that a regular operator does not?
dice: d6
source: backgrounds/railroad-agent
entries:
  1:
    text: "Face-Changer's Kit: Needles, dyes, and a surgeon's pliers, of the kind the Railroad's doctors
      use on runaways. Given a Downtime Action, you can change a person's face enough to fool anyone who
      knew them — scars, tattoos, a broken and reset nose. On a synth, you can change the face-print the
      Institute looks for, too."
    data:
      gear:
      - {name: Face-Changer's Kit, note: "needles, dyes and a surgeon's pliers"}
  2: "The Lantern Signs: You know the Railroad's chalk road-signs — the lantern marks on walls and doorframes
    that mean safehouse, danger, dead drop, friend nearby. In any town you can find the local marks within
    a scene and read what they say, and any agent who sees you draw a lantern knows you for one of their
    own."
  3:
    text: "Memory Wipe Kit: The portable end of the Railroad's hardest work: a headset, a syringe, and
      a looped holotape. Given an hour with a willing or restrained subject, you erase their memory of
      the last day and leave a simple cover story in its place. Synths don't resist; a human makes a WIL
      save. 1 use; any Railroad safehouse can refill it."
    data:
      gear:
      - name: Memory Wipe Kit
        uses: 1
        recharge: any Railroad safehouse can refill it
        note: a headset, a syringe and a looped holotape
  4:
    text: "The Red Tourniquet: An Institute-grade synth repair cuff disguised as a strip of red cloth
      — a flexible wrap lined with diagnostic filaments and a single-use nanite charge. Fastened around
      a dying synth's wrist, it stabilizes them at once and restores their full STR over one watch. 1
      use."
    data:
      gear:
      - name: Red Tourniquet
        uses: 1
        note: 'an Institute-grade synth repair cuff: stabilizes a dying synth at once and restores their
          full STR over one watch'
  5:
    text: 'Blank Identity: A small leather folder of papers — settlement ID, caravan manifests, Brotherhood
      authorization. Once per session you may present one of these at a checkpoint and it is accepted.'
    data:
      gear:
      - name: Blank Identity
        note: 'a small leather folder of papers: settlement ID, caravan manifests, Brotherhood authorization'
  6: 'Recall Code: Every synth has a recall code, a hidden subroutine that restores its factory settings.
    You know the code for one line of Institute synths (Gen-1 or Gen-2, your pick). Once per session,
    speak it, and a synth of that line makes a WIL save or shuts down for a scene.'
