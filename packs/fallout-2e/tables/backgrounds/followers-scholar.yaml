table: followers-scholar-2
title: What else does your order give you?
dice: d6
source: backgrounds/followers-scholar
entries:
  1: "The Safehouses: You know of a Followers safehouse in every major settlement within a week's travel.
    You always have a place to sleep and a chance to resupply at cost."
  2: 'The Lecture: Once per session you may deliver a short explanation to any NPC who will listen. If
    the NPC survives the lecture, their Reaction to you shifts one step better.'
  3: 'Field Laboratory: Given a Downtime Action and common tools, you can synthesize a single common chem
    of your choice.'
  4:
    text: 'The Field Journal: Your notebook has a detailed record of every ruin the Followers have mapped
      within the region. The Overseer must, once per session, tell you one true fact about a known ruin
      the party is approaching.'
    data:
      gear:
      - name: Field Journal
        note: a record of every ruin the Followers have mapped within the region
  5: "Clinical Eye: You can identify poisons, venoms, infections, and chem withdrawal on sight, without
    a save. Given a turn and your satchel, you can treat any poison or venom you've identified: the patient's
    next save against it is an automatic pass."
  6: 'The Long Read: When you spend a Downtime Action to Research, you complete two Milestones of progress
    instead of one.'
