table: followers-scholar-1
title: What did you study before you came out here?
dice: d6
source: backgrounds/followers-scholar
entries:
  1:
    text: Pre-war Medicine. You can read a pre-war pharmaceutical label and perform surgery with the
      right tools. You start with a Followers Medical Kit (3 uses, each heals 1d6 STR as a Stimpak).
      When you have access to a Chemistry Station, you can refill it for half the usual Stimpak 
      cost.
    data:
      gear:
      - {name: Followers Medical Kit, uses: 3, note: each heals 1d6 STR as a Stimpak}
  2: Pre-war History. You know the names of pre-war presidents, senators, corporate leaders, and 
    news anchors. Once per session you may declare that a specific pre-war historical figure had a 
    connection to a current location or artifact, and the Overseer will confirm or create one.
  3: Biology & Mutation. You know the life cycle of every mutated creature in the region. Once per 
    session you may ask the Overseer a question about a specific creature type and receive an 
    honest, specific answer.
  4: Engineering & Architecture. You can read pre-war blueprints and understand the layout of any 
    pre-war building at a glance. You find one hidden feature per ruin (Overseer's pick).
  5: Linguistics & Cryptography. You read and speak every pre-war language the Followers have 
    recovered, and you were taught to break the codes the pre-war government hid behind. Texts that 
    stump everyone else are plain reading to you, and given a Downtime Action you can crack any 
    pre-war cipher, military code, or encrypted holotape.
  6: Anthropology. You have studied settlements, tribes, and raider cultures across the region. A 
    Hostile result on your Reaction rolls shifts one step better, to Wary.
