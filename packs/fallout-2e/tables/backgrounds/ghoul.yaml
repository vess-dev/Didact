table: ghoul-2
title: What have the long years left you with?
dice: d6
source: backgrounds/ghoul
entries:
  1: 'Ghoul-Sign: Ferals take you for one of their own even in a fight: they never attack you, provoked
    or not. Anyone who stays at your side and moves slowly can walk through a feral pack with you.'
  2:
    text: 'Old Uniform: You wear the dress coat of a pre-war Army sergeant who dug you out of the rubble
      on the day the bombs fell. He turned feral years ago and still wanders a ruin you could find again.
      The insignia still reads to pre-war military robots: once per session, a Protectron, Mister Gutsy,
      or sentry bot running old orders obeys a single command from you.'
    data:
      gear:
      - name: Old Uniform
        note: a pre-war Army sergeant's dress coat; its insignia still reads to pre-war military 
          robots
  3:
    text: "Voice on the Radio: Your pre-war transistor radio has been stuck on one station for two hundred
      years: an automated emergency bulletin from the afternoon of October 23, 2077, read by a man who
      didn't know he had an hour to live. Once per session, the loop mentions something useful about the
      place you're in — an evacuation route, a supply depot, a shelter's location — as it stood that day."
    data:
      gear:
      - name: Transistor Radio
        note: pre-war, stuck on one station for two hundred years
  4: "Half-Light: You don't sleep anymore. You need an hour lying still in the dark each day, and that's
    all — it clears your Fatigue the way a night's safe sleep would. Lack of sleep never makes you Deprived,
    and you can keep watch every night — but if you can't find real darkness, you get no rest at all."
  5: 'The Line: You know where the rad lines are, always, without a Geiger counter. Within a mile you
    can feel the edges of any hot zone.'
  6: "Named: A famous ghoul — Goodneighbor's mayor, Carol of Underworld, one of the Slog's farmers — knows
    your name and was kind to you once. They will give you shelter. Once."
