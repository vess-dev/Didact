table: ghoul-1
title: How are you turning?
dice: d6
source: backgrounds/ghoul
entries:
  1:
    text: 'Radiant. You are on the road to becoming a glowing one. You absorb radiation instead of taking
      it: you gain no Rads from environmental exposure (hot zones, rad storms, dirty water), though weapons
      and direct radiation still fill your slots. The cost is the glow — a faint green light that no darkness
      hides.'
    data:
      immune: [ambient-rads]
  2: Rad-Fed. Radiation knits your flesh back together, the way a glowing one's burst mends the 
    ghouls around it. Once per day, when you take a Rad, you also restore 1d6 STR. Every ghoul you 
    know has told you where that road ends.
  3: "Unfeeling. Your nerves died a century ago. Heat and cold never make you Deprived, and the first
    time each session you fail a save against pain — torture, a burning floor, a bone being set — treat
    it as a pass. The catch: you feel nothing through your fingertips, so you can't pick a lock or find
    anything by touch alone."
  4:
    text: Slow Rot. Your body is coming apart slowly. You have 1 extra inventory slot, because you 
      can store things in pockets of yourself — but anything kept there comes out smelling of you 
      forever.
    data: {slots: 1}
  5: Withered Eye. One eye is a milky dead thing, and through it you see heat. In total darkness you
    can see living creatures clearly up to 40 feet away.
  6: Old Memory. You remember the world before the bombs in painful detail — prices, streets, who 
    owned which building, what the curfew sirens meant. Once per session, describe a detail of the 
    pre-war world that bears on the current situation, and the Overseer confirms it or adjusts it.
