table: wasteland-detective-2
title: What do you do that most people can't?
dice: d6
source: backgrounds/wasteland-detective
entries:
  1: "Read the Room: Once per scene, you may ask the Overseer one specific question about someone you've
    talked to or a place you've searched in that scene (\"Is he lying?\" \"What is she hiding?\" \"Who
    was here last?\") and receive an honest answer."
  2: 'Interrogation: When questioning an unarmed NPC, you may force a WIL save. On a fail, they tell you
    one true thing they were trying to hide. Works once per NPC.'
  3: 'Pattern Recognition: Once per session, you may declare that two seemingly unrelated events or clues
    are in fact connected. The Overseer must either confirm it or provide a better connection.'
  4: "Informants: You have informants in three settlements within a week's travel. Name a settlement;
    the Overseer tells you who you know there and what they owe you."
  5: 'Clean Shot: Your pre-war snub is accurate. Your first shot of any combat with it is not Impaired
    by range or cover.'
  6: "The Eye: You notice the thing that doesn't belong. When you enter a new location, the Overseer must
    describe the one thing that is out of place — even if the party would not normally see it."
