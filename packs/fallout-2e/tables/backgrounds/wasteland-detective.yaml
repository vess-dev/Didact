table: wasteland-detective-1
title: What was your most famous case?
dice: d6
source: backgrounds/wasteland-detective
entries:
  1:
    text: The Missing Daughter. A settlement elder hired you to find his runaway daughter. You found
      her. You also found out why she had run. You did not return her. Take the Locket (petty) she 
      gave you before disappearing again.
    data:
      gear:
      - {name: Locket, size: petty}
  2:
    text: The Synth in the Mayor's Chair. You exposed the mayor of a small town as a Gen-3 synth. 
      The town hanged him. You are no longer sure you made the right call. Take his Signet Ring 
      (petty).
    data:
      gear:
      - {name: Signet Ring, size: petty}
  3: 'The Stolen Shipment. A caravaneer hired you to find their stolen goods. You found the thief — and
    the dozen children the thief was feeding with the stolen rations. You gave the caravaneer a different
    story. The thief still owes you: once, they will steal something for you, no questions asked.'
  4:
    text: The Locked Room. A body in a sealed vault room. No other way in or out. You solved it. The
      method still gives you nightmares. Take A Single Pre-war Key (petty) — it was the answer, and 
      it opens one more door somewhere that you haven't found yet.
    data:
      gear:
      - {name: Pre-war Key, size: petty, note: it opens one more door somewhere}
  5:
    text: Your Partner. You had one, once. They were killed on a job. The killer is still out there.
      You carry their Police Badge (petty) in your inner pocket.
    data:
      gear:
      - {name: Police Badge, size: petty}
  6: "The Case You Never Solved. A disappearance. A person you cared about. A trail that went cold at
    a vault door you could not open (pick one from the Vaults book, or let the Overseer choose). You have
    been working the case in your spare time for a decade: once per session, the Overseer tells you whether
    something you've just found bears on it."
