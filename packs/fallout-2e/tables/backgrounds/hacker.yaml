table: hacker-2
title: What trick makes a terminal listen to you?
dice: d6
source: backgrounds/hacker
entries:
  1: 'Backdoor: You memorized the RobCo Termlink maintenance overrides every pre-war sysadmin was told
    to delete. Once per session, you may declare that one still works on the terminal in front of you.
    It does — but the terminal logs your access somewhere.'
  2: 'Daemon Whisperer: When a dormant robot has a spoken diagnostic mode, you can access it. For one
    scene, the robot answers simple questions truthfully.'
  3: "Tape Reader: You can read a holotape's program without running it, learning what it does before
    anyone plays it."
  4: 'Cold Boot: Given a turn and a fusion cell, you can bring a dead pre-war device back online. Roll
    the Die of Fate; on a 3 or less, it also lets something else through.'
  5:
    text: 'Forged Credentials: A stack of laminated pre-war IDs. Once per session, you can present yourself
      as a pre-war official to any robot or automated checkpoint. It will believe you unless your claim
      is actively contradicted.'
    data:
      gear:
      - {name: Forged Credentials, note: a stack of laminated pre-war IDs}
  6:
    text: 'Ghost Key: A keydrive loaded with a corrupted pre-war admin tool. It opens one type of locked
      terminal — Vault-Tec, military, RobCo, or corporate; the Overseer names it. It runs on a leaking
      micro-cell: each use costs you a Rad. Its login chime is a recorded voice you almost recognize.'
    data:
      gear:
      - name: Ghost Key
        note: a keydrive loaded with a corrupted pre-war admin tool; each use costs you a Rad
