# Hacker (backgrounds/hacker): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: hacker-1
title: What was your last clean break-in?
dice: d6
source: backgrounds/hacker
entries:
  1:
    text: Research Facility. You cracked a sealed RobCo research database and copied a file onto a 
      blank tape. Take the Data Tape (petty). You haven't read it yet. Opening it takes a quiet hour
      and a terminal.
    data:
      gear:
      - {name: Data Tape, size: petty}
  2:
    text: Settlement Safe Room. You broke into the kind of safe room Diamond City's mayor keeps, 
      read a settlement leader's private correspondence, and got out. Take the Folded Letter 
      (petty). You could blackmail someone with it. You haven't decided.
    data:
      gear:
      - {name: Folded Letter, size: petty}
  3:
    text: Vault Door Log. You read the record of who entered a specific vault before the war, and 
      none of the names match the vault's registered residents. You carry a Copied Page (petty).
    data:
      gear:
      - {name: Copied Page, size: petty}
  4:
    text: Courthouse. Pre-war property records. You got caught halfway out, and one settlement now 
      hates you — but you still have the Deed (petty) to a pre-war building that someone important 
      lives in today.
    data:
      gear:
      - {name: Deed, size: petty}
  5:
    text: Military Bunker. You triggered an alarm and ran. Take a Laser Pistol (d8) you grabbed on 
      the way out. A patrol robot is still looking for you.
    data:
      gear:
      - {name: Laser Pistol, damage: d8}
  6:
    text: Your Own House. You broke into a safe in your childhood home after your mother died. It 
      held nothing but a Hand-Written List of Names (petty) you don't recognize and a key.
    data:
      gear:
      - {name: Hand-Written List of Names, size: petty}
      - {name: Key, size: petty, note: from the same safe}
