# Zetan (backgrounds/zetan): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: zetan-1
title: Why are you still here?
dice: d6
source: backgrounds/zetan
entries:
  1:
    text: 'The Crash. Your recon craft went down in the Wastes, like the one that fell in the Capital
      Wasteland and the one that came down in the Commonwealth. You are the only survivor. Take a Ship
      Fragment (petty, gently humming): its hum rises the nearer you get to your wreck — or to any Zetan
      technology at all. The ship is still out there.'
    data:
      gear:
      - {name: Ship Fragment, size: petty, note: gently humming}
  2: 'The Study. You were never meant to be down here — you were a cataloguer. Your people have been collecting
    this world for a thousand years: a samurai, a cowboy, a whole Army unit out of Anchorage, and every
    book and gadget they had on them. Your records have become a way to understand a place that has forgotten
    itself. Once per session, you may ask the Overseer about a specific pre-war thing and receive the
    accurate information your records hold on it.'
  3:
    text: 'The Specimen. Humans caught you. The pre-war government kept you under glass in a sealed lab
      — or the Enclave did, after the bombs — until the lab came down around you and you crawled out.
      Take the Specimen Tag (petty) still clipped to your ankle: it names the facility. Whatever else
      they took from you is still in there, and so, probably, is someone who wants their specimen back.'
    data:
      gear:
      - {name: Specimen Tag, size: petty}
  4: "The Child. You were not an adult of your species — a youth, barely more than an infant by your kind's
    reckoning — and you have no idea how to get home. Your people do not abandon their young; they simply
    take a long time to arrive. Once per campaign, when you would die, a tractor beam finds you first:
    you are lifted out of the fight and wake aboard a ship that is not yours. The Overseer decides what
    happens next."
  5: 'The Watcher. You were one of the agents your people leave on the ground — the grey shapes the town
    of Flatwoods once called a monster. Your assignment is one human in the region: watch them, learn
    them, and have them ready when the ship comes. You know your subject better than anyone alive; once
    per session, you may ask the Overseer where they are right now. You have begun to doubt that you will
    hand them over.'
  6:
    text: "The Refugee. You served aboard the second mothership. The first was taken from within — its
      own specimens rose up and killed the crew — and then it turned its guns on yours. You rode an escape
      pod down through the burning wreckage. There is nothing to go back to; the wastes are your home
      now, whether or not you want them. Take the pod's Alien Biogel (3 uses): each dose restores 1d6
      STR to a Zetan or a human alike, though on a roll of 1 it also does something strange for a scene
      (the Overseer decides what)."
    data:
      gear:
      - {name: Alien Biogel, uses: 3}
---
table: zetan-2
title: What is strange about you, beyond the obvious?
dice: d6
source: backgrounds/zetan
entries:
  1: 'Telepathic Flash: Once per scene, you may touch a person and share a single memory directly into
    their mind — the one thing your screeches can never say. The memory may be one of yours, or one you
    pull up out of theirs (you see it too). They make a WIL save or are left reeling for a round, with
    no action.'
  2:
    text: 'Alien Physiology: Your metabolism shrugs off pre-war pharmaceuticals. You ignore all Fatigue
      that would be inflicted by chems, pre-war drugs, and experimental gear. You may not benefit from
      Stimpaks or pre-war medical chems either; your biology is too different.'
    data:
      immune: [stimpaks]
  3: 'The Dreaming: Once per session, when you sleep, you may ask the Overseer a single yes/no question
    about the near future. The Overseer answers honestly.'
  4: "Cold Touch: Your skin is cold, and living things know without thinking that you are not one of them.
    Animals shy from you: dogs, brahmin, and radstags won't come near, and wild beasts never choose you
    as their first target. First-meeting Reactions are one step worse (this does not stack with the usual
    Zetan penalty) — except from ghouls and synths, who know what it is to be looked at that way, and
    react one step better instead."
  5: 'Ship-Voice: A faint voice speaks in your ear sometimes — the mind of the ship that brought you,
    or what is left of it. It tells you things you should not be able to know. Once per session, the Overseer
    must tell you one hidden detail about your immediate surroundings.'
  6: 'The Forgetting: Every day you spend in this world, one of your own memories begins to fade. You
    are slowly becoming part of this place. At the end of each session, the Overseer may ask you to give
    up one detail of your former life. In exchange, your max STR, DEX, or WIL (your pick) rises by 1,
    capped at 18 (or 12 for STR, 16 for DEX per your biology). You can make this trade three times at
    most, ever. After the third, your original self is gone; you are human-soft now, and the stars you
    came from are just stars.'
