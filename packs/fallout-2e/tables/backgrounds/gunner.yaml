table: gunner-1
title: Why did you leave the company?
dice: d6
source: backgrounds/gunner
entries:
  1:
    text: The Contract. Your last contract was a job you refused to finish. The settlement you were 
      sent to clear was not a raider settlement. You killed your commanding officer over it. Take 
      his Officer's Sidearm (d8).
    data:
      gear:
      - {name: Officer's Sidearm, damage: d8}
  2:
    text: The Payout. You were supposed to be paid in a specific cache of pre-war gear. The cache 
      was empty when you reached it. Somebody in the company stole your share. You know who. You 
      have not yet caught them — but you kept the Cache Map (petty), and the second cache marked on 
      it, the one nobody has found yet.
    data:
      gear:
      - {name: Cache Map, size: petty}
  3:
    text: The Squad. Your squad was killed in a raider ambush that you now believe was arranged by 
      your own employer to tie up loose ends. You are the only survivor. You carry Five Sets of Dog 
      Tags (petty).
    data:
      gear:
      - {name: Dog Tags, size: petty, count: 5, note: "five sets: your squad's"}
  4:
    text: The Contract You Finished. You did the job. You were at Quincy the day the company came 
      over the walls, or somewhere just like it. You sleep poorly. Take a Photograph (petty) of a 
      child you could not save.
    data:
      gear:
      - {name: Photograph, size: petty}
  5: "The Promotion. You were offered a command position you did not want and could not refuse without
    consequences. You took it, then walked out a month later. Your old company has a standing bounty on
    you, but you still know the Commander's Codes: once, you can give orders to a Gunner squad that hasn't
    heard you deserted."
  6:
    text: "The Better Offer. A competing company hired you away, then went under a week after you joined.
      Now you have no company and no job, and the original company still considers you a deserter. You
      walked off with the dead outfit's Contract Folder (petty): three jobs still unpaid, and every one
      of the employers still alive."
    data:
      gear:
      - {name: Contract Folder, size: petty}
---
table: gunner-2
title: What does your training still give you?
dice: d6
source: backgrounds/gunner
entries:
  1: 'Gun Line Nerve: You cannot become Panicked while firing a heavy or two-handed weapon, or while braced
    behind hard cover. Step away from the gun or the wall and the nerve goes with it.'
  2:
    text: 'Heavy Weapons Cert: You are trained on every heavy weapon the company fields — minigun, Gatling
      laser, missile launcher. You may fire heavy weapons unbraced or on the move without the attack becoming
      Impaired.'
    data: {ability: Heavy Weapons Cert}
  3: 'Ammo Discipline: You find one extra box of ammunition every time a ruin encounter would yield any
    — old habits from company logistics.'
  4:
    text: 'Drag and Cover: As a single action and with no save, you can grab a downed ally and haul them
      up to 40 ft to cover or out of a line of fire. You also start with 2 Stimpaks.'
    data:
      gear:
      - {name: Stimpak, size: petty, uses: 1, count: 2}
  5: 'Fortification: Given a turn and common tools, you can prepare a defensive position in any terrain.
    Any ally firing from that position is not Impaired at long range.'
  6: 'Old Contacts: You know a working merc recruiter in each of two specific settlements (Overseer names
    them). They will give you work, information, and shelter for a price.'
