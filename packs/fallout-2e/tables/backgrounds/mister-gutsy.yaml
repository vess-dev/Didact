table: mister-gutsy-1
title: What was your last mission on record?
dice: d6
source: backgrounds/mister-gutsy
entries:
  1:
    text: Checkpoint Duty. You held a pre-war checkpoint on a highway for two centuries. The 
      checkpoint is still technically yours. You came out looking for reinforcements. Take an Ammo 
      Crate (bulky, counts as 3 uses of any ballistic ammo you claim) and a set of expired orders.
    data:
      gear:
      - name: Ammo Crate
        size: bulky
        uses: 3
        note: counts as 3 uses of any ballistic ammo you claim
      - {name: Expired Orders, note: a set}
  2: Squad Support. You were the heavy weapons unit for a five-man army squad. Four of them are 
    dead. The fifth walked out of the bunker twenty years ago and is, according to your last 
    readings, still alive. You are looking for Corporal Perez.
  3:
    text: Prison Detail. You guarded a pre-war military brig. You were never given the order to 
      release the prisoners. They are almost certainly dead now, but you carry the Key Ring (petty) 
      still — and the last time you checked, something inside the cells was still knocking.
    data:
      gear:
      - {name: Key Ring, size: petty}
  4:
    text: Zone Sweep. You spent one hundred and ninety years sweeping the same irradiated valley for
      hostiles. There are none now. There never were. Take a Map (petty) of the valley with every 
      square inch marked CLEAR. In that valley, the party can never be surprised or lost.
    data:
      gear:
      - {name: Map, size: petty}
  5:
    text: Research Escort. You were assigned to a pre-war scientist who was working on something 
      classified. She gave you a Sealed Tape (petty) before she died. You have never been authorized
      to play it.
    data:
      gear:
      - {name: Sealed Tape, size: petty}
  6: 'The Last Order. Your superior gave you a rolling command that has never been rescinded: "Engage
    all non-friendlies." Until this party, you had never met a friendly. Your threat logic now files them
    under protect at all costs: once per session, you can take an attack meant for one of them.'
---
table: mister-gutsy-2
title: What military hardware did they give you?
dice: d6
source: backgrounds/mister-gutsy
entries:
  1: 'Targeting Assist: Your first ranged attack in any combat is Enhanced.'
  2:
    text: 'Rocket Pod: A built-in single-shot rocket. d12 blast, 1 use. Reload: a full day in a pre-war
      armory.'
    data:
      gear:
      - name: Rocket Pod
        damage: d12
        qualities: [blast, built-in]
        uses: 1
        recharge: a full day in a pre-war armory
  3: 'Inspirational Vocals: Once per combat, you may shout a pre-war military slogan as an action. All
    allies who can hear you are no longer Panicked.'
  4: 'Shield Generator: A brief personal force field. Once per session, declare one incoming attack negated
    entirely — the shield flares and takes the hit before it reaches your chassis.'
  5: 'Combat Overclock: A built-in overclock routine. Once per scene, take an extra turn immediately after
    your own; your next turn is then spent locked in a diagnostic loop (no action).'
  6: 'Court-Martial Protocol: You can, upon witnessing a war crime, authorize its prosecution on the spot.
    Once per scene, a humanoid NPC who has just done something obviously atrocious must make a WIL save
    or freeze, unable to resist arrest or execution for one round.'
