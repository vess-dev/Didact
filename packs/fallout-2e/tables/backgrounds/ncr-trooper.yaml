# NCR Trooper (backgrounds/ncr-trooper): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: ncr-trooper-1
title: What did the Republic ask of you?
dice: d6
source: backgrounds/ncr-trooper
entries:
  1: "Checkpoint Duty. A year at a tariff checkpoint on a caravan road. Boring, then briefly horrific.
    You remember the names of every caravaneer you ever waved through, and they remember you: a caravaneer's
    first Reaction to you is one step better."
  2:
    text: 'Border War. You were on the line at Hoover Dam when the Legion came across the Colorado. You
      lost half your squad in an afternoon. Take the Worn Photograph (petty) of your unit. Nothing the
      Legion does to frighten you works anymore: you automatically pass saves against fear the Legion
      causes — the crosses, the war cries, the heads on spikes.'
    data:
      gear:
      - {name: Worn Photograph, size: petty}
  3: 'The Occupation. You were stationed in a town the Republic had taken from a local power — Primm,
    Westside, a Khan camp. The town did not love you. You did not love being there. You walked out the
    day your tour ended, and you learned how an occupation works: in any garrisoned town, you can find
    where the soldiers keep their stores, and which locals quietly work with them.'
  4:
    text: The Escort. You escorted a quartermaster caravan across three regions. You were good at 
      it. Take a Commendation Medal (petty, 20 caps if pawned) and a network of supply-line 
      contacts.
    data:
      gear:
      - {name: Commendation Medal, size: petty, note: 20 caps if pawned}
  5:
    text: The Mutiny. Your sergeant ordered you to do something you refused to do. The mutiny was 
      small and quiet. He was quietly removed. You were quietly transferred. You carry a Redacted 
      Transfer Paper (petty).
    data:
      gear:
      - {name: Redacted Transfer Paper, size: petty}
  6:
    text: 'The Discharge. You served honorably and out-processed at the end of your term. You have your
      papers, a deep ambivalence about the Republic you served, and a small pension: once per session,
      at any NCR post, draw 2d6 × 5 caps of back pay.'
    data:
      gear:
      - {name: Discharge Papers, note: honorable}
---
table: ncr-trooper-2
title: What does the Republic's training still give you?
dice: d6
source: backgrounds/ncr-trooper
entries:
  1: 'Drill Discipline: When a fight finds you on watch, on the march, or in formation, you automatically
    pass the first-round DEX save to act.'
  2: 'Unit Cohesion: While you are in line of sight of any ally, neither of you can become Panicked by
    a lone enemy — only by a threat large enough to break a whole squad.'
  3:
    text: 'Battlefield Triage: Once per session, spend one turn working on a wounded ally: they automatically
      pass their next Critical Damage save. Start with 2 Stimpaks.'
    data:
      gear:
      - {name: Stimpak, size: petty, uses: 1, count: 2}
  4: "Quartermaster's Eye: You know the going price of any common military item in any Republic-aligned
    settlement, and merchants cannot cheat you on gear. Once per session, at an NCR post, you can talk
    a quartermaster out of one piece of common military kit."
  5: 'Combat Pay: You have friends in other uniforms. In any Republic-aligned settlement you may find
    an off-duty trooper who will share a drink, a meal, and one useful rumor.'
  6: "The Oath: You swore to defend civilians under Republic protection. Once per session, when you attack
    to protect a non-combatant standing within arm's reach of you, that attack is Enhanced."
