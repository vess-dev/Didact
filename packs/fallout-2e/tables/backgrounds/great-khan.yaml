# Great Khan (backgrounds/great-khan): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: great-khan-1
title: What happened to your clan?
dice: d6
source: backgrounds/great-khan
entries:
  1: The Last Camp. The clan is still alive. You left on good terms, and given time you can return 
    home. Your elders will shelter any member of the party you vouch for.
  2:
    text: The Massacre. You were at Bitter Springs, or somewhere just like it — the night the 
      soldiers came into the camp and didn't stop shooting. You are one of a handful of survivors. 
      Take the NCR Dog Tags (petty) of the one trooper who lowered his rifle and let you run. You 
      know who gave the order. You are taking your time.
    data:
      gear:
      - {name: NCR Dog Tags, size: petty}
  3:
    text: The Split. The clan fractured over a fight between two elders. Half went east, half went 
      west. You refused to pick a side and walked out alone — carrying the clan's Recipe Book 
      (petty), the chem formulas both halves now want back. Both halves consider you a traitor.
    data:
      gear:
      - {name: Recipe Book, size: petty}
  4:
    text: The Deal. Your clan made a deal with a bigger power — Caesar's Legion, the Brotherhood, a 
      large settlement — and you do not trust it. You left before the terms came due. Take the Token
      of the Deal (petty) — a Legion denarius, a Brotherhood holotag, a settlement's seal. Its 
      bearer is let through that power's lines once.
    data:
      gear:
      - {name: Token of the Deal, size: petty}
  5:
    text: The Kid. You were the youngest surviving child of the chief. The elders tried to make you 
      the new chief. You did not want it. You ran with your father's Chief's Knife (d6), and whoever
      carries it may speak for the clan. They may still come looking for you — and for it.
    data:
      gear:
      - {name: Chief's Knife, damage: d6}
  6: The Oath. You are on a clan oath — a task given to you by the elders that you must complete 
    before you are allowed back. The task is specific, dangerous, and probably fatal. You know what 
    it is. The Overseer will help set the stakes.
---
table: great-khan-2
title: What did the clan teach you that no settlement kid learns?
dice: d6
source: backgrounds/great-khan
entries:
  1: "Chem Cook: Your clan's recipes are the ones the Red Rock drug lab is famous for. Given a Downtime
    Action and reagents, you cook 1d4 doses of any common chem. Your batches are clean: the first addiction
    save each session against a chem you cooked yourself is an automatic pass."
  2: 'The Long Hunt: You can track a target across the badlands for days. Once you have a trail less than
    a week cold, you cannot lose it.'
  3:
    text: 'Brew Master: You start with 3 bottles of clan moonshine (petty each). Each heals 1d4 STR, and
      for one scene afterward you cannot be Panicked — though like any drink, it adds 1 Fatigue the next
      morning.'
    data:
      gear:
      - name: Clan moonshine
        size: petty
        uses: 1
        count: 3
        note: each heals 1d4 STR, and for a scene you cannot be Panicked; like any drink, a Fatigue 
          the next morning
  4: 'Clan Fighter: The elders blessed your machete before you left. Your first melee attack with it each
    combat is Enhanced.'
  5: 'Dead Reckoning: You cannot become lost in open wastes — desert, badlands, salt flats. Under roof,
    under canopy, or in a ruined city, you read the ground like anybody else. You always know which way
    is home, even when home is gone.'
  6: "The Rites: You know the clan's funeral rite — a slow, hands-on washing and dressing of the body
    that doubles as a forensic inspection no settlement doctor would bother with. Performed over a fresh
    corpse, it lets you ask the Overseer one specific question about how the person died (what killed
    them, from which direction, how long ago) and receive an honest answer drawn from what the body plainly
    shows. Outside your clan, almost no one alive still performs it."
