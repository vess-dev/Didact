table: prewar-celebrity-2
title: What survived the radiation that the body could not?
dice: d6
source: backgrounds/prewar-celebrity
entries:
  1: 'The Stage Voice: You can project your voice to be heard clearly across a large room. Once per scene,
    you may speak so every living thing in a room must pass a WIL save to look at anyone but you for the
    next minute.'
  2: 'The Charisma: Your Reaction rolls on first meeting with any NPC old enough to remember the Before
    shift two steps better. Younger NPCs have no idea who you are and react normally.'
  3: 'The Craft: You were trained in one specific performance art (singing, acting, speech-making, instrument)
    that has not been practiced in the wasteland for two centuries. Once per session, you may perform
    it publicly and the Overseer will grant you one specific social advantage.'
  4: 'The Fans: You have a single devoted ghoul fan still somewhere in the wasteland. Your Overseer will
    tell you who, where, and what they would do for you.'
  5: 'The Persona: You have so thoroughly inhabited your pre-war persona that you may, once per session,
    declare that the current situation resembles one from a story you were in. The Overseer must give
    you one honest piece of useful advice "as the script would have it."'
  6: 'The Autograph: Your signature is worth caps to collectors. A signed item you hand to an NPC becomes
    a 50-cap treasure in their eyes. You may do this once per session, and never twice for the same NPC.
    Overseer arbitrates what they will part with in exchange.'
