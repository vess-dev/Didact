# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: prewar-celebrity-1
title: What did you do before the war?
dice: d6
source: backgrounds/prewar-celebrity
entries:
  1: The Radio Voice. You were a pre-war newsreader, broadcast personality, or storyteller. Ghouls 
    who listened to your show every night for years are still out there. Any ghoul who recognizes 
    your voice offers you shelter.
  2: The Singer. You sang in one of the great pre-war clubs — a lounge on the Vegas Strip, a Boston 
    supper club. Your records still turn up in jukeboxes and on found radios. Settlements that have 
    heard them will give you a free meal for a song.
  3: The Actor. You were on the big screen. There is still, somewhere, a pre-war movie poster with 
    your face on it. Once per session, you may walk into a settlement and an NPC will tell you they 
    remember your work. The NPC's Reaction roll shifts one step better.
  4: The Serial Hero. You played a pulp hero in a long-running radio serial, the way the Silver 
    Shroud ruled the Boston airwaves. You still carry the costume. People remember the catchphrase. 
    Once per scene, when you speak the catchphrase before swinging, your next attack is Enhanced.
  5: "The Politician. You were not an entertainer in the strict sense. You were a pre-war elected official
    whose face was on enough television to count. You were promised a vault seat. You did not get it.
    You are out here because of someone else's decision — but you still know how power works: once per
    session, in any settlement with a leader, you can get an audience with them the same day."
  6: 'The Punchline. You were the face of a pre-war advertising jingle — pick the product: Nuka-Cola,
    Sugar Bombs, Fancy Lads Snack Cakes, Abraxo. Anybody who remembers the jingle remembers you, and you
    still hum it when you are thinking. Your face is still on the crates: once per session, in any ruin
    that once sold the product, you find a sealed case of it (1d4 uses).'
