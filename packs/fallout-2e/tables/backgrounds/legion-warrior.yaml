# Legion Warrior (backgrounds/legion-warrior): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: legion-warrior-1
title: Why are you out here, apart from your camp?
dice: d6
source: backgrounds/legion-warrior
entries:
  1:
    text: The Mission. You were sent on a mission, alone, by a superior who did not expect you to 
      return. Take a Sealed Cylinder (petty) with orders you have not yet been told to open. Open it
      at the right time and the Overseer decides what it says.
    data:
      gear:
      - {name: Sealed Cylinder, size: petty}
  2:
    text: The Crucifixion. Your cohort would have crucified you for a failure that was not yours. 
      You ran. Take the Iron Nail (petty) you pulled from the cross as the guard turned away. Legion
      scouts are looking for you.
    data:
      gear:
      - {name: Iron Nail, size: petty}
  3: 'The Slave. You were raised in the Legion, but a slave in your unit showed you kindness, and you
    saw something in the act that your doctrine could not account for. You killed a centurion to save
    them. The story has spread along the slave lines: any Legion slave who learns your name will hide
    you, feed you, or carry a message for you if they can. You carry a name and a face in your memory,
    and neither of you knows the other is still alive.'
  4:
    text: 'The Duel. You lost a duel you were supposed to win. The law said you were to die for your failure.
      The man who spared you has not told you why, and you suspect he will eventually ask for payment.
      Take his Marked Coin (petty): any Legionary who sees it knows you belong to him, and must bring
      you before an officer alive rather than kill you where you stand.'
    data:
      gear:
      - {name: Marked Coin, size: petty}
  5: The Spy. You are a Frumentarius, a Legion intelligence officer in plain clothes, on a long 
    infiltration. The party does not know. The Overseer does. Your cover is your backstory.
  6: 'The Doubt. You did not run. You did not fail. You were not cast out. You walked out one morning,
    set down your standard, and did not come back. You do not entirely understand your own reasons, but
    you understand the men you left: once per session, ask the Overseer what a Legion character truly
    intends, and get an honest answer.'
---
table: legion-warrior-2
title: What did the Legion train into you that the wasteland cannot?
dice: d6
source: backgrounds/legion-warrior
entries:
  1: 'The Cold Draw: You draw the gladius before any combat you have time to prepare for. Your first melee
    attack in any such combat is Enhanced.'
  2: 'Unit Discipline: While you have a weapon in hand, you cannot become Panicked. Disarmed or empty-handed,
    the drill breaks, and fear finds you like anyone else.'
  3: 'The Long March: You can march longer than any wastelander. Each day, you may travel one full extra
    watch before becoming Deprived from skipped rest.'
  4: 'The Cestus: You were trained to the gladius, the ballistic fist, and the cestus. Once per combat,
    re-roll one melee damage die you have just rolled and keep the higher result.'
  5: 'The Dead Tongue: You read and speak the dead language the Legion uses for its records, and the pre-war
    learning built from it — medical labels, legal seals, scientific names, old mottoes. Texts that stump
    other wastelanders are plain to you.'
  6:
    text: 'The Field Surgeon: You know how to keep a man alive on the battlefield. You start with a Legion
      Field Pouch — leather straps, boiled linen, and a salt poultice. Two full turns of work on one ally
      restores 1d6 STR and stops a Bleeding Out Scar from killing them. The pouch holds 3 uses.'
    data:
      gear:
      - name: Legion Field Pouch
        uses: 3
        note: two full turns of work on one ally restores 1d6 STR and stops a Bleeding Out Scar from
          killing them
