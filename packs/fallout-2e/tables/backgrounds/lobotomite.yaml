table: lobotomite-1
title: What was left of you after the procedure?
dice: d6
source: backgrounds/lobotomite
entries:
  1: "Your Body, Your Mind. The procedure did not take. You retained full cognition despite the hole.
    The scientists called you a failure, and they want their failure back: Big MT's robots and security
    systems treat you as an escaped specimen, and would rather return you to the lab than kill you."
  2: 'Most of Your Mind. You have lost specific memories in blocks — the name of your mother, the shape
    of your childhood home, the last thing anyone said to you before the procedure. Everything else is
    intact. Once per session, a lost memory surfaces just when you need it: you know one true thing about
    a place, a person, or an object from your life before.'
  3: "Your Skills. Your body is fine. Your mind is fine. But specific knowledge has been lifted from you
    and replaced with knowledge you do not remember learning. Pick a trade you never studied — a surgeon's,
    a pilot's, a safecracker's: once per session, your borrowed hands do it without a save."
  4: Your Pain Response. The scientists cut something that used to report pain, and it did not grow 
    back. You ignore the first onset of Critical Damage each session, but take 1 Fatigue when it 
    would have hit.
  5: Your Voice. Your voice comes out in someone else's tone. Ghouls old enough to remember pre-war 
    radio recognize it as the voice of a specific pre-war announcer. This was not done to you on 
    purpose. Once per session, when you speak to a ghoul old enough to remember pre-war radio, your 
    first Reaction roll with them shifts one step better.
  6: The Implant. They put something in before they took the old thing out. You do not know what. It
    speaks to you in your sleep, in a voice you trust, and once per session it wakes you before 
    danger reaches your camp. It has not yet asked for anything in return.
---
table: lobotomite-2
title: What can the facility's gifts still do?
dice: d6
source: backgrounds/lobotomite
entries:
  1: 'The Plate: The surgeons sealed your skull with a plate that is, somehow, harder than bone. Whenever
    you would take the Concussed or Scrambled Scar, take Close Shave instead — the plate caught it.'
  2:
    text: 'Chem Immunity: The pre-war researchers dosed you with so much of their own cocktail that ordinary
      wasteland chems no longer affect you at all. You cannot become addicted, and sedatives, chem darts,
      and knockout gas do nothing to you. You cannot benefit from most chems either: Stimpaks and RadAway
      still work on you; the Overseer decides any other exceptions.'
    data:
      immune: [chems, addiction]
  3: 'The Ghost Hand: Your right hand sometimes moves without your permission. It is often faster than
    the rest of you. Once per combat, you may make one extra unarmed or pistol attack with that hand —
    but roll the Die of Fate first: on a 1 or 2, it picks the target, not you.'
  4: 'Transcranial Calm: You cannot become Panicked. You also cannot voluntarily flee or retreat from
    a fight once you have committed to it — the implant will not let you break off until a person whose
    voice you trust tells you to stop.'
  5: 'Facility Access: You know the layout and the passcodes of the specific pre-war research facility
    that held you. You also know that it is still there, and that the scientists who did the procedure
    are, somehow, also still there.'
  6: "The Brain's Voice: Somewhere in a jar, your old brain is still thinking, and it has opinions. Once
    per session, it cuts in on a frequency only you can hear and says something accurate and useful —
    usually rude. You do not know how it knows."
