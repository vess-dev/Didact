table: caravaneer-1
title: What keeps the caravan rolling even when it shouldn't?
dice: d6
source: backgrounds/caravaneer
entries:
  1: The Contacts. You know a merchant in every major settlement within a month's walk. In any such 
    town, you can find a buyer for anything unusual (though the Overseer sets the price) and a place
    to sleep.
  2:
    text: The Old Wagon. A pre-war utility trailer repaired three times over. Add +4 slots as long 
      as your brahmin lives. Anyone who tries to cut the harness in combat makes a DEX save or takes
      1d6 STR from the brahmin's kick.
    data: {vehicle: old-wagon}
  3: The Road Code. A secret merchant sign-language your family taught you. Other caravaneers 
    recognize you and will not cross you lightly. Reactions from merchants shift one step better.
  4:
    text: The Guard. A hired gun named Ruan travels with you — 5 HP, 1 Armor, 12 STR, 12 DEX, 9 WIL,
      rifle (d8). He's paid through this season. After that, see what you've got.
    data: {hireling: ruan}
  5:
    text: The Grudge. A rival outfit poisoned your brahmin last year and bought up your routes 
      cheap. Take the Rival's Ledger Page (petty) you stole in return — their routes, their stops, 
      the bribes they pay — and a list of five names you want to see in the dirt.
    data:
      gear:
      - {name: Rival's Ledger Page, size: petty}
  6:
    text: The Loaner. A settlement paid you in advance for a run you haven't finished. Take 60 caps 
      and the knowledge that they expect you in three weeks.
    data:
      add: {caps: 60}
---
table: caravaneer-2
title: What will you not leave camp without?
dice: d6
source: backgrounds/caravaneer
entries:
  1:
    text: 'The Kettle: A cast-iron kettle. Boils dirty water clean in ten minutes. Rations prepared with
      it count for one extra use.'
    data:
      gear:
      - {name: Kettle, note: cast-iron}
  2:
    text: 'The Drum & Flag: Caravan colors. Raiders who see them twice in a year learn to leave you alone.
      Reactions from organized groups shift one step better.'
    data:
      gear:
      - {name: Drum & Flag, note: caravan colors}
  3:
    text: "The Trail Ledger: A worn book listing every bridge, ferry, washout, and toll you've ever crossed.
      You cannot get lost on any road you've traveled before."
    data:
      gear:
      - name: Trail Ledger
        note: a worn book of every bridge, ferry, washout and toll you've crossed
  4:
    text: "The Trouble Dog: An old hound named Barker. 2 HP, 8 STR, 12 DEX, 6 WIL, bite (d4). When something
      is wrong, she knows first: while she's with you, the party can't be surprised in camp."
    data: {companion: barker}
  5:
    text: "The Lockbox: A battered strongbox with a pre-war combination lock, strapped to your pack brahmin.
      It holds up to 6 slots of the brahmin's goods and cannot be opened without the combination (which
      you know)."
    data:
      gear:
      - name: Lockbox
        note: "strapped to your pack brahmin (move it there): holds up to 6 slots of the brahmin's goods
          behind a pre-war combination lock"
  6:
    text: "The Map: A leather-cased map you've drawn yourself over ten years. Every point of interest
      within a week's travel of any major road. Once per session, you may reveal a useful fact about the
      area."
    data:
      gear:
      - {name: Map, note: 'leather-cased, drawn yourself over ten years'}
