table: tinker-1
title: What have you built that the Wastes remember?
dice: d6
source: backgrounds/tinker
entries:
  1: A Water Purifier. You built one for a settlement. It still works. The settlement will always 
    give you shelter and a free meal. They also still owe you 40 caps.
  2:
    text: A Turret. You got it working and then ran. Take the Targeting Module (petty) that was its 
      brain. It still chirps when pointed at anything living and warm within fifty feet — through a 
      wall, a door, or a pile of rubble.
    data:
      gear:
      - {name: Targeting Module, size: petty}
  3:
    text: A Power Armor Leg. You built a stranger a new leg out of power-armor hydraulics and took 
      his Power Fist (d10, bulky, fusion cell) as payment. The leg has started to fail. He wants it 
      fixed — or the fist back.
    data:
      gear:
      - {name: Power Fist, damage: d10, size: bulky, note: fusion cell}
  4:
    text: A Radio Array. You caught a signal on a frequency the ruin people call dead. Take a 
      Decoded Scrap of Paper (petty) with a place and a time. You don't know what answers.
    data:
      gear:
      - {name: Decoded Scrap of Paper, size: petty}
  5:
    text: "A Grenade Design. Your pipe bombs are better than anyone else's. You start with 3 Improvised
      Grenades (d8, blast, 1 use each) and can build more at a workbench: a Downtime Action and 1 Scrap
      each."
    data:
      gear:
      - name: Improvised Grenade
        damage: d8
        qualities: [blast]
        uses: 3
        note: three grenades
  6:
    text: A Toy. You built a little robot out of a toy chassis and a Protectron's voice box to 
      comfort a dying friend's child. You kept it after. Take Pip — 2 HP, 4 STR, 12 DEX, 6 WIL, tiny
      fists (d4). It follows simple commands and is unsettlingly polite.
    data: {companion: pip}
