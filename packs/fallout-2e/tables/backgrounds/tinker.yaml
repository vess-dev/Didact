table: tinker-2
title: What is your signature workbench rule?
dice: d6
source: backgrounds/tinker
entries:
  1: "Two Out of Three: Given a Downtime Action and an appropriate junk source, you can repair three broken
    items at once but one comes back wrong (Overseer's choice)."
  2: 'Gimcrack: Once per session, you can declare that an ordinary item in your pack has been modified
    in some small useful way (a flashlight that also ignites tinder, a canteen that also measures Rads).
    The Overseer says how far the tweak goes.'
  3: 'Scrapper: When you break down gear, you recover its full Scrap cost instead of half, and no ruin
    you search is ever so picked-over that it yields less than 1 Scrap.'
  4: 'Overclock: Once per combat, declare that a ranged weapon is Enhanced for this attack. Afterwards,
    the weapon is broken until a Downtime Action fixes it.'
  5: "Robotics Expert: You know where every robot hides its off switch. Once per session, get your hands
    on a robot for a full round (a DEX save if it's fighting you) and it shuts down — or, if you choose,
    follows your orders for the rest of the scene. A one-of-a-kind or building-sized machine gets a WIL
    save to resist."
  6: 'Name the Machine: You can name a pre-war device you have never seen. Once per session, after the
    Overseer describes a piece of pre-war tech, you may say what it is and roughly how to make it work.
    The Overseer confirms or adjusts.'
