# Raider (backgrounds/raider): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: raider-1
title: How did it fall apart?
dice: d6
source: backgrounds/raider
entries:
  1:
    text: The Boss. You were his favorite until you weren't. You took his Chrome-Plated 10mm (d8) on
      your way out, and every raider in the region knows whose it is. He is looking for you, and he 
      is not alone.
    data:
      gear:
      - {name: Chrome-Plated 10mm, damage: d8}
  2:
    text: "The Job. A strike on a Crimson Caravan brahmin train. You were supposed to kill them all. You
      didn't: you hid a small girl under your coat until it was over, and let her run. You also kept the
      caravan master's Ledger (petty) — names, routes, and debts someone would pay well to see. The girl
      is the only reason you still think of yourself as a person."
    data:
      gear:
      - {name: Ledger, size: petty}
  3:
    text: The Feud. Two of your crew loved the same woman. When it came to knives, you backed the 
      one who lost. Take the dead man's Wedding Ring (petty, 30 caps), which you can't bring 
      yourself to sell, and a grudge that runs both ways — the winner runs the crew now.
    data:
      gear:
      - {name: Wedding Ring, size: petty, note: 30 caps}
  4:
    text: The Score. The job paid out — but the payout was hot, wrong, or worse. Take a Lead-Lined 
      Box (bulky) and whatever is inside, which the Overseer will tell you about later.
    data:
      gear:
      - {name: Lead-Lined Box, size: bulky}
  5:
    text: The Bomb. Your crew was going to blow the gate on a Minutemen settlement. You stole the 
      explosives and ran. Take Two Sticks of Dynamite (d10, blast, 1 use each) and a warrant from 
      your old crew.
    data:
      gear:
      - name: Dynamite
        damage: d10
        qualities: [blast]
        uses: 2
        note: two sticks
  6:
    text: The Witness. You saw your crew kill someone who mattered — the only chem cook for fifty 
      miles, a Brotherhood scribe, a rival boss's sister; pick one, or let the Overseer. Take the 
      Bloodied Kerchief (petty) you pulled off the body, and the name of the person who gave the 
      order.
    data:
      gear:
      - {name: Bloodied Kerchief, size: petty}
---
table: raider-2
title: What makes you still dangerous?
dice: d6
source: backgrounds/raider
entries:
  1: "The Growl: Once per combat, you can shout something so brutal that a single opponent who can hear
    and understand you makes a WIL save or loses their next turn. Robots, ferals, and beasts don't care."
  2:
    text: 'Trophy Belt: Strung with ears, teeth, or tags. Reaction rolls from raider gangs who see it
      shift one step better.'
    data:
      gear:
      - {name: Trophy Belt, note: 'strung with ears, teeth, or tags'}
  3:
    text: "Pipe Bombs: Start with 2 Pipe Bombs (d6, blast, 1 use each). You can make more anywhere, no
      workbench needed: 1 Scrap and an hour's work each."
    data:
      gear:
      - name: Pipe bomb
        damage: d6
        qualities: [blast]
        uses: 2
        note: two pipe bombs
  4: 'Old Injury: You took a bullet near the spine. It never left. You cannot run more than a few minutes
    — but you have a tolerance for pain. You automatically pass your first Critical Damage save each session.'
  5:
    text: 'Chem Courage: You start with 3 doses of Jet. Taking a dose gives you an extra action this round.
      Addictive, inhaled.'
    data:
      gear:
      - name: Jet
        size: petty
        uses: 3
        qualities: [addictive]
  6: 'The Crew Remembers: Once per session you can name a settlement or ruin and say, "My old crew knows
    this place." The Overseer tells you one true thing about it.'
