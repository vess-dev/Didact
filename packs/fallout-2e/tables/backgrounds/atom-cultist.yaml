# Atom Cultist (backgrounds/atom-cultist): the background's two d6 tables.
# Generated by Didact Work/Temp/fallout-2e/fo_backgrounds.py: edit the script, not this file.
table: atom-cultist-1
title: What drew you to Atom?
dice: d6
source: backgrounds/atom-cultist
entries:
  1: "The Crater. You grew up on the rim of the Crater of Atom in the Glowing Sea and heard the voice
    in it every night of your childhood. You knew the voice before you knew your own mother's. You know
    the Glowing Sea's paths the way other children know their street: travelling with you, the party never
    gets lost there, and you always find the cold spots to rest."
  2:
    text: The Healing. You were dying. You walked into a hot zone expecting to die faster. You 
      walked out healed. Take a Vial of Water (petty) from the pool where it happened. 1 use; clears
      all Rads when drunk.
    data:
      gear:
      - {name: Vial of Water, size: petty, uses: 1, note: clears all Rads when drunk}
  3: 'The Conversion. You were a raider, or a merchant, or a nothing. A glowing ghoul spoke to you in
    a ruined church and said exactly three words that changed your life. You have told no one what the
    words were. Once, you may say them to someone else: they make a WIL save or stop whatever they are
    doing and hear you out.'
  4:
    text: 'The Sacrament. You were given a holy chem by your elders and walked in the dark for three days.
      What you saw there you tell only other cultists, and only when asked. You kept the last Dose of
      the Sacrament (1 use): drink it and ask the Overseer one question about what is to come. The answer
      arrives as a vision, and it costs you 2 Fatigue.'
    data:
      gear:
      - name: Dose of the Sacrament
        size: petty
        uses: 1
        note: 'drink it and ask the Overseer one question about what is to come: the answer comes as a
          vision, and costs 2 Fatigue'
  5:
    text: The Orphan. You were a child abandoned at the steps of an Atom shrine. The cultists raised
      you. They are the only family you have. Take a Rad-Hammered Pendant (petty) with your name 
      scratched into it by a woman you think of as your mother; any Children of Atom shrine that 
      sees it takes you in as family.
    data:
      gear:
      - {name: Rad-Hammered Pendant, size: petty}
  6:
    text: 'The Loss. Your family was killed by raiders. Only the radiation of the place where they died
      has spoken to you since. You found comfort in the dose. You stayed in the dose. You are still in
      it: you will never let your last Rad be cleared, and it fills a slot for good. While you carry it,
      fear cannot reach you — you cannot be Panicked.'
    data:
      add: {rads: 1}
---
table: atom-cultist-2
title: What does Atom's blessing give you?
dice: d6
source: backgrounds/atom-cultist
entries:
  1: 'Radiant Flesh: You ignore the first Rad you would take each day from environmental exposure. When
    a direct radiation attack hits you, take no Rads from it — and the first time each day, clear 1 Rad
    instead.'
  2: 'The Rad Gaze: Once per scene, you may stare at a target and force a WIL save. On a fail, the target
    loses their next action in religious terror. Works once per target.'
  3: 'Glowing Aura: You shed a faint green light in total darkness. Feral ghouls and glowing ones will
    not attack you first.'
  4:
    text: "The Sacred Chems: You carry 3 doses of Atom's Breath — a pre-war radiation stimulant. Each
      dose: heal to full STR and take 2 Rads."
    data:
      gear:
      - name: Atom's Breath
        size: petty
        uses: 3
        note: 'a pre-war radiation stimulant: each dose heals to full STR and gives 2 Rads'
  5: 'Holy Zone: You can identify any hot zone by sense alone within a mile. You know where the boundary
    is, how hot the center burns, and whether the glow came from a bomb, a reactor, or a weapon — and
    so what it has made of the creatures living there.'
  6: "Martyr's Tongue: When speaking of Atom to another human being, your words carry unnatural weight.
    Once per session you may shift a Hostile NPC to Curious on the Reaction ladder for the rest of the
    scene, provided they have not yet drawn a weapon."
