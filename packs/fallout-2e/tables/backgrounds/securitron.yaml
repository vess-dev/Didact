table: securitron-2
title: What makes you good at the work?
dice: d6
source: backgrounds/securitron
entries:
  1: 'Wheel Speed: On open paved ground, you can cross ground faster than a running human, and long-distance
    travel on roads takes half the watches. On rough ground, you are slow.'
  2: 'Face Module: Your cartoon face can display sixty preset expressions. You are very hard to read in
    a negotiation — NPCs cannot tell when you are lying unless they have a specific reason to suspect
    you.'
  3: 'Gamble Mode: Once per session, after you fail a save, you may declare the dice were lying and treat
    the save as a success — but the Overseer adds a fresh complication from the fiction in exchange.'
  4: 'Police Broadcasts: You can listen to any active radio frequency within a few miles. In any new area
    you may ask, "What chatter am I picking up?" and the Overseer tells you one relevant thing.'
  5: 'Extra Arms Package: A pre-war upgrade. Four articulated limbs instead of two. You may treat one
    bulky item you are carrying as if it took only a single slot.'
  6: 'Self-Diagnostic: Once per session, during a short rest (never mid-combat), run a self-repair cycle
    to restore 2d6 STR. You are helpless while doing it.'
