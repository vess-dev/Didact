table: securitron-1
title: What did Mr. H—, your pre-war employer, have you do?
dice: d6
source: backgrounds/securitron
entries:
  1: Door Duty. You greeted guests at the front of a pre-war casino for decades. Your voice module 
    is still calibrated for hospitality, and Reaction rolls in first encounters shift one step 
    better.
  2:
    text: Internal Affairs. You were a secret police unit inside your employer's organization. You 
      know every blackmail file he held on every lieutenant. Take A Small Data Drive (petty) you are
      not sure you should destroy.
    data:
      gear:
      - {name: Small Data Drive, size: petty}
  3: Muscle. You broke arms for a living. Your heavy combat chassis is reinforced for brute work — 
    you count as one size larger when shoving, hauling, or forcing a door. Once per scene, a single 
    intimidating threat from you forces one hostile person who can hear and understand you to make a
    WIL save or lose their next turn.
  4: Courier. You delivered things between your employer's properties. You know every shortcut and 
    backroom in one specific pre-war city (Overseer picks).
  5: 'The Fixer. You resolved problems without violence when possible. You have a built-in directive to
    negotiate before shooting: in the first round of any fight, you must spend your action offering terms,
    not attacking. The offer carries weight — the first time each session you make it, the other side
    stops long enough to hear you out.'
  6: "The Upgrade. You received half of a firmware package — the Mark II upgrade your employer's platinum
    chip was meant to deliver — before you fled. The unfinished code runs in the background of your mind,
    and you do not know what the rest of it would do. Once per session, the Overseer may declare that
    the upgrade activates and does something: helps you, speaks through you, or demands something."
