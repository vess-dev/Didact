table: sentry-bot-1
title: What held you together for two hundred years?
dice: d6
source: backgrounds/sentry-bot
entries:
  1: The Directive. Your superior officer's final transmission ordered you to hold a specific map 
    coordinate. You held it. You are only on the move now because the coordinate was overrun by 
    something you could not defeat, and you are looking for backup.
  2: The Child. A family took shelter near your checkpoint during the war. You protected their 
    descendants for six generations. The last one left for the nearest settlement thirty years ago, 
    and you still check in. That settlement knows you as the family's guardian — it is the one place
    whose walls you are welcome inside.
  3: The Loop. You have been running a single diagnostic loop for nearly two centuries. It is only 
    now starting to conclude, and it is telling you something you do not want to hear. You will not 
    say what.
  4:
    text: The Archive. Your onboard storage holds a pre-war military archive. Brotherhood patrols 
      would kill for it. You have not yet decided whether to give it to them. Take a Data Core 
      (bulky).
    data:
      gear:
      - {name: Data Core, size: bulky}
  5: The Hand. A wasteland mechanic named Daro spent three years rebuilding you out of scrap. He was
    paid in salvage. He is still alive, you owe him, and he knows it. If you can reach his workshop,
    he repairs you fully and for free — once per session.
  6: The Ghost. One of your original squad still whispers over your internal comm every night at 
    0200 hours. You have never been able to locate the source.
---
table: sentry-bot-2
title: What pre-war feature are you proudest of?
dice: d6
source: backgrounds/sentry-bot
entries:
  1: 'Ablative Plating: The first time each session you would make a Critical Damage save, the save is
    not required.'
  2: 'Mass Displacement: You cannot be knocked down, pushed, grappled, or moved against your will by anything
    smaller than a deathclaw.'
  3: 'Overwhelm Protocol: Once per session, you may fire both built-in weapons in the same action.'
  4: 'Bellow Speaker: Your voice module outputs at parade-ground volume, and can be heard half a mile
    off. Once per session, you can roar a surrender order: every enemy in earshot makes a Morale save,
    and those who fail break and run.'
  5: 'Reactor Threat: When at 0 HP, you may announce a reactor meltdown. Any hostile within ten feet must
    make a WIL save or flee the area. If they do not flee, you may at any time detonate for d12 blast
    damage at the cost of your life.'
  6: 'Battle Archive: You remember the details of every fight you have ever been in. Once per session,
    when facing a tactical situation similar to a prior engagement, you may ask the Overseer "Has this
    situation been tried before?" and receive one true piece of tactical advice.'
