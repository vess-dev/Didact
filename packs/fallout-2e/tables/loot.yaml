# Loot roll tables (roll-tables/marketplace). Generated by fo_compendium.py from the game's Markdown: rerun it, don't edit by hand.
table: loot-cache
title: What's in the Cache?
dice: d100
source: roll-tables/marketplace#whats-in-the-cache-d100
entries:
  1-10: Empty. The cache has been picked clean. A pre-war wrapper, a dry leaf, a single cap.
  11-20: Caps. Roll 3d10 × 10 caps.
  21-30:
    text: Common gear. Roll once on Random Gear.
    then:
    - {table: loot-gear}
  31-40: Ammo or a small weapon. Roll once on Random Weapon or Ammo Stash.
  41-50: Rations & water. 1d6 rations and a sealed waterskin or canteen.
  51-60:
    text: Chems. Roll once on Chem Stash.
    then:
    - {table: loot-chems}
  61-70: Better weapon. Roll once on Random Weapon at the upper end.
  71-78:
    text: Armor piece. Roll once on Random Armor.
    then:
    - {table: loot-armor}
  79-85: Perk Magazine. Overseer's pick or roll on the Perk Magazine roll table.
  86-90: Holotape (lore). A recorded voice, a journal, a music tape. Overseer's pick.
  91-95: A small treasure. Roll 2d6 × 50 caps worth of pre-war jewelry, ingots, or collectibles.
  96-98: A unique or relic item. Roll on the Relic table or the Unique Weapons table.
  99: A trap — something is in the cache, but it is guarded by a pre-war tripwire (d8 STR damage on 
    a failed DEX save).
  100: {text: The jackpot. Roll twice more on this table and take both., roll: 2}
