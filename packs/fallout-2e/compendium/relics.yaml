id: stealth-boy-mk-ii
type: relic
name: Stealth Boy Mk II
category: Additional Pre-war Relics
charges: 3
recharge: Two fusion cells and a Downtime Action.
effect: Same as Stealth Boy, but lasts two scenes instead of one, and the user is still invisible 
  when taking a single attack action — they only become visible after the attack resolves, not 
  before.
source: overseers-guide/relics#stealth-boy-mk-ii
body: An improved pre-war stealth projector, recovered from a deep research vault. Sleeker than the 
  original.
---
id: neural-interface-suit
type: relic
name: Neural Interface Suit
category: Additional Pre-war Relics
charges: 3
recharge: A full day powered down.
effect: 'Spend a charge when a fight breaks out: the wearer automatically passes the first-round DEX save
  to act.'
source: overseers-guide/relics#neural-interface-suit
body: A pre-war combat-sim VR rig.
---
id: virgils-serum
type: relic
name: Virgil's Serum
category: Additional Pre-war Relics
charges: 1
effect: When injected into a super mutant (PC or NPC), the target makes a STR save. On a success, 
  the target reverts to a human-sized, human-faced version of themselves over the next three days, 
  retaining their strength and memories but losing any mechanical penalty or unique ability granted 
  by being a super mutant. On a fail, the serum has no effect and is lost.
source: overseers-guide/relics#virgils-serum
body: A small cold-chain vial of pre-war-descended retroviral therapy, smuggled out of a secret 
  laboratory. Its inventor wanted it used.
---
id: institute-relay-grenade
type: relic
name: Institute Relay Grenade
category: Additional Pre-war Relics
charges: 1
effect: Three seconds after activation, a synth courser arrives at the point of detonation (use the 
  Courser stat block from the Bestiary — it keeps its special abilities; coursing laser rifle d10). 
  The courser acts for one scene against whatever the user designates, then teleports away. The 
  Institute now knows who you are. They will not forget.
source: overseers-guide/relics#institute-relay-grenade
body: A black sphere the size of an apple, sealed with a red Institute stamp. Pull the pin and drop 
  it.
---
id: ant-queen-pheromones
type: relic
name: Ant Queen Pheromones
category: Additional Pre-war Relics
charges: 1
effect: Drunk or dabbed on, the user is treated as a dominant ant queen by any giant ant, fire ant, 
  or other mutated insect of the broader ant family. They will not attack the user or anyone the 
  user stands near, for one scene. Drinking a second dose in the same day causes the user to become 
  Deprived from the stench.
source: overseers-guide/relics#ant-queen-pheromones
body: A small glass ampoule of amber fluid smelling of old stone.
---
id: railroad-signal-lantern
type: relic
name: Railroad Signal Lantern
category: Additional Pre-war Relics
effect: When lit and hung in a public window, any Railroad agent who sees it recognizes the signal 
  and knows the holder is one of them. Acts as a free pass to any Railroad safehouse within a week's
  travel. If you are not a Railroad agent, the signal works once and then the Railroad comes looking
  to find out who has the lantern.
source: overseers-guide/relics#railroad-signal-lantern
body: A small pre-war railroad lantern with a red and green shutter. The flame is a cool pre-war 
  chemical light.
---
id: dogmeats-collar
type: relic
name: Dogmeat's Collar
category: Additional Pre-war Relics
effect: "Once per campaign. When placed on a wild dog (Overseer's approval), the dog becomes a loyal companion:
  3 HP, 10 STR, 14 DEX, 4 WIL, bite (d6). It follows simple commands and points silently at danger; Loyalty
  starts at 4 (see Companions). The collar cannot be removed without killing the dog. A dead collared
  dog can be re-collared to another dog only after the current campaign ends."
source: overseers-guide/relics#dogmeats-collar
body: A heavy leather dog collar with a tarnished pre-war tag. Whoever buckles it around a loose 
  wasteland dog's neck has, apparently, chosen that dog for life.
---
id: teddy-bear
type: relic
name: Teddy Bear
category: Additional Pre-war Relics
size: petty
effect: While carried, the user automatically passes one WIL save against Panic per session, and the
  bear is worth 100 caps to any child NPC who sees it. Handing the bear to a child permanently 
  improves your relationship with their family.
source: overseers-guide/relics#teddy-bear
body: A threadbare pre-war stuffed bear, kept somewhere safe for two centuries.
---
id: prydwen-clearance-papers
type: relic
name: Prydwen Clearance Papers
category: Additional Pre-war Relics
size: petty
effect: Once per session, the holder may present the papers at a Brotherhood installation to gain 
  access as an authorized visitor for a single day. After the first use in a given chapter, the 
  papers' authority is suspect and the Overseer may rule them expired.
source: overseers-guide/relics#prydwen-clearance-papers
body: A small folio of pre-war-formatted Brotherhood requisition forms, signed with a senior 
  scribe's seal.
---
id: mass-fusion-executive-keycard
type: relic
name: Mass Fusion Executive Keycard
category: Additional Pre-war Relics
size: petty
effect: Opens any single pre-war executive-level door in a pre-war Mass Fusion-affiliated facility 
  (roughly one in three pre-war corporate ruins). Does not open research, security, or reactor 
  doors.
source: overseers-guide/relics#mass-fusion-executive-keycard
body: A pre-war black plastic keycard stamped with a specific corporate seal, still warm to the 
  touch.
---
id: keller-family-transcripts
type: relic
name: Keller Family Transcripts
category: Additional Pre-war Relics
effect: petty individually, 1 slot for the full set. Once per session, when the party encounters a 
  pre-war mystery, the reader may ask the Overseer "What did the Keller transcripts say about this?"
  and receive one useful piece of context. The transcripts are vague, but they are rarely wrong.
source: overseers-guide/relics#keller-family-transcripts
body: A set of pre-war audio transcripts printed on thin yellow paper — five recordings of a pre-war
  family coordinating their run for a sealed National Guard bunker as the bombs fell. They appear 
  mundane until you read closely.
---
id: sugar-bombs-box-sealed
type: relic
name: Sugar Bombs Box (Sealed)
category: Additional Pre-war Relics
charges: 1
effect: Eaten, the contents restore full HP, clear 1 Rad, and the eater automatically passes their 
  next WIL save this session (sugar rush). The box itself is worth 80 caps to a collector, if you 
  don't open it.
source: overseers-guide/relics#sugar-bombs-box-sealed
body: A pristine pre-war cereal box, somehow unopened. The mascot grins.
---
id: declaration-of-independence
type: relic
name: Declaration of Independence
category: Additional Pre-war Relics
effect: Worth 1500 caps to any serious pre-war collector or historical society. Factions who care 
  about pre-war American identity (certain NCR officers, Minutemen leadership, specific Brotherhood 
  scribes) treat the holder with genuine reverence. The Enclave wants it. So do the Legion, for 
  different reasons — they'd like to burn it.
source: overseers-guide/relics#declaration-of-independence
body: A sealed glass case containing a yellowed pre-war historical document of enormous 
  significance, recovered from the ruins of the National Archives in Washington, D.C. A Rivet City 
  historian named Abraham Washington has been trying to get his hands on it for years.
---
id: fev-sample
type: relic
name: FEV Sample
category: Additional Pre-war Relics
charges: 1
effect: If injected into a willing subject, the subject makes a STR save. On success, they gain +2 
  Max STR and +2 Max HP permanently, but lose 1 Max WIL and their skin becomes grey-green. On a 
  fail, they become a feral super mutant under the Overseer's control. The canister cannot be 
  resealed once opened. Anyone who hears the party has it will come looking.
source: overseers-guide/relics#fev-sample
body: A sealed steel canister the size of a thermos, marked with pre-war biohazard tape. The 
  contents slosh.
---
id: liberty-prime-laser-module
type: relic
name: Liberty Prime Laser Module
category: Additional Pre-war Relics
charges: 3
recharge: A full fusion core drained into the module overnight.
effect: Installed on a laser weapon during Downtime, the module can be activated to make the 
  weapon's next shot deal Enhanced damage. Each activation costs 1 charge. The module cannot be 
  removed without destroying it. The weapon now hums audibly and attracts the attention of any 
  faction that recognizes the part — Brotherhood scribes in particular.
source: overseers-guide/relics#liberty-prime-laser-module
body: A palm-sized pre-war high-yield laser module salvaged from something much larger than itself. 
  Warm and slightly humming.
---
id: overseers-terminal-dump-vault-87
type: relic
name: Overseer's Terminal Dump (Vault 87)
category: Additional Pre-war Relics
size: petty
effect: Reading the dump over a Downtime Action gives the reader the location and experimental 
  premise of two other pre-war FEV sites the Overseer may place on the map. Worth 500 caps to a 
  Brotherhood scribe, who will read it twice and then burn it.
source: overseers-guide/relics#overseers-terminal-dump-vault-87
body: A thick stack of pre-war terminal printouts on Vault-Tec thermal paper, copied from Vault 87's
  central station in the hours before the FEV exposure.
---
id: soundproofed-holotape-vault-92
type: relic
name: Soundproofed Holotape (Vault 92)
category: Additional Pre-war Relics
effect: Once per session, the holder may play the tape into any terminal, radio, or PA system. Every
  listener makes a WIL save; those who fail stand down for one full scene and will not start combat.
  Does not stop combatants already swinging.
source: overseers-guide/relics#soundproofed-holotape-vault-92
body: A pre-war audio cartridge with Vault 92's broadcast signal scrubbed clean and a short 
  orchestral recording in its place. The original Overseer's handwriting is on the label.
---
id: soil-stradivarius-vault-92
type: relic
name: Soil Stradivarius (Vault 92)
category: Additional Pre-war Relics
size: bulky
effect: Worth 400 caps to any pre-war music collector. A PC who can actually play it may, once per 
  session, shift a Reaction roll with a receptive audience two steps better for one ally.
source: overseers-guide/relics#soil-stradivarius-vault-92
body: The most valuable violin in the world, left on a desk in Vault 92's recording studio when the 
  white noise took the vault's musicians. Still roughly tuned. bulky in its case.
---
id: vault-106-psychoactive-formula
type: relic
name: Vault 106 Psychoactive Formula
category: Additional Pre-war Relics
size: petty
effect: 'A Chemistry Station can convert the formula into Vault 106 Inhalant: 2d6 × 15 caps per batch
  of 1d4 doses. A dose renders the user immune to fear, charm, and mental compulsion for one scene; the
  user immediately makes an addiction STR save on first use, and on each subsequent dose in the same session
  the save counts as STR −2 more than the last.'
source: overseers-guide/relics#vault-106-psychoactive-formula
body: A paper formula card recovered from Vault 106's ceiling dispenser, written in a nervous hand 
  by the Overseer on her last lucid day.
---
id: vault-106-skyline-painting
type: relic
name: Vault 106 Skyline Painting
category: Additional Pre-war Relics
size: bulky
effect: Worth 500 caps to a collector. A PC who studies it for a full Downtime Action can work out 
  which city it is — the details are ones no Vault 106 resident could have seen without pre-war 
  satellite imagery. The Overseer may use the painting to hook a second adventure to wherever the 
  real skyline is.
source: overseers-guide/relics#vault-106-skyline-painting
body: A massive painting of a city skyline, rendered from memory in the residents' own blood on 
  bedsheets stitched together and hung the length of Vault 106's Painted Hall. bulky even rolled up;
  stretched on a frame, it takes two people to carry.
---
id: genetic-sample-cylinder-vault-108
type: relic
name: Genetic Sample Cylinder (Vault 108)
category: Additional Pre-war Relics
charges: 1
effect: Plugged into a functional auto-doc, it restores one dying PC to full HP and full STR a 
  single final time, even if the PC is suffering Critical Damage. The cylinder is empty after use 
  and cannot be resealed. A PC revived this way carries a small Cloned Scar — cosmetic, but the Gary
  clones of Vault 108 notice it on sight.
source: overseers-guide/relics#genetic-sample-cylinder-vault-108
body: A sealed steel cylinder of pre-war genetic preservative taken from Vault 108's cloning lab. 
  Heavy, cold to the touch.
---
id: the-original-garys-diary-vault-108
type: relic
name: The Original Gary's Diary (Vault 108)
category: Additional Pre-war Relics
size: petty
effect: A one-read lore holotape. Reveals the Overseer's name, his relationship to Gary, and Gary's 
  last request before he vanished. A PC who listens to the whole tape gains a free Bond to the 
  resulting story hook.
source: overseers-guide/relics#the-original-garys-diary-vault-108
body: A holotape recorded by the original Gary — the Vault 108 resident whose clones outlived him — 
  before he was cloned into oblivion. He is the only voice in the tape that is not angry.
---
id: tranquility-lane-recording-vault-112
type: relic
name: Tranquility Lane Recording (Vault 112)
category: Additional Pre-war Relics
size: petty
effect: A one-read lore holotape. The founder's voice explains the simulation gently and 
  comprehensively. A PC who listens to it automatically passes the first WIL save they make to 
  resist any future pre-war simulated environment — they know the trick now.
source: overseers-guide/relics#tranquility-lane-recording-vault-112
body: A pre-war holotape from the founder of Vault 112's simulation, played on a loop inside the 
  pods to keep the residents calm during their two-century dream.
---
id: pre-war-mutfruit-seeds-vault-101
type: relic
name: Pre-war Mutfruit Seeds (Vault 101)
category: Additional Pre-war Relics
size: petty
charges: 1
effect: Planted at a settlement with at least one Farm Plot, the seeds yield free Rations for the 
  settlement for one full season without irrigation. After one season, the plant reverts to a normal
  mutfruit crop and counts as a standard Farm Plot from then on.
note: As a relic; the plant persists.
source: overseers-guide/relics#pre-war-mutfruit-seeds-vault-101
body: A sealed packet of pre-war apple seeds from Vault 101's secret garden, still viable two 
  centuries later. Planted in wasteland soil, what grows is mutfruit.
---
id: water-chip
type: relic
name: Water Chip
category: Settlement & Infrastructure
effect: Installed in any functioning vault-level water purifier (or equivalent), the chip restores 
  the system to full operation indefinitely. As a relic in the party's possession, it is the single 
  most valuable repair component in the Wastes — any settlement with a broken water supply will 
  trade anything for it. Worth 2000 caps, but selling it means somewhere a purifier stays broken.
source: overseers-guide/relics#water-chip
body: A dull-grey pre-war circuit board, vacuum tubes and all — the kind that kept a vault's water 
  recyclers running. Without one, a vault dies of thirst in about 150 days. With one, it lives 
  forever.
---
id: geck-garden-of-eden-creation-kit
type: relic
name: G.E.C.K. (Garden of Eden Creation Kit)
category: Settlement & Infrastructure
charges: 1
effect: Activated at a settlement, the G.E.C.K. transforms the surrounding area over the course of a
  season — purified water, fertile soil, clean air in a half-mile radius. The settlement permanently
  gains +2 Pop, +2 Def, and +2 Ind (to the cap of 5 on each) and becomes a regional power. Every 
  faction within a week's travel will hear about it and react. The Enclave wants it. The Brotherhood
  wants it. The NCR wants it. Whoever doesn't get it will want to know why.
note: This relic changes the campaign. Only two or three are known to exist. The Overseer should 
  place this as the treasure at the end of a campaign-length arc, not a random find.
source: overseers-guide/relics#geck-garden-of-eden-creation-kit
body: "A heavy pre-war terraforming toolkit in a sealed, silvered case. Vault-Tec's answer to the question:
  what if we had to rebuild the world? Contains seeds, soil supplements, a cold-fusion power cell, and
  a molecular reassembler that can convert barren ground into fertile earth."
---
id: nuclear-keycard
type: relic
name: Nuclear Keycard
category: Settlement & Infrastructure
charges: 1
effect: Inserted into a pre-war nuclear silo's launch terminal, it authorizes a single launch cycle.
  The user must also possess a valid launch code (a separate puzzle the Overseer designs). If both 
  conditions are met, the user may target a single point on the map with a tactical nuclear strike —
  everything in a quarter-mile radius is annihilated, no roll, and the site becomes a permanent 
  high-rad zone. The card is consumed on use. Every faction in the region will respond within days.
note: Finding a keycard is a session. Using it is a campaign.
source: overseers-guide/relics#nuclear-keycard
body: A laminated pre-war military access card with a holographic seal and a single-use magnetic 
  strip. Issued to senior officers of the Appalachian Automated Launch System; when the network's 
  alert level rises, Strategic Air Command cargobots fly fresh ones in under vertibot escort.
---
id: overseers-cache-key-vault-76
type: relic
name: Overseer's Cache Key (Vault 76)
category: Settlement & Infrastructure
size: petty
effect: "Once per region explored, the holder may declare they have found one of the Overseer's caches.
  The Overseer stocks it: 2 Stimpaks, 1 box of ammo, 1 holotape with local intelligence, and a note that
  reveals one true fact about the area. After six uses, the key has opened every cache the Overseer planted.
  The seventh cache is empty except for a final holotape — and the Overseer decides what it says."
source: overseers-guide/relics#overseers-cache-key-vault-76
body: A brass key on a leather cord, issued to the Overseer of Vault 76 before the door opened. It 
  unlocks a series of supply caches the Overseer planted across Appalachia after walking out ahead 
  of the other residents — each one stocked with Stimpaks, ammo, a holotape, and a handwritten note.
---
id: sonic-emitter-big-mt
type: relic
name: Sonic Emitter (Big MT)
category: Anti-Synth & Surveillance Tech
charges: 3
recharge: A Downtime Action at any pre-war research station.
effect: Fires a directed sonic pulse. Against a hologram, force field, or energy barrier, the pulse 
  disables it for one scene. Against a robot or turret, the target makes a WIL save or locks up for 
  one round — no action, attacks against it Enhanced. Against a living target, d8 damage. The 
  emitter can also be tuned to one of several frequencies (the Overseer picks) — each frequency 
  unlocks a specific pre-war door, or pacifies a specific creature type.
source: overseers-guide/relics#sonic-emitter-big-mt
body: A handheld pre-war acoustic weapon from the Big Mountain research facility. Shaped like a 
  tuning fork mated to a pistol grip. Hums at a frequency that makes the user's teeth itch.
---
id: veil-of-secrets-order-of-mysteries
type: relic
name: Veil of Secrets (Order of Mysteries)
category: Anti-Synth & Surveillance Tech
charges: 3
recharge: A Downtime Action and a fusion cell.
effect: While active, the wearer's face is unrecognizable — cameras, robots, and human observers 
  cannot identify them. Lasts one scene per charge. Does not make the wearer invisible, only 
  unidentifiable.
source: overseers-guide/relics#veil-of-secrets-order-of-mysteries
body: The Mistress of Mystery's mask from the Silver Shroud serials, recreated by the Order of 
  Mysteries in their lair beneath Riverside Manor. A strip of dark cloth, fine as smoke, that 
  shields the face, cloaks the wearer's identity, and filters gas and smoke from every breath.
---
id: courser-chip
type: relic
name: Courser Chip
category: Anti-Synth & Surveillance Tech
charges: 1
effect: When decoded by a specialist (a Railroad tinker, a Brotherhood scribe, or an Institute 
  defector — a Downtime Action), the chip provides the molecular relay frequency needed to teleport 
  into the Institute. This is the key to the locked door. Without it, the Institute is unreachable. 
  With it, the Institute is reachable exactly once — after which the frequency changes and the chip 
  is burned.
note: The chip is also a tracking beacon. While carrying it, the party is being followed. The 
  Institute does not lose things quietly.
source: overseers-guide/relics#courser-chip
body: A tiny encrypted microprocessor removed from a deactivated Institute Courser. Still warm. 
  Still broadcasting, faintly, to a receiver nobody can find.
---
id: snow-globe
type: relic
name: Snow Globe
category: One-of-a-Kind Treasures
size: petty
effect: Each Snow Globe is worth 2000 caps to a collector who wants the set (Overseer places the 
  collector). To anyone else, it's a pretty bauble worth 20 caps. Collecting all seven and 
  presenting them earns a one-time reward the Overseer designs — traditionally, access to a sealed 
  pre-war suite with its own private arsenal.
source: overseers-guide/relics#snow-globe
body: A pre-war tourist's souvenir — a glass dome on a wooden base, containing a tiny scene of a 
  pre-war landmark under falling white flakes. There are seven known specimens. A specific pre-war 
  collector in a specific pre-war tower will pay 2000 caps each.
---
id: sierra-madre-gold-bar
type: relic
name: Sierra Madre Gold Bar
category: One-of-a-Kind Treasures
size: bulky
effect: Worth 500 caps to any merchant — if you can find one willing to handle that much gold at 
  once. The real cost is carrying it. The Sierra Madre vault holds 37 of them. Walking out with more
  than one is an act of will. Walking out with all of them is a story the wasteland will tell about 
  you forever, and not kindly.
source: overseers-guide/relics#sierra-madre-gold-bar
body: A single pre-war gold bar stamped with the Sierra Madre Casino's crest. Weighs about 35 
  pounds.
---
id: youre-special
type: relic
name: You're SPECIAL!
category: One-of-a-Kind Treasures
charges: 1
effect: A PC who reads the book — all the way through, aloud, in a quiet space — permanently 
  increases the maximum of one Attribute of their choice by 1. The book crumbles to dust after the 
  reading. The PC remembers every page. A PC may only benefit from one copy of this book in their 
  lifetime.
source: overseers-guide/relics#youre-special
body: "A pre-war children's board book, brightly colored, designed to teach a toddler the seven virtues
  Vault-Tec believed would save the world: Strength, Perception, Endurance, Charisma, Intelligence, Agility,
  Luck. Found in a crib in a nursery that has not been touched in two hundred years."
---
id: blade-of-bastet-order-of-mysteries
type: relic
name: Blade of Bastet (Order of Mysteries)
category: One-of-a-Kind Treasures
damage: d10
effect: Ignores 2 Armor. The blade is recognized on sight by anyone who has encountered the Order's 
  legacy — Free States militia, Brotherhood scouts, and Appalachian ghouls who remember the old 
  manor on the hill.
source: overseers-guide/relics#blade-of-bastet-order-of-mysteries
body: The Mistress of Mystery's legendary sword, rebuilt for real by the Order of Mysteries — a 
  secret society of Appalachian women who took up the mantle of the Silver Shroud serials' heroine 
  after the war. The Order forged each Blade from a historic sword (one of them from Ulysses S. 
  Grant's own saber, lifted from a display case at the Whitespring Resort) and fitted it with a 
  swing analyzer that learns its wielder's stance. The edge is honed to pierce power armor.
---
id: the-krivbeknih-dunwich
type: relic
name: The Krivbeknih (Dunwich)
category: Forbidden & Eerie
effect: A PC who reads it in full over a Downtime Action learns one true thing about a pre-war 
  entity called Ug-Qualtoth, which the Overseer will design. The reader also takes 2 Fatigue, and 
  dreams poorly for a week. Burning the book severs Ug-Qualtoth's connection to whichever 
  Dunwich-marked site the party has disturbed. The book resists burning. Fire must be fed holy 
  water, Atom-blessed water, or the blood of someone who has read it.
source: overseers-guide/relics#the-krivbeknih-dunwich
body: A thick pre-war book bound in cracked dark leather, recovered from the deepest floor of a 
  pre-war quarry company's executive suite. The text is a pre-war facsimile of something much older;
  half the pages are a dead language nobody alive admits to recognizing. Cold to the touch.
---
id: harolds-sprout
type: relic
name: Harold's Sprout
category: Forbidden & Eerie
charges: 1
effect: "Planted at a settlement, the sprout grows into a full canopy over a season. The settlement's
  immediate area becomes fertile, clean, and faintly luminous at night. Treat as a half-strength G.E.C.K.:
  +1 Pop and +1 Ind permanently. The canopy attracts pilgrims — the settlement becomes a regional shrine
  whether or not its people want it."
source: overseers-guide/relics#harolds-sprout
body: A pre-war FEV-mutated seedling taken from the canopy of a wasteland anomaly called Harold — a 
  man slowly becoming a tree. The sprout is already half-root.
---
id: mothman-feather-appalachia
type: relic
name: Mothman Feather (Appalachia)
category: Forbidden & Eerie
size: petty
effect: Once per campaign, the holder may ask the Wise Mothman a single true question about the 
  future. They do not have to travel to do so — speak the question aloud while holding the feather, 
  and the answer arrives before the next long rest, in a dream or a written note or a carving on the
  nearest tree. The feather is consumed.
source: overseers-guide/relics#mothman-feather-appalachia
body: A single black primary feather from the Wise Mothman of Appalachia, ten inches long, 
  impossibly light. The feather never quite sits still in the hand.
---
id: tranquility-lane-heart-stopper-tape
type: relic
name: Tranquility Lane Heart-Stopper Tape
category: Forbidden & Eerie
charges: 1
effect: Played through a Tranquility Lane-compatible simulation pod, the tape induces a lethal 
  cardiac event in a single targeted pre-war simulation resident. Outside that specific context, the
  tape is a curiosity — a loop of cheerful children's laughter that loops to a crash of static. Some
  listeners report the static resembles a name.
source: overseers-guide/relics#tranquility-lane-heart-stopper-tape
body: A pre-war holotape marked with a Vault-Tec seal and a single red stripe, recovered from a 
  specific cryo-preserved research vault. Plays only on original pre-war Tranquility Lane simulation
  hardware.
---
id: vault-87-test-subject-registry
type: relic
name: Vault 87 Test-Subject Registry
category: Forbidden & Eerie
size: petty
effect: Reading the registry lets a PC identify any super mutant from Vault 87 stock by name if they
  were once on the list. This includes lucid super mutant NPCs currently alive in the region. 
  Confrontation, reconciliation, or bounty — the Overseer decides what the knowledge unlocks.
source: overseers-guide/relics#vault-87-test-subject-registry
body: A pre-war clipboard of original Vault 87 residents, including portraits, medical histories, 
  and the name of each subject's assigned FEV dose. Water-stained, half-legible.
---
id: the-whispering-hood
type: relic
name: The Whispering Hood
category: Forbidden & Eerie
size: petty
effect: While worn in complete darkness, the wearer can hear a voice describing their immediate 
  surroundings in detail — the voice belongs to whoever died last in the current building. The 
  information is always accurate. The voice resents being used.
source: overseers-guide/relics#the-whispering-hood
body: A pre-war hood from a Dunwich-affiliated cult, embroidered in dark thread with patterns that 
  do not stay still.
---
id: the-wasteland-survival-guide-autographed-first-edition
type: relic
name: The Wasteland Survival Guide (Autographed First Edition)
category: Pre-war Culture & Curiosity
effect: A PC who reads the book in a single Downtime Action may, once per session, ask the Overseer 
  "What does Moira's book say about this?" and receive a genuinely practical tip about the immediate
  situation — disarming a trap, treating a wound, avoiding a creature's bite. The advice is always 
  useful and always a little weird. Worth 600 caps to a Megaton historian if sold.
source: overseers-guide/relics#the-wasteland-survival-guide-autographed-first-edition
body: A slim post-war book printed on a salvaged pre-war press, bound in lime-green cloth and 
  autographed on the flyleaf by Moira Brown with a carnation drawn in red ink. Published two 
  centuries after the war by a Megaton shopkeeper who never left her store.
---
id: grognak-costume-convention-replica
type: relic
name: Grognak Costume (Convention Replica)
category: Pre-war Culture & Curiosity
size: petty
charges: 1
recharge: Read any issue of Grognak the Barbarian cover to cover.
effect: While worn, NPCs react one step worse on first meeting; children react one step better and 
  will not be scared of the wearer. Spend the charge to bellow Grognak's warcry — children and true 
  believers of the comics shift one step better on the Reaction ladder for the rest of the scene.
source: overseers-guide/relics#grognak-costume-convention-replica
body: A cardboard-and-leather replica of the pre-war barbarian comic hero's costume — fur loincloth,
  axe strapped to the back, chest openly bare. Pristine, from a Grognak convention booth that was 
  never dismantled. Not the studio original — though almost nobody alive can tell.
---
id: nuka-girl-rocketsuit-costume
type: relic
name: Nuka-Girl Rocketsuit Costume
category: Pre-war Culture & Curiosity
size: petty
effect: When worn openly in any settlement that remembers pre-war pop culture (ghouls, certain 
  pre-war tribes), Reaction rolls shift one step better. The wearer may also pass as an authorized 
  Nuka-World employee — automated Nuka-Cola security systems do not attack them.
source: overseers-guide/relics#nuka-girl-rocketsuit-costume
body: A pre-war promotional costume of the Nuka-World mascot — pulp-serial space heroine, silver 
  skirt, plastic ray-pistol. Found in a pre-war amusement park costume locker.
---
id: pre-war-newspaper-war-never-changes
type: relic
name: 'Pre-war Newspaper: "War Never Changes"'
category: Pre-war Culture & Curiosity
size: petty
effect: 'Possessing the paper lets a PC, once per campaign, invoke its headline before a major act of
  violence. The Overseer treats the scene with particular weight: describe one additional consequence
  of the violence that will ripple outward through the region. Newsworthy acts get reported.'
source: overseers-guide/relics#pre-war-newspaper-war-never-changes
body: 'A folded pre-war newspaper, impossibly well-preserved, with a single bold front-page headline:
  WAR, WAR NEVER CHANGES. Dated October 23, 2077.'
---
id: silver-shroud-holotapes-complete-series
type: relic
name: Silver Shroud Holotapes (Complete Series)
category: Pre-war Culture & Curiosity
size: petty
effect: Listening to the full series over a Downtime Action lets a PC (once per campaign) declare a 
  single crime they will punish in the Silver Shroud's voice. The Overseer must surface the criminal
  within two sessions. Combined with the Silver Shroud Costume from the Unique Armors list, the 
  party has everything they need to become vigilantes.
source: overseers-guide/relics#silver-shroud-holotapes-complete-series
body: A boxed set of pre-war radio-drama holotapes starring The Silver Shroud, a pre-war 
  crime-fighting vigilante. Sealed, pristine. Every episode. Still plays.
---
id: the-fishermans-journal-far-harbor
type: relic
name: The Fisherman's Journal (Far Harbor)
category: Pre-war Culture & Curiosity
size: petty
effect: Carried by a PC fishing or scavenging along any coast, the journal reveals one hidden 
  feature per visit — a pre-war dock, a sunken boat, a drowned shortcut, a pot of buried coins. Once
  a coast has yielded six features to the journal's reader, the journal quiets.
source: overseers-guide/relics#the-fishermans-journal-far-harbor
body: A leather-bound logbook kept by a pre-war fisherman on the Maine coast, detailing two decades 
  of catches before the bombs fell. Salt-stained and water-warped, but every page legible.
---
id: sealed-nuka-cola-factory-crate
type: relic
name: Sealed Nuka-Cola Factory Crate
category: Pre-war Culture & Curiosity
charges: 1
effect: Opened, the crate contains 24 pristine Nuka-Cola bottles (any mix of Cherry, Grape, Orange, 
  Quantum, and Quartz — Overseer's pick). Collectors pay 20 caps per bottle; a PC who drinks one 
  gets the standard Nuka effect. The crate itself is worth 300 caps to a Nuka-Cola preservation 
  society — and there is always exactly one such society, somewhere, in any Fallout campaign.
source: overseers-guide/relics#sealed-nuka-cola-factory-crate
body: A pre-war wooden crate stamped with the Nuka-Cola corporate seal, still nailed shut, still 
  cold.
---
id: pre-war-childrens-hospital-keycard
type: relic
name: Pre-war Children's Hospital Keycard
category: Pre-war Culture & Curiosity
size: petty
effect: Opens a single pre-war children's hospital door or medical cabinet per session. Pre-war 
  children's medical facilities contain pristine Stimpaks, RadAway, antibiotic kits, and often a 
  single preserved patient toy. The keycard has a nametag — a specific pre-war child whose fate the 
  Overseer designs.
source: overseers-guide/relics#pre-war-childrens-hospital-keycard
body: A laminated pre-war access card with a cartoon lion mascot on the front. Faded but still 
  scans.
