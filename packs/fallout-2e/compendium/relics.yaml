# Pre-war relics (overseers-guide/relics): `charges` holds the book's uses or charges. Generated by fo_compendium.py from the game's Markdown: rerun it, don't edit by hand.
id: stealth-boy
type: relic
name: Stealth Boy
category: Stealth & Intrusion
charges: 3
recharge: A new fusion cell and a safe hour at a workbench.
effect: The user becomes functionally invisible until they act aggressively or take damage. Lasts 
  one scene.
source: overseers-guide/relics#stealth-boy
body: A wrist-mounted pre-war projector that bends light around the wearer.
---
id: infiltrators-keyring
type: relic
name: Infiltrator's Keyring
category: Stealth & Intrusion
effect: 'Opens one category of pre-war mundane lock per campaign: storage, office, residential, or service.
  Pick at first use. It does not open safes or vault doors.'
source: overseers-guide/relics#infiltrators-keyring
body: A brass pre-war service-industry keyring with a single odd-shaped key.
---
id: auto-doc-chip
type: relic
name: Auto-Doc Chip
category: Medical & Survival
charges: 1
recharge: Place in a working auto-doc for one day.
effect: Used in any medical kit, it restores a dying PC to full STR. If the PC gained a Scar this 
  session, the Overseer may swap that Scar for the next-less-severe row on the table (e.g., a 
  Bleeding Out becomes Severed). It does not erase Scars entirely — the body remembers.
source: overseers-guide/relics#auto-doc-chip
body: A small circuit board from a pre-war auto-doc.
---
id: vault-tec-wrist-band
type: relic
name: Vault-Tec Wrist Band
category: Medical & Survival
charges: 1
recharge: Rest in a pre-war vault interior for one full day.
effect: When activated, restores the user's HP to maximum and clears 1 Rad.
source: overseers-guide/relics#vault-tec-wrist-band
body: A pre-war fitness bracelet still running its original firmware.
---
id: healing-cross
type: relic
name: Healing Cross
category: Medical & Survival
charges: 3
recharge: Restock the ampoules at a Chemistry Station or a working infirmary.
effect: Spend a charge to clear 2 Rads from a patient over a short rest, or to restore a dying PC to
  1d6 STR.
source: overseers-guide/relics#healing-cross
body: A pre-war field-medic's red-cross reliquary — auto-injectors, a stitch-gun, and a sealed 
  rad-scrubber ampoule, all still sterile.
---
id: vault-81-cure
type: relic
name: Vault 81 Cure
category: Medical & Survival
charges: 1
effect: Cures any single disease, infection, mutation-in-progress, or disease-based Scar. Once used,
  it cannot be made again without the original lab.
source: overseers-guide/relics#vault-81-cure
body: A small glass ampoule — the only dose ever produced by Vault 81's hidden research wing.
---
id: rad-pills-pre-war-military-issue
type: relic
name: Rad Pills (Pre-war Military Issue)
category: Medical & Survival
charges: 6
effect: One pill clears 1 Rad with no side effects. More than one pill per day and the user makes a 
  STR save; on a fail, they vomit the dose back up and the pill is wasted.
source: overseers-guide/relics#rad-pills-pre-war-military-issue
body: A small orange pill bottle with a military crest.
---
id: sunset-sarsaparilla-star-cap
type: relic
name: Sunset Sarsaparilla Star Cap
category: Medical & Survival
effect: Once per campaign, present it to a specific pre-war figure who may still be out there 
  somewhere. The Overseer decides what happens.
source: overseers-guide/relics#sunset-sarsaparilla-star-cap
body: A rare bottle cap with a star stamped on the underside.
---
id: nuka-cola-quantum
type: relic
name: Nuka-Cola Quantum
category: Medical & Survival
size: petty
charges: 1
effect: Drink to heal to full HP and for one scene automatically pass DEX saves involving speed or 
  reflexes — but take 1 Rad from the isotopes. The next day, the drinker becomes Deprived from the 
  crash. Side effects may include glowing urine.
source: overseers-guide/relics#nuka-cola-quantum
body: A glowing blue bottle of pre-war soft drink laced with radioactive isotopes for "extra kick." 
  Somehow still cold.
---
id: pip-boy-3000-functional
type: relic
name: Pip-Boy 3000 (Functional)
category: Command, Communication & Identity
effect: Works as The Pip-Boy in the Marketplace describes — it tracks Rads and HP, plays holotapes, 
  gives basic terminal access without a hack attempt, and the user cannot become lost on ground they
  have walked before. Given a Downtime Action, the user can also copy one holotape onto another.
source: overseers-guide/relics#pip-boy-3000-functional
body: A wrist-mounted pre-war personal computer. Reads holotapes, tracks radiation, maps, and runs 
  small programs.
---
id: mister-handy-voice-module
type: relic
name: Mister Handy Voice Module
category: Command, Communication & Identity
effect: Once per session, the carrier may replay the module to order any pre-war domestic robot to 
  perform a simple task. The robot will comply if it is capable.
source: overseers-guide/relics#mister-handy-voice-module
body: A small cylindrical recording of a pre-war household robot's voice.
---
id: the-couriers-badge
type: relic
name: The Courier's Badge
category: Command, Communication & Identity
effect: Any NPC wearing a pre-war uniform recognizes it and extends a minimum of neutral courtesy on
  sight. If they were Hostile, they become Wary instead.
source: overseers-guide/relics#the-couriers-badge
body: A brass pre-war postal service badge.
---
id: the-platinum-chip
type: relic
name: The Platinum Chip
category: Command, Communication & Identity
effect: When inserted into any pre-war computer the user has administrator access to, it unlocks 
  that computer's sealed maintenance protocols. Used on the right computer, it can override an 
  entire facility. Only one exists. The original owner wants it back.
source: overseers-guide/relics#the-platinum-chip
body: A pre-war experimental platinum data chip the size of a poker chip. It is warm to the touch.
---
id: vault-tec-master-key-card
type: relic
name: Vault-Tec Master Key Card
category: Command, Communication & Identity
effect: Opens any single Vault-Tec maintenance door, security panel, or lock in a vault per day. 
  Does not open the primary Overseer's terminal or the cryo hibernation chambers. One card per 
  campaign.
source: overseers-guide/relics#vault-tec-master-key-card
body: A black plastic card stamped with the Vault-Tec corporate seal and a code string worn nearly 
  blank.
---
id: the-silent-radio
type: relic
name: The Silent Radio
category: Command, Communication & Identity
effect: Whenever carried into a location touched by a rogue pre-war signal or a lingering AI, the 
  radio plays a specific pre-war jingle for five seconds. Whatever is broadcasting in that location 
  recoils from the jingle and releases its hold on nearby minds for one scene.
source: overseers-guide/relics#the-silent-radio
body: A wind-up pre-war radio that plays only silence.
---
id: vault-tec-lunchbox
type: relic
name: Vault-Tec Lunchbox
category: Command, Communication & Identity
effect: Rattles constantly. Opened once, it produces a random pre-war snack food, a small toy, and a
  single uncirculated pre-war coin. The snack and toy are petty; the coin is worth 20 caps to a 
  collector. The lunchbox will never produce the same contents twice.
source: overseers-guide/relics#vault-tec-lunchbox
body: A pre-war metal lunchbox painted with cheerful Vault-Tec mascots. Slightly warm.
---
id: sierra-madre-voucher
type: relic
name: Sierra Madre Voucher
category: Unique Consumables & Strange Artifacts
effect: Presented to any pre-war vending machine, automated bank, or casino kiosk, it produces one 
  pre-war item of the Overseer's choosing (probably worth 100–200 caps). One use per voucher, and 
  there are rumors of at least three still out in the Wastes.
source: overseers-guide/relics#sierra-madre-voucher
body: A pre-war casino voucher stamped with a desert resort's name. Slightly radioactive.
---
id: big-mt-transportalponder
type: relic
name: Big MT Transportalponder
category: Unique Consumables & Strange Artifacts
charges: 1
recharge: Press it again inside the destination facility to return.
effect: When pressed, instantly transports the user (and anything they are carrying) to a specific 
  pre-set pre-war research facility the Overseer has placed in the world.
note: "Not known to the user: the device's return button takes them back to wherever the outgoing button
  was last pressed."
source: overseers-guide/relics#big-mt-transportalponder
body: A palm-sized pre-war teleportation device with a single red button.
---
id: kelloggs-cybernetic-brain-augmenter
type: relic
name: Kellogg's Cybernetic Brain Augmenter
category: Unique Consumables & Strange Artifacts
charges: 1
effect: When inserted into a memory lounger or auto-doc, the implant plays back selected memories of
  its original owner to a connected listener. The listener learns one specific secret the operative 
  knew. The implant degrades after use. The memories are not always true.
source: overseers-guide/relics#kelloggs-cybernetic-brain-augmenter
body: A dark organic data-implant removed from the skull of Conrad Kellogg, a century-old Institute 
  mercenary whose lifespan was extended by cybernetic enhancements. Still warm.
---
id: the-transcendent
type: relic
name: The Transcendent
category: Unique Consumables & Strange Artifacts
effect: While carried, whenever the user would roll on the Scars table they may re-roll a Doomed or 
  Bleeding Out result once and keep the second result.
source: overseers-guide/relics#the-transcendent
body: A small pre-war religious artifact that seems to have survived any number of disasters 
  entirely unharmed.
---
id: lead-foil-binder
type: relic
name: Lead-Foil Binder
category: Storage & Protection
effect: Up to three Perk Magazines stored inside cannot be damaged by fire, water, or radiation. 
  Very useful for a scavver planning a long trip through a hot zone with unread magazines in the 
  pack.
source: overseers-guide/relics#lead-foil-binder
body: A small folder lined with lead foil.
---
id: pre-war-traveling-case
type: relic
name: Pre-war Traveling Case
category: Storage & Protection
effect: Holds up to three slots' worth of items, yet the case and everything in it take only 2 slots
  (bulky) — a net saving of one slot. Contents cannot be stolen without the combination (it is not 
  easily picked).
source: overseers-guide/relics#pre-war-traveling-case
body: A reinforced pre-war attache case, locked. You have the combination.
---
id: cryo-storage-cylinder
type: relic
name: Cryo Storage Cylinder
category: Storage & Protection
charges: 1
effect: Any biological sample placed inside remains perfectly preserved for any length of time. 
  Useful for transporting a serum, an antitoxin, or a severed limb that needs to be reattached.
source: overseers-guide/relics#cryo-storage-cylinder
body: A hand-sized pre-war cryogenic storage cylinder. Cold to the touch.
---
id: strength-bobblehead
type: relic
name: Strength Bobblehead
category: Vault Boy Bobbleheads
size: petty
effect: Max STR +1 while carried.
note: A PC may carry one bobblehead at a time; carrying a second replaces the first.
source: overseers-guide/relics#strength-bobblehead
body: "A pre-war Vault-Tec promotional series: seven matched plastic figurines of the company's cheerful
  mascot, each themed to one of the old corporate aptitude categories. Collectors in every settlement
  will pay for them, but keeping one on your person grants a small training benefit — the figurine is
  said to have been tuned, in pre-war marketing copy, to remind the carrier of the virtue it represents.
  The effect appears to be real, at least in the post-war world."
---
