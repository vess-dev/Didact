type: item
name: Kiloton Radium Rifle
category: 'Unique weapons: Rifles & Carbines — Ballistic'
size: bulky
damage: d10
qualities: [unique, blast]
ammo: '.45'
effect: The target takes 1 Rad on hit.
note: Radium rifle with explosive payload
source: overseers-guide/unique-weapons#kiloton-radium-rifle
body: A Children of Atom radium rifle, blessed at the Nucleus and rebuilt around an explosive 
  payload. The receiver clicks like a Geiger counter even when it sits still.
---
id: the-terrible-shotgun
type: item
name: The Terrible Shotgun
category: 'Unique weapons: Shotguns'
size: bulky
damage: d12
qualities: [unique, blast]
effect: d12 instead of d10. Each shot requires a STR save from the wielder or they lose 1 HP to 
  recoil.
note: Combat shotgun
source: overseers-guide/unique-weapons#the-terrible-shotgun
body: A brutal combat shotgun that a raider legend sawed down, shortened, and modified past any 
  reasonable safety. It hurts to fire. It hurts more to be in front of.
---
id: dinner-bell
type: item
name: Dinner Bell
category: 'Unique weapons: Shotguns'
size: bulky
damage: d12
qualities: [unique, blast]
effect: d12 instead of d10.
note: Hunting shotgun; blast at close range
source: overseers-guide/unique-weapons#dinner-bell
body: A restaurant owner's beloved shotgun, racked behind the bar for a decade before trouble came. 
  It went off twice.
---
id: big-boomer
type: item
name: Big Boomer
category: 'Unique weapons: Shotguns'
damage: d10
qualities: [unique, blast]
effect: Deals d10 instead of d8. When firing, the wielder makes a STR save or is knocked flat — they
  lose their next action getting up.
note: Sawed-off double-barrel shotgun; blast at close range
source: overseers-guide/unique-weapons#big-boomer
body: An enormously oversized double-barrel shotgun that has no business being legal. Carried by an 
  old woman in a scrap yard who seems to enjoy it too much.
---
id: the-kneecapper
type: item
name: The Kneecapper
category: 'Unique weapons: Shotguns'
damage: d10
qualities: [unique, blast]
effect: Deals d10 instead of d8, blast at close range. On a Critical Damage result, the target 
  cannot move on its next turn — "kneecapped."
note: Sawed-off shotgun; blast at close range
source: overseers-guide/unique-weapons#the-kneecapper
body: A sawed-off shotgun that an enterprising caravan runner had modified to fire slug-heavy shells
  at close range. The barrel is short enough to stuff under a coat.
---
id: sydneys-10mm-ultra-smg
type: item
name: Sydney's 10mm "Ultra" SMG
category: 'Unique weapons: Submachine Guns'
size: bulky
damage: d10
qualities: [unique]
effect: Deals d10 instead of d8. Each combat, the wielder may spend one turn emptying a full 
  magazine for d12 damage. Next turn they cannot attack while they reload.
note: 10mm submachine gun, prototype
source: overseers-guide/unique-weapons#sydneys-10mm-ultra-smg
body: A pre-war prototype SMG modified into a high-rate-of-fire burst weapon by a mercenary who only
  let it go when she was dying.
---
id: vances-9mm-smg
type: item
name: Vance's 9mm SMG
category: 'Unique weapons: Submachine Guns'
size: bulky
damage: d8
qualities: [unique]
effect: d8 instead of d6. Reaction rolls improve one step with any ghoul old enough to remember the 
  pre-war outlaw days.
note: 9mm submachine gun
source: overseers-guide/unique-weapons#vances-9mm-smg
body: A Thompson-style SMG polished to a mirror shine, kept in mint condition by Vance — half of the
  pre-war outlaw pair Vikki and Vance, who never once fired it. It sat in a casino display case in 
  Primm until somebody walked off with it.
---
id: sleepytyme
type: item
name: Sleepytyme
category: 'Unique weapons: Submachine Guns'
size: bulky
damage: d8
qualities: [unique]
effect: d8. Silenced. Enhanced from stealth.
note: 10mm SMG, silenced
source: overseers-guide/unique-weapons#sleepytyme
body: A pre-war suppressed SMG built for wetwork. A wasteland gunsmith built it for the weapon's 
  namesake — who never used it, but paid in full.
---
id: metal-blaster
type: item
name: Metal Blaster
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d10
qualities: [unique, blast]
effect: Gains the blast tag. Each shot spends 2 uses of its fusion cell.
note: Laser rifle
source: overseers-guide/unique-weapons#metal-blaster
body: A heavily modified laser rifle whose beam has been split into nine parallel shots by a lunatic
  steel-ingot tinker in the Pitt.
---
id: wazer-wifle
type: item
name: Wazer Wifle
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d10
qualities: [unique]
effect: A fusion cell lasts it 12 shots instead of 6. The rifle will not fire at a child of its own 
  species.
note: Laser rifle
source: overseers-guide/unique-weapons#wazer-wifle
body: A laser rifle modified by a child who spoke with a lisp and was by all accounts very sweet. 
  The custom rear sight is a crayon drawing.
---
id: q-35-matter-modulator
type: item
name: Q-35 Matter Modulator
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d12
qualities: [unique]
effect: Deals d12. Once per combat, one shot deals blast damage as the bolt destabilizes on impact. 
  The rifle is fragile — a natural 20 on any DEX save while carrying it means it cracks and loses 
  the trick until repaired.
note: Plasma rifle, prototype
source: overseers-guide/unique-weapons#q-35-matter-modulator
body: A pre-war research plasma rifle in an unfinished housing — wires still exposed, capacitor 
  still clicking.
---
id: aer14-prototype
type: item
name: AER14 Prototype
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d12
qualities: [unique]
effect: Deals d12 instead of d10. Uses standard fusion cells.
note: Laser rifle, prototype
source: overseers-guide/unique-weapons#aer14-prototype
body: A pre-war energy-weapons prototype recovered from a sealed military research installation. Its
  housing is still in the original test-crate foam.
---
id: tesla-beaton-prototype
type: item
name: Tesla-Beaton Prototype
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d12
qualities: [unique, blast]
effect: d12 blast — the arc rolls separately against each target within 10 feet of the first.
note: Tesla cannon, prototype
source: overseers-guide/unique-weapons#tesla-beaton-prototype
body: An experimental pre-war weapon combining two incompatible technologies. The capacitor hums 
  continuously and the wielder's fillings ache after long carry. Its bolt arcs from target to 
  target.
---
id: anchorage-gauss
type: item
name: Anchorage Gauss
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d12
qualities: [unique]
effect: d12. Ignores 1 Armor on the first shot of any combat. Rusted, visibly suffering; a natural 
  20 on any save while carrying it means the rifle is broken until a Downtime Action restores it.
note: Gauss rifle
source: overseers-guide/unique-weapons#anchorage-gauss
body: A pre-war Gauss rifle recovered from the frozen battlefield of a war that happened before any 
  war this continent remembers.
---
id: ycs-186
type: item
name: YCS/186
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d12
qualities: [unique]
effect: Deals d12. Ignores 1 point of Armor. Each shot spends 2 uses of its 2mm electromagnetic 
  ammo.
note: Gauss rifle, prototype
source: overseers-guide/unique-weapons#ycs186
body: A pre-war Gauss rifle prototype that was meant to be tested by three engineers. Only one ever 
  came back from the test range.
---
id: van-graff-laser-rifle
type: item
name: Van Graff Laser Rifle
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d10
qualities: [unique]
effect: d10. Enhanced against targets in light armor or lighter. Van Graff merchants will recognize 
  it and try to buy it back.
note: Laser rifle, tuned
source: overseers-guide/unique-weapons#van-graff-laser-rifle
body: A pre-war Van Graff family showroom laser rifle, tuned by generations of the family who made a
  business of moving energy weapons. Polished with a proprietary wax.
---
id: van-graff-plasma-rifle
type: item
name: Van Graff Plasma Rifle
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d12
qualities: [unique]
effect: d12. On Critical Damage, target dissolves (no corpse to loot).
note: Plasma rifle, tuned
source: overseers-guide/unique-weapons#van-graff-plasma-rifle
body: The matching plasma-frame rifle from the Van Graff family's pre-war arsenal.
---
id: yk42b-pulse-rifle
type: item
name: YK42B Pulse Rifle
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d10
qualities: [unique, blast]
effect: d10 blast. Enhanced against robots and power armor. Impaired against everything else.
note: Pre-war anti-robot pulse rifle
source: overseers-guide/unique-weapons#yk42b-pulse-rifle
body: The Yuma Flats Energy Consortium's successor to the YK32, housed in a dusty Vault 34 armory 
  crate. Greater charge capacity and range than the pistol. The user's ears ring after every shot.
---
id: lorenzos-artifact-gun
type: item
name: Lorenzo's Artifact Gun
category: 'Unique weapons: Energy Rifles'
damage: d10
qualities: [unique]
effect: 3 charges per day (recharged by a full night's sleep within 100 ft of the gem). Fires no 
  bullet — the user points and spends a charge. The target takes d6 WIL damage (Armor does not 
  apply) and is hurled backward 10 feet; unless it passes a STR save it lands flat and loses its 
  next action getting up. Repeated use by the same person causes strange dreams.
note: Pre-war-modified gamma revolver
source: overseers-guide/unique-weapons#lorenzos-artifact-gun
body: A strange pre-war-modified revolver frame holding a small embedded alien gem, pulsing faintly.
  Recovered from a specific pre-war parapsychology estate.
---
id: righteous-authority
type: item
name: Righteous Authority
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d10
qualities: [unique]
effect: The wielder's first attack each combat is Enhanced.
note: Laser rifle
source: overseers-guide/unique-weapons#righteous-authority
body: A Brotherhood-issue AER9 kept to parade standard and presented by Paladin Danse to a recruit 
  who earned it at Cambridge. The Brotherhood sigil is etched below the rear sight.
---
id: holorifle
type: item
name: Holorifle
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d10
qualities: [unique]
ammo: microfusion cell
effect: One shot destroys a hologram emitter in line of sight.
note: Hologram-projection rifle
source: overseers-guide/unique-weapons#holorifle
body: Father Elijah's jury-built masterpiece — a pump-action scaffold around a scavenged Sierra 
  Madre hologram emitter, firing bolts of hard light.
---
id: laer
type: item
name: LAER
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d10
qualities: [unique]
ammo: microfusion cell
effect: d10. Runs on microfusion cells.
note: Laboratory Assisted Energy Rifle
source: overseers-guide/unique-weapons#laer
body: A Big MT bench prototype that accelerates a charge down an open-rail housing. It sings a 
  rising tone as it charges, and the tone is the warning.
---
id: v63-bertha
type: item
name: V63-BERTHA
category: 'Unique weapons: Energy Rifles'
size: bulky
damage: d10
qualities: [unique, blast]
effect: Each hit arcs to one more target within 10 feet of the first, which takes d6. During a 
  lightning storm, the arc jumps to every target within 10 feet.
note: Tesla rifle
source: overseers-guide/unique-weapons#v63-bertha
body: Vault 63's own Tesla rifle, stenciled with the vault number and rebuilt to fire as fast as its
  capacitors refill. The Skyline Valley ghouls hand it out to outsiders who survive their most 
  dangerous errands.
---
id: vengeance
type: item
name: Vengeance
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
effect: Ignores 1 Armor. Burns ammunition four times as fast as a standard Gatling laser.
note: Gatling laser
source: overseers-guide/unique-weapons#vengeance
body: A heavily modified Gatling laser with a blackened housing and a hand-carved name. The 
  wielder's name. The wielder is almost certainly dead.
---
id: eugene
type: item
name: Eugene
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
effect: Firing it on the move is not Impaired. Requires a belt of heavy rounds per burst.
note: Minigun
source: overseers-guide/unique-weapons#eugene
body: A pre-war minigun named by a loving owner. Still loved, if you know how to speak to it.
---
id: miss-launcher
type: item
name: Miss Launcher
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
effect: Fires hand-packed missiles which are common tools + powder charge, not proper missiles. 
  Deals d12 blast.
note: Missile launcher, modified
source: overseers-guide/unique-weapons#miss-launcher
body: A missile launcher modified by an enthusiastic tinker to fire cheaper, faster, hand-packed 
  missiles. The tinker's name was stenciled along the side and has since been scratched out.
---
id: experimental-mirv
type: item
name: Experimental MIRV
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d20
qualities: [unique, blast]
effect: Fires 5 mini nukes per shot, one per target in a wide area. Uses 5 mini nukes per use. 
  Anyone within the blast area is functionally certain to be incinerated.
note: Fat Man, modified; blast five times
source: overseers-guide/unique-weapons#experimental-mirv
body: A pre-war R&D Fat Man capable of firing a multi-warhead mini nuke payload. The prototype was 
  never fielded. It still works.
---
id: esther
type: item
name: Esther
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d20
qualities: [unique, blast]
effect: d20 blast in a very wide area. Ignores cover. One use per mini nuke.
note: Fat Man; huge blast
source: overseers-guide/unique-weapons#esther
body: A pre-war Fat Man launcher with a well-worn shoulder strap and a pre-war crew-chief's name 
  inked on the butt. She is, to put it mildly, maintained.
---
id: annabelle
type: item
name: Annabelle
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
effect: d12 blast. The guidance system means long-range attacks are not Impaired.
note: Missile launcher
source: overseers-guide/unique-weapons#annabelle
body: A missile launcher with a built-in guidance system, decorated with a maple leaf and Chinese 
  star markings that glow in the dark. Wielded by the nightkin sniper on Black Mountain's radio 
  tower.
---
id: burnmaster
type: item
name: Burnmaster
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique, blast]
effect: Deals d10 instead of d8. Ignites flammable terrain, which burns for the rest of the scene.
note: Flamer
source: overseers-guide/unique-weapons#burnmaster
body: A heavily modified flamer with an expanded fuel tank and a ceramic nozzle.
---
id: cleansing-flame
type: item
name: Cleansing Flame
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique, blast]
effect: Deals d10 instead of d8. Enhanced against feral ghouls and mutant flora.
note: Flamer
source: overseers-guide/unique-weapons#cleansing-flame
body: A heavy flamer once used by a pre-war religious order to "purify" unclean places. The tank is 
  inscribed with scripture in a dead language.
---
id: drone-cannon-ex-b
type: item
name: Drone Cannon Ex-B
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique, blast]
effect: d10 blast. Uses alien power cells.
note: Alien drone cannon
source: overseers-guide/unique-weapons#drone-cannon-ex-b
body: An experimental Zetan drone cannon, pried off the weapons drone that carried it aboard 
  Mothership Zeta. Its energy ball arcs and ricochets once. Rigged for shoulder fire now.
---
id: precision-gatling-laser
type: item
name: Precision Gatling Laser
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique]
effect: Long-range attacks not Impaired. Burns ammunition four times as fast as a standard Gatling 
  laser.
note: Gatling laser, pre-war refit
source: overseers-guide/unique-weapons#precision-gatling-laser
body: A pre-war Enclave armory-refit Gatling laser tuned for accuracy rather than suppression. Fires
  longer, hotter, narrower.
---
id: rapid-torch-flamer
type: item
name: Rapid-Torch Flamer
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique, blast]
effect: Deals d10 instead of d8. Each scene burns one full flamer fuel tank. On a natural 20 on any 
  save while the torch is lit, the tank ruptures.
note: Flamer, fast-burn
source: overseers-guide/unique-weapons#rapid-torch-flamer
body: An Enclave flamer modified to burn through its fuel at double rate, for double damage, in half
  the time.
---
id: slo-burn-flamer
type: item
name: Slo-Burn Flamer
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique, blast]
effect: Deals d10 instead of d8. Targets hit continue to burn for 3 rounds (1 STR per round).
note: Flamer, cold-burn
source: overseers-guide/unique-weapons#slo-burn-flamer
body: An Enclave variant that burns cooler for much longer — each spray stays on the target as a 
  lingering fire.
---
id: mesmetron
type: item
name: Mesmetron
category: 'Unique weapons: Heavy Weapons'
damage: d4
qualities: [unique]
effect: d4. Once per scene, one target it hits makes a WIL save or is docile and compliant for the 
  rest of the scene. Loud, obvious, and illegal.
note: Pre-war slaver's mind-control pistol
source: overseers-guide/unique-weapons#mesmetron
body: A pre-war slaver's non-lethal submission weapon. Its beam does not destroy flesh; it loosens 
  minds. Enclave and slavers both want it.
---
id: microwave-emitter
type: item
name: Microwave Emitter
category: 'Unique weapons: Heavy Weapons'
damage: d8
qualities: [unique]
effect: d8. On a Critical Damage result, target disintegrates — no corpse, no loot. The wielder 
  takes 1 Rad per scene of use.
note: Pre-war directed microwave weapon
source: overseers-guide/unique-weapons#microwave-emitter
body: A pre-war prototype pulled from the reward vault of the St. Aubin medical facility — the 
  General Atomics brain-research lab sealed beneath Point Lookout's lighthouse. The beam melts 
  through the inside of the target.
---
id: atomic-pulverizer
type: item
name: Atomic Pulverizer
category: 'Unique weapons: Heavy Weapons'
damage: d10
qualities: [unique]
effect: Enhanced against power armor. Runs on alien power cells.
note: Alien atomizer variant
source: overseers-guide/unique-weapons#atomic-pulverizer
body: The unique Zetan atomizer from Mothership Zeta's armory — lighter and quicker on the trigger 
  than the standard issue.
---
id: destabilizer
type: item
name: Destabilizer
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique]
effect: d10. On Critical Damage, target disintegrates (no corpse to loot).
note: Alien disintegrator variant
source: overseers-guide/unique-weapons#destabilizer
body: A unique Zetan disintegrator, housed in a Mothership Zeta observation-deck case behind three 
  locked doors.
---
id: cz57-avenger
type: item
name: CZ57 Avenger
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast, brace required]
effect: d12 blast. Requires a belt of heavy rounds per scene of fire. Ignores 1 Armor on any turn 
  the wielder does not move.
note: Minigun, pre-war prototype
source: overseers-guide/unique-weapons#cz57-avenger
body: A pre-war military prototype minigun found in a blue truck in the middle of a dead-prospector 
  camp. Still belt-fed, still factory oiled.
---
id: sprtel-wood-9700
type: item
name: Sprtel-Wood 9700
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
effect: d12 blast. Uses standard fusion cells instead of cores.
note: Gatling laser
source: overseers-guide/unique-weapons#sprtel-wood-9700
body: A pre-war military Gatling laser named for the two families that built it. The housing is 
  still stenciled with the factory's name.
---
id: the-smitty-special
type: item
name: The Smitty Special
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
effect: d12 blast. On a Critical Damage result, target dissolves into green glass.
note: Plasma caster
source: overseers-guide/unique-weapons#the-smitty-special
body: A pre-war plasma caster tuned and retuned by generations of a pre-war weapons family. The 
  coils hum in a satisfying three-tone chord.
---
id: elijahs-jury-rigged-tesla-cannon
type: item
name: Elijah's Jury-Rigged Tesla Cannon
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
effect: d12 blast. On Critical Damage, every robot in the scene has its attacks Impaired for one 
  round.
note: Tesla cannon, field-patched
source: overseers-guide/unique-weapons#elijahs-jury-rigged-tesla-cannon
body: A pre-war Tesla cannon that a Brotherhood elder rebuilt from parts in a wasteland bunker. The 
  housing is welded and rewelded and still smells of Nevada dust.
---
id: mercy
type: item
name: Mercy
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique, blast]
effect: d10 blast against a group. Uses a belt of 40mm grenades per scene.
note: Grenade machine gun
source: overseers-guide/unique-weapons#mercy
body: A pre-war grenade machine gun belonging to a dead Brotherhood Paladin found in a deep cave. 
  The ammo box is still half-full.
---
id: thump-thump
type: item
name: Thump-Thump
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique, blast]
effect: d10 blast. Uses one 40mm grenade per shot.
note: Grenade rifle
source: overseers-guide/unique-weapons#thump-thump
body: A pre-war grenade launcher with a hand-scratched nickname along the receiver. A settler's kept
  it running for forty years.
---
id: great-bear-grenade-rifle
type: item
name: Great Bear Grenade Rifle
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique, blast]
effect: d10 blast. Enhanced against detachments.
note: Grenade rifle
source: overseers-guide/unique-weapons#great-bear-grenade-rifle
body: The "Great Bear" — a pre-war U.S. military grenade rifle from the Sino-American War, the model
  the Chinese tried and failed to mass-produce. Found in a sealed case out past the edge of the 
  wasteland, a white Army star still on the stock.
---
id: red-victory-grenade-rifle
type: item
name: Red Victory Grenade Rifle
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique, blast]
effect: d10 blast. Once per session, a single fired grenade does not count against the wielder's 
  ammo.
note: Grenade rifle
source: overseers-guide/unique-weapons#red-victory-grenade-rifle
body: Its Chinese counterpart — the pre-war Chinese People's Army grenade rifle, still polished, 
  still loaded.
---
id: holy-frag-grenade
type: item
name: Holy Frag Grenade
category: 'Unique weapons: Heavy Weapons'
damage: d10
uses: 1
qualities: [unique, blast]
effect: Ignores 2 Armor — the blast is simply bigger than anything that size should be.
note: Blessed frag grenade
source: overseers-guide/unique-weapons#holy-frag-grenade
body: A pre-war frag grenade painted with a cross and prayed over by a long-dead priest in a Nevada 
  chapel. It is genuinely more powerful. The party may debate whether that is the paint.
---
id: final-judgment
type: item
name: Final Judgment
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
effect: d12 blast. Every knight in the Commonwealth knows it on sight.
note: Gatling laser
source: overseers-guide/unique-weapons#final-judgment
body: Elder Arthur Maxson's personal Gatling laser, carried down from the Prydwen's bridge on the 
  rare day the Brotherhood's elder takes the field himself.
---
id: the-red-glare
type: item
name: The Red Glare
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
ammo: rocket canisters
effect: d12 blast. Feeds from rocket canisters.
note: Rocket launcher
source: overseers-guide/unique-weapons#the-red-glare
body: A pre-war rapid-fire rocket launcher from the Divide's silo works, feeding from boxed rocket 
  canisters. Its exhaust paints the dust red for a hundred yards.
---
id: k9000-cyberdog-gun
type: item
name: K9000 Cyberdog Gun
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d8
qualities: [unique]
ammo: .357 Magnum
effect: Once per combat, when the name of a lost dog is spoken to it, its next attack is Enhanced.
note: Cyberdog-brained smartgun
source: overseers-guide/unique-weapons#k9000-cyberdog-gun
body: A Big MT smartgun with a living dog's brain suspended in the receiver tank. It growls at 
  targets, whimpers at thunder, and loves exactly one person at a time.
---
id: tesla-cannon-unique
type: item
name: Tesla Cannon
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
ammo: electron charge pack
effect: Ignores 1 Armor against power armor and robots. 6 shots/day; the electron charge pack 
  recovers overnight.
note: Tesla cannon
source: overseers-guide/unique-weapons#tesla-cannon
body: The Brotherhood's clean rebuild of the pre-war Tesla cannon — Scribe Vallincourt's design, 
  wound around the Olney Powerworks coil and built to crack Enclave Hellfire armor over Adams Air 
  Force Base.
---
id: admirals-friend
type: item
name: Admiral's Friend
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d10
qualities: [unique]
ammo: harpoons
effect: Attacks against a target at full HP are Enhanced.
note: Harpoon gun
source: overseers-guide/unique-weapons#admirals-friend
body: The Mariner's pre-war harpoon gun, kept oiled against the Fog on the wall of Far Harbor's last
  shipwright. It has put down things bigger than boats.
---
id: v63-helga
type: item
name: V63-HELGA
category: 'Unique weapons: Heavy Weapons'
damage: d12
qualities: [unique, blast]
effect: Unlike other Gatling lasers, HELGA is not bulky.
note: Gatling laser
source: overseers-guide/unique-weapons#v63-helga
body: A Gatling laser in Vault 63 livery, stripped from the arsenal of the vault's Storm Goliaths. 
  Its engineers built it light enough to carry down a vault corridor at a run.
---
id: valkyrie
type: item
name: Valkyrie
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d12
qualities: [unique, blast]
effect: Its blast sweeps a 30-foot cone in front of the wielder. It drains one fusion core every two
  fights instead of every fight.
note: Gatling laser
source: overseers-guide/unique-weapons#valkyrie
body: A Gatling laser in Enclave black with a white thirteen-star roundel, recovered from the 
  Gleaming Depths, the Enclave's sealed facility beneath the Ash Heap. Built to Enclave tolerances 
  and never meant to leave the bunker.
---
id: holy-fire
type: item
name: Holy Fire
category: 'Unique weapons: Heavy Weapons'
size: bulky
damage: d8
qualities: [unique, blast]
effect: A target it hits catches fire, taking d4 STR each round until it spends an action to put the
  blue fire out (see Hazards → Fire). Once per round, when the wielder deals damage with it, they 
  restore 1 HP.
note: Flamer
source: overseers-guide/unique-weapons#holy-fire
body: A flamer repainted with the sigils of the Cult of the Mothman that burns a cold, eerie blue. 
  The Blue Ridge Caravan Company pays one out now and then to guards who bring a caravan home 
  through the worst of Appalachia.
---
id: occams-razor
type: item
name: Occam's Razor
category: 'Unique weapons: Melee — Bladed'
damage: d8
qualities: [unique]
effect: d8 instead of d6. Ignores 1 point of Armor.
note: Combat knife, pre-war
source: overseers-guide/unique-weapons#occams-razor
body: A small blade whose edge appears to have been sharpened past the physical limit of its metal. 
  Cuts simply. Cuts beautifully.
---
id: stabhappy
type: item
name: Stabhappy
category: 'Unique weapons: Melee — Bladed'
damage: d8
qualities: [unique]
effect: Ignores 2 Armor. The shiv snaps and is destroyed on a natural 20 on any save while you wield
  it.
note: Prison shiv
source: overseers-guide/unique-weapons#stabhappy
body: A toothbrush, a piece of glass, and something terrible that happened in a pre-war prison.
---
id: chances-knife
type: item
name: Chance's Knife
category: 'Unique weapons: Melee — Bladed'
damage: d8
qualities: [unique]
effect: Deals d8 instead of d6. The wielder becomes marked — somewhere a very dangerous man is now 
  looking for them.
note: Combat knife
source: overseers-guide/unique-weapons#chances-knife
body: A combat knife left on a specific grave, for a specific reason, by a specific man. Taking it 
  invites a specific kind of trouble.
---
id: blood-nap
type: item
name: Blood-Nap
category: 'Unique weapons: Melee — Bladed'
damage: d8
qualities: [unique]
effect: d8. The wielder's first melee attack of any combat is Enhanced.
note: Pre-war bowie knife
source: overseers-guide/unique-weapons#blood-nap
body: A heavy bowie knife sticking out of a street lamp in the Divide. Its edge is always sharper 
  than it should be.
---
id: liberator-unique
type: item
name: Liberator
category: 'Unique weapons: Melee — Bladed'
damage: d8
qualities: [unique]
effect: Deals d8 instead of d6. Ignores 1 Armor.
note: Machete
source: overseers-guide/unique-weapons#liberator
body: A Chinese officer's machete recovered from a pre-war battlefield. Carried by a Legion decanus 
  who called himself Dead Sea.
---
id: jingweis-shocksword
type: item
name: Jingwei's Shocksword
category: 'Unique weapons: Melee — Bladed'
damage: d10
qualities: [unique]
effect: Deals d10 instead of d8 and ignores 1 Armor.
note: Pre-war Chinese officer's sword
source: overseers-guide/unique-weapons#jingweis-shocksword
body: A straight, Jian-style Chinese officer's sword with a built-in capacitor that delivers a jolt 
  on hit. General Jingwei's personal weapon, taken from the sealed Outcast armory after the 
  Anchorage simulation.
---
id: shishkebab-unique
type: item
name: Shishkebab
category: 'Unique weapons: Melee — Bladed'
size: bulky
damage: d10
qualities: [unique]
ammo: flamer fuel
effect: d10. Targets hit catch fire (1 STR per round for 2 rounds).
note: Flaming sword
source: overseers-guide/unique-weapons#shishkebab
body: A lawnmower blade welded to a pilot light and a fuel tank, held like a sword, the whole thing 
  burning as long as the fuel holds.
---
id: gehenna
type: item
name: Gehenna
category: 'Unique weapons: Melee — Bladed'
size: bulky
damage: d10
qualities: [unique]
ammo: flamer fuel
effect: d10. Targets hit catch fire (1 STR per round for 3 rounds instead of 2).
note: Shishkebab, refined
source: overseers-guide/unique-weapons#gehenna
body: A pre-war artisan's hand-built shishkebab using factory-grade ceramics. The fuel tank is 
  chromed. The handle is perfect.
---
id: ants-sting
type: item
name: Ant's Sting
category: 'Unique weapons: Melee — Bladed'
damage: d6
qualities: [unique]
effect: d6. On a hit, target makes a STR save or loses 1 DEX until a rest.
note: Giant ant knife
source: overseers-guide/unique-weapons#ants-sting
body: A pre-war combat knife tipped with a preserved giant ant stinger. The stinger secretes a mild 
  pre-war toxin.
---
id: butchs-toothpick
type: item
name: Butch's Toothpick
category: 'Unique weapons: Melee — Bladed'
damage: d8
qualities: [unique]
effect: d8 instead of d6.
note: Switchblade
source: overseers-guide/unique-weapons#butchs-toothpick
body: A pre-war switchblade belonging to a vault dweller turned Tunnel Snake. Still mint.
---
id: ritual-knife
type: item
name: Ritual Knife
category: 'Unique weapons: Melee — Bladed'
damage: d6
qualities: [unique]
effect: d6. On a Critical Damage result, the target takes an additional d4 to WIL.
note: Ceremonial knife
source: overseers-guide/unique-weapons#ritual-knife
body: A long pre-war ceremonial knife recovered from the Blackhall ritual site. The blade is black 
  stone with a pre-war handle.
---
id: samurais-sword
type: item
name: Samurai's Sword
category: 'Unique weapons: Melee — Bladed'
damage: d8
qualities: [unique]
effect: d8. Enhanced against unarmored targets.
note: Pre-war Japanese katana
source: overseers-guide/unique-weapons#samurais-sword
body: A pre-war feudal Japanese katana preserved in an alien stasis cell for centuries. The edge has
  not dulled.
---
id: slasher-knife
type: item
name: Slasher Knife
category: 'Unique weapons: Melee — Bladed'
damage: d6
qualities: [unique]
effect: d6. In tight spaces (vents, crawlways, closets), the wielder cannot be detected by sound 
  alone.
note: Pre-war serrated combat knife
source: overseers-guide/unique-weapons#slasher-knife
body: A pre-war serrated knife found in a dog house beside an abandoned pre-war suburb. The handle 
  is still tacky.
---
id: toy-knife
type: item
name: Toy Knife
category: 'Unique weapons: Melee — Bladed'
damage: d4
qualities: [unique]
effect: d4. Targets hit by it have no memory of being wounded by a child's weapon.
note: Child's pre-war toy knife
source: overseers-guide/unique-weapons#toy-knife
body: A child's pre-war plastic toy knife — except this one is a real knife with a child's paint 
  job. It was left in a bush near a detention camp, on a wooden crate.
---
id: trench-knife
type: item
name: Trench Knife
category: 'Unique weapons: Melee — Bladed'
damage: d8
qualities: [unique]
effect: Deals d8 instead of d6. Enhanced on a grappled or disarmed target.
note: Pre-war combat knife with brass knuckles
source: overseers-guide/unique-weapons#trench-knife
body: A pre-war officer's combat knife with an integrated knuckle-duster grip, recovered from the 
  sealed Outcast armory after the Anchorage simulation.
---
id: vampires-edge
type: item
name: Vampire's Edge
category: 'Unique weapons: Melee — Bladed'
damage: d10
qualities: [unique]
effect: Deals d10 instead of d8. On a Critical Damage result, the wielder restores 1 HP.
note: Pre-war Chinese officer's sword
source: overseers-guide/unique-weapons#vampires-edge
body: A Chinese officer's sword that was kept in a locked cabinet in a vault of pre-war vampires — 
  or people who very much believed they were pre-war vampires.
---
id: the-dismemberer
type: item
name: The Dismemberer
category: 'Unique weapons: Melee — Bladed'
size: bulky
damage: d10
qualities: [unique]
effect: d10. Enhanced against a target who has already taken HP damage this combat.
note: Fire axe
source: overseers-guide/unique-weapons#the-dismemberer
body: A pre-war fire axe and the prize of Plik, a Point Lookout ghoul who runs a paid feral-ghoul 
  safari for rich hunters. He hands it over to whoever survives the hunt; his customers usually 
  aren't the ones who come home.
---
id: blade-of-the-east
type: item
name: Blade of the East
category: 'Unique weapons: Melee — Bladed'
size: bulky
damage: d10
qualities: [unique]
effect: d10. Requires STR 14 to wield. Any PC with lower STR attacks at Impaired and takes 1 STR 
  damage per swing.
note: Bumper sword
source: overseers-guide/unique-weapons#blade-of-the-east
body: A gigantic pre-war blade cut from a car bumper by Legate Lanius and ground to a razor's edge. 
  Nobody else can lift it comfortably.
---
id: chopper
type: item
name: Chopper
category: 'Unique weapons: Melee — Bladed'
damage: d6
qualities: [unique]
effect: d6. Enhanced against unarmored targets.
note: Cleaver
source: overseers-guide/unique-weapons#chopper
body: A pre-war butcher's cleaver found on a stove in a ranch house. Still clean.
---
id: figaro
type: item
name: Figaro
category: 'Unique weapons: Melee — Bladed'
damage: d4
qualities: [unique]
effect: d4. Ignores 2 Armor. On a Critical Damage result, the wielder may re-roll one Reaction roll 
  per session after delivering a story with the blade still in hand.
note: Straight razor
source: overseers-guide/unique-weapons#figaro
body: A pre-war straight razor belonging to a barber-impersonator who worked at the King's. Carries 
  a memory of small talk.
---
id: knock-knock
type: item
name: Knock-Knock
category: 'Unique weapons: Melee — Bladed'
size: bulky
damage: d10
qualities: [unique]
effect: d10. Any locked door or barrier can be broken down in one round of work.
note: Fire axe
source: overseers-guide/unique-weapons#knock-knock
body: A pre-war fire axe recovered from a Camp Searchlight fire station. Used, according to its 
  holotape, to break doors nobody wanted opened.
---
id: man-opener
type: item
name: Man Opener
category: 'Unique weapons: Melee — Bladed'
size: bulky
damage: d10
qualities: [unique]
ammo: fusion cell
effect: d10. Ignores 2 points of Armor against medium and heavy armor.
note: Auto-axe
source: overseers-guide/unique-weapons#man-opener
body: A pre-war cutting auto-axe modified to tear apart combat armor like wet paper. Found on a bed 
  in the upper steelyard, left behind by someone who didn't make it back.
---
id: the-mauler
type: item
name: The Mauler
category: 'Unique weapons: Melee — Bladed'
size: bulky
damage: d10
qualities: [unique]
ammo: fusion cell
effect: d10. Once per combat, the next swing is Enhanced.
note: Auto-axe
source: overseers-guide/unique-weapons#the-mauler
body: A refined Pitt auto-axe given as a reward for 80 steel ingots delivered. The teeth have been 
  re-cast twice.
---
id: pickmans-blade
type: item
name: Pickman's Blade
category: 'Unique weapons: Melee — Bladed'
damage: d8
qualities: [unique]
effect: Deals d8 instead of d6. On Critical Damage, the target also takes 1 STR damage from bleed. 
  The wielder may, once per session, paint a small pre-war-style portrait in their victim's blood — 
  worth 50 caps to a collector who does not look too closely. Carrying the blade longer than a week 
  requires a WIL save each session; on a fail, the paintings want to be more ambitious.
note: Combat knife
source: overseers-guide/unique-weapons#pickmans-blade
body: A hand-ground pre-war combat knife kept in the artist's studio of a serial-killing pre-war 
  painter from the Boston ruins. The handle is wrapped in dried skin. The blade is disturbingly 
  clean.
---
id: protonic-inversal-axe
type: item
name: Protonic Inversal Axe
category: 'Unique weapons: Melee — Bladed'
size: bulky
damage: d10
qualities: [unique]
ammo: fusion cell
effect: One fusion cell powers the blade for one scene. Enhanced vs. robots.
note: Proton axe, Big MT prototype
source: overseers-guide/unique-weapons#protonic-inversal-axe
body: A Big MT demolition axe whose edge is a field of inverted protons instead of steel. The blade 
  hisses where it touches the air.
---
id: grants-saber
type: item
name: Grant's Saber
category: 'Unique weapons: Melee — Bladed'
damage: d8
qualities: [unique]
effect: Once per combat, when the wielder raises it and gives an order, every ally who hears 
  automatically passes their next save against fear or Morale. The Order of Mysteries can reforge it
  into a Blade of Bastet (see Relics), which consumes the saber.
note: Cavalry saber
source: overseers-guide/unique-weapons#grants-saber
body: Ulysses S. Grant's own Civil War saber, carried through the Vicksburg campaign after he lost 
  his first sword at the Battle of Champion Hill, and kept under glass at the Whitespring Resort 
  before the war.
---
id: oh-baby
type: item
name: Oh, Baby!
category: 'Unique weapons: Melee — Blunt'
size: bulky
damage: d12
qualities: [unique]
effect: d12 instead of d10. Critical Damage causes the target to fly ten feet.
note: Super sledge
source: overseers-guide/unique-weapons#oh-baby
body: A modified super sledge whose hydraulic strike has been tuned to rupture instead of compress.
---
id: fawkes-super-sledge
type: item
name: Fawkes' Super Sledge
category: 'Unique weapons: Melee — Blunt'
size: bulky
damage: d12
qualities: [unique]
effect: d12 instead of d10. Requires STR 16 to wield. d6 STR damage to any human wielder per swing.
note: Super sledge
source: overseers-guide/unique-weapons#fawkes-super-sledge
body: A super sledge built for and wielded by a specific super mutant who remembers what he used to 
  be. Too heavy for a human.
---
id: the-break
type: item
name: The Break
category: 'Unique weapons: Melee — Blunt'
damage: d6
qualities: [unique]
effect: d6. The wielder's first swing in any combat scene at a bar, table, or tavern is Enhanced.
note: Pre-war pool cue
source: overseers-guide/unique-weapons#the-break
body: A pre-war pool cue kept on a slaver's pool table in Paradise Falls. The felt around the rack 
  still holds a blood stain.
---
id: highwaymans-friend
type: item
name: Highwayman's Friend
category: 'Unique weapons: Melee — Blunt'
damage: d8
qualities: [unique]
effect: d8 instead of d6.
note: Tire iron
source: overseers-guide/unique-weapons#highwaymans-friend
body: A tire iron that has been in a specific motorcycle's saddlebag for as long as anyone can 
  remember. Polished by hand.
---
id: the-board-of-education
type: item
name: The Board of Education
category: 'Unique weapons: Melee — Blunt'
size: bulky
damage: d10
qualities: [unique]
effect: d10 instead of d8.
note: Nail-board, pre-war
source: overseers-guide/unique-weapons#the-board-of-education
body: A nail-studded board with an elementary school principal's name and a pre-war disciplinary 
  record still taped to it.
---
id: the-tenderizer
type: item
name: The Tenderizer
category: 'Unique weapons: Melee — Blunt'
size: bulky
damage: d12
qualities: [unique]
effect: d12 instead of d10. Critical Damage inflicts −1 STR on the target after stabilization.
note: Pre-war sledgehammer
source: overseers-guide/unique-weapons#the-tenderizer
body: A pre-war industrial tenderizing hammer from a slaughterhouse. Polished handle, scarred head.
---
id: fertilizer-shovel
type: item
name: Fertilizer Shovel
category: 'Unique weapons: Melee — Blunt'
damage: d6
qualities: [unique]
effect: d6. Enhanced against plant-based or fungus-based creatures (spore carriers, vault mold, 
  punga creepers).
note: Pre-war shovel
source: overseers-guide/unique-weapons#fertilizer-shovel
body: A pre-war farm shovel handed to a visitor by the keeper of the punga fields at the Ark & Dove 
  Cathedral. The ritual is opaque.
---
id: electro-suppressor
type: item
name: Electro-Suppressor
category: 'Unique weapons: Melee — Blunt'
damage: d8
qualities: [unique]
effect: d8. Once per combat, on a hit, the target makes a WIL save or loses its next action — 
  attacks against it are Enhanced for that round. Enhanced against robots.
note: Pre-war shock baton
source: overseers-guide/unique-weapons#electro-suppressor
body: A pre-war police electro-baton with a cracked housing but a working charge. The grip is still 
  factory rubber.
---
id: repellent-stick
type: item
name: Repellent Stick
category: 'Unique weapons: Melee — Blunt'
damage: d6
qualities: [unique]
effect: d6. Wild animals (mole rats, radroaches, bloatflies) will not attack the wielder first.
note: Pre-war wooden club
source: overseers-guide/unique-weapons#repellent-stick
body: A pre-war stick with a crude red stripe painted around it, given by Moira Brown as a joke. It 
  works because it is supposed to work.
---
id: nephis-golf-driver
type: item
name: Nephi's Golf Driver
category: 'Unique weapons: Melee — Blunt'
damage: d6
qualities: [unique]
effect: d6. On a hit, the target makes a STR save or is knocked flat — they lose their next action 
  getting up.
note: 9-iron golf club
source: overseers-guide/unique-weapons#nephis-golf-driver
body: A chem-addled Fiend chieftain's pre-war 9-iron. The grip is wrapped in electrical tape and 
  psycho residue.
---
id: nuka-breaker
type: item
name: Nuka-Breaker
category: 'Unique weapons: Melee — Blunt'
damage: d8
qualities: [unique]
effect: d8. The noise of it triggers Ruin Events at double rate the first time it is swung.
note: Rebar club
source: overseers-guide/unique-weapons#nuka-breaker
body: A rebar club wrapped in Nuka-Cola bottle caps and rebar wire. Every swing rattles.
---
id: the-humble-cudgel
type: item
name: The Humble Cudgel
category: 'Unique weapons: Melee — Blunt'
damage: d8
qualities: [unique]
effect: d8 instead of d6. While held, the wielder cannot be Panicked.
note: Lead pipe
source: overseers-guide/unique-weapons#the-humble-cudgel
body: A pre-war lead pipe recovered from a sealed sewer — a blind man's weapon, used carefully over 
  many years.
---
id: x-2-antenna
type: item
name: X-2 Antenna
category: 'Unique weapons: Melee — Blunt'
size: bulky
damage: d8
qualities: [unique]
effect: d8. On a Critical Damage result, the target's radio and Pip-Boy go dead for a scene.
note: Pre-war communications antenna
source: overseers-guide/unique-weapons#x-2-antenna
body: A pre-war satellite antenna pried from a Big MT transmitter array. Heavy enough to hit like a 
  club, long enough to hold like a staff.
---
id: old-glory
type: item
name: Old Glory
category: 'Unique weapons: Melee — Blunt'
size: bulky
damage: d10
qualities: [unique]
effect: d10. Enhanced against targets wearing faction colors (NCR, Legion, or Brotherhood). The 
  wielder's Reaction rolls improve one step with NCR veterans and pre-war survivors who recognize 
  the flag.
note: Pre-war flagpole staff
source: overseers-guide/unique-weapons#old-glory
body: An Old World flag staff carried by Ulysses — the "Flag-Bearer" of the Divide. The flag is 
  tattered but still readable. The weapon is heavier than it looks and swings like a war-staff.
---
id: dunwich-bobber
type: item
name: Dunwich Bobber
category: 'Unique weapons: Melee — Blunt'
size: bulky
damage: d10
qualities: [unique]
effect: d10 instead of d8. In any round the wielder is in darkness, attacks from the bat are 
  Enhanced — they hear a low voice in the back of their head whispering targets. Carrying the bat 
  long-term requires a WIL save each session — on a fail, the bat has begun speaking in the 
  wielder's own voice while they sleep.
note: Pre-war baseball bat
source: overseers-guide/unique-weapons#dunwich-bobber
body: A lacquered pre-war baseball bat found in a Dunwich Borers facility. The grip is wrapped in 
  old leather and stained with a substance that does not match any known wasteland blood. Cold to 
  the touch.
---
id: two-step-goodbye
type: item
name: Two-Step Goodbye
category: 'Unique weapons: Unarmed'
size: bulky
damage: d10
qualities: [unique]
effect: d10 on impact. The first target it hits each combat takes another d10 two rounds later. Even
  if they run.
note: Ballistic fist
source: overseers-guide/unique-weapons#two-step-goodbye
body: A ballistic fist whose shotgun discharge has been replaced with a pre-war research charge that
  delays its effect.
---
id: pushy
type: item
name: Pushy
category: 'Unique weapons: Unarmed'
damage: d10
qualities: [unique]
effect: d10 instead of d8. Critical Damage hurls the target up to 30 feet.
note: Displacer glove
source: overseers-guide/unique-weapons#pushy
body: A displacer glove tuned past factory specifications. Pushes very, very hard.
---
id: the-shocker
type: item
name: The Shocker
category: 'Unique weapons: Unarmed'
size: bulky
damage: d10
qualities: [unique]
ammo: fusion cell
effect: Enhanced against robots. The glove snaps and is destroyed on a natural 20 on any save while 
  you wield it.
note: Power fist, FSGv118-b model
source: overseers-guide/unique-weapons#the-shocker
body: A pre-war prototype power fist — the FSGv118-b "Shocker glove" — recovered with its holotaped 
  instructions from the flooded metro west of Arlington Library. The instructions warn it is 
  unstable. It wears out faster than a standard power fist.
---
id: fisto
type: item
name: Fisto!
category: 'Unique weapons: Unarmed'
size: bulky
damage: d12
qualities: [unique]
ammo: fusion cell
effect: d12 instead of d10. On a Critical Damage result, the target is flung 10 feet.
note: Pre-war power fist
source: overseers-guide/unique-weapons#fisto
body: A pre-war manufacturing-grade power fist recovered from a dead reactor technician. The name is
  scratched into the palm plate.
---
id: plunketts-valid-points
type: item
name: Plunkett's Valid Points
category: 'Unique weapons: Unarmed'
damage: d8
qualities: [unique]
effect: d8 instead of d6. On Critical Damage, target takes an additional d4 to STR.
note: Pre-war spiked knuckles
source: overseers-guide/unique-weapons#plunketts-valid-points
body: A pair of pre-war spiked knuckles taken off a dead noble's great-great-great grandson in a 
  pre-war cemetery.
---
id: fist-of-the-north-rawr
type: item
name: Fist of the North Rawr
category: 'Unique weapons: Unarmed'
size: bulky
damage: d12
qualities: [unique]
effect: d12 instead of d10. Ignores 1 Armor against any creature larger than the wielder.
note: Deathclaw gauntlet
source: overseers-guide/unique-weapons#fist-of-the-north-rawr
body: A deathclaw gauntlet made from the talon of Rawr, a named Divide deathclaw. Built from tribal 
  memory and pre-war parts on a workbench at the Courier's Mile.
---
id: cram-opener
type: item
name: Cram Opener
category: 'Unique weapons: Unarmed'
damage: d6
qualities: [unique]
effect: d6. Enhanced against targets with a carapace or metal plating.
note: Bladed gauntlet
source: overseers-guide/unique-weapons#cram-opener
body: A pre-war can-opener welded into a gauntlet. Started as a joke in a Freeside back alley and 
  got a lot of people killed.
---
id: dr-kleins-glove
type: item
name: Dr. Klein's Glove
category: 'Unique weapons: Unarmed'
damage: d4
qualities: [unique]
effect: d4. On a hit, target makes a WIL save or their next attack is Impaired.
note: Scientist's stun glove
source: overseers-guide/unique-weapons#dr-kleins-glove
body: A pre-war Big MT researcher's laboratory glove, rigged with a tiny shock discharge for 
  handling "irate subjects." Klein's name is etched into the thumb joint.
