id: paladin-toaster
type: item
name: Paladin Toaster
category: 'Unique weapons: Unarmed'
damage: d6
qualities: [unique]
effect: d6. Enhanced against robots and power armor.
note: Zap glove
source: overseers-guide/unique-weapons#paladin-toaster
body: A Brotherhood initiate's joke-gift — a pre-war toaster grafted to a gauntlet, still firing up 
  on a fusion cell. Found on a dead prospector in Black Rock Cave.
