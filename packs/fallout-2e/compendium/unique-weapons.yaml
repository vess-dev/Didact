id: embrace-of-the-mantis-king
type: item
name: Embrace of the Mantis King!
category: 'Unique weapons: Unarmed'
damage: d10
qualities: [unique]
effect: d10. On Critical Damage, target is grappled and cannot move for one round.
note: Mantis gauntlet
source: overseers-guide/unique-weapons#embrace-of-the-mantis-king
body: A pre-war tinker's hand-built mantis-claw gauntlet based on a pulp-magazine idea. Fitted with 
  actual chitinous blades.
