id: dr-mobius-glove
type: item
name: Dr. Mobius' Glove
category: 'Unique weapons: Unarmed'
damage: d4
qualities: [unique]
effect: d4. On a Critical Damage result, the wielder restores 1 STR.
note: Scientist's stun glove
source: overseers-guide/unique-weapons#dr-mobius-glove
body: The matched companion glove. Mobius used his for something completely different — a mercy. His
  name is scratched out.
