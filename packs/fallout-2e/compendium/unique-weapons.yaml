note: Yao guai gauntlet
source: overseers-guide/unique-weapons#shes-embrace
body: A tribal gauntlet built from the claws of a yao guai sow protecting her cubs. Given as a 
  rite-of-passage reward.
---
id: jack
type: item
name: Jack
category: 'Unique weapons: Unarmed'
size: bulky
damage: d10
