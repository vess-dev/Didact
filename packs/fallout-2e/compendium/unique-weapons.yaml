id: golden-gloves
type: item
name: Golden Gloves
category: 'Unique weapons: Unarmed'
damage: d6
qualities: [unique]
effect: d6 instead of d4. While worn, the wielder may re-roll one melee damage roll per session.
note: Pre-war boxing gloves
source: overseers-guide/unique-weapons#golden-gloves
body: A pair of pre-war championship boxing gloves kept on a bookshelf behind a Lucky 38 lounge bar.
  Still perfect, still gold.
