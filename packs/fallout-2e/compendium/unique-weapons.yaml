id: recompense-of-the-fallen
type: item
name: Recompense of the Fallen
category: 'Unique weapons: Unarmed'
damage: d8
qualities: [unique]
effect: d8. On a Critical Damage result, the wielder may name a dead ally; their next save counts as
  attribute +1.
note: Dog tag fist
source: overseers-guide/unique-weapons#recompense-of-the-fallen
body: A pre-war weighted glove stitched with dog tags from dead soldiers. Worn by a Legion centurion
  at Cottonwood Cove as a trophy.
