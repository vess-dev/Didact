id: greased-lightning
type: item
name: Greased Lightning
category: 'Unique weapons: Unarmed'
size: bulky
damage: d10
qualities: [unique]
ammo: fusion cell
effect: d10. Enhanced on the first punch each combat.
note: Power fist, greased
source: overseers-guide/unique-weapons#greased-lightning
body: A Brotherhood mechanic's personal power fist with a reinforced wrist and pistons re-packed 
  with pre-war grease. The name is still readable.
---
id: love-and-hate
type: item
name: Love and Hate
category: 'Unique weapons: Unarmed'
damage: d6
qualities: [unique]
effect: d6. The wielder's first punch each combat is Enhanced; the second is Impaired.
note: Pre-war spiked knuckles
source: overseers-guide/unique-weapons#love-and-hate
body: A pair of pre-war spiked knuckles with "LOVE" on the left and "HATE" on the right. Carried by 
  a Viper leader until the Viper leader was no longer a leader.
