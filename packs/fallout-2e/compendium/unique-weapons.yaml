id: bear-trap-fist
type: item
name: Bear Trap Fist
category: 'Unique weapons: Unarmed'
damage: d8
qualities: [unique]
effect: Enhanced against a grappled target.
note: Sprung bear-trap gauntlet
source: overseers-guide/unique-weapons#bear-trap-fist
body: A bear trap lashed over the knuckles and re-sprung to snap shut on impact — a Sierra Madre 
  villa special. Cocking it back is half the threat.
---
id: gatorclaw-gauntlet
type: item
name: Gatorclaw Gauntlet
category: 'Unique weapons: Unarmed'
size: bulky
damage: d10
qualities: [unique]
effect: d10, bulky. The claw is the whole argument.
note: Gatorclaw-claw gauntlet
source: overseers-guide/unique-weapons#gatorclaw-gauntlet
body: A gauntlet built around the cured foreclaw of a Nuka-World gatorclaw, lashed to a welder's 
  glove. The claw keeps its shine no matter what it goes through.
---
id: ogua-gauntlet
type: item
name: Ogua Gauntlet
category: 'Unique weapons: Unarmed'
size: bulky
damage: d10
qualities: [unique]
effect: While the wielder is at full HP, attacks with it are Enhanced. The beak crushes any lock, 
  chain, or bar in a single turn.
note: Skull gauntlet
source: overseers-guide/unique-weapons#ogua-gauntlet
body: A heavy gauntlet built from the beaked skull of an ogua, the Monongahela's giant 
  snapping-turtle cryptid, with the jaw rigged to snap shut on every punch. The Blue Ridge Caravan 
  Company awards them to guards who survive its worst runs.
