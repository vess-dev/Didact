source: overseers-guide/unique-armors#lincolns-hat--glasses
body: A tall black pre-war stovepipe hat and a matching pair of round wire-framed glasses, recovered
  from a sealed museum exhibit.
---
id: three-dogs-head-wrap
type: item
name: Three Dog's Head Wrap
category: 'Unique armors: Helmets & Headgear'
size: petty
qualities: [unique]
effect: While worn, the user can broadcast from any pre-war radio station without a WIL save to 
  operate it. Everybody in that broadcast area hears them, whether they want to or not.
source: overseers-guide/unique-armors#three-dogs-head-wrap
body: A pre-war radio DJ's well-loved bandana, sunglasses, and headset, kept together as a single 
  set by whoever last wore them.
---
id: ulysses-mask
type: item
name: Ulysses' Mask
category: 'Unique armors: Helmets & Headgear'
armor: 1
qualities: [unique]
effect: The wearer takes half Rads from the Divide specifically, cannot be identified by voice, and 
  NCR or Legion patrols who recognize the mask start Hostile.
source: overseers-guide/unique-armors#ulysses-mask
body: A pre-war gas mask sealed into a black skull-faced helmet, painted with a flag the wearer no 
  longer salutes.
---
id: the-dapper-hat
type: item
name: The Dapper Hat
category: 'Unique armors: Helmets & Headgear'
size: petty
qualities: [unique]
effect: Once per session, the wearer may treat a single Reaction roll with a stranger as one step 
  better.
source: overseers-guide/unique-armors#the-dapper-hat
body: A battered pre-war fedora with a bullet hole clean through the brim. Worn at an angle by 
  someone who had a story.
---
id: oasis-druid-hood
type: item
name: Oasis Druid Hood
category: 'Unique armors: Helmets & Headgear'
size: petty
qualities: [unique]
effect: The wearer is not attacked on sight by any plant- or fungus-based mutant (spore carrier, 
  punga creeper, vault mold). Lose the effect the first time the wearer cuts a living plant.
source: overseers-guide/unique-armors#oasis-druid-hood
body: A pre-war cowl of leaf-patterned fabric worn by the keepers of an irradiated grove deep in the
  Wastes. It smells of sap.
---
id: boones-1st-recon-beret
type: item
name: Boone's 1st Recon Beret
category: 'Unique armors: Helmets & Headgear'
size: petty
qualities: [unique]
effect: Once per session, the wearer may declare a single long-range shot is Enhanced.
source: overseers-guide/unique-armors#boones-1st-recon-beret
body: The red beret of an NCR First Recon sniper. Faded to brick, salt-crusted inside the band.
---
id: the-mechanists-helmet
type: item
name: The Mechanist's Helmet
category: 'Unique armors: Helmets & Headgear'
armor: 1
qualities: [unique]
effect: The voice filter makes the wearer's first intimidation attempt each session succeed without 
  a save.
note: stacks up to the cap of 3
source: overseers-guide/unique-armors#the-mechanists-helmet
body: The Mechanist's silver-age helmet, voice filter and all — the mask a sleepless engineer wore 
  to sound like a god.
---
id: silver-shroud-costume
type: item
name: Silver Shroud Costume
category: 'Unique armors: Costumes'
armor: 0
size: petty
qualities: [unique]
effect: Reaction rolls with anyone who remembers pre-war radio serials shift one step better. Once 
  per session, the wearer may declare a line of Silver-Shroud-style dialogue — one hostile NPC must 
  flee or comply for one round. No save; the persona is that strong.
source: overseers-guide/unique-armors#silver-shroud-costume
body: A pre-war detective-serial costume — black coat, fedora, scarf. Comes with a lapel pin that 
  activates a voice filter when the costume is worn openly.
---
id: grognak-costume
type: item
name: Grognak Costume
category: 'Unique armors: Costumes'
armor: 1
qualities: [unique]
effect: Unarmed and melee attacks are Enhanced on the wearer's first swing of any combat.
source: overseers-guide/unique-armors#grognak-costume
body: The genuine pre-war studio article in real leather — no convention cardboard — fur loincloth, 
  skull helm, wrist bracers. Ridiculous and strangely intimidating when worn unironically.
