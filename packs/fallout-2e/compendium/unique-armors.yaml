id: pre-war-executives-suit
type: item
name: Pre-war Executive's Suit
category: 'Unique armors: Costumes'
armor: 0
size: petty
qualities: [unique]
effect: +1 to Reaction rolls with any merchant, caravaneer, or pre-war ghoul who remembers business.
source: overseers-guide/unique-armors#pre-war-executives-suit
