id: fallout-2e
name: Fallout 2e
kind: system
version: 0.1.0
description: >-
  Fallout 2e: a wasteland hack of Cairn Second Edition. Scavengers, raiders, vault dwellers and
  ghouls picking their way through the ruins of the old world for caps, relics, scrap and reasons
  to keep going. Built on the cairn-2e pack: its saves, attacks, scars and critical damage, with
  Rads and Rad Scars, ghoulification, addiction and chems, perk magazines, scrap and crafting,
  power armor, vehicles, companions, faction reputation, party karma and settlements; the fifty
  backgrounds, the bestiary, the marketplace, the relics, unique weapons and armors, and the
  seed procedures, playable in Didact.
requires: {packs: [core, cairn-2e]}
extends: [cairn-2e]
# What of cairn-2e has no place in a Fallout 2e world (GUIDE.md, "What is hidden and what is
# inherited"): its compendium, reference text and glossary (this pack's stand in), every table
# but the two Fallout rolls as they are, the spellbook type, and the generators, rule and option
# with no Fallout counterpart. Cast, the dungeon seed and the forest seed are replaced by a stop
# that names the Fallout command instead.
hides:
  type: [spellbook]
  table: ["*", "!die-of-fate", "!head-wound"]
  action: [faction-action]
  option: [unusual-weather]
  entry: ["*"]
  generator: [spellbook, realm, pointcrawl, point-of-interest]
  reference: ["*"]
  term: ["*"]
license:
  spdx: CC-BY-SA-4.0
  redistributable: true
  attribution: >-
    Fallout 2e, a wasteland hack of Cairn Second Edition by Yochai Gal (cairnrpg.com), which is
    released under CC BY-SA 4.0; Fallout 2e is likewise released under CC BY-SA 4.0. Rules
    chassis: Yochai Gal, Cairn Second Edition (CC BY-SA 4.0). Conversion, tables, and setting
    text: fan work, CC BY-SA 4.0. This is an unofficial, non-commercial fan work. "Fallout" is a
    trademark of Bethesda Softworks / ZeniMax; this hack uses the Fallout milieu as generic
    post-apocalyptic flavor for home play only. This pack adapts its text and tables to Didact's
    format and is shared under the same license.
