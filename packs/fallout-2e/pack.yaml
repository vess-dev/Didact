# Settings go on top of cairn-2e's, key by key: the parent's watches (morning, afternoon, night)
# are Fallout's too; what differs is set here, each key whole.
settings:
  # A turn is "a few minutes of focused action" (core-rules#time-units--rest): five minutes here.
  time_units: {round: 10, turn: 300}
  combat:
    mode: sides
    first: party
    round_one: >-
      In the first round, each PC must pass a DEX save to act: `didact do save who=<pc> attr=DEX`
      (items, abilities, a Turbo dose or the fiction may bypass it; untrained in power armor, it
      fails automatically). Those who fail lose their turn, and a Panicked PC doesn't act in the
      first round. Then the enemies act; after that sides alternate, PCs first, each side's
      results simultaneous.
    attack: attack
  factions: {turn: faction-turn}
  names: {npc: first-names, place: place-names, poi: poi-names, faction: faction-names}
