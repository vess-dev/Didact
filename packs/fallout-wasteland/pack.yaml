id: fallout-wasteland
name: The Wasteland (Fallout 2e's campaigns and vaults)
kind: setting
version: 0.1.0
description: >-
  The setting of the Fallout 2e book, for either Fallout system (fallout-2e or grimfall): its
  21 campaign frames from the Capital Wasteland to Atlantic City, the vault catalog, and the canon
  they stand on. The real calendar from the book's own default moment, two centuries after the
  war; canon that comes up in play as lore; the frames' places, people, threats (each system's
  numbers) and clocks, ready to start with one generator; the vaults; the factions; and the frames
  and vaults as searchable text.
# Only core: a setting enabled in a world whose system is fallout-2e or grimfall (or any other).
# Each system's numbers ride in the entries' `mechanics.<system>` blocks (GUIDE.md).
requires: {packs: [core]}
license:
  spdx: CC-BY-SA-4.0 AND LicenseRef-Grimfall
  redistributable: true
  attribution: >-
    Fallout 2e, a wasteland hack of Cairn Second Edition by Yochai Gal (cairnrpg.com), which is
    released under CC BY-SA 4.0; Fallout 2e is likewise released under CC BY-SA 4.0. Rules
    chassis: Yochai Gal, Cairn Second Edition (CC BY-SA 4.0). Conversion, tables, and setting
    text: fan work, CC BY-SA 4.0. This is an unofficial, non-commercial fan work. "Fallout" is a
    trademark of Bethesda Softworks / ZeniMax; this hack uses the Fallout milieu as generic
    post-apocalyptic flavor for home play only. This pack adapts the book's campaign frames and
    vault catalog to Didact's format and is shared under the same license; the threat cards it
    carries for Grimfall are Grimfall's (an unofficial fan work adapted from Grimwild by J. D.
    Maxwell, CC BY 4.0, by way of Grimwild: Community Edition) and keep Grimfall's own terms:
    play them at your table, change them, pass them on — just don't sell them.
