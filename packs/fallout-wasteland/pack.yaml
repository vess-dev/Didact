settings:
  # The real calendar: the real week, the real months, February's leap day every 4th year (not
  # every 100th, but every 400th). It starts at the book's own default moment: the implied
  # setting is "two centuries after the war that ended the old world" (Player's Guide, The
  # Commonwealth of Ashes), and the war was 23 October 2077, so 23 October 2277, a Tuesday. A
  # frame on another date opens on it (`campaign new --date`, `time set`): GUIDE.md, "The
  # calendar". The seasons are the real ones, by name as Fallout 2e's weather tables read them, so
  # its new-day trigger rolls the day's weather. The holidays are the two the book names with a
  # date of their own; it also names Thanksgiving and Fasnacht, which move from year to year
  # (GUIDE.md).
  calendar:
    hours: 24
    week: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
    months:
      - {name: January, days: 31}
      - {name: February, days: 28, leap: [4, 100, 400]}
      - {name: March, days: 31}
      - {name: April, days: 30}
      - {name: May, days: 31}
      - {name: June, days: 30}
      - {name: July, days: 31}
      - {name: August, days: 31}
      - {name: September, days: 30}
      - {name: October, days: 31}
      - {name: November, days: 30}
      - {name: December, days: 31}
    start: {year: 2277, month: 10, day: 23, weekday: Tuesday}
    seasons:
      - {name: spring, month: 3, day: 20}
      - {name: summer, month: 6, day: 21}
      - {name: fall, month: 9, day: 22}
      - {name: winter, month: 12, day: 21}
    holidays:
      - {name: Christmas Eve, month: 12, day: 24, text: "The night the Responders took Rosalynn Jeffries alive and let David Thorpe believe she was dead (Fallout 76, 2082)."}
      - {name: Christmas, month: 12, day: 25, text: "Christmas morning, 2082: David Thorpe blew the Summersville Dam and drowned Charleston (Fallout 76). Pre-war broadcasts promised victory by Christmas."}
