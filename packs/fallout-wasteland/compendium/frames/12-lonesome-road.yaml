# Lonesome Road (campaigns/12-lonesome-road): written by fw_compendium.py, don't edit by hand.
# The frame's quest, region, places, cast, threats (Fallout 2e's numbers, and Grimfall's
# card where its Bestiary has the threat) and clocks.
id: lonesome-road
type: quest
name: Lonesome Road
tags: [lonesome-road, frame, side-arc]
goal: An eyebot — ED-E — arrives at the party's feet with a looping signal from the Divide. The 
  voice is Ulysses, a former frumentarius turned courier, calling one of the PCs out by name. He 
  blames them for the Divide's destruction — a load the PC dropped there years ago triggered a chain
  reaction of dormant nukes. Ulysses now holds the codes for two more missiles, aimed at the NCR and
  Caesar's Legion. He wants the party to come to him. He wants them to choose what the missiles hit.
  He wants the called PC to understand.
date: Wednesday, 19 October 2281
body: |-
  *A man called Ulysses knows a Courier's name. He has been waiting for them in the Divide — a cracked, dust-choked no-man's-land west of the Mojave, built on the bones of a community the Courier buried without realizing it. He has a nuclear launch code and an ugly truth.*

  ## GM notes

  **Date.** Wednesday, 19 October 2281: a New Vegas side arc: that frame's date, or whenever ED-E arrives. Open a campaign on it with `didact campaign new <id> --date 'Wednesday, 19 October 2281'`, or move one there with `didact time set 'Wednesday, 19 October 2281'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Lonesome Road tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** This is the most personal campaign in the book. One PC must be singled out as the Courier Ulysses is speaking to. If no existing PC fits, a new one can be rolled with the Courier background (see Backgrounds) and a Bond that ties them to the Divide.

  **Plot beats.**

  1. The Eyebot at the Door. ED-E arrives at the party's current settlement with a looping Ulysses transmission. The eyebot is damaged; fixing it is the first scene (a DEX save; a Tinker needs no save). When ED-E boots, it plays the Courier's own voice from a delivery the PC does not remember making. Something in the recording is not a greeting.
  2. The Canyon Wreckage. The party enters the Divide. Ulysses speaks on the radio, not yet naming the PC, but addressing a "Courier" the other party members may not realize is one of theirs. The wreckage of a pre-war trade road stretches ahead. ED-E guides.
  3. Hopeville Missile Base. The first sealed door. It asks for a Courier's name — the PC's. When it opens, Ulysses identifies the PC by name over the PA and asks the others to leave the Courier to him. The party can refuse. This is the first moment the campaign accuses a specific character.
  4. The Courier's Mile. A radioactive corridor the Marked Men patrol. The crossing costs a Rad, shielded or not. Each party member makes the crossing in their own way; the Courier is the only one who cannot not go. Marked Men here include a named Centurion who speaks once through a broken helmet and asks why.
  5. Rawr's Cave. A deathclaw lair. The fight is optional — a side tunnel bypasses it; each crawler takes a Fatigue. Ulysses will comment on whichever choice the party makes. He does not judge; he just remembers.
  6. The High Road and the Hive. The ruined highway on stilts is held up by supports the tunnelers have all but chewed through. A tunneler queen waits beneath it. A clever party can collapse the road as they cross and destroy the hive behind them at the cost of cutting off a retreat.
  7. The Hanging Rock. A silent scene. A vantage over the entire Divide. Ulysses speaks here even in absentia — his voice carries on broken radios across the canyon. Each party member describes what they see when they look out across the Divide from this point.
  8. The Silo Control Room. The Courier meets Ulysses face to face. Two launch buttons on the wall — NCR and Legion. The PC is the one Ulysses is speaking to; the other players are the witnesses. Resolutions in the Climax below.

  **Climax.**

  The PC meets Ulysses in the control room. Two launch buttons: **NCR** and **Legion**. Also: Ulysses himself. Resolutions:

  - **Kill him.** The most common answer. The buttons go dark as the launch codes leave his hand. The Divide remains broken but doesn't take anything else with it.
  - **Talk him down.** A series of Bond-based appeals — can he accept that the Courier didn't know what was in the package? If yes, he walks away. He may return in a later campaign as a difficult ally.
  - **Fire one missile.** If the party picks a target, Ulysses will honor the choice and leave on his own terms. The wasteland feels the blast. That faction's Reputation falls to **Vilified**, one step at a time as word spreads, permanently. The Overseer describes a crater that will outlast everyone at the table.
  - **Fire neither.** Walk out and *tell nobody*. The party gains a silent bond no one else will understand.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Lonesome Road"}' --auto` drafts the region, 8 places, 2 people, 2 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Not trackers.** Rad Clock: under Fallout 2e, no timer: on first entering each Divide zone, 1 Rad to each exposed PC (`didact do rad who=<pc> source=hot-zone`; gear=halves for a radiation suit, gear=negates for a sealed hazmat suit); under Grimfall, no timer: each Divide zone is a hot zone, `didact do rad who=<pc> dose=zone` (+1t), or with `stat=` a rad mark.

  **Bestiary** (Fallout 2e / Grimfall): Marked Man → `marked-man` / `marked-men`; Marked Centurion → `marked-centurion` / `marked-men`; Tunneler → `tunneler` / `tunneler`; Tunneler Alpha → `tunneler-alpha` / `tunneler`; Tunneler Queen → `tunneler-queen` / `tunneler`; Deathclaw, Divide → `deathclaw-divide` / `deathclaw`.

  **Rewards in each system's catalog:** Old Glory (fallout-2e.old-glory · grimfall.old-glory); Anti-Materiel Rifle (fallout-2e.anti-materiel-rifle · grimfall.anti-materiel-rifle); The Courier's Duster (grimfall.the-couriers-duster); The Red Glare (fallout-2e.the-red-glare · grimfall.the-red-glare); Blood-Nap (fallout-2e.blood-nap · grimfall.blood-nap); Fist of the North Rawr (fallout-2e.fist-of-the-north-rawr · grimfall.fist-of-the-north-rawr); Elite Riot Gear (fallout-2e.elite-riot-gear · grimfall.elite-riot-gear); Ulysses' Mask (fallout-2e.ulysses-mask · grimfall.ulysses-mask); Scorched Sierra Power Armor (fallout-2e.scorched-sierra-power-armor · grimfall.scorched-sierra-power-armor); A Light Shining in Darkness (fallout-2e.a-light-shining-in-darkness · grimfall.a-light-shining-in-darkness).
source: campaigns/12-lonesome-road#pitch
