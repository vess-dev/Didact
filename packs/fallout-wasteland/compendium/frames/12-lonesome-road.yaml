knowledge: secret
tags: [lonesome-road, threat, cast]
mechanics:
  fallout-2e:
    category: 'Campaign: Lonesome Road'
    hp: 16
    armor: 2
    STR: 14
    DEX: 16
    WIL: 17
    attacks:
    - name: anti-materiel rifle
      damage: d12
      qualities: [bulky]
      note: .50 BMG
    - name: Old Glory flagpole
      damage: d10
      qualities: [bulky]
    - {name: war knife, damage: d6}
    abilities:
    - 'Speaks While Firing: The first shot each round is preceded by a line of dialogue; a PC who answers
      the line may make a WIL save to avoid the shot entirely.'
    - 'Launch Keys: Carries the silo launch codes on a holotape; surviving his defeat means deciding what
      happens to them.'
  grimfall:
    tier: boss
    role: marksman
    category: Named Threats & Legends
    senses:
    - a dust-caked stars-and-stripes duster and an eagle-tipped flagstaff
    - a low relentless monologue over an eyebot's chirp
    - ozone, dust, rocket smoke
    pools:
    - name: Ulysses
      dice: 8
      traits: out-shoot or out-argue him; he respects both
      moves: Rocket Barrage, Mark and Punish, Lay the History on You
    - name: His Eyebots
      dice: 4
      traits: a medical and a repair drone that knit him back together mid-fight
      moves: Patch Him Up, Covering Fire
    fail: 8d "The Launch" — a competing timer; if it runs dry first, the Divide's warheads fly.
    wants: to make you answer for the Divide — and, perhaps, to be talked back from ending the world
    note: A linked challenge of rockets and rhetoric — the rare boss you can win entirely with 
      words. He speaks through your own captured ED-E, and it may be ED-E that stops the launch. 
      Wields the Red Glare (see the Armory).
body: |-
  ## GM notes

  **Ulysses** — the villain. A pre-war-loving former Legion frumentarius. Wears a long coat and a flag around his throat. Speaks in parables. Honest.

  A former frumentarius of the Legion. Long coat, flag, pre-war weapon, older grief.

  Fallout 2e: 16 HP, 2 Armor, 14 STR, 16 DEX, 17 WIL, anti-materiel rifle (d12, bulky, .50 BMG), Old Glory flagpole (d10, bulky), war knife (d6).

  Grimfall: its card is `grimfall.ulysses` (Ulysses), in this record's grimfall block.
source: campaigns/12-lonesome-road#ulysses
