  ## GM notes

  **ED-E** — the eyebot. A holotape companion with recordings from Navarro and Hopeville — some of them from the PC. Think of it as a conscience in a can.

  A battered eyebot. Potential companion, not a combat workhorse. Has a pre-war holotape library.

  Fallout 2e: 4 HP, 1 Armor, 4 STR, 13 DEX, 10 WIL, built-in laser (d6).

  Grimfall: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
