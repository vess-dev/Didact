    traits: [exist by the simulation's rules, 'leave no bodies, no loot']
    moves: [Shock-Sword Rush, Dragoon Decloak Volley]
    wants: the objective, forever — the war never ended in here
    note: "Inside a sim pod they fight as 6d pools under the program's rules — and the program cheats:
      Sim-MPs respawn off-camera (the pool gets a die back each scene), the Chimera tank is a 6d challenge
      whose cannon begs for a called shot, and General Jingwei duels as a 6d elite whose honor guard won't
      let bystanders interfere. The rare physical cache versions (a real suit, a real gauss carbine) are
      where the treasure is."
body: |-
  ## GM notes

  A co-opted pre-war mining rig converted into a Chinese armored vehicle — bigger and tougher than any American tank. Mounted laser cannon on the turret. Never tests Morale.

  Fallout 2e: 15 HP, 3 Armor, 18 STR, 8 DEX, 3 WIL, laser cannon (d10, blast), ram (d8).

  Grimfall: its card is `grimfall.anchorage-ghosts` (Anchorage Ghosts), in this record's grimfall block.
source: campaigns/04-operation-anchorage#chimera-tank
