id: operation-anchorage
type: quest
name: 'Operation: Anchorage'
tags: [operation-anchorage, frame, side-arc]
goal: "The Brotherhood Outcasts have uncovered an intact VSS pod network — a military virtual simulation
  rig. Inside is Operation: Anchorage, a propaganda reconstruction of the liberation of Alaska. The Outcasts
  can't crack the loadout cache locked behind the sim's victory condition. They'll open the armory for
  anyone who plays it through."
date: Tuesday, 23 October 2277
body: |-
  *A pre-war combat simulation locked inside a Brotherhood Outcast bunker. Step inside and Alaska is 2077 again, Chinese Crimson Dragoons crawling over the ridge and an American victory waiting for whoever can stomach the lie.*

  ## GM notes

  **Date.** Tuesday, 23 October 2277: a Fallout 3 side arc: that frame's date, or whenever it reaches the Outcasts' bunker. It is the calendar's start: a new campaign opens on it.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Operation: Anchorage tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** The Outcasts (Protector McGraw) broadcast on an open channel: pre-war weapons, armor, and Pulse Grenades to anyone who can beat the General Chase simulation. No ghouls, no mutants, no cyborgs — the pods scan and reject. A cover story is fine: say you're human, sign the waiver, step in.

  **Plot beats.**

  1. The Pod Room. Olin briefs the party on the cache, McGraw glowers from the doorway, and the rig scans each PC for "anomalies." Any PC who fails the scan gets a single nosebleed moment as the pod tries to reject them — let the player decide whether to push through, and take 1 Fatigue for the trouble.
  2. Drop-In at Listening Post Bravo. The party wakes on a snowbank in sim loadouts they never packed. A Chinese perimeter patrol is walking toward them. General Chase cheerfully briefs them over the radio as if this were a training exercise. The first Glitch Clock tick should land in this scene — a magazine that refills itself, a dead body that pops back up.
  3. Light the Artillery Tower. Before the party can push inland, they must activate a signal tower. The mission objective says light the flare; the tower is guarded by Crimson Dragoons who shouldn't be there according to the briefing. This is the scene where the sim's scripted clean war first stops making sense.
  4. The Chimera Depot. A yard of mothballed Chinese armored rigs the mission wants them to sabotage. Two options: rig a Chimera's reactor to take out the next wall, or steal one and ride it through. Stealing a Chimera is an off-script victory Chase does not know how to respond to — drop a Glitch tick and watch him improvise badly.
  5. The Pulse Field and the POW Camp. The sim routes them through an EMP minefield toward a Chinese POW camp. The POWs look real — they speak full English, beg for a word home, name their families. Chase orders the party to move past them. What the party does here sets the tone for Jingwei.
  6. The Ice Camp. The last obstacle before Jingwei's bunker. The Dragoons here are dug in with sniper nests. A loud assault wakes a Chimera; a quiet one rewards the party with three stealth suits they'll want to keep (they cannot). Max the Chase Clock here if the party has been running off-script.
  7. The Duel in the Bunker. Jingwei waits. The sim insists on a one-on-one duel; breaking the duel summons Sim-MPs. Resolutions in the Climax below.
  8. Ejection. However the duel resolves, the party ejects and the cache cracks open — or doesn't. Olin is waiting with a coffee and a worried look. McGraw wants to know what they saw in there. If the cache opens, Defender Sibley mutinies — he refuses to hand pre-war weapons to outsiders and opens fire on McGraw (use Brotherhood Knight for Sibley and anyone who sides with him). The party's last fight in this campaign is not in the sim; it's in the bunker, real blood, real bullets, a Brotherhood civil war in a closet.

  **Climax.**

  To win the sim the party must duel Jingwei at the bunker. Three resolutions:

  - **Beat him by the rules.** Kill him in single combat. Cache opens. Chase commends you. Leave clean.
  - **Break the sim.** Refuse the duel, glitch the environment, force an eject. The cache is locked forever but the Outcasts owe you a favor (Olin smuggles out a suit of T-45d).
  - **Side with the ghost.** Jingwei's AI has become self-aware. Let him walk out with you — Olin can transfer him to a holotape. He becomes a permanent contact who speaks only in pre-war Mandarin radio slang.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Operation: Anchorage"}' --auto` drafts the region, 5 places, 3 people, 3 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Chinese Commando (Simulation) → `chinese-commando-simulation` / `anchorage-ghosts`; Crimson Dragoon → `crimson-dragoon` / `anchorage-ghosts`.

  **Rewards in each system's catalog:** T-51b Winterized Power Armor (fallout-2e.t-51b-winterized-power-armor · grimfall.t-51b-winterized-power-armor); Chinese Stealth Armor (fallout-2e.chinese-stealth-armor · grimfall.chinese-stealth-armor); Jingwei's Shocksword (fallout-2e.jingweis-shocksword · grimfall.jingweis-shocksword); Neural Interface Suit (fallout-2e.neural-interface-suit · grimfall.neural-interface-suit).
source: campaigns/04-operation-anchorage#pitch
