    WIL: 18
    rad_immune: true
    attacks:
    - name: Tesla rifle
      damage: d10
      qualities: [blast, bulky]
    - name: lightning
      damage: d8
      qualities: [ranged]
      note: once per round
    abilities:
    - 'Signal: While Hugo is airborne he cannot be harmed, and he summons 1d4 Lost each time he rises.
      He rises when first reduced to 0 HP, and again the second time; each time he hangs in the air for
      a round, then comes down with half his HP restored. Only the third defeat ends it.'
    - 'Sight: Hugo sees by electricity, not light. Darkness, smoke, and disguises mean nothing to him.'
body: |-
  ## GM notes

  **Hugo Stolz** — Vault 63's overseer, a German-speaking magnate born blind, who now sees the world as pulses of electricity and calls it beautiful. Would do anything for Cassidy, and has. Charming, cultured, and never once sorry.

  The overseer, floating on the current of his own machine, Cassidy at his feet.

  Fallout 2e: 10 HP, 1 Armor, 11 STR, 14 DEX, 18 WIL, Tesla rifle (d10, blast, bulky), lightning (d8, ranged, once per round).

  Grimfall: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
source: campaigns/20-skyline-valley#hugo-stolz
