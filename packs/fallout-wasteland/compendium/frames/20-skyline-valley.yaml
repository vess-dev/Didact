id: skyline-valley
type: quest
name: Skyline Valley
tags: [skyline-valley, frame, side-arc]
goal: |-
  In 2105, thunderheads settle over the southern mountains and do not leave. Lightning walks the ridges of Skyline Valley, a new region south of the Savage Divide, between the Ash Heap and the Cranberry Bog. Around the same time, a mangled vault door lands in the Forest, and an automated Vault-Tec broadcast begins calling for help. The door belongs to Vault 63.

  Vault 63 was the private kingdom of Hugo Stolz, a Vault-Tec director who bought his way into an overseer's chair by promising the company research: weather control built from the military's shuttered ATLAS Program, and guardian robots built from stolen Pentagon plans. The vault was far from finished when the bombs fell. Radiation poured in, and everyone inside became ghouls. Then they began, one by one, to go feral. In 2095, desperate to save his wife Cassidy, Hugo ran the vault's weather machine at full power. It spared Cassidy — in a coma — and turned many of the dwellers around them into the Lost: crackling, psychotic ghouls whose senses have been scrambled into something else. It also gave Hugo, blind from birth, a way to see. In 2105 he ran the machine again, and made the Storm.

  The last sane dwellers are sealed in the vault atrium: Hugo's niece Hilda, trying to cure the Lost; his daughter Audrey, trying to fix the machine; and Chief James Oberlin, head of vault security, trying to keep everyone alive. Hugo is helping them, graciously. He is also looking for a way to broadcast the signal inside his head through the machine and bring every Lost in the valley under his command.
date: Friday, 23 October 2105
body: |-
  *A storm that never ends has settled over Shenandoah National Park. A vault door came down in a field north of Sutton, and a Vault-Tec broadcast nobody has heard in years is inviting Vault Dwellers south. Beneath the storm, a blind billionaire has learned to see by lightning, and he means to make everyone else see the way he does.*

  ## GM notes

  **Date.** Friday, 23 October 2105: 'In 2105' (the frame); the day is Reclamation Day's. Open a campaign on it with `didact campaign new <id> --date 'Friday, 23 October 2105'`, or move one there with `didact time set 'Friday, 23 October 2105'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Skyline Valley tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** A Vault-Tec broadcast appears on every Pip-Boy in Appalachia: an automated invitation to Vault Dwellers, repeating coordinates south of the mountains. North of Sutton, a Foundation scavenger named Alyssa is picking over a scorched vault door with 63 on it, blasted there from wherever it came from. She has heard the vault's entrance is in the Ash Heap. She guesses the Brotherhood blew the door off. She is wrong.

  **Plot beats.**

  1. An Unlikely Invitation. The door, Alyssa, and the Ash Heap entrance to Vault 63 — not the vault itself but a transit hub for an underground railway that runs south beneath the mountains. Inside, the Lost come in waves. Over the intercom, a calm ghoul voice introduces herself: Hilda Stolz, head of the organics sector. She asks the party to come to Skyline Valley.
  2. Into Lands Unknown. Up Skyline Drive into the Storm. At the park entrance, a survivor named Craig needs personal effects gathered and signal flares set at three points in the storm. The valley is gorgeous and wrong — lightning everywhere, Lost on the overlooks.
  3. The Calm Before. Dark Hollow Manor, the Stolz family's pre-war home, stands on a hill wreathed in fissures and toxic purple pools, the Storm strongest overhead. The vault's entrance is beneath it, behind a hand scanner that only a vault dweller's hand will open — any vault dweller's, dead or Lost. Inside the atrium the party meets the survivors, and the overseer himself: Hugo Stolz, gracious host.
  4. Housekeeping. The atrium needs everything: Oberlin wants the Lost cleared from the lower levels and the storerooms emptied of radrats; Hugo wants his wife's journal found, the key to his wall safe recovered, and the weather machine's blueprints brought home. Along the way, the party learns what the vault was built on: the Dark Hollow Falls families, talked off their land with a handshake promise of places in the vault, and met by Hugo's guards at the park's edge when the bombs came.
  5. The Powerhouse of the Cell. Hilda has a serum, Serum Omega, and three Lost test subjects. The last is her own father, August, one of the first dwellers to turn. The party brews the serum in the lab, doses the subjects, and learns what it can and cannot give back.
  6. The Oldest Trick in the Book. Audrey needs the Shenandoah Visitor Center's weather-monitoring gear. Then Hugo bursts in: Cassidy has been kidnapped by Mothman cultists. In his panic, Hugo lets slip that the cult's leader is someone he once paid an assassin to kill, and Audrey walks out on him. The party infiltrates Old Crimora Mines in cultist robes and finds a congregation of fakes who do not worship the Mothman at all. They want revenge on Hugo, and they follow Alex Guerra, Audrey's pre-war love, the communist the assassin never reached.
  7. Double-Crossed Wires. Oberlin is still loyal to the U.S. Army, and he still files reports to his superiors. His last courier, security officer Daniel Smith, never came back. The party finds Daniel dead in a cage beneath High Knob Lookout, now a Blood Eagle camp, with Oberlin's report and his own holotape: every report Oberlin ever sent went straight to Hugo. There is no Army. Hugo admits it pleasantly, and suggests the party keep it to themselves.
  8. Gathering Clouds. Audrey and Hilda are one experiment from understanding why Hugo kept his mind when the others became Lost. It takes a sample of his tissue and three lightning harvesters at Research Sites Saxony, Bavaria, and Rhineland, each activated and held against super mutant raiders while it drinks the storm. The answer comes back, and Hugo is already gone — to the Hawksbill weather station on the valley's highest peak, with Cassidy, to finish what he started. See Climax.

  **Climax.**

  **The Eye of the Storm.** Inside the Hawksbill weather station, past laser grids and Lost, Hugo waits beside the machine with Cassidy on the floor beside him, breathing hard. Audrey, on the intercom, begs the party to kill him — he is a master manipulator and he will escape. Oberlin, on the same channel, begs them to keep him alive for the cure. Hugo must be beaten three times before he kneels. Then he makes his own offer. Three resolutions:

  - **Arrest Him.** Hugo surrenders. The party climbs the machine and powers it down, and the Storm begins to break. Oberlin becomes overseer; Hugo lives in a cell as the subject of the cure he never wanted to find. Audrey, betrayed again, stays on as a scientist — for now.
  - **Kill Him.** Hugo dies. Oberlin wants the body recovered for research, and Audrey, listening on the intercom, shoots him for it. The party powers the machine down, and Audrey Stolz becomes the overseer of Vault 63, frightened of the job and determined to do it better than her father.
  - **Walk Away.** Hugo promises the others will be safe and climbs the machine himself. The Storm swells. When the party returns to the atrium, Hilda, Audrey, Cassidy, and Oberlin sit on the floor around the overseer's desk, wailing, turning Lost, while Hugo smiles and calls them *found*. The Storm Clock fills.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Skyline Valley"}' --auto` drafts the region, 10 places, 6 people, 4 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Feral Ghoul → `feral-ghoul` / `feral-ghoul`; Glowing One → `glowing-one` / `feral-ghoul`; Radrat → `radrat` / `radroach`; Tick → `tick` / `tick`; Mothman, Dark → `mothman-dark` / `mothman`; Mole Miner → `mole-miner` / `mole-miner`; Wendigo → `wendigo` / `wendigo`; Scorched → `scorched` / `scorchbeast`; Super Mutant, Grunt → `super-mutant-grunt` / `super-mutant`; Super Mutant, Brute → `super-mutant-brute` / `super-mutant`; Protectron → `protectron` / `protectron`; Assaultron → `assaultron` / `assaultron`; Robobrain → `robobrain` / `robobrain`; Turret, Laser → `turret-laser` / `automated-turrets`; Eyebot → `eyebot` / `eyebot`; Blood Eagle (the Wastelanders frame's threat) → this pack's `wastelanders-blood-eagle`.

  **Rewards in each system's catalog:** V63-BERTHA (fallout-2e.v63-bertha); V63-HELGA (fallout-2e.v63-helga).
