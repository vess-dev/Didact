id: steel-dawn-mutagen-clock
type: track
name: Mutagen Clock
knowledge: secret
tags: [steel-dawn, clock]
kind: clock
size: 8
value: {value: 0, size: 8}
note: "(d8, hidden) Blackburn's progress. Ticks each week the party does not find him, each time another
  civilian disappears, and each time his Hellcats take a fight. At 8, Blackburn's refined virus is ready:
  he walks out of Vault 96 already transformed, and West Tek begins shipping FEV."
source: campaigns/19-steel-dawn#clocks
