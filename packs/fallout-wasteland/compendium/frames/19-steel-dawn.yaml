id: steel-dawn-schism-clock
type: track
name: Schism Clock
knowledge: secret
tags: [steel-dawn, clock]
kind: clock
size: 6
value: {value: 0, size: 6}
note: "(d6) The rift between Rahmani and Shin. Ticks when the party openly backs one commander against
  the other's orders, when Brotherhood technology is lost to outsiders, when an initiate dies on a mission,
  or when the Codex is broken in front of the ranks. At 6, the expedition splits before the Climax: Shin's
  loyalists and Rahmani's followers stop taking each other's orders, and the party must declare for one
  of them on the spot."
source: campaigns/19-steel-dawn#clocks
