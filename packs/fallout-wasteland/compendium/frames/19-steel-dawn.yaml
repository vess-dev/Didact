id: steel-dawn-hellstorm-clock
type: track
name: Hellstorm Clock
knowledge: secret
tags: [steel-dawn, clock]
kind: clock
size: 4
value: {value: 0, size: 4}
note: (d4) Launchers loose in Appalachia. Ticks when the party lets a Hellstorm stay in raider 
  hands, keeps one for itself, trades one away, or fails to recover it after a fight. At 4, a raider
  warband levels a settlement the party cares about with Brotherhood missiles, and everyone in 
  Appalachia knows whose they were.
source: campaigns/19-steel-dawn#clocks
