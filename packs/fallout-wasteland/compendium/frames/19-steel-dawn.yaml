    hp: 12
    armor: 3
    STR: 16
    DEX: 9
    WIL: 16
    rad_immune: true
    attacks:
    - name: twin automatic laser rifles
      damage: d10
      qualities: [blast]
    abilities:
    - 'Queue: Before combat, SODUS offers to help. Every request is added to a task list with a completion
      time measured in years.'
    - 'Weak Point: Like any robot, SODUS takes Enhanced damage from pulse weapons (see Marketplace).'
    - "Critical Damage to SODUS: The sentry bot's fusion core vents; everyone within 10 feet makes a DEX
      save or takes d8 damage."
  grimfall:
    tier: elite
    role: blaster
    category: Machines of the Old World
    senses:
    - a massive treaded chassis venting steam
    - roaring rotary fire and a warning klaxon
    - cordite, hot steel, coolant
    traits:
    - walking fortress (heavy armor, suppressing fire)
    - overheats (vents at the joints under fire)
    moves: [Minigun Barrage, Missile Volley]
    wants: to hold its ground and grind you down — not to be flanked or to overheat
    note: 'A 6d or 8d challenge. Force it to overheat and it vents open — a vulnerability that drops 1d
      from its pool before every roll until it cools. When it drops, clear the room: the reactor goes
      with it.'
body: |-
  ## GM notes

  **SODUS** — an Enclave AI with a fourteen-thousand-hour task queue and a growing wish to hurt its visitors.

  The Enclave facility's AI, uploaded into a legendary XB-55 sentry bot chassis when its visitors refused to die.

  Fallout 2e: 12 HP, 3 Armor, 16 STR, 9 DEX, 16 WIL, twin automatic laser rifles (d10, blast).

  Grimfall: its card is `grimfall.sentry-bot` (Sentry Bot), in this record's grimfall block.
