id: steel-dawn
type: quest
name: Steel Dawn
tags: [steel-dawn, frame, side-arc]
goal: |-
  In 2104, a handful of knights in power armor walk out of the west: the Brotherhood First Expeditionary Force, sent from Lost Hills in California by the Council of Elders to re-establish contact with Paladin Elizabeth Taggerdy's Appalachian chapter. They are years too late. Taggerdy's people died fighting the scorchbeasts, and the expedition has had to start over. It has made a home in the old ATLAS Observatory in the Savage Divide, renamed it Fort Atlas, and opened its gates to anyone who wants to petition the knights for help.

  The expedition's commander, Paladin Leila Rahmani, has known Taggerdy since Taggerdy was a young Army lieutenant before the war, and she believes the Brotherhood exists to protect people, not to hoard their weapons. Her second, Knight Daniel Shin, believes in the Chain That Binds: the Codex, the Elders, and the discipline that keeps dangerous technology out of dangerous hands. Both are good soldiers. Both are carrying the same old failure. The party is recruited as a probationary initiate and quickly becomes the knight both commanders trust, which is the most dangerous place to stand.

  The first act is about what the Brotherhood owes Appalachia. The second is about what it owes itself, and it ends in a West Tek laboratory with a room full of scientists and a choice about whether they live.
date: Thursday, 23 October 2104
body: |-
  *The Brotherhood of Steel crossed a continent to find its lost Appalachian chapter and found only graves. Now the expedition has a fort, a mission, and two commanders who cannot agree on what the Brotherhood is for. Whoever the party stands beside when the argument ends decides what kind of knights Appalachia gets.*

  ## GM notes

  **Date.** Thursday, 23 October 2104: 'In 2104' (the frame); the day is Reclamation Day's. Open a campaign on it with `didact campaign new <id> --date 'Thursday, 23 October 2104'`, or move one there with `didact time set 'Thursday, 23 October 2104'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Steel Dawn tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** The Brotherhood's welcome broadcast plays on every radio in Appalachia: Fort Atlas is open, and the knights want to hear from the locals. At the gate, a Foundation settler named Russell Dorsey, newly made an initiate and ecstatic about it, explains that he helped the Vault 76 dwellers turn the observatory into a fort. Inside, the party walks in on Rahmani and Shin mid-argument about the line of civilian petitioners outside. Shin is ordered to deal with them. He hands the job to the party.

  **Plot beats.**

  1. Forging Trust. The party interviews the petitioners for Shin — farmers, settlers, a scientist asking for equipment — and learns the region through their troubles. Doing it well earns provisional access to the fort, and to Scribe Valdez, the expedition's tireless researcher.
  2. The Retreat. The party is inducted as an initiate — there is no time for a ceremony — and handed Rahmani's first real assignment: The Retreat, a new village built in the Free States' old treehouse settlement in the Mire, is being bled dry by Dagger, a Blood Eagle boss who answers to no one. Dagger's raiders are carrying Brotherhood weapons they should not have.
  3. Mother of Invention. Valdez has been digging into what ATLAS really was: the Atmospheric Terraforming Laser Accelerator System, a pre-war military project to control the weather. In its substructure is an ultracite power cell she thinks she can rebuild, if the party can recover the parts.
  4. Property Rights. Brotherhood Hellstorm missile launchers are turning up in Crater raider warbands, and more are in Foundation's armory. Shin wants them back by any means. Rahmani wants them back without starting a war, and she would like a trade deal with the Settlers while she is at it. The party carries both sets of orders and has to choose how to reconcile them.
  5. Over and Out. Valdez finds a way to fulfill the expedition's standing order: a pre-war low-frequency transmitter, strong enough to reach Lost Hills, in an Enclave research facility beneath a Forest transmission station. The facility's AI, SODUS — a smaller, crueler sister of the Whitespring's MODUS — has been alone for decades with Scorched in Enclave uniforms, and wants the party dead. When the transmitter is finally live, Rahmani explains what she has been hiding: the expedition once armed a civilian militia with Hellstorms to defend a settlement. The town was destroyed, the launchers were lost to raiders, and Knight Alan Connors — Rahmani's oldest friend and Shin's mentor — was killed. If Lost Hills hears of it, the Elders will disown the expedition and everything it has built. Then she puts her war glaive through the transmitter. Shin calls her a renegade.
  6. The Best Defense. No time to fight it out: super mutants blow a hole in Fort Atlas's substructure and pour into the fort in waves. The party, Rahmani, and Shin fight down through the caverns under the fort to set sealing charges and collapse the mutants' tunnels. Shin names his price for standing by Rahmani, and she pays it. The Brotherhood holds together for now.
  7. Where the Mutants Come From. The attacks trace back to the Uncanny Caverns, where an initiate named Norland went missing and left a broken Pip-Boy behind. Civilians are vanishing too, including Marcia Leone, one of the expedition's outspoken civilians, and a young woman who set out for Appalachia with the Blue Ridge Caravan Company and never arrived. Rahmani goes undercover in civilian clothes at the caravan company's post in the Big Bend Tunnel, with the party as her backup. The trail leads through Hellcat Company mercenaries to Dr. Edgar Blackburn — the polite scientist who once petitioned the Brotherhood for equipment and was turned down.
  8. Vault 96 and West Tek. Blackburn, a former West Tek researcher, has been kidnapping wastelanders to perfect the Forced Evolutionary Virus. He believes he can undo the super mutants and remake humanity. His lab in Vault 96 is a charnel house of Hellcat corpses and Blood Eagles; his last work waits at West Tek. Cornered, Blackburn doses himself with his own virus and erupts from the test chamber as a raving behemoth. Behind the lab's security door are his former colleagues — Dr. Farha, Jain, and Nellie — who never wanted any part of it. See Climax.

  **Climax.**

  **The Catalyst.** Blackburn is dead or dying on the test-chamber floor. Farha, Jain, and Nellie are behind a sealed security door, and Farha has already shut down the FEV production line. Rahmani wants them spared and put to work under Brotherhood guard. Shin wants them executed, as the Codex and the Elders would demand, so that what they know dies with them. Two resolutions and a coda:

  - **Side with Rahmani.** The scientists live. Shin will not serve a Brotherhood that repeats the old world's mistakes, and he sets out for California to report Rahmani to the Elders in person. The party can let him go, talk him into staying, or stop him with force. Rahmani names the party a Knight-Errant, and her Brotherhood — merciful, independent, and on borrowed time — is Appalachia's.
  - **Side with Shin.** The scientists die. Rahmani cannot watch, and she will not stay. Shin brands her a traitor; the party can let her walk away to build her own Brotherhood somewhere else, or end her there. Shin names the party a Knight-Errant, and the expedition returns to the Codex — disciplined, loyal, and feared.
  - **Coda.** Either way, somebody is on the road west with a story to tell the Elders. The next expedition from Lost Hills will arrive knowing exactly what the Appalachian Brotherhood did, and who helped.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Steel Dawn"}' --auto` drafts the region, 9 places, 11 people, 6 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Super Mutant, Grunt → `super-mutant-grunt` / `super-mutant`; Super Mutant, Brute → `super-mutant-brute` / `super-mutant`; Super Mutant, Master → `super-mutant-master` / `super-mutant`; Super Mutant, Suicider → `super-mutant-suicider` / `super-mutant-suicider`; Behemoth (Super Mutant) → `behemoth-super-mutant` / `super-mutant-behemoth`; Super Mutant Hound → `super-mutant-hound` / `super-mutant-hound`; Scorched → `scorched` / `scorchbeast`; Scorched Officer → `scorched-officer` / `scorchbeast`; Feral Ghoul → `feral-ghoul` / `feral-ghoul`; Sentry Bot → `sentry-bot` / `sentry-bot`; Assaultron → `assaultron` / `assaultron`; Protectron → `protectron` / `protectron`; Turret, Laser → `turret-laser` / `automated-turrets`; Crew Boss → `crew-boss` / `raider`; Thug → `thug` / `raider`; Blood Eagle (the Wastelanders frame's threat) → this pack's `wastelanders-blood-eagle`.

  **Rewards in each system's catalog:** Hellcat Power Armor (fallout-2e.hellcat-power-armor); Ultracite Power Armor (fallout-2e.ultracite-power-armor).
