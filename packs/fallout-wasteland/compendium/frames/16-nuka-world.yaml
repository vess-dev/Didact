type: monster
name: Colter
aliases: [Overboss Colter, Overboss Colter (in Power Armor)]
knowledge: secret
tags: [nuka-world, threat, cast]
mechanics:
  fallout-2e:
    category: 'Campaign: Nuka-World'
    hp: 15
    armor: 3
    STR: 16
    DEX: 12
    WIL: 13
    attacks:
    - {name: electrified gauntlet, damage: d10}
    abilities:
    - 'Shock Field: On a hit, the target makes a STR save or loses their next action.'
    - 'Chair Above the Gauntlet: The fight happens in the arena — the Overseer may give the party environmental
      aid (a water spout, a loose cable) for a clever DEX save; on a success the suit shorts out, and
      attacks against him ignore his Armor until the end of the next round.'
  grimfall:
    tier: elite
    role: brute
    category: Faces of the Wasteland
    fact: Power armor fed by the arena's grid; the crowd — and the plumbing — are how you beat him.
body: |-
  ## GM notes

  **Colter** — the outgoing Overboss. Dead in the Gauntlet by round three.

  The outgoing Overboss. Power-armored, overconfident, already ashamed.

  Fallout 2e: 15 HP, 3 Armor, 16 STR, 12 DEX, 13 WIL, electrified gauntlet (d10).

  Grimfall: its card is `grimfall.overboss-colter` (Overboss Colter), in this record's grimfall block.
