# Nuka-World (campaigns/16-nuka-world): written by fw_compendium.py, don't edit by hand.
# The frame's quest, region, places, cast, threats (Fallout 2e's numbers, and Grimfall's
# card where its Bestiary has the threat) and clocks.
id: nuka-world
type: quest
name: Nuka-World
tags: [nuka-world, frame, side-arc]
goal: A radio signal from a pre-war Nuka-Cola family vacation resort invites the party to 
  Nuka-World, the world-famous amusement park — now open! The broadcast omits that the park is run 
  by the Pack, the Disciples, and the Operators — three raider gangs — whose lieutenants have rigged
  the Gauntlet to rid themselves of their own Overboss. The park's pre-war management AI, Nuka-Cola 
  Family Spokesbot "Nick Nuka," still runs rides and vending machines. The Overboss's seat is about 
  to be vacant. Guess who's auditioning.
date: Sunday, 23 October 2287
body: |-
  *A pre-war theme park run by three raider gangs. The reigning Overboss is one rigged fight from dying in the Gauntlet. The park is a candy-colored meat grinder and it is waiting for someone to take the throne.*

  ## GM notes

  **Date.** Sunday, 23 October 2287: a Fallout 4 side arc: that frame's date, or whenever the park's signal is heard. Open a campaign on it with `didact campaign new <id> --date 'Sunday, 23 October 2287'`, or move one there with `didact time set 'Sunday, 23 October 2287'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Nuka-World tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** A traveling Preston Garvey type (or any do-gooder NPC from the party's network) cannot warn the party in time: the Gauntlet has already been rebuilt. The party arrives at the front gate, the monorail pulls up, and the Gauntlet — a deadly pre-war attraction converted into a deathrun — flings them at the throne.

  **Plot beats.**

  1. The Gauntlet. The drop-in. A themed kill-corridor of traps, mutants, and raider hecklers on catwalks. Every PC takes d6 damage here no matter what. At the end, Colter waits in his power armor, announced as the Overboss. The fight is riggable — the Overseer should give the party a clever environmental cue to exploit (a loose cable, a water spout, a dangling cage).
  2. Meeting Gage. The moment Colter falls, Porter Gage steps out of the shadows with a handshake and a pitch. Gage rigged the Gauntlet on purpose. He will serve whoever wears the crown next. He explains the three gangs, the open seat, and the short window before the gangs install their own Overboss. The Crown Clock starts ticking.
  3. Nuka-Town USA. The hub. Market stalls run by gang quartermasters, a slave pen (choose to free or ignore — freeing is the first step of the Liberate climax), the Overboss's residence standing vacant. Sierra Petrovita, a Nuka-Cola superfan on pilgrimage, is here and will guide the party to the bottling plant if asked.
  4. Touring the Gangs. The party visits Mags and William Black (Operators), Mason (Pack), and Nisha (Disciples). Each pitches their own vision for the park. Each offers the party a loyalty test — a job in one of the four themed zones that proves the party can work with them.
  5. The Zones. Dry Rock Gulch, Galactic Zone, Kiddie Kingdom, Safari Adventure, and the Nuka-Cola Bottling Plant — five zones in all, the last one threaded by the World of Refreshment's river of glowing Quantum. Each zone is a pointcrawl dungeon with one iconic pre-war attraction and one iconic postwar inhabitant. The party should explore at least two; they will learn the park's pre-war weight only by walking through it.
  6. The Power Plant. Beneath the park. Powering it on re-activates rides, vending machines, and the security grid. A dozen sentry bots and eyebots swarm the zones when the lights come up. A WIL save (or the right terminal password) flips the grid to the party's side — the single biggest lever in the campaign.
  7. The Gala Decision. Gage presses the party for an answer: who wears the crown? The party can take the throne, play the gangs against each other in staged duels, ally with Mackenzie and liberate the park, or walk out and leave Nuka-World to fester. Each path reshapes the climactic fights.
  8. The Crown. Whatever the party chose, a final scene resolves the park's rule. Taking the throne means dividing the park's five zones among the three gangs (see Climax below); liberating means a single bloody day. See the Climax section for all four resolutions.

  **Climax.**

  The Overboss seat is empty. Gage is asking who sits. Resolutions:

  - **Take the throne.** The party becomes the Overboss. They must then divide the park's **five zones** among the three gangs — satisfying any two gangs and disappointing the third will trigger a civil war the party must suppress. Succeeding makes the park the party's permanent base.
  - **Liberate the park.** Ally with Mackenzie, free the slaves, and use the power plant's security grid against the raider gangs. The three gangs die in a single bloody day. The park becomes a trade-hub settlement.
  - **Play the gangs against each other.** Sequential duels with each gang leader, staged as park spectacles. The party walks out with the three bosses' own weapons and a reputation that follows them forever. The park dies behind them.
  - **Walk out.** Monorail back to the Commonwealth and never look back. Gage leaves in disgust. The park becomes an enemy stronghold for a later campaign.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Nuka-World"}' --auto` drafts the region, 9 places, 9 people, 5 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Thug → `thug` / `raider`; Crew Boss → `crew-boss` / `raider`; Protectron → `protectron` / `protectron`; Gatorclaw → `gatorclaw` / `gatorclaw`; Bloodworm → `bloodworm` / `bloodworm`.

  **Rewards in each system's catalog:** Thirst Zapper (fallout-2e.thirst-zapper · grimfall.thirst-zapper); Splattercannon (fallout-2e.splattercannon · grimfall.splattercannon); Western Revolver (grimfall.western-revolver); Nuka-Cola Quantum (fallout-2e.nuka-cola-quantum · grimfall.nuka-cola-quantum); Nuka-Dark Rum Recipe (grimfall.nuka-dark-rum-recipe); Nuka-Cola Dark (fallout-2e.nuka-cola-dark); Gatorclaw Gauntlet (fallout-2e.gatorclaw-gauntlet · grimfall.gatorclaw-gauntlet); Nuka-Girl Rocketsuit Costume (fallout-2e.nuka-girl-rocketsuit-costume · grimfall.nuka-girl-rocketsuit); Sealed Nuka-Cola Factory Crate (fallout-2e.sealed-nuka-cola-factory-crate); Quantum X-01 (grimfall.quantum-x-01).
source: campaigns/16-nuka-world#pitch
