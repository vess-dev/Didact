id: dead-money
type: quest
name: Dead Money
tags: [dead-money, frame, side-arc]
goal: 'A mysterious radio broadcast lures the party to an abandoned Brotherhood bunker in the Mojave.
  Inside: a knockout gas, a collar around their necks, and the voice of Father Elijah — a Brotherhood
  elder gone mad. He will detonate the collars unless the party helps him breach the Sierra Madre Casino
  and open its vault.'
date: Wednesday, 19 October 2281
body: |-
  *The Sierra Madre Casino never opened. Its grand gala is still scheduled, the holograms still patrol the red fog, and the vault in the basement is still full of gold the weight of a dead man. Father Elijah wants it. He will make you want it too.*

  ## GM notes

  **Date.** Wednesday, 19 October 2281: a New Vegas side arc: that frame's date, or whenever the broadcast lures the party. Open a campaign on it with `didact campaign new <id> --date 'Wednesday, 19 October 2281'`, or move one there with `didact time set 'Wednesday, 19 October 2281'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Dead Money tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** Everyone enters Dead Money stripped of all inventory — nothing comes through the bunker door except perks, which are skill memory. The collars are explosive and pair-linked to others in the party; a PC's collar detonates if they stray too far from their teammates or if any radio speaker is within arm's reach. The red cloud damages anything exposed.

  **Plot beats.**

  1. The Fountain Plaza. The party wakes in the Villa, collars on, fog around them. Elijah's voice is already in their ears. A single Ghost Person is visible down the street. The first lesson of Dead Money is that a Ghost Person who looks dead is not dead — the Return rule applies from the first encounter.
  2. Recovering Dean Domino. The lounge singer ghoul is in the residential district, already working on his own plan to steal the gold. He joins the party only because Elijah's collar threat extends to him too. Dean is oily, funny, and will absolutely turn on the party in the climax unless the Overseer gives him a reason not to.
  3. Recovering Dog/God. In the police station, the party meets the nightkin with two minds. Dog wants food. God wants control. The party can choose which one to stabilize — the choice matters at the Gala. Holograms patrol the station; each one dies only to its emitter.
  4. Recovering Christine. The mute Brotherhood survivor in the clinic has been trying to kill Elijah for a long time. She cannot speak but she can fight. A PC who plays a holotape at her earns a hard ally; a PC who condescends to her earns an armed rival.
  5. The Villa Clinic and the Auto-Doc. A working pre-war auto-doc can re-tune a single party member's collar to give them a narrow window of immunity to one speaker zone. This is the party's one real edge; using it costs a Stimpak and a roll on the Scars table at HP Lost 1d6.
  6. The Sierra Madre Gala. The casino's front doors open only when all three companions have been met. The Gala was the pre-war event the casino was built for — and it never happened. The party walks in on a hologram-staged opening night: Vera Keyes's voice, the orchestra playing, the red velvet still laid out.
  7. The Vault. Below the casino. Gold bars, pre-war security systems, and the original tomb. Elijah's voice comes through the PA — he wants the party to unlock it for him. The fight in the vault is not with Elijah directly; it is with whatever the party has brought down here and whatever they cannot bring themselves to walk away from.
  8. The Walk Out. Dead Money ends with a departure. Either the party seals Elijah inside and leaves with their lives (the "right" ending), walks out with a pocketful of gold (the "wrong" one), or lets the weight of what they're carrying kill them a mile down the road. The Overseer should describe the sunrise.

  **Climax.**

  The vault is open. Elijah is on the radio telling the party to bring the gold. Four endings:

  - **Trap him in the vault.** Lure Elijah down, close the door behind him. The collars deactivate. The gold is his. The party escapes with whatever fits in *one* slot.
  - **Kill him on the catwalk.** He wears his tattered elder's robes and carries a Gauss rifle. **Father Elijah**: 15 HP, 1 Armor, 12 STR, 14 DEX, 16 WIL, Gauss rifle (d12, _bulky_). On Critical Damage, the party may loot his pack (3 Perk Magazines of the Overseer's choice).
  - **Join him.** Take the gold together, raise an army, come back in a later campaign as the antagonists of someone else's game. The Overseer writes that down.
  - **Begin again.** Leave the gold. Shut the vault. Walk out with the collar's disarm code and a lesson. The wasteland forgets nothing, but the party gets to.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Dead Money"}' --auto` drafts the region, 6 places, 1 people, 4 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Not trackers.** Cloud Clock: under Fallout 2e, no timer: at each new zone, `didact table roll fallout-wasteland.cloud-clock`; under Grimfall, no timer: the Cloud is a hot zone, +1t while you work in it; at each new zone `didact table roll fallout-wasteland.cloud-clock`, and a surge marks Brawn.

  **Bestiary** (Fallout 2e / Grimfall): Ghost Person, Trapper → `ghost-person-trapper` / `ghost-people`; Ghost Person, Hunter → `ghost-person-hunter` / `ghost-people`; Ghost Person, Seeker → `ghost-person-seeker` / `ghost-people`; Sierra Madre Hologram → `sierra-madre-hologram` / `sierra-madre-hologram`.

  **Rewards in each system's catalog:** Holorifle (fallout-2e.holorifle · grimfall.the-holorifle); Bear Trap Fist (fallout-2e.bear-trap-fist · grimfall.bear-trap-fist); Automatic Rifle (fallout-2e.automatic-rifle · grimfall.automatic-rifle); Christine's CoS Silencer Rifle (fallout-2e.christines-cos-silencer-rifle · grimfall.christines-cos-silencer-rifle); Dean's Tuxedo (fallout-2e.deans-tuxedo · grimfall.deans-tuxedo); Sierra Madre Reinforced Armor (fallout-2e.sierra-madre-reinforced-armor); Sierra Madre Gold Bars (fallout-2e.sierra-madre-gold-bar); Sierra Madre Chips (fallout-2e.sierra-madre-voucher · grimfall.sierra-madre-voucher).
