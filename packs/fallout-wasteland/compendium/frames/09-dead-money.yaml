      damage: d12
      qualities: [bulky]
  grimfall:
    tier: elite
    role: trickster
    category: Named Threats & Legends
    senses:
    - a distant figure on a security monitor
    - a clipped voice crackling over the Villa speakers
    - the sweet toxic haze of the Cloud
    pools:
    - name: Speakers & Holograms
      dice: 6
      traits: Elijah's eyes and hands; he is never present in the flesh
      moves: Loose the Holograms, Taunt and Misdirect
    - name: Emitters & Force Fields
      dice: 6
      traits: seal the Villa and shield the vault
      moves: Trigger a Trap, Wall You Off
    - name: The Vault Door
      dice: 4
      traits: the objective, locked behind the rest
      moves: (crack it to end him)
    fail: 8d "The Collar" — a shared timer of Cloud and collar-bomb; when it runs dry, your head 
      comes off.
    wants: the Sierra Madre's pre-war riches to arm a war — not to let go of an obsession already 
      doomed
    note: A remote linked challenge. Beat his systems and the man himself is no fight at all. "Begin
      again."
body: |-
  ## GM notes

  **Father Elijah** — Brotherhood elder, obsessed with Old World tech. Sees the Sierra Madre as the weapon that cracks the Mojave open.

  The collars themselves are the ambient threat: any PC within arm's reach of a working radio speaker makes a DEX save at the top of the next round or takes d6 damage from the collar — any Scar that results is Concussed. The party does not fight Elijah on equal terms unless they reach the vault.

  Fallout 2e: 15 HP, 1 Armor, 12 STR, 14 DEX, 16 WIL, Gauss rifle (d12, bulky).

  Its numbers are in the frame's Climax.

  Grimfall: its card is `grimfall.father-elijah` (Father Elijah), in this record's grimfall block.
source: campaigns/09-dead-money#father-elijah-via-bomb-collar
