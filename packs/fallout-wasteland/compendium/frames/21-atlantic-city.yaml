# Atlantic City (campaigns/21-atlantic-city): written by fw_compendium.py, don't edit by hand.
# The frame's quest, region, places, cast, threats (Fallout 2e's numbers, and Grimfall's
# card where its Bestiary has the threat) and clocks.
id: atlantic-city
type: quest
name: Atlantic City
tags: [atlantic-city, frame, side-arc]
goal: |-
  In 2105, the Russo family opens the Rose Room, a supper club in an old Savage Divide mansion, and invites all of Appalachia. They are refugees from Atlantic City, "Acee," the boardwalk town on the Jersey shore that the Great War spared from a direct hit. The floods that followed drowned its center to the second floor, but the Casino Quarter stayed dry, and Acee has been running ever since on three powers held apart by a treaty:

  - the Lombardi Family, the mob that owns the Casino Quarter, ruled in the name of the ailing Don Quentino by his sister Concerta;
  - the Munis, the Atlantic City Municipal Government under Mayor Tim Lane, who keep the water pumped, the lights on, and the plant monsters out;
  - the Showmen, the carnival clan that owns the Boardwalk under Mother Charlotte and turns every entertainment into blood sport.

  The Russos left because Antonio Russo, Quentino's favored heir, lost the succession to Concerta and ran before she could finish him. Now Antonio sits upstairs pretending to be senile. His son Vin keeps the bar, his wife Evelyn sings, and his daughter Abbie is going through withdrawal from Devil's Blood, the rarest and most addictive chem on the East Coast. When the hitmen come on opening night, the party is the only muscle in the room. Following them home means following the Russos' debts all the way back to the Jersey shore.
date: Friday, 23 October 2105
body: |-
  *A nightclub opens in the Savage Divide, and on opening night hitmen from New Jersey shoot up the stage. The family that owns it came from a city the bombs never touched, a boardwalk town still running on casinos, dues, and a truce three factions are dying to break. The cure for their daughter is out in the Pine Barrens, and it has wings.*

  ## GM notes

  **Date.** Friday, 23 October 2105: 'In 2105' (the frame); the day is Reclamation Day's. Open a campaign on it with `didact campaign new <id> --date 'Friday, 23 October 2105'`, or move one there with `didact time set 'Friday, 23 October 2105'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Atlantic City tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** Flyers for the Rose Room's opening night are pinned up in every train station in Appalachia. The party arrives for the show. Evelyn Russo sings, a pair of hecklers get thrown out, and Vin, behind the bar, asks the party to keep the peace for the second set. Halfway through a tuba solo, hitmen open fire on the family. When the smoke clears, the dying ringleader admits his crew jumped the gun, and Abbie is on the floor, shaking, begging for Devil's Blood.

  **Plot beats.**

  1. Opening Night. The Rose Room, the hitmen, Abbie's breakdown. Evelyn storms off, Antonio babbles, and Vin asks the party to help his sister, for pay. The only dose of Devil's Blood is in Atlantic City.
  2. The Flight to Acee. The only aircraft in Appalachia with the range is Lennox's vertibird at the Whitespring Refuge, the rebuilt Responders' new headquarters on the resort grounds. Lennox, a pre-war Air Force pilot who swears she once shot at a UFO, needs clearance from Orlando, the resort's manager. Evelyn talks; the party's reputation seals it. A refugee warns them the Jersey Devil is real. Evelyn laughs.
  3. The Casino Quarter. Evelyn's old contact, Stanley Soriano, a low-level Lombardi, can get Devil's Blood — for a favor, and only in the high rollers' lounge of the Neapolitan Casino. Getting in takes money, luck, or nerve. The treaty means no one draws a weapon on the casino floor, which makes every conversation more dangerous.
  4. Showman's Pier. Stanley's price is a Showman named Zayde, humiliated in front of his own crowd. The party slips backstage on the Boardwalk's pier, performs in the show, and makes Zayde a laughingstock. Back in Appalachia, Abbie is dosed and steady, for now.
  5. Honor Bound. Vin remembers his father's trips into the flooded city center. He calls on his old Muni friend Sloane Cao, chief of the Pine Barrens Forestry Division, who kills Overgrown for a living. Once the party has pulled her scattered crew out from among the Overgrown, the Munis lead the party to the Lombardis' old warehouse, where the treaty forbids violence: talk in, bluff in, or knock four times at the back door. Behind it, a sealed chem lab. Reversing the city's flood pumps drowns it out.
  6. Sins of the Father. Confronted, Antonio drops the act. He faked his senility to keep Concerta from finishing him, and he is the one who invented Devil's Blood. He killed a Lesser Devil that wandered in from the Pine Barrens, and his chemist, Gene, found what its blood could do. The synthetic drug cannot cure itself. An antidote needs blood from an adult Jersey Devil.
  7. The Devil. Five pheromone lures across the flooded city center, a long night on the rooftops, and then the Jersey Devil comes down out of the dark. Kill it, and decide how much of its blood to take: enough for Abbie's cure, or enough for a fortune. See Climax.

  **Climax.**

  **Sins of the Father.** The Jersey Devil lies dead in the floodwater, and the party holds its blood. Abbie and Antonio face each other in the ruins of the city they both grew up in. Three resolutions:

  - **The Cure.** The party harvests enough blood for the antidote and nothing more. Abbie takes it. Antonio has to decide whether to tell her he pushed her away to keep her out of the Family, and Abbie has to decide whether that is an excuse. The Russos go home to the Rose Room as a family, or at least as something like one.
  - **The Fortune.** The party takes all the blood. Antonio sees his edge on Concerta come back to life; Gene sees a new lab; Abbie sees her father choose the drug again. With a supply of Devil's Blood in the party's hands, every faction in Acee comes looking. The Treaty Clock ticks twice.
  - **Abbie's Choice.** Abbie refuses the cure, or takes it and walks away from all of them — to Sloane and the Munis, or back to Appalachia on her own. Antonio is left with a sealed vial and a dead monster. The Overseer decides whether Concerta has heard Antonio is alive yet.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Atlantic City"}' --auto` drafts the region, 6 places, 13 people, 5 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Mirelurk (Hunter) → `mirelurk-hunter` / `mirelurk`; Mirelurk King → `mirelurk-king` / `mirelurk-king`; Feral Ghoul → `feral-ghoul` / `feral-ghoul`; Radroach → `radroach` / `radroach`; Bloodbug → `bloodbug` / `bloodbug`; Protectron → `protectron` / `protectron`; Mister Handy → `mister-handy` / `mister-handy`; Thug → `thug` / `raider`; Crew Boss → `crew-boss` / `raider`; Psycho → `psycho-creature` / `raider-psycho`.
