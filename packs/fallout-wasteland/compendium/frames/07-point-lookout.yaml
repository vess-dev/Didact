# Point Lookout (campaigns/07-point-lookout): written by fw_compendium.py, don't edit by hand.
# The frame's quest, region, places, cast, threats (Fallout 2e's numbers, and Grimfall's
# card where its Bestiary has the threat) and clocks.
id: point-lookout
type: quest
name: Point Lookout
tags: [point-lookout, frame, side-arc]
goal: A paddlewheel ferry, the Duchess Gambit, at the Capital Wasteland docks advertises a weekend 
  at Point Lookout — the Last Resort! The boatman, Tobar, charges in caps and doesn't ask names. The
  resort is a waterlogged horror show of punga farmers, Swampfolk, and a ghoulified British spy 
  running a two-hundred-year feud with a psychic pre-war brain.
date: Tuesday, 23 October 2277
body: |-
  *A half-sunken Maryland swamp full of inbred swampfolk, a punga-drug cult, a pre-war Chinese sleeper cell, and an actual witch in the bog. Everyone here has a claim on the place. None of them should win.*

  ## GM notes

  **Date.** Tuesday, 23 October 2277: a Fallout 3 side arc: that frame's date, or whenever the Duchess Gambit docks. It is the calendar's start: a new campaign opens on it.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Point Lookout tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** Tobar's ferry. The trip takes a night and he slips the party a drink laced with punga pollen — a PC who fails a STR save wakes up with 1 Fatigue and a memory gap (they'll find out what later).

  **Plot beats.**

  1. The Ferry Arrival. Tobar lands them at the pier in the fog. The boardwalk is partially alive — ghoul shopkeepers, a shooting gallery, a tilt-a-whirl still running. The party's memory gap from the pollen drink kicks in here: they're missing one scene from the crossing the Overseer knows about.
  2. The Battle at Calvert Mansion. Almost as soon as the party explores, the Brethren of the Punga assault Calvert Mansion. Desmond Lockheart begs the party to help him defend it. Fighting for Desmond earns his patronage and opens his vault of pre-war British-intelligence supplies; refusing means picking the mansion clean after it burns.
  3. The Punga Trial. The Brethren of the Punga cult test every visitor. A PC who breathes Mother Punga's pollen takes the Punga Rite and sees a vision — the Overseer should show them something real about the island they could not otherwise know. Mechanically, the PC may immediately take back one perk they once swapped out (dropping a current one if all five slots are full) without needing a fresh copy of its magazine, once this session, and takes 1d4 Fatigue. The Cathedral will then ask a favor in return. God is listening (God is a radar dish).
  4. Obadiah Blackhall's Tome. Blackhall, patriarch of the old southern family at Blackhall Manor, has lost an occult book — the Krivbeknih — to the swampfolk. Recovering it from their ritual site is a classic side trail that leads the party into the swamp and introduces Marguerite's moonshine still and Plik's ghoul safari.
  5. The Lighthouse. Calvert's voice finally reaches the party directly — a pre-war brain in a jar under the lighthouse, broadcasting through the radar dish. He pitches himself as the only reasonable man on the island and promises a cure for ghoulification. He is lying about the cure. He is not lying about being reasonable.
  6. The Underground Lab. Beneath the lighthouse, a pre-war medical research facility — the St. Aubin medical facility — has been sealed since 2077. The party fights Robobrain security and retrieves a pre-war prototype — the Microwave Emitter or its variant. Separately, a Chinese Intelligence Bunker hidden beneath the aviary next to Calvert Mansion can be found during this arc — its logs reveal the pre-war Chinese spy ring that worked the resort, and the shadow war Desmond once fought in.
  7. Pick Your Ghoul. The party must side with Desmond, side with Calvert, or eliminate both. Each has a sponsor's weapon ready as a reward. The Punga cult will back the survivor — whoever that is — and the swamp will remember who chose what.
  8. Silence the Obelisk. Final scene. The obelisk is whatever broadcasts the island's influence — radar, brain tank, cult speaker. Silence it, claim it, or walk away with Tobar waiting at the pier (Tobar will try to drug them again on the way out).

  **Climax.**

  Calvert and Lockheart both offer the party the same job: kill the other. A third path is the Punga Rite, which lets the party enter the Obelisk directly.

  - **Kill Calvert.** Lockheart rewards you, steals the lab, vanishes east.
  - **Kill Lockheart.** Calvert promises a cure for ghoulification. He is lying — the only gratitude he pays is murder, and the party is next in his Great Game.
  - **Burn them both.** The Obelisk is the real monster. Shutting it down frees the swampfolk from their generational exposure. In the punga-haze, a deathclaw walks out of the mist and refuses to fight. It is not really there — no deathclaw has ever walked these swamps. Only the Overseer knows what the vision means.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Point Lookout"}' --auto` drafts the region, 7 places, 4 people, 4 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Swampfolk, Brawler → `swampfolk-brawler` / `swampfolk`; Swampfolk, Tracker → `swampfolk-tracker` / `swampfolk`; Swampfolk, Scrapper → `swampfolk-scrapper` / `swampfolk`; Punga Creeper → `punga-creeper` / `punga-creeper`; Children of Atom, Apostle → `children-of-atom-apostle` / `children-of-atom`.

  **Rewards in each system's catalog:** The Dismemberer (fallout-2e.the-dismemberer · grimfall.the-dismemberer); Backwater Rifle (fallout-2e.backwater-rifle · grimfall.backwater-rifle); Microwave Emitter (fallout-2e.microwave-emitter · grimfall.microwave-emitter); Punga-Ash War Paint (grimfall.tribal-war-paint).
source: campaigns/07-point-lookout#pitch
