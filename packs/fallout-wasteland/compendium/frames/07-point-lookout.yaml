    senses:
    - a mountain of barnacled shell over a writhing brood
    - a deafening shriek and the patter of hatchlings
    - rot, brine, acid
    pools:
    - name: The Queen
      dice: 8
      traits: armored bulk, anchored to the nest
      moves: Caustic Spit (ranged, area), Tail Sweep
    - name: The Brood
      dice: 4
      traits: a renewing pool; replenishes each time she shrieks them up
      moves: Swarm, Overrun
    fail: 6d "Buried in Brood" — a timer; when it runs dry, the brood buries your position and you 
      must flee.
    wants: to defend the nest and propagate — not the nest burned or to be drawn onto dry land
    note: A linked challenge — clear or wall off the Brood pool or be buried, then crack the Queen. 
      Point Lookout's Swamplurk Queen plays the same from cypress cover — her first strike out of 
      the growth comes at high stakes.
body: |-
  ## GM notes

  A monstrous swamp-bred mirelurk queen, grown enormous on punga and the cypress mire's background radiation. Lurks half-submerged in the shallows.

  Fallout 2e: 18 HP, 2 Armor, 16 STR, 12 DEX, 8 WIL, claws (d12), acid spit (d8, ranged).

  Grimfall: its card is `grimfall.mirelurk-queen` (Mirelurk Queen), in this record's grimfall block.
