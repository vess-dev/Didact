id: wastelanders-lockdown-clock
type: track
name: Lockdown Clock
knowledge: secret
tags: [wastelanders, clock]
kind: clock
size: 4
value: {value: 0, size: 4}
note: (d4, hidden; ticks only inside Vault 79) Ticks when a laser grid is tripped, a power line 
  fluctuates, or a turret alarm sounds. At 4, the vault seals every bulkhead and the Grim Reaper's 
  Hallway goes live behind the party.
source: campaigns/18-wastelanders#clocks
