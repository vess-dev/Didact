id: wastelanders-gold-fever-clock
type: track
name: Gold Fever Clock
knowledge: secret
tags: [wastelanders, clock]
kind: clock
size: 8
value: {value: 0, size: 8}
note: (d8) How far the rumor spreads. Ticks when the party talks about Vault 79 in the Wayward, 
  travels with a treasure hunter, lets a Free Radical or Blood Eagle escape a fight, or approaches 
  the vault's cave openly. At 8, a Blood Eagle war band reaches the vault the same day the party 
  does.
source: campaigns/18-wastelanders#clocks
---
id: wastelanders-rivalry-clock
type: track
name: Rivalry Clock
knowledge: secret
tags: [wastelanders, clock]
kind: clock
size: 6
value: {value: 0, size: 6}
note: "(d6) Foundation and the Crater edging toward war. Ticks when the party works openly for one faction
  in the other's territory, when either side's caravan is hit, or when Hijack or Lev acts. At 6, the feud
  goes hot: Crater raiders burn a Foundation outpost, the Settlers answer in kind, and the faction the
  party has not chosen treats them as enemies."
source: campaigns/18-wastelanders#clocks
