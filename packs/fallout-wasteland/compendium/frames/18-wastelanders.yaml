  ## GM notes

  Hornwright Industrial's giant autonomous mining robot, built to chew through mountains. Its intelligence core is damaged. Until it is replaced, the Motherlode treats anything in its tunnel as ore.

  Fallout 2e: 16 HP, 3 Armor, 18 STR, 6 DEX, 8 WIL, drill head (d12), rock crusher (d10, blast).

  Grimfall: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
