id: wastelanders-the-grim-reapers-hallway
type: monster
name: The Grim Reaper's Hallway
knowledge: secret
tags: [wastelanders, threat]
mechanics:
  fallout-2e: {category: 'Campaign: Wastelanders', rad_immune: true}
  grimfall:
    tier: mook
    upto: elite
    role: marksman
    category: Machines of the Old World
    senses: [a servo whine tracking your steps, a red acquisition chirp, cordite and dust]
    traits: ['never sleeps, never moves', dumb as its last order]
    moves: [Interlocking Fire, Missile Salvo (the big ones)]
    wants: the corridor denied — it has no other opinions
    note: A gun nest is a 4d pool; laser mounts put +1t on anything you try in their open field of 
      fire, and missile pods strike at high stakes. The terminal down the hall is worth more than 
      any grenade. Zetan wall-pods play the same, but track motion and never face away. Vault 
      networks (like 79's) run on an IFF grid — the right keycard shuts the whole grid off politely.
body: |-
  ## GM notes

  Not a creature — a corridor of military laser turrets inside Vault 79. Each round in the Hallway, every PC makes a DEX save or takes d10 damage. Captain Fields' codes, Jen's grid trick, or a well-thrown pulse grenade shuts it down for a scene.

  Grimfall: its card is `grimfall.automated-turrets` (Automated Turrets), in this record's grimfall block.
source: campaigns/18-wastelanders#the-grim-reapers-hallway
