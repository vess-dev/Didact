id: wastelanders
type: quest
name: Wastelanders
tags: [wastelanders, frame, side-arc]
goal: |-
  It is 2103. The Vault 76 dwellers have beaten the Scorched back. The plague is not gone, but it is no longer the end of the world, and word has spread. The first living strangers in a quarter-century are walking into Appalachia, and they are all here for the same thing.

  Two factions have planted flags. The Settlers of Foundation, a log-walled town on Spruce Knob, came south from the ruins of Pittsburgh under a builder named Paige. The Crater Raiders, led by Meg Groberg, are old Appalachian gangs come home. They have fortified the wreck of the pre-war space station Valiant-1 where it fell in the Toxic Valley. Between them are treasure hunters, ex-convict Free Radicals, the vicious Blood Eagles, and a bar called the Wayward that is trying hard to stay neutral.

  Then the Overseer comes home. She has two goals. The first is to inoculate every newcomer against the Scorched Plague before it starts over. The second is to open Vault 79 — the rumor's vault, built in secret to hold America's gold reserve — and use that gold to found a currency, an economy, and a peace. She cannot do it without a crew, and she cannot have both crews. The party will have to choose.
date: Tuesday, 23 October 2103
body: |-
  *A year after Reclamation Day, people come back to Appalachia: settlers out of Pittsburgh, raiders who fled the plague, treasure hunters chasing a radio rumor. The rumor is true. A secret vault in the Savage Divide holds the gold of Fort Knox, and everyone who wants it needs the one group of people who know these hills — the dwellers of Vault 76.*

  ## GM notes

  **Date.** Tuesday, 23 October 2103: 'a year after Reclamation Day', 'It is 2103' (the frame). Open a campaign on it with `didact campaign new <id> --date 'Tuesday, 23 October 2103'`, or move one there with `didact time set 'Tuesday, 23 October 2103'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Wastelanders tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** Pennington reports "non-Vault types" in the courtyard below Vault 76. Two travelers, Lacey Drummond and Isela Mejia, have come up the hill on a rumor from a new tavern called the Wayward. The party walks down to see it and finds the owner, Duchess, held at gunpoint by a Free Radical named Batter, who wants to know where a treasure hunter called Crane went. Her regular, a ghoul named Mort, settles the question with a 10mm pistol. Duchess needs help keeping her bar alive, and she is willing to pay.

  **Plot beats.**

  1. The Wayward. Duchess hires the party to stop the gang harassing her bar. The trick is to impersonate Crane: build a "Crane Treasure Hunting" beacon, broadcast it from relay tower EM-B1-27, and see who comes calling. The trail leads to the Free Radicals' lumber yard on the Ohio River and their leader, Roper, the former head guard of a Maryland prison who freed its convicts and made himself their boss. He can be killed, bargained with, or talked into leaving the Wayward alone.
  2. The Elusive Crane. Duchess shows the party what is in her locked upstairs room: Crane himself, caught by the plague in Gauley Mine and Scorched on her front porch, kept alive behind a door she could not bring herself to open. Kill him or let him be — either way, his map and keycard lead to RobCo Auto-Cache 001 deep in Gauley Mine. Crane never got in: the cache only opens for a registered Pip-Boy, and hardly anyone outside Vault 76 wears one. Down there they also find Duchess's friend Sol, wounded among the Scorched, with his Assaultron Polly headless beside him.
  3. The Overseer Comes Home. A new station crackles on the Pip-Boy: the Overseer, alive, calling her dwellers to her house on the hill above Sutton. She keeps a Mister Handy named Davenport and a year of secrets. She wants to know whether the party finished what she started, and she wants the newcomers inoculated against the plague with the vaccine the party can synthesize at the AVR Medical Center.
  4. Foundation and the Crater. Paige will listen, but he wants his co-founder and doctor, Aubrie Willem, to confirm it. Aubrie's camp near Vault 96 has been overrun by Scorched, and he is hiding in a cave, terrified the party are Scorched themselves. The raiders are harder. Rose vouches for the party to Meg, and Meg lets them into the Crater's Core on sufferance.
  5. Overseer, Overseen. The files on Vault 79 are in the secret wing of Vault-Tec University, and Professor-bot, the Protectron who runs the empty campus, will only open it for a graduate. The party is fast-tracked to the final exam: an overseer test in a vault simulation, refereeing a feud between Mister Handy engineers and medics over a sealed reactor and a missing assistant. Pass it, and the truth is in the wing: all the gold from the Fort Knox depository was moved into Vault 79 before the war.
  6. Choosing a Crew. Both factions want in, and neither will share a plan with the other. The choice is final. Foundation's job: Dr. Penelope "Penny" Hornwright, a ghoul who once ran automation for Hornwright Industrial, can wake the Motherlode, her family's giant mining robot, to drill straight into the vault. Young Jen has an answer for the laser grids. Captain Oliver Fields and his Army team — the men who moved the gold in the first place — can walk the party through the turret gauntlet called the Grim Reaper's Hallway. Then a Crater raider named Hijack kidnaps Penny and wrecks the Motherlode's brain. The Crater's job: Lucky Lou, a hundred-year-old ghoul engineer, is the demolitions expert, and he has gone missing. Gail, a super mutant, needs help first: Ra-Ra, the child she has raised as her own, chased a thief into the Grafton Steel works to get back her stuffed rabbit, Bunnabun, and has not come out. Gentleman Johnny "Two-Guns" Weston will join only if the party frees his old partner, Hal Gleeson, from the slave arena at the Watoga Civic Center. Then a raider named Lev steals Lou's detonator and leaves him tied up for a yao guai.
  7. The Heist. Vault 79: turrets, robots, laser grids, the Hallway. Behind the barracks door, the party finds survivors: Secret Service agents AC, Slick, Regs, and Mercy, sealed inside since the war. Their reactor tech, Digger, turned ghoul in the reactor accident that trapped them; he is the only one of the reactor crew who did not go feral. The agents will trade the gold for their freedom. Venting the reactor restarts the vault, sets its security booting back up, and lifts their lockdown. Then Regs and Mercy want Digger shot, and AC asks the party whether a ghoul can be trusted.
  8. Division of Wealth. The gold processing room holds 1,000 bars of bullion — a suspiciously small share of a national reserve. The main vaults are still sealed. The party must decide who gets what. See Climax.

  **Climax.**

  **Division of Wealth.** The vault is open, the bullion is stacked on the processing-room floor, and Paige or Meg is walking in to collect. Three resolutions:

  - **Keep the Deal.** The allied faction gets its promised half. It becomes the power in Appalachia, and the other side does not forget. If the party rode with the Crater and Johnny Weston still lives, he makes a play for all of it; reminding him of the Watoga arena, or of what Hal would say, can talk him down.
  - **Split It.** Half to Foundation, half to the Crater. Neither faction is satisfied, and both have something to lose. For the first time, the Settlers and Raiders share an interest in Appalachia's peace — and in the Overseer's currency working.
  - **Keep It.** The party walks out with all of it. The Overseer's economy starts in their pockets. Their allies call them traitors, and every gold bar they spend is proof.

  Whatever the party decides, the Secret Service agents settle into the vault's Gold Operations Center and open for business. Digger keeps the reactor running from its control room — if the party vouched for him. And the main vaults of Vault 79 are still sealed. Somewhere below the processing room is the rest of America's gold.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Wastelanders"}' --auto` drafts the region, 13 places, 23 people, 5 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Scorched → `scorched` / `scorchbeast`; Scorched Officer → `scorched-officer` / `scorchbeast`; Scorchbeast → `scorchbeast` / `scorchbeast`; Feral Ghoul → `feral-ghoul` / `feral-ghoul`; Glowing One → `glowing-one` / `feral-ghoul`; Super Mutant, Grunt → `super-mutant-grunt` / `super-mutant`; Deathclaw → `deathclaw` / `deathclaw`; Yao Guai → `yao-guai` / `yao-guai`; Bloodbug → `bloodbug` / `bloodbug`; Mole Miner → `mole-miner` / `mole-miner`; Thug → `thug` / `raider`; Crew Boss → `crew-boss` / `raider`; Psycho → `psycho-creature` / `raider-psycho`; Protectron → `protectron` / `protectron`; Mister Gutsy → `mister-gutsy` / `mister-gutsy`; Assaultron → `assaultron` / `assaultron`; Eyebot → `eyebot` / `eyebot`; Turret, Laser → `turret-laser` / `automated-turrets`.

  **Rewards in each system's catalog:** Secret Service Armor (fallout-2e.secret-service-armor); T-65 Power Armor (fallout-2e.t-65-power-armor).
