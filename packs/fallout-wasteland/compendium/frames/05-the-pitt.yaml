id: the-pitt
type: quest
name: The Pitt
tags: [the-pitt, frame, side-arc]
goal: The ruins of Pittsburgh are a walled industrial hell. Lord Ashur, an ex-Brotherhood paladin, 
  rules from Haven, an intact tower above the mills. His slaves work the forges in a rad-saturated 
  haze, slowly becoming Trogs. His infant daughter is immune — her blood may be a cure, or a lie 
  Ashur tells himself.
date: Tuesday, 23 October 2277
body: |-
  *Pittsburgh survived the war and wishes it hadn't. A raider-run steel city where the slaves forge the weapons that keep them enslaved, and a healthy baby in a crib may hold a cure for the mutation that's eating everyone.*

  ## GM notes

  **Date.** Tuesday, 23 October 2277: a Fallout 3 side arc: that frame's date, or whenever Wernher finds the party. It is the calendar's start: a new campaign opens on it.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup The Pitt tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** A runaway slave named Wernher finds the party in the Capital Wasteland with a pitch: help him rescue his people. The way in is a train tunnel in the far northwest — one-way, trog-infested, no turning back. The party surrenders their gear at the gate and enters as slaves.

  **Plot beats.**

  1. The Rail Tunnel. The one-way crawl into the Pitt. Trogs harass the party the whole way. The party surrenders their gear at a Pitt Raider checkpoint; the Raider who takes their weapons keeps a single small item as tribute and the rest goes into a locked storage shed the party will need to break into later.
  2. The Yard. Dropped into the slave pens at dawn. Midea pulls the party aside on the second shift and explains the resistance, the cure, and Wernher's version of events. She warns that Wernher is not entirely to be trusted. The Heat Clock starts ticking from here.
  3. The Steelyard. The party is sent to collect steel ingots in the irradiated steelyard — the only way to earn standing with the raiders. Trogs and wildmen prowl the ruins. A full haul is worth ten ingots; a clever party can stash extras. Everett, the mill foreman, trades ingots for better gear.
  4. Downtown. Downtown's skyscrapers are trog country. Mex guards the gate in — a sadistic raider with a rifle, mines, and a talent for making slaves disappear. Getting past him clean earns the party access to the scavenging runs Midea's resistance needs. Getting past him loud draws Heat.
  5. The Hole. Winning Ashur's arena is the only sanctioned way out of the Yard. The fight is brutal — start with a detachment, end with a named opponent, and roll in the auto-axe. Victors are presented to Ashur personally. The party may accept his invitation to Haven as "new guests" and enter the keep under a clean flag.
  6. Haven. Ashur's gated keep. The party meets Sandra Kundanika, sees Marie, and hears Ashur's pitch — the cure is in the baby's blood and he will not give her up. Sandra, privately, would hand over a stabilized vial if asked correctly. The Cure Clock begins ticking toward Wernher's breaking point.
  7. The Decision. Wernher is ready to raid Haven and take Marie by force. Midea begs for a delay. The party has a window to steal the vial, extract Marie, negotiate with Ashur, or play all three sides against the fourth. What they do resolves the campaign.
  8. Recovery. The gear shed. A final fight at the rail tunnel if the party is fleeing with Marie or the vial. Ashur's radio broadcast follows the party out of the Pitt no matter what they chose.

  **Climax.**

  Wernher wants the baby. Ashur wants the work to continue. Sandra wants both her daughter *and* the cure. Three endings:

  - **Take Marie.** The slaves rise. The city burns for days. The party walks out with the cure and the baby. Ashur dies in his keep. Marie grows up in a safer place — the wasteland owes the party a debt they will remember.
  - **Leave Marie, free the slaves.** Sandra hands over a stabilized vial under the table. Ashur lives but loses his workforce; the Pitt becomes a ghost town within a year.
  - **Side with Ashur.** The resistance is crushed. Ashur rewards the party lavishly and names them citizens of his new nation. Wernher dies cursing their name. The cure is real, eventually, but years away.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "The Pitt"}' --auto` drafts the region, 6 places, 5 people, 3 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Wildman → `wildman` / `trog`; Trog → `trog` / `trog`; Trog Brute → `trog-brute` / `trog`; Trog Savage → `trog-savage` / `trog`; Pitt Raider → `pitt-raider` / `raider`.

  **Rewards in each system's catalog:** The Cure (Relic) (grimfall.the-cure-maries-blood); The Mauler (fallout-2e.the-mauler); The Metal Blaster (fallout-2e.metal-blaster · grimfall.metal-blaster); Ashur's Power Armor (fallout-2e.ashurs-power-armor · grimfall.ashurs-power-armor); Union Power Armor (fallout-2e.union-power-armor).
source: campaigns/05-the-pitt#pitch
