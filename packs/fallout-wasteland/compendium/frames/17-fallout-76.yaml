body: |-
  ## GM notes

  An unmanned vertibird drone, painted in Air Force grey, guarding the cargobots of the automated nuclear network.

  Fallout 2e: 6 HP, 2 Armor, 6 STR, 15 DEX, 8 WIL, chin laser (d8).

  Grimfall: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
source: campaigns/17-fallout-76#sac-vertibot
