body: |-
  ## GM notes

  **Rose** — a Miss Nanny playing a dead raider queen. Craves chems she can't take. Refuses to leave the Top of the World, because leaving would be betraying David.

  A Miss Nanny with a scrap-metal mohawk, wrapped chains, and painted tattoos, voiced by a dead woman's recordings. Rarely a combat encounter; more often the party's most dangerous friend.

  Fallout 2e: 6 HP, 2 Armor, 10 STR, 13 DEX, 15 WIL, buzzsaw (d8), flamer (d8, blast).

  Grimfall: its Bestiary has no card for it: frame it as a challenge (Chapter 9) with a tier and a role (Chapter 7).
