  Enclave's civil war. At 6, MODUS seals the room the party stands in and begins pumping gas, as it 
  did to Eckhart's dissenters. The party has three rounds to break out or to talk it down (a WIL 
  save, which counts as WIL −4 unless someone holds a general's commission).
