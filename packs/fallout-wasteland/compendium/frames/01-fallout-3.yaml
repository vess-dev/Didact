id: fallout-3
type: quest
name: Fallout 3
aliases: [Fallout 3 Main Campaign]
tags: [fallout-3, frame, main-campaign]
goal: |-
  Vault 101 has been sealed since the bombs fell. You grew up inside, ran the G.O.A.T., stood in the schoolroom under fluorescents that have never been off in your lifetime. One night your father James slipped out the front door. The Overseer's guards hunt for him, then for you, and by dawn you are standing on a hillside under a sky you have never seen, blinking.

  James has gone to finish something he started before you were born: Project Purity, an attempt to scrub the Potomac basin clean of radiation and pour that water across the ruined Capital Wasteland. He cannot do it alone. Neither can you. And the Enclave — a pre-war remnant whose hidden bunker has watched the Wastes since 2077 — will move to seize the purifier the moment it comes online. What you do inside the Jefferson Memorial rotunda decides whether the Capital Wasteland drinks clean water or coughs up FEV-poisoned blood.
date: Tuesday, 23 October 2277
body: |-
  *You grew up in Vault 101 and you thought the door would never open. Then your father walked out, and you had to follow him into the ruined Capital Wasteland to find out why. The reason he left will decide whether the water of the Potomac runs clean or poisoned — and whether you walk out of the Jefferson Memorial alive.*

  ## GM notes

  **Date.** Tuesday, 23 October 2277: two centuries after the war, the book's own default moment (Player's Guide, The Commonwealth of Ashes); Vault 112 has dreamed for 200 years. It is the calendar's start: a new campaign opens on it.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Fallout 3 tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** The Vault 101 door opens at 0300 hours. Vault-Tec klaxons, Amata's scared voice over the PA begging you to leave, and the Overseer's guards closing from both corridors. You step out of the vault into the unblinking light of the Capital Wasteland. Down the hill is Megaton — a settlement built around an unexploded pre-war nuclear bomb. James passed through hours ago. Someone at Moriarty's Saloon remembers him.

  **Plot beats.**

  1. The Escape. Radroaches and vault security in the upper corridors. Amata begs the party to run, not fight — her father, the Overseer, will execute any vault dweller caught abetting you. Getting out without killing vault security sets up a return arc that rewards a peaceable player late. The last door opens onto a hillside and a horizon that keeps going.
  2. Megaton and the Bomb. Descend into the crater. Mister Burke, a lean man in a suit at Moriarty's Saloon, offers the party 500 caps to arm the undetonated bomb at the town's center. Sheriff Lucas Simms asks the party to disarm it instead. Whatever the party does becomes their reputation on the radio, read aloud by a DJ who was not there.
  3. Following the Trail. Moriarty remembers James. James asked about Galaxy News Radio, looking for Three Dog, looking for a working piece of pre-war comms hardware. The trail runs through a bombed-out DC, super mutants in the Metro tunnels, and the GNR plaza where a Brotherhood of Steel squad is pinned down by a Super Mutant Behemoth. Help them and Three Dog will hear about it before you reach the door.
  4. Three Dog's Request. Three Dog will share what he knows about James if the party repairs the Galaxy News Radio dish — mounted atop the Washington Monument, guarded by a super mutant sniper. Completing the repair makes the party's deeds audible across the Wasteland. Karma from here on is amplified — Three Dog will either call them saints or monsters, and strangers will react accordingly.
  5. Rivet City and Dr. Li. The trail leads to a pre-war aircraft carrier beached on the Potomac. Dr. Madison Li, James's old colleague, reluctantly confirms James returned to the Jefferson Memorial — the original Purity site. She thinks it's a mistake. She's about to be proven right.
  6. The Jefferson Memorial. The party reaches the rotunda and finds James. They also find Colonel Augustus Autumn already on approach with an Enclave strike team. Autumn demands the activation codes. James refuses — and dies flooding the control chamber with radiation to deny the Enclave the purifier. The party escapes through a flooded maintenance tunnel, emerging, half-drowned, in the Taft Tunnel.
  7. The Citadel. The Brotherhood of Steel has taken the Pentagon ruins. Elder Owyn Lyons offers an alliance: find a Garden of Eden Creation Kit — a pre-war terraforming device — and bring it back to finish what James started. The G.E.C.K. is in Vault 87, overrun by super mutants, accessible only through the long caverns behind Little Lamplight — the vault's own front door sits in the Glowing Zone's lethal radiation. The party can also rescue a captive Fawkes from Vault 87 — a lucid super mutant who can walk through the Rad field of the purifier chamber and help them.
  8. Raven Rock and Eden. Captured, interrogated by President John Henry Eden — a pre-war ZAX AI that has convinced itself it is the last legitimate American government. Eden hands the party a vial of modified FEV and explains its purpose: released into the purifier, the water itself will kill every mutant, ghoul, and "impure" wastelander who drinks. The party can accept the vial, refuse it, or talk Eden into his own self-destruction — a WIL save the party can only attempt with transcripts mined from Raven Rock's terminals.
  9. Liberty Prime and the Final Push. Brotherhood and Enclave meet on the broken tidal basin. Liberty Prime — a forty-foot pre-war combat robot — leads the charge. "Democracy is non-negotiable." The party fights their way toward the control room where Colonel Autumn has begun a final activation countdown.
  10. The Activation Chamber. Three hundred rads in the rotunda. Someone has to step into the radiation and enter the code. See Climax below.

  **Climax.**

  Three hundred rads in the Project Purity control chamber. Someone has to step into the radiation and enter the activation code. Resolutions:

  - **Purify.** A PC enters the chamber and activates the purifier clean. The PC instantly fills all ten Rad slots (dropping to 0 HP) and resolves a Rad Scar save for each Rad as it lands; a PC already carrying Rad Scars almost certainly reaches a third. Any PC who does faces the ghoulification roll at the next long rest. The water runs clean. The Capital Wasteland is saved. The PC may return as a ghoul or as a face in a mural above the rotunda.
  - **Send a ghoul or Super Mutant.** Fawkes, if recruited, walks into the chamber without harm. So can a ghoul PC — the Rads still fill their slots, but no Rad Scars follow. The purifier runs clean. The party stands in the rotunda and watches the water run blue for the first time in two centuries.
  - **Poison.** If the party accepted Eden's vial and drops it into the purifier, the water kills every ghoul, super mutant, and "impure" being who drinks. The party's Karma slides toward −3 (Hated), one step per session as word spreads. The Enclave salutes. The Wasteland is cleaner, and much smaller.
  - **Walk away.** The party refuses to activate. Autumn dies in the firefight regardless, but the dream dies with James. Brotherhood occupies the Memorial. The party is not welcome back to the Citadel. Leave the DC ruins behind.

  Whichever ending the party picks, **Broken Steel** picks up the story two weeks later. A survivor crawls out of the rotunda with a limp and a half-remembered name, and the Enclave is not done.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Fallout 3"}' --auto` drafts the region, 16 places, 14 people, 4 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Not trackers.** Karma Clock: under Fallout 2e, the party record's karma ladder: `didact do karma party=<it> shift=±1 why='…'`; under Grimfall, no ladder: karma is what the radio says about them, and it decides who holds their warrant (Chapter 9).

  **Bestiary** (Fallout 2e / Grimfall): Super Mutant, Grunt → `super-mutant-grunt` / `super-mutant`; Super Mutant, Brute → `super-mutant-brute` / `super-mutant`; Super Mutant, Master → `super-mutant-master` / `super-mutant`; Behemoth (Super Mutant) → `behemoth-super-mutant` / `super-mutant-behemoth`; Feral Ghoul → `feral-ghoul` / `feral-ghoul`; Glowing One → `glowing-one` / `feral-ghoul`; Enclave Trooper → `enclave-trooper` / `enclave-patrol`; Enclave Officer → `enclave-officer` / `enclave-patrol`; Brotherhood Knight → `brotherhood-knight` / `brotherhood-patrol`; Brotherhood Paladin → `brotherhood-paladin` / `power-armored-trooper`; Thug → `thug` / `raider`; Talon Company Merc → `talon-company-merc` / `gunners`; Regulator → `regulator` / `bounty-crews`.

  **Rewards in each system's catalog:** Lincoln's Repeater (fallout-2e.lincolns-repeater · grimfall.lincolns-repeater); The Shocker (fallout-2e.the-shocker · grimfall.the-shocker); A3-21's Rifle (fallout-2e.a3-21s-rifle · grimfall.a3-21s-plasma-rifle); Colonel Autumn's 10mm Pistol (fallout-2e.colonel-autumns-10mm-pistol · grimfall.colonel-autumns-10mm); Laser Pistol (fallout-2e.colonel-autumns-laser-pistol · grimfall.autumns-laser-pistol); James's Wedding Ring (grimfall.jamess-wedding-ring); Project Purity Flask (grimfall.project-purity-flask); Pip-Boy 3000 (fallout-2e.pip-boy-3000-functional · grimfall.pip-boy-3000); Virtual Reality Goggles (grimfall.virtual-reality-goggles-v112).
