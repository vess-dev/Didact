id: fallout-3-liberty-prime
type: monster
name: Liberty Prime
knowledge: secret
tags: [fallout-3, threat]
mechanics:
  fallout-2e:
    category: 'Campaign: Fallout 3'
    hp: 60
    armor: 3
    STR: 18
    DEX: 8
    WIL: 10
    rad_immune: true
    attacks:
    - name: twin-laser
      damage: d12
      qualities: [blast]
    - name: stomp
      damage: d10
      qualities: [blast]
    abilities:
    - "Siege Engine: Prime's attacks ignore up to 2 Armor. He is not intended as a survivable target —
      the Enclave's orbital countermeasure eventually downs him, but not until Broken Steel opens."
  grimfall:
    tier: boss
    role: blaster
    category: Named Threats & Legends
    senses:
    - towering blue-and-steel bulk
    - a patriotic broadcast and a crackling eye-laser
    - ozone and pulverized concrete
    pools:
    - name: The Core
      dice: 8
      traits: near-invulnerable; reach it only once Prime is toppled or shut down
      moves: Eye-Laser Sweep, Hurl a Nuke
    - name: Leg Servos
      dice: 6
      traits: cripple them to topple the colossus and expose the Core
      moves: Crushing Stride
    - name: Reactor Housing
      dice: 6
      traits: overload or vent it to shut Prime down
      moves: (sabotage to win)
    fail: It reaches and razes whatever it was marching on.
    wants: to advance and annihilate its designated enemy — it wants nothing else and cannot be 
      reasoned with
    note: A linked challenge — you don't "damage" Prime, you topple it (Legs) or kill its power 
      (Reactor) to get at the locked Core.
body: |-
  ## GM notes

  A pre-war combat robot forty feet tall. "Democracy is non-negotiable." Allied asset, not a combat encounter for the party — a moving battlefield advantage. All enemies within thirty feet of Prime take blast damage (d12) from his cover fire at the start of each combat round.

  Fallout 2e: 60 HP, 3 Armor, 18 STR, 8 DEX, 10 WIL, twin-laser (d12, blast), stomp (d10, blast).

  Fallout 2e's Bestiary has the same stat block: `fallout-2e.liberty-prime`.

  Grimfall: its card is `grimfall.liberty-prime` (Liberty Prime), in this record's grimfall block.
source: campaigns/01-fallout-3#liberty-prime
