id: fallout-3-purity-clock
type: track
name: Purity Clock
knowledge: secret
tags: [fallout-3, clock]
kind: clock
size: 6
value: {value: 0, size: 6}
note: (d6) The Enclave's approach. Ticks when the party first reaches the Memorial, when James is 
  named on open radio, when Dr. Li is recruited, and at each subsequent plot beat toward activation.
  At 1–3 the Enclave is distant; at 4–5 they have scouts in the Wasteland; at 6 they assault the 
  Memorial.
source: campaigns/01-fallout-3#clocks
