id: fallout-3-eden-clock
type: track
name: Eden Clock
knowledge: secret
tags: [fallout-3, clock]
kind: clock
size: 4
value: {value: 0, size: 4}
note: (d4) President Eden's awareness of the party. Ticks when the party passes through an Enclave 
  checkpoint, when a named Enclave officer survives and returns a report, and when Three Dog 
  broadcasts a deed Eden would care about. At 4, Enclave strike teams hunt them on sight.
source: campaigns/01-fallout-3#clocks
