id: fallout-3-karma-clock
type: track
name: Karma Clock
knowledge: secret
tags: [fallout-3, clock]
kind: counter
min: -3
max: 3
value: 0
note: "(Party Karma ladder; see Overseer's Guide → Party Karma) Ticks when the party makes a major public
  choice — the bomb, the slavers, Tenpenny, Paradise Falls — shifting karma ±1, at most one step per session.
  Three Dog's broadcasts amplify the effect for first-meeting reactions — for as long as he is talking
  about the party, treat their Karma as one step further from 0 (to the ladder's ends) on Reaction rolls
  in the Capital Wasteland. [under Fallout 2e, the party record's karma ladder: `didact do karma party=<it>
  shift=±1 why='…'`; under Grimfall, no ladder: karma is what the radio says about them, and it decides
  who holds their warrant (Chapter 9)]"
source: campaigns/01-fallout-3#clocks
