id: fallout-3-president-john-henry-eden
type: monster
name: President John Henry Eden
knowledge: secret
tags: [fallout-3, threat, cast]
mechanics:
  fallout-2e:
    category: 'Campaign: Fallout 3'
    abilities: ['Not a combat encounter (— HP, — combat): Voice only.']
  grimfall:
    tier: elite
    role: tactician
    category: Named Threats & Legends
    senses:
    - blinking mainframe banks and a glowing console
    - a folksy, reassuring radio drawl
    - hot electronics and recycled air
    pools:
    - name: The Enclave Bunker
      dice: 6
      traits: turrets, troops, blast doors; shields the core
      moves: Order an Execution, Seal the Bulkheads
    - name: Eden's Core
      dice: 4
      traits: locked behind the bunker; out-argue it, don't shoot it
      moves: Address the Nation, Plead Its Case
    fail: 8d "Purge Protocol" — a timer; when it runs dry, Eden releases the modified FEV and damns 
      the wasteland.
    wants: to "purify" America by cold logic — not to face a contradiction it cannot resolve
    note: 'An elite as a social-siege linked challenge (6d + 4d). The classic win: reach the Core and
      talk it into self-destruction.'
body: |-
  ## GM notes

  **President John Henry Eden** — a pre-war ZAX AI that believes he is the United States government. Articulate, paternal, genocidal.

  A ZAX-class pre-war AI. Not a combat threat. A WIL-save encounter: the party may talk him into self-destruction if they can pass a WIL save backed by evidence gathered in Raven Rock's terminals — no evidence, no save. Success: no final battle needed; Raven Rock self-destructs with Eden inside. Failure: the Enclave assault goes full force at Purity.

  Fallout 2e: — HP, — combat. Voice only.

  Grimfall: its card is `grimfall.president-john-henry-eden` (President John Henry Eden), in this record's grimfall block.
source: campaigns/01-fallout-3#president-john-henry-eden
