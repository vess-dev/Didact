id: automatron
type: quest
name: Automatron
tags: [automatron, frame, side-arc]
goal: A genius wasteland engineer — Isabel Cruz — has put on a mask, taken up a megaphone, and 
  declared herself the Mechanist, using a cache of modular robot parts to "protect" the Commonwealth
  by force. Her creations are rewriting themselves faster than she can command. The party is hired 
  to find her lair, shut down the production line, and confront whatever she has become.
date: Sunday, 23 October 2287
body: |-
  *A caravan begs for help on the radio. By the time the party arrives the caravan is a pile of scrap and the robots that killed them are still standing in formation. A voice calling itself the Mechanist is building an army. Somebody has to unbuild it.*

  ## GM notes

  **Date.** Sunday, 23 October 2287: a Fallout 4 side arc: that frame's date, or whenever the distress call comes. Open a campaign on it with `didact campaign new <id> --date 'Sunday, 23 October 2287'`, or move one there with `didact time set 'Sunday, 23 October 2287'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Automatron tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** The Distress Call: a radio beacon from the ambushed caravan. Survivors point to an old warehouse. From there, a robot finger points to a robot mouth, points to a robot ear, points — eventually — to the Mechanist's lair.

  **Plot beats.**

  1. The Caravan Wreck. The distress call leads to a line of destroyed brahmin, a scattered shipment of scrap, and a single surviving robot — Ada — standing over the bodies of her crew. She is shaken but lucid. She wants to find the Mechanist and put her down.
  2. Ada Joins. The party meets Ada properly. She is the campaign's moral weight — a robot who watched her people die. Let her speak during quiet scenes; she does not say much, but she says the right things. She pushes the party toward the trail.
  3. Interrogating the Signal. The party builds a robot workbench (or finds one) and interrogates a captured Robobrain to trace the Mechanist's command signal. The signal bounces through old military and pre-war infrastructure. A PC who cracks the Robobrain's encryption learns the source is routed through a pre-war satellite relay at Fort Hagen.
  4. Fort Hagen Satellite Array. The relay station the Mechanist uses to broadcast commands. Ahab, the Rust Devils' deathclaw-skulled sentry bot, holds the hangar bay; Rust Devil scavengers under their leader Ivey lurk in the tunnels; and a Robobrain head on a shelf named Jezebel — immobile, charming, and cruel — offers to bargain. She will give up the Mechanist's lair coordinates if the party carries her head out with them. She is a risk either way.
  5. The Approach to the Lair. A short journey to the Mechanist's headquarters at the RobCo Sales & Service Center — a pre-war showroom with a hidden underground complex. Rogue Mister Handies in the approach tunnels, each one convinced it is still running a pre-war errand. The Army Clock should be ticking hard by this point — if it hits 6, a wave of Isabel's robots assaults the party's nearest settlement off-camera.
  6. The Lair. Isabel Cruz waits on a metal throne above a pit of failed prototypes beneath the RobCo building. Her mask distorts her voice into something imperial. The Isabel Clock determines how ready she is to listen when the party confronts her. The climax is a conversation as often as it is a fight. See Climax below.

  **Climax.**

  Confronting the Mechanist on her throne. Three outcomes:

  - **Unmask her.** A peaceful resolution if the party has been ticking the **Isabel Clock** toward 4. She takes off the mask and weeps. Ada forgives her — or doesn't. Isabel becomes a Workshop NPC.
  - **Take the throne.** Kill Isabel and take the factory. The party now has a *robot production line* — one custom bot per Downtime Action, but every robot rolls 1d6 on build; a 1 means it went rogue and will return later.
  - **Blow the factory.** Ada gets her revenge. Everything collapses. The party walks out with the head of Jezebel clipped to their belt and a story told at every settlement for months.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Automatron"}' --auto` drafts the region, 4 places, 4 people, 4 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Junkbot → `junkbot` / `scrap-bots`; Protectron → `protectron` / `protectron`; Mister Handy → `mister-handy` / `mister-handy`; Mister Gutsy → `mister-gutsy` / `mister-gutsy`; Robobrain → `robobrain` / `robobrain`; Assaultron → `assaultron` / `assaultron`; Sentry Bot → `sentry-bot` / `sentry-bot`.

  **Rewards in each system's catalog:** The Mechanist's Helmet (fallout-2e.the-mechanists-helmet · grimfall.the-mechanists-helmet); Robobrain Chassis Plans (grimfall.robobrain-chassis-plans).
source: campaigns/13-automatron#pitch
