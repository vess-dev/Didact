id: fallout-new-vegas-dam-clock
type: track
name: Dam Clock
knowledge: secret
tags: [fallout-new-vegas, clock]
kind: clock
size: 12
value: {value: 0, size: 12}
note: (d12) The armies converge. Ticks when a PC publicly pledges to a faction, the party takes an 
  outlying asset (Khans, Brotherhood, Boomers, HELIOS One), a McCarran or Fort mission is completed,
  or any FNV DLC reaches its climax. At 12, the Second Battle begins whether the party is ready or 
  not.
source: campaigns/02-fallout-new-vegas#clocks
---
id: fallout-new-vegas-benny-clock
type: track
name: Benny Clock
knowledge: secret
tags: [fallout-new-vegas, clock]
kind: clock
size: 4
value: {value: 0, size: 4}
note: (d4) Benny's flight. Starts once the party has spoken to Manny Vargas. Ticks when the party 
  finishes a major Strip-facing scene without confronting Benny. At 4, Benny flees the Strip for the
  Fort — where the Legion takes him prisoner, a gift kneeling in Caesar's tent.
source: campaigns/02-fallout-new-vegas#clocks
---
id: fallout-new-vegas-legion-frumentarii-clock
type: track
name: Legion Frumentarii Clock
knowledge: secret
tags: [fallout-new-vegas, clock]
kind: clock
size: 6
value: {value: 0, size: 6}
note: (d6) How many of Vulpes Inculta's spies the party has tripped. Ticks when a named Legion agent
  escapes, a Legion-sympathizer NPC is left alive after questioning, or Vulpes himself is seen and 
  not killed. At 6, a four-man Legion hit team tries to assassinate the party during a scene of the 
  Overseer's pick.
source: campaigns/02-fallout-new-vegas#clocks
---
id: fallout-new-vegas-courier-clock
type: track
name: Courier Clock
knowledge: secret
tags: [fallout-new-vegas, clock]
kind: clock
size: 8
value: {value: 0, size: 8}
note: (d8, hidden, Overseer-only) Ticks when the party first enters a major settlement (Primm, 
  Novac, the Strip, the Fort, Camp McCarran, Nellis, Jacobstown, Hidden Valley). On each tick, the 
  Overseer narrates a letter, a rumor, or a voice that recognizes the PC as the Courier who 
  survived. At 8, the whole Mojave knows the story before the party walks in.
source: campaigns/02-fallout-new-vegas#clocks
