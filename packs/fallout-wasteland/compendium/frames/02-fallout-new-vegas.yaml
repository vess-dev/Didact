id: fallout-new-vegas-mister-house
type: monster
name: Mister House
knowledge: secret
tags: [fallout-new-vegas, threat, cast]
mechanics:
  fallout-2e:
    category: 'Campaign: Fallout: New Vegas'
    abilities:
    - 'Not a combat encounter (— HP, — combat): Voice on a monitor.'
    - "Terms: Mr. House's contract is literal. Breaking it activates every Securitron on the Strip against
      the party."
  grimfall:
    tier: elite
    role: tactician
    category: Named Threats & Legends
    senses:
    - a flickering monochrome face on every screen
    - a clipped, impatient cultured voice
    - sterile cold and humming servers
    pools:
    - name: Securitron Army
      dice: 6
      traits: everywhere at once, expendable, endless
      moves: Swarm the Strip, Pin You Down
    - name: The Network
      dice: 6
      traits: cameras, doors, accounts; shields House
      moves: Lock You Out, See Everything
    - name: Mr. House
      dice: 4
      traits: locked in his pod behind the Network; frail in the flesh
      moves: Make an Offer, Call in a Marker
    fail: 8d "Lockdown" — a timer; when it runs dry, House seals the Strip and the Securitrons 
      converge.
    wants: Vegas perfected under his control and a future for mankind — not his pod cracked open or 
      his network cut
    note: A linked challenge of intrigue and infrastructure, not a brawl. Sever the Network to reach
      the frail man inside.
body: |-
  ## GM notes

  **Mister House** — the invisible hand of New Vegas. Speaks only through screens. Pre-war CEO in a sealed chamber, 261 years old.

  Speaks only through the Lucky 38's PA or a Securitron proxy. Unkillable until the party breaches his life-support chamber and severs his feeds — a scene, not a combat.

  Fallout 2e: — HP, — combat. Voice on a monitor.

  Grimfall: its card is `grimfall.mr-house` (Mr. House), in this record's grimfall block.
source: campaigns/02-fallout-new-vegas#mister-house
