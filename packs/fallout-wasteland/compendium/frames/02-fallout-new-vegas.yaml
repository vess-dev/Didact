id: fallout-new-vegas
type: quest
name: 'Fallout: New Vegas'
aliases: ['Fallout: New Vegas Main Campaign']
tags: [fallout-new-vegas, frame, main-campaign]
goal: |-
  You were shot, buried, and dug up alive by a Securitron named Victor. The man who shot you — Benny, a casino boss at the Tops — took the package you were carrying: a Platinum Chip commissioned by Mr. House, the reclusive pre-war CEO who secretly runs New Vegas from a penthouse atop the Lucky 38. The Chip is the key to House's endgame — an army of pre-war combat robots buried beneath the Fort, keyed to whoever plugs the Chip into the right terminal.

  Three forces are converging on Hoover Dam: the New California Republic, a federal democracy stretched thin across a frontier it cannot quite hold; Caesar's Legion, a slave empire rolling west from Arizona; and Mr. House, who intends both of them to break on the Mojave's shore so Vegas can rise untouched. A fourth option — an independent Vegas piloted by a liberated Securitron AI named Yes Man — appears if the party kills Benny and takes his place.

  Your first mission is simple: find the man who shot you. Every step after that builds toward the Second Battle of Hoover Dam.
date: Wednesday, 19 October 2281
body: |-
  *You were a courier. Someone hired you to carry a platinum chip across the Mojave. A man in a checkered coat shot you in the head in the Goodsprings cemetery. You woke up in Doc Mitchell's house with a patch in your skull and a score to settle. By the time you're done, three armies will have decided the fate of Hoover Dam — and you will have picked the winner.*

  ## GM notes

  **Date.** Wednesday, 19 October 2281: the year New Canaan burned (Vault 70) and Mister House is 261; the day the game it adapts opens, Joe Cobb's raid a day or two off. Open a campaign on it with `didact campaign new <id> --date 'Wednesday, 19 October 2281'`, or move one there with `didact time set 'Wednesday, 19 October 2281'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Fallout: New Vegas tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** You wake in Doc Mitchell's house in Goodsprings, southern Mojave, with a headache and a story you don't remember. Mitchell patches you up, runs the Vigor Tester, asks a few questions, and sets you loose. The town is in trouble: Joe Cobb and a crew of Powder Gangers plan to raid in a day or two. Whether you defend Goodsprings or slip out the back sets your reputation with the NCR, who will hear about it either way.

  **Plot beats.**

  1. Goodsprings. Doc Mitchell, Sunny Smiles, Trudy behind the bar at the Prospector Saloon. Joe Cobb and his Powder Gangers coming tomorrow morning. The party defends or flees. Sunny gives a PC a ranch-dog companion if they help. Chet at the General Store reluctantly trades supplies for favors. Victor the Securitron is also in town and keeps being around.
  2. Primm and Nipton. South on the I-15. Primm is a broken casino town looking for a sheriff (Primm Slim's automated warning, Deputy Beagle, the convict boss holed up in the Bison Steve hotel). Nipton is worse — the Legion rolled through a day before the party, raffled the town, and crucified half the population. A lone Legion frumentarius stands on the school steps and explains the lesson.
  3. Novac and Boulder City. The party picks up the Benny trail at Novac — a roadside motel with a giant dinosaur statue called Dinky. Manny Vargas, a sniper at Dinky's mouth, remembers Benny heading north for the Strip. Boulder City, a ruined NCR checkpoint town, offers the party an NCR faction contact — Lieutenant Monroe, mid-standoff with the same Great Khans who helped Benny dig the Courier's grave.
  4. The Strip. New Vegas is still lit. The NCR has the gate, House's Securitrons have the inside. Credit check before you walk in. Benny is at The Tops, a rat-pack-themed casino. The party confronts him. Three outcomes: kill him in his suite and take Maria off his body, arrest him and haul him to Mr. House, or slip into bed with him and take the Chip in the morning.
  5. Mister House's Offer. With the Chip, the party may accept an audience at the Lucky 38. Mr. House reveals himself as a pre-war CEO sealed in a life-support chamber for over two centuries. He offers a contract: deliver the Chip to the terminal beneath the Fort, secure two outlying assets, and win the Mojave for Vegas.
  6. The NCR's Offer. Contact with Colonel James Hsu at Camp McCarran makes the case for the Republic. Hsu needs the party to investigate a missing caravan, which uncovers a Legion spy network (Frumentarii) inside the NCR itself. A patriot run with a brittle hierarchy.
  7. Caesar's Offer. The party is summoned to The Fort, on the far side of the Colorado. They meet Caesar — Edward Sallow — face to face. He offers them the favor of Rome. He also wants something done about the Brotherhood of Steel hiding in Hidden Valley (a bunker he cannot afford to leave at his back). Agreeing is crossing a line; disagreeing means killing your way out of camp.
  8. The Independent Road. If the party killed Benny or let him escape, they left with a gift: Yes Man, a hackable Securitron who now answers to the party directly. Yes Man makes a fourth path: a free Vegas under no flag but the party's, won by turning every other faction's assets to the party's use.
  9. The Outlying Assets. The Mojave's three outlying powers — the Great Khans, the Brotherhood of Steel, and the Boomers — can be recruited for or against the Dam. Each requires a side arc: defusing the Khans' alliance with the Legion, brokering with Elder McNamara at Hidden Valley, and earning the Boomers' trust at Nellis Air Force Base by recovering a crashed B-29 from the bottom of Lake Mead.
  10. The Second Battle of Hoover Dam. The party, their allies, and a hundred miles of broken highway meet at the Dam. The Legion pushes from the east. The NCR holds the west. Mr. House or Yes Man sends the Securitron army, or not. The Dam holds, or it doesn't. See Climax.

  **Climax.**

  The Second Battle of Hoover Dam. Four endings:

  - **For the NCR.** General Oliver gives the orders. The Dam holds; the flag flies. Vegas becomes an NCR client state. The Followers of the Apocalypse open two clinics. Caesar dies of his tumor — or under a PC's blade at the command center.
  - **For the Legion.** The Dam falls to the Bull. General Oliver makes his last stand in the command compound, where he can be fought, shamed, or talked into marching his troopers home. The Mojave is free of NCR forever; so is every slave cuffed to a Legion camp.
  - **For Mister House.** The upgraded Securitron army routs both NCR and Legion. House broadcasts a victory speech from the Lucky 38. The party delivered Vegas to a pre-war ghost; in ten years the Strip is bigger and colder than it ever was.
  - **For an Independent Vegas (Yes Man).** The Securitron army answers to *the party* now. NCR and Legion both break on the Dam. Yes Man broadcasts a cheerful message from the 38. The party is, whether they wanted to be or not, the new government.

  In every ending but the Legion's, the last obstacle is the Legate's camp. Lanius personally duels the party's strongest fighter — or withdraws, if a PC can show him that the East cannot hold the Mojave (a WIL save, and a real argument). Win and he signals retreat; lose and the water goes red.

  The Courier walks away. **Lonesome Road** picks up the spare road the Courier left behind — the one that was waiting since the first package they delivered.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Fallout: New Vegas"}' --auto` drafts the region, 15 places, 18 people, 7 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): NCR Trooper → `ncr-trooper` / `ncr-patrol`; NCR Ranger → `ncr-ranger` / `ncr-patrol`; Legion Recruit → `legion-recruit` / `legion-warband`; Legion Legionary → `legion-legionary` / `legion-warband`; Legion Centurion → `legion-centurion` / `legion-warband`; Legion Praetorian → `legion-praetorian` / `legion-warband`; Thug → `thug` / `raider`; Crew Boss → `crew-boss` / `raider`; Feral Ghoul → `feral-ghoul` / `feral-ghoul`; Cazador → `cazador` / `cazador`; Nightstalker → `nightstalker` / `nightstalker`; Gecko, Giant → `gecko-giant` / `gecko-pack`; Radscorpion → `radscorpion` / `radscorpion`; Giant Ant → `giant-ant` / `giant-ants`; Powder Ganger → `powder-ganger` / `raider`.

  **Rewards in each system's catalog:** Maria (fallout-2e.maria · grimfall.maria); That Gun (fallout-2e.that-gun · grimfall.that-gun); Pew Pew (fallout-2e.pew-pew · grimfall.pew-pew); Mercy (fallout-2e.mercy · grimfall.mercy); Ranger Sequoia (fallout-2e.ranger-sequoia · grimfall.ranger-sequoia); NCR Ranger Combat Armor (Black) (fallout-2e.ncr-ranger-combat-armor-black · grimfall.ncr-ranger-combat-armor-black); Desert Ranger Combat Armor (fallout-2e.desert-ranger-combat-armor · grimfall.desert-ranger-combat-armor); Elite Riot Gear (fallout-2e.elite-riot-gear · grimfall.elite-riot-gear); Platinum Chip (fallout-2e.the-platinum-chip · grimfall.the-platinum-chip).
