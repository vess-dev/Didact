type: monster
name: Atom Cleanser
knowledge: secret
tags: [far-harbor, threat]
mechanics:
  fallout-2e:
    category: 'Campaign: Far Harbor'
    hp: 10
    armor: 1
    STR: 14
    DEX: 12
    WIL: 13
    rad_immune: true
    attacks:
    - name: flamer
      damage: d8
      qualities: [blast, bulky]
    - {name: ritual bat, damage: d8}
    abilities:
    - 'Cleansed: Ignores Rads entirely. A Critical Damage result from a Cleanser adds 1 Rad to the target.'
  grimfall:
    tier: tough
    role: blaster
    category: The Factions Under Arms
    senses:
    - rag-robes over blistered skin
    - a hymn through a geiger crackle
    - hot metal and incense
    traits: [radiation feeds their faith (and their flesh), the hottest ground is their altar]
    moves: [Gamma Gun Benediction, Embrace the Pilgrim (irradiating grapple)]
    wants: converts and Division — your resistance is just a longer sermon
    note: Apostles are 4d pools that fight where you can't breathe; a Zealot in painted plate is a 
      6d elite. Their gamma guns are murder on the living and nothing at all to ghouls, machines, 
      and mutants. The Children of the Glow are the same faith gone feral around a crater choir.
body: |-
  ## GM notes

  Children of Atom zealot in blessed radiation gear. Rad-resistant to a fault.

  Fallout 2e: 10 HP, 1 Armor, 14 STR, 12 DEX, 13 WIL, flamer (d8, blast, bulky), ritual bat (d8).

  Grimfall: its card is `grimfall.children-of-atom` (Children of Atom), in this record's grimfall block.
source: campaigns/14-far-harbor#atom-cleanser
