# Far Harbor (campaigns/14-far-harbor): written by fw_compendium.py, don't edit by hand.
# The frame's quest, region, places, cast, threats (Fallout 2e's numbers, and Grimfall's
# card where its Bestiary has the threat) and clocks.
id: far-harbor
type: quest
name: Far Harbor
tags: [far-harbor, frame, side-arc]
goal: A Commonwealth detective agency — Valentine's Detective Agency — hires the party to find a 
  missing girl, Kasumi Nakano. The trail leads to Far Harbor, an island off the Maine coast where 
  the Fog crawls off the sea and rewrites the land. Kasumi isn't missing; she ran to Far Harbor 
  because she thinks she's a synth. Whether she is or isn't becomes the smallest of the island's 
  problems.
date: Sunday, 23 October 2287
body: |-
  *An island off the Maine coast, north of the Commonwealth, bathed in a permanent radioactive fog. Three communities — hard-bitten fishermen, a hidden synth refuge, and a Children of Atom fortress — hate each other. The fog is winning.*

  ## GM notes

  **Date.** Sunday, 23 October 2287: a Fallout 4 side arc: that frame's date, or whenever Valentine's agency calls. Open a campaign on it with `didact campaign new <id> --date 'Sunday, 23 October 2287'`, or move one there with `didact time set 'Sunday, 23 October 2287'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Far Harbor tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** A boat out of the Commonwealth docks. One night at sea. The harbormaster warns the party that the island is worse than they've heard.

  **Plot beats.**

  1. Docking at Far Harbor. The party steps off the Nakanos' boat into the town. Fog on the wharf, condensers humming, Captain Avery running the militia. Kasumi Nakano's family letter gets the party through the gate. The Fog Clock starts ticking at 1.
  2. Finding Kasumi at Acadia. A short trail through the Cranberry Island Bog leads the party to the pre-war observatory on the highest peak. The synth community of Acadia welcomes them warily. Kasumi is here, and she is fine — she ran to the refuge, not from it. DiMA asks to speak privately.
  3. DiMA's Memories. DiMA confesses he has lost memories — pieces of his own past he cannot access on his own. He asks the party to walk into his memory den, a pre-war simulation rig, and recover them. The memories reveal things about Far Harbor the party will wish they didn't know.
  4. The Nucleus. A pre-war nuclear submarine base run by the Children of Atom. High Confessor Tektus preaches a new, hungrier gospel. Sister Mai, a moderate, offers the party a way to speak to the faithful without igniting them. The party learns Atom has been planning to sabotage the fog condensers.
  5. Tending the Condensers. The five condensers keep Far Harbor breathable. A side trail that stretches across three of the island's dangerous locations — the lumber mill, the Vim! factory, the National Park Visitor Center. Each repair buys the town time; each one the party skips ticks the Fog Clock up.
  6. Avery's Secret. The turning point. DiMA's memories reveal that Captain Avery is a synth replacement for the real Avery, whom DiMA killed decades ago — and Avery herself does not know. DiMA made the decision alone, in desperation, in good faith, years ago. The party now holds a truth that will end the town if spoken aloud.
  7. The Three Plans. Each faction makes its final move. Tektus wants to attack the town. DiMA wants his secrets kept. Far Harbor wants its enemies dead and its truth protected. The party is the only group with a complete picture.
  8. The Climax. See Climax below — Peace, Wipe Out Acadia, Wipe Out the Children of Atom, Wipe Out Far Harbor, or walk away with Kasumi. The fog will keep coming either way; the question is who's still standing under it.

  **Climax.**

  The fog is rising. The three factions are at the tipping point. DiMA's secret — that **Avery is a synth replacement for the woman DiMA killed** — will unbind everything when it surfaces.

  - **Peace.** The hardest ending. Tell Avery what she is, on her own terms. Hide the truth from Far Harbor at large. Convince Tektus to step down (an inside job via Sister Mai). All three communities remain. Far Harbor becomes a Commonwealth settlement with three permanent NPCs.
  - **Wipe out Acadia.** The synths die. Far Harbor survives. Atom survives. The party carries a heavy bond.
  - **Wipe out the Children of Atom.** Acadia survives. Far Harbor survives. A gentler ending, but Atom cells in the Commonwealth will remember.
  - **Wipe out Far Harbor.** Only Acadia and the Nucleus remain. The fog takes the town. The party should not feel clean about this one.
  - **Take Kasumi home or leave her.** Separate from the climax. Her family pays either way; the caps are dirty.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Far Harbor"}' --auto` drafts the region, 8 places, 7 people, 3 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Fog Crawler → `fog-crawler` / `fog-crawler`; Gulper → `gulper` / `gulper`; Angler → `angler` / `angler`; Children of Atom, Zealot → `children-of-atom-zealot` / `children-of-atom`; Synth, Gen-1 → `synth-gen-1` / `synth-patrol`; Hermit Crab → `hermit-crab` / (no Grimfall card); Trapper (Far Harbor) → `trapper-far-harbor` / `raider`.

  **Rewards in each system's catalog:** Kiloton Radium Rifle (fallout-2e.kiloton-radium-rifle · grimfall.kiloton-radium-rifle); Admiral's Friend (fallout-2e.admirals-friend · grimfall.admirals-friend); Marine Tactical Armor (fallout-2e.marine-tactical-armor · grimfall.marine-tactical-armor); Fog Condenser Part (grimfall.fog-condenser-part); Memory Holotape (grimfall.memory-holotape).
source: campaigns/14-far-harbor#pitch
