# card where its Bestiary has the threat) and clocks.
id: fallout-4
type: quest
name: Fallout 4
aliases: [Fallout 4 Main Campaign]
tags: [fallout-4, frame, main-campaign]
goal: |-
  You are a pre-war survivor — one half of a small nuclear family from the Boston suburb of Sanctuary Hills — who stepped into Vault 111 on October 23, 2077 and was frozen inside a cryogenic pod for two centuries. You woke once, years into your freeze, to watch a stranger shoot your spouse and take your infant son, Shaun. You woke again, alone, in the post-war Commonwealth. Shaun is gone. Your spouse is dead. You are the only one left in the vault.

  The Commonwealth is four factions fighting over scraps: the Minutemen, rebuilding a settler militia from a handful of refugees; the Brotherhood of Steel, descending from the skies in a flying fortress; the Railroad, smuggling runaway synthetic humans out of the region; and the Institute — a hidden research facility beneath the pre-war CIT ruins, producing perfect android infiltrators and the reason your son was taken.

  Your child is at the end of every thread. What he has grown into by the time you find him is the campaign's real question.
date: Sunday, 23 October 2287
body: |-
  *You woke up two hundred years late. Your spouse is dead and your child is gone — taken by a stranger who walked into the vault while you slept. You step out of Vault 111 into a ruined Boston and start walking. Every road through the Commonwealth eventually leads to the Institute, to Shaun, and to a choice none of the four factions watching you will let you dodge.*

  ## GM notes

  **Date.** Sunday, 23 October 2287: the year Vault 111's last pod thawed (Vault 111); the day the game it adapts opens. Open a campaign on it with `didact campaign new <id> --date 'Sunday, 23 October 2287'`, or move one there with `didact time set 'Sunday, 23 October 2287'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Fallout 4 tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** You step out of the elevator at Vault 111's entrance into morning sun over the Boston Basin. Sanctuary Hills is down the hill — the same street you lived on, the same red house, two centuries of weather. The household Mister Handy unit, Codsworth, is still tending the garden. He is the only being in the world who will recognize you. He tells you someone has taken your baby and walked into the world. He suggests you start in Concord, the nearest settlement, and ask about the trail.

  **Plot beats.**

  1. Sanctuary and Concord. Codsworth, the old home, the handful of decaying pre-war houses. In Concord the party finds Preston Garvey and a handful of refugees trapped in the Museum of Freedom by raiders. Rescuing them earns a T-45 power armor suit from the museum roof (its core nearly spent), a minigun, and the first Minutemen alliance. Sanctuary becomes a buildable settlement.
  2. Diamond City. Boston's Fenway Park, turned walled town. Piper Wright, a journalist, recognizes an outsider and interviews the party. Mayor McDonough has something off about him. Nick Valentine, a Gen-2 synth detective, has been missing for a week and the party is hired to find him. The trail leads to Park Street Station and Vault 114 beneath it — a pre-war vault turned gangster den.
  3. Valentine's Case. Recovering Nick opens the first real investigation: Kellogg, a mercenary who was paid by the Institute to kidnap Shaun. He's left a trail — Diamond City, Fort Hagen, a decoy in the Glowing Sea. Chasing him across the Commonwealth is how the party meets every faction.
  4. The Brotherhood Arrives. Halfway through the Kellogg chase, the Prydwen airship rises over Boston like a new fixed star. Elder Arthur Maxson broadcasts the Brotherhood's mandate from its bridge. The party meets Paladin Danse at the Cambridge police station, where he and his squad are holding off ferals. He offers the party a place on his squad.
  5. Fort Hagen and Kellogg's Mind. The party confronts Kellogg. He dies. They recover his cybernetic memory implant. At the Memory Den in Goodneighbor, Doctor Amari wires the party in; they walk through Kellogg's life and find the only way to reach the Institute is via a rogue Institute scientist named Virgil, hiding in the Glowing Sea.
  6. The Glowing Sea. The most radioactive place in the Commonwealth — deathclaws, Children of Atom, rad storms. Virgil lives in a cave at the crater's edge, hideous now and knowing it. He gives the party a plan: build a Signal Interceptor from specs he smuggled out of the Institute. Assembling it requires help from a faction — Railroad, Brotherhood, or Minutemen. Each has a price.
  7. The Railroad. Found via the Freedom Trail markers through a dead Boston neighborhood. HQ is a catacomb beneath the Old North Church. Desdemona leads; Deacon recruits the party; Glory is the heavy gunner. The Railroad wants synth liberation above all.
  8. Meeting the Father. Whichever faction builds the Interceptor, the party rides it into the Institute. They are received not by guards, but by Father — a man in his sixties, blue-eyed, calm. He is Shaun. He was taken from the vault sixty years ago and grew up here. He is dying of cancer. He wants to hand the Institute to the party.
  9. The Fracture. The Institute's existence is a weapon. The Brotherhood wants to destroy it. The Railroad wants to liberate every synth in its labs. The Minutemen want it out of the Commonwealth by any means. The Institute wants to continue, and Father offers the party its directorship. The three outside factions now cannot coexist — building the final assault for one burns the others.
  10. The Nuclear Option. Whichever side the party sided with escorts them back to the Institute for the endgame. The other factions lose. The Institute is destroyed, seized, or preserved. See Climax.

  **Climax.**

  **The Nuclear Option.** However the Signal Interceptor was built, the party is in the Institute when the end comes. Four resolutions:

  - **Minutemen Ending.** Preston Garvey and the Commonwealth militia breach the Institute through an old service tunnel and detonate its reactor; artillery from **The Castle** covers the retreat. The party leads the ground assault. Father dies in his chair, asking the party to take his watch. Synths scatter; some are hunted, some melt into settlements. The Minutemen are the Commonwealth's new peacekeepers.
  - **Brotherhood Ending.** Elder Maxson unleashes a rebuilt **Liberty Prime** (see Bestiary → Liberty Prime) on the CIT ruins. Prime marches into the Institute. The party fights alongside paladins. Father dies; so do the synths, the scientists, and the children in the schoolroom. The Brotherhood rules the Commonwealth.
  - **Railroad Ending.** Desdemona's agents surgically liberate every synth in the Institute while the party covers. A self-destruct protocol takes the facility. Father dies knowing his own parent betrayed him. Freed synths disperse across the Commonwealth. The Railroad quietly folds into memory; its work is done.
  - **Institute Ending.** The party accepts Father's directorship. Father dies in his sleep. The party broadcasts from within the Institute, declaring a new order. The Brotherhood's Prydwen is brought down by an Institute strike team; the Railroad is rooted out by Coursers the party now commands. The Commonwealth enters a quiet, clean, surveilled peace.

  The party walks out. Some of them walk out as something *very* different than what they came in as. Sanctuary Hills is still there. The vault is still open. The cryopod is still cold.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Fallout 4"}' --auto` drafts the region, 13 places, 13 people, 4 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Feral Ghoul → `feral-ghoul` / `feral-ghoul`; Feral Ghoul Stalker → `feral-ghoul-stalker` / `feral-ghoul`; Mirelurk (Hunter) → `mirelurk-hunter` / `mirelurk`; Mirelurk King → `mirelurk-king` / `mirelurk-king`; Mirelurk Queen → `mirelurk-queen` / `mirelurk-queen`; Super Mutant, Grunt → `super-mutant-grunt` / `super-mutant`; Super Mutant, Brute → `super-mutant-brute` / `super-mutant`; Super Mutant, Suicider → `super-mutant-suicider` / `super-mutant-suicider`; Bloatfly → `bloatfly` / `bloatfly`; Radroach → `radroach` / `radroach`; Radscorpion → `radscorpion` / `radscorpion`; Deathclaw → `deathclaw` / `deathclaw`; Synth, Gen-1 → `synth-gen-1` / `synth-patrol`; Synth, Gen-2 → `synth-gen-2` / `synth-patrol`; Synth, Gen-3 (Infiltrator) → `synth-gen-3-infiltrator` / `synth-patrol`; Courser → `courser` / `courser`; Brotherhood Knight → `brotherhood-knight` / `brotherhood-patrol`; Brotherhood Paladin → `brotherhood-paladin` / `power-armored-trooper`; Gunner → `gunner` / `gunners`; Gunner Sergeant → `gunner-sergeant` / `gunners`; Thug → `thug` / `raider`; Assaultron, Institute-Issue → `assaultron-institute-issue` / `assaultron`.

  **Rewards in each system's catalog:** Deliverer (fallout-2e.deliverer · grimfall.deliverer); Righteous Authority (fallout-2e.righteous-authority · grimfall.righteous-authority); Pickman's Blade (fallout-2e.pickmans-blade · grimfall.pickmans-blade); Shishkebab (fallout-2e.shishkebab-unique · grimfall.shishkebab); Kellogg's Cybernetic Brain Augmenter (fallout-2e.kelloggs-cybernetic-brain-augmenter · grimfall.kelloggs-brain-augmenter); Codsworth's Service Ring (grimfall.codsworths-service-ring).
