# Vault-Tec Workshop (campaigns/15-vault-tec-workshop): written by fw_compendium.py, don't edit by hand.
# The frame's quest, region, places, cast, threats (Fallout 2e's numbers, and Grimfall's
# card where its Bestiary has the threat) and clocks.
id: vault-tec-workshop
type: quest
name: Vault-Tec Workshop
tags: [vault-tec-workshop, frame, side-arc]
goal: A radio broadcast on a pre-war Vault-Tec frequency advertises Vault 88 — "the future of 
  American living, opening soon." The vault was under construction when the bombs fell. Now Overseer
  Valery Barstow, a ghoul from the pre-war staff, is still at her post and ready to finish the job. 
  She needs test subjects, researchers, and someone expendable to run experiments on the settlers 
  she promises to invite. She is polite, brilliant, and monstrous in the old Vault-Tec way.
date: Sunday, 23 October 2287
body: |-
  *Vault 88, never finished, never sealed, never populated. The vault's pre-war Overseer is still alive — two centuries a ghoul — and she has big plans for its first real residents. The party is invited to help her run her overdue experiments. On living subjects. Forever.*

  ## GM notes

  **Date.** Sunday, 23 October 2287: a Fallout 4 side arc: that frame's date, or whenever Vault 88's broadcast is heard. Open a campaign on it with `didact campaign new <id> --date 'Sunday, 23 October 2287'`, or move one there with `didact time set 'Sunday, 23 October 2287'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Vault-Tec Workshop tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** The radio signal. A cave on the south edge of the Commonwealth opens into the vault's main construction shaft. The party descends into an unfinished concrete cathedral. Barstow greets them from a monitor.

  **Plot beats.**

  1. The Descent. The party follows the signal into a cave mouth and down a pre-war construction shaft. The vault is an unfinished concrete cathedral — sconces hanging loose, blueprints fluttering on the walls, a half-built blast door waiting for someone to cut the final weld.
  2. Meeting Barstow. Overseer Valery Barstow greets them from a monitor in her cheerful, polite voice. She explains the situation, thanks them for coming, and asks them to help her finish the vault. Her first favor sounds small: clear a nest of radscorpions from the Deep Caverns. She frames it as settler safety. It is.
  3. Clearing the Deep Caverns. The excavation zones are Thermal Radscorpion country. Foreman Hunter and his ghoulified work crew live down there too. If the party approaches from the right angle, Hunter will talk first — he is friendly from behind and hostile from the front, which is a nice metaphor for the whole campaign.
  4. The First Experimental Pod. Barstow hands the party a blueprint for one of the four pods — Phoropter, Slot Machine, Soda Fountain, or Power Cycle 1000. Each is a pre-war compliance-conditioning experiment with a deliverable relic at the end. Building the first pod is presented as structural work. The experiment is something they will have to reckon with later.
  5. Clem Arrives. The first real volunteer settler. A simple, friendly man named Clem shows up at the Intake Bay, attracted by Barstow's broadcast. Barstow asks the party to "help orient him." What the party does with Clem is the campaign's first hard moral test — the Overseer should draw the scene out and let each player speak.
  6. The Second and Third Pods. As pods come online, more settlers arrive, drawn by the radio. The Mutiny Clock starts ticking. Each subsequent pod ratchets the ethical weight. The fourth pod is the breaking point for any party that still has a conscience.
  7. Ezra Caldwell in the Intake Bay. A hidden settler Barstow invited before the party arrived, sealed inside the Intake Bay. A day of food left. Finding him is a discovery; freeing him without Barstow's knowledge sets up the climactic confrontation.
  8. Confronting Barstow. The party must decide what the vault becomes. Stop her, take over, run the experiments her way, or collapse the cave mouth and seal her in. See Climax below.

  **Climax.**

  Barstow wants to run the full experimental program on a full settler population. The party has to choose what Vault 88 becomes.

  - **Stop her.** Confront Barstow in her suite. She fights like a ghoul who remembers her pre-war commission. Kill her, and two centuries of Vault-Tec know-how die with her. Cut her loose, and she walks out a changed woman.
  - **Take over.** Kill Barstow, finish the experiments ethically (each experiment relic can be "cleaned up" with a DEX or WIL save to retain the benefit without the cruelty). Open the vault as a party-run settlement. A surprising number of settlers show up anyway.
  - **Run the experiments her way.** The vault fills. The party gains caps, relics, and a reputation that closes a lot of doors in the Commonwealth. Karma slides to −2 (Infamous), one step per session as word spreads.
  - **Collapse the vault.** Blow the cave mouth. Seal Barstow inside with her ghouls. She outlives the party by a century. She remembers the party's names.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Vault-Tec Workshop"}' --auto` drafts the region, 10 places, 3 people, 3 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Radscorpion → `radscorpion` / `radscorpion`; Radscorpion, Giant → `radscorpion-giant` / `radscorpion`; Thermal Radscorpion → `thermal-radscorpion` / `radscorpion`; Protectron → `protectron` / `protectron`; Feral Ghoul → `feral-ghoul` / `feral-ghoul`.

  **Rewards in each system's catalog:** The Phoropter (grimfall.the-phoropter); Lucky Slot Amulet (grimfall.lucky-slot-amulet); Bottoms-Up Tap (grimfall.bottoms-up-tap); Power Cycle 1000 (grimfall.power-cycle-1000); Vault-Tec Lab Coat (grimfall.vault-tec-lab-coat).
source: campaigns/15-vault-tec-workshop#pitch
