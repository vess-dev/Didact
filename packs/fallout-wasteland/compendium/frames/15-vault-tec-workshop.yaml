    - {name: claws, damage: d10}
    abilities:
    - 'Burrow: Once per combat, when first reduced to 0 HP, she retreats into the wall and returns the
      next round at half HP.'
  grimfall:
    tier: tough
    role: lurker
    category: Predators & Horrors
    senses:
    - gleaming black armor and a whipping tail
    - grinding sand and clacking pincers
    - hot dust and acrid venom
    traits: [burrows and ambushes, 'armored, but the tail is exposed']
    moves: [Venom Sting (4d Poison), Pincer Grapple]
    wants: to sting, then drag off the paralyzed — not to be flipped or lose its stinger
    note: "Sever the tail to defang it — a setup worth chasing. Albinos and giants are elite-sized burrowers
      whose venom kills yao guai; the deep-cavern thermal strain bleeds furnace heat that armor can't
      answer, and dies within a day of leaving its caves. A nest queen (Vault 88 keeps one) is an 8d boss
      whose fail state is escape: at 2d it burrows away and comes back healed — collapse the bolt-hole
      first."
body: |-
  ## GM notes

  Nest-mother of the Deep Caverns. Armored above, soft beneath — attacks from below or behind ignore her Armor.

  Fallout 2e: 20 HP, 3 Armor, 17 STR, 12 DEX, 7 WIL, stinger (d12), claws (d10).

  Grimfall: its card is `grimfall.radscorpion` (Radscorpion), in this record's grimfall block.
source: campaigns/15-vault-tec-workshop#vault-88-radscorpion-queen
