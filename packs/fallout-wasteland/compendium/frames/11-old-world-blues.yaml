      machines turn on you.
    wants: data, distraction, and to win the argument — not to grasp what they've actually done
    note: A linked challenge of comedy and horror; reason, trickery, or sheer absurdity beat force. 
      Win Mobius over and the Council's fear of him splits them.
body: |-
  ## GM notes

  **Dr. Klein** — Think Tank chair. Mean, loud, sure he's right.

  Non-combatant. The Think Tank are floating brain-panels in a domed room. They have no weapons and no means to fight the party directly. They are an authority, not an encounter. If threatened, Klein opens every lab in Big MT against the party — the lab creatures are the threat, not the panels. If the party physically smashes a panel, it takes one solid hit to destroy (3 HP, no Armor) and the Think Tank collectively panics.

  Grimfall: its card is `grimfall.the-think-tank` (The Think Tank), in this record's grimfall block.
source: campaigns/11-old-world-blues#dr-klein-and-the-think-tank
