    - Its stat block gives no STR (written —).
    - 'Delusion: Cannot be killed through combat alone. The party must shut him off at the Forbidden Zone
      terminal.'
  grimfall:
    tier: elite
    role: trickster
    category: Named Threats & Legends
    senses:
    - hovering monitors with disembodied brains and waldo-claws
    - shrill overlapping technobabble and feedback
    - disinfectant and old ozone
    pools:
    - name: Dr. Klein
      dice: 6
      traits: domineering, drowns out all dissent
      moves: Bluster, Override a Colleague
    - name: Dr. Mobius
      dice: 4
      traits: the exiled sixth, ranting over the speakers from his Forbidden Zone; addled, and 
        secretly the only merciful one
      moves: Roboscorpion Bluster, Let the Truth Slip
    - name: The Council
      dice: 6
      traits: bickering en masse; shields the lab
      moves: Talk in Circles, Vote to Dissect You
    - name: The Lab
      dice: 6
      traits: locked until the Council yields
      moves: Unleash an Experiment, Reprogram a Captive
    fail: 8d "Consensus to Dissect" — a timer; when it runs dry, the squabbling stops and the 
      machines turn on you.
    wants: data, distraction, and to win the argument — not to grasp what they've actually done
    note: A linked challenge of comedy and horror; reason, trickery, or sheer absurdity beat force. 
      Win Mobius over and the Council's fear of him splits them.
body: |-
  ## GM notes

  **Dr. Mobius** — the villain. Mostly a mask over the group's shared guilt.

  A Think Tank panel; the Armor is his throne's plating. Invulnerable in his chamber until the throne's emitter is destroyed. Off-throne: no HP, only dialogue.

  Fallout 2e: 6 HP, 2 Armor, — STR, 10 DEX, 18 WIL, roboscorpion handlers (summons a detachment once per scene).

  Grimfall: its card is `grimfall.the-think-tank` (The Think Tank), in this record's grimfall block.
source: campaigns/11-old-world-blues#dr-mobius
