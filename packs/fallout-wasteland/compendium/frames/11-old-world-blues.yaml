# Old World Blues (campaigns/11-old-world-blues): written by fw_compendium.py, don't edit by hand.
# The frame's quest, region, places, cast, threats (Fallout 2e's numbers, and Grimfall's
# card where its Bestiary has the threat) and clocks.
id: old-world-blues
type: quest
name: Old World Blues
tags: [old-world-blues, frame, side-arc]
goal: An old drive-in theater, the Midnight Science Fiction Feature, plays a reel that hypnotizes 
  the audience. The party wakes at Big Mountain, a pre-war science crater full of robotic horrors 
  and experimental weapons. Their brains are missing. The Think Tank's old nemesis — Dr. Mobius — 
  stole one of them. To get it back, the party must fetch three pieces of the crater's forgotten 
  tech. Everyone in this place is already insane.
date: Wednesday, 19 October 2281
body: |-
  *A drive-in movie theater abducts the party's brains. They wake up at the Big Mountain research facility as talking brainless bodies, guests of the Think Tank — five floating screens full of pre-war scientists who have forgotten they are dead and want the party to help them keep forgetting.*

  ## GM notes

  **Date.** Wednesday, 19 October 2281: a New Vegas side arc: that frame's date, or whenever the drive-in plays. Open a campaign on it with `didact campaign new <id> --date 'Wednesday, 19 October 2281'`, or move one there with `didact time set 'Wednesday, 19 October 2281'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Old World Blues tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** The drive-in, a reel, waking in the Sink (a pre-war lab with a talking toaster and a house-wide AI). The Think Tank floats in through a wall and explains the situation as if it were a minor formality.

  **Plot beats.**

  1. The Drive-In. The party watches a reel and wakes at Big Mountain without their brains. Their bodies are fine. Their skills are fine. The loss is cosmetic and terrifying. Play the first scene as a cold shower of banter between the party, the Sink's talking appliances, and the five-panel Think Tank broadcasting from the dome.
  2. Meeting the Think Tank. The party is introduced to Klein, Dala, 0, Borous, and 8 — the five floating brain-panels running Big MT. They are polite, petty, and completely disconnected from the war that ended the world. They want the party to fetch three pieces of tech from the crater's old labs. They also want to keep the party's brains — one of which Mobius has already stolen.
  3. The Sink Comes Online. The party claims their home base. The toaster, the Book Chute, the Auto-Doc, Muggy, and the Central Intelligence all speak. Each wants one upgrade from somewhere in the crater. Turning the Sink into a real base is the B-plot of the campaign — and the stakes of the climax.
  4. X-13 Stealth Lab. First mission. A pre-war stealth suit in a glass case that introduces itself as Stealth Suit Mk II. The lab's tests are the party's tutorial in the crater's strange tech. The suit joins the party as a semi-companion.
  5. X-8 Research Center. Cyberdogs, nightstalkers, and the trail of the holotape that fixes the Sink's Auto-Doc — it ends in the Y-17 medical facility. A child's voice on the school PA. The lab was testing long-term conditioning on captives; the conditioning mostly took.
  6. X-42 Robo-Scorpion Warehouse. The sonic emitter. A warehouse fight with smaller roboscorpions building up to a giant one — a proper boss. The emitter is the only weapon that will work on the climax.
  7. Little Yangtze. The darkest detour. A pre-war internment camp where Chinese prisoners were held for Big MT's brain experiments — collared, abandoned when the bombs fell, and ghoulified by the fallout. Father Elijah used the camp as his base and learned to build his bomb collars from theirs; the party finds his workbench and sees what Dead Money's horror looked like when it was still an experiment. Trauma harnesses wait in a shed; the party may take one.
  8. The Forbidden Zone Dome. Confronting Mobius. He is not the villain. He is the one sane member of the Think Tank who has been playing the villain to keep the other five from doing worse. His speech is the emotional center of the campaign.
  9. The Think Tank Confrontation. The party returns to the dome with the truth. Klein refuses to hear it. The party can fight him, reason with him, or use the sonic emitter to shut the whole Think Tank down one panel at a time. Resolutions in the Climax below.

  **Climax.**

  Mobius is found in the Forbidden Zone. He is also a Think Tank panel, the sixth — the one who "left."

  - **Kill Mobius.** The Think Tank cheers. The brain is returned. The party leaves. The Sink stays — they can come back between campaigns.
  - **Spare Mobius, expose the Think Tank.** The five realize what they are. Some hold it together. Dr. 8 weeps in static. The Sink becomes a neutral home the party can use *and* rent out.
  - **Join the Think Tank.** Upload one PC's mind to a floating panel. They become a recurring NPC ally. The player rolls a new character.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Old World Blues"}' --auto` drafts the region, 9 places, 7 people, 2 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Lobotomite → `lobotomite` / `lobotomite`; Roboscorpion → `roboscorpion` / `roboscorpion`; Giant Roboscorpion → `giant-roboscorpion` / `roboscorpion`; Trauma Override Harness → `trauma-override-harness` / `trauma-override-harness`; Nightstalker, Legendary → `nightstalker-legendary` / `nightstalker`; Cyberdog → `cyberdog` / `mongrel-pack`; Feral Ghoul → `feral-ghoul` / `feral-ghoul`.

  **Rewards in each system's catalog:** Sonic Emitter (fallout-2e.sonic-emitter-big-mt · grimfall.sonic-emitter); Stealth Suit Mk II (fallout-2e.stealth-suit-mk-ii · grimfall.stealth-suit-mk-ii); Protonic Inversal Axe (fallout-2e.protonic-inversal-axe · grimfall.protonic-inversal-axe); LAER (fallout-2e.laer · grimfall.laer); K9000 Cyberdog Gun (fallout-2e.k9000-cyberdog-gun · grimfall.k9000-cyberdog-gun); X-2 Antenna (fallout-2e.x-2-antenna · grimfall.x-2-antenna); Compliance Regulator (fallout-2e.compliance-regulator · grimfall.compliance-regulator); Dr. Klein's Glove (fallout-2e.dr-kleins-glove · grimfall.dr-kleins-glove); Dr. Mobius' Glove (fallout-2e.dr-mobius-glove · grimfall.dr-mobius-glove).
