body: |-
  ## GM notes

  **Salt-Upon-Wounds** — White Legs war chief. Wants Legion recognition. He will not get it — Caesar has no use for tribes that fail.

  White Legs war chief, the man who sacked New Canaan. Ruthless, cunning, canny in a retreat.

  Fallout 2e: 12 HP, 2 Armor, 15 STR, 14 DEX, 13 WIL, tribal power fist (d10, bulky), throwing axe (d6).

  Grimfall: its card is `grimfall.salt-upon-wounds` (Salt-Upon-Wounds), in this record's grimfall block.
