      Darkness (see the Armory).
body: |-
  ## GM notes

  **Joshua Graham** — the Burned Man. Former Legate of the Legion, now a devout New Canaanite. Speaks quietly. Kills very fast.

  The Burned Man. Bandaged, unmoving eyes, the best gun in Zion.

  Fallout 2e: 14 HP, 2 Armor, 14 STR, 16 DEX, 17 WIL, A Light Shining in Darkness (d8), combat knife (d6).

  Grimfall: its card is `grimfall.joshua-graham` (Joshua Graham), in this record's grimfall block.
