id: honest-hearts
type: quest
name: Honest Hearts
tags: [honest-hearts, frame, side-arc]
goal: The Happy Trails Caravan hires the party to escort a shipment to the New Canaan mission. New 
  Canaan is already burning by the time they arrive — destroyed by the White Legs, a raider tribe 
  courting Caesar's favor, under Salt-Upon-Wounds, their war chief. Only Daniel, a New Canaanite 
  missionary, and Joshua Graham — the Burned Man, former Legion Legate, wrapped in bandages and 
  righteous fury — made it to Zion. They are fighting different wars in the same canyon.
date: Wednesday, 19 October 2281
body: |-
  *A caravan job into Zion Canyon turns into a four-way tribal war with a missionary on one side and a Legion butcher on the other. The land is the most beautiful thing the party has ever seen. Someone is going to burn it down.*

  ## GM notes

  **Date.** Wednesday, 19 October 2281: a New Vegas side arc; New Canaan burned in 2281 (Vault 70). Open a campaign on it with `didact campaign new <id> --date 'Wednesday, 19 October 2281'`, or move one there with `didact time set 'Wednesday, 19 October 2281'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Honest Hearts tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** The caravan boss is murdered in an ambush on the way. The party survives. Daniel finds them at the old ranger station and asks for help. Graham is already in the caves.

  **Plot beats.**

  1. The Ambush. The Happy Trails caravan is hit on the approach to Zion. The boss dies. The party survives because a White Leg scout chose to leave them for the canyon. The scout was wrong.
  2. Daniel at the Ranger Station. Daniel finds the party at a pre-war survivalist's bolt-hole. He is gentle, exhausted, and clear: the Sorrows must leave Zion before Salt-Upon-Wounds's war party reaches them. He needs guides who can talk to the tribes without frightening them.
  3. Joshua Graham in the Cave. Graham introduces himself plainly and without apology. He has a different plan: arm the Sorrows, train the Dead Horses, meet the White Legs at the Three Marys. The party must now pick a side — or stall between them for a few sessions, which is fine, because the White Legs are getting closer either way.
  4. Visiting the Tribes. Dead Horse Camp and Sorrows Camp. Follows-Chalk wants to see the Mojave (will leave with the party at campaign's end). Waking Cloud wants to understand the pre-war world she keeps hearing about in Daniel's stories. Each camp has a simple job the party can do to earn loyalty: hunt a yao guai, track a cazador nest, carry a message.
  5. The Survivalist's Journal. A pre-war U.S. survivalist held out alone in Zion for decades after the war. His rifle, his caches, and his journal are scattered around the canyon. The journal reads like scripture to the Sorrows. Finding it is not the mission — but what the party does with it shapes what Zion remembers about them.
  6. Scouting the White Legs. The White Legs Staging Ground is a mountain pass. Scouts range from there in pairs. A clean reconnaissance gives Graham what he needs to plan the ambush; a loud one tips Salt-Upon-Wounds and accelerates his attack.
  7. The Three Marys. The climax. The canyon kill-box where the party's chosen plan — Graham's ambush or Daniel's evacuation route — plays out. Both work. Both cost. See Climax below.
  8. After Zion. Honest Hearts does not end with a victory — it ends with a departure. Daniel weeps, Graham prays, the tribes scatter or gather. Zion goes back to being Zion. The party leaves with Follows-Chalk or without him. Someone at the ranger station watches them go.

  **Climax.**

  The decision is not *whether* the party fights the White Legs. It is *what survives after*.

  - **Graham's War.** The party helps Graham massacre the White Legs at the Three Marys. Salt-Upon-Wounds is executed. The Sorrows are armed and changed forever. The canyon is safe, and ruined.
  - **Daniel's Exodus.** The party helps evacuate the Sorrows east to the Grand Staircase. The White Legs take the canyon. The Sorrows survive intact. Zion is lost but remembered.
  - **The Third Path.** Kill Salt-Upon-Wounds *alone*, surgical, then lead the White Legs away without a general battle. The hardest. The Sorrows keep both the canyon and their innocence. Graham accepts it coldly. Daniel weeps with relief.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Honest Hearts"}' --auto` drafts the region, 7 places, 3 people, 2 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): White Legs Tribesman → `white-legs-tribesman` / `tribal-war-band`; Dead Horse Tribesman → `dead-horse-tribesman` / `tribal-war-band`; Giant Cazador → `giant-cazador` / `cazador`; Green Gecko → `green-gecko` / `gecko-pack`; Yao Guai → `yao-guai` / `yao-guai`; White Leg Storyteller → `white-leg-storyteller` / `tribal-war-band`.

  **Rewards in each system's catalog:** .45 Auto Pistol (fallout-2e.45-auto-pistol); A Light Shining in Darkness (fallout-2e.a-light-shining-in-darkness · grimfall.a-light-shining-in-darkness); Survivalist's Rifle (fallout-2e.survivalists-rifle · grimfall.survivalists-rifle); She's Embrace (fallout-2e.shes-embrace · grimfall.shes-embrace); Dead Horse War Paint (grimfall.tribal-war-paint); Joshua Graham's Armor (fallout-2e.joshua-grahams-armor · grimfall.joshua-grahams-armor); Dead Horse Tribal Armor (fallout-2e.dead-horse-tribal-armor · grimfall.dead-horse-tribal-armor); Salt-Upon-Wounds' Power Fist (fallout-2e.salt-upon-wounds-power-fist · grimfall.salt-upon-wounds-power-fist).
