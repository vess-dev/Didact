id: broken-steel
type: quest
name: Broken Steel
tags: [broken-steel, frame, side-arc]
goal: After the Battle of Project Purity, Enclave forces are broken but not destroyed. The 
  Brotherhood deploys Liberty Prime to assault the Enclave's satellite relay station — and the 
  Enclave destroys Prime with an orbital strike from space. Adams Air Force Base holds their last 
  Vertibird wing, a mobile base crawler, and the uplink to that satellite. The Brotherhood needs a 
  Tesla Cannon to punch through Enclave Hellfire armor, and they need someone expendable to ride the
  presidential metro into Adams AFB and end this.
date: Tuesday, 6 November 2277
body: |-
  *The Enclave lost the purifier but they didn't lose the war. Their orbital weapon just killed Liberty Prime. Their scattered remnants are regrouping at a mobile base crawler and readying one last strike. The Brotherhood needs the party to finish what Prime started.*

  ## GM notes

  **Date.** Tuesday, 6 November 2277: two weeks after the Fallout 3 frame's climax, as both frames say; here two weeks after that frame's date. Open a campaign on it with `didact campaign new <id> --date 'Tuesday, 6 November 2277'`, or move one there with `didact time set 'Tuesday, 6 November 2277'` before its first session.

  **Tone & touchstones, arrival, the place, threats:** `didact rules lookup Broken Steel tone` (and `arrival`, `cast`, `clocks`, `threats`, `rewards`).

  **Arrival.** Elder Lyons (or his replacement) summons the party to the Citadel. Liberty Prime has been destroyed. The Brotherhood's morale is shattered. Scribe Rothchild has a plan — but it needs parts the Brotherhood doesn't have, and a route they can't secure on their own.

  **Plot beats.**

  1. Liberty Prime Falls. The campaign opens with the aftermath — or, if the Overseer is bold, with Prime's last assault (see Bestiary → Liberty Prime). The Brotherhood deploys Prime against the Enclave's satellite relay station. An orbital strike from the Bradley-Hercules satellite drops from the sky and annihilates Prime in a single shot. The Brotherhood retreats in shock. Sarah Lyons is wounded. Both clocks start here — the Brotherhood is already planning its answer, and the Enclave knows it is reeling and is preparing to press the advantage.
  2. The Citadel Briefing. Scribe Rothchild has a plan. The Brotherhood needs a Tesla Cannon — a weapon that can crack Hellfire power armor and Enclave shielding. To build one, they need a Tesla coil from the Olney Powerworks beneath Old Olney. And to reach Adams AFB, they need the Presidential Metro powered up. The party is handed both jobs.
  3. Old Olney and the Tesla Coil. A deathclaw-infested town between the Citadel and the Powerworks. The party can blast through, sneak through, or find a sewer route scribes have marked on an old map. The Olney Powerworks lies beneath — a pre-war research facility holding a working Tesla coil. The facility is guarded by Enclave deathclaws in implant collars. Retrieving the coil lets Scribe Vallincourt build the Tesla Cannon.
  4. Waking the Metro. The pre-war Presidential Metro is still parked in its station. M.A.R.Go.T., the line's transit computer, greets the party in scripted pre-war courtesy. The train needs a working fusion core and a cleared line — a car full of ferals has to be dealt with before the train can move. The ride itself is one of the safest scenes in the campaign; let the party breathe.
  5. Under the Flight Deck. The Metro drops the party into a service hatch beneath Adams's main runway. Above them: Vertibirds, fuel depots, Hellfire Troopers patrolling in pairs. The party's first job is not to be seen. This is the scene where stealth matters most; failure means the Assault Clock jumps two ticks.
  6. Boarding the Crawler. Whether by ambush, stealth, or force, the party gets aboard the Enclave mobile base. The crawler is the Enclave's last major installation — command deck, barracks, reactor, holding cells. Enclave officers and Hellfire troopers man the halls. The satellite uplink is on the command deck.
  7. The Satellite Uplink. The climax. The party reaches the command deck and the satellite targeting console. Sarah Lyons's frontal assault is hitting the base exterior. The party has control of the Bradley-Hercules orbital weapon — the same one that killed Liberty Prime. They choose the target. Resolutions in the Climax below.

  **Climax.**

  Sarah's assault hits the base exterior. The party is on the crawler's command deck, at the satellite targeting console.

  - **Strike Adams AFB.** Target the orbital weapon at the base itself. The Enclave is annihilated. The crawler is destroyed. The party escapes on a Vertibird. The Brotherhood cheers.
  - **Strike the Citadel.** Target the Brotherhood. The party has turned. The Enclave survives, the Brotherhood is crippled, and every NPC in the Capital Wasteland remembers who pushed the button.
  - **Disable the satellite.** Shut the uplink down. The Enclave's last card is neutralized, but their troops escape on the last Vertibirds. They'll be back — as a problem for a future campaign.
  - **Ride it out.** The party steals the presidential Vertibird and the targeting codes. They drop one step with the Brotherhood but gain a working Vertibird (one flight per campaign — treat it as a vehicle, see Vehicles) and a weapon no one else knows they have.

  **The frame's records.** `didact gen run fallout-wasteland.frame --prefill '{"frame": "Broken Steel"}' --auto` drafts the region, 4 places, 4 people, 2 threats, its factions and its clocks (pools under Grimfall); `gen commit` writes them.

  **Bestiary** (Fallout 2e / Grimfall): Enclave Trooper → `enclave-trooper` / `enclave-patrol`; Enclave Officer → `enclave-officer` / `enclave-patrol`; Enclave Hellfire Trooper → `enclave-hellfire-trooper` / `enclave-patrol`; Sentry Bot → `sentry-bot` / `sentry-bot`; Enclave Deathclaw → `enclave-deathclaw` / `deathclaw`.

  **Rewards in each system's catalog:** The Tesla Cannon (fallout-2e.tesla-cannon-unique · grimfall.tesla-cannon); Enclave Hellfire Armor (fallout-2e.enclave-hellfire-armor · grimfall.enclave-hellfire-armor); Presidential Metro Access Key (grimfall.presidential-metro-access-key).
