id: vault-3
type: loc
name: Vault 3
tags: [vault, vaults-fallout-new-vegas]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** A control vault. A water leak forced the residents to open the door to find help, and for a short while they traded peacefully with local caravans — until a chem-addled raider gang conned their way in, slaughtered the dwellers, and claimed the vault for themselves.

  **Layout.**

  - **Entry Hall.** The blast door stands open. Fresh bullet holes in the walls.
  - **Residential Block.** The original fixtures are still here, but every room has been converted into a drug den, a weapons stash, or a squalid bunkroom.
  - **Water Treatment.** Still functional. The raiders charge passing caravans a hundred caps a gallon.
  - **Overseer's Office.** Now a raider chief's den. Four bodies hung from the ceiling as warnings.
  - **Reactor Room.** Unchanged. The raiders don't know what it is, only that the lights still work.

  **Inhabitants.** FIEND RAIDER CREW (CHEM FIENDS and THUGS) with a chem-addled CREW BOSS — **Motor-Runner** himself, if he still lives — and a CHAINED CAPTIVE somewhere in the back. An NCR Ranger sent in alone to kill Motor-Runner is holed up near the residential block with a bullet in his leg.

  **Reward.** The **Vault 3 Water Valve** — controlling it gives the party leverage over every caravan on the route. A stash of **Psycho**, **Jet**, and **Mentats** in the raider chief's footlocker.

  In each system's catalog: Psycho (fallout-2e.psycho); Jet (fallout-2e.jet); Mentats (fallout-2e.mentats).

  **Hook.** A caravan master will pay 500 caps to anyone who frees the water supply from the raiders' control, *without* killing the chained captive they use as a hostage.

  ## Secrets

  - A PC who searches the water treatment's filter housing finds a pre-war wedding ring wedged deep in the intake grate. The inscription matches one of the original residents' names on the Overseer's terminal. The captive chained in the back room is their descendant and does not know.
source: vaults/03-fallout-new-vegas#vault-3
---
id: vault-11
type: loc
name: Vault 11
tags: [vault, vaults-fallout-new-vegas]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** The residents were told that one of them must be sacrificed each year, or the entire population would be terminated. They made it an election: whoever won became Overseer, and at the end of the term walked into the sacrificial chamber. The vault ran this election for sixteen years, until a rigged vote set off a civil war that left five survivors.

  **Layout.**

  - **Entry Hall.** Murals painted by the residents list the name of every Overseer sacrificed, year by year; the last mural has an abrupt unfinished line. Against the wall by the door sit four skeletons with four guns — the last survivors, who could not live with what they had learned. A fifth gun lies on the floor, unfired.
  - **The Bloc Halls.** Corridors papered with the propaganda of the vault's six voting blocs, each poster explaining why someone else should die.
  - **Voting Hall.** A grand chamber with one podium and a sealed ballot box. Votes from the final election are still inside.
  - **The Sacrifice Chamber.** A single chair with wrist restraints. A pre-war automated recording describes the honor and necessity of the sacrifice. Bloodstains on the floor are very old.
  - **Overseer's Office.** The office of the last elected Overseer, who knew exactly what the title meant. A handwritten note is still on the desk.
  - **The Terminal Room.** The vault's central computer. A pre-war recording plays if the computer is accessed: it reveals that the entire experiment was a bluff. Any population that refused to sacrifice anyone would have been praised and set free. Only the last five survivors ever refused, after the civil war had killed everyone else.

  **Inhabitants.** SECURITY TURRETS in the voting hall (treat as two TURRET, MACHINEGUN). GIANT RADSCORPIONS in the lower maintenance levels.

  **Reward.** The **Vault 11 Ballot Box** — evidence of pre-war psychological manipulation, worth 800 caps to a Followers researcher. The **Survivors' Holotape**, recorded at the door by the five who refused, so that others might learn from what they did.

  **Hook.** A pre-war historian among the Followers has been writing a book about the vault experiments. She needs the voting records to finish her chapter on Vault 11. She is willing to pay.

  ## Secrets

  - One of the murals has a small painted cross next to a Sacrifice's name — a resident who had been erased from every other record. A PC who pokes at the wall beneath the cross finds a second, hidden ballot box with the actual unrigged votes from the first election. Reading them reveals that the residents had tried to refuse the whole game once.
source: vaults/03-fallout-new-vegas#vault-11
---
id: vault-19
type: loc
name: Vault 19
tags: [vault, vaults-fallout-new-vegas]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** The vault was split into two color-coded halves — a Red Sector and a Blue Sector — each with its own Overseer, and the experiment was paranoia. Strange noises in the vents, drafts from nowhere, lights blinking in patterns: each sector blamed the other, and some blamed the doctor in the middle. None of them guessed that the two Overseers were staging every incident on Vault-Tec's orders. What finally became of the residents is a mystery. By the time escaped convicts found the vault, it was empty.

  **Layout.**

  - **Entry Hall.** Faded Red and Blue paint divides the walls.
  - **Red Residential.** Now the flophouse of **Samuel Cooke**'s Powder Gangers — escaped NCR convicts who split from the main gang after the prison breakout.
  - **Blue Residential.** Collapsed in a fire decades ago, and cut off from the rest of the vault. A lone ghoul still lives here, nursing a grudge older than the NCR — the only witness to what happened, if anyone can get him to tell it.
  - **The Sulfur Caves.** A second way in, through caves northwest of the Whittaker farmstead that reek of rotten eggs.
  - **Overseer's Office.** Two offices, one per sector, mirror each other across the vault. A holotape recovered from the Red Sector office explains the experiment, including that Overseer's private suspicion that the two of them were also being manipulated.
  - **The Shared Cafeteria.** The one room in the vault where residents from both sectors were forced to eat together. The walls are scratched to the concrete.

  **Inhabitants.** POWDER GANGER detachment under Samuel Cooke (Red), LONE GHOUL with a grudge (Blue).

  **Reward.** **Dynamite Charges** — 2d6 sticks (each d10, _blast_, 1 use), a holdover from the Powder Ganger occupation. The Overseer's **Final Report** — a holotape confessing the psychological experiment in detail.

  **Hook.** Two strangers claim descent from the vault's vanished residents — one from Red Sector, one from Blue — and want to know what happened to their families. Samuel Cooke's convicts hold the vault. The pair need escorts past the Powder Gangers to the shared cafeteria, where the answer is carved into a table.

  ## Secrets

  - The shared cafeteria has a single long table with names carved into its underside — a list of residents from both sectors who had secretly been meeting under it for years, passing notes and sharing food. The final name carved is the Overseer's own.
source: vaults/03-fallout-new-vegas#vault-19
---
id: vault-21
type: loc
name: Vault 21
tags: [vault, vaults-fallout-new-vegas]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** Every decision in the vault — including the decision to open the door — was made by gambling. Residents resolved all disputes, assignments, and elections through games of chance, and the experiment worked: Vault 21 kept its people safe and equal. In 2274 Mr. House offered to bring it into New Vegas; those in favor won the right to accept in a blackjack game that lasted for hours. House stripped the vault and filled most of it with concrete. Two vault-born residents, **Sarah Weintraub** and her brother, talked him into sparing half the upper level, and Sarah runs it now as the **Vault 21 Hotel**.

  **Layout.**

  - **Casino Floor.** The vault's old gambling atrium, spared from the concrete — slot machines, a roulette wheel, a blackjack table, and a craps pit. All still partly operational.
  - **The Dealer's Booth.** A pre-war dealer robot (broken) still sits in the booth with a deck of cards in its manipulator.
  - **Residential Block.** Small cabins, each decorated with a playing card suit.
  - **Overseer's Office.** The Overseer left a holotape explaining that the experiment worked — the vault stayed peaceful for generations.
  - **The Vault.** A locked storage room with a pre-war card deck that has a star on the back of every card.

  **Inhabitants.** Sarah Weintraub, her hotel staff, and the handful of former dwellers who stayed on. They still resolve disputes with dice. They are friendly, shrewd, and happy to gamble with the party.

  **Reward.** **The Pre-war Card Deck** — a _petty_ relic that, once per session, shifts the next Reaction roll two steps better when presented with a flourish. A **Pip-Boy 3000** that House's strippers missed, in a drawer of the Overseer's desk.

  In each system's catalog: The Pre-war Card Deck (grimfall.pre-war-card-deck); Pip-Boy 3000 (fallout-2e.pip-boy-3000-functional · grimfall.pip-boy-3000).

  **Hook.** A caravaneer has lost his caravan's profits to the residents in a poker game. He wants the party to win them back for him — or to cheat.

  ## Secrets

  - The roulette wheel has a slight mechanical bias toward red 17 — an engineering flaw the Overseer discovered and decided not to fix because it gave her a secret edge on the vault's own experiment. A PC who figures this out may claim an edge at any roulette table for the rest of the campaign.
source: vaults/03-fallout-new-vegas#vault-21
---
id: vault-22
type: loc
name: Vault 22
tags: [vault, vaults-fallout-new-vegas]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** A botanical experiment: the vault's scientists were working to end world hunger. A defense contractor donated a pest-control fungus, *Beauveria mordicana*, bred in Big MT's X-22 botanical garden. It turned out to infect people as easily as insects. The residents were gradually consumed by their own crop.

  **Layout.**

  - **Entry Hall.** Vines have grown through the blast door and cover the walls.
  - **Hydroponics Bay.** A jungle. Giant mutated plants grow along the ceiling, some still in rows from their planters.
  - **Spore-Infested Residential Block.** Bodies of the original residents, covered in vines and spore pods. Some of them are still moving — SPORE CARRIERS.
  - **Overseer's Office.** Sealed against the spores. Inside, the Overseer's final log, delivered as her office slowly filled with green.
  - **The Seed Vault.** A locked cold-room at the lowest level containing every preserved pre-war plant seed for the region. Still viable, if someone can crack the lock.

  **Inhabitants.** - **SPORE CARRIER** — use the bestiary entry. The original residents, hollowed out by the crop.
  - **GIANT MANTIS** — detachment in the upper tunnels; use the bestiary entry.

  **Reward.** **Vault 22 Seed Packets** — a cache of pre-war plant seeds. Delivered to a settlement with at least one Farm Plot, they grant **+1 Industry** (to the usual cap of 5). A **Spore-Resistance Inoculant** (1 dose, grants immunity to spore attacks for one session).

  In each system's catalog: Vault 22 Seed Packets (grimfall.vault-22-seed-packets); Spore-Resistance Inoculant (grimfall.spore-resistance-inoculant).

  **Hook.** A farmer in a nearby settlement is losing crops to a blight. An NCR agriculture corps rep offers caps for any Vault 22 seed he can get.

  ## Secrets

  - At the heart of the hydroponics bay, deep under the tangle of vines, is a single Mother Plant — older, slower, and aware enough to respond to voices. It does not attack. It is trying to communicate. A PC who spends a scene with it and passes a WIL save learns something no bestiary can tell them about the vault.
source: vaults/03-fallout-new-vegas#vault-22
---
id: vault-34
type: loc
name: Vault 34
tags: [vault, vaults-fallout-new-vegas]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** The armory was overstocked with guns and the living quarters were not built for the crowd. When overpopulation came, the Overseer locked the armory. One group of dissidents grabbed every gun they could carry and stormed out — their descendants are the **Boomers** of Nellis. Years later, a second revolt tried for the armory and wrecked the reactor's cooling vents instead. The radiation that followed trapped the rest inside and ghoulified most of them.

  **Layout.**

  - **Entry Hall.** The main door has not opened since the second revolt.
  - **Residential Block.** Ghoulified residents still walk here — some of them are armed.
  - **The Armory.** A massive pre-war arsenal. Locked behind a keyed door the original Overseer sealed during the riot.
  - **Flooded Lower Levels.** Radioactive water has filled the bottom two floors. Any PC entering adds 1 Rad per watch.
  - **Overseer's Office.** Drowned. The terminal still runs, but the holotape inside is water-damaged and contains only the final two minutes of the Overseer's last entry.

  **Inhabitants.** FERAL GHOUL WITH ASSAULT RIFLE (multiple), GLOWING ONE in the flooded level. A handful of survivors are barricaded in a sealed wing, dying of the radiation and still hoping someone will open the door.

  **Reward.** **The Armory** — on gaining access, roll twice on the Loot Roll Tables' *Random Weapon* and take both results. A **Pre-war Riot Shotgun** (d10, _blast_, _bulky_) pulled from an Overseer's desk. Two sealed crates at the back hold the **All-American** and the **YK42B Pulse Rifle** (see Unique Weapons), if the Overseer wants them found here.

  In each system's catalog: All-American (fallout-2e.all-american · grimfall.all-american); YK42B Pulse Rifle (fallout-2e.yk42b-pulse-rifle · grimfall.yk42b-pulse-rifle).

  **Hook.** A scavver company has been trying to crack the Vault 34 armory for two years. They'll split the haul 50/50 with any crew willing to go in first.

  ## Secrets

  - At the back of the armory, mounted in a display case behind a smashed glass pane, is a pre-war ceremonial rifle — engraved, polished, absurdly heavy. It was meant as a retirement gift for the Overseer, delivered the week before the bombs. Worth 1000 caps to the right collector. Worth far more as a symbol of what pre-war life almost looked like.
source: vaults/03-fallout-new-vegas#vault-34
