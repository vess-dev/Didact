id: vault-75
type: loc
name: Vault 75
tags: [vault, vaults-fallout-4]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** Built beneath Malden Middle School and sold as a safe shelter for its students, Vault 75 was a genetics program. The children were separated from their families on arrival; the parents and teachers were led off to "orientation" and shot by security. The children were raised to fear "Uptopland" and told that graduation would make them strong enough to save it. At eighteen, the finest were "harvested" for their genes, the clever and obedient joined the science staff, and the rest were executed after a graduation ceremony.

  **Layout.**

  - **Entry Hall.** A pre-war elementary school façade. Posters on the walls.
  - **Classrooms.** A pre-war curriculum still loops on the terminals, to rows of empty desks. The chalkboards count down the days to graduation.
  - **Residential Block (Children's Wing).** Small cabins arranged like a summer camp.
  - **The Testing Labs.** The dark heart of the vault. Dissection tables, gene sequencers, a wall of cryogenic samples labeled by student number.
  - **Overseer's Office.** The Overseer left a holotape confessing the experiment and asking for forgiveness. The Gunners who took the vault use the office as a mess hall and have never played it.

  **Inhabitants.** GUNNER squad with a GUNNER SERGEANT (upper floors and classrooms), SENTRY BOT in the testing labs.

  **Reward.** A **Genetic Sequencer Chip** (Relic) — installed in a friendly auto-doc, it identifies any PC's hidden bloodline (Overseer's choice). **Classroom Holotapes** containing real pre-war educational material — worth 300 caps to a Followers scholar.

  In each system's catalog: Genetic Sequencer Chip (grimfall.genetic-sequencer-chip).

  **Hook.** A Gunner deserter wants to destroy the testing labs before his former crew gets the chance to weaponize them. He has a map but not the nerve.

  ## Secrets

  - Deep in the testing labs, behind a wall of cryogenic samples, is a single small sample drawer that the Gunners never found — marked TEACHER 01. A genetic record of one of the original adults who was "eliminated." Delivered to an Institute scientist, it is worth 1000 caps. The Gunners will know if the party takes it.
source: vaults/04-fallout-4#vault-75
---
id: vault-81
type: loc
name: Vault 81
tags: [vault, vaults-fallout-4]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** Vault-Tec built Vault 81 to develop a cure for every disease, using its residents as unknowing test subjects: nozzles hidden in every room were meant to release the pathogens, and to incinerate everyone if the vault were ever evacuated. The first Overseer, Dr. Olivette, refused. On the morning of the war she sabotaged the call list so most of the scientists never arrived, disabled the delivery system, and sealed the three who came into the secret wing. The residents were never infected. Two centuries later, Vault 81 is one of the few vaults that still works as a vault.

  **Layout.**

  - **Entry Hall.** Indistinguishable from a standard vault. The community here is welcoming — they believe their vault is an honest one.
  - **Residential Block.** A living community of about 50 people. They farm, they trade with nearby settlements, they are among the last intact vault populations in the region.
  - **The Sealed Wing.** Vault 81-B, behind a locked door the residents never open: disease labs still stocked and still hot with pre-war pathogens, diseased test mole rats loose in the halls, and **Curie**, a Miss Nanny the scientists left running, who has spent two hundred years trying to finish their cure.
  - **The Hidden Cure.** A small refrigerated cabinet contains **Vault 81 Cure** — a universal antiviral, stable in sealed dose form. See the Relics chapter.
  - **Overseer's Office.** The current Overseer knows there is a sealed wing, and not what is in it. Her predecessors kept that secret for generations.

  **Inhabitants.** VAULT COMMUNITY (friendly, trading), MOLE RATS in the sealed wing (diseased — any bite forces a STR save or the victim contracts mole rat fever, a slow wasting sickness: lose 1 STR per day until cured), and Curie, who would very much like to meet a human being.

  **Reward.** The single dose of **Vault 81 Cure** (Relic, 1 use — see Relics chapter). **Pre-war Disease Samples** (1 slot, dangerous in the wrong hands, 600 caps to certain collectors).

  In each system's catalog: Vault 81 Cure (fallout-2e.vault-81-cure · grimfall.vault-81-cure); The single dose of Vault 81 Cure (fallout-2e.vault-81-cure · grimfall.vault-81-cure).

  **Hook.** A child in Vault 81 has fallen ill with a disease nothing in the settlement can identify. The current Overseer asks the party to look through the one wing she's never entered.

  ## Secrets

  - The former Overseer's terminal, forgotten in the generator room, records exactly what Dr. Olivette did and why every resident is alive. It also records that the nozzles in their bedrooms are still connected to the incinerator system, and that the evacuation protocol has never been disarmed. A PC who reads it and doesn't tell the community walks out with a secret that will weigh on them every time they pass through Vault 81 again.
source: vaults/04-fallout-4#vault-81
---
id: vault-95
type: loc
name: Vault 95
tags: [vault, vaults-fallout-4]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** A treatment program for chem addicts. The vault offered counseling, clean accommodations, a yearly elected Overseer to run the support meetings, and abstinence support — and a large hidden stash of every chem the residents had ever used. On the fifth anniversary of the sealing, a Vault-Tec agent posing as a resident opened it while everyone slept, and took notes on what happened next. The Gunners hold the vault now, at the edge of the Glowing Sea.

  **Layout.**

  - **Entry Hall.** A pre-war rehabilitation clinic façade. Encouraging posters everywhere.
  - **Counseling Wing.** Still running. Terminals contain pre-war addiction profiles of every original resident.
  - **Group Therapy Room.** A circle of chairs, a pre-war coffee urn, a chalkboard with the twelve-step pre-war program written out in chalk.
  - **The Hidden Stash.** The chamber the agent opened on October 23, 2082. Thousands of doses of Med-X, Psycho, Buffout, Jet, and Mentats, spilled across the floor.
  - **The Detox Chamber.** The program's one honest promise: a clean room and an extractor chair built to purge a patient's system of chem dependency. Restored to power, it clears every addiction a PC carries in a single treatment, at the cost of a fusion core and a day of agony (1 Fatigue).
  - **Overseer's Office.** The final holotape is the last elected Overseer describing her own relapse.

  **Inhabitants.** GUNNER squad in the upper levels, with a GUNNER, HEAVY in salvaged power armor at the door (3 Armor; if he dies in it the suit is broken — see **Crafting → Repairs** — and its core is nearly spent) and a GUNNER SERGEANT guarding the clean room. GHOUL JUNKIES (treat as FERAL GHOULS; each still clutches one dose of a random chem) deeper down. A lone lucid ghoul who has been clean for forty years.

  **Reward.** **Up to 12 doses of mixed chems** (Overseer's call — roll on the Chem Stash table). **A Pre-war Addiction Recovery Manual** (_petty_, 1 use — the pages do not survive a second reading) — the PC who works through it automatically passes the WIL save on their next **Cure an Addiction** attempt.

  In each system's catalog: A Pre-war Addiction Recovery Manual (grimfall.addiction-recovery-manual).

  **Hook.** A settlement's most valuable medic has fallen off the wagon. Their apprentice will pay the party to find them a clean source of chems — or a reason to stop.

  ## Secrets

  - The group therapy room has a large ring of chairs around a small circular rug. Under the rug, stuck to the underside of the concrete with old chewing gum, is a single pre-war photograph of the Vault-Tec intake director standing with the chief counselor, smiling, each holding a matching keycard. The director was in on the trap the counselor wasn't told about.
source: vaults/04-fallout-4#vault-95
---
id: vault-111
type: loc
name: Vault 111
tags: [vault, vaults-fallout-4]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** A cryogenic suspension experiment. Residents lured from Sanctuary Hills and Concord were told the pods were for decontamination, then frozen without their knowledge or consent. The staff were hired short-term. When the mandatory 180 days passed with no all-clear, the Overseer refused to open the door, and the security and support staff mutinied; the logs end there. The pods' life support failed one by one. In 2227, the Institute found the vault, opened a single pod, shot one parent, and took an infant named Shaun. In 2287 the last working pod thawed, and its occupant walked out alone.

  **Layout.**

  - **The Elevator.** The vault's front door: a great round platform on the hill above Sanctuary Hills. It still rises and falls on command. The only other way in is the mole rats' — their tunnels behind the reactor surface somewhere on the hillside.
  - **Entry Hall.** Racks of blue jumpsuits with 111 on the back, handed out that last morning. A sign cheerfully explains decontamination. By the vault door, a scientist's skeleton still wears a Pip-Boy — the one piece of Vault-Tec kit anyone ever carried out.
  - **The Pod Chamber.** Rows of frosted cryo pods, every occupant dead in place when the life support failed. One pod's glass is starred by a single bullet hole. One pod is open and empty.
  - **Staff Quarters & Cafeteria.** Skeletons in lab coats and security armor, where the mutiny ended. The last meals are still on the trays.
  - **Overseer's Office.** The Overseer's skeleton and a terminal whose logs stop mid-lockdown. A locked display case holds a pre-war **Cryolator**.
  - **Cryo Control.** The terminal that ran the pods, and the reactor room that still powers them.

  **Inhabitants.** RADROACHES in every room and a MOLE RAT DETACHMENT in the tunnels behind the reactor; their MOLE RAT BROOD MOTHER has denned in the staff quarters. Nothing else lives here. The vault's only voices are its terminals.

  **Reward.** A **Pip-Boy 3000** from the skeleton by the door — unless the last survivor already took it. The **Cryolator** from the Overseer's case (see Marketplace). A working **Cryo Storage Cylinder** (Relic). A **Photograph** of a pre-war family taken on the day they entered the vault.

  In each system's catalog: Pip-Boy 3000 (fallout-2e.pip-boy-3000-functional · grimfall.pip-boy-3000); Cryolator (fallout-2e.cryolator); Cryo Storage Cylinder (fallout-2e.cryo-storage-cylinder).

  **Hook.** A Diamond City journalist wants the staff's last logs for a story on what Vault-Tec did to Sanctuary Hills. The elevator still works. Something has been sleeping in the staff quarters since the last person left.

  ## Secrets

  - Cryo Control's automated log recorded everything the staff never lived to see: the door cycling open in 2227, a pod's seal broken, a single infant's vital signs leaving the building — and, sixty years later, the last pod reporting occupant revived. Anyone who reads it knows exactly how old Shaun would be now.
source: vaults/04-fallout-4#vault-111
---
id: vault-114
type: loc
name: Vault 114
tags: [vault, vaults-fallout-4]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** Boston's elite — state officials, luminaries, and money — were promised a luxury vault beneath Park Street Station. They would have been packed several families to a room, sharing baths and meals, under an Overseer Vault-Tec picked for having no experience and a hatred of authority: a homeless man known only as "Soup Can Harry." The vault was never finished, and the experiment never ran. Now **Skinny Malone**'s Triggermen use it as a hideout.

  **Layout.**

  - **Entry Hall.** Marble veneer over pre-war concrete. A receptionist's desk is still piled with registration forms.
  - **The Unfinished Wing.** The residential block was never completed. Exposed rebar, unfinished drywall, concrete floors where carpet was promised.
  - **Security Bunker.** The overseer staff's barracks, better appointed than the residents'.
  - **The Lounge.** A pre-war lounge with a jukebox, a bar, and a half-full champagne bottle that has somehow not evaporated. Skinny Malone holds court here with his girl, Darla, and a crooner's idea of how a mobster talks.
  - **Overseer's Office.** Never used. On the desk, a Vault-Tec personnel file: Soup Can Harry's interview transcript, and the note that he "ain't wearing no goddamn tie."
  - **The Cell.** The Triggermen keep their prisoners in the vault's unfinished security block. Lately, a detective.

  **Inhabitants.** TRIGGERMEN (treat as THUG detachments with a CREW BOSS — Skinny Malone). A lone MISTER HANDY working as a bartender at the lounge.

  **Reward.** **A Pre-war Tuxedo / Cocktail Dress** (uses the rules for Dean's Tuxedo — see Unique Armors — though nobody famous ever wore this one). **The Champagne Bottle** (_bulky_, 300 caps, a curiosity).

  **Hook.** A detective went into Park Street Station a week ago looking for a runaway girl and never came out. His secretary will pay the party to get him back. A ghoul in Goodneighbor who ran with the Triggermen before the war wants something specific from the lounge, and will pay in caps not to say what.

  ## Secrets

  - Behind the bar, under a floorboard the bartender Mr. Handy was specifically ordered never to reveal to anyone, is a leather-bound ledger listing every favor the Triggermen have called in across the Commonwealth — names, dates, amounts. Half the names belong to people in Diamond City and Goodneighbor who would pay to see it burn. Useful, dangerous, or both.
source: vaults/04-fallout-4#vault-114
---
id: vault-118
type: loc
name: Vault 118
tags: [vault, vaults-fallout-4]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** An ultra-luxury vault hidden beneath the Cliff's Edge Hotel on the Island. Ten of the richest people in Maine were to live like royalty, above the law, while up to three hundred working-class locals were packed into a cramped second wing to serve and suffer under their judgment. The money ran out before the second wing was built. Instead, a General Atomics robotics designer, Dr. Bert Riggs, convinced his fellow guests to have their brains placed in Robobrain chassis to outlast the war. Their robot staff has kept them in luxury ever since.

  **Layout.**

  - **Entry Hall.** A chandelier, carpet, a bellhop's abandoned podium.
  - **Luxury Suites.** Ornate cabins, most still occupied — by Robobrains with very human voices, very old opinions, and nothing but time.
  - **The Grand Dining Room.** Every evening at six, a pre-war meal is served by automated dumbwaiters to the nine surviving Robobrain residents. None of them can eat. None of them miss a meal.
  - **The Second Wing.** Bare concrete and rebar where three hundred people were meant to be crammed. Construction stopped when the money did.
  - **The Brain Lab.** The transplant chamber itself. One empty jar.
  - **Overseer's Office.** Never used by an Overseer — the vault was never finished. The hotel's owner kept it for himself.

  **Inhabitants.** NINE ROBOBRAINS with elegant manners, long grudges, and a murder mystery — one of them killed the hotel's owner, **Ezra Parker**, within the past week, and none of them will admit who. A Mister Handy butler named **Maxwell** runs the investigation's paperwork, a Miss Nanny named **Pearl** runs the gift shop, and PROTECTRONS keep order. FERAL GHOULS, fog-soaked, fill the hotel above. The Robobrains will parley first.

  **Reward.** A **Robobrain Chassis Schematic** — a tinker with this plan can build a Robobrain from a corpse, given a brain and a Power Generator. A **Pre-war Luxury Watch** (400 caps).

  **Hook.** Pearl, the hotel's Miss Nanny, has been asking around Far Harbor for a police detective: there has been a terrible murder at Cliff's Edge, and the residents are offering significant caps to anyone who can solve it.

  ## Secrets

  - The Overseer's office holds Ezra Parker's real ledgers: the hotel's owner took every guest's fortune and quietly stopped paying for the vault the moment their brains were in jars. Someone found them the day before he died. A PC who raises the ledgers at the dinner table triggers a chain of accusations that crack the mystery open.
source: vaults/04-fallout-4#vault-118
---
id: vault-63
type: loc
name: Vault 63
tags: [vault, vaults-fallout-76, skyline-valley]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** A research vault beneath Shenandoah National Park, in the Skyline Valley south of the Savage Divide, built to the specifications of **Hugo Stolz** — a blind, German-speaking magnate on Vault-Tec's board of directors, and the vault's Overseer. Stolz bought his chair with research: weather control built from the military's shuttered ATLAS Program, and guardian robots built from stolen Pentagon plans. The vault's only door in the north is in the Ash Heap, the head of an underground railway that runs south under the mountains. The vault was far from finished when the bombs fell. Radiation poured in and ghoulified nearly everyone, and the ghouls began to go feral. In 2095, Hugo ran the weather machine at full power to save his wife and created the **Lost**, lightning-charged ghouls driven psychotic by the energy trapped inside them. In 2105 he ran it again and created the Storm. See the **Skyline Valley** campaign frame.

  **Layout.**

  - **Transit Hub.** The Ash Heap entrance. Its blast door was torn loose by the Storm's first surge and came down in a field north of Sutton. Beyond the empty frame, a railway platform leads south.
  - **Dark Hollow Manor.** The Stolz mansion above the vault. The real entrance lies under its front hall, behind a hand scanner that opens only for a vault dweller's hand — living, dead, or Lost.
  - **The Atrium.** The only finished sector, sealed off by the survivors. A clinic, a mess, and Hugo Stolz's quarters — austere, organized by touch, with a terminal that logs every experiment, every death, every compromise.
  - **Organics Sector.** Hilda Stolz's laboratory: Serum Omega, and three Lost test subjects, one of them her own father.
  - **Meteorology Sector.** The weather machine, a pre-war device capable of manipulating regional weather, under the Hawksbill weather station on the park's highest peak.
  - **Engineering Sector.** Where the vault's three Storm Goliaths were built, and where the machines still build a new one whenever one is destroyed.
  - **The Garden Sector.** A waterfall under a painted sky, where Cassidy Stolz used to sit and pretend the war never happened.

  **Inhabitants.** - **The Lost** — 5 HP, 12 STR, 13 DEX, 5 WIL, shock baton (d6) or laser pistol (d8). Ghouls charged with lightning from the weather machine, driven psychotic. During a lightning storm their attacks step up one damage die (shock baton d8, laser pistol d10) and the charge burns them for 1 damage a round. They perceive the world as pulses and wavelengths.
  - **The Atrium Survivors** — Hilda Stolz, her cousin Audrey, security chief James Oberlin, and a handful of lucid ghouls. Friendly but guarded. Many remember the day the vault sealed unfinished.
  - **Storm Goliath** — see the Skyline Valley campaign frame.

  **Reward.** **The Weather Machine Schematic** (Relic) — a blueprint for a settlement-scale weather condenser. Grants +1 Industry to a settlement at the cost of occasional electrical storms. **Hugo's Cane** (_petty_) — a blind man's walking stick, weighted with lead. d6 melee, Enhanced on a surprise attack.

  In each system's catalog: The Weather Machine Schematic (grimfall.weather-machine-schematic); Hugo's Cane (grimfall.hugos-cane).

  **Hook.** A Vault-Tec broadcast is calling Vault Dwellers south: Hilda Stolz needs outsiders — people who aren't charged with lightning — to reach the meteorology sector and shut the machine down. Hugo Stolz, courteous as ever, says the same thing. Only one of them means it.

  **In the Skyline Valley frame.** A vault so large it runs beneath the whole region, split into sectors — atrium, organics, meteorology, engineering, a garden with a waterfall. Only the atrium was finished, and only the atrium is safe.

  ## Secrets

  - Deep in the engineering sector, behind a bulkhead the survivors never opened, one cryo pod is labeled differently from anything else in the vault — not a ghoul resident, but a pre-war Vault-Tec observer placed here before the war to monitor Stolz. The observer is still alive, still frozen, and still employed. Waking them changes the vault's politics overnight.
source: vaults/05-fallout-76#vault-63
