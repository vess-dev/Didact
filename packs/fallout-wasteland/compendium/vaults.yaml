id: vault-108
type: loc
name: Vault 108
tags: [vault, vaults-fallout-3]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** Cloning research. A single resident, Gary, was selected for genetic duplication. Dozens of Garys were produced before the vault ate itself.

  **Layout.**

  - **Entry Hall.** A single hand-lettered sign reads *GARY*.
  - **Cloning Lab.** The vats are empty but still running. A pre-war terminal logs the batches — Gary 12, Gary 17, Gary 23, Gary 43 — for pages, and notes that every Gary turned on the staff the moment he was decanted.
  - **Residential Block.** Every cabin's name tag reads GARY. Every diary entry reads GARY. Every photograph is of the same face.
  - **Overseer's Office.** Overseer Brody Jones is gone. He was chosen because the scientists knew a cancer would kill him within forty months, and the vault's main power was rigged to fail after twenty; his last logs describe the cloning experiment spiraling out of control — the scientists' duplicates of a single resident, every one of them named Gary, multiplying until the identical clones overran the staff.
  - **Reactor Room.** The oldest Gary lives here now, grey and enormous and angrier than any of his brothers.

  **Inhabitants.** GARY CLONES — identical, hostile to anyone who is not a Gary, and able to say exactly one word (treat as a WILD FOLK detachment). Nobody else: the original Gary is long dead, and his diary is the only sympathetic voice left in the vault.

  **Reward.** A **Genetic Sample Cylinder** (Relic, 1 use) — plugged into an auto-doc, it restores a dying PC to full HP and STR one final time. **The Original Gary's Diary** — a holotape, the only sympathetic voice in the vault.

  In each system's catalog: Genetic Sample Cylinder (fallout-2e.genetic-sample-cylinder-vault-108 · grimfall.genetic-sample-cylinder-v108); The Original Gary's Diary (fallout-2e.the-original-garys-diary-vault-108 · grimfall.the-original-garys-diary).

  **Hook.** A medic in a nearby settlement has a patient dying of a blood disorder. The auto-doc needs genetic material it cannot synthesize. A clean sample from Vault 108 would save her.

  ## Secrets

  - One of the vats — the only one with no number on its label — is still sealed, still running, and still cycling. Inside: a clone that never decanted, now the size of a full-grown man, still breathing through the cable. A PC who touches the glass hears a heartbeat. A PC who breaks the glass faces an Overseer-decided consequence the party will remember for the rest of the campaign.
source: vaults/02-fallout-3#vault-108
---
id: vault-112
type: loc
name: Vault 112
tags: [vault, vaults-fallout-3, fallout-3]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** A virtual-reality simulation experiment. The residents were placed in VR stasis loungers and their minds fed into a shared dream world run by the vault's founder, a pre-war scientist. The sim was supposed to last a decade. It ran for two centuries.

  **Layout.**

  - **Entry Hall.** Still powered. A robotic assistant greets any visitor and politely requests they proceed to the pod chamber.
  - **Pod Chamber.** Twelve VR stasis loungers in a circle, ten of them occupied by the long-lived residents, still dreaming. One lounger is empty. One lounger is open and its occupant is a withered corpse.
  - **The Dream.** A PC who enters an open pod is pulled into **Tranquility Lane** — a pre-war suburban simulation where everyone is smiling, everyone is cheerful, everyone is watched. Inside the sim, a child with too much authority commands the dead. To exit: either succeed at a difficult WIL-based quest inside the sim, or have an outside ally interrupt the simulation through the external terminal.
  - **Control Room.** The external terminal. Anyone reading the logs learns the founder's name and the original ten residents' names. Shutting off the sim kills all ten, peacefully. Waking them one at a time is possible but slow.
  - **Reactor Room.** The reactor has enough power for another fifty years.

  **Inhabitants.** The DREAMING RESIDENTS (non-combat, moral weight only). The CHILD OVERSEER inside the simulation (treat as a WIL-based encounter, not a combat one).

  **Reward.** A **Functional Pip-Boy 3000** (from the corpse in the open pod). A **Holotape of Tranquility Lane's Original Recording** — the founder's voice, gentle and inviting, explaining the experiment.

  In each system's catalog: Functional Pip-Boy 3000 (fallout-2e.pip-boy-3000-functional · grimfall.pip-boy-3000); Holotape of Tranquility Lane's Original Recording (grimfall.tranquility-lane-recording).

  **Hook.** A caravaneer in a nearby settlement is the grandchild of the man in the open pod — a wanderer who went looking for the vault's rumored paradise forty years ago and never came out. She has his last letter, written the night before he climbed in. She wants answers.

  **In the Fallout 3 frame.** Under Smith Casey's garage, a Tranquility Lounger rig full of pre-war elderly who never woke up. Dr. Stanislaus Braun runs it as a simulated neighborhood where he has been the god for 200 years.

  ## Secrets

  - The control room has a second terminal behind a slid-aside mural — an admin console that lets a user rewrite the simulation's physics rather than just shut it down. With it, a PC may enter Tranquility Lane as a god-moded visitor for one session only. The cost: the interface pushes too hard — take 1d4 WIL damage.
source: vaults/02-fallout-3#vault-112
