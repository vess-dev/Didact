id: vault-69
type: loc
name: Vault 69
tags: [vault, vaults-classified-experiments]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** The inverse of Vault 68 — 999 women and a single man. As with its counterpart, the stated purpose was never explained.

  **Layout.**

  - **Entry Hall.** Intact.
  - **Residential Block.** Organized into a functional community that survived for generations. The sole male resident became a minor folkloric figure within the vault.
  - **The Archive.** A room filled with hand-written records, diaries, and community minutes — the vault's residents organized into a functional democracy.
  - **Overseer's Office.** The Overseer's final holotape thanks her community for keeping faith with each other against the experiment.
  - **Reactor Room.** Fine.

  **Inhabitants.** A small, proud ghoul matriarchy still living in the vault. They are peaceful but distrustful of newcomers.

  **Reward.** **The Vault 69 Archive** — a working pre-war democratic model in miniature, worth 800 caps to an NCR historian. A **Hand-Written Constitution** (Relic, _petty_) — a settlement that adopts it counts its Defense as 1 higher against its next raid.

  In each system's catalog: Hand-Written Constitution (grimfall.hand-written-constitution).

  **Hook.** The matriarchy's current leader is dying and wants a single outside witness to her final address before she is laid to rest.

  ## Secrets

  - In the archive's deepest drawer, a sealed envelope marked in the handwriting of the original Overseer: a confession that the sole male resident had been her brother, and her private notes on how the community had chosen to protect him anyway. The matriarchy's current leader knows. She has kept the secret her whole life.
source: vaults/06-classified-experiments#vault-69
---
id: vault-70
type: loc
name: Vault 70
tags: [vault, vaults-classified-experiments]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** Located in Salt Lake City, Utah, Vault 70 was populated largely by Mormon congregations. The experiment: all jumpsuit extruders were rigged to fail after six months, leaving the entire population without clothing. The vault opened in 2190; its residents used three G.E.C.K.s to found the city of **New Jerusalem** in the Salt Lake City ruins. After New Jerusalem was sacked, the survivors went north to Ogden and founded **New Canaan**.

  **Layout.**

  - **Entry Hall.** A wall of empty suit dispensers. The extruders are visibly broken — panels torn off, motors burnt out. Someone tried to fix them two hundred years ago and gave up.
  - **Residential Block.** Intact. The residents adapted — leather, scrap cloth, hand-sewn blankets. A micro-culture of improvised clothing grew from nothing.
  - **The Tailoring Room.** A pre-war fabrication bay the residents converted into a hand-sewing workshop after the extruders died. The bench is still functional.
  - **Overseer's Office.** The Overseer's final holotape describes the community's decision to open the door and build something on the surface.
  - **Reactor Room.** Fine. Three empty G.E.C.K. bays — all used.

  **Inhabitants.** The vault is empty. Its descendants lived on the surface in New Canaan and the settlements it spawned — until the White Legs burned New Canaan in 2281 and the survivors scattered to Zion and beyond. A lone Mr. Handy still runs the tailoring room.

  **Reward.** **A Pristine Vault 70 Jumpsuit** — one of the last vacuum-sealed originals, never worn (_petty_, 200 caps to a collector). **The G.E.C.K. Bay Schematic** — a technical drawing worth 500 caps to a Brotherhood scribe.

  In each system's catalog: A Pristine Vault 70 Jumpsuit (grimfall.vault-jumpsuit-vacuum-sealed).

  **Hook.** A New Canaanite missionary has been asking about the old vault. She wants to recover a family Bible her great-grandmother left behind when the vault opened. She has faith and 400 caps.

  ## Secrets

  - One of the empty G.E.C.K. bays has a false floor. Beneath it: a sealed Vault-Tec memo documenting a bureaucratic G.E.C.K. mix-up. Most vaults were issued two kits; a shipping clerk's error sent Vault 70 a third, and the same clerk's paperwork shows Vault 13 getting a third kit in place of its spare water chips — which went to Vault 8 instead. The memo was never sent. An Overseer who wants to tie Vault 70 to Vault 13 should follow the thread.
source: vaults/06-classified-experiments#vault-70
---
id: vault-77
type: loc
name: Vault 77
tags: [vault, vaults-classified-experiments]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** A single resident was placed in the vault, accompanied only by an enormous crate of government-issue hand puppets. The experiment's purpose was not recorded.

  **Layout.**

  - **Entry Hall.** Empty. One chair facing the door.
  - **Residential Block.** Empty. A single cabin has been lived in.
  - **The Puppet Workshop.** A pre-war workshop, still functional. Hand puppets of every description — among them a little old woman, a king, a dog, and a Vault Boy.
  - **Overseer's Office.** The Overseer never arrived. A holotape in the office was prerecorded and played on a loop for the single resident's entire stay.
  - **The Stage.** The single resident built a stage and put on shows for the prerecorded Overseer. The shows are still scripted, still filed, in a pre-war script format.

  **Inhabitants.** Nobody. The resident left long ago. Some of the puppets seem to move when you aren't looking directly at them. This may or may not be a trick.

  **Reward.** **A Hand Puppet** (Overseer's choice which one) — _petty_, but a PC who produces the puppet at the right moment during a tense social encounter shifts the Reaction roll two steps better, once per session. **The Resident's Script Collection** — 6 holotapes of his puppet shows, which are unexpectedly brilliant.

  In each system's catalog: A Hand Puppet (grimfall.hand-puppet).

  **Hook.** An old caravaneer remembers watching the Vault 77 resident walk out of the vault years ago, carrying one puppet. He has never forgotten the look on that puppet's face. He wants to know if the rest of them are still there.

  ## Secrets

  - At the back of the stage, inside the prompter's box, is a sealed envelope addressed to Vault-Tec corporate. The resident had been writing them weekly for a year — fan letters, pitching new scripts, asking if anyone was watching. The letters were never collected. The last one ends mid-sentence.
