id: vault-55
type: loc
name: Vault 55
tags: [vault, vaults-classified-experiments]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** All entertainment tapes were removed from the vault on arrival day — the residents arrived to find every holotape of pre-war music, film, and recorded shows stripped from the shelves. The experiment measured the long-term effect of forced creative deprivation.

  **Layout.**

  - **Entry Hall.** Bare. The Vault-Tec welcome poster was pried off the wall long ago.
  - **Residential Block.** Each cabin has a carved wooden figure on the nightstand. The residents made them by hand.
  - **The Gallery.** A large chamber the residents filled with their own art — murals, sculptures from pre-war scrap, a single long poem scratched into the concrete floor.
  - **Overseer's Office.** The Overseer's final holotape is the Overseer reading her own original poem aloud.
  - **Reactor Room.** Fine.

  **Inhabitants.** An empty vault. The residents left years ago. One of them, an old ghoul, lives in a nearby settlement and still writes.

  **Reward.** **The Long Poem** (_petty_ relic) — a PC who reads it may, once per session, automatically succeed on a single WIL save against despair, loneliness, or hopelessness. **The Gallery's Wooden Figures** — each worth 40 caps, but the Overseer may decide one of them is an original worth much more.

  In each system's catalog: The Long Poem (grimfall.the-long-poem).

  **Hook.** A ghoul poet in a nearby settlement wants to recover her own handwriting from the vault. She cannot go herself — the memories are too much.

  ## Secrets

  - Under the gallery's longest mural, the poem scratched into the floor continues beneath the wall — the residents kept writing under the concrete after they ran out of room. A PC who pries up the flooring finds fourteen more stanzas that were never seen, ending in the names of everyone who'd lived in the vault.
source: vaults/06-classified-experiments#vault-55
---
id: vault-56
type: loc
name: Vault 56
tags: [vault, vaults-classified-experiments]
mechanics:
  fallout-2e: {kind: vault, poi: vault}
  grimfall: {kind: vault}
body: |-
  ## GM notes

  **Premise.** All entertainment holotapes were removed from the vault except those of a single, particularly bad comic actor — and the man himself was given a berth. The experiment measured the residents' tolerance for poorly crafted humor over an extended period — sociologists predicted Vault 56 would fail before Vault 55.

  **Layout.**

  - **Entry Hall.** A pre-war stage with a single spotlight.
  - **The Theater.** Rows of uncomfortable chairs facing the stage. The audience is still there.
  - **The Comedian's Dressing Room.** A cracked mirror, a pre-war joke book with every joke crossed out, a note that reads *I know it isn't working*.
  - **Overseer's Office.** The Overseer's final holotape is her, weeping, describing the comedian's seventh year of the same routine.
  - **Reactor Room.** Fine.

  **Inhabitants.** - **The Comedian** — 5 HP, 8 STR, 10 DEX, 14 WIL, no weapon. A lucid ghoul who has told the same routine for a century. He will not harm the party.
  - **Audience Ghouls** — detachment, treat as Feral Ghouls. They will **not** attack while a joke is being told from the stage. Any PC who can hold the mic for a full scene holds the room.

  **Reward.** **The Pre-war Joke Book** (_petty_ relic) — reading it in downtime is genuinely unpleasant, but a PC who endures the full read may, once per session, automatically succeed on a WIL save against boredom, tedium, or sustained psychological pressure (from sheer endurance). A single functional **Stand-Up Spotlight** (_bulky_) — at a settlement with power, it installs as a **Lit Signs & Streetlamps** building at no cost.

  In each system's catalog: The Pre-war Joke Book (grimfall.pre-war-joke-book).

  **Hook.** The Comedian knows he is not funny. He has written a new routine. He wants a real audience one last time — people who came in from outside. He is willing to trade anything in the vault for the chance.

  ## Secrets

  - Under the comedian's dressing room vanity, taped to the bottom of a drawer, is a single handwritten joke that is funny. The comedian wrote it the week before the vault sealed and never told it on stage. It's written in his own hand. He does not remember writing it. If the party reads it to him, he laughs once — and then weeps.
source: vaults/06-classified-experiments#vault-56
