table: vault-96-mutations
title: "Vault 96: an escaped specimen's quota mutation"
dice: d6
source: vaults/05-fallout-76#vault-96
entries:
  1: electrogenesis (shock — attacks step up one damage die)
  2: venom (a hit forces a STR save or d4 STR damage)
  3: regeneration (heals 1 HP a round)
  4: chameleonization (attacks from hiding are Enhanced)
  5: pyrokinesis (breathes fire, d6 blast)
  6: cryokinesis (a hit forces a DEX save or the target loses their next action)
