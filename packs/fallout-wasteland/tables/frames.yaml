table: frame-clocks
title: A frame's clocks, by number (the frame generator)
lookup: [frame, n]
source: campaigns/00-intro#how-to-use-a-campaign-frame
entries:
  fallout-3:
    1:
      text: Purity Clock
      data:
        id: fallout-3-purity-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) The Enclave's approach. Ticks when the party first reaches the Memorial, when James
          is named on open radio, when Dr. Li is recruited, and at each subsequent plot beat toward activation.
          At 1–3 the Enclave is distant; at 4–5 they have scouts in the Wasteland; at 6 they assault the
          Memorial. (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Eden Clock
      data:
        id: fallout-3-eden-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) President Eden's awareness of the party. Ticks when the party passes through an Enclave
          checkpoint, when a named Enclave officer survives and returns a report, and when Three Dog broadcasts
          a deed Eden would care about. At 4, Enclave strike teams hunt them on sight. (Grimfall: roll
          the pool for each tick; at 0d, what the clock's end says happens.)"
    3:
      text: Karma Clock
      data: {id: fallout-3-karma-clock, timer: false}
  fallout-new-vegas:
    1:
      text: Dam Clock
      data:
        id: fallout-new-vegas-dam-clock
        timer: true
        pool: pressure
        dice: 8
        note: "(d12) The armies converge. Ticks when a PC publicly pledges to a faction, the party takes
          an outlying asset (Khans, Brotherhood, Boomers, HELIOS One), a McCarran or Fort mission is completed,
          or any FNV DLC reaches its climax. At 12, the Second Battle begins whether the party is ready
          or not. (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Benny Clock
      data:
        id: fallout-new-vegas-benny-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Benny's flight. Starts once the party has spoken to Manny Vargas. Ticks when the party
          finishes a major Strip-facing scene without confronting Benny. At 4, Benny flees the Strip for
          the Fort — where the Legion takes him prisoner, a gift kneeling in Caesar's tent. (Grimfall:
          roll the pool for each tick; at 0d, what the clock's end says happens.)"
    3:
      text: Legion Frumentarii Clock
      data:
        id: fallout-new-vegas-legion-frumentarii-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) How many of Vulpes Inculta's spies the party has tripped. Ticks when a named Legion
          agent escapes, a Legion-sympathizer NPC is left alive after questioning, or Vulpes himself is
          seen and not killed. At 6, a four-man Legion hit team tries to assassinate the party during
          a scene of the Overseer's pick. (Grimfall: roll the pool for each tick; at 0d, what the clock's
          end says happens.)"
    4:
      text: Courier Clock
      data:
        id: fallout-new-vegas-courier-clock
        timer: true
        pool: pressure
        dice: 8
        note: "(d8, hidden, Overseer-only) Ticks when the party first enters a major settlement (Primm,
          Novac, the Strip, the Fort, Camp McCarran, Nellis, Jacobstown, Hidden Valley). On each tick,
          the Overseer narrates a letter, a rumor, or a voice that recognizes the PC as the Courier who
          survived. At 8, the whole Mojave knows the story before the party walks in. (Grimfall: roll
          the pool for each tick; at 0d, what the clock's end says happens.)"
  fallout-4:
    1:
      text: Institute Clock
      data:
        id: fallout-4-institute-clock
        timer: true
        pool: pressure
        dice: 8
        note: "(d8) The Institute's readiness to act. Ticks when the party: visibly aids the Railroad
          or Brotherhood, kills a named synth without concealing it, acquires a piece of the Signal Interceptor,
          or is scanned by a Gen-3 infiltrator the party failed to identify. At 8, a Courser is dispatched
          (Bestiary). (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Prydwen Clock
      data:
        id: fallout-4-prydwen-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) Brotherhood expansion. Ticks when the party accepts a Danse mission, refuses a Brotherhood
          requisition, or witnesses a Brotherhood purge of ghouls or super mutants without intervening.
          At 6, the Brotherhood sweeps a region the party cares about — a ghoul settlement, a synth safehouse,
          a lucid super mutant's home. (Grimfall: roll the pool for each tick; at 0d, what the clock's
          end says happens.)"
    3:
      text: Railroad Clock
      data:
        id: fallout-4-railroad-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4, hidden) The Institute's net on the Railroad. Ticks when the party visits a Railroad
          safehouse in clothing or company that marks them (Brotherhood plating, an unscrubbed Pip-Boy,
          a known Institute synth companion), or when the Institute Clock ticks. At 4, a Railroad safehouse
          the party has visited is raided, and an NPC the party knows dies. (Grimfall: roll the pool for
          each tick; at 0d, what the clock's end says happens.)"
  operation-anchorage:
    1:
      text: Glitch Clock
      data:
        id: operation-anchorage-glitch-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) The sim's varnish cracks. Ticks when the party kills a character the sim flagged as
          a non-combatant, uses tactics not in the mission briefing, tries to leave the mapped play area,
          or damages a fixed set piece. Each tick reveals a layer: 1 enemy reskin, 2 weather lock, 3 invisible
          wall, 4 friendly fire enabled, 5 Chase goes off-script, 6 reality bleed. (Grimfall: roll the
          pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Chase Clock
      data:
        id: operation-anchorage-chase-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) General Chase's patience with unorthodox tactics. Ticks when the party disobeys a
          direct order from Chase, questions the mission briefing openly, or steals rather than sabotages.
          At 4, he orders the party arrested by Sim-MPs. (Grimfall: roll the pool for each tick; at 0d,
          what the clock's end says happens.)"
  the-pitt:
    1:
      text: Heat Clock
      data:
        id: the-pitt-heat-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) Raider suspicion of the party. Ticks when the party commits open violence in Downtown,
          speaks to Midea where a raider can see, or wins in the Hole. At 6, Krenshaw locks down the Pitt
          — a raider detachment confronts the party on sight and the Steelyard becomes hostile territory.
          (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Cure Clock
      data:
        id: the-pitt-cure-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) How close the resistance is to forcing the issue. Ticks when the party accepts a package
          from Midea, smuggles a slave out of the Mill, or openly speaks against Ashur at his audience.
          At 4, Wernher strikes whether the party is ready or not. (Grimfall: roll the pool for each tick;
          at 0d, what the clock's end says happens.)"
  broken-steel:
    1:
      text: Assault Clock
      data:
        id: broken-steel-assault-clock
        timer: true
        pool: pressure
        dice: 8
        note: "(d8) The Brotherhood timetable. Ticks when Sarah completes a briefing, when the Tesla Cannon
          gains a working component, and when Rothchild certifies a party contribution to the attack plan.
          At 8, Sarah attacks regardless of the party's readiness. (Grimfall: roll the pool for each tick;
          at 0d, what the clock's end says happens.)"
    2:
      text: Orbital Clock
      data:
        id: broken-steel-orbital-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) Enclave satellite prep. Ticks when the party retrieves an Enclave encryption log,
          destroys an Enclave relay without wiping it first, or is overheard discussing the assault plan
          in a public settlement. At 6, the Enclave fires the orbital weapon at the Citadel — Overseer's
          call whether it hits. (Grimfall: roll the pool for each tick; at 0d, what the clock's end says
          happens.)"
  point-lookout:
    1:
      text: Feud Clock
      data:
        id: point-lookout-feud-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Lockheart vs. Calvert. Ticks when the party accepts a task from either faction, refuses
          a bribe from either, or is seen on the other side's ground. Each tick the two sides escalate;
          at 4, they'll try to use the party as the final weapon. (Grimfall: roll the pool for each tick;
          at 0d, what the clock's end says happens.)"
    2:
      text: Swamp Clock
      data:
        id: point-lookout-swamp-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) The bog gets weirder. Ticks when the party chews a punga fruit, kills a swampfolk
          elder, touches the Obelisk, or spends a watch unsheltered in the bog. Each tick, a new horror
          surfaces: 1 punga dreams shared, 2 swampfolk multiply, 3 a whale on the beach, 4 a flood, 5
          a storm. At 6, the Obelisk sings. (Grimfall: roll the pool for each tick; at 0d, what the clock's
          end says happens.)"
  mothership-zeta:
    1:
      text: Alien Alert Clock
      data:
        id: mothership-zeta-alien-alert-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) The ship's awareness. Ticks when the party fights loud (explosives, gunfire in a non-lab
          corridor), thaws a prisoner from stasis, or trips a Zetan security panel. At 6, a Guardian patrol
          sweeps every room. (Grimfall: roll the pool for each tick; at 0d, what the clock's end says
          happens.)"
    2:
      text: Reactor Clock
      data:
        id: mothership-zeta-reactor-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Starts once the party has sabotaged the generator. Ticks when the party damages another
          ship system (gravity plating, coolant line, external hull), fires the main cannon, or detonates
          a Zetan power cell. At 4, the ship begins to fall. (Grimfall: roll the pool for each tick; at
          0d, what the clock's end says happens.)"
  dead-money:
    1:
      text: Collar Clock
      data:
        id: dead-money-collar-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Ticks when the party triggers an interference — entering a zone with an active broadcast
          speaker, detonating explosives near the collars, crossing a radio dead zone. At 4, a PC of the
          Overseer's choice takes d6 damage from the collar — any Scar that results is Concussed. Reset
          to 0 when the party silences the nearest speaker or leaves the interference. (Grimfall: roll
          the pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Elijah Clock
      data:
        id: dead-money-elijah-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) Elijah's patience. Ticks when the party mouths off on the radio. At 6, he cuts the
          party loose: unless someone talks him back from it (a WIL save, and a reason he still needs
          them), every collar fires in earnest — d12 damage to each PC, ignoring Armor — and the clock
          resets to 3. (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
    3:
      text: Cloud Clock
      data: {id: dead-money-cloud-clock, timer: false}
  honest-hearts:
    1:
      text: War Clock
      data:
        id: honest-hearts-war-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) Graham's offensive timeline. Ticks when the party accepts or trains with Graham, when
          a White Legs raid happens within the party's view, or when a named Dead Horse or Sorrows NPC
          is killed. At 6, the Three Marys ambush fires whether the party is there or not. (Grimfall:
          roll the pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Evacuation Clock
      data:
        id: honest-hearts-evacuation-clock
        timer: true
        pool: task
        dice: 4
        note: "(d4) Daniel's preparation. Ticks when the party completes a preparation (scouting the route
          east, making shoes for children, clearing a bloatfly nest, finding a signal beacon). At 4, Daniel
          can move the tribe. (Grimfall: roll the pool for each tick; at 0d, what the clock's end says
          happens.)"
  old-world-blues:
    1:
      text: Science Clock
      data:
        id: old-world-blues-science-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) The Think Tank's attention span. Ticks when the party refuses an experimental offer,
          disagrees with a Think Tank member in audience, or returns to the Sink without a new specimen.
          At 6, they try to \"upgrade\" the party without consent. (Grimfall: roll the pool for each tick;
          at 0d, what the clock's end says happens.)"
    2:
      text: Mobius Clock
      data:
        id: old-world-blues-mobius-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Mobius's opposition. Ticks when the party clears a lab, recovers a pre-war technology
          the Think Tank will want, or is broadcast-at from the Forbidden Zone. Each tick, a new roboscorpion
          patrol is loosed into a zone of the Overseer's pick. At 4, the patrols converge on the Sink
          itself. (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
  lonesome-road:
    1:
      text: Launch Clock
      data:
        id: lonesome-road-launch-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Ulysses's ritual. Ticks when the party completes a Divide waypoint (the Hopeville
          Silo, the High Road, the Courier's Mile) — and once more if they turn back, or rest a full day
          inside the Divide. The party cannot reach him before it hits 3. At 4, missiles fly no matter
          what — Overseer's pick of target. (Grimfall: roll the pool for each tick; at 0d, what the clock's
          end says happens.)"
    2:
      text: Rad Clock
      data: {id: lonesome-road-rad-clock, timer: false}
  automatron:
    1:
      text: Army Clock
      data:
        id: automatron-army-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) The Mechanist's production line. Ticks when the party defeats a Mechanist patrol without
          destroying the factory relay, leaves an intact Robobrain behind, or broadcasts on an open channel.
          At 6, she sends an attack wave at the nearest settlement — party's home base, if they have one.
          (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Isabel Clock
      data:
        id: automatron-isabel-clock
        timer: true
        pool: task
        dice: 4
        note: "(d4) Her grip on reality. Ticks when the party spares one of her robots or contacts her
          by radio without naming her. Each tick is a new reveal: 1 doubts herself, 2 sets aside the megaphone,
          3 asks for help, 4 ready to surrender if the party has not attacked her lair yet. (Grimfall:
          roll the pool for each tick; at 0d, what the clock's end says happens.)"
  far-harbor:
    1:
      text: Fog Clock
      data:
        id: far-harbor-fog-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) Condenser failure. Ticks when the party returns to Far Harbor without having tended
          a condenser since their last visit (max one tick per return). Tending a condenser walks the
          clock back one. At 6, the town evacuates. (Grimfall: roll the pool for each tick; at 0d, what
          the clock's end says happens.)"
    2:
      text: Atom Clock
      data:
        id: far-harbor-atom-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Tektus's sermon count. Ticks when the party challenges Atom doctrine inside the Nucleus,
          interferes with a Cleanser's mission in Far Harbor, or is revealed to have accepted Far Harbor's
          hospitality while inside the Nucleus. At 4, he declares holy war. (Grimfall: roll the pool for
          each tick; at 0d, what the clock's end says happens.)"
    3:
      text: DiMA Clock
      data:
        id: far-harbor-dima-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) DiMA's secret works its way loose. Ticks when the party asks Avery about her past,
          speaks DiMA's name inside Far Harbor, recovers a memory segment in the Memory Den, or is seen
          leaving Acadia by a Harbor native. At 6, Acadia is exposed to both Far Harbor and Atom, whether
          the party wants it or not. (Grimfall: roll the pool for each tick; at 0d, what the clock's end
          says happens.)"
  vault-tec-workshop:
    1:
      text: Experiment Clock
      data:
        id: vault-tec-workshop-experiment-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Barstow's patience with the party's progress. Starts at 0; ticks when the party refuses
          an experimental pod, frees a subject mid-experiment, or spends a Downtime Action on anything
          other than her work. Completing an experimental pod walks it back one. At 4, she starts issuing
          threats to the first Bond-NPC the party knows from outside the vault. (Grimfall: roll the pool
          for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Tunnel Clock
      data:
        id: vault-tec-workshop-tunnel-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) Radscorpion intrusion from the deep caverns. Ticks when the party detonates explosives
          in the caverns, breaches an unmapped wall, or leaves a scouting radscorpion alive to skitter
          back to the nest. At 6, a queen breaks through a wall of the dormitories. (Grimfall: roll the
          pool for each tick; at 0d, what the clock's end says happens.)"
    3:
      text: Mutiny Clock
      data:
        id: vault-tec-workshop-mutiny-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Settler patience, once any settler has been strapped into a pod. Ticks when a settler
          sees the party participate in an experiment, when a pod subject visibly deteriorates in front
          of the others, or when Barstow publicly overrules the party on a settler's behalf. At 4, the
          settlers revolt against Barstow and the party. (Grimfall: roll the pool for each tick; at 0d,
          what the clock's end says happens.)"
  nuka-world:
    1:
      text: Crown Clock
      data:
        id: nuka-world-crown-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Gage's patience with the party's indecision about the Overboss seat. Ticks when the
          party declines a gang's direct petition, refuses to hold court in Fizztop Grille, or pointedly
          helps a caged trader in view of a gang boss. At 4, one of the three gangs installs its own Overboss
          and treats the party as enemies. (Grimfall: roll the pool for each tick; at 0d, what the clock's
          end says happens.)"
    2:
      text: Slave Clock
      data:
        id: nuka-world-slave-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) The traders caged in Nuka-Town USA. Ticks when the party walks past the cages without
          acting, when a gang boss orders a public execution for sport, and when the party takes on an
          Overboss task without negotiating for a prisoner's life first. Each tick is a death. The caged
          traders are a named roster — Chip Morse, Mackenzie Bridgeman, Aaron Corbett, and others. At
          4, Mackenzie is among the dead, and the Liberate the park ending loses its ally. (Grimfall:
          roll the pool for each tick; at 0d, what the clock's end says happens.)"
    3:
      text: Commonwealth Clock
      data:
        id: nuka-world-commonwealth-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) If the party sides with the raiders. Ticks on each Commonwealth settlement raided,
          sacked, or surrendered to a Nuka-World gang. At 6, a Minutemen relief force arrives at the park
          gates. (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
  fallout-76:
    1:
      text: Chorus Clock
      data:
        id: fallout-76-chorus-clock
        timer: true
        pool: pressure
        dice: 8
        note: "(d8) The scorchbeast hive mind learning the party's scent. Ticks when the party kills a
          scorchbeast, enters a fissure site, brings a Scorched Detector back online, or spends a night
          in the Cranberry Bog. At 8, the chorus turns on them: every Scorched anywhere in Appalachia
          is Hostile on sight — no Reaction roll — and a scorchbeast hunts the party's camp every third
          night, until the Queen dies. (Grimfall: roll the pool for each tick; at 0d, what the clock's
          end says happens.)"
    2:
      text: DEFCON Clock
      data:
        id: fallout-76-defcon-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) The launch system's automated threat rating — the machine Eckhart fooled. Ticks when
          a nuke is launched anywhere in Appalachia, when the party destroys a SAC cargobot, or when the
          party fights Liberators or Scorched inside a military installation. At 6, the system judges
          Appalachia a war zone: SAC dispatches a fresh keycard convoy (the next keycard is easy to find),
          and every silo's security robots are rearmed to double strength. (Grimfall: roll the pool for
          each tick; at 0d, what the clock's end says happens.)"
    3:
      text: MODUS Clock
      data:
        id: fallout-76-modus-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6, hidden) MODUS's suspicion. Ticks when the party lies to MODUS about an errand, damages
          bunker property, wears Brotherhood or Free States colors into the bunker, or presses it about
          the Enclave's civil war. At 6, MODUS seals the room the party stands in and begins pumping gas,
          as it did to Eckhart's dissenters. The party has three rounds to break out or to talk it down
          (a WIL save, which counts as WIL −4 unless someone holds a general's commission). (Grimfall:
          roll the pool for each tick; at 0d, what the clock's end says happens.)"
  wastelanders:
    1:
      text: Gold Fever Clock
      data:
        id: wastelanders-gold-fever-clock
        timer: true
        pool: pressure
        dice: 8
        note: "(d8) How far the rumor spreads. Ticks when the party talks about Vault 79 in the Wayward,
          travels with a treasure hunter, lets a Free Radical or Blood Eagle escape a fight, or approaches
          the vault's cave openly. At 8, a Blood Eagle war band reaches the vault the same day the party
          does. (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Rivalry Clock
      data:
        id: wastelanders-rivalry-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) Foundation and the Crater edging toward war. Ticks when the party works openly for
          one faction in the other's territory, when either side's caravan is hit, or when Hijack or Lev
          acts. At 6, the feud goes hot: Crater raiders burn a Foundation outpost, the Settlers answer
          in kind, and the faction the party has not chosen treats them as enemies. (Grimfall: roll the
          pool for each tick; at 0d, what the clock's end says happens.)"
    3:
      text: Lockdown Clock
      data:
        id: wastelanders-lockdown-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4, hidden; ticks only inside Vault 79) Ticks when a laser grid is tripped, a power line
          fluctuates, or a turret alarm sounds. At 4, the vault seals every bulkhead and the Grim Reaper's
          Hallway goes live behind the party. (Grimfall: roll the pool for each tick; at 0d, what the
          clock's end says happens.)"
  steel-dawn:
    1:
      text: Schism Clock
      data:
        id: steel-dawn-schism-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) The rift between Rahmani and Shin. Ticks when the party openly backs one commander
          against the other's orders, when Brotherhood technology is lost to outsiders, when an initiate
          dies on a mission, or when the Codex is broken in front of the ranks. At 6, the expedition splits
          before the Climax: Shin's loyalists and Rahmani's followers stop taking each other's orders,
          and the party must declare for one of them on the spot. (Grimfall: roll the pool for each tick;
          at 0d, what the clock's end says happens.)"
    2:
      text: Hellstorm Clock
      data:
        id: steel-dawn-hellstorm-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Launchers loose in Appalachia. Ticks when the party lets a Hellstorm stay in raider
          hands, keeps one for itself, trades one away, or fails to recover it after a fight. At 4, a
          raider warband levels a settlement the party cares about with Brotherhood missiles, and everyone
          in Appalachia knows whose they were. (Grimfall: roll the pool for each tick; at 0d, what the
          clock's end says happens.)"
    3:
      text: Mutagen Clock
      data:
        id: steel-dawn-mutagen-clock
        timer: true
        pool: pressure
        dice: 8
        note: "(d8, hidden) Blackburn's progress. Ticks each week the party does not find him, each time
          another civilian disappears, and each time his Hellcats take a fight. At 8, Blackburn's refined
          virus is ready: he walks out of Vault 96 already transformed, and West Tek begins shipping FEV.
          (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
  skyline-valley:
    1:
      text: Storm Clock
      data:
        id: skyline-valley-storm-clock
        timer: true
        pool: pressure
        dice: 8
        note: "(d8) The Storm spreading. Ticks each time a storm harvester is lost, each week the party
          leaves the weather machine running, and each time Hugo's plans advance unopposed. At 8, the
          Storm spills past Skyline Valley into the Ash Heap and the Cranberry Bog: lightning strikes
          (d8, DEX save) on any exposed ridge, and Lost appearing wherever it rains. (Grimfall: roll the
          pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Family Clock
      data:
        id: skyline-valley-family-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6, hidden) How much Audrey and Hilda know about Hugo. Ticks when the party finds evidence
          of the Dark Hollow betrayal, reads Cassidy's journal, meets Alex, or recovers Oberlin's report.
          At 6, Audrey confronts her father alone, and the Overseer decides whether she survives it. (Grimfall:
          roll the pool for each tick; at 0d, what the clock's end says happens.)"
    3:
      text: Goliath Clock
      data:
        id: skyline-valley-goliath-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4) Vault 63's guardian protocol. Ticks each time the party damages vault systems or fights
          in the engineering sector. At 4, a Storm Goliath is dispatched against them — and if one is
          destroyed, the engineering sector begins building its replacement. (Grimfall: roll the pool
          for each tick; at 0d, what the clock's end says happens.)"
  atlantic-city:
    1:
      text: Treaty Clock
      data:
        id: atlantic-city-treaty-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) The truce that keeps Acee's three powers from open war. Ticks when the party spills
          blood on another faction's ground, humiliates a made man or a Showman, or carries Lombardi secrets
          to the Munis (or the reverse). At 6, the treaty breaks: the Casino Quarter, the Boardwalk, and
          City Hall go to war, and every faction wants the party on its side or dead. (Grimfall: roll
          the pool for each tick; at 0d, what the clock's end says happens.)"
    2:
      text: Concerta Clock
      data:
        id: atlantic-city-concerta-clock
        timer: true
        pool: pressure
        dice: 4
        note: "(d4, hidden) Concerta learning that Antonio is not senile. Ticks when the party is seen
          with a Russo in Acee, asks about the Devil's Blood lab, or leaves a hitman alive to report.
          At 4, Concerta sends her best people to the Rose Room — not hitmen who jump the gun this time.
          (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
    3:
      text: Withdrawal Clock
      data:
        id: atlantic-city-withdrawal-clock
        timer: true
        pool: pressure
        dice: 6
        note: "(d6) Abbie's hold on herself. Ticks each week without a dose or a cure, and each time her
          father lies to her. At 6, Abbie goes missing, back to Acee and the one dealer who will sell
          to her. (Grimfall: roll the pool for each tick; at 0d, what the clock's end says happens.)"
