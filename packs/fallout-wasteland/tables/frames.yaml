table: cloud-clock
title: 'Dead Money: the Cloud at a new zone'
description: Roll at each new zone the party enters (the Cloud Clock).
dice: d6
source: campaigns/09-dead-money#clocks
entries:
  1-2: The fog surges and the whole zone deals 1d4 STR damage to any exposed PC.
  3-6: No surge in this zone.
