# Grimscrolls, Chapter 5: the races, birthsigns (and the month a roll gives), standing stones
# and Shouts, and each race's names (Chapter 3). Generated by gs_heritage.py: do not edit by hand.
table: races
title: The ten races
description: "Your race is one of your two backgrounds: three wises (swap out any that don't fit how your
  hero was raised) and one racial talent, in the blood. One race, and its talent alone. Other bloods.
  A hero of mixed parentage takes one parent's talent and whatever wises fit. If your table wants something
  rarer — a Maormer, a Reachman, a Snow Elf who never went blind — pick the nearest talent here and re-skin
  it."
source: blood-stars-and-stones/blood-the-ten-races
entries:
- text: Altmer
  data:
    id: altmer
    wises: [arcane theory, bloodlines and precedent, the long view]
    talent: altmer-highborn
    names: [Naerwen, Sorondil]
  note: 'The High Elves of the Summerset Isles: tall, golden, long-lived, and quite sure what that means.
    Wises: arcane theory, bloodlines and precedent, the long view. Racial talent: Highborn.'
- text: Argonian
  data:
    id: argonian
    wises: [marsh and river, the Hist and its roots, being underestimated]
    talent: argonian-histskin
    names: [Wakes-the-Water, Okeeh]
  note: 'The Saxhleel of Black Marsh: scaled, patient, and raised by trees that think. Wises: marsh and
    river, the Hist and its roots, being underestimated. Racial talent: Histskin.'
- text: Bosmer
  data:
    id: bosmer
    wises: [the Green Pact, beasts and their moods, the canopy roads]
    talent: bosmer-command-animal
    names: [Maelin, Dirnor]
  note: 'The Wood Elves of Valenwood: small, quick, bound by the Green Pact, and very good shots. Wises:
    the Green Pact, beasts and their moods, the canopy roads. Racial talent: Command Animal.'
- text: Breton
  data:
    id: breton
    wises: [hedge magic, petty kingdoms and their feuds, a good bargain]
    talent: breton-dragonskin
    names: [Elise, Gaston]
  note: 'The folk of High Rock: human, with enough elf in the blood to bend a spell around. Wises: hedge
    magic, petty kingdoms and their feuds, a good bargain. Racial talent: Dragonskin.'
- text: Dunmer
  data:
    id: dunmer
    wises: [ancestors and their grudges, the Great Houses, ash and exile]
    talent: dunmer-ancestors-wrath
    names: [Varona, Drelas]
  note: "The Dark Elves of Morrowind: ash-skinned, red-eyed, and on speaking terms with their dead. Wises:
    ancestors and their grudges, the Great Houses, ash and exile. Racial talent: Ancestor's Wrath."
- text: Imperial
  data:
    id: imperial
    wises: [the law and its clerks, the Legion's ways, what things cost]
    talent: imperial-voice-of-the-emperor
    names: [Cassia, Marcellus]
  note: "The people of Cyrodiil: soldiers, clerks, and merchants, who built an Empire out of all three.
    Wises: the law and its clerks, the Legion's ways, what things cost. Racial talent: Voice of the Emperor."
- text: Khajiit
  data:
    id: khajiit
    wises: [the caravan roads, the moons and their sugar, what the night hides]
    talent: khajiit-night-eye
    names: [Kazari, Dro'Zahr]
  note: 'The cat-folk of Elsweyr: shaped by the moons, fond of sugar, welcome in few cities and found
    in all of them. Wises: the caravan roads, the moons and their sugar, what the night hides. Racial
    talent: Night Eye.'
- text: Nord
  data:
    id: nord
    wises: [old songs and older feuds, hard country, the honor of the hall]
    talent: nord-battle-cry
    names: [Hjalda, Torvald]
  note: 'The children of Skyrim: tall, fair, loud, and at home in weather that kills other people. Wises:
    old songs and older feuds, hard country, the honor of the hall. Racial talent: Battle Cry.'
- text: Orc
  data:
    id: orc
    wises: [the Code of Malacath, stronghold life, good steel]
    talent: orc-berserker-rage
    names: [Shura gra-Bol, Uzgash gro-Morg]
  note: "The Orsimer of the strongholds and Orsinium: the pariah folk, the best smiths alive, and the
    Legion's favorite shock troops. Wises: the Code of Malacath, stronghold life, good steel. Racial talent:
    Berserker Rage."
- text: Redguard
  data:
    id: redguard
    wises: [sand and sea, the Way of the Sword, the honored dead]
    talent: redguard-adrenaline-rush
    names: [Samira, Kazim]
  note: "The people of Hammerfell: heirs of lost Yokuda, born with a sword's balance and no patience for
    sorcery. Wises: sand and sea, the Way of the Sword, the honored dead. Racial talent: Adrenaline Rush."
