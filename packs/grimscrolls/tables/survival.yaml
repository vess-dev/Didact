table: plunder
title: 'Plunder: what the search turns up'
lookup: result
description: The story roll's result for a place picked over. A thorough search takes time; if 
  anything is closing in, roll its pool.
source: surviving-tamriel/coin-and-barter#plunder
entries:
  perfect: a minor haul, or a cache that refills one pool (Potions, an alchemist's Satchel, a 
    relic's charge).
  messy: a find with a catch — it's trapped, it's claimed, it's cursed.
  grim: nothing, and now something knows you're here.
