table: arrest
title: 'At 0d: the old words'
description: When a jurisdiction's bounty pool hits 0d, a patrol stops you with the old words, and 
  you choose (`didact do arrest`).
source: surviving-tamriel/crime-and-bounty#at-0d
entries:
- text: "Pay the fine: Roll your Coin — drop 1d first if there's blood on the ledger. Anything stolen
    is confiscated. The pool clears."
  data: {id: pay-the-fine}
- text: 'Serve the time: Time passes (below) without a downtime action, and you come out with the pool
    cleared and nothing in your pockets.'
  data: {id: serve-the-time}
- text: "Resist arrest: It's a fight with the Hold Guards (Chapter 7), the next pool starts at 4d, and
    your standing in that hold drops a step (Chapter 9)."
  data: {id: resist-arrest}
---
table: downtime-actions
title: Downtime actions
description: "When time passes, each hero picks one downtime action, or two different ones if they sold
  off a haul. Each entry's data holds its id: `didact do downtime who=<hero> act=<id>`."
source: surviving-tamriel/downtime
entries:
- text: 'Rest: shake every non-permanent condition (marks and harm already clear with any real rest);
    the GM may rule that a long-term one lingers.'
  data: {id: rest}
- text: "Venture: odd jobs, a guild contract, a solo errand. Make a story roll: on a perfect, a minor
    haul, a rumor, or a new ally; on a messy or worse, it's complicated."
  data: {id: venture}
- text: 'Carouse: give a vignette of how you unwind — the mead hall, the Arena, the chapel, a drinking
    contest with a stranger named Sam — and take spark.'
  data: {id: carouse}
- text: 'Pursue a goal: chase a project with a task pool, rolled each time you pick this: rise in a guild,
    build the house, forge the blade, retrain a wise or a talent with a master who charges for it.'
  data: {id: pursue}
- text: "Plan ahead: write a few words about how you prepare and take a special thread, on top of your
    usual two, usable only on details from that preparation. It's lost when time passes again."
  data: {id: plan}
