table: region-map
title: 'Making the map: what tokens buy'
description: "Making the map. When the GM calls to expand the map — at the start, at the edge of the known,
  or whenever the story opens new ground — everyone at the table, GM included, takes 3 exploration tokens
  and spends them going around: settlements, sites, dangers, curiosities, areas, and barriers, joined
  by paths — major roads, minor trails, rough scrambles — with a waypoint for each day of hard travel.
  Everything gets a two-word label (Drowned Shrine, Giant's Pasture, Smugglers' Stair). Heroes also earn
  1–3 tokens for a real discovery, and can spend thread as a token when a wise or story arc explains how
  they knew. Town maps work the same at street scale; barrows and ruins become 5-point site maps (Chapter
  9). The GM draws the first road in; nobody knows the whole province, and the map grows the way rumor
  does."
source: surviving-tamriel/the-long-road#making-the-map
entries:
- 'Points: a settlement, site, or danger: 1 token minor, 2 major.'
- 'Specials: a curiosity, barrier, or area: 3 tokens (the GM adds them free).'
- "Paths: rough free · minor 1 · major 2. Passes (bridges, tunnels) ride along free; waypoints are the
  GM's."
