table: draughts
title: Other draughts
description: Anything stranger than a healing potion is a trivial expendable — one spell-sized 
  effect, no roll, good for a scene — and it's a find, a purchase, or an Alchemist's work (Chapter 
  4), never a bottomless pocket. A stock is as deep as the fiction says, or a 2d resource pool if 
  your table would rather count.
source: surviving-tamriel/potions#other-draughts
entries:
- text: Cure Disease
  data: {id: cure-disease}
  note: 'While it lasts: ends an ordinary disease on the spot. The catch: the Blight and the two curses
    need more than a bottle.'
- text: Cure Poison
  data: {id: cure-poison}
  note: "While it lasts: ends a poison's timer."
- text: Magicka
  data: {id: magicka}
  note: 'While it lasts: regain magic (Chapter 4). The catch: one a scene, or it comes back up.'
- text: Resist (fire, frost, or shock)
  data: {id: resist-fire-frost-or-shock}
  note: 'While it lasts: that element lands one step lighter. The catch: name the element when you buy
    it.'
- text: Stamina
  data: {id: stamina}
  note: "While it lasts: ignore thorns from exhaustion; your next push is free. The catch: you'll sleep
    like the dead tonight."
- text: Water Breathing
  data: {id: water-breathing}
  note: 'While it lasts: a scene under the surface. The catch: the scene ends when it does.'
- text: Night-Eye
  data: {id: night-eye}
  note: 'While it lasts: darkness never thorns you. The catch: daylight dazzles: +1t for a beat when it
    hits.'
- text: Invisibility
  data: {id: invisibility}
  note: 'While it lasts: unseen until you strike, cast, or speak. The catch: rare, expensive, and everyone
    assumes the worst of the buyer.'
- text: Mead & ale
  data: {id: mead-and-ale}
  note: 'While it lasts: shrug off one vex. The catch: +1t on anything delicate.'
- text: Skooma
  data: {id: skooma}
  note: 'While it lasts: +1d on anything that wants speed or strength. The catch: mark Wits when it fades;
    see below.'
- text: Sleeping tree sap
  data: {id: sleeping-tree-sap}
  note: 'While it lasts: the first harm you take lands as a mark. The catch: slow and happy: +1t on Agility.'
