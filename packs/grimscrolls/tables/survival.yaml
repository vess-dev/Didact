table: diseases
title: Disease
description: "A disease is a long-term condition: +1t whenever it specifically gets in your way. The Bestiary's
  cards say which creatures carry what. When a carrier's blow lands as harm — or the GM spends suspense
  — the disease can come with it; you'll notice at your next rest. A Cure Disease draught, a shrine's
  blessing, a healer's purging, or a downtime Rest ends an ordinary one."
source: surviving-tamriel/disease
entries:
- text: Ataxia
  data: {id: ataxia}
