lookup: size
description: Serious wealth moves in hauls, in three sizes (the book's examples). Hauls belong to 
  the party unless you decide otherwise; a few hundred septims is a minor haul, a few thousand a 
  major one.
source: surviving-tamriel/coin-and-barter
