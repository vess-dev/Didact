table: joy-of-exploration
title: Wonder on the road
description: Take spark when you let the world in.
source: surviving-tamriel/the-long-road#wonder-on-the-road
entries:
- Pause for an aurora over the Throat of the World and show us what it means to your hero.
- Ask a question about the Dwemer nobody at the table can answer, and let the table run with it.
- Travel somewhere far off just to see what's there (everyone who goes takes spark).
- Make a scene about a place itself, one you'll never forget.
