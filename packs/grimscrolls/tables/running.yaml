table: vigilance
title: Vigilance
description: PCs are as alert as their vantage says. Against a hidden danger, spotlight the most 
  relevant PC and pick (by vantage; with active vigilance, a story roll).
source: running-tamriel/vigilance
entries:
- text: 'Reveal: they see it plainly — the pressure plate sits proud of the floor'
  data: {id: reveal}
- text: 'Hint: one shot at intuition — the birds have stopped'
  data: {id: hint}
- text: 'Strike: spend suspense: the danger lands as an impact move, and the target gets a defense roll'
  data: {id: strike}
