table: stakes
title: Stakes
description: "The GM signals how hard the world hits; unless it's said otherwise, stakes are regular.
  Say them out loud when they change: nobody gets dropped by surprise math."
source: the-core-engine/stakes
entries:
- text: 'Low: an impact move weighs a mark at most. Tavern brawls and bruised pride.'
  data: {id: low}
- text: 'Regular: the default: an impact move weighs one harm.'
  data: {id: regular}
- text: 'High: impact moves land double, and a disaster can drop you on the spot.'
  data: {id: high}
- text: 'Dire: death looms: any impact move drops you. If a scene could drop someone outright, everyone
    hears it before the dice fly.'
  data: {id: dire}
