table: standing
title: Standing
lookup: standing
description: "Tamriel keeps score. For each faction that matters, write one word for how it sees the party
  — or one hero, if they've earned a name of their own. Standing is vantage: it sets the thorns on every
  dealing with that faction, and what's certain, doubtful, or impossible to ask of them. Standing moves
  a step when you do something that faction will tell stories about — and the same deed usually moves
  two factions in opposite directions. Out of every faction's earshot, it's just fame: what the bards
  sing about you decides whether the next stranger buys you a drink or sends for the guard."
source: running-tamriel/the-greywatch-powderkeg#standing
entries:
  honored:
    text: "Honored: Doors open and reasonable favors are certain — a thane's welcome. When they hear you're
      in trouble, they send help."
    data: {thorns: 0}
  trusted:
    text: "Trusted: Fair dealing and fair prices; you're let inside the walls after dark."
    data: {thorns: 0}
  stranger:
    text: "Stranger: The default. They don't know you from a mudcrab."
    data: {thorns: 0}
  watched:
    text: 'Watched: Prices double and eyes follow you: +1t on every dealing.'
    data: {thorns: 1}
  outlawed:
    text: "Outlawed: Arrested or attacked on sight, and somebody's paying: start a 6d They Find You campaign
      pool."
    data: {thorns: 0}
