table: site-points
title: 'A barrow or ruin: the five-point site'
description: 'Build a barrow, or any delve, as a 5-point site: the GM places the Hoard first, then everyone
  spends exploration tokens on the rest.'
source: running-tamriel/barrows-ruins-and-gates#the-five-point-site
entries:
- text: 'The Door (Entrance): getting in is its own story: the claw, the collapsed stair, the thing nesting
    in the antechamber.'
  data: {id: door, role: entrance}
- text: "The Riddle (Puzzle): whoever built it wanted something kept in, or out; meet that as a problem
    that can't just be hit."
  data: {id: riddle, role: puzzle}
- text: "The Twist (Hitch): what the centuries did to the builders' plan. The rival expedition, the second
    seal, the tenant."
  data: {id: twist, role: hitch}
- text: 'The Reckoning (Showdown): the fight or the bargain this place has been waiting to have.'
  data: {id: reckoning, role: showdown}
- text: 'The Hoard (Reward): the haul, the truth, and usually a hook to the next site.'
  data: {id: hoard, role: reward}
