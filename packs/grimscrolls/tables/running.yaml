# `vigilance-examples` keep grimwild-ce's ids, so its rules and generators read them.
table: suspense-moves
title: Suspense moves
description: Suspense is your currency of dramatic timing. Earn it by skipping a prompted impact 
  move or by making suspense moves; spend it to strike at any moment. Impact moves aimed at a PC who
  didn't invite them grant a defense roll. Every challenge you frame brings 2 bonus suspense of its 
  own — a linked challenge brings it once, not per pool. Suspense moves earn the GM suspense 
  (Foreshadow is free).
source: running-tamriel/the-gms-half-of-the-engine#the-eight-moves
entries:
- text: 'Build Up: a vignette before the storm; every PC adds a detail and takes spark, you take suspense.'
  data:
    id: build-up
    examples:
    - The dragon's shadow crosses the valley and goes on. How do you spend the hour before it comes 
      back?
- text: "Clue In: cut away to show the players what their characters can't see; take suspense."
  data:
    id: clue-in
    examples: ['We see the justiciar fold the letter, smile, and send for her soldiers.']
- text: 'Foreshadow: telegraph danger for free; if it goes unaddressed, it lands.'
  data:
    id: foreshadow
    examples:
    - The flagstones here are a different color. Something in the wall niche has blue eyes.
- text: 'Resolve: hand the party a way out and take suspense.'
  data:
    id: resolve
    examples: ['The guard squints, decides you must be the new recruits, and waves you through.']
---
table: impact-moves
title: Impact moves
description: Impact moves, on messy and grim rolls and whenever the GM spends suspense; a move a PC 
  didn't invite gets a defense roll.
source: running-tamriel/the-gms-half-of-the-engine#the-eight-moves
entries:
- text: 'Complicate Things: add or worsen a threat.'
  data:
    id: complicate-things
    examples: [The horn starts a 4d Reinforcements pool. The oil on the floor finds the torch.]
- text: "Counter: stop a success or a permission cold; save it for exceptional foes (this is what beats
    an \"always\"), and never use it on a defense roll or a critical. A countered talent usually refunds
    its cost (your call), but it can't be used again right away."
  data:
    id: counter
    examples: [The dragon priest's ward drinks your perfect spell.]
- text: 'Hit Hard: marks, harm, vex, conditions.'
  data:
    id: hit-hard
    examples: ['The rune goes off — bloodied, and your ears ring.']
- text: 'Lock Down: close a door forever; force a stark choice.'
  data:
    id: lock-down
    examples: [The portcullis drops. The ship sails. Him or the Scroll — pick.]
