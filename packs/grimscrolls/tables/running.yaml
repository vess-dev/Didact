table: greywatch-factions
title: 'The Greywatch Powderkeg: factions'
description: A drop-in sandbox. Greywatch is a toll town on the Pale Pass road, the one way between 
  Cyrodiil and Skyrim that stays open in winter — which is why everyone wants it and no one can hold
  it. It's written for the Skyrim civil war; for another era, swap the uniforms and keep the 
  grudges. Track each faction's goals with faction pools, rolled between sessions or whenever the 
  story triggers them — and in downtime, roll them all, then pick one and run it dry. When one 
  empties, the goal lands on screen — or the faction moves against a rival, with a story roll in its
  favor deciding how it goes. Every other faction reacts. Keep four to six in play, and replace any 
  faction the story uses up.
source: running-tamriel/the-greywatch-powderkeg
