table: daedric-princes
title: The Daedric Princes
description: "Sooner or later a Prince takes an interest. A Prince is never a stat block. It is a voice,
  a bargain, and a campaign pool: when a hero accepts a Prince's task, start an 8d [Prince]'s Patience
  pool and roll it whenever they stall, bargain, or disappoint. At 0d the Prince clears the matter up
  in person, and nobody enjoys it. Finish the task and the relic is yours (Chapter 8) — along with the
  Prince's attention, which doesn't end when the task does."
source: running-tamriel/the-daedric-princes
