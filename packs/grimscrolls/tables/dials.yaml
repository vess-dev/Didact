table: oaths
title: Oaths & tenets
description: 'Half of Tamriel has sworn to something. At creation, each hero may take one oath: an edge
  and a flaw, welded together. The edge is always on — a permission or a thorn ignored, never a die. The
  flaw is a standing tangle: the first time each session it truly bites, take spark. Break the oath for
  good and you lose the edge; the people you swore to will have opinions.'
source: options-and-dials/oaths-and-tenets
entries:
- text: The Green Pact
  data: {id: the-green-pact}
  note: "edge: The wild knows its own: forest and jungle never thorn you, and its beasts don't strike
    you first. flaw: You harm no living plant, eat only meat, and leave nothing you kill to waste."
- text: The Code of Malacath
  data: {id: the-code-of-malacath}
  note: 'edge: Among Orcs your word is a contract, and a blood price settles anything you do against them.
    flaw: Every insult is answered and every debt is paid — in blood, if nothing else will do.'
- text: The Five Tenets
  data: {id: the-five-tenets}
  note: "edge: Any Dark Brother or Sister shelters you without a question, and you know the Brotherhood's
    signs on sight. flaw: Disobey, betray, steal from, or kill one of your own, and the Wrath of Sithis
    comes looking."
- text: The Guild's Rule
  data: {id: the-guilds-rule}
  note: 'edge: Fences, safehouses, and shadowmarks are open to you in every city. flaw: No killing on
    the job — and never rob the poor, or a guildmate.'
- text: The Way of the Voice
  data: {id: the-way-of-the-voice}
  note: 'edge: Your stillness unsettles the violent: you always get to speak before steel is drawn. flaw:
    You raise your hand, and your voice, only in true need; needless force is a mark on you.'
- text: The Legion's Oath
  data: {id: the-legions-oath}
  note: 'edge: Any Imperial fort feeds, arms, and quarters you, and legionnaires take you at your word.
    flaw: Orders are orders, and they always find you.'
- text: The Vigilant's Vow
  data: {id: the-vigilants-vow}
  note: "edge: You always know Daedric taint when you stand near it. flaw: You strike no bargain with
    a Daedra, and you can't walk past those who do."
- text: The Pilgrim's Vow
  data: {id: the-pilgrims-vow}
  note: "edge: Any chapel or temple gives you bread, a bed, and a hearing. flaw: You give to whoever asks
    in the god's name, and the road isn't finished."
- text: Honor of the Hall
  data: {id: honor-of-the-hall}
  note: "edge: A hall you've feasted in will stand beside you in a fair fight. flaw: You refuse no challenge
    and take no low advantage: no ambush, no poison, no blow at a fallen foe."
- text: Guest-Law of the Ashlands
  data: {id: guest-law-of-the-ashlands}
  note: "edge: Once you've shared a fire, the tribe treats you as kin, and no door of theirs is shut to
    you. flaw: Whoever eats at your fire is under your protection, whatever they turn out to be."
