title: Minor arcana
description: "A minor item is a narrow edge: set-dressing vantage, a thorn it ignores, +1d in a narrow
  circumstance, a 2d pool for a spell-sized trick, or a once-per-session trick. Minors are never potent.
  Each entry's data names the arcana, and a relic's first pool (pool: {dice, track, kind, refill, note}:
  `@relic.pool.dice`). Placement is the real rule: hand out one per session at most; a named relic is
  one of a kind."
source: the-reliquary/introduction
