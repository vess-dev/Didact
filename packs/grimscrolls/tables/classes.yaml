table: destruction-backlash
title: 'Destruction: how your backlash shows'
description: 'Backlash: rolling two or more 1s when you cast (thorns included) sets it off. Choose how
  yours shows (`didact do backlash`).'
source: the-classes/destruction#the-elements
entries:
- the element turns on you (take a mark)
- it runs wild (a 2d story roll says where)
- it draws something's eye (+1 suspense)
---
table: illusion-the-twelve
title: 'Illusion: the Twelve'
description: "The Twelve illusions (Glamour): you know 5; the illusion you cast is the spell's touchstone.
  Each entry's note is the book's gloss (The Twelve, Glossed)."
source: the-classes/illusion#glamour
entries:
- {text: Calm, note: stills a temper}
- {text: Chameleon, note: blurs you into what's behind you}
- {text: Charm, note: 'makes a friend, for now'}
- {text: Command, note: gives one order that's obeyed}
- {text: Demoralize, note: sends them running}
- {text: Frenzy, note: turns them on whoever's nearest}
- {text: Invisibility, note: hides you until you act}
- {text: Light, note: burns without a wick}
- {text: Night-Eye, note: makes the dark plain}
- {text: Paralyze, note: locks a body rigid}
- {text: Rally, note: puts heart back in the wavering}
- {text: Silence, note: 'stops a voice — and with it, most magic'}
---
table: mysticism-disciplines
title: 'Mysticism: the five disciplines'
description: 'The Old Way: your touchstones are 2 disciplines of the five.'
source: the-classes/mysticism#the-old-way
entries:
- text: Detection
  note: life, death, enchantment, the thing sought. Sense who's behind the door. Know a relic for 
    what it is.
- text: Dispelling
  note: the unweaving. End a charm. Gutter a ward. Strip the glamour off a liar.
- text: Telekinesis
  note: the unseen hand. Lift the key from the guard's belt. Hurl the brazier.
- text: The Soul
  note: the animus. Trap a dying beast's soul in a gem. Feel a ghost's grief. Drink a little of 
    someone's strength.
- text: Translocation
  note: here is there. Step across a room. Trade places with a friend. Return to a place you marked.
---
table: restoration-rites
title: 'Restoration: the rites'
description: 'The Rites: choose 1 major rite (6d) and 2 minor rites (4d), each a power pool and its own
  touchstone; they refill each session.'
source: the-classes/restoration#the-rites
entries:
- text: Healing
  note: Close a wound. Ease pain and fear. Knit bone — potent, and harm clears.
- text: Warding
  note: Raise a ward against spell and breath. Bless a threshold. Turn a blow aside.
- text: Fortifying
  note: Lend strength, speed, or nerve. Steady a hand. Lay a blessing that lasts.
- text: Purging
  note: Cure a disease. Draw out poison. Break a paralysis; lift a curse.
- text: Sunfire
  note: Sear the undead. Turn them, and hold them back. Carry a light Daedra flinch from.
- text: Absorbing
  note: Drain a foe's vigor into yourself. Borrow a skill for a moment. Leech a relic's charge.
