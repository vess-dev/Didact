- {text: Elemental Shield, note: 'a mantle against fire, frost, or shock'}
- {text: Levitate, note: 'rise, hover, leap, fall slowly'}
- {text: Water Breathing & Water Walking}
- {text: Transmute, note: one substance into its near kin}
- {text: Ash Shell, note: 'encase a thing in hardened ash, harmless and helpless'}
