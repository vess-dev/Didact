# Grimscrolls, Chapter 4: the class table character creation chooses from, a level's talent
# lists, and the menus inside the Core Talents. Generated by gs_classes.py: do not edit by hand.
table: classes
title: The twenty-three classes
description: "Pick the class whose engine you want to run every session: its Core Talent is yours alone.
  Each entry's data holds the Core Talent, its growth levels, the class's seven talents and its engine
  (a well or a pool); `id` is the compendium entry, `key` the class (the Marksman's entry is `marksman-class`:
  `marksman` is the role)."
source: the-classes/introduction
entries:
- text: Armorer
  data:
    id: armorer
    key: armorer
    art: Combat
    core: armorer-tempering
    growth: [3, 6]
    grows: At levels 3 and 6, gain +1 Temper per session.
    talents:
    - armorer-steel-smithing
    - armorer-arcane-blacksmith
    - armorer-dwarven-smithing
    - armorer-orcish-smithing
    - armorer-glass-smithing
    - armorer-daedric-smithing
    - armorer-dragon-armor
    first: armorer-steel-smithing
    engine_well: temper
    engine_label: Temper
    engine_base: 5
    engine_per: session
  note: 'Combat. The one who made the gear, and says so at the perfect moment; 5 Temper a session. First
    talent to try: Steel Smithing.'
- text: Athletics
  data:
    id: athletics
    key: athletics
    art: Combat
    core: athletics-wind
    growth: [2, 4, 6]
    grows: At levels 2, 4, and 6, gain +1 Wind per session.
    talents:
    - athletics-fleet-footed
    - athletics-swift-swim
    - athletics-second-wind
    - athletics-run-down
    - athletics-beast-of-burden
    - athletics-long-road
    - athletics-stamina
    first: athletics-fleet-footed
    engine_well: wind
    engine_label: Wind
    engine_base: 6
    engine_per: session
  note: 'Combat. The one who never tires, never slows, and pushes for free; 6 Wind a session. First talent
    to try: Fleet-Footed.'
- text: Blade
  data:
    id: blade
    key: blade
    art: Combat
    core: blade-bladework
    growth: [3, 6]
    grows: At levels 3 and 6, gain +1 Edge per scene.
    talents:
    - blade-bladesman
    - blade-fighting-stance
    - blade-dual-flurry
    - blade-deep-wounds
    - blade-savage-strike
    - blade-critical-charge
    - blade-paralyzing-strike
    first: blade-bladesman
    engine_well: edge
    engine_label: Edge
    engine_base: 2
    engine_per: scene
  note: 'Combat. The one who wins the exchange, then improves on it; +1d, and 2 Edge a scene. First talent
    to try: Bladesman.'
- text: Block
  data:
    id: block
    key: block
    art: Combat
    core: block-the-guard
    growth: [3, 6]
    grows: At levels 3 and 6, gain +1 Guard per scene.
    talents:
    - block-shield-wall
    - block-deflect-arrows
    - block-elemental-protection
    - block-block-runner
    - block-power-bash
    - block-shield-charge
    - block-quick-reflexes
    first: block-shield-wall
    engine_well: guard
    engine_label: Guard
    engine_base: 3
    engine_per: scene
  note: 'Combat. The one who takes the hit meant for someone else; 3 Guard a scene. First talent to try:
    Shield Wall.'
- text: Blunt
  data:
    id: blunt
    key: blunt
    art: Combat
    core: blunt-the-heavy-hand
    growth: [2, 4, 6]
    grows: At levels 2, 4, and 6, gain +1 Might per session.
    talents:
    - blunt-barbarian
    - blunt-champions-stance
    - blunt-bone-breaker
    - blunt-limbsplitter
    - blunt-devastating-blow
    - blunt-sweep
    - blunt-warmaster
    first: blunt-sweep
    engine_well: might
    engine_label: Might
    engine_base: 3
    engine_per: session
  note: 'Combat. The one who ends fights by subtraction; 3 Might a session. First talent to try: Sweep.'
- text: Hand to Hand
  data:
    id: hand-to-hand
    key: hand-to-hand
    art: Combat
    core: hand-to-hand-the-open-hand
    growth: [3, 6]
    grows: At levels 3 and 6, gain +1 Focus per scene and +1 interrupt per session.
    talents:
    - hand-to-hand-whispering-fang
    - hand-to-hand-brawler
    - hand-to-hand-knockdown
    - hand-to-hand-rain-of-fists
    - hand-to-hand-counterblow
    - hand-to-hand-pressure-points
    - hand-to-hand-mind-over-matter
    first: hand-to-hand-brawler
    engine_well: focus
    engine_label: Focus
    engine_base: 4
    engine_per: scene
  note: 'Combat. The one who needs nothing but hands and an opening; 4 Focus a scene. First talent to
    try: Brawler.'
- text: Heavy Armor
  data:
    id: heavy-armor
    key: heavy-armor
    art: Combat
    core: heavy-armor-plate
    growth: [3, 6]
    grows: At levels 3 and 6, gain +1d Plate.
    talents:
    - heavy-armor-juggernaut
    - heavy-armor-fists-of-steel
    - heavy-armor-cushioned
    - heavy-armor-conditioning
    - heavy-armor-well-fitted
    - heavy-armor-tower-of-strength
    - heavy-armor-reflect-blows
    first: heavy-armor-tower-of-strength
    engine_label: Plate
    engine_per: session
    engine_pool: plate
    engine_dice: 4
    engine_kind: resource
  note: 'Combat. The one who wades in where nobody else can stand; a 4d pool a session. First talent to
    try: Tower of Strength.'
- text: Alchemy
  data:
    id: alchemy
    key: alchemy
    art: Magic
    core: alchemy-the-satchel
    growth: [2, 4, 6]
    grows: At levels 2, 4, and 6, learn 1 new recipe and gain +1 draught per session.
    talents:
    - alchemy-physician
    - alchemy-benefactor
    - alchemy-experimenter
    - alchemy-poisoner
    - alchemy-concentrated-poison
    - alchemy-green-thumb
    - alchemy-purity
    first: alchemy-physician
    engine_well: draughts
    engine_label: Draughts
    engine_base: 5
    engine_per: session
  note: 'Magic. The one who has a bottle for this; 4 recipes, 5 draughts a session. First talent to try:
    Physician.'
- text: Alteration
  data:
    id: alteration
    key: alteration
    art: Magic
    core: alteration-formulae
    growth: [2, 4, 6]
    grows: At levels 2, 4, and 6, gain +1 spell and +1 potent spell per session, and learn 1 new 
      formula.
    talents:
    - alteration-novice-alteration
    - alteration-mage-armor
    - alteration-magic-resistance
    - alteration-stability
    - alteration-transmute-ore
    - alteration-dual-casting
    - alteration-master-alteration
    first: alteration-mage-armor
    engine_well: spells
    engine_label: Spells
    engine_base: 4
    engine_per: session
  note: 'Magic. The one who argues with the rules of the world; 4 spells and 2 potent a session. First
    talent to try: Mage Armor.'
- text: Conjuration
  data:
    id: conjuration
    key: conjuration
    art: Magic
    core: conjuration-the-binding
    growth: [3, 6]
    grows: At levels 3 and 6, your thrall gains +1 aspect.
    talents:
    - conjuration-novice-conjuration
    - conjuration-mystic-binding
    - conjuration-oblivion-binding
    - conjuration-necromancy
    - conjuration-atromancy
    - conjuration-summoner
    - conjuration-twin-souls
    first: conjuration-mystic-binding
    engine_label: Thrall
    engine_per: binding
    engine_pool: thrall
    engine_dice: 4
    engine_kind: power
  note: 'Magic. The one who never fights alone; a thrall, as a 4d pool. First talent to try: Mystic Binding.'
- text: Destruction
  data:
    id: destruction
    key: destruction
    art: Magic
    core: destruction-the-elements
    growth: [2, 4, 6]
    grows: At levels 2, 4, and 6, learn 1 new touchstone.
    talents:
    - destruction-novice-destruction
    - destruction-impact
    - destruction-rune-master
    - destruction-intense-flames
    - destruction-deep-freeze
    - destruction-disintegrate
    - destruction-master-destruction
    first: destruction-impact
  note: 'Magic. The one who is the fire, the frost, and the storm; at will, never safe. First talent to
    try: Impact.'
- text: Illusion
  data:
    id: illusion
    key: illusion
    art: Magic
    core: illusion-glamour
    growth: [2, 4, 6]
    grows: At levels 2, 4, and 6, learn 1 new illusion.
    talents:
    - illusion-novice-illusion
    - illusion-animage
    - illusion-kindred-mage
    - illusion-quiet-casting
    - illusion-hypnotic-gaze
    - illusion-aspect-of-terror
    - illusion-master-of-the-mind
    first: illusion-quiet-casting
  note: 'Magic. The one who decides what everyone else sees and feels; 5 illusions, once each. First talent
    to try: Quiet Casting.'
- text: Mysticism
  data:
    id: mysticism
    key: mysticism
    art: Magic
    core: mysticism-the-old-way
    growth: [3, 6]
    grows: At levels 3 and 6, learn 1 new discipline, and gain 1 more potent spell per session 
      before strain sets in.
    talents:
    - mysticism-novice-mysticism
    - mysticism-detect-life
    - mysticism-soul-stealer
    - mysticism-enchanter
    - mysticism-reflect-spell
    - mysticism-mark-and-recall
    - mysticism-clairvoyance
    first: mysticism-detect-life
  note: 'Magic. The one who knows, moves, and unmakes without touching; at will, potent by strain. First
    talent to try: Detect Life.'
- text: Restoration
  data:
    id: restoration
    key: restoration
    art: Magic
    core: restoration-the-rites
    growth: [3, 6]
    grows: At levels 3 and 6, gain +1d to each rite.
    talents:
    - restoration-novice-restoration
    - restoration-regeneration
    - restoration-necromage
    - restoration-respite
    - restoration-ward-absorb
    - restoration-recovery
    - restoration-avoid-death
    first: restoration-respite
    engine_label: Rites
    engine_per: session
    engine_pool: rites
    engine_dice: 6
    engine_kind: power
  note: 'Magic. The one who keeps everyone standing; three pools: 6d, 4d, 4d. First talent to try: Respite.'
- text: Acrobatics
  data:
    id: acrobatics
    key: acrobatics
    art: Stealth
    core: acrobatics-momentum
    growth: [2, 4, 6]
    grows: At levels 2, 4, and 6, gain +1 Momentum per scene.
    talents:
    - acrobatics-water-jump
    - acrobatics-leaping-strike
    - acrobatics-daring
    - acrobatics-fancy-footwork
    - acrobatics-grand-entrance
    - acrobatics-slip-free
    - acrobatics-tumblers-trick
    first: acrobatics-water-jump
    engine_well: momentum
    engine_label: Momentum
    engine_base: 2
    engine_per: scene
  note: 'Stealth. The one who turns difficulty into advantage; 2 Momentum a scene. First talent to try:
    Water Jump.'
- text: Light Armor
  data:
    id: light-armor
    key: light-armor
    art: Stealth
    core: light-armor-evasion
    growth: [3, 6]
    grows: At levels 3 and 6, gain +1 Evasion per scene.
    talents:
    - light-armor-agile-defender
    - light-armor-custom-fit
    - light-armor-unhindered
    - light-armor-wind-walker
    - light-armor-matching-set
    - light-armor-deft-movement
    - light-armor-shrouded
    first: light-armor-agile-defender
    engine_well: evasion
    engine_label: Evasion
    engine_base: 2
    engine_per: scene
  note: 'Stealth. The one who is already somewhere else; 2 Evasion a scene. First talent to try: Agile
    Defender.'
- text: Marksman
  data:
    id: marksman-class
    key: marksman
    art: Stealth
    core: marksman-the-hunt
    growth: [3, 6]
    grows: At levels 3 and 6, name +1 quarry per session.
    talents:
    - marksman-eagle-eye
    - marksman-steady-hand
    - marksman-quick-shot
    - marksman-power-shot
    - marksman-hunters-discipline
    - marksman-ranger
    - marksman-bullseye
    first: marksman-steady-hand
    engine_well: quarries
    engine_label: Quarries
    engine_base: 1
    engine_per: session
  note: "Stealth. The one who names the target, and the whole party hits it; a quarry and the Hunter's
    die. First talent to try: Steady Hand."
- text: Mercantile
  data:
    id: mercantile
    key: mercantile
    art: Stealth
    core: mercantile-the-ledger
    growth: [2, 4, 6]
    grows: At levels 2, 4, and 6, gain +1 Favor per session.
    talents:
    - mercantile-haggling
    - mercantile-merchant
    - mercantile-investor
    - mercantile-fence
    - mercantile-master-trader
    - mercantile-golden-touch
    - mercantile-bribery
    first: mercantile-haggling
    engine_well: favors
    engine_label: Favors
    engine_base: 3
    engine_per: session
  note: 'Stealth. The one who bought one earlier, and knows a person; 3 Favors a session. First talent
    to try: Haggling.'
- text: Security
  data:
    id: security
    key: security
    art: Stealth
    core: security-picks
    growth: [3, 6]
    grows: At levels 3 and 6, gain +1d Picks.
    talents:
    - security-quick-hands
    - security-wax-key
    - security-treasure-hunter
    - security-locksmith
    - security-unbreakable
    - security-master-locks
    - security-trapwright
    first: security-wax-key
    engine_label: Picks
    engine_per: session
    engine_pool: picks
    engine_dice: 4
    engine_kind: resource
  note: 'Stealth. The one who makes locked and trapped stop mattering; a 4d pool a session. First talent
    to try: Wax Key.'
- text: Sneak
  data:
    id: sneak
    key: sneak
    art: Stealth
    core: sneak-shadow
    growth: [3, 6]
    grows: At levels 3 and 6, gain +1d Shadow.
    talents:
    - sneak-backstab
    - sneak-deadly-aim
    - sneak-assassins-blade
    - sneak-muffled-movement
    - sneak-light-foot
    - sneak-shadow-warrior
    - sneak-light-fingers
    first: sneak-backstab
    engine_label: Shadow
    engine_per: scene
    engine_pool: shadow
    engine_dice: 3
    engine_kind: resource
  note: "Stealth. The one who isn't there, until it's too late; a 3d pool a scene. First talent to try:
    Backstab."
- text: Speechcraft
  data:
    id: speechcraft
    key: speechcraft
    art: Stealth
    core: speechcraft-the-silver-tongue
    growth: [2, 4, 6]
    grows: At levels 2, 4, and 6, gain +1 Sway per session.
    talents:
    - speechcraft-allure
    - speechcraft-persuasion
    - speechcraft-intimidation
    - speechcraft-fame
    - speechcraft-sharp-tongue
    - speechcraft-rumors
    - speechcraft-oratory
    first: speechcraft-persuasion
    engine_well: sway
    engine_label: Sway
    engine_base: 3
    engine_per: session
  note: 'Stealth. The one who talks first, and usually last; 3 Sway a session. First talent to try: Persuasion.'
- text: Vampire
  data:
    id: vampire
    key: vampire
    art: Molag Bal
    core: vampire-the-blood
    growth: [3, 6]
    grows: At levels 3 and 6, gain +1d Blood.
    talents:
    - vampire-power-of-the-grave
    - vampire-detect-all-creatures
    - vampire-mist-form
    - vampire-supernatural-reflexes
    - vampire-blood-healing
    - vampire-unearthly-will
    - vampire-vampiric-grip
    first: vampire-blood-healing
    engine_label: Blood
    engine_per: feeding
    engine_pool: blood
    engine_dice: 4
    engine_kind: power
  note: 'Molag Bal. The one who outdoes the living, and pays for it at dawn; a 4d pool, refilled by feeding.
    First talent to try: Blood Healing.'
- text: Werewolf
  data:
    id: werewolf
    key: werewolf
    art: Hircine
    core: werewolf-beast-blood
    growth: [3, 6]
    grows: At levels 3 and 6, you can change once more per session.
    talents:
    - werewolf-bestial-strength
    - werewolf-totem-of-ice-brothers
    - werewolf-totem-of-the-moon
    - werewolf-totem-of-the-predator
    - werewolf-totem-of-terror
    - werewolf-animal-vigor
    - werewolf-savage-feeding
    first: werewolf-totem-of-the-moon
    engine_well: changes
    engine_label: Changes
    engine_base: 1
    engine_per: session
  note: 'Hircine. The one who has a monster to let out; the change, once a session. First talent to try:
    Totem of the Moon.'
