table: talent-lists
title: Talent lists
description: "A level's new talent comes from any class's list: every talent but the Core Talents is open
  to every hero, and the lists are neighborhoods, not walls. The curses' lists need the blood (a vampire
  or werewolf, or a hero turned in play who took the curse); The Voice is optional (ask your table). Each
  entry's data lists the talents."
source: the-classes/introduction
