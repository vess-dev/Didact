# Grimscrolls, Chapter 7: tiers and roles (grimwild-ce's table ids), and a list per section of
# the Bestiary. Generated by gs_bestiary.py: do not edit by hand.
table: combat-tiers
title: Tiers
description: "A threat's tier sets its presence (Chapter 7); talents and relics call mooks lesser foes,
  and elites and bosses greater ones. Elites and bosses framed as challenges bring 2 bonus suspense of
  their own; a pool of mooks or toughs is just a pool. Each entry's data: how a battleground lists one
  (a group as a pool, one that is a challenge of its own with a | after its pool)."
source: the-bestiary/introduction
entries:
- text: 'Mook: Mooks are fodder: one good roll clears several, and a pack is a single task pool, usually
    4d.'
  data: {id: mook, dice: 4d, foes: foes}
- text: 'Tough: Toughs fall one at a time; a knot of them is a pool too, usually 6d.'
  data: {id: tough, dice: 6d, foes: foes}
- text: 'Elite: Elites are a challenge unto themselves, usually 6d.'
  data: {id: elite, dice: 6d |, foes: foe}
- text: 'Boss: Bosses own the scene at 8d — or as a linked challenge whose parts each carry their own
    pool, traits, and moves, with a fail state that ends the fight the bad way.'
  data: {id: boss, dice: 8d |, foes: foe}
---
table: combat-roles
title: Roles
description: "Each card's role says how the threat fights, and what makes it falter (compendium: the role's
  id)."
source: the-bestiary/introduction#roles
entries:
- text: Blaster
  data: {id: blaster}
  note: Fights by raining power from range; falters when the fight gets close.
- text: Brute
  data: {id: brute}
  note: Fights by sudden, overwhelming force; falters when it's baited or taunted.
- text: Lurker
  data: {id: lurker}
  note: Fights by striking from concealment; falters when it's exposed, or the fight drags on.
- text: Marksman
  data: {id: marksman}
  note: Fights by picking targets off at a distance; falters when caught in melee or forced to move.
- text: Predator
  data: {id: predator}
  note: Fights by running its prey down; falters when the prey won't break.
- text: Protector
  data: {id: protector}
  note: Fights by shielding allies and soaking blows; falters when cut off from those it guards.
- text: Skirmisher
  data: {id: skirmisher}
  note: Fights by hit-and-run from odd angles; falters when pinned down.
- text: Swarmer
  data: {id: swarmer}
  note: Fights by numbers, from every side; falters when its numbers thin.
- text: Tactician
  data: {id: tactician}
  note: Fights by preparation and command; falters when the plan fails.
- text: Trickster
  data: {id: trickster}
  note: Fights by confusion and deceit; falters when its tricks are exposed.
