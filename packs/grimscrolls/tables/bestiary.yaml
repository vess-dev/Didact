- text: Alduin, the World-Eater
  data:
    id: alduin-the-world-eater
    tier: boss
    role: blaster
    dice: 8
    usual: true
    parts: 3
    part:
      1:
        name: Alduin
        dice: 8
        traits: nothing harms him on the wing, and nothing kills him in the mortal world
        moves: [Fire from a Burning Sky, Seize and Toss]
      2:
        name: His Risen Kin
        dice: 6
        traits: dragons Shouted back out of their burial mounds
        moves: [Raise the Mound, Send a Dragon in His Stead]
      3:
        name: The Soul-Snare
        dice: 6
        traits: a mist across Sovngarde where he hunts the honored dead
        moves: [Devour the Lost, Draw the Mist Back]
    fail:
      text: He is fed. He returns from Sovngarde greater than the old heroes found him, and there is
        no second prophecy.
