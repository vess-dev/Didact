        name: Miraak
        dice: 8
        traits: sword, staff, and a Dragonborn's Voice, on a tower in Apocrypha
        moves: [Bend Will, Take the Soul You Earned]
    fail:
      text: a timer; when it runs dry he walks out of Apocrypha, and Solstheim wakes as his.
      name: The Temple Rises
      dice: 8
- text: Dagoth Ur
  data:
    id: dagoth-ur
    tier: boss
    role: tactician
    dice: 8
    usual: true
    parts: 3
    part:
      1:
        name: Red Mountain
        dice: 6
        traits: the Ghostfence, the Blight, and seven ash vampire kin in their citadels
        moves: [Blight Storm, A Kinsman at the Door]
      2:
        name: Dagoth Ur
        dice: 8
        traits: 'a god while the Heart beats: struck down, he waits in the next chamber, amused'
        moves: [Offer You the First Blow]
      3:
        name: The Heart of Lorkhan
        dice: 6
        traits: beating under the half-built god Akulakhan, where no spell will carry you out
        moves: [Akulakhan Stirs, Dagoth Ur Follows You In]
    fail:
      text: Akulakhan walks. The Blight crosses Morrowind, then the map, and every dreamer wakes in 
        his House.
- text: Almalexia
  data:
    id: almalexia
    tier: boss
    role: trickster
    dice: 8
    usual: true
    parts: 3
    part:
      1:
        name: Her Hands
        dice: 6
        traits: six champions fortified by her touch, and the High Ordinators behind them
        moves: [Arrest the Heretic, Kneel Before the Goddess]
      2:
        name: The City's Love
        dice: 6
        traits: she makes Mournhold's perils herself, to be seen ending them
        moves: [Loose the Fabricants, Ash Over the Plaza]
      3:
        name: Almalexia
        dice: 8
        traits: a war-goddess with the blade Hopesfire and nothing left to lose but worship
        moves: [Hopesfire's Arc, Send You Where She Likes]
    fail:
      text: She is believed. You die a heretic or a martyr, whichever suits the sermon, and 
        Mournhold thanks her.
- text: Mehrunes Dagon
  data:
    id: mehrunes-dagon
    tier: boss
    role: brute
    dice: 8
    usual: true
    parts: 3
    part:
      1:
        name: The Jaws of Oblivion
        dice: 6
        traits: gates opening inside the walls, Daedra in every street
        moves: [Another Gate Opens, Cut Off the Heir]
      2:
        name: Past the Prince
        dice: 6
        traits: he cannot be hurt, only staggered for a breath by a blow that would fell a giant
        moves: [Crush the Guard Underfoot, Axe Through the Wall]
      3:
        name: The Altar
        dice: 4
        traits: the last Dragonborn heir must stand in the Temple of the One with the Amulet of 
          Kings
        moves: [(the objective)]
    fail:
      text: a timer; when it runs dry the heir is under the rubble, there is no other, and Tamriel 
        is a province of the Deadlands.
      name: The City Falls
      dice: 8
- text: Jyggalag, Prince of Order
  data:
    id: jyggalag-prince-of-order
    tier: boss
    role: tactician
    dice: 8
    usual: true
    parts: 3
    part:
      1:
        name: The Obelisks
        dice: 6
        traits: crystal spires that put out his Knights, tended by citizens who changed sides
        moves: [Knights Step Out, A Neighbor Turns Priest]
      2:
        name: The Greymarch
        dice: 6
        traits: the Fringe first, then the Wellsprings of the Saints and Seducers, then the palace
        moves: [Advance in Line, Silence a Wellspring]
      3:
        name: Jyggalag
        dice: 8
        traits: a towering crystal knight with a bone-cleaving sword, exactly as predicted
        moves: [Cleave the Guard, Reduce It to Order]
    fail: {text: 'New Sheoth falls, the Isles go gray and still, and the cycle begins again.'}
- text: Hircine's Hunt
  data:
    id: hircines-hunt
    tier: boss
    role: predator
    dice: 8
    usual: true
    parts: 3
    part:
      1:
        name: The Hounds
        dice: 6
        traits: werewolves who take you from your bed and fill the maze under the glacier
        moves: [Take the Sleeper, Statues That Wake]
      2:
        name: The Other Prey
        dice: 6
        traits: 'he takes several champions and one may leave: your allies are your rivals'
        moves: [Fight Beside You for Now, Turn When the Moon Says]
      3:
        name: The Aspect
        dice: 8
        traits: 'he meets the last one standing as a third of himself, and the prey chooses: Strength,
          Speed, or Guile'
        moves: [Bear's Weight, Wolf's Howl, Hunter's Spear]
    fail:
      text: The Hunt ends without you. He goes home content, and you are a trophy or a hound.
- text: Mannimarco, King of Worms
  data:
    id: mannimarco-king-of-worms
    tier: boss
    role: blaster
    dice: 8
    usual: true
    parts: 3
    part:
      1:
        name: The Order of the Black Worm
        dice: 6
        traits: cells in every cave and ruin, and friends on the Guild's own council
        moves: [Ambush at the Ruin, A Colleague Was His]
      2:
        name: The Enthrallment
        dice: 4
        traits: he holds you still with a word and makes you a Worm Thrall
        moves: [Hold Fast, Take the Soul]
      3:
        name: Mannimarco
        dice: 8
        traits: robes, the Staff of Worms, and no need to hurry
        moves: [Raise Your Dead, Call a Lich]
    fail:
      text: You serve. He studies your soul at leisure, and your friends meet you next on his side.
- text: Umaril the Unfeathered
  data:
    id: umaril-the-unfeathered
    tier: boss
    role: brute
    dice: 8
    usual: true
    parts: 3
    part:
      1:
        name: The Aurorans
        dice: 6
        traits: Meridia's soldiers of light, butchering priests at their altars
        moves: [Slaughter in the Chapel, Stand Up Again in Light]
      2:
        name: Umaril in the Flesh
        dice: 8
        traits: said to fell the greatest warriors at a stroke; kill him and he only goes home
        moves: [One Stroke, Lightning from the Blade]
      3:
        name: Umaril in Spirit
        dice: 6
        traits: the half that slips away to the Colored Rooms to mend
        moves: [Leave the Body Behind, Return in an Age]
    fail:
      text: He dies in body only, and is back when you are old, or when your grandchildren are.
- text: Mankar Camoran
  data:
    id: mankar-camoran
    tier: boss
    role: trickster
    dice: 8
    usual: true
    parts: 3
    part:
      1:
        name: The Savage Garden
        dice: 6
        traits: his faithful dead, promised Paradise and hunted through it by Daedra
        moves: [The Master's Voice, Daedra Loose on the Lawn]
      2:
        name: The Forbidden Grotto
        dice: 6
        traits: entered only in the Bands of the Chosen, which the wearer cannot remove
        moves: [Cage Over the Lava, The Jailer's Rounds]
      3:
        name: Mankar Camoran
        dice: 8
        traits: wearing the Amulet, with a son and daughter who rise each time they fall
        moves: [Call Up a Daedra, Silence the Spell]
    fail:
      text: 'He keeps you. Nothing stays dead in Paradise: you join the faithful in the garden, and no
        Dragonfires are ever lit.'
