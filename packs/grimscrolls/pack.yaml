# Settings are read from the world's system pack, not inherited from the parent: grimwild-ce's
# are restated here in Grimscrolls's words, with what Grimscrolls adds.
# On top of grimwild-ce's, key by key: its `factions` (the faction turn) is inherited as it is.
settings:
  combat:
    mode: popcorn
    round_one: >-
      There are no turns in Grimscrolls: the spotlight moves like a bard's attention, not a queue.
      Enemies never roll: describe the danger and ask how the heroes respond; the world hits back
      through impact moves (on messy and grim rolls, and whenever the GM spends suspense), and a
      move a hero didn't invite gets a defense roll (`didact do defense`).
  names:
    npc: hero-names
  session_zero:
    - key: era
      ask: >-
        Which Tamriel, and when? Vvardenfell under the Blight (3E 427), Cyrodiil with the gates of
        Oblivion opening (3E 433), Skyrim with dragons in the sky and a civil war on the ground
        (4E 201), or a quiet decade between them; and where the story starts.
