id: grimscrolls
name: Grimscrolls
kind: system
version: 0.1.0
description: >-
  Grimscrolls, an Elder Scrolls hack of Grimwild by way of Grimwild: Community Edition: heroes in
  Tamriel on the Grimwild engine (the highest d6, thorns that cut, diminishing pools, marks and
  harm, suspense), with Tamriel's own classes (the twenty-one skills and the two curses, each a
  Core Talent with its well or pool), races, birthsigns and standing stones, the Voice, potions
  and coin, disease and the curses, crime, shrines and the long road; the Bestiary, the
  Reliquary, the Daedric Princes and the Greywatch sandbox. Built on the grimwild-ce pack.
requires: {packs: [core, grimwild-ce]}
extends: [grimwild-ce]
# What grimwild-ce has that Grimscrolls drops: its paths, talents, backgrounds, monsters, arcana
# and every table (Grimscrolls has its own, under the parent's ids where the procedure is the
# same); Grimwild's rules text and glossary (the ten chapters are this pack's reference); the
# sorcerer's twist, the vigor pool, the narrative-break reset, the random potion, the flavors'
# scene-end riders, and the options with no place here (Grimscrolls' coin, potions and wild
# magic dials have their own ids). Kept from the parent: the story oracle, story rolls,
# quarrels, spark, bonds and arcs, suspense, sessions starting warm, pools (refresh, grow,
# tick), exploration tokens, the end of a story, the faction turn, the party's reset suspense,
# and their triggers. The suspense moves and supplies are this pack's (they loop over the
# party). What this pack replaces by id is never hidden.
hides:
  type: [path]
  table: ["*"]
  entry: ["*"]
  generator: [potion]
  action: [reset, vigor]
  procedure: [twist]
  trigger: [scene-end-noblebright, scene-end-sword-and-sorcery]
  option: [magic, wealth, vigor-pool, lasting-marks, random-vex, random-bonds, expanded-downtime]
  reference: ["*"]
  term: ["*"]
license:
  spdx: LicenseRef-Grimscrolls
  redistributable: true
  attribution: >-
    CREDITS & LICENSE. Grimscrolls is an unofficial, non-commercial fan work, adapted from
    Grimwild by J. D. Maxwell (Oddity Press), used under the Creative Commons Attribution 4.0
    International license (CC BY 4.0 — creativecommons.org/licenses/by/4.0), by way of Grimwild:
    Community Edition (lead developer Chancey Scott, Groov Games). The Elder Scrolls and its
    settings, creatures, and trademarks belong to Bethesda Softworks and ZeniMax Media; setting
    details were checked against the Unofficial Elder Scrolls Pages (uesp.net). Grimscrolls is not
    endorsed by or affiliated with Bethesda Softworks, ZeniMax Media, Oddity Press, the Community
    Edition team, or UESP. Play it at your table, change it, pass it on — just don't sell it.
