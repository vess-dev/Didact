# The Core Engine (Chapter 2) against grimwild-ce's rules: the four rolls, the impact move,
# backlash, damage and being dropped, spark and thread, the session's rhythm and experience.
# Each rule here replaces grimwild-ce's of the same id; the ones Grimscrolls reads the same are
# the parent's, untouched (story-roll, end-story, take-spark, pre-session, suspense,
# suspense-move, quarrel, change-bond, resolve-arc, refresh, grow-pool, tick, tokens,
# reset-suspense, the faction turn, and their triggers).
#
# What Grimscrolls changes in a roll: one die of each kind (talents, setup, a relic, a draught:
# "talent dice don't stack"), special dice on top (the Hunter's die), Momentum (thorns removed
# come back as Momentum dice), 5s as 6s (Critical Charge, Daring, Master Destruction), the
# thorns a lingering exposure mark, starving and strain add, a werewolf's stats, and backlash
# (Destruction's, or anyone's with wild magic) in place of the sorcerer's twist (hidden).
check: action
title: Action roll
help: >-
  Roll d6s equal to the stat and read the highest: 6 perfect, 4-5 messy (you get it, and the GM
  makes an impact move), 1-3 grim (you don't, and an impact move), grim cut by a thorn a disaster
  (you take spark). Two or more 6s are a critical, which thorns can't cut. +1d per spark spent;
  +1d from talents, +1d from a setup, +1d from a relic, +1d from a draught (one die of each kind,
  however many apply); special dice add on top (the Hunter's die, a sign's own die: `dice`);
  assists roll 1d each, apart. Thorns (d8s) cut a step on each 7-8: the situation's, plus a mark
  on the stat (it then clears), a lingering exposure mark, bloodied or rattled on a related stat,
  desperate, starving, and strain on spellcasting. `momentum` removes thorns (all of them: they
  come back as Momentum dice, each 7-8 raising the result a step); `reckless`: 5s count as 6s,
  but 4s count as 1s. `spell` and `backlash`: two or more 1s (thorns included) go wrong.
params:
  who: ref
  stat: {enum: [brawn, agility, wits, presence]}
  thorns: {kind: int, default: 0, help: "The situation's thorns (vantage: reasonable 0-1, doubtful 2+)"}
  spark: {kind: int, default: 0, help: "Spark to spend: +1d each"}
  talent: {kind: flag, default: false, help: "+1d from talents (however many apply, Core Talents included: talent dice don't stack)"}
  setup: {kind: flag, default: false, help: "+1d from a setup (one, however many)"}
  relic: {kind: flag, default: false, help: "+1d from a relic (one, however many)"}
  draught: {kind: flag, default: false, help: "+1d from a draught (skooma, a Fortify: one, however many)"}
  dice: {kind: int, default: 0, help: "Special dice that add on top (a sign's own die)"}
  assist: {kind: int, default: 0, help: "Helpers, 1d each, rolled apart; they share the risk"}
  hunter: {kind: flag, default: false, help: "The Hunter's die (The Hunt): you or an ally researching, tracking or attacking the quarry; on a 6, add a critical effect"}
  momentum: {kind: int, default: 0, help: "Momentum spent on the move (Acrobatics) to remove that many thorns"}
  reckless: {kind: flag, default: false, help: "5s count as 6s, but 4s count as 1s (Critical Charge, Daring, Master Destruction)"}
  spell: {kind: flag, default: false, help: "Spellcasting: strain's thorns apply, and with wild magic (an option) two or more 1s go wrong"}
  backlash: {kind: flag, default: false, help: "A Destruction spell of The Elements: two or more 1s, thorns included, set off backlash"}
  stakes: {enum: [low, regular, high, dire], optional: true, help: "The scene's stakes: regular unless declared"}
  interrupt: {kind: flag, default: false, help: "A talent's roll to stop an impact move"}
before:
  - if: "@spark > @who.spark"
    then:
      - stop: "{@who.name} has {@who.spark} spark to spend, not {@spark}."
  - if: "@momentum > default(@who.momentum, 0)"
    then:
      - stop: "{@who.name} has {default(@who.momentum, 0)} Momentum to spend, not {@momentum}."
  - let:
      marked: "if('$stat' in @who.marks, 1, 0)"
      lingering: "if('$stat' in @who.lingering, 1, 0)"
      wolf: "default(@who.changed, false)"
      starving: "if('starving' in @who.conditions, 1, 0)"
      strain: "if(@spell, default(@who.strain, 0), 0)"
      kinds: "if(@talent, 1, 0) + if(@setup, 1, 0) + if(@relic, 1, 0) + if(@draught, 1, 0)"
      stakes_now: "if('$stakes' <> '', '$stakes', 'regular')"
  - let:
      hurt: >-
        if(@wolf, 0, if('desperate' in @who.harm, 1, 0)
        + if('bloodied' in @who.harm and ('$stat' == 'brawn' or '$stat' == 'agility'), 1, 0)
        + if('rattled' in @who.harm and ('$stat' == 'wits' or '$stat' == 'presence'), 1, 0))
      stat_dice: >-
        if(@wolf, if('$stat' == 'brawn' or '$stat' == 'agility', 3,
        if('werewolf-totem-of-the-moon' in @who.talents, min(2, @who.$stat), 1)), @who.$stat)
  - let: {all_thorns: "@thorns + @marked + @lingering + @hurt + @starving + @strain"}
  - let: {removed: "min(@momentum, @all_thorns - @strain)"}
  - let:
      left: "@all_thorns - @removed"
      comeback: "if(@removed > 0 and @removed == @all_thorns, @removed, 0)"
  - if: "@wolf"
    then:
      - message: "As the wolf: Brawn and Agility count as 3, Wits and Presence as {if('werewolf-totem-of-the-moon' in @who.talents, 2, 1)} (or less), and {@who.name} ignores thorns from their own harm."
  - if: "@marked > 0"
    then:
      - set: who.marks
        op: "-="
        value: $stat
      - message: "The mark on $stat adds a thorn and clears: marking $stat again as this roll's consequence is harm."
  - if: "@lingering > 0"
    then:
      - message: "The lingering exposure mark on $stat adds a thorn (it stays until {@who.name} is properly warm, fed, or clear of it)."
  - if: "@strain > 0"
    then:
      - message: "Strain: +{@strain}t on {@who.name}'s spellcasting (nothing ignores it)."
  - if: "@removed > 0"
    then:
      - set: who.momentum
        op: "-="
        value: "@removed"
      - message: "{@who.name} spends {@removed} Momentum: {@removed} thorn{if(@removed > 1, 's', '')} removed{if(@comeback > 0, ', every one of them: they come back as Momentum dice', '')}."
  - if: "@spark > 0"
    then:
      - set: who.spark
        op: "-="
        value: "@spark"
  - roll: "(@stat_dice + @spark + @kinds + @dice)d6"
    as: roll
  - if: "@hunter"
    then:
      - roll: 1d6
        as: hunt
  - if: "@assist > 0"
    then:
      - roll: "(@assist)d6"
        as: help
  - if: "@left > 0"
    then:
      - roll: "(@left)d8"
        as: thorn
  - if: "@comeback > 0"
    then:
      - roll: "(@comeback)d8"
        as: mo
  - let:
      own6: "count(@roll.dice, 6) + if(@hunter, count(@hunt.dice, 6), 0)"
      own5: "count(@roll.dice, 5) + if(@hunter, count(@hunt.dice, 5), 0)"
      own4: "count(@roll.dice, 4) + if(@hunter, count(@hunt.dice, 4), 0)"
      own_high: "max(max(@roll.dice), if(@hunter, max(@hunt.dice), 0))"
      help_high: "if(@assist > 0, max(@help.dice), 0)"
      help6: "if(@assist > 0, count(@help.dice, 6), 0)"
      cuts: "if(@left > 0, count(@thorn.dice, 7) + count(@thorn.dice, 8), 0)"
      raises: "if(@comeback > 0, count(@mo.dice, 7) + count(@mo.dice, 8), 0)"
      ones: >-
        count(@roll.dice, 1) + if(@hunter, count(@hunt.dice, 1), 0)
        + if(@assist > 0, count(@help.dice, 1), 0) + if(@left > 0, count(@thorn.dice, 1), 0)
  - let:
      own_level: "if(@reckless, if(@own6 + @own5 > 0, 3, 1), if(@own_high == 6, 3, if(@own_high >= 4, 2, 1)))"
      help_level: "if(@help_high == 6, 3, if(@help_high >= 4, 2, if(@help_high > 0, 1, 0)))"
      sixes: "if(@reckless, @own6 + @own5, @own6) + @help6"
      all_ones: "@ones + if(@reckless, @own4, 0)"
  - let: {level: "min(3, max(@own_level, @help_level) - @cuts + @raises)"}
  - message: "highest {max(@own_high, @help_high)}{if(@reckless, ' (5s count as 6s, 4s as 1s)', '')} · sixes {@sixes} · thorns {@left}, cutting {@cuts}"
  - if: "@comeback > 0"
    then:
      - message: "Momentum dice: {@raises} of them land 7-8, each raising the result a step."
  - if: "@hunter and count(@hunt.dice, 6) > 0"
    then:
      - message: "The Hunter's die lands a 6: add a critical effect (greater effect, a secondary effect, or a setup)."
  - if: "@cuts > 0 and 'acrobatics-momentum' in @who.talents"
    then:
      - set: who.momentum
        value: "{default(@who.momentum, 0) + 1}/{max(default(@who.momentum.max, 0), default(@who.momentum, 0) + 1)}"
      - message: "Momentum: a thorn cut the roll, and {@who.name} gains 1 Momentum, even past the limit."
  - if: "@cuts > 0 and 'athletics-stamina' in @who.talents"
    then:
      - do: take-spark
        with: {who: "@who", why: "Stamina: a roll cut by a thorn"}
        go_on: true
  - if: "@all_ones >= 2 and @backlash and 'destruction-the-elements' in @who.talents"
    then:
      - do: backlash
        with: {who: "@who", kind: destruction}
    else:
      - if: "@all_ones >= 2 and (@spell or @backlash) and @option.wild_magic"
        then:
          - do: backlash
            with: {who: "@who", kind: wild}
bands:
  critical: "@sixes >= 2"
  perfect: "@level >= 3"
  messy: "@level == 2"
  grim: "@level == 1"
  disaster: else
on:
  critical:
    - if: "@interrupt"
      then: ["Critical: the impact move is stopped. Thorns can't cut a critical."]
    - message: "Critical: success (thorns can't cut it), and pick a bonus: greater effect (drop 1d from the related task pool before rolling it), a secondary effect (the effects of a related perfect, too), or a setup (a benefit to a follow-up roll, usually an assist without risk). If nothing fits, take spark: `didact do take-spark who={@who.id}`."
  perfect:
    - if: "@interrupt"
      then: ["Perfect: the impact move is stopped."]
      else: ["Perfect: you get it, clean."]
  messy:
    - if: "@interrupt"
      then:
        - message: "Messy: the impact move stops, and the GM banks the suspense instead (Didact adds it)."
        - do: suspense
          with: {take: 1, why: "an interrupt's messy"}
      else:
        - message: "Messy: you get it, and the GM makes an impact move (a full success and a full problem)."
        - do: impact
          with: {who: "@who", stakes: "@stakes_now", result: messy}
  grim:
    - if: "@interrupt"
      then: ["Grim: the move lands anyway, and {@who.name} shares the risk."]
      else: ["Grim: you don't get it, and the GM makes an impact move. (If a grim would grind the story to a halt, the GM can give it in a way that makes things worse or goes sideways.)"]
    - do: impact
      with: {who: "@who", stakes: "@stakes_now", result: grim}
  disaster:
    - set: who.spark
      value: "min(2, @who.spark + 1)"
    - if: "@interrupt"
      then: ["Disaster: the move lands, worse, and {@who.name} shares it. {@who.name} takes spark as consolation."]
      else: ["Disaster: the worst case. {@who.name} takes spark as consolation."]
    - do: impact
      with: {who: "@who", stakes: "@stakes_now", result: disaster}
source: "the-core-engine/rolls; the-core-engine/working-together; the-classes/introduction#wells-and-dice; the-classes/acrobatics; the-classes/marksman; the-classes/destruction; options-and-dials/tone-dials#wild-magic"
---
check: defense
title: Defense roll
help: >-
  When trouble comes at you that your own roll didn't invite (the GM spends suspense, a pressure
  plate sinks), the GM picks the stat that fits the danger and your likely reaction, and you roll
  it. Perfect: you're clear. Messy: the GM lessens it (a lessened mark is set dressing). Grim: you
  take it all. Disaster: worse, and you take spark. Criticals can't be cut. No defense roll
  against the consequences of your own action roll. `protect`: throw yourself in front of an ally
  about to eat their own roll's consequences, a 1d defense roll (2d with the Lover Stone). `brace`:
  spend 1 Guard to ignore every thorn, even from your own harm. Agile Defender ignores the
  situation's thorns on an Agility defense roll.
params:
  who: ref
  stat: {enum: [brawn, agility, wits, presence]}
  thorns: {kind: int, default: 0}
  spark: {kind: int, default: 0}
  talent: {kind: flag, default: false, help: "+1d from talents (Shield Wall, Counterblow…): one, however many"}
  setup: {kind: flag, default: false}
  relic: {kind: flag, default: false}
  draught: {kind: flag, default: false}
  dice: {kind: int, default: 0, help: "Special dice that add on top"}
  assist: {kind: int, default: 0, help: "Helpers, 1d each, rolled apart; they share the risk (the Lover Stone: 2d)"}
  momentum: {kind: int, default: 0, help: "Momentum spent (a dodge on the move) to remove that many thorns"}
  protect: {kind: flag, default: false, help: "Protecting an ally from their own roll's consequences: 1d instead of the stat (2d with the Lover Stone)"}
  brace: {kind: flag, default: false, help: "Block (The Guard): spend 1 Guard to ignore every thorn on this roll, even thorns from your own harm"}
  stakes: {enum: [low, regular, high, dire], optional: true}
before:
  - if: "@spark > @who.spark"
    then:
      - stop: "{@who.name} has {@who.spark} spark to spend, not {@spark}."
  - if: "@momentum > default(@who.momentum, 0)"
    then:
      - stop: "{@who.name} has {default(@who.momentum, 0)} Momentum to spend, not {@momentum}."
  - if: "@brace and default(@who.guard, 0) < 1"
    then:
      - stop: "{@who.name} has no Guard left this scene to brace."
  - let:
      marked: "if('$stat' in @who.marks, 1, 0)"
      lingering: "if('$stat' in @who.lingering, 1, 0)"
      wolf: "default(@who.changed, false)"
      starving: "if('starving' in @who.conditions, 1, 0)"
      kinds: "if(@talent, 1, 0) + if(@setup, 1, 0) + if(@relic, 1, 0) + if(@draught, 1, 0)"
      stakes_now: "if('$stakes' <> '', '$stakes', 'regular')"
      agile: "'$stat' == 'agility' and 'light-armor-agile-defender' in @who.talents"
      lover: "'the-lover-stone' in @who.talents"
  - let:
      hurt: >-
        if(@wolf, 0, if('desperate' in @who.harm, 1, 0)
        + if('bloodied' in @who.harm and ('$stat' == 'brawn' or '$stat' == 'agility'), 1, 0)
        + if('rattled' in @who.harm and ('$stat' == 'wits' or '$stat' == 'presence'), 1, 0))
      stat_dice: >-
        if(@protect, if(@lover, 2, 1), if(@wolf, if('$stat' == 'brawn' or '$stat' == 'agility', 3,
        if('werewolf-totem-of-the-moon' in @who.talents, min(2, @who.$stat), 1)), @who.$stat))
  - let: {all_thorns: "if(@brace, 0, if(@agile, 0, @thorns) + @marked + @lingering + @hurt + @starving)"}
  - let: {removed: "min(@momentum, @all_thorns)"}
  - let:
      left: "@all_thorns - @removed"
      comeback: "if(@removed > 0 and @removed == @all_thorns, @removed, 0)"
  - if: "@agile and @thorns > 0 and not @brace"
    then:
      - message: "Agile Defender: {@who.name} ignores the situation's thorns on this Agility defense roll (not those from their own damage)."
  - if: "@brace"
    then:
      - set: who.guard
        op: "-="
        value: 1
      - message: "Brace: {@who.name} spends 1 Guard and ignores every thorn on this roll, even from their own harm."
  - if: "@marked > 0"
    then:
      - set: who.marks
        op: "-="
        value: $stat
  - if: "@removed > 0"
    then:
      - set: who.momentum
        op: "-="
        value: "@removed"
  - if: "@spark > 0"
    then:
      - set: who.spark
        op: "-="
        value: "@spark"
  - roll: "(@stat_dice + @spark + @kinds + @dice)d6"
    as: roll
  - if: "@assist > 0"
    then:
      - roll: "(@assist)d6"
        as: help
  - if: "@left > 0"
    then:
      - roll: "(@left)d8"
        as: thorn
  - if: "@comeback > 0"
    then:
      - roll: "(@comeback)d8"
        as: mo
  - let:
      highest: "if(@assist > 0, max(max(@roll.dice), max(@help.dice)), max(@roll.dice))"
      sixes: "count(@roll.dice, 6) + if(@assist > 0, count(@help.dice, 6), 0)"
      cuts: "if(@left > 0, count(@thorn.dice, 7) + count(@thorn.dice, 8), 0)"
      raises: "if(@comeback > 0, count(@mo.dice, 7) + count(@mo.dice, 8), 0)"
  - let: {level: "min(3, if(@highest == 6, 3, if(@highest >= 4, 2, 1)) - @cuts + @raises)"}
  - message: "highest {@highest} · sixes {@sixes} · thorns {@left}, cutting {@cuts}"
  - if: "@comeback > 0"
    then:
      - message: "Momentum dice: {@raises} of them land 7-8, each raising the result a step."
  - if: "@cuts > 0 and 'acrobatics-momentum' in @who.talents"
    then:
      - set: who.momentum
        value: "{default(@who.momentum, 0) + 1}/{max(default(@who.momentum.max, 0), default(@who.momentum, 0) + 1)}"
      - message: "Momentum: a thorn cut the roll, and {@who.name} gains 1 Momentum, even past the limit."
  - if: "@cuts > 0 and 'athletics-stamina' in @who.talents"
    then:
      - do: take-spark
        with: {who: "@who", why: "Stamina: a roll cut by a thorn"}
        go_on: true
bands:
  critical: "@sixes >= 2"
  perfect: "@level >= 3"
  messy: "@level == 2"
  grim: "@level == 1"
  disaster: else
on:
  critical:
    - if: "@protect"
      then: ["Critical: {@who.name} and the ally both avoid it (thorns can't cut a critical); pick a critical bonus, or take spark."]
      else: ["Critical: {@who.name} is clear (thorns can't cut a critical), and picks a critical bonus: greater effect, a secondary effect or a setup; or takes spark (`didact do take-spark who={@who.id}`)."]
  perfect:
    - if: "@protect"
      then: ["Perfect: {@who.name} and the ally both avoid it."]
      else: ["Perfect: {@who.name} is clear."]
  messy:
    - if: "@protect"
      then: ["Messy: the GM lightens it for both, or hits only {@who.name}."]
      else: ["Messy: the GM lessens it (one step lighter: harm becomes a mark, and a lessened mark is set dressing)."]
    - if: "'heavy-armor-plate' in @who.talents"
      then: ["Plate: in heavy armor, a messy defense roll against a physical attack costs {@who.name} nothing: the lessened blow just glances off (still a messy for anything that triggers on a perfect)."]
    - if: "default(@who.evasion, 0) > 0"
      then: ["Evasion: Sidestep raises a defense against something a body could dodge one step (`didact do spend who={@who.id} well=evasion`)."]
    - do: impact
      with: {who: "@who", stakes: "@stakes_now", result: reduced}
  grim:
    - if: "@protect"
      then: ["Grim: you both take it."]
      else: ["Grim: {@who.name} takes it all."]
    - if: "default(@who.evasion, 0) > 0"
      then: ["Evasion: Sidestep raises a defense against something a body could dodge one step (`didact do spend who={@who.id} well=evasion`)."]
    - do: impact
      with: {who: "@who", stakes: "@stakes_now", result: full}
  disaster:
    - set: who.spark
      value: "min(2, @who.spark + 1)"
    - message: "Disaster: worse, and {@who.name} takes spark."
    - do: impact
      with: {who: "@who", stakes: "@stakes_now", result: worse}
source: "the-core-engine/rolls#defense-rolls; the-core-engine/working-together; the-classes/block; the-classes/light-armor; the-classes/heavy-armor; blood-stars-and-stones/stones-the-standing-stones"
---
procedure: impact
title: The impact move
help: >-
  What a prompted impact move weighs at the scene's stakes: low, a mark at most (tavern brawls
  and bruised pride); regular, one harm; high, moves land double, and a disaster can drop you on
  the spot; dire, any impact move drops you (everyone hears it before the dice fly). The GM can
  skip a prompted impact move and take suspense. Playing solo (an option): on a messy, an impact
  move only in a challenge, in a quest's last task pool, or holding 3+ suspense (else take
  suspense); on a disaster or at dire stakes, the usual consequences and the quest's peril pool too.
params:
  who: ref
  stakes: {enum: [low, regular, high, dire], default: regular}
  oracle: {kind: ref, optional: true, help: "The story oracle's state, for the GM's suspense (supplied)"}
  result: {enum: [messy, grim, disaster, reduced, full, worse], default: grim, help: "What prompted it: an action roll's messy, grim or disaster; or what a defense roll lets through: reduced (messy), full (grim), worse (disaster)"}
steps:
  - if: "@option.solo and '$result' == 'messy'"
    then:
      - if: "default(@oracle.suspense, 0) >= 3"
        then:
          - message: "Solo, on a messy: you hold {@oracle.suspense} suspense, 3 or more: make an impact move."
        else:
          - prompt: "Solo, on a messy (you hold {default(@oracle.suspense, 0)} suspense): are you in a challenge, or in a quest's last task pool? If yes, make an impact move; if not, take suspense instead (`didact do suspense take=1`)."
  - if: "'$stakes' == 'low'"
    then:
      - message: "Low stakes: the impact move weighs a mark at most."
  - if: "'$stakes' == 'regular'"
    then:
      - message: "Regular stakes: the impact move weighs one harm."
  - if: "'$stakes' == 'high'"
    then:
      - message: "High stakes: the impact move lands double."
      - if: "'$result' == 'disaster' or '$result' == 'worse'"
        then:
          - prompt: "High stakes: a disaster can drop {@who.name} on the spot (`didact do dropped who={@who.id}`)."
  - if: "'$stakes' == 'dire' and '$result' <> 'reduced'"
    then:
      - prompt: "Dire stakes: any impact move drops {@who.name} (`didact do dropped who={@who.id}`), unless the GM skips it for suspense."
  - if: "'$stakes' == 'dire' and '$result' == 'reduced'"
    then:
      - message: "Dire stakes: the GM lessens what would have dropped {@who.name}."
  - if: "'$result' == 'disaster' or '$result' == 'worse'"
    then:
      - message: "Make it the worst case."
  - if: "@option.solo and ('$result' == 'disaster' or '$result' == 'worse' or ('$stakes' == 'dire' and '$result' <> 'reduced'))"
    then:
      - prompt: "Solo, {if('$result' == 'disaster' or '$result' == 'worse', 'on a disaster', 'at dire stakes')}: take the usual consequences, and roll your quest's peril pool too (`didact track roll <peril>`)."
  - if: "'$result' == 'grim' or '$result' == 'disaster' or ('$result' == 'messy' and not @option.solo)"
    then:
      - message: "The GM can skip a prompted impact move and take suspense instead (`didact do suspense take=1`); a messy with no natural on-screen bite is a good time to bank it."
source: "the-core-engine/stakes; running-tamriel/the-gms-half-of-the-engine; running-tamriel/running-solo-and-duet"
---
procedure: backlash
title: Backlash
help: >-
  Destruction's backlash (The Elements): rolling two or more 1s when you cast (thorns included)
  sets it off, and it shows as you chose: the element turns on you (take a mark), it runs wild (a
  2d story roll says where; the backlash crucible offers what it looks like), or it draws
  something's eye (+1 suspense). With wild magic (an option) any spellcasting roll with two or
  more 1s goes wrong: a 1d story roll for the collateral, a dark omen (the GM takes suspense), or
  a roll of a 6d Corruption pool (at 0d, a trait, desire, bond, or look turns for the worse).
params:
  who: ref
  kind: {enum: [destruction, wild], default: destruction, help: "Destruction's backlash, or wild magic's (an option)"}
  how: {enum: [collateral, omen, corruption], optional: true, help: "Wild magic: how it goes wrong"}
steps:
  - if: "'$kind' == 'destruction'"
    then:
      - message: "Backlash (The Elements): two or more 1s, thorns included."
      - if: "'turns on you' in default(@who.backlash, '')"
        then:
          - prompt: "The element turns on {@who.name}: take a mark (`didact do mark who={@who.id} stat=…`)."
      - if: "'runs wild' in default(@who.backlash, '')"
        then:
          - check: story-roll
            with: {dice: 2, question: "Where does it run wild?"}
            as: wild
          - table: destruction-backlash-crucible
            as: looks
          - prompt: "It runs wild: the 2d story roll says where; the backlash crucible offers: {@looks}."
      - if: "'eye' in default(@who.backlash, '')"
        then:
          - message: "It draws something's eye: the GM takes 1 suspense."
          - do: suspense
            with: {take: 1, why: "backlash draws something's eye"}
      - if: "default(@who.backlash, '') == ''"
        then:
          - prompt: "Backlash shows as {@who.name}'s does (set it on the sheet: `didact set {@who.id} backlash='…'`): the element turns on you (take a mark), it runs wild (a 2d story roll says where: `didact do story-roll dice=2`), or it draws something's eye (+1 suspense: `didact do suspense take=1`)."
    else:
      - message: "Wild magic (an option): a spellcasting roll with two or more 1s, thorns included, goes wrong."
      - if: "'$how' == 'collateral'"
        then:
          - check: story-roll
            with: {dice: 1, question: "How bad is the collateral?"}
            as: collateral
      - if: "'$how' == 'omen'"
        then:
          - message: "A dark omen: the GM takes suspense."
          - do: suspense
            with: {take: 1, why: "wild magic: a dark omen"}
      - if: "'$how' == 'corruption'"
        then:
          - entity:
              type: track
              name: "{@who.name}'s Corruption"
              fields: {kind: pool, pool: pressure, value: {value: 6, max: 6}, note: "a trait, desire, bond, or look turns for the worse"}
              links: [{rel: of, to: "@who"}]
            as: corruption
          - if: "@corruption.value <= 0"
            then: ["{@corruption.name} ran out already: what turned for the worse has turned."]
            else:
              - pool: "@corruption"
                as: tainted
              - message: "{@corruption.name}: {@tainted.left}d left."
              - if: "@tainted.empty"
                then:
                  - prompt: "At 0d, one of {@who.name}'s traits, desires, bonds or looks turns for the worse: the player says which, and how it shows."
      - if: "'$how' == ''"
        then:
          - prompt: "Pick how it goes wrong: a 1d story roll for the collateral, a dark omen (the GM takes suspense), or a roll of a 6d Corruption pool: `didact do backlash who={@who.id} kind=wild how=collateral|omen|corruption`."
source: "the-classes/destruction#the-elements; options-and-dials/tone-dials#wild-magic"
---
check: montage
title: Montage roll
help: >-
  To cross a stretch of time or country in one breath, everyone makes a 2d action roll and the
  table keeps the highest result: roll once for each hero taking part. Spark and one die of each
  kind add (talents, setup, a relic, a draught); the GM's thorns, desperate, starving, and a mark,
  lingering mark, bloodied or rattled on the `stat` the effort leans on add thorns (a used mark
  clears). Long Road rolls 3d on a journey (`journey`). Narrate the journey together, and slow
  down wherever it gets interesting.
params:
  who: ref
  stat: {enum: [brawn, agility, wits, presence], optional: true, help: "What the effort leans on (for a mark, lingering mark, bloodied or rattled)"}
  thorns: {kind: int, default: 0}
  spark: {kind: int, default: 0}
  talent: {kind: flag, default: false}
  setup: {kind: flag, default: false}
  relic: {kind: flag, default: false}
  draught: {kind: flag, default: false}
  dice: {kind: int, default: 0, help: "Special dice on top (a 3d montage from Ranger or Master Trader: dice=1)"}
  journey: {kind: flag, default: false, help: "A journey's montage roll (Long Road: 3d)"}
before:
  - if: "@spark > @who.spark"
    then:
      - stop: "{@who.name} has {@who.spark} spark to spend, not {@spark}."
  - let:
      marked: "if('$stat' <> '' and '$stat' in @who.marks, 1, 0)"
      lingering: "if('$stat' <> '' and '$stat' in @who.lingering, 1, 0)"
      starving: "if('starving' in @who.conditions, 1, 0)"
      kinds: "if(@talent, 1, 0) + if(@setup, 1, 0) + if(@relic, 1, 0) + if(@draught, 1, 0)"
      base: "if(@journey and 'athletics-long-road' in @who.talents, 3, 2)"
      hurt: >-
        if('desperate' in @who.harm, 1, 0)
        + if('bloodied' in @who.harm and ('$stat' == 'brawn' or '$stat' == 'agility'), 1, 0)
        + if('rattled' in @who.harm and ('$stat' == 'wits' or '$stat' == 'presence'), 1, 0)
  - let: {total_thorns: "@thorns + @marked + @lingering + @hurt + @starving"}
  - if: "@marked > 0"
    then:
      - set: who.marks
        op: "-="
        value: $stat
  - if: "@spark > 0"
    then:
      - set: who.spark
        op: "-="
        value: "@spark"
  - if: "@base == 3"
    then:
      - message: "Long Road: {@who.name} rolls 3d on a journey's montage roll."
  - roll: "(@base + @spark + @kinds + @dice)d6"
    as: roll
  - if: "@total_thorns > 0"
    then:
      - roll: "(@total_thorns)d8"
        as: thorn
  - let:
      highest: "max(@roll.dice)"
      sixes: "count(@roll.dice, 6)"
      cuts: "if(@total_thorns > 0, count(@thorn.dice, 7) + count(@thorn.dice, 8), 0)"
  - let: {level: "if(@highest == 6, 3, if(@highest >= 4, 2, 1)) - @cuts"}
  - message: "{@who.name}: highest {@highest} · thorns {@total_thorns}, cutting {@cuts}"
bands:
  critical: "@sixes >= 2"
  perfect: "@level >= 3"
  messy: "@level == 2"
  grim: "@level == 1"
  disaster: else
on:
  disaster:
    - set: who.spark
      value: "min(2, @who.spark + 1)"
    - message: "Disaster for {@who.name}, who takes spark."
prompt: "Roll for each hero taking part; the table keeps the highest result. Narrate the journey together, and slow down wherever it gets interesting."
source: "the-core-engine/rolls#montage-rolls; the-classes/athletics; surviving-tamriel/the-long-road"
---
check: pool-action
title: A power pool as an action roll
help: >-
  A power pool rolled in place of a stat (a thrall, a rite, Blood, Coin, a relic's charge): take
  the highest die as your result, then drop the 1-3s. Spark, assists and talent dice rolled
  alongside stay separate: they never drop and never join the pool. If a use isn't risky, it
  simply succeeds, but you still roll the pool. `drop` drops dice first (a potent rite, a huge
  ask of Coin). Thorns, criticals, a disaster's spark and impact moves as any action roll; a
  `stat` the action leans on brings its mark, lingering mark, bloodied or rattled; desperate and
  starving always count. A vampire can't roll Blood at all under the open sun.
params:
  who: ref
  pool: {kind: ref, to: track, help: "The power pool (a tracker)"}
  stat: {enum: [brawn, agility, wits, presence], optional: true, help: "What the action leans on (for a mark, lingering mark, bloodied or rattled)"}
  thorns: {kind: int, default: 0}
  spark: {kind: int, default: 0, help: "Spark to spend: +1d each, rolled along"}
  talent: {kind: flag, default: false, help: "+1d from talents, rolled along"}
  setup: {kind: flag, default: false}
  relic: {kind: flag, default: false}
  draught: {kind: flag, default: false}
  dice: {kind: int, default: 0, help: "Special dice, rolled along"}
  assist: {kind: int, default: 0, help: "Helpers, 1d each, rolled apart; they share the risk"}
  drop: {kind: int, default: 0, help: "Dice dropped from the pool before rolling (a potent rite, a huge ask)"}
  spell: {kind: flag, default: false, help: "Spellcasting (a rite): strain's thorns apply, and with wild magic two or more 1s go wrong"}
  stakes: {enum: [low, regular, high, dire], optional: true}
before:
  - if: "@spark > @who.spark"
    then:
      - stop: "{@who.name} has {@who.spark} spark to spend, not {@spark}."
  - if: "@pool.value <= 0"
    then:
      - stop: "{@pool.name} is empty: it can't be rolled until it comes back."
  - if: "@drop >= @pool.value"
    then:
      - stop: "{@pool.name} has {@pool.value}d: dropping {@drop} first would leave nothing to roll."
  - let:
      marked: "if('$stat' <> '' and '$stat' in @who.marks, 1, 0)"
      lingering: "if('$stat' <> '' and '$stat' in @who.lingering, 1, 0)"
      starving: "if('starving' in @who.conditions, 1, 0)"
      strain: "if(@spell, default(@who.strain, 0), 0)"
      extra: "@spark + @dice + if(@talent, 1, 0) + if(@setup, 1, 0) + if(@relic, 1, 0) + if(@draught, 1, 0)"
      stakes_now: "if('$stakes' <> '', '$stakes', 'regular')"
      hurt: >-
        if('desperate' in @who.harm, 1, 0)
        + if('bloodied' in @who.harm and ('$stat' == 'brawn' or '$stat' == 'agility'), 1, 0)
        + if('rattled' in @who.harm and ('$stat' == 'wits' or '$stat' == 'presence'), 1, 0)
  - let: {total_thorns: "@thorns + @marked + @lingering + @hurt + @starving + @strain"}
  - if: "@marked > 0"
    then:
      - set: who.marks
        op: "-="
        value: $stat
  - if: "@spark > 0"
    then:
      - set: who.spark
        op: "-="
        value: "@spark"
  - pool: "@pool"
    drop: "@drop"
    as: rolled
  - if: "@extra > 0"
    then:
      - roll: "(@extra)d6"
        as: along
  - if: "@assist > 0"
    then:
      - roll: "(@assist)d6"
        as: help
  - if: "@total_thorns > 0"
    then:
      - roll: "(@total_thorns)d8"
        as: thorn
  - let:
      highest: "max(@rolled.highest, if(@extra > 0, max(@along.dice), 0), if(@assist > 0, max(@help.dice), 0))"
      sixes: "count(@rolled.faces, 6) + if(@extra > 0, count(@along.dice, 6), 0) + if(@assist > 0, count(@help.dice, 6), 0)"
      cuts: "if(@total_thorns > 0, count(@thorn.dice, 7) + count(@thorn.dice, 8), 0)"
      ones: "count(@rolled.faces, 1) + if(@extra > 0, count(@along.dice, 1), 0) + if(@assist > 0, count(@help.dice, 1), 0) + if(@total_thorns > 0, count(@thorn.dice, 1), 0)"
  - let: {level: "if(@highest == 6, 3, if(@highest >= 4, 2, 1)) - @cuts"}
  - message: "highest {@highest} · sixes {@sixes} · thorns {@total_thorns}, cutting {@cuts} · {@pool.name} drops {@rolled.dropped}d, {@rolled.left}d left"
  - if: "@cuts > 0 and 'athletics-stamina' in @who.talents"
    then:
      - do: take-spark
        with: {who: "@who", why: "Stamina: a roll cut by a thorn"}
        go_on: true
  - if: "@spell and @ones >= 2 and @option.wild_magic"
    then:
      - do: backlash
        with: {who: "@who", kind: wild}
bands:
  critical: "@sixes >= 2"
  perfect: "@level >= 3"
  messy: "@level == 2"
  grim: "@level == 1"
  disaster: else
on:
  critical: ["Critical: success (thorns can't cut it), and pick a bonus: greater effect, a secondary effect, or a setup; or take spark."]
  perfect: ["Perfect: you get it, clean."]
  messy:
    - message: "Messy: you get it, and the GM makes an impact move."
    - do: impact
      with: {who: "@who", stakes: "@stakes_now", result: messy}
  grim:
    - message: "Grim: you don't get it, and the GM makes an impact move."
    - do: impact
      with: {who: "@who", stakes: "@stakes_now", result: grim}
  disaster:
    - set: who.spark
      value: "min(2, @who.spark + 1)"
    - message: "Disaster: the worst case. {@who.name} takes spark as consolation."
    - do: impact
      with: {who: "@who", stakes: "@stakes_now", result: disaster}
source: "the-core-engine/pools; the-classes/conjuration; the-classes/restoration; the-classes/vampire; surviving-tamriel/coin-and-barter"
---
action: mark
title: Take a mark
help: >-
  Light damage to a stat: +1t on your next roll with it, then it clears. Marking an
  already-marked stat (or one with a lingering exposure mark) inflicts harm instead: bloodied
  for Brawn or Agility, rattled for Wits or Presence. Pushing yourself costs a mark. A side
  character never takes marks: anything that would mark them, a push included, is harm instead.
params:
  who: ref
  stat: {enum: [brawn, agility, wits, presence]}
steps:
  - if: "@who.side or '$stat' in @who.marks or '$stat' in @who.lingering"
    then:
      - if: "@who.side"
        then: ["{@who.name} is a side character: no marks, harm instead."]
        else: ["{@who.name}'s $stat is already marked: that's harm instead."]
      - do: harm
        with: {who: "@who", kind: "if('$stat' == 'brawn' or '$stat' == 'agility', 'bloodied', 'rattled')"}
    else:
      - set: who.marks
        op: "+="
        value: $stat
      - message: "{@who.name} takes a mark on $stat: +1t on the next $stat roll, then it clears."
source: "the-core-engine/damage-and-recovery; running-tamriel/running-solo-and-duet#side-characters"
---
action: harm
title: Take harm
help: >-
  The serious ladder: bloodied (pressing physical damage, or stacked marks to Brawn or Agility:
  +1t on physical rolls), rattled (mental: +1t on mental rolls). A second bloodied, or a second
  rattled, makes you desperate (+1t on everything). Once you're desperate, a bloodied or rattled
  you already carry drops you (one you don't carry yet just fills its box). Deadlier lethality: a
  desperate hero also carries an urgent condition (4d Bleeding Out).
params:
  who: ref
  kind: {enum: [bloodied, rattled]}
steps:
  - if: "'dropped' in @who.harm"
    then:
      - stop: "{@who.name} is already dropped."
  - if: "not ('$kind' in @who.harm)"
    then:
      - set: who.harm
        op: "+="
        value: $kind
      - message: "{@who.name} is $kind: +1t on {if('$kind' == 'bloodied', 'physical', 'mental')} rolls until it's treated."
    else:
      - if: "'desperate' in @who.harm"
        then:
          - set: who.harm
            op: "+="
            value: dropped
          - message: "{@who.name} is already $kind and desperate: dropped, out of the scene."
          - prompt: "Make a story roll for it (usually 2d): `didact do dropped who={@who.id}`."
        else:
          - set: who.harm
            op: "+="
            value: desperate
          - message: "{@who.name} is $kind again: desperate, +1t on everything. Running on fumes: a harm already carried drops them."
          - if: "@option.lethality == 'deadlier'"
            then:
              - message: "Deadlier lethality: a desperate hero also carries an urgent condition, 4d Bleeding Out (→ dropped)."
              - do: bleeding-out
                with: {who: "@who"}
source: "the-core-engine/damage-and-recovery; options-and-dials/tone-dials#lethality"
---
action: bleeding-out
title: Bleeding Out
help: >-
  An urgent condition, a timer to worse: 4d Bleeding Out → dropped (deadlier lethality's for a
  desperate hero; a dropped roll's messy can cost it too). Made at once, on the sheet and as its
  timer, rolled as time passes or whenever the GM says it ticks; treatment ends it
  (`didact do cure who=… condition='4d Bleeding Out'`, and its timer goes).
params:
  who: ref
steps:
  - entity:
      type: track
      name: "{@who.name}: Bleeding Out"
      fields: {kind: pool, pool: timer, value: {value: 4, max: 4}, note: dropped}
      links: [{rel: of, to: "@who"}]
    as: bleeding
  - if: "not ('4d Bleeding Out' in @who.conditions)"
    then:
      - set: who.conditions
        op: "+="
        value: "'4d Bleeding Out'"
      - do: refresh
        with: {pool: "@bleeding"}
  - message: "{@who.name} carries 4d Bleeding Out ({@bleeding.id}): at 0d, dropped. Roll it as time passes (`didact track roll {@bleeding.id}`); treatment ends it."
source: "the-core-engine/damage-and-recovery#harm; options-and-dials/tone-dials#lethality"
---
check: dropped
title: Dropped
help: >-
  Harm that would make you desperate a second time takes you out of the scene. Make a story roll
  (usually 2d; softer lethality 3d, deadlier 1d): perfect, you're just out until the scene ends;
  messy, it costs you (a condition: 4d Bleeding Out, a broken arm, a disease); grim, it's dire, a
  permanent condition or the end of your story (`didact do end-story`). +1d per spark spent;
  Stamina: +1d, and on a perfect you aren't dropped at all (on one knee, desperate, getting up);
  softer potions: a draught poured into a dropped ally adds +1d (`draught`). A hero in retirement
  dropped again dies. Long-term and permanent changes, death included, are always the player's to
  call. Avoid Death is `didact do avoid-death`.
params:
  who: ref
  dice: {kind: int, default: 0, help: "The story roll's dice (left out: 2, or as the lethality dial has it)"}
  spark: {kind: int, default: 0, help: "Spark to spend: +1d each"}
  draught: {kind: flag, default: false, help: "Softer potions: an ally pours a draught into you, +1d"}
before:
  - if: "@spark > @who.spark"
    then:
      - stop: "{@who.name} has {@who.spark} spark to spend, not {@spark}."
  - if: "@draught and @option.potions <> 'softer'"
    then:
      - stop: "A draught poured into a dropped ally adds +1d only with softer potions (the potions dial: `didact campaign profile potions=softer`)."
  - if: "not ('dropped' in @who.harm)"
    then:
      - set: who.harm
        op: "+="
        value: dropped
  - let:
      stamina: "'athletics-stamina' in @who.talents"
  - let:
      story: >-
        if(@dice > 0, @dice, if(@option.lethality == 'softer', 3, if(@option.lethality == 'deadlier', 1, 2)))
        + if(@stamina, 1, 0) + @spark + if(@draught, 1, 0)
  - if: "@spark > 0"
    then:
      - set: who.spark
        op: "-="
        value: "@spark"
  - if: "@stamina and not @who.retiring"
    then: ["Stamina: +1d on the story roll."]
  - if: "not @who.retiring"
    then:
      - roll: "(@story)d6"
        as: roll
bands:
  perished: "@who.retiring"
  perfect: "max(@roll.dice) == 6"
  messy: "max(@roll.dice) >= 4"
  grim: else
on:
  perished: ["{@who.name} was in retirement, and is dropped again first: they die. Work with the GM on a fitting end."]
  perfect:
    - if: "@stamina"
      then:
        - set: who.harm
          op: "-="
          value: dropped
        - if: "not ('desperate' in @who.harm)"
          then:
            - set: who.harm
              op: "+="
              value: desperate
        - message: "Stamina: on a perfect {@who.name} isn't dropped at all: on one knee, desperate, and getting up."
      else: ["Perfect: {@who.name} is just out until the scene ends."]
  messy: ["Messy: it costs {@who.name}: a condition (4d Bleeding Out: `didact do bleeding-out who={@who.id}`; a broken arm; a disease: `didact do disease`)."]
  grim:
    - message: "Grim: it's dire: a permanent condition, or the end of {@who.name}'s story. The player decides."
    - prompt: "If it's the end: `didact do end-story who={@who.id} end=sacrifice|retirement|another`."
    - if: "@option.lethality == 'deadlier'"
      then: ["Deadlier: no coming back."]
    - if: "@option.lethality == 'softer'"
      then: ["Softer: permanent conditions are rare."]
source: "the-core-engine/damage-and-recovery; the-classes/athletics; options-and-dials/tone-dials#lethality; options-and-dials/gear-and-survival#potions"
---
action: avoid-death
title: Avoid Death
help: >-
  Restoration's Avoid Death: once per session, when you would be dropped, you aren't: the light
  catches you. You're on your feet, desperate, with every mark cleared, and everyone saw.
params:
  who: ref
steps:
  - if: "not ('restoration-avoid-death' in @who.talents)"
    then:
      - stop: "{@who.name} doesn't have Avoid Death (a Restoration talent)."
  - if: "'dropped' in @who.harm"
    then:
      - set: who.harm
        op: "-="
        value: dropped
  - if: "not ('desperate' in @who.harm)"
    then:
      - set: who.harm
        op: "+="
        value: desperate
  - set: who.marks
    value: []
  - message: "Avoid Death: the light catches {@who.name}. On their feet, desperate, every mark cleared, and everyone saw. (Once per session.)"
source: "the-classes/restoration#avoid-death"
---
action: experience
title: Experience
help: >-
  After each session, each hero takes 1 XP (Didact does it when the session ends); the GM adds a
  bonus XP for a standout one, about one session in four (`bonus`, or `why=standout`); focused
  growth's bonus XP when the session hits the party concept dead-on (`why=theme`). Level up when
  your XP boxes equal the next level, then clear them (level 4 to 5: 5 boxes; for a slower road,
  each box slashed before it is filled: twice the XP). Cap is level 7 (3 at the smaller scale).
  Milestone levels have no XP; side characters don't earn any.
params:
  who: ref
  bonus: {kind: flag, default: false, help: "The GM's bonus XP for a standout session"}
  why: {enum: [session, standout, theme], default: session}
steps:
  - if: "@who.side"
    then:
      - stop: "{@who.name} is a side character: side characters don't earn XP."
  - if: "@option.milestone_levels"
    then:
      - stop: "Milestone levels (an option): no XP; the company levels when a group arc resolves meaningfully (`didact char advance {@who.id}`)."
  - let: {reason: "if(@bonus, 'standout', '$why')"}
  - if: "@reason == 'theme' and not @option.focused_growth"
    then:
      - stop: "A themed bonus XP comes with focused growth (an option); the GM's bonus for a standout session is why=standout."
  - let:
      cap: "if(@option.scale == 'smaller', 3, 7)"
      boxes: "if(@who.level == 0, 1, @who.level + 1)"
  - let: {need: "@boxes * if(@option.slow_progression or @option.focused_growth, 2, 1)"}
  - set: who.xp
    op: "+="
    value: 1
  - if: "@reason == 'standout'"
    then: ["{@who.name} takes a bonus XP for a standout session."]
  - if: "@reason == 'theme'"
    then: ["Focused growth: the session hit the party concept dead-on, and {@who.name} takes a bonus XP."]
  - if: "@who.level >= @cap"
    then: ["{@who.name} is at the highest level this game allows ({@cap}){if(@cap == 3, ': swap talents at story milestones instead (`didact do switch-talent`)', '')}."]
    else:
      - if: "@who.xp >= @need"
        then:
          - message: "{@who.name} has {@who.xp} XP: level {@who.level + 1} is ready (`didact char advance {@who.id}`)."
        else: ["{@who.name}: {@who.xp} of {@need} XP to the next level."]
source: "the-core-engine/experience; options-and-dials/pacing-and-growth; options-and-dials/tone-dials#scale"
---
trigger: session-experience
title: Experience after the session
help: "After each session, each hero takes 1 XP (the Core Engine: Experience); focused growth asks after a bonus. Side characters don't."
on: session_end
for: pcs
when: "not @option.milestone_levels and not @who.side"
params:
  who: ref
steps:
  - do: experience
    with: {who: "@who"}
    go_on: true
  - if: "@option.focused_growth"
    then:
      - prompt: "Focused growth: did this session hit the party concept dead-on for {@who.name}? A bonus XP: `didact do experience who={@who.id} why=theme`."
source: "the-core-engine/experience; options-and-dials/pacing-and-growth#focused-growth"
---
procedure: renew
title: Spark and thread come back
help: >-
  Before each session (or with rest resets, at each rest), a hero takes spark and resets thread:
  2, +1 with each talent that gives a thread per session (Kindred Mage, Ranger, Master Trader,
  Rumors). Side characters have neither.
params:
  who: ref
steps:
  - if: "not @who.side"
    then:
      - let:
          thread_now: >-
            2 + if('illusion-kindred-mage' in @who.talents, 1, 0) + if('marksman-ranger' in @who.talents, 1, 0)
            + if('mercantile-master-trader' in @who.talents, 1, 0) + if('speechcraft-rumors' in @who.talents, 1, 0)
      - set: who.spark
        value: "min(2, @who.spark + 1)"
      - set: who.thread
        value: "@thread_now"
      - message: "{@who.name}: spark {@who.spark}, thread {@thread_now}."
source: "the-core-engine/experience#sessions-start-warm; the-core-engine/thread-and-tangles; the-classes/illusion; the-classes/marksman; the-classes/mercantile; the-classes/speechcraft"
---
procedure: talent-resets
title: Per-session wells and pools refill
help: >-
  When a new session starts (with rest resets, at a real rest; in downtime too), per-session
  wells and pools refill: the Core Talents' wells (Temper, Wind, Might, Draughts, Spells, Potent
  spells, Quarries, Favors, Sway, Changes, potent spells before strain), the class pools
  (Plate, Picks, the rites), the Armor pool and the talents' own pools on the sheet, and the
  relics' pools (a prompt); strain clears, spent
  illusions come back, the session's quarries are let go, and a vampire's first sip is arranged
  again.
params:
  who: ref
steps:
  - message: "{@who.name}'s per-session talents refresh."
  - if: "default(@who.temper.max, 0) > 0"
    then:
      - set: who.temper
        value: "@who.temper.max"
  - if: "default(@who.wind.max, 0) > 0"
    then:
      - set: who.wind
        value: "@who.wind.max"
  - if: "default(@who.might.max, 0) > 0"
    then:
      - set: who.might
        value: "@who.might.max"
  - if: "default(@who.draughts.max, 0) > 0"
    then:
      - set: who.draughts
        value: "@who.draughts.max"
      - message: "The Satchel: last session's draughts went flat; {@who.draughts.max} fresh ones."
  - if: "default(@who.spells.max, 0) > 0"
    then:
      - set: who.spells
        value: "@who.spells.max"
  - if: "default(@who.potent.max, 0) > 0"
    then:
      - set: who.potent
        value: "@who.potent.max"
  - if: "default(@who.unstrained.max, 0) > 0"
    then:
      - set: who.unstrained
        value: "@who.unstrained.max"
  - if: "default(@who.quarries.max, 0) > 0"
    then:
      - set: who.quarries
        value: "@who.quarries.max"
  - if: "default(@who.favors.max, 0) > 0"
    then:
      - set: who.favors
        value: "@who.favors.max"
  - if: "default(@who.sway.max, 0) > 0"
    then:
      - set: who.sway
        value: "@who.sway.max"
  - if: "default(@who.changes.max, 0) > 0"
    then:
      - set: who.changes
        value: "@who.changes.max"
  - if: "default(@who.strain, 0) > 0"
    then:
      - set: who.strain
        value: 0
      - message: "Strain clears."
  - if: "count(@who.spent) > 0"
    then:
      - set: who.spent
        value: []
      - message: "Spent illusions come back."
  - if: "count(@who.quarry) > 0"
    then:
      - set: who.quarry
        value: []
      - message: "Last session's quarry is let go: name this session's (`didact do quarry who={@who.id} target='…'`)."
  - if: "default(@who.fed, false)"
    then:
      - set: who.fed
        value: false
  - if: "default(@who.moon_change, false)"
    then:
      - set: who.moon_change
        value: false
  - if: "default(@who.plate, '') <> ''"
    then:
      - do: refresh
        with: {pool: "@who.plate"}
  - if: "default(@who.picks, '') <> ''"
    then:
      - do: refresh
        with: {pool: "@who.picks"}
  - if: "default(@who.rite_1, '') <> ''"
    then:
      - do: refresh
        with: {pool: "@who.rite_1"}
  - if: "default(@who.rite_2, '') <> ''"
    then:
      - do: refresh
        with: {pool: "@who.rite_2"}
  - if: "default(@who.rite_3, '') <> ''"
    then:
      - do: refresh
        with: {pool: "@who.rite_3"}
  - if: "'armorer-steel-smithing' in @who.talents"
    then:
      - prompt: "Steel Smithing: name one piece of {@who.name}'s work that each ally carries, and one of their own: once this session, its bearer takes +1d on a roll with it."
  - if: "default(@who.armor_pool, '') <> ''"
    then:
      - do: refresh
        with: {pool: "@who.armor_pool"}
  - if: "default(@who.juggernaut, '') <> '' and 'heavy-armor-juggernaut' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.juggernaut"}
  - if: "default(@who.poisons, '') <> '' and 'alchemy-poisoner' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.poisons"}
  - if: "default(@who.flesh, '') <> '' and 'alteration-mage-armor' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.flesh"}
  - if: "default(@who.resistance, '') <> '' and 'alteration-magic-resistance' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.resistance"}
  - if: "default(@who.unbinding, '') <> '' and 'conjuration-oblivion-binding' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.unbinding"}
  - if: "default(@who.reflection, '') <> '' and 'mysticism-reflect-spell' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.reflection"}
  - if: "default(@who.ward, '') <> '' and 'restoration-ward-absorb' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.ward"}
  - if: "default(@who.leathers, '') <> '' and 'light-armor-unhindered' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.leathers"}
  - if: "default(@who.disguise, '') <> '' and 'light-armor-shrouded' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.disguise"}
  - if: "default(@who.credit, '') <> '' and 'mercantile-investor' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.credit"}
  - if: "default(@who.will, '') <> '' and 'vampire-unearthly-will' in @who.talents"
    then:
      - do: refresh
        with: {pool: "@who.will"}
  - prompt: "Refresh {@who.name}'s relics' pools that come back each session ({if(@option.soul_fed == 'softer', 'every relic refreshes: soul gems are just treasure', 'a soul-fed relic only with a filled soul gem')}): `didact do refresh pool=<track>` for each (`didact track list`)."
source: "the-classes/introduction#wells-and-dice; the-core-engine/experience#sessions-start-warm; the-classes/armorer; the-classes/alchemy; the-classes/alteration; the-classes/mysticism; the-classes/illusion; the-classes/marksman; the-classes/vampire; options-and-dials/gear-and-survival#soul-fed-or-not"
---
trigger: scene-wells
title: Per-scene wells and pools refill
help: "Per-scene wells and pools refill with every scene (the Core Talents: Edge, Guard, Focus, Momentum, Evasion; Sneak's Shadow pool)."
on: scene_start
for: pcs
when: >-
  default(@who.edge.max, 0) > 0 or default(@who.guard.max, 0) > 0 or default(@who.focus.max, 0) > 0
  or default(@who.momentum.max, 0) > 0 or default(@who.evasion.max, 0) > 0 or default(@who.shadow, '') <> ''
params:
  who: ref
steps:
  - if: "default(@who.edge.max, 0) > 0"
    then:
      - set: who.edge
        value: "@who.edge.max"
  - if: "default(@who.guard.max, 0) > 0"
    then:
      - set: who.guard
        value: "@who.guard.max"
  - if: "default(@who.focus.max, 0) > 0"
    then:
      - set: who.focus
        value: "@who.focus.max"
  - if: "default(@who.evasion.max, 0) > 0"
    then:
      - set: who.evasion
        value: "@who.evasion.max"
  - if: "'acrobatics-momentum' in @who.talents"
    then:
      - let: {limit: "2 + if(@who.level >= 2, 1, 0) + if(@who.level >= 4, 1, 0) + if(@who.level >= 6, 1, 0)"}
      - set: who.momentum
        value: "{@limit}/{@limit}"
  - if: "default(@who.shadow, '') <> ''"
    then:
      - do: refresh
        with: {pool: "@who.shadow"}
  - message: "{@who.name}'s per-scene wells refill."
source: "the-classes/introduction#wells-and-dice; the-classes/blade; the-classes/block; the-classes/hand-to-hand; the-classes/acrobatics; the-classes/light-armor; the-classes/sneak"
---
action: rest
title: Rest
help: >-
  Any real rest (a night's camp, a quiet week on the road) clears all marks and harm; conditions
  clear when the fiction says so. A night somewhere safe (an inn, a guild hall, a warded camp:
  `safe`) also refills potions, and gets a hero properly warm, fed and clear of exposure (its
  lingering marks clear); with softer potions any real rest refills them. With rest resets (an
  option), per-session talents reset on a real rest instead of each session: everyone takes
  spark, per-session talents and thread reset, some conditions fade, and the GM takes 2 suspense
  (once for the group's rest).
params:
  who: ref
  safe: {kind: flag, default: false, help: "A night somewhere safe: potions refill, and lingering exposure marks clear"}
steps:
  - set: who.marks
    value: []
  - set: who.harm
    value: []
  - message: "{@who.name} rests: marks and harm are cleared. Conditions clear when the fiction says so (a shrine, a cure, time, or a task pool)."
  - if: "@safe and count(@who.lingering) > 0"
    then:
      - set: who.lingering
        value: []
      - message: "Somewhere safe, properly warm and fed: {@who.name}'s lingering exposure marks clear."
  - if: "(@safe or @option.potions == 'softer') and default(@who.potions, '') <> ''"
    then:
      - do: refresh
        with: {pool: "@who.potions"}
      - message: "{if(@safe, 'A night somewhere safe', 'Softer potions: any real rest')} refills {@who.name}'s potions."
  - if: "@option.rest_resets"
    then:
      - do: renew
        with: {who: "@who"}
      - do: talent-resets
        with: {who: "@who"}
      - message: "Rest resets (an option): {@who.name} takes spark, and per-session talents and thread reset. Some conditions fade."
      - do: reset-suspense
source: "the-core-engine/damage-and-recovery#healing; surviving-tamriel/potions; surviving-tamriel/cold-ash-and-hard-country; options-and-dials/pacing-and-growth#rest-resets; options-and-dials/gear-and-survival#potions-on-by-default"
---
action: push
title: Push yourself
help: >-
  Push yourself always costs: after the talent resolves (and any roll it calls for), mark a stat
  of your choice. When a task pool roll drops nothing, push yourself to drop 1d anyway
  (`pool=`), or pivot to a secondary effect. Wind's Dig deep pays with Wind instead of a mark
  (`pay=wind`); some gifts make a push free (`pay=free`: Adrenaline Rush, Kynareth's blessing, a
  Stamina draught: say which with `why=`). A side character's push is harm.
params:
  who: ref
  stat: {enum: [brawn, agility, wits, presence], optional: true, help: "The stat to mark (your choice)"}
  pool: {kind: ref, to: track, optional: true, help: "A task pool that dropped nothing: it drops 1d anyway"}
  pay: {enum: [mark, wind, free], default: mark}
  why: {kind: text, optional: true, help: "What pays for it, when it's free"}
steps:
  - if: "'$pay' == 'mark' and '$stat' == ''"
    then:
      - stop: "Name the stat to mark: `stat=brawn|agility|wits|presence` (or `pay=wind` with Wind, `pay=free`)."
  - if: "'$pay' == 'wind' and default(@who.wind, 0) < 1"
    then:
      - stop: "{@who.name} has no Wind left to dig deep with."
  - if: "default(@pool, '') <> ''"
    then:
      - if: "@pool.value <= 0"
        then:
          - stop: "{@pool.name} is already empty."
      - pool: "@pool"
        mode: drop
        as: pushed
      - message: "{@who.name} pushes: {@pool.name} drops 1d ({@pushed.left}d left)."
  - if: "'$pay' == 'mark'"
    then:
      - do: mark
        with: {who: "@who", stat: $stat}
  - if: "'$pay' == 'wind'"
    then:
      - set: who.wind
        op: "-="
        value: 1
      - message: "Dig deep: {@who.name} pays for the push with Wind ({@who.wind} left)."
  - if: "'$pay' == 'free'"
    then:
      - message: "{@who.name} pushes without marking a stat."
      - if: "default(@why, '') <> ''"
        then: ["It's free: {@why}."]
source: "unbound/how-to-read-this; the-core-engine/pools#push-or-pivot; the-classes/athletics; blood-stars-and-stones/blood-the-ten-races#redguard; surviving-tamriel/shrines-and-blessings; surviving-tamriel/potions#other-draughts"
