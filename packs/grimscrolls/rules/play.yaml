# grimwild-ce's play rules that Grimscrolls changes (the same ids replace them): switching a
# talent, downtime and its actions (Surviving Tamriel: Downtime), armor for everyone and active
# vigilance (Options & Dials), carousing (a downtime action here), and vex (Chapter 2: you
# pick the response; grimwild-ce's random vex and its flavors' riders have no place here).
# grimwild-ce's vigor pool is hidden: every hero carries potions (rules/survival.yaml).
action: switch-talent
title: Switch a talent
help: >-
  Swap a talent for another: at story milestones once a hero is at the smaller scale's level cap,
  after retraining one in downtime with a master who charges for it (Pursue a goal), or to take a
  curse's talent at once by trading away the last talent you gained (a hero turned in play). A
  Core Talent is its class's alone; the curses' lists need the blood; racial and birthsign talents
  sit outside your levels, and a standing stone's blessing goes with another stone
  (`didact do take-stone`).
params:
  who: ref
  drop: {kind: text, help: "The talent given up (its id)"}
  take: {kind: text, help: "The new talent (its id)"}
  why: {kind: text, optional: true}
steps:
  - if: "not (@drop in @who.talents)"
    then:
      - stop: "{@who.name} has no talent {@drop} (talents: {@who.talents})."
  - if: "@take in @who.talents"
    then:
      - stop: "{@who.name} already has {@take}."
  - set: who.talents
    op: "-="
    value: $drop
  - set: who.talents
    op: "+="
    value: $take
  - message: "{@who.name} switches {@drop} for {@take}."
  - message: "A Core Talent is its class's alone, the curses' talents need the blood, and racial and birthsign talents aren't swapped: if {@take} is one of those, put {@drop} back (`didact undo`)."
  - do: talent-pool-gone
    with: {who: "@who", talent: $drop}
  - do: talent-pool
    with: {who: "@who", talent: $take}
  - if: "default(@why, '') <> ''"
    then: ["Why: {@why}."]
source: "the-classes/introduction; surviving-tamriel/downtime; surviving-tamriel/the-two-curses; options-and-dials/tone-dials#scale"
---
procedure: talent-pool
title: The pool a talent brings
help: >-
  A talent with a pool of its own, made at once and the sheet pointed at it, so the session's
  reset refreshes it: Juggernaut's 2d Armor, Poisoner's 4d Poisons, Mage Armor's 2d Flesh,
  Magic Resistance's 2d Resistance, Oblivion Binding's 2d Unbinding, Reflect Spell's 2d
  Reflection, Ward Absorb's 2d Ward, Unhindered's 2d Leathers, Shrouded's 2d Disguise, Investor's
  3d Credit, Unearthly Will's 2d Will, Animal Vigor's 2d Hide; the curses' talents bring The Blood
  (3d) and the Bloodlust timer (3d). The same pools character creation and leveling up make
  (chargen/pc.yaml).
params:
  who: ref
  talent: {kind: text}
steps:
  - if: "@talent == 'heavy-armor-juggernaut'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Armor"
          fields: {kind: pool, pool: resource, value: {value: 2, max: 2}, note: "Juggernaut: in heavy armor, when physical harm would land on you, roll it and the blow glances off (a second pool beside Plate); each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.juggernaut
        value: "@made"
      - message: "{@who.name}'s 2d Armor ({@made.id}): the sheet points at it."
  - if: "@talent == 'alchemy-poisoner'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Poisons"
          fields: {kind: pool, pool: resource, value: {value: 4, max: 4}, note: "Poisoner: roll it for a dose (paralysis, frenzy, fear, silence, weakness, a loosened tongue); each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.poisons
        value: "@made"
      - message: "{@who.name}'s 4d Poisons ({@made.id}): the sheet points at it."
  - if: "@talent == 'alteration-mage-armor'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Flesh"
          fields: {kind: pool, pool: resource, value: {value: 2, max: 2}, note: "Mage Armor: wearing no armor, when physical harm would land on you, roll it; each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.flesh
        value: "@made"
      - message: "{@who.name}'s 2d Flesh ({@made.id}): the sheet points at it."
  - if: "@talent == 'alteration-magic-resistance'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Resistance"
          fields: {kind: pool, pool: resource, value: {value: 2, max: 2}, note: "Magic Resistance: when you would suffer from magic, roll it to shrug the effect off; when it empties, your next action is potent; each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.resistance
        value: "@made"
      - message: "{@who.name}'s 2d Resistance ({@made.id}): the sheet points at it."
  - if: "@talent == 'conjuration-oblivion-binding'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Unbinding"
          fields: {kind: pool, pool: power, value: {value: 2, max: 2}, note: "Oblivion Binding: roll it to interrupt anything a summoned Daedra, a raised corpse or a restless spirit is doing; each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.unbinding
        value: "@made"
      - message: "{@who.name}'s 2d Unbinding ({@made.id}): the sheet points at it."
  - if: "@talent == 'mysticism-reflect-spell'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Reflection"
          fields: {kind: pool, pool: power, value: {value: 2, max: 2}, note: "Reflect Spell: roll it to interrupt hostile magic as it's cast; on a perfect, turn it back; each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.reflection
        value: "@made"
      - message: "{@who.name}'s 2d Reflection ({@made.id}): the sheet points at it."
  - if: "@talent == 'restoration-ward-absorb'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Ward"
          fields: {kind: pool, pool: resource, value: {value: 2, max: 2}, note: "Ward Absorb: when a spell, a breath or a shout would strike you, roll it to stop the magic at the ward; each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.ward
        value: "@made"
      - message: "{@who.name}'s 2d Ward ({@made.id}): the sheet points at it."
  - if: "@talent == 'light-armor-unhindered'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Leathers"
          fields: {kind: pool, pool: resource, value: {value: 2, max: 2}, note: "Unhindered: in light armor, when physical harm would land on you, roll it; each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.leathers
        value: "@made"
      - message: "{@who.name}'s 2d Leathers ({@made.id}): the sheet points at it."
  - if: "@talent == 'light-armor-shrouded'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Disguise"
          fields: {kind: pool, pool: resource, value: {value: 2, max: 2}, note: "Shrouded: roll it to pass at a glance for someone you're not; each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.disguise
        value: "@made"
      - message: "{@who.name}'s 2d Disguise ({@made.id}): the sheet points at it."
  - if: "@talent == 'mercantile-investor'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Credit"
          fields: {kind: pool, pool: resource, value: {value: 3, max: 3}, note: "Investor: roll it to call in what the trade owes you; at 0d you've overdrawn; each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.credit
        value: "@made"
      - message: "{@who.name}'s 3d Credit ({@made.id}): the sheet points at it."
  - if: "@talent == 'vampire-unearthly-will'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Will"
          fields: {kind: pool, pool: resource, value: {value: 2, max: 2}, note: "Unearthly Will: when you'd be rattled, vexed or gripped by magic of the mind, roll it and you aren't; each session."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.will
        value: "@made"
      - message: "{@who.name}'s 2d Will ({@made.id}): the sheet points at it."
  - if: "@talent == 'werewolf-animal-vigor'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Hide"
          fields: {kind: pool, pool: resource, value: {value: 2, max: 2}, note: "Animal Vigor: roll it when physical harm would land on the wolf (not silver); fresh each time you change."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.hide
        value: "@made"
      - message: "{@who.name}'s 2d Hide ({@made.id}): the sheet points at it."
  - if: "@talent == 'vampire-sanguinare-vampiris'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Blood"
          fields: {kind: pool, pool: power, value: {value: 3, max: 3}, note: "Sanguinare Vampiris: The Blood at 3d, never grows; it comes back only by feeding (`didact do feed`)."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.blood
        value: "@made"
      - message: "{@who.name}'s 3d Blood ({@made.id}): the sheet points at it."
  - if: "@talent == 'werewolf-lycanthropy'"
    then:
      - entity:
          type: track
          name: "{@who.name}'s Bloodlust"
          fields: {kind: pool, pool: timer, value: {value: 3, max: 3}, note: "Lycanthropy: the Bloodlust timer starts at 3d, and you never gain more changes per session (`didact do change`)."}
          links: [{rel: of, to: "@who"}]
        as: made
      - set: who.bloodlust
        value: "@made"
      - set: who.changes
        value: "1/1"
      - message: "{@who.name}'s 3d Bloodlust ({@made.id}): the sheet points at it."
source: "the-classes/heavy-armor#juggernaut; the-classes/alchemy#poisoner; the-classes/alteration#mage-armor; the-classes/alteration#magic-resistance; the-classes/conjuration#oblivion-binding; the-classes/mysticism#reflect-spell; the-classes/restoration#ward-absorb; the-classes/light-armor#unhindered; the-classes/light-armor#shrouded; the-classes/mercantile#investor; the-classes/vampire#unearthly-will; the-classes/werewolf#animal-vigor; the-classes/introduction#the-curses"
---
procedure: talent-pool-gone
title: A talent's pool, given up with it
help: "A talent switched out takes its pool with it: the sheet lets the pool go (the record is the GM's to remove)."
params:
  who: ref
  talent: {kind: text}
steps:
  - if: "@talent == 'heavy-armor-juggernaut' and default(@who.juggernaut, '') <> ''"
    then:
      - prompt: "{@who.name}'s Armor goes with the talent (remove its record: `didact rm {@who.juggernaut}`)."
      - unset: who.juggernaut
  - if: "@talent == 'alchemy-poisoner' and default(@who.poisons, '') <> ''"
    then:
      - prompt: "{@who.name}'s Poisons goes with the talent (remove its record: `didact rm {@who.poisons}`)."
      - unset: who.poisons
  - if: "@talent == 'alteration-mage-armor' and default(@who.flesh, '') <> ''"
    then:
      - prompt: "{@who.name}'s Flesh goes with the talent (remove its record: `didact rm {@who.flesh}`)."
      - unset: who.flesh
  - if: "@talent == 'alteration-magic-resistance' and default(@who.resistance, '') <> ''"
    then:
      - prompt: "{@who.name}'s Resistance goes with the talent (remove its record: `didact rm {@who.resistance}`)."
      - unset: who.resistance
  - if: "@talent == 'conjuration-oblivion-binding' and default(@who.unbinding, '') <> ''"
    then:
      - prompt: "{@who.name}'s Unbinding goes with the talent (remove its record: `didact rm {@who.unbinding}`)."
      - unset: who.unbinding
  - if: "@talent == 'mysticism-reflect-spell' and default(@who.reflection, '') <> ''"
    then:
      - prompt: "{@who.name}'s Reflection goes with the talent (remove its record: `didact rm {@who.reflection}`)."
      - unset: who.reflection
  - if: "@talent == 'restoration-ward-absorb' and default(@who.ward, '') <> ''"
    then:
      - prompt: "{@who.name}'s Ward goes with the talent (remove its record: `didact rm {@who.ward}`)."
      - unset: who.ward
  - if: "@talent == 'light-armor-unhindered' and default(@who.leathers, '') <> ''"
    then:
      - prompt: "{@who.name}'s Leathers goes with the talent (remove its record: `didact rm {@who.leathers}`)."
      - unset: who.leathers
  - if: "@talent == 'light-armor-shrouded' and default(@who.disguise, '') <> ''"
    then:
      - prompt: "{@who.name}'s Disguise goes with the talent (remove its record: `didact rm {@who.disguise}`)."
      - unset: who.disguise
  - if: "@talent == 'mercantile-investor' and default(@who.credit, '') <> ''"
