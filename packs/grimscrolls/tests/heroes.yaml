# Every class at random, all the way to records: Chapter 3's steps with the dice deciding what
# the prefill doesn't (race, background, birthsign, stats, traits and desires, the Core Talent's
# choices, its well or pool, potions and coin). Seeded, so it plays the same every time.
test: every-class-at-random
help: A hero of each of the twenty-three classes, made at random and committed, then one levelled up.
script:
  - world new tam --system {pack} --seed classes
  - campaign new first --seed classes
  - run: >-
      char new --mode random --prefill '{"name": "Ulfgar", "class": "Armorer"}'
    expect: ["class: Armorer (given)", "pc Ulfgar: level: 1"]
  - run: char commit c1
    expect: ["pc:ulfgar", "track:ulfgar-s-coin"]
  - run: >-
      char new --mode random --prefill '{"name": "Brynja", "class": "Athletics"}'
    expect: ["class: Athletics (given)", "pc Brynja: level: 1"]
  - run: char commit c2
    expect: ["pc:brynja", "pc:brynja"]
  - run: >-
      char new --mode random --prefill '{"name": "Sigrid", "class": "Blade"}'
    expect: ["class: Blade (given)", "pc Sigrid: level: 1"]
  - run: char commit c3
    expect: ["pc:sigrid", "pc:sigrid"]
  - run: >-
      char new --mode random --prefill '{"name": "Torvald", "class": "Block"}'
    expect: ["class: Block (given)", "pc Torvald: level: 1"]
