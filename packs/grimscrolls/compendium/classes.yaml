- illusion-quiet-casting
- illusion-hypnotic-gaze
- illusion-aspect-of-terror
- illusion-master-of-the-mind
first_talent: illusion-quiet-casting
options:
- title: The Twelve, Glossed
  text: "*Calm* stills a temper · *Chameleon* blurs you into what's behind you · *Charm* makes a friend,
    for now · *Command* gives one order that's obeyed · *Demoralize* sends them running · *Frenzy* turns
    them on whoever's nearest · *Invisibility* hides you until you act · *Light* burns without a wick
    · *Night-Eye* makes the dark plain · *Paralyze* locks a body rigid · *Rally* puts heart back in the
    wavering · *Silence* stops a voice — and with it, most magic."
source: the-classes/illusion
body: "You don't change the world — that's Alteration, and it's exhausting. You change what the world
  *thinks* is happening: what a guard sees, what a mob feels, whether the dark is dark. It's cheaper,
  and nobody can prove a thing."
---
id: mysticism
type: class
name: Mysticism
