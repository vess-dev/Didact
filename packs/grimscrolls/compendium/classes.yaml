  between a soldier and a brigand. You'll tell them it's the difference between getting hit and 
  getting out of the way — from somewhere over there, where they can't quite reach.
---
id: marksman-class
type: class
name: Marksman
art: Stealth
tagline: the conversation ends at two hundred paces
aka: [Archer, Hunter, Ranger, Bolt]
summary: names the target, and the whole party hits it
