- block-power-bash
- block-shield-charge
- block-quick-reflexes
first_talent: block-shield-wall
options:
- title: The Shield
  text: "*Choose 1:* a Legion tower shield with another soldier's name inside — a Nord round shield, its
    rim chewed by something — an Orcish slab you can barely lift — a duelist's buckler — your sword, and
    good wrists — a door, still on one hinge."
- title: Who You Stand in Front of
  text: "*Choose 1 you'd die for and 1 you resent a little:* the one who pays — the one who can't fight
    — the one who won't stop running ahead — the one who reminds you of someone — all of them, gods help
    you."
tables: [block-the-shield, block-who-you-stand-in-front-of]
source: the-classes/block
body: Somebody has to stand in the door. You decided long ago it would be you — behind a tower 
  shield, a buckler, or just a sword held where it needs to be — and you have never once regretted 
  the bruises.
---
