- destruction-impact
- destruction-rune-master
- destruction-intense-flames
- destruction-deep-freeze
- destruction-disintegrate
- destruction-master-destruction
first_talent: destruction-impact
options:
- title: Where It Comes From
  text: "*Choose 1:* drilled into you by a battlemage — a temper you gave a shape — a Dunmer ancestor
    who burned — a storm that hit you and stayed — a Daedric tutor you don't discuss — you asked the fire,
    and it said yes."
- title: Backlash Crucible
  text: '*When your magic runs wild, roll a thorn:* 1 everything metal sings — 2 frost on every surface
    — 3 your shadow catches fire — 4 hair standing, lanterns dead — 5 the smell of a forge — 6 a thunderclap
    indoors — 7 small harmless flames, everywhere — 8 it rains, here, only here.'
tables: [destruction-where-it-comes-from, destruction-backlash-crucible]
source: the-classes/destruction
body: 'Fire, frost, and shock: the three honest answers. Destruction is the school with no gentle uses
  and no quiet students — the one every guildhall teaches in a stone room with the door barred, and every
  army pays for by the hour.'
---
