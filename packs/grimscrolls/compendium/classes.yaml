options:
- title: What You Swing
  text: "*Choose 1:* a Legion mace with a dented flange — a woodcutter's axe that has seen other work
    — an Orcish warhammer, a stronghold's parting gift — a Nord great-axe older than the hold — a Dwemer
    piston on a haft — the nearest bench."
- title: What It's for
  text: '*Choose 2 you believe and 1 you only say:* armor is a lie — doors are a suggestion — the dead
    should stay down — somebody has to go first — I just like the sound.'
