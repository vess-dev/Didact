- alchemy-experimenter
- alchemy-poisoner
- alchemy-concentrated-poison
- alchemy-green-thumb
- alchemy-purity
first_talent: alchemy-physician
options:
- title: The Recipe Book
  text: '*Choose your recipes from these, or write one with the GM.* **Potions:** *Cure* (disease, poison)
    · *Fortify* (name one: strength, speed, wits, nerve) · *Resist* (fire, frost, shock, or magic) · *Restore*
    (health, stamina, or magicka — it takes a potent one to mend harm) · *Invisibility* · *Night-Eye*
    · *Water Breathing* · *Feather* · *Detect Life*. **Poisons:** *Damage* (a wound that keeps working)
    · *Paralysis* · *Silence* · *Frenzy* · *Fear* · *Burden* · *Weakness* (to an element, or to magic)
    · *Drain* (stamina: they sleep).'
tables: [alchemy-recipe-book]
source: the-classes/alchemy
body: Every leaf, wing, tooth, and toadstool in Tamriel does four things, and the fools who eat them
  only ever learn the first. You've tasted your way to the other three — and survived, mostly, which
  is the whole of the art.
