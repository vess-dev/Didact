id: speechcraft
type: class
name: Speechcraft
art: Stealth
tagline: admire, boast, joke, coerce — in the right order
aka: [Orator, Diplomat, Bard, Silver-Tongue]
summary: talks first, and usually last
engine: 3 Sway a session
core_talent: speechcraft-the-silver-tongue
growth: At levels 2, 4, and 6, gain +1 Sway per session.
growth_levels: [2, 4, 6]
talents:
- speechcraft-allure
- speechcraft-persuasion
- speechcraft-intimidation
- speechcraft-fame
- speechcraft-sharp-tongue
- speechcraft-rumors
- speechcraft-oratory
first_talent: speechcraft-persuasion
options:
- title: What They Say About You
  text: '*Set a reputation and how you feel about it:* a name in one hold — known across a province —
    sung about, inaccurately • for a peace you made — a lie that worked — a duel of insults — a speech
    at a hanging — talking a dragon out of it.'
tables: [speechcraft-what-they-say-about-you-1, speechcraft-what-they-say-about-you-2]
source: the-classes/speechcraft
body: Everyone in Tamriel loves one thing, hates another, and will tell you which with their face if
  you watch. You watch. Then you say the right thing, and doors open, prices fall, and men with 
  warrants remember they left a pot on the fire.
---
id: vampire
type: class
name: Vampire
art: Molag Bal
tagline: you died a little, and something better dressed got up
aka: [Nightstalker, Bloodkin, Cattle-Lord, the Pale]
summary: outdoes the living, and pays for it at dawn
engine: a 4d pool, refilled by feeding
core_talent: vampire-the-blood
growth: At levels 3 and 6, gain +1d Blood.
growth_levels: [3, 6]
talents:
- vampire-power-of-the-grave
- vampire-detect-all-creatures
- vampire-mist-form
- vampire-supernatural-reflexes
- vampire-blood-healing
- vampire-unearthly-will
- vampire-vampiric-grip
first_talent: vampire-blood-healing
options:
- title: Your Bloodline
  text: "*Choose 1:* Volkihar, of Skyrim's ice — the Vampyrum Order, hidden in Cyrodiil's good families
    — Aundae, who kept their magic — Berne, who kept to the shadows — Quarra, who kept nothing but the
    strength — turned by something that didn't stay to explain."
- title: What You Do About the Hunger
  text: "*Choose 1:* a willing friend — the condemned — beasts, and misery — cattle, kept somewhere —
    whatever's closest; you try not to think about it."
tables: [vampire-your-bloodline, vampire-what-you-do-about-the-hunger]
source: the-classes/vampire
body: "Sanguinare Vampiris, Porphyric Hemophilia, the gift of the Father of Vampires: the scholars have
  names for it. What you have is a hunger, a long calendar, and a list of things you can do that the living
  can't — for as long as somebody else keeps paying for it."
---
id: werewolf
type: class
name: Werewolf
art: Hircine
tagline: the moon doesn't ask
aka: [Skinchanger, Moon-Born, Hound of Hircine, the Pack]
summary: has a monster to let out
engine: the change, once a session
core_talent: werewolf-beast-blood
growth: At levels 3 and 6, you can change once more per session.
growth_levels: [3, 6]
talents:
- werewolf-bestial-strength
- werewolf-totem-of-ice-brothers
- werewolf-totem-of-the-moon
- werewolf-totem-of-the-predator
- werewolf-totem-of-terror
- werewolf-animal-vigor
- werewolf-savage-feeding
first_talent: werewolf-totem-of-the-moon
options:
- title: How It Took You
  text: "*Choose 1:* bitten on the road, and left — the blood of the Circle, freely offered — a bargain
    with the Huntsman — born to it — a Glenmoril rite you half remember — a ring you can't take off."
- title: Your Other Shape
  text: "*Choose 1:* the wolf — the werebear of Skyrim and Solstheim — the wereboar of High Rock — the
    werecrocodile of Black Marsh — the werelion of Elsweyr — something the books don't list."
tables: [werewolf-how-it-took-you, werewolf-your-other-shape]
source: the-classes/werewolf
body: "Sanies Lupinus, the Huntsman's gift, the Circle's secret: a second shape folded up inside the first,
  with better teeth and no manners. You don't choose whether it's there. You choose, most nights, whether
  it gets out."
