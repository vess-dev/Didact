- mysticism-detect-life
- mysticism-soul-stealer
- mysticism-enchanter
- mysticism-reflect-spell
- mysticism-mark-and-recall
- mysticism-clairvoyance
first_talent: mysticism-detect-life
options:
- title: How the Old Way Found You
  text: "*Choose 1:* a Psijic left a book where you'd find it — you died once, briefly — a soul gem spoke
    your name — an ancestor explains things in your sleep."
- title: What Strain Looks Like
  text: '*Choose 1:* nosebleeds — your voice arrives late — frost on your fingertips — the candles burn
    violet.'
tables: [mysticism-how-the-old-way-found-you, mysticism-what-strain-looks-like]
source: the-classes/mysticism
body: "Ask ten wizards what Mysticism *is* and you'll get nine lectures and a headache. It's the magic
  of magic itself: of souls, of sight without eyes, of here and there being the same place. The Psijics
  call it the Old Way. Nobody else calls it anything twice."
---
