- alteration-magic-resistance
- alteration-stability
- alteration-transmute-ore
- alteration-dual-casting
- alteration-master-alteration
first_talent: alteration-mage-armor
options:
- title: The Scholar's Habit
  text: '*What does your magic look like? Choose 2:* a green shimmer — chalk dust and geometry — the smell
    of rain on stone — a hum in the teeth — words in Aldmeris, mispronounced — nothing; it simply *is*
    different now.'
- title: Where You Studied
  text: "*Choose 1:* the Arcane University — the College of Winterhold — a Telvanni tower, as someone's
    property — the Synod, until the incident — a stolen spellbook and a locked cellar."
tables: [alteration-the-scholars-habit, alteration-where-you-studied]
source: the-classes/alteration
body: 'Weight, hardness, the closedness of locks, whether water will hold a boot: the world insists these
  are settled matters. Alteration is the art of reopening the question — briefly, locally, and with a
  straight face.'
---
