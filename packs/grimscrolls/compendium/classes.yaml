options:
- title: Your Style
  text: "*Choose 1 or 2:* Whispering Fang — Goutfang — the Rain of Sand — Arena bloodworks brawling —
    Orsinium wrestling — Nord tavern rules — a temple discipline you've never named — whatever works."
- title: It Favors
  text: '*Choose 3:* the open palm — the elbow — the low sweep — the claw — the joint lock — the headbutt
    — the knee — the throw — an iron forearm — the feint — a patient guard.'
