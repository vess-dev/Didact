options:
- title: Your Harness
  text: "*Choose 1:* Legion-issue, dented where the last owner died — Orcish plate, a stronghold's bride-price
    — Dwemer scrap, bolted to fit — ebony, and you won't say how — a knight's inheritance, two sizes wrong
    — a patchwork of every fight you've won."
- title: Inside It, You Are
  text: '*Choose 1:* calm — invisible — someone braver — hot, mostly — finally the right size.'
tables: [heavy-armor-your-harness, heavy-armor-inside-it-you-are]
source: the-classes/heavy-armor
body: "Steel, orcish, ebony, Daedric if the gods are careless: forty pounds of someone else's hard work
  between you and everything that wants you dead. It is hot, loud, and miserable. You wouldn't take it
  off for a jarl's ransom."
---
id: alchemy
type: class
name: Alchemy
art: Magic
tagline: the world is made of ingredients; some of them scream
aka: [Apothecary, Herbalist, Poisoner, Wortcrafter]
