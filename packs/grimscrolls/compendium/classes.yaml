- marksman-power-shot
- marksman-hunters-discipline
- marksman-ranger
- marksman-bullseye
first_talent: marksman-steady-hand
options:
- title: Tell-Tale Signs
  text: "*When you name a quarry, name what you noticed:* it favors one side — it flinches from fire —
    it's slow on bad ground — it fixes on one target — its armor gaps at the neck — it circles before
    it charges — it can't abide bright light — it's been wounded before, there."
- title: Your Bow
  text: "*Choose 1:* a Bosmer bone bow (no wood was harmed) — a Legion-issue shortbow — a Nord hunting
    bow with a name — a crossbow, and the Dawnguard's opinions — whatever's strung."
tables: [marksman-tell-tale-signs, marksman-your-bow]
source: the-classes/marksman
body: 'The bow is the oldest argument in Tamriel and still the best one: whatever it is, it has to cross
  the ground between you first. You know the wind, the drop, and exactly how long a troll takes to cover
  forty yards.'
---
