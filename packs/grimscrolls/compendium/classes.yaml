growth: At levels 2, 4, and 6, gain +1 Favor per session.
growth_levels: [2, 4, 6]
talents:
- mercantile-haggling
- mercantile-merchant
- mercantile-investor
- mercantile-fence
- mercantile-master-trader
- mercantile-golden-touch
- mercantile-bribery
first_talent: mercantile-haggling
options:
- title: Your Trade
  text: "*Choose 1 you deal in and 1 you won't touch:* arms — spices and moon sugar — horses and guar
    — relics of doubtful origin — other people's debts — skooma."
- title: They Say You
  text: '*Choose 1:* give fair weight — never ask where it came from — once sold a man his own horse —
    are always, somehow, about to be rich.'
tables: [mercantile-your-trade, mercantile-they-say-you]
source: the-classes/mercantile
body: Swords win fights. Coin decides which fights happen, who shows up to them, and what they're 
  holding when they do. You've bought and sold in every market from Leyawiin to Solitude, and you 
  have never once paid the asking price.
---
id: security
type: class
name: Security
art: Stealth
tagline: a lock is a question; you know the answer
aka: [Locksmith, Burglar, Trapspringer, Second-Story Hand]
summary: makes locked and trapped stop mattering
engine: a 4d pool a session
core_talent: security-picks
growth: At levels 3 and 6, gain +1d Picks.
growth_levels: [3, 6]
talents:
- security-quick-hands
- security-wax-key
- security-treasure-hunter
- security-locksmith
- security-unbreakable
- security-master-locks
- security-trapwright
first_talent: security-wax-key
options:
- title: Your Kit
  text: "*Choose 2:* a roll of picks with one missing — a wax tin — a dentist's mirror on a wire — chalk
    and a plumb line — an ear trumpet — a fork that has seen things."
- title: The One That Beat You
  text: "*Choose 1:* a Dwemer coffer in Markarth — a vault under the Imperial City — a door with no keyhole
    at all — your own, the night you came home late — it hasn't happened yet."
tables: [security-your-kit, security-the-one-that-beat-you]
source: the-classes/security
body: "Tumblers, pressure plates, Ayleid gate-stones, the sulky gears of a Dwemer door: somebody built
  each of them to say *no*. You've made a career of the follow-up question."
