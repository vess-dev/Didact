id: sneak
type: class
name: Sneak
art: Stealth
tagline: never seen, rarely suspected, occasionally blamed
aka: [Shadow, Prowler, Footpad, Knife in the Dark]
summary: isn't there, until it's too late
engine: a 3d pool a scene
core_talent: sneak-shadow
growth: At levels 3 and 6, gain +1d Shadow.
growth_levels: [3, 6]
talents:
- sneak-backstab
- sneak-deadly-aim
- sneak-assassins-blade
- sneak-muffled-movement
- sneak-light-foot
- sneak-shadow-warrior
- sneak-light-fingers
first_talent: sneak-backstab
options:
- title: Who Taught You
  text: "*Choose 1 you owe and 1 who's looking for you:* the Thieves Guild — the Dark Brotherhood — the
    Morag Tong — the Shadowscales of Black Marsh — a Khajiit caravan — nobody; hunger."
- title: Your Calling Card
  text: "*Choose 1:* a single black feather — a coin on the pillow — the lock, carefully re-locked — a
    polite note — a sweetroll, missing — nothing. That's the card."
tables: [sneak-who-taught-you, sneak-your-calling-card]
source: the-classes/sneak
body: There is a way of crossing a room that leaves it thinking it was empty the whole time. Thieves
  use it, assassins perfect it, and guards spend whole careers insisting it must have been the wind.
