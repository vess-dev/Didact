source: the-classes/conjuration
body: Oblivion is full of things that want to be here, and the grave is full of things that never 
  wanted to leave. You hold the door for both — on your terms, by your leave, for exactly as long as
  you say.
---
id: destruction
type: class
name: Destruction
art: Magic
tagline: the shortest distance between a problem and a crater
aka: [Pyromancer, Stormcaller, War Wizard, Frostmonger]
