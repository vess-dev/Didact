# opening tables' line (summary: "You're the one who…"; engine; first talent to try), the
# Core Talent and its growth, the seven talents, and the [Optional] boxes (options; their
# lists are tables in tables/class-crucibles.yaml).
id: armorer
type: class
name: Armorer
art: Combat
tagline: every blade remembers the hammer
aka: [Smith, Forgemaster, Tinker, Quartermaster]
summary: made the gear, and says so at the perfect moment
engine: 5 Temper a session
core_talent: armorer-tempering
growth: At levels 3 and 6, gain +1 Temper per session.
growth_levels: [3, 6]
talents:
- armorer-steel-smithing
- armorer-arcane-blacksmith
- armorer-dwarven-smithing
- armorer-orcish-smithing
- armorer-glass-smithing
- armorer-daedric-smithing
- armorer-dragon-armor
first_talent: armorer-steel-smithing
options:
- title: Your Mark
  text: "*Every smith signs their work. Choose 1:* a struck initial — a thumbprint in the quench — three
    notches on the tang — a stronghold's sigil — a line of bad poetry inside the bracer — nothing; you
    know your own work."
- title: Where You Learned
  text: "*Choose 1 you honor and 1 you left:* a Legion field forge — an Orc stronghold — the shadow of
    the Skyforge — a Dunmer armorer's back room — a Dwemer ruin and a great many burns — a village smithy
    that wanted you to stay."
tables: [armorer-your-mark, armorer-where-you-learned]
source: the-classes/armorer
body: 'Heroes are loud about the swing and quiet about who made it possible. You know better: battles
  are won at the anvil the night before, and lost by a rivet nobody checked. You checked.'
---
id: athletics
type: class
name: Athletics
art: Combat
tagline: the road is long; you're longer
aka: [Courier, Runner, Strider, Outrider]
summary: never tires, never slows, and pushes for free
engine: 6 Wind a session
core_talent: athletics-wind
growth: At levels 2, 4, and 6, gain +1 Wind per session.
growth_levels: [2, 4, 6]
talents:
- athletics-fleet-footed
- athletics-swift-swim
- athletics-second-wind
- athletics-run-down
- athletics-beast-of-burden
- athletics-long-road
- athletics-stamina
first_talent: athletics-fleet-footed
options:
- title: Where You Got Your Legs
  text: "*Choose 1:* a Legion courier on the Gold Road — an Ashlander herd-runner — a pearl diver out
    of Stros M'Kai — a goatherd in the Jeralls — a Bosmer who was told not to climb that — running from
    something that is still coming."
- title: When You Finally Stop, You
  text: "*Choose 1:* eat everything in reach — sleep like the dead — pace — complain about boots — don't,
    really."
tables: [athletics-where-you-got-your-legs, athletics-when-you-finally-stop-you]
source: the-classes/athletics
body: Everyone else measures a journey in days. You measure it in breaths, and you have plenty. You 
  were the Legion's fastest courier, or a pearl diver, or simply the child who never stopped running
  — and the world has been trying to tire you out ever since.
---
id: blade
type: class
name: Blade
art: Combat
tagline: three feet of steel and an opinion
aka: [Duelist, Sellsword, Bravo, Sword-Saint]
summary: wins the exchange, then improves on it
engine: +1d, and 2 Edge a scene
core_talent: blade-bladework
growth: At levels 3 and 6, gain +1 Edge per scene.
growth_levels: [3, 6]
talents:
- blade-bladesman
- blade-fighting-stance
- blade-dual-flurry
- blade-deep-wounds
- blade-savage-strike
- blade-critical-charge
- blade-paralyzing-strike
first_talent: blade-bladesman
options:
- title: Your Blade
  text: "*Choose 2 and tell its story:* taken from a dead legionnaire — a Blades katana with a broken
    oath on it — your mother's, reforged twice — won at dice, and the loser wants it back — Redguard steel
    with a name you can't pronounce — notched where it met something it shouldn't have — a bandit's ugly
    sword that has never once failed you — glass, and you still owe for it."
- title: Your School
  text: "*Choose 1:* Legion drill — the Way of the Sword — Akaviri forms, half remembered — the Arena's
    bloodworks — Nord axe-work, adapted — self-taught, and it shows."
tables: [blade-your-blade, blade-your-school]
source: the-classes/blade
body: "Dagger, saber, katana, claymore: Tamriel has more ways to sharpen iron than to bake bread, and
  you've studied them the way priests study scripture. Other people fight. You *fence* — even with a kitchen
  knife, even in the mud."
---
