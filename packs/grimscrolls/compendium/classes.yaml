options:
- title: Build Your Thrall
  text: '*Choose a kind, or roll a thorn:* 1 a scamp (thieving hands) — 2 a flame atronach (burning) —
    3 a frost atronach (big enough to ride) — 4 a storm atronach (winged) — 5 a clannfear (tracks anything)
    — 6 a skeleton in old Legion kit (tireless) — 7 an ancestor ghost (incorporeal) — 8 a dremora who
    resents this (speaks, and argues).'
- title: What the Break Lets Loose
  text: '*Choose or roll:* it takes something with it — it leaves something behind — its master notices
    — it settles a grudge on the way out — fire, briefly, everywhere — it lingers, unbound and thoughtful.'
