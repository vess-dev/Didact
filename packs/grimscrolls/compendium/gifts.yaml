id: altmer-highborn
type: talent
name: Highborn
kind: racial
race: Altmer
restrictions: [Altmer only]
section_restriction: One race, and its talent alone. You can't pick up a second race later.
source: blood-stars-and-stones/blood-the-ten-races#altmer
body: Magic is your first language. You always notice magic at work near you — a ward, a glamour, an
  enchanted ring — though not what it does. Once per session, call on your blood to **regain magic**
  (Chapter 4). With none to regain, work one small spell of any school instead — roll Wits; it's 
  never potent.
