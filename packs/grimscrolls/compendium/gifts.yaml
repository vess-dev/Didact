id: the-voice
type: talent
name: The Voice
kind: voice
restrictions: [Optional]
section_restriction: 'Optional. Ask your table before you take this one: it tends to become what the campaign
  is about.'
source: blood-stars-and-stones/the-voice#the-voice
body: "You have learned to Shout — as one of the Dragonborn, or through years of silence on the Throat
  of the World. You know **1 Shout**: choose it from the Words below, or name another the table agrees
  on. Its name is its touchstone, and it does what a spell of that name would do: no roll when there's
  no risk, **Presence** when there is. You can Shout **once per scene**, and everyone for a mile hears
  it. Once per session, speak all three of its words: that Shout is **potent**. You learn a new Shout
  by finding its word wall and giving it a dragon's soul — or a season with a master."
