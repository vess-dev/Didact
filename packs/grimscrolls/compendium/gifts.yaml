id: argonian-histskin
type: talent
name: Histskin
kind: racial
race: Argonian
restrictions: [Argonian only]
section_restriction: One race, and its talent alone. You can't pick up a second race later.
source: blood-stars-and-stones/blood-the-ten-races#argonian
body: "You breathe water as easily as air and swim as fast as you run, and disease lands one step lighter
  on you. Once per session, let the Hist's sap rise: one physical harm fades to a mark."
---
id: bosmer-command-animal
type: talent
name: Command Animal
kind: racial
race: Bosmer
restrictions: [Bosmer only]
section_restriction: One race, and its talent alone. You can't pick up a second race later.
source: blood-stars-and-stones/blood-the-ten-races#bosmer
body: 'Poison and disease land one step lighter on you. Once per session, speak to a beast in the old
  way: a tough or lesser animal is your ally for the scene — it fights, tracks, or carries for you as
  outside help — and a greater one gives you a beat or two to pass, speak, or back away.'
---
id: breton-dragonskin
type: talent
name: Dragonskin
kind: racial
race: Breton
restrictions: [Breton only]
section_restriction: One race, and its talent alone. You can't pick up a second race later.
source: blood-stars-and-stones/blood-the-ten-races#breton
body: 'Magic runs thin against your blood: take **+1d** on defense rolls against spells. Once per session,
  harden it for a scene: hostile magic that strikes you lands one step lighter.'
---
id: dunmer-ancestors-wrath
type: talent
name: Ancestor's Wrath
kind: racial
race: Dunmer
restrictions: [Dunmer only]
section_restriction: One race, and its talent alone. You can't pick up a second race later.
source: blood-stars-and-stones/blood-the-ten-races#dunmer
body: "Fire lands one step lighter on you. Once per session, call your ancestors' fire around you for
  a scene: lesser foes, and tough or lesser beasts, won't close with you while it burns, and anything
  that does lay hands on you is set alight — you're **set up** against it."
---
id: imperial-voice-of-the-emperor
type: talent
name: Voice of the Emperor
kind: racial
race: Imperial
restrictions: [Imperial only]
section_restriction: One race, and its talent alone. You can't pick up a second race later.
source: blood-stars-and-stones/blood-the-ten-races#imperial
body: "Coin finds you: once per session, when your *Coin* rolls, one die that would drop stays, unless
  it's the last. And once per session, speak — every person who can hear you stops to listen. Blades lower
  and tempers hold for a beat or two; lesser folk stand down for the scene if you give them any reason
  to, and a tough one hears you out before choosing. It doesn't reach beasts, the dead, or Daedra."
---
id: khajiit-night-eye
type: talent
name: Night Eye
kind: racial
race: Khajiit
restrictions: [Khajiit only]
section_restriction: One race, and its talent alone. You can't pick up a second race later.
source: blood-stars-and-stones/blood-the-ten-races#khajiit
body: "You see in the dark as others see at dusk: you never take thorns for darkness. Your claws mean
  you're never unarmed, and you can climb anything a cat could. And you land on your feet: harm from a
  fall lands one step lighter."
---
id: nord-battle-cry
type: talent
name: Battle Cry
kind: racial
race: Nord
restrictions: [Nord only]
section_restriction: One race, and its talent alone. You can't pick up a second race later.
source: blood-stars-and-stones/blood-the-ten-races#nord
body: 'Cold lands one step lighter on you — frost, ice water, the wind off the Sea of Ghosts. Once per
  session, give the cry of your ancestors: lesser foes who hear it break and run for a few moments, and
  a tough one falters — the next roll against it is set up. Greater foes are merely impressed.'
---
