category: Beasts & Vermin
tier: tough
role: predator
sights: grass moving against the wind
sounds: a coughing snarl
smells: cat musk and blood
traits: [outruns anything on two legs, turns wide at a full run]
moves: [Pounce from the Long Grass, Drag Down the Runner]
wants: 'you, in the open, now — not a soaking: it balks at water'
note: "Its first strike comes at high stakes, and running only picks who it hits. Sidestep inside its
