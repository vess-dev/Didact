  walks. At the end of the Third Era a champion did. Jyggalag yielded, named them Prince of Madness, and
  left for Oblivion, free.'
source: the-bestiary/bosses-and-legends#jyggalag-prince-of-order
body: 'The Prince the others feared enough to curse: Order itself, condemned to live as Sheogorath and
  to wake once an era, march on the Shivering Isles, and level them. He would like it to stop too.'
---
id: hircines-hunt
type: monster
name: Hircine's Hunt
category: Named Threats & Legends
tier: boss
role: predator
sights: red moons over the ice
sounds: baying that is nearly speech
smells: blood on snow, wet fur
pools:
- name: The Hounds
  dice: 6
  traits: werewolves who take you from your bed and fill the maze under the glacier
  moves: [Take the Sleeper, Statues That Wake]
- name: The Other Prey
  dice: 6
  traits: 'he takes several champions and one may leave: your allies are your rivals'
  moves: [Fight Beside You for Now, Turn When the Moon Says]
- name: The Aspect
  dice: 8
  traits: 'he meets the last one standing as a third of himself, and the prey chooses: Strength, Speed,
    or Guile'
  moves: [Bear's Weight, Wolf's Howl, Hunter's Spear]
fail: The Hunt ends without you. He goes home content, and you are a trophy or a hound.
wants: "a chase worth an era's wait — never easy meat: by his own law the prey must have a real chance"
note: 'A linked challenge (6d + 6d + 8d) with no way out but through: no spell carries you off the hunting
  ground. Hircine whole would not be sport, so he is never the fight. Hunt the hunters, and he may be
  pleased enough to end it early. On Solstheim in 3E 427 the prey were a Legion captain, a chieftain,
  a frost giant, and one outlander.'
source: the-bestiary/bosses-and-legends#hircines-hunt
body: Once an era the moons turn red and the Huntsman comes to Nirn to run a Great Hunt. He picks 
  the prey himself, from the strongest things in reach. Being chosen is his idea of a compliment.
---
id: mannimarco-king-of-worms
type: monster
name: Mannimarco, King of Worms
category: Named Threats & Legends
tier: boss
role: blaster
sights: a railing of finger bones rising around you
sounds: a courteous voice explaining what comes next
smells: grave earth and candle smoke
pools:
- name: The Order of the Black Worm
  dice: 6
  traits: cells in every cave and ruin, and friends on the Guild's own council
  moves: [Ambush at the Ruin, A Colleague Was His]
- name: The Enthrallment
  dice: 4
  traits: he holds you still with a word and makes you a Worm Thrall
  moves: [Hold Fast, Take the Soul]
- name: Mannimarco
  dice: 8
  traits: robes, the Staff of Worms, and no need to hurry
  moves: [Raise Your Dead, Call a Lich]
fail: You serve. He studies your soul at leisure, and your friends meet you next on his side.
wants: the souls of the mighty and the ruin of the Mages Guild — he has no use for the unremarkable
note: 'A linked challenge (6d + 4d + 8d). He is locked behind the Enthrallment, and force does not drop
  that pool: it wants a soul and takes one. In 3E 433 the answer was a black soul gem already filled by
  a willing Arch-Mage: its bearer could not be enthralled. Killing the body settled little: he had made
  himself a god, and every eighth day his moon eclipses Arkay.'
source: the-bestiary/bosses-and-legends#mannimarco-king-of-worms
body: The first of the undying liches, founder of the Order of the Black Worm, and the Mages Guild's
  enemy since its founder's day. He collects the souls of the powerful, and is pleasant about taking
  yours.
---
id: umaril-the-unfeathered
type: monster
name: Umaril the Unfeathered
category: Named Threats & Legends
tier: boss
role: brute
sights: a towering golden angel with bare, featherless wings
sounds: chapel bells cut short
smells: blood on an altar cloth
pools:
- name: The Aurorans
  dice: 6
  traits: Meridia's soldiers of light, butchering priests at their altars
  moves: [Slaughter in the Chapel, Stand Up Again in Light]
- name: Umaril in the Flesh
  dice: 8
  traits: said to fell the greatest warriors at a stroke; kill him and he only goes home
  moves: [One Stroke, Lightning from the Blade]
- name: Umaril in Spirit
  dice: 6
  traits: the half that slips away to the Colored Rooms to mend
  moves: [Leave the Body Behind, Return in an Age]
fail: He dies in body only, and is back when you are old, or when your grandchildren are.
wants: vengeance on the Divines who armed his killer — your worship is the insult, not you
note: A linked challenge (6d + 8d + 6d). While the Dark Orb in his fortress stands, the Aurorans' 
  pool can't drop below 1d. His first blow lands at dire stakes on anyone without a Crusader's 
  Relic, and the gods withhold those from the wicked. His spirit is locked to all but a bearer of 
  the Blessing of Talos, the one Divine Pelinal never had.
source: the-bestiary/bosses-and-legends#umaril-the-unfeathered
body: The greatest of the Ayleid sorcerer-kings, a golden half-god who held the White-Gold Tower 
  over a nation of slaves. Pelinal killed him in the First Era. It did not take, and at the end of 
  the Third he came back.
---
id: mankar-camoran
type: monster
name: Mankar Camoran
category: Named Threats & Legends
tier: boss
role: trickster
sights: a garden under a sun that is always rising
sounds: a scholar's voice in your skull
smells: flowers over brimstone
pools:
- name: The Savage Garden
  dice: 6
  traits: his faithful dead, promised Paradise and hunted through it by Daedra
  moves: [The Master's Voice, Daedra Loose on the Lawn]
- name: The Forbidden Grotto
  dice: 6
  traits: entered only in the Bands of the Chosen, which the wearer cannot remove
  moves: [Cage Over the Lava, The Jailer's Rounds]
- name: Mankar Camoran
  dice: 8
  traits: wearing the Amulet, with a son and daughter who rise each time they fall
  moves: [Call Up a Daedra, Silence the Spell]
fail: 'He keeps you. Nothing stays dead in Paradise: you join the faithful in the garden, and no Dragonfires
  are ever lit.'
wants: Tamriel "reborn" under Dagon, as argued in four volumes — and, like any author, to be heard 
  out
note: 'A linked challenge (6d + 6d + 8d) in his own realm: the portal shuts behind you, and the way out
  is his death. Not everyone here believes: a Dremora trades the Bands for a favor, and a disillusioned
  follower can strike them off. Kill him and Paradise comes apart. 3E 433.'
source: the-bestiary/bosses-and-legends#mankar-camoran
body: Master of the Mythic Dawn, who had an Emperor killed and carried the Amulet of Kings into a 
  private heaven he made out of Dagon's own book. He lectures you the whole way up the path, inside 
  your head.
---
id: karstaag
type: monster
name: Karstaag
category: Named Threats & Legends
tier: boss
role: brute
sights: a horned shape in a standing blizzard
sounds: ice cracking like timber
smells: cold that hurts the teeth
traits: [his storm throws warriors flat, mends unless burning]
moves: [Club Like a Falling Tree, Call Ice Wraiths]
wants: his hall and throne left alone — alive, he kept a truce with the Skaal
note: An 8d challenge, +1t in close. Unless he is burning, the first time his pool would drop, it 
  doesn't. Set his skull on his throne and the ghost rises (4E 201). Beat it, and he answers your 
  call three times.
source: the-bestiary/bosses-and-legends#karstaag
body: The frost giant of Solstheim, king of an ice castle and its rieklings. Hircine took him for 
  prey in 3E 427. In the Fourth Era what holds the throne is a skull and a grudge.
---
id: the-ebony-warrior
type: monster
name: The Ebony Warrior
category: Named Threats & Legends
tier: boss
role: predator
sights: black plate without a scratch
sounds: '"The time has come."'
smells: snow and sword oil
traits: ['proof against fire, frost, and shock', blows rebound on the striker]
moves: [Shout You Off Your Feet, Disarm with a Word]
wants: an honest death at an equal's hands, then Sovngarde — not mercy, not a trick
note: "An 8d duel at high stakes, at his Last Vigil in the Velothi Mountains (4E 201). He comes only to
  heroes at their height. The first time his pool would drop, it doesn't: he drinks."
source: the-bestiary/bosses-and-legends#the-ebony-warrior
body: 'A Redguard in full ebony who has done everything: no quests left, no villains, nothing that can
  test him. So he finds the one hero who might kill him, says so, and waits on a mountain.'
---
id: umbra
type: monster
name: Umbra
category: Named Threats & Legends
tier: boss
role: trickster
sights: a jet blade with red script along it
sounds: '"Umbra. It is everything."'
smells: cold iron and old blood
pools:
- name: The Wielder
  dice: 8
  traits: the best blade you have met, tireless, and tired of it
  moves: [Soul-Drinking Stroke, Fight Without Rest]
- name: The Sword
  dice: 4
  traits: awake, patient, and looking for the worthiest hand in the room
  moves: [Lie There for the Victor, Whisper a Name]
fail: '*6d Your Own Name* — a timer from the moment one of you takes it up; when it runs dry, they answer
  to its name.'
wants: souls, and a worthier hand — the wielder wants it to stop, and cannot put it down
note: "A linked challenge (8d + 4d) at high stakes, and the duel is the easy part: afterward the sword
  is lying there, and its pool is the work of getting it anywhere unwielded. Its bearers know what it
  has made of them. An **Orc** in the hills by Suran (3E 427) asked only to die in battle. **Lenwin**
  of Pell's Gate (3E 433) shut herself in an Ayleid ruin so the killing would stop. Clavicus Vile wants
  it back and offers his Masque. His own hound advises against it."
source: the-bestiary/bosses-and-legends#umbra
body: A black sword made by a witch for Clavicus Vile to gather souls, holding a piece of the Prince
  that woke and named itself. Whoever carries it comes to answer to the sword's name and forgets 
  their own.
---
id: potema-the-wolf-queen
type: monster
name: Potema, the Wolf Queen
category: Named Threats & Legends
tier: boss
role: swarmer
sights: a blue-white spirit turning above a ring of tombs
sounds: an old woman's voice calling you little one
smells: tomb dust and lightning
pools:
- name: The Binding at Wolfskull
  dice: 6
  traits: necromancers calling her up to leash her; break the rite and she slips free instead
  moves: [Finish the Binding, Draugr on the Stair]
- name: Her Inner Council
  dice: 6
  traits: the dead of the catacombs under Solitude, captained by vampires
  moves: [Rise Again, Vampire at the Gate]
- name: Potema
  dice: 8
  traits: a spirit wheeling lightning round the crypt; arrows pass through her
  moves: [Wheel of Lightning, Raise You to Serve]
fail: She takes a body, and Solitude has its Wolf Queen back with a court of corpses.
wants: the Ruby Throne, living or dead — she thanks those who free her, and means to keep them
note: "A linked challenge (6d + 6d + 8d). While her Council's pool stands, hers can't drop: she weakens
  only as her dead are put down. Beating the spirit is not the end: her skull must be sanctified by a
  priest of Arkay, or her pool is whole again next season. Whoever saw her summoned is bound to her, and
  must finish it."
source: the-bestiary/bosses-and-legends#potema-the-wolf-queen
body: Queen of Solitude and a Septim, who fought her own family for the Ruby Throne and, losing, 
  held out ten more years by raising both armies' dead, until the siege of 3E 137. In 4E 201 
  necromancers nearly call her back.
---
id: the-gatekeeper-of-the-fringe
type: monster
name: The Gatekeeper of the Fringe
category: Named Threats & Legends
tier: boss
role: protector
sights: a patchwork giant between two great doors
sounds: an adventurer's plate crumpling
smells: tallow and old blood
pools:
- name: The Gatekeeper
  dice: 8
  traits: closes its own wounds, never leaves the gates, and makes short work of adventurers in 
    plate
  moves: [Blade-Arm Sweep, Lifeless Touch]
- name: Bones in the Garden
  dice: 4
  traits: a dead Gatekeeper lies in its maker's locked garden; arrows fletched from it bite the 
    living one
  moves: [Shambles in the Courtyard, The Fletcher Wants His Shot]
- name: A Mother's Tears
  dice: 4
  traits: Relmyna Verenim visits at midnight and weeps; her tears burn it
  moves: [She Sees You, The Child Defends Her]
fail: It finishes you at the gate as it finished the last party, with Passwall looking on.
wants: no one through the Gates of Madness — it does not chase those who turn back
note: 'A linked challenge (4d + 4d + 8d) where nothing is locked: force alone can do it, at +1t, and its
  pool gets a die back each beat it is not pressed. Each smaller part beaten drops 1d before its pool
  rolls. Kill it and Relmyna builds a stronger one in time, and remembers you.'
source: the-bestiary/bosses-and-legends#the-gatekeeper-of-the-fringe
body: A giant stitched from many bodies, with a blade for a right arm, set at the Gates of Madness 
  to keep the unworthy out of the Shivering Isles. The keys to both doors are sewn inside it. Its 
  maker calls it her child.
