sounds: a snort and a stamp
smells: sweat and leather
traits: [faster than you will ever be, bolts or fights unasked]
moves: [Rear and Strike, Bolt for Home]
wants: oats, a known hand, and distance from wolves — though Skyrim's stand and kick
note: "Mounted, you outrun what you cannot outfight. In a fight the horse is the GM's to threaten: an
