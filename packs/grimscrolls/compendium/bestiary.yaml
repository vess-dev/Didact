sounds: a snort, then hooves
smells: bull musk
traits: [tracks by scent, shrugs off much magic]
moves: [Glowing-Horn Charge, One-Handed Warhammer]
wants: its ruin empty and its hoard untouched — keep to the road and it keeps to its stones
note: 'A clan at its ruin is a 6d pool under a **minotaur lord**, an elite. Spells take +1t. The horn
  glows before the charge: step aside for a setup, or lose armor and blood. Travelers eat apples as proof
  against it. Hearsay.'
source: the-bestiary/beasts-and-wild-things#minotaur
body: A bull's head and hooves on a man's frame, with horns that open plate like cloth. Some say 
  they descend from Alessia's consort Morihaus. The minotaur does not take questions.
---
id: imp
type: monster
name: Imp
category: Monsters of the Wild
tier: mook
role: blaster
sights: bat wings against the cave roof
sounds: chittering like laughter
smells: singed hair
traits: [stays in the air, knows when to fight and when to flee]
moves: [Pelt from Above, Scatter and Regroup]
wants: mischief and an easy mark — not a fight that has come up to meet it
note: A flock is a 4d pool. Melee takes +1t until they are brought down or caught under a low 
  ceiling; once the fight is close, they break. Each imp has one element only. Speak Impish and they
  may simply stop. Mages keep them as familiars, so look for an owner before you swing.
source: the-bestiary/beasts-and-wild-things#imp
body: A small, winged nuisance that throws fire, frost, or sparks from just out of reach — one 
  element to an imp — and finds this funny.
---
id: will-o-the-wisp
type: monster
name: Will-o-the-Wisp
category: Monsters of the Wild
tier: tough
role: trickster
sights: a pale glow over the reeds
sounds: a faint hum
smells: marsh rot
traits: [plain steel passes through it, dims to nearly nothing]
moves: [Draining Touch, Lure Off the Path]
wants: the curious, one at a time — it hunts alone, and only what follows it
note: "Without silver, Daedric, or enchanted arms, or magic, its pool can't drop. Dimmed, it takes +1t
  to strike, though its wake in standing water is a setup. Its touch feeds it: keep your distance. Found
  in Blackwood, Black Marsh, and Summerset."
source: the-bestiary/beasts-and-wild-things#will-o-the-wisp
body: A marsh light that is not swamp gas, whatever the locals say. It draws the curious off the 
  causeway, drinks their strength and magicka, and leaves the rest for the swamp.
---
id: land-dreugh
type: monster
name: Land Dreugh
category: Monsters of the Wild
tier: tough
role: brute
sights: a shell scraping on river stones
sounds: the snap of a spark
smells: low tide
traits: [shell turns common weapons, lightning runs through it]
moves: [Shocking Grasp, Drag to the Mud Nest]
wants: its eggs safe and the riverbank empty — it senses stolen eggs, and comes for them
note: 'A nesting bank is a 6d pool. Ordinary arms take +1t against the shell. Frost drops 1d before the
  pool rolls. Poison, paralysis, and disease do nothing. Its wounds close in water and darkness: fight
  it dry, by daylight.'
source: the-bestiary/beasts-and-wild-things#land-dreugh
body: 'A dreugh in its one year ashore: four legs, two pincers, two near-human arms, and a shell like
  plate, come upriver to breed. Farmers call them billies. Farmers stay indoors.'
---
id: riekling
type: monster
name: Riekling
category: Monsters of the Wild
tier: mook
role: swarmer
sights: a barrel that just moved
sounds: a thrown spear's whistle
smells: boar grease
traits: [bursts from barrels and drifts, devoted to its junk]
moves: [Spear Volley, Boar Rider's Charge]
wants: scavenged treasures and dizzydrink — it will bargain with the patient
note: A band is a 4d pool that arrives from every side. **Boar riders** on bristlebacks are toughs, 
  mount and rider falling as one. A tribe may follow whoever beats its **chief**. Threaten the hoard
  to bait them. By 4E 201 one tribe held Thirsk Mead Hall.
source: the-bestiary/beasts-and-wild-things#riekling
body: "Solstheim's small blue goblins: sharp-toothed, dressed in scraps, and cleverer than the Nords allow.
  They hoard what others throw away and love it fiercely."
---
id: grummite
type: monster
name: Grummite
category: Monsters of the Wild
tier: mook
role: swarmer
sights: wet hide and shell jewelry
sounds: croaking from the root tunnels
smells: pond rot
traits: [mends in water and rain, never far from either]
moves: [Poisoned Volley, Drag into the Pool]
wants: Madness Ore and its egg sacs left alone — not a fight on dry stone
note: "A camp is a 4d pool. While they stand in water, or it rains, the pool can't drop below 1d: draw
  them somewhere dry. **Shamans** and **magi** are toughs with staves, and the magi fade from sight. Locals
  call the baliwog their young."
source: the-bestiary/beasts-and-wild-things#grummite
body: 'The frog-folk of the Shivering Isles: upright, spined, and industrious, with crude blades, poisons,
  totem poles, and a hunger for Madness Ore no one has explained.'
---
id: elytra
type: monster
name: Elytra
category: Monsters of the Wild
tier: tough
role: skirmisher
sights: feelers tasting the air
sounds: a dry rasp of chitin
smells: a sickly sweetness
traits: [its feelers warn it of every blow, walks on water]
moves: [Parry and Sting (4d Elytra Venom), Carry Off the Paralyzed]
wants: a living host for its eggs, kept still — it has no use for the dead
note: "A nest is a 6d pool. Weapon attacks take +1t while its feelers are whole: cut them for a setup.
  The venom is slow, an urgent condition that ends dropped unless treated. A **matron**'s outlasts ordinary
  cures. Some glow green with felldew, and addicts hunt those."
source: the-bestiary/beasts-and-wild-things#elytra
body: A mantis as big as a man, from the root tunnels of the Shivering Isles. It differs between 
  Mania and Dementia only in color.
---
id: gnarl
type: monster
name: Gnarl
category: Monsters of the Wild
tier: tough
role: brute
sights: a stump turned to face you
sounds: creaking like a ship at anchor
smells: sap and wet bark
traits: ['feeds on fire, frost, and shock', never hurries]
moves: [Branch-Fist Slam, Swell and Harden]
wants: the root tunnels whole — it keeps a truce with baliwogs and elytra, and none with you
note: "A grove is a 6d pool. Strike it with fire, frost, or shock and it swells: for a beat that element
  can't drop its pool, and fighting it close takes +1t. But while it holds one element, the other two
  drop 1d before the pool rolls. Alternate. Plain steel works plainly."
source: the-bestiary/beasts-and-wild-things#gnarl
body: A walking tree of the Shivering Isles that tends the great roots under the realm. Throw fire 
  at it and it grows.
---
id: scalon-and-baliwog
type: monster
name: Scalon & Baliwog
category: Monsters of the Wild
tier: tough
role: lurker
sights: ripples crossing still water
sounds: a splash with nothing in it
smells: bog mud and fish rot
traits: [a scalon fades from sight at will, a baliwog mends in water]
moves: [Leap from Nowhere, Bite and Roll Under]
wants: prey at the water's edge — neither hunts far from it
note: "A scalon's first leap from hiding comes at high stakes. Unseen, it still stirs the water: watch
  the ripples for a setup, and answer from range. **Baliwogs** are a 4d pool that can't drop below 1d
  while in water. Both bites carry disease."
source: the-bestiary/beasts-and-wild-things#scalon-and-baliwog
body: The Shivering Isles' swamp things. The baliwog goes on four legs, all teeth and tail. The 
  scalon walks upright and cannot run. It has never needed to.
---
id: skeleton
type: monster
name: Skeleton
category: The Restless Dead & the Blighted
tier: mook
role: swarmer
sights: empty sockets turning toward your torch
sounds: dry clicking on flagstones
smells: grave dust and rust
traits: [obeys simple orders to the letter, blades and frost find little to bite]
moves: [Close From Every Side, Volley From the Back Rank]
wants: its last order carried out — wanting nothing for itself, it never bargains or runs
note: A crypt's rank is a 4d pool. Blades and frost take +1t against bare bone; a mace does not. 
  **Guardians** and **Heroes** are toughs, and a **Champion** calls a lesser one up. Conjured ones 
  vanish when their necromancer falls.
source: the-bestiary/the-dead-the-daedra-and-the-deep#skeleton
body: "A necromancer's cheapest servant: old bones knit together around a borrowed spirit, with no memory
  of who wore them."
---
id: draugr
type: monster
name: Draugr
category: The Restless Dead & the Blighted
tier: mook
role: protector
sights: blue eyes opening in a wall niche
sounds: ancient steel scraping stone
smells: embalming spice and dust
traits: [lies still until you pass, 'fights for the tomb, not its life']
moves: [Rise Behind You, Shield the Sarcophagus]
wants: the tomb unrobbed and its lord undisturbed — it has no interest in the world outside the door
note: "A crypt's worth is a 4d pool; **Restless** and **Wights** are toughs. A **Scourge** shouts — one
  word staggers a whole rank (+1t for a beat) — and a **Deathlord** is a 6d elite with ebony arms and
  a voice that disarms. Fire is the old answer: it drops 1d before the pool rolls."
source: the-bestiary/the-dead-the-daedra-and-the-deep#draugr
body: 'The barrow-dead of the old Nords: dry, patient, and loyal to masters who went into the ground with
  them.'
---
id: ghost-and-wraith
type: monster
name: Ghost & Wraith
category: The Restless Dead & the Blighted
tier: tough
role: trickster
sights: a pale shape half there
sounds: a rising keen
smells: cold air and snuffed candles
traits: ['steel passes through (silver, enchantment, or magic only)', sees the unseen]
moves: [Chilling Touch, Silence of the Grave, Sapping Curse]
wants: its unfinished business finished — answered, avenged, or forgiven, it goes quietly
note: "A haunting is a 6d pool. Morrowind's **ancestor ghosts** are mooks; a crowned **Gloom Wraith**
  is a 6d elite. Force only robs it of the strength to appear: the pool gets a die back each scene until
  its grievance is settled."
source: the-bestiary/the-dead-the-daedra-and-the-deep#ghost-and-wraith
body: The dead who could not leave, held to a tomb, a house, or a grievance. A wraith is one with 
  the grief burned down to rage.
---
id: zombie
type: monster
name: Zombie
category: The Restless Dead & the Blighted
tier: mook
role: brute
sights: a shape missing an arm and not minding
sounds: a wet, patient groan
smells: rot you taste first
traits: ['feels nothing, fears nothing', quicker than it looks]
moves: [Flailing Grab, Bury Them in Bodies, Rake and Infect (Rockjoint)]
wants: whatever its maker pointed it at — it has no opinion, and the maker is usually near
note: "A cellarful is a 4d pool; fire drops 1d before it rolls. **Headless** ones are toughs that never
  needed the head you aimed for. A **Dread Zombie** knits shut: the first time its pool would drop, it
  doesn't."
carries: [Rockjoint]
source: the-bestiary/the-dead-the-daedra-and-the-deep#zombie
body: The shambling dead of Cyrodiil's necromancers, mottled green and coming apart. Raising one is 
  how apprentices apply for a master.
---
id: bonewalker-and-bonelord
type: monster
name: Bonewalker & Bonelord
category: The Restless Dead & the Blighted
tier: tough
role: blaster
sights: bone and metal spikes through open wounds
sounds: a dry rasp
smells: resin and old rot
traits: [bound to the ancestral tomb, curses before it closes]
moves: [Emerge From the Wall, Curse of Weakness, Raking Claws]
wants: the family's dead undisturbed — it has no quarrel with anyone outside the tomb
note: "A tomb's guard is a 6d pool. A **Greater Bonewalker's** curse stays: *Withered Strength*, a long-term
  condition (+1t to lift or swing) until a shrine lifts it. A **Bonelord** is more spirit than bone, a
  6d elite plain steel will not harm."
source: the-bestiary/the-dead-the-daedra-and-the-deep#bonewalker-and-bonelord
body: Morrowind's tomb guardians, raised by sacred rite. The Dunmer do not call it necromancy, and a
  tomb is a poor place to argue.
---
id: lich
type: monster
name: Lich
category: The Restless Dead & the Blighted
tier: elite
role: blaster
sights: a robed husk reading by no light
sounds: a voice like paper tearing
smells: dust, cold wax, old incense
traits: [magic comes as easily as breath once did, commands the lesser dead]
moves: [Storm of Frost and Fire, Raise the Room, Drink a Life]
wants: its studies undisturbed — it hates rivals most, necromancers and other liches alike
note: A 6d challenge; a **Nether Lich** is the lesser, spectral kind. For most, the phylactery was 
  only the door, and smashing it does nothing. Some keep it as an anchor and rise again until it 
  breaks. Learn which first.
source: the-bestiary/the-dead-the-daedra-and-the-deep#lich
body: 'A necromancer who finished the work: soul poured out through a phylactery, flesh left to dry. Most
  are quite mad. All are patient.'
---
id: ash-spawn
type: monster
name: Ash Spawn
category: The Restless Dead & the Blighted
tier: tough
role: brute
sights: a drift of ash that stands up armed
sounds: cinders hissing
smells: hot stone and burnt bone
traits: [rises from under your feet, neither living nor dead]
moves: [Erupt From the Ash, Firebolt, Cinder-Blade Rush]
wants: the living driven off the ash — its will sits in the heart stones
note: A rising is a 6d pool; its first strike comes at high stakes unless someone reads the ground. 
  Strike the ash before it stands to drop 1d before the pool rolls. Fire barely warms it. A wizard's
  **Ash Guardian** is an elite that obeys only with a heart stone.
source: the-bestiary/the-dead-the-daedra-and-the-deep#ash-spawn
body: Solstheim's dead, stood up out of the ashfall by heart stones from Red Mountain. Since the Red
  Year, the ash there has had opinions.
---
id: sixth-house-ash-creature
type: monster
name: Sixth House Ash Creature
category: The Restless Dead & the Blighted
tier: mook–elite
role: brute
sights: a hollow where the face was
sounds: a pleading, half-worded moan
smells: ash and a sweet rot
traits: [not undead (turning does nothing), hears its lord in dreams]
moves: [Spiked Club Frenzy, Bolt From the Hollow Face, Speak the Dream]
wants: to bring you into the dream — it grieves, sincerely, when you refuse
note: '**Ash slaves** and **ash zombies** are 4d mooks, an **ash ghoul** a tough sorcerer, an **ascended
  sleeper** a 6d elite trailing blight. A calming spell stills one long enough to pass. Their hour is
  late Third Era Vvardenfell.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#sixth-house-ash-creature
body: "Dagoth Ur's dreamers made flesh: Dunmer remade by Red Mountain's call, face first. None are dead,
  whatever the names say."
---
id: corprus-beast
type: monster
name: Corprus Beast
category: The Restless Dead & the Blighted
tier: tough
role: brute
sights: a swollen shape dragging one leg
sounds: thick, wet breathing
smells: a sick, yeasty reek
traits: [beyond pain and reason, 'ageless, immune to all other sickness']
moves: [Clubbing Limb, Crushing Embrace, Weep on the Wound]
wants: nothing it could name — a barred door answers it as well as a sword
note: A knot is a 6d pool. **Corprus stalkers** are early cases; a **lame corprus** is further gone 
  and stronger (+1t in close). Not undead. Its touch can pass *Corprus*, a permanent condition no 
  shrine lifts, though a wizard at Tel Fyr is working on it.
carries: [Corprus]
source: the-bestiary/the-dead-the-daedra-and-the-deep#corprus-beast
body: "A victim of the Divine Disease, Dagoth Ur's gift to those too weak for anything better: the mind
  gone, the flesh still growing."
---
id: the-dead-of-the-soul-cairn
type: monster
name: The Dead of the Soul Cairn
category: The Restless Dead & the Blighted
tier: mook
role: swarmer
sights: black bones under a lightning sky
sounds: a wind with voices in it
smells: cold ash
traits: [rises where a Master or conjurer wills, nothing left to lose]
moves: [Ring of Black Bone, Frost From the Mist, Two-Handed Ruin]
wants: your soul, kept — the Ideal Masters call it peace, and mean it
note: '**Bonemen** are a 4d pool; **mistmen** float behind throwing frost; **wrathmen** are toughs in
  Nord plate. A **Keeper** is a 6d elite in dragonbone, draining penned souls to hold a barrier. Summoned
  ones vanish with their conjurer.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#the-dead-of-the-soul-cairn
body: Undead of the Ideal Masters' gray realm, where black soul gems send their souls — lent to 
  necromancers who think the bargain runs one way.
---
id: skinned-hound-and-shambles
type: monster
name: Skinned Hound & Shambles
category: The Restless Dead & the Blighted
tier: mook–tough
role: predator
sights: red muscle with no hide over it
sounds: wire creaking on bone
smells: tallow and frost
traits: ['built, not born', the shambles carries winter inside it]
moves: [Run the Quarry Down, Frost-Laden Claw, Burst in Ice]
wants: an end to the living — though a shambles spares a Zealot's robes, or a fair copy
note: 'Hounds are a 4d pool behind a **Greater** hound. A shambles is the tough: when its pool empties
  it bursts in frost, and all in reach take a mark unless it was broken from range. **Decrepit** ones
  lack an arm.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#skinned-hound-and-shambles
body: 'Stitched things of the Shivering Isles: flayed hounds prowling the ruins, and shambles of bone
  lashed with wire and rag under a horse-like skull.'
---
id: scamp
type: monster
name: Scamp
category: Daedra
tier: mook
role: trickster
sights: a hunched thing with a rat's tail
sounds: chittering in no tongue you know
smells: singed hair and sulfur
traits: ['cowardly alone, bold in a pack', 'clever hands, simple thoughts']
moves: [Fireball and Run, Snatch and Scamper, Turn the Spell Back]
wants: mischief and a whole skin — it will flee, grovel, or carry your bags before dying for anyone
note: A pack is a 4d pool; **stunted** ones barely count. Most serve Mehrunes Dagon; any Prince will
  do. Like all Daedra it is banished, not killed, and it remembers. One in Caldera kept shop and 
  never haggled.
source: the-bestiary/the-dead-the-daedra-and-the-deep#scamp
body: 'The rats of Oblivion: small, tailed, and able to wriggle through gaps between worlds that would
  stop anything with dignity.'
---
id: clannfear
type: monster
name: Clannfear
category: Daedra
tier: tough
role: predator
sights: a crest dipping to charge
sounds: a screech like torn tin
smells: reptile musk and old blood
traits: [runs prey down by scent, hide that turns part of a blow back]
moves: [Crest-First Charge, Pounce and Pin, Tail-Spike Lash]
wants: to hook something and eat it alive — wounds do not stop it, but it can be led by the nose
note: 'One is a hard fight; a hunting flock is a 6d pool, sometimes under a matriarch. **Runts** are mooks.
  Shock is the answer for most beasts of Oblivion: it drops 1d before the pool rolls. Dremora train them
  to course mortals for sport.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#clannfear
body: A two-legged lizard, all beak, talons, and bony crest. Every Prince keeps legions of them. 
  Dagon gets the blame.
---
id: daedroth
type: monster
name: Daedroth
category: Daedra
tier: tough
role: brute
sights: a scaled snout with smoke between the teeth
sounds: a hiss rising to a roar
smells: scorched meat and river mud
traits: [wards itself with a spell before it fights, 'hard to command, even for Dremora']
moves: [Breath of Flame, Clawed Maul, Jaws That Hold On]
wants: to break what is in front of it — a strong will can master one, briefly, and it resents that
note: A pair is a 6d pool. Shock drops 1d before the pool rolls; dispel its ward or take +1t on the 
  opening blows. The proper singular of Daedra is also daedroth, and scholars will stop a fight to 
  say so.
source: the-bestiary/the-dead-the-daedra-and-the-deep#daedroth
body: A crocodile's head on a hulking upright body, with a furnace for a throat. Most answer to 
  Molag Bal. Few answer well.
---
id: flame-atronach
type: monster
name: Flame Atronach
category: Daedra
tier: tough
role: blaster
sights: a burning figure adrift above the floor
sounds: a hearth-roar
smells: brimstone and singed air
traits: ['floats, and keeps its distance', flame does nothing to it]
moves: [Firebolt From Afar, Cloak of Flame, Glide Out of Reach]
wants: to obey the summons and go home — unbound, it burns things because things burn
note: 'Close the distance and it falters; frost drops 1d before its pool rolls. When the pool empties
  it bursts: all in reach take a mark unless it was finished from range. End the conjurer or the spell
  and a bound one is gone.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#flame-atronach
body: An elemental of Infernace shaped like a dancer in black iron. It burns you from across the 
  room, and is good at staying across the room.
---
id: frost-atronach
type: monster
name: Frost Atronach
category: Daedra
tier: tough
role: protector
sights: blue ice filling the doorway
sounds: groaning, cracking footfalls
smells: cold that stings the teeth
traits: [a wall that walks, its cold slows whoever stands near]
moves: [Fist Like a Falling Wall, Stand Between, Knit Its Ice]
wants: to hold the ground it was set on — it has no reach and will not chase far
note: 'Fighting it in close takes +1t from the cold; fire drops 1d before its pool rolls. While it stands,
  the straight road to its conjurer is shut: find a crooked one, since ending the spell ends the atronach.
  Arrows from a ledge baffle it.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#frost-atronach
body: A giant of living ice, slow as a glacier and as easy to argue with. Conjurers stand behind 
  them. That is what they are for.
---
id: storm-atronach
type: monster
name: Storm Atronach
category: Daedra
tier: elite
role: blaster
sights: boulders orbiting a blue-white glare
sounds: thunder with no sky above it
smells: rain on hot stone
traits: ['hovers, even over water', no weakness worth the name]
moves: [Chain Lightning, Thunderous Slam, Shocking Touch]
wants: whatever the binding says — the Psijics have them water crops, with the same care
note: "A 6d challenge. Its lightning arcs: each suspense spent on it can strike two heroes standing close,
  so spread out. Fight the binding — break the conjurer's hold or banish it with a rite, and the stones
  drop where they hang."
source: the-bestiary/the-dead-the-daedra-and-the-deep#storm-atronach
body: 'A shattered statue whirling about a core of lightning: the strongest of the common atronachs, called
  when the argument is over.'
---
id: dremora
type: monster
name: Dremora
category: Daedra
tier: tough
role: tactician
sights: black spiked plate and a horned face
sounds: a deep, watery voice
smells: hot iron, burnt leather
traits: [contempt for mortals (it can be goaded), fights by rank]
moves: [Blazing Greatsword, Send the Churls In, Remember Your Face]
wants: honor before clan and Prince — it keeps oaths to the letter and grudges forever
note: "**Churls** and **Caitiffs** are 4d rabble; a **Kynval** is the tough here. While a **Kynreeve**
  or **Kynmarcher** commands, the pool can't drop below 1d. A **Markynaz** or **Valkynaz** is an 8d lord.
  Slain is only banished, and the Kyn remember."
source: the-bestiary/the-dead-the-daedra-and-the-deep#dremora
body: 'The Kyn: horned war-spirits sworn to Mehrunes Dagon by clan and oath, who regard mortals as something
  on a boot.'
---
id: xivilai
type: monster
name: Xivilai
category: Daedra
tier: elite
role: brute
sights: a two-handed blade swung in one fist
sounds: bellowed promises of flaying
smells: ozone and scorched stone
traits: [drinks in spells thrown at it, 'fights alone, for its own glory']
moves: [Summon a Clannfear, Greatsword Sweep, Fire and Lightning]
wants: deference and a worthy fight — slighted by its own side, it may change sides
note: A 6d challenge, and the clannfear it calls is a second problem. Spells aimed at it take +1t 
  and feed it; steel and shock serve better. It will not coordinate, so a disciplined party that 
  cuts it off earns a setup.
source: the-bestiary/the-dead-the-daedra-and-the-deep#xivilai
body: Blue-gray, yellow-eyed, and furious at most things, its own reflection included. It bows only 
  to a Prince, usually Dagon or Molag Bal.
---
id: spider-daedra
type: monster
name: Spider Daedra
category: Daedra
tier: elite
role: trickster
sights: eight legs under a pale, smiling face
sounds: taut silk and a bright laugh
smells: venom and attic dust
traits: [keeps her distance behind her brood, 'talks freely, means little']
moves: [Summon a Spiderling, Lightning From Afar, Cocoon the Prize]
wants: amusement, ornaments, and food for her brood — any bargain she offers is part of the web
note: A 6d challenge. A spiderling's spit paralyzes; kill it and she stops to conjure another, a 
  setup for whoever is ready. Frost or shock drops 1d before her pool rolls. A cocoon opens only 
  from outside.
source: the-bestiary/the-dead-the-daedra-and-the-deep#spider-daedra
body: "A woman's torso on a giant spider's body: Mephala's kind, though so unruly that even the Spinner's
  cults will not trust one."
---
id: winged-twilight
type: monster
name: Winged Twilight
category: Daedra
tier: tough
role: skirmisher
sights: wide wings against a red sky
sounds: a shriek that leaves the ears ringing
smells: mint and cold stone
traits: [strikes from the air and is gone, spells slide off or come back]
moves: [Deafening Shriek (vex — freeze), Hooked Tail, Snatch and Carry]
wants: its message delivered — one that fancies a mortal keeps him, fondly, in the ruins
note: A nest under a matriarch is a 6d pool. Indoors or brought to ground it falters; fouled wings 
  are a setup worth making. Ask for the message before drawing steel — Azura's errands are not 
  always about you.
source: the-bestiary/the-dead-the-daedra-and-the-deep#winged-twilight
body: "Azura's messengers: blue-skinned, bat-winged, and lovely until the tail comes round. Sometimes
  they carry off the listener."
---
id: golden-saint-and-dark-seducer
type: monster
name: Golden Saint & Dark Seducer
category: Daedra
tier: elite
role: protector
sights: gold plate or dark mail
sounds: a clipped order in a ringing voice
smells: amber resin, wet stone
traits: [holds her post to the letter, shrugs off most magic]
moves: [Shield Wall at the Gate, Mace and Blade, Summary Punishment]
wants: the Madgod's favor and her rivals' disgrace — play one side against the other
note: A 6d challenge. Saints are quick to anger, Seducers slow, neither safe. Slain, each re-forms 
  at her Wellspring — Brellach or Pinnacle Rock — so the pool is whole next session unless the 
  spring is fouled.
source: the-bestiary/the-dead-the-daedra-and-the-deep#golden-saint-and-dark-seducer
body: "Sheogorath's rival guards: the Aureal hold Mania in winged gold, the Mazken Dementia in dark mail.
  Each is sure the Madgod loves her best."
---
id: hunger
type: monster
name: Hunger
category: Daedra
tier: tough
role: lurker
sights: a starved white shape on the ceiling
sounds: wet lapping, then silence
smells: bile and cold sweat
traits: [steps out of nowhere, its touch rots steel and leather]
moves: [Strength-Drinking Tongue, Corrode the Blade, Paralyzing Claw]
wants: warm flesh with nothing in the way — it strips a meal before it eats
note: 'A lair is a 6d pool. Its worst move takes gear, not blood: a weapon or piece of armor is ruined
  (+1t to use) until a smith mends it. Bring what you can afford to lose. The Isles breed them from **Starved**
  mooks to **Voracious** elites.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#hunger
body: A gaunt, pale Daedra with a mouth that never closes and a whip of a tongue. Boethiah's, say 
  the Dunmer; some roam the Shivering Isles.
---
id: ogrim
type: monster
name: Ogrim
category: Daedra
tier: tough
role: brute
sights: a fat-faced giant ducking the lintel
sounds: chest-thumps like a cellar drum
smells: sour sweat
traits: [enormous and dim, wounds close when it pounds its chest]
moves: [Two-Fisted Smash, Belly Charge, Thump and Mend]
wants: something to torment — it obeys whoever holds its nose-shackle and bullies everyone else
note: A pair is a 6d pool. Given a quiet beat to pound its chest, its pool gets a die back — crowd 
  it, or bait it into something stupid, which is not difficult. An **Ogrim Titan** is a 6d elite. A 
  narrow doorway is as good as a wall.
source: the-bestiary/the-dead-the-daedra-and-the-deep#ogrim
body: "A mountain of belly under a small, pleased face: Malacath's brute, sent to menace the living for
  a Prince's amusement."
---
id: seeker
type: monster
name: Seeker
category: Daedra
tier: elite
role: trickster
sights: smoke where a shape just was
sounds: a lisping murmur and turning pages
smells: ink, brine, old vellum
traits: [fades to a smoky shadow, feeds on what you know]
moves: [Mirror Image, Drain Magicka and Wind, Mind-Emptying Shriek]
wants: the books kept from the unworthy — keep your distance and it may only watch
note: A 6d challenge. The image is a 4d pool that vanishes with its maker; striking the true one 
  takes +1t until the trick is exposed. Its drain lands as marks, on spellcasters first. **High 
  Seekers** are worse.
source: the-bestiary/the-dead-the-daedra-and-the-deep#seeker
body: "Hermaeus Mora's librarians in Apocrypha: drifting knots of tentacles, each with a conjured book.
  They guard what should not be read, and have read it."
---
id: lurker-daedra
type: monster
name: Lurker
category: Daedra
tier: elite
role: brute
sights: a tall shape rising from an ink-dark pool
sounds: a wet, gargling roar
smells: brine and rotting kelp
traits: [waits beneath the water, slick flesh that closes its wounds]
moves: [Stomp That Staggers, Spew Tendrils, Spit Black Bile (4d Acid)]
wants: forbidden knowledge kept forbidden — leave the shelves alone and it may sink back
note: A 6d challenge; its first strike, out of the pool, comes at high stakes. The pool gets a die 
  back each scene unless a lingering poison keeps its wounds open. It can be paralyzed, or toppled 
  off a ledge into its own sea.
source: the-bestiary/the-dead-the-daedra-and-the-deep#lurker-daedra
body: A fish-faced giant from Apocrypha's black waters, all needle teeth. Mora keeps them under the 
  surface until someone trespasses.
---
id: flesh-atronach
type: monster
name: Flesh Atronach
category: Daedra
tier: tough
role: brute
sights: stitches straining over a shoulder that was two people
sounds: a lungless bellow
smells: spoiled meat
traits: [spells thrown at it feed it, poison heals it]
moves: [Crushing Arm, Hurl Fire, Sickening Aura]
wants: to kill and feed, in that order — whoever raised it is the one with plans
note: 'A few are a 6d pool. The first spells to strike it drop no die, and poison gives one back: use
  steel. Turning and banishing both grip it. The Shivering Isles breed them from **Mangled** mooks to
  **Mended** elites; their **Gatekeeper** is an 8d boss.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#flesh-atronach
body: A hulk of mismatched skin and muscle sewn into a man's shape, collared, sigil-marked, and worn
  by a Daedric spirit like a coat.
---
id: knight-of-order
type: monster
name: Knight of Order
category: Daedra
tier: tough
role: protector
sights: crystal plate without a scratch of ornament
sounds: a metallic screech
smells: no smell at all
traits: ['mindless, fearless', drawn to obelisks like flies to honey]
moves: [Advance in Line, 'Exact, Unhurried Blade', Another Steps Out]
wants: everything still, gray, and in place — no one in there to bargain with
note: A 6d pool that can't drop below 1d while its obelisk is active. Three **Hearts of Order**, cut
  from fallen knights, overload it. Its **Priest of Order** is an elite who rises again while it 
  stands. Hearts first, then the priest.
source: the-bestiary/the-dead-the-daedra-and-the-deep#knight-of-order
body: Jyggalag's crystal soldiers, marching from the obelisks when the Greymarch comes to the 
  Shivering Isles. Nothing in them thinks.
---
id: dwarven-spider
type: monster
name: Dwarven Spider
category: Dwemer Animunculi
tier: mook
role: swarmer
sights: brass legs unfolding from a pipe mouth
sounds: ticking and venting steam
smells: hot oil
traits: [pours out of the pipework, mends other machines]
moves: [Leaping Leg-Stab, Jolt of Lightning, Patch Up the Big One]
wants: the halls kept in order — an intruder is a fault to correct, nothing personal
note: A hall's worth is a 4d pool. While spiders are left to work, a larger machine's pool can't 
  drop below 1d. Charged ones burst in sparks; Morrowind's **centurion spiders** puff poison. A 
  control rod, or the Dwemer's tricks, tells them to stop.
source: the-bestiary/the-dead-the-daedra-and-the-deep#dwarven-spider
body: "The Dwemer's maintenance staff, still on shift: brass spiders mending halls no one walks. Trespassers
  are filed under repairs."
---
id: dwarven-sphere
type: monster
name: Dwarven Sphere
category: Dwemer Animunculi
tier: tough
role: skirmisher
sights: a sphere rolling too purposefully
sounds: plates clacking open
smells: steam and scorched oil
traits: [built for war, lunges faster than a man can sidestep]
moves: [Unfold and Lunge, Crossbow Arm, Roll Away and Come Round]
wants: the patrol route clear — it has no interest in the world outside its ruin
note: A patrol is a 6d pool. Its lunge from a pipe port lands as a strike unless someone watched the
  walls. Pinned — a wedged ball, a narrow stair — it falters. Morrowind's **centurion spheres** 
  carry sword and shield.
source: the-bestiary/the-dead-the-daedra-and-the-deep#dwarven-sphere
body: A brass ball rolling its patrol until something offends it. Then the shell splits and a 
  half-man of blades rises out, already moving.
---
id: dwarven-ballista
type: monster
name: Dwarven Ballista
category: Dwemer Animunculi
tier: tough
role: marksman
sights: a brass frame braced at the gallery's far end
sounds: a windlass ratcheting, then a crack
smells: oil and brass
traits: [bolts ignore armor and stagger, slow to rewind]
moves: [Bolt Through the Shield, Scuttle Back, Knock Off the Walkway]
wants: a clear lane and a long hall — it has no plan for anything standing next to it
note: 'A battery is a 6d pool. Anything tried across its open lane takes +1t. The answer is the reload:
  let it shoot, then run. Closing while it rewinds is a setup, and in reach it falters.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#dwarven-ballista
body: A siege crossbow on brass legs, met mostly in Solstheim's ruins. It keeps the hall's length 
  from you and puts a bolt through your cover.
---
id: dwarven-centurion
type: monster
name: Dwarven Centurion
category: Dwemer Animunculi
tier: elite
role: brute
sights: a colossus stepping from its cradle
sounds: a boiler's rising whistle
smells: hot metal
traits: [sleeps in a gantry, cannot strike what stands under its arms]
moves: [Hammer and Axe, Steam Breath, Stride Through the Line]
wants: what lies behind it kept shut — it has stood watch since the Dwemer vanished
note: A 6d challenge; striking it in the gantry is a setup. Morrowind's **steam centurions** are 
  man-sized. The **Forgemaster** of the Aetherium Forge breathes fire, and frost drops 1d before its
  pool rolls. The dynamo core is the prize.
source: the-bestiary/the-dead-the-daedra-and-the-deep#dwarven-centurion
body: 'The largest thing the Dwemer left running: a brass giant with hammer and axe for hands, asleep
  until the wrong lever is pulled.'
---
id: falmer
type: monster
name: Falmer
category: The Deep
tier: mook
role: lurker
sights: pale skin and dead black eyes
sounds: clicking in the walls
smells: a stench that comes first
traits: ['blind, and hears a held breath', poisons every blade]
moves: [Ambush From the Wall, Poisoned Chitin Blade (4d Poison), Loose the Chaurus]
wants: the surface folk dead and the dark kept theirs — they take captives, unkindly
note: 'A warren is a 4d pool. Blindness is the lever: move in silence and you are not there; a noise elsewhere
  is a setup. **Skulkers** and **Gloomlurkers** are toughs, **Shadowmasters** elites; a **Warmonger**
  leads a tribe.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#falmer
body: "What became of the Snow Elves who took the Dwemer's shelter at the Dwemer's price: blind, hunched,
  and hunting by sound under Skyrim."
---
id: chaurus
type: monster
name: Chaurus
category: The Deep
tier: tough
role: lurker
sights: glowing blue feelers in the dark
sounds: chittering off the cave roof
smells: acrid venom and wet stone
traits: [clings to walls and ceilings, will not willingly cross water]
moves: [Spit Acid (4d Chaurus Venom), Crushing Mandibles, Drop From the Roof]
wants: prey to crush and somewhere to lay its eggs — sometimes one answer serves both
note: "A nest is a 6d pool. The spit eats armor: whoever it soaks loses their armor's help for the scene.
  Knee-deep water stops it at the bank. A **Chaurus Reaper** is a 6d elite, old and enormous."
source: the-bestiary/the-dead-the-daedra-and-the-deep#chaurus
body: A black, armored earwig as big as a hound and often bigger, bred by the Falmer for chitin and 
  kept as a guard dog that finds its own meals.
---
id: chaurus-hunter
type: monster
name: Chaurus Hunter
category: The Deep
tier: tough
role: skirmisher
sights: a cocoon twitching on the wall
sounds: wings droning in the dark
smells: acrid venom overhead
traits: [hovers out of reach, spits faster and farther than its kin]
moves: [Burst From the Husk, Strafing Spit (4d Venom), Dive and Lift Away]
wants: to hunt on the wing — it answers to no Falmer and takes whatever runs
note: 'A flight is a 6d pool. A cocoon is a warning and a chance: burn it before it opens and that hunter
  never joins. In open caverns it has every advantage; in a low tunnel it is pinned and falters. **Fledglings**
  are mooks.'
source: the-bestiary/the-dead-the-daedra-and-the-deep#chaurus-hunter
body: 'What an old chaurus becomes: after days still as death, the husk splits and something lean and
  winged climbs out, already hungry.'
---
id: gargoyle
type: monster
name: Gargoyle
category: The Deep
tier: tough
role: brute
sights: one statue with fresher dust at its feet
sounds: stone cracking like ice
smells: chalk and old blood
traits: [stone until it isn't (and unharmed while it is), claws drink life]
moves: [Burst From Stone, Rending Claws, Wing-Buffet and Pin]
wants: its master's threshold kept — it serves the blood that woke it, and nothing else
note: A gallery is a 6d pool; the first strike comes at high stakes unless someone marked the right 
  statue, and a spell that seeks life or souls will. When its claws draw blood, its pool gets a die 
  back. A **Brute** is an elite.
source: the-bestiary/the-dead-the-daedra-and-the-deep#gargoyle
body: 'A statue with blood in it: stone woken by a wizard or, more often, a vampire, and set among carvings
  to wait. It waits very well.'
---
id: fabricant
type: monster
name: Fabricant
category: The Deep
tier: tough
role: predator
sights: metal legs under living muscle
sounds: pistons hissing with each breath
smells: oil and raw meat
traits: [flesh and metal in one frame, mends its own damage]
moves: [Spinning Rush, Horn or Stinger, Burst Apart at the Last]
wants: prey, by design — it was made to hunt and never told to stop
note: "**Verminous** ones are lean and quick: a pack is a 6d pool that gets a die back each scene it is
  left alone. A **Hulking** one is an elite, a small dragon with a scorpion's tail. Almalexia loosed both
  on Mournhold late in the Third Era."
source: the-bestiary/the-dead-the-daedra-and-the-deep#fabricant
body: "Sotha Sil's half-machine beasts: tank-grown flesh grafted to metal, the Clockwork City's first
  draft of the perfect animal. The draft has teeth."
---
id: bandits
type: monster
name: Bandits
category: Outlaws & Cults
tier: mook
role: brute
sights: a lookout on a broken tower
sounds: dice, dogs, a quarrel over shares
smells: woodsmoke and cheap mead
traits: [brave in numbers, loyal as far as the loot goes]
moves: [Demand the Toll, Rush the One in Robes]
wants: your purse without a fight — and no part of anyone who looks expensive to kill
note: A camp is a 4d pool that runs or yields at half. Fell the **Bandit Chief**, a tough in the 
  only good armor, and the pool drops 1d. Cyrodiil's **highwaymen** ask a hundred septims and leave 
  politely; **marauders** are toughs in plate who hate bandits worse than you do.
source: the-bestiary/folk-under-arms#bandits
body: Deserters, debtors, and cutthroats camped in other people's forts. Most would rather have your
  coin than your corpse.
---
id: forsworn
type: monster
name: Forsworn
category: Outlaws & Cults
tier: mook
role: skirmisher
sights: antlers on the skyline
sounds: war cries down a gorge
smells: juniper smoke, old blood
traits: [know every goat path, fight as if already dead]
moves: [Arrows from the Crags, Twin Axes Down the Slope]
wants: the Reach, and every Nord out of it — coin means nothing, and Bretons are seldom targets
note: "A redoubt is a 4d pool. Its **Briarheart**, a 6d elite, has a briar seed for a heart: the first
  time his pool would drop, it doesn't, unless someone goes for the seed. A **hagraven** matriarch commands;
  only **Madanach**, the King in Rags, can call a truce."
source: the-bestiary/folk-under-arms#forsworn
body: Reachmen driven from Markarth in 4E 176, raiding from cliff redoubts in bone, fur, and antler.
  They refuse every peace.
---
id: necromancer-coven
type: monster
name: Necromancer Coven
category: Outlaws & Cults
tier: tough
role: blaster
sights: candles in a ruined chapel
sounds: the click of walking bone
smells: embalming salts and earth
traits: [the dead stand in front, every corpse is a spare]
moves: [Raise What You Just Killed, Frost from Behind the Bones]
wants: bodies, black soul gems, and privacy — not witnesses, and never a fair fight
note: The risen are a 4d pool that gets a die back when anything dies nearby; the coven behind is 
  6d, and its dead fall with it. A **Worm Anchorite** leads a cell; an **Arch Necromancer** is a 6d 
  elite. Cornered, most trade a secret for their lives.
source: the-bestiary/folk-under-arms#necromancer-coven
body: Adepts of the Order of the Black Worm, or outcasts who wish they were, working behind a front 
  line buried last winter.
---
id: hedge-wizards
type: monster
name: Hedge Wizards
category: Outlaws & Cults
tier: tough
role: blaster
sights: scorch marks on a cave roof
sounds: a summoning circle humming
smells: burnt hair
traits: ['one element, mastered', brittle once out of magicka]
moves: ['Wall of Fire, Frost, or Lightning', Atronach in the Way]
wants: to finish the work unobserved — and, secretly, an audience that understands it
note: A lair is a 6d pool at +1t until you close in. **Pyromancers**, **Cryomancers**, and 
  **Electromancers** differ only in the scar; a **Conjurer** stands behind an atronach that vanishes
  with its summoner. Flattery, a rare tome, or a pardon ends most fights.
source: the-bestiary/folk-under-arms#hedge-wizards
body: Rogue mages — expelled, unlicensed, or self-taught — in caves and Ayleid cellars where no one 
  can call the work unsafe.
---
id: witch-coven
type: monster
name: Witch Coven
category: Outlaws & Cults
tier: elite
role: trickster
sights: antlered root-idols
sounds: a raven that answers back
smells: a boiling pot
traits: [never where the voice is, bargains with a second clause]
moves: [Wear the Wolf or the Raven, Lay a Curse (4d Wyrd-Curse)]
wants: balance as they reckon it, paid in full — a bargain before a blow
note: A coven is a 6d challenge; on home ground, the first time its pool would drop, it doesn't. The
  **matriarch** is often a hagraven. Ask first, pay in full, and they deal fairly. Skyrim's last 
  coven (4E 201) is all hagravens, and their severed heads hold the wolf's cure.
source: the-bestiary/folk-under-arms#witch-coven
body: "Sisters of the Glenmoril Wyrd: Breton nature-witches, mostly Hircine's, who sell cures for the
  wolf and the thirst."
---
id: mythic-dawn-agent
type: monster
name: Mythic Dawn Agent
category: Outlaws & Cults
tier: mook
role: lurker
sights: a red robe under the floorboards
sounds: '"Greet the new day"'
smells: brimstone, then armor
traits: [nobody you would suspect, armored from nowhere]
moves: [Call the Bound Armor, Bound Mace in the Back]
wants: Lord Dagon's dawn over Tamriel — death is no threat to those promised Paradise
note: "A cell is a 4d pool, its first strike at high stakes; dispel or stun an agent and the bound plate
  is gone. They never yield, but each has a cover to lose: name one in public and the Watch does the rest.
  A shrine's **Warden** is a 6d elite. Late Third Era."
source: the-bestiary/folk-under-arms#mythic-dawn-agent
body: "The baker, the bookseller, the count's clerk: sleepers sworn to Mehrunes Dagon, living quietly
  until the Master sends word."
---
id: dragon-cultists
type: monster
name: Dragon Cultists
category: Outlaws & Cults
tier: mook
role: blaster
sights: a bone mask under a hood
sounds: a polite question about your name
smells: ash and scorched wool
traits: [masked and alike, certain beyond argument]
moves: [Firebolts on the Open Road, Call an Atronach]
wants: the False Dragonborn dead and Miraak pleased — anyone else may walk on
note: A pair is a 4d pool; a temple's worth is 6d under a tough **Master Cultist** or **Arch 
  Cultist**. They ask before they strike and want one name only, and the orders in their robes say 
  who sent them (4E 201). The old Dragon Cult died at Forelhost by its own hand.
source: the-bestiary/folk-under-arms#dragon-cultists
body: Masked zealots sent from Solstheim in pairs to kill whoever is being called Dragonborn. Their 
  master does not share the title.
---
id: sixth-house-dreamers
type: monster
name: Sixth House Dreamers
category: Outlaws & Cults
tier: mook
role: swarmer
sights: an ash statue
sounds: '"I am a Sleeper, one among thousands"'
smells: red candle smoke
traits: [asleep on their feet, death is only waking]
moves: [Swarm from Every Side, The Master's Voice (vex)]
wants: outlanders gone, all Dunmer in the House — the one inside wants only to wake
note: "Dreamers are a 4d pool. Spare the Sleepers: they are victims, and wake appalled when the nearest
  shrine's priest dies. That priest is an **ash ghoul** or **ascended sleeper** (see Sixth House Ash Creature),
  and its dying curse may be corprus. Late Third Era."
source: the-bestiary/folk-under-arms#sixth-house-dreamers
body: Dunmer whose sleep belongs to Dagoth Ur. Sleepers walk the towns by night with his messages; 
  Dreamers wait in caves with clubs.
---
id: the-afflicted
type: monster
name: The Afflicted
category: Outlaws & Cults
tier: mook
role: swarmer
sights: skin flushed like a healing burn
sounds: wet coughing behind brass doors
smells: bile
traits: ['weak alone, many together', their breath carries the gift]
moves: [Vomit Bile (4d The Affliction), 'Stagger On, Praying']
wants: to keep the gift and wait in peace — they attack trespassers, not travelers
note: "A hallful is a 4d pool, +1t within arm's reach. A healer can cure the Affliction; they refuse.
  Their shepherd **Orchendor**, a 6d elite, blinks about the room and shrugs off spells. Peryite wants
  him dead: prove it and the flock wavers (4E 201)."
source: the-bestiary/folk-under-arms#the-afflicted
body: Bretons "blessed" by Peryite with a wasting plague and gathered in a Dwemer ruin to await his 
  word. They share the gift freely.
---
id: pirates-and-reavers
type: monster
name: Pirates & Reavers
category: Outlaws & Cults
tier: mook
role: brute
sights: a longboat beached and empty
sounds: oars, then axes at the door
smells: tar and brine
traits: [bold near their ship, every one has a price]
moves: [Board in a Rush, Grab the Cargo and Run]
wants: plunder, ransom, and open water — they fear nothing like their own ship burning
note: A crew is a 4d pool; threaten the boat and they break off to save it. The **Captain** or 
  **Reaver Lord** is a tough who sells passage, silence, or a rival. The Blood Horkers' **Haldyn**, 
  a 6d elite mage, hides his isle in fog and spares shippers who pay (4E 201).
source: the-bestiary/folk-under-arms#pirates-and-reavers
body: Raiders of the Sea of Ghosts. Skyrim's Blood Horkers take ships; Solstheim's reavers land, 
  strip a camp, and go with the tide.
---
id: skooma-runners
type: monster
name: Skooma Runners
category: Outlaws & Cults
tier: mook
role: trickster
sights: addicts licking their teeth
sounds: '"Something to help you relax"'
smells: scorched sugar
traits: [a guard is on the payroll, customers fight for it]
moves: [Out Through the Cellar, Dose the Cup (4d Skooma Haze)]
wants: the shipment through, no snitches — they would sooner bribe than stab
note: 'A den or mule train is a 4d pool; the addicts fold for a hard word or a free bottle. The **Dealer**
  would rather pay you than bury you. Behind them stands worse: the Camonna Tong, or in the Rift, vampires
  farming addicts on **Redwater** skooma.'
source: the-bestiary/folk-under-arms#skooma-runners
body: 'Smugglers, den-keepers, and dealers in moon sugar and the skooma boiled from it: banned, and worth
  more than the lives it eats.'
---
id: vampire-clan
type: monster
name: Vampire Clan
category: The Night's Children
tier: tough
role: lurker
sights: a town where everyone is tired
sounds: footsteps with no breath
smells: cold earth
traits: [faster than the living, sunlight and fire undo them]
moves: [Feed (4d Porphyric Hemophilia), Loose the Death Hounds]
wants: blood, secrecy, and a docile herd — they fear exposure more than steel
note: "A lair is a 6d pool behind 4d of **thralls**, who are victims. **Fledglings** are mooks, an **Ancient**
  an elite. Daylight or fire drops 1d before the pool rolls. Rival clans sell each other: Skyrim's **Volkihar**,
  Cyrodiil's **Vampyrum Order**, Vvardenfell's **Aundae**, **Berne**, and **Quarra**."
carries: [Sanguinare Vampiris]
source: the-bestiary/folk-under-arms#vampire-clan
body: One elder's bloodline and the living it keeps, feeding too carefully to be noticed.
---
id: master-vampire
type: monster
name: Master Vampire
category: The Night's Children
tier: elite
role: trickster
sights: a host who never drinks
sounds: your own voice agreeing
smells: roses over a cold cellar
traits: [thralls stand between, never surprised at home]
moves: [Charm with a Look (vex), 'Mist, Then Elsewhere']
wants: a quiet domain and useful guests — it would rather own you than kill you
note: A 6d challenge; the first time its pool would drop, it turns to mist instead. Break the charm 
  and its court is a room of witnesses. With a town to lose and rivals to fear, it bargains. In 
  Cyrodiil, a **Patriarch** or **Matriarch**; a pure-blood **Vampire Lord** is an 8d boss.
source: the-bestiary/folk-under-arms#master-vampire
body: 'The elder at the head of the table: centuries old, well mannered, and three moves into a plan for
  your town.'
---
id: werewolf-pack
type: monster
name: Werewolf Pack
category: The Night's Children
tier: tough
role: predator
sights: wolf tracks ending in bare footprints
sounds: a howl answered twice
smells: musk and blood
traits: [knock grown warriors flat, a person under the pelt]
moves: [Run the Slowest Down, Howl Up the Wolves (4d Wolves)]
wants: the hunt and the pack's ground — the one inside may want a cure, or just peace
note: A pack is a 6d pool; silver or wolfsbane drops 1d before it rolls. Its bite carries Sanies 
  Lupinus. The **alpha**, a 6d elite, makes the pack's law. By day you can talk to people instead. 
  Solstheim's **werebears** are bigger and want your honey.
carries: [Sanies Lupinus]
source: the-bestiary/folk-under-arms#werewolf-pack
body: "Hircine's children: folk who put on the beast by night, hunt as one, and wake at dawn bloody and
  not always sorry."
---
id: the-silver-hand
type: monster
name: The Silver Hand
category: The Night's Children
tier: mook
role: tactician
sights: wolf heads on pikes
sounds: something large pacing a cage
smells: silver polish and old straw
traits: [silver on every blade, prepared for worse than you]
moves: ['Net, Pin, and Question', Loose the Thing in the Cage]
wants: every werewolf skinned and Jorrvaskr shamed — and, lately, any ransom going
note: A lodge is a 4d pool; against the beast blood its blades land at high stakes. A leader like 
  **Krev the Skinner** is a tough who collects pelts. They deal for a werewolf's name or a shard of 
  Wuuthrad, and plain travelers can buy their way out (4E 201).
source: the-bestiary/folk-under-arms#the-silver-hand
body: Skyrim's werewolf hunters, who began with a cause and kept only the knives. They know what the
  Companions' Circle is.
---
id: vigilants-of-stendarr
type: monster
name: Vigilants of Stendarr
category: The Night's Children
tier: tough
role: protector
sights: robes over steel gauntlets
sounds: a blessing like a warning
smells: lamp oil and salve
traits: [heal between blows, can smell a Daedric bargain]
moves: [Ward the Line and Advance, Mace the Abomination]
wants: Daedric relics destroyed, their keepers repentant — mercy is offered once, before the mace
note: A patrol is a 6d pool that gets a die back each scene unless its healer falls. A **Keeper of 
  the Vigil** leads each province. Surrender the relic or submit to questioning and no one bleeds; 
  vampires and the unrepentant get no terms.
source: the-bestiary/folk-under-arms#vigilants-of-stendarr
body: Fourth Era priests-militant who hunt Daedra and all they leave behind. They cure your fever 
  free, then ask about that amulet.
---
id: the-dawnguard
type: monster
name: The Dawnguard
category: The Night's Children
tier: tough
role: marksman
sights: a crossbow levelled before hello
sounds: a troll snuffling in its armor
smells: wet dog
traits: [bolts punch through plate, used to faster prey]
moves: [Volley from Three Sides, Loose the Armored Troll]
wants: every vampire in Skyrim ash — the living they would sooner recruit
note: A hunting party is a 6d pool, +1t until you close, fronted by a 4d **armored troll** or war 
  **huskies**. **Isran** commands and trusts no one. Step into sunlight or take the cure and the 
  quarrel ends; a vampire who will not gets no terms. Refounded 4E 201.
source: the-bestiary/folk-under-arms#the-dawnguard
body: Vampire hunters from a rebuilt fort in the Rift, led by a former Vigilant who found the Vigil 
  soft. Crossbows, plate, no patience.
---
id: hold-guards
type: monster
name: Hold Guards
category: Orders & Armies
tier: mook
role: protector
sights: torchlight on a hold's crest
sounds: talk of a sweetroll, or a knee
smells: barracks stew
traits: [always more of them, the law is what the bounty says]
moves: [Halt and Name the Crime, Call the Watch (4d More Guards)]
wants: the peace kept and the fine paid — your coin or your cell, sooner than a wound
note: "A patrol is a 4d pool, and beating it starts a bigger one. Most fights end the dull way: pay the
  bounty, serve the time, or yield. A bounty stays in its own hold. The **Captain**, a tough, heeds reason,
  a thane's word, or now and then a purse."
source: the-bestiary/folk-under-arms#hold-guards
body: "The jarl's or count's men in mail and helm: underpaid, bored, and all that stands between the market
  and the road."
---
id: imperial-legion-patrol
type: monster
name: Imperial Legion Patrol
category: Orders & Armies
tier: mook
role: tactician
sights: red cloth and steel in step
sounds: a centurion's cadence
smells: oiled leather
traits: [fight by the manual, an order outranks a grudge]
moves: [Lock Shields and Push, Arrest in the Emperor's Name]
wants: the road open and the province quiet — lawful papers make them stand down
note: A patrol is a 4d pool under a tough **Tribune**; while a **Legate** stands, it can't drop 
  below 1d. Its **battlemage** makes open ground +1t. They accept surrender and take prisoners to 
  trial; the Fourth Era's **Penitus Oculatus**, tough lurkers, do neither.
source: the-bestiary/folk-under-arms#imperial-legion-patrol
body: "The Empire's soldiers on the Empire's roads: drilled, shield-locked, and bound by regulations that
  cover even you."
---
id: stormcloak-warband
type: monster
name: Stormcloak Warband
category: Orders & Armies
tier: mook
role: brute
sights: bear shields in the snow
sounds: a war song, chorus shouted
smells: mead and wet wool
traits: [charge before the order, never yield to an elf]
moves: [Shield-Rush Down the Hill, Call You Out by Name]
wants: Skyrim free and Talos worshipped openly — a brave foe is a recruit not yet met
note: A warband is a 4d pool that fights worst when baited. Its officer, a **Stormblade** at best, 
  is a tough who will honor a challenge to single combat and its result. Share their mead or point 
  them at a Thalmor and you have friends. The rising is 4E 201's.
source: the-bestiary/folk-under-arms#stormcloak-warband
body: "Ulfric's rebels: farmhands and old legionaries in blue-draped mail, fighting for Talos, for Skyrim,
  against the Concordat."
---
id: thalmor-justiciars
type: monster
name: Thalmor Justiciars
category: Orders & Armies
tier: tough
role: tactician
sights: spotless black-and-gold robes
sounds: a question as if to a child
smells: hot lightning
traits: [the Concordat shields them, blinded by contempt]
moves: [Read the Warrant, Lightning from Behind Shields]
wants: heretics in chains, and names — obedience suits them better than a fight
note: A patrol is a 6d pool; drop the **Justiciar**, its wizard and mind, and the soldiers withdraw 
  to report. Answer civilly, deny Talos, and they pass with a sneer. Kill them and a death squad 
  follows (*6d The Thalmor Find You*). After the Great War only.
source: the-bestiary/folk-under-arms#thalmor-justiciars
body: 'Dominion agents licensed by treaty to hunt Talos worship in the Empire: one wizard, two soldiers
  in gilded plate, a list of names.'
---
id: the-blades
type: monster
name: The Blades
category: Orders & Armies
tier: tough
role: skirmisher
sights: an Akaviri katana
sounds: a password at an inn door
smells: sword oil
traits: [you met their spy first, the oath outranks their lives]
moves: [Draw-Cut and Step Through, Test Before Trusting]
wants: the Dragonborn served and every dragon dead — on the second, no bargains
note: 'A cell is a 6d pool that picks its ground. A **Grandmaster** commands, **Knight Brothers** and
  **Sisters** guard, and the **Spymaster** has your name already. They kill for the oath, not for coin:
  prove you serve the same line and the swords go back.'
source: the-bestiary/folk-under-arms#the-blades
body: "Heirs of the Akaviri Dragonguard: the Emperor's guards and spies in the Third Era, a hunted handful
  of dragonslayers in the Fourth."
---
id: dark-brotherhood-assassin
type: monster
name: Dark Brotherhood Assassin
category: Orders & Armies
tier: tough
role: lurker
sights: a note reading "We know"
sounds: the stair that did not creak
smells: nightshade
traits: [watched you for a week, wants one name only]
moves: [Poisoned Blade (4d Slow Poison), Withdraw and Try Again]
wants: the contract kept, for Sithis and for pay — the rest of you are in the way
note: 'A 4d pool alone, its first strike at high stakes unless the target was warned. Exposed, the assassin
  leaves and returns: the pool gets a die back each scene until the contract is settled. Their orders
  lead to a **Speaker**, and beyond to whoever prayed.'
source: the-bestiary/folk-under-arms#dark-brotherhood-assassin
body: Someone prayed the Black Sacrament, the Night Mother heard, and now a professional carries 
  your name on a slip of paper.
---
id: thieves-guild-crew
type: monster
name: Thieves Guild Crew
category: Orders & Armies
tier: mook
role: trickster
sights: a shadowmark by the door
sounds: a whistle from the rooftops
smells: cellar damp
traits: [know the way out already, will not kill on a job]
moves: [Cut the Purse and Pass It On, Leave You Holding It]
wants: the take and a clean getaway — a body is bad business, and a blood price
note: "A crew is a 4d pool trying to leave, not win. Their rule is your lever: they pull their blows,
  and a cornered thief yields, pays, or talks. A **Doyen** returns the goods for a fee, clears a bounty
  for half, or sells a rival's name. Riften's guild is rougher."
source: the-bestiary/folk-under-arms#thieves-guild-crew
body: 'Professionals: a lookout, a lifter, a second-story hand, a fence who was never there. The Guild
  forbids killing on the job.'
---
id: the-companions
type: monster
name: The Companions
category: Orders & Armies
tier: tough
role: brute
sights: Skyforge steel worn like jewelry
sounds: a brawl cheered, not stopped
smells: mead
traits: [never refuse a challenge, take no side in any war]
moves: [Shield-Bash and Follow Through, Settle It with Fists]
wants: glory and the hall's good name — a foe who yields with honor is bought a drink
note: 'A shield-band is a 6d pool that fights to the yield unless contracted otherwise, and any contract
  can be argued before the **Harbinger**, who commands no one and is obeyed anyway. The **Circle** does
  not mention its beast blood: corner one and meet a werewolf.'
source: the-bestiary/folk-under-arms#the-companions
body: Heirs of Ysgramor's Five Hundred, drinking under a longship's hull in Whiterun and taking 
  contracts between rounds.
---
id: fighters-guild-company
type: monster
name: Fighters Guild Company
category: Orders & Armies
tier: mook
role: brute
sights: a guildhall door never shut
sounds: a steward reading terms
smells: chain oil and onions
traits: [the contract is the whole quarrel, lawful work only]
moves: [Form Up Around the Client, Send to the Hall]
wants: the job done to the letter and paid on time — no fee covers dying for it
note: 'A company is a 4d pool under a tough **Warder**. Prove the contract unlawful, outbid the client,
  or make the job cost more than the fee, and they stand down. The rival **Blackwood Company** takes any
  job and fights Hist-sap mad: first strike at high stakes (late Third Era).'
source: the-bestiary/folk-under-arms#fighters-guild-company
body: Chartered sellswords with a hall in every proper town, and a contract that says who gets hit.
---
id: knightly-order
type: monster
name: Knightly Order
category: Orders & Armies
tier: tough
role: protector
sights: a painted shield, a barded horse
sounds: vows through a visor
smells: saddle soap
traits: [plate from crown to heel, bound by a spoken vow]
moves: [Charge Down the Lane, Stand Over the Fallen]
wants: honor seen to be kept — proven wrong, a knight must yield or be forsworn
note: A lance is a 6d pool, +1t from the front until unhorsed or flanked. The **Knight Commander** 
  offers single combat, ransom, or parole, and means it. The **Thorn** serves Cheydinhal, the 
  **White Stallion** Leyawiin, the **Knights of the Nine** (refounded 3E 433) the Divines alone.
source: the-bestiary/folk-under-arms#knightly-order
body: Sworn swords of a count, a crown, or a god. Some are legends. Some are a drinking club with 
  matching shields.
---
id: alikr-warriors
type: monster
name: Alik'r Warriors
category: Orders & Armies
tier: tough
role: skirmisher
sights: curved swords and dusty hoods
sounds: careful questions at the inn
smells: hot leather
traits: [the blade is the whole art, strangers here]
moves: [Scimitars from Two Sides, Take the Quarry Alive]
wants: the fugitive they were hired to find — the province can keep its quarrels
note: "A coterie is a 6d pool that prefers talk: its **captain** halts his men mid-fight to offer terms,
  and pays for news. His tale and the quarry's never match. The watch can run them out of town. An **Ansei**,
  a sword-saint with a blade of spirit, is a 6d elite."
source: the-bestiary/folk-under-arms#alikr-warriors
body: Hooded Redguard swordsmen of Hammerfell's desert, heirs to the sword-singers. Abroad, a hired 
  coterie with one name to find.
---
id: orc-stronghold
type: monster
name: Orc Stronghold
category: Orders & Armies
tier: tough
role: brute
sights: watchers on the wall
sounds: hammers on orichalcum
smells: forge smoke
traits: [every adult a warrior, the Code settles everything]
moves: [Bar the Gate, Demand the Blood Price]
wants: the clan strong, the grudge answered — only Blood-Kin are welcome
note: 'The clan is a 6d pool. They keep no jail: a wrong is paid in goods or in enough of your blood,
  and is then over. The **Chief**, a 6d elite, rules by challenge and must answer one; the **wise woman**
  speaks for Malacath. Serve the clan and be named **Blood-Kin**.'
source: the-bestiary/folk-under-arms#orc-stronghold
body: A palisade, a longhouse, a mine, and one clan under the Code of Malacath. Outsiders are 
  unwelcome and told so at the gate, which is the courteous part.
---
id: khajiit-caravan
type: monster
name: Khajiit Caravan
category: Orders & Armies
tier: mook
role: protector
sights: a lantern-lit tent at dusk
sounds: '"Khajiit has wares, if you have coin"'
smells: moon sugar
traits: ['traders first, never unarmed', sell what shops refuse]
moves: [Guards Step Between, Pack and Be Gone by Dawn]
wants: fair trade, safe roads, warm sands — they fight only for the goods and each other
note: "The guards are a 4d pool that only defends; one in plate is a tough. The **caravan master** settles
  everything in coin: an insult has a price, and so does a rescue. Rob one caravan and the patriarch **Ri'saad**
  closes the rest to you (4E 201)."
source: the-bestiary/folk-under-arms#khajiit-caravan
body: 'Elsweyr traders camped outside the walls, since the city will not have them in: a merchant, a tent,
  guards in good steel.'
---
id: ordinators
type: monster
name: Ordinators
category: Morrowind's Houses & Tongs
tier: tough
role: protector
sights: a gold mask of a dead hero's face
sounds: "\"We're watching you. Scum.\""
smells: incense
traits: ['faceless, incorruptible', your guilt is assumed]
moves: ['Ebony Mace, No Warning', To the Inquisition]
wants: the faith unquestioned, outlanders humble — pay, bow, and be beneath notice
note: A watch is a 6d pool. Submit, pay, or show Temple standing and you leave with an insult. Wear 
  their armor and every Ordinator attacks on sight, for good. Mournhold's **High Ordinators** are 
  elites, a **Hand of Almalexia** an 8d boss. Gone with the Tribunal.
source: the-bestiary/folk-under-arms#ordinators
body: "The Tribunal Temple's armored fist: masked priest-soldiers in gilded Indoril armor, keeping Temple
  and Imperial law and enjoying one."
---
id: morag-tong
type: monster
name: Morag Tong
category: Morrowind's Houses & Tongs
tier: tough
role: lurker
sights: a writ with your name spelled right
sounds: a courteous greeting
smells: bitter ink
traits: [the law stands with the killer, one name per writ]
moves: [Show the Writ to the Watch, 'Strike Once, Calmly']
wants: the writ honored, for Mephala and the guild — bystanders are safe
note: A lone assassin is a 4d pool, first strike at high stakes, and guards will not interfere. Only
  the named die, and a **Master** of the local hall can rescind a writ for cause. The 
  **Grandmaster** sits under Vivec's Arena (late Third Era). They kill Dark Brotherhood unpaid.
source: the-bestiary/folk-under-arms#morag-tong
body: Morrowind's guild of lawful murder. A Great House pays, a writ is sealed, and an assassin 
  performs an honorable execution.
---
id: camonna-tong
type: monster
name: Camonna Tong
category: Morrowind's Houses & Tongs
tier: mook
role: brute
sights: hard stares in a cornerclub
sounds: '"outlander," said like spitting'
smells: sujamma and dock tar
traits: [the officials are theirs, outlanders are prey]
moves: [Six of Them in the Alley, A Bought Guard Looks Away]
wants: outlanders gone or owned, the trade theirs — a Dunmer of rank can talk where you cannot
note: "A gang of **Bullies** and **Thugs** is a 4d pool that breaks when it stops being easy; a **Brute**
  is a tough. They call themselves businessmen: profit buys a truce, a House patron's word a longer one.
  The **Kingpin** owns Hlaalu councilors (late Third Era)."
source: the-bestiary/folk-under-arms#camonna-tong
body: "Morrowind's native syndicate: smugglers, slavers, and extortionists who want outlanders in chains
  or gone."
---
id: ashlanders
type: monster
name: Ashlanders
category: Morrowind's Houses & Tongs
tier: mook
role: skirmisher
sights: hide yurts on chitin frames
sounds: guar lowing in the ashfall
smells: dung smoke
traits: [at home in an ash storm, will not strike the unarmed]
moves: [Arrows Out of the Storm, Challenge for Honor]
wants: grazing, tombs, and customs respected — a stranger with a fit gift is a guest
note: A hunting band is a 4d pool, +1t in ash weather. Sheathe your weapons and they must talk; 
  enter a yurt unasked and be challenged. The **Ashkhan** leads, his **Gulakhans** are toughs, the 
  **Wise Woman** keeps the prophecies. Serve the tribe and be named **Clanfriend**.
source: the-bestiary/folk-under-arms#ashlanders
body: 'Nomad Dunmer of the ash wastes: herders and hunters who kept the ancestors when the Great Houses
  took gods and walls.'
---
id: telvanni-wizard-lord
type: monster
name: Telvanni Wizard-Lord
category: Morrowind's Houses & Tongs
tier: elite
role: blaster
sights: a door thirty feet up a living wall
sounds: a Mouth saying the Master is busy
smells: spores
traits: [reached only by flight, wards older than the Empire]
moves: [Summon Something Many-Armed, Reflect the Spell]
wants: to be left to the work — and, as you are here, an errand beneath a wizard
note: A 6d challenge behind a 6d **retinue** of guards and bound Daedra; if you cannot fly, +1t. The
  first time the Master's pool would drop, it doesn't. A rare book or a rival's shame buys an 
  audience, and the **Mouth** settles most things bloodlessly.
source: the-bestiary/folk-under-arms#telvanni-wizard-lord
body: 'A Telvanni master, centuries old, atop a mushroom tower grown without stairs. House law: take it,
  live, and you deserved it.'
---
id: house-guard
type: monster
name: House Guard
category: Morrowind's Houses & Tongs
tier: mook
role: protector
sights: a crested bonemold helm
sounds: a curt challenge at the gate
smells: ash dust
traits: [know every face on the street, serve a councilor]
moves: [Bar the Way, Arrest for the Council]
wants: the House's name unstained — Redoran take an apology, Hlaalu a consideration
note: "A watch is a 4d pool under a tough **Captain**. Redoran guards answer to honor: a duel or a councilor's
  word settles it. Hlaalu guards answer to coin, and name the price. In the Fourth Era the **Redoran Guard**
  is Morrowind's army, 6d of veterans, and Hlaalu has fallen."
source: the-bestiary/folk-under-arms#house-guard
body: Bonemold retainers on a Great House's streets. Redoran's serve duty, gravity, and piety. 
  Hlaalu's serve business, which is flexible.
---
id: dragon
type: monster
name: Dragon
category: Bosses of Tamriel
tier: boss
role: blaster
sights: a shadow crossing the whole valley
sounds: a roar that arrives before the sound of wings
smells: scorched pine and hot stone
pools:
- name: The Dragon
  dice: 8
  traits: armored in scale and pride, and reachable only once it is grounded
  moves: [Bite and Toss, Tail Sweep]
- name: Its Wings
  dice: 6
  traits: bring it down with arrows, a ballista, a rival's challenge, or a Shout that names it 
    mortal
  moves: [Strafe the Line, Wheel Away]
- name: Its Thu'um
  dice: 4
  traits: fire or frost in a single word; break its breath and you break its concentration
  moves: [Breath of Fire, Shout the Ranks Apart]
fail: It takes to the sky with someone in its jaws — or it finishes the town it came for.
wants: dominion, tribute, and to be answered — a dragon challenged or flattered in its own tongue 
  may prefer talk to killing
note: "A linked challenge (6d + 4d + 8d): the Dragon itself is locked until it is grounded or goaded down.
  **Frost** dragons trade fire for ice. **Blood**, **Elder**, and **Ancient** dragons add a die to each
  part in turn; a **Revered** or **Legendary** one drains what it bites. A dragon's soul does not rest:
  unless a Dragonborn takes it, the bones can be raised again."
source: the-bestiary/bosses-and-legends#dragon
body: 'The children of Akatosh, returned: a mind older than the Empire in a body that blots the sun, arguing
  with the world in a language where every word is a weapon.'
---
id: dragon-priest
type: monster
name: Dragon Priest
category: Bosses of Tamriel
tier: boss
role: blaster
sights: a coffin lid thrown the length of the hall
sounds: a dry voice Shouting in the dragon tongue
smells: lightning and embalming salts
pools:
- name: The Priest
  dice: 8
  traits: adrift above the floor, warded, and always backing away
  moves: [Lightning Down the Hall, Shout the Ranks Apart]
- name: The Thralls in the Walls
  dice: 6
  traits: draugr who rise in shifts to feed their lord their own life
  moves: [Burst from the Niches, Kneel and Feed]
- name: The Staff
  dice: 4
  traits: a wall of storm across the floor, and an atronach to hold the gap
  moves: [Wall of Storms, Atronach in the Gap]
fail: It leaves the barrow with its dead behind it, and the nearest hold has a master it did not 
  choose.
wants: to rule again in the dragons' name — and never to see its mask on a living face
note: "A linked challenge (6d + 4d + 8d): the Priest is locked while its thralls stand. Break the Staff
  or corner the Priest for a setup. Each is named for its mask, which outlasts it. **Morokei** of Labyrinthian
  holds the Staff of Magnus (+1t to work magic near him). **Nahkriin** keeps Alduin's portal at Skuldafn.
  **Hevnoraak** planned his own return, and the ghost jailing him in Valthume wants help."
source: the-bestiary/bosses-and-legends#dragon-priest
body: The masked lich-lords of the old Dragon Cult, who ruled ancient Skyrim in their masters' names
  and were buried expecting a summons. In 4E 201 it came.
---
id: vampire-lord
type: monster
name: Vampire Lord
category: Bosses of Tamriel
tier: boss
role: skirmisher
sights: wings unfolding across a cathedral window
sounds: your own pulse, loud and slowing
smells: old blood on cold stone
pools:
- name: The Vampire Lord
  dice: 8
  traits: aloft to cast and landing only to claw; pressed, it is bats, then mist
  moves: [Drain Life Across the Hall, Grip and Hurl]
- name: The Court
  dice: 6
  traits: thralls, fledglings, death hounds, and your own dead raised to join them
  moves: [Bar the Doors, Raise the Fallen]
- name: The Gargoyles
  dice: 4
  traits: statues until it calls, and called again when broken
  moves: [Burst from the Plinth, Pin for the Master]
fail: It leaves as mist with one of you taken for a thrall — and it knows the rest by name.
wants: a court that fears it, a herd that feeds it, and no sun — it offers its blood to the useful, 
  once
note: "A linked challenge (6d + 4d + 8d): the Lord is locked while its court stands. Sunlight or fire
  drops 1d before its pool rolls, and a narrow door is a setup against wings. **Lord Harkon** of Castle
  Volkihar (4E 201) retreats to a shielded blood altar: the first time his pool would drop, it doesn't,
  unless Auriel's Bow breaks the shield. He wants that bow, his daughter's blood, and the sun put out."
source: the-bestiary/bosses-and-legends#vampire-lord
body: "A pure-blood vampire with the courtesy put away: gray, winged, too tall for the door, hanging in
  the air on blood magic. The blood is Molag Bal's own gift."
---
id: oblivion-gate
type: monster
name: Oblivion Gate
category: Bosses of Tamriel
tier: boss
role: swarmer
sights: a red sky at noon
sounds: thunder over a ring of fire
smells: brimstone and scorched grass
pools:
- name: What Comes Through
  dice: 6
  traits: scamps, clannfear, and Dremora holding the ground around the arch
  moves: [Sortie in Force, Burn the Farms]
- name: The Deadlands
  dice: 6
  traits: lava, fire towers, and lashing roots on the way to a spire full of blades and Kyn
  moves: [Fire Tower Volley, Dremora on Every Landing]
- name: The Sigil Stone
  dice: 4
  traits: hangs in a column of fire at the tower's crown
  moves: [(seize it to close the gate)]
fail: '*8d The Gate Stands* — a timer; when it runs dry, a siege engine crawls through, and the town behind
  you is the next Kvatch.'
wants: to stand open until an army has crossed — a door wants nothing, though the Kyn who guard it 
  can be goaded off their posts
note: A linked challenge (6d + 6d + 4d) against a timer, each part locked behind the last. Take the 
  stone and all near it are thrown back to Tamriel as arch and keep burn out. The Daedra already 
  through remain. A **Great Gate** needs three lesser gates open beside it, and its timer is short. 
  Gates held open only in the Oblivion Crisis of 3E 433.
source: the-bestiary/bosses-and-legends#oblivion-gate
body: A burning arch opened by Mehrunes Dagon's cult, with the Deadlands on the far side. It cannot 
  be shut from here. Someone goes in, climbs the tower, and takes the stone that holds it open.
---
id: the-wild-hunt
type: monster
name: The Wild Hunt
category: Bosses of Tamriel
tier: boss
role: predator
sights: a treeline moving like water
sounds: a thousand throats that keep changing
smells: sap, musk, and opened earth
pools:
- name: The Stampede
  dice: 8
  traits: tusk, wing, tongue, mist, a wave of blood; not killed, only turned, slowed, or outlasted
  moves: [Strip to the Bone, Come Through the Wall]
- name: The Scent
  dice: 6
  traits: it was called against someone and follows that name; hide or carry the scent to lead it
  moves: [Find the Quarry, Trample What Stands Between]
- name: The Unraveling
  dice: 4
  traits: near the rite, living things forget the shapes they were taught
  moves: [Beasts Sprout Leaf and Thorn, Your Hands Are Not Hands (vex)]
fail: It reaches its quarry, and everything between is bone. What is left of it wanders on as 
  monsters for an age.
wants: the quarry dead and every warm thing on the way eaten — then, with nothing left, itself
note: "A linked challenge (6d + 4d + 8d) with no kill in it: empty the Stampede's pool and the Hunt is
  outrun, led astray, or left to eat itself. No blade drops that pool. The clean win is earlier: stop
  the rite before its last word. A Hunt killed High King Borgas in 1E 369. The Bosmer are not proud of
  it."
source: the-bestiary/bosses-and-legends#the-wild-hunt
body: The Bosmer's last resort. A whole people speaks the rite and gives back the shapes Y'ffre 
  taught them, becoming a stampede that holds no form longer than a breath. None can change back.
---
id: daedric-champion
type: monster
name: Daedric Champion
category: Bosses of Tamriel
tier: boss
role: brute
sights: a weapon the torchlight will not settle on
sounds: a second voice under their own
smells: shrine incense and old blood
pools:
- name: The Champion
  dice: 8
  traits: formidable before the gift, and fed on victories since
  moves: [Call You Out, Strike with a Prince's Strength]
- name: The Artifact
  dice: 6
  traits: does one impossible thing, every time
  moves: [Do It Again, Refuse Another Hand]
- name: The Prince's Attention
  dice: 4
  traits: the patron meddles while the show is good
  moves: [Turn a Sure Blow Aside, Send Help Unasked]
fail: 'The errand is done: the sacrifice made, the rival dead, the shrine fed.'
wants: the errand finished and the Prince's eye kept — many would be free of both, and dare not say 
  so
note: "A template (6d + 4d + 8d): pick the Prince, then the artifact from the Reliquary. With it in hand,
  the Champion's pool can't drop below 1d, and while the Prince is entertained the GM may Counter one
  success a scene. Show the champion dull or beaten and the favor moves. **Boethiah's** champion (4E 201)
  wears the Ebony Mail and has renounced her. **Msirae Faythung** (3E 433) failed Dagon and stands carved
  open, heart bared, guarding Mehrunes' Razor."
source: the-bestiary/bosses-and-legends#daedric-champion
body: A mortal, or a Daedra, carrying a Prince's artifact and a Prince's interest. The first makes 
  them dangerous. The second means someone is watching the fight, and has a favorite.
