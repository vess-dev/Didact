  Solstheim's bristleback is neither.
---
id: guar
type: monster
name: Guar
category: Beasts & Vermin
tier: mook
role: brute
sights: a freckled back under a pack frame
sounds: a low, rolling bellow
smells: dust and hide
traits: ['carries anything, all day', the wild ones hold ground]
moves: [Headbutt and Trample, Bolt with the Baggage]
wants: fodder, its herd, a scratch under the jaw — a wild one wants you gone
note: "A pack guar is gear with a heartbeat: lose it and you carry the load. Placid until it isn't. **Wild
  guar** are a 4d pool that breaks off once you leave their ground. Legionnaires still call them tigers,
  after an Emperor who could not pronounce it."
source: the-bestiary/beasts-and-wild-things#guar
body: "Morrowind's ox, mule, and saddle horse in one: a barrel-bodied reptile on two thick legs. Horses
  cannot take Vvardenfell. Guar thrive on it."
---
id: kwama
