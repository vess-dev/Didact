# diseases (Chapter 6) a card names. Ids that match grimwild-ce's (dragon) replace them.
id: skeever
type: monster
name: Skeever
category: Beasts & Vermin
tier: mook
role: swarmer
sights: a bald tail in the torchlight
sounds: squealing behind the casks
smells: wet straw and droppings
traits: [nests in numbers, leaps like a cat]
moves: [Leap for the Face, Filthy Bite (Ataxia)]
wants: scraps, warmth, and whatever has stopped moving — not fire, not open ground
note: 'A nest is a 4d pool, or set dressing past your first barrow. The bite can leave *Ataxia* (long-term:
  +1t on locks and pockets). The **rats** of Cyrodiil and Morrowind are the same trouble, smaller, with
  more plagues. Cheese baits them for a setup. Fire in the nest ends it.'
carries: [Ataxia]
source: the-bestiary/beasts-and-wild-things#skeever
body: Rats the size of terriers, in every cellar, barrow, and ditch in Skyrim. Innkeepers swear they
  used to be smaller.
