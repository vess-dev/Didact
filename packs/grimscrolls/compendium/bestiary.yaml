body: A serpent of ice and pale flame that swims through snow like water and strikes clean through 
  the body. Nords send their sons to kill one and call it growing up.
---
id: spriggan
type: monster
name: Spriggan
category: Monsters of the Wild
tier: tough
role: trickster
sights: a face in the bark
sounds: soft laughter in the leaves
smells: sap and fern
traits: [steps out of a trunk unseen, mends herself whole]
moves: [Call the Wild, Stinging Swarm]
