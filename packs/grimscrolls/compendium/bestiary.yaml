id: alduin-the-world-eater
type: monster
name: Alduin, the World-Eater
category: Named Threats & Legends
tier: boss
role: blaster
sights: a black shape putting out the stars
sounds: a Shout that makes the sky rain fire
smells: ash on a barrow wind
pools:
- name: Alduin
  dice: 8
  traits: nothing harms him on the wing, and nothing kills him in the mortal world
  moves: [Fire from a Burning Sky, Seize and Toss]
- name: His Risen Kin
  dice: 6
  traits: dragons Shouted back out of their burial mounds
  moves: [Raise the Mound, Send a Dragon in His Stead]
- name: The Soul-Snare
  dice: 6
  traits: a mist across Sovngarde where he hunts the honored dead
  moves: [Devour the Lost, Draw the Mist Back]
fail: He is fed. He returns from Sovngarde greater than the old heroes found him, and there is no 
  second prophecy.
wants: 'dominion over the world he was made to end — pride is the flaw: clear his mist and he comes in
  a rage'
note: "A linked challenge (6d + 6d + 8d), and a campaign's last act. Without Dragonrend, the mortal-made
  Shout that forces a dragon to know death, his pool can't drop. In the mortal world it can't drop below
  1d: beaten there, he flees by the portal at Skuldafn. He dies only in Sovngarde, with the mist Shouted
  clear and the three heroes who first banished him beside you. No one takes his soul."
source: the-bestiary/bosses-and-legends#alduin-the-world-eater
body: The black dragon who ends the world when it is time, and would rather rule it until then. An 
  Elder Scroll threw him out of the Merethic Era, and in 4E 201 he lands.
---
id: miraak-the-first-dragonborn
type: monster
name: Miraak, the First Dragonborn
category: Named Threats & Legends
tier: boss
role: tactician
sights: a gold mask worked with tentacles
sounds: your own voice chanting his name
smells: ink, brine, and old paper
pools:
- name: The Sleepers
  dice: 6
  traits: islanders drawn to the standing stones each night to raise his shrines
  moves: [Chant at the Stones, Cultists on the Road]
- name: His Dragons
  dice: 6
  traits: three, ridden and bent to his will
  moves: [Strafe the Tower, Give Up a Soul to the Master]
- name: Miraak
  dice: 8
  traits: sword, staff, and a Dragonborn's Voice, on a tower in Apocrypha
  moves: [Bend Will, Take the Soul You Earned]
fail: '*8d The Temple Rises* — a timer; when it runs dry he walks out of Apocrypha, and Solstheim wakes
  as his.'
wants: freedom from Hermaeus Mora, and Solstheim again — he fears his patron more than any hero
note: "A linked challenge (6d + 6d + 8d). Miraak is locked in Apocrypha: the road is a Black Book, at
  Mora's price. While a dragon of his lives, the first time his pool would drop, it doesn't: he devours
  it and rises whole. Cleansing a stone with his own Shout frees its sleepers and gives the timer a die
  back. Mora is watching, and ends whichever champion fails him."
source: the-bestiary/bosses-and-legends#miraak-the-first-dragonborn
body: A Dragon Priest who ate his masters' souls, sold himself to Hermaeus Mora for the Shout that 
  bends wills, and has waited in Apocrypha ever since. In 4E 201 Solstheim is building his temple in
  its sleep.
---
id: dagoth-ur
type: monster
name: Dagoth Ur
category: Named Threats & Legends
tier: boss
role: tactician
sights: a masked figure in the red dark
sounds: a patient voice in your sleep
smells: ash, hot brass, and sweet rot
pools:
- name: Red Mountain
  dice: 6
  traits: the Ghostfence, the Blight, and seven ash vampire kin in their citadels
  moves: [Blight Storm, A Kinsman at the Door]
- name: Dagoth Ur
  dice: 8
  traits: 'a god while the Heart beats: struck down, he waits in the next chamber, amused'
  moves: [Offer You the First Blow]
- name: The Heart of Lorkhan
  dice: 6
  traits: beating under the half-built god Akulakhan, where no spell will carry you out
  moves: [Akulakhan Stirs, Dagoth Ur Follows You In]
fail: Akulakhan walks. The Blight crosses Morrowind, then the map, and every dreamer wakes in his 
  House.
wants: outlanders gone, the Tribunal cast down, and Nerevar beside him again — he has rehearsed that
  offer for an age, and will not make it
note: "A linked challenge (6d + 8d + 6d). No force ends him: empty his pool and he only withdraws to the
  Heart, whose pool can't drop without Kagrenac's tools: Wraithguard to survive holding the others, Sunder
  to strike, Keening to cut it loose. Then he dies, Akulakhan falls, the Blight lifts, and the Tribunal's
  godhood ends too. 3E 427."
source: the-bestiary/bosses-and-legends#dagoth-ur
body: Voryn Dagoth, lord of the dead Sixth House, awake under Red Mountain beside the Heart of a 
  dead god. He sends the Blight by day and dreams by night, and calls you old friend.
---
id: almalexia
type: monster
name: Almalexia
category: Named Threats & Legends
tier: boss
role: trickster
sights: a golden face no Dunmer wears now
sounds: sermons turned from mercy to punishment
smells: incense, and ash where none should fall
pools:
- name: Her Hands
  dice: 6
  traits: six champions fortified by her touch, and the High Ordinators behind them
  moves: [Arrest the Heretic, Kneel Before the Goddess]
- name: The City's Love
  dice: 6
  traits: she makes Mournhold's perils herself, to be seen ending them
  moves: [Loose the Fabricants, Ash Over the Plaza]
- name: Almalexia
  dice: 8
  traits: a war-goddess with the blade Hopesfire and nothing left to lose but worship
  moves: [Hopesfire's Arc, Send You Where She Likes]
fail: She is believed. You die a heretic or a martyr, whichever suits the sermon, and Mournhold 
  thanks her.
wants: to be the one true god, adored — she fears being ordinary, and resents Sotha Sil's silence 
  most
note: 'A linked challenge (6d + 6d + 8d), and a mystery first: her errands are the plot. She sends heroes
  to the Clockwork City to kill a Sotha Sil she has already murdered, then follows to martyr them. She
  is locked until the deceit is seen. Diminished, she can die. No one in Mournhold will believe it. Late
  Third Era.'
source: the-bestiary/bosses-and-legends#almalexia
body: 'Mother Morrowind, the Lady of Mercy: a living goddess in Mournhold since the First Era, now running
  out of godhood. She has decided the city will love her again, whatever that costs the city.'
---
id: mehrunes-dagon
type: monster
name: Mehrunes Dagon
category: Named Threats & Legends
tier: boss
role: brute
sights: a horned head above the rooftops
sounds: a district coming down, street by street
smells: brimstone and brick dust
pools:
- name: The Jaws of Oblivion
  dice: 6
  traits: gates opening inside the walls, Daedra in every street
  moves: [Another Gate Opens, Cut Off the Heir]
- name: Past the Prince
  dice: 6
  traits: he cannot be hurt, only staggered for a breath by a blow that would fell a giant
  moves: [Crush the Guard Underfoot, Axe Through the Wall]
- name: The Altar
  dice: 4
  traits: the last Dragonborn heir must stand in the Temple of the One with the Amulet of Kings
  moves: [(the objective)]
fail: '*8d The City Falls* — a timer; when it runs dry the heir is under the rubble, there is no other,
  and Tamriel is a province of the Deadlands.'
wants: Nirn unmade and remade as his — he came for the world, and barely notices you
note: 'A linked challenge (6d + 6d + 4d) with no pool for the Prince: mortals do not beat him. It is an
  escort under a falling sky. He ends when the heir shatters the Amulet at the altar and Akatosh answers
  in fire, which seals the gates for good and costs the heir his life. So it went in 3E 433.'
source: the-bestiary/bosses-and-legends#mehrunes-dagon
body: 'The Prince of Destruction in his own flesh: four arms, an axe, red as a forge, taller than the
  temple he is breaking. When the last barrier fails he steps into the Imperial City. Nothing mortal can
  kill him.'
---
id: jyggalag-prince-of-order
type: monster
name: Jyggalag, Prince of Order
category: Named Threats & Legends
tier: boss
role: tactician
sights: gray crystal breaking through bright ground
sounds: a voice like a struck blade
smells: no smell at all
pools:
- name: The Obelisks
  dice: 6
  traits: crystal spires that put out his Knights, tended by citizens who changed sides
  moves: [Knights Step Out, A Neighbor Turns Priest]
- name: The Greymarch
  dice: 6
  traits: the Fringe first, then the Wellsprings of the Saints and Seducers, then the palace
  moves: [Advance in Line, Silence a Wellspring]
- name: Jyggalag
  dice: 8
  traits: a towering crystal knight with a bone-cleaving sword, exactly as predicted
  moves: [Cleave the Guard, Reduce It to Order]
fail: New Sheoth falls, the Isles go gray and still, and the cycle begins again.
wants: his realm in perfect order, and beneath that an end to the curse — beaten honestly, he yields
  and thanks you
note: 'A linked challenge (6d + 6d + 8d). He falters at whatever was never tried. He is locked until a
