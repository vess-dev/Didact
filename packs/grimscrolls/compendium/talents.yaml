id: armorer-tempering
type: talent
name: Tempering
class: armorer
kind: core
core: true
growth: At levels 3 and 6, gain +1 Temper per session.
levels: [3, 6]
restrictions: [Armorer only]
source: the-classes/armorer#tempering
body: |-
  You take **+1d** when you make, mend, appraise, or break arms, armor, and metalwork, and given a forge and a night you can put right any ordinary gear. Each session you have **5 Temper**. Spend 1, at the moment it matters, to say ***I worked on that*** about one piece of gear in the scene — a flashback to the whetstone, the rivets, or a long look at a foe's harness:
  - **The edge bites** — a weapon roll that just succeeded, yours or an ally's, adds a **critical effect**.
  - **The plate holds** — physical harm that would land on the wearer lands as a **mark** instead.
  - **I know that make** — name the flaw in a foe's arms, armor, or plating: for the rest of the scene, no one takes thorns from it.
---
id: armorer-steel-smithing
type: talent
name: Steel Smithing
class: armorer
kind: class
source: the-classes/armorer#steel-smithing
body: 'You outfit your friends yourself. At the start of each session, name one piece of your work that
  each ally carries, and one of your own: once that session, its bearer takes **+1d** on a roll with it
  — say what you did to it. Given a forge, you can make any ordinary weapon, armor, or tool to order.'
---
id: armorer-arcane-blacksmith
type: talent
name: Arcane Blacksmith
class: armorer
kind: class
source: the-classes/armorer#arcane-blacksmith
body: "You can work enchanted metal without ruining it. Once per session, given a breather, restore **1d**
  to the pool of a relic or an armor talent — yours or an ally's, never past where it started. Given time,
  materials, and a filled soul gem, you can repair a broken relic. Handling any enchanted arm, ask one:
  *what does it do — what does it cost — who made it?*"
---
id: armorer-dwarven-smithing
type: talent
name: Dwarven Smithing
class: armorer
kind: class
source: the-classes/armorer#dwarven-smithing
body: "You've learned the Deep Folk's metal. You always get a **reveal** on vigilance around machinery
  and mechanical traps, and can jam, wreck, or restart Dwemer works you can reach. Given time with a fallen
  animunculus — or enough scrap — you can wake one as a helper: a *2d Animunculus* power pool that follows
  one-word orders. You keep one at a time."
---
id: armorer-orcish-smithing
type: talent
name: Orcish Smithing
class: armorer
kind: class
source: the-classes/armorer#orcish-smithing
body: "Stronghold work: heavy, ugly, and made to break other people's. You can **always** break ordinary
  arms, armor, locks, and doors you can bring a hammer to — it only costs noise. When you would deal harm,
  you can **sunder** instead: break the weapon, the shield, the helm, leaving them exposed — the next
  ally to strike is set up. On a critical, do both."
---
id: armorer-glass-smithing
type: talent
name: Glass Smithing
class: armorer
kind: class
source: the-classes/armorer#glass-smithing
body: "Malachite, moonstone, and patience: you carry arms and armor of glass, light as a good robe and
  sharper than rumor. Your own gear never thorns you for weight or noise, and once per session a strike
  with your glass edge is **potent** — it shears plate, chain, scale, or stone like cloth. Then it's chipped:
  you can **push yourself** to coax one more such cut that session."
---
id: armorer-daedric-smithing
type: talent
name: Daedric Smithing
class: armorer
kind: class
source: the-classes/armorer#daedric-smithing
body: Ebony, a Daedra's heart, and the dark of the moon. You have forged **one major relic and two 
  minor ones** — arms or armor; design them with the GM (Chapter 8) — and you or your friends carry 
  them. If one is lost or destroyed, you can make its like again with the right materials. For the 
  major work, that means another heart.
---
id: armorer-dragon-armor
type: talent
name: Dragon Armor
class: armorer
kind: class
source: the-classes/armorer#dragon-armor
body: "When you play a key part in slaying a powerful monster, take your pick of it — bone, scale, hide,
  horn — and, given a night, work it into a **major expendable** relic: one ritual-sized effect, once.
  Its touchstones are the monster's name, its power, and what you made of it. You begin with one already
  made; say what it was."
---
id: athletics-wind
type: talent
name: Wind
class: athletics
kind: core
core: true
growth: At levels 2, 4, and 6, gain +1 Wind per session.
levels: [2, 4, 6]
restrictions: [Athletics only]
source: the-classes/athletics#wind
body: |-
  Ordinary exertion never costs you: forced marches, long swims, hard climbs, and a night without sleep don't mark you, thorn you, or call for a roll unless something is actively trying to stop you. Each session you have **6 Wind**. Spend 1 to:
  - **Dig deep** — pay for **pushing yourself** with Wind instead of a mark.
  - **Outpace** — before a roll, ignore every thorn on it that comes from distance, footing, load, weather, or exhaustion.
  - **Cover ground** — be where you need to be: cross the gap, reach the lever, get between a friend and a blade. If only distance and time stood in the way, there's no roll — and you can assist or protect from anywhere in the scene.
---
id: athletics-fleet-footed
type: talent
name: Fleet-Footed
class: athletics
kind: class
source: the-classes/athletics#fleet-footed
body: You can pull off **potent feats of traversal** — up the sheer face, across the rooftops, 
  through the closing gate — and you always move at full speed, unhindered by what's in your way.
---
id: athletics-swift-swim
type: talent
name: Swift Swim
class: athletics
kind: class
source: the-classes/athletics#swift-swim
body: Water is just a thicker road. You swim as fast as you run, hold a breath for a whole scene, 
  and never take thorns for fighting or working in water, mud, or driving rain. Given time, you can 
  pull off **potent feats of swimming and diving** — under the ice to the wreck, up the falls, out 
  through the sluice; **push yourself** to do it on the spot.
---
id: athletics-second-wind
type: talent
name: Second Wind
class: athletics
kind: class
source: the-classes/athletics#second-wind
body: Once per scene, when you take a breather — even one beat out of the fight — clear **all your 
  marks**; once per session, clear **one physical harm** with them. An ally who rests beside you 
  clears a mark too.
---
id: athletics-run-down
type: talent
name: Run Down
class: athletics
kind: class
source: the-classes/athletics#run-down
body: "Nothing on two legs gets away from you, and little on four. You take **+1d** in a chase, as hunter
  or as prey, and when you catch what you're after, choose one on any success: *tackled — cornered — run
  ragged (the next roll against it is set up).*"
---
id: athletics-beast-of-burden
type: talent
name: Beast of Burden
class: athletics
kind: class
source: the-classes/athletics#beast-of-burden
body: "You carry what no one else can — a friend over each shoulder, the chest *and* the door it was behind
  — at full speed, and take **+1d** on rolls of hauling, holding, and dragging. When Supplies are rolled
  (the Supplies dial) — torches, rations, rope — one die that would drop stays, unless it's that pool's
  last: you packed extra. When the whole party rolls at once, it is still one die."
---
id: athletics-long-road
type: talent
name: Long Road
class: athletics
kind: class
source: the-classes/athletics#long-road
body: "You set a pace others can keep. On a journey's montage roll you roll **3d**, and whoever travels
  with you arrives ready: once per session, after a journey or a forced march, each ally clears a mark
  — or takes spark, if they had none to clear. You always know how far it is, and the fastest way there."
---
id: athletics-stamina
type: talent
name: Stamina
class: athletics
kind: class
source: the-classes/athletics#stamina
body: "Setbacks only wake you up: take **spark** when one of your rolls is cut by a thorn. You take **+1d**
  on the story roll if you're dropped, and on a perfect you aren't dropped at all — you're on one knee,
  desperate, and getting up."
---
id: blade-bladework
type: talent
name: Bladework
class: blade
kind: core
core: true
growth: At levels 3 and 6, gain +1 Edge per scene.
levels: [3, 6]
restrictions: [Blade only]
source: the-classes/blade#bladework
body: "Take **+1d** when you fight, defend, or assist with a blade in hand — any blade, dagger to claymore.
  Each scene you have **2 Edge**. Spend 1 after a blade roll succeeds to add a **critical effect**: *greater
  effect* (the foe's pool drops 1d before it rolls), *a secondary effect* (the disarm, the bind, the cut
  that turns them), or *a setup* for whoever strikes next."
---
id: blade-bladesman
type: talent
name: Bladesman
class: blade
kind: class
source: the-classes/blade#bladesman
body: 'Your guard is a weapon. On a perfect defense roll against a foe within reach of your blade, you
  can **push yourself** to riposte before they recover: a tough or lesser foe is out of the fight, and
  a greater one rolls its pool.'
---
id: blade-fighting-stance
type: talent
name: Fighting Stance
class: blade
kind: class
source: the-classes/blade#fighting-stance
body: Once per session, plant your feet and declare a **zone** — a doorway, a stair, the ground 
  around a fallen friend — that enemies can't cross without dealing with you. If they try, you can 
  **interrupt**; on a perfect, take spark. You can **push yourself** to do it again. Some things are
  too big to hold — but even a giant might take a parting cut (roll its pool).
---
id: blade-dual-flurry
type: talent
name: Dual Flurry
class: blade
kind: class
source: the-classes/blade#dual-flurry
body: 'With a blade in each hand, one roll can answer **two foes** in reach, with no thorn for the second.
  You can **push yourself** to take a **quick action** with the off hand: a second cut, a thrown dagger,
  a parry for a friend.'
---
id: blade-deep-wounds
type: talent
name: Deep Wounds
class: blade
kind: class
source: the-classes/blade#deep-wounds
body: 'Once per scene, when your blade draws blood from a living foe, open it deep: start a *4d Bleeding*
  timer and roll it each time that foe makes a move or takes a blow. At 0d, a tough or lesser foe is out
  of the fight, and a greater one loses **2d** from its pool. Fire, a healer, or a quiet minute ends it
  early.'
---
id: blade-savage-strike
type: talent
name: Savage Strike
class: blade
kind: class
source: the-classes/blade#savage-strike
body: "You finish things. On a perfect against a foe whose last pool stands at **2d or less**, it's simply
  over — no roll of the pool — and you choose how: *dead — disarmed and kneeling — fled, and marked for
  life.*"
---
id: blade-critical-charge
type: talent
name: Critical Charge
class: blade
kind: class
source: the-classes/blade#critical-charge
body: When you're the first into a fight — the sprint, the leap from the stair, the horse at a 
  gallop — **5s count as 6s, but 4s count as 1s** on your first roll. Whatever comes of it, the 
  first ally to follow you in is set up.
---
id: blade-paralyzing-strike
type: talent
name: Paralyzing Strike
class: blade
kind: class
source: the-classes/blade#paralyzing-strike
body: Once per session, when a blade roll of yours succeeds, the cut finds a nerve. A tough or 
  lesser foe is **paralyzed** — helpless until the scene ends or someone shakes it loose. A greater 
  one loses its next move, and the next roll against it is set up. You can **push yourself** to do 
  it once more.
---
id: block-the-guard
type: talent
name: The Guard
class: block
kind: core
core: true
growth: At levels 3 and 6, gain +1 Guard per scene.
levels: [3, 6]
restrictions: [Block only]
source: the-classes/block#the-guard
body: |-
  With a shield or a parrying weapon in hand, you can **always** make a defense roll **in an ally's place** when an impact move targets them and you could plausibly get between: the trouble comes at you instead. (When it's the consequence of that ally's own roll, stepping in costs 1 Guard.) Each scene you have **3 Guard**. Spend 1 to:
  - **Brace** — before a defense roll, ignore every thorn on it, even thorns from your own harm.
  - **Bash** — when a defense roll of yours comes up perfect or messy, answer with the shield: *knock them back — knock them down — knock it out of their hand.*
  - **Cover** — stretch one defense roll over every ally beside you: the volley, the fireball, the falling roof.
---
id: block-shield-wall
type: talent
name: Shield Wall
class: block
kind: class
source: the-classes/block#shield-wall
body: "Take **+1d** on defense rolls against physical harm while your guard is up. On a perfect, choose
  one: *their attention stays on you — an ally takes heart (clear their vex or a mark) — they're left
  open (the next ally to strike is set up).*"
---
id: block-deflect-arrows
type: talent
name: Deflect Arrows
class: block
kind: class
source: the-classes/block#deflect-arrows
body: "Arrows, bolts, thrown axes, and spells you can see coming: you ignore thorns on defense rolls against
  missiles, and can guard anyone standing behind you from them, at any range down the line of fire. Volleys
  that pin others down don't pin you."
---
id: block-elemental-protection
type: talent
name: Elemental Protection
class: block
kind: class
source: the-classes/block#elemental-protection
body: Behind your shield, fire, frost, and shock land **one step lighter** — on you, and on anyone 
  sheltering directly behind you. Dragon breath counts. So does a forge.
---
id: block-block-runner
type: talent
name: Block Runner
class: block
kind: class
source: the-classes/block#block-runner
body: You advance behind your shield as fast as others run, and whoever moves in your shadow can't 
  be singled out by archers or spells. You can **push yourself** to pull off a **potent feat of 
  advancing under fire** — up the breach, across the bridge, through the dragon's breath — bringing 
  those behind you along.
---
id: block-power-bash
type: talent
name: Power Bash
class: block
kind: class
source: the-classes/block#power-bash
body: "Once per session, you can **interrupt** an impact move from a foe in reach with shield, pommel,
  or shoulder — roll Brawn. On a perfect, they're staggered as well: the next roll against them is set
  up. You can **push yourself** to do it once more."
---
id: block-shield-charge
type: talent
name: Shield Charge
class: block
kind: class
source: the-classes/block#shield-charge
body: 'When you charge behind your shield, you ignore thorns from numbers and from whatever stands in
  your path. On any success, a tough or lesser foe you hit goes down hard, and a pack of mooks parts around
  you: your allies can follow through the gap unhindered.'
---
id: block-quick-reflexes
type: talent
name: Quick Reflexes
class: block
kind: class
source: the-classes/block#quick-reflexes
body: The world slows when the blow starts to fall. You can always act first, unless completely 
  surprised — and when an ambush or a trap is sprung on your party, you get a defense roll even 
  where no one else would.
---
id: blunt-the-heavy-hand
type: talent
name: The Heavy Hand
class: blunt
kind: core
core: true
growth: At levels 2, 4, and 6, gain +1 Might per session.
levels: [2, 4, 6]
restrictions: [Blunt only]
source: the-classes/blunt#the-heavy-hand
body: |-
  When you swing something heavy, you **never take thorns from a foe's armor, shield, shell, or hide** — you go through it — and you can **always** break ordinary things you can reach: doors, chains, crates, old bones. It only costs noise.

  Each session you have **3 Might**. When a blow of yours lands and the GM has rolled what it hit — a foe's pool, or the task pool of anything you're beating down — spend Might **1-for-1 to drop that many more dice** from it — up to 2 on a single blow, however many pools it struck. It's the follow-through nobody gets up from.
---
id: blunt-barbarian
type: talent
name: Barbarian
class: blunt
kind: class
source: the-classes/blunt#barbarian
body: Once per session — or any time you get bloodied — you can let the red come up for the rest of 
  the scene. While it's up you can take only **aggressive, forward actions**; you **ignore thorns 
  from your harm**; and each time you take a foe out of the fight or empty a pool, you're **set up**
  for your next roll. It ends when no enemy stands, when you're dropped, or when you **push 
  yourself** to stand down.
---
id: blunt-champions-stance
type: talent
name: Champion's Stance
class: blunt
kind: class
source: the-classes/blunt#champions-stance
body: Once per session, call out a single foe. You take **+1d** on every roll against them — and the
  GM takes 1 suspense. If they do anything but face you, you can **interrupt** it. The challenge 
  ends when an ally engages your foe, or when an interrupt of yours comes up less than perfect. You 
  can **push yourself** to do it again.
---
id: blunt-bone-breaker
type: talent
name: Bone Breaker
class: blunt
kind: class
source: the-classes/blunt#bone-breaker
body: 'On a critical when you bring violence, threats, or destruction to bear, choose one more: *an extra
  secondary effect — roll the related pool twice.*'
---
id: blunt-limbsplitter
type: talent
name: Limbsplitter
class: blunt
kind: class
source: the-classes/blunt#limbsplitter
body: The first time each scene you drop a foe or empty a pool with a heavy weapon, you do it 
  memorably. Lesser foes who see it break and run for a few moments, a tough one hesitates, and 
  you're **set up** against whoever is still standing when the pieces land.
---
id: blunt-devastating-blow
type: talent
name: Devastating Blow
class: blunt
kind: class
source: the-classes/blunt#devastating-blow
body: 'Given time to wind up — one clear beat with nothing in your way — you can pull off a **potent feat
  of destruction**: split the gate bar, fell the pillar, break the ice under a charge, put a giant on
  one knee. You can **push yourself** to do it on the spot.'
---
id: blunt-sweep
type: talent
name: Sweep
class: blunt
kind: class
source: the-classes/blunt#sweep
body: 'One swing, the whole arc. You can apply one melee roll to **every tough or lesser foe in front
  of you** — and to one greater foe among them — ignoring thorns for being outnumbered — and when a sweep
  thins a pack of mooks, it thins it with **greater effect**: drop 1d before its pool rolls.'
---
id: blunt-warmaster
type: talent
name: Warmaster
class: blunt
kind: class
source: the-classes/blunt#warmaster
body: 'Your power attacks put things where you want them. Once per scene, before a heavy melee roll, declare
  you also: *knock them sprawling — drive them back — break their guard — leave them reeling.* On a perfect
  or messy, it happens too. You can **push yourself** to call another.'
---
id: hand-to-hand-the-open-hand
type: talent
name: The Open Hand
class: hand-to-hand
kind: core
core: true
growth: At levels 3 and 6, gain +1 Focus per scene and +1 interrupt per session.
levels: [3, 6]
restrictions: [Hand to Hand only]
source: the-classes/hand-to-hand#the-open-hand
body: |-
  Unarmed, you never take thorns for a weapon matchup, and your hands **strike what ordinary steel can't** — ghosts, wisps, wraiths. A foe you beat bare-handed is dead or merely *out*, as you choose. Once per session you can **interrupt** an impact move with: *a caught wrist — a stunning blow — a word and a look.* Each scene you have **4 Focus**. Spend 1 to:
  - before a roll, ignore its thorns from being outnumbered, or from one imposing foe;
  - attempt a **maneuver** — before rolling, declare you also *disarm them — throw them — lock a limb — turn their momentum*; on a perfect or messy, it happens;
  - pull off a **potent feat of body and breath** — the leap no one makes, the blow through an oak door, a heartbeat slowed to nothing. For 1 more Focus, bring along someone you're touching.
---
id: hand-to-hand-whispering-fang
type: talent
name: Whispering Fang
class: hand-to-hand
kind: class
source: the-classes/hand-to-hand#whispering-fang
body: 'On a perfect defense roll against a physical attack, you can **push yourself** to *use* it. Turn
  it into someone else — the mace finds his friend, the charging boar meets the bandit: a tough or lesser
  foe is out of the fight, and a greater one rolls its pool. Or carry its owner where you choose: off
  the ledge, into the fire, flat on their back.'
---
id: hand-to-hand-brawler
type: talent
name: Brawler
class: hand-to-hand
kind: class
source: the-classes/hand-to-hand#brawler
body: "A fight you start with your fists, against people, stays a fistfight: the stakes are **low** until
  someone draws steel or magic — and whoever does is the one the room turns on. You take **+1d** in a
  brawl, with your fists or whatever's to hand: a stool, a tankard, somebody's lute."
---
id: hand-to-hand-knockdown
type: talent
name: Knockdown
class: hand-to-hand
kind: class
source: the-classes/hand-to-hand#knockdown
body: You take **+1d** to grapple, throw, pin, or choke. A tough or lesser foe you've pinned can do 
  nothing but struggle for as long as you hold on — you can do little else — and anyone can bind or 
  question it. A greater one loses the use of one move of your choice while you have hold of it.
---
id: hand-to-hand-rain-of-fists
type: talent
name: Rain of Fists
class: hand-to-hand
kind: class
source: the-classes/hand-to-hand#rain-of-fists
body: You can **push yourself** to make one bare-handed roll and apply it to up to **three foes** in
  reach — the elbow, the heel, the borrowed momentum of the first into the third — with no thorns 
  for the extra targets.
---
id: hand-to-hand-counterblow
type: talent
name: Counterblow
class: hand-to-hand
kind: class
source: the-classes/hand-to-hand#counterblow
body: When you or an ally beside you makes a defense roll, take **+1d** on an immediate follow-up 
  against the attacker. On a critical by a nearby ally, you can **push yourself** to add a critical 
  bonus of your own.
---
id: hand-to-hand-pressure-points
type: talent
name: Pressure Points
class: hand-to-hand
kind: class
source: the-classes/hand-to-hand#pressure-points
body: 'Once per session, when a bare-handed blow lands, strike a nerve: *the arm goes dead — the legs
  go — the voice goes (no spells, no shouts).* On a tough or lesser foe it lasts the scene; on a greater
  one, a beat or two. You can **push yourself** to do it once more.'
---
id: hand-to-hand-mind-over-matter
type: talent
name: Mind over Matter
class: hand-to-hand
kind: class
source: the-classes/hand-to-hand#mind-over-matter
body: When you would take a physical mark, you can take a mental one instead. When you clear a mark 
  by rolling through it, take spark.
---
id: heavy-armor-plate
type: talent
name: Plate
class: heavy-armor
kind: core
core: true
growth: At levels 3 and 6, gain +1d Plate.
levels: [3, 6]
restrictions: [Heavy Armor only]
source: the-classes/heavy-armor#plate
body: |-
  In heavy armor, a **messy** defense roll against a physical attack costs you nothing: the lessened blow just glances off. (It's still a messy for anything that triggers on a perfect.) Each session you have a *4d Plate* resource pool:
  - **Take it** — when physical harm would land on you, roll Plate and the armor eats the blow instead.
  - **Wade in** — before any roll, drop **1d** from Plate (don't roll it) to ignore every thorn on that roll from blades, arrows, claws, or numbers. You simply walk through it.

  *The weight:* You can't sneak in it, shouldn't swim in it, and need a quiet stretch to get into it; take +1t on anything that wants silence, delicacy, or speed over distance. Out of your armor, this talent does nothing.
---
id: heavy-armor-juggernaut
type: talent
name: Juggernaut
class: heavy-armor
kind: class
restrictions: [Works in heavy armor]
source: the-classes/heavy-armor#juggernaut
body: 'Each session you have a *2d Armor* resource pool: when physical harm would land on you in heavy
  armor, roll it and the blow glances off. *(If you have Plate, this is a second pool beside it.)*'
---
id: heavy-armor-fists-of-steel
type: talent
name: Fists of Steel
class: heavy-armor
kind: class
restrictions: [Works in armor]
source: the-classes/heavy-armor#fists-of-steel
body: "In armor you're never unarmed: gauntlet, pauldron, the brow of a helm. You take **+1d** to shove,
  grapple, or pin, and on a perfect defense roll against a foe in reach, it meets your gauntlet on the
  way out — a mook drops, and anything bigger is staggered: the next ally to strike it is set up."
---
id: heavy-armor-cushioned
type: talent
name: Cushioned
class: heavy-armor
kind: class
source: the-classes/heavy-armor#cushioned
body: "Falls, tramplings, rockslides, a giant's club, the long trip through a wall: harm from **impact**
  lands one step lighter on you, and a fall that should kill merely harms. You can **push yourself** to
  shield someone in your arms from it as well."
---
id: heavy-armor-conditioning
type: talent
name: Conditioning
class: heavy-armor
kind: class
source: the-classes/heavy-armor#conditioning
body: You've worn it so long it's skin. You take no thorns for running, climbing, marching, or 
  sleeping in armor, you can swim in it (badly), and you get into it in moments. Only stealth still 
  suffers.
---
id: heavy-armor-well-fitted
type: talent
name: Well Fitted
class: heavy-armor
kind: class
source: the-classes/heavy-armor#well-fitted
body: There are no gaps in your harness. A strike from ambush or from behind never lands at higher 
  stakes on you, and you take no thorns for being flanked, surrounded, or caught off guard — the 
  armor was ready even if you weren't.
---
id: heavy-armor-tower-of-strength
type: talent
name: Tower of Strength
class: heavy-armor
kind: class
source: the-classes/heavy-armor#tower-of-strength
body: 'Nothing short of a giant, a dragon, or a siege engine knocks you down, drives you back, or throws
  you — and anyone braced against you shares it. Take **+1d** to hold: a line, a door, a rope, a friend
  over a drop.'
---
id: heavy-armor-reflect-blows
type: talent
name: Reflect Blows
class: heavy-armor
kind: class
restrictions: [Needs an armor pool]
source: the-classes/heavy-armor#reflect-blows
body: "When an armor pool of yours eats a blow, the attacker pays for it: a weapon notched or broken,
  a claw split, a wrist jarred numb. A mook is out of the fight on the spot, and you're **set up** against
  anything bigger."
---
id: alchemy-the-satchel
type: talent
name: The Satchel
class: alchemy
kind: core
core: true
growth: At levels 2, 4, and 6, learn 1 new recipe and gain +1 draught per session.
levels: [2, 4, 6]
restrictions: [Alchemy only]
source: the-classes/alchemy#the-satchel
body: |-
  You know **4 recipes**, each a single effect — potion or poison — from the Recipe Book below. Each session your satchel holds **5 draughts** you brewed earlier; produce one when it's needed. A draught does what a spell of its recipe would do, with no roll and no words, for anyone who uses it — though getting a poison *into* a foe is its own problem. Spend **2** for a **potent** one: enough for the whole party, strong enough to last the scene, or fit to mend harm. What you don't use goes flat when the session ends.

  *Reagents:* When you help bring down a creature, or find something rare growing, harvest it. A reagent brews **one** extra draught of that thing's nature, no recipe needed — troll fat knits flesh, vampire dust hides you, a spriggan's taproot wakes the green. You can hold two.
  *Taste-test:* You can name any potion, poison, or ingredient by taste, and say what it would do.
---
id: alchemy-physician
type: talent
name: Physician
class: alchemy
kind: class
source: the-classes/alchemy#physician
body: You take **+1d** when you treat wounds, poison, or disease, by hand or by draught; on a 
  critical, you both take spark. **One time only**, you can bring back the recently dead. Common 
  sense takes precedence.
---
id: alchemy-benefactor
type: talent
name: Benefactor
class: alchemy
kind: class
source: the-classes/alchemy#benefactor
body: What you brew does more in other hands. When you give an ally a draught from your own 
  *Potions* or your satchel, they're also **set up** for their next roll — and once per session, a 
  potion you pour for someone else doesn't roll its pool at all.
---
id: alchemy-experimenter
type: talent
name: Experimenter
class: alchemy
kind: class
source: the-classes/alchemy#experimenter
body: "Given a few minutes with a sample — blood, slime, ash, a severed claw — ask the GM two: *what hurts
  it — what does it eat — where does it lair — what does it fear — what could it be made into?* Once per
  session, improvise a draught you've never made: say what it's meant to do, and make a 2d story roll
  for what it actually does."
---
id: alchemy-poisoner
type: talent
name: Poisoner
class: alchemy
kind: class
source: the-classes/alchemy#poisoner
body: 'Each session you have a *4d Poisons* resource pool. Roll it for a dose of: *paralysis — frenzy
  — fear — silence (no spells) — weakness (to fire, frost, or shock) — a loosened tongue.* Poisons take
  a moment to work and bite best when swallowed; on a blade, they need a wound first.'
---
id: alchemy-concentrated-poison
type: talent
name: Concentrated Poison
class: alchemy
kind: class
source: the-classes/alchemy#concentrated-poison
body: Poison you put on a weapon — yours or a friend's — lasts the **scene**, not the stroke. Once 
  per scene, when it gets into a living foe, drop **1d** from that foe's pool before it rolls; and a
  tough or lesser foe is out of the fight within a few beats regardless, as the venom finishes the 
  argument.
---
id: alchemy-green-thumb
type: talent
name: Green Thumb
class: alchemy
kind: class
source: the-classes/alchemy#green-thumb
body: The land is your larder. Gain a wise about growing things, and take **+1d** on rolls about 
  plants, fungi, and the poisons of the wild. Once per session, after a little time anywhere 
  something grows — a wood, a cave, a market garden — put **2 draughts** back in your satchel, 
  **2d** into a Poisons pool, or 1d into anyone's Potions.
---
id: alchemy-purity
type: talent
name: Purity
class: alchemy
kind: class
source: the-classes/alchemy#purity
body: You brew clean, and you've dosed yourself for years. Poison, venom, drink, and skooma land one
  step lighter on you; you always know when food or drink has been tampered with; and given a moment
  with your kit you can purge poison or drug from someone else — no roll for the ordinary kind, a 
  potent draught for the dire.
---
id: alteration-formulae
type: talent
name: Formulae
class: alteration
kind: core
core: true
growth: At levels 2, 4, and 6, gain +1 spell and +1 potent spell per session, and learn 1 new 
  formula.
levels: [2, 4, 6]
restrictions: [Alteration only]
source: the-classes/alteration#formulae
body: |-
  You have spellcasting ability. You roll **Wits**, and you know **4 formulae** from the Formulary, kept in a spellbook; the formula you cast is the spell's touchstone, read as broadly as its name allows. Each session you can cast **4 spells** and **2 potent spells**. A spell cast **without risk** needs no roll and doesn't count against the session — unless it's potent. You learn new formulae from spell tomes and scrolls, consuming them.

  **The Formulary.** *Burden & Feather* (make a thing heavier, or lighter) — *Lock & Open* (seal it, or persuade it) — *Stoneflesh* (skin like oak, stone, iron, ebony) — *Elemental Shield* (a mantle against fire, frost, or shock) — *Levitate* (rise, hover, leap, fall slowly) — *Water Breathing & Water Walking* — *Transmute* (one substance into its near kin) — *Ash Shell* (encase a thing in hardened ash, harmless and helpless).
---
id: alteration-novice-alteration
type: talent
name: Novice Alteration
class: alteration
kind: class
source: the-classes/alteration#novice-alteration
body: The dabbler's door. You learn **2 formulae** and can cast **3 spells and 1 potent spell** per 
  session with them, rolling Wits. *(Alteration already your class? Learn 1 more formula, and cast 1
  more spell per session.)*
---
id: alteration-mage-armor
type: talent
name: Mage Armor
class: alteration
kind: class
restrictions: [Works unarmored]
source: the-classes/alteration#mage-armor
body: "Robes are armor if you know the trick. Wearing no armor, you have a *2d Flesh* resource pool each
  session: when physical harm would land on you, roll it — the blow breaks on skin gone briefly to oak
  or stone. If you can cast *Stoneflesh*, once per scene you can spend one of your session's spells to
  put 1d back (a potent one, 2d; never past 2d), or to lay the pool on an ally for the scene."
---
id: alteration-magic-resistance
type: talent
name: Magic Resistance
class: alteration
kind: class
source: the-classes/alteration#magic-resistance
body: 'Each session you have a *2d Resistance* resource pool: when you would suffer from magic — a spell,
  a curse, a glamour, a shout — roll it to shrug the effect off. When the pool empties, the leftover charge
  is yours: your next action is **potent**.'
---
id: alteration-stability
type: talent
name: Stability
class: alteration
kind: class
source: the-classes/alteration#stability
body: "Your workings hold. Twice per session, when you cast any spell — your own, a scroll's, a staff's
  — declare it **stable**: it lasts the scene rather than a beat (a potent one lasts until the next dawn),
  and nothing short of a potent counter shakes it loose. Stability never lengthens a hold on a greater
  foe."
---
id: alteration-transmute-ore
type: talent
name: Transmute Ore
class: alteration
kind: class
source: the-classes/alteration#transmute-ore
body: "The miner's heresy: one substance into its near kin. Given time, you can turn a handful of ore
  or a small object — iron to silver, silver to gold, a key to wax, a chain link to lead — which keeps
  your *Coin* healthy: when it rolls, one die that would drop stays, unless it's the last. You can **push
  yourself** to do it at a touch: *the lock goes soft — the blade goes brittle — the bars are rust.* *(If
  you know the Transmute formula, that touch is free once per session.)*"
---
id: alteration-dual-casting
type: talent
name: Dual Casting
class: alteration
kind: class
source: the-classes/alteration#dual-casting
body: "Both hands, one spell. Twice per session, pour a casting through both hands to give it an extra
  touchstone: *distant — intense — wide — quick — precise.* It's stronger for it, though not quite potent,
  and the touchstone answers any question about it. *(Can it reach the far tower? It's distant: yes.)*"
---
id: alteration-master-alteration
type: talent
name: Master Alteration
class: alteration
kind: class
restrictions: [Needs Alteration spellcasting]
source: the-classes/alteration#master-alteration
body: 'Choose one formula you know: take **+1d** when you cast it, and cast it as a potent spell once
  more per session. Your name starts to travel with it. **One time only**, you can cast it as a ritual:
  *a river walked dry-shod by an army — a keep made weightless for one breath — every lock in a city,
  opened.*'
---
id: conjuration-the-binding
type: talent
name: The Binding
class: conjuration
kind: core
core: true
growth: At levels 3 and 6, your thrall gains +1 aspect.
levels: [3, 6]
restrictions: [Conjuration only]
source: the-classes/conjuration#the-binding
body: |-
  Your magic is one spell that matters: you have bound a **thrall** — a Daedra called out of Oblivion, or one of the dead called back to work. Name it. You direct it as a *4d Thrall* power pool, rolled in place of a stat for whatever it does; the pool returns to full once it hits 0d, or when you **push yourself**. It has **1 aspect**: *big enough to ride — burning (or freezing, or crackling) — incorporeal — winged — a fitting talent from this chapter (never its "one time only" part).* It can take 1 mark and 1 harm; any more breaks the binding — make a 2d story roll for what the break lets loose (on a perfect, nothing). You can call it back each scene.

  *Bound weapon:* You can always call a blade, axe, or bow of Oblivion-stuff to your hand. You're never unarmed, and it strikes what ordinary steel can't.
---
id: conjuration-novice-conjuration
type: talent
name: Novice Conjuration
class: conjuration
kind: class
source: the-classes/conjuration#novice-conjuration
body: The dabbler's door. You can call a **bound weapon** to hand, as above, and you've bound a 
  **familiar** — a scamp, a ghostly wolf, a skull that mutters. You share its senses, speak without 
  words, and send it on simple errands (a story roll says how they go). **Push yourself** to have it
  fight or work for a scene as a *2d Familiar* power pool. If it's hurt, it's gone until the next 
  scene.
---
id: conjuration-mystic-binding
type: talent
name: Mystic Binding
class: conjuration
kind: class
source: the-classes/conjuration#mystic-binding
body: 'Your bound weapon arrives with a trait you choose each time you call it: *flaming — banishing —
  seeking — silent — soul-drinking.* Once per session, let it come apart in your hand to produce one **potent**
  effect of that trait. *(No bound weapon? This talent teaches you the calling.)*'
---
id: conjuration-oblivion-binding
type: talent
name: Oblivion Binding
class: conjuration
kind: class
source: the-classes/conjuration#oblivion-binding
body: 'What was called can be sent back. Each session you have a *2d Unbinding* power pool: roll it to
  **interrupt** anything a summoned Daedra, a raised corpse, or a restless spirit is doing. On a success,
  a tough or lesser one is banished or turned; a greater one loses the move and rolls its pool. On a perfect,
  a lesser one is *yours* until the scene ends.'
---
id: conjuration-necromancy
type: talent
name: Necromancy
class: conjuration
kind: class
source: the-classes/conjuration#necromancy
body: "Once per scene, given a corpse and a moment, you can raise it: a *3d Risen* power pool that does
  what you say until the scene ends or the pool empties, then falls to ash. It keeps the shape and the
  skills of the body, not the mind. In most of Tamriel this is a crime, and everywhere it's remembered."
---
id: conjuration-atromancy
type: talent
name: Atromancy
class: conjuration
kind: class
restrictions: [Needs a thrall or a familiar]
source: the-classes/conjuration#atromancy
body: You hold **three bindings** instead of one — flame, frost, and storm is the classic set — each
  with its own form and aspects. Choose which answers when you call.
---
id: conjuration-summoner
type: talent
name: Summoner
class: conjuration
kind: class
restrictions: ['Needs a thrall, a familiar, or a follower']
source: the-classes/conjuration#summoner
body: Yours comes when called, across any distance, fast. Once per session, it can **interrupt** an 
  impact move against you; on a grim, it takes the move in your place. Either way, take **+1d** on 
  your follow-up against the attacker.
---
id: conjuration-twin-souls
type: talent
name: Twin Souls
class: conjuration
kind: class
restrictions: [Needs a thrall]
source: the-classes/conjuration#twin-souls
body: Your thrall is a pair — or, with *Atromancy*, any two of your bindings — in the world at once.
  Your Thrall pool starts at **6d**, the pair can be in two places and work two tasks, and together 
  they can take one more harm before the binding breaks.
---
id: destruction-the-elements
type: talent
name: The Elements
class: destruction
kind: core
core: true
growth: At levels 2, 4, and 6, learn 1 new touchstone.
levels: [2, 4, 6]
restrictions: [Destruction only]
source: the-classes/destruction#the-elements
body: |-
  You have spellcasting ability. You roll **Presence**, and your touchstones are **elements** — *fire* (it spreads, and it frightens) — *frost* (it slows, and it numbs) — *shock* (it leaps, and it eats magic) — and **forms** — *bolt — burst — cloak — rune — stream — touch — wall.* Choose any **4**, with at least one of each kind. There's no limit to your casting, but Destruction is never safe: your spells **always carry risk** and always need a roll. **Push yourself** to cast a **potent** spell.

  *Backlash:* Rolling two or more 1s when you cast (thorns included) sets it off. Choose how yours shows: *the element turns on you (take a mark) — it runs wild (a 2d story roll says where) — it draws something's eye (+1 suspense).*
---
id: destruction-novice-destruction
type: talent
name: Novice Destruction
class: destruction
kind: class
source: the-classes/destruction#novice-destruction
body: The dabbler's door. Choose **one element and one form**. You can cast spells with them, 
  rolling Presence — always at risk, never potent, and with no backlash. *(Destruction already your 
  class? Learn 1 more touchstone.)*
---
id: destruction-impact
type: talent
name: Impact
class: destruction
kind: class
source: the-classes/destruction#impact
body: 'Your spells hit like a dropped anvil. On a perfect with a destructive spell, staff, or scroll,
  add one: *knocked sprawling — driven back — their own spell or shout breaks off unfinished.* Once per
  session, you can **interrupt** an impact move with a blast; **push yourself** to do it once more.'
---
id: destruction-rune-master
type: talent
name: Rune Master
class: destruction
kind: class
source: the-classes/destruction#rune-master
body: 'Given time, you can scribe **potent runes** — on a floor, a door, a chest, a coin — that go off
  when your trigger is met: *a tread — a touch — a word — a kind of creature.* You can **push yourself**
  to cast one on the spot. On a perfect when a rune of yours catches a foe, take spark.'
---
id: destruction-intense-flames
type: talent
name: Intense Flames
class: destruction
kind: class
source: the-classes/destruction#intense-flames
body: Fire in your hands — spell, torch, or lamp oil — breaks nerve. When you burn something, lesser
  foes who see it won't close with you, beasts won't cross your flame, and a tough or lesser foe 
  whose pool stands at half or less **flees**.
---
id: destruction-deep-freeze
type: talent
name: Deep Freeze
class: destruction
kind: class
source: the-classes/destruction#deep-freeze
body: Cold in your hands stops things. A foe you've struck with frost can't run, pursue, or act 
  first until it warms, and a tough or lesser foe whose pool stands at half or less **freezes 
  solid** — alive, helpless, and yours to deal with after.
---
id: destruction-disintegrate
type: talent
name: Disintegrate
class: destruction
kind: class
source: the-classes/destruction#disintegrate
body: "Lightning in your hands unmakes. A tough or lesser foe you've struck with shock can't cast or use
  a magical move for a beat — a greater one, only on a perfect — and whatever shock *finishes* is ash:
  no last words, no dying move, and nothing left to raise."
---
id: destruction-master-destruction
type: talent
name: Master Destruction
class: destruction
kind: class
restrictions: [Needs Destruction spellcasting]
source: the-classes/destruction#master-destruction
body: 'When you cast a potent spell, you can open the floodgates: **5s count as 6s, but 4s count as 1s**
  — and two or more 1s, those 4s included, is backlash. **One time only**, you can cast a ritual-sized
  storm: *fire, blizzard, or lightning over everything you can see.*'
---
id: illusion-glamour
type: talent
name: Glamour
class: illusion
kind: core
core: true
growth: At levels 2, 4, and 6, learn 1 new illusion.
levels: [2, 4, 6]
restrictions: [Illusion only]
source: the-classes/illusion#glamour
body: |-
  You have spellcasting ability. You roll **Presence**, and you know **5 illusions** of the Twelve; the illusion you cast is the spell's touchstone. Once cast, an illusion is **spent** until the next session. One cast **without risk** needs no roll and isn't spent — unless it's potent. **Given time** — a quiet beat to weave it — any illusion you cast is **potent**; you can **push yourself** to weave one that way on the spot.

  *Minds have ranks:* An illusion takes hold of a tough or lesser mind outright. It needs a potent one to hold a crowd — or a greater mind, and that only for a beat or two: it loses its next move and rolls its pool.

  **The Twelve.** *Calm — Chameleon — Charm — Command — Demoralize — Frenzy — Invisibility — Light — Night-Eye — Paralyze — Rally — Silence.*
---
id: illusion-novice-illusion
type: talent
name: Novice Illusion
class: illusion
kind: class
source: the-classes/illusion#novice-illusion
body: The dabbler's door. You learn **2 illusions** and can cast each once per session, rolling 
  Presence. Once per session, given time, one of them is potent. *(Illusion already your class? 
  Learn 1 more illusion.)*
---
id: illusion-animage
type: talent
name: Animage
class: illusion
kind: class
source: the-classes/illusion#animage
body: "Beasts are minds too, and simple ones. When you meet an animal, make a story roll for its mood,
  or spend thread to set it: *calm — cowed — curious — yours a while.* You can **push yourself** to roll
  Presence against a beast that's enraged or attacking: on a success, a tough or lesser one breaks off,
  and a greater one hesitates — roll its pool. You always sense how an animal is about to react."
---
id: illusion-kindred-mage
type: talent
name: Kindred Mage
class: illusion
kind: class
source: the-classes/illusion#kindred-mage
body: People are open books in a careless hand. You gain **1 thread per session**, and can spend 
  thread when you first meet someone to know their foremost surface thought. If you follow up on it,
  it counts as a setup.
---
id: illusion-quiet-casting
type: talent
name: Quiet Casting
class: illusion
kind: class
source: the-classes/illusion#quiet-casting
body: Your magic makes no sound and no show. Any spell you work — your own, a scroll's, a staff's — 
  needs no word or gesture, and nobody knows it was cast unless its effect gives it away. You can 
  cast bound, gagged, or smiling across a dinner table.
---
id: illusion-hypnotic-gaze
type: talent
name: Hypnotic Gaze
class: illusion
kind: class
source: the-classes/illusion#hypnotic-gaze
body: "Given time, hold someone's eyes and learn one: *the price of their loyalty — their greatest fear
  — their deepest desire — their next move — what they're hiding — whom they serve.* It only works on
  someone once. You can **push yourself** to do it on the spot."
---
id: illusion-aspect-of-terror
type: talent
name: Aspect of Terror
class: illusion
kind: class
source: the-classes/illusion#aspect-of-terror
body: 'You can roll **Presence** to plant a fear in someone: *of the dark — of you — of their master —
  of drawing steel — of this very room.* Decide when it wakes: *now — soon — on a trigger you name.* It
  only works on someone once.'
---
id: illusion-master-of-the-mind
type: talent
name: Master of the Mind
class: illusion
kind: class
restrictions: [Needs Illusion spellcasting]
source: the-classes/illusion#master-of-the-mind
body: "Your illusions take hold of things that have no business having minds — the walking dead, Daedra,
  Dwemer machines — and on a critical when you cast, the illusion isn't spent. **One time only**, you
  can cast an illusion as a ritual: *a town that sleeps till noon — an army that forgets why it marched
  — a night that lasts three days.*"
---
id: mysticism-the-old-way
type: talent
name: The Old Way
class: mysticism
kind: core
core: true
growth: At levels 3 and 6, learn 1 new discipline, and gain 1 more potent spell per session before 
  strain sets in.
levels: [3, 6]
restrictions: [Mysticism only]
source: the-classes/mysticism#the-old-way
body: |-
  You have spellcasting ability. You roll **Wits**, and your touchstones are **2 disciplines** of the five:
  - **Detection** — life, death, enchantment, the thing sought. *Sense who's behind the door. Know a relic for what it is.*
  - **Dispelling** — the unweaving. *End a charm. Gutter a ward. Strip the glamour off a liar.*
  - **Telekinesis** — the unseen hand. *Lift the key from the guard's belt. Hurl the brazier.*
  - **The Soul** — the animus. *Trap a dying beast's soul in a gem. Feel a ghost's grief. Drink a little of someone's strength.*
  - **Translocation** — here is there. *Step across a room. Trade places with a friend. Return to a place you marked.*

  There's no limit to your spells — but to make one **potent**, you take **strain**. Each session, your first potent spell is free; the second puts **+1t** on all your spellcasting after it, until the session ends; the third makes that **+2t**, and is your last. Nothing ignores strain's thorns.
---
id: mysticism-novice-mysticism
type: talent
name: Novice Mysticism
class: mysticism
kind: class
source: the-classes/mysticism#novice-mysticism
body: The dabbler's door. Choose **1 discipline**; you can cast spells with it, rolling Wits — never
  potent. *(Mysticism already your class? Gain 1 more potent spell per session before strain sets 
  in.)*
---
id: mysticism-detect-life
type: talent
name: Detect Life
class: mysticism
kind: class
source: the-classes/mysticism#detect-life
body: 'You always sense the living near you — through walls, in the dark, behind a calm face — though
  not who or what they are. Given a quiet moment, ask: *how many — how big — how close — which one is
  afraid?* Nothing with a heartbeat takes you by surprise. *(With the Detection discipline, you also know
  who and what they are.)*'
---
id: mysticism-soul-stealer
type: talent
name: Soul Stealer
class: mysticism
kind: class
source: the-classes/mysticism#soul-stealer
body: "Empty soul gems are tools of your trade. Once per scene, when you help fell a creature, you can
  catch its soul; you can carry **three** filled gems. Spend one to: *feed a soul-fed relic (a common
  soul restores 2d; a grand one, from anything elite or greater, fills it) — sell it (your Coin gains
  1d)* — or, once per session, *make a spell you're casting potent at no cost.* Black gems hold the souls
  of people. Everyone knows what that makes you."
---
id: mysticism-enchanter
type: talent
name: Enchanter
class: mysticism
kind: class
source: the-classes/mysticism#enchanter
body: "Once per session, given a moment, lay a working on a weapon or piece of gear — yours or an ally's
  — giving it a trait: *flaming — frostbitten — shocking — silent — featherlight — seeking — warding.*
  It holds for the session, and whoever carries it can end it early to produce one **potent** effect of
  that trait. A filled soul gem buys one more working each session."
---
id: mysticism-reflect-spell
type: talent
name: Reflect Spell
class: mysticism
kind: class
source: the-classes/mysticism#reflect-spell
body: "Each session you have a *2d Reflection* power pool: roll it to **interrupt** hostile magic as it's
  cast. On a perfect, turn the magic back on its source."
---
id: mysticism-mark-and-recall
type: talent
name: Mark and Recall
class: mysticism
kind: class
source: the-classes/mysticism#mark-and-recall
body: 'Given time, you can: *set your Mark where you stand (you hold one) — Recall to it from anywhere
  in the province,* with whatever you carry. You can **push yourself** to Recall on the spot, or to bring
  along everyone touching you; either way it carries risk. With no Mark set, the spell finds the nearest
  temple or shrine instead, as the old Interventions did.'
---
id: mysticism-clairvoyance
type: talent
name: Clairvoyance
class: mysticism
kind: class
source: the-classes/mysticism#clairvoyance
body: Once per session, in a calm moment, describe a brief course of action you're considering, and 
  the GM tells you how it would go. If there's risk in it, make a montage roll to see how it would 
  play out. Then decide whether to do it.
---
id: restoration-the-rites
type: talent
name: The Rites
class: restoration
kind: core
core: true
growth: At levels 3 and 6, gain +1d to each rite.
levels: [3, 6]
restrictions: [Restoration only]
source: the-classes/restoration#the-rites
body: |-
  You have spellcasting ability, held as **rites**: power pools you roll in place of a stat to cast, each one its own touchstone. Choose **1 major rite** (*6d*) and **2 minor rites** (*4d*); they refill each session. Drop **1d** before rolling to cast a **potent** spell. A riskless spell succeeds without question — but every casting rolls its pool.
  - **Healing** — *Close a wound. Ease pain and fear. Knit bone — potent, and harm clears.*
  - **Warding** — *Raise a ward against spell and breath. Bless a threshold. Turn a blow aside.*
  - **Fortifying** — *Lend strength, speed, or nerve. Steady a hand. Lay a blessing that lasts.*
  - **Purging** — *Cure a disease. Draw out poison. Break a paralysis; lift a curse.*
  - **Sunfire** — *Sear the undead. Turn them, and hold them back. Carry a light Daedra flinch from.*
  - **Absorbing** — *Drain a foe's vigor into yourself. Borrow a skill for a moment. Leech a relic's charge.*
---
id: restoration-novice-restoration
type: talent
name: Novice Restoration
class: restoration
kind: class
source: the-classes/restoration#novice-restoration
body: "The dabbler's door. Choose **1 rite**: you hold it as a *4d* power pool each session, and can drop
  1d to cast a potent spell. *(Restoration already your class? Your major rite gains +1d.)*"
---
id: restoration-regeneration
type: talent
name: Regeneration
class: restoration
kind: class
source: the-classes/restoration#regeneration
body: "When a scene ends while you're bloodied or desperate, make a 2d story roll: on a messy, one harm
  fades to a mark; on a perfect, it clears. It is magic, and it shows: silence it or dispel it, and it
  stops."
---
id: restoration-necromage
type: talent
name: Necromage
class: restoration
kind: class
source: the-classes/restoration#necromage
body: Your magic hates the dead, and they know it. Take **+1d** on any roll against the undead — 
  spell, blessed steel, or a held symbol. You always get a hint or reveal when the dead are near or 
  a corpse isn't resting, and lesser undead never strike you first.
---
id: restoration-respite
type: talent
name: Respite
class: restoration
kind: class
source: the-classes/restoration#respite
body: Whoever you heal — by spell, potion, or your own two hands — also clears every mark and their 
  vex, and stands up **set up** for their next roll.
---
id: restoration-ward-absorb
type: talent
name: Ward Absorb
class: restoration
kind: class
source: the-classes/restoration#ward-absorb
body: "Each session you have a *2d Ward* resource pool: when a spell, a breath, or a shout would strike
  you, roll it to stop the magic at the ward; **push yourself** to do the same for an ally near you. When
  the pool empties, the ward's charge is yours: your next spell is potent at no cost."
---
id: restoration-recovery
type: talent
name: Recovery
class: restoration
kind: class
restrictions: [Needs magic to regain]
source: the-classes/restoration#recovery
body: Once per session, when you take a breather, **regain magic** — and this once, a spent potent 
  spell counts.
---
id: restoration-avoid-death
type: talent
name: Avoid Death
class: restoration
kind: class
source: the-classes/restoration#avoid-death
body: "Once per session, when you would be **dropped**, you aren't: the light catches you. You're on your
  feet, desperate, with every mark cleared — and everyone saw."
---
id: acrobatics-momentum
type: talent
name: Momentum
class: acrobatics
kind: core
core: true
growth: At levels 2, 4, and 6, gain +1 Momentum per scene.
levels: [2, 4, 6]
restrictions: [Acrobatics only]
source: the-classes/acrobatics#momentum
body: |-
  Each scene you have **2 Momentum**. Before any roll you make on the move — leaping, swinging, tumbling, running the rail — spend Momentum to **remove that many thorns**. If that removes every thorn on the roll, they come back as **Momentum dice**: roll them anyway, and each 7 or 8 *raises* your result one step. When a thorn cuts one of your rolls, gain 1 Momentum, even past your limit.

  *Dodge:* Once per session, you can **interrupt** an impact move with: *a roll under it — a leap over it — a kick off the wall.*
---
id: acrobatics-water-jump
type: talent
name: Water Jump
class: acrobatics
kind: class
source: the-classes/acrobatics#water-jump
body: 'You can pull off **potent feats of leaping and balance** — a spring off the surface of a river,
  a run along a clothesline, the jump between towers — and you land like a cat: harm from a fall lands
  one step lighter.'
---
id: acrobatics-leaping-strike
type: talent
name: Leaping Strike
class: acrobatics
kind: class
source: the-classes/acrobatics#leaping-strike
body: "When you attack from the air — off a balcony, a saddle, a chandelier, somebody's shoulders — ignore
  thorns from your foe's size, reach, and guard. On a perfect, choose one: *bear it to the ground — land
  past it, where you meant to be — leave it open (the next ally to strike is set up).*"
---
id: acrobatics-daring
type: talent
name: Daring
class: acrobatics
kind: class
source: the-classes/acrobatics#daring
body: 'Once per scene, when you do something with pure reckless abandon, **5s count as 6s, but 4s count
  as 1s.** Whatever comes of it, everyone watching is briefly struck by: *awe — bewilderment — panic —
  delight.*'
---
id: acrobatics-fancy-footwork
type: talent
name: Fancy Footwork
class: acrobatics
kind: class
source: the-classes/acrobatics#fancy-footwork
body: 'On a perfect when you fight to gain position rather than to wound — the feint, the circle, the
  stair taken backwards — roll a related pool anyway, by: *seizing the opening — unnerving your foe.*'
---
id: acrobatics-grand-entrance
type: talent
name: Grand Entrance
class: acrobatics
kind: class
source: the-classes/acrobatics#grand-entrance
body: You can always arrive in a scene exactly where and when you want, limited only by what a body 
  can do. Make a 3d story roll to set your entrance and its effect — done right, it can even work as
  an interrupt. *(Through the skylight. Out of the hay cart. You were on the rafters the whole 
  time.)*
---
id: acrobatics-slip-free
type: talent
name: Slip Free
class: acrobatics
kind: class
source: the-classes/acrobatics#slip-free
body: "Ropes, manacles, a troll's fist, a cell with a window the size of a cat: given time, you can pull
  off a **potent feat of escape**. You can **push yourself** to do it on the spot."
---
id: acrobatics-tumblers-trick
type: talent
name: Tumbler's Trick
class: acrobatics
kind: class
source: the-classes/acrobatics#tumblers-trick
body: You can **push yourself** and describe how you use the scenery — the rope, the banner, the 
  cart that's just leaving — to take **+1d**. The more improbable the prop, the better it tends to 
  work.
---
id: light-armor-evasion
type: talent
name: Evasion
class: light-armor
kind: core
core: true
growth: At levels 3 and 6, gain +1 Evasion per scene.
levels: [3, 6]
restrictions: [Light Armor only]
source: the-classes/light-armor#evasion
body: |-
  Light armor never costs you thorns — to sneak, climb, swim, or run — and you can sleep in it. Each scene you have **2 Evasion**. Spend 1 to:
  - **Sidestep** — after you roll a defense against something a body could dodge, raise the result one step: grim to messy, messy to perfect.
  - **In and out** — when a roll you made to strike comes up messy, you're already gone: the GM banks suspense instead of making the impact move.
  - **Slip away** — break from a melee, a grapple, or a closing ring of foes with no roll and no parting blow.
---
id: light-armor-agile-defender
type: talent
name: Agile Defender
class: light-armor
kind: class
source: the-classes/light-armor#agile-defender
body: You ignore thorns on Agility defense rolls, except thorns from your own damage. On a perfect 
  one, you also end up anywhere nearby you like — behind them, on the stair, at the door.
---
id: light-armor-custom-fit
type: talent
name: Custom Fit
class: light-armor
kind: class
source: the-classes/light-armor#custom-fit
body: 'Your armor is cut for you alone: blackened buckles, a blade in the bracer, pockets nobody finds.
  It passes for ordinary clothing — no one takes you for armored — and a search always misses **one small
  thing**: a pick, a knife, a vial, a folded note. Decide what it was when you need it.'
---
id: light-armor-unhindered
type: talent
name: Unhindered
class: light-armor
kind: class
restrictions: [Works in light armor]
source: the-classes/light-armor#unhindered
body: 'Each session you have a *2d Leathers* resource pool: when physical harm would land on you in light
  armor, roll it — the blow slides off boiled hide, or finds you not quite there.'
---
id: light-armor-wind-walker
type: talent
name: Wind Walker
class: light-armor
kind: class
source: the-classes/light-armor#wind-walker
body: You recover on the move. On a perfect with an unmarked stat, clear a mark on another stat.
---
id: light-armor-matching-set
type: talent
name: Matching Set
class: light-armor
kind: class
source: the-classes/light-armor#matching-set
body: 'Your kit was made as a set, and it shows. Choose three pieces: *boots (silence, footing) — gloves
  (grip, quick fingers) — hood (unnoticed, unrecognized) — cuirass (take the hit) — cloak (weather, concealment)
  — bracers (the parry, the hidden blade).* Once per session each, take **+1d** on a roll that piece helps.'
---
id: light-armor-deft-movement
type: talent
name: Deft Movement
class: light-armor
kind: class
source: the-classes/light-armor#deft-movement
body: "Once per session, a physical blow that would land on you — any mark, any harm — simply doesn't:
  you weren't there. You can **push yourself** to do it once more."
---
id: light-armor-shrouded
type: talent
name: Shrouded
class: light-armor
kind: class
source: the-classes/light-armor#shrouded
body: "Each session you have a *2d Disguise* resource pool: roll it to pass at a glance for someone you're
  not — a guard, a pilgrim, a servant, a particular face seen from across a hall. It holds until you act
  out of character, or the pool runs dry at a bad moment."
---
id: marksman-the-hunt
type: talent
name: The Hunt
class: marksman
kind: core
core: true
growth: At levels 3 and 6, name +1 quarry per session.
levels: [3, 6]
restrictions: [Marksman only]
source: the-classes/marksman#the-hunt
body: |-
  Once per session, name one foe as your **quarry** — a creature, a person, or a single pack that fights as one pool — that you've had a look at or found the trail of. It stays your quarry for the session, and you have a **Hunter's die**, a special d6: whenever you or an ally researches, tracks, or attacks your quarry, add the die to the roll. When it lands a **6**, add a **critical effect**.

  *Steady:* With a breath to aim, you ignore thorns from range, wind, and poor light — out to the honest limit of the bow.
  *Woodcraft:* Take **+1d** when you scout, track, or hunt, and on defense rolls against the land itself: weather, bad ground, the river in flood.
---
id: marksman-eagle-eye
type: talent
name: Eagle Eye
class: marksman
kind: class
source: the-classes/marksman#eagle-eye
body: You see farther and truer than anyone living. You can pull off **potent feats of observation**
  — reading lips across a courtyard, counting riders on the far ridge, spotting the one stone that 
  isn't mortared — and you always get at least a **hint** on vigilance against anything that could 
  be seen.
---
id: marksman-steady-hand
type: talent
name: Steady Hand
class: marksman
kind: class
source: the-classes/marksman#steady-hand
body: Given time to settle, breathe, and aim, you can pull off **potent feats of ranged precision** 
  — the rope cut at a hundred paces, the arrow through a visor slit, a shot beyond the bow's reach. 
  You can **push yourself** to do it on the spot.
---
id: marksman-quick-shot
type: talent
name: Quick Shot
class: marksman
kind: class
source: the-classes/marksman#quick-shot
body: Once per session, you can **interrupt** an impact move with an arrow — the hand on the lever, 
  the knife at a friend's throat, the mage mid-word. You can **push yourself** to do it once more.
---
id: marksman-power-shot
type: talent
name: Power Shot
class: marksman
kind: class
source: the-classes/marksman#power-shot
body: 'Once per scene, before a shot, declare it also: *pins them where they stand — knocks them down
  — takes something out of their hand — drives them back.* On a perfect or messy, it happens too. You
  can **push yourself** to call another.'
---
id: marksman-hunters-discipline
type: talent
name: Hunter's Discipline
class: marksman
kind: class
source: the-classes/marksman#hunters-discipline
body: You always have a read on where trouble will come from. You can **push yourself** to shout a 
  warning and goad the GM into spending suspense on a move you declare against the party — everyone 
  who heeds you takes **+1d** on the defense roll and on their follow-up against the source.
---
id: marksman-ranger
type: talent
name: Ranger
class: marksman
kind: class
source: the-classes/marksman#ranger
body: "You walked this ground yesterday. You gain **1 thread per session**, and can spend thread to flash
  back to scouting ahead: *find a way out — learn a patrol's rhythm — set a snare — survey the place (ask
  2 questions) — take out a lone danger.* Make a 3d montage roll; the GM always takes suspense in place
  of an impact move."
---
id: marksman-bullseye
type: talent
name: Bullseye
class: marksman
kind: class
source: the-classes/marksman#bullseye
body: 'Once per session, when a shot of yours hits, it hits *there*: add a critical effect — and a tough
  or lesser foe is out of the fight, pinned, dropped, or running, as you choose. You can **push yourself**
  to do it once more.'
---
id: mercantile-the-ledger
type: talent
name: The Ledger
class: mercantile
kind: core
core: true
growth: At levels 2, 4, and 6, gain +1 Favor per session.
levels: [2, 4, 6]
restrictions: [Mercantile only]
source: the-classes/mercantile#the-ledger
body: |-
  Each session you have **3 Favors** — credit, debts, and things arranged in advance. Spend 1, no roll needed, to:
  - **I bought one earlier** — produce any ordinary thing you could have bought in the last town: rope, a guard's surcoat, a mule, the right wine.
  - **I know a person** — in any settlement, name a contact — a fence, a clerk, a caravan-master — who does business with you and will do a reasonable favor.
  - **Hired hands** — it turns out you paid for help: a guide, a porter, a sellsword lends **outside help** where they're suited, until the scene ends.
  - **Appraise** — handle a thing, or sit across from the other party a moment, and ask two: *what's it really worth — who wants it most — what's wrong with it — what do they need from this deal — where's their walk-away?*

  Or spend 1 **and roll Presence** to: *pull off a potent feat of dealmaking — interrupt an impact move that coin could stop (the guard's shout, the sellsword's charge, the informer's pen).*
---
id: mercantile-haggling
type: talent
name: Haggling
class: mercantile
kind: class
source: the-classes/mercantile#haggling
body: You take **+1d** to barter, bargain, and bid, and whenever you roll your *Coin*, one die that 
  would drop stays — unless it's the last.
---
id: mercantile-merchant
type: talent
name: Merchant
class: mercantile
kind: class
source: the-classes/mercantile#merchant
body: "You can always find a buyer or a seller — for anything, anywhere people trade; it's only a matter
  of price. And you know goods: you're never cheated, and you can tell stolen, forged, or cursed at a
  touch — though not the story."
---
id: mercantile-investor
type: talent
name: Investor
class: mercantile
kind: class
source: the-classes/mercantile#investor
body: "You've put money into shops, stables, and ships across the province. Each session you have a *3d
  Credit* resource pool: roll it to call in what the trade owes you — passage, storage, a loan, an introduction,
  a bed with no questions. At 0d you've overdrawn; you can still have what you want by burning that bridge."
---
id: mercantile-fence
type: talent
name: Fence
class: mercantile
kind: class
source: the-classes/mercantile#fence
body: "You know the gray market of every city: who buys what was never for sale, who forges seals, who
  moves people. You can always shift stolen goods, and you read **shadowmarks** — the Thieves Guild's
  scratched signs — which gets you a hint or reveal on vigilance wherever thieves have worked."
---
id: mercantile-master-trader
type: talent
name: Master Trader
class: mercantile
kind: class
source: the-classes/mercantile#master-trader
body: 'You arranged it days ago. You gain **1 thread per session**, and can spend thread to flash back
  to the arrangement: *a bribed official — a wagon waiting — a guard shift bought — a forged bill of lading
  — sellswords on retainer.* Make a 3d montage roll; the GM always takes suspense in place of an impact
  move.'
---
id: mercantile-golden-touch
type: talent
name: Golden Touch
class: mercantile
kind: class
source: the-classes/mercantile#golden-touch
body: 'Gold likes you. You always get a hint on vigilance when treasure is hidden nearby, and once per
  session, when you search a place or a body, you find more than was there: add **1d** to your *Coin*
  (even past its start), or turn up one small valuable that somebody will want back.'
---
id: mercantile-bribery
type: talent
name: Bribery
class: mercantile
kind: class
source: the-classes/mercantile#bribery
body: "Everyone has a price, and you can always learn it — though not always pay it. Once per session,
  when you're caught red-handed, stopped by a guard, or facing a fine or a cell, coin changes hands and
  the problem goes away, *for now*: make a story roll for whether it stays gone. Roll your *Coin* to do
  it again."
---
id: security-picks
type: talent
name: Picks
class: security
kind: core
core: true
growth: At levels 3 and 6, gain +1d Picks.
levels: [3, 6]
restrictions: [Security only]
source: the-classes/security#picks
body: |-
  Given time and your tools, you **always** open an ordinary lock and disarm an ordinary trap — no roll. Speed, silence, and the *extraordinary* are where your real work starts. Each session you have a *4d Picks* resource pool: roll it to do the job **now** — in a breath, without a sound — or to beat an extraordinary lock, trap, or mechanism outright, with no action roll. Drop **1d** first to pull off a **potent feat** of the craft: a vault cracked during a guard's sneeze, a trap disarmed from across the room, a Dwemer lock rebuilt so only you can open it.

  *A burglar's eye:* You always get a **reveal** on vigilance against traps, alarms, and hidden doors, and you can **rig** whatever you disarm — turn a trap around, jam a gate, silence a bell.
  *Rigged it earlier:* In any scene, roll Picks to have tampered with something before the trouble started: a jammed door, a cut saddle-girth, a loosened stair, a bell with no clapper.
---
id: security-quick-hands
type: talent
name: Quick Hands
class: security
kind: class
source: the-classes/security#quick-hands
body: Your hands are faster than the eye. Given a moment's cover, lifting a key, palming a gem, or 
  planting a letter needs no roll — and working a lock or a trap in plain sight looks like fumbling 
  with a latch. Nobody notices unless they were watching *you*.
---
id: security-wax-key
type: talent
name: Wax Key
class: security
kind: class
source: the-classes/security#wax-key
body: "Any lock you've opened, and any key you've held for a breath, you can copy: you never need to pick
  the same door twice. Once per session, declare you already took an impression of a key you plausibly
  had a chance at — the jailer's ring you bumped, the steward's desk."
---
id: security-treasure-hunter
type: talent
name: Treasure Hunter
class: security
kind: class
source: the-classes/security#treasure-hunter
body: If there's a hidden compartment, you find it. Once per session, when you open a locked chest, 
  vault, or sealed room, make a 2d story roll for what else is inside. **Perfect:** a minor relic, 
  or exactly what you needed. **Messy:** coin (+1d to your pool) and a clue. **Grim:** coin — and 
  whose it was is about to matter.
---
id: security-locksmith
type: talent
name: Locksmith
class: security
kind: class
source: the-classes/security#locksmith
body: 'You make locks as well as you break them. Given time, you can **secure** a place — a door, a chest,
  a camp, a cell: nothing ordinary gets in or out without your key, and anything extraordinary has to
  make noise doing it. You can also ruin a lock for good, or change it so that only your key fits.'
---
id: security-unbreakable
type: talent
name: Unbreakable
class: security
kind: class
source: the-classes/security#unbreakable
body: "Your nerve holds when your picks would snap. You ignore thorns from pressure — time running out,
  boots on the stair, a blade at your back, the floor shaking — on any roll of fine work: locks, traps,
  surgery, forgery, a rune that's already glowing."
---
id: security-master-locks
type: talent
name: Master Locks
class: security
kind: class
source: the-classes/security#master-locks
body: "You can pick what isn't a lock. Puzzle doors, Ayleid seals, warded vaults, a Daedric binding: you
  read them as mechanisms and open them with your *Picks* like any other — or roll with **+1d**, if you
  have none. **One time only**, you can open something that cannot be opened."
---
id: security-trapwright
type: talent
name: Trapwright
class: security
kind: class
source: the-classes/security#trapwright
body: Given time, you can set **potent traps** — choose an effect (*blade — snare — fire — poison — 
  collapse — alarm*) and a trigger (*tripwire — pressure plate — bait — a door — a count of ten*). 
  You can **push yourself** to deploy one on the spot. On a perfect when a trap of yours catches a 
  foe, take spark.
---
id: sneak-shadow
type: talent
name: Shadow
class: sneak
kind: core
core: true
growth: At levels 3 and 6, gain +1d Shadow.
levels: [3, 6]
restrictions: [Sneak only]
source: the-classes/sneak#shadow
body: |-
  You never take thorns for sneaking at speed, in poor cover, or across bad ground. Each scene you have a *3d Shadow* resource pool. Roll it to be:
  - **Unseen** — when a roll, a GM move, or plain bad luck would get you noticed, you aren't: a shadow deepens, a guard decides it was the wind. Whatever else went wrong still went wrong.
  - **Unexpected** — when you strike a foe who doesn't know you're there and the roll succeeds, add a **critical effect**.

  With Shadow at 0d, you sneak like anyone else — until the next scene.
---
id: sneak-backstab
type: talent
name: Backstab
class: sneak
kind: class
source: the-classes/sneak#backstab
body: When you strike a target who doesn't know you're there, ignore thorns from its armor, size, 
  and toughness. You can **push yourself** to make the strike **potent**. On a critical — pushed or 
  not — a tough or lesser foe is out of the fight without a sound.
---
id: sneak-deadly-aim
type: talent
name: Deadly Aim
class: sneak
kind: class
source: the-classes/sneak#deadly-aim
body: "A shot from hiding doesn't give you away: after you loose, nobody knows where it came from unless
  the GM spends suspense to find you. Take **+1d** on shots at targets who don't know you're there."
---
id: sneak-assassins-blade
type: talent
name: Assassin's Blade
class: sneak
kind: class
source: the-classes/sneak#assassins-blade
body: Given time alone with a target who is helpless or unaware — asleep, bound, at prayer, in the 
  bath — you can end a tough or lesser one with no roll. A greater one gets your best potent strike.
  **One time only**, on a perfect against someone who never saw you, they are simply dead, whoever 
  they were. Common sense takes precedence.
---
id: sneak-muffled-movement
type: talent
name: Muffled Movement
class: sneak
kind: class
source: the-classes/sneak#muffled-movement
body: "On a perfect when you sneak past someone or watch them unseen, they also: *let something slip —
  give you a golden opening.* If you're caught sneaking, you can **push yourself** to freeze and go unnoticed
  after all — but you must leave the area right after."
---
id: sneak-light-foot
type: talent
name: Light Foot
class: sneak
kind: class
source: the-classes/sneak#light-foot
body: Traps aren't your problem. You never set off pressure plates, tripwires, or the board that 
  creaks; you always get at least a **hint** on vigilance against traps; and anyone who steps 
  exactly where you step is as safe as you are.
---
id: sneak-shadow-warrior
type: talent
name: Shadow Warrior
class: sneak
kind: class
source: the-classes/sneak#shadow-warrior
body: You can **push yourself** to vanish in plain sight, mid-fight, with nothing for cover but a 
  flicker of shadow and a turned head. Your foes lose you, and your next strike comes from hiding.
---
id: sneak-light-fingers
type: talent
name: Light Fingers
class: sneak
kind: class
source: the-classes/sneak#light-fingers
body: Given a moment's closeness, lifting a purse, a key, or a letter — or planting one — needs no 
  roll against anyone not already wary of you. Once per session, declare you already took something 
  small from someone you brushed past earlier.
---
id: speechcraft-the-silver-tongue
type: talent
name: The Silver Tongue
class: speechcraft
kind: core
core: true
growth: At levels 2, 4, and 6, gain +1 Sway per session.
levels: [2, 4, 6]
restrictions: [Speechcraft only]
source: the-classes/speechcraft#the-silver-tongue
body: |-
  Anything that can understand you will **always hear you out** once before it comes to blows — unless you struck first. Each session you have **3 Sway**. Spend 1, no roll needed, to: *raise an ally's die result by 1 (a 3 becomes a 4) — calm or provoke someone's vex — talk an ally down from a mark (clear it).*

  Or spend 1 **and roll Presence** to: *pull off a potent feat of persuasion — interrupt an impact move that hinges on someone's decision — talk an ally out of being rattled (clear it).* Sway works on others, never on yourself.

  *The wheel:* A potent feat takes an approach — **admire, boast, joke,** or **coerce.** Every listener loves one of the four and hates another. The GM always tells you the one they hate; find the one they love and take **+1d**.
---
id: speechcraft-allure
type: talent
name: Allure
class: speechcraft
kind: class
source: the-classes/speechcraft#allure
body: 'People are drawn to you, and one stayed: a housecarl, a hired blade, a devoted admirer, a hound
  that chose you. Each PC adds a reciprocal bond with them. Choose 3 tricks (*carry — distract — fight
  — guard — perform — rescue — scout — search — track — warn*) and 2 flaws (*aggressive — clumsy — grumpy
  — insatiable — jumpy — noisy — overprotective — proud — unruly*). You roll **3d** for their tricks,
  **1d** otherwise. They have two damage boxes — *marked* (any mark) and *hurt* (any harm) — and can always
  leave a scene when hurt. If you lose them, another finds you in time. The GM may let you take this talent
  again for 3 more tricks and another hurt box.'
---
id: speechcraft-persuasion
type: talent
name: Persuasion
class: speechcraft
kind: class
source: the-classes/speechcraft#persuasion
body: "Given time to talk — a meal, a walk, a long night's watch — you can pull off a **potent feat of
  persuasion**: a jarl reconsiders, a zealot doubts, a captain looks the other way. You can **push yourself**
  to do it on the spot."
---
id: speechcraft-intimidation
type: talent
name: Intimidation
class: speechcraft
kind: class
source: the-classes/speechcraft#intimidation
body: "Your presence fills a room before your voice does. The GM judges an NPC's response, or spend thread
  to set it: *cowed — wary — respectful — defiant.* You can **push yourself** to pull off a potent feat
  of intimidation — backing down a mob, staring out a bandit chief, making a dremora reconsider."
---
id: speechcraft-fame
type: talent
name: Fame
class: speechcraft
kind: class
source: the-classes/speechcraft#fame
body: "They've heard of you. In any new town or district you can always: *be recognized — know someone
  useful — make a fast friend.* They'll do you a reasonable favor; take spark if you promise to pay them
  back. Track how far your name has traveled with a campaign pool — whether it's fame or infamy depends
  on who's telling it."
---
id: speechcraft-sharp-tongue
type: talent
name: Sharp Tongue
class: speechcraft
kind: class
source: the-classes/speechcraft#sharp-tongue
body: 'Once per session, with an insult, a boast, or a dare, goad the GM into spending suspense on an
  impact move aimed at you alone. Take **+1d** on the defense roll, and on a perfect your foe: *keeps
  coming at you — leaves an opening (an ally is set up) — is made a fool of in front of everyone.*'
---
id: speechcraft-rumors
type: talent
name: Rumors
class: speechcraft
kind: class
source: the-classes/speechcraft#rumors
body: You gain **any 3 wises** and **1 extra thread per session**, and take **+1d** on story rolls 
  about what you've heard — the ones your own story details call for included. Wherever people 
  gather, an hour's listening tells you what everyone's talking about, and which part of it is 
  false.
---
id: speechcraft-oratory
type: talent
name: Oratory
class: speechcraft
kind: class
source: the-classes/speechcraft#oratory
body: "Twice per session, with a shout, a speech, or a song, do one: *raise an ally's die result by 1
  — calm or provoke a vex — clear a mark from every ally who can hear you.* And a crowd is one listener
  to you: a mob, a garrison, or a congregation can be swayed as a single mind."
---
id: vampire-the-blood
type: talent
name: The Blood
class: vampire
kind: core
core: true
growth: At levels 3 and 6, gain +1d Blood.
levels: [3, 6]
restrictions: [Vampire only]
source: the-classes/vampire#the-blood
body: |-
  You don't age, breathe, or sicken: disease and poison are nothing to you, and cold lands one step lighter. You see in the dark and can hear a heartbeat through a door. You have a *4d Blood* power pool. Roll it in place of a stat for the **gifts**: *the strength and speed of the grave — the Seduction (still or sway a mortal mind) — the Drain (pull the life from something at arm's length).*

  **Feeding.** Blood doesn't come back with the session — only by feeding. A sip from the willing, the sleeping, or the charmed puts back **2d**; drinking someone dry refills it, and is murder. Either way **the GM takes suspense**: marks on a neck, a rumor in the market, a Vigilant with a list. Your first sip of each session is the exception — you'd arranged it.

  **The price.** Under the open sun you take **+1t** on everything and can't roll Blood at all. Fire lands one step heavier on you. At **0d** you're starving: +1t on everything until you feed, and it shows in your face.
---
id: vampire-power-of-the-grave
type: talent
name: Power of the Grave
class: vampire
kind: curse
restrictions: [All need the blood]
source: the-classes/vampire#power-of-the-grave
body: "Once per session you can take the shape the old blood remembers — the **Vampire Lord**: winged,
  grey, terrible — for a scene. In it you fly in long swoops, your gifts take **+1d**, and blows that
  would merely mark you don't land. Lesser mortals who see it take vex, and nobody who sees it forgets.
  It ends with the scene, or when your Blood runs dry."
---
id: vampire-detect-all-creatures
type: talent
name: Detect All Creatures
class: vampire
kind: curse
restrictions: [All need the blood]
source: the-classes/vampire#detect-all-creatures
body: "You know where everything near you is — the living, the dead, the bound — through walls and darkness.
  And you hear hearts: you know when someone close is afraid, and when they're about to move. Nothing
  with a pulse ambushes you."
---
id: vampire-mist-form
type: talent
name: Mist Form
class: vampire
kind: curse
restrictions: [All need the blood]
source: the-classes/vampire#mist-form
body: "Drop **1d** of Blood (don't roll it) to become mist for a few moments: nothing ordinary harms you,
  no gap is too small, no grip holds — and you can do nothing but drift. Once per scene, you can do it
  in answer to a blow, which passes through."
---
id: vampire-supernatural-reflexes
type: talent
name: Supernatural Reflexes
class: vampire
kind: curse
restrictions: [All need the blood]
source: the-classes/vampire#supernatural-reflexes
body: You move between heartbeats. Drop **1d** of Blood (don't roll it) to take a **quick action**, 
  or to cross any gap you could sprint before anyone can react.
---
id: vampire-blood-healing
type: talent
name: Blood Healing
class: vampire
kind: curse
restrictions: [All need the blood]
source: the-classes/vampire#blood-healing
body: "Once per scene, when you feed in the thick of it — on a foe you've beaten, pinned, or charmed —
  clear **all your marks and one harm** along with the **2d** a sip brings. Nobody mourns a bandit: the
  GM takes no suspense for it."
---
id: vampire-unearthly-will
type: talent
name: Unearthly Will
class: vampire
kind: curse
restrictions: [All need the blood]
source: the-classes/vampire#unearthly-will
body: "Each session you have a *2d Will* resource pool: when you'd be rattled, vexed, or gripped by magic
  of the mind — charm, fear, command — roll it and you aren't. If the source is in sight, turn your eyes
  on it: it knows *dread*, or *doubt*, as you choose."
---
id: vampire-vampiric-grip
type: talent
name: Vampiric Grip
class: vampire
kind: curse
restrictions: [All need the blood]
source: the-classes/vampire#vampiric-grip
body: 'Roll Blood to seize a creature at a distance with nothing but will: lift it, hold it, drag it to
  you, or throw it. A tough or lesser foe is helpless while you hold on; a greater one loses its next
  move, and rolls its pool if you throw it somewhere unkind.'
---
id: werewolf-beast-blood
type: talent
name: Beast Blood
class: werewolf
kind: core
core: true
growth: At levels 3 and 6, you can change once more per session.
levels: [3, 6]
restrictions: [Werewolf only]
source: the-classes/werewolf#beast-blood
body: |-
  The beast is always with you: no disease takes root in you, you follow a scent like a hound, and you never sleep quite soundly. **Silver** lands one step heavier on you. Once per session — or in the moment you become **bloodied** — you can **change** for a scene. As the wolf:
  - Your Brawn and Agility count as **3**, your Wits and Presence as **1**, and you ignore thorns from your own harm.
  - You can pull off **potent feats of the hunt** — running down a horse, tearing a gate from its hinges, following one scent across a city, a howl that empties a street.
  - You can't speak, cast, or use tools, and you can take only **aggressive, forward actions**.
  - The change runs on a *4d Bloodlust* timer: roll it when you change — that first roll never empties it — and after each potent feat. **Feeding** on a fresh kill takes a beat and puts back 1d. At 0d you change back — spent (mark Brawn), unclothed, and wherever the hunt left you.

  *The moon's due:* The GM can offer you spark for the wolf to come out at a bad moment. It's a tangle, and yours to refuse.
---
id: werewolf-bestial-strength
type: talent
name: Bestial Strength
class: werewolf
kind: curse
restrictions: [All need the blood]
source: the-classes/werewolf#bestial-strength
body: The wolf's arm stays with you. In beast form, your first blow against each new foe adds a 
  **critical effect**. In your own skin, you can **push yourself** to pull off a potent feat of raw 
  strength.
---
id: werewolf-totem-of-ice-brothers
type: talent
name: Totem of Ice Brothers
class: werewolf
kind: curse
restrictions: [All need the blood]
source: the-classes/werewolf#totem-of-ice-brothers
body: 'Once per change, howl for the pack: wolves — or stranger kin — answer as a *3d Pack* power pool
  that hunts beside you until you change back. In your own skin, wild wolves never strike you first.'
---
id: werewolf-totem-of-the-moon
type: talent
name: Totem of the Moon
class: werewolf
kind: curse
restrictions: [All need the blood]
source: the-classes/werewolf#totem-of-the-moon
body: "The moon doesn't own you. In beast form you keep your head: your Wits and Presence count as **2**
  (or your own, if lower), you can act with patience and cunning, and you can change back whenever you
  choose. At night, under either moon, your first change of the session doesn't count against your limit."
---
id: werewolf-totem-of-the-predator
type: talent
name: Totem of the Predator
class: werewolf
kind: curse
restrictions: [All need the blood]
source: the-classes/werewolf#totem-of-the-predator
body: In either shape you can pull off **potent feats of tracking**, and you always sense the living
  near you — how many, how close, how afraid. As the wolf, you know where every heartbeat in the 
  scene is.
---
id: werewolf-totem-of-terror
type: talent
name: Totem of Terror
class: werewolf
kind: curse
restrictions: [All need the blood]
source: the-classes/werewolf#totem-of-terror
body: 'Once per change — or once per session in your own skin, as a look and a low sound — you howl. Lesser
  foes who hear it run. A tough one freezes or flees, as the GM chooses. A greater one gives ground: you
  and your allies are set up against it.'
---
id: werewolf-animal-vigor
type: talent
name: Animal Vigor
class: werewolf
kind: curse
restrictions: [All need the blood]
source: the-classes/werewolf#animal-vigor
body: 'Each time you change, you have a *2d Hide* resource pool: roll it when physical harm would land
  on the wolf. Not against silver. When you change back, one harm you took in beast form fades to a mark.'
---
id: werewolf-savage-feeding
type: talent
name: Savage Feeding
class: werewolf
kind: curse
restrictions: [All need the blood]
source: the-classes/werewolf#savage-feeding
body: When you feed, put back **2d** of Bloodlust instead of 1d. Once per change, feeding also 
  clears all your marks and one harm. Any creature of flesh will do; the beast isn't proud.
---
id: vampire-sanguinare-vampiris
type: talent
name: Sanguinare Vampiris
class: vampire
kind: curse
restrictions: [Turned in play only]
source: the-classes/introduction#the-curses
body: You are a vampire. You have *The Blood* with all its rules and its price, but your Blood pool 
  is **3d** and never grows.
---
id: werewolf-lycanthropy
type: talent
name: Lycanthropy
class: werewolf
kind: curse
restrictions: [Turned in play only]
source: the-classes/introduction#the-curses
body: You are a werewolf. You have *Beast Blood* with all its rules and its price, but your 
  Bloodlust timer starts at **3d**, and you never gain more changes per session.
