source: the-reliquary/relics-and-wonders#intervention-scroll
body: Two prayers sold by the sheet in Third Era Morrowind. **Divine Intervention** sets its reader 
  down at the nearest Imperial Cult shrine, **Almsivi Intervention** at the nearest Tribunal temple.
  No roll — one potent escape.
---
id: spell-scroll
type: arcana
name: Spell Scroll
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [Daedric letters, no schooling needed, ash between the fingers]
limit: reading takes both hands and a long breath. Struck mid-word, you lose the spell. The cheap 
