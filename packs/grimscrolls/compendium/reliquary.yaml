id: intervention-scroll
type: arcana
name: Intervention Scroll
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [invoke swiftly and wisely, the nearest altar, gone between heartbeats]
limit: it takes the reader and nobody else. Nearest is the scroll's judgment, not yours, and a few 
