source: the-reliquary/relics-and-wonders#spell-scroll
body: One spell in Daedric letters, on paper that burns as it is read. Anyone can use it, and the 
  spell goes off once, potent. The known ones have names — **Ondusi's Unhinging** for a lock, 
  **Windform** for leaving unseen, **Taldam's Scorcher** for an argument.
---
id: spell-tome
type: arcana
name: Spell Tome
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [a sigil on the cover, someone's marginalia, the page that reads back]
limit: the pages fade as the spell is learned. *Fingers of the Mountain* lay on a charred corpse at 
  Cloud Top, and the corpse was its last reader.
source: the-reliquary/relics-and-wonders#spell-tome
body: 'A spell set down to be learned, not spent. A caster of its school who gives it a quiet evening
  learns it for good: one formula, one illusion, one touchstone. Anyone else gets one casting and a headache
  (mark Wits).'
---
id: skill-book
type: arcana
name: Skill Book
tier: minor
hall: Relics & Wonders
touchstones: [an hour by the fire, one lesson that stays, a story with a use]
limit: one reader per copy and one lesson per reader. A new book crowds out the last.
source: the-reliquary/relics-and-wonders#skill-book
body: Some books teach by accident. Give the right one an hour and a lesson stays — once per 
  session, +1d on a roll the book speaks to. **The Black Arrow** steadies a bow, **The Mirror** a 
  shield arm, **Purloined Shadows** your footsteps, **Biography of the Wolf Queen** your tongue.
---
id: soul-gem-filled
type: arcana
name: Soul Gem, Filled
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [a pacing glow, warm in the fist, the crack as it spends]
limit: the gem shatters as it is used. No ordinary gem holds a person, whatever the seller said.
soul_fed: true
source: the-reliquary/relics-and-wonders#soul-gem-filled
body: A crystal with something alive in it. Spent on a soul-fed relic, a common or greater soul — a 
  troll, a sabre cat — restores 2d, and a **Grand** one — a mammoth, a dragon priest, anything elite
  or greater — fills it. Petty and lesser stones hold mudcrabs and wolves. Only merchants want them.
---
id: black-soul-gem
type: arcana
name: Black Soul Gem
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [a soul that knows its name, the Shade of the Revenant, cold in any weather]
limit: the soul spent goes to the Soul Cairn and the Ideal Masters, forever. Every temple calls that
  necromancy, and the Masters keep a list of suppliers.
soul_fed: true
source: the-reliquary/relics-and-wonders#black-soul-gem
body: A grand gem turned black on a necromancer's altar. It alone holds the soul of a person, which 
  is always grand. Filled, it restores any soul-fed relic completely, or stands as the anchor a dark
  rite demands.
---
id: welkynd-stone
type: arcana
name: Welkynd Stone
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [a light on a pedestal, magicka in cut glass, dust in the palm]
limit: either stone crumbles as it is drained, and each one taken leaves the ruin darker.
soul_fed: true
source: the-reliquary/relics-and-wonders#welkynd-stone
body: Ayleid sky-stone, a blue-green crystal that still lights their ruins from its pedestals. A 
  caster who drains one regains magic (Chapter 4), a spent potent spell included. The white **Varla 
  Stone**, rarer and often caged, fills every soul-fed relic its holder carries.
---
id: nirnroot
type: arcana
name: Nirnroot
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [a chime at the waterline, leaves that glow, Sinderion's life's work]
limit: it sings in the pack, so nobody sneaks with one. The crimson kind grows only in Blackreach. 
  Sinderion went down for it and stayed.
source: the-reliquary/relics-and-wonders#nirnroot
body: A root that grows by water, glows in the dark, and rings — a thin chime you hear before you 
  see it. Alchemists pay absurdly, and selling one adds 1d to your Coin. Brewed, it makes one potent
  draught, invisibility most often.
---
id: daedra-heart
type: arcana
name: Daedra Heart
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [still warm, ebony's dark partner, a debt in Oblivion]
limit: spent in the using. Dremora are only banished, so the heart's first owner is whole again 
  somewhere, and knows your face.
source: the-reliquary/relics-and-wonders#daedra-heart
body: The heart of a dremora, dark as old wine and warm for years. A smith needs one for each piece 
  of Daedric work. An alchemist brews it into one potent draught of healing. A conjurer lays it down
  as the anchor for a rite that reaches into Oblivion.
---
id: sleeping-tree-sap-relic
type: arcana
name: Sleeping Tree Sap
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [purple at the edges, a giant's garden, health you didn't earn]
limit: you are slow and your sight swims, +1t on anything quick or far off until you sleep. Khajiit 
  caravans pay well. The giants don't sell.
source: the-reliquary/relics-and-wonders#sleeping-tree-sap-relic
body: Sap from the leafless, purple-lit tree in the giants' camp west of Whiterun, drawn at a spigot
  somebody brave hammered in. Drink it and for a scene you feel magnificent — your harm puts no 
  thorns on your rolls.
---
id: the-white-phial
type: arcana
name: The White Phial
tier: minor
hall: Relics & Wonders
touchstones: [snow that won't melt, 'one draught, forever', an alchemist's last errand]
limit: the draught is chosen once. The Phial is found cracked in its maker's tomb, and mending it 
  takes a briar heart somebody is still using.
source: the-reliquary/relics-and-wonders#the-white-phial
body: A small bottle made from the first snow that fell on the Throat of the World. Whatever single 
  draught it is first given, it makes again. Once per session, drink — one dose, with no roll and 
  nothing taken from your Potions.
---
id: propylon-index
type: arcana
name: Propylon Index
tier: minor
hall: Relics & Wonders
touchstones: [the propylon circle, a stone easily missed, arriving unannounced]
limit: one index, one stronghold, reached only from its two neighbors in the ring. In the late Third
  Era the strongholds have tenants, and Folms Mirel of Caldera wants all ten.
source: the-reliquary/relics-and-wonders#propylon-index
body: A carved stone, thumb-sized, keyed to one of the ten old Dunmer strongholds of Vvardenfell. 
  Carry it into a neighboring stronghold's propylon chamber and step out in its own — days of 
  ashland, no roll.
---
id: dwemer-puzzle-box
type: arcana
name: Dwemer Puzzle Box
tier: minor
hall: Relics & Wonders
touchstones: [heavier than it looks, a dead script, 'one lock, somewhere below']
limit: by Imperial law every Dwemer artifact is the Emperor's, and trading one is treason. The 
  bandits and antiquarians who want it know that.
source: the-reliquary/relics-and-wonders#dwemer-puzzle-box
body: A little metal cube with a circular design and marks on one face — directions for setting a 
  Dwemer key to one lock in one ruin. To a scholar of the Dwemer it buys an answer, and bargaining 
  with one takes +1d.
---
id: attunement-sphere
type: arcana
name: Attunement Sphere
tier: minor
hall: Relics & Wonders
touchstones: [rings finding alignment, a floor become a stair, a glow from below]
limit: it works from above only, so mind which stair you came down. In the Fourth Era Septimus 
  Signus hands his out freely. He has a use for you.
source: the-reliquary/relics-and-wonders#attunement-sphere
body: A Dwemer orb of rings within rings. Set on the mechanism at the bottom of Alftand, 
  Mzinchaleft, or Raldbthar, it turns, the floor unfolds into a stair, and the way down to 
  Blackreach is open. Nothing else opens it.
---
id: centurion-dynamo-core
type: arcana
name: Centurion Dynamo Core
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [a pulse in a brass cage, steam in old pipes, the heart of the machine]
limit: one machine, one scene, and the gem goes dark. Getting one means stopping a centurion. What 
  it wakes isn't yours to command.
source: the-reliquary/relics-and-wonders#centurion-dynamo-core
body: The heart of a Dwarven centurion — a red gem turning in a cage of Dwarven metal, still beating
  after the giant around it has stopped. Seated in a dead Dwemer machine, it runs that machine for a
  scene, potent, no roll.
---
id: dragonstone
type: arcana
name: Dragonstone
tier: minor
hall: Relics & Wonders
touchstones: [a map cut in stone, mounds marked like stars, the Keeper beside it]
limit: it weighs as much as a shield. When the dragons return, Whiterun's court wizard wants it, and
  so does a woman of the Blades. Neither waits well.
source: the-reliquary/relics-and-wonders#dragonstone
body: A stone tablet from Bleak Falls Barrow, cut after the Dragon War — a map of Skyrim marked with
  every dragon's burial mound. Whoever studies it knows which grave opens next, and takes +1d to 
  find or ambush a dragon at its mound.
---
id: meridias-beacon
type: arcana
name: Meridia's Beacon
tier: minor
hall: Relics & Wonders
touchstones: [a new hand touches the beacon, a voice like noon, the road to Kilkreath]
limit: she talks until you go, loudly, at night, in company. Leave it in a ditch and it is in the 
  next chest you open.
source: the-reliquary/relics-and-wonders#meridias-beacon
body: A faceted stone, white as noon, that turns up in chests where nobody put it. A new hand 
  touches the beacon and Meridia speaks. Her temple on Mount Kilkreath is defiled, and you will be 
  mending that. Its bearer always knows the road there.
---
id: black-sacrament-effigy
type: arcana
name: Black Sacrament Effigy
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: ['sweet Mother, sweet Mother', nightshade and tallow, a knock at night]
limit: the rite is a crime, and it smells. Afterward the Brotherhood knows exactly what you are.
source: the-reliquary/relics-and-wonders#black-sacrament-effigy
body: A figure pieced from the real things — heart, skull, bones, flesh — ringed with candles. Stab 
  it with a nightshade-rubbed dagger and whisper a name to the Night Mother. Someone hears. A 
  stranger comes to set the price, and *4d The Contract* begins, a timer on one life.
---
id: morag-tong-writ-of-execution
type: arcana
name: Morag Tong Writ of Execution
tier: minor
expendable: true
hall: Relics & Wonders
touchstones: [one name in ink, a non-disputable document, 'murder, properly filed']
limit: one name, in Morrowind, declared openly. In hands that aren't Tong it is forged or stolen, 
  and the Tong settles both.
source: the-reliquary/relics-and-wonders#morag-tong-writ-of-execution
body: An honorable writ from Morrowind's lawful guild of assassins. The afore-mentioned personage is
  marked, and the bearer licensed to kill them. Do it, step forward, show the paper. The guard takes
  the writ, and no crime was done.
---
id: stone-of-barenziah
type: arcana
name: Stone of Barenziah
tier: minor
hall: Relics & Wonders
touchstones: [an unusual gem, twenty-three more, empty settings]
limit: worthless short of the set, unsellable, and oddly hard to lose. The Guild keeps the finished 
  crown.
source: the-reliquary/relics-and-wonders#stone-of-barenziah
body: An unusual gem, one of twenty-four pried from Queen Barenziah's crown and scattered across 
  Skyrim. No fence will price one, but it buys a hearing with the Thieves Guild. The full set 
  restores the **Crown of Barenziah** — once per session a strongbox you open adds 1d to your Coin.
---
id: enchanted-staff
type: arcana
name: Enchanted Staff
tier: minor
hall: Relics & Wonders
touchstones: ['one spell, no schooling', a glow at the tip, the name on the tag]
limit: '*2d*, never potent. Empty, it is a walking stick until next session, or until a filled soul gem
  is spent on it.'
pool: 2
source: the-reliquary/relics-and-wonders#enchanted-staff
body: The common sort court wizards sell — a **Staff of Sparks**, a **Staff of Fireballs**, a 
  **Staff of Frostbite** — one spell bound in its head. Anyone can use it. Roll its *2d* power pool 
  in place of a stat to cast that spell.
---
id: staff-of-the-everscamp
type: arcana
name: Staff of the Everscamp
tier: minor
hall: Relics & Wonders
touchstones: ['four scamps, always', the smell arrives first, a word left unread]
limit: you can't put it down, and it slows you, +1t on anything quick. A willing taker or the shrine
  in Darkfathom Cave ends it.
source: the-reliquary/relics-and-wonders#staff-of-the-everscamp
body: Sheogorath's joke, a staff topped with metal scamps. Read the word carved on it aloud — 
  "nonsense" — and four scamps follow you, forever. Killed, they come back. They shriek at 
  strangers, so nothing surprises your camp or fails to find it.
---
id: torchbug-in-a-jar
type: arcana
name: Torchbug in a Jar
tier: minor
hall: Relics & Wonders
touchstones: [a pocket lantern, a patient glow, the etching inside the lid]
limit: it is a bug in a jar. An inscription is etched inside the lid. Nobody knows what it means.
source: the-reliquary/relics-and-wonders#torchbug-in-a-jar
body: A live torchbug under glass. It gives a small, steady light that needs no flame and sets 
  nothing alight — enough to read by, or to find a keyhole.
---
id: horn-of-jurgen-windcaller
type: arcana
name: Horn of Jurgen Windcaller
tier: minor
hall: Relics & Wonders
touchstones: [the Way of the Voice, a tomb in the marsh, proof without words]
limit: they keep it once it is shown. More than one seeker has reached the plinth and found only a 
  note.
source: the-reliquary/relics-and-wonders#horn-of-jurgen-windcaller
body: A plain horn from the tomb of Jurgen Windcaller, founder of the Greybeards, deep in Ustengrav.
  Fetching it is their last trial. Carried up the Seven Thousand Steps it is the one proof they 
  honor — they teach its bearer one thing, or answer one question.
---
id: aetherium-shard
type: arcana
name: Aetherium Shard
tier: minor
hall: Relics & Wonders
touchstones: [blue light with no heat, a quarter of a wheel, a forgotten war]
limit: useless alone. Four make the Aetherium Crest, and the Dwemer hid them in four cities. A dead 
  woman named Katria is still looking.
source: the-reliquary/relics-and-wonders#aetherium-shard
body: A curved sliver of luminous blue crystal rimmed in Dwarven metal. Nothing living can enchant, 
  smelt, or break Aetherium, but a scholar of the Dwemer will trade a great deal to hold it, and 
  bargaining with one takes +1d.
---
id: ayleid-statue
type: arcana
name: Ayleid Statue
tier: minor
hall: Relics & Wonders
touchstones: [iron and sky-glass, 'ten cities, ten statues', a collector's patience]
limit: in the late Third Era they all end with Umbacano of the Imperial City. Bring him the tenth 
  and he has an errand for you in Nenalata.
source: the-reliquary/relics-and-wonders#ayleid-statue
body: One of the **Ten Ancestors** — meteoric-iron prongs caging a shard of sky-glass, sent from the
  White-Gold Tower to ten Ayleid cities when the slaves rose. It does nothing. A collector opens the
  door for it, and dealing with one takes +1d.
---
id: bloodstone-chalice
type: arcana
name: Bloodstone Chalice
tier: minor
hall: Relics & Wonders
touchstones: [a spring that isn't blood, the court's cup, a red aftertaste]
limit: one draught per filling, and Redwater Den is a skooma house the undead run. To the living it 
  is a stained cup. The Volkihar want it back.
source: the-reliquary/relics-and-wonders#bloodstone-chalice
body: A cup kept by the Volkihar court. Filled at the bloodspring under Redwater Den — it looks like
  blood, and isn't — one draught gives a vampire +1d to feed on or drain the living until the 
  session ends.
---
id: totem-of-hircine
type: arcana
name: Totem of Hircine
tier: minor
hall: Relics & Wonders
touchstones: [a howl with a purpose, 'skull, drum, bone', the Hunt-Father]
limit: one totem's boon at a time, and only for the beast blood. Hircine notes who comes to pray.
source: the-reliquary/relics-and-wonders#totem-of-hircine
body: Three relics older than writing — a wolf skull, a drum, a wand of bone. A werewolf who prays 
  to one howls with its power once per session. **Fear** breaks lesser foes' nerve, **Brotherhood** 
  calls a *2d* pack of wolves, **the Hunt** scents every living thing nearby.
---
id: azuras-star
type: arcana
name: Azura's Star
tier: major
hall: Relics & Wonders
touchstones: [the Twilight Star, a gem that never breaks, dusk and dawn]
limit: never a person's soul. In the Fourth Era Malyn Varen corrupts it into **The Black Star**, 
  which takes people and trades Azura's favor for her attention. She sends visions.
source: the-reliquary/relics-and-wonders#azuras-star
body: An eight-pointed crystal star, Azura's sign, and a soul gem that never breaks. Once per 
  session, when you help fell a creature, catch its soul. Spend it as a filled gem of its size, or 
  to make one spell potent.
---
id: skeleton-key
type: arcana
name: Skeleton Key
tier: major
hall: Relics & Wonders
touchstones: [Nocturnal's luck, any lock at all, 'potential, unlocked']
limit: '*4d The Key Wanders*, rolled as each session ends. At 0d it is gone. Until then the Nightingales
  hunt it for the Twilight Sepulcher.'
pool: 4
pool_name: The Key Wanders
source: the-reliquary/relics-and-wonders#skeleton-key
body: Nocturnal's, now a key, now a pick that cannot break. No ordinary lock needs a roll, and it 
  takes +1d against anything meant to stay shut. Once per session it opens what isn't a door, potent
  — a portal, a binding, a person's buried potential.
---
id: wabbajack
type: arcana
name: Wabbajack
tier: major
hall: Relics & Wonders
touchstones: [the Mad God's help, anything into anything, not what you planned]
limit: '*4d Wabbajack*. You never choose what it does, and it works on friends as readily. Bore Sheogorath
  and he takes it back.'
pool: 4
pool_name: Wabbajack
source: the-reliquary/relics-and-wonders#wabbajack
body: Sheogorath's staff, its head carved with gaping faces. Point it and roll its *4d* power pool. 
  On a perfect the target becomes something docile — a chicken, a rabbit — for the scene. On a 
  messy, something of about the same danger. On a grim, something worse. A greater foe shakes it off
  in a beat.
---
id: sanguine-rose
type: arcana
name: Sanguine Rose
tier: major
hall: Relics & Wonders
touchstones: [a rose that wilts with use, the Prince of revels, an armed guest]
limit: the petals don't grow back, and at 0d the Rose is dead wood. Sanguine restores a die for a 
  night that makes him laugh.
source: the-reliquary/relics-and-wonders#sanguine-rose
body: Sanguine's gift, a staff carved as a rose. Call on it and a dremora steps through in a foul 
  temper and fights for the scene as a *4d Petals* power pool. It will not touch whoever holds the 
  Rose. It was promised nothing about anyone else.
---
id: skull-of-corruption
type: arcana
name: Skull of Corruption
tier: major
hall: Relics & Wonders
touchstones: ['your own face, attacking', stolen dreams, Vaermina's due]
limit: the pool refills only by feeding. Pointed at a sleeper it drinks their dreams for 1d, and 
  they wake unrested. It likes memories too, yours included.
source: the-reliquary/relics-and-wonders#skull-of-corruption
body: Vaermina's staff, a thing guards stop to stare at. Cast at a foe, it pulls a double out of 
  them — same face, same arms — that turns on the original for the scene. Roll its *4d Nightmares* 
  power pool for what the double does.
---
id: staff-of-magnus
type: arcana
name: Staff of Magnus
tier: major
hall: Relics & Wonders
touchstones: [a god's battery, magic leaving the room, the Eye's only leash]
limit: '*4d Staff of Magnus*. It serves the balance, not its bearer. Grow too strong with it and one morning
  it is gone.'
pool: 4
pool_name: Staff of Magnus
source: the-reliquary/relics-and-wonders#staff-of-magnus
body: The staff of the god of magic, left behind when he fled the world. It drinks magicka. It takes
  +1d against spells, wards, and anything made of magic, and its *4d* power pool drains a caster dry
  for the scene — a greater one, for a beat or two. Nothing else masters the Eye of Magnus.
---
id: staff-of-worms
type: arcana
name: Staff of Worms
tier: major
hall: Relics & Wonders
touchstones: [the King of Worms, the obedient dead, a sceptre for the wrong court]
limit: '*4d Staff of Worms*, soul-fed. The Order of the Black Worm wants its relic back, and everyone
  else wants its bearer burned.'
pool: 4
pool_name: Staff of Worms
soul_fed: true
source: the-reliquary/relics-and-wonders#staff-of-worms
body: Mannimarco's staff, and the sceptre of his cult. Its *4d* power pool raises the freshly dead. 
  The corpse stands, mute and dim, and follows and defends you for the scene. Necromancers of the 
  Black Worm know the staff on sight, and hesitate.
---
id: black-book
type: arcana
name: Black Book
tier: major
hall: Relics & Wonders
touchstones: [tentacles from the page, forbidden knowledge, the Great Eye]
limit: each reading is a defense roll. On a grim you return rattled, with nothing. Either way Mora 
  keeps a secret of yours.
source: the-reliquary/relics-and-wonders#black-book
body: One of Hermaeus Mora's tomes — **Waking Dreams**, **Epistolary Acumen**, **The Winds of 
  Change**. Open it and the pages take you to Apocrypha, leaving your body a pale shade. Once per 
  session, read to bring back one true, hidden thing, potent.
---
id: oghma-infinium
type: arcana
name: Oghma Infinium
tier: major
expendable: true
hall: Relics & Wonders
touchstones: [the Path of Steel, the Path of Shadow, the Path of Spirit]
limit: it vanishes as you finish, and you are rattled until your next downtime. Mora counts every 
  reader as a debt. Septimus Signus opened it and was dust in a breath.
source: the-reliquary/relics-and-wonders#oghma-infinium
body: The Book that Knows, written by Xarxes from what Hermaeus Mora told him. Read one of its three
  paths and learn a new talent on the spot — from the arts of Combat for Steel, Stealth for Shadow, 
  Magic for Spirit.
---
id: sigil-stone
type: arcana
name: Sigil Stone
tier: major
expendable: true
hall: Relics & Wonders
touchstones: [the anchor of a gate, a red hum, Oblivion in the hand]
limit: one use. The keep comes down around whoever takes it, and the dremora who held it don't 
  forget.
source: the-reliquary/relics-and-wonders#sigil-stone
body: A sphere that hums and glows a dark red, lifted from the top of a Sigil Keep in the Deadlands.
  Lifting it closes the Oblivion gate below. Pressed to one weapon or piece of gear, it sinks in and
  is gone, and that piece is a major relic from then on, designed with the GM.
---
id: bitter-cup
type: arcana
name: Bitter Cup
tier: major
expendable: true
hall: Relics & Wonders
touchstones: [a bargain you can taste, the strong made stronger, the dregs]
limit: the cup vanishes as you swallow. This is the one change your stats will ever know — your 
  lifetime bump, spent. Vile's faithful would have paid anything for it.
source: the-reliquary/relics-and-wonders#bitter-cup
body: Clavicus Vile's cup, lost in the ruins of Ald Redaynia. Drink, and one point moves from your 
  weakest stat to your strongest — none above 3 or below 1, and where the trade isn't clean the 
  Prince picks who pays.
---
id: runed-lexicon
type: arcana
name: Runed Lexicon
tier: major
hall: Relics & Wonders
touchstones: [a Scroll at one remove, Dwemer letters, 'prophecy, defanged']
limit: one reading of one Scroll. Without a reader of Dwemer, each answer costs a night and +1t. 
  Septimus Signus expects his back full.
source: the-reliquary/relics-and-wonders#runed-lexicon
body: A Dwemer cube cut with script. Set in the Oculory of the Tower of Mzark while its lenses turn 
  on an Elder Scroll, it takes down what the Scroll says at no cost in eyesight. Once per session it
  gives one true answer on that Scroll's matter, potent.
---
id: kagrenacs-planbook
type: arcana
name: Kagrenac's Planbook
tier: major
hall: Relics & Wonders
touchstones: [mythopoeic enchantments, crowded margins, the Architect's hand]
limit: useless apart, and unreadable. In the late Third Era the one reader alive is Yagrum Bagarn, 
  the last dwarf, in Tel Fyr's Corprusarium.
source: the-reliquary/relics-and-wonders#kagrenacs-planbook
body: Kagrenac's own designs, and with them **Kagrenac's Journals**, every test and correction. Read
  by someone who can, the pair gives +1d to understand, mend, or stop anything Dwemer, and once per 
  session a potent answer about one machine.
---
id: staff-of-hasedoki
type: arcana
name: Staff of Hasedoki
tier: major
hall: Relics & Wonders
touchstones: [a soul in the metal, shelter from spells, the loneliest wizard]
limit: it shares what its maker felt. As each session ends, one of your bonds cools. The Gilgars 
  call it an heirloom, and they are necromancers.
source: the-reliquary/relics-and-wonders#staff-of-hasedoki
body: Hasedoki had no equal and no friends, so he bound his soul into his staff. In hand, it makes 
  hostile magic land one step lighter. Once per session it throws a bolt of plain force, potent — a 
  rank hurled back, a gate off its hinges.
---
id: aetherium-crest
type: arcana
name: Aetherium Crest
tier: major
expendable: true
hall: Relics & Wonders
touchstones: ['four shards, one wheel', the lift rising, the last Aetherium]
limit: one forging and it is gone. The tower that rises at Bthalft is seen for miles, and the 
  Forgemaster waits below.
source: the-reliquary/relics-and-wonders#aetherium-crest
body: Four shards rejoined — a wheel of blue crystal the Dwemer broke on purpose. Fitted to the 
  mechanism at the Ruins of Bthalft, it raises the lift to the Aetherium Forge. It is also the only 
  Aetherium left, and the Forge consumes it to make one Aetherial relic.
---
id: savillas-stone
type: arcana
name: Savilla's Stone
tier: major
hall: Relics & Wonders
touchstones: [an unopened window, the blind monks' treasure, the Gray Fox's heist]
limit: it shows and does not hear, and only the present. Strong wards notice, and the Moth Priests 
  want their stone back.
source: the-reliquary/relics-and-wonders#savillas-stone
body: A large crystal ball, kept under the Temple of the Ancestor Moths by blind monks. It scries. 
  Once per session, name a place you could find on a map and watch it a while — rounds, wards, the 
  way in — a potent look no wall stops. Plans laid by it take +1d.
---
id: glenmoril-witch-head
type: arcana
name: Glenmoril Witch Head
tier: major
expendable: true
hall: Relics & Wonders
touchstones: [a bargain undone, the Harbinger's flame, the wolf outside you]
limit: one head, one cure, and the spirit fights for its place as *6d Wolf Spirit*. Hircine keeps 
  count of hunters lost.
source: the-reliquary/relics-and-wonders#glenmoril-witch-head
body: The head of a hagraven of Glenmoril Coven, whose bargain put the beast blood in the 
  Companions. Thrown into the Flame of the Harbinger in Ysgramor's Tomb, it casts one werewolf's 
  wolf spirit out onto the stones. Kill it and the curse is broken for good.
---
id: an-elder-scroll
type: arcana
name: An Elder Scroll
tier: mythic
hall: Relics & Wonders
touchstones: [prophecy, the Aurbis written down, letters that will not hold still]
needs:
- a reader trained by the Moth Priests, or a Dwemer lexicon and the machine to cut it
- a question worth the price
- a place the Scroll consents to be opened
limit: every reading takes sight — a rattled mind at best, blindness in the end. The Scrolls go 
  missing on their own, and the Imperial Library always knows when one is gone.
source: the-reliquary/relics-and-wonders#an-elder-scroll
body: A fragment of creation, unrolled. Read with the proper rites, it shows what was, what is, or 
  what may be — a ritual-level act of knowing, and the only map to some places.
---
id: amulet-of-kings
type: arcana
name: Amulet of Kings
tier: mythic
hall: Relics & Wonders
touchstones: [the Red Diamond, the Dragonfires, the blood of the Septims]
needs:
- an heir of the Dragon Blood
- the Temple of the One
- a road there that every enemy of the Empire contests
limit: on anyone else it slips its clasp. Shattered, it calls Akatosh himself, once, as Martin 
  Septim proved when the Third Era closed. After that there is no Amulet.
source: the-reliquary/relics-and-wonders#amulet-of-kings
body: The Red Diamond — Akatosh's covenant with Alessia, worn by every true emperor since. Carried 
  by an heir to the Temple of the One, it lights the Dragonfires, and while they burn the walls 
  between Tamriel and Oblivion hold. Dead emperors counsel the wearer from inside the stone.
---
id: heart-of-lorkhan
type: arcana
name: Heart of Lorkhan
tier: mythic
hall: Relics & Wonders
touchstones: [a drumbeat under the mountain, 'godhood, stolen', the divine spark]
needs:
- Wraithguard on the hand that works
- Sunder to strike the note
- Keening to flay and focus it
limit: handle the tools without Wraithguard and you die of it. The gods it made went mad or grew 
  thin. Break Kagrenac's enchantments, as the Nerevarine did late in the Third Era, and the Heart 
  leaves the world.
source: the-reliquary/relics-and-wonders#heart-of-lorkhan
body: The heart of the dead god who made the world, still beating under Red Mountain where it fell. 
  Struck the right way it gives out divinity. It made gods of the Tribunal and of Dagoth Ur, and was
  meant to wake a god of brass.
---
id: eye-of-magnus
type: arcana
name: Eye of Magnus
tier: mythic
hall: Relics & Wonders
touchstones: [Elder script on a turning shell, power with no floor, the Night of Tears]
needs:
- the Staff of Magnus to open and close it
- a caster with the nerve to stand before it
limit: opened without the Staff it comes apart, magic running loose first and the hold after. The 
  Psijic Order is watching, and in the Fourth Era they take it out of the world.
source: the-reliquary/relics-and-wonders#eye-of-magnus
body: An orb ten feet across, cut with Elder script, that the first Nords dug up under Saarthal and 
  buried again in a hurry. It is magic without a floor. A caster in its light works any spell as 
  potent, and opened, it pours out enough to remake a mind, a city, or the world.
---
id: the-mantella
type: arcana
name: The Mantella
tier: mythic
hall: Relics & Wonders
touchstones: [a heart in green crystal, the Brass God walking, time coming loose]
needs:
- Numidium, rebuilt from its scattered pieces
- the Totem of Tiber Septim to command it
limit: the Totem rejects any hand not of Septim blood. Where Numidium walks, time breaks and things 
  happen several ways at once. The Underking wants his heart back.
source: the-reliquary/relics-and-wonders#the-mantella
body: A great green gem holding the heart of the Underking, made by Tiber Septim's battlemage to 
  stand in for the Heart of Lorkhan. Set in Numidium, it wakes the Brass God — a thousand feet of 
  walking Dwemer metal. It conquered Tamriel once, and lay hidden in Aetherius for most of the Third
  Era.
---
id: mysterium-xarxes
type: arcana
name: Mysterium Xarxes
tier: mythic
hall: Relics & Wonders
touchstones: [Dagon's own hand, letters that hurt to read, a door to Paradise]
needs:
- wards against the book itself
- a Great Welkynd Stone and a Great Sigil Stone
- a Daedric artifact and an Aedric one, both spent
limit: reading it unwarded corrupts — a mark, then rattled, then Dagon's. Opening the way to 
  Paradise destroyed it, as the Third Era closed.
source: the-reliquary/relics-and-wonders#mysterium-xarxes
body: Mehrunes Dagon wrote it himself, in the deserts of rust and wounds, and gave it to Mankar 
  Camoran, who built the Mythic Dawn and his own Paradise on it. It teaches the opening of ways 
  between worlds. Camoran's four **Commentaries** are a safe way in to his cult. The book has none.
---
id: the-aetherium-forge
type: arcana
name: The Aetherium Forge
tier: mythic
hall: Relics & Wonders
touchstones: [blue crystal in white heat, a war of four cities, made to order]
needs:
- the Aetherium Crest, both key and ore
- Dwarven metal, gold, and gems
- the Forgemaster beaten and the steam shut off
limit: one Crest, one forging. The Forgemaster, a centurion that breathes fire, has kept the anvil 
  since the First Era and can't tell heirs from thieves.
source: the-reliquary/relics-and-wonders#the-aetherium-forge
body: The Dwemer built it far below the Rift, over magma, to smelt the one crystal nothing else can 
  work, and then went to war with each other for it. It still runs. Fed Aetherium, it turns out one 
  Aetherial work — a crown, a shield, a staff — a major relic to its maker's design.
---
id: the-atronach-forge
type: arcana
name: The Atronach Forge
tier: mythic
hall: Relics & Wonders
touchstones: [an offering box and a lever, scattered recipes, something arrives]
needs:
- the exact offerings
- a hand on the lever
- a Sigil Stone in the setting, for anything Daedric
limit: what it conjures alive goes for whoever pulled the lever. A wrong recipe yields nothing, or 
  most of a goat.
source: the-reliquary/relics-and-wonders#the-atronach-forge
body: A crude stone dais in the Midden, under the College of Winterhold — a Daedric rune, an 
  offering box, a lever. Put the right things in the box and pull, and the Forge trades them to 
  Oblivion for an atronach, a staff, a scroll, a tome. With a Sigil Stone in its setting it conjures
  Daedric arms, each a major relic.
---
id: staff-of-chaos
type: arcana
name: Staff of Chaos
tier: mythic
hall: Relics & Wonders
touchstones: [the gate between worlds, the land's own essence, eight pieces]
needs:
- all eight pieces, hidden across the Empire
- the Jewel of Fire, where Tharn poured its power
limit: it can't leave Tamriel without dire consequences to the land. Only the whole Staff can undo 
  what it did, which is why Tharn broke it. Freeing the Emperor destroyed it, or seemed to.
source: the-reliquary/relics-and-wonders#staff-of-chaos
body: The Balac-thurm, fangled from the essence of the land and all but indestructible. It opens the
  gate between worlds — with it Jagar Tharn shut Emperor Uriel VII in a pocket of Oblivion and wore 
  his face for years. It unmakes bodies, and sows strife wherever it is carried.
---
id: silver-weapon
type: arcana
name: Silver Weapon
tier: minor
hall: Arms of Renown
touchstones: [moon-pale plating, the old answer, a hiss where it cuts]
limit: the plating wears. In Skyrim only the Silver Hand carries silver swords, and anything with 
  the beast blood can smell it on you.
source: the-reliquary/arms-of-renown#silver-weapon
body: "Steel with silver laid along the edge, since solid silver is too soft and too dear. It bites what
  plain steel passes through — ghosts, wraiths, wisps — and against werewolves it is the old answer: it
  drops 1d before the pack's pool rolls."
---
id: enchanted-weapon
type: arcana
name: Enchanted Weapon
tier: minor
hall: Arms of Renown
touchstones: [one spell in the steel, a glow along the edge, a hum that fades]
limit: '*2d Charge*, soul-fed. At 0d it is only steel until a soul goes into it.'
pool: 2
pool_name: Charge
soul_fed: true
source: the-reliquary/arms-of-renown#enchanted-weapon
body: Good steel with one spell bound in. Call on it as a blow lands and the strike also does that 
  spell's work — **flame** burns, **frost** slows, **shock** drains magicka, **fear** routs a lesser
  foe, **turning** drives back the dead, **soul trap** fills a gem with what it kills. Then roll the
  pool.
---
id: akaviri-katana
type: arcana
name: Akaviri Katana
tier: minor
hall: Arms of Renown
touchstones: [the Dragonguard's pattern, superior balance, a hook on the temple wall]
limit: it says whose you are. Under the Septims it opens doors. After the Great War the Thalmor read
  it as a confession. **Bolar's Oathblade**, left at a Talos shrine by the last Blade out of Cloud 
  Ruler, also routs lesser foes.
source: the-reliquary/arms-of-renown#akaviri-katana
body: "The Blades' sword, a pattern the Dragonguard brought from Akavir: light, costly, quick from the
  scabbard. The first cut of any fight takes +1d."
---
id: daedric-weapon
type: arcana
name: Daedric Weapon
tier: minor
hall: Arms of Renown
touchstones: [a heart in the steel, echoes of its making, a room going quiet]
limit: nobody forgets it. Vigilants ask where you got it, guards ask who you killed, and the Daedra 
  whose heart it holds was only banished. It remembers.
source: the-reliquary/arms-of-renown#daedric-weapon
body: "Ebony reforged around a Daedra's heart: black, red-veined, never quite cold. It bites what plain
  steel passes through, and it carries the long suffering of its making into any room. With it drawn,
  take +1d to menace."
---
id: dwarven-glass-and-ebony-arms
type: arcana
name: Dwarven, Glass & Ebony Arms
tier: minor
hall: Arms of Renown
touchstones: [salvaged Dwemer brass, a green razor edge, black Godsblood]
limit: Dwarven arms are melted from ruins, and scholars notice. Glass chips. Ebony costs a house and
  draws that class of thief.
source: the-reliquary/arms-of-renown#dwarven-glass-and-ebony-arms
body: Three materials worth a commission. **Dwarven** metal never rusts or dulls, and no living 
  smith can make more. **Glass**, green malachite, is so light its weight never thorns you. 
  **Ebony**, said to be a god's blood gone hard, does not break.
---
id: stalhrim-weapon
type: arcana
name: Stalhrim Weapon
tier: minor
hall: Arms of Renown
touchstones: [ice that never melts, a chill up the arm, a tomb's own armor]
limit: only an ancient Nordic pickaxe cuts it, the Skaal hold it holy and keep the smithing of it, 
  and most deposits have a draugr inside.
source: the-reliquary/arms-of-renown#stalhrim-weapon
body: "Solstheim's enchanted ice: blue-white, ebony's equal at less weight, cold up the arm. The old Nords
  sealed their dead in it. Frost lies deeper in stalhrim: the first time a frost enchantment's pool would
  drop each session, it doesn't."
---
id: dragonbone-weapon
type: arcana
name: Dragonbone Weapon
tier: minor
hall: Arms of Renown
touchstones: [a rib with an edge on it, weight like a verdict, proof that somebody won]
limit: heavy, at +1t whenever speed is the point. Dragons know a kinsman's bones on sight. Before 4E
  201 the bone is ancient, and so is whatever guards it.
source: the-reliquary/arms-of-renown#dragonbone-weapon
body: "A blade or hammer carved from a dragon's own bone and bound with ebony: deadlier than Daedric work,
  and heavier. Hide, scale, and plate never thorn its blows."
---
id: crossbow
type: arcana
name: Crossbow
tier: minor
hall: Arms of Renown
touchstones: [a first shot that settles it, the click of the nut, steel through plate]
limit: slow to span, a full beat between shots. **Exploding bolts** of fire, ice, or shock, built 
  from Dwemer schematics, are each a minor ×1 — one potent blast.
source: the-reliquary/arms-of-renown#crossbow
body: "A Dwemer idea: a machine that lets modest training put a heavy bolt through plate. The Legion's
  steel copies are poorer, and the Dawnguard's (4E 201) are the best the living make. Armor never thorns
  its shot."
---
id: ancient-nord-heros-weapon
type: arcana
name: Ancient Nord Hero's Weapon
tier: minor
hall: Arms of Renown
touchstones: [honed before the Empire, the chill of the niche, a dead thane's grip]
limit: it is owed. The barrow counts it stolen, and its dead rest badly until it comes back. The 
  Skyforge can remake one as a **Nord Hero** weapon (4E 201), which settles nothing.
source: the-reliquary/arms-of-renown#ancient-nord-heros-weapon
body: "Black iron from a barrow, taken out of a draugr's hands and honed by someone long dead. It keeps
  the cold of the niche: on a perfect, the wound numbs and the foe is slowed a beat."
---
id: valdrs-lucky-dagger
type: arcana
name: Valdr's Lucky Dagger
tier: minor
hall: Arms of Renown
touchstones: [a hunter's keepsake, the gap in the guard, luck with an edge]
limit: Valdr gave it away the week spriggans killed two friends beside him in Moss Mother Cavern (4E
  201). Ask where the luck goes when it is not yours.
source: the-reliquary/arms-of-renown#valdrs-lucky-dagger
body: A plain steel dagger a Falkreath bear hunter swears by. Once per session, after you see the 
  dice on a strike with it, add +1d. That is the luck.
---
id: trollsbane
type: arcana
name: Trollsbane
tier: minor
hall: Arms of Renown
touchstones: [one enemy only, rancid fat catching fire, a name earned once]
limit: against anything else it is a hammer. Frofnir died in a troll den in the Reach with it in his
  hands. There were two trolls.
source: the-reliquary/arms-of-renown#trollsbane
body: Frofnir Trollsbane's steel warhammer, enchanted to burn trolls and nothing else. Against a 
  troll it takes +1d, and nothing it wounds knits.
---
id: aegisbane
type: arcana
name: Aegisbane
tier: minor
hall: Arms of Renown
touchstones: [a clan's sigil, frost on old iron, a name that breaks shields]
limit: a swindler named Alain Dufont courted a friend of the family to get near it, and left with it
  (4E 201). Every guard in Windhelm knows the hammer, and the Shatter-Shields want it home.
source: the-reliquary/arms-of-renown#aegisbane
body: The iron warhammer of Clan Shatter-Shield of Windhelm, rimed with an old frost. On a perfect, 
  what it hits is slowed to a crawl for a beat — a setup for whoever is quickest.
---
id: the-pale-blade
type: arcana
name: The Pale Blade
tier: minor
hall: Arms of Renown
touchstones: [the key to her tomb, a glade under the crypt, fear like cold water]
limit: "*2d Dread*, refilled only by laying it back on her tomb. While it is gone she walks the marsh,
  looking for her daughter and taking other people's."
pool: 2
pool_name: Dread
source: the-reliquary/arms-of-renown#the-pale-blade
body: 'An ancient Nord sword laid on a sarcophagus in Frostmere Crypt to keep Aumriel, the Pale Lady,
  in her tomb. Its cold gets into the nerve: roll the pool as a blow lands and lesser foes break and run.'
---
id: red-eagles-bane
type: arcana
name: Red Eagle's Bane
tier: minor
hall: Arms of Renown
touchstones: [the Reach's lost king, a flaming blade, an oath in a cairn]
limit: "as **Red Eagle's Fury** it is the key to his tomb: set on the altar in Rebel's Cairn, it wakes
  him. It is the Bane only once he is put down again. The Forsworn want it, and him."
source: the-reliquary/arms-of-renown#red-eagles-bane
body: The sword of Faolan, the Red Eagle, who walked out alone against Empress Hestra's legions and 
  is said to have killed a thousand. It burns, and takes +1d against the undead.
---
id: ghostblade
type: arcana
name: Ghostblade
tier: minor
hall: Arms of Renown
touchstones: [a lovers' thanks, a blade half here, cold where it passes]
limit: it is not steel. No whetstone touches it, and mending it takes ectoplasm and a smith who will
  not laugh. The dead notice it, and some ask after its givers.
source: the-reliquary/arms-of-renown#ghostblade
body: 'A sword you can see through, given by the ghosts of Fjori and Holgeir to whoever lets them rest.
  It weighs almost nothing and passes through mail like mist: armor never thorns it.'
---
id: okin-and-eduj
type: arcana
name: Okin & Eduj
tier: minor
hall: Arms of Renown
touchstones: [a Tongue's two hands, matched frost, old hymns in Volunruud]
limit: only as a pair. Kvenel sits enthroned in Volunruud behind a door that opens to ceremonial 
  copies of both, and he rises for the real ones.
source: the-reliquary/arms-of-renown#okin-and-eduj
body: 'The war axe and sword of Kvenel the Tongue, the axe forged to match the blade he loved. Both carry
  a frost that slows. Fight with the pair and each sets up the other: after a perfect with one, your next
  blow with its twin takes +1d.'
---
id: nettlebane
type: arcana
name: Nettlebane
tier: minor
hall: Arms of Renown
touchstones: [hagraven work, sap on black glass, a grove flinching]
limit: the wild knows it. Spriggans rise for its bearer without warning, Kynareth's priests ask you 
  not to, and the witches of Orphan Rock want it back.
source: the-reliquary/arms-of-renown#nettlebane
body: A crudely engraved ebony dagger the hagravens made for killing spriggans. It cuts what no 
  steel will — the Eldergleam's roots, bark older than metal — and takes +1d against spriggans and 
  anything else that grows.
---
id: kahvozeins-fang
type: arcana
name: Kahvozein's Fang
tier: minor
hall: Arms of Renown
touchstones: [a priest's whetstone, scale parting like vellum, an altar's worth of practice]
limit: it carves the dead dragon. You still have to arrange that part. The College of Winterhold 
  knows what the Fang is for, and will pay, borrow, or follow.
source: the-reliquary/arms-of-renown#kahvozeins-fang
body: A Dragon Priest's dagger, kept sharp by a cult fond of sacrifice. It is the one blade keen 
  enough to carve heartscales from a dragon's carcass, and heartscales are a ritual anchor wizards 
  pay for.
---
id: zephyr
type: arcana
name: Zephyr
tier: minor
hall: Arms of Renown
touchstones: [Dwemer limbs, a draw like a breath, the second arrow already gone]
limit: it lies on a fallen tree over the drop that killed its owner, Katria, in Arkngthamz. Her 
  ghost is still there, and wants it known who found the Aetherium Forge.
source: the-reliquary/arms-of-renown#zephyr
body: 'A Dwemer bow of tooled brass that draws faster than a bow should. Haste never thorns its shot:
  the snap shot, the moving target, no time to aim.'
---
id: windshear
type: arcana
name: Windshear
tier: minor
hall: Arms of Renown
touchstones: [a gale in the wrist, footing lost, a sword stuck in a ship]
limit: it is driven into the bowsprit of the *Katariah*, the Emperor's own ship, and nobody says by 
  whom (4E 201). Getting it means going aboard, and the Penitus Oculatus keep a list of who has.
source: the-reliquary/arms-of-renown#windshear
body: A scimitar that hits like a gale. On a perfect, the blow knocks what it strikes clean off its 
  footing — a setup for anyone near, and on a deck or a stair often the end of the matter.
---
id: champions-cudgel
type: arcana
name: Champion's Cudgel
tier: minor
hall: Arms of Renown
touchstones: [Legion steel, 'three elements, no warning', a fort under the ash]
limit: '*2d Chaos*, soul-fed. Carius died when Red Mountain blew, and was raised two centuries later around
  a heart stone. He still holds Fort Frostmoth, and the hammer.'
pool: 2
pool_name: Chaos
soul_fed: true
source: the-reliquary/arms-of-renown#champions-cudgel
body: "General Falx Carius's Legion warhammer, the dragon stamped on its head. It strikes with fire, frost,
  or lightning and never says which: roll the pool as it lands, and the GM picks what the foe likes least."
---
id: glass-bow-of-the-stag-prince
type: arcana
name: Glass Bow of the Stag Prince
tier: minor
hall: Arms of Renown
touchstones: [the Stag Prince's favor, green limbs, a tally of game]
limit: the blessing is for hunting beasts, and Hircine notices who is hunting. Falas Selvayn trades 
  from a shack on Solstheim, only in the small hours, and does not sell it. He will miss it.
source: the-reliquary/arms-of-renown#glass-bow-of-the-stag-prince
body: A malachite bow carrying Hircine's blessing in his aspect as the Stag Prince. It takes +1d 
  against beasts of the chase, and the more game it brings down, the hardier its hunter grows.
---
id: harkons-sword
type: arcana
name: Harkon's Sword
tier: minor
hall: Arms of Renown
touchstones: [the Volkihar lord's blade, a Prince on the guard, blood going the wrong way]
limit: only for a vampire. Every Volkihar knows whose it was, and carrying it makes you his heir, 
  his killer, or a thief. The court decides which.
source: the-reliquary/arms-of-renown#harkons-sword
body: "Lord Harkon's katana, Molag Bal's face worked into the guard. In a vampire's hand it drinks: on
  a perfect strike, clear one of your marks. In a living hand it is a fine sword that seems faintly bored."
---
id: witsplinter
type: arcana
name: Witsplinter
tier: minor
hall: Arms of Renown
touchstones: [a red hilt, a spell forgotten halfway, quick work up close]
limit: "Faustina Cartia carried it, and ran the Sirens of Anvil: married men lured to a farmhouse and
  sent home in their smallclothes. Anvil's husbands know the dagger and would rather not say how."
source: the-reliquary/arms-of-renown#witsplinter
body: 'An ornate Elven dagger that does what its name says. A spellcaster it cuts loses the thread: on
  a perfect, they cast nothing for a beat — long enough for a fighter to finish the argument.'
---
id: rockshatter
type: arcana
name: Rockshatter
tier: minor
hall: Arms of Renown
touchstones: [a wedding gift, lightning in old brass, the mantel it hung over]
limit: Maeva the Buxom wants it back. Her husband, Bjalfi the Contemptible, took it off the mantel 
  to go and be a marauder at Fort Strand. She has plans for him too.
source: the-reliquary/arms-of-renown#rockshatter
body: "A Dwarven mace with a storm in it, handed down a Nord farming family outside Anvil. On a perfect,
  the shock leaves the foe open: the next blow against it, anyone's, takes +1d."
---
id: blackwater-blade
type: arcana
name: Blackwater Blade
tier: minor
hall: Arms of Renown
touchstones: [a pirate captain's sword, stolen breath, one more round]
limit: whoever carries it captains the Blackwater Brigands of Bravil, as far as the Brigands are 
  concerned. They come to follow you or to take it, and are slow to say which.
source: the-reliquary/arms-of-renown#blackwater-blade
body: An ornate Cyrodilic longsword that takes the wind from whoever it cuts and hands it to its 
  bearer. Weariness never thorns you while you hold it — the long fight, the hard climb before it, 
  the third opponent.
---
id: shadowhunt
type: arcana
name: Shadowhunt
tier: minor
hall: Arms of Renown
touchstones: [a bonus for clean work, no witnesses, an arrow from an empty room]
limit: 'the Brotherhood knows who earned it, and it was not you. **Sufferthorn**, an elven dagger, is
  the same sort of bonus, paid for a death that passed as an accident: on a perfect it saps the strength
  of what it pricks.'
source: the-reliquary/arms-of-renown#shadowhunt
body: 'A plain steel bow the Dark Brotherhood pays out as a bonus for a kill nobody saw. It was made for
  that: a shot loosed with no witness but the target takes +1d.'
---
id: fang-of-haynekhtnamet
type: arcana
name: Fang of Haynekhtnamet
tier: minor
hall: Arms of Renown
touchstones: [a tooth with a hilt, swamp lightning, seven days and nights]
limit: '*2d Storm*, soul-fed. The Sixth House kept it in an altar trough at Mamaea (3E 427). Argonians
  tell the hunt differently.'
pool: 2
pool_name: Storm
soul_fed: true
source: the-reliquary/arms-of-renown#fang-of-haynekhtnamet
body: 'A dagger carved from the tooth of Haynekhtnamet, a wamasu of Black Marsh that a score of Nords
  fought for seven days and nights, believing it a dragon. The lightning never left it: roll the pool
  as it bites and the shock stuns for a beat.'
---
id: cleaver-of-st-felms
type: arcana
name: Cleaver of St. Felms
tier: minor
hall: Arms of Renown
touchstones: [a saint's one tool, patron of butchers and fishmongers, blood on the doorstep]
limit: lost on Red Mountain with the Armiger who carried it (3E 427). The Temple wants it back, and 
  Ordinators do not ask twice. By the Fourth Era its keepers are heretics.
source: the-reliquary/arms-of-renown#cleaver-of-st-felms
body: The war axe of Felms the Bold, who could not read, heard Almalexia's voice in his head, and 
  drove the Nords from Morrowind. It takes +1d against invaders on ground you call home.
---
id: stendarrs-hammer
type: arcana
name: Stendarr's Hammer
tier: minor
hall: Arms of Renown
touchstones: [righteous might, four men to lift it, a cracked museum floor]
limit: too heavy to be sensible. A second swing on a marked arm is harm. Museums keep acquiring it. 
  Thieves keep regretting it.
source: the-reliquary/arms-of-renown#stendarrs-hammer
body: Ebony and sapphire, said to be the God of Righteous Might's own. It took four men to lift it 
  onto its stand in Mournhold. Swing it and nothing made by hands thorns the blow — plate, shield, 
  gate — and each swing marks your Brawn.
---
id: ice-blade-of-the-monarch
type: arcana
name: Ice Blade of the Monarch
tier: minor
hall: Arms of Renown
touchstones: [a failed regicide, a Monarch's soul, the ice at the world's edge]
limit: it goes from owner to owner by its own will. Roll a disaster with it in hand and it is gone —
  lost, sunk, stolen — to turn up with someone worse.
source: the-reliquary/arms-of-renown#ice-blade-of-the-monarch
body: A claymore holding a Frost Monarch's soul, made by the archmage Almion Celmo for a warrior who
  meant to kill a king and failed. On a perfect its wound freezes, slowing the foe a beat. Ice parts
  for it like cloth.
---
id: dawnbreaker
type: arcana
name: Dawnbreaker
tier: major
hall: Arms of Renown
touchstones: [Meridia's light, a blade that hates the grave, a new hand touches the beacon]
limit: '*4d Radiance*. She speaks to its bearer whenever she likes, and she is not asking.'
pool: 4
pool_name: Radiance
source: the-reliquary/arms-of-renown#dawnbreaker
body: Meridia's blade, bright as a held breath. Against the undead it takes +1d and its wounds burn;
  roll the Radiance pool when you fell one, and the burst turns or scatters every dead thing nearby.
---
id: mehrunes-razor
type: arcana
name: Mehrunes' Razor
tier: major
hall: Arms of Renown
touchstones: [the Final Wound, Kingslayer, a soul taken mid-step]
limit: 'Dagon keeps the souls, and counts: each one hands the GM suspense. A disaster with the Razor drawn
  lands at dire stakes. It does not care whose wound is final.'
source: the-reliquary/arms-of-renown#mehrunes-razor
body: "Dagon's ebony dagger, drinking the light on its edge. On a critical its cut is a final wound: anything
  mortal short of a boss dies on the spot. Once per session, call the Final Wound before you roll and
  a perfect is enough."
---
id: ebony-blade
type: arcana
name: Ebony Blade
tier: major
hall: Arms of Renown
touchstones: [the Whispering Lady, the blood of deceit, a blade no forge will melt]
limit: '*4d Leech*, refilled only when it kills someone who trusted its bearer. Mephala whispers the names.
  An old charm keeps it from staying with any owner long.'
pool: 4
pool_name: Leech
source: the-reliquary/arms-of-renown#ebony-blade
body: "Mephala's black katana, the Leech. Roll the Leech pool to strike, and what the wound costs them
  you keep: clear a mark on a messy, a harm on a perfect. Against someone who trusts you, the stroke is
  potent."
---
id: volendrung
type: arcana
name: Volendrung
tier: major
hall: Arms of Renown
touchstones: [a star thrown west, Malacath's favor, a gate in splinters]
limit: "*4d Might*. It vanishes like its makers, for days or for ages. Malacath's Orcs call its bearer
  Volendrung, and expect one."
pool: 4
pool_name: Might
source: the-reliquary/arms-of-renown#volendrung
body: "The Hammer of Might: Rourken Dwemer work, thrown across Tamriel to pick their home, now Malacath's.
  It takes +1d against anything built to stand. Roll the Might pool to strike a foe rigid as a statue.
  Once per session the blow is potent: the wall comes down."
---
id: mace-of-molag-bal
type: arcana
name: Mace of Molag Bal
tier: major
hall: Arms of Renown
touchstones: [the Master's Mace, a wizard emptied, '"get it away from me"']
limit: '*4d Domination*. Molag Bal gives it freely, on the understanding that ruin follows it. He checks.'
pool: 4
pool_name: Domination
source: the-reliquary/arms-of-renown#mace-of-molag-bal
body: "The Vampire's Mace, forged in Coldharbour by an Orc smith the Prince tricked. It takes +1d against
  spellcasters, and its kills fill an empty soul gem. Roll the Domination pool on a hit to take the foe's
  magicka and strength: it casts nothing for a beat, and you clear a mark."
---
id: goldbrand
type: arcana
name: Goldbrand
tier: major
hall: Arms of Renown
touchstones: [dragon-forged gold, the Tournament of Ten Bloods, a burning cut]
limit: Boethiah's faithful call its bearer Goldbrand and come to try the title, one at a time. Rumor
  says a vampire with exactly the right purse can make it **Eltonbrand**, finer still.
source: the-reliquary/arms-of-renown#goldbrand
body: Boethiah's golden katana, forged by the dragons of the North for a Nord sworn to guard them. 
  Its wounds burn. In single combat it takes +1d, and once per session a stroke in such a fight 
  lands potent.
---
id: umbra-relic
type: arcana
name: Umbra
tier: major
hall: Arms of Renown
touchstones: [a sword that names its bearer, souls for the Prince, a worthy death]
limit: "*4d Hunger*, refilled by killing. Each session it kills, roll *6d Your Own Name*: at 0d the sword
  does the choosing — the GM can spend suspense to pick your target — until you're beaten fairly or pry
  it loose, which is a quest. Vile wants it back. His dog advises against."
pool: 4
pool_name: Hunger
source: the-reliquary/arms-of-renown#umbra-relic
body: A black sword the witch Naenra Waerr made for Clavicus Vile, with a piece of the Prince in it 
  that learned to want. It traps the soul of all it kills. Roll the Hunger pool for a potent stroke.
---
id: chrysamere
type: arcana
name: Chrysamere
tier: major
hall: Arms of Renown
touchstones: [the Sword of Heroes, a mage's knot in the steel, a spell sent home]
limit: it favors no champion for long. Refuse a cause it would have taken, or settle down, and it is
  gone to someone hungrier.
source: the-reliquary/arms-of-renown#chrysamere
body: "The Paladin's Blade, an adamantium claymore by the Breton smith Asterie Bedel, better at guarding
  than killing. Take +1d to defend against fire and spells, and on a perfect the spell returns to its
  caster. Once per session it mends you: a potent healing."
---
id: wuuthrad
type: arcana
name: Wuuthrad
tier: major
hall: Arms of Renown
touchstones: [Storm's Tears, the Night of Tears repaid, a key in a statue's hands]
limit: from the Second Era to 4E 201 it lies in pieces, some at Jorrvaskr. In elven hands it takes 
  +1t. No elf who sees its face parleys.
source: the-reliquary/arms-of-renown#wuuthrad
body: Ysgramor's battleaxe, forged by his son Yngol from tears of ebony, a screaming elf on its 
  head. It takes +1d against elves of every kind, Falmer included, and once per session a blow 
  against one lands potent. It also opens Ysgramor's tomb.
---
id: dragonbane
type: arcana
name: Dragonbane
tier: major
hall: Arms of Renown
touchstones: [the Dragonguard's purpose, lightning on steel, a sealed temple]
limit: the Blades count it theirs and its bearer sworn. Dragons smell what it was made for, and the 
  old ones stop talking.
source: the-reliquary/arms-of-renown#dragonbane
body: An Akaviri katana left in Sky Haven Temple when the Blades sealed it, made for one quarry. 
  Against dragons it takes +1d and scale never thorns it, and once per session a stroke against one 
  lands potent. On anything else, a perfect jolts it with lightning.
---
id: chillrend
type: arcana
name: Chillrend
tier: major
hall: Arms of Renown
touchstones: [blue malachite, mist off the edge, a man stopped mid-swing]
limit: '*4d Frostfeed*, soul-fed. A guildmaster of thieves kept it behind an expert lock, and thieves
  have known its price ever since.'
pool: 4
pool_name: Frostfeed
soul_fed: true
source: the-reliquary/arms-of-renown#chillrend
body: 'A glass sword gone blue with cold, mist falling off the blade. It takes +1d against anything warm.
  Roll the Frostfeed pool for a stroke that locks the foe rigid for a beat. Once per session the freeze
  is potent: a whole knot of them, or one for the scene.'
---
id: nightingale-blade-and-bow
type: arcana
name: Nightingale Blade & Bow
tier: major
hall: Arms of Renown
touchstones: [the Trinity's oath, the bird on the guard, an Evergloam arrow]
limit: they are Nocturnal's, lent on an oath to guard the Twilight Sepulcher in life and after. 
  Break it and your luck goes first.
source: the-reliquary/arms-of-renown#nightingale-blade-and-bow
body: "The arms of Nocturnal's sworn three. Each takes +1d from the dark, and once per session such a
  strike lands potent. The **Blade**, once Gallus's, drinks: a perfect clears one of your marks. The **Bow**
  slows what it hits with frost and shock."
---
id: blade-of-woe
type: arcana
name: Blade of Woe
tier: major
hall: Arms of Renown
touchstones: [the Night Mother's Kiss, a soul sent to Sithis, no cry]
limit: a Speaker gives it. Nobody finds it. Carried without the Brotherhood's leave, it is a 
  contract on you that needs no Black Sacrament.
source: the-reliquary/arms-of-renown#blade-of-woe
body: The Dark Brotherhood's dagger, named for the one the Night Mother used on her children. 
  Against the unaware it takes +1d, and once per session such a strike lands potent — silent, and 
  you a step from where they look. What it kills goes to the Void.
---
id: bloodskal-blade
type: arcana
name: Bloodskal Blade
tier: major
hall: Arms of Renown
touchstones: [ribbons of red force, the angle of the cut, a door that wants a sword]
limit: '*4d Ribbon*. Lifting it from its place wakes every draugr in the barrow, and has, twice. The ribbons
  spare no bystander.'
pool: 4
pool_name: Ribbon
source: the-reliquary/arms-of-renown#bloodskal-blade
body: "A silver greatsword of Solstheim's Bloodskal clan. Swing hard and the swing keeps going, a ribbon
  of red force: reach never thorns it. Roll the Ribbon pool to cut down a rank at twenty paces, or to
  open the one door in Bloodskal Barrow."
---
id: miraaks-sword
type: arcana
name: Miraak's Sword
tier: major
hall: Arms of Renown
touchstones: [the First Dragonborn, a lurker's reach, ink that moves]
limit: '*4d Grasp*. Hermaeus Mora looks out through it. Use the pool and he may ask a question, and he
  keeps what you answer.'
pool: 4
pool_name: Grasp
source: the-reliquary/arms-of-renown#miraaks-sword
body: 'The blade of the First Dragonborn, black-green and wet, more grown than forged. A tentacle whips
  from it with every swing: reach never thorns it. Roll the Grasp pool to seize, drag, or disarm across
  a room. Once per session the grasp is potent.'
---
id: soulrender-and-bloodscythe
type: arcana
name: Soulrender & Bloodscythe
tier: major
hall: Arms of Renown
touchstones: [the King of Ghosts, 'two blades, one bargain', the deathbrand]
limit: apart, each is only a sharp scimitar. Haknir lies in Gyldenhul Barrow on his cursed hoard, 
  and rises for them.
source: the-reliquary/arms-of-renown#soulrender-and-bloodscythe
body: 'The twin scimitars of Haknir Death-Brand, the pirate king. Together, and only together, they take
  +1d: **Bloodscythe** opens armor, **Soulrender** cuts wards and cloaks off their caster. Once per session
  a potent flurry leaves a foe with neither.'
---
id: dawnguard-rune-hammer
type: arcana
name: Dawnguard Rune Hammer
tier: major
hall: Arms of Renown
touchstones: [a rune that waits, gold light at the edges, Arkay said where to look]
limit: '*4d Rune*. Runes do not know friend from foe. Its sister, the **Rune Axe**, lays none: it takes
  +1d against the undead and breaks wards.'
pool: 4
pool_name: Rune
source: the-reliquary/arms-of-renown#dawnguard-rune-hammer
body: 'A relic warhammer of the old Dawnguard, gold light along its edges. Roll the Rune pool to stamp
  a fire rune on any surface in reach: it waits, and the next enemy across it burns. Once per session
  a rune goes off potent.'
---
id: scourge
type: arcana
name: Scourge
tier: major
hall: Arms of Renown
touchstones: [defender of the friendless, a voidhole opening, a Dremora made to serve]
limit: a Daedra that invokes it is flung to the Outer Darkness. They all know it, and go for its 
  bearer first.
source: the-reliquary/arms-of-renown#scourge
body: "Mackkan's Hammer, the Bane of Daedra: an ebony mace forged in the Fires of Fickledire and given
  by Malacath to mortals. It takes +1d against Daedra of every rank. Once per session, call back one it
  has banished to fight for you for a scene — a potent summons."
---
id: spear-of-bitter-mercy
type: arcana
name: Spear of Bitter Mercy
tier: major
hall: Arms of Renown
touchstones: [five points, the Innocent Quarry, thunder walking]
limit: Hircine decides who is worthy of it, and who is the Hare. The **Spear of the Hunter**, prize 
  of his Bloodmoon hunt, numbs and poisons instead.
source: the-reliquary/arms-of-renown#spear-of-bitter-mercy
body: "The Spear with Five Points: forged by Mehrunes Dagon, long since Hircine's, carried in his Great
  Hunt. It takes +1d against any quarry you have named and tracked. Once per session, call a storm atronach
  to the kill — a potent summons."
---
id: trueflame-and-hopesfire
type: arcana
name: Trueflame & Hopesfire
tier: major
hall: Arms of Renown
touchstones: [the Blade of Nerevar, a vanished king, fire without fuel]
limit: Trueflame broke at Red Mountain, into three pieces. Carry it and you claim to be Nerevar 
  reborn. Ordinators test such claims.
source: the-reliquary/arms-of-renown#trueflame-and-hopesfire
body: "Twin Dwemer blades, King Dumac's wedding gifts to Nerevar and Almalexia. **Trueflame** burns like
  a torch that cannot go out: +1d wherever fire is the answer, and once per session a potent stroke. **Hopesfire**,
  hers, strikes as blue lightning."
---
id: dawnfang-and-duskfang
type: arcana
name: Dawnfang & Duskfang
tier: major
hall: Arms of Renown
touchstones: [a voice keeping count, 'fire by day, frost by night', a serpent hilt]
limit: unfed, it is a good sword that sulks. Fed, it wants feeding, and its owners end badly.
source: the-reliquary/arms-of-renown#dawnfang-and-duskfang
body: 'One Akaviri longsword with two names. At dawn it is Dawnfang and burns. At dusk, Duskfang, and
  freezes. It counts its kills aloud in your head. Feed it well between one turning and the next and it
  rises **Superior**: +1d, and once per session a potent stroke.'
---
id: shadowrend
type: arcana
name: Shadowrend
tier: major
hall: Arms of Renown
touchstones: [petrified shadow, who you truly are, 'your own face, hostile']
limit: it is won by beating your own shadow. Roll a disaster with it drawn and the shadow steps out 
  again, on its own side.
source: the-reliquary/arms-of-renown#shadowrend
body: "A smoking ebony weapon from the Shivering Isles' Grove of Reflection, claymore or battleaxe as
  you like. Spells take +1d against anything it has cut. Once per session, cut your own shadow loose to
  fight beside you for a scene: a potent double worth a *4d* pool."
---
id: skull-crusher
type: arcana
name: Skull Crusher
tier: major
hall: Arms of Renown
touchstones: [magic in the forge fire, a feather's weight, stolen before the festival]
limit: it betrays the unlawful. Take it by theft or swing it in a crime and the GM takes suspense 
  each scene. It is still seeking its makers.
source: the-reliquary/arms-of-renown#skull-crusher
body: 'A warhammer from the forge of Anudnabia, by the smith Hilbongard Rolamus and the wizard Dorach
  Gusal: light as a walking stick, and it lands like a Daedric Prince. Weight never thorns it, and once
  per session a blow lands potent.'
---
id: bow-of-shadows
type: arcana
name: Bow of Shadows
tier: major
hall: Arms of Renown
touchstones: [Nocturnal's loan, a shot from nowhere, quick feet in the dark]
limit: '*4d Shadow*. It is lent for an errand of her choosing, never given, and it leaves when the errand
  does.'
pool: 4
pool_name: Shadow
source: the-reliquary/arms-of-renown#bow-of-shadows
body: "Nocturnal's bow, lent to the ranger Raerlas Ghile for an errand that failed, and to assassins since.
  Darkness never thorns it. Roll the Shadow pool to loose unseen and be elsewhere when they look. Once
  per session, vanish for a scene: a potent invisibility."
---
id: sword-and-mace-of-the-crusader
type: arcana
name: Sword and Mace of the Crusader
tier: major
hall: Arms of Renown
touchstones: [the Divine Crusader, holy flame, a path walked on faith]
limit: "*4d Zeal*. Do what the Nine would notice and they fall from your hand until you walk the Pilgrim's
  Way."
pool: 4
pool_name: Zeal
source: the-reliquary/arms-of-renown#sword-and-mace-of-the-crusader
body: Pelinal Whitestrake's arms, gifts of the Divines. Both burn with holy flame and take +1d 
  against the undead and Daedra. The **Sword** empties a caster's magicka on a perfect. Roll the 
  Zeal pool with the **Mace** and every dead thing near gives ground.
---
id: keening
type: arcana
name: Keening
tier: mythic
hall: Arms of Renown
touchstones: [the Ethos Knife, tonal architecture, a vanished people]
needs:
- Wraithguard on your hand
- the Heart, or a soul gem warped to ring like it
- Sunder's blow first
limit: 'bare-handed, it deals its bearer a mortal wound: dire stakes, every beat. An ash vampire keeps
  it at Odrosal (3E 427). By 4E 201 the edge has dulled, and the scholar who tried it on a soul gem is
  gone.'
source: the-reliquary/arms-of-renown#keening
body: Kagrenac's short blade, a dagger made of the sound of the shadow of the moons. It flays and 
  focuses what Sunder strikes out of the Heart of Lorkhan. By most accounts, the day the Tools were 
  first used in earnest is the day every Dwemer vanished.
---
id: sunder
type: arcana
name: Sunder
tier: mythic
hall: Arms of Renown
touchstones: [divine mass, a tone rung on a god's heart, exactly what you asked]
needs:
- Wraithguard
- the Heart of Lorkhan, or something that rings like it
- Keening, to shape what comes out before it shapes you
limit: 'without Wraithguard it kills whoever lifts it: dire stakes, every beat, at least while the Heart
  still beats. Dagoth Vemyn guards it at Vemynal (3E 427). Carry the Tools out of Morrowind and brass
  things come walking to take them back.'
source: the-reliquary/arms-of-renown#sunder
body: Kagrenac's hammer of divine mass. Struck with it, the Heart of Lorkhan gives up godlike power 
  in exactly the measure the blow asks. Three mortals used the Tools on it and came down the 
  mountain as the Tribunal.
---
id: auriels-bow
type: arcana
name: Auriel's Bow
tier: mythic
hall: Arms of Renown
touchstones: [the sun as a quiver, the Tyranny of the Sun, Lorkhan's Heart on an arrow]
needs:
- the sun in plain sight
- elven arrows hallowed by a priest of Auri-El, or cursed with a pure-blood vampire's blood
limit: spent, it vanishes and turns up a province away. A dark noon brings every vampire for leagues
  outdoors. Vampire lords and the Dawnguard both want it.
source: the-reliquary/arms-of-renown#auriels-bow
body: The bow of the elven god, pale moonstone, smelling faintly of ash yams. Loose a sunhallowed 
  arrow at the sun and the sun answers, burning every foe beneath it. Loose one wet with the blood 
  of a Daughter of Coldharbour and the sun goes out until morning.
---
id: sword-of-jyggalag
type: arcana
name: Sword of Jyggalag
tier: mythic
hall: Arms of Renown
touchstones: [perfect symmetry, the Greymarch, a line with no kinks]
needs:
- a mind willing to be tidied
- a place where the Isles already leak — a root tunnel, a door in a bay
limit: 'it has a purpose and you are the means: the end of the Shivering Isles. Each use tidies you a
  little, your laughter first. Sheogorath wants his old self forgotten, and sends a Golden Saint.'
source: the-reliquary/arms-of-renown#sword-of-jyggalag
body: 'The claymore of the Prince of Order: silver crystal, without a flaw. Look along its edge and past,
  present, and future run as one line — a ritual-level act of knowing. Cut where the Shivering Isles press
  close and the wound between worlds stays open.'
---
id: indoril-armor
type: arcana
name: Indoril Armor
tier: minor
hall: Armor, Raiment & Rings
touchstones: [the Golden Mask of Devotion, gold leaf on shell, "\"We're watching you. Scum.\""]
limit: it is sacred. The first Ordinator to see it on you marks you for death, and from then on all 
  of them attack on sight, for good.
source: the-reliquary/armor-raiment-and-rings#indoril-armor
body: "Gold-leafed shell with a closed mask, the face of Nerevar: the harness of the Temple's Ordinators
  and no one else. In Morrowind it makes you the law at a glance. Crowds part, and nobody asks an Ordinator
  his business."
---
id: legion-uniform
type: arcana
name: Legion Uniform
tier: minor
hall: Armor, Raiment & Rings
touchstones: ["\"You're out of uniform\"", a bunk in any fort, the Ruby Ranks]
limit: unearned, it is a disguise that lasts until someone asks for the watchword. Earned, it takes 
  orders. Deserters hang.
source: the-reliquary/armor-raiment-and-rings#legion-uniform
body: "An Imperial cuirass with the dragon on it: chain for a recruit, steel for a trooper, templar plate
  for a knight. In it you have a bunk in any fort, a hearing from any officer, and the rank on your chest.
  Out of it they won't talk to you."
---
id: thieves-guild-leathers
type: arcana
name: Thieves Guild Leathers
tier: minor
hall: Armor, Raiment & Rings
touchstones: [more pockets than seams, muffled buckles, "\"You're not fooling anyone\""]
limit: guards know the cut on sight and say so. The Guild assumes anyone in them is working and paid
  up, and collects its share either way.
source: the-reliquary/armor-raiment-and-rings#thieves-guild-leathers
body: 'Dark leathers the Guild issues a new thief who has proved useful: muffled buckles, and more pockets
  than seams. Small loot rides free and silent. Once per session, take +1d to palm, lift, or pocket something.'
---
id: shrouded-armor
type: arcana
name: Shrouded Armor
tier: minor
hall: Armor, Raiment & Rings
touchstones: [black and red, soft boots on stone, a hand over a mouth]
limit: everyone knows what the colors mean. Worn without the Brotherhood's leave, it invites a visit
  from someone dressed the same.
source: the-reliquary/armor-raiment-and-rings#shrouded-armor
body: "The Dark Brotherhood's black and red, close as a second skin: cowl, gloves, soft boots. Poison
  lands one step lighter on its wearer. **Ancient Shrouded Armor**, on an assassin walled up behind the
  throne in Hag's End, shrugs poison off entirely."
---
id: dawnguard-armor
type: arcana
name: Dawnguard Armor
tier: minor
hall: Armor, Raiment & Rings
touchstones: [a fort in the Rift, the full suit or nothing, fangs on a steel gorget]
limit: only the whole suit, only against vampires, who know the make and go for its wearer first. 
  Before Isran reopens the fort (4E 201), every piece is Second Era rust.
source: the-reliquary/armor-raiment-and-rings#dawnguard-armor
body: Riveted plate or studded leather out of Fort Dawnguard in the Rift, made by people who expect 
  to be bitten. A vampire's drain and a vampire's spells land one step lighter on whoever wears the 
  full suit.
---
id: bonemold-and-chitin
type: arcana
name: Bonemold & Chitin
tier: minor
hall: Armor, Raiment & Rings
touchstones: [Armun-An for Hlaalu, Gah-Julan for Redoran, arrows skipping off]
limit: bonemold announces a House, and the other Houses notice. Chitin cracks with neglect. West of 
  Morrowind, both get stares.
source: the-reliquary/armor-raiment-and-rings#bonemold-and-chitin
body: "Morrowind's own. **Chitin** is insect shell laminated with resin, the Ashlanders' choice: arrows
  skip off it, and volleys never thorn its wearer. **Bonemold** is shaped bone set in resin, a noble's
  armor, cut to say which Great House owns you."
---
id: dwarven-orcish-glass-and-ebony-armor
type: arcana
name: Dwarven, Orcish, Glass & Ebony Armor
tier: minor
hall: Armor, Raiment & Rings
touchstones: [salvaged brass, green orichalcum, folded Godsblood]
limit: 'glass shatters under a hammer across the grain. The other three weigh like anvils: +1t to swim,
  sneak, or run far.'
source: the-reliquary/armor-raiment-and-rings#dwarven-orcish-glass-and-ebony-armor
body: 'Four materials worth a commission. **Dwarven** plate soaks a blow: a mace, a fall, a piston. **Orcish**
  orichalcum is the stiffest plate made. **Glass** is so light its weight never thorns you. **Ebony**
  never wears out. It gets inherited.'
---
id: daedric-armor
type: arcana
name: Daedric Armor
tier: minor
hall: Armor, Raiment & Rings
touchstones: [a heart for every piece, horns and red veins, silence on the stair]
limit: "it is never quiet or kind: +1t to sneak, soothe, or pass unremarked. In Morrowind a suit is a
  noble family's fortune, and families count their heirlooms."
source: the-reliquary/armor-raiment-and-rings#daedric-armor
body: "Ebony bound with a Daedra's essence, a heart spent on every piece: black, horned, red-veined, shaped
  by long suffering. Lesser foes hang back from its wearer. Their numbers never thorn you until someone
  braver leads."
---
id: dragonscale-and-dragonplate
type: arcana
name: Dragonscale & Dragonplate
tier: minor
hall: Armor, Raiment & Rings
touchstones: [scales like slates, the smell of old fire, proof of the kill]
limit: it took a dead dragon and a master smith, and dragons know a kinsman's hide. Before they 
  return (4E 201), every suit is an heirloom or a tomb's.
source: the-reliquary/armor-raiment-and-rings#dragonscale-and-dragonplate
body: 'Armor cut from dragons: **Dragonscale**, scales laced on leather, and **Dragonplate**, slabs of
  bone over scale. It turns what the hide turned: once per session, ignore every thorn on a roll from
  arrows, teeth, or claws.'
---
id: stalhrim-armor
type: arcana
name: Stalhrim Armor
tier: minor
hall: Armor, Raiment & Rings
touchstones: [blue-white facets, armor for kings, breath smoking in summer]
limit: every piece was cut from somebody's tomb. The Skaal hold stalhrim holy and its smithing 
  theirs, and they ask whose.
source: the-reliquary/armor-raiment-and-rings#stalhrim-armor
body: "Solstheim's enchanted ice, worked over steel or quicksilver: blue-white and cold in any season.
  The old Nords cased their dead in it and, the stories say, armored their kings. Older cold keeps new
  cold out: weather and ice water never thorn or mark its wearer."
---
id: amber-and-madness-armor
type: arcana
name: Amber & Madness Armor
tier: minor
hall: Armor, Raiment & Rings
touchstones: [Mania's gold, Dementia's black, a matrix soaked in madness]
limit: you bring the ore and the matrix, and neither is sold. Choose a smith and the other 
  remembers.
source: the-reliquary/armor-raiment-and-rings#amber-and-madness-armor
body: Two armors of the Shivering Isles, by two smiths who loathe each other. Dumag gro-Bonk of 
  Bliss casts **Amber**, root-tunnel resin, light and gold. Cutter of Crucible forges **Madness** 
  ore, heavy and jagged. Bring a matrix and the piece holds its enchantment as a *2d* pool.
---
id: boots-of-blinding-speed
type: arcana
name: Boots of Blinding Speed
tier: minor
hall: Armor, Raiment & Rings
touchstones: [faster than the news, total dark, the wall you never saw]
limit: "blind means blind: +1t on everything but running straight, and a grim finds whatever was in the
  way. A wanted woman named Pemenie paid for an escort with them (3E 427), and didn't mention the flaw."
source: the-reliquary/armor-raiment-and-rings#boots-of-blinding-speed
body: Netch-leather boots that make their wearer faster than a horse, and blind for as long as they 
  are on. In them take +1d to outrun, overtake, or simply arrive first.
---
id: boots-of-springheel-jak
type: arcana
name: Boots of Springheel Jak
tier: minor
hall: Armor, Raiment & Rings
touchstones: [rooftops as a road, a broken stair cleared, the Earl of Imbel]
limit: 'once, they take a fall nobody survives: you walk away and the boots are ruined. Jak never died.
  He is Jakben, Earl of Imbel, a vampire in the Imperial City (to 3E 433), and he has them on.'
source: the-reliquary/armor-raiment-and-rings#boots-of-springheel-jak
body: 'The boots of Springheel Jak, a master thief buried in them three centuries back. In them take +1d
  to leap: a rooftop gap, a second-story sill, the far side of a broken stair.'
---
id: boots-of-the-apostle
type: arcana
name: Boots of the Apostle
tier: minor
hall: Armor, Raiment & Rings
touchstones: [seven thousand steps skipped, wind underfoot, a long look down]
limit: "*2d Air*. It lets go when the pool empties, wherever you are. They are Tiber Septim's, and the
  Imperial Cult wants them in a chapel."
pool: 2
pool_name: Air
source: the-reliquary/armor-raiment-and-rings#boots-of-the-apostle
body: 'The Greybeards gave them to Talos Stormcrown for his cunning craft and riddling, and he came down
  the mountain riding clouds. Roll the pool to walk on air: a cliff, a chasm, a wall. **Ten Pace Boots**,
  from Bal Fell, only slow a fall.'
---
id: fists-of-randagulf
type: arcana
name: Fists of Randagulf
tier: minor
hall: Armor, Raiment & Rings
touchstones: [Clan Begalin, a conqueror's respect, knuckles like anvils]
limit: "they vanished when Harald died, and surface in bad company: a Sixth House shrine (3E 427), a prizefighter
  dead in a spider's cave (4E 201). Strong men want to test the name."
source: the-reliquary/armor-raiment-and-rings#fists-of-randagulf
body: The gauntlets of Randagulf of Clan Begalin, as mighty a warrior as Skyrim ever raised. High 
  King Harald killed him and kept the Fists, out of respect. Take +1d to lift, break, or wrestle 
  bare-handed.
---
id: helm-of-oreyn-bearclaw
type: arcana
name: Helm of Oreyn Bearclaw
tier: minor
hall: Armor, Raiment & Rings
touchstones: [a skull for a helm, the witch-serpent, two names for one hero]
limit: Orcs say the deeds were his friend Kharag gro-Khar's, and the helm too. Malacath agrees, and 
  wants the Oreyn line ended. Wear it and you have taken a side.
source: the-reliquary/armor-raiment-and-rings#helm-of-oreyn-bearclaw
body: 'An engraved skull: the helm of Oreyn Bearclaw, the hunter of Valenwood who killed the witch-serpent
  Glenhwyfaunva. Its wearer runs like something younger. Take +1d to chase down, climb after, or outlast
  a quarry.'
---
id: helm-of-yngol
type: arcana
name: Helm of Yngol
tier: minor
hall: Armor, Raiment & Rings
touchstones: [a father's grief, the Storm of Separation, sea-cold steel]
limit: his shade keeps it in Yngol Barrow and fights for it. Windhelm stands where it does so 
  Ysgramor could see the mound.
source: the-reliquary/armor-raiment-and-rings#helm-of-yngol
body: The helm of Yngol, Ysgramor's son, greatest smith of the Atmorans and the first of the Five 
  Hundred to die in Tamriel. Frost lands one step lighter on its wearer. The **Ancient Helmet of the
  Unburned**, hung on a burning sword in Labyrinthian, does that for fire.
---
id: diadem-of-the-savant
type: arcana
name: Diadem of the Savant
tier: minor
hall: Armor, Raiment & Rings
touchstones: [Shalidor's test, a gate for each school, magic made cheap]
limit: it waits past gates that open only to a spell of the right school, and whatever Shalidor left
  at the end. Wizards who know it assume you passed, and expect that much of you.
source: the-reliquary/armor-raiment-and-rings#diadem-of-the-savant
body: "A circlet won at the end of Shalidor's Maze, the trial in Labyrinthian the old archmages set for
  their successors. It makes magic cheap: once per session, regain magic (Chapter 4) in the moment you
  spend it."
---
id: escutcheon-of-chorrol
type: arcana
name: Escutcheon of Chorrol
tier: minor
hall: Armor, Raiment & Rings
touchstones: [the Great Oak, a blow sent home, a countess's thanks]
limit: its weight thorns anything quick, +1t. Countess Arriana Valga gave it for the return of the 
  Honorblade of Chorrol (3E 433). Carry it and Chorrol calls you its champion, and calls on you.
source: the-reliquary/armor-raiment-and-rings#escutcheon-of-chorrol
body: 'A massive ebony shield bearing the Great Oak of Chorrol, as heavy as shields come. What strikes
  it feels the blow: on a perfect defense behind it, your attacker takes what was meant for you.'
---
id: fin-gleam
type: arcana
name: Fin Gleam
tier: minor
hall: Armor, Raiment & Rings
touchstones: [green light under water, warm shapes in the dark, bones on the seabed]
limit: its last owner drowned wearing a helm that breathes water. Nobody has asked what held him 
  down.
source: the-reliquary/armor-raiment-and-rings#fin-gleam
body: "A glass helm lying on the sea floor west of Anvil. Its wearer breathes water, sees in the dark,
  and sees the warm shape of anything living nearby: water and darkness never thorn you. The **Jewel of
  the Rumare**, a fisherman's ring from Weye, manages only the breathing."
---
id: amulets-of-the-divines
type: arcana
name: Amulets of the Divines
tier: minor
hall: Armor, Raiment & Rings
touchstones: [a god at your collar, chapel silver, whose you are]
limit: one god at a time. Since the White-Gold Concordat, Talos's is a crime, and the Thalmor check 
  collars.
source: the-reliquary/armor-raiment-and-rings#amulets-of-the-divines
body: "Nine pendants, a god apiece. Once per session, +1d in your god's keeping: **Akatosh** to cast,
  **Arkay** to endure, **Dibella** to charm, **Julianos** to reason, **Kynareth** to outlast, **Mara**
  to heal, **Stendarr** to shield, **Talos** to dare, **Zenithar** to haggle."
---
id: amulet-of-mara
type: arcana
name: Amulet of Mara
tier: minor
hall: Armor, Raiment & Rings
touchstones: ['"Is that an Amulet of Mara?"', a plain gold ring, the temple in Riften]
limit: it works on everyone, including people you wish it didn't. One Bond, one spouse. A ring left 
  off gets noticed.
source: the-reliquary/armor-raiment-and-rings#amulet-of-mara
body: "Mara's knot on a cord. In Skyrim it means its wearer is looking to wed, and anyone who has thought
  about it says so. Wed at her temple and each spouse gets a **Bond of Matrimony**: once per session,
  a potion one gives the other doesn't roll its pool."
---
id: locket-of-saint-jiub
type: arcana
name: Locket of Saint Jiub
tier: minor
hall: Armor, Raiment & Rings
touchstones: [the Winged Menace, a saint with a past, twenty-six volumes]
limit: "*2d Saint's Guard*. Jiub died at Kvatch (3E 433) and sits in the Soul Cairn writing his life.
  He trades the locket for his scattered pages, and expects the book read."
pool: 2
pool_name: Saint's Guard
source: the-reliquary/armor-raiment-and-rings#locket-of-saint-jiub
body: "The locket of Jiub the Eradicator, the saint who hunted the cliff racers off Vvardenfell from the
  back of a silt strider. It guards like a breastplate: when a blow would land, roll the pool and it doesn't."
---
id: amulet-of-articulation
type: arcana
name: Amulet of Articulation
tier: minor
hall: Armor, Raiment & Rings
touchstones: [the Guildmaster's badge, a lie going down smooth, a nod from the doorman]
limit: the Guild knows who should be wearing it. On anyone else it means the Guildmaster is dead, 
  robbed, or you, and every thief in Riften will be working out which.
source: the-reliquary/armor-raiment-and-rings#amulet-of-articulation
body: "The badge of the Thieves Guild's master in Skyrim, handed over with the office. Lies go down smooth
  around it: once per session, one plausible lie, excuse, or promise simply works, no roll."
---
id: mundane-ring
type: arcana
name: Mundane Ring
tier: minor
hall: Armor, Raiment & Rings
touchstones: [nothing to look at, a spell going nowhere, any gold band]
limit: "*2d Mundane*, soul-fed. Appraisers shrug at it, thieves take it for the gold, and you will have
  trouble explaining why you want that one back. Mankar Camoran's son Raven wore one (3E 433)."
pool: 2
pool_name: Mundane
soul_fed: true
source: the-reliquary/armor-raiment-and-rings#mundane-ring
body: A plain gold band, exactly like every other plain gold band, carrying one of the strongest 
  wards ever set in a ring. When a spell would land on you, roll the pool and it doesn't.
---
id: ring-of-phynaster
type: arcana
name: Ring of Phynaster
tier: minor
hall: Armor, Raiment & Rings
touchstones: [a hero-god's caution, centuries of close calls, gone by morning]
limit: it stays with nobody but Phynaster. Keep it a season and it is gone to its next resting place
  — one of the Wharf Rats' hundred cellars, if you believe the Wharf Rats.
source: the-reliquary/armor-raiment-and-rings#ring-of-phynaster
body: Made by Phynaster, hero-god of the Altmer, to survive his own adventures. He lived centuries 
  in it. Poison and lightning land one step lighter on its wearer.
---
id: mentors-ring
type: arcana
name: Mentor's Ring
tier: minor
hall: Armor, Raiment & Rings
touchstones: [a teacher's loan, the lesson landing, a ring in an ash urn]
limit: "it was only ever lent. Since Asron died it has stayed with nobody: left in an ancestral tomb,
  lost in a lake. Mages who know it take its wearer for somebody's apprentice, and talk accordingly."
source: the-reliquary/armor-raiment-and-rings#mentors-ring
body: 'High Wizard Carni Asron made it and lent it to each apprentice for the length of their studies.
  It makes a quick study: take +1d to learn, decipher, or puzzle out magic nobody taught you.'
---
id: vampiric-ring
type: arcana
name: Vampiric Ring
tier: minor
hall: Armor, Raiment & Rings
touchstones: [strength running uphill, a cold hand, the horker that drank men]
limit: "*2d Thirst*, soul-fed. It turns up on the dead: a war-wizard's bones in Ald Redaynia, the gut
  of a horker off Windhelm (4E 201). Vampire hunters don't split hairs."
pool: 2
pool_name: Thirst
soul_fed: true
source: the-reliquary/armor-raiment-and-rings#vampiric-ring
body: 'Made long ago in Morrowind by a cult that served vampires, and rarely seen. Lay the ring hand on
  the living and roll the pool: their strength runs up your arm. Clear one of your marks, and they sag
  for a beat.'
---
id: ring-of-disrobing
type: arcana
name: Ring of Disrobing
tier: minor
hall: Armor, Raiment & Rings
touchstones: [to the last buckle, an oddity with one use, a heap of your own clothes]
limit: everything, every time, in any company. A Prince's curse may argue. Una Armina wants one for 
  her Museum of Oddities in Crucible.
source: the-reliquary/armor-raiment-and-rings#ring-of-disrobing
body: "An amber ring from the Shivering Isles. Put it on and everything else you wear comes off at once,
  to the last buckle. That is all it does. It never asks whether a thing can come off: a cursed band,
  a slave's bracer, a helm rusted shut."
---
id: mantle-of-woe
type: arcana
name: Mantle of Woe
tier: minor
hall: Armor, Raiment & Rings
touchstones: [a well with no bottom, 'black cloth, cold seams', Tymvaul the Dark]
limit: 'the sun burns its wearer: under open daylight, mark Brawn each scene. It corrupts as well. Tymvaul
  of the Skaal went down a well after it and came up calling himself the Dark.'
source: the-reliquary/armor-raiment-and-rings#mantle-of-woe
body: "A black robe of the dark arts, long kept in the ice cave of Rimhull on Solstheim. It deepens a
  conjurer's reach: take +1d to raise, bind, or command the dead."
---
id: gambolpuddy
type: arcana
name: Gambolpuddy
tier: minor
hall: Armor, Raiment & Rings
touchstones: [a glove with opinions, the sugar-fairy's pillow, someone else's name]
limit: wear it a scene and the GM says who you think you are. Offered at Sheogorath's shrine in Ald 
  Daedroth it renews the Temple's pact, and vanishes.
source: the-reliquary/armor-raiment-and-rings#gambolpuddy
body: Sheogorath's right glove, the Ambiguous Glove. Once per session, take +1d on a roll of wit, 
  grace, or luck, then +1t on your next of strength or will. It also persuades its wearer they are 
  whoever wore it last.
---
id: tokens-of-the-ashlander-tribes
type: arcana
name: Tokens of the Ashlander Tribes
tier: minor
hall: Armor, Raiment & Rings
touchstones: [a tribe's word, the yurt door, ash on the wind]
limit: each was given to one person, and wise women compare notes. Carry another's and they ask how 
  he died.
source: the-reliquary/armor-raiment-and-rings#tokens-of-the-ashlander-tribes
body: "A token from each Ashlander tribe — **Madstone of the Ahemmusa**, **Teeth of the Urshilaku**, **Thong
  of Zainab**, **Seizing of the Erabenimsun** — given to the one it names Nerevarine. Shown, a token is
  that tribe's word: hearth, guide, and +1d dealing with its people."
---
id: ebony-mail
type: arcana
name: Ebony Mail
tier: major
hall: Armor, Raiment & Rings
touchstones: [black smoke, tougher than a troll, Boethiah's regard]
limit: '*4d Shroud*. The smoke knows no friends. Boethiah alone decides who wears it and how long. Lose
  her favor, as Helath Stormbinder did, and her next champion comes for it.'
pool: 4
pool_name: Shroud
source: the-reliquary/armor-raiment-and-rings#ebony-mail
body: "Boethiah's breastplate of black Godsblood. Fire and spells land one step lighter on its wearer.
  Roll the Shroud pool to go silent in a wreath of black smoke: whatever closes with you chokes, and lesser
  foes simply fall."
---
id: saviors-hide
type: arcana
name: Savior's Hide
tier: major
hall: Armor, Raiment & Rings
touchstones: [Scourge of the Oathbreaker, the one who got away, Hide-Wearer]
limit: Hircine's faithful know the Hide, and the keen ones want to learn whether what escaped once 
  can do it twice.
source: the-reliquary/armor-raiment-and-rings#saviors-hide
body: "Hircine's own hide, peeled for the first mortal to escape his Hunting Grounds. Spells, poison,
  the blows of oathbreakers, and the Spear of Bitter Mercy all land one step lighter on its wearer. Once
  per session, slip a hunt, potent: the trail simply ends."
---
id: spellbreaker
type: arcana
name: Spellbreaker
tier: major
hall: Armor, Raiment & Rings
touchstones: ['Dwarf-make, and more', a ward in the air, a mage struck dumb]
limit: '*4d Ward*. It still seeks its first owner and stays with no one long. Peryite sets tasks for whoever
  holds it.'
pool: 4
pool_name: Ward
source: the-reliquary/armor-raiment-and-rings#spellbreaker
body: "A Dwarven tower shield made for King Rourken's war with Shalidor, and Peryite's since. When a spell
  or dragon breath would land behind it, roll the pool and it doesn't. Once per session, potent, it breaks
  magic already done: a curse, a paralysis, a caster's voice."
---
id: masque-of-clavicus-vile
type: arcana
name: Masque of Clavicus Vile
tier: major
hall: Armor, Raiment & Rings
touchstones: [a horned face, a year and a day, borrowed regard]
limit: it changes nothing underneath, and Vile takes it back at the moment that amuses him most. 
  Avalea had it a year and a day past her wedding.
source: the-reliquary/armor-raiment-and-rings#masque-of-clavicus-vile
body: 'A horned helm from the Prince of bargains. Its wearer is liked: trusted on sight, admired in any
  room. Take +1d to charm, bargain, or be believed. Once per session a first impression is potent: a court,
  a jury, or a mob is yours.'
---
id: ring-of-namira
type: arcana
name: Ring of Namira
tier: major
hall: Armor, Raiment & Rings
touchstones: [a seat at Namira's table, strength from the grave, foul breath]
limit: it is cannibalism, and a crime wherever it is seen. Guards smell it on your breath for a day.
  Namira's other guests expect you at dinner.
source: the-reliquary/armor-raiment-and-rings#ring-of-namira
body: "Namira's ring, given for services nobody describes at table. Its wearer can eat the dead: once
  per scene, feed on a fresh corpse of man or mer to clear all your marks and one harm, and take +1d on
  feats of endurance for the session."
---
id: ring-of-hircine
type: arcana
name: Ring of Hircine
tier: major
hall: Armor, Raiment & Rings
touchstones: [an engraved wolf, the moon overruled, a long life]
limit: "stolen, it is cursed: it won't come off, and the GM chooses when you change. Sinding stole it
  (4E 201). A child in Falkreath paid."
source: the-reliquary/armor-raiment-and-rings#ring-of-hircine
body: "A band with a wolf's head. On a werewolf's hand the change obeys: neither moon nor suspense forces
  it, and it comes once more per session. On anyone else it brings the beast for a scene: roll *4d The
  Wolf* in place of your stats, aggressive actions only."
---
id: ring-of-khajiiti
type: arcana
name: Ring of Khajiiti
tier: major
hall: Armor, Raiment & Rings
touchstones: [off Mephala's arm, a stolen tattoo, 'quick, quiet, gone']
limit: 'use it too freely and it leaves, as it left Rajhin among his enemies: on a disaster, it is gone.
  Mephala and Meridia both give it out.'
source: the-reliquary/armor-raiment-and-rings#ring-of-khajiiti
body: "Mephala's, until Rajhin stole it off her arm and became the Khajiit's god of thieves. Its wearer
  is unseen, unheard, and quick: +1d to sneak, steal, or get away. Once per session a theft is potent.
  Rajhin took a tattoo off a sleeping empress."
---
id: nightingale-armor
type: arcana
name: Nightingale Armor
tier: major
hall: Armor, Raiment & Rings
touchstones: ['half-moon, crescent, full', walk with the shadows, the Oath]
limit: 'three suits, three sworn: to guard the Twilight Sepulcher in life, and in death until Nocturnal
  lets go.'
source: the-reliquary/armor-raiment-and-rings#nightingale-armor
body: "Forged midnight: the leathers of Nocturnal's three. Darkness never thorns its wearer, who hides
  at +1d. Each holds one gift, potent once per session: **Subterfuge** turns foes on each other, **Stealth**
  hides you for a scene, **Strife** drinks a life to mend yours."
---
id: archmages-robes
type: arcana
name: Archmage's Robes
tier: major
hall: Armor, Raiment & Rings
touchstones: [every school at once, the hood up, a hush in the Hall]
limit: 'they are an office. Whoever wears them answers for the College: to the Jarl, to a town that blames
  it for the Great Collapse, and to every wizard who wanted the chair.'
source: the-reliquary/armor-raiment-and-rings#archmages-robes
body: 'The hooded robes of the Arch-Mage of the College of Winterhold, handed down with the chair. Every
  school comes easier in them: take +1d on any roll of spellcraft, and once per session one spell is potent.'
---
id: shield-of-ysgramor
type: arcana
name: Shield of Ysgramor
tier: major
hall: Armor, Raiment & Rings
touchstones: ['never carried, they say', ghosts in the tomb, Wuuthrad's companion]
limit: 'it lies past the door Wuuthrad opens and the ghosts of his Companions. Jorrvaskr counts it theirs:
  carry it as a Companion, or as a grave robber.'
source: the-reliquary/armor-raiment-and-rings#shield-of-ysgramor
body: A great shield buried with Ysgramor at the end of the Merethic Era. Nobody knows that he ever 
  carried it. Behind it spells land one step lighter, and once per session, potent, harm that would 
  drop you does not land.
---
id: auriels-shield
type: arcana
name: Auriel's Shield
tier: major
hall: Armor, Raiment & Rings
touchstones: [the Bow's twin, stored thunder, a mind of its own]
limit: '*4d Stored Force*, filled only by blocking. It owes its bearer nothing: in the fable it left her
  in her hour of need. A Falmer has it in 4E 201.'
pool: 4
pool_name: Stored Force
source: the-reliquary/armor-raiment-and-rings#auriels-shield
body: "The elven god's own, ebony or moonstone by the telling. Take +1d to defend behind it. It drinks
  what it stops: each blow or spell you turn adds 1d to its pool, to 4d. Roll the pool on a bash to give
  it all back: a rank flattened."
---
id: eleidons-ward
type: arcana
name: Eleidon's Ward
tier: major
hall: Armor, Raiment & Rings
touchstones: [a baron's fortune, the rescued daughter, a wound closing]
limit: Mordrin Hanin was buried with it in Ibar-Dad on Vvardenfell, and the tomb's dead want it 
  back. So would the baron's heirs, if he left them anything.
source: the-reliquary/armor-raiment-and-rings#eleidons-ward
body: "Made for Eleidon, a holy knight of the Bretons, by a baron who spent his fortune on thanks for
  a daughter's life. Take +1d to protect someone who cannot fight. Once per session it mends you or anyone
  behind it: a potent healing."
---
id: lords-mail
type: arcana
name: Lord's Mail
tier: major
hall: Armor, Raiment & Rings
touchstones: [the Gift of Kynareth, the bull's arrogance, the red dragon]
limit: Kynareth takes it from the unworthy, as she took it from Morihaus, and hides it for the next.
  The Legion calls it theirs, and keeps losing it.
source: the-reliquary/armor-raiment-and-rings#lords-mail
body: "The Armor of Morihaus, Kynareth's gift: a cuirass of unsurpassed make, the red dragon on its breast.
  No poison takes in its wearer, and spells land one step lighter. Once per session it breathes for you:
  a potent healing, mid-fight."
---
id: dragonbone-cuirass
type: arcana
name: Dragonbone Cuirass
tier: major
hall: Armor, Raiment & Rings
touchstones: [a battlemage's debt, bone that remembers fire, gone by spring]
limit: '*4d Dragonfire*, soul-fed. Like its first owner, it never stays: settle a season and it is gone.
  Last seen locked in the drowned ruin of Mudan (3E 427).'
pool: 4
pool_name: Dragonfire
soul_fed: true
source: the-reliquary/armor-raiment-and-rings#dragonbone-cuirass
body: Dragon bone enchanted by Zurin Arctus, Tiber Septim's battlemage, to pay a debt to a wandering
  warrior. Fire lands one step lighter on its wearer. Roll the pool to answer with a blast of flame,
  potent once per session.
---
id: bloodworm-helm
type: arcana
name: Bloodworm Helm
tier: major
hall: Armor, Raiment & Rings
touchstones: [trollbone lace, the King of Worms, a skeleton answering]
limit: '*4d Wormcraft*, soul-fed. He left it behind when he rose to godhood, and his Order wants it back.
  Worn openly it is a confession.'
pool: 4
pool_name: Wormcraft
soul_fed: true
source: the-reliquary/armor-raiment-and-rings#bloodworm-helm
body: "Mannimarco's crown, built of trollbone: beautiful, and people look away. Take +1d to raise, command,
  or turn the dead. Roll the pool to call a skeleton to fight for you for a scene, or to drain the strength
  out of a living foe."
---
id: the-jagged-crown
type: arcana
name: The Jagged Crown
tier: major
hall: Armor, Raiment & Rings
touchstones: [dragon teeth, every king still in it, an old claim]
limit: whoever holds it can make a High King, so every claimant wants it and none thanks its keeper.
  Borgas lies in it at Korvanjund, and wakes.
source: the-reliquary/armor-raiment-and-rings#the-jagged-crown
body: "The crown of Skyrim's kings before the Moots: dragon bone and teeth, Harald's work, they say. Something
  of every king who wore it remains. Take +1d to command or rally Nords. Once per session, potent, speak
  with all their voices: a hall kneels."
---
id: aetherial-crown
type: arcana
name: Aetherial Crown
tier: major
hall: Armor, Raiment & Rings
touchstones: [two stars at once, blue light, one forging]
limit: 'the kept blessing sleeps while the Crown is off. One Crest, one work: this, or the **Aetherial
  Shield**, whose bash turns a foe to harmless mist for a beat.'
source: the-reliquary/armor-raiment-and-rings#aetherial-crown
body: 'A circlet of Dwarven metal and Aetherium, made only at the Aetherium Forge. It does one thing:
  its wearer holds two standing-stone blessings at once, where every other hero holds one. Take a new
  blessing and the Crown keeps the old.'
---
id: dragon-priest-mask
type: arcana
name: Dragon Priest Mask
tier: major
hall: Armor, Raiment & Rings
touchstones: [the priest's own name, time held off, a dry voice]
limit: one mask at a time. Each is still on its priest, a lich-lord who never means to see it on a 
  living face.
source: the-reliquary/armor-raiment-and-rings#dragon-priest-mask
body: 'The dragons gave their high priests masks time does not touch. Each gives +1d in its province and
  one potent working per session: **Krosis** (archery, locks) · **Morokei** (magicka) · **Volsung** (water,
  barter) · **Otar** (fire, frost, shock) · **Hevnoraak** (poison, plague).'
---
id: necromancers-amulet
type: arcana
name: Necromancer's Amulet
tier: major
hall: Armor, Raiment & Rings
touchstones: [glowing eyes, unearned wisdom, plate nobody can see]
limit: '*4d Jade Ward*. The body pays: +1t on feats of strength and endurance while you wear it. It is
  unstable here, and fades out to reappear far off, owner or no owner.'
pool: 4
pool_name: Jade Ward
source: the-reliquary/armor-raiment-and-rings#necromancers-amulet
body: "Mannimarco's making: a jade skull on a chain. Its wearer is wise beyond their years and armored
  without armor: +1d to conjure and on rolls of lore, and when a mundane blow would land, roll the pool
  and it doesn't."
---
id: gauldur-amulet
type: arcana
name: Gauldur Amulet
tier: major
hall: Armor, Raiment & Rings
touchstones: [the Forbidden Legend, three thirds, patricide]
limit: its thirds lie sealed with the brothers Jyrik, Sigdis, and Mikrul. Only their father's ghost 
  reforges it, at his grave in Reachwater Rock, and all three rise first.
source: the-reliquary/armor-raiment-and-rings#gauldur-amulet
body: Archmage Gauldur's amulet. His three sons murdered him in his sleep, split it, and ravaged the
  land until Harald's battlemages ran them down. Whole, weariness never thorns you, and once per 
  session one feat or spell is potent.
---
id: relics-of-the-crusader
type: arcana
name: Relics of the Crusader
tier: major
hall: Armor, Raiment & Rings
touchstones: [a god per piece, holy aura, nine wayshrines]
limit: the Nine watch. One crime or cruelty and every piece falls off, too heavy to lift, until you 
  walk the Pilgrim's Way.
source: the-reliquary/armor-raiment-and-rings#relics-of-the-crusader
body: "Pelinal Whitestrake's harness, each piece a god's gift: helm, cuirass, gauntlets, greaves, boots,
  shield. Worn whole, blows from the undead and Daedra land one step lighter, and no disease takes. Once
  per session the **Shield** returns a spell to its caster, potent."
---
id: imperial-dragon-armor
type: arcana
name: Imperial Dragon Armor
tier: major
hall: Armor, Raiment & Rings
touchstones: [a dragon on the breast, the seventh Champion, a reflex salute]
limit: it claims the Emperor's trust or his throne. Without the title that is treason, and someone 
  asks which.
source: the-reliquary/armor-raiment-and-rings#imperial-dragon-armor
body: The Septim emperors' own armor. Ocato had one made for a commoner, the Champion of Cyrodiil 
  (3E 433). Take +1d to command the Empire's servants. Once per session an order is potent. The 
  **Armor of Tiber Septim** in Sancre Tor bears a god's blood, a ritual anchor.
---
id: deathbrand-armor
type: arcana
name: Deathbrand Armor
tier: major
hall: Armor, Raiment & Rings
touchstones: [the pirate king, 'four graves, one map', screams on the shoals]
limit: "cursed in Dagon's name: until you beat Haknir, any piece you wear sets you screaming, rattled
  until it is off. He waits in Gyldenhul."
source: the-reliquary/armor-raiment-and-rings#deathbrand-armor
body: 'The stalhrim harness of Haknir Death-Brand, King of Ghosts: four pieces, each stronger for the
  others. In all four you breathe water and take +1d with a blade in each hand. Once per session a charge
  is potent: lesser foes fall like grass.'
---
id: robe-of-the-lich
type: arcana
name: Robe of the Lich
tier: major
hall: Armor, Raiment & Rings
touchstones: [her judges' graves, a priestess under the city, plague rats]
limit: 'the harm is real: a second such spell leaves you desperate, a third drops you. Unsealed, she loosed
  the Crimson Plague on Mournhold (3E 427).'
source: the-reliquary/armor-raiment-and-rings#robe-of-the-lich
body: 'The robe of Gedna Relvel, a priestess of Mournhold condemned for forbidden arts, who made herself
  a lich and outlived her judges under the city. It trades life for power: before a spell, be bloodied,
  no defense, and it is potent.'
---
id: wraithguard
type: arcana
name: Wraithguard
tier: mythic
hall: Armor, Raiment & Rings
touchstones: [the third Tool, a glove for holding gods, brass that hums]
needs:
- its wearer's magicka harmonized to it
- "someone who can: Vivec, or the last living Dwemer with Kagrenac's planbook and journals"
limit: 'the first time it goes on, it nearly kills: dire stakes, and whoever lives keeps a permanent condition.
  Vivec can lift you out of time to spare you, and wants an oath first (3E 427). By the Fourth Era the
  Tools have dulled, and it sits in a Dwemer vault in the Sightless Pit, under an ebony centurion.'
source: the-reliquary/armor-raiment-and-rings#wraithguard
body: "Kagrenac's gauntlet: something like brass, though accounts differ. It was made for one job, to
  let a mortal carry Keening and Sunder. On the hand that wears it the Tools deal no mortal wound, and
  work truer. Without it they kill. More than once the Heart of Lorkhan's fate has come down to who had
  this glove on."
---
id: moon-and-star
type: arcana
name: Moon-and-Star
tier: mythic
hall: Armor, Raiment & Rings
touchstones: [Azura's blessing, proof beyond argument, Nerevar come again]
needs:
- to be Nerevar reborn, by Azura's reckoning alone
- the Cavern of the Incarnate, whose door opens only at dawn and dusk
limit: 'on any other hand it kills at once: no roll, no defense. The cavern holds the ghosts of those
  who were nearly right. Wear it and live, and the Temple names you heretic and hunts you, until a god
  changes his mind.'
source: the-reliquary/armor-raiment-and-rings#moon-and-star
body: 'One-Clan-Under-Moon-and-Star: the ring of Indoril Nerevar, Dwemer-made and blessed by Azura. It
  kills anyone who puts it on except Nerevar, which made it proof nobody could argue with. With it he
  made one people of the warring Chimer clans. On the right hand it does so again: every Dunmer hears
  its wearer out, and uniting the Great Houses and the Ashlander tribes is a ritual-level deed in reach.'
---
id: gray-cowl-of-nocturnal
type: arcana
name: Gray Cowl of Nocturnal
tier: mythic
hall: Armor, Raiment & Rings
touchstones: ['"Shadow hide you"', the Gray Fox, a name nobody can hold]
limit: 'it strikes you out as well. Each session you wear it, a bond, deed, or record of you goes blank:
  family and friends cannot hold on to your name. Guards strike on sight, and no shrine of the Nine blesses
  a masked face. Breaking the curse took an Elder Scroll and rewrote history (3E 433). Since then it only
  hides a face.'
source: the-reliquary/armor-raiment-and-rings#gray-cowl-of-nocturnal
body: 'A dark leather cowl that Emer Dareloth, master of the Thieves Guild, stole from Nocturnal. Her
  curse came with it: its wearer is "struck from all records and histories", known by the cowl and only
  by the cowl. In it you are the Gray Fox, three centuries of legend, crimes, and bounty under one hood.
  Out of it, nobody can connect you to him, even having watched. Nothing done in the Cowl is ever laid
  at your door.'
---
id: konahrik
type: arcana
name: Konahrik
tier: mythic
hall: Armor, Raiment & Rings
touchstones: [the mask behind the eight, gold among iron, a sanctuary out of time]
needs:
- the eight masks, each taken from its priest
- the Wooden Mask, worn in the round ruin at Labyrinthian, to stand in the sanctuary as it was
limit: it answers only at death's door, and the GM takes suspense each time. Nahkriin's mask is at 
  Skuldafn, reached on a dragon's back or not at all. Nobody knows whose face it was made for.
source: the-reliquary/armor-raiment-and-rings#konahrik
body: "\"Warlord\" in the dragon tongue: a gold mask no priest wore, sealed in the shrine at Bromjunaar
  until the masks of Skyrim's eight high priests were set before it. Bromjunaar is Labyrinthian now, and
  rubble. The mask is still inside, some thousands of years ago. When its wearer would be dropped, it
  refuses: they stand, healed, in a burst of fire, and sometimes a dragon priest steps out of the air
  beside them."
