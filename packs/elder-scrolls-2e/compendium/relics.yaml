# Relics (wardens-guide/relics). `charges` holds the book's charges or uses: a Relic with uses has
# no `recharge` and is gone once spent. Four are Daedric Artifacts.
id: "oghma-infinium"
type: "relic"
name: "Oghma Infinium"
category: "Daedric Artifact"
size: "bulky"
charges: 1
effect: "A Daedric Artifact of Hermaeus Mora. A heavy black tome bound in skin, its pages crawling with shifting script. Read it once, in a safe and quiet place, and choose a Path: Might, Shadow, or Magic. Raise your STR (Might), DEX (Shadow), or WIL (Magic) by 1d4, to a maximum of 18. The book vanishes the instant the knowledge is taken, back to Apocrypha. No one reads it twice — and the Prince of Knowledge now knows the reader, and will one day ask for something in return."
note: "1 use: gone once spent"
source: "wardens-guide/relics#oghma-infinium-1-use-bulky"
---
id: "skeleton-key"
type: "relic"
name: "Skeleton Key"
category: "Daedric Artifact"
size: "petty"
effect: "A Daedric Artifact of Nocturnal. A slim black lockpick that never bends and never breaks. Any mundane lock it is set to opens with no save and no risk, given a few moments' work. It cannot turn enchanted seals, Nordic puzzle-doors, or anything that needs a true key. Luck itself seems to lean the bearer's way. Nocturnal, however, wants it back in the Twilight Sepulcher — and the Thieves Guild's fortune wanes for as long as it is kept from her."
source: "wardens-guide/relics#skeleton-key-petty"
---
id: "azuras-star"
type: "relic"
name: "Azura's Star"
category: "Daedric Artifact"
size: "petty"
effect: "A Daedric Artifact of Azura. A weightless, faceted star that serves as an endlessly reusable grand soul gem. It captures and holds white souls (beasts and lesser creatures). Spending the soul to recharge a relic or power an enchantment consumes only the soul, never the Star. Used in place of a soul gem, it satisfies any \"Recharge: a filled soul gem\" condition, then waits empty to be filled again."
source: "wardens-guide/relics#azuras-star-petty"
---
id: "the-black-star"
type: "relic"
name: "The Black Star"
category: "Daedric Artifact"
size: "petty"
effect: "A Daedric Artifact of Azura, corrupted. Azura's Star as it is left when a necromancer's soul is purged from within it and the gem is turned to darker use. The same reusable grand soul gem, stained so that it takes black souls — the souls of the sapient — as readily as white ones. Used in place of a soul gem (white or black), it satisfies any \"Recharge: a filled soul gem\" condition, then empties to be filled again. Trapping a person's soul in it is a black and taboo act. Azura's Star and the Black Star are one artifact; only one exists in any world."
source: "wardens-guide/relics#the-black-star-petty"
---
id: "gauldur-amulet-health-fragment"
type: "relic"
name: "Gauldur Amulet, Health Fragment"
category: "Amulet"
size: "petty"
effect: "An ancient Nord amulet, one of the three shards the Gauldursons stole when they murdered their father, the Arch-Mage Gauldur. This one was buried with Mikrul in Folgunthur. While worn, it grants +1 max HP. It hums faintly when carried near its sibling fragments, straining to be made whole again."
source: "wardens-guide/relics#gauldur-amulet-health-fragment-petty"
---
id: "gauldur-amulet-magicka-fragment"
type: "relic"
name: "Gauldur Amulet, Magicka Fragment"
category: "Amulet"
size: "petty"
charges: 1
effect: "The second shard, taken from Jyrik Gauldurson beneath Saarthal. Spend the charge to re-roll a failed WIL save made to cast a spell."
recharge: "sleep a night with the shard beneath your pillow, and dream of three brothers quarrelling in the dark."
source: "wardens-guide/relics#gauldur-amulet-magicka-fragment-petty-1-charge"
---
id: "gauldur-amulet-stamina-fragment"
type: "relic"
name: "Gauldur Amulet, Stamina Fragment"
category: "Amulet"
size: "petty"
charges: 1
effect: "The third shard, drawn from Sigdis Gauldurson in Geirmund's Hall. Spend the charge to re-roll a failed STR save."
recharge: "sleep a night with the shard beneath your pillow, and dream of three brothers quarrelling in the dark."
source: "wardens-guide/relics#gauldur-amulet-stamina-fragment-petty-1-charge"
---
id: "the-gauldur-amulet"
type: "relic"
name: "The Gauldur Amulet"
category: "Greater Relic"
size: "petty"
charges: 2
effect: "The reforged whole, the masterwork of the Arch-Mage Gauldur, remade at Reachwater Rock where his sons' ghosts were at last put down. While worn, it grants +1 max HP, and you may spend a charge to re-roll a failed STR or WIL save."
recharge: "the next dawn. Once reunited, the shards can never be broken apart again."
source: "wardens-guide/relics#the-gauldur-amulet-petty-2-charges"
---
id: "the-white-phial"
type: "relic"
name: "The White Phial"
category: "Greater Relic"
size: "petty"
charges: 1
effect: "The legendary phial of Curalmil, crafted \"in the days when Skyrim was just starting its turn to ice\" and buried with its maker in Forsaken Cave. The old alchemist Nurelion of Windhelm spent his life seeking it; his apprentice Quintus Navale mended it at last with unmelting snow from the Throat of the World. Drink its draught for one of: restore 1d6 STR; automatically pass your next save against poison or disease; or need not save against the next fire, frost, or shock that strikes you."
recharge: "set the empty phial down undisturbed for a full day and night; its draught wells up again of its own accord."
source: "wardens-guide/relics#the-white-phial-petty-1-charge"
---
id: "saarthal-amulet"
type: "relic"
name: "Saarthal Amulet"
category: "Amulet"
size: "petty"
effect: "The ancient amulet unearthed by the College of Winterhold's excavation of Saarthal, which rang in resonance with the buried Eye of Magnus. While worn, you sense strong magic nearby — a Relic, a ward, a sleeping enchantment, a spell being woven — within a room or two, and know roughly where it lies. Held to the wall where it was found, it answers a single spell and shatters the stone: a key as much as a charm."
source: "wardens-guide/relics#saarthal-amulet-petty"
---
id: "savos-arens-amulet"
type: "relic"
name: "Savos Aren's Amulet"
category: "Amulet"
size: "petty"
effect: "The silver-and-sapphire amulet of Savos Aren, Arch-Mage of Winterhold, taken from his body after Ancano turned the Eye of Magnus against the College. While worn, casting a spell outside combat never calls for a WIL save, however dire your circumstances. He was never seen to take it off. Perhaps he knew what such certainty costs."
source: "wardens-guide/relics#savos-arens-amulet-petty"
---
id: "necromancers-amulet"
type: "relic"
name: "Necromancer's Amulet"
category: "Amulet"
size: "petty"
effect: "The jade-skulled amulet made by Mannimarco, the King of Worms, which has passed through a lich's hoard, the Underking's hands, and the Arcane University's vaults — and was lately found in Windhelm in the house of Calixto Corrium, the Butcher. While worn, conjuring or raising a servant never calls for a WIL save, and your raised dead gain +1 Armor. The price: while you wear it, a short rest never restores your HP — only a full night's sleep does. It tends to fade from one place and turn up far away."
source: "wardens-guide/relics#necromancers-amulet-petty"
---
id: "bloodworm-helm"
type: "relic"
name: "Bloodworm Helm"
category: "Staff or oddment"
armor: 1
charges: 1
effect: "Mannimarco's necromantic crown, worked from trollbone and ringed with a circlet of pale grubs. It is a helmet (+1 Armor, to the cap of 3). Spend the charge to raise a skeleton from any bones nearby to serve you for the scene (3 HP, 1 Armor, rusted sword d6)."
recharge: "a night spent sleeping in a tomb with the helm on. The worms are said to feed on the wearer's vitality as readily as on the grave's."
source: "wardens-guide/relics#bloodworm-helm-1-armor-1-charge"
---
id: "amulet-of-mara"
type: "relic"
name: "Amulet of Mara"
category: "Amulet"
size: "petty"
effect: "A teardrop pendant of the Divine of love and compassion, sold at her temple in Riften and worn by those open to marriage. While worn, when you seek goodwill, comfort, or courtship, a stranger's Reaction toward you shifts one step better. To wear it openly is to announce that one is unwed and willing. A healer's amulet consecrated at Mara's altar does more: once per day, its wearer may re-roll a failed WIL save made while casting a Restoration spell."
source: "wardens-guide/relics#amulet-of-mara-petty"
---
id: "amulet-of-articulation"
type: "relic"
name: "Amulet of Articulation"
category: "Amulet"
size: "petty"
charges: 1
effect: "The Guild Master's amulet of the Thieves Guild, given by Brynjolf to the one who restores the Guild's fortunes. Its hidden ward counts as a worn helmet (+1 Armor). Spend the charge to automatically pass one WIL save made to persuade, haggle, or intimidate."
recharge: "close a profitable deal, fair or crooked."
source: "wardens-guide/relics#amulet-of-articulation-petty-1-charge"
---
id: "the-bond-of-matrimony"
type: "relic"
name: "The Bond of Matrimony"
category: "Ring"
size: "petty"
effect: "A plain gold wedding band, given by the priest Maramal at the Temple of Mara in Riften to each of a newly married pair. While you and your spouse both wear your bands, you always know whether the other still lives, and roughly in which direction they lie. It cannot be sold or pawned; it carries Mara's small, steady blessing on a shared life."
source: "wardens-guide/relics#the-bond-of-matrimony-petty"
---
id: "charmed-necklace"
type: "relic"
name: "Charmed Necklace"
category: "Amulet"
size: "petty"
effect: "A gold necklace given by a wandering reveler to a traveler who shared a second bottle of Honningbrew Mead with him on the road. It is charmed to ease a heavy load: while worn, one bulky item you carry takes only one slot. Its giver swore it was a fair trade for the mead."
source: "wardens-guide/relics#charmed-necklace-petty"
---
id: "locket-of-saint-jiub"
type: "relic"
name: "Locket of Saint Jiub"
category: "Amulet"
size: "petty"
effect: "The amulet of Saint Jiub, the man who drove the cliff racers out of Morrowind, given for gathering the lost pages of his opus in the Soul Cairn. Almost alone among amulets it is armored: its ward counts as a worn helmet (+1 Armor). Light, fine, and quietly holy. Cliff racers, where any are left, will not come near it."
source: "wardens-guide/relics#locket-of-saint-jiub-petty"
---
id: "muiris-ring"
type: "relic"
name: "Muiri's Ring"
category: "Ring"
size: "petty"
effect: "A simple silver ring, the payment that Muiri, the apprentice at the Hag's Cure in Markarth, gives for her vengeance on the Shatter-Shields and on the man who broke her heart. While worn, the poisons you brew are lingering (see Hazards → Poison & Venom): a victim who fails the first save saves again at the start of each of its next three turns, losing 1 more STR on each failure. A small token of a small, bitter vengeance."
source: "wardens-guide/relics#muiris-ring-petty"
---
id: "ring-of-the-erudite"
type: "relic"
name: "Ring of the Erudite"
category: "Ring"
size: "petty"
charges: 1
effect: "A ring of three bone bands set with green jewels, the scholar's reward of the Volkihar rite of the Rings of Blood Magic. Spend the charge to channel a Spell Tome without adding Fatigue."
recharge: "feed on a sleeping victim. Made for the vampire who would rather scheme than rend."
source: "wardens-guide/relics#ring-of-the-erudite-petty-1-charge"
---
id: "ring-of-the-beast"
type: "relic"
name: "Ring of the Beast"
category: "Ring"
size: "petty"
effect: "A ring of three bone bands set with orange jewels, the warrior's reward of the Rings of Blood Magic. While worn, it grants +1 max HP, and your unarmed attacks deal d6 instead of d4. Forged for the vampire who trusts tooth and claw over any blade."
source: "wardens-guide/relics#ring-of-the-beast-petty"
---
id: "ring-of-bloodlust"
type: "relic"
name: "Ring of Bloodlust"
category: "Ring"
size: "petty"
effect: "A silver ring sold by the werewolf Majni of the Frostmoon pack. While you are in Beast Form, your attacks are Enhanced — and so is every attack made against you. A bargain for the beast that means to die killing."
source: "wardens-guide/relics#ring-of-bloodlust-petty"
---
id: "ring-of-the-hunt"
type: "relic"
name: "Ring of the Hunt"
category: "Ring"
size: "petty"
effect: "A silver ruby ring of the Frostmoon pack, sold by Majni to fellow werewolves. While you are in Beast Form, a short rest restores your HP as it would in mortal shape — a mercy beasts are normally denied. Useless to those who never run on four legs; priceless to those who do."
source: "wardens-guide/relics#ring-of-the-hunt-petty"
---
id: "ring-of-the-moon"
type: "relic"
name: "Ring of the Moon"
category: "Ring"
size: "petty"
effect: "A silver garnet ring of the Frostmoon pack, sold by Majni. While you are in Beast Form, those who fail the WIL save against your howl or roar flee for two rounds instead of one. The pack prizes it; to the unchanged it is only a pretty ring."
source: "wardens-guide/relics#ring-of-the-moon-petty"
---
id: "ahzidals-ring-of-arcana"
type: "relic"
name: "Ahzidal's Ring of Arcana"
category: "Ring"
size: "petty"
effect: "A gold diamond ring from the relics of Ahzidal, the Dragon Priest enchanter, recovered from Kolbjorn Barrow on Solstheim. While worn, a failed WIL save when casting a Destruction spell under duress costs you only an extra Fatigue — never the tome, never your flesh. One of Ahzidal's lost works; wearing too many of them together is said to draw his notice from beyond the grave."
source: "wardens-guide/relics#ahzidals-ring-of-arcana-petty"
---
id: "ahzidals-ring-of-necromancy"
type: "relic"
name: "Ahzidal's Ring of Necromancy"
category: "Ring"
size: "petty"
effect: "A gold sapphire ring from Ahzidal's hoard at Kolbjorn Barrow. When a creature you have raised from the dead is destroyed, it bursts in a blast of grave-frost (d6, blast) against everything beside it. A grave-robber's cruel flourish, leaving nothing whole behind."
source: "wardens-guide/relics#ahzidals-ring-of-necromancy-petty"
---
id: "aetherial-staff"
type: "relic"
name: "Aetherial Staff"
category: "Staff or oddment"
damage: "d6"
charges: 3
effect: "A Dwemer staff crowned with glowing aqua Aetherium, forged at the Aetherium Forge beneath the Ruins of Bthalft in the Rift. Spend a charge to summon a Dwarven Spider — or, if the Die of Fate comes up 4 or more, a Dwarven Sphere (see the Bestiary) — to fight at your side until destroyed or the scene ends."
recharge: "a filled soul gem, set into the staff's housing."
source: "wardens-guide/relics#aetherial-staff-d6-3-charges"
---
id: "staff-of-magnus"
type: "relic"
name: "Staff of Magnus"
category: "Greater Relic"
damage: "d6"
charges: 3
effect: "The staff of the god-mage Magnus, taken from the Dragon Priest Morokei in the depths of Labyrinthian. Spend a charge to loose a long beam that drains one creature within sight: it takes d8, ignoring Armor, and cannot cast spells for the rest of the scene. Against a creature made of magic — an atronach, a spirit, a Dragon Priest — the beam is Enhanced."
recharge: "a filled grand soul gem. The staff is famously thirsty, and nothing less will do."
source: "wardens-guide/relics#staff-of-magnus-d6-3-charges"
---
id: "eye-of-melka"
type: "relic"
name: "Eye of Melka"
category: "Staff or oddment"
damage: "d6"
charges: 3
effect: "A crude fire-staff, the gift of the hagraven Melka of Blind Cliff Cave to the one who rid her of her treacherous sister Petra. Spend a charge to hurl a bursting bolt of flame (d8, blast)."
recharge: "a filled soul gem, or a night spent in a hagraven's roost while the staff drinks the smoke of her fire."
source: "wardens-guide/relics#eye-of-melka-d6-3-charges"
---
id: "spider-control-rod"
type: "relic"
name: "Spider Control Rod"
category: "Staff or oddment"
size: "petty"
charges: 1
effect: "A small Dwemer control rod devised in Markarth by the scholar Calcelmo and his nephew Aicantar to master the mechanical spiders of his museum. Point it at a single Dwarven automaton and spend the charge: it obeys your commands for the rest of the scene, turning on its former masters."
recharge: "leave the rod overnight among working Dwemer mechanisms, letting it relearn their tongue."
source: "wardens-guide/relics#spider-control-rod-petty-1-charge"
---
id: "helm-of-yngol"
type: "relic"
name: "Helm of Yngol"
category: "Staff or oddment"
armor: 1
effect: "The frost-rimed helm of Yngol, son of Ysgramor, drowned in a storm at sea and laid to rest in his barrow on the Winterhold coast. It is a helmet (+1 Armor, to the cap of 3), and while you wear it you need not save against cold or frost, and cold never leaves you Deprived. A relic of the first Nords, when the Five Hundred Companions broke the ice of Skyrim itself."
source: "wardens-guide/relics#helm-of-yngol-1-armor"
---
id: "diadem-of-the-savant"
type: "relic"
name: "Diadem of the Savant"
category: "Staff or oddment"
size: "petty"
charges: 1
effect: "A fine circlet waiting at the heart of Shalidor's Maze in Labyrinthian, made by the archmage who shaped that labyrinth of stone. Spend the charge to re-roll a failed WIL save made to cast a spell."
recharge: "solve a riddle, cipher, or puzzle-lock you have never seen before. Shalidor's work rewards only a working mind."
source: "wardens-guide/relics#diadem-of-the-savant-petty-1-charge"
---
id: "bone-hawk-ring"
type: "relic"
name: "Bone Hawk Ring"
category: "Ring"
size: "petty"
charges: 1
effect: "A ring fashioned at a forge from the claws of the bone hawks that wheel above Castle Volkihar. Spend the charge to make one attack with a one-handed weapon Enhanced — a hawk's stoop, sudden and certain."
recharge: "a drop of your own blood on the bone at dusk. A grim little ornament of the vampire court, fit for one who has made peace with the grave."
source: "wardens-guide/relics#bone-hawk-ring-petty-1-charge"
---
id: "model-ship"
type: "relic"
name: "Model Ship"
category: "Staff or oddment"
effect: "An exquisite model galleon on a trapped pedestal in Snow Veil Sanctum, one of the treasures of the Litany of Larceny that Delvin Mallory of the Thieves Guild longs to own. It bears no enchantment — but it is worth a small fortune to the right buyer, and putting it in Delvin's hands is a deed worth a step of Thieves Guild reputation. Lifting it from its plinth without springing the surrounding oil-fire is a thief's whole art in miniature."
source: "wardens-guide/relics#model-ship"
---
id: "the-jagged-crown"
type: "relic"
name: "The Jagged Crown"
category: "Greater Relic"
effect: "The fanged bone crown of the ancient High Kings of Skyrim, last worn by King Borgas and entombed in the barrow of Korvanjund. It carries no enchantment — but it is the very symbol of the High King's right, sought by Stormcloak and Legion alike. Whoever is seen to wear it shifts one step better on the Reaction ladder with Nords who honor the old crown, and one step worse with those who serve the other side. \"Maw unleashing razor snow, / Of dragons from the blue brought down, / Births the walking winter's woe, / The High King in his Jagged Crown.\" To take it is to take a side."
source: "wardens-guide/relics#the-jagged-crown"
