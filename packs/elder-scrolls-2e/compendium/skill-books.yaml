source: "wardens-guide/skill-books#purloined-shadows"
---
id: "advances-in-lockpicking"
type: "skill-book"
name: "Advances in Lockpicking"
perk: "Given a quiet minute, you need not save to pick an ordinary lock."
skill: "Lockpicking"
series: "Shadow"
description: "A locksmith's monograph on the newest warded mechanisms — and, between the lines, on exactly how to defeat them."
source: "wardens-guide/skill-books#advances-in-lockpicking"
---
id: "proper-lock-design"
type: "skill-book"
name: "Proper Lock Design"
perk: "Once per day, re-roll a failed save made to pick a lock or disarm a trap."
skill: "Lockpicking"
series: "Shadow"
description: "An engineer's earnest manual on building a lock that cannot be picked, read most attentively by the people it was meant to stop."
source: "wardens-guide/skill-books#proper-lock-design"
---
id: "the-locked-room"
type: "skill-book"
name: "The Locked Room"
perk: "Given time and safety, you can pick even masterwork and Dwemer locks that would otherwise need their key or a spell."
skill: "Lockpicking"
series: "Shadow"
rare: true
description: "Yana, a \"professional amateur,\" studies locks under the impatient master Arthcamu, who despises her slowness — until the day her patience opens what his speed cannot."
source: "wardens-guide/skill-books#the-locked-room"
---
id: "the-buying-game"
type: "skill-book"
name: "The Buying Game"
perk: "Merchants treat you one step better on the Reaction ladder."
skill: "Speech"
