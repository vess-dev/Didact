# Skill Books (wardens-guide/skill-books): each grants one small, permanent perk to the first
# character who reads it (`didact do read-book`); series and rarity from the roll tables.
id: "mace-etiquette"
type: "skill-book"
name: "Mace Etiquette"
perk: "Once per combat, one of your attacks with a mace or club is Enhanced."
skill: "One-Handed"
series: "Steel"
description: "A veteran instructor's argument that the mace is a weapon of timing and momentum, not brute force: lead with the elbow, loosen the wrist at impact, and let the recoil set up the second blow."
source: "wardens-guide/skill-books#mace-etiquette"
---
id: "fire-and-darkness"
type: "skill-book"
name: "Fire and Darkness"
perk: "When you strike before your foe has acted in a combat, your first attack with a dagger or sword is Enhanced."
skill: "One-Handed"
series: "Steel"
description: "Ynir Gorming's history of Tamriel's brotherhoods of death — the Morag Tong and the Dark Brotherhood — prized by duelists for the cold economy of its killing strokes."
source: "wardens-guide/skill-books#fire-and-darkness"
---
id: "the-importance-of-where"
type: "skill-book"
name: "The Importance of Where"
perk: "Your attacks with a mace, club, or war hammer ignore 1 Armor."
skill: "One-Handed"
series: "Steel"
description: "A parable of Othrobar, whose chieftain's flock was butchered every night, and of Fangbith the Warleader, who took up the Cudgel of Zolia and learned from his old mentor that where a blow lands matters more than how hard."
source: "wardens-guide/skill-books#the-importance-of-where"
---
id: "night-falls-on-sentinel"
type: "skill-book"
name: "Night Falls on Sentinel"
perk: "When you attack a foe who believed you unarmed or friendly — at a parley, from a disguise, across a tavern table — the attack is Enhanced."
skill: "One-Handed"
series: "Steel"
description: "A tale of Sentinel's nameless cellar-tavern, where a young woman in a black velvet cape comes looking for an old conspirator — and shows him, at last, whose crest she wears beneath it."
source: "wardens-guide/skill-books#night-falls-on-sentinel"
---
id: "battle-of-sancre-tor"
type: "skill-book"
name: "Battle of Sancre Tor"
perk: "Once per combat, when you swing a greatsword or battleaxe at a foe who has not yet acted this combat, the attack is Enhanced."
skill: "Two-Handed"
series: "Steel"
description: "How young General Talos stormed the \"impregnable\" mountain citadel of Sancre Tor in the dead of winter, against a Nord and Breton host that laughed to see him come — the victory that made him Tiber Septim."
source: "wardens-guide/skill-books#battle-of-sancre-tor"
---
id: "song-of-hrormir"
type: "skill-book"
name: "Song of Hrormir"
perk: "Once per day, if you have downed a horn of mead or ale within the past hour, your first attack with a two-handed weapon in a combat is Enhanced."
skill: "Two-Handed"
series: "Steel"
description: "A long and bawdy Nord epic of Hrormir, son of Hrorgar, who was summoned to take up his fallen companion's sword against a hag-queen's kingdom — and would much rather have finished his twelve flagons of mead first."
source: "wardens-guide/skill-books#song-of-hrormir"
---
id: "words-and-philosophy"
type: "skill-book"
name: "Words and Philosophy"
perk: "Once per combat, when you close to melee with a foe who was attacking you from range — an archer, a caster — your first two-handed attack against it is Enhanced."
skill: "Two-Handed"
series: "Steel"
description: "Interviews with Lady Allena Benoch, Bosmer master-at-arms of the Emperor's guard, on the lost art of the thinking swordsman. Her advice to the young, delivered while tossing petals into a pool: \"Close the distance and hit 'im hard.\""
source: "wardens-guide/skill-books#words-and-philosophy"
---
id: "king"
type: "skill-book"
name: "King"
perk: "Your attacks with a two-handed weapon against a detachment are not Impaired; each great sweep carves into the crowd."
skill: "Two-Handed"
series: "Steel"
description: "The fourth and final volume of the fable of Eslaf Erol — beggar, thief, warrior (of sorts), and at last king of Erolgard — whose names, like his fortunes, read better backward."
source: "wardens-guide/skill-books#king"
---
id: "the-marksmanship-lesson"
type: "skill-book"
name: "The Marksmanship Lesson"
perk: "Once per combat, one of your attacks with a bow or crossbow is Enhanced."
skill: "Archery"
series: "Steel"
description: "The story of Dob, a slave boy on a cruel master's plantation, taught to shoot in secret by a passing highwayman — and the single arrow, loosed high over the target, with which the lesson was returned."
source: "wardens-guide/skill-books#the-marksmanship-lesson"
---
id: "the-black-arrow"
type: "skill-book"
name: "The Black Arrow"
perk: "Your attacks with a bow or crossbow are never Impaired by long range."
skill: "Archery"
series: "Steel"
description: "A former servant's memoir of the Duchess of Woda, who died with an arrow in her heart: loosed from a tree across the road, through the gate, across the lawn and the moat, and through a keyhole. An impossible shot — unless you knew the archer."
source: "wardens-guide/skill-books#the-black-arrow"
---
id: "vernaccus-and-bourlor"
type: "skill-book"
name: "Vernaccus and Bourlor"
perk: "Your arrows and crossbow bolts strike ghosts, Daedra, and other creatures that shrug off mundane weapons at full force."
skill: "Archery"
series: "Steel"
description: "Hallgerd's tavern tale of Bourlor the Great Archer, who spent his life hunting the Daedra Vernaccus and died believing he had missed — though his last arrow, lodged in a temple door, found its mark after all."
source: "wardens-guide/skill-books#vernaccus-and-bourlor"
---
id: "the-gold-ribbon-of-merit"
type: "skill-book"
name: "The Gold Ribbon of Merit"
perk: "You need not save to make a trick shot a skilled archer could plausibly make — cutting a rope, pinning a sleeve to a door, snuffing a candle, striking a lever."
skill: "Archery"
series: "Steel"
description: "Two boyhood friends, Templer and Stryngpool, meet in a High Rock grove to shoot for old times' sake. The proud one gives the other a lesson in aim; the wild shot he corrects ends up where neither of them expected."
source: "wardens-guide/skill-books#the-gold-ribbon-of-merit"
---
id: "death-blow-of-abernanit"
type: "skill-book"
name: "Death Blow of Abernanit"
perk: "Once per day, while you hold a shield, when an attack would reduce you to 0 HP, make a DEX save; on a success you take the blow on the shield and suffer no damage from it."
skill: "Block"
series: "Steel"
description: "A verse epic of Rangidil, champion of the Temple, who faced Dagoth Thras, the greatest shield-master in Morrowind, at the fortress of Abernanit — and beat him with a single question he could not answer."
source: "wardens-guide/skill-books#death-blow-of-abernanit"
---
id: "the-mirror"
type: "skill-book"
name: "The Mirror"
perk: "While you hold a shield, once per combat re-roll a failed save made to weather a blow, brace against a charge, or hold your ground."
skill: "Block"
series: "Steel"
description: "A tale of Mindothrax, a sellsword who in thirty-four years had never once lost in combat, because he trusted his shield before his blade — and of Jurrifax, the stranger who fought like his own reflection and met him at last across the battle-line."
source: "wardens-guide/skill-books#the-mirror"
---
id: "battle-of-red-mountain"
type: "skill-book"
name: "Battle of Red Mountain"
perk: "While you hold a shield and stand shoulder to shoulder with an ally, attacks against you by a detachment are not Enhanced."
skill: "Block"
series: "Steel"
description: "An account of the Battle of Red Mountain, where the Chimer under Nerevar, with their Nord and Orc allies, broke the Dwemer host — and the whole Dwemer race vanished from the world."
source: "wardens-guide/skill-books#battle-of-red-mountain"
---
id: "hallgerds-tale"
type: "skill-book"
name: "Hallgerd's Tale"
perk: "You move as freely in mail or plate as out of it: armor never forces a save on you that you wouldn't make unarmored, and you can don or doff a full suit in moments."
skill: "Heavy Armor"
series: "Steel"
description: "Three old soldiers argue over their cups about the greatest warrior who ever lived, until Hallgerd tells of Pasoroth, a lord who won his estate at weekly games — not by his axe, but because he moved faster in full mail than other men did out of it."
source: "wardens-guide/skill-books#hallgerds-tale"
---
id: "chimarvamidium"
type: "skill-book"
name: "Chimarvamidium"
perk: "Once per combat, while you wear mail or plate, you may turn a blow onto your armor's strongest plates: that attack against you is Impaired."
skill: "Heavy Armor"
series: "Steel"
description: "A fable of the war between Chimer and Dwemer, and of the golden golem the Dwemer warlord gave his enemy as a peace-gift — which dodged every fireball by taking the rest on its breastplate, and turned out to have the Dwemer armorer Jnaggo inside."
source: "wardens-guide/skill-books#chimarvamidium"
---
id: "the-armorers-challenge"
type: "skill-book"
name: "The Armorer's Challenge"
perk: "You can temper a weapon a second time — one more step up its damage die, never past d12."
skill: "Smithing"
series: "Steel"
description: "Empress Katariah sets two master armorers against each other to arm the legions for a war in Black Marsh; the commission goes to the smith who studied the enemy's tactics before he ever lifted a hammer."
source: "wardens-guide/skill-books#the-armorers-challenge"
---
id: "cherims-heart-of-anequina"
type: "skill-book"
name: "Cherim's Heart of Anequina"
perk: "You can mend any broken weapon or armor with whatever metal and leather are at hand, without a forge and without the piece's own material."
skill: "Smithing"
series: "Steel"
description: "An interview with Cherim, the Khajiit master whose tapestries hang in the Emperor's own halls. Nothing in it is about metal, and every word of it is about craft."
source: "wardens-guide/skill-books#cherims-heart-of-anequina"
---
id: "last-scabbard-of-akrash"
type: "skill-book"
name: "Last Scabbard of Akrash"
perk: "Your work at the forge never goes wrong: a rushed or improvised tempering or repair never calls for a save."
skill: "Smithing"
series: "Steel"
description: "A murder mystery out of Tear: a veiled young woman visits an old armorer every afternoon for weeks, a slaver's secret life ends in blood, and the armorer alone understands what the scabbard he made was for."
source: "wardens-guide/skill-books#last-scabbard-of-akrash"
---
id: "reality-and-other-falsehoods"
type: "skill-book"
name: "Reality & Other Falsehoods"
perk: "Once per day, cast an Alteration spell so subtly that no one watching can tell you cast anything at all — no light, no sound, no telltale gesture."
skill: "Alteration"
series: "The Arcane"
description: "A lecture on the school's first principle: that reality is a falsehood impressed on us by greater forces, and that the Alteration mage succeeds by convincing those forces a small change is easier than none."
source: "wardens-guide/skill-books#reality--other-falsehoods"
---
id: "daughter-of-the-niben"
type: "skill-book"
name: "Daughter of the Niben"
perk: "Once per day, when the Warden rolls the Die of Fate for your own luck and it goes against you, it is rolled again."
skill: "Alteration"
series: "The Arcane"
description: "A traveler's history of Bravil — its Ayleid siege, the centurion Bravilius who took it, and the statue of the Lucky Old Lady to whom every visitor still whispers."
source: "wardens-guide/skill-books#daughter-of-the-niben"
---
id: "breathing-water"
type: "skill-book"
name: "Breathing Water"
perk: "You always feel a spell upon you begin to fade before it ends, and you can hold your breath for six rounds before drowning sets in, not three."
skill: "Alteration"
series: "The Arcane"
description: "A smuggler, once Tollman of the Vivec wharves, hires the sorceress Seryne Relas to let him breathe underwater so he can loot a sunken wreck. He is found drowned a few days later with two potions of water breathing in his hands."
source: "wardens-guide/skill-books#breathing-water"
---
id: "the-lunar-lorkhan"
type: "skill-book"
name: "The Lunar Lorkhan"
perk: "You always know the hour of the night and the phases of Masser and Secunda, and you never lose your way under an open night sky."
skill: "Alteration"
series: "The Arcane"
description: "A heretical treatise holding that the two moons are the halves of Lorkhan's torn flesh-divinity, still circling the world he made."
source: "wardens-guide/skill-books#the-lunar-lorkhan"
---
id: "the-doors-of-oblivion"
type: "skill-book"
name: "The Doors of Oblivion"
perk: "Once per day, channel a Conjuration tome without adding Fatigue."
skill: "Conjuration"
series: "The Arcane"
description: "Seif-ij Hidja's account of his master, Morian Zenas, author of the classic \"On Oblivion\" — who walked the realms of the Princes to learn their truths firsthand, and whose whispers still reach his apprentice, fainter each year, from somewhere in Apocrypha."
source: "wardens-guide/skill-books#the-doors-of-oblivion"
---
id: "liminal-bridges"
type: "skill-book"
name: "Liminal Bridges"
perk: "Once per day, a servant you have summoned lingers past the end of its scene, until the next dawn."
skill: "Conjuration"
series: "The Arcane"
description: "A dense, jargon-choked treatise on how the Daedra cross the liminal barrier: sigil stones, gates, the conjurational charter, and why no portal stays open for long."
source: "wardens-guide/skill-books#liminal-bridges"
---
id: "a-hypothetical-treachery"
type: "skill-book"
name: "A Hypothetical Treachery"
perk: "Once per day, one Destruction spell you cast is Enhanced."
skill: "Destruction"
series: "The Arcane"
rare: true
description: "A one-act comedy: four delvers — two battlemages, a healer, and an Argonian barbarian — escape a Valenwood dungeon with one chest of loot, no magicka left between them, and no trust at all."
source: "wardens-guide/skill-books#a-hypothetical-treachery"
---
id: "response-to-beros-speech"
type: "skill-book"
name: "Response to Bero's Speech"
perk: "When you cast a Destruction spell with a blast, you may spare anyone you choose within its reach."
skill: "Destruction"
series: "The Arcane"
description: "A battlemage's scornful rebuttal to the Illusionist Berevar Bero, who dared to claim in print that Destruction was only the other schools in disguise."
source: "wardens-guide/skill-books#response-to-beros-speech"
---
id: "mystery-of-talara"
type: "skill-book"
name: "Mystery of Talara"
perk: "Once per day, re-roll a failed WIL save made to cast a spell under duress."
skill: "Destruction"
series: "The Arcane"
description: "The third volume of the romance of Talara, a lost princess of Camlorn who wakes half-drowned beneath the moons with no memory of who she is — beloved of College apprentices for reasons no one will admit."
source: "wardens-guide/skill-books#mystery-of-talara"
---
id: "the-art-of-war-magic"
type: "skill-book"
name: "The Art of War Magic"
perk: "Casting a Destruction spell in battle never calls for the WIL save against duress; you are trained to the noise."
skill: "Destruction"
series: "The Arcane"
description: "Zurin Arctus, Imperial Battlemage to Tiber Septim, on dispositions, timing, and the moment the enemy becomes vulnerable to attack."
source: "wardens-guide/skill-books#the-art-of-war-magic"
---
id: "enchanters-primer"
type: "skill-book"
name: "Enchanter's Primer"
perk: "A Relic you enchant holds one more charge than its soul would give."
skill: "Enchanting"
series: "The Arcane"
description: "A patient beginner's guide to the arcane enchanter — start small, it counsels, and never bind what you do not understand."
source: "wardens-guide/skill-books#enchanters-primer"
---
id: "twin-secrets"
type: "skill-book"
name: "Twin Secrets"
perk: "You can bind a second enchantment into an item that already holds one — never more than two."
skill: "Enchanting"
series: "The Arcane"
description: "The deathbed confession of a master enchanter who defied the Law of Firsts: a dragon taught him that mortals, having two hands, two eyes, and two ears, can weave two enchantments at once. He made one sword of fire and fear, and it killed him to do it."
source: "wardens-guide/skill-books#twin-secrets"
---
id: "catalogue-of-weapon-enchantments"
type: "skill-book"
name: "Catalogue of Weapon Enchantments"
perk: "You know at a glance what enchantment a weapon carries and how many charges it holds."
skill: "Enchanting"
series: "The Arcane"
description: "A Synod scholar's exhaustive index of every binding ever struck into steel, dry as dust and twice as useful."
source: "wardens-guide/skill-books#catalogue-of-weapon-enchantments"
---
id: "catalogue-of-armor-enchantments"
type: "skill-book"
name: "Catalogue of Armor Enchantments"
perk: "A worn enchantment you bind can be made constant with a common soul, not only a greater one."
skill: "Enchanting"
series: "The Arcane"
description: "A mage's survey of every known enchantment for armor and garb, which cheerfully admits it will be out of date by the time the ink is dry."
source: "wardens-guide/skill-books#catalogue-of-armor-enchantments"
---
id: "incident-in-necrom"
type: "skill-book"
name: "Incident in Necrom"
perk: "You need not save to slip the notice of anyone who has underestimated or dismissed you."
skill: "Illusion"
series: "The Arcane"
description: "Four hirelings are paid to cleanse the haunted cemetery of Necrom. Three of them write off the meek young \"illusionist\" in their company — and later, counting the gold without her, learn that invisibility is also a spell of illusion."
source: "wardens-guide/skill-books#incident-in-necrom"
---
id: "the-black-arts-on-trial"
type: "skill-book"
name: "The Black Arts On Trial"
perk: "You know a necromancer's handiwork on sight — a raised corpse, a black soul gem, a sigil drawn in grave-dirt — and you can tell whether a living mind has been bent by magic."
skill: "Illusion"
series: "The Arcane"
description: "The Mages Guild's own history of necromancy, from the Psijics' ban to Vanus Galerion's, including the arguments of a Magister who defended the Black Arts — and turned out to be one of their servants."
source: "wardens-guide/skill-books#the-black-arts-on-trial"
---
id: "before-the-ages-of-man"
type: "skill-book"
name: "Before the Ages of Man"
perk: "You can make out the meaning of old Aldmeri script — Ayleid, Falmer, and Dwemer inscriptions — given time and a quiet place."
skill: "Illusion"
series: "The Arcane"
description: "The first volume of a scholarly timeline of Tamriel, reaching back past the chronicles into the myths of the Merethic Era, when the elves ruled and men had not yet come from Atmora."
source: "wardens-guide/skill-books#before-the-ages-of-man"
---
id: "withershins"
type: "skill-book"
name: "Withershins"
perk: "When you heal someone with a Restoration spell, a Relic, or a potion, they regain 1 extra STR."
skill: "Restoration"
series: "The Arcane"
description: "A comic tale of Zaki, a tailor who becomes convinced that every conversation he has runs in alphabetical order — and of the healer he cannot get an appointment with before Middas."
source: "wardens-guide/skill-books#withershins"
---
id: "the-exodus"
type: "skill-book"
name: "The Exodus"
perk: "Your healing magic can mend a given creature's STR twice in a day, not once."
skill: "Restoration"
series: "The Arcane"
description: "A dark tale of Vralla, a dying child the Temples and the Mages Guild have given up on, and of the kindly strange couple who promise her parents a cure."
source: "wardens-guide/skill-books#the-exodus"
---
id: "racial-phylogeny"
type: "skill-book"
name: "Racial Phylogeny"
perk: "Gain a permanent +1 to one Attribute of your choice (to a maximum of 18)."
skill: "Restoration"
series: "The Arcane"
rare: true
description: "The Council of Healers' frank treatise on the flesh of Men, Mer, and Beastfolk — what every body shares with the others, and where each is strong. A careful reader comes away knowing their own a little better."
source: "wardens-guide/skill-books#racial-phylogeny"
---
id: "sacred-witness"
type: "skill-book"
name: "Sacred Witness"
perk: "Once per day, re-roll a failed DEX save made to move unseen or to strike from the shadows."
skill: "Sneak"
series: "Shadow"
description: "A poet's account of the night he was granted an audience with the Night Mother herself — the only true witness, scholars say, to how the Dark Brotherhood moves."
source: "wardens-guide/skill-books#sacred-witness"
---
id: "three-thieves"
type: "skill-book"
name: "Three Thieves"
perk: "Your first attack from concealment in a combat ignores 1 Armor."
skill: "Sneak"
series: "Shadow"
description: "Three thieves plan to rob the Cobblers' Guildhall on the night the dues are collected, and the eldest insists on doing it with some pride and technique, the way it used to be done."
source: "wardens-guide/skill-books#three-thieves"
---
id: "legend-of-krately-house"
type: "skill-book"
name: "Legend of Krately House"
perk: "Old floors, stairs, and doors never betray you: moving through a house by night, you need not save to go unheard."
skill: "Sneak"
series: "Shadow"
description: "A play in two acts: two thieves break into the famous haunted house of the Krately family, one of them swears he refilled the lantern, and something heavy begins to climb the stairs."
source: "wardens-guide/skill-books#legend-of-krately-house"
---
id: "aevar-stone-singer"
type: "skill-book"
name: "Aevar Stone-Singer"
perk: "Gain +1 maximum HP."
skill: "Pickpocket"
series: "Shadow"
description: "A Skaal legend of the boy Aevar, who won back the All-Maker's stolen gifts from the Greedy Man — a small, true story that leaves the reader a little hardier for having heard it."
source: "wardens-guide/skill-books#aevar-stone-singer"
---
id: "beggar"
type: "skill-book"
name: "Beggar"
perk: "Beggars and street urchins count you as one of their own: in any town, a few coins buy you the local gossip and a place to hide."
skill: "Pickpocket"
series: "Shadow"
description: "The tale of Wheedle, thirteenth child of a Valenwood king, who saved a ragged beggar from three killers — and so met the Beggar Prince."
source: "wardens-guide/skill-books#beggar"
---
id: "guide-to-better-thieving"
type: "skill-book"
name: "Guide to Better Thieving"
perk: "You need not save to lift a small item from someone who is distracted."
skill: "Pickpocket"
series: "Shadow"
description: "Wulfmare's practical handbook for the aspiring light-finger — what to take, what to leave, and how to be three streets away before the missing is missed."
source: "wardens-guide/skill-books#guide-to-better-thieving"
---
id: "purloined-shadows"
type: "skill-book"
name: "Purloined Shadows"
perk: "Once per session, you may declare that you took one small, plausible object from a place you have already searched, with no roll — the Warden decides what was reasonable to find."
skill: "Pickpocket"
series: "Shadow"
rare: true
