disease: "sanguinare-vampiris"
critical: "the bite drains the target's spirit for 1d8 WIL; one brought to 0 WIL this way dies and rises as the vampire's thrall."
source: "wardens-guide/bestiary#vampire"
body: |
  A pale, charming predator that feeds on mortal blood, sleeping by day and hunting by night. Volkihar vampires raid whole villages.

  Vampires: The undead servants of Molag Bal stalk Skyrim's nights. Vampires are immune to poison and disease; fire damage against them is Enhanced, and sunlight leaves them Deprived (unable to regain HP). The Volkihar of the frozen northwest command the deadliest of their kind.
---
id: "vampire-lord"
type: "monster"
name: "Vampire Lord"
hp: 16
armor: 1
STR: 16
DEX: 13
WIL: 18
category: "Vampire"
attacks:
