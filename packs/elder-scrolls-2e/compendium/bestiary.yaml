body: |
  The common dovah — brown, bronze, or green — that began descending on Skyrim after the World-Eater's return. Breathes fire or frost.

  Dragons: Dragons are the children of Akatosh, ancient and proud, returned to the world with the World-Eater. Every dragon is a detachment: one great foe that shrugs off lone attackers (their attacks are Impaired unless they are blast) and savages whatever it strikes. All are immune to paralysis and cannot be soul-trapped; each breathes either fire or frost, and frost-breathers shrug off frost (fire-breathers, fire). A flying dragon lands to fight once it has lost half its HP — or when something forces it down.
