body: |
  A small brass arachnid, the most common Dwemer guardian, lurking in pipe-ports to ambush. Skitters and leaps. Four or more fight as a detachment.

  Dwarven Automatons: The vanished Dwemer left their ruins guarded by clockwork sentinels of brass and steam. All automatons are non-living: immune to poison, disease, paralysis, and magic that sways the mind; frost damage against them is Impaired. They cannot be raised or soul-trapped, and Detect Life and Detect Dead pass over them. Their remains yield Dwarven metal, and sometimes a soul gem that powered them.
