  Daedra & Magical: The Daedra of the planes of Oblivion come to Nirn by summoning, by a Prince's command, or through a thinning of the barrier between worlds. They are immune to disease, and a Daedra "slain" in Mundus is only banished home. A Banish or Expel spell hurls a summoned one back to Oblivion.
---
id: "lurker"
type: "monster"
name: "Lurker"
hp: 16
armor: 1
STR: 16
DEX: 8
WIL: 12
category: "Apocrypha & Ash"
attacks:
  - {name: "hand swipe", damage: "{d8, d8}kh1"}
  - {name: "tentacle spray", damage: "d8", qualities: ["blast", "ranged"]}
abilities:
  - "Frost and shock damage against it are Impaired; mundane attacks against it are Impaired. Its stomp knocks everyone near it flat unless they pass a STR save."
impaired_by:
  - "frost"
  - "mundane"
  - "shock"
critical: "a gout of acid from its maw eats through the target's armor, destroying it."
source: "wardens-guide/bestiary#lurker"
body: |
  A vast, amphibious horror that rises from the black waters of Apocrypha — towering, slow, and terrible. Fight only one at a time.

  Daedra & Magical: The Daedra of the planes of Oblivion come to Nirn by summoning, by a Prince's command, or through a thinning of the barrier between worlds. They are immune to disease, and a Daedra "slain" in Mundus is only banished home. A Banish or Expel spell hurls a summoned one back to Oblivion.
