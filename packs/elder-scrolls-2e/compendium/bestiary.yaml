  - {name: "vampiric drain", damage: "d8", qualities: ["ranged"]}
abilities:
  - "Its drain heals it for the damage dealt. It can call a Gargoyle, raise the dead, and seize a foe at range with Vampiric Grip, pulling it close unless it passes a STR save."
enhanced_by:
  - "fire"
critical: "the bite drains 1d8 WIL and leaves the target paralyzed and pliant."
source: "wardens-guide/bestiary#vampire-lord"
body: |
  A monstrous winged form granted to the pure-blooded by Molag Bal — a hovering horror of claw and blood-magic. Attacked on sight.

  Vampires: The undead servants of Molag Bal stalk Skyrim's nights. Vampires are immune to poison and disease; fire damage against them is Enhanced, and sunlight leaves them Deprived (unable to regain HP). The Volkihar of the frozen northwest command the deadliest of their kind.
