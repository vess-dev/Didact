  Daedra & Magical: The Daedra of the planes of Oblivion come to Nirn by summoning, by a Prince's command, or through a thinning of the barrier between worlds. They are immune to disease, and a Daedra "slain" in Mundus is only banished home. A Banish or Expel spell hurls a summoned one back to Oblivion.
