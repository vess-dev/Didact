# The Elder Scrolls 2e bestiary (wardens-guide/bestiary). `impaired_by` and `enhanced_by` are the
# attack kinds its entry (or its group's) says are Impaired or Enhanced against it; `disease` and
# `venom` what its blows carry. Creatures the book runs as a detachment are `type: detachment`.
id: "draugr"
type: "monster"
name: "Draugr"
hp: 6
armor: 1
STR: 12
DEX: 10
WIL: 8
category: "Draugr"
attacks:
  - {name: "ancient axe", damage: "d8"}
  - {name: "ancient bow", damage: "d6"}
abilities:
  - "Variants: the Restless Draugr is a weaker husk (4 HP); the Draugr Wight and Draugr Scourge are the barrow's sergeants (8 HP, 2 Armor, ancient greatsword d10)."
impaired_by:
  - "frost"
disease: "brown-rot"
critical: "the grave-cold sets into the wound; the target is Deprived until they have spent a night warm beside a fire."
source: "wardens-guide/bestiary#draugr"
body: |
  Reanimated Nord warriors with piercing blue eyes, slumbering in alcoves and coffins until disturbed. Four or more fight as a detachment. Their blows may carry Brown Rot (STR save or contract the disease).

  Draugr & Dragon Priests: The dragon cult buried its honored dead in the deep barrows of Skyrim, bound to wake and slay anything that disturbs their rest. Draugr are immune to poison and disease, and frost damage against them is Impaired — most wield it themselves. None can attack in the round it breaks free of its sarcophagus.
---
