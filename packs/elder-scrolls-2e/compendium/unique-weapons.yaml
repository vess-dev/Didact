# Unique Weapons (wardens-guide/unique-weapons), the Daedric Artifacts among them: Relics with a
# damage die (never past d12), and charges where the book gives them.
id: "mehrunes-razor"
type: "relic"
name: "Mehrunes' Razor"
category: "Daedric Artifact"
damage: "d6"
charges: 1
effect: "A black ebony dagger, the bound will of Mehrunes Dagon, Prince of Destruction. Its shards were scattered across Skyrim until the Museum of Mythic Dawn Artifacts in Dawnstar gathered them and a Dagon cultist had it reforged. Spend the charge when you strike: the target must pass a STR save or die outright. The mighty, the soulless, and the god-touched shrug it off at the Warden's call."
recharge: "offer a fresh kill on a shrine to Mehrunes Dagon at midnight. Each time, roll 1d6: on a 1, the Prince claims the offering's soul and yours stands in his ledger."
source: "wardens-guide/unique-weapons#mehrunes-razor-d6-1-charge"
---
id: "mace-of-molag-bal"
type: "relic"
name: "Mace of Molag Bal"
category: "Daedric Artifact"
damage: "d8"
effect: "The Vampire's Mace, sacred to the Lord of Domination and Enslavement, won in the House of Horrors in Markarth. It is forged of dark iron and hungers for the will of the living. Each hit drains the target's will: it must pass a WIL save or lose 1 WIL (restored by a week's rest), and a creature brought to 0 WIL this way is broken to your service for the scene. The soul of anyone slain with the mace is caught in any empty soul gem you carry."
source: "wardens-guide/unique-weapons#mace-of-molag-bal-d8"
---
id: "volendrung"
type: "relic"
name: "Volendrung"
category: "Daedric Artifact"
damage: "d12"
size: "bulky"
qualities:
  - "two-handed"
charges: 3
effect: "The Hammer of Might, a colossal Dwemer warhammer that Malacath claims as his own, granted to the champion who broke the curse on the Orc stronghold of Largashbur. It swings with impossible speed for its size. Spend a charge when you strike: the target is hurled back 20 feet and knocked down, and it loses 1 STR as the hammer drinks its vigor (a STR save halts the flight, though not the drain)."
recharge: "carry the hammer through a full day's march without once setting it down."
source: "wardens-guide/unique-weapons#volendrung-d12-bulky-two-handed-3-charges"
---
id: "dawnbreaker"
type: "relic"
name: "Dawnbreaker"
category: "Daedric Artifact"
damage: "d8"
charges: 1
effect: "The radiant sword of Meridia, Lady of Infinite Energies, who despises the undead and the necromancers who raise them. Its edge burns with caged daylight; it was freed from her beacon's temple on Mount Kilkreath. Against the undead, Dawnbreaker's attacks are Enhanced. When it reduces an undead creature to 0 HP, you may spend the charge: it bursts in a holy flare, dealing d8 fire (blast) to every other undead nearby, each of which must also pass a WIL save or flee. A vampire who holds it is Deprived while it burns in their hand."
recharge: "raise the blade to the open sky at dawn."
source: "wardens-guide/unique-weapons#dawnbreaker-d8-1-charge"
---
id: "ebony-blade"
type: "relic"
name: "Ebony Blade"
category: "Daedric Artifact"
damage: "d10"
size: "bulky"
qualities:
  - "two-handed"
effect: "A black two-handed sword, the whispering gift of Mephala, Prince of Lies and Secret Murder, drawn from the Whispering Door in Dragonsreach. It feeds on betrayal and grows keener the more it is used to slay those who trusted its wielder. Each hit heals you 1 HP. For every two friends, allies, or trusting souls you slay with it, it heals 1 more per hit, to a maximum of 3 HP. It never needs recharging, but its hunger never sleeps; left idle, it whispers."
source: "wardens-guide/unique-weapons#ebony-blade-d10-bulky-two-handed"
---
id: "wabbajack"
type: "relic"
name: "Wabbajack"
category: "Daedric Artifact"
damage: "d6"
charges: 3
effect: "The mad staff of Sheogorath, Prince of Madness, given to the one who walked through the madness of Emperor Pelagius's mind. No two strikes do the same thing; reality bends and giggles around it. Spend a charge and point it at a target, which must pass a WIL save. On a failure, roll 1d6: 1 it bursts into fire, frost, or shock (d10, blast); 2 it becomes a harmless beast — a chicken, a mudcrab, a rabbit — for the scene; 3 it flies into a frenzy, attacking the nearest living thing; 4 it is healed of all its hurts and pacified for the scene; 5 it turns invisible for the scene, and so do you; 6 a wheel of cheese, a sweetroll, and a scatter of Septims rain down about it. On a success, something harmless and absurd happens instead."
recharge: "do something genuinely, pointlessly mad that amuses no one but yourself. The Warden judges."
source: "wardens-guide/unique-weapons#wabbajack-d6-3-charges"
---
id: "sanguine-rose"
type: "relic"
name: "Sanguine Rose"
category: "Daedric Artifact"
damage: "d6"
charges: 3
effect: "A staff crowned with a thorned rose of crystal and shadow, the keepsake of Sanguine, Prince of Debauchery, left behind after A Night to Remember that ended in Misty Grove. Spend a charge to tear open a brief rift and summon a Dremora (6 HP, 1 Armor, Daedric sword d8) that fights for you until the end of the scene, then is banished back to Oblivion."
recharge: "spend a night in drunken, ruinous excess — and wake having lost something: a memory, an item, a friend's good regard."
source: "wardens-guide/unique-weapons#sanguine-rose-d6-3-charges"
---
id: "skull-of-corruption"
type: "relic"
name: "Skull of Corruption"
category: "Daedric Artifact"
damage: "d6"
charges: 3
effect: "A grim staff topped with a screaming skull, sacred to Vaermina, Prince of Nightmares, and kept sealed for years in Nightcaller Temple above Dawnstar. It drinks the dreams of sleepers and hurls them back as living terror. Spend a charge to strike a foe in sight with stolen nightmares: d8, and it must pass a WIL save or be wracked by them, its attacks Impaired for the rest of the scene."
recharge: "stand over a sleeping person and let the skull drink their dreams; they wake unrested and faintly haunted."
source: "wardens-guide/unique-weapons#skull-of-corruption-d6-3-charges"
---
id: "goldbrand"
type: "relic"
name: "Goldbrand"
category: "Daedric Artifact"
damage: "d8"
effect: "A golden katana forged by the dragons of the North in the Merethic dawn and given to Sivdur, the warrior sworn to protect them — ancestor of Whiterun's Battle-Born clan. It embodies the power of Boethiah, and it burns what it strikes. Each hit sets flammable things alight, and against a foe that has wronged or betrayed you, its attacks are Enhanced."
source: "wardens-guide/unique-weapons#goldbrand-d8"
---
id: "the-rueful-axe"
type: "relic"
name: "The Rueful Axe"
category: "Daedric Artifact"
damage: "d10"
size: "bulky"
qualities:
  - "two-handed"
effect: "The battleaxe of Clavicus Vile, recovered from Rimerock Burrow in A Daedra's Best Friend. The Prince offers a last bargain over his dog Barbas: strike the hound down with it, and the axe is yours to keep; hand it back and reunite the pair, and he gives you his Masque instead. Heavy, slow, and utterly unenchanted. Nothing about it is magic but the story. Against dogs, wolves, and hounds of every kind — Barbas included — its attacks are Enhanced."
source: "wardens-guide/unique-weapons#the-rueful-axe-d10-bulky-two-handed"
---
id: "chillrend"
type: "relic"
name: "Chillrend"
category: "Unique weapon"
damage: "d8"
charges: 3
effect: "A glittering glass sword sheathed in eternal cold, kept in a locked case in Riftweald Manor by the Thieves Guild's own Guild Master. Spend a charge when you strike: the target must pass a STR save or be frozen stiff, losing its next action."
recharge: "bury the blade overnight in fresh snow or glacier ice."
source: "wardens-guide/unique-weapons#chillrend-d8-3-charges"
---
id: "dragonbane"
type: "relic"
name: "Dragonbane"
category: "Unique weapon"
damage: "d8"
effect: "An Akaviri katana of the Blades, forged to end dragons and left waiting in Sky Haven Temple for the next Dragonborn. Against dragons, its attacks are always Enhanced. (A dragon is a detachment, so a lone attacker's blows are Impaired; the two cancel, and Dragonbane strikes at its full d8.)"
source: "wardens-guide/unique-weapons#dragonbane-d8"
---
id: "nightingale-blade"
type: "relic"
name: "Nightingale Blade"
category: "Unique weapon"
damage: "d8"
charges: 3
effect: "An ebony sword wreathed in cold shadow, gifted to a sworn agent of Nocturnal's Nightingales. Spend a charge when you strike: the target's vigor drains into the blade — it acts Impaired next round, and you regain HP equal to the damage dealt."
recharge: "renew your oath to Nocturnal at the altar of the Nightingale Hall."
source: "wardens-guide/unique-weapons#nightingale-blade-d8-3-charges"
---
id: "nightingale-bow"
type: "relic"
name: "Nightingale Bow"
category: "Unique weapon"
damage: "d6"
size: "bulky"
charges: 3
effect: "The shadow-bow of the Nightingales, sister to the blade, humming with frost and storm. Spend a charge when you shoot: the arrow carries frost and lightning, and the target is slowed (on its next turn it can move or act, not both)."
recharge: "renew your oath to Nocturnal at the altar of the Nightingale Hall."
source: "wardens-guide/unique-weapons#nightingale-bow-d6-bulky-3-charges"
---
id: "gauldur-blackblade"
type: "relic"
name: "Gauldur Blackblade"
category: "Unique weapon"
damage: "d8"
effect: "One of three relics of the cursed Gauldur sons, an ancient Nord sword recovered from Folgunthur. Each hit heals you 1 HP, drawing the victim's life into the blade and its bearer. It carries the brothers' curse: its wielder sleeps poorly and dreams of an old murder."
source: "wardens-guide/unique-weapons#gauldur-blackblade-d8"
---
id: "gauldur-blackbow"
type: "relic"
name: "Gauldur Blackbow"
category: "Unique weapon"
damage: "d6"
size: "bulky"
effect: "The second Gauldur relic, an ancient Nord bow drawn from the drowned halls of Geirmund's Hall. A hit on a spellcaster or magical creature drains its magicka: the next spell it tries this scene fails. Its string keens faintly near the dead."
source: "wardens-guide/unique-weapons#gauldur-blackbow-d6-bulky"
---
id: "the-pale-blade"
type: "relic"
name: "The Pale Blade"
category: "Unique weapon"
damage: "d8"
charges: 3
effect: "A frost-scarred steel sword from Frostmere Crypt in the Pale, bound to the wraith called the Pale Lady; she walked until the blade was set back on its pedestal. Spend a charge when you strike: the target must pass a WIL save or flee in terror for the rest of the scene. A detachment that fails is routed."
recharge: "leave the blade overnight on a grave in the snow."
source: "wardens-guide/unique-weapons#the-pale-blade-d8-3-charges"
---
id: "eduj"
type: "relic"
name: "Eduj"
category: "Unique weapon"
damage: "d8"
effect: "The Nord-hero sword of Kvenel the Tongue, sealed in Volunruud beside its twin axe. A creature it strikes must pass a STR save or be slowed (on its next turn it can move or act, not both)."
source: "wardens-guide/unique-weapons#eduj-d8"
---
id: "okin"
type: "relic"
name: "Okin"
category: "Unique weapon"
damage: "d8"
effect: "The Nord-hero war axe, twin to Eduj, buried with Kvenel in Volunruud. As Eduj: a creature it strikes must pass a STR save or be slowed. Wielded together, the twins are written d8+d8."
source: "wardens-guide/unique-weapons#okin-d8"
---
id: "ghostblade"
type: "relic"
name: "Ghostblade"
category: "Unique weapon"
damage: "d8"
effect: "A spectral ancient Nord sword laid to rest in Ansilvund, its edge made of cold light rather than steel. Its attacks ignore 2 Armor and strike ghosts and spirits at full force. It weighs nothing and takes no slot."
source: "wardens-guide/unique-weapons#ghostblade-d8"
---
id: "windshear"
type: "relic"
name: "Windshear"
category: "Unique weapon"
damage: "d8"
effect: "A curved scimitar lashed to the very end of the bowsprit of the Katariah, the Emperor's own ship. Once per combat, a foe you strike with it is staggered and loses its next action (a STR save negates)."
source: "wardens-guide/unique-weapons#windshear-d8"
---
id: "wuuthrad"
type: "relic"
name: "Wuuthrad"
category: "Unique weapon"
damage: "d10"
size: "bulky"
qualities:
  - "two-handed"
effect: "Ysgramor's great battleaxe, reforged from its shards on the Skyforge — the holy weapon of the Companions and the bane of elvenkind. Against elves of any kind — Altmer, Bosmer, Dunmer, and the debased Falmer — its attacks are always Enhanced."
source: "wardens-guide/unique-weapons#wuuthrad-d10-bulky-two-handed"
---
id: "headmans-cleaver"
type: "relic"
name: "Headman's Cleaver"
category: "Unique weapon"
damage: "d10"
size: "bulky"
qualities:
  - "two-handed"
effect: "The executioner's axe of the Orc stronghold of Bloodfall, a royal heirloom stolen by the Greencap Bandits, whose leader was the Bloodfall Queen's own disinherited son. A helpless or bound creature it reduces to 0 HP dies outright — no Critical Damage save. Carried openly, its grim fame precedes you: the law-abiding treat you one step worse on the Reaction ladder."
source: "wardens-guide/unique-weapons#headmans-cleaver-d10-bulky-two-handed"
---
id: "bolars-oathblade"
type: "relic"
name: "Bolar's Oathblade"
category: "Unique weapon"
damage: "d8"
effect: "An Akaviri katana of the Blades, carried by Acilius Bolar, the sole survivor of the Thalmor siege of Cloud Ruler Temple, who fled to Skyrim and made his last stand in Bloated Man's Grotto. Once per combat, a foe you strike with it must pass a WIL save or flee from you for a round, as if it saw the whole of the Blades behind you."
source: "wardens-guide/unique-weapons#bolars-oathblade-d8"
---
id: "keening"
type: "relic"
name: "Keening"
category: "Unique weapon"
damage: "d6"
effect: "One of the three tools of the Dwemer Chief Tonal Architect Kagrenac, made to strike the Heart of Lorkhan. It turned up at the College of Winterhold in Arniel's Endeavor — and its first wielder did not survive the experiment. Each hit drains the target's magicka: the next spell it tries this scene fails. The blade is hungry; carried without its sheath, it costs its bearer 1 max HP until put away."
source: "wardens-guide/unique-weapons#keening-d6"
---
id: "blade-of-woe"
type: "relic"
name: "Blade of Woe"
category: "Unique weapon"
damage: "d6"
effect: "The dagger of Astrid, leader of the Dark Brotherhood's Falkreath Sanctuary, slick with old murders. Each hit heals you 1 HP. (Against an unaware foe it is Enhanced, as any assassin's blow is.)"
source: "wardens-guide/unique-weapons#blade-of-woe-d6"
---
id: "dawnguard-rune-axe"
type: "relic"
name: "Dawnguard Rune Axe"
category: "Unique weapon"
damage: "d8"
effect: "A consecrated war axe of the vampire-hunting Dawnguard, etched with runes of the sun. Against the undead — vampires, draugr, and the like — its attacks are always Enhanced. Against the living it is simply a fine war axe."
source: "wardens-guide/unique-weapons#dawnguard-rune-axe-d8"
---
id: "bloodthorn"
type: "relic"
name: "Bloodthorn"
category: "Unique weapon"
damage: "d6"
effect: "A wickedly enchanted steel dagger found on the altar at Hag's End, thirsting for souls. The soul of a creature slain with it is caught in any empty soul gem you carry."
source: "wardens-guide/unique-weapons#bloodthorn-d6"
---
id: "steel-battleaxe-of-fiery-souls"
type: "relic"
name: "Steel Battleaxe of Fiery Souls"
category: "Unique weapon"
damage: "d10"
size: "bulky"
qualities:
  - "two-handed"
effect: "A burning battleaxe sealed in Ironbind Barrow, its head wreathed in soul-fire that sets pitch, straw, and cloth alight. The soul of a creature slain with it is caught in any empty soul gem you carry."
source: "wardens-guide/unique-weapons#steel-battleaxe-of-fiery-souls-d10-bulky-two-handed"
---
id: "valdrs-lucky-dagger"
type: "relic"
name: "Valdr's Lucky Dagger"
category: "Unique weapon"
damage: "d6"
effect: "A plain-looking steel dagger that seems to find the gap in any guard, carried by a hunter down on his luck near Moss Mother Cavern. Once per combat, re-roll this dagger's damage and take the better result."
source: "wardens-guide/unique-weapons#valdrs-lucky-dagger-d6"
---
id: "auriels-bow"
type: "relic"
name: "Auriel's Bow"
category: "Unique weapon"
damage: "d6"
size: "bulky"
effect: "The sacred bow of the elven god Auri-El, hidden in the Inner Sanctum of the Forgotten Vale and drawn faster than any mortal bow. Loosed with a Sunhallowed arrow, a hit calls down a searing ray of sunlight: d6 fire (blast) against the target and any undead beside it. Loosed with a Bloodcursed arrow at the sun, it blots out the daylight until the next dawn — a boon to vampires, a horror to all else. (Arrows come in quivers of 3 uses, and are rare.)"
source: "wardens-guide/unique-weapons#auriels-bow-d6-bulky"
---
id: "zephyr"
type: "relic"
name: "Zephyr"
category: "Unique weapon"
damage: "d6"
size: "bulky"
effect: "A Dwarven bow of cunning make, recovered from the ruins of Arkngthamz, that looses arrows faster than any other. It shoots as two bows at once: roll d6+d6 and keep the higher."
source: "wardens-guide/unique-weapons#zephyr-d6-bulky"
---
id: "harkons-sword"
type: "relic"
name: "Harkon's Sword"
category: "Unique weapon"
damage: "d8"
effect: "The blade of Lord Harkon, master of Castle Volkihar, attuned to the blood of the undying. Each hit heals you 1 HP — or 1d4 HP in a vampire's hands."
source: "wardens-guide/unique-weapons#harkons-sword-d8"
---
id: "bloodskal-blade"
type: "relic"
name: "Bloodskal Blade"
category: "Unique weapon"
damage: "d10"
size: "bulky"
qualities:
  - "two-handed"
charges: 3
effect: "A heavy Nordic greatsword from Bloodskal Barrow on Solstheim, whose blade throws a crescent of red force on a sweeping blow. Spend a charge to loose a crimson arc at a foe in sight instead of striking: d10, ignoring Armor."
recharge: "leave the blade overnight beneath open sky; the red light seeps back into its edge by dawn."
source: "wardens-guide/unique-weapons#bloodskal-blade-d10-bulky-two-handed-3-charges"
---
id: "miraaks-sword"
type: "relic"
name: "Miraak's Sword"
category: "Unique weapon"
damage: "d8"
effect: "The strange, writhing sword of the First Dragonborn, claimed from his hands in Apocrypha. Once per combat, a creature it strikes is sapped as its strength drains into the blade: it acts Impaired next round."
source: "wardens-guide/unique-weapons#miraaks-sword-d8"
---
id: "miraaks-staff"
type: "relic"
name: "Miraak's Staff"
category: "Unique weapon"
damage: "d6"
charges: 3
effect: "The black staff of Miraak, dripping with the influence of Hermaeus Mora. Spend a charge to make the ground erupt with writhing tentacles: every foe in a small area takes d8 (blast) and must pass a STR save or be slowed."
recharge: "read forbidden lore from a Black Book of Apocrypha, and lose an hour you will never remember."
source: "wardens-guide/unique-weapons#miraaks-staff-d6-3-charges"
---
id: "dwarven-black-bow-of-fate"
type: "relic"
name: "Dwarven Black Bow of Fate"
category: "Unique weapon"
damage: "d6"
size: "bulky"
effect: "A black-lacquered Dwarven bow won from the puzzle-vaults of Kagrumez on Solstheim, cursed with chaos. When it hits, roll the Die of Fate: on a 4 or more the bow drains its target, which loses 1 STR (restored by a week's rest)."
source: "wardens-guide/unique-weapons#dwarven-black-bow-of-fate-d6-bulky"
---
id: "bloodscythe-and-soulrender"
type: "relic"
name: "Bloodscythe & Soulrender"
category: "Unique weapon"
damage: "{d8, d8}kh1"
effect: "The paired scimitars of the pirate-king Haknir Death-Brand, who waits with his treasure and his crew in Gyldenhul Barrow on Solstheim; they were made to be carried together. Wielded together (d8+d8), each hit heals you 1 HP. Apart, each is merely a fine scimitar."
source: "wardens-guide/unique-weapons#bloodscythe--soulrender-d8-each"
---
id: "hoarfrost"
type: "relic"
name: "Hoarfrost"
category: "Unique weapon"
damage: "d8"
effect: "The ancient Nordic pickaxe of Ralis Sedarys, the Dunmer excavator of Kolbjorn Barrow, rimed in killing frost — and, like all such picks, able to mine Stalhrim. A creature it strikes must pass a STR save or be slowed."
source: "wardens-guide/unique-weapons#hoarfrost-d8"
---
id: "glass-bow-of-the-stag-prince"
type: "relic"
name: "Glass Bow of the Stag Prince"
category: "Unique weapon"
damage: "d6"
size: "bulky"
effect: "A glass bow blessed by the Stag Prince, Hircine, sold at the Ramshackle Trading Post on Solstheim. It grows in power the more it is fed with the hunt. For every twenty wild beasts slain with it, its wielder gains +1 max HP, to a maximum of +3. The blessing fades forever if the bow is ever turned on tame or thinking creatures."
source: "wardens-guide/unique-weapons#glass-bow-of-the-stag-prince-d6-bulky"
