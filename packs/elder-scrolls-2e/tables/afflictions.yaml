# Afflictions and crafting lookups (players-guide/diseases-and-afflictions, crafting,
# companions, mounts): what the rules look up by name.
table: diseases
title: "Diseases"
description: "Each disease, its source and its one ongoing effect, by id. When a source wounds or exposes you, save STR or be afflicted (`didact do disease`); any one cure clears them all (`didact do cure-disease`)."
lookup: disease
source: players-guide/diseases-and-afflictions#disease-table
entries:
  "rockjoint": {text: "Rockjoint: Your joints stiffen and ache: your attacks in the first round of any combat are Impaired (roll 1d4 damage) while your limbs loosen.", data: {name: "Rockjoint", source: "Foxes, wolves", effect: "Your joints stiffen and ache: your attacks in the first round of any combat are Impaired (roll 1d4 damage) while your limbs loosen."}}
  "ataxia": {text: "Ataxia: Your hands tremble: picking locks, picking pockets, and other fine handwork always require a DEX save, even at leisure.", data: {name: "Ataxia", source: "Skeevers", effect: "Your hands tremble: picking locks, picking pockets, and other fine handwork always require a DEX save, even at leisure."}}
  "witbane": {text: "Witbane: Your mind clouds: you cannot channel a Spell Tome without first passing a WIL save, even in safety.", data: {name: "Witbane", source: "Sabre cats (also dogs)", effect: "Your mind clouds: you cannot channel a Spell Tome without first passing a WIL save, even in safety."}}
  "brain-rot": {text: "Brain Rot: Magicka festers in you: whenever you channel a Spell Tome, make a WIL save or take an extra Fatigue from the effort.", data: {name: "Brain Rot", source: "Hagravens (also risen corpses)", effect: "Magicka festers in you: whenever you channel a Spell Tome, make a WIL save or take an extra Fatigue from the effort."}}
  "bone-break-fever": {text: "Bone Break Fever: A wracking ache settles in: you carry one Fatigue that rest cannot clear (drop an item if you have no free slot).", data: {name: "Bone Break Fever", source: "Bears", effect: "A wracking ache settles in: you carry one Fatigue that rest cannot clear (drop an item if you have no free slot)."}}
  "rattles": {text: "Rattles: Your limbs shudder and tire: a short rest no longer restores your HP — only a full night's rest does.", data: {name: "Rattles", source: "Chaurus (Hunters & Reapers)", effect: "Your limbs shudder and tire: a short rest no longer restores your HP — only a full night's rest does."}}
  "brown-rot": {text: "Brown Rot: Your skin blotches and your gear seems to rot with you: your body armor gives 1 less Armor (to a minimum of 0).", data: {name: "Brown Rot", source: "Draugr", effect: "Your skin blotches and your gear seems to rot with you: your body armor gives 1 less Armor (to a minimum of 0)."}}
  "droops": {text: "Droops: Your arms hang heavy: attacks with a bulky weapon are Impaired.", data: {name: "Droops", source: "Ash hoppers", effect: "Your arms hang heavy: attacks with a bulky weapon are Impaired."}}
  "greenspore": {text: "Greenspore: A green bloom creeps over your skin: strangers' Reactions toward you shift one step worse.", data: {name: "Greenspore", source: "Slaughterfish", effect: "A green bloom creeps over your skin: strangers' Reactions toward you shift one step worse."}}
  "sanguinare-vampiris": {text: "Sanguinare Vampiris: The vampire's curse takes root. Your maximum HP is reduced by 1 while it festers, and if left uncured it becomes Vampirism after three days (see below).", data: {name: "Sanguinare Vampiris", source: "Vampires (their draining touch)", effect: "The vampire's curse takes root. Your maximum HP is reduced by 1 while it festers, and if left uncured it becomes Vampirism after three days (see below)."}}
