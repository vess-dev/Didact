table: material-tiers
title: "Material tiers"
description: "The smith's materials, weakest to strongest: every tier obeys the same caps (Armor 3, d12), so the difference is fiction and worth. Worth (× the Marketplace price): Iron and Steel ×1; Dwarven, Elven and Orcish about ×5; glass, ebony, Nordic and Stalhrim about ×20; dragonbone and Daedric ×50 or more, when they can be bought at all."
lookup: material
source: players-guide/crafting#material-tiers
entries:
  "Iron": {text: "The common stock of every village forge. Heavy, plain, serviceable. Iron ingots are cheap and everywhere; this is where a smith learns the hammer.", data: {tier: 1, worth: 1}}
  "Steel": {text: "Iron folded with corundum — tougher, holds an edge, the soldier's standard across the Holds. Lighter and finer than raw iron for the same protection.", data: {tier: 2, worth: 1}}
  "Dwarven": {text: "Forged from salvaged Dwemer metal (it cannot be mined — only smelted from ruin-salvage). Golden, ancient, and far sturdier than steel; a mark of the delver who looted a Dwemer hall.", data: {tier: 3, worth: 5}}
  "Elven": {text: "Pale moonstone work, quicksilver-bright. Light and elegant — the Altmer aesthetic — favoring the swift fighter over the bulwark.", data: {tier: 4, worth: 5}}
  "Orcish": {text: "Dark, brutal stronghold-craft, heavier and grimmer than elven. What the Orsimer beat out at their clan forges; ugly, dependable, and feared.", data: {tier: 5, worth: 5}}
  "Glass": {text: "Malachite, not true glass: a translucent green volcanic stone, prized and rare. Astonishingly light for its strength — beautiful, expensive, and a clear sign of wealth.", data: {tier: 6, worth: 20}}
  "Ebony": {text: "Hardened volcanic \"stone-metal\" from the ash lands, black and faintly glassy. One of the finest mundane materials; weapons of it are deadly, armor of it is dreaded, and it takes an enchantment readily.", data: {tier: 7, worth: 20}}
  "Nordic / Stalhrim": {text: "Two ancient northern makes. Nordic is the strong-but-light steel of old Solstheim. Stalhrim is \"enchanted ice\" mined only on Solstheim with an ancient Nordic pick — frost-cold to the touch and rivaling the very best; gear of it carries cold enchantments uncommonly well.", data: {tier: 8, worth: 20}}
  "Dragonbone": {text: "Smith-work from the bones and scales of slain dragons. Wickedly sharp, frighteningly tough, and unmistakable; only a Dragonborn's hunts (or a very lucky scavenger) supply the stock.", data: {tier: 9, worth: 50}}
  "Daedric": {text: "The pinnacle. Ebony quenched with a beating Daedra Heart in an ill-omened rite — black shot through with red, radiating a low menace. The dreadful equal of dragonbone; armor of it terrifies, and it drinks enchantment more eagerly than any other make. Still 3 Armor; still d12. Its superiority is the fear it sows, the price it commands, and the magic it will hold.", data: {tier: 10, worth: 50}}
