table: soul-gems
title: "Soul gems"
description: "A soul's size sets a crafted Relic's charges: petty or lesser 1, common or greater 2, grand or black 3. Greater, grand and black souls can power a constant (always-on) worn enchantment instead."
lookup: gem
source: players-guide/crafting#soul-gems
entries:
  "petty": {text: "Petty: holds the soul of the smallest vermin; 1 — the apprentice's gem", data: {charges: 1, constant: false}}
  "lesser": {text: "Lesser: holds a small beast; 1", data: {charges: 1, constant: false}}
  "common": {text: "Common: holds an ordinary animal; 2 — the workaday gem of most enchanters", data: {charges: 2, constant: false}}
  "greater": {text: "Greater: holds a large or fierce creature; 2, or a constant enchantment", data: {charges: 2, constant: true}}
  "grand": {text: "Grand: holds the mightiest beasts; 3, or a constant enchantment — the fullest a white soul goes", data: {charges: 3, constant: true}}
  "black": {text: "Black: holds the soul of a thinking being; 3, or a constant enchantment — grand-sized always, and forbidden", data: {charges: 3, constant: true}}
