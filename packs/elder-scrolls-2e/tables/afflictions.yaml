table: loyalty
title: "Loyalty"
description: "A companion's Loyalty, 1 (Wary) to 5 (Sworn); it moves one step at a time (`didact do loyalty`)."
lookup: loyalty
source: players-guide/companions#loyalty
entries:
  1: {text: "Wary: Follows for now. Leaves at the next clean chance.", data: {name: "Wary"}}
  2: {text: "Tested: Stays, but grumbles. Won't charge into obvious death for you.", data: {name: "Tested"}}
  3: {text: "Trusting: The default. A reliable ally.", data: {name: "Trusting"}}
  4: {text: "Devoted: Takes the first hit for a PC. Won't leave without a direct order.", data: {name: "Devoted"}}
  5: {text: "Sworn: Will die for the party and mean it. Once per day, may take a hit meant for their PC — the companion suffers that damage instead.", data: {name: "Sworn"}}
