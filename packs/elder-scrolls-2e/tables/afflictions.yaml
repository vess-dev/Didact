table: brews
title: "Sample potions and poisons"
description: "Representative recipes, each brewed from ingredients sharing the named effect: a menu, not a limit. All are petty, single-use, no Fatigue."
lookup: brew
source: players-guide/crafting#sample-potions--poisons
entries:
  "Potion of Healing": "Restores 1d6 STR. A master's Potion of Greater Healing restores all lost STR. Either can stabilize a PC suffering Critical Damage. A healing draught is magical healing (see Healing has limits, below)."
  "Potion of Cure Disease": "Cures all mundane disease (Rockjoint, Ataxia, and the like). It does not cure Vampirism or Lycanthropy."
  "Potion of Resist Fire": "For the rest of the scene, fire attacks against you are Impaired."
  "Potion of Resist Frost": "For the rest of the scene, frost and cold attacks against you are Impaired. (A Stalhrim-flavored brew is especially prized in the north.)"
  "Potion of Resist Shock": "For the rest of the scene, lightning/shock attacks against you are Impaired."
  "Draught of Fortitude": "Re-roll one failed STR (or DEX, or WIL — the brew is keyed to one) save, once, before the next Downtime."
  "Potion of Invisibility": "You cannot be seen until you attack, cast, or the scene ends. Attacks you make from it are Enhanced; saves to move unseen are not required while it lasts."
  "Potion of Waterbreathing": "You breathe water freely for a scene — no drowning saves while submerged."
  "Damage Health (poison)": "Smeared on a blade or arrow as an action. The next hit with that weapon is Enhanced."
  "Paralytic (poison)": "The next hit with the coated weapon forces a STR save; on a failure the target loses its next turn as its limbs lock."
  "Lingering Poison": "The next hit with the coated weapon forces a STR save; on a failure the target takes 1d6 STR and the venom lingers: at the start of each of its next three turns it saves again, losing 1 more STR on each failure, until a save succeeds (see Hazards → Poison & Venom)."
---
table: enchantments
title: "Sample enchantments"
description: "Effects ready to bind into a Relic at an arcane enchanter (`didact do enchant`); the soul gem sets the charges."
lookup: effect
source: players-guide/crafting#sample-enchantments
entries:
  "Fire / Frost / Shock damage": "When you attack, spend a charge: the attack is Enhanced and counts as fire, frost, or shock."
  "Soul Trap": "When you attack, spend a charge: if the blow kills, the creature's soul fills a fitting empty soul gem you carry."
  "Absorb Health": "When you attack, spend a charge: the attack is Enhanced and you restore 1d4 STR."
  "Turn Undead": "Spend a charge: undead in sight make a WIL save or flee for the round."
  "Resist an element (worn, constant)": "While worn, that element's attacks against you are Impaired."
  "Fortify a save (worn)": "Spend a charge: re-roll a failed save of one chosen type (STR, DEX, or WIL)."
  "Muffle (worn, constant)": "While worn, you need not save to move silently in ordinary conditions."
  "Waterbreathing (worn, constant)": "While worn, you breathe water and never make drowning saves."
