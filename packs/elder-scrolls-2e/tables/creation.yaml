  "The Thief": {text: "Once per day, re-roll a failed DEX save."}
  "The Lord": {text: "Once per day, one attack against you is Impaired."}
  "The Lady": {text: "Once per day, a short rest also clears one Fatigue."}
  "The Steed": {text: "Ignore the bulky tag on one worn suit of armor."}
  "The Apprentice": {text: "Twice per day, channel a Spell Tome without adding Fatigue — but magical attacks against you are Enhanced."}
