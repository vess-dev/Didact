table: monster-morale-to-wil
title: "Converting morale (ML) to WIL"
description: "When converting a monster from another system, Morale (ML), which typically ranges between 2-12, is a good guidepost for WIL."
lookup: ml
source: wardens-guide/creating-monsters#converting-monsters
entries:
  4: 6
  8: 12
  10: 15
  12: 18
---
table: monster-saving-throw
title: "Saving throws to ability scores"
description: "When converting a monster from another system, which saving throws suggest raising one of its ability scores."
lookup: saving_throw
source: wardens-guide/creating-monsters#saving-throws
entries:
  "Death or Poison": {text: "STR", data: {abilities: ["STR"]}}
  "Wands": {text: "DEX", data: {abilities: ["DEX"]}}
  "Paralysis or Petrification": {text: "WIL or STR", data: {abilities: ["WIL", "STR"]}}
  "Breath Attacks": {text: "DEX or STR", data: {abilities: ["DEX", "STR"]}}
  "Spells, Rods or Staves": {text: "WIL", data: {abilities: ["WIL"]}}
