# Encounters (roll-tables/bestiary, wardens-guide/bestiary#monster-categories): a creature for
# the situation, by threat tier; data.ids are the compendium entries named.
table: monster-categories
title: "Monster Categories"
description: "Roll or choose to seed an encounter; data.ids are the creatures' compendium entries (row 20 asks to reskin a Bandit as a Legionary or Stormcloak)."
dice: d20
source: wardens-guide/bestiary#monster-categories
entries:
  1: {text: "Draugr", data: {monsters: ["Draugr", "Draugr Overlord", "Draugr Deathlord", "Dragon Priest"], ids: ["draugr", "draugr-overlord", "draugr-deathlord", "dragon-priest"]}}
  2: {text: "Undead", data: {monsters: ["Skeleton", "Boneman", "Ghost", "Wispmother", "Bonewolf", "Wight"], ids: ["skeleton", "boneman", "ghost", "wispmother", "bonewolf", "wight"]}}
  3: {text: "Dragon", data: {monsters: ["Dragon", "Frost Dragon", "Elder Dragon", "Ancient Dragon", "Alduin"], ids: ["dragon", "frost-dragon", "elder-dragon", "ancient-dragon", "alduin"]}}
  4: {text: "Automaton", data: {monsters: ["Dwarven Spider", "Dwarven Sphere", "Dwarven Centurion", "Dwarven Ballista"], ids: ["dwarven-spider", "dwarven-sphere", "dwarven-centurion", "dwarven-ballista"]}}
  5: {text: "Falmer", data: {monsters: ["Falmer", "Falmer Nightprowler", "Falmer Warmonger"], ids: ["falmer", "falmer-nightprowler", "falmer-warmonger"]}}
  6: {text: "Chaurus", data: {monsters: ["Chaurus", "Chaurus Reaper", "Chaurus Hunter"], ids: ["chaurus", "chaurus-reaper", "chaurus-hunter"]}}
  7: {text: "Predator", data: {monsters: ["Sabre Cat", "Bear", "Wolf", "Skeever"], ids: ["sabre-cat", "bear", "wolf", "skeever"]}}
  8: {text: "Coastal", data: {monsters: ["Mudcrab", "Horker", "Slaughterfish", "Netch"], ids: ["mudcrab", "horker", "slaughterfish", "netch"]}}
  9: {text: "Vermin", data: {monsters: ["Frostbite Spider", "Ash Hopper", "Ice Wraith"], ids: ["frostbite-spider", "ash-hopper", "ice-wraith"]}}
  10: {text: "Megafauna", data: {monsters: ["Mammoth", "Giant", "Bristleback"], ids: ["mammoth", "giant", "bristleback"]}}
  11: {text: "Troll", data: {monsters: ["Troll", "Frost Troll"], ids: ["troll", "frost-troll"]}}
  12: {text: "Wild Spirit", data: {monsters: ["Spriggan", "Spriggan Matron", "Hagraven"], ids: ["spriggan", "spriggan-matron", "hagraven"]}}
  13: {text: "Shapeshifter", data: {monsters: ["Werewolf", "Werebear"], ids: ["werewolf", "werebear"]}}
  14: {text: "Atronach", data: {monsters: ["Flame Atronach", "Frost Atronach", "Storm Atronach"], ids: ["flame-atronach", "frost-atronach", "storm-atronach"]}}
  15: {text: "Daedra", data: {monsters: ["Dremora", "Scamp", "Clannfear", "Daedroth", "Spider Daedra", "Xivilai", "Gargoyle"], ids: ["dremora", "scamp", "clannfear", "daedroth", "spider-daedra", "xivilai", "gargoyle"]}}
  16: {text: "Apocrypha & Ash", data: {monsters: ["Seeker", "Lurker", "Ash Spawn", "Ash Guardian", "Riekling"], ids: ["seeker", "lurker", "ash-spawn", "ash-guardian", "riekling"]}}
  17: {text: "Vampire", data: {monsters: ["Vampire", "Vampire Lord", "Death Hound", "Vampire Thrall"], ids: ["vampire", "vampire-lord", "death-hound", "vampire-thrall"]}}
  18: {text: "Outlaw", data: {monsters: ["Bandit", "Forsworn", "Forsworn Briarheart", "Silver Hand"], ids: ["bandit", "forsworn", "forsworn-briarheart", "silver-hand"]}}
