# Backgrounds (players-guide/character-creation#backgrounds): the d50 table. Each entry's data
# holds the background's quote, names, starting Septims and gear, its two d6 tables
# (tables/backgrounds/<id>.yaml), and what it brings at creation: an unusual nature, the
# faction standings its premise gives, a companion. backgrounds-mortal is the same table
# without the five unusual ones (46-50), for tables that haven't cleared them: rerolling
# 46-50 on a d50 is a d45.
table: backgrounds
title: "Backgrounds"
description: "Roll 1d50 (or 1d100 and halve, rounding up) or choose. The last five (46-50) are unusual, monstrous or non-mortal origins: check with the Warden (the unusual-backgrounds option)."
about: "{quote}"
dice: d50
source: players-guide/character-creation#backgrounds
entries:
  1: {text: "Companion", data: {quote: "The mead hall is loud, the hearth is warm, and your shield-siblings have your back. You took up arms in Jorrvaskr, the upturned longship that has sheltered the heirs of Ysgramor's Five Hundred for nearly five thousand years, and the old blood still runs in the work: a contract honored, a wrong righted, glory won by the strength of your arm.", names: ["Brandr", "Sigrun", "Torvald", "Ingrid", "Ulfhrafn", "Svanlaug", "Hallbjorn", "Kolskegg", "Asbrand", "Gudrun"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Steel sword", damage: "d8"}, {name: "Round shield painted with the Companions' crest", armor: 1}, {name: "Hide armor", armor: 1, suit: 1}, {name: "Mead horn of Jorrvaskr", size: "petty"}], tables: ["companion-1", "companion-2"], table_1: ["companion-1"], table_2: ["companion-2"], reputation: {rep_companions: 1}}}
  2: {text: "Housecarl", data: {quote: "\"I am sworn to carry your burdens.\" You gave your oath to a Jarl or a Thane, and an oath of Skyrim is iron. Their life is your charge, their hall your home, their enemies your own — and you will stand between them and the blade if it comes to that.", names: ["Hjalmar", "Dagrun", "Eirik", "Thyra", "Orm", "Vigrun", "Bjarni", "Solveig", "Hallvard", "Ragnhild"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Steel sword", damage: "d8"}, {name: "Steel mail cuirass with your Hold's colors", armor: 2, suit: 2, size: "bulky"}, {name: "Carved mead cup of your Hold", size: "petty"}], tables: ["housecarl-1", "housecarl-2"], table_1: ["housecarl-1"], table_2: ["housecarl-2"]}}
  3: {text: "Imperial Legionnaire", data: {quote: "Lock shields. Hold the line. You learned to fight not as one blade but as one wall, drilled in the iron discipline of the Legion under the dragon banner of Cyrodiil. The Empire is old and tired and far from home — but it is still the Empire, and you still answer the horn.", names: ["Marcus", "Aurelia", "Aulus", "Lucilla", "Cornelius", "Severia", "Galerius", "Octavia", "Decius", "Petronia"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Imperial sword", damage: "d8"}, {name: "Imperial shield bearing the red dragon", armor: 1}, {name: "Imperial light armor of boiled leather and bronze", armor: 1, suit: 1}, {name: "Legion field manual", size: "petty"}], tables: ["imperial-legionnaire-1", "imperial-legionnaire-2"], table_1: ["imperial-legionnaire-1"], table_2: ["imperial-legionnaire-2"], reputation: {rep_legion: 1, rep_stormcloaks: -1}}}
  4: {text: "Stormcloak Soldier", data: {quote: "Skyrim belongs to the Nords. You took Ulfric's coin and Ulfric's oath, donned the blue and the bearskin, and swore to drive the Empire and its leashed elves back over the border — and to die, if Talos asks it, with his name on your lips.", names: ["Brynjar", "Hjordis", "Thorvald", "Ragnvor", "Kjartan", "Ylva", "Brodd", "Sunniva", "Vragnar", "Asvald"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Steel sword", damage: "d8"}, {name: "Stormcloak cuirass of quilted blue", armor: 1, suit: 1, note: "the bear of Eastmarch stitched across the breast"}, {name: "Bearskin cloak", size: "petty", note: "taken from a beast you killed yourself, as the old custom demands; it counts as warm clothing"}], tables: ["stormcloak-soldier-1", "stormcloak-soldier-2"], table_1: ["stormcloak-soldier-1"], table_2: ["stormcloak-soldier-2"], reputation: {rep_stormcloaks: 1, rep_legion: -1}}}
  5: {text: "Sellsword", data: {quote: "Stormcloak or Imperial, it's all the same coin to you. You don't fight for a flag or a god or a dead king's throne — you fight because someone paid, and you intend to be alive to spend it. A blade in one hand, a flask in the other, and a name that opens doors and empties rooms.", names: ["Arnvald", "Hrodgeir", "Svarri", "Varvald", "Imani", "Kassar", "Livia", "Ra'jhan", "Bolgra", "Kayd"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Steel sword", damage: "d8", note: "well kept, the one thing you never pawn"}, {name: "Studded leather armor", armor: 1, suit: 1}, {name: "Flask of cheap Nord mead", uses: 3, note: "a swig before a fight, and you may re-roll one failed save against fear"}], tables: ["sellsword-1", "sellsword-2"], table_1: ["sellsword-1"], table_2: ["sellsword-2"]}}
  6: {text: "Nord Reaver", data: {quote: "You keep the old ways, from before the Empire tamed the North — when a Nord's worth was the song sung over their pyre. The longship, the mead-bench, and the great axe are the only temple you need, and the Sea of Ghosts is the only road worth rowing.", names: ["Hrafn", "Brunhild", "Ketil", "Torunn", "Starkad", "Ralka", "Grim", "Torveig", "Hallstein", "Asveig"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Battleaxe", damage: "d10", size: "bulky", qualities: ["two-handed"]}, {name: "Round shield", armor: 1}, {name: "Fur armor", armor: 1, suit: 1}, {name: "Horn of mead", uses: 3, note: "for toasting the dead and sealing an oath"}], tables: ["nord-reaver-1", "nord-reaver-2"], table_1: ["nord-reaver-1"], table_2: ["nord-reaver-2"], race: "Nord"}}
  7: {text: "Redguard Alik'r", data: {quote: "The sword is the way, and the way is the sword. You came out of the deep desert of Hammerfell with the curved blade of the Ansei, the teachings of Frandar Hunding, and a debt of honor that cannot be bought — into a frozen land where the Nords stare at your skin and your steel alike.", names: ["Rashid at-Ahram", "Nadira af-Tava", "Yusuf Ibn-Karif", "Zahra al-Taneth", "Tariq at-Hegathe", "Yasmin af-Rihad", "Hassan Ibn-Dak'fron", "Mariam al-Gilane", "Kasim at-Elinhir", "Samira al-Sentinel"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Scimitar", damage: "d8"}, {name: "Hammerfell desert armor of padded leather and a sun-veil", armor: 1, suit: 1}, {name: "Whetstone and honing oil", size: "petty"}], tables: ["redguard-alikr-1", "redguard-alikr-2"], table_1: ["redguard-alikr-1"], table_2: ["redguard-alikr-2"], race: "Redguard"}}
  8: {text: "Orc Stronghold Warrior", data: {quote: "You were raised behind the spiked palisade of a stronghold — Largashbur, Dushnikh Yal, Mor Khazgur, or Narzulbur — under the Code of Malacath. Strength is law, the blood-price is paid, and the steel on your back was hammered by your mothers.", names: ["Lurgash gro-Ulag", "Shagdub gra-Morn", "Umbraz gro-Yazgu", "Ugra gra-Dula", "Bolgar gro-Batul", "Gashna gra-Shuzug", "Ghamorz gro-Bagrakh", "Yashna gra-Igron", "Torgak gro-Dushnikh", "Shelur gra-Khazgur"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Orcish war axe", damage: "d8"}, {name: "Forge hammer", damage: "d6"}, {name: "Orcish mail", armor: 2, suit: 2, size: "bulky"}], tables: ["orc-stronghold-warrior-1", "orc-stronghold-warrior-2"], table_1: ["orc-stronghold-warrior-1"], table_2: ["orc-stronghold-warrior-2"], race: "Orsimer"}}
  9: {text: "Vigilant of Stendarr", data: {quote: "Stendarr is the god of righteous mercy, but mercy has two hands: one that tends the sick and one that holds the torch. You swore the Vigil's oath at the Hall of the Vigilant, south of Dawnstar, and you carry both hands into the dark places where Daedra worship and the walking dead still fester.", names: ["Aldous", "Maela", "Cassia", "Varinius", "Hjorleif", "Adessa", "Tolvir", "Seraphine", "Aldhelm", "Gaerwyn"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Steel mace", damage: "d8"}, {name: "Vigil robes over a steel-scaled vest", armor: 1, suit: 1}, {name: "Vial of holy oil", uses: 3, note: "coat a weapon, and its next hit on a Daedra or the undead is Enhanced"}], tables: ["vigilant-of-stendarr-1", "vigilant-of-stendarr-2"], table_1: ["vigilant-of-stendarr-1"], table_2: ["vigilant-of-stendarr-2"], reputation: {rep_vigil: 1, rep_daedric_cults: -1}}}
  10: {text: "Dawnguard Hunter", data: {quote: "The vampires think the night belongs to them. Isran disagrees, and so do you. You found the old fort at the head of Dayspring Canyon, took the Dawnguard's oath, loaded the crossbow, and went looking for the dark places where the dead refuse to lie still.", names: ["Brisa", "Corvin", "Rognvar", "Mira", "Styr", "Ondrea", "Varek", "Elsbet", "Kodran", "Tamsin"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Crossbow", damage: "d8", size: "bulky"}, {name: "Steel war axe", damage: "d8"}, {name: "Dawnguard cuirass of boiled hide and steel plates", armor: 1, suit: 1}, {name: "String of garlic", uses: 3, note: "Isran swears by it; eat a clove before a hunt, and you need not save against Sanguinare Vampiris that day"}], tables: ["dawnguard-hunter-1", "dawnguard-hunter-2"], table_1: ["dawnguard-hunter-1"], table_2: ["dawnguard-hunter-2"], reputation: {rep_dawnguard: 1, rep_volkihar: -1}}}
  11: {text: "Blades Agent", data: {quote: "Once the Blades guarded emperors and hunted dragons in their own skies. Then the Great War came, and the Thalmor took their heads one by one. You are among the last, hunted in turn, carrying an Akaviri blade and a name the Justiciars would very much like to cross off their list — and now the dragons have come back, as the old Dragonguard always said they would.", names: ["Aurelian", "Sabira", "Rennick", "Maren", "Odric", "Tavena", "Cyprian", "Isolde", "Dagvard", "Sefa"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Akaviri katana", damage: "d8", note: "curved and ancient, a blade of the old Dragonguard"}, {name: "Wakizashi", damage: "d6", note: "worn hidden beneath the coat"}, {name: "Blades cuirass of lacquered steel scales", armor: 1, suit: 1, note: "worn under plain clothes"}, {name: "Codebook of Blades ciphers", size: "petty", note: "for reading dead drops and dragon-lore"}], tables: ["blades-agent-1", "blades-agent-2"], table_1: ["blades-agent-1"], table_2: ["blades-agent-2"], reputation: {rep_blades: 1}}}
  12: {text: "Bounty Hunter", data: {quote: "Every Jarl has a problem, and every problem has a price nailed to the inn door. You read the trail others can't, you bring them back alive when you can and bring back proof when you can't, and you always collect.", names: ["Eskil", "Ragna", "Tovi", "Sten", "Ulvi", "Brodir", "Kari", "Hild", "Vardis", "Ingolf"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Hunting bow", damage: "d6", size: "bulky"}, {name: "Steel sword", damage: "d8"}, {name: "Hide armor", armor: 1, suit: 1}, {name: "Iron manacles", note: "with the key"}, {name: "Sheaf of wanted notices from every Hold you've passed through", size: "petty"}], tables: ["bounty-hunter-1", "bounty-hunter-2"], table_1: ["bounty-hunter-1"], table_2: ["bounty-hunter-2"]}}
  13: {text: "Bandit", data: {quote: "Skyrim's roads are long and the Jarls' guards are few. You take what the road gives, share it with a fort full of cutthroats — Valtheim Towers, Halted Stream, some nameless tower on a nameless pass — and sell your loyalty to the chief who pays best, until a better offer comes along.", names: ["Hagni", "Svalla", "Orri", "Rurik", "Nessa", "Torvi", "Ulla", "Bjolf", "Grund", "Idrun"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Notched steel sword", damage: "d8"}, {name: "Hunting bow", damage: "d6", size: "bulky"}, {name: "Studded leather armor", armor: 1, suit: 1}], tables: ["bandit-1", "bandit-2"], table_1: ["bandit-1"], table_2: ["bandit-2"]}}
  14: {text: "Forsworn", data: {quote: "The Reach is yours by blood and by the Old Gods, whatever the Nords carved into Markarth's stone. For two years, while the Empire bled in the Great War, your people held that city — until Ulfric Stormcloak's militia shouted them from its walls and the King in Rags was locked away in Cidhna Mine. You wear hide and bone and feather, you answer to the hagravens, and you will drive the silver-thieves out of the Reach or die in the heather.", names: ["Brenach", "Aelis", "Morcant", "Ysbail", "Gwenhan", "Dralach", "Ciaran", "Muirne", "Faelan", "Ruadh"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Forsworn sword", damage: "d8", note: "a jagged blade hafted in antler"}, {name: "Forsworn armor", armor: 1, suit: 1, note: "of hide, bone, and feathers, daubed with war-paint"}, {name: "Forsworn headdress", armor: 1, note: "an antlered crown of bone and pelt"}], tables: ["forsworn-1", "forsworn-2"], table_1: ["forsworn-1"], table_2: ["forsworn-2"], reputation: {rep_forsworn: 1}}}
  15: {text: "Thieves Guild Burglar", data: {quote: "You learned the trade in the wet dark beneath Riften, where the Ratway runs and the Ragged Flagon never closes. The Guild's luck has been sour for years and nobody in the Cistern will say why — but a lock is only a question, and you have always known the answer.", names: ["Ardwen", "Brusi", "Kaela", "Tollan", "Merrit", "Sorren", "Veyra", "Gilmar", "Liesel", "Tanwen"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Dagger", damage: "d6"}, {name: "Leather armor", armor: 1, suit: 1}, {name: "Lockpicks", note: "a worn roll of them"}, {name: "Stick of charcoal for chalking the Guild's shadowmarks", size: "petty"}], tables: ["thieves-guild-burglar-1", "thieves-guild-burglar-2"], table_1: ["thieves-guild-burglar-1"], table_2: ["thieves-guild-burglar-2"], reputation: {rep_thieves_guild: 1, rep_guards: -1}}}
  16: {text: "Cutpurse", data: {quote: "You work the crush of market day in Whiterun's Plains District or under Solitude's arch, where a jostled merchant never feels the cut and a guard's eyes are always somewhere else. You owe nothing to any guild — just quick fingers, a quicker tongue, and a faster way out.", names: ["Arvid", "Lyssa", "Edrik", "Saffira", "Hrothi", "Mirra", "Corwin", "Drevia", "Pell", "Sable"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Knife", damage: "d6"}, {name: "Padded jerkin", armor: 1, suit: 1}, {name: "Rigged dice and a marked deck", size: "petty"}, {name: "False-bottomed coin pouch for hiding the day's take", size: "petty"}], tables: ["cutpurse-1", "cutpurse-2"], table_1: ["cutpurse-1"], table_2: ["cutpurse-2"]}}
  17: {text: "Nightingale", data: {quote: "Beneath the Thieves Guild lies an older shadow: the Nightingales, a trinity sworn to Nocturnal to guard the Ebonmere in the Twilight Sepulcher, in life and after death. The trinity is broken now — the Skeleton Key is lost, the Guild's luck has soured, and the Lady's favor comes thin and fitful. Yet she has marked you, and the Mistress of the Evergloam does not give her gifts for free.", names: ["Vanryn", "Sorvild", "Tavian", "Ilsabet", "Jorlan", "Evandra", "Mireth", "Othrel", "Corvel", "Selvys"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Hooded lantern", note: "shuttered to a thin beam,"}, {name: "Oil flask", uses: 6}, {name: "Black-bladed dagger", damage: "d6"}, {name: "Dark leather armor", armor: 1, suit: 1, note: "cut close and dyed for the night"}, {name: "Lockpicks"}, {name: "Shard of Ebonmere onyx", size: "petty", note: "cold to the touch, that hums faintly in deep shadow"}], tables: ["nightingale-1", "nightingale-2"], table_1: ["nightingale-1"], table_2: ["nightingale-2"]}}
  18: {text: "Dark Brotherhood Assassin", data: {quote: "The Night Mother has been silent for years, the Listener is dead, and what is left of the Family hides behind a black door in the pines of Falkreath. But the old prayers still work, a contract is still a contract, and you still answer the question at the door the way you were taught. What is the music of life? Silence, my brother.", names: ["Vitruvia", "Nerelyn", "Sirelle", "Dravos", "Sabeen", "Idrith", "Halvard", "Ebbe", "Nilvara", "Dervan"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Hooded lantern", note: "shuttered to a thin beam,"}, {name: "Oil flask", uses: 6}, {name: "Steel dagger", damage: "d6", note: "its blade oiled black"}, {name: "Black leathers and cowl", armor: 1, suit: 1}, {name: "Lockpicks"}, {name: "Paralytic poison", uses: 1, note: "coat a blade, and the next creature it wounds must pass a STR save or lose its next turn as its limbs lock"}], tables: ["dark-brotherhood-assassin-1", "dark-brotherhood-assassin-2"], table_1: ["dark-brotherhood-assassin-1"], table_2: ["dark-brotherhood-assassin-2"], reputation: {rep_dark_brotherhood: 1}}}
  19: {text: "Khajiit Smuggler", data: {quote: "The Nords do not let Khajiit through their gates, so the caravans camp outside the walls of Whiterun, Markarth, Solitude, and Windhelm — and this one walks the roads the guards do not watch, with Moon Sugar in the false bottom and a knife in the sleeve. The Nords call it smuggling. Khajiit calls it trade, and a long way from Elsweyr.", names: ["Ri'zadha", "Do'rasha", "Ma'khara", "Za'jhanni", "Dro'barra", "Khazira", "Jo'vasha", "J'khari", "Qa'zirr", "Ra'vashi Sugar-Whisker"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern of pierced brass", note: "your eyes need little light, but a buyer's do"}, {name: "Oil flask", uses: 6}, {name: "Curved Elsweyr scimitar", damage: "d8"}, {name: "Claw-knife", damage: "d6", note: "sheathed at the wrist"}, {name: "Caravan satchel with a false bottom and a twist of contraband Moon Sugar", size: "petty", note: "sacred to your people and illegal in the Holds"}, {name: "Masking incense that hides a smell the watch-dogs are trained to find", uses: 3}], tables: ["khajiit-smuggler-1", "khajiit-smuggler-2"], table_1: ["khajiit-smuggler-1"], table_2: ["khajiit-smuggler-2"], race: "Khajiit"}}
  20: {text: "Bard", data: {quote: "A blade ends a quarrel; a song ends a war — or starts one. You learned your craft at the Bards College in Solitude, where the Flame of Callisos burns beside the steps and every spring they burn King Olaf in effigy. You know the old verses and the new — \"Ragnar the Red,\" \"The Age of Aggression\" or \"The Age of Oppression,\" depending on who is buying — and you have learned that the right verse in the right ear is worth more than an army.", names: ["Halla", "Fenwick", "Brynja", "Lysanne", "Jarvi", "Ysolde", "Selwyn", "Liria", "Tarquin", "Gisla"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Lute", note: "well-traveled and a little out of tune"}, {name: "Padded doublet in the College's colors", armor: 1, suit: 1}, {name: "Dagger", damage: "d6"}], tables: ["bard-1", "bard-2"], table_1: ["bard-1"], table_2: ["bard-2"], reputation: {rep_bards_college: 1}}}
  21: {text: "College Apprentice", data: {quote: "The wind howls off the Sea of Ghosts, the bridge to the College of Winterhold is a knife of ice, and the Nords in the town below still blame you for the Great Collapse. But inside, the braziers never gutter and the Arcanaeum never closes. You came to learn, and you have the robe, the tome, and the singed eyebrows to prove how much is left to learn.", names: ["Sorelnar", "Reads-The-Stars", "Ja'rasha", "Aurel", "Elsinde", "Tavrin", "Merilwen", "Ondrin", "Ingirid", "Thalvyn"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Dagger", damage: "d6"}, {name: "College novice robes", size: "petty", note: "much patched"}, {name: "Charcoal and a notebook", size: "petty", note: "half-filled with formulae and bad sketches"}], tables: ["college-apprentice-1", "college-apprentice-2"], table_1: ["college-apprentice-1"], table_2: ["college-apprentice-2"], reputation: {rep_college: 1}}}
  22: {text: "Battlemage", data: {quote: "Let the College scholars debate theory behind their walls. You wed Destruction to good steel and march where the fighting is thickest — a blade in one hand, fire in the other, and armor enough to walk out the far side. The Nords sneer at \"elf-magic\" right up until the day it holds their line.", names: ["Varulf", "Asgerd", "Othmar", "Hrolf", "Bjarnhild", "Corvan", "Dagna", "Adalric", "Octavian", "Valeria"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Steel sword", damage: "d8"}, {name: "Steel cuirass", armor: 2, suit: 2, size: "bulky"}], tables: ["battlemage-1", "battlemage-2"], table_1: ["battlemage-1"], table_2: ["battlemage-2"]}}
  23: {text: "Spellsword", data: {quote: "You travel light and quick, with a blade of bound light in your hand and a spell for whatever it can't cut. Where the battlemage is a wall, you are a knife — in, around the guard, and gone before the spell's glow has faded from the air.", names: ["Vondrel", "Tessaly", "Irvane", "Kaelis", "Doravel", "Sennet", "Brisca", "Galdor", "Sarvyn", "Nerith"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Spell Tome: Bound Sword", note: "its cover cold and weightless"}, {name: "Dagger", damage: "d6", note: "for the days you are too tired to conjure"}, {name: "Leather armor", armor: 1, suit: 1}], tables: ["spellsword-1", "spellsword-2"], table_1: ["spellsword-1"], table_2: ["spellsword-2"]}}
  24: {text: "Conjurer", data: {quote: "Why carry an army when you can call one? You reach across the veil into Oblivion and drag back atronachs of fire and ice, scamps and clannfear, blades of bound light — and one day, you swear, a Dremora who will kneel. The Nords make the sign against evil when you pass. The Vigil of Stendarr takes notes.", names: ["Mordrel", "Ilvane", "Zenobia", "Oswin", "Hesper", "Malvane", "Draeva", "Serik", "Keldis", "Veyl"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Dagger", damage: "d6"}, {name: "Conjurer's robes", size: "petty", note: "stitched with Daedric script"}, {name: "Petty soul gem", size: "petty", note: "empty and waiting"}], tables: ["conjurer-1", "conjurer-2"], table_1: ["conjurer-1"], table_2: ["conjurer-2"]}}
  25: {text: "Necromancer", data: {quote: "The dead do not argue, do not tire, and do not flee. You learned the art that the Nords spit at and the Vigil of Stendarr burns for — to fill a soul gem, to call a corpse to its feet, to keep a thrall at your back. They are hunting you for it. Let them come; you have help.", names: ["Morgath", "Ulvene", "Idony", "Carrow", "Sevrin", "Nethra", "Corvina", "Mortimer", "Grisel", "Wenna"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "you have been known to burn worse than oil in it"}, {name: "Oil flask", uses: 6}, {name: "Dagger", damage: "d6", note: "its blade pitted black"}, {name: "Dark robes", size: "petty", note: "grave-dust in every fold"}, {name: "Black soul gem", size: "petty", note: "empty — the taboo at the heart of your craft"}], tables: ["necromancer-1", "necromancer-2"], table_1: ["necromancer-1"], table_2: ["necromancer-2"]}}
  26: {text: "Court Wizard", data: {quote: "Every Jarl keeps a wizard — Farengar in Dragonsreach, Calcelmo beneath Markarth, Wuunferth in the Palace of the Kings — and you have been one, or trained at the elbow of one. A Jarl's roof is a warm and dangerous place. You read the omens, ward the hall, brew what the steward dare not name, and keep an ear at the door of every conspiracy in the Hold. The throne is never the most powerful thing in the room, but you must always let it believe it is.", names: ["Faerindel", "Caemyr", "Elphine", "Vireth", "Maudric", "Therond", "Gwenlyn", "Aurenne", "Sidonie", "Halvor"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Staff of office", damage: "d6", note: "carved with your Jarl's sigil"}, {name: "Court robes", size: "petty", note: "finer than they are warm"}, {name: "Ink", size: "petty", note: "quills, and a locked ledger of the Hold's secrets"}], tables: ["court-wizard-1", "court-wizard-2"], table_1: ["court-wizard-1"], table_2: ["court-wizard-2"]}}
  27: {text: "Telvanni Mage", data: {quote: "You are Dunmer and a wizard of House Telvanni, and you have not the patience to pretend either is a small thing. The other Great Houses crawl and scheme; the Telvanni grow towers of living fungus, climb them without stairs, and study what they please. Power answers to talent, and talent alone. You came to Skyrim by way of Solstheim, where Master Neloth keeps Tel Mithryn — and the n'wah who forget what you are tend not to forget twice.", names: ["Sarvesi", "Tervas", "Tirvos", "Drelvyn", "Savilo", "Nethys", "Aroni", "Vunela", "Othreni", "Brelvis"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Luminous fungus cap cut from a Telvanni tower", size: "petty", note: "kept damp, it glows like a candle"}, {name: "Staff of spore-wood", damage: "d6"}, {name: "Robes of House Telvanni", size: "petty", note: "finer than anything you will admit to wanting"}], tables: ["telvanni-mage-1", "telvanni-mage-2"], table_1: ["telvanni-mage-1"], table_2: ["telvanni-mage-2"], race: "Dunmer"}}
  28: {text: "Restoration Healer", data: {quote: "Restoration is the quiet school, mocked by Destruction's loud children and half the College besides. Let them sneer. You learned to close a wound with a word, to raise a ward that turns aside a killing spell, and to make the walking dead recoil from the light in your hands. When the fighting is done, they all come crawling to you.", names: ["Merrin", "Solvi", "Ailis", "Ottilie", "Ansgar", "Ingefrid", "Hjalla", "Rosamund", "Mivari", "Halle"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "for long vigils at the sickbed"}, {name: "Oil flask", uses: 6}, {name: "Iron mace", damage: "d8", note: "a blunt weapon, so you spill no blood you would only have to mend"}, {name: "Healer's robes", size: "petty"}, {name: "Bandages and simples", uses: 3, note: "bind a wound after a fight to restore 1 STR"}], tables: ["restoration-healer-1", "restoration-healer-2"], table_1: ["restoration-healer-1"], table_2: ["restoration-healer-2"]}}
  29: {text: "Enchanter", data: {quote: "Any fool with a tome can throw fire. You do the patient work: you catch a soul in glass, you unmake an old blade to learn how it was made, and you bind that power into steel that will carry it long after the spell that made it is forgotten. Everything you own hums a little. You like it that way.", names: ["Ancelin", "Mireille", "Iskra", "Galvyn", "Emrick", "Seravel", "Belisande", "Vaskar", "Odalys", "Cosima"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Enchanter's knife", damage: "d6", note: "for scoring sigils into haft and hilt"}, {name: "Common soul gem", size: "petty", note: "filled; a white light turns slowly within it"}, {name: "Soul-scribing tools and sigil chalk", size: "petty"}], tables: ["enchanter-1", "enchanter-2"], table_1: ["enchanter-1"], table_2: ["enchanter-2"]}}
  30: {text: "Alchemist", data: {quote: "You know what a flower is for, and a fang, and a death's-head mushroom. The hand that mixes a draught to mend a fevered child can mix a thing to stop a heart between one breath and the next, and no apothecary worth the name pretends otherwise. People buy your cures and fear your other work. Both keep the lamp lit.", names: ["Fennick", "Tamsyn", "Petronella", "Linnea", "Dunstan", "Hakkon", "Verena", "Oriana", "Mixes-In-Moss", "Clemence"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Apothecary's knife", damage: "d6", note: "for harvesting roots, fangs, and worse"}, {name: "Portable alchemy kit", size: "bulky", note: "a folding mortar, alembic, and retort, so you can brew wherever you can spend a quiet day"}, {name: "Pouch of sorted ingredients", size: "petty", note: "dried, labeled, and known"}], tables: ["alchemist-1", "alchemist-2"], table_1: ["alchemist-1"], table_2: ["alchemist-2"]}}
  31: {text: "Priest of the Divines", data: {quote: "You took your vows before the altar and learned to carry a god in your hands. Once they were Nine. Since the White-Gold Concordat, the Thalmor say Eight, and the empty pedestal where Talos stood is a wound you keep close. Roll for the Divine you serve, or choose.", names: ["Brother Wystan", "Sister Theodora", "Brother Aelric", "Sister Serafine", "Brother Thorvald", "Sister Coralie", "Brother Osric", "Sister Elowen", "Brother Benedikt", "Sister Maudra"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "hooded for vigils"}, {name: "Oil flask", uses: 6}, {name: "Steel mace", damage: "d8", note: "the priest's weapon, blunt so as to spill no blood"}, {name: "Hooded temple robes", size: "petty", note: "counts as warm clothing"}, {name: "Holy symbol of your Divine", size: "petty"}], tables: ["priest-of-the-divines-1", "priest-of-the-divines-2"], table_1: ["priest-of-the-divines-1"], table_2: ["priest-of-the-divines-2"]}}
  32: {text: "Moth Priest", data: {quote: "The Cult of the Ancestor Moth keeps the Elder Scrolls in the White-Gold Tower, and you were one of its readers. Each reading takes a little of your sight — the long fast, the chanting, the moths settling on your hands, and then every age at once, pouring in through your eyes. You left the Imperial City for Skyrim half-blind and wholly changed, and the Scrolls have not finished with you.", names: ["Vibia", "Orestes", "Aemilian", "Silvanus", "Severan", "Eudora", "Coriolan", "Faustin", "Lucienne", "Vesna"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "carried more for others' eyes than your own"}, {name: "Oil flask", uses: 6}, {name: "Walking staff", damage: "d6", note: "a blind scholar's third leg"}, {name: "Silk robes of the Cult", size: "petty", note: "embroidered with sleeping moths"}, {name: "Silken blindfold", size: "petty", note: "worn over clouded eyes"}], tables: ["moth-priest-1", "moth-priest-2"], table_1: ["moth-priest-1"], table_2: ["moth-priest-2"]}}
  33: {text: "Pilgrim of Kynareth", data: {quote: "You walk the high places and breathe with the wind. Kynareth — Kyne, to the Nords — is goddess of the heavens and the air, who gave her breath to the world and, the Greybeards say, the Voice to Men. You have climbed the Seven Thousand Steps and knelt at every tablet, prayed beneath the Eldergleam, and followed her hawks along the ridges. You do not Shout; the Voice is not your road. You simply listen, and the wind listens back.", names: ["Ulfhild", "Brenna", "Kolbeinn", "Eirny", "Skjold", "Halvdan", "Geirny", "Asvor", "Gerdrun", "Sigvor"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Walking staff", damage: "d6", note: "worn smooth by long roads and steep climbs"}, {name: "Pilgrim's robes", size: "petty", note: "counts as warm clothing; weatherbeaten"}, {name: "Wreath of mountain flowers", size: "petty", note: "kept fresh by prayer"}], tables: ["pilgrim-of-kynareth-1", "pilgrim-of-kynareth-2"], table_1: ["pilgrim-of-kynareth-1"], table_2: ["pilgrim-of-kynareth-2"]}}
  34: {text: "Sage", data: {quote: "Where others see only dust and dead tongues, you see a map. You have spent your life among books — the histories of the Empire, the dead script of the Dwemer, the cramped marginalia of mad mages — and you can read what others cannot. The Arcanaeum knows your face; Urag gro-Shub even tolerates it. A sharp memory is the only weapon you have ever truly needed.", names: ["Evander", "Cassian", "Imelda", "Anselm", "Hesketh", "Aldwin", "Rufina", "Tyrvald", "Hallbera", "Keeps-The-Ink"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "shuttered for late study"}, {name: "Oil flask", uses: 6}, {name: "Letter-opener", damage: "d6", note: "keen enough for vellum or a throat"}, {name: "Scholar's satchel of notes and chalk", size: "petty"}, {name: "Spectacles on a chain", size: "petty"}], tables: ["sage-1", "sage-2"], table_1: ["sage-1"], table_2: ["sage-2"]}}
  35: {text: "Wise Woman", data: {quote: "The village comes to you when the priest cannot help. You read the omens in smoke and bird and bone, you know which herb mends and which kills — snowberry and blue mountain flower, deathbell and nightshade — and you keep the old charms against the things that walk the cold nights. You are no hagraven and no Glenmoril witch, only a mortal woman who listens to the land, and is trusted for it.", names: ["Agnetha", "Grelda", "Hervor", "Ingunn", "Jofrid", "Ranveig", "Svanhild", "Gyrid", "Old Aud", "Hrodny"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Horn lantern"}, {name: "Oil flask", uses: 6}, {name: "Carved bone knife", damage: "d6", note: "for cutting herbs and casting the runes"}, {name: "Herb pouch", uses: 3, note: "a poultice after a fight restores 1 STR"}, {name: "Bundle of charms and dried herbs", size: "petty"}], tables: ["wise-woman-1", "wise-woman-2"], table_1: ["wise-woman-1"], table_2: ["wise-woman-2"]}}
  36: {text: "Blacksmith", data: {quote: "You are known by the ring of the hammer and the hiss of the quench. Where others see ore and old iron, you see the blade or the cuirass waiting inside it. You came up at a forge — a Hold-smith's, a Legion armorer's, an Orc stronghold's — you bear the burns to prove it, and every good thing you own you made with your own two hands.", names: ["Haldor", "Ormr", "Gunnvor", "Tordis", "Stigr", "Sveinn", "Folkvar", "Adelheid", "Uzbakh gro-Lurz", "Morga gra-Shul"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "soot-black from years over your anvil"}, {name: "Oil flask", uses: 6}, {name: "Smith's hammer", damage: "d6", note: "for the anvil and, at need, for skulls"}, {name: "Iron tongs and a cured-hide apron", size: "petty"}, {name: "Pouch of ingots and steel offcuts", note: "worth 2d6 × 5 Septims to any smith"}], tables: ["blacksmith-1", "blacksmith-2"], table_1: ["blacksmith-1"], table_2: ["blacksmith-2"]}}
  37: {text: "Hunter", data: {quote: "The wild does not forgive the careless; you have buried friends who forgot that. Elk on the tundra, goats on the crags, a sabre cat's tracks in fresh snow — the bow, the snare, and the patient hour before dawn are your prayers, and Kyne answers them. You take only what you need, and you thank her for it.", names: ["Eskel", "Hallfrid", "Skeggi", "Ylva", "Vemund", "Oddvar", "Hroald", "Asleif", "Grimwald", "Thora Two-Arrows"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Hunting bow", damage: "d6", size: "bulky"}, {name: "Skinning knife", damage: "d6"}, {name: "Fur-lined leathers", armor: 1, suit: 1, note: "counts as warm clothing"}, {name: "Snare wire and a gutting hook", size: "petty", note: "for rabbits, foxes, and ptarmigan"}], tables: ["hunter-1", "hunter-2"], table_1: ["hunter-1"], table_2: ["hunter-2"]}}
  38: {text: "Miner", data: {quote: "You have spent more of your life under the stone than over it — the silver of Cidhna Mine, the gold of Kolskeggr, the iron of Redbelly and Iron-Breaker, the quicksilver of Dawnstar. You know the weight of the dark, the songs that keep a crew breathing, and the cold smell of a vein about to give. The pick is the only tool you ever truly needed, and more than once the only weapon.", names: ["Brandvar", "Hallkel", "Kolbrun", "Orvar", "Dagfinn", "Thrand", "Grisla", "Bolverk", "Njal", "Gulbak gro-Ushra"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Miner's lantern", note: "made to hang from a roof-beam"}, {name: "Oil flask", uses: 6}, {name: "Pickaxe", damage: "d8", note: "for the rock face and whatever crawls out of it"}, {name: "Pouch of raw ore and geode chips", note: "worth 2d6 × 5 Septims to a smelter"}, {name: "Rope (25 ft) and a few iron spikes", size: "petty"}], tables: ["miner-1", "miner-2"], table_1: ["miner-1"], table_2: ["miner-2"]}}
  39: {text: "Sailor", data: {quote: "You learned your craft on the gray water of the Sea of Ghosts, where the ice-floes grind in the fog and the slaughterfish boil under a slow hull. You have crewed East Empire traders out of Solitude, fishing boats out of Dawnstar, and the crossing from Windhelm to Raven Rock. You know the rigging, the tides, and the harpoon, and you have hauled enough horker and netted enough catch to fear neither.", names: ["Hafgrim", "Ottarr", "Gunnhild", "Steinar", "Ormarr", "Eilif", "Tjorvi", "Arngrim", "Solla", "Swims-Past-Wrecks"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Storm lantern", note: "sealed against the spray"}, {name: "Oil flask", uses: 6}, {name: "Harpoon", damage: "d8", note: "for horker, for big fish, and for boarders"}, {name: "Fishing net and a coil of line", size: "petty"}, {name: "Oilskins and a fur hood", size: "petty", note: "counts as warm clothing"}], tables: ["sailor-1", "sailor-2"], table_1: ["sailor-1"], table_2: ["sailor-2"]}}
  40: {text: "Farmhand", data: {quote: "You were born to the soil — the wheat of the Whiterun tundra, the cabbages and leeks of a Rift homestead, the Rorikstead fields where they say the harvest never fails. You worked it from the day you could lift a pail. There is no glory in it and never was: only the rising at dawn, the aching back, and the long memory of the land. Then a debt, a dream, or a burning came, and you took up your tools and walked off into a wider, harder world.", names: ["Ragnfrid", "Hedda", "Arnulf", "Oddgeir", "Arnkel", "Eyvind", "Hlif", "Sturla", "Botolf", "Svein"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Tin lantern", note: "dented from years of dark mornings in the byre"}, {name: "Oil flask", uses: 6}, {name: "Woodcutter's axe", damage: "d8", note: "for the woodpile, the fence, and the wolf at the gate"}, {name: "Work gloves and a patched wool cloak", size: "petty", note: "counts as warm clothing"}, {name: "Sack of seed-grain and a hank of twine", size: "petty"}], tables: ["farmhand-1", "farmhand-2"], table_1: ["farmhand-1"], table_2: ["farmhand-2"]}}
  41: {text: "Merchant", data: {quote: "The road is your shop and your home both. You have hauled goods over every pass in Skyrim — Markarth silver, Riften mead, Windhelm's Dunmer wares, whatever the East Empire Company unloads at Solitude — through bandit country, blizzard, and worse, because a trader who never travels never eats. You know the worth of a thing to the Septim, you know a swindle when you see one, and you have a friend in every Hold who owes you a favor.", names: ["Gisela", "Corwen", "Lysander", "Pieter", "Osvald", "Renata", "Hanne", "Idris", "Tildrin", "Counts-The-Coins"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Road lantern"}, {name: "Oil flask", uses: 6}, {name: "Iron-shod walking staff", damage: "d6", note: "for the road, the mud, and the unwise robber"}, {name: "Ledger", size: "bulky", note: "scales, and a strongbox of trade goods; worth 3d6 × 10 Septims to the right buyer"}], tables: ["merchant-1", "merchant-2"], table_1: ["merchant-1"], table_2: ["merchant-2"], companion: "pack-mule"}}
  42: {text: "Skaal Hunter", data: {quote: "The All-Maker gives, and the All-Maker takes, and the wise hunter takes only what is given. You were raised in the Skaal village on the snowbound north coast of Solstheim, where the old Nord ways were never forgotten: the six Stones of the All-Maker, the horker hunt, the long watch against the Adversary. Now the Stones are falling silent, the village folk walk in their sleep to build something no one remembers, and you have gone out into the world to learn why.", names: ["Bjarki", "Holmfrid", "Isgerd", "Tjodhild", "Rannvi", "Sigtrygg", "Varinn", "Hjalmgerd", "Frodi", "Aslak"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Horker-fat lamp", note: "carved with the All-Maker's mark"}, {name: "Oil flask", uses: 6}, {name: "Hunting bow", damage: "d6", size: "bulky"}, {name: "Bone hatchet", damage: "d6"}, {name: "Skaal coat of fur and hide", armor: 1, suit: 1, note: "counts as warm clothing"}], tables: ["skaal-hunter-1", "skaal-hunter-2"], table_1: ["skaal-hunter-1"], table_2: ["skaal-hunter-2"], reputation: {rep_skaal: 1}, race: "Nord"}}
  43: {text: "Argonian Shadowscale", data: {quote: "You hatched under the sign of the Shadow, and so the Hist gave you to the Shadowscales before you could walk: the royal assassins of Black Marsh, trained in the ways of the Dark Brotherhood and sworn to its Tenets. You were among the last. The training grounds at Archon have fallen silent, the tradition is dying, and you came north to Skyrim with a blade, a lock-pick, and the long patience of the deep water.", names: ["Sleeps-In-Reeds", "Hunts-Below-Water", "Many-Knives", "Dar-Meema", "Neeta-Lei", "Seven-Silent-Stones", "Waits-Beneath", "Tail-Of-Night", "Keel-Of-Stone", "Swift-Current"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Shuttered lantern", note: "its light hooded to a thread"}, {name: "Oil flask", uses: 6}, {name: "Curved Shadowscale dagger", damage: "d6", note: "blackened and soundless in the draw"}, {name: "Garrote wire", size: "petty", note: "a foe you seize unaware from behind cannot cry out while you struggle"}, {name: "Dark wrappings", armor: 1, suit: 1, note: "the dyed leathers of the sect"}], tables: ["argonian-shadowscale-1", "argonian-shadowscale-2"], table_1: ["argonian-shadowscale-1"], table_2: ["argonian-shadowscale-2"], race: "Argonian"}}
  44: {text: "Dunmer Ashlander", data: {quote: "Your people never bowed to the Great Houses or their false Tribunal gods. You honored the ancestors and the Good Daedra — Azura above all — and followed the herds across the ashlands of Vvardenfell. Then Red Mountain burst, the sky fell as ash, the Argonians came over the border, and your tribe took up its yurts and walked. Now you wander Skyrim among Nords who spit at \"gray-skins,\" with nothing but your ancestors, your spear, and the long road north.", about: "You are old as Men count it: the Red Year lies almost two centuries behind you, and you remember it. Note an age to match rather than rolling one — the Dunmer live long.", names: ["Ninsar", "Zabir", "Kulmassi", "Shalit", "Anammu", "Sinnurab", "Addunu", "Ilabi", "Zelaku", "Mammasi"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Guar-hide lamp"}, {name: "Oil flask", uses: 6}, {name: "Chitin spear", damage: "d8", note: "its head cut from a great beetle's shell"}, {name: "Chitin shield", armor: 1}, {name: "Chitin armor", armor: 1, suit: 1, note: "plates of lacquered shell over layered cloth"}], tables: ["dunmer-ashlander-1", "dunmer-ashlander-2"], table_1: ["dunmer-ashlander-1"], table_2: ["dunmer-ashlander-2"], race: "Dunmer"}}
  45: {text: "Bosmer Hunter", data: {quote: "Y'ffre set the Green Pact, and you keep it even here: you eat only meat, you eat what you kill, and you harm no living plant for your own use. Valenwood belongs to the Thalmor now, and a Bosmer in Skyrim is taken for a Dominion spy or a Dominion refugee. You are neither. You are a hunter, and the bow was your kind's gift to the world.", names: ["Ranglas", "Elegir", "Tarnil", "Vindorel", "Elaron", "Sylvril", "Faelwen", "Lorthin", "Brenwe", "Gwilith"], gold: "3d6", gear: [{name: "Rations", uses: 3, note: "strips of dried meat, nothing else"}, {name: "Torch", uses: 3}, {name: "Hunting bow", damage: "d6", size: "bulky", note: "loosed in one smooth motion"}, {name: "Skinning knife", damage: "d6"}, {name: "Leaf-dyed leathers", armor: 1, suit: 1, note: "the mottled greens of the deep forest"}], tables: ["bosmer-hunter-1", "bosmer-hunter-2"], table_1: ["bosmer-hunter-1"], table_2: ["bosmer-hunter-2"], race: "Bosmer"}}
  46: {text: "Briarheart", data: {quote: "An unusual background — clear it with your Warden first. A hagraven cut the living heart from your breast, set it steaming in a bowl, and pressed a thorned briar into the wet hollow. \"Heart of thorn, bones of the wild — in life, Forsworn; rise from death, blood of our blood.\" You rose stronger than any mortal, and in pain that never, ever stops.", about: "You are a Forsworn warrior remade by the deepest rite of the Reach. Briarhearts lead the redoubts — the matron's chosen, the ones who hold the tower key and stand last at the gate. You are not undead: ordinary healing mends you, and the Vigil's sun-spells find nothing to burn. But pull the briar from your chest and you fall as surely as any corpse. Note your race as normal (a Breton of the Reach, most likely); your WIL is your own. The full edges and costs are in Playing Unusual PCs; in short: - Tireless vigor. You need no sleep and are never Deprived by exhaustion; a short rest still restores HP as the briar floods you with stolen strength. - The heart's strength. You never need a save to lift, hold, or shove anything a strong mortal could manage with real effort, and a single blow never staggers you or drives you back. - The thorn behind the ribs. Pull the briar free — from a helpless or willing Briarheart, or by a knowing hand in Downtime — and you die at once, with no Critical Damage save. Your enemies in the Reach know it. - The matron's leash. The hagraven who made you can feel where you are, and may compel, summon, or curse you; her death frees you from the leash, but not from the briar. - A thing of the briar. Mortals who know your nature treat you one step worse on the Reaction ladder, and the Vigil of Stendarr counts you a thing to be put down (Vigil of Stendarr −1). - No rest from the ache. Restoration mends your wounds, but nothing lifts the pain of the thorn; the Warden may call for a WIL save when the agony spikes at the worst moment.", names: ["Dubhach", "Fiachra", "Niamh", "Tadhg", "Cairbre", "Eithne", "Fionnuala", "Scoithin", "Bebhinn", "Aengus"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Forsworn sword", damage: "d8", note: "a jagged blade hafted in antler"}, {name: "Briarheart's war-harness of hide", armor: 1, suit: 1, note: "bone, and leather straps; cut open over the briar"}, {name: "Spare briar heart wrapped in oilcloth", size: "petty", note: "taken from a fallen brother; an alchemist would pay 1d6 × 10 Septims for it"}], tables: ["briarheart-1", "briarheart-2"], table_1: ["briarheart-1"], table_2: ["briarheart-2"], nature: "briarheart", unusual: true, reputation: {rep_vigil: -1}}}
  47: {text: "Vampire Fledgling", data: {quote: "An unusual background — clear it with your Warden first. The fever broke three nights ago and left you cold, and the dawn that should have warmed your face now blisters it. You are newly of the blood, and the hunger has only just begun to teach you what you are.", about: "Molag Bal's curse runs in your veins where blood once did. You were bitten — by a lord of frozen Castle Volkihar, or by some lesser get of that ancient clan hiding in a Skyrim cave — and Sanguinare Vampiris took root and blossomed. You do not age, you do not sicken, and the cold no longer troubles you; but sunlight is poison, fire is your bane, and you must drink the blood of the living or wither. Choose your race as normal — you were that, in life. The full edges and costs live in Playing Unusual PCs; the short of it: - The blood sustains. Once per day, feed on a sleeping, willing, or helpless victim to clear all Fatigue and shed the Deprived condition, as a full night's rest would. The victim survives, weakened: it loses 1d4 STR. - Drain. Your bite or draining touch is an unarmed attack (d6) that ignores Armor. Once per combat — or whenever the victim is willing or helpless — the HP it deals is restored to you. Against a willing or helpless victim it is Enhanced. - Undying. You do not age and are immune to all mundane disease. You see in the dark as if by daylight, and cold and snow alone never leave you Deprived. - Sunlight withers you. In direct sun you are Deprived and your drain restores nothing; shade and heavy cloth hold it off, open noon does not. - Fire is your bane. Any fire attack against you is Enhanced. - The hunger. Go a full day without feeding and you are Deprived until you do. - A thing of the night. Where your nature is known, Reactions shift one step worse; you count as Volkihar +1 and Dawnguard / Vigil of Stendarr −1. No shrine or cure potion lifts the curse — only Falion's rite in Morthal, or taking on Lycanthropy.", names: ["Aldrec", "Isaura", "Mireval", "Sabetha", "Vesper", "Morwyn", "Gyda", "Svala", "Corvinus", "Hallgrim"], gold: "3d6", gear: [{name: "Rations", uses: 3, note: "you can still eat, though it sustains nothing now"}, {name: "Hooded lantern", note: "for the eyes of the living"}, {name: "Oil flask", uses: 6}, {name: "Steel dagger", damage: "d6", note: "worn since your living days"}, {name: "Traveling cloak of heavy black wool", size: "petty", note: "counts as warm clothing; deep-hooded against the sun"}, {name: "Empty blood-phial of cut glass", size: "petty", note: "to carry a draught against a sunless day"}], tables: ["vampire-fledgling-1", "vampire-fledgling-2"], table_1: ["vampire-fledgling-1"], table_2: ["vampire-fledgling-2"], nature: "vampire", unusual: true, enhanced_by: ["fire"], reputation: {rep_volkihar: 1, rep_dawnguard: -1, rep_vigil: -1}}}
  48: {text: "Werewolf", data: {quote: "An unusual background — clear it with your Warden first. You carry the Beast Blood of Hircine, but no Companion's oath binds it. Somewhere out in the pines you took the curse alone, and now the moons pull at you and the hunger does not care whose throat it finds.", about: "You are Hircine-touched: a mortal who carries the wolf of the Hunt under your skin, but outside the Circle of the Companions in Jorrvaskr. Yours is a feral strain — a Glenmoril witch's gift, a forbidden rite, a bite survived where you should have died. The change is permanent; it ends only at Ysgramor's Tomb, or by taking on Vampirism, since the two curses cannot share one body. Choose your race as normal; in mortal shape you are still that, and your WIL is your own. The full edges and costs are in Playing Unusual PCs; in brief: - Beast Blood. You are immune to all mundane disease, you can follow a scent-trail a mortal would lose, and you smell fresh blood and fear nearby. - The Change. Once per day you may take Beast Form at will: claws d6+d6 or a bite d8, +1 Armor from thick hide (to the cap of 3), terrifying speed, and, once per transformation, a Howl of Terror (every enemy who hears it makes a WIL save or flees for the rest of the round). You revert at the scene's end, or earlier on a WIL save. - Silver bites deep. Any attack against you with a silver weapon is Enhanced, in beast form or out. - A beast carries nothing. While Transformed you cannot use gear, channel a Spell Tome, loot, pick locks, open containers, or speak — only run, rend, and feed — and you recover no HP or Fatigue. - The hunger after the hunt. After you revert, you must feed on a fresh kill before the next watch ends, or be Deprived until you do. - The Hunt is known. Where your curse is recognized, Reactions shift one step worse; the Silver Hand and most steadings would see you put down.", names: ["Ulfhedinn", "Ketilbjorn", "Vigdjarf", "Skarde", "Throa", "Hroarr", "Styrmir", "Grimhild", "Hrafnkel", "Varga"], gold: "3d6", gear: [{name: "Rations", uses: 3, note: "raw meat suits you fine"}, {name: "Horn lantern"}, {name: "Oil flask", uses: 6}, {name: "Heavy war axe", damage: "d8", note: "for the nights you keep your shape"}, {name: "Wolf-pelt jerkin and wraps", armor: 1, suit: 1, note: "counts as warm clothing; cut loose for the change"}, {name: "Hunter's cord of teeth and claws", size: "petty", note: "trophies of the Hunt"}], tables: ["werewolf-1", "werewolf-2"], table_1: ["werewolf-1"], table_2: ["werewolf-2"], nature: "werewolf", unusual: true, enhanced_by: ["silver"], reputation: {rep_companions: 1}}}
  49: {text: "Dremora", data: {quote: "An unusual background — clear it with your Warden first. A conjurer spoke a name across the Liminal Barrier and you answered it, dragged out of Oblivion into a mortal shape that needs nothing the living need — and is welcome nowhere they walk.", about: "You are one of the Dremora — the Kyn, the warrior-caste of the Deadlands — sworn to Mehrunes Dagon's clans or another Prince's, and ranked as the Kyn rank themselves: churl, caitiff, kynval, kynreeve, kynmarcher. You are bound out of Oblivion and anchored to Mundus by a name, a debt, or a binding that broke wrong. You do not become a Dremora; you are one, and you begin play already bound. You still pick a \"race\" for the shape you wear and how others first read you, but its trait is suppressed — your Daedric nature overrides it. The full edges and costs are in Playing Unusual PCs; the short of it: - No mortal needs. No food, water, sleep, or breath; you cannot be Deprived by hunger, thirst, exhaustion, or drowning, and you are immune to inhaled poison and gas. - Daedric flesh. Immune to all mundane disease, and to Vampirism and Lycanthropy alike; the curses of Mundus cannot take root in Oblivion-stuff. - Banished, not slain. When your STR is reduced to 0 you are not killed: your vestige is cast back to Oblivion to re-form. With the Warden's leave you may return after a season (a new arc). - Born to war. You never make the DEX save to act in the first round of combat; you always act. - No healing for the living. Restoration, potions, temples, and healers do not mend you. Lost STR is repaired only by Conjuration or Daedric rites (a Downtime Action with a willing conjurer restores 1d6 STR), or by a season's reconstitution in Oblivion. A short rest still restores your HP. - A stranger to Mundus, bound by a pact. Mortals' Reactions start one step worse (Vigil of Stendarr −1); the terms of your binding are a leash the Warden may pull, and a rival conjurer may try to seize your name.", names: ["Vaskhar", "Drezmodel", "Xyvash", "Ulkanath", "Sarkhesh", "Myrvak", "Tezrakhal", "Ozhmir", "Kaelthaz", "Rhuuvek"], gold: "3d6", gear: [{name: "Rations", uses: 3, note: "carried for mortal company, not need"}, {name: "Mote of bound flame in a glass sphere", size: "petty", note: "casting a candle's light that needs no oil"}, {name: "Daedric sword", damage: "d8", note: "black and red and faintly warm; a fortune, to anyone who dared buy it"}, {name: "Dremora warplate of light", armor: 1, suit: 1, note: "overlapping black scales"}, {name: "Binding-glyph by which you were called", size: "petty", note: "scribed on a scrap of skin; whoever holds it holds your leash"}], tables: ["dremora-1", "dremora-2"], table_1: ["dremora-1"], table_2: ["dremora-2"], nature: "dremora", unusual: true, reputation: {rep_vigil: -1}}}
  50: {text: "Draugr Revenant", data: {quote: "An unusual background — clear it with your Warden first. You woke in the dark of your own barrow with your wits intact where the others keep only hatred, and you climbed out of the sarcophagus a thinking, walking dead thing — and no temple, no potion, no healer alive can ever knit you whole again.", about: "You are an awakened Nordic dead: a warrior or tomb-warden laid in a Skyrim barrow in the age of the Dragon Priests, risen and aware, holding your mind where most draugr keep only a guttering rage. You are dry, cold, and tireless, sustained by the old Nordic death-magic rather than by blood or breath. Something woke you with your wits whole — a sundered ward, an oath unkept, the pull of a word wall — and you begin play already risen. Choose the race you were in life (a Nord, most likely). The full edges and costs live in Playing Unusual PCs; in brief: - The grave needs nothing. No food, water, air, or sleep; you cannot be Deprived by hunger, thirst, exhaustion, or drowning, and you are immune to inhaled poison and gas. - Cold and tireless. Immune to all mundane disease and to mind-affecting effects: you never save to resist being swayed, frightened, or charmed. - Barrow-hardened. Your preserved flesh turns blades: you have 1 Armor even when unarmored. Worn body armor replaces it rather than adding to it; a shield or helmet still adds +1 each (to the cap of 3). - No healer mends the dead. No Restoration, potion, temple, or healer can knit you. You recover lost STR only by resting a full week within a Nordic barrow (which restores your other lost Attributes too), or by absorbing the life of a creature you slay (a kill restores 1d6 STR, once per day). A short rest still restores your HP. - A walking corpse. Mortals' Reactions start one step worse (Vigil of Stendarr −1); most folk flee or call for a priest, and many Nords would see you returned to your tomb. - Fire and the sacred. Fire, and Restoration turned against the undead (a sun-spell, a priest's rite of banishing), bite at you: any such attack against you is Enhanced. - Bound to the barrow-ways. Hallowed ground, word-wall wards, and Dragon Priest rites may compel, bar, or unmake you where they would only unsettle a mortal; the Warden decides when the old magic has a claim.", names: ["Thjodolf", "Arnbjorg", "Vigmund", "Asgaut", "Gunnlaug", "Throndir", "Bergthora", "Vandrad", "Hjordgar", "Sigrlami"], gold: "3d6", gear: [{name: "Rations", uses: 3, note: "for living companions; they do nothing for you"}, {name: "Torch", uses: 3}, {name: "Ancient Nord greatsword", damage: "d10", size: "bulky", qualities: ["two-handed"], note: "buried with you"}, {name: "Burial circlet of tarnished gold and worked iron", size: "petty", note: "the honor you were laid to rest in"}, {name: "Small stone tablet of your deeds", size: "petty", note: "carved in the old runes by those who buried you"}], tables: ["draugr-revenant-1", "draugr-revenant-2"], table_1: ["draugr-revenant-1"], table_2: ["draugr-revenant-2"], nature: "draugr-revenant", unusual: true, natural_armor: 1, enhanced_by: ["fire", "sun"], reputation: {rep_vigil: -1}}}
---
table: backgrounds-mortal
title: "Backgrounds (mortal)"
description: "The d50 backgrounds without the five unusual ones: what a roll of 46-50 rerolled comes to, for tables that haven't cleared them."
about: "{quote}"
dice: d45
source: roll-tables/backgrounds#d50-backgrounds--26-to-50
entries:
  1: {text: "Companion", data: {quote: "The mead hall is loud, the hearth is warm, and your shield-siblings have your back. You took up arms in Jorrvaskr, the upturned longship that has sheltered the heirs of Ysgramor's Five Hundred for nearly five thousand years, and the old blood still runs in the work: a contract honored, a wrong righted, glory won by the strength of your arm.", names: ["Brandr", "Sigrun", "Torvald", "Ingrid", "Ulfhrafn", "Svanlaug", "Hallbjorn", "Kolskegg", "Asbrand", "Gudrun"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Steel sword", damage: "d8"}, {name: "Round shield painted with the Companions' crest", armor: 1}, {name: "Hide armor", armor: 1, suit: 1}, {name: "Mead horn of Jorrvaskr", size: "petty"}], tables: ["companion-1", "companion-2"], table_1: ["companion-1"], table_2: ["companion-2"], reputation: {rep_companions: 1}}}
  2: {text: "Housecarl", data: {quote: "\"I am sworn to carry your burdens.\" You gave your oath to a Jarl or a Thane, and an oath of Skyrim is iron. Their life is your charge, their hall your home, their enemies your own — and you will stand between them and the blade if it comes to that.", names: ["Hjalmar", "Dagrun", "Eirik", "Thyra", "Orm", "Vigrun", "Bjarni", "Solveig", "Hallvard", "Ragnhild"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Steel sword", damage: "d8"}, {name: "Steel mail cuirass with your Hold's colors", armor: 2, suit: 2, size: "bulky"}, {name: "Carved mead cup of your Hold", size: "petty"}], tables: ["housecarl-1", "housecarl-2"], table_1: ["housecarl-1"], table_2: ["housecarl-2"]}}
  3: {text: "Imperial Legionnaire", data: {quote: "Lock shields. Hold the line. You learned to fight not as one blade but as one wall, drilled in the iron discipline of the Legion under the dragon banner of Cyrodiil. The Empire is old and tired and far from home — but it is still the Empire, and you still answer the horn.", names: ["Marcus", "Aurelia", "Aulus", "Lucilla", "Cornelius", "Severia", "Galerius", "Octavia", "Decius", "Petronia"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Imperial sword", damage: "d8"}, {name: "Imperial shield bearing the red dragon", armor: 1}, {name: "Imperial light armor of boiled leather and bronze", armor: 1, suit: 1}, {name: "Legion field manual", size: "petty"}], tables: ["imperial-legionnaire-1", "imperial-legionnaire-2"], table_1: ["imperial-legionnaire-1"], table_2: ["imperial-legionnaire-2"], reputation: {rep_legion: 1, rep_stormcloaks: -1}}}
  4: {text: "Stormcloak Soldier", data: {quote: "Skyrim belongs to the Nords. You took Ulfric's coin and Ulfric's oath, donned the blue and the bearskin, and swore to drive the Empire and its leashed elves back over the border — and to die, if Talos asks it, with his name on your lips.", names: ["Brynjar", "Hjordis", "Thorvald", "Ragnvor", "Kjartan", "Ylva", "Brodd", "Sunniva", "Vragnar", "Asvald"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Steel sword", damage: "d8"}, {name: "Stormcloak cuirass of quilted blue", armor: 1, suit: 1, note: "the bear of Eastmarch stitched across the breast"}, {name: "Bearskin cloak", size: "petty", note: "taken from a beast you killed yourself, as the old custom demands; it counts as warm clothing"}], tables: ["stormcloak-soldier-1", "stormcloak-soldier-2"], table_1: ["stormcloak-soldier-1"], table_2: ["stormcloak-soldier-2"], reputation: {rep_stormcloaks: 1, rep_legion: -1}}}
  5: {text: "Sellsword", data: {quote: "Stormcloak or Imperial, it's all the same coin to you. You don't fight for a flag or a god or a dead king's throne — you fight because someone paid, and you intend to be alive to spend it. A blade in one hand, a flask in the other, and a name that opens doors and empties rooms.", names: ["Arnvald", "Hrodgeir", "Svarri", "Varvald", "Imani", "Kassar", "Livia", "Ra'jhan", "Bolgra", "Kayd"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Steel sword", damage: "d8", note: "well kept, the one thing you never pawn"}, {name: "Studded leather armor", armor: 1, suit: 1}, {name: "Flask of cheap Nord mead", uses: 3, note: "a swig before a fight, and you may re-roll one failed save against fear"}], tables: ["sellsword-1", "sellsword-2"], table_1: ["sellsword-1"], table_2: ["sellsword-2"]}}
  6: {text: "Nord Reaver", data: {quote: "You keep the old ways, from before the Empire tamed the North — when a Nord's worth was the song sung over their pyre. The longship, the mead-bench, and the great axe are the only temple you need, and the Sea of Ghosts is the only road worth rowing.", names: ["Hrafn", "Brunhild", "Ketil", "Torunn", "Starkad", "Ralka", "Grim", "Torveig", "Hallstein", "Asveig"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Battleaxe", damage: "d10", size: "bulky", qualities: ["two-handed"]}, {name: "Round shield", armor: 1}, {name: "Fur armor", armor: 1, suit: 1}, {name: "Horn of mead", uses: 3, note: "for toasting the dead and sealing an oath"}], tables: ["nord-reaver-1", "nord-reaver-2"], table_1: ["nord-reaver-1"], table_2: ["nord-reaver-2"], race: "Nord"}}
  7: {text: "Redguard Alik'r", data: {quote: "The sword is the way, and the way is the sword. You came out of the deep desert of Hammerfell with the curved blade of the Ansei, the teachings of Frandar Hunding, and a debt of honor that cannot be bought — into a frozen land where the Nords stare at your skin and your steel alike.", names: ["Rashid at-Ahram", "Nadira af-Tava", "Yusuf Ibn-Karif", "Zahra al-Taneth", "Tariq at-Hegathe", "Yasmin af-Rihad", "Hassan Ibn-Dak'fron", "Mariam al-Gilane", "Kasim at-Elinhir", "Samira al-Sentinel"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Scimitar", damage: "d8"}, {name: "Hammerfell desert armor of padded leather and a sun-veil", armor: 1, suit: 1}, {name: "Whetstone and honing oil", size: "petty"}], tables: ["redguard-alikr-1", "redguard-alikr-2"], table_1: ["redguard-alikr-1"], table_2: ["redguard-alikr-2"], race: "Redguard"}}
  8: {text: "Orc Stronghold Warrior", data: {quote: "You were raised behind the spiked palisade of a stronghold — Largashbur, Dushnikh Yal, Mor Khazgur, or Narzulbur — under the Code of Malacath. Strength is law, the blood-price is paid, and the steel on your back was hammered by your mothers.", names: ["Lurgash gro-Ulag", "Shagdub gra-Morn", "Umbraz gro-Yazgu", "Ugra gra-Dula", "Bolgar gro-Batul", "Gashna gra-Shuzug", "Ghamorz gro-Bagrakh", "Yashna gra-Igron", "Torgak gro-Dushnikh", "Shelur gra-Khazgur"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Orcish war axe", damage: "d8"}, {name: "Forge hammer", damage: "d6"}, {name: "Orcish mail", armor: 2, suit: 2, size: "bulky"}], tables: ["orc-stronghold-warrior-1", "orc-stronghold-warrior-2"], table_1: ["orc-stronghold-warrior-1"], table_2: ["orc-stronghold-warrior-2"], race: "Orsimer"}}
  9: {text: "Vigilant of Stendarr", data: {quote: "Stendarr is the god of righteous mercy, but mercy has two hands: one that tends the sick and one that holds the torch. You swore the Vigil's oath at the Hall of the Vigilant, south of Dawnstar, and you carry both hands into the dark places where Daedra worship and the walking dead still fester.", names: ["Aldous", "Maela", "Cassia", "Varinius", "Hjorleif", "Adessa", "Tolvir", "Seraphine", "Aldhelm", "Gaerwyn"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Steel mace", damage: "d8"}, {name: "Vigil robes over a steel-scaled vest", armor: 1, suit: 1}, {name: "Vial of holy oil", uses: 3, note: "coat a weapon, and its next hit on a Daedra or the undead is Enhanced"}], tables: ["vigilant-of-stendarr-1", "vigilant-of-stendarr-2"], table_1: ["vigilant-of-stendarr-1"], table_2: ["vigilant-of-stendarr-2"], reputation: {rep_vigil: 1, rep_daedric_cults: -1}}}
  10: {text: "Dawnguard Hunter", data: {quote: "The vampires think the night belongs to them. Isran disagrees, and so do you. You found the old fort at the head of Dayspring Canyon, took the Dawnguard's oath, loaded the crossbow, and went looking for the dark places where the dead refuse to lie still.", names: ["Brisa", "Corvin", "Rognvar", "Mira", "Styr", "Ondrea", "Varek", "Elsbet", "Kodran", "Tamsin"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Crossbow", damage: "d8", size: "bulky"}, {name: "Steel war axe", damage: "d8"}, {name: "Dawnguard cuirass of boiled hide and steel plates", armor: 1, suit: 1}, {name: "String of garlic", uses: 3, note: "Isran swears by it; eat a clove before a hunt, and you need not save against Sanguinare Vampiris that day"}], tables: ["dawnguard-hunter-1", "dawnguard-hunter-2"], table_1: ["dawnguard-hunter-1"], table_2: ["dawnguard-hunter-2"], reputation: {rep_dawnguard: 1, rep_volkihar: -1}}}
  11: {text: "Blades Agent", data: {quote: "Once the Blades guarded emperors and hunted dragons in their own skies. Then the Great War came, and the Thalmor took their heads one by one. You are among the last, hunted in turn, carrying an Akaviri blade and a name the Justiciars would very much like to cross off their list — and now the dragons have come back, as the old Dragonguard always said they would.", names: ["Aurelian", "Sabira", "Rennick", "Maren", "Odric", "Tavena", "Cyprian", "Isolde", "Dagvard", "Sefa"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Akaviri katana", damage: "d8", note: "curved and ancient, a blade of the old Dragonguard"}, {name: "Wakizashi", damage: "d6", note: "worn hidden beneath the coat"}, {name: "Blades cuirass of lacquered steel scales", armor: 1, suit: 1, note: "worn under plain clothes"}, {name: "Codebook of Blades ciphers", size: "petty", note: "for reading dead drops and dragon-lore"}], tables: ["blades-agent-1", "blades-agent-2"], table_1: ["blades-agent-1"], table_2: ["blades-agent-2"], reputation: {rep_blades: 1}}}
  12: {text: "Bounty Hunter", data: {quote: "Every Jarl has a problem, and every problem has a price nailed to the inn door. You read the trail others can't, you bring them back alive when you can and bring back proof when you can't, and you always collect.", names: ["Eskil", "Ragna", "Tovi", "Sten", "Ulvi", "Brodir", "Kari", "Hild", "Vardis", "Ingolf"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Hunting bow", damage: "d6", size: "bulky"}, {name: "Steel sword", damage: "d8"}, {name: "Hide armor", armor: 1, suit: 1}, {name: "Iron manacles", note: "with the key"}, {name: "Sheaf of wanted notices from every Hold you've passed through", size: "petty"}], tables: ["bounty-hunter-1", "bounty-hunter-2"], table_1: ["bounty-hunter-1"], table_2: ["bounty-hunter-2"]}}
  13: {text: "Bandit", data: {quote: "Skyrim's roads are long and the Jarls' guards are few. You take what the road gives, share it with a fort full of cutthroats — Valtheim Towers, Halted Stream, some nameless tower on a nameless pass — and sell your loyalty to the chief who pays best, until a better offer comes along.", names: ["Hagni", "Svalla", "Orri", "Rurik", "Nessa", "Torvi", "Ulla", "Bjolf", "Grund", "Idrun"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Notched steel sword", damage: "d8"}, {name: "Hunting bow", damage: "d6", size: "bulky"}, {name: "Studded leather armor", armor: 1, suit: 1}], tables: ["bandit-1", "bandit-2"], table_1: ["bandit-1"], table_2: ["bandit-2"]}}
  14: {text: "Forsworn", data: {quote: "The Reach is yours by blood and by the Old Gods, whatever the Nords carved into Markarth's stone. For two years, while the Empire bled in the Great War, your people held that city — until Ulfric Stormcloak's militia shouted them from its walls and the King in Rags was locked away in Cidhna Mine. You wear hide and bone and feather, you answer to the hagravens, and you will drive the silver-thieves out of the Reach or die in the heather.", names: ["Brenach", "Aelis", "Morcant", "Ysbail", "Gwenhan", "Dralach", "Ciaran", "Muirne", "Faelan", "Ruadh"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Forsworn sword", damage: "d8", note: "a jagged blade hafted in antler"}, {name: "Forsworn armor", armor: 1, suit: 1, note: "of hide, bone, and feathers, daubed with war-paint"}, {name: "Forsworn headdress", armor: 1, note: "an antlered crown of bone and pelt"}], tables: ["forsworn-1", "forsworn-2"], table_1: ["forsworn-1"], table_2: ["forsworn-2"], reputation: {rep_forsworn: 1}}}
  15: {text: "Thieves Guild Burglar", data: {quote: "You learned the trade in the wet dark beneath Riften, where the Ratway runs and the Ragged Flagon never closes. The Guild's luck has been sour for years and nobody in the Cistern will say why — but a lock is only a question, and you have always known the answer.", names: ["Ardwen", "Brusi", "Kaela", "Tollan", "Merrit", "Sorren", "Veyra", "Gilmar", "Liesel", "Tanwen"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Dagger", damage: "d6"}, {name: "Leather armor", armor: 1, suit: 1}, {name: "Lockpicks", note: "a worn roll of them"}, {name: "Stick of charcoal for chalking the Guild's shadowmarks", size: "petty"}], tables: ["thieves-guild-burglar-1", "thieves-guild-burglar-2"], table_1: ["thieves-guild-burglar-1"], table_2: ["thieves-guild-burglar-2"], reputation: {rep_thieves_guild: 1, rep_guards: -1}}}
  16: {text: "Cutpurse", data: {quote: "You work the crush of market day in Whiterun's Plains District or under Solitude's arch, where a jostled merchant never feels the cut and a guard's eyes are always somewhere else. You owe nothing to any guild — just quick fingers, a quicker tongue, and a faster way out.", names: ["Arvid", "Lyssa", "Edrik", "Saffira", "Hrothi", "Mirra", "Corwin", "Drevia", "Pell", "Sable"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Knife", damage: "d6"}, {name: "Padded jerkin", armor: 1, suit: 1}, {name: "Rigged dice and a marked deck", size: "petty"}, {name: "False-bottomed coin pouch for hiding the day's take", size: "petty"}], tables: ["cutpurse-1", "cutpurse-2"], table_1: ["cutpurse-1"], table_2: ["cutpurse-2"]}}
  17: {text: "Nightingale", data: {quote: "Beneath the Thieves Guild lies an older shadow: the Nightingales, a trinity sworn to Nocturnal to guard the Ebonmere in the Twilight Sepulcher, in life and after death. The trinity is broken now — the Skeleton Key is lost, the Guild's luck has soured, and the Lady's favor comes thin and fitful. Yet she has marked you, and the Mistress of the Evergloam does not give her gifts for free.", names: ["Vanryn", "Sorvild", "Tavian", "Ilsabet", "Jorlan", "Evandra", "Mireth", "Othrel", "Corvel", "Selvys"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Hooded lantern", note: "shuttered to a thin beam,"}, {name: "Oil flask", uses: 6}, {name: "Black-bladed dagger", damage: "d6"}, {name: "Dark leather armor", armor: 1, suit: 1, note: "cut close and dyed for the night"}, {name: "Lockpicks"}, {name: "Shard of Ebonmere onyx", size: "petty", note: "cold to the touch, that hums faintly in deep shadow"}], tables: ["nightingale-1", "nightingale-2"], table_1: ["nightingale-1"], table_2: ["nightingale-2"]}}
  18: {text: "Dark Brotherhood Assassin", data: {quote: "The Night Mother has been silent for years, the Listener is dead, and what is left of the Family hides behind a black door in the pines of Falkreath. But the old prayers still work, a contract is still a contract, and you still answer the question at the door the way you were taught. What is the music of life? Silence, my brother.", names: ["Vitruvia", "Nerelyn", "Sirelle", "Dravos", "Sabeen", "Idrith", "Halvard", "Ebbe", "Nilvara", "Dervan"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Hooded lantern", note: "shuttered to a thin beam,"}, {name: "Oil flask", uses: 6}, {name: "Steel dagger", damage: "d6", note: "its blade oiled black"}, {name: "Black leathers and cowl", armor: 1, suit: 1}, {name: "Lockpicks"}, {name: "Paralytic poison", uses: 1, note: "coat a blade, and the next creature it wounds must pass a STR save or lose its next turn as its limbs lock"}], tables: ["dark-brotherhood-assassin-1", "dark-brotherhood-assassin-2"], table_1: ["dark-brotherhood-assassin-1"], table_2: ["dark-brotherhood-assassin-2"], reputation: {rep_dark_brotherhood: 1}}}
  19: {text: "Khajiit Smuggler", data: {quote: "The Nords do not let Khajiit through their gates, so the caravans camp outside the walls of Whiterun, Markarth, Solitude, and Windhelm — and this one walks the roads the guards do not watch, with Moon Sugar in the false bottom and a knife in the sleeve. The Nords call it smuggling. Khajiit calls it trade, and a long way from Elsweyr.", names: ["Ri'zadha", "Do'rasha", "Ma'khara", "Za'jhanni", "Dro'barra", "Khazira", "Jo'vasha", "J'khari", "Qa'zirr", "Ra'vashi Sugar-Whisker"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern of pierced brass", note: "your eyes need little light, but a buyer's do"}, {name: "Oil flask", uses: 6}, {name: "Curved Elsweyr scimitar", damage: "d8"}, {name: "Claw-knife", damage: "d6", note: "sheathed at the wrist"}, {name: "Caravan satchel with a false bottom and a twist of contraband Moon Sugar", size: "petty", note: "sacred to your people and illegal in the Holds"}, {name: "Masking incense that hides a smell the watch-dogs are trained to find", uses: 3}], tables: ["khajiit-smuggler-1", "khajiit-smuggler-2"], table_1: ["khajiit-smuggler-1"], table_2: ["khajiit-smuggler-2"], race: "Khajiit"}}
  20: {text: "Bard", data: {quote: "A blade ends a quarrel; a song ends a war — or starts one. You learned your craft at the Bards College in Solitude, where the Flame of Callisos burns beside the steps and every spring they burn King Olaf in effigy. You know the old verses and the new — \"Ragnar the Red,\" \"The Age of Aggression\" or \"The Age of Oppression,\" depending on who is buying — and you have learned that the right verse in the right ear is worth more than an army.", names: ["Halla", "Fenwick", "Brynja", "Lysanne", "Jarvi", "Ysolde", "Selwyn", "Liria", "Tarquin", "Gisla"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Lute", note: "well-traveled and a little out of tune"}, {name: "Padded doublet in the College's colors", armor: 1, suit: 1}, {name: "Dagger", damage: "d6"}], tables: ["bard-1", "bard-2"], table_1: ["bard-1"], table_2: ["bard-2"], reputation: {rep_bards_college: 1}}}
  21: {text: "College Apprentice", data: {quote: "The wind howls off the Sea of Ghosts, the bridge to the College of Winterhold is a knife of ice, and the Nords in the town below still blame you for the Great Collapse. But inside, the braziers never gutter and the Arcanaeum never closes. You came to learn, and you have the robe, the tome, and the singed eyebrows to prove how much is left to learn.", names: ["Sorelnar", "Reads-The-Stars", "Ja'rasha", "Aurel", "Elsinde", "Tavrin", "Merilwen", "Ondrin", "Ingirid", "Thalvyn"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Dagger", damage: "d6"}, {name: "College novice robes", size: "petty", note: "much patched"}, {name: "Charcoal and a notebook", size: "petty", note: "half-filled with formulae and bad sketches"}], tables: ["college-apprentice-1", "college-apprentice-2"], table_1: ["college-apprentice-1"], table_2: ["college-apprentice-2"], reputation: {rep_college: 1}}}
  22: {text: "Battlemage", data: {quote: "Let the College scholars debate theory behind their walls. You wed Destruction to good steel and march where the fighting is thickest — a blade in one hand, fire in the other, and armor enough to walk out the far side. The Nords sneer at \"elf-magic\" right up until the day it holds their line.", names: ["Varulf", "Asgerd", "Othmar", "Hrolf", "Bjarnhild", "Corvan", "Dagna", "Adalric", "Octavian", "Valeria"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Steel sword", damage: "d8"}, {name: "Steel cuirass", armor: 2, suit: 2, size: "bulky"}], tables: ["battlemage-1", "battlemage-2"], table_1: ["battlemage-1"], table_2: ["battlemage-2"]}}
  23: {text: "Spellsword", data: {quote: "You travel light and quick, with a blade of bound light in your hand and a spell for whatever it can't cut. Where the battlemage is a wall, you are a knife — in, around the guard, and gone before the spell's glow has faded from the air.", names: ["Vondrel", "Tessaly", "Irvane", "Kaelis", "Doravel", "Sennet", "Brisca", "Galdor", "Sarvyn", "Nerith"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Spell Tome: Bound Sword", note: "its cover cold and weightless"}, {name: "Dagger", damage: "d6", note: "for the days you are too tired to conjure"}, {name: "Leather armor", armor: 1, suit: 1}], tables: ["spellsword-1", "spellsword-2"], table_1: ["spellsword-1"], table_2: ["spellsword-2"]}}
  24: {text: "Conjurer", data: {quote: "Why carry an army when you can call one? You reach across the veil into Oblivion and drag back atronachs of fire and ice, scamps and clannfear, blades of bound light — and one day, you swear, a Dremora who will kneel. The Nords make the sign against evil when you pass. The Vigil of Stendarr takes notes.", names: ["Mordrel", "Ilvane", "Zenobia", "Oswin", "Hesper", "Malvane", "Draeva", "Serik", "Keldis", "Veyl"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Dagger", damage: "d6"}, {name: "Conjurer's robes", size: "petty", note: "stitched with Daedric script"}, {name: "Petty soul gem", size: "petty", note: "empty and waiting"}], tables: ["conjurer-1", "conjurer-2"], table_1: ["conjurer-1"], table_2: ["conjurer-2"]}}
  25: {text: "Necromancer", data: {quote: "The dead do not argue, do not tire, and do not flee. You learned the art that the Nords spit at and the Vigil of Stendarr burns for — to fill a soul gem, to call a corpse to its feet, to keep a thrall at your back. They are hunting you for it. Let them come; you have help.", names: ["Morgath", "Ulvene", "Idony", "Carrow", "Sevrin", "Nethra", "Corvina", "Mortimer", "Grisel", "Wenna"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "you have been known to burn worse than oil in it"}, {name: "Oil flask", uses: 6}, {name: "Dagger", damage: "d6", note: "its blade pitted black"}, {name: "Dark robes", size: "petty", note: "grave-dust in every fold"}, {name: "Black soul gem", size: "petty", note: "empty — the taboo at the heart of your craft"}], tables: ["necromancer-1", "necromancer-2"], table_1: ["necromancer-1"], table_2: ["necromancer-2"]}}
  26: {text: "Court Wizard", data: {quote: "Every Jarl keeps a wizard — Farengar in Dragonsreach, Calcelmo beneath Markarth, Wuunferth in the Palace of the Kings — and you have been one, or trained at the elbow of one. A Jarl's roof is a warm and dangerous place. You read the omens, ward the hall, brew what the steward dare not name, and keep an ear at the door of every conspiracy in the Hold. The throne is never the most powerful thing in the room, but you must always let it believe it is.", names: ["Faerindel", "Caemyr", "Elphine", "Vireth", "Maudric", "Therond", "Gwenlyn", "Aurenne", "Sidonie", "Halvor"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Staff of office", damage: "d6", note: "carved with your Jarl's sigil"}, {name: "Court robes", size: "petty", note: "finer than they are warm"}, {name: "Ink", size: "petty", note: "quills, and a locked ledger of the Hold's secrets"}], tables: ["court-wizard-1", "court-wizard-2"], table_1: ["court-wizard-1"], table_2: ["court-wizard-2"]}}
  27: {text: "Telvanni Mage", data: {quote: "You are Dunmer and a wizard of House Telvanni, and you have not the patience to pretend either is a small thing. The other Great Houses crawl and scheme; the Telvanni grow towers of living fungus, climb them without stairs, and study what they please. Power answers to talent, and talent alone. You came to Skyrim by way of Solstheim, where Master Neloth keeps Tel Mithryn — and the n'wah who forget what you are tend not to forget twice.", names: ["Sarvesi", "Tervas", "Tirvos", "Drelvyn", "Savilo", "Nethys", "Aroni", "Vunela", "Othreni", "Brelvis"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Luminous fungus cap cut from a Telvanni tower", size: "petty", note: "kept damp, it glows like a candle"}, {name: "Staff of spore-wood", damage: "d6"}, {name: "Robes of House Telvanni", size: "petty", note: "finer than anything you will admit to wanting"}], tables: ["telvanni-mage-1", "telvanni-mage-2"], table_1: ["telvanni-mage-1"], table_2: ["telvanni-mage-2"], race: "Dunmer"}}
  28: {text: "Restoration Healer", data: {quote: "Restoration is the quiet school, mocked by Destruction's loud children and half the College besides. Let them sneer. You learned to close a wound with a word, to raise a ward that turns aside a killing spell, and to make the walking dead recoil from the light in your hands. When the fighting is done, they all come crawling to you.", names: ["Merrin", "Solvi", "Ailis", "Ottilie", "Ansgar", "Ingefrid", "Hjalla", "Rosamund", "Mivari", "Halle"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "for long vigils at the sickbed"}, {name: "Oil flask", uses: 6}, {name: "Iron mace", damage: "d8", note: "a blunt weapon, so you spill no blood you would only have to mend"}, {name: "Healer's robes", size: "petty"}, {name: "Bandages and simples", uses: 3, note: "bind a wound after a fight to restore 1 STR"}], tables: ["restoration-healer-1", "restoration-healer-2"], table_1: ["restoration-healer-1"], table_2: ["restoration-healer-2"]}}
  29: {text: "Enchanter", data: {quote: "Any fool with a tome can throw fire. You do the patient work: you catch a soul in glass, you unmake an old blade to learn how it was made, and you bind that power into steel that will carry it long after the spell that made it is forgotten. Everything you own hums a little. You like it that way.", names: ["Ancelin", "Mireille", "Iskra", "Galvyn", "Emrick", "Seravel", "Belisande", "Vaskar", "Odalys", "Cosima"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Enchanter's knife", damage: "d6", note: "for scoring sigils into haft and hilt"}, {name: "Common soul gem", size: "petty", note: "filled; a white light turns slowly within it"}, {name: "Soul-scribing tools and sigil chalk", size: "petty"}], tables: ["enchanter-1", "enchanter-2"], table_1: ["enchanter-1"], table_2: ["enchanter-2"]}}
  30: {text: "Alchemist", data: {quote: "You know what a flower is for, and a fang, and a death's-head mushroom. The hand that mixes a draught to mend a fevered child can mix a thing to stop a heart between one breath and the next, and no apothecary worth the name pretends otherwise. People buy your cures and fear your other work. Both keep the lamp lit.", names: ["Fennick", "Tamsyn", "Petronella", "Linnea", "Dunstan", "Hakkon", "Verena", "Oriana", "Mixes-In-Moss", "Clemence"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern"}, {name: "Oil flask", uses: 6}, {name: "Apothecary's knife", damage: "d6", note: "for harvesting roots, fangs, and worse"}, {name: "Portable alchemy kit", size: "bulky", note: "a folding mortar, alembic, and retort, so you can brew wherever you can spend a quiet day"}, {name: "Pouch of sorted ingredients", size: "petty", note: "dried, labeled, and known"}], tables: ["alchemist-1", "alchemist-2"], table_1: ["alchemist-1"], table_2: ["alchemist-2"]}}
  31: {text: "Priest of the Divines", data: {quote: "You took your vows before the altar and learned to carry a god in your hands. Once they were Nine. Since the White-Gold Concordat, the Thalmor say Eight, and the empty pedestal where Talos stood is a wound you keep close. Roll for the Divine you serve, or choose.", names: ["Brother Wystan", "Sister Theodora", "Brother Aelric", "Sister Serafine", "Brother Thorvald", "Sister Coralie", "Brother Osric", "Sister Elowen", "Brother Benedikt", "Sister Maudra"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "hooded for vigils"}, {name: "Oil flask", uses: 6}, {name: "Steel mace", damage: "d8", note: "the priest's weapon, blunt so as to spill no blood"}, {name: "Hooded temple robes", size: "petty", note: "counts as warm clothing"}, {name: "Holy symbol of your Divine", size: "petty"}], tables: ["priest-of-the-divines-1", "priest-of-the-divines-2"], table_1: ["priest-of-the-divines-1"], table_2: ["priest-of-the-divines-2"]}}
  32: {text: "Moth Priest", data: {quote: "The Cult of the Ancestor Moth keeps the Elder Scrolls in the White-Gold Tower, and you were one of its readers. Each reading takes a little of your sight — the long fast, the chanting, the moths settling on your hands, and then every age at once, pouring in through your eyes. You left the Imperial City for Skyrim half-blind and wholly changed, and the Scrolls have not finished with you.", names: ["Vibia", "Orestes", "Aemilian", "Silvanus", "Severan", "Eudora", "Coriolan", "Faustin", "Lucienne", "Vesna"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "carried more for others' eyes than your own"}, {name: "Oil flask", uses: 6}, {name: "Walking staff", damage: "d6", note: "a blind scholar's third leg"}, {name: "Silk robes of the Cult", size: "petty", note: "embroidered with sleeping moths"}, {name: "Silken blindfold", size: "petty", note: "worn over clouded eyes"}], tables: ["moth-priest-1", "moth-priest-2"], table_1: ["moth-priest-1"], table_2: ["moth-priest-2"]}}
  33: {text: "Pilgrim of Kynareth", data: {quote: "You walk the high places and breathe with the wind. Kynareth — Kyne, to the Nords — is goddess of the heavens and the air, who gave her breath to the world and, the Greybeards say, the Voice to Men. You have climbed the Seven Thousand Steps and knelt at every tablet, prayed beneath the Eldergleam, and followed her hawks along the ridges. You do not Shout; the Voice is not your road. You simply listen, and the wind listens back.", names: ["Ulfhild", "Brenna", "Kolbeinn", "Eirny", "Skjold", "Halvdan", "Geirny", "Asvor", "Gerdrun", "Sigvor"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Walking staff", damage: "d6", note: "worn smooth by long roads and steep climbs"}, {name: "Pilgrim's robes", size: "petty", note: "counts as warm clothing; weatherbeaten"}, {name: "Wreath of mountain flowers", size: "petty", note: "kept fresh by prayer"}], tables: ["pilgrim-of-kynareth-1", "pilgrim-of-kynareth-2"], table_1: ["pilgrim-of-kynareth-1"], table_2: ["pilgrim-of-kynareth-2"]}}
  34: {text: "Sage", data: {quote: "Where others see only dust and dead tongues, you see a map. You have spent your life among books — the histories of the Empire, the dead script of the Dwemer, the cramped marginalia of mad mages — and you can read what others cannot. The Arcanaeum knows your face; Urag gro-Shub even tolerates it. A sharp memory is the only weapon you have ever truly needed.", names: ["Evander", "Cassian", "Imelda", "Anselm", "Hesketh", "Aldwin", "Rufina", "Tyrvald", "Hallbera", "Keeps-The-Ink"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "shuttered for late study"}, {name: "Oil flask", uses: 6}, {name: "Letter-opener", damage: "d6", note: "keen enough for vellum or a throat"}, {name: "Scholar's satchel of notes and chalk", size: "petty"}, {name: "Spectacles on a chain", size: "petty"}], tables: ["sage-1", "sage-2"], table_1: ["sage-1"], table_2: ["sage-2"]}}
  35: {text: "Wise Woman", data: {quote: "The village comes to you when the priest cannot help. You read the omens in smoke and bird and bone, you know which herb mends and which kills — snowberry and blue mountain flower, deathbell and nightshade — and you keep the old charms against the things that walk the cold nights. You are no hagraven and no Glenmoril witch, only a mortal woman who listens to the land, and is trusted for it.", names: ["Agnetha", "Grelda", "Hervor", "Ingunn", "Jofrid", "Ranveig", "Svanhild", "Gyrid", "Old Aud", "Hrodny"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Horn lantern"}, {name: "Oil flask", uses: 6}, {name: "Carved bone knife", damage: "d6", note: "for cutting herbs and casting the runes"}, {name: "Herb pouch", uses: 3, note: "a poultice after a fight restores 1 STR"}, {name: "Bundle of charms and dried herbs", size: "petty"}], tables: ["wise-woman-1", "wise-woman-2"], table_1: ["wise-woman-1"], table_2: ["wise-woman-2"]}}
  36: {text: "Blacksmith", data: {quote: "You are known by the ring of the hammer and the hiss of the quench. Where others see ore and old iron, you see the blade or the cuirass waiting inside it. You came up at a forge — a Hold-smith's, a Legion armorer's, an Orc stronghold's — you bear the burns to prove it, and every good thing you own you made with your own two hands.", names: ["Haldor", "Ormr", "Gunnvor", "Tordis", "Stigr", "Sveinn", "Folkvar", "Adelheid", "Uzbakh gro-Lurz", "Morga gra-Shul"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Lantern", note: "soot-black from years over your anvil"}, {name: "Oil flask", uses: 6}, {name: "Smith's hammer", damage: "d6", note: "for the anvil and, at need, for skulls"}, {name: "Iron tongs and a cured-hide apron", size: "petty"}, {name: "Pouch of ingots and steel offcuts", note: "worth 2d6 × 5 Septims to any smith"}], tables: ["blacksmith-1", "blacksmith-2"], table_1: ["blacksmith-1"], table_2: ["blacksmith-2"]}}
  37: {text: "Hunter", data: {quote: "The wild does not forgive the careless; you have buried friends who forgot that. Elk on the tundra, goats on the crags, a sabre cat's tracks in fresh snow — the bow, the snare, and the patient hour before dawn are your prayers, and Kyne answers them. You take only what you need, and you thank her for it.", names: ["Eskel", "Hallfrid", "Skeggi", "Ylva", "Vemund", "Oddvar", "Hroald", "Asleif", "Grimwald", "Thora Two-Arrows"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Torch", uses: 3}, {name: "Hunting bow", damage: "d6", size: "bulky"}, {name: "Skinning knife", damage: "d6"}, {name: "Fur-lined leathers", armor: 1, suit: 1, note: "counts as warm clothing"}, {name: "Snare wire and a gutting hook", size: "petty", note: "for rabbits, foxes, and ptarmigan"}], tables: ["hunter-1", "hunter-2"], table_1: ["hunter-1"], table_2: ["hunter-2"]}}
  38: {text: "Miner", data: {quote: "You have spent more of your life under the stone than over it — the silver of Cidhna Mine, the gold of Kolskeggr, the iron of Redbelly and Iron-Breaker, the quicksilver of Dawnstar. You know the weight of the dark, the songs that keep a crew breathing, and the cold smell of a vein about to give. The pick is the only tool you ever truly needed, and more than once the only weapon.", names: ["Brandvar", "Hallkel", "Kolbrun", "Orvar", "Dagfinn", "Thrand", "Grisla", "Bolverk", "Njal", "Gulbak gro-Ushra"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Miner's lantern", note: "made to hang from a roof-beam"}, {name: "Oil flask", uses: 6}, {name: "Pickaxe", damage: "d8", note: "for the rock face and whatever crawls out of it"}, {name: "Pouch of raw ore and geode chips", note: "worth 2d6 × 5 Septims to a smelter"}, {name: "Rope (25 ft) and a few iron spikes", size: "petty"}], tables: ["miner-1", "miner-2"], table_1: ["miner-1"], table_2: ["miner-2"]}}
  39: {text: "Sailor", data: {quote: "You learned your craft on the gray water of the Sea of Ghosts, where the ice-floes grind in the fog and the slaughterfish boil under a slow hull. You have crewed East Empire traders out of Solitude, fishing boats out of Dawnstar, and the crossing from Windhelm to Raven Rock. You know the rigging, the tides, and the harpoon, and you have hauled enough horker and netted enough catch to fear neither.", names: ["Hafgrim", "Ottarr", "Gunnhild", "Steinar", "Ormarr", "Eilif", "Tjorvi", "Arngrim", "Solla", "Swims-Past-Wrecks"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Storm lantern", note: "sealed against the spray"}, {name: "Oil flask", uses: 6}, {name: "Harpoon", damage: "d8", note: "for horker, for big fish, and for boarders"}, {name: "Fishing net and a coil of line", size: "petty"}, {name: "Oilskins and a fur hood", size: "petty", note: "counts as warm clothing"}], tables: ["sailor-1", "sailor-2"], table_1: ["sailor-1"], table_2: ["sailor-2"]}}
  40: {text: "Farmhand", data: {quote: "You were born to the soil — the wheat of the Whiterun tundra, the cabbages and leeks of a Rift homestead, the Rorikstead fields where they say the harvest never fails. You worked it from the day you could lift a pail. There is no glory in it and never was: only the rising at dawn, the aching back, and the long memory of the land. Then a debt, a dream, or a burning came, and you took up your tools and walked off into a wider, harder world.", names: ["Ragnfrid", "Hedda", "Arnulf", "Oddgeir", "Arnkel", "Eyvind", "Hlif", "Sturla", "Botolf", "Svein"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Tin lantern", note: "dented from years of dark mornings in the byre"}, {name: "Oil flask", uses: 6}, {name: "Woodcutter's axe", damage: "d8", note: "for the woodpile, the fence, and the wolf at the gate"}, {name: "Work gloves and a patched wool cloak", size: "petty", note: "counts as warm clothing"}, {name: "Sack of seed-grain and a hank of twine", size: "petty"}], tables: ["farmhand-1", "farmhand-2"], table_1: ["farmhand-1"], table_2: ["farmhand-2"]}}
  41: {text: "Merchant", data: {quote: "The road is your shop and your home both. You have hauled goods over every pass in Skyrim — Markarth silver, Riften mead, Windhelm's Dunmer wares, whatever the East Empire Company unloads at Solitude — through bandit country, blizzard, and worse, because a trader who never travels never eats. You know the worth of a thing to the Septim, you know a swindle when you see one, and you have a friend in every Hold who owes you a favor.", names: ["Gisela", "Corwen", "Lysander", "Pieter", "Osvald", "Renata", "Hanne", "Idris", "Tildrin", "Counts-The-Coins"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Road lantern"}, {name: "Oil flask", uses: 6}, {name: "Iron-shod walking staff", damage: "d6", note: "for the road, the mud, and the unwise robber"}, {name: "Ledger", size: "bulky", note: "scales, and a strongbox of trade goods; worth 3d6 × 10 Septims to the right buyer"}], tables: ["merchant-1", "merchant-2"], table_1: ["merchant-1"], table_2: ["merchant-2"], companion: "pack-mule"}}
  42: {text: "Skaal Hunter", data: {quote: "The All-Maker gives, and the All-Maker takes, and the wise hunter takes only what is given. You were raised in the Skaal village on the snowbound north coast of Solstheim, where the old Nord ways were never forgotten: the six Stones of the All-Maker, the horker hunt, the long watch against the Adversary. Now the Stones are falling silent, the village folk walk in their sleep to build something no one remembers, and you have gone out into the world to learn why.", names: ["Bjarki", "Holmfrid", "Isgerd", "Tjodhild", "Rannvi", "Sigtrygg", "Varinn", "Hjalmgerd", "Frodi", "Aslak"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Horker-fat lamp", note: "carved with the All-Maker's mark"}, {name: "Oil flask", uses: 6}, {name: "Hunting bow", damage: "d6", size: "bulky"}, {name: "Bone hatchet", damage: "d6"}, {name: "Skaal coat of fur and hide", armor: 1, suit: 1, note: "counts as warm clothing"}], tables: ["skaal-hunter-1", "skaal-hunter-2"], table_1: ["skaal-hunter-1"], table_2: ["skaal-hunter-2"], reputation: {rep_skaal: 1}, race: "Nord"}}
  43: {text: "Argonian Shadowscale", data: {quote: "You hatched under the sign of the Shadow, and so the Hist gave you to the Shadowscales before you could walk: the royal assassins of Black Marsh, trained in the ways of the Dark Brotherhood and sworn to its Tenets. You were among the last. The training grounds at Archon have fallen silent, the tradition is dying, and you came north to Skyrim with a blade, a lock-pick, and the long patience of the deep water.", names: ["Sleeps-In-Reeds", "Hunts-Below-Water", "Many-Knives", "Dar-Meema", "Neeta-Lei", "Seven-Silent-Stones", "Waits-Beneath", "Tail-Of-Night", "Keel-Of-Stone", "Swift-Current"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Shuttered lantern", note: "its light hooded to a thread"}, {name: "Oil flask", uses: 6}, {name: "Curved Shadowscale dagger", damage: "d6", note: "blackened and soundless in the draw"}, {name: "Garrote wire", size: "petty", note: "a foe you seize unaware from behind cannot cry out while you struggle"}, {name: "Dark wrappings", armor: 1, suit: 1, note: "the dyed leathers of the sect"}], tables: ["argonian-shadowscale-1", "argonian-shadowscale-2"], table_1: ["argonian-shadowscale-1"], table_2: ["argonian-shadowscale-2"], race: "Argonian"}}
  44: {text: "Dunmer Ashlander", data: {quote: "Your people never bowed to the Great Houses or their false Tribunal gods. You honored the ancestors and the Good Daedra — Azura above all — and followed the herds across the ashlands of Vvardenfell. Then Red Mountain burst, the sky fell as ash, the Argonians came over the border, and your tribe took up its yurts and walked. Now you wander Skyrim among Nords who spit at \"gray-skins,\" with nothing but your ancestors, your spear, and the long road north.", about: "You are old as Men count it: the Red Year lies almost two centuries behind you, and you remember it. Note an age to match rather than rolling one — the Dunmer live long.", names: ["Ninsar", "Zabir", "Kulmassi", "Shalit", "Anammu", "Sinnurab", "Addunu", "Ilabi", "Zelaku", "Mammasi"], gold: "3d6", gear: [{name: "Rations", uses: 3}, {name: "Guar-hide lamp"}, {name: "Oil flask", uses: 6}, {name: "Chitin spear", damage: "d8", note: "its head cut from a great beetle's shell"}, {name: "Chitin shield", armor: 1}, {name: "Chitin armor", armor: 1, suit: 1, note: "plates of lacquered shell over layered cloth"}], tables: ["dunmer-ashlander-1", "dunmer-ashlander-2"], table_1: ["dunmer-ashlander-1"], table_2: ["dunmer-ashlander-2"], race: "Dunmer"}}
  45: {text: "Bosmer Hunter", data: {quote: "Y'ffre set the Green Pact, and you keep it even here: you eat only meat, you eat what you kill, and you harm no living plant for your own use. Valenwood belongs to the Thalmor now, and a Bosmer in Skyrim is taken for a Dominion spy or a Dominion refugee. You are neither. You are a hunter, and the bow was your kind's gift to the world.", names: ["Ranglas", "Elegir", "Tarnil", "Vindorel", "Elaron", "Sylvril", "Faelwen", "Lorthin", "Brenwe", "Gwilith"], gold: "3d6", gear: [{name: "Rations", uses: 3, note: "strips of dried meat, nothing else"}, {name: "Torch", uses: 3}, {name: "Hunting bow", damage: "d6", size: "bulky", note: "loosed in one smooth motion"}, {name: "Skinning knife", damage: "d6"}, {name: "Leaf-dyed leathers", armor: 1, suit: 1, note: "the mottled greens of the deep forest"}], tables: ["bosmer-hunter-1", "bosmer-hunter-2"], table_1: ["bosmer-hunter-1"], table_2: ["bosmer-hunter-2"], race: "Bosmer"}}
