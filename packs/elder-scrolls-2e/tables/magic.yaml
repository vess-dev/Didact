# Magic and treasure roll tables (roll-tables/relics, spell-tomes, skill-books,
# unique-weapons, unique-armors): each entry's `data.id` is its compendium entry. `relics`
# and `spellbooks` keep cairn-2e's ids (its relic and spellbook generators, replaced here,
# roll them).
table: relics
title: "Relics"
description: "What kind of Relic (d6: amulet, ring, staff or oddment, or something greater), then that kind's table, which a kind rolls on by itself, chosen or rolled: each relic's data.id is its compendium entry. At most one Relic per session under normal circumstances."
dice: d6
source: roll-tables/relics#what-kind-of-relic-d6
entries:
  1-2: {text: "An amulet — roll on Amulets", then: [{table: "relics-amulets"}]}
  3-4: {text: "A ring — roll on Rings", then: [{table: "relics-rings"}]}
  5: {text: "A staff, crown, or oddment — roll on Staves & Oddments", then: [{table: "relics-staves-oddments"}]}
  6: {text: "Something greater — roll on Greater Relics, or place one deliberately", then: [{table: "relics-greater"}]}
