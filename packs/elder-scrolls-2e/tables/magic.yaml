  "Mace Etiquette": {text: "Once per combat, one of your attacks with a mace or club is Enhanced.", data: {id: "mace-etiquette", skill: "One-Handed", series: "Steel"}}
  "Fire and Darkness": {text: "When you strike before your foe has acted in a combat, your first attack with a dagger or sword is Enhanced.", data: {id: "fire-and-darkness", skill: "One-Handed", series: "Steel"}}
  "The Importance of Where": {text: "Your attacks with a mace, club, or war hammer ignore 1 Armor.", data: {id: "the-importance-of-where", skill: "One-Handed", series: "Steel"}}
  "Night Falls on Sentinel": {text: "When you attack a foe who believed you unarmed or friendly — at a parley, from a disguise, across a tavern table — the attack is Enhanced.", data: {id: "night-falls-on-sentinel", skill: "One-Handed", series: "Steel"}}
  "Battle of Sancre Tor": {text: "Once per combat, when you swing a greatsword or battleaxe at a foe who has not yet acted this combat, the attack is Enhanced.", data: {id: "battle-of-sancre-tor", skill: "Two-Handed", series: "Steel"}}
  "Song of Hrormir": {text: "Once per day, if you have downed a horn of mead or ale within the past hour, your first attack with a two-handed weapon in a combat is Enhanced.", data: {id: "song-of-hrormir", skill: "Two-Handed", series: "Steel"}}
  "Words and Philosophy": {text: "Once per combat, when you close to melee with a foe who was attacking you from range — an archer, a caster — your first two-handed attack against it is Enhanced.", data: {id: "words-and-philosophy", skill: "Two-Handed", series: "Steel"}}
  "King": {text: "Your attacks with a two-handed weapon against a detachment are not Impaired; each great sweep carves into the crowd.", data: {id: "king", skill: "Two-Handed", series: "Steel"}}
  "The Marksmanship Lesson": {text: "Once per combat, one of your attacks with a bow or crossbow is Enhanced.", data: {id: "the-marksmanship-lesson", skill: "Archery", series: "Steel"}}
  "The Black Arrow": {text: "Your attacks with a bow or crossbow are never Impaired by long range.", data: {id: "the-black-arrow", skill: "Archery", series: "Steel"}}
  "Vernaccus and Bourlor": {text: "Your arrows and crossbow bolts strike ghosts, Daedra, and other creatures that shrug off mundane weapons at full force.", data: {id: "vernaccus-and-bourlor", skill: "Archery", series: "Steel"}}
  "The Gold Ribbon of Merit": {text: "You need not save to make a trick shot a skilled archer could plausibly make — cutting a rope, pinning a sleeve to a door, snuffing a candle, striking a lever.", data: {id: "the-gold-ribbon-of-merit", skill: "Archery", series: "Steel"}}
  "Death Blow of Abernanit": {text: "Once per day, while you hold a shield, when an attack would reduce you to 0 HP, make a DEX save; on a success you take the blow on the shield and suffer no damage from it.", data: {id: "death-blow-of-abernanit", skill: "Block", series: "Steel"}}
  "The Mirror": {text: "While you hold a shield, once per combat re-roll a failed save made to weather a blow, brace against a charge, or hold your ground.", data: {id: "the-mirror", skill: "Block", series: "Steel"}}
  "Battle of Red Mountain": {text: "While you hold a shield and stand shoulder to shoulder with an ally, attacks against you by a detachment are not Enhanced.", data: {id: "battle-of-red-mountain", skill: "Block", series: "Steel"}}
  "Hallgerd's Tale": {text: "You move as freely in mail or plate as out of it: armor never forces a save on you that you wouldn't make unarmored, and you can don or doff a full suit in moments.", data: {id: "hallgerds-tale", skill: "Heavy Armor", series: "Steel"}}
  "Chimarvamidium": {text: "Once per combat, while you wear mail or plate, you may turn a blow onto your armor's strongest plates: that attack against you is Impaired.", data: {id: "chimarvamidium", skill: "Heavy Armor", series: "Steel"}}
  "The Armorer's Challenge": {text: "You can temper a weapon a second time — one more step up its damage die, never past d12.", data: {id: "the-armorers-challenge", skill: "Smithing", series: "Steel"}}
  "Cherim's Heart of Anequina": {text: "You can mend any broken weapon or armor with whatever metal and leather are at hand, without a forge and without the piece's own material.", data: {id: "cherims-heart-of-anequina", skill: "Smithing", series: "Steel"}}
  "Last Scabbard of Akrash": {text: "Your work at the forge never goes wrong: a rushed or improvised tempering or repair never calls for a save.", data: {id: "last-scabbard-of-akrash", skill: "Smithing", series: "Steel"}}
  "Reality & Other Falsehoods": {text: "Once per day, cast an Alteration spell so subtly that no one watching can tell you cast anything at all — no light, no sound, no telltale gesture.", data: {id: "reality-and-other-falsehoods", skill: "Alteration", series: "The Arcane"}}
  "Daughter of the Niben": {text: "Once per day, when the Warden rolls the Die of Fate for your own luck and it goes against you, it is rolled again.", data: {id: "daughter-of-the-niben", skill: "Alteration", series: "The Arcane"}}
  "Breathing Water": {text: "You always feel a spell upon you begin to fade before it ends, and you can hold your breath for six rounds before drowning sets in, not three.", data: {id: "breathing-water", skill: "Alteration", series: "The Arcane"}}
  "The Lunar Lorkhan": {text: "You always know the hour of the night and the phases of Masser and Secunda, and you never lose your way under an open night sky.", data: {id: "the-lunar-lorkhan", skill: "Alteration", series: "The Arcane"}}
  "The Doors of Oblivion": {text: "Once per day, channel a Conjuration tome without adding Fatigue.", data: {id: "the-doors-of-oblivion", skill: "Conjuration", series: "The Arcane"}}
  "Liminal Bridges": {text: "Once per day, a servant you have summoned lingers past the end of its scene, until the next dawn.", data: {id: "liminal-bridges", skill: "Conjuration", series: "The Arcane"}}
  "A Hypothetical Treachery": {text: "Once per day, one Destruction spell you cast is Enhanced.", data: {id: "a-hypothetical-treachery", skill: "Destruction", series: "The Arcane", rare: true}}
  "Response to Bero's Speech": {text: "When you cast a Destruction spell with a blast, you may spare anyone you choose within its reach.", data: {id: "response-to-beros-speech", skill: "Destruction", series: "The Arcane"}}
  "Mystery of Talara": {text: "Once per day, re-roll a failed WIL save made to cast a spell under duress.", data: {id: "mystery-of-talara", skill: "Destruction", series: "The Arcane"}}
  "The Art of War Magic": {text: "Casting a Destruction spell in battle never calls for the WIL save against duress; you are trained to the noise.", data: {id: "the-art-of-war-magic", skill: "Destruction", series: "The Arcane"}}
  "Enchanter's Primer": {text: "A Relic you enchant holds one more charge than its soul would give.", data: {id: "enchanters-primer", skill: "Enchanting", series: "The Arcane"}}
  "Twin Secrets": {text: "You can bind a second enchantment into an item that already holds one — never more than two.", data: {id: "twin-secrets", skill: "Enchanting", series: "The Arcane"}}
  "Catalogue of Weapon Enchantments": {text: "You know at a glance what enchantment a weapon carries and how many charges it holds.", data: {id: "catalogue-of-weapon-enchantments", skill: "Enchanting", series: "The Arcane"}}
  "Catalogue of Armor Enchantments": {text: "A worn enchantment you bind can be made constant with a common soul, not only a greater one.", data: {id: "catalogue-of-armor-enchantments", skill: "Enchanting", series: "The Arcane"}}
  "Incident in Necrom": {text: "You need not save to slip the notice of anyone who has underestimated or dismissed you.", data: {id: "incident-in-necrom", skill: "Illusion", series: "The Arcane"}}
  "The Black Arts On Trial": {text: "You know a necromancer's handiwork on sight — a raised corpse, a black soul gem, a sigil drawn in grave-dirt — and you can tell whether a living mind has been bent by magic.", data: {id: "the-black-arts-on-trial", skill: "Illusion", series: "The Arcane"}}
  "Before the Ages of Man": {text: "You can make out the meaning of old Aldmeri script — Ayleid, Falmer, and Dwemer inscriptions — given time and a quiet place.", data: {id: "before-the-ages-of-man", skill: "Illusion", series: "The Arcane"}}
  "Withershins": {text: "When you heal someone with a Restoration spell, a Relic, or a potion, they regain 1 extra STR.", data: {id: "withershins", skill: "Restoration", series: "The Arcane"}}
  "The Exodus": {text: "Your healing magic can mend a given creature's STR twice in a day, not once.", data: {id: "the-exodus", skill: "Restoration", series: "The Arcane"}}
  "Racial Phylogeny": {text: "Gain a permanent +1 to one Attribute of your choice (to a maximum of 18).", data: {id: "racial-phylogeny", skill: "Restoration", series: "The Arcane", rare: true}}
  "Sacred Witness": {text: "Once per day, re-roll a failed DEX save made to move unseen or to strike from the shadows.", data: {id: "sacred-witness", skill: "Sneak", series: "Shadow"}}
  "Three Thieves": {text: "Your first attack from concealment in a combat ignores 1 Armor.", data: {id: "three-thieves", skill: "Sneak", series: "Shadow"}}
  "Legend of Krately House": {text: "Old floors, stairs, and doors never betray you: moving through a house by night, you need not save to go unheard.", data: {id: "legend-of-krately-house", skill: "Sneak", series: "Shadow"}}
  "Aevar Stone-Singer": {text: "Gain +1 maximum HP.", data: {id: "aevar-stone-singer", skill: "Pickpocket", series: "Shadow"}}
  "Beggar": {text: "Beggars and street urchins count you as one of their own: in any town, a few coins buy you the local gossip and a place to hide.", data: {id: "beggar", skill: "Pickpocket", series: "Shadow"}}
  "Guide to Better Thieving": {text: "You need not save to lift a small item from someone who is distracted.", data: {id: "guide-to-better-thieving", skill: "Pickpocket", series: "Shadow"}}
  "Purloined Shadows": {text: "Once per session, you may declare that you took one small, plausible object from a place you have already searched, with no roll — the Warden decides what was reasonable to find.", data: {id: "purloined-shadows", skill: "Pickpocket", series: "Shadow", rare: true}}
  "Advances in Lockpicking": {text: "Given a quiet minute, you need not save to pick an ordinary lock.", data: {id: "advances-in-lockpicking", skill: "Lockpicking", series: "Shadow"}}
  "Proper Lock Design": {text: "Once per day, re-roll a failed save made to pick a lock or disarm a trap.", data: {id: "proper-lock-design", skill: "Lockpicking", series: "Shadow"}}
  "The Locked Room": {text: "Given time and safety, you can pick even masterwork and Dwemer locks that would otherwise need their key or a spell.", data: {id: "the-locked-room", skill: "Lockpicking", series: "Shadow", rare: true}}
  "The Buying Game": {text: "Merchants treat you one step better on the Reaction ladder.", data: {id: "the-buying-game", skill: "Speech", series: "Shadow"}}
  "A Dance in Fire": {text: "Once per day, re-roll a failed WIL save made to persuade, deceive, or talk your way out of trouble.", data: {id: "a-dance-in-fire", skill: "Speech", series: "Shadow"}}
  "The Wolf Queen": {text: "Once per day, you may slip out of a scene unnoticed, even in company, so long as no one is holding on to you.", data: {id: "the-wolf-queen", skill: "Speech", series: "Shadow"}}
  "Ice and Chitin": {text: "While you wear light armor, you need not save to cross thin ice, loose scree, or rotten floors that would give way beneath someone in mail or plate.", data: {id: "ice-and-chitin", skill: "Light Armor", series: "Shadow"}}
  "Light Armor Repair": {text: "You can mend and temper light armor anywhere: an awl, a sewing kit, and a quiet hour replace the forge.", data: {id: "light-armor-repair", skill: "Light Armor", series: "Shadow"}}
  "The Rear Guard": {text: "You can go two full days without food before you are Deprived, not one.", data: {id: "the-rear-guard", skill: "Light Armor", series: "Shadow"}}
  "De Rerum Dirennis": {text: "A sip or a sniff tells you what any potion, poison, or alchemical ingredient does.", data: {id: "de-rerum-dirennis", skill: "Alchemy", series: "Shadow"}}
  "A Game at Dinner": {text: "No poison in food or drink takes you by surprise: you taste it in time, and you automatically pass saves against poison you have swallowed.", data: {id: "a-game-at-dinner", skill: "Alchemy", series: "Shadow"}}
  "Song of the Alchemists": {text: "When you brew during a Downtime Action, you make one extra potion or poison.", data: {id: "song-of-the-alchemists", skill: "Alchemy", series: "Shadow"}}
  "Herbalist's Guide to Skyrim": {text: "When you take the Supply action, you also gather 1d4 common reagents, and you know where the rarer ones grow.", data: {id: "herbalists-guide-to-skyrim", skill: "Alchemy", series: "Shadow"}}
---
table: spellbooks
title: "Spell Tomes"
description: "The school (d6), then the tome, which a school rolls on by itself, chosen or rolled (Destruction its element, then that column; a Scroll row its spell; Conjuration's 19–20 the Binding table); each tome's data.id is its compendium entry. 6 is the Warden's pick; better still, choose the school that fits the place. The Master tomes are on no table: place them deliberately."
dice: d6
