table: setting-unusual-weather
title: "Unusual Weather"
dice: d20
source: wardens-guide/setting-seeds#unusual-weather
entries:
  1: "A green-gold aurora burns overhead all day, bright enough to read by at noon."
  2: "Warm ash sifts from a clear sky and dusts everything gray, as though Red Mountain were near."
  3: "Snowflakes fall warm and dry, melting into nothing before they touch the ground."
  4: "A fog rolls in that quiets all sound — voices carry no further than arm's reach."
  5: "Distant horns echo on the wind with no army to sound them. By morning the sound is gone."
  6: "The hot springs steam far thicker than usual; the mist clings and smells faintly of sulfur and old blood."
  7: "Frost spreads across stone in the shape of runes no one can read."
  8: "A wind off the mountains carries a whispering, like a Voice half-heard. Animals flee before it."
  9: "The cold deepens so suddenly that water freezes in the waterskin; then, an hour later, it thaws."
  10: "Snow falls in great soft flakes that glow faintly blue, fading once gathered."
  11: "Rain falls in slow, fat drops that taste of ash and leave gray streaks on cloth."
  12: "A dry, electric stillness settles, and hair stands on end. Lightning walks the ridgelines all night."
  13: "Shadows lengthen and refuse to shorten, as if dusk had come at midday. The horses will not settle."
  14: "The air grows thin and hard to breathe, as though the party stood far higher than they do."
  15: "Clouds gather into the shape of a vast coiled serpent, then unravel before anyone can name it."
  16: "Masser hangs swollen and low, and on still nights a faint humming comes from its face."
  17: "A gentle rain glows at night and can be gathered into a flask; the light fades by dawn."
  18: "The stars wheel into strange new patterns, and every map and lodestar leads travelers astray."
  19: "A fine ash-fall coats the snow gray for a day; the next morning, mushrooms have sprung up everywhere."
  20: "A wind blows in from the west smelling of mead and pine smoke, and old grudges feel, for a day, forgivable."
