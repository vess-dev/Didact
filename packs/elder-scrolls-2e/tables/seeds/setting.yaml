table: setting-faction-action
title: "Faction Actions"
description: "Roll whenever a faction is positioned to advance a goal in its agenda. Data: goals achieved, advantages gained or lost, obstacles added."
dice: d6
source: wardens-guide/setting-seeds#faction-actions
entries:
  1: {text: "Failure: A new Obstacle is introduced, and an Advantage is lost.", data: {goals: 0, advantages: -1, obstacles: 1}}
  2: {text: "Setback: An Advantage is lost.", data: {goals: 0, advantages: -1, obstacles: 0}}
  3: {text: "Status Quo: Nothing is gained, but nothing is lost.", data: {goals: 0, advantages: 0, obstacles: 0}}
  4: {text: "Mixed Success: A goal is achieved, but an Advantage is lost.", data: {goals: 1, advantages: -1, obstacles: 0}}
  5: {text: "Success: A goal is achieved, and no Advantages are lost.", data: {goals: 1, advantages: 0, obstacles: 0}}
  6: {text: "Major Success: A goal is achieved, and a new Advantage is found.", data: {goals: 1, advantages: 1, obstacles: 0}}
