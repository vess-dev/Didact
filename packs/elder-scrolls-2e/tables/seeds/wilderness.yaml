table: forest-example-encounters
title: "Encounters (the example wild)"
description: "The example wild's own d6 encounter table: write one like it for each wild (two or three denizens, a hazard, a sign of the Spirit's agenda, one oddity)."
dice: d6
source: wardens-guide/wilderness-seeds#encounters
entries:
  1: "A small moss-bearded man argues with a screeching hawk. The bird clutches something bright."
  2: "A spriggan sits on a stone, a purple fungus creeping up her arms. There is murder in her eyes."
  3: "A patch of quicksand hides under soft-looking snow. A broken coil of rope lies nearby."
  4: "A snarling wolf pack rings a fresh kill. They have no wish to share."
  5: "Snowberries grow here in abundance. None have been touched, not even by birds."
  6: "A trap, hastily set and badly hidden. It reeks of bait."
