source: wardens-guide/dungeon-seeds#dungeon-die-drop-table
entries:
  1: {text: "Monster", data: {room: "monster", what: "dungeon-monster-group", detail: "dungeon-monster-activity"}}
  2-3: {text: "Lore", data: {room: "lore", what: "dungeon-lore-room-type", detail: "dungeon-lore-clue"}}
  4: {text: "Special", data: {room: "special", what: "dungeon-special", detail: "dungeon-special-feature"}}
