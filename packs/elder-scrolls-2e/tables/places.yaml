# Naming places, factions and realms (wardens-guide/naming-procedures). The formulas keep
# cairn-2e's ids and slots ({noun}, {adjective}, {poi}, {group}, {rulers}), so its
# generators name Skyrim's places with Skyrim's words.
table: poi-name
title: "Names formula"
description: "A POI's name. {poi} is the kind of place (Barrow, Cairn, Crypt, Tomb, Ruin, Hall, Watch, Tower, Fort, Keep, Hold, Mine, Pass, Bridge, Camp, Den, Cave, Falls, Stead, Mire, Stone, Shrine), e.g. `--with poi=Barrow`; for a region, its terrain or a synonym. Left out, a terrain synonym fills it. (The) and (the) are optional."
dice: d6
refs: {noun: "nouns", adjective: "adjectives", poi: "terrain-synonyms"}
source: wardens-guide/naming-procedures#names-formula
entries:
  1: "(The) {noun} {poi}"
  2: "(The) {adjective} {poi}"
  3: "{poi} of (the) {noun}"
  4: "{adjective} {poi} of (the) {noun}"
  5: "(The) {noun} {adjective} {poi}"
  6: "{poi} of (the) {adjective} {noun}"
---
table: poi-names
title: "POI names"
description: "A finished POI name in one roll: the names formula, each d6 row with and without its optional 'the'. Pass the kind of place, e.g. `--with poi=Barrow`; left out, a terrain synonym fills it. Generators use this one."
refs: {noun: "nouns", adjective: "adjectives", poi: "terrain-synonyms"}
source: wardens-guide/naming-procedures#generating-a-name
entries:
  - "The {noun} {poi}"
  - "{noun} {poi}"
  - "The {adjective} {poi}"
  - "{adjective} {poi}"
  - "{poi} of the {noun}"
  - "{poi} of {noun}"
  - "{adjective} {poi} of the {noun}"
  - "{adjective} {poi} of {noun}"
  - "The {noun} {adjective} {poi}"
  - "{noun} {adjective} {poi}"
  - "{poi} of the {adjective} {noun}"
  - "{poi} of {adjective} {noun}"
---
table: place-names
title: "Place names"
description: "A whole place name in one roll: the names formula (each d6 row with and without its optional 'the'), with a terrain synonym as the POI, as the book suggests for naming a region by its land."
refs: {noun: "nouns", adjective: "adjectives", poi: "terrain-synonyms"}
source: wardens-guide/naming-procedures#generating-a-name
entries:
  - "The {noun} {poi}"
  - "{noun} {poi}"
  - "The {adjective} {poi}"
  - "{adjective} {poi}"
  - "{poi} of the {noun}"
  - "{poi} of {noun}"
  - "{adjective} {poi} of the {noun}"
  - "{adjective} {poi} of {noun}"
  - "The {noun} {adjective} {poi}"
  - "{noun} {adjective} {poi}"
