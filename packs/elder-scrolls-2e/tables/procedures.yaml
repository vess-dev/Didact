# Tables the procedures roll (players-guide/procedures): the dungeon and wilderness events and
# the weather's difficulty. The weather type tables (weather-spring, …) are cairn-2e's, to
# the number.
table: dungeon-events
title: "Dungeon Events"
dice: d6
source: players-guide/procedures#dungeon-events
entries:
  1: {text: "Encounter: Roll on an encounter table. Possibly hostile. (See Reactions.)", data: {kind: "encounter"}}
  2: {text: "Sign: A clue, spoor, track, drained corpse, scratched ward, or scent is discovered.", data: {kind: "sign"}}
  3: {text: "Environment: The surroundings shift or escalate. Water rises through a flooded crypt, a ceiling sloughs ice, a Dwarven automaton clanks awake, a draugr ritual nears its close.", data: {kind: "environment"}}
  4: {text: "Loss: A torch gutters out, an ongoing spell fizzles, a soul gem cracks. The party must resolve the effect before moving on.", data: {kind: "loss"}}
  5: {text: "Exhaustion: The party must rest (triggering another roll on this table), add a Fatigue, or consume a ration.", data: {kind: "exhaustion"}}
  6: {text: "Quiet: The party is left alone (and safe) for the time being.", data: {kind: "quiet"}}
---
table: wilderness-events
title: "Wilderness Events"
dice: d6
source: players-guide/procedures#wilderness-events
entries:
  1: {text: "Encounter: Roll on an encounter table for that terrain type or location. Don't forget to roll for NPC reactions if applicable.", data: {kind: "encounter"}}
  2: {text: "Sign: The party discovers a clue, spoor, or hint of a nearby encounter, locality, hidden feature, or some fact about an area ahead.", data: {kind: "sign"}}
  3: {text: "Environment: A shift in weather or terrain.", data: {kind: "environment"}}
  4: {text: "Loss: The party faces a choice that costs them a resource (rations, tools, a lamed pack-mule), time, or effort.", data: {kind: "loss"}}
  5: {text: "Exhaustion: The party meets a barrier (a snowed-over pass, a flooded ford, a rockslide), forcing effort, care, or delay. This might mean spending extra time (and an additional Wilderness Action) or adding Fatigue to inventory.", data: {kind: "exhaustion"}}
  6: {text: "Discovery: The party finds food, treasure, or other useful resources. The Warden may instead choose to reveal the primary feature of the area.", data: {kind: "discovery"}}
---
table: weather-effects
title: "Weather difficulty"
lookup: weather
source: players-guide/procedures#weather-difficulty
entries:
  "Nice": {text: "Favorable conditions for travel (clear skies, sun on the snow).", data: {watches: 0, fatigue: 0, step: 0}}
  "Fair": {text: "Favorable conditions for travel (overcast, a steady breeze).", data: {watches: 0, fatigue: 0, step: 0}}
  "Unpleasant": {text: "Add a Fatigue or add one watch to the journey (gusting winds, cold rain, light snowfall, biting chill).", data: {watches: 1, fatigue: 0, step: 0, either: true}}
  "Inclement": {text: "Add a Fatigue or add +1 watch. Increase terrain Difficulty by a step (sleet and thunder, freezing rain, deep slush underfoot).", data: {watches: 1, fatigue: 0, step: 1, either: true}}
  "Extreme": {text: "Add a Fatigue and add +1 watch. Increase terrain Difficulty by a step (blizzards, howling icy winds, whiteout snow, river floods). Without shelter, anyone is Deprived at once from the cold (`didact do exposure … extreme=true`).", data: {watches: 1, fatigue: 1, step: 1}}
  "Catastrophic": {text: "Most parties cannot travel under these conditions (full blizzard, avalanche, Solstheim ashstorm, tidal surge).", data: {impassable: true}}
