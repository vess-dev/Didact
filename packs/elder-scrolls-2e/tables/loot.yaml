# Loot (roll-tables/marketplace): the hoard and its tables. Prices and dice follow the
# Marketplace; potions, ingredients and soul gems follow Crafting.
table: hoard
title: "What's in the hoard?"
description: "To stock an urn, a chest, a lockbox or a coffin without designing it: weighted toward the common stuff. data.table names the table a result says to roll next (`didact gen run elder-scrolls-2e.loot` rolls it)."
dice: d100
source: roll-tables/marketplace#whats-in-the-hoard-d100
entries:
  1-10: "Empty. Picked clean long ago. Cobwebs, a cracked tankard, a single Septim wedged in a seam."
  11-22: {text: "A handful of Septims. Roll 2d10 × 5 Septims.", data: {coins: "2d10*5"}}
  23-34: {text: "A purse of coin. Roll 3d10 × 10 Septims.", data: {coins: "3d10*10"}}
  35-46: {text: "Common gear. Roll once on Random Gear.", data: {table: "random-gear"}}
  47-55: {text: "A weapon. Roll once on Random Weapon (re-roll a 20 unless the fiction supports a fine blade).", data: {table: "random-weapon"}}
  56-63: "Provisions. Rations (3 uses) and a full waterskin, plus 1d4 common reagents (see Potions & Ingredients)."
  64-71: {text: "Potions & ingredients. Roll once on Potions & Ingredients.", data: {table: "potions-and-ingredients"}}
  72-78: {text: "Armor. Roll once on Random Armor.", data: {table: "random-armor"}}
  79-84: {text: "A better weapon. Roll once on Random Weapon; it is already tempered — its die one rung higher (to a max of d12).", data: {table: "random-weapon", tempered: true}}
  85-89: {text: "Coin & treasure. Roll on Coin & Treasure.", data: {table: "coin-and-treasure"}}
  90-92: "A soul gem. Petty (1–3), lesser (4–5), or common (6) on a d6 — empty unless the fiction says otherwise."
  93-95: {text: "A Spell Tome or Scroll. Warden's pick, or roll on the Spell Tome roll table.", data: {table: "spellbooks"}}
  96: "A named weapon. Roll on the Unique Weapons roll table."
  97: "A named piece of armor. Roll on the Unique Armors roll table."
  98: {text: "A Relic. Bound magic with charges to spend — roll on the Relics roll table.", data: {table: "relics"}}
  99: "A trap. Something is in the hoard, but a ward or a rigged lid guards it: DEX save or take 1d6 STR damage (a poison needle, a falling lid, a flame rune). The loot beneath is one extra roll on this table, ignoring results of 96+."
  100: "The jackpot. A delver's dream. Roll twice more on this table and take both."
---
