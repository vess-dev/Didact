table: potions-and-ingredients
title: "Potions and ingredients"
dice: d20
source: roll-tables/marketplace#potions--ingredients-d20
entries:
  1-4: "1d4 common reagents — blue mountain flower, lavender, mudcrab chitin, and the like (petty)"
  5-6: "1d4 uncommon reagents — nightshade, deathbell, frost mirriam (petty)"
  7: "A prized reagent — giant's toe, salmon roe, or (rarely) a daedra heart (petty)"
  8-10: "Potion of Healing (restores 1d6 STR, petty, 1 use)"
  11: "Potion of Greater Healing (restores all lost STR, petty, 1 use)"
  12: "Potion of Cure Disease (petty, 1 use)"
  13: "Potion of Resist Fire, Frost, or Shock — attacks of that element against you are Impaired for the scene (petty, 1 use)"
  14: "Draught of Fortitude — re-roll one failed save before your next Downtime (petty, 1 use)"
  15: "Potion of Invisibility — unseen until you attack, cast, or the scene ends (petty, 1 use)"
  16: "Potion of Waterbreathing — breathe water for a scene (petty, 1 use)"
  17: "Coating poison (3 uses; the next hit with a coated weapon forces a STR save or 1d6 STR)"
  18: "A cruel poison — Paralytic or Lingering Poison, 1d3 uses (see Crafting)"
  19: "Antitoxin (cures one venom) and a Potion of Cure Disease"
  20: "A dose of Skooma — illegal and potent; STR save on use or be Deprived until a safe rest"
