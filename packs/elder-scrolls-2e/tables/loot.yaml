table: coin-and-treasure
title: "Coin and treasure"
dice: d8
source: roll-tables/marketplace#coin--treasure-d8
entries:
  1: {text: "Loose Septims (a pouch, a spilled drawer): 2d10 × 5 Septims", data: {value: "2d10 × 5 Septims"}}
  2: {text: "A purse or strongbox of coin: 3d10 × 10 Septims", data: {value: "3d10 × 10 Septims"}}
  3: {text: "Worked goods — silverware, candlesticks, a circlet: 2d6 × 25 Septims to fence", data: {value: "2d6 × 25 Septims to fence"}}
  4: {text: "Loose gems — garnet, amethyst, sapphire, a flawless diamond: 1d6 × 50 Septims (Warden picks the stone)", data: {value: "1d6 × 50 Septims (Warden picks the stone)"}}
  5: {text: "Smithing ingots — steel, Dwarven, silver, gold, moonstone: 1d4 ingots, 50–200 Septims the lot, or smithing stock", data: {value: "1d4 ingots, 50–200 Septims the lot, or smithing stock"}}
  6: {text: "A small treasure cache: 2d6 × 50 Septims in mixed jewelry, ingots, and curios", data: {value: "2d6 × 50 Septims in mixed jewelry, ingots, and curios"}}
  7: {text: "A filled soul gem: petty (1–3), lesser (4–5), or common (6) on a d6 — ready to enchant or recharge", data: {value: "petty (1–3), lesser (4–5), or common (6) on a d6 — ready to enchant or recharge"}}
  8: {text: "A locked or warded chest: Roll once more on What's in the Hoard? for the contents within", data: {value: "Roll once more on What's in the Hoard? for the contents within"}}
