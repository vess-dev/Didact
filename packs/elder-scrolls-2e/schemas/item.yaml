# Items, Spell Tomes, Relics and Skill Books (players-guide/marketplace, players-guide/crafting,
# wardens-guide/spell-tomes, relics, unique-weapons, unique-armors, skill-books). These replace
# cairn-2e's `item`, `spellbook` and `relic` (prices in Septims; body armor marked as a suit);
# `skill-book` is the hack's own.
type: item
label: Item
fields:
  size: {kind: enum, values: [petty, normal, bulky], default: normal, help: "Petty: no slot; bulky: two."}
  damage: {kind: dice, help: "A weapon's damage die (d4–d12); two weapons at once (the book's d8+d8: roll both, keep the highest) is '{d8, d8}kh1'."}
  armor: {kind: int, min: 0, max: 3, help: "Armor it gives while worn or held: a shield or helmet +1, light armor 1, mail 2, plate 3."}
  suit: {kind: int, min: 0, max: 3, help: "Body armor's Armor (the same as `armor`): one suit is worn at a time, and it replaces a draugr revenant's natural armor. Shields and helmets have none."}
  uses: {kind: uses, help: "Uses before it's gone: torches 3, rations 3, an oil flask 6, a potion 1."}
  charges: {kind: uses, help: "A Relic's charges (no Fatigue): spent with `didact inv use`, restored as its Recharge says."}
  recharge: {kind: text, help: "The condition that restores its charges."}
  price: {kind: int, min: 0, help: "In Septims."}
  slots: {kind: int, min: 0, help: "Extra inventory slots it gives (carts, horses, mules)."}
  qualities: {kind: tags, help: "bulky, two-handed, silver, ranged, blast, slow, masterwork, …"}
  material: {kind: enum, values: [Iron, Steel, Dwarven, Elven, Orcish, Glass, Ebony, Nordic, Stalhrim, Dragonbone, Daedric], help: "The smith's material tier: fiction and worth, never the numbers (players-guide/crafting#material-tiers)."}
  tempered: {kind: flag, help: "Tempered (or masterwork): its one step is used; it can't be tempered again."}
  enchantment: {kind: text, help: "A crafted Relic's bound effect (`didact do enchant`)."}
  note: {kind: text, help: "Anything else the book says: \"25 ft\", \"fits 2\", \"per night\"."}
guidance: >-
  Price it against the Marketplace (Septims): d6 weapons 5 (dagger, hatchet, club, staff,
  sling), d8 10 (sword, mace, war axe, spear), d10 bulky two-handed 20 (greatsword, battleaxe,
  warhammer); a bow is d6 bulky 20, a crossbow d8 bulky 30. Shield or helmet +1 for 10, light
  armor 1 for 15, mail 2 bulky 40, plate 3 bulky 60; armor never goes past 3 and damage never
  past d12, whatever the material (finer makes cost ×5, ×20 or ×50). Uses: torches 3, rations
  3, an oil flask 6, potions 1. Petty items take no slot; bulky ones two.
---
type: spellbook
extends: item
label: Spell Tome
fields:
  spell: {kind: text, help: "The spell's effect. Casting adds a Fatigue."}
  school: {kind: enum, values: [Destruction, Restoration, Alteration, Illusion, Conjuration, Mysticism], help: "A flavor label only: every tome casts the same way."}
  rank: {kind: enum, values: [Novice, Apprentice, Adept, Expert, Master], help: "How rare and potent it is, not who may read it."}
guidance: >-
  A Spell Tome holds one spell and takes one slot; it can't be cheaply copied: it's found. Write
  the spell as one plain sentence of effect (`spell`) in Cairn's terms (a die never above d12,
  Armor never above 3, mind-magic as saves), its school and rank, then the book's own quirk in
  `description` ("Warm to the hold; the margins are singed brown"). Casting needs both hands and
  adds a Fatigue; a Scroll is petty and adds none.
---
type: relic
extends: item
label: Relic
fields:
  effect: {kind: text}
  category: {kind: text, help: "Amulet, ring, staff, oddment; unique weapon, unique armor, Dragon Priest mask; Daedric Artifact."}
guidance: >-
  A Relic is a wondrous item with a story: an effect in plain rule terms (never a save
  modifier), and charges with a Recharge condition (a filled soul gem for some, a stranger rite
  for most), uses, or nothing at all when it simply works. Give damage (never past d12) or Armor
  (never past 3) if it's a weapon or worn. Relics don't cause Fatigue. At most one enchanted ring
  and one enchanted amulet at a time; an amulet that grants Armor counts as a helmet.
---
type: skill-book
extends: item
label: Skill Book
fields:
  perk: {kind: text, help: "The small, permanent perk it grants the first character who reads it."}
  skill: {kind: text, help: "The skill it's known for (One-Handed, Alchemy, …): flavor only."}
  series: {kind: enum, values: [Steel, The Arcane, Shadow], help: "Steel (warrior), the Arcane (mage) or Shadow (thief)."}
  rare: {kind: flag, help: "Rare: placed deliberately, as the reward for real risk."}
guidance: >-
  A Skill Book takes a slot; reading it takes a turn somewhere safe and quiet (`didact do
  read-book`), consumes it, and fills one of five Skill-Book slots with its perk for good. A perk
  is narrow: a named trick, a save no longer needed, a narrow re-roll, +1 maximum HP; never a
  save modifier.
