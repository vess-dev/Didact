id: elder-scrolls-2e
name: The Elder Scrolls 2e
kind: system
version: 0.1.0
description: >-
  The Elder Scrolls 2e: a Skyrim hack of Cairn Second Edition, set in the frozen province during
  the Dragon Crisis of 4E 201. Cairn's chassis unchanged, with Tamriel's ten races, fifty
  backgrounds, Septims, Spell Tomes and Skill Books, diseases, vampires and werewolves, hazards,
  crafting, companions and mounts, faction reputation, renown and Hold bounties, settlements,
  and its own bestiary, marketplace, relics, unique arms and armor, seeds and tables. A hack on
  top of cairn-2e: what it doesn't change comes from there, and what has no place in Skyrim is
  hidden.
requires: {packs: [core, cairn-2e]}
extends: [cairn-2e]
# What cairn-2e has that The Elder Scrolls 2e doesn't play with. This pack's items of the same
# id replace cairn-2e's and are never hidden; what is left of these goes. Kept from cairn-2e:
# its rules for saves, morale, retreat, the Die of Fate, panic's steadying, traps, getting lost,
# Fatigue, deprivation's relief, stabilizing, scars (and their tables), skipping camp, weather
# (and its season tables, the same as this book's), faction actions, bonds and omens, the
# reactions table, the unusual-weather option, attribute rerolls, and its place, monster and
# Marketplace generators (they roll this pack's tables). The dungeon turn, the watch, growth and
# attribute raises are this pack's, in this book's words and numbers.
hides:
  entry: ["*"]                    # Cairn's bestiary, Marketplace, relics, spellbooks, companions
  table:
    - "aurifex-*"                 # Cairn's backgrounds' tables (Cutpurse's are replaced)
    - "barber-surgeon-*"
    - "beast-handler-*"
    - "bonekeeper-*"
    - "fieldwarden-*"
    - "fletchwind-*"
    - "foundling-*"
    - "fungal-forager-*"
    - "greenwise-*"
    - "half-witch-*"
    - "hexenbane-*"
    - "jongleur-*"
    - "kettlewright-*"
    - "marchguard-*"
    - "mountebank-*"
    - "outrider-*"
    - "prowler-*"
    - "rill-runner-*"
    - "scrivener-*"
    - "forest-adjectives"         # Cairn's forest names: a wild is named last, from what it is
    - "forest-names"
    - "forest-nouns"
    - "npc-name-*"                # Cairn's NPC names: this pack's first-names are by race
    - "terrain-synonyms-beaches"  # terrains Skyrim's seed tables don't name
    - "terrain-synonyms-desert"
    - "terrain-synonyms-grasslands"
    - "terrain-synonyms-hollows"
    - "terrain-synonyms-oasis"
    - "terrain-synonyms-plateau"
    - "terrain-synonyms-swamp"
    - "terrain-synonyms-thickets"
    - "terrain-synonyms-tundra"
  trigger: [spirit-absorbs, stone-heart]   # Cairn's bonds 10 and 15: no such bonds here
  reference: ["*"]                # Cairn's rules text: this pack's own sections stand for it
  term: [spellbook]               # a Spell Tome here
license:
  spdx: CC-BY-SA-4.0
  redistributable: true
  attribution: >-
    The Elder Scrolls 2e is a fan work released under CC BY-SA 4.0. Rules chassis: Cairn Second
    Edition by Yochai Gal (cairnrpg.com), CC BY-SA 4.0. Conversion, tables and setting text: fan
    work, CC BY-SA 4.0; Elder Scrolls lore paraphrased from the community UESP wiki for
    non-commercial home use. This pack adapts its text and tables to Didact's format and is
    shared under the same license. An unofficial, non-commercial fan work; The Elder Scrolls and
    Skyrim are trademarks of Bethesda Softworks / ZeniMax. No copyrighted game text, art, logos
    or proprietary content is reproduced.
