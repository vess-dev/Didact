# A hack's settings go on top of cairn-2e's, key by key: the watches, time units and faction turn
# are cairn-2e's as they stand; these are the ones this book changes (the first round's mounted
# rider and Dremora, the names by race, the Warden's session zero).
settings:
  combat:
    mode: sides
    first: party
    round_one: >-
      In the first round, each PC must pass a DEX save to act: `didact do save who=<pc>
      attr=DEX` (special circumstances, abilities or items can waive it: a Dremora always acts).
      Those who fail lose their turn, and a panicked PC doesn't act in the first round. A rider
      on an untrained mount also saves WIL to keep it steady (`didact do startled-mount
      who=<pc>`). Then their opponents act; after that sides alternate, PCs first, results
      simultaneous.
    attack: attack
  names: {npc: first-names, place: place-names, poi: poi-names, faction: faction-names, realm: realm-names}
  # The Warden's guide's session zero (wardens-guide/getting-started): tone is the `tone` option,
  # safety Didact's lines and veils, stakes its lethality; these are the other two.
  session_zero:
    - {key: pacing, ask: "Pacing: one-shots, an arc of a few sessions, or a long campaign? How long is a session, and how often will you meet?"}
    - {key: scope, ask: "Scope: a focused quest (clear one barrow, end one feud), a Hold-spanning sandbox, or a guild or faction campaign (the Companions, the College, the Guild)?"}
