# Monsters and detachments (wardens-guide/bestiary, creating-monsters, detachments), and the
# creatures and vehicles that travel with the party (players-guide/marketplace#transport, the
# backgrounds' companions).
type: monster
label: Monster
fields:
  hp:
    kind: resource
    min: 0
    label: HP
    on_zero: "Lone foes save morale when they're reduced to 0 HP: `didact do morale who=<it>`."
    help: "3 is average, 6 hardy, 10+ a serious threat."
  armor: {kind: int, min: 0, max: 3, default: 0, help: "Subtracted from damage; never more than 3."}
  STR: {kind: stat, range: [0, 20], on_zero: {trigger: death}}
  DEX: {kind: stat, range: [0, 20], on_zero: {condition: paralyzed}}
  WIL: {kind: stat, range: [0, 20], on_zero: {condition: delirious}}
  attacks: {kind: list, help: "e.g. [{name: bite, damage: d8}]; two dice keep the highest: '{d6, d6}kh1' (the book's d6+d6)."}
  abilities: {kind: list, help: "Traits and special abilities, one line each."}
  critical: {kind: text, help: "What happens when a target fails its critical damage save (the attack shows it)."}
  category: {kind: text, help: "Avian, Beast, Fey, Undead, …"}
  conditions: {kind: conditions}
guidance: >-
  Describe it in plain words first, then stat it (or roll prompts: `didact gen run
  cairn-2e.monster`). HP is avoiding harm through toughness, speed or skill: 3 average, 6 hardy,
  10+ a serious threat. Armor 1–3 only if it can take a hit without moving. STR, DEX and WIL:
  3 deficient, 6 weak, 10 average, 14 noteworthy, 18 legendary; STR is surviving a hit, DEX
  starts at 10, WIL is presence and magic. Anything avoidable by ordinary means is an attack
  (a damage die: claws d6, a greatsword d10; several attacks become blast or two dice kept
  highest, written '{d6, d6}kh1'); anything else is an ability (one target: it just happens; a
  group: a save). Always write its critical damage: what happens to a target that fails the save
  ("Victim is choked unconscious"). Converting: HP = 3 + 1 per HD; Leather 1, Chainmail 2, Plate
  3 armor; WIL ≈ 1.5 × morale.
---
type: detachment
extends: monster
label: Detachment
fields:
  hp: {kind: resource, min: 0, label: HP, help: "The unit's HP, as one."}
  count: {kind: int, min: 1, help: "How many fight as one."}
  leader: {kind: ref, to: npc}
guidance: >-
  A detachment is routed or weakened when it takes critical damage and destroyed at 0 STR.
  Individuals' attacks against it are impaired (except blast); its attacks against individuals
  are enhanced and deal blast damage.
---
type: companion
extends: monster
label: Companion or mount
fields:
  hp: {kind: resource, min: 0, label: HP}
  owner: {kind: ref, help: "The character it follows."}
  slots: {kind: int, min: 0, default: 0, help: "What it can carry: a horse +4, a mule +6 (the Marketplace)."}
  inventory: {kind: slots, capacity: slots, sizes: {petty: 0, normal: 1, bulky: 2}, help: "What it carries, outside its rider's ten slots."}
  qualities: {kind: tags, help: "slow, …"}
  price: {kind: int, min: 0, help: "In gold pieces (the Marketplace)."}
  note: {kind: text}
guidance: >-
  A creature that follows a PC: a mount (a horse carries +4 slots, a mule +6 and is slow), a
  falcon, a familiar. It eats a Ration when the party makes camp. Its load is its own
  (`didact inv add <it> Rope`), outside its rider's ten slots.
---
type: vehicle
label: Vehicle
fields:
  slots: {kind: int, min: 0, default: 0, help: "What it carries: a cart +4, a wagon +8."}
  inventory: {kind: slots, capacity: slots, sizes: {petty: 0, normal: 1, bulky: 2}}
  qualities: {kind: tags, help: "bulky (a cart is pulled with both hands), slow (a wagon)."}
  price: {kind: int, min: 0}
  note: {kind: text}
guidance: >-
  A cart (+4 slots, bulky: pulled with both hands) or a wagon (+8 slots, slow) holds its load
  outside the ten slots of whoever pulls or drives it: `didact inv add <it> Rope`.
