# Procedures (players-guide/procedures): the dungeon cycle, the wilderness watch, weather, travel,
# downtime, and the faction turn; with the day's reminders when time passes.
procedure: dungeon-turn
title: Dungeon turn
help: >-
  One turn of the dungeon cycle: the Warden describes, the players act, then resources and
  conditions are recorded. Roll an event when the party lingers (more than one cycle in a place),
  hurries, enters a new area, or makes a loud disturbance. In a forestcrawl (place=forest) the
  Wilderness Events table replaces the Dungeon Events, and going off-trail always rolls one
  (trigger=off-trail).
params:
  trigger: {enum: [none, lingered, hurried, new-area, loud, off-trail], default: none}
  place: {enum: [dungeon, forest], default: dungeon}
steps:
  - let: {where: "if(@trigger == 'off-trail', 'forest', @place)"}
  - if: "@trigger == 'none'"
    then: [No event this turn.]
    else:
      - if: "@where == 'forest'"
        then:
          - table: wilderness-events
            as: event
          - if: "@trigger == 'off-trail'"
            then: ["Off the trail: the Warden made its costs clear (time, effort, tools, obvious dangers)."]
          - if: "@event.kind == 'exhaustion'"
            then: ["A barrier: spend extra time (another action) or add a Fatigue each (`didact do fatigue who=…`)."]
        else:
          - table: dungeon-events
            as: event
          - if: "@event.kind == 'exhaustion'"
            then: ["The party rests (roll again: `didact do dungeon-turn trigger=lingered`), adds a Fatigue each (`didact do fatigue who=…`), or eats a ration (`didact inv use <who> Rations`)."]
          - if: "@event.kind == 'loss'"
            then: ["Relighting spends a use: `didact inv use <who> torch` (3 lightings; a lantern relights 6 times per oil can)."]
      - if: "@event.kind == 'encounter'"
        then: ["Possibly hostile: roll their reaction (`didact do reaction who=…`)."]
  - reminder: "Record torches, rations and other uses spent, and any new conditions."
  - reminder: "A turn has passed: `didact time advance 1 turn`."
source: players-guide/procedures#dungeon-exploration-cycle
---
procedure: watch
title: Wilderness watch
help: >-
  One watch of the wilderness cycle. Everyone picks one Wilderness Action: travel (roll to get
  lost; shift=-1 or 1 makes it a step less or more likely), explore (find a location or
  feature), supply (1d4 rations, a step bigger per extra helper and per bonus for experience or
  equipment, up to 1d12) or make camp. Then the Warden rolls Wilderness Events, twice at night.
params:
  action: {enum: [travel, explore, supply, make-camp], default: travel}
  path: {enum: [road, trail, wilderness], default: trail}
  shift: {kind: int, default: 0, help: "Travel: getting lost a step more (+) or less (-) likely"}
  helpers: {kind: int, default: 0, help: "Supply: how many more party members help"}
  bonus: {kind: int, default: 0, help: "Supply: steps for relevant experience or equipment"}
  night: {kind: flag, default: false}
steps:
  - if: "@action == 'travel'"
    then:
      - check: lost
        with: {path: "@path", shift: "@shift"}
        as: way
  - if: "@action == 'supply'"
    then:
      - roll: "step(d4, max(0, min(@helpers + @bonus, 4)))"
        as: rations
      - message: "The party gathers {@rations} Rations (3 uses each): `didact inv add <who> Rations --count {@rations}`. (A home or village met along the way resupplies for gold and a full watch.)"
  - if: "@action == 'explore'"
    then: ["Exploring reveals a Location (shelter, village, cave, …) or a Feature (geyser, underground river, beached ship, …). Leaving still takes a Travel action."]
  - if: "@action == 'make-camp'"
    then: ["Make camp: `didact do make-camp who=<pc>` for each character; each (and each mount) eats a Ration. Skipping it: `didact do skip-camp who=<pc>`."]
  - table: wilderness-events
    as: event
  - if: "@event.kind == 'encounter'"
    then: ["Roll their reaction if it matters: `didact do reaction who=…`."]
  - if: "@night"
    then:
      - message: "At night, the Warden rolls twice:"
      - table: wilderness-events
        as: second
  - reminder: "A watch has passed: `didact time advance 1 watch`."
source: players-guide/procedures#wilderness-exploration-cycle
---
procedure: weather
title: Today's weather
help: >-
  Each day, roll the season's weather. Extreme twice in a row turns Catastrophic. The result
  says what it does to travel.
params:
  season: {enum: [spring, summer, fall, winter]}
steps:
  - table: weather-$season
    as: sky
  - table: weather-effects
    with: {weather: "@sky"}
    as: effect
  - message: "Weather: {@sky}. {@effect}"
source: players-guide/procedures#weather
---
procedure: travel-time
title: Travel time
help: >-
  How many watches a journey between two points takes: the path (roads none, trails +1,
  wilderness +2), its length (short +1, medium +2, long +3), the terrain (tough +1, perilous
  +2) and the weather (unpleasant or inclement: +1 watch or a Fatigue; extreme: both; inclement
  and extreme also make the terrain a step harder). Especially vast terrain adds up to +2
  (vast=1 or 2); traveling sleep-deprived makes the terrain a step harder (sleepless=true);
  mounts, guides and maps can save watches (bonus=n). Mixed terrain or weather: one leg at a
  time. Waterways use the surrounding terrain's Difficulty.
params:
  path: {enum: [road, trail, wilderness], default: trail}
  distance: {enum: [short, medium, long], default: medium}
  terrain: {enum: [easy, tough, perilous], default: easy}
  weather: {enum: [Nice, Fair, Unpleasant, Inclement, Extreme, Catastrophic], default: Fair}
  vast: {kind: int, default: 0, help: "Especially vast terrain: +0 to +2 watches"}
  sleepless: {kind: flag, default: false, help: "Sleep-deprived: the terrain is a step harder"}
  bonus: {kind: int, default: 0, help: "Watches saved by mounts, guides or maps"}
steps:
  - if: "@weather == 'Catastrophic'"
    then:
      - stop: "Catastrophic weather: most parties cannot travel at all."
  - if: "@vast < 0 or @vast > 2"
    then:
      - stop: "Vast terrain adds up to +2 watches: vast=0, 1 or 2."
  - let:
      path_cost: "if(@path == 'road', 0, if(@path == 'trail', 1, 2))"
      distance_cost: "if(@distance == 'short', 1, if(@distance == 'medium', 2, 3))"
      steps: "if(@weather == 'Inclement' or @weather == 'Extreme', 1, 0) + if(@sleepless, 1, 0)"
  - let: {terrain_cost: "min(2, if(@terrain == 'easy', 0, if(@terrain == 'tough', 1, 2)) + @steps)"}
  - let: {weather_cost: "if(@weather == 'Unpleasant' or @weather == 'Inclement' or @weather == 'Extreme', 1, 0)"}
  - let: {total: "@path_cost + @distance_cost + @terrain_cost + @weather_cost + @vast"}
  - let: {watches: "max(1, @total - @bonus)"}
  - message: "The journey takes {@watches} watches (path {@path_cost}, distance {@distance_cost}, terrain {@terrain_cost}, weather {@weather_cost}, vast {@vast}, saved {@total - @watches})."
  - if: "@weather == 'Unpleasant' or @weather == 'Inclement'"
    then: ["The party may instead add a Fatigue each to save the weather's extra watch."]
  - if: "@weather == 'Extreme'"
    then: ["Extreme weather: each character also adds a Fatigue."]
  - reminder: "Mixed terrain or weather along the way: run it for each leg and add them up (two watches of travel and a night's camp make a day)."
source: players-guide/procedures#travel-duration
