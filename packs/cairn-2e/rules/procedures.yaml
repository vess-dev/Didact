procedure: downtime
title: Downtime action
help: >-
  Between sessions, somewhere safe and not in recovery, a PC takes one Downtime Action at a time:
  research (a question and a Source), training (a skill and a Master), strengthening ties (an
  NPC or faction and an intent), or another the Warden allows. The Warden sets 1–5 Milestones,
  each with a Cost (gold, resources, reputation or a loss); each action completes one Milestone
  by paying its Cost (milestones=<tracker> ticks it). A PC may try to talk their way past a cost:
  the Warden states the risk, then a WIL save (abate=true) reduces or avoids it.
params:
  who: ref
  action: {enum: [research, training, ties, other], default: research}
  goal: {kind: text, help: "The question, skill or relationship; it must come from play"}
  gold: {kind: int, default: 0, help: "The Milestone's gold cost"}
  cost: {kind: text, optional: true, help: "A cost that isn't gold: resources, reputation, a loss"}
  abate: {kind: flag, default: false, help: "Try to reduce or avoid the cost by force of will"}
  safe: {kind: flag, default: true, help: "Is it safe? Downtime can't happen in unsafe conditions"}
  milestones: {kind: ref, optional: true, help: "The Milestones tracker (`didact track new … --kind track`)"}
steps:
  - if: "not @safe"
    then:
      - stop: "Downtime Actions can't be undertaken in unsafe conditions, or at a risk to {@who.name}'s safety."
  - if: "'critical' in @who.conditions or 'stabilized' in @who.conditions or 'mortal-wound' in @who.conditions"
    then:
      - stop: "{@who.name} is in recovery: no Downtime Actions until they heal (`didact do recover who={@who.id}`)."
  - let: {owed: "@gold", abated: false}
  - if: "@abate"
    then:
      - check: save
        with: {who: "@who", attr: WIL}
        as: will
      - if: "@will == 'success'"
        then:
          - let: {owed: 0, abated: true}
          - message: "{@who.name}'s force of will carries it: the cost is reduced or avoided."
        else: ["The risk comes to pass (the Warden stated it), and the cost stands."]
  - if: "@owed > 0 and @owed > @who.gold"
    then:
      - stop: "{@who.name} has {@who.gold}gp and the Milestone costs {@owed}gp: find another way."
  - if: "@owed > 0"
    then:
      - set: who.gold
        op: "-="
        value: "@owed"
      - do: coins
        with: {who: "@who"}
        go_on: true
  - if: "default(@cost, '') <> '' and not @abated"
    then: ["The Milestone's cost is paid: {@cost}."]
  - message: "{@who.name} spends a Downtime Action on $action: $goal."
  - if: "default(@milestones, '') <> ''"
    then:
      - if: "default(@milestones.value.size, 0) == 0"
        then:
          - reminder: "A Milestone is complete: `didact track tick {@milestones}`."
        else:
          - if: "@milestones.value.value < @milestones.value.size"
            then:
              - set: milestones.value.value
                op: "+="
                value: 1
              - message: "A Milestone is complete: {@milestones.value.value} of {@milestones.value.size}."
              - if: "@milestones.value.value == @milestones.value.size"
                then: ["Every Milestone is complete: the goal is reached ({@who.name}'s $action pays off)."]
            else: ["Every Milestone of {@milestones} was already complete."]
      - reminder: "The Warden may add or drop Milestones as play unfolds (`didact track tick {@milestones} --by -1` takes one back)."
    else:
      - reminder: "Milestones: `didact track new '$goal' --kind track --size <1-5> --for {@who.id}`, then `didact track tick <tracker>` for each one completed."
  - reminder: "Growth may follow when the work comes from play: `didact char advance {@who.id} source=downtime`."
source: players-guide/procedures#downtime
---
action: faction-action
title: Faction action
help: >-
  Factions act even when the PCs don't. When the fiction positions a faction to advance a goal
  (or at a faction turn), roll Faction Actions. Opposed by another faction, the one most at
  risk first saves WIL (its highest-ranking agent's): on a failure it doesn't act this time.
  The PCs' actions can overrule the roll or shift it either way.
params:
  who: ref
  opposed: {kind: flag, default: false, help: "Another faction opposes it, and this one is most at risk"}
steps:
  - if: "@opposed"
    then:
      - check: save
        with: {who: "@who", attr: WIL}
        as: hold
      - if: "@hold == 'failure'"
        then:
          - stop: "{@who.name} is outmaneuvered and doesn't act this time."
  - table: setting-faction-action
    as: result
  - if: "@result.goals > 0"
    then:
      - set: who.progress
        op: "+="
        value: "@result.goals"
      - message: "{@who.name} achieves a goal of its agenda."
  - if: "@result.advantages < 0"
    then: ["{@who.name} loses an Advantage: remove one (`didact set {@who.id} advantages-='…'`)."]
  - if: "@result.advantages > 0"
    then: ["{@who.name} finds a new Advantage: `didact table roll setting-faction-advantage`, then add it."]
  - if: "@result.obstacles > 0"
    then: ["A new Obstacle stands in {@who.name}'s way: `didact set {@who.id} obstacles+='…'`."]
  - reminder: "Show the faction's progress in the world (and on the map). Completing its agenda can change the region."
source: wardens-guide/setting-seeds#faction-actions
---
trigger: new-day
title: A new day
help: >-
  When game time crosses into a new day: the day's weather. A calendar whose seasons are
  spring, summer, fall and winter rolls it; without seasons, a reminder (a setting's own
  calendar, like Vald's, brings its own).
on: time
when: >-
  @time.day > (@time.seconds - @time.passed) // 86400 + 1 and (default(@time.season, '') == ''
  or @time.season == 'spring' or @time.season == 'summer' or @time.season == 'fall'
  or @time.season == 'winter')
steps:
  - if: "default(@time.season, '') == ''"
    then:
      - reminder: "A new day: roll its weather (`didact do weather season=<spring|summer|fall|winter>`)."
    else:
      - do: weather
        with: {season: "@time.season"}
source: players-guide/procedures#weather
---
trigger: still-deprived
title: Still deprived
help: "A new day finds a PC still deprived: the day counts once `deprive` says so (a Fatigue past the first)."
on: time
for: pcs
params: {who: ref}
when: "@time.day > (@time.seconds - @time.passed) // 86400 + 1 and 'deprived' in @who.conditions and not ('walloped' in @who.conditions) and @who.status <> 'dead'"
steps:
  - reminder: "A new day, and {@who.name} is still deprived (day {default(@who.deprived_days, 1)} so far): if the need is still unmet, `didact do deprive who={@who.id} need=…` counts this day (a Fatigue past the first); when it's met, `didact do relieve who={@who.id}`."
source: players-guide/core-rules#deprivation--fatigue
---
trigger: spirit-absorbs
title: The Mischievous Spirit absorbs a Fatigue
help: "Bond 10: the consumed spirit occupies a slot but absorbs one Fatigue each day."
on: time
for: pcs
params: {who: ref}
when: "@time.day > (@time.seconds - @time.passed) // 86400 + 1 and 'Mischievous Spirit' in @who.inventory and default(@who.fatigue, 0) > 0"
steps:
  - set: who.fatigue
    op: "-="
    value: 1
  - message: "The Mischievous Spirit absorbs one of {@who.name}'s Fatigue (it wants them alive, for now)."
source: players-guide/character-creation#bonds
---
trigger: stone-heart
title: The Stone Heart grows heavier
help: >-
  Bond 15: the Stone Heart grows heavier by one slot each month (its weight is the `burden`
  counter). A calendar with months (a setting's, like Vald's) counts its own; the core rules
  have none, so there a month is 30 days. A long skip past several months counts the first by
  the calendar and the others as 30 days each.
on: time
for: pcs
params: {who: ref}
when: >-
  default(@who.burden, 0) > 0 and if(default(@time.day_of_month, 0) > 0,
  @time.passed > (@time.day_of_month - 1) * 86400 + @time.seconds % 86400,
  (@time.day - 1) // 30 > ((@time.seconds - @time.passed) // 86400) // 30)
steps:
  - let:
      months: >-
        if(default(@time.day_of_month, 0) > 0,
        1 + (@time.passed - (@time.day_of_month - 1) * 86400 - @time.seconds % 86400 - 1) // 2592000,
        (@time.day - 1) // 30 - ((@time.seconds - @time.passed) // 86400) // 30)
  - set: who.burden
    op: "+="
    value: "@months"
  - message: "{@who.name}'s Stone Heart grows heavier: it takes {@who.burden} slots now. Until the debt is lifted, they cannot truly die."
source: players-guide/character-creation#bonds
