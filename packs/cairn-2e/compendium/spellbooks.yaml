# Spellbooks (wardens-guide/spellbooks). `spell` is the spell's effect; `description` is the
# book's unusual property (the italic text in the book).
id: adhere
type: spellbook
name: Adhere
spell: "An object is covered in extremely sticky slime."
description: "Adjacent objects stick to the book with great force."
source: wardens-guide/spellbooks#spellbooks
