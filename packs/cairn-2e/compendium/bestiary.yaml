DEX: 12
WIL: 15
attacks:
  - {name: fists, damage: "{d4, d4}kh1"}
abilities:
  - Completely invisible and silent.
  - Attacks deal direct STR damage (subtracting Armor).
source: wardens-guide/bestiary#invisible-stalker
body: |
  Intelligent beings shaped into reality by a powerful wizard.
---
id: killer-bees
