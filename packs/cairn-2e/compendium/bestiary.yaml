  Holy servants bound to a particular deity. Typically travel in groups of four or more.
---
id: aranea
type: monster
name: Aranea
category: Insectoid
hp: 6
STR: 13
DEX: 12
WIL: 15
attacks:
  - {name: bite, damage: d8}
