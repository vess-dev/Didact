source: wardens-guide/bestiary#ogre
body: |
  Massive, gluttonous brutes of ill-spirit and low intelligence.
  Easily impressed by shiny materials, keeping sacks of gold and treasure in their lairs.
---
id: owlbear
type: monster
name: Owlbear
category: Hybrid
hp: 9
STR: 16
DEX: 12
WIL: 5
attacks:
  - {name: beak, damage: d10}
  - {name: claws, damage: "{d8, d8}kh1"}
critical: "A piece of armor is rent and destroyed."
source: wardens-guide/bestiary#owlbear
body: |
  Bear-like carnivores with the face of an owl. Found in dense forests. Rumored spawn of a magical mishap.
---
id: phoenix
type: monster
name: Phoenix
category: Avian
hp: 4
STR: 15
DEX: 13
WIL: 12
attacks:
  - {name: talons, damage: "{d10, d10}kh1"}
abilities:
  - If killed, they explode in a burst of flames. They are reborn 1d3 days later from the ashes.
source: wardens-guide/bestiary#phoenix
body: |
  Intelligent, hawk-like spirits of pure flame, found in isolated deserts and high mountains.
  Their feathers are highly-sought after for their healing properties.
---
id: pixie
type: monster
name: Pixie
category: Fey
hp: 3
STR: 3
DEX: 15
WIL: 13
abilities:
  - Naturally invisible.
  - Can cast Sleep and Masquerade at will.
source: wardens-guide/bestiary#pixie
body: |
  Tiny humanoids with insectoid wings.
---
id: purple-worm
type: monster
name: Purple Worm
category: Behemoth
hp: 18
armor: 1
STR: 18
DEX: 8
WIL: 6
attacks:
  - {name: bite, damage: d12}
abilities:
  - Treated as a detachment.
critical: "The target is devoured, taking d8 STR damage from the acid in the worm's stomach."
source: wardens-guide/bestiary#purple-worm
body: |
  Gargantuan worms that lair in enormous burrows deep underground, only coming to the surface to eat. Found in high deserts and hot tundra.
---
id: red-cap
type: monster
name: Red Cap
category: Fey
hp: 6
STR: 6
DEX: 12
WIL: 8
attacks:
  - {name: dual sickles, damage: "{d6, d6}kh1"}
critical: "Target is eviscerated, the spray of their blood restoring STR loss suffered by the Red Cap."
source: wardens-guide/bestiary#red-cap
body: |
  Born from blood left to rot in the land of Fairy. Their hats are a deep red from the blood they bathe in.
  Ignore those with little to live for, as there is no pleasure in their murder.
---
id: reptilian
type: monster
name: Reptilian
category: Lizard
hp: 5
armor: 1
STR: 14
DEX: 12
WIL: 5
attacks:
  - {name: bone spear, damage: d8}
source: wardens-guide/bestiary#reptilian
body: |
  Amphibian humanoids that live in large tribes near swamps and jungles.
  Craft their armor and weapons from the bones of their prey. They will eat anything, including humanoids.
---
id: root-goblin
type: monster
name: Root Goblin
category: Goblinoid
hp: 4
STR: 8
DEX: 14
WIL: 8
attacks:
  - {name: spear, damage: d6}
source: wardens-guide/bestiary#root-goblin
body: |
  Avoid combat unless they have the advantage (such as greater numbers).
  Guard their stolen goods to the death.
  Root Goblins prize spellbooks and are always willing to trade.
---
id: root-witch
type: monster
name: Root Witch
category: Plant
hp: 8
STR: 9
DEX: 16
WIL: 14
attacks:
  - {name: tuber-fingers, damage: d6}
source: wardens-guide/bestiary#root-witch
body: |
  Excellent tunnelers that hide underground near water. Wiggle tiny fronds into the air as lures.
  Above-ground, appear vaguely humanoid with the face of a rotted tree stump.
  Will exchange rare minerals for a “fresh corpse” of any kind.
---
id: rust-monster
type: monster
name: Rust Monster
category: Unusual
hp: 5
STR: 16
DEX: 13
WIL: 5
attacks:
  - {name: bite, damage: d6}
abilities:
  - Any mundane metals their antennae touch instantly become rust. Can smell metal from a long distance away.
critical: "Metal armor rusts into useless weight."
source: wardens-guide/bestiary#rust-monster
body: |
  Armadillo-like creatures with club-like tails and long antennae. Feed on iron and rusted metal.
---
id: sea-hag
type: monster
name: Sea Hag
category: Fey
hp: 6
STR: 11
DEX: 15
WIL: 14
attacks:
  - {name: long claws, damage: "{d6, d6}kh1"}
abilities:
  - Immune to magic from spellbooks.
  - "Hideous Gaze: A target is overcome with fear (HP drops to 0). WIL save each round to break the spell."
source: wardens-guide/bestiary#sea-hag
body: |
  Ghostly, green-skinned hags that dwell in seaweed forests and warm shallow waters.
---
id: shadow
type: monster
name: Shadow
category: Incorporeal
hp: 14
STR: 1
DEX: 18
WIL: 14
attacks:
  - {name: draining touch, damage: d6, qualities: [ignores armor]}
abilities:
  - Unharmed by mundane attacks, sleep or mind control.
critical: "Target loses d4 STR. If reduced to 0 STR, they become a shadow as well."
source: wardens-guide/bestiary#shadow
body: |
  Incorporeal monsters that look like animated shadows.
---
id: shambling-mound
type: monster
name: Shambling Mound
category: Plant
hp: 9
STR: 15
DEX: 6
WIL: 8
attacks:
  - {name: tendrils, damage: "{d8, d8}kh1"}
abilities:
  - Treated as a detachment.
critical: "Target is swallowed whole and dragged away."
source: wardens-guide/bestiary#shambling-mound
body: |
  Tall humanoids made of slimy vegetation. Dwell in dark swamps and damp undergrounds.
---
id: skeleton
type: monster
name: Skeleton
category: Undead
hp: 5
armor: 1
STR: 8
DEX: 13
WIL: 0
attacks:
  - {name: rusty sword, damage: d6}
  - {name: bow, damage: d6}
abilities:
  - If a skeleton is killed and its bones are not scattered, it reforms.
source: wardens-guide/bestiary#skeleton
body: |
  Frequently found serving a master or necromancer, often in groups of 3 or more.
  Found wearing whatever was on them at the time of their death.
---
id: sky-giant
type: monster
name: Sky Giant
category: Giant
hp: 12
armor: 1
STR: 16
DEX: 12
WIL: 14
attacks:
  - {name: mace, damage: d10}
abilities:
  - Treated as a detachment.
  - Missile attacks against them are impaired due to the powerful winds surrounding them.
source: wardens-guide/bestiary#sky-giant
body: |
  Towering, white-skinned giants that live in castles high in the mountains.
---
id: sphinx
type: monster
name: Sphinx
category: Mythical
hp: 18
STR: 12
DEX: 13
WIL: 18
attacks:
  - {name: claws, damage: "{d8, d8}kh1", qualities: [blast]}
  - {name: beak, damage: d10}
abilities:
  - Immune to magic of any kind.
  - "Roar: Anyone in earshot must save WIL or flee in fear."
source: wardens-guide/bestiary#sphinx
body: |
  Mythical beasts with the upper body and head of a human, the wings of an eagle, and the body of a lion.
  Poses riddles to anyone they meet. Failure to answer correctly is usually met with death. They know almost everything worth knowing.
---
id: storm-giant
type: monster
name: Storm Giant
category: Giant
hp: 18
armor: 2
STR: 18
DEX: 16
WIL: 18
attacks:
  - {name: great sword, damage: d12}
abilities:
  - Treated as a detachment.
  - Unharmed by lightning, can summon storm clouds at their will. Can fly with the wind as a their chariot.
  - "Thunderclap: Deals 4 STR damage against a single target. Targets wearing metal armor take double damage."
source: wardens-guide/bestiary#storm-giant
body: |
  Building-sized humanoids with bronze-hued skin and light-colored hair. Live on the highest mountain peaks and rockiest coastlines.
---
id: swine-thing
type: monster
name: Swine Thing
category: Shape Shifter
hp: 9
STR: 16
DEX: 8
WIL: 13
attacks:
  - {name: gore, damage: "{d6, d6}kh1"}
abilities:
  - Can only shapeshift at night.
  - "Charm: Target obeys the swine's every command until it is killed. WIL save once per round to break free."
source: wardens-guide/bestiary#swine-thing
body: |
  Obese humanoids that transform into massive porcine monstrosities to feast on human flesh.
  Prefer to hunt in isolated settlements close to forests and wetlands.
---
id: titan
type: monster
name: Titan
category: Giant
hp: 18
armor: 3
STR: 16
DEX: 15
WIL: 18
attacks:
  - {name: lightning sword, damage: d12}
abilities:
  - Treated as a detachment.
  - Can levitate, shape shift, and sculpt elements at will.
source: wardens-guide/bestiary#titan
body: |
  Mythical, humanoid giants of radiant beauty and powerfully athletic bodies. Beneficent of character, but prone to megalomania.
  Natives of other planes of existence, but sometimes have strongholds in the mortal world.
---
id: treant
type: monster
name: Treant
category: Plant
hp: 10
armor: 3
STR: 15
DEX: 3
WIL: 12
attacks:
  - {name: roots, damage: "{d8, d8}kh1", qualities: [blast]}
source: wardens-guide/bestiary#treant
body: |
  Sentient, bipedal trees with a vaguely humanoid face on their trunks. Found in the deepest part of the wood.
  Speak slowly and ponderously, with a deep voice. Timeless, living for thousands of years.
---
id: triton
type: monster
name: Triton
category: Humanoid
hp: 6
STR: 12
DEX: 15
WIL: 12
attacks:
  - {name: trident, damage: d8}
source: wardens-guide/bestiary#triton
body: |
  Aquatic humanoids with silvery skin, blue-green hair, and scaled legs ending in fins. Dwell in warmer waters close to land.
  Lair in beautiful castles sculpted from sea rock and coral. Command vast schools of fish for both protection and food.
---
id: troll
type: monster
name: Troll
category: Goblinoid
hp: 14
armor: 1
STR: 14
DEX: 12
WIL: 4
attacks:
  - {name: bite, damage: d10}
  - {name: claws, damage: "{d8, d8}kh1"}
abilities:
  - When taking Critical Damage, a Troll will continue fighting, despite loss of flesh and limb. Only when their STR is 0 are they truly killed. Unless their heads are bathed in acid, fire, or powerful magic, they will fully regenerate within 1d4 days.
source: wardens-guide/bestiary#troll
body: |
  Giant, warty humanoids of flesh and bark. Dwell underground or in deep forests, as well as the ruined homes of their former victims. Carnivorous.
---
id: unicorn
type: monster
name: Unicorn
category: Mythical
hp: 6
STR: 14
DEX: 12
WIL: 14
attacks:
  - {name: horn, damage: d10, qualities: [ignores armor]}
source: wardens-guide/bestiary#unicorn
body: |
  Magical horses with a single long horn on their foreheads. Timid, but proud and willful, are seen as divine beings.
  Their hair is worth a small fortune due to its powerful healing properties.
---
id: vampire
type: monster
name: Vampire
category: Undead
hp: 12
armor: 1
STR: 14
DEX: 12
WIL: 16
attacks:
  - {name: bite, damage: d10}
abilities:
  - Can change into a bat at will.
  - "Regeneration: A damaged vampire regains 6 HP when it bites a target that has blood. If killed, it becomes a cloud of gas and retreats to its coffin, reforming at the next nightfall. Can only be killed if exposed to sunlight or if the coffin is destroyed."
critical: "The vampire drains the target's essence, dealing d12 damage to WIL. If the target reaches 0 WIL this way, it dies and is raised as a thrall of the vampire."
source: wardens-guide/bestiary#vampire
body: |
  Charming, undead creatures that drink the blood of mortals. Act at night and sleep in a coffin during the day.
---
id: viper
type: monster
name: Viper
category: Beast
hp: 3
STR: 5
DEX: 12
WIL: 3
attacks:
  - {name: bite, damage: d6}
critical: "Target is poisoned, dying in 1d12 hours without a cure."
source: wardens-guide/bestiary#viper
body: |
  Poisonous snakes often found in caves, pits, and other dark places. An antitoxin can be made from their poison sacs.
  Use heat and smell to track their victims.
---
id: warp-panther
type: monster
name: Warp Panther
category: Magical
hp: 8
STR: 13
DEX: 16
WIL: 12
attacks:
  - {name: tentacles, damage: "{d8, d8}kh1", qualities: [blast]}
  - {name: bite, damage: d10}
abilities:
  - Resistant to magical attacks. Caster must make a WIL save for the intended effect to succeed.
  - Can teleport a short distance away at will. Hate Blink Dogs.
source: wardens-guide/bestiary#warp-panther
body: |
  Grotesque panther-like predators with long razored tentacles growing out of their backs.
---
id: warrior-snail
type: monster
name: Warrior Snail
category: Unusual
hp: 4
armor: 2
STR: 14
DEX: 6
WIL: 3
attacks:
  - {name: tentacles, damage: "{d8, d8}kh1"}
abilities:
  - Some species have colorful shells that can reflect magical attacks.
source: wardens-guide/bestiary#warrior-snail
body: |
  Giant armored snails with heavy, club-like tentacles.
---
id: water-elemental
type: monster
name: Water Elemental
category: Magical
hp: 14
STR: 15
DEX: 16
WIL: 4
attacks:
  - {name: spray, damage: d8}
abilities:
  - Mundane attacks against the Water Elemental are impaired.
critical: "Target is enveloped by the water and drowns in three rounds."
source: wardens-guide/bestiary#water-elemental
body: |
  Rare spirits of lakes, rivers, and seas.
---
id: werewolf
type: monster
name: Werewolf
category: Shape Shifter
hp: 8
STR: 15
DEX: 14
WIL: 6
attacks:
  - {name: claws, damage: "{d6, d6}kh1"}
  - {name: bite, damage: d8}
abilities:
  - Mundane attacks are impaired against werewolves, but attacks with weapons made of silver are enhanced.
critical: "Target becomes infected with lycanthropy, transforming into a werewolf by the next full moon."
source: wardens-guide/bestiary#werewolf
body: |
  Ferocious lycanthropes that can transform into a wolf-shape at will.
---
id: wight
type: monster
name: Wight
category: Undead
hp: 12
armor: 3
STR: 16
DEX: 8
WIL: 12
attacks:
  - {name: long sword, damage: d10}
critical: "On a fail, any STR loss is permanent."
source: wardens-guide/bestiary#wight
body: |
  Grotesque, fallen warriors, raised from death for ill purpose. Often astride equally nightmarish steeds, leading lesser undead creatures into battle.
---
id: will-o-wisp
type: monster
name: Will-o-Wisp
category: Fey
hp: 3
STR: 6
DEX: 17
WIL: 12
source: wardens-guide/bestiary#will-o-wisp
body: |
  Nocturnal spirits of cool flame, commonly found in dense woodlands, marshes, and swamps.
  Known to lead travelers astray, to a corpse, or back home again.
---
id: wolf
type: monster
name: Wolf
category: Beast
hp: 6
STR: 12
DEX: 14
WIL: 8
attacks:
  - {name: bite, damage: d8}
source: wardens-guide/bestiary#wolf
body: |
  Large canines that dwell primarily in forest or tundra.
  Can be trained with effort if captured at a young age.
---
id: wood-troll
type: monster
name: Wood Troll
category: Goblinoid
hp: 10
STR: 15
DEX: 12
WIL: 7
attacks:
  - {name: bite, damage: d8}
  - {name: club, damage: d10}
abilities:
  - If killed, they will slowly regenerate unless their corpse is taken out of the forest or burned with fire.
critical: "Moss and twigs begin growing out of target's wounds."
source: wardens-guide/bestiary#wood-troll
body: |
  Large humanoids with elongated arms made of bark or root. They live in forests, sharing a deep connection with the vegetation around them.
---
id: wyvern
type: monster
name: Wyvern
category: Avian
hp: 11
STR: 15
DEX: 14
WIL: 13
attacks:
  - {name: stinger, damage: d10}
critical: "The victim is impaled and held in place. The wyvern then bites their head off."
source: wardens-guide/bestiary#wyvern
body: |
  Large, intelligent, winged reptiles. Dwell in any terrain, but favor dry cliffs.
  Shy away from other creatures, preferring to silently stalk their targets from afar.
---
id: zombie
type: monster
name: Zombie
category: Undead
hp: 2
STR: 12
DEX: 6
WIL: 3
attacks:
  - {name: jagged nails, damage: d6}
abilities:
  - Immune to all mind-influencing effects.
  - If not utterly destroyed (by fire, complete dismemberment, etc.), the Zombie will rise again within a few minutes.
critical: "Target is infected and becomes deprived. Without the services of a specialist or healer, they will become a zombie in 1d4 days."
source: wardens-guide/bestiary#zombie
body: |
  Re-animated corpse brought back through necromantic ritual or fell influence.
