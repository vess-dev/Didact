  - {name: claws, damage: "{d6, d6}kh1"}
critical: "The Night Cat begins to eat the target (d4 STR damage) while they are still alive."
source: wardens-guide/bestiary#night-cat
body: |
  Intelligent, nocturnal marsupials that make their homes in forests and swamps. Hunt in packs.
---
id: night-hag
