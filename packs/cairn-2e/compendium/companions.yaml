id: living-nightmare
type: companion
name: Living Nightmare
attacks:
  - {name: claws, damage: "{d8, d8}kh1"}
abilities:
  - It dwells within you but manifests whenever you are in danger; it has your Attributes and HP.
  - It disappears on Critical Damage (you take 1d4 WIL damage), re-appearing again on the next full moon.
source: backgrounds/half-witch
