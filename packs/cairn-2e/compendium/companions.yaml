# The creatures and vehicles the backgrounds give (backgrounds/*), as records of their own:
# character creation makes them beside the character (`owner`), and `didact spawn <id>` makes
# one in play. Two weapons or claws (the book's d6+d6) keep the highest: '{d6, d6}kh1'.
id: falcon
type: companion
name: Falcon
hp: 3
STR: 5
DEX: 16
WIL: 4
attacks:
  - {name: claws, damage: "{d6, d6}kh1"}
  - {name: bite, damage: d8}
abilities:
  - It only eats live game.
source: backgrounds/fletchwind
body: A Fletchwind's hunting falcon.
