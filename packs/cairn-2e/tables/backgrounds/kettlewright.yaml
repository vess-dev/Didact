# Kettlewright (backgrounds/kettlewright): the background's two d6 tables.
table: kettlewright-1
title: What is your trade?
dice: d6
source: backgrounds/kettlewright
entries:
  1:
    text: "You build small contraptions for local guilds (and don't ask too many questions). Take an extra 40gp and a wanted poster with your face on it. Given time and materials, you can open almost any door or vault."
    data:
      add: {gold: 40}
      gear: [Wanted Poster]
  2:
    text: "You deal in home goods and tools, hawking your wares to townspeople across the lands. Take 20gp worth of items from the gear table. You are fluent in the Traveler's Cant."
    data: {gear_budget: 20}
  3:
    text: "You were a military smelter, before peace destroyed your livelihood. Take a smelting hammer (d10, bulky) and a tin helm (+1 Armor). Given time and adequate materials, you can repair armor."
    data:
      gear: [{name: Smelting Hammer, damage: d10, size: bulky}, {name: Tin Helm, armor: 1}]
  4:
    text: "You sell rare and quality items to monasteries and nobles alike. Take a Spyglass, a Necklace (petty) worth 20gp, and a Scroll of Mirrorwalk (petty)."
    data:
      gear:
        - Spyglass
        - {name: Necklace, size: petty, note: worth 20gp}
        - {name: Scroll of Mirrorwalk, size: petty, uses: 1, note: "a scroll: no Fatigue, gone after one use"}
  5:
    text: "You offer protection as a service, quietly watching for threats as money exchanges hands. You start with +d4 HP, and carry a Long Sword (d10, bulky) and a Gambeson (+1 Armor)."
    data:
      extra_hp: true
      gear: [{name: Long Sword, damage: d10, size: bulky}, {name: Gambeson, armor: 1}]
  6:
    text: "You scavenge raw tin and iron from battlefields, pulling teeth from still-twitching corpses. Start with a young Donkey (+4 slots, slow), a Crossbow (d8 damage, bulky), and a Saw (d6)."
    data:
      companion: young-donkey
      gear:
        - {name: Crossbow, damage: d8, size: bulky}
        - {name: Saw, damage: d6}
---
table: kettlewright-2
title: What never fails to get you out of trouble?
dice: d6
source: backgrounds/kettlewright
entries:
  1:
    text: "Fire Eggs: Six small pellets made of sea salt, wood, and crockery-dust. They explode at low heat (d8, blast) but the flames dissipate quickly."
    data:
      gear: [{name: Fire Eggs, damage: d8, uses: 6, qualities: [blast]}]
  2:
    text: "Black Tar: Versatile: both sticky and highly flammable. 3 uses."
    data:
      gear: [{name: Black Tar, uses: 3}]
  3:
    text: "Spiked Boots: Cracks heads (d8) as easily as it does ice and muck. Travel is also a bit slower, but easier."
    data:
      gear: [{name: Spiked Boots, damage: d8}]
  4:
    text: "Tinker's Paste: Seals shut any fist-sized opening. 3 uses."
    data:
      gear: [{name: Tinker's Paste, uses: 3}]
  5:
    text: "Fireworks: A dazzling albeit dangerous display. Enough explosive material to blow off a finger or three. 2 uses remain."
    data:
      gear: [{name: Fireworks, uses: 2}]
  6:
    text: "Carrion Cat: A clever pet, small enough to hide in your pack (bulky), but strong enough to scare off smaller predators. Requires one Ration a day, and it must be meat."
    data:
      gear: [{name: Carrion Cat, size: bulky}]
