# Half-Witch (backgrounds/half-witch): the background's two d6 tables.
table: half-witch-1
title: What did you bring back from the Unseelie Court?
dice: d6
source: backgrounds/half-witch
entries:
  1:
    text: "A Black Rose Fiddle (bulky). Its music causes intense sadness and immobility in nearby mortals. (Others are merely fascinated.) You don't know how to play."
    data:
      gear: [{name: Black Rose Fiddle, size: bulky}]
  2:
    text: "Paper legs. You are extremely light, and can fall a few stories without getting hurt. Try to avoid tearing them or getting them wet."
  3:
    text: "A Living Nightmare that dwells within you but manifests whenever you are in danger. It has your same Attributes and HP and attacks with claws (d8+d8). It disappears on Critical Damage (take 1d4 WIL damage), re-appearing again on the next full moon."
    data: {companion: living-nightmare}
  4:
    text: "A Raven Familiar [8 HP, 3 STR, 11 DEX, 13 WIL, beak, (d6)]. It speaks as an intelligent being and is entirely devoted to you."
    data: {companion: raven-familiar}
  5:
    text: "A Briar Thorn. It can pierce any organic material (quite painfully) but when removed leaves no trace of the intrusion."
    data:
      gear: [Briar Thorn]
  6:
    text: "A Fae creature's True Name. Use it to summon its owner for an act of great service, but only once. It could also fetch a hefty price, from the right buyer."
---
table: half-witch-2
title: "What concoction do you carry, and what rare ingredients did you gather to make it?"
dice: d6
source: backgrounds/half-witch
entries:
  1:
    text: "Rebirth Ash: Remnants of a bark spirit. Sprinkle to reignite a fire that has died or return to life a creature that has died only moments before. 3 uses."
    data:
      gear: [{name: Rebirth Ash, uses: 3}]
  2:
    text: "Glamour Feather: Plume of a firebird. Can make any creature appear convincingly as someone (or something) else. 1 use."
    data:
      gear: [{name: Glamour Feather, uses: 1}]
  3:
    text: "Hawthorn Seed: An acorn from the other side, gathered on the spring equinox. When planted, it sprouts a luxurious shelter, collapsing at moonrise the next day. 1 use."
    data:
      gear: [{name: Hawthorn Seed, uses: 1}]
  4:
    text: "Stonetree Sap: Sap obtained in exchange for blood. Hardens when rubbed on any surface (+1 Armor). 3 uses."
    data:
      gear: [{name: Stonetree Sap, uses: 3}]
  5:
    text: "Nightdust Powder: Made from the ritual burning of six owls. When tossed in the air, day turns to night for a short while. 2 uses."
    data:
      gear: [{name: Nightdust Powder, uses: 2}]
  6:
    text: "Hex Stone: Gathered from a river that flows from the other side. Removed from its iron tin, it can absorb the effects of an active magical effect. If destroyed, the magic is released. 1 use."
    data:
      gear: [{name: Hex Stone, uses: 1}]
