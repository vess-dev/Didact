# Marchguard (backgrounds/marchguard): the background's two d6 tables.
table: marchguard-1
title: Why did you take the Oath?
dice: d6
source: backgrounds/marchguard
entries:
  1:
    text: "Your family has a long tradition of serving, and you were trained from an early age on how to survive in the wild. When taking the Supply action, your yield increases by one step (e.g. 1d4 > 1d6)."
  2:
    text: "As a convict, the Oath was simply a means of avoiding punishment. Take a set of Lockpicks and the Key (petty) to a safehouse."
    data:
      gear: [Lockpicks, {name: Key, size: petty, note: to a safehouse}]
  3:
    text: "Noble-born, you joined to escape family trouble. Take a Goosefelt Tarp (fits two) that you stole before leaving home."
    data:
      gear: [{name: Goosefelt Tarp, note: fits two}]
  4:
    text: "When your family lost everything, you took the Oath to avoid becoming a burden. Take extra Rations (3 uses) and a brace of Throwing Knives (d6)."
    data:
      gear: [{name: Rations, uses: 3}, {name: Throwing Knives, damage: d6}]
  5:
    text: "Your life was saved by a member of the Marchguard, and you were inspired to join their ranks. Take a Snare Trap and a Sketchbook filled with detailed drawings."
    data:
      gear: [Snare Trap, Sketchbook]
  6:
    text: "You were in a dark place and decided that your life needed a little direction. You're still not so sure it was the right choice. Take an Oilskin Coat and Mapping Paper."
    data:
      gear: [Oilskin Coat, Mapping Paper]
---
table: marchguard-2
title: What do you carry as proof of your Oath?
dice: d6
source: backgrounds/marchguard
entries:
  1:
    text: "Impressive Pin: A metal badge of honor from the Guard. It can open doors but leaves a trail. Petty."
    data:
      gear: [{name: Impressive Pin, size: petty}]
  2:
    text: "Oath Compass: Points not towards North, but instead to the nearest member of the Guard. It also lets you know when they're getting close."
    data:
      gear: [Oath Compass]
  3:
    text: "Pullstones: Two jet-black stones. When separated, the stones will always roll toward one another."
    data:
      gear: [Pullstones]
  4:
    text: "Fireflask: Highly alcoholic, yet strangely delicious. When thrown, it creates a wall of flames 10ft high that burns out after a few minutes. 1 use."
    data:
      gear: [{name: Fireflask, uses: 1}]
  5:
    text: "Pain Band: Touch an injured creature to transfer their wounds to you. (Exchange their lost STR with your own.) Recharge: Wear the ring while in perfect health. You will lose 1 STR, permanently. Petty."
    data:
      gear:
        - {name: Pain Band, size: petty, recharge: "Wear the ring while in perfect health. You will lose 1 STR, permanently."}
  6:
    text: "Poacher's Woe: Strongly-scented arrows (3 uses). The scent is powerful enough to track with ease."
    data:
      gear: [{name: Poacher's Woe, uses: 3}]
