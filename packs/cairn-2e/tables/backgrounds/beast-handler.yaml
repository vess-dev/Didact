# Beast Handler (backgrounds/beast-handler): the background's two d6 tables.
table: beast-handler-1
title: What creature is your specialty?
dice: d6
source: backgrounds/beast-handler
entries:
  1:
    text: "Arachnids: Take a Quick-Flame Rod and an Oil Can (6 uses). It can destroy a large spider nest in seconds."
    data:
      gear: [Quick-Flame Rod, {name: Oil Can, uses: 6}]
  2:
    text: "Felines: Take a sack of Whiskerwort. Its odor can calm and control even the largest of cats."
    data:
      gear: [Whiskerwort]
  3:
    text: "Canines: Take a wreath of Wolfsbane and a Large Net. Effective against werewolves as well."
    data:
      gear: [Wolfsbane, Large Net]
  4:
    text: "Birds: Take a Warble-Whistle (3 charges). It can imitate any bird call and can even be used to send simple messages. Recharge: Feed a baby bird as its mother would, then blow."
    data:
      gear:
        - {name: Warble-Whistle, uses: 3, recharge: "Feed a baby bird as its mother would, then blow."}
  5:
    text: "Rodents: Take a Pan Flute that emits a high-pitched sound that only rodents can hear. So long as you play, they will follow, even to their deaths."
    data:
      gear: [{name: Pan Flute, note: emits a high-pitched sound that only rodents can hear}]
  6:
    text: "Serpents: Take a Warming Stone that generates an irresistible heat and a vial of Antitoxin (2 uses)."
    data:
      gear:
        - {name: Warming Stone, note: generates an irresistible heat}
        - {name: Antitoxin, uses: 2}
---
table: beast-handler-2
title: What have you learned from the creatures of the wild?
dice: d6
source: backgrounds/beast-handler
entries:
  1:
    text: "That there is far more to the world than meets the eye. With quiet concentration, you can borrow the senses of a nearby creature of your specialty."
  2:
    text: "That the behavior of beasts is a language in itself. When observing beasts of your specialty you gain insight into weather patterns and impending disasters."
  3:
    text: "That the pulse of the hunt is a powerful impulse. You have a sense for when predators, even those not of your specialty are near."
  4:
    text: "That the land is a language unto itself. Your chance of becoming lost in a terrain dominated by the beasts of your specialty is reduced by one step (e.g. 4-in-6 becomes 3-in-6)."
  5:
    text: "That nature's symphony can be heard if you attune to its rhythm. When surrounded by creatures of your specialty, they can alert you to approaching danger before it arrives."
  6:
    text: "That survival is all about adaptability. Once per day, you may take on a simple feature from a creature of your specialty (webbed fingers, night vision, etc.). Add a Fatigue each time."
