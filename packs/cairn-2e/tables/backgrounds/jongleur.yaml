# Jongleur (backgrounds/jongleur): the background's two d6 tables.
table: jongleur-1
title: What happened at your final performance?
dice: d6
source: backgrounds/jongleur
entries:
  1:
    text: "Despite your training in the deadly arts, an actor died and you were blamed. Take a light-weight Rapier (d6) and a false identity."
    data:
      gear: [{name: Rapier, damage: d6}]
  2:
    text: "The crowd loved your catchy tune about a noble and his romantic failings. The noble in question, not so much. Take the Read Mind Spellbook and a warrant for your arrest. Read Mind: You can hear the surface thoughts of nearby creatures. Long-term possession can cause the reader to mistake the thoughts of others as their own."
    data:
      gear: [Read Mind Spellbook]
  3:
    text: "Your debut composition reduced the audience to a gibbering mess, murmuring of bright creatures descending from the night sky. Later you noticed that the notes resembled stellar constellations. Take a Book On Astronomy, and a lot of questions."
    data:
      gear: [Book On Astronomy]
  4:
    text: "You mocked a forgotten trickster god and were cursed for it. You speak only in perfect rhyme. Ironically, this has only made you more popular among your peers. Take a Thesaurus (20gp). Without it, you are deprived."
    data:
      gear: [{name: Thesaurus, note: 20gp}]
  5:
    text: "You were scarred in an on-stage accident. The crowd cheered, thinking it was part of the act. Take well-worn Stage Mail (1 Armor), a memorable scar, and a fear of applause."
    data:
      gear: [{name: Stage Mail, armor: 1}]
  6:
    text: "Your respectable puppeteering skills were matched only by your mimicry. You were so good you were branded a witch (literally) and banished. Take an Uncanny Hand-Puppet and a Rabbit Skull (petty) that protects against charms."
    data:
      gear: [Uncanny Hand-Puppet, {name: Rabbit Skull, size: petty, note: protects against charms}]
---
table: jongleur-2
title: What trinket were you unable to leave behind?
dice: d6
source: backgrounds/jongleur
entries:
  1:
    text: "False Cuffs: Comfortable, realistic-looking cuffs. Only you know the trick to get out of them."
    data:
      gear: [False Cuffs]
  2:
    text: "Pocket Theatre: A set of small puppets and a folding stage. Good for quick distractions."
    data:
      gear: [Pocket Theatre]
  3:
    text: "Ghost Violin: A dark-gray violin that plays a haunting tune, mirrored by an invisible, distant twin."
    data:
      gear: [Ghost Violin]
  4:
    text: "Tragic Tales: Banned in proper company, this book becomes less bawdy and more harrowing towards the end. Worth 100gp."
    data:
      gear: [{name: Tragic Tales, note: worth 100gp}]
  5:
    text: "Mythos Mask: A plaster mask that allows one to take on a monster's countenance. Once it comes off, add a Fatigue."
    data:
      gear: [Mythos Mask]
  6:
    text: "Rebreak Glass: A wine flute that can be broken multiple times, reforming after 24 hours. Makes a really loud noise."
    data:
      gear: [Rebreak Glass]
