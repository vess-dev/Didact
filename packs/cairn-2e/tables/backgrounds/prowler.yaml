# Prowler (backgrounds/prowler): the background's two d6 tables.
table: prowler-1
title: What did you last hunt?
dice: d6
source: backgrounds/prowler
entries:
  1:
    text: "A mock firefly, baiting water carriers with its glowing lure. Take an Alchemical Limb (d8, petty when worn) to replace the one it tore off and an Oil Can (6 uses). The limb is immune to heat and poison. Needs to be oiled daily."
    data:
      gear:
        - {name: Alchemical Limb, damage: d8, size: petty, note: petty when worn}
        - {name: Oil Can, uses: 6}
  2:
    text: "An ice nettle, trapping and draining sheep. You lost your commission when the fungus you introduced killed half the flock. Take a Rime Seed (1 use). It freezes any body of water, no matter the size. Don't eat it."
    data:
      gear: [{name: Rime Seed, uses: 1}]
  3:
    text: "A silver marsh crawler that killed someone close to you. You now carry its Tooth (petty) on a chain around your neck as a warning to others of its kind. The tooth hums softly when something is stalking you."
    data:
      gear: [{name: Tooth, size: petty}]
  4:
    text: "A malicious forest spirit that poisoned a homestead. You saved a Heartseed from the roots of a dying tree. (Plant it to create a new forest.) Also, take Iron Bracers (+1 Armor, bulky)."
    data:
      gear:
        - {name: Heartseed, note: Plant it to create a new forest.}
        - {name: Iron Bracers, armor: 1, size: bulky}
  5:
    text: "A hollow wolf that had been frightening travelers. You took pity on the half-starved creature and nursed it back to health. Now it is loyal to you unto death. It is also a great tunneler. 5 HP, 11 STR, 13 DEX, 8 WIL, teeth (d6)."
    data: {companion: hollow-wolf}
  6:
    text: "An azure warbler. The gametes attract a sizeable profit, if properly extracted. You succeeded but left its nest to the wolves. Take a Paring Knife (d6), an extra 20gp, and a pang of regret."
    data:
      add: {gold: 20}
      gear: [{name: Paring Knife, damage: d6}]
---
table: prowler-2
title: What tool is always in your pack?
dice: d6
source: backgrounds/prowler
entries:
  1:
    text: "Fermented Spirits: Keeps you warm at the best of times and as an explosive at the worst. 3 Uses."
    data:
      gear: [{name: Fermented Spirits, uses: 3}]
  2:
    text: "Trail Shaker: A noisy instrument that reveals nearby trails, even when deeply hidden."
    data:
      gear: [Trail Shaker]
  3:
    text: "Drowse Balm: A wax bar. If boiled in water, the steam acts as a soporific agent."
    data:
      gear: [Drowse Balm]
  4:
    text: "Spike and Cord: For traversing difficult terrain or for creating makeshift traps and structures."
    data:
      gear: [Spike and Cord]
  5:
    text: "Iron Rattle: A noisemaker for distracting or scaring your quarry. Sounds convincingly like a snake."
    data:
      gear: [Iron Rattle]
  6:
    text: "Hardening Glue: Makes any flat material (cloth, leather, sand) as hard as stone. Expensive (20gp a bottle, 3 uses)."
    data:
      gear: [{name: Hardening Glue, uses: 3, note: 20gp a bottle}]
