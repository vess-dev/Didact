# Rill Runner (backgrounds/rill-runner): the background's two d6 tables.
table: rill-runner-1
title: What songs are you best known for?
dice: d6
source: backgrounds/rill-runner
entries:
  1:
    text: "The Tinker's Two-Step. A humorous fairy tale about a gift-giving traveler. Start with a Reed Whistle. Anyone in earshot must pass a WIL save to perform an act of violence."
    data:
      gear: [Reed Whistle]
  2:
    text: "The Sylph and Her Lover. A bawdy tale of lost love. Start with a Breeze Knot (3 charges). Creates a strong breeze. Recharge: Tie it to a mast during a storm."
    data:
      gear: [{name: Breeze Knot, uses: 3, recharge: Tie it to a mast during a storm.}]
  3:
    text: "Harper's Devotion. A sad, short tale about a musician that falls in love with a star. Start with a Celestial Lute. Reveals the constellations above, no matter the weather."
    data:
      gear: [Celestial Lute]
  4:
    text: "The Reed Fisher. A celebrated song about a massive carp that always seems to get away. Begin with a spool of River Twine (5 uses). Each dip into the river guarantees a catch, though it might not be pleasant."
    data:
      gear: [{name: River Twine, uses: 5}]
  5:
    text: "Song of the Silver Stream. A wordless lullaby that mimics flowing water. Take a Stone Flute that can calm almost any river."
    data:
      gear: [{name: Stone Flute, note: can calm almost any river}]
  6:
    text: "The Thrush and the Meadow. A moody tale told in alternating chorus. Start with a Feather Quill (1 use, petty). A map drawn with this quill reveals the most expedient course between any two points."
    data:
      gear: [{name: Feather Quill, uses: 1, size: petty}]
---
table: rill-runner-2
title: What pays your way across the land?
dice: d6
source: backgrounds/rill-runner
entries:
  1:
    text: "Performance: Performing at taverns always yields both room and board. Sometimes you even get tips! Start with an extra 10gp."
    data:
      add: {gold: 10}
  2:
    text: "Bodyguard: You are a protector for those afraid to travel alone. Start with a Rapier (d8)."
    data:
      gear: [{name: Rapier, damage: d8}]
  3:
    text: "Wares: You buy low and sell high, always making just enough to get by. Take a single item worth 20gp (or less) from the gear table."
    data: {gear_single: 20}
  4:
    text: "Transport: You deliver \"delicate\" packages throughout the lands. You have at least one contact in any major town."
  5:
    text: "Sailor's Friend: Over troubled waters and dangerous winds, you always make sure a ship reaches its destination. For you, passage is always free."
  6:
    text: "Guide: You shepherd caravans and travelers across water-soaked lands. Start a map (petty) relevant to your next journey."
    data:
      gear: [{name: Map, size: petty, note: relevant to your next journey}]
