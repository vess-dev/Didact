# Barber-Surgeon (backgrounds/barber-surgeon): the background's two d6 tables.
table: barber-surgeon-1
title: "How have you \"improved\" yourself?"
dice: d6
source: backgrounds/barber-surgeon
entries:
  1:
    text: "You have a replacement eye that can magnify objects, act as a telescope, and provide minimal night vision. You cannot wear anything metal on your head, and the presence of strong magnets make you deprived."
  2:
    text: "One foot is mostly metal (kick, d6), and you treat some Tough terrain as Easy. Carry a Oil Can (6 uses). Without a daily application, you are deprived and noisy."
    data:
      gear: [{name: Oil Can, uses: 6}]
  3:
    text: "One of your fingers has been swapped, the bone replaced by gold and iron. Take a Hook and a Screwdriver that can attach to the fingertip."
    data:
      gear:
        - {name: Hook, note: can attach to the fingertip}
        - {name: Screwdriver, note: can attach to the fingertip}
  4:
    text: "Both ears have been surgically enhanced, tripling your hearing. You can focus on a specific sound, such as a conversation, at a great distance. You wear an ear flap to protect against sudden loud noises (WIL save to avoid temporary paralysis)."
  5:
    text: "Your chest is lined with alchemical sigils, toughening the skin (1 Armor). Wearing other metallic armor nullifies the effect."
  6:
    text: "One arm is fully metal and comes off at the shoulder. It can be used as a weapon (d8, bulky when not attached) and can move independently if you are within sight of it."
---
table: barber-surgeon-2
title: What rare tool is essential to your work?
dice: d6
source: backgrounds/barber-surgeon
entries:
  1:
    text: "Regrowth Salve: Regrows a body part over the course of a day. 1 use."
    data:
      gear: [{name: Regrowth Salve, uses: 1}]
  2:
    text: "Graftgrub: A small worm that can fuse inanimate objects with parts of the body. 1 use."
    data:
      gear: [{name: Graftgrub, uses: 1}]
  3:
    text: "Woundwax: Heals wounds from fire or chemicals (restoring full STR) but nothing else. 2 uses."
    data:
      gear: [{name: Woundwax, uses: 2}]
  4:
    text: "Quicksilver: A stimulant. Go first in combat, and automatically pass any WIL saves for one hour. Addictive: Save STR or become deprived after 24 hours without it. 4 uses."
    data:
      gear: [{name: Quicksilver, uses: 4}]
  5:
    text: "Pneuma Pump: Portable iron lungs (bulky). Enables life-saving surgery or underwater breathing."
    data:
      gear: [{name: Pneuma Pump, size: bulky}]
  6:
    text: "Lodestone: Draws out dangerous elements from the body and acts as a powerful magnetic force."
    data:
      gear: [Lodestone]
