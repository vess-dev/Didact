table: weather-effects
title: Weather difficulty
lookup: weather
source: players-guide/procedures#weather-difficulty
entries:
  Nice: {text: "Favorable conditions for travel (clear skies, sunny).", data: {watches: 0, fatigue: 0, step: 0}}
  Fair: {text: "Favorable conditions for travel (overcast, breezy).", data: {watches: 0, fatigue: 0, step: 0}}
  Unpleasant: {text: "Add a Fatigue or add one watch to the journey (gusting winds, rain showers, sweltering heat, chill air).", data: {watches: 1, fatigue: 0, step: 0, either: true}}
  Inclement: {text: "Add a Fatigue or add +1 watch. Increase terrain Difficulty by a step (thunderstorms, lightning, rain, muddy ground).", data: {watches: 1, fatigue: 0, step: 1, either: true}}
  Extreme: {text: "Add a Fatigue and add +1 watch. Increase terrain Difficulty by a step (blizzards, freezing winds, flooding, mud slides).", data: {watches: 1, fatigue: 1, step: 1}}
  Catastrophic: {text: "Most parties cannot travel under these conditions (tornados, tidal waves, hurricane, volcanic eruption).", data: {impassable: true}}
