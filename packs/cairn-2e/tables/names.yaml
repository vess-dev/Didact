# Naming procedures (wardens-guide/naming-procedures): the formulas and word tables
# for POIs, regions, factions, realms and forests, plus place-names (one roll).
# How they combine: NAMES.md.
table: poi-name
title: "Names formula"
description: "A POI's name. {poi} is the kind of place, e.g. `--with poi=Keep`; for a region, its terrain type or a synonym. Left out, a terrain synonym fills it. (The) and (the) are optional."
dice: d6
refs: {noun: nouns, adjective: adjectives, poi: terrain-synonyms}
source: wardens-guide/naming-procedures#names-formula
entries:
  1: "(The) {noun} {poi}"
  2: "(The) {adjective} {poi}"
  3: "{poi} of (the) {noun}"
  4: "{adjective} {poi} of (the) {noun}"
  5: "(The) {noun} {adjective} {poi}"
  6: "{poi} of (the) {adjective} {noun}"
---
table: poi-names
title: "POI names"
description: "A finished POI name in one roll: the names formula, each d6 row with and without its optional 'the'. Pass the kind of place, e.g. `--with poi=Keep`; left out, a terrain synonym fills it. Generators use this one."
refs: {noun: nouns, adjective: adjectives, poi: terrain-synonyms}
source: wardens-guide/naming-procedures#names-formula
entries:
  - "The {noun} {poi}"
  - "{noun} {poi}"
  - "The {adjective} {poi}"
  - "{adjective} {poi}"
  - "{poi} of the {noun}"
  - "{poi} of {noun}"
  - "{adjective} {poi} of the {noun}"
  - "{adjective} {poi} of {noun}"
  - "The {noun} {adjective} {poi}"
  - "{noun} {adjective} {poi}"
  - "{poi} of the {adjective} {noun}"
  - "{poi} of {adjective} {noun}"
---
table: place-names
