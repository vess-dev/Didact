source: wardens-guide/naming-procedures#generating-names
entries:
  - "The {noun} {poi}"
  - "{noun} {poi}"
  - "The {adjective} {poi}"
  - "{adjective} {poi}"
  - "{poi} of the {noun}"
  - "{poi} of {noun}"
  - "{adjective} {poi} of the {noun}"
  - "{adjective} {poi} of {noun}"
  - "The {noun} {adjective} {poi}"
