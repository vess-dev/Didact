# The Marketplace as tables (players-guide/marketplace), for the weapon, armor and gear
# generators. The book prices its goods but gives no die: every item here is equally likely.
# Each entry's `data.id` is its compendium entry (compendium/marketplace.yaml).
table: marketplace-weapons
title: "Marketplace: weapons"
description: "The book gives no die for the Marketplace: each item here is equally likely."
