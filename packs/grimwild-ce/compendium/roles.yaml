# Grimwild: Community Edition (Preview 5.3), Chapter 3: GM Toolkit, Combat Kit: Roles (pp. 110-111).
# CC0 1.0. The ten combat roles: two strengths and a weakness (`traits`), an offensive, a defensive
# and a utility move (`moves`, printed in capitals and given here in title case), and the worst case
# the role meets (`trigger`, whose d6 table of responses is `table`). Pair a role with a tier (mook,
# tough, elite, boss; table combat-tiers) to guide how a foe fights.
id: blaster
type: role
name: "Blaster"
traits: ["devastating power", "wide impact", "fragile under fire"]
moves: ["Barrage", "Shockwave", "Shock and Awe"]
trigger: "As a last ditch defense, it…"
table: role-blaster
source: "p. 110"
body: |
  Ranged foes who unleash overwhelming power from afar, raining chaos on the battlefield. They crumble when the fight gets too close.
---
id: brute
type: role
name: "Brute"
traits: ["unstoppable force", "towering resilience", "impulsive"]
moves: ["Wild Smash", "Mad Dash", "Wreak Havoc"]
trigger: "When challenged or taunted, it…"
table: role-brute
source: "p. 110"
body: |
  Brutal raiders who thrive in chaos, striking with sudden overwhelming strength. Each strike shakes the ground, leaving few standing.
---
id: lurker
type: role
name: "Lurker"
traits: ["perfectly silent", "watchful", "fragile when revealed"]
moves: ["Ambush", "Vanish", "Misdirect"]
trigger: "When their cover is blown, it…"
table: role-lurker
source: "p. 110"
body: |
  Stealthy stalkers who strike from concealment, waiting patiently for the perfect moment. They falter when exposed or when in prolonged fights.
---
id: marksman
type: role
name: "Marksman"
traits: ["lethal precision", "exceptional range", "panics close up"]
moves: ["Piercing Shot", "Take Cover", "Spot Weakness"]
trigger: "When under pressure, it…"
table: role-marksman
source: "p. 110"
body: |
  Sharpshooters who excel at picking off targets from a distance. They are vulnerable when caught in melee, or forced to move quickly.
---
id: predator
type: role
name: "Predator"
traits: ["relentless pursuit", "overwhelming strike", "overcommits"]
moves: ["Ambush", "Evasive Leap", "Track Down"]
trigger: "When prey slips away, it…"
table: role-predator
source: "p. 111"
body: |
  Persistent hunters who stalk their prey, waiting for the perfect moment to strike. They falter if their prey is tenacious.
---
id: protector
type: role
name: "Protector"
traits: ["grand resilience", "exceptional tactics", "limited offense"]
moves: ["Setup Ally", "Interpose", "Rally Cry"]
trigger: "When an ally is in danger, it…"
table: role-protector
source: "p. 111"
body: |
  Unyielding guardians who shield allies and endure attacks meant for others. They struggle when separated from those they protect.
---
id: skirmisher
type: role
name: "Skirmisher"
traits: ["great mobility", "quick reflexes", "fragile"]
moves: ["Strike & Move", "Dodging Roll", "Force Back"]
trigger: "When it loses the advantage, it…"
table: role-skirmisher
source: "p. 111"
body: |
  Agile combatants who excel at hit-and-run tactics, harassing foes and striking from unexpected angles. They falter when pinned down.
---
id: swarmer
type: role
name: "Swarmer"
traits: ["never ending attacks", "overwhelming", "weak individually"]
moves: ["Swarm, Swarm!", "Scatter!", "Surround 'Em!"]
trigger: "When their numbers thin, they…"
table: role-swarmer
source: "p. 111"
body: |
  Relentless attackers who overwhelm enemies with sheer numbers, striking from all sides to wear them down. They falter when isolated.
---
id: tactician
type: role
name: "Tactician"
traits: ["always prepared", "good under pressure", "relies on allies"]
moves: ["Flanking Strike", "Tactical Rally", "Create Weakness"]
trigger: "When its plan fails, it…"
table: role-tactician
source: "p. 111"
body: |
  Clever strategists who manipulate the battlefield, exploit every weakness they find, and command those around them. They struggle when their plan fails.
---
id: trickster
type: role
name: "Trickster"
traits: ["master of deception", "unpredictable", "fragile"]
moves: ["Deceptive Strike", "Bait and Switch", "Snatch Weapon"]
trigger: "When its tricks fail, it…"
table: role-trickster
source: "p. 111"
body: |
  Cunning deceivers who thrive on confusion, turning the tide of battle with guile. They crumble when their tricks are exposed or fail.
