# Grimwild: Community Edition (Preview 5.3), Chapter 5: Monsters A-Z (pp. 146-171). CC0 1.0.
# One entry per monster block, in book order. Each block's d6 table is in tables/monsters.yaml
# (`table:`; `tables:` lists every table of a block that has more than one).
#
# Expanded entries also carry the rest of their double-sized block:
#   scenario       {title, text}: the ready-to-use scene (`end`: the closing note, Remorhaz).
#   section        {title, text, ...}: an extra part that is not a scenario (Dragon, Lich, Vampire).
#   pools          linked challenges: {name, dice, traits, moves, fail, says, links, leads_to}.
#                  dice: 8, or "8+8" for "8d + 8d". fail: the ✘ fail states. says: the speech
#                  bubbles beside a pool (Hill Giant). links: pools joined by a line in the book's
#                  diagram, each line listed once; brackets hold the line's printed label (rough,
#                  hidden, secret) or where it starts. leads_to: an arrow to the next pool.
#   battlegrounds  {name, features, threats, enemies, leads_to} (Battlegrounds, p. 105): enemies
#                  as printed, "4d archers" for a group in one task pool and "8d | dragon" for a
#                  creature acting as its own challenge.
# Text is as printed; moves, palette colors and headings are printed in capitals and are given
# here in title case.
