# The 17 paths (Adventurers, pp. 45, 52-87): each with its core talent, path talents,
# optional extras and crucible tables. Talent text: talents.yaml.
id: artificer
type: path
name: Artificer
aka: [enchanter, tinkerer, inventor]
core_talent: artificer-infusion
talents:
  - artificer-animate-objects
  - artificer-artificial-parts
  - artificer-grenades
  - artificer-magnum-opus
  - artificer-mischief-maker
  - artificer-trap-making
  - artificer-wandslinger
options:
  - title: Everything Arcana
    label: Optional
    text: |-
      You can reflavor any of your path talents to actually be the effects of magical gizmos you’ve created. Toss in some magitech buzzwords that almost make sense, and use them to sound like you know what you’re talking about—perfect for baffling the less inventive. You can teach others to use them, though doing so always carries risk. If any of these gizmos is ever lost, you can recreate them with some effort during any downtime.
      Magitechnobabble: smash together, and ramble on.
    tables: [artificer-magitechnobabble-prefix, artificer-magitechnobabble-suffix]
  - title: Constructs and Homunculi
    text: |-
      Looking for a magical companion you found or created? Use the Animal Companion talent from the ranger path (pg. 73), and pick from the tricks and flaws below.
      TRICKS: distract—fight—guard—rescue—retrieve—scout—search—talk—trace—signal
      FLAWS: clumsy—defiant—dimwitted—noisy—overprotective—powered—scary—unreliable
tables: [artificer-magitechnobabble-prefix, artificer-magitechnobabble-suffix]
extra_path: true
source: p. 54
body: |-
  You shape the world with your creations, blending ingenuity, craftsmanship, and magic to forge and enchant wonders.
