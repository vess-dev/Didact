      - "Tunnel Vision: Fixates on a target, oblivious to surroundings, struggles to adapt."
      - "Poor Mobility: Heavy tracks, slow movement, struggles on uneven terrain."
      - "Sound Sensitivity: Wince at noises, large twitching ears, avoids loud terrain."
      - "Slow-minded: Delayed reactions, struggles to recognize threats, easily tricked."
      - "Predictable Instincts: Easily baited or lured, overcommits."
