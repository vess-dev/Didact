id: paladin
type: path
name: Paladin
aka: [crusader, champion, justiciar]
tagline: An Oath taken, a burden willingly carried.
summary: Spend smite to overcome challenges with the power of your conviction.
core_talent: paladin-oathsworn
talents:
  - paladin-aegis
  - paladin-authority
  - paladin-challenge
  - paladin-dauntless
  - paladin-divine-blessing
  - paladin-guardian
  - paladin-rebuke
options:
  - title: Swear Your Oath
    text: |-
      At character creation, or over the first few sessions, detail the Three Tenets that form the core of your oath. Write your own specific tenets (below), or use the table (next page) to create ones that you can explore through play. To write your own:
      - Choose a character detail or two, such as a trait, bond, or background.
      - Link it to a short, actionable phrase. It should naturally arise from the fiction occasionally and present you with dilemmas. Work with the GM to ensure this as you write it.

      Rank the tenets in order of importance. If they ever conflict, following a higher one avoids violating a lower one. You must uphold your tenets, or risk violation. They are absolutes, but they can evolve as it makes sense or best serves the fiction (and game at the table). When you violate a tenet, slash its box. For a second or severe violation, fill in the box—it is in heavy violation.

      You break a tenet when you violate it again while in heavy violation (filled box). You can no longer atone for that tenet. Breaking two tenets makes you an Oathbreaker (below). Atonement for tenets in violation require great deeds. The deed must outweigh the severity of the violation itself—ask the other players if unsure. Once completed, clear the box.
  - title: Oathbreaker
    text: You lose the Oathsworn talent, but may choose the Adventurer’s Talented core talent in its place. Redemption requires an appropriate ritual or mythic deed. Success restores your core talent while allowing you to keep one path talent gained from breaking your oath. Redemption is possible only once.
  - title: Tenet Builder
    text: (Roll, then choose an option, rewrite for clarity.)
    tables: [paladin-tenet-bring, paladin-tenet-to-for, paladin-tenet-despite]
tables: [paladin-tenet-bring, paladin-tenet-to-for, paladin-tenet-despite]
extra_path: false
source: p. 68
body: |-
  You have unwavering dedication to your oath, which you can wield to shape the world.
