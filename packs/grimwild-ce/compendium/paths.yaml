options:
  - title: Schools of Magic
    choices:
      - "Abjuration: Protects, blocks, dispels, or banishes."
      - "Conjuration: Summons creatures, objects, and portals."
      - "Divination: Reveals information, predicts the future, and reads minds."
      - "Enchantment: Charms, influences, and curses sentient creatures."
      - "Evocation: Creates and controls elemental and magical forces."
      - "Illusion: Generates false images and sensory deceptions."
      - "Necromancy: Manipulates life, death, and the undead."
      - "Transmutation: Transforms matter and alters physical properties."
  - title: Spell Crucible
    text: Roll 1 of each, choose 2, then add a school
    tables: [wizard-spell-style, wizard-spell-essence, wizard-spell-form]
  - title: Creating Spell Theorems
    text: |-
      Use the spell crucible to randomly determine a style, essence, and form, by rolling 2d on each section. Assign 1d to the column and 1d to the row (or reverse the two) to find two touchstone words, then choose your favorite. Pick two out of these three (style+essence, style+form, essence+form) for the spell name, or theorem.
      Pick a magic school for the theorem to determine its general function. The mechanical effect is decided in the moment, and can change with each casting.
      Example Roll: wild + fire + sentinel. This gives us a some interesting options:
      wild fire (evocation) → This could blast the area with uncontrollable fire.
      fire sentinel (transmutation) → This could turn your form to fire.
      wild sentinel (conjuration) → This could summon a bear to fight along side you.
tables: [wizard-spell-style, wizard-spell-essence, wizard-spell-form]
