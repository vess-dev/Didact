id: fighter
type: path
name: Fighter
aka: [blademaster, warrior, sergeant]
tagline: Resolve honed with every strike.
summary: Spend mastery to fight with unparalleled expertise in your chosen style.
core_talent: fighter-weapon-mastery
talents:
  - fighter-arcane-training
  - fighter-bulwark
  - fighter-control
  - fighter-got-your-back
  - fighter-measured-tones
  - fighter-swift-recovery
  - fighter-tactician
options:
  - title: Weapon Origin
    label: Optional
    text: For many fighters, their weapon is an important part of their past. Give your weapon some character and it will become a character itself in the story. Roll d66 twice on the table below to give your weapon, or each of your weapons, its own small story. You can also choose, or make up your own.
    tables: [fighter-weapon-origin]
  - title: Combat Maneuvers
    label: Advice
    text: Action rolls let you flavor combat however you like—don’t just swing a sword or jab a spear. Lean into the dramatic flowing nature of combat. Use mastery for setups and secondary effects to remove thorns or shift the fight. Don’t tunnel vision on the kill, either—use your actions to change the battle to end it faster! Of course, anyone can try these, but as a fighter, you should master them.
    choices:
      - "Blind: Cloud their vision to leave them vulnerable."
      - "Disarm: Take their weapon to stop their advance."
      - "Knockdown: Put them on the ground to gain the upper hand."
      - "Pin down: Trap them in a position to keep them from acting or escaping."
      - "Pull: Drag them into danger or out of position."
      - "Push: Shove them away to protect allies or disrupt their own lines."
      - "Sunder: Break their gear to limit their options or get around their defenses."
      - "Unnerve: Leave them shaken and questioning their choices."
tables: [fighter-weapon-origin]
extra_path: false
source: p. 64
body: |-
