id: psion
type: path
name: Psion
aka: [mentalist, seer, telepath]
core_talent: psion-awakened-mind
talents:
  - psion-echo
  - psion-foresight
  - psion-mind-blast
  - psion-psychic-warrior
  - psion-reader
  - psion-shift-form
  - psion-tumultuous-mind
options:
  - title: Instability
    text: |-
      Each potent spell pulls at the threads in your mind, making your magic harder to control. You add thorns to all psionic spellcasting based on your instability, tracked by looking at the thorns on the lowest line you have marked. Consider what this progressive unraveling of your psyche looks like.
      [Figure: the instability track, marked from the top row down. The +0t row has one slot, plus two grey ones (gained at levels 3 and 6); the +1t row has two; the +2t row has one.]
  - title: Bastions
    text: Within your mind lie bastions of psionic power. As you grow stronger, you break down their walls, unlocking your true potential. These powers take shape as visions, psychic phenomena, and even physical manifestations in the form of ectoplasm—pure essence of creation.
    choices:
      - "Biodynamics • Altering and enhancing your own body. Power: Heal your broken arm,. Hold your breath for hours. Run faster than a horse."
      - "Clairsentience • Gaining knowledge from the collective unconscious. Power: Sense a hidden truth. See into someone's dreams. Find the way home."
      - "Metacreation • Creating objects from ectoplasm, pure mental energy. Power: Forge a glowing sword. Build a bridge of thought. Shape armor from pure will."
      - "Psychokinesis • Manipulating energy and force. Power: Shatter a boulder. Push an enemy back. Lift a heavy object with your mind."
      - "Telepathy • Mind-to-mind communication, manipulation, and control. Power: Read someone's thoughts. Calm an angry mob. Implant a fleeting suggestion."
      - "Transposition • Movement and manipulation of space. Power: Teleport across a room. Switch places with an ally. Freeze someone in place."
extra_path: true
source: p. 70
body: |-
  You unlock the limitless power of the mind, bending thought, will, and reality through focus and discipline.
