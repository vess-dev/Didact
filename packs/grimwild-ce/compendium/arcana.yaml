# Grimwild: Community Edition (Preview 5.3), Chapter 7: Extras: List of Arcana (pp. 196-201) and
# Potions and Other Expendables (p. 203). CC0 1.0.
# The 40 example arcana (12 minor, 14 major and 14 mythic) and then the 8 example expendables
# (`expendable: true`: single-use items with an effect one tier higher, p. 40), in book order. Two
# expendables are trivial, a tier exclusive to expendable arcana (p. 40). Each block's palette colors
# (printed in capitals, given here in title case), its details (`body`; power pools refresh every
# session unless otherwise stated), its touchstones (a function and two themed words; mythic arcana
# count as having all functions and list 3-5), its sensories (`sensories`: the swirl line, how it
# looks, feels or sounds, then the hand line, actions to bring it into the scene; not `details`,
# which is the GM's notes on any record) and its activation. `pool` is the power pool its details name, when they
# name one (timers and story rolls are not pools). Text is as printed, typos included (see the notes
# by the entries). "Created by Matthew Andre" is printed under the Mirror Gaol block (p. 201); Matthew
# Andre is one of the Community Edition's writers (credits, p. 217).
