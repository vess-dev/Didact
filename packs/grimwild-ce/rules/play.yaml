# The rest of play (Gameplay, pp. 22-39; the GM's suspense, p. 96; Exploring the Grimwild,
# pp. 130-141; the optional rules, pp. 174-177): suspense, quarrels, vex, bonds and arcs,
# switching talents, carousing and downtime, the optional rules' pools, active vigilance,
# exploration tokens, and what sessions and scenes bring by themselves.
action: suspense
title: GM suspense
help: >-
  The GM's suspense (p. 96), kept on the story oracle's state (`didact oracle show`). Take it
  for skipping a prompted impact move, a suspense move (Build Up, Clue In, Resolve), pre-session
  (1), a rest reset (2), an interrupt's messy, a curse or a dark omen (1). Spend it to prompt an
  impact move at any time (a PC it hits directly gets a defense roll), or to drop 1d from a pool
  that dropped nothing (`pool=`). A challenge's 2 bonus suspense (p. 104) is its own, spent only
  on moves relating to it (`challenge=`). With no numbers, it shows the suspense.
params:
  take: {kind: int, default: 0, help: "Suspense the GM takes"}
  spend: {kind: int, default: 0, help: "Suspense the GM spends"}
  why: {kind: text, optional: true}
  pool: {kind: ref, optional: true, help: "A pool that dropped nothing: each suspense spent drops 1d anyway"}
  challenge: {kind: ref, optional: true, help: "A challenge whose own bonus suspense is taken or spent"}
  oracle: {kind: ref, optional: true, help: "The story oracle's state (supplied)"}
steps:
  - if: "default(@oracle, '') == ''"
    then:
      - message: "The GM's suspense lives on the story oracle, which hasn't started here yet (a dry run starts nothing): the GM would take {@take} and spend {@spend}."
    else:
      - if: "default(@challenge, '') <> ''"
        then:
          - let: {own: "default(@challenge.suspense, 0)"}
          - if: "@spend > @own"
            then:
              - stop: "{@challenge.name} has {@own} bonus suspense left, not {@spend}: spend the GM's own instead (`didact do suspense spend={@spend}`)."
          - set: challenge.suspense
            value: "@own + @take - @spend"
          - message: "{@challenge.name}'s bonus suspense: {@challenge.suspense}, for moves relating to it."
        else:
          - if: "@spend > @oracle.suspense"
            then:
              - stop: "The GM has {@oracle.suspense} suspense, not {@spend}: take some first (skip a prompted impact move, or make a suspense move)."
          - if: "@take > 0 or @spend > 0"
            then:
              - set: oracle.suspense
                op: "+="
                value: "@take - @spend"
          - message: "GM suspense: {@oracle.suspense}."
      - if: "default(@why, '') <> ''"
        then: ["Why: {@why}."]
      - if: "default(@pool, '') <> '' and @spend > 0"
        then:
          - if: "@pool.value <= 0"
            then: ["{@pool.name} is already empty."]
            else:
              - pool: "@pool"
                mode: drop
                drop: "@spend"
                as: dropped
              - message: "The GM spends suspense: {@pool.name} drops {@spend}d anyway ({@dropped.left}d left)."
      - if: "@spend > 0 and default(@pool, '') == ''"
        then:
          - message: "Spent suspense prompts an impact move, at once or later: a PC it hits directly gets a defense roll (`didact do defense`)."
source: "pp. 18, 96, 103-104"
---
action: suspense-move
title: A suspense move
help: >-
  The GM's suspense moves (pp. 98-99), made with cinematic timing: Build Up (a brief scene before
  the challenge ahead: each PC adds a detail and takes spark, and the GM takes suspense), Clue In
  (cut away to the forces acting against the PCs: the players learn, the PCs stay in the dark, and
  the GM takes suspense), Foreshadow (telegraph a danger, without suspense: an impact move
  follows if it's left unaddressed), Resolve (solve a problem for stuck or cornered PCs, and the
  GM takes suspense).
params:
  move: {enum: [build-up, clue-in, foreshadow, resolve]}
steps:
  - if: "'$move' == 'foreshadow'"
    then:
      - message: "Foreshadow: telegraph the danger (hoofbeats coming, a 4d timer; the dragon takes a deep breath); if the PCs leave it unaddressed, the impact move follows. No suspense for it."
    else:
      - if: "'$move' == 'build-up'"
        then:
          - prompt: "Build Up: a vignette before the danger (the PCs' reactions, the looming problem, a cutscene before the action): each PC adds a detail and takes spark (`didact do take-spark who=<pc> why='build up'` for each)."
      - if: "'$move' == 'clue-in'"
        then:
          - prompt: "Clue In: cut away, or zoom out, to show the forces acting against the PCs: the players learn it, the PCs don't."
      - if: "'$move' == 'resolve'"
        then:
          - prompt: "Resolve: a story beat gets the stuck or cornered PCs out of the tough situation and moves the story forward."
      - do: suspense
        with: {take: 1, why: "$move"}
source: "pp. 98-99"
---
check: quarrel
title: Quarrel
help: >-
  When two PCs are at odds (p. 23): all agree to the quarrel and state the stakes for winning
  and losing (err on the dramatic: bruises, not bloodied). Each rolls 2d and the highest wins
  (5 beats 4); no talents. Others can assist (1d to a side: `helps_first`, `helps_second`) or
  join at 2d with their own agenda (`third`); spark adds dice. On a tie, compromise or keep
  quarreling. The winner narrates how they won, then the loser how they handle it; the result is
  final. All participating PCs take spark.
params:
  first: ref
  second: ref
  third: {kind: ref, optional: true, help: "A PC joining at 2d with their own agenda"}
  helps_first: {kind: ref, optional: true, help: "A PC assisting the first (1d)"}
  helps_second: {kind: ref, optional: true, help: "A PC assisting the second (1d)"}
  spark_first: {kind: int, default: 0, help: "Spark the first spends: +1d each"}
  spark_second: {kind: int, default: 0, help: "Spark the second spends: +1d each"}
  stakes: {kind: text, optional: true, help: "What winning and losing mean"}
before:
  - if: "@spark_first > @first.spark or @spark_second > @second.spark"
    then:
      - stop: "Each can spend only the spark they have ({@first.name} {@first.spark}, {@second.name} {@second.spark})."
  - if: "default(@stakes, '') <> ''"
    then: ["At stake: {@stakes}."]
  - if: "@spark_first > 0"
    then:
      - set: first.spark
        op: "-="
        value: "@spark_first"
  - if: "@spark_second > 0"
    then:
      - set: second.spark
        op: "-="
        value: "@spark_second"
  - roll: "(2 + @spark_first)d6"
    as: side_a
  - if: "default(@helps_first, '') <> ''"
    then:
      - roll: 1d6
        as: help_a
  - roll: "(2 + @spark_second)d6"
    as: side_b
  - if: "default(@helps_second, '') <> ''"
    then:
      - roll: 1d6
        as: help_b
  - if: "default(@third, '') <> ''"
    then:
      - roll: 2d6
        as: side_c
  - let:
      best_a: "max(max(@side_a.dice), if(default(@helps_first, '') <> '', max(@help_a.dice), 0))"
      best_b: "max(max(@side_b.dice), if(default(@helps_second, '') <> '', max(@help_b.dice), 0))"
      best_c: "if(default(@third, '') <> '', max(@side_c.dice), 0)"
  - message: "{@first.name} {@best_a} · {@second.name} {@best_b}"
  - if: "@best_c > 0"
    then: ["{@third.name} {@best_c}"]
  - do: take-spark  # a side character (solo party mode) takes none: carry on
    with: {who: "@first"}
    go_on: true
  - do: take-spark
    with: {who: "@second"}
    go_on: true
  - if: "default(@third, '') <> ''"
    then:
      - do: take-spark
        with: {who: "@third"}
        go_on: true
  - if: "default(@helps_first, '') <> ''"
    then:
      - do: take-spark
        with: {who: "@helps_first"}
        go_on: true
  - if: "default(@helps_second, '') <> ''"
    then:
      - do: take-spark
        with: {who: "@helps_second"}
        go_on: true
bands:
  first: "@best_a > @best_b and @best_a > @best_c"
  second: "@best_b > @best_a and @best_b > @best_c"
  third: "@best_c > @best_a and @best_c > @best_b"
  tie: else
on:
  first: ["{@first.name} wins: they narrate how they won, then the others how they handle it. The result is final: the story moves in the winner's direction (it's okay to be bitter)."]
  second: ["{@second.name} wins: they narrate how they won, then the others how they handle it. The result is final: the story moves in the winner's direction (it's okay to be bitter)."]
  third: ["{@third.name} wins: they narrate how they won, then the others how they handle it. The result is final: the story moves in the winner's direction (it's okay to be bitter)."]
  tie: ["A tie: compromise, or keep quarreling (roll again)."]
source: "p. 23"
