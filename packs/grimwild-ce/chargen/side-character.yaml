# Solo party mode (Extras, p. 195): the main PC is made as normal (chargen/pc.yaml); the other
# party members (usually 2-3) are streamlined side characters. `didact char new
# grimwild-ce.side-character`.
chargen: side-character
title: A side character (solo party mode)
help: >-
  A streamlined party member for solo play: two backgrounds (noted, without wises), 1 trait and
  1 desire it is (and 1 of each it isn't), no path and no core talent but one path talent (a
  half core talent such as Arcane Training fits a path fantasy), stats as usual (1 each plus 4
  points), a name, and a bond with the main PC only. No story arcs, no spark or thread, no XP or
  levels, and harm instead of marks.
creates: pc
modes: [random, guided]
steps:
  - apply: {side: true, level: 1, xp: 0, spark: 0, thread: 0}
  - choose_or_roll: {table: backgrounds, as: first_background}
  - add: {field: backgrounds, value: "@first_background"}
  - choose_or_roll: {table: backgrounds, as: second_background, exclude: "@first_background", prompt: "a second background (wises aren't tracked: note the backgrounds only)"}
  - add: {field: backgrounds, value: "@second_background"}
  - choose: {from: [brave, caring, confident, curious, gentle, honest, honorable, persistent, protective, quiet, rash, stubborn], as: trait, prompt: "1 trait it very much is"}
  - choose: {from: [brave, caring, confident, curious, gentle, honest, honorable, persistent, protective, quiet, rash, stubborn], as: not_trait, exclude: "@trait", prompt: "and 1 it definitely isn't"}
  - add: {field: traits, value: "@trait"}
  - add: {field: traits, value: "not {@not_trait}"}
  - choose: {from: [belonging, glory, harmony, honor, justice, knowledge, love, power, renown, thrills, wealth, wisdom], as: desire, prompt: "1 desire it truly has"}
  - choose: {from: [belonging, glory, harmony, honor, justice, knowledge, love, power, renown, thrills, wealth, wisdom], as: not_desire, exclude: "@desire", prompt: "and 1 it definitely doesn't"}
  - add: {field: desires, value: "@desire"}
  - add: {field: desires, value: "not {@not_desire}"}
  - if: "@option.magic == 'none'"
    then:
      - choose_or_roll: {table: talent-lists, as: talent_list, exclude: [Artificer, Cleric, Druid, Psion, Sorcerer, Summoner, Warlock, Witch, Wizard], prompt: "its one path talent: the list it comes from (no magic: the magical paths are out)"}
    else:
      - choose_or_roll: {table: talent-lists, as: talent_list, prompt: "its one path talent: the list it comes from (for a path fantasy, a half core talent such as Arcane Training, the Fighter's)"}
  - choose: {from: "@talent_list.talents", records: talent, as: talent, exclude: "{if(@option.magic == 'none', default(@talent_list.magical_talents, ''), '')}", prompt: "its one path talent ({@talent_list})"}
  - add: {field: talents, value: "@talent"}
  - point_buy:
      fields: [brawn, agility, wits, presence]
      budget: 4
      costs: {1: 0, 2: 1, 3: 2}
      default: random
      as: stats
  - name: {prompt: "a name for the side character (the book has no name tables)"}
  - table: bonds
    as: bond
  - prompt: "A bond with the main PC only (side characters don't form bonds with each other): an intensity and a nature (p. 22 offers {@bond}): `didact set <pc> bonds+='… with <main PC>'`."
  - prompt: "Side characters have no story arcs, spark or thread, don't take XP or advance, and take harm instead of marks (`didact do mark` does it)."
source: "p. 195"
