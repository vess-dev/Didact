table: cleric-rites
title: "Rites"
description: "What rites have you learned to help you achieve your mission? Choose 1 major rite, and 2 minor rites, or make your own. Each entry's data holds its example magic."
source: "p. 60"
entries:
  - {text: "Blessing", data: {magic: "Bless a warhammer. Walk on water. Fill the forlorn duke's heart with hope."}}
  - {text: "Divination", data: {magic: "Find a safe path. Reveal where the thief is hiding. Know tomorrow's weather."}}
  - {text: "Dominion", data: {magic: "Convince someone to help. Make someone forget. Calm an angry mob."}}
  - {text: "Healing", data: {magic: "Heal a broken bone. Relieve someone of stress. Stop the bleeding."}}
  - {text: "Warding", data: {magic: "Shield an ally from harm. Block a doorway. Create sentries."}}
  - {text: "Wrath", data: {magic: "Shatter a foe's weapon. Blind a traitor. Curse a heretic with misfortune."}}
---
table: psion-bastions
title: "Bastions"
description: "Within your mind lie bastions of psionic power; choose two, which act as the touchstone for your psionic magic (Awakened Mind). Each entry's data holds what it is and example powers."
source: "p. 70"
entries:
  - {text: "Biodynamics", data: {about: "Altering and enhancing your own body.", power: "Heal your broken arm,. Hold your breath for hours. Run faster than a horse."}}
  - {text: "Clairsentience", data: {about: "Gaining knowledge from the collective unconscious.", power: "Sense a hidden truth. See into someone's dreams. Find the way home."}}
  - {text: "Metacreation", data: {about: "Creating objects from ectoplasm, pure mental energy.", power: "Forge a glowing sword. Build a bridge of thought. Shape armor from pure will."}}
  - {text: "Psychokinesis", data: {about: "Manipulating energy and force.", power: "Shatter a boulder. Push an enemy back. Lift a heavy object with your mind."}}
  - {text: "Telepathy", data: {about: "Mind-to-mind communication, manipulation, and control.", power: "Read someone's thoughts. Calm an angry mob. Implant a fleeting suggestion."}}
  - {text: "Transposition", data: {about: "Movement and manipulation of space.", power: "Teleport across a room. Switch places with an ally. Freeze someone in place."}}
