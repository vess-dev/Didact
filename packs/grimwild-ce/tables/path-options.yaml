# Grimwild: Community Edition (Preview 5.3), Adventurers: the path pages (pp. 54-86). CC0 1.0.
# The choices each path's page offers at character creation, as tables so that character creation
# (chargen/pc.yaml) can offer them step by step and `didact table roll` can pick one: they mirror
# the `options` of the paths in compendium/paths.yaml. Entries whose book text runs on (a rite, a
# bastion, a school) keep their name as the text and the rest as data.
