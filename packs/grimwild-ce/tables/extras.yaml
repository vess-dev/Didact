# Grimwild: Community Edition (Preview 5.3), Chapter 7: Extras (pp. 188-195). CC0 1.0.
# Hex flowers (p. 189), the story kit A Plague of Goblins (p. 191) and the solo rules (pp. 192-194).
# Fiction pillars (p. 188) are a prep method with worked examples, and solo party mode (p. 195) is
# rules text: neither has a table. The GM crucible reprinted on p. 192 is gm-crucible (tables/gm.yaml).
#
# Hex flowers: the keys are lookups by the hex the party is on (--with hex=4). hex-flower-move is not
# printed as a table: it is the movement the book draws (p. 189), worked out hex by hex: a 1d roll
# moves 1 up-left, 2 up, 3 up-right, 4 down-right, 5 down, 6 down-left; off the flower you wrap
# around to the far end of the same row or column; the walls (above hex 7, and the floor under hexes
# 3, 1 and 2, including hex 1's lower corners) keep you in place.
#
# The solo rules on pp. 193-194 are credited "Additional Solo Rules adapted from @slander.x on
# Discord, with permission" (p. 192). solo-consequences is read by the scene's stakes
# (--with stakes=high) and rolls the d8 table for them; solo-consequence-kinds says what each means.
table: hex-flower-move
title: "Hex flower: move"
description: "Hex flowers are an alternative to random tables: the result depends on where you start. The party begins at the bottom hex (1) and moves to an adjacent hex based on a 1d roll: read this by the current hex (--with hex=1), then look up the key (hex-flower-spring-weather, hex-flower-kalthazar-foothills, or your own). Off the flower, you wrap around and appear in the same row or column on the side opposite; the walls at the top and bottom keep you in place, which keeps the bottom hexes most common and those at the top more rare. Worked out from the book's diagrams."
lookup: hex
source: "p. 189"
entries:
  1:
    table: hex-flower-from-1
  2:
    table: hex-flower-from-2
  3:
    table: hex-flower-from-3
  4:
    table: hex-flower-from-4
  5:
    table: hex-flower-from-5
  6:
    table: hex-flower-from-6
  7:
    table: hex-flower-from-7
