table: solo-consequences-low-normal
title: "Solo consequences: low & normal stakes"
description: "When you make an impact move, choose the most fitting consequence, or use the crucibles for ideas or randomized trouble (roll d8, pick between two). Remember that harm is reserved for particularly hard hits. Solo rules adapted from @slander.x on Discord, with permission (p. 192)."
dice: d8
source: "p. 193"
entries:
  1: ["set dressing", "set dressing"]
  2: ["lose something", "collateral damage"]
  3: ["one mark", "vex"]
  4: ["strain bond", "lose something"]
  5: ["collateral damage", "one mark"]
  6: ["condition (short)", "lock down"]
  7: ["two marks", "raise stakes"]
  8: ["pressure pool", "harm"]
---
table: solo-consequences-high-dire
title: "Solo consequences: high & dire stakes"
description: "When you make an impact move, choose the most fitting consequence, or use the crucibles for ideas or randomized trouble (roll d8, pick between two). Remember that harm is reserved for particularly hard hits. On a disaster, or with dire stakes, you take the normal consequences, plus: roll a peril pool (p. 194)—harm. Solo rules adapted from @slander.x on Discord, with permission (p. 192)."
dice: d8
source: "p. 193"
entries:
  1: ["vex", "lose something"]
  2: ["collateral damage", "condition (short)"]
  3: ["strain bond", "two marks"]
  4: ["harm", "condition (long)"]
  5: ["pressure pool", "harm"]
  6: ["twist", "lock down"]
  7: ["counter", "condition (urgent)"]
  8: ["two harm", "harm & condition"]
