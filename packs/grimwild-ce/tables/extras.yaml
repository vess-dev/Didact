table: plague-of-goblins-hooks
title: "A Plague of Goblins: hooks"
description: "Ways to introduce the story kit A Plague of Goblins to your players. Each night, doors lock, windows shut, and Dreghill Village holds its breath as the goblins come. Fighting back only led to disappearances, so now they stay inside and refuse to speak on what happens at night. It keeps their sanity, and keeps self and neighbor alike safe from the goblin plague that transforms them all."
source: "p. 191"
entries:
  - "A note nailed to a sign reads, \"Dreghill at night—keep walking.\""
  - "A shoe lies abandoned in the square, bloody and torn."
  - "Arriving just after sunset, things are quiet—far too quiet, really."
---
