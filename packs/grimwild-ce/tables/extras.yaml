table: solo-consequences
title: "Solo consequences"
description: "Randomized trouble for an impact move: read by the scene's stakes (--with stakes=low|normal|high|dire), roll d8 and pick between the two. Solo rules adapted from @slander.x on Discord, with permission (p. 192)."
lookup: stakes
source: "p. 193"
entries:
  low:
    table: solo-consequences-low-normal
  normal:
    table: solo-consequences-low-normal
  high:
    table: solo-consequences-high-dire
  dire:
    table: solo-consequences-high-dire
---
table: solo-consequence-kinds
title: "Solo: consequences"
description: "What the consequences in solo-consequences mean. Solo rules adapted from @slander.x on Discord, with permission (p. 192)."
source: "p. 193"
entries:
  - "Set Dressing: The trouble is only narrative."
  - "Strain Bond: Relationship with a faction or ally is strained."
  - "Collateral Damage: The environment is destroyed or bystanders are hurt."
  - "Lose Something: Gear or resources are ruined or lost."
  - "Lock Down: You lose an opportunity or are forced to make a bad choice."
  - "Raise Stakes: The scene gets more tense, moving stakes up a level."
  - "Twist: There's an unexpected change for the worse, such as a betrayal."
  - "Pressure Pool: Create or roll a pool."
---
table: quest-difficulty
title: "Quest difficulty"
description: "A quest is broken up into story arcs represented by linked task pools; their number and size vary based on the quest difficulty (A daunting quest is 4d+4d+6d). There should be 1 fewer pool for peril than for the quest. Completing each story arc awards 1 XP, +1 bonus XP for completing the quest. Solo rules adapted from @slander.x on Discord, with permission (p. 192)."
source: "p. 194"
entries:  # data: the quest's linked task pools and its peril's (one fewer; none for a trivial quest)
  - {text: "Trivial: 4d", data: {id: trivial, pools: [4], first: 4, peril: [], peril_first: 0}}
  - {text: "Moderate: 4d+4d", data: {id: moderate, pools: [4, 4], first: 4, peril: [4], peril_first: 4}}
  - {text: "Daunting: 4d+4d+6d", data: {id: daunting, pools: [4, 4, 6], first: 4, peril: [4, 4], peril_first: 4}}
  - {text: "Epic: 4d+4d+6d+6d", data: {id: epic, pools: [4, 4, 6, 6], first: 4, peril: [4, 4, 6], peril_first: 4}}
  - {text: "Legendary: 4d+4d+6d+6d+8d", data: {id: legendary, pools: [4, 4, 6, 6, 8], first: 4, peril: [4, 4, 6, 6], peril_first: 4}}
