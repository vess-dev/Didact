table: site-map
title: "Site map: what tokens buy"
description: "The 5-Point Site technique: the GM adds the Reward point first, then everybody spends their 3 exploration tokens on rooms, paths, and special locations. Minor rooms cost 1 token, while major rooms play a more impactful role, costing 2; special locations cost 3 tokens. Describe each point with a two-word phrase, or use the settlements, sites, or dangers crucibles (p. 138). Stop when you have all 5 points and the map is just detailed enough to enter."
source: "p. 136"
entries:
  - "Entrance: The entrance to the site has a challenge that blocks the way—it may be trapped, hidden, require a key (word, ceremony, object), or has a guardian to overcome. This point sets the tone and tests the adventurers’ mettle."
  - "Puzzle: An encounter that requires clever thinking, roleplaying, or teamwork. Creativity should always be rewarded, as there should never be just one resolution to the challenge. This is usually a non-combat encounter, adding variety to the narrative."
  - "Hitch: Something unexpected catches the party off-guard. This may be a betrayal, illusion, trap, dilemma, or hidden threat. If the site calls for it, this may be another puzzle or unique combat. This point keeps everyone engaged and on edge."
  - "Showdown: The dungeon’s central conflict—usually a big combat or intense encounter with high stakes. Incorporate the theme, location, and terrain to make this memory. This point brings resolution and key rewards."
  - "Reward: The loot, or knowledge the party sought, sometimes with a twist or hook for future adventures. This point ends with a memorable moment."
  - "Curiosity: These are vague signs of something more to be explored. They might lead to new information, trouble, or both. This point adds more context or a new hook."
  - "Barrier: Obstacles that make getting around the site more difficult, such as chasms, and flowing lava. This point offers texture and the occasional challenge."
  - "Area: Spaces, usually natural, that cover some part or all of the site, such as a lake, or ruined debris. This part of the map gives a backdrop, and ties it to the outside world."
