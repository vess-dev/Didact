table: region-paths
title: "Region map: a path"
description: "The three kinds of path (p. 132), for a generator to give each path when nobody chooses (each as likely). Passes (bridges, tunnels) come free along any of them; waypoints, each a day of travel on horseback, are the GM's."
source: "p. 132"
entries:
  - "major path: a well-maintained roadway or trade route; travel is quicker, less dangerous, and waypoints are more spread out"
  - "minor path: a lesser trail (a footpath, forest track or game trail)"
  - "rough path: difficult and dangerous terrain (an overgrown path, rocky trail or dry creek bed), perhaps without waypoints"
---
table: settlement-map
title: "Settlement map: what tokens buy"
description: "Settlement maps are built with Expand the Map, but with a different drawing style: the GM begins by drawing the town's outline, then you add roads (1 token) and notable buildings (2-3 tokens; detail them or use building-crucible), and barriers, areas, curiosities, and passes as normal. Special locations (3 tokens) can be added by the GM for free to spice up the map, or as the story requires."
source: "p. 134"
entries:
  - "Road: Draw a straight line between any two other lines on the map. These act as the main roads used throughout the settlement. Passes can be added to roads for free when placed, allowing them to cross areas and barriers as needed."
  - "Minor Building (2 tokens): When you add a minor building, write it on the map in lower case letters."
  - "Major Building (3 tokens): Adding a these buildings tells the GM that you want the location to be more important in the setting or story. When you add a major building, write it on the map in capital letters."
  - "Curiosity: Rumors or interesting locations and happenings that can be explored."
  - "Barrier: Obstacles such as rivers, changes in elevation, and walls that prevent easy travel. These are only crossable via passes."
  - "Area: Large spaces that are thematically distinct from the larger settlement. Natural areas could include lakes or indoor caverns, while artificial areas might include city districts."
