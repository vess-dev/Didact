table: downtime-actions
title: "Downtime actions"
description: "When time passes, pick one of the following to show how you spent your time. If you sell off treasure, you can pick two different actions. Each entry's data holds its id: `didact do downtime who=<pc> act=<id>` (expanded downtime, an option)."
source: "p. 141"
entries:
  - text: "Rest: Heal all marks, harm, and all non-permanent conditions. The GM may decide certain long-term conditions persist through normal rest."
    data:
      id: rest
      examples:
        - "The bard's 8d Broken Arm heals."
        - "The berserker, after taking on a fierce dragon, makes a full recovery."
  - text: "Plan Ahead: You prepare for a future adventure, giving you a special kind of thread. Write a few words describing the general preparation you make, but save the details for later. This thread doesn’t count towards your maximum, and can only be used to add story details based on the preparation. The thread is lost when time passes again."
    data:
      id: plan
      examples:
        - "The Warlock does a favor for the local nobility, earning goodwill."
        - "The Rogue borrows a few horses for a quick getaway."
  - text: "Pursue a Goal: You take action to work on a side goal. Each endeavor is tracked by a task pool. Roll the pool each time you take this downtime action, and describe the result. Your goal can cover anything from crafting arcana, creating a new spell theorem, or even retraining a talent or wise. Work with your GM to determine the goal and starting pool size."
    data:
      id: pursue
      examples:
        - "The druid cleanses the nearby forest (6d pool)."
        - "The cleric learns about esoteric magic (retrain a wise, 4d pool)."
  - text: "Unwind: You spend time enjoying yourself. While this is often carousing with drink and friends, it could just as easily be tending to a forgotten shrine, or partaking in the arts and theater. Give a vignette and take spark."
    data:
      id: unwind
      examples:
        - "The Fighter gets a new drink named after her."
        - "The Monk meditates on top of a lonely hill."
  - text: "Venture: You keep moving, doing odd jobs or adventuring on your own. Make a story roll to see how it goes. The GM may reward you with a minor treasure, rumor, or new ally. On a messy or less, it's complicated."
    data:
      id: venture
      examples:
        - "The Wizard joins an expedition for the University."
        - "The paladin defends a nearby town from a gnoll attack."
