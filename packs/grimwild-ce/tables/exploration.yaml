# Grimwild: Community Edition (Preview 5.3), Chapter 4: Exploration (pp. 128-143). CC0 1.0.
# The three realities, the map pick-lists (what exploration tokens buy on region, settlement and site
# maps), the building and exploration crucibles, custom months and atmospherics, and downtime
# actions. Communities (pp. 142-143) have no table: its example assets are left out (the section is
# "Adapted from @Studious' Stronghold Rules on Discord, and used with permission").
#
# Crucibles are d66 read both ways (`both_ways`, p. 5): the row die is the tens digit and the column
# die the units, and 31 also gives 13; pick the one that grabs you. Each two-grid crucible has its
# halves (-1, -2) and a combined roll that rolls once on each. season-months and atmospherics are read
# by season (--with season=fall), each pointing at its season's table.
table: grimwild-realities
title: "The three realities"
description: "The Remnants, the Wilds, and the Ruins have fused into the Grimwild. When you place something on the map, you can also label it [Remnants] [Wilds] [Ruins], if you want to specify which reality it is mostly from. Each entry's data holds its basic truths."
source: "p. 129"
entries:
  - text: "The Remnants, Forgotten People of the Borderlands"
    data:
      truths:
        - "Fiercely Independent: Long before the cataclysm, the borderlands thrived as a melting pot of cultures, blending traditions into something uniquely their own."
        - "Scattered Settlements: Villages, homesteads, and the occasional keep dot the harsh landscape, home to survivors who endure isolation."
        - "Simple Monsters: Orcs, goblins, and a few larger beasts lurk, but they're nothing compared to the horrors of the Ruins and Wilds."
        - "Blended Heritage: A patchwork of languages, customs, and traditions born from centuries of border nations mingling."
  - text: "The Wilds, Untamed and Unforgiving Wilderness"
    data:
      truths:
        - "Tribal Nomads: Scattered tribes thrive where others perish. Each tribe has its own customs, some steeped in ancient magic, while others forge brutal pacts with the Wilds’ predators."
        - "Raw Magic: The land itself pulses with ancient, untamed power, twisting flora, fauna, and even the air into something alive and unpredictable."
        - "Deadly Terrain: Shifting rivers, jagged cliffs, and choking forests make navigation a perilous gamble for outsiders."
        - "Primal Beasts: Terrible creatures stalk the Wilds, from towering apex predators to grotesque hybrids warped by magic."
  - text: "The Ruins, A Fallen Empire"
    data:
      truths:
        - "Shattered Greatness: Once a realm of truly unmatched knowledge and power, now reduced to crumbling relics of its glory."
        - "Forgotten Relics: Ancient artifacts of magic and technology linger, broken or lost, yet still brimming with untapped potential."
        - "Corrupted Wasteland: Overgrown cities and desolate ruins seethe with decay, haunted by strange energies and whispers of the past."
        - "Eldritch Horrors: Nightmarish creatures lurk in the shadows—aberrations, cursed beings, and the tortured echoes of those consumed by the empire’s collapse."
---
table: joy-of-exploration
title: "The joy of exploration"
description: "Take spark when you engage with the wonder of exploration as such:"
source: "p. 131"
entries:
  - "Pause and take in the world around you. Let your roleplaying bring out a moment of beauty— what does your character notice, and how do they feel about it? Take spark when it creates a meaningful scene."
  - "Ask a question about the world that nobody knows the answer to, sparking curiosity in yourself and others. Encourage wonder. Take spark when the table embraces it."
  - "Travel somewhere far off, simply to see what’s there. Everyone on the journey takes spark."
  - "Highlight the unique nature of a place, even a seemingly mundane one. Make the scene about the location itself—exploration is at its heart. Take spark when you realize you’ll never forget that place."
---
table: region-map
title: "Region map: what tokens buy"
description: "Here's what you can spend exploration tokens on, and how much they cost. Points of interest (settlement, site, danger): minor (1 token) or major (2 tokens); major points are larger and have a greater impact on the world around them. Paths: 0-2 tokens, and passes such as bridges or tunnels are free along them; the GM adds waypoints, each 1 day of travel on horseback. Special locations (curiosity, barrier, area): 3 tokens, though the GM can add them for free."
source: "p. 132"
entries:
  - "Settlement: Places people live—towns, tribes, or villages."
  - "Site: Places that hold rewards—dungeons, ruins, unique natural features."
  - "Danger: Hostile monsters, hazardous nature, or enemies."
  - "Major Path (2 tokens): Well-maintained roadways or trade routes. Travel is quicker, less dangerous, and waypoints are more spread out."
  - "Minor Path (1 token): Lesser trails—footpaths, forest tracks, game trails."
  - "Rough Path (free): Difficult and dangerous terrain—overgrown paths, rocky trails, dry creek beds. These may not have waypoints, if travel time is unclear."
  - "Curiosity: Unclear but intriguing signs or information waiting to be explored."
  - "Barrier: Obstacles to travel—rivers, mountains, cliffs. Only crossable via dangerous rough paths or passes."
  - "Area: Large, usually natural, spaces with a single theme—lakes, swamps, deserts."
---
table: region-points
title: "Region map: a point to place"
description: "A point of interest for a generator to place when nobody chooses (the book leaves it to the table, so each is as likely): a settlement, site or danger, minor (1 token) or major (2 tokens), or a curiosity (a special location, 3 tokens). Each entry's data names the crucible that labels it (p. 138)."
source: "p. 132"
entries:
  - {text: "minor settlement", data: {point: settlement, size: minor, first: settlements-crucible-1, second: settlements-crucible-2}}
  - {text: "major settlement", data: {point: settlement, size: major, first: settlements-crucible-1, second: settlements-crucible-2}}
  - {text: "minor site", data: {point: site, size: minor, first: sites-crucible-1, second: sites-crucible-2}}
  - {text: "major site", data: {point: site, size: major, first: sites-crucible-1, second: sites-crucible-2}}
  - {text: "minor danger", data: {point: danger, size: minor, first: dangers-crucible-1, second: dangers-crucible-2}}
  - {text: "major danger", data: {point: danger, size: major, first: dangers-crucible-1, second: dangers-crucible-2}}
  - {text: "curiosity", data: {point: curiosity, size: special, first: curiosities-crucible-1, second: curiosities-crucible-2}}
