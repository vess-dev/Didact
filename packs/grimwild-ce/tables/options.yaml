# Grimwild: Community Edition (Preview 5.3), Chapter 6: Game Options (pp. 172-187). CC0 1.0.
# The setting dials (magic, scale, lethality) as pick-lists, dangerous magic's twists, the example
# weapon styles, and the seven flavors of fantasy. The optional rules (pp. 174-177) and legacy talents
# (pp. 178-179) are rules text, not tables.
#
# The weapon styles are printed in three columns: a d66 read both ways, where one die picks the row
# and the other the column (1-2, 3-4, 5-6), as p. 5 describes. Each flavor's data holds its setting
# dials (the captions under Scale, Lethality and Magic; the sliders' positions are only drawn), its
# rules tweaks and its media touchstones.
table: setting-dials-magic
title: "Setting dials: magic"
description: "Fantasy settings sometimes feature magic in a limited way, as a rarity or an exclusively evil force. In others, the wonders are widespread and available to all. Base Grimwild takes the middle road, with magic available, but not ubiquitous. Dangerous Magic's twists are in dangerous-magic-twists."
source: "p. 172"
entries:
  - "Rare Magic: Limit the party to one magic user, if any. Potent spells can't open new opportunities; they act only as normal spells with broader impact—often with more risk. Establish before your game if magical healing exists."
  - "No Magic: All magical paths are removed, as is arcana. Reflavor talents as skill and technology as needed. Consider also dialing down lethality (next page) or using the Vigor Pool optional rule to make up for the lack of magical healing unless you're looking for a gritty tone."
  - "Common Magic: Make arcana more plentiful in the world, and reflavor more talents to be magical in nature. PCs should start with 1 minor arcana, and the story of where it came from."
  - "Dangerous Magic: All spells can trigger a magical twist (as sorcerer) when two or more 1s are rolled. When triggered, pick one of the following or make your own consequence:"
---
table: dangerous-magic-twists
title: "Dangerous magic: twists"
description: "All spells can trigger a magical twist (as sorcerer) when two or more 1s are rolled. When triggered, pick one of the following or make your own consequence."
source: "p. 172"
entries:
  - "Wild Surge: make a 1d story roll to see the collateral damage"
  - "Dark Omen: GM takes +1 suspense"
  - "6d Corruption pool: 0d → change trait, desire, bond, or appearance negatively"
---
table: setting-dials-scale
title: "Setting dials: scale"
description: "There is a vast difference in the scale of character impact between small village common folk and mythic heroes. Use these options to change the scope of the game."
source: "p. 173"
entries:
  - "Smaller Scale: More rolls have risk, and are judged as impossible. Mooks should be rare, with even common enemies posing a threat. The max level for PCs is 3, though the GM should allow talents to be switched out after in-game milestones."
  - "Larger Scale: Fewer rolls have risk and are judged as impossible. Mooks should be waded through freely, as pure set dressing, while toughs can be taken a few at a time. Bosses should be epic in their own right, not just being linked challenges more often, but having an interesting ‘catch’ or ‘secret’ to overcoming them that provides the real test. PCs start at level 3."
---
table: setting-dials-lethality
title: "Setting dials: lethality"
description: "Base Grimwild strikes a balance, with characters more durable than the commoners around them, but a few bad calls can still leave them on the ground."
source: "p. 173"
entries:
  - "More Lethal: Use high and dire stakes more often. When weapons appear, the players should know that death could happen at any moment. Healing often takes longer, and resurrection is impossible. When a PC is desperate, give them an urgent condition which will lead to dropped (4d bleeding out, 6d blacking out). When a PC is dropped, they make a 1d story roll, making death (or permanent injury) a coin flip."
  - "Less Lethal: Use low stakes more often, even in combat if the heroes aren’t against strong foes. PCs will rarely have permanent conditions, and resurrection is possible. When a PC is dropped, they make a 3d story roll, giving much better odds to stay in the fight."
---
table: weapon-styles
title: "Example weapon styles"
description: "PC weapons have 2 descriptors—their weapon styles, clear ways to differentiate them from others of their kind. Use any of the following, or come up with your own. Three columns: one die picks the row, the other the column (1-2, 3-4, 5-6), read both ways."
dice: d66
both_ways: true
source: "p. 176"
entries:
  11-12: "precise"
  13-14: "quick"
  15-16: "bashing"
  21-22: "quiet"
  23-24: "sweeping"
  25-26: "piercing"
  31-32: "vicious"
  33-34: "entangling"
  35-36: "sapping"
  41-42: "disarming"
  43-44: "heavy"
  45-46: "balanced"
  51-52: "dazing"
  53-54: "nimble"
  55-56: "concealable"
  61-62: "ornate"
  63-64: "brutal"
  65-66: "long"
