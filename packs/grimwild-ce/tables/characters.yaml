table: group-building-questions
title: Group-building questions
description: A question from one of the four lists. Try swapping "you" and "I" in these questions—flip it around if it's more interesting!
source: p. 50
entries:
  - {table: group-questions-history}
  - {table: group-questions-feelings}
  - {table: group-questions-tensions}
  - {table: group-questions-futures}
---
table: group-questions-history
title: Questions about shared history
source: p. 50
entries:
  - What secret did I tell you that you’ve never dared to share with anyone else?
  - When we first met, what mistake did I make that still embarrasses me?
  - What did we steal together, and how did it bring us closer?
  - When did I save you from something, and what did it cost me?
  - What moment made you decide you could trust me, even if you didn’t want to?
---
table: group-questions-feelings
title: Questions about feelings and impressions
source: p. 50
entries:
  - What’s something about me that annoys you, but you’d miss if I were gone?
  - What’s a time I surprised you by being braver or softer than you expected?
  - What’s a rumor about me you half believe, but you’re too afraid to ask if it’s true?
  - When have I pushed you away, and how did it hurt?
  - What do you envy about me, even if you’d never admit it out loud?
---
table: group-questions-tensions
title: Questions about tensions and challenges
source: p. 50
entries:
  - What’s a lie I told you that you’re still pretending to believe?
  - What’s a promise I broke that you haven’t forgiven me for?
  - When have I let you down, and how did you learn to work around me?
  - What’s something dangerous you think I’m hiding from the group?
  - What about me makes you feel like you’re walking on thin ice?
---
table: group-questions-futures
title: Questions about shared futures
source: p. 50
entries:
  - What’s a dream I have that you think is foolish, but still want to help me achieve?
  - What do you hope I’ll never find out about your plans?
  - What do you think our journey will turn me into, and does that scare you?
  - When this is all over, where do you imagine us going together?
  - What’s something you think we’ll regret, but we’ll do it anyway?
