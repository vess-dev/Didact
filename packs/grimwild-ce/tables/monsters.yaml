# Grimwild: Community Edition (Preview 5.3), Chapter 5: Monsters A-Z (pp. 146-171). CC0 1.0.
# Every monster block's table, in book order, then any extra tables of the same block.
# Instructions printed in a heading's brackets ("(Roll 2)") are in `description`.
#
# Tables printed in 2 or 3 columns:
# - When the columns hold different kinds of words read together (an adjective and a noun, a
#   contest and its reward), `columns` rolls each column once.
# - When the columns only continue one list, the table is a d66 read both ways (`both_ways`), the
#   book's rule for 2- and 3-column tables (p. 5): one die picks the row, the other the column
#   (1-3 and 4-6 for two columns; 1-2, 3-4 and 5-6 for three), "or switch them".
table: basilisk-hiding-spots
title: "Hiding Spots"
dice: d6
source: "p. 146"
entries:
  1: "Beneath a crumbling, but still-used bridge."
  2: "Within the rotting carcass of a fallen dragon."
  3: "On the fifth floor of a derelict watchtower."
  4: "In a field full of half-eaten bear statues."
  5: "Within a maze of rusted, echoing pipes."
  6: "Among the twisted roots of a giant tree."
