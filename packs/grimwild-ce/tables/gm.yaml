# Grimwild: Community Edition (Preview 5.3), Chapter 3: GM Toolkit (pp. 93-108). CC0 1.0.
# The GM crucible, the suspense and impact moves, stakes, and vigilance. Challenges (pp. 104-106)
# and factions (p. 114) are worked examples only, with no table or pick-list to transcribe.
#
# Crucibles are d66 read both ways (`both_ways`, p. 5): the row die is the tens digit and the column
# die the units, and 31 also gives 13; pick the one that grabs you. (The book's own example on p. 93
# numbers the GM crucible the other way round, "3, 1 = 31: precarious or 13: broken"; the pair of
# words is the same.) The GM crucible is reprinted in the solo rules (p. 192).
# Pick-lists keep the book's examples in each entry's data (`examples`).
