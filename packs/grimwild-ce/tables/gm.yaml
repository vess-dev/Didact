table: suspense-moves
title: "Suspense moves"
description: "Suspense moves help the players out in some way or escalate tension, earning or offering a way to take suspense when used. Use these moves with cinematic timing."
source: "pp. 98-99"
entries:
  - text: "Build Up: Use this move when you want to build up drama before a big scene, giving each PC spark and taking suspense."
    data:
      examples:
        - "The dragon roars, and rocks tumble from the ceiling. What does it look like when you dodge them and engage?"
        - "How are you dressed as you enter the masquerade?"
        - "You sit around a campfire, knowing the battle to come in the morning."
        - "You watch the goblin warband in the distance. They’ll be here by morning. What is the mood around the camp?"
    source: "p. 98"
  - text: "Clue In: Use this move when you want to show the direction of the story, taking suspense while giving the players knowledge and leaving the PCs in the dark."
    data:
      examples:
        - "We see the baron through the castle window, draining blood from his latest victim."
        - "As you trek through the forest, unaware, we see the glint of feline eyes behind you."
        - "We move to the next town over. We see flames and dancing goblins, as they make plans to come to Humblefalls next."
    source: "p. 98"
  - text: "Foreshadow: Use this move when you want to introduce adversity without suspense, telegraphing danger and following up with an impact move if left unaddressed."
    data:
      examples:
        - "You hear hoofbeats coming, a 4d timer."
        - "The dragon takes a deep breath."
        - "You see thick spider webs on the ceiling."
        - "One of the tiles ahead of you is slightly raised and discolored."
        - "Before walking up to the wrecked caravan, you notice small humanoid tracks around it. Everything seems too quiet."
    source: "p. 99"
  - text: "Resolve: Use this move when the players are stuck or cornered, helping the PCs and getting suspense in return."
    data:
      examples:
        - "You hear from above, \"Need some help down there?\""
        - "The minotaur seems satisfied that it won and turns to walk away."
        - "Seeing what happened to Guzrak, the remaining goblins drop their weapons and surrender."
    source: "p. 99"
---
table: impact-moves
title: "Impact moves"
description: "Impact moves deal significant consequences, and make the world feel powerful. Use these moves when prompted; when not prompted by their own roll, impact moves directly against a PC give them a defense roll."
source: "pp. 100-101"
entries:
  - text: "Complicate Things: Use this move when things are too easy or stable, adding elements that raise the stakes or add thorns to relevant rolls."
    data:
      examples:
        - "The guard catches sight of you and rings the alarm bell (start 4d reinforcements arrive)."
        - "The ruffians in the tavern all draw their weapons."
        - "The fire spreads to the furniture."
        - "You see skeletal hands burst from the ground as The Lich summons more undead!"
    source: "p. 100"
  - text: "Counter: Use this move when you want to showcase the resilience of a major threat, countering a PC’s action, or taking away their permissions."
    data:
      examples:
        - "The mage casts a quick protective spell, slowing your strike."
        - "The queen raises a hand, silencing everyone."
        - "Your punch lands square on his jaw, and he slowly grins."
        - "With a flash of necrotic power, The Lich dispels your magic, making it dissipate into the aether."
    source: "p. 100"
  - text: "Hit Hard: Use this move when injury is the most dramatic consequence, inflicting marks, harm, vex, or conditions on a PC."
    data:
      examples:
        - "The ceiling collapses, raining rocks down on you."
        - "She smirks wickedly at you—take vex, you’re pissed."
        - "The bandit’s arrow whistles through the air, embedding itself in your shoulder."
        - "His boney hand grabs your wrist. You take bloodied as the life force is sapped from you."
    source: "p. 101"
  - text: "Lock Down: Use this move when you want to add cinematic edge, declaring an unavoidable event to take chances, options, equipment, and allies away."
    data:
      examples:
        - "The thief gets away, nowhere to be seen."
        - "The bridge behind you collapses."
        - "Your gold pouch and sword slide towards the lava, which do you go for?"
        - "A magic barrier forms in front of the door. It seems the only way out now is to defeat this grand evil once and for all."
    source: "p. 101"
---
table: stakes
title: "Stakes"
description: "Stakes frame the danger of a scene, telling the table about the severity of trouble they should expect. Unless clearly otherwise, the scene has regular stakes."
source: "p. 103"
entries:
  - text: "Low Stakes: Lighter territory. You may roll for things you’d normally skip or don’t see as risky. Impact moves have the weight of 1 mark, or softer consequences (set dressing, vex, raise stakes). This is a tool for tone, moving between intense and light play."
    data:
      examples:
        - "Fisticuffs in a barfight."
        - "Keep your nerve while questioned by a friendly guard."
        - "Help a cat that’s stuck in a tree."
  - text: "Regular Stakes: Typical play and the assumed default. Impact moves have the weight of 1 harm, or other standard consequences (2 marks, condition, roll a pressure pool, complicate things)."
    data:
      examples:
        - "Sneak through a guarded warehouse."
        - "Handle a tense negotiation."
        - "Fight a gnoll, 1-on-1."
  - text: "High Stakes: Things are escalated. Impact moves have the weight of desperate harm, twice that of a standard consequence. A disaster can drop PCs immediately, with most incoming trouble putting them at death’s door."
    data:
      examples:
        - "Defend yourself while cornered by an angry ogre."
        - "Explaining your actions to the queen."
        - "Bluff a trained and suspicious guard."
  - text: "Dire Stakes: Death looms. Keep players in the loop and let them know that PC death is on the table. Any prompted impact move will instantly drop the PC."
    data:
      examples: ["Pushed off a cliff.", "Looking into the eyes of an elder horror."]
---
table: vigilance
title: "Vigilance"
description: "The GM spotlights the most relevant PC and uses a gut feeling to decide how much they perceive based on their vantage and the type of tension the GM wants to build. With the optional Active Vigilance rule (p. 177), the PC makes a story roll affected by their vantage: on a perfect, the player gets a reveal; on a messy, a hint; on a grim, the GM uses strike."
source: "p. 107"
entries:
  - text: "Reveal (Tests their skill): Foreshadow with an obvious unveiling of an imminent threat. The PC that becomes aware has a chance to act before the danger strikes, potentially side-stepping the threat even without an action. Character competence guides the story forward."
    data:
      examples:
        - "Spotting the assassin in hiding."
        - "A whirling of gears betraying the swinging scythe trap about to spring."
  - text: "Hint (Tests their intuition): Foreshadow with a subtle clue about a hidden element. The player gets a single chance to interpret the situation. They're limited to just one to highlight the natural response of the PC and to keep things flowing. Intuition guides the story forward. A correct response leads to a reveal, letting the character take the initiative before danger strikes, or possibly bypass the situation entirely. This is the most common of the three."
    data:
      examples:
        - "That funny feeling of being watched."
        - "A blood trail down a hallway."
        - "Unnatural quiet."
  - text: "Strike (Tests their defenses): Make an impact move as the danger immediately strikes them. The GM assumes the PCs were not vigilant enough to see the threat beforehand. The dangerous world guides the story forward. This costs suspense as any other impact move, though you can consider using Clue In to gain suspense and let the players in on the secret."
    data:
      examples:
        - "You realize the servant slipped poison into your glass."
        - "A trapdoor opens beneath you."
---
