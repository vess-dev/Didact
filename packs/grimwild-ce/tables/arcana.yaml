# Grimwild: Community Edition (Preview 5.3): rituals, treasure and arcana (Gameplay, pp. 34-43) and
# the random potion generator (Extras, Potions and Other Expendables, p. 202). CC0 1.0.
# The ritual anchor crucibles (Rituals, p. 34), the treasure crucible, the arcana pick-lists, the
# five arcana crucibles (arcana-crucible rolls a random theme), the potion generator, and the book's
# example arcana by tier (minor-arcana, major-arcana, mythic-arcana, expendable-arcana). The arcana
# themselves are in compendium/arcana.yaml (List of Arcana, pp. 196-201; expendables, p. 203).
#
# Crucibles are d66 read both ways (`both_ways`, p. 5): the row die is the tens digit and the column
# die the units, and 31 also gives 13; pick the one that grabs you. A table printed in three columns
# uses the other die's 1-2, 3-4 and 5-6 for the column (keys 11-12, 13-14, 15-16, ...).
# Pick-lists (functions, effects, additions) are lists: choose, or roll for one.
