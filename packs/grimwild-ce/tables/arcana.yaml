table: arcana-mythic-additions
title: "Mythic arcana: optional additions"
description: "Mythic arcana are more likely to have extra qualities and limitations, such as those below."
source: "p. 41"
entries:
  - "Heavy Cost: The item’s magic has an upfront cost to use, such as pushing yourself, taking harm, vex, or a temporary condition."
  - "Unique Reset: The power pool doesn't reset every session, instead requiring an act, event, in-game resources, or meta-currency (such as spark or thread)."
  - "Ritual ability: Given time, or with an 8d timer pool the arcana can produce a ritual-level effect. This may be once only, or have special recharge conditions."
  - "Sentient: It can communicate, and has its own thoughts, goals, and wises."
  - "Curse: The item has a secret drawback, ranging from making it very costly to use, to twisting the user towards its own dark desires. Using its magic could bestow a condition, give the GM suspense, or subvert the user's wishes."
