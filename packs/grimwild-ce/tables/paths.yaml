# The paths, and the crucibles on the path pages (Adventurers, pp. 45, 54-86). 6x6 crucibles
# are d66: the first die is the row, the second the column, read both ways (31 or 13).
table: paths
title: Adventurer paths
description: "The 17 paths (12 core, 5 extra); each entry's data holds the path id, its core talent, its path talents (compendium ids), the levels its core talent grows at (growth) with what it gains (grows), whether it's a magical path (magical), and the half core talent it can't take, if any (prohibited: another path's lesser version of its own core, marked [Prohibited: …] in the book)."
source: p. 45
entries:
  - text: Artificer
    data:
      id: artificer
      magical: true
      core: artificer-infusion
      growth: [2, 4, 6]
      grows: "At levels 2, 4, and 6, you can create +1 major arcana, and learn 2 touchstones."
      talents: [artificer-animate-objects, artificer-artificial-parts, artificer-grenades, artificer-magnum-opus, artificer-mischief-maker, artificer-trap-making, artificer-wandslinger]
      extra: true
  - text: Bard
    data:
      id: bard
      magical: false
      core: bard-inspiration
      growth: [2, 4, 6]
      grows: "At levels 2, 4, and 6, gain +1 inspiration per session."
      talents: [bard-bardic-lore, bard-dynamic-entrance, bard-folk-hero, bard-forked-tongue, bard-friendly-face, bard-jack-of-all-trades, bard-wordplay]
      extra: false
      prohibited: berserker-warcry
  - text: Berserker
    data:
      id: berserker
      magical: false
      core: berserker-frenzy
      growth: [3, 6]
      grows: "At levels 3 and 6, gain 1 free activation of frenzy per session."
      talents: [berserker-fearsome, berserker-flesh-wounds, berserker-into-the-fray, berserker-joyful-warrior, berserker-mighty, berserker-overkill, berserker-warcry]
      extra: false
  - text: Cleric
    data:
      id: cleric
      magical: true
      core: cleric-channel-divinity
      growth: [3, 6]
      grows: "At levels 3 and 6, gain +1d to each rite pool."
      talents: [cleric-blessed, cleric-devout, cleric-healer, cleric-iron-will, cleric-rings-false, cleric-sermons, cleric-shepherd]
      extra: false
      prohibited: paladin-divine-blessing
  - text: Druid
    data:
      id: druid
      magical: true
      core: druid-wild-shape
      growth: [3, 6]
      grows: "At levels 3 and 6, gain +1d to your Wild Shape pool."
      talents: [druid-augury, druid-awaken, druid-kindred-spirits, druid-primal-growth, druid-primordial-bonds, druid-true-shape, druid-windcaller]
      extra: false
  - text: Fighter
    data:
      id: fighter
      magical: false
      core: fighter-weapon-mastery
      growth: [3, 6]
      grows: "At levels 3 and 6, gain +1 mastery per scene."
      talents: [fighter-arcane-training, fighter-bulwark, fighter-control, fighter-got-your-back, fighter-measured-tones, fighter-swift-recovery, fighter-tactician]
      extra: false
  - text: Monk
    data:
      id: monk
      magical: false
      core: monk-discipline
      growth: [3, 6]
      grows: "At levels 3 and 6, gain +1 flow per scene and +1 interrupts per session."
      talents: [monk-healing-hands, monk-lightning-reflexes, monk-mind-over-matter, monk-redirect, monk-resonance, monk-tether, monk-there-is-no-try]
      extra: false
  - text: Paladin
    data:
      id: paladin
      magical: false
      core: paladin-oathsworn
      growth: [2, 4, 6]
      grows: "At levels 2, 4, and 6, gain +1 smite per session."
      talents: [paladin-aegis, paladin-authority, paladin-challenge, paladin-dauntless, paladin-divine-blessing, paladin-guardian, paladin-rebuke]
      extra: false
  - text: Psion
    data:
      id: psion
      magical: true
      core: psion-awakened-mind
      growth: [3, 6]
      grows: "At levels 3, and 6, you gain +1 instability slot at 0t, and +1 bastion."
      talents: [psion-echo, psion-foresight, psion-mind-blast, psion-psychic-warrior, psion-reader, psion-shift-form, psion-tumultuous-mind]
      extra: true
  - text: Ranger
    data:
      id: ranger
      magical: false
      core: ranger-quarry
      growth: [3, 6]
      grows: "At levels 3 and 6, choose +1 Quarry per session."
      talents: [ranger-animal-companion, ranger-keen-senses, ranger-relentless, ranger-scout-ahead, ranger-seasoned-hunter, ranger-sharpshooter, ranger-trophies]
      extra: false
  - text: Rogue
    data:
      id: rogue
      magical: false
      core: rogue-expertise
      growth: [3, 6]
      grows: "At levels 3 and 6, gain +1 Competence per session and +1 skill."
      talents: [rogue-distraction, rogue-eldritch-affinity, rogue-lurker, rogue-mastermind, rogue-opportunist, rogue-poisoner, rogue-weasel]
      extra: false
      prohibited: swashbuckler-natural-moxie
  - text: Sorcerer
    data:
      id: sorcerer
      magical: true
      core: sorcerer-sorcery
      growth: [2, 4, 6]
      grows: "At levels 2, 4, and 6, gain a new magic path or technique."
      talents: [sorcerer-eldritch-growth, sorcerer-maelstrom, sorcerer-magic-sense, sorcerer-metamagic, sorcerer-spelleater, sorcerer-wisps, sorcerer-wrath]
      extra: false
      prohibited: rogue-eldritch-affinity
  - text: Summoner
    data:
      id: summoner
      magical: true
      core: summoner-vassal
      growth: [3, 6]
      grows: "At levels 3 and 6, you gain +1 aspect."
      talents: [summoner-binding-word, summoner-fierce-protector, summoner-ley-magic, summoner-monster-menagerie, summoner-pocket-plane, summoner-portal-network, summoner-shared-soul]
      extra: true
  - text: Swashbuckler
    data:
      id: swashbuckler
      magical: false
      core: swashbuckler-panache
      growth: [2, 4, 6]
      grows: "At levels 2, 4, and 6, you gain +1 panache per scene."
      talents: [swashbuckler-audacity, swashbuckler-fancy-footwork, swashbuckler-improvise, swashbuckler-lucky, swashbuckler-natural-moxie, swashbuckler-provoke, swashbuckler-the-legend-of]
      extra: true
  - text: Warlock
    data:
      id: warlock
      magical: true
      core: warlock-pact
      growth: [3, 6]
      grows: "At levels 3 and 6, gain +1 Eldritch Talent."
      talents: [warlock-affliction, warlock-blood-rituals, warlock-knowing-gaze, warlock-magus, warlock-otherworldly-form, warlock-visions, warlock-wayfarer]
      extra: false
  - text: Witch
    data:
      id: witch
      magical: true
      core: witch-hidden-magic
      growth: [2, 4, 6]
      grows: "At levels 2, 4, and 6, you gain +2 words of power."
      talents: [witch-bailiwick, witch-evil-eye, witch-familiar, witch-herbalism, witch-homely-hovel, witch-soothsayer, witch-wonder-magnet]
      extra: true
  - text: Wizard
    data:
      id: wizard
      magical: true
      core: wizard-spellcraft
      growth: [2, 4, 6]
      grows: "At levels 2, 4, and 6, gain +1 spell and potent spell per session, +1 theorem"
      talents: [wizard-alchemist, wizard-archivist, wizard-colleagues, wizard-component-pouch, wizard-countermagic, wizard-mastered-theorem, wizard-specialty-school]
      extra: false
      prohibited: fighter-arcane-training
