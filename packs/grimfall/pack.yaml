id: grimfall
name: Grimfall
kind: system
version: 0.1.0
description: >-
  Grimfall: a Fallout hack of Grimwild, by way of Grimwild: Community Edition. Survivors in the
  irradiated bones of the old world: action rolls where the highest d6 sets the result and d8
  thorns cut it, diminishing pools, the damage ladder with lingering rad marks, seven
  S.P.E.C.I.A.L. classes built on Core Perk engines (Might, Grit, Sway, devices, Cool, Luck dice
  and the Weak Point die) and over two hundred more perks, stimpaks, chems, caps and hauls,
  downtime, standing, settlements worth saving, the Bestiary, the Armory's relics, unique weapons
  and armors, and the options and dials, playable in Didact.
requires: {packs: [core, grimwild-ce]}
extends: [grimwild-ce]
# What Grimfall drops of Grimwild: CE's (whatever it replaces by id is never hidden). Grimfall's book
# replaces the parent's text wholesale, so every compendium entry (paths, talents, monsters, arcana,
# backgrounds), table, reference section and glossary term goes, but the bonds table (intensity +
# nature: the book's own examples are its words). Of the rules, only those with no place here go;
# the rest are inherited and read the same: the faction pools (faction-turn, faction-pool,
# faction-pool-roll, faction-goal), tick, tokens, reset-suspense, the pre-session and rest-reset
# triggers, the story oracle and the npc type. The site generator stays replaced by a stop naming
# Grimfall's vault (the book calls a delve a 5-point site).
hides:
  type: [path, talent]
  table: ["*", "!bonds"]
  action: [reset, switch-talent, carouse, vigor]
  procedure: [twist, talent-resets]
  trigger: [scene-end-sword-and-sorcery, scene-end-noblebright]
  option: [magic, lasting-marks, random-vex, random-bonds, vigor-pool, wealth, expanded-downtime]
  entry: ["*"]
  generator: [potion, talent]
  reference: ["*"]
  term: ["*"]
license:
  spdx: LicenseRef-Grimfall
  redistributable: true
  attribution: >-
    CREDITS & LICENSE. Grimfall is an unofficial, non-commercial fan work, adapted from Grimwild by
    J. D. Maxwell (Oddity Press), used under the Creative Commons Attribution 4.0 International
    license (CC BY 4.0 — creativecommons.org/licenses/by/4.0), by way of Grimwild: Community Edition
    (lead developer Chancey Scott, Groov Games). Fallout and its settings, creatures, and trademarks
    belong to Bethesda Softworks. Grimfall is not endorsed by or affiliated with Bethesda Softworks,
    Oddity Press, or the Community Edition team. Play it at your table, change it, pass it on — just
    don't sell it.
