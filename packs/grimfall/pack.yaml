# A hack's settings go on top of its base's, key by key: grimwild-ce's `factions` (the faction turn
# is its `faction-turn`) is inherited as it is; Grimfall restates `combat` in its own words, and
# its `names` tables stand in for the parent's.
settings:
  combat:
    mode: popcorn
    round_one: >-
      There are no turns in Grimfall: the spotlight moves like a camera, not a queue. Enemies never
      roll: frame the danger and ask how the survivors respond, or follow their lead; the world hits
      back through impact moves on their messy and grim rolls, and whenever the GM spends suspense
      (a move they didn't invite gets a defense roll). A dangerous foe is a task pool: `didact gen
      run grimfall.foe` puts one in play.
  names: {npc: survivor-names, vault-file: survivor-vault-names}
