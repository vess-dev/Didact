table: downtime-actions
title: Downtime actions
description: "When time passes, per-session perks refresh, and each survivor picks one downtime action,
  or two different ones if they sold off a haul. Each entry's data holds its id: `didact do downtime who=<pc>
  act=<id>`."
source: surviving-the-wasteland/downtime
entries:
- text: Rest — shake every non-permanent condition (marks and harm already clear with any real 
    rest); the GM may rule that a long-term one lingers.
  data: {id: rest}
- text: "Venture — odd jobs, courier runs, a solo score. Make a story roll: on a perfect, a minor haul,
    a rumor, or a new ally; on a messy or worse, it's complicated."
  data: {id: venture}
- text: Blow off steam — give a vignette of how you unwind — the bar, the fights, the chapel, the 
    jukebox — and take spark.
  data: {id: steam}
- text: 'Pursue a goal — chase a project with a task pool, rolled each time you pick this: build the still,
    mod the rifle, retrain a wise or a perk, cook a legend-grade batch.'
  data: {id: pursue}
- text: Plan ahead — write a few words about how you prepare and take a special thread, on top of 
    your usual two, usable only on details from that preparation. It's lost when time passes again.
  data: {id: plan}
