description: When the GM declares that time passes, give each stretch three sensory details, and let
  one be wrong for the old world (the book's examples).
source: surviving-the-wasteland/the-long-road#the-passage-of-time
entries: [ash-blossom on the wind, geiger crickets, clean snow that shouldn't be trusted]
