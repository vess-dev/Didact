table: region-map
title: The token menu
description: 'When the GM calls to expand the map, everyone at the table, GM included, takes 3 exploration
  tokens and spends them going around: settlements, sites, dangers, curiosities, areas and barriers, joined
  by paths, with a waypoint for each day of hard travel. Everything gets a two-word label. Survivors also
  earn 1-3 tokens for a real discovery, and can spend thread as a token when a wise or story arc explains
  how they knew (`didact do tokens`).'
source: surviving-the-wasteland/the-long-road#the-token-menu
entries:
- 'Points: a settlement, site, or danger: 1 token minor, 2 major.'
- 'Specials: a curiosity, barrier, or area: 3 tokens (the GM adds them free).'
- "Paths: rough free · minor 1 · major 2. Passes (bridges, tunnels) ride along free; waypoints are the
  GM's."
---
table: settlement-map
title: 'The token menu: street scale'
description: Settlement maps work the same at street scale.
source: surviving-the-wasteland/the-long-road#the-token-menu
entries:
- 'Street scale: roads 1; notable buildings 2 (minor, lower-case on the map) or 3 (major, CAPITALS).'
