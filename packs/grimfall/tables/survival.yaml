table: chems
title: Chems
description: "A dose is a trivial expendable: a single device-level effect whose buff lasts the scene,
  and the strong stuff always kicks back. One dose, one scene, then the comedown. Read it by chem: --with
  chem=jet. Each entry's data holds what it does while it lasts and the kick."
lookup: chem
source: surviving-the-wasteland/chems
entries:
  buffout:
    text: 'Buffout: +1d on feats of raw muscle'
    data:
      chem: Buffout
      lasts: +1d on feats of raw muscle
      kick: mark Brawn when it fades
  psycho:
    text: 'Psycho: +1d on aggressive actions'
    data:
      chem: Psycho
      lasts: +1d on aggressive actions
      kick: take vex (anger) when it fades
  jet:
    text: 'Jet: +1d on anything that needs speed; you act first'
