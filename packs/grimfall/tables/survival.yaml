table: treasure-tiers
title: Hauls
description: "Serious wealth moves in hauls, in three sizes (the book's examples). Hauls belong to the
  party unless you decide otherwise; a few hundred caps is a minor haul, a few thousand a major one. Read
  it by size: --with tier=major."
lookup: tier
source: surviving-the-wasteland/caps-and-barter#hauls
entries:
  minor: 'Minor haul: a working pistol and ammo, a sack of caps, a crate of clean cans, a brahmin, a minor
    arcana.'
  major: "Major haul: a suit of combat armor, a caravan's cargo, a safehouse, laser weapons that hold
    a charge, a major arcana."
  mythic: 'Mythic haul: a functioning reactor, a water chip, a Vertibird, the deed to a town.'
