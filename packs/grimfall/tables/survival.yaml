table: site-map
title: 'The token menu: site scale'
description: 'Vaults and ruins become 5-point site maps (Chapter 9): the GM places the Reward first, then
  everyone spends exploration tokens on the rest.'
source: surviving-the-wasteland/the-long-road#the-token-menu; running-the-wasteland/vaults-and-ruins
entries:
- 'Site scale: rooms 1 (minor) or 2 (major).'
- 'The Door (Entrance): getting in is its own story: the terminal, the password, the thing nesting in
  the gear room.'
- "The Experiment (Puzzle): every vault was testing something; meet it as a problem that can't just be
  shot."
- 'The Twist (Hitch): what two centuries did to the test. The betrayal, the illusion, the second door.'
- 'The Confrontation (Showdown): the fight or reckoning the vault has waited two hundred years to have.'
- 'What Vault-Tec Left (Reward): the haul, the truth, and usually a hook to the next site.'
---
table: joy-of-exploration
title: Wonder in the wastes
description: 'Take spark when you let the world in (`didact do take-spark who=… why=wonder`):'
source: surviving-the-wasteland/the-long-road#wonder-in-the-wastes
entries:
- Pause for a moment of ruined beauty and show us what it means to your survivor.
- Ask a question about the old world nobody at the table can answer, and let the table run with it.
- Travel somewhere far off just to see what's there (everyone who goes takes spark).
- Make a scene about a place itself, one you'll never forget.
