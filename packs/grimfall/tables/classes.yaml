table: perk-lists
title: Where a perk comes from
description: "At creation, the Core Perk plus one more perk: from your class's seven, another class's
  (never its Core Perk), or the Perk Compendium; then a new perk at each level. Every perk except the
  Core Perks is open to every survivor, once, unless it's repeatable. Each entry's data holds its perks
  (compendium ids)."
source: building-a-survivor/creation-step-by-step
