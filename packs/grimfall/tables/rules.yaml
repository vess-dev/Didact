table: vantage
title: Vantage
description: "Your frame of reference: who you are, what's on your sheet, and the scene around you. It
  decides what's plausible, and you're assumed to carry the tools of your trade. Each entry's data holds
  its id."
source: the-core-engine/vantage
entries:
- text: Certain — stated on your sheet or obvious from the fiction. No roll; it just works.
  data:
    id: certain
    examples: [A sawbones suturing in a calm clinic.]
- text: Reasonable — fits you and the moment. Roll it, 0–1 thorns.
  data:
    id: reasonable
    examples: [A prospector jimmying a pre-war lock.]
- text: Doubtful — a stretch. Roll with 2+ thorns or higher stakes.
  data:
    id: doubtful
    examples: [A vault kid staring down a raider boss.]
- text: Impossible — beyond you, no roll. Propose something smaller.
  data:
    id: impossible
    examples: [Outrunning a Vertibird on foot.]
