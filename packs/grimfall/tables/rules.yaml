table: pool-kinds
title: Kinds of pools
description: "Diminishing pools track anything that runs out: progress, threats, resources, time. Roll
  the pool; dice landing 1-3 drop out; at 0d the thing happens or runs dry. Each entry's data holds the
  kind (a track's `--pool`)."
source: the-core-engine/pools
entries:
- text: 'Task pools — effort to overcome: 6d Crack the Vault Door, 4d Raider Pack.'
  data: {id: task}
- text: 'Pressure pools — trouble closing in: 6d The Horde Notices You.'
  data: {id: pressure}
- text: 'Timer pools — events unfolding: 8d Sunrise, 4d The Reactor Melts Down.'
  data: {id: timer}
- text: "Resource pools — stock running out: 4d Clean Water, 3d Stimpaks. Use it, then roll it: the use
    always works, and the roll only shows how much is left. At 0d it's gone. The GM can also roll one
    as an impact move when losing some makes sense."
  data: {id: resource}
- text: "Power pools — rolled in place of a stat: take the highest die as your result, then drop the 1–3s.
    Spark or assist dice rolled alongside stay separate — they never drop and never join the pool. If
    a use isn't risky, it simply succeeds — but you still roll the pool and drop the 1–3s. 4d Alien Blaster
    Cells."
  data: {id: power}
- text: 'Bonus-dice pools — a buff you draw on: roll the pool alongside your own dice and count its best
    die with yours, then drop its 1–3s. 3d Covering Fire.'
  data: {id: bonus-dice}
- text: 'Linked pools — chained phases: 6d Slashing Claws + 8d The Deathclaw. Beat the first to reach
    the second.'
  data: {id: linked}
- text: 'Campaign pools — long-fuse events rolled between sessions and in downtime, faction pools among
    them: 8d The Enclave Returns.'
  data: {id: campaign}
