table: mythic-arcana
title: Mythic arcana
description: "A mythic item answers to no cap but the table's judgment: ritual-level deeds and any number
  of potent tricks, its pools going potent by dropping 1d. Every mythic arcana of the Armory (relics,
  unique weapons and unique armors; expendables are expendable-arcana). Each entry's data holds its compendium
  id, its arsenal, and its first pool (pool: {name, dice, kind, unique_reset}) or a power armor suit's
  Plating, for the haul generator."
source: the-armory/introduction#the-tier-gate
