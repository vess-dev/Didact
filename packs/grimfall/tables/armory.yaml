description: 'The purely priceless: treasure, not arcana — caps, leverage, and grief by the pound. Price
  them as hauls (a few hundred caps is a minor haul, a few thousand a major one), and let the right buyer
  make them a story.'
source: the-armory/minor-relics#also-in-the-crates
entries:
- a Mass Grave Ledger
- the Vault 69 Archive
- a G.E.C.K. Bay Schematic
- pre-war champagne
- a luxury watch
- sealed animal and disease samples
- carved gallery figures
- one family photograph
- a Sierra Madre gold bar (thirty-five pounds of pre-war certainty, heavy as guilt; the vault holds 
  37, and walking out with all of them is a eulogy — while the Madre's chips still feed its vending 
  machines, forever)
- a Snow Globe (twenty caps to anyone; two thousand from the one collector chasing all seven, and 
  the set unlocks a sealed suite)
- a Sealed Nuka-Cola Crate (24 pristine bottles, one glowing blue, and the crate itself buys a favor
  from the preservation society — there is always a preservation society)
