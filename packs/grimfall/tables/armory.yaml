table: minor-arcana
title: Minor arcana
description: "A minor item is a narrow edge: set-dressing vantage, a thorn it ignores, +1d in a narrow
  circumstance, a 2d pool for a device-level trick, or a once-per-session trick. Minors are never potent.
  Every minor arcana of the Armory (relics, unique weapons and unique armors; expendables are expendable-arcana).
  Each entry's data holds its compendium id, its arsenal, and its first pool (pool: {name, dice, kind,
  unique_reset}) or a power armor suit's Plating, for the haul generator."
source: the-armory/introduction#the-tier-gate
