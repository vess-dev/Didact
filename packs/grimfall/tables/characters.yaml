table: group-building-questions
title: Group-building questions
description: At session zero or around a campfire, ask the player to your left one of these.
source: building-a-survivor/machines-and-strangers#group-building-questions
entries:
- What did we scav together that we never told the others about?
- When did I save you, and what did it cost me?
- What's a rumor about me you half believe?
- What did I do in that vault that still embarrasses me?
- Which rule of yours have you watched me break?
- Whose grave did we dig together?
- What did you see me do for a stranger when I thought nobody was looking?
- What do you think the wasteland will turn me into, and does it scare you?
