# Grimfall, Chapter 7: The Bestiary. The tiers and roles (the parent's ids, so its readers keep
# working), every creature as a pick-list for the foe generator, and the gang crucible of The Factions
# Under Arms.
# Generated by Didact Work/Temp/grimfall/gf_bestiary.py: edit the script, not this file.
table: combat-tiers
title: Tiers
description: A threat's tier sets its presence (perks and arcana call mooks lesser foes, and elites 
  and bosses greater ones). Elites and bosses framed as challenges bring 2 bonus suspense of their 
  own; a pool of mooks or toughs is just a pool. Each entry's data holds the tier's usual pool 
  (dice), how a battleground lists one (foes), and whether it's a challenge of its own.
source: the-bestiary/introduction
entries:
- text: 'Mooks are fodder: one good roll clears several, and a pack is a single task pool, usually 4d.'
  data: {id: mook, dice: 4d, pool: 4, foes: foes, lesser: true, challenge: false}
- text: Toughs fall one at a time; a knot of them is a pool too, usually 6d.
  data:
    id: tough
    dice: 6d
    pool: 6
    foes: foes
    lesser: false
    challenge: false
- text: Elites are a challenge unto themselves, usually 6d.
  data:
    id: elite
    dice: 6d |
    pool: 6
    foes: foe
    greater: true
    challenge: true
- text: Bosses own the scene at 8d — or as a linked challenge whose parts each carry their own pool,
    traits, and moves, with a fail state that ends the fight the bad way.
  data: {id: boss, dice: 8d |, pool: 8, foes: foe, greater: true, challenge: true}
---
table: combat-roles
title: Roles
description: "Each card's role says how the threat fights, and what makes it falter (compendium: the role's
  id)."
source: the-bestiary/introduction#roles
entries:
- text: 'Blaster: fights by raining power from range; falters when the fight gets close.'
  data:
    id: blaster
    fights_by: raining power from range
    falters_when: the fight gets close
- text: "Brute: fights by sudden, overwhelming force; falters when it's baited or taunted."
  data:
    id: brute
    fights_by: sudden, overwhelming force
    falters_when: it's baited or taunted
- text: "Lurker: fights by striking from concealment; falters when it's exposed, or the fight drags on."
  data:
    id: lurker
    fights_by: striking from concealment
    falters_when: it's exposed, or the fight drags on
- text: 'Marksman: fights by picking targets off at a distance; falters when caught in melee or forced
    to move.'
  data:
    id: marksman
    fights_by: picking targets off at a distance
    falters_when: caught in melee or forced to move
- text: "Predator: fights by running its prey down; falters when the prey won't break."
  data:
    id: predator
    fights_by: running its prey down
    falters_when: the prey won't break
- text: 'Protector: fights by shielding allies and soaking blows; falters when cut off from those it guards.'
  data:
    id: protector
    fights_by: shielding allies and soaking blows
    falters_when: cut off from those it guards
- text: 'Skirmisher: fights by hit-and-run from odd angles; falters when pinned down.'
  data:
    id: skirmisher
    fights_by: hit-and-run from odd angles
    falters_when: pinned down
- text: 'Swarmer: fights by numbers, from every side; falters when its numbers thin.'
  data:
    id: swarmer
    fights_by: numbers, from every side
    falters_when: its numbers thin
- text: 'Tactician: fights by preparation and command; falters when the plan fails.'
  data:
    id: tactician
    fights_by: preparation and command
    falters_when: the plan fails
- text: 'Trickster: fights by confusion and deceit; falters when its tricks are exposed.'
  data:
    id: trickster
    fights_by: confusion and deceit
    falters_when: its tricks are exposed
