- text: Super Mutant Behemoth
  data:
    id: super-mutant-behemoth
    tier: boss
    role: brute
    dice: 8
    usual: true
    parts: 3
    part:
      1:
        name: The Behemoth
        dice: 8
        traits: titanic, smashes through cover and walls; the head is the only opening, and only 
          once it's brought down or scaled
        moves: Hydrant Sweep (collateral), Boulder Hurl
      2:
        name: Its Footing
