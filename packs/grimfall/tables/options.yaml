table: stimpak-dials
title: 'Stimpaks: the dial'
description: "A 3d Stimpaks pool per survivor clears one harm with a breather, on yourself or an ally
  (Chapter 6). Want a meaner or kinder wasteland? Turn the dial (`didact campaign profile stimpaks=…`):
  the three grimmer settings are alternatives, pick one. Each entry's data holds the option's choice."
source: options-and-dials/gear-and-survival#stimpaks
entries:
- text: 'Standard: a 3d Stimpaks pool per survivor clears one harm with a breather, on yourself or an
    ally.'
  data: {id: standard}
- text: 'Grimmer: 2d Stimpaks pools.'
  data: {id: grimmer-2d}
- text: "Grimmer: only yourself (a jab for your own wounds, never an ally's)."
  data: {id: grimmer-self}
- text: 'Grimmer: a single 3d pool the whole party shares.'
  data: {id: grimmer-shared}
- text: 'Softer: 4d, refilled by any real rest, and a jab into a dropped ally adds +1d to their story
    roll.'
  data: {id: softer}
