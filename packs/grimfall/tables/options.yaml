table: setting-dials-lethality
title: 'Tone dial: lethality'
description: Turn it grimmer or softer (`didact campaign profile lethality=deadlier|softer`).
source: options-and-dials/tone-dials#lethality
entries:
- 'Deadlier: high and dire stakes often; a desperate survivor also carries an urgent condition (4d Bleeding
  Out); dropped = a 1d story roll; no coming back; stimpaks at 2d.'
- 'Softer: low stakes often, even in fights against weak foes; dropped = a 3d story roll; permanent conditions
  are rare; stimpaks flow (the Softer stimpak dial).'
---
table: setting-dials-scale
title: 'Tone dial: scale'
description: '`didact campaign profile scale=smaller|larger`.'
source: options-and-dials/tone-dials#scale
entries:
- 'Smaller: more rolls are risky or impossible, mooks are rare and every foe is a threat, and levels cap
  at 3 (swap perks at story milestones instead).'
- 'Larger: fewer rolls are risky, mooks are waded through and toughs fall a few at a time, survivors start
  at level 3, and bosses have a secret to overcome, not just a bigger pool.'
