table: quirks
title: Quirks
description: "Fallout's old double-edged \"traits,\" renamed so they don't trip over Chapter 3's. At creation,
  each survivor may take one quirk: an edge and a flaw, welded together. The edge is always on — a permission
  or a thorn ignored, never a die. The flaw is a standing tangle: the first time each session it truly
  bites, take spark. (an option: `didact campaign profile quirks=on`). Each entry's data holds its id,
  edge and flaw."
source: options-and-dials/quirks
about: 'The edge: {edge} The flaw: {flaw}'
entries:
- text: Built to Destroy
  data:
    id: built-to-destroy
    edge: Your criticals with a weapon always add collateral damage, free.
    flaw: Your gear wears out fast — breaking it is always a fair impact move.
- text: Fast Shot
  data:
    id: fast-shot
    edge: You never lose a beat drawing, reloading, or snapping off a shot.
    flaw: "You can't slow down: nothing with a trigger is ever given time."
- text: Four Eyes
  data:
    id: four-eyes
    edge: Glasses on, fine detail at any distance never thorns you.
    flaw: Glasses off — and they will come off — +1t on anything that needs your eyes.
- text: Good Natured
  data:
    id: good-natured
    edge: 'Strangers read you as harmless: first impressions start a step warmer.'
    flaw: "You're no killer: +1t on your first aggressive roll of any scene you didn't start."
- text: Heavy Handed
  data:
    id: heavy-handed
    edge: What you hit moves — back, down, or through something.
    flaw: "You can't do subtle: no pulled punches, no quiet takedowns."
- text: Hoarder
  data:
    id: hoarder
    edge: 'You always have the odd bolt, cord, or tin: small set dressing is never in doubt.'
    flaw: Walking away from loot takes a push.
- text: Jinxed
  data:
    id: jinxed
    edge: Disasters near you — anyone's — splash onto the other side, too.
    flaw: They land on your friends exactly as often as on your foes.
- text: Kamikaze
  data:
    id: kamikaze
    edge: You always act first when you rush in.
    flaw: The first impact move of any fight finds you, if it can.
- text: Small Frame
  data:
    id: small-frame
    edge: You fit where others don't, and slip a grab like smoke.
    flaw: Knockdowns and shoves always work on you.
- text: Trigger Discipline
  data:
    id: trigger-discipline
    edge: You never hit a bystander or a friend, whatever the dice say.
    flaw: You never act first — you're still making sure.
