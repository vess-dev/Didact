table: standing
title: Standing
description: "The wasteland keeps score: for each faction that matters, one word for how it sees the party
  (or one survivor, if they've earned a name of their own). Standing is vantage: it sets the thorns on
  every dealing with that faction, and what's certain, doubtful, or impossible to ask of them. It moves
  a step when you do something that faction will tell stories about (`didact do standing`). Read it by
  standing: --with standing=shunned."
lookup: standing
source: running-the-wasteland/standing
entries:
  idolized:
    text: "Idolized: Doors open and reasonable favors are certain. When they hear you're in trouble, they
      send help."
    data: {name: Idolized}
  accepted:
    text: "Accepted: Fair dealing and fair prices; you're let inside the wire."
    data: {name: Accepted}
  neutral:
    text: "Neutral: The default. They don't know you from a radroach."
    data: {name: Neutral}
  shunned:
    text: 'Shunned: Prices double and eyes follow you: +1t on every dealing.'
    data: {name: Shunned}
  vilified:
    text: "Vilified: Shot on sight, and somebody's paying: start a 6d They Find You campaign pool."
    data: {name: Vilified}
