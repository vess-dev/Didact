table: drift
title: Weather & drift
description: 'Track drifting conditions (weather, rad-storms, the mood of an occupying army) as a wandering
  step: each downtime or dawn, roll a d6 — 1–2, a step toward calm; 3–4, hold; 5–6, a step toward the
  green — along calm ↔ wind ↔ dust ↔ rad-storm ↔ the sky goes green. It wanders back the way weather does,
  and everyone plans around it. (`didact do drift`)'
dice: d6
source: running-the-wasteland/the-overseers-prep-kit#weather-and-drift
entries:
  1-2:
    text: A step toward calm.
    data: {step: -1}
  3-4:
    text: Hold.
    data: {step: 0}
  5-6:
    text: A step toward the green.
    data: {step: 1}
