table: gm-crucible
title: GM crucible
description: "Roll to disclaim any decision you'd rather the dice make. When you need the seed of an answer,
  roll a thorn (d8) for each column, take a word from each row you land on, and smash them together. What's
  in the ruin? — rusted + beacon: a pre-war distress tower, still calling. Why is the town silent? — smiling
  + uniform: someone official arrived first."
refs: {first: gm-crucible-1, second: gm-crucible-2}
source: running-the-wasteland/the-gms-half-of-the-engine#story-rolls-and-the-gm-crucible
entries: ['{first} + {second}']
