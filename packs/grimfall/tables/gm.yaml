table: suspense-moves
title: Suspense moves
description: "Suspense is your currency of dramatic timing: earn it by skipping a prompted impact move
  or by making suspense moves (`didact do suspense-move`). Each entry's data holds its id and the book's
  example."
source: running-the-wasteland/the-gms-half-of-the-engine
entries:
- text: Build Up — a vignette before the storm; every PC adds a detail and takes spark, you take 
    suspense.
  data:
    id: build-up
    examples: [The horde's dust cloud on the horizon. How do you spend the last hour?]
- text: Clue In — cut away to show the players what their characters can't see; take suspense.
  data:
    id: clue-in
    examples: [We see the Legion scout snap his spyglass shut and ride east.]
- text: Foreshadow — telegraph danger for free; if it goes unaddressed, it lands.
  data:
    id: foreshadow
    examples: [The floor tiles here are strangely clean. A red dot wanders across your chest.]
- text: Resolve — hand the party a way out and take suspense.
  data:
    id: resolve
    examples: [The Protectron mistakes you for its shift supervisor and waves you all through.]
---
table: impact-moves
title: Impact moves
description: "Spend suspense to strike at any moment; impact moves aimed at a PC who didn't invite them
  grant a defense roll. One impact move is flexible: split it into smaller cuts, spread it across several
  PCs, or land it off-screen. Each entry's data holds its id and the book's example."
source: running-the-wasteland/the-gms-half-of-the-engine
entries:
- text: Complicate Things — add or worsen a threat.
  data:
    id: complicate-things
    examples: [The alarm starts a 4d Reinforcements pool. The dry brush catches fire.]
- text: Counter — stop a success or a permission cold; save it for exceptional foes (this is what 
    beats an "always"), and never use it on a defense roll or a critical. A countered perk usually 
    refunds its cost (your call), but it can't be used again right away.
  data:
    id: counter
    examples: [The courser's stealth field eats your perfect shot.]
- text: Hit Hard — marks, harm, vex, conditions.
  data:
    id: hit-hard
    examples: ['The mine goes off — bloodied, and your ears ring.']
- text: Lock Down — close a door forever; force a stark choice.
  data:
    id: lock-down
    examples: [The vault seals. The chopper leaves. Him or the chip — pick.]
