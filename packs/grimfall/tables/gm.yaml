table: vigilance
title: Vigilance
description: 'PCs are as alert as their vantage says: nobody rolls to not-walk into the obvious. Against
  a hidden danger, spotlight the most relevant PC and pick, by their vantage (with active vigilance, an
  option, a story roll picks: `didact do vigilance`). A raider gets a reveal on an ambush; a vault kid
  gets a hint; a Mister Handy mid-monologue takes the strike.'
source: running-the-wasteland/vigilance
entries:
- text: 'Reveal: they see it plainly — the tripwire glints.'
  data: {id: reveal}
- text: 'Hint: one shot at intuition — the street is too quiet.'
  data: {id: hint}
- text: 'Strike: spend suspense: the danger lands as an impact move, and the target gets a defense roll.'
  data: {id: strike}
