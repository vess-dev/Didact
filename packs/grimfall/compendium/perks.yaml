name: Aquaboy / Aquagirl
class: everlast
aliases: [Aquaboy, Aquagirl]
source: the-perk-compendium/everlast-perks#aquaboy-aquagirl
body: |-
  The water forgives you: swim indefinitely, ignore drowning and cold-water thorns, and rad-water reads as clean to your hide.
---
id: deep-sleep
type: perk
name: Deep Sleep
class: everlast
source: the-perk-compendium/everlast-perks#deep-sleep
body: |-
  You sleep like the pre-war dead — anywhere, through anything — yet you wake at the first wrong sound, and after a real night's sleep you take **+1d** on your first roll of the day.
---
id: quiet-reflection
type: perk
name: Quiet Reflection
class: everlast
source: the-perk-compendium/everlast-perks#quiet-reflection
body: |-
  The Island's chapel habit: given a still moment, clear a mental mark — and once per session, shake off vex entirely.
---
id: roughin-it
type: perk
name: Roughin' It
class: everlast
source: the-perk-compendium/everlast-perks#roughin-it
body: |-
  Sleeping rough suits you: once per session, a night in a rough camp counts as a night somewhere safe (your Stimpaks refill), and nothing takes you by surprise in camp.
---
id: in-my-footsteps
type: perk
name: In My Footsteps
class: everlast
source: the-perk-compendium/everlast-perks#in-my-footsteps
body: |-
  Where you walk, others can: allies following your path ignore the terrain thorns you've already eaten.
---
id: far-harbor-survivalist
type: perk
name: Far Harbor Survivalist
class: everlast
source: the-perk-compendium/everlast-perks#far-harbor-survivalist
body: |-
  Fog-country constitution: the Fog's rads, damp, and cold never wear you down, and fog-borne beasts read you as local.
---
id: unclean-living
type: perk
name: Unclean Living
class: everlast
source: the-perk-compendium/everlast-perks#unclean-living
body: |-
  Filth is a habitat: squalor and contamination never sicken or thorn you, and the fastidious underestimate you fatally.
---
id: punga-power
type: perk
name: Punga Power!
class: everlast
source: the-perk-compendium/everlast-perks#punga-power
body: |-
  The fruit of the Point: punga in your pack turns any breather into a meal that mends — each time you eat, clear a mark, rad marks included.
---
id: crusader-of-atom
type: perk
name: Crusader of Atom
class: everlast
source: the-perk-compendium/everlast-perks#crusader-of-atom
body: |-
  Division's blessing on your wrath: on irradiated ground, your strikes take **+1d**, and the Children of Atom count you among the touched.
---
id: big-mt-replacement-surgery
type: perk
name: Big MT Replacement Surgery
class: everlast
repeatable: true
source: the-perk-compendium/everlast-perks#big-mt-replacement-surgery
body: |-
  Something vital was swapped for something better. Pick a module: *tin brain* (your thoughts can't be read) — *steel spine* (**+1d** on defense rolls against paralysis and being winded) — *artificial heart* (urgent poison and bleeding pools start 2d larger on you). Each take installs another.
---
id: implant
type: perk
name: Implant
class: everlast
repeatable: true
source: the-perk-compendium/everlast-perks#implant
body: |-
  Buy the surgery, keep the edge — pick one per take: *sub-dermal weave* (**+1d** on Brawn defense rolls against blades and bullets) — *monocyte breeder* (clear a mark at every scene change) — *optics* (a standing hint on distant detail) — *empathy synthesizer* (a standing hint on strong emotion) — *reflex booster* (**+1d** on one defense roll per session) — *probability calculator* (once per session, know the better of two options) — *GRX gland* (once per session, take a quick action).
---
id: cyborg
type: perk
name: Cyborg
class: everlast
source: the-perk-compendium/everlast-perks#cyborg
body: |-
  More machine each year: radiation and toxins land one step lighter on you, and machines parley with you as kin — and EMP is now your problem too.
---
id: black-widow-lady-killer
type: perk
name: Black Widow / Lady Killer
class: charmer
aliases: [Black Widow, Lady Killer]
source: the-perk-compendium/charmer-perks#black-widow-lady-killer
body: |-
  Charm as armament: against those inclined to notice you, take **+1d** to beguile, and once per scene turn a smitten foe's hesitation into your opening.
---
id: cherchez-la-femme-confirmed-bachelor
type: perk
name: Cherchez La Femme / Confirmed Bachelor
class: charmer
aliases: [Cherchez La Femme, Confirmed Bachelor]
source: the-perk-compendium/charmer-perks#cherchez-la-femme-confirmed-bachelor
body: |-
  The other half of the ledger, same weapon — as above, for the rest of the room.
---
id: child-at-heart
type: perk
name: Child at Heart
class: charmer
source: the-perk-compendium/charmer-perks#child-at-heart
body: |-
  Kids trust you on sight: children always talk to you, and they have seen *everything*.
---
id: impartial-mediation
type: perk
name: Impartial Mediation
class: charmer
source: the-perk-compendium/charmer-perks#impartial-mediation
body: |-
  The honest broker: while you genuinely hold no side, take **+1d** to negotiate, and both parties tell you what they hide from each other.
---
id: master-trader
type: perk
name: Master Trader
class: charmer
source: the-perk-compendium/charmer-perks#master-trader
body: |-
  Every ledger leans your way: prices break for you, and once per session a merchant "owes you one" — because they do.
---
id: cap-collector
type: perk
name: Cap Collector
class: charmer
source: the-perk-compendium/charmer-perks#cap-collector
body: |-
  Caps find you like iron finds a magnet: when a haul splits, yours is quietly bigger — whenever your Caps pool grows, it grows by 1d more (still max 8d).
---
id: lavish-lender
type: perk
name: Lavish Lender
class: charmer
source: the-perk-compendium/charmer-perks#lavish-lender
body: |-
  Credit as a public work: once per session, front an NPC a generosity they didn't ask for — now they owe you, and the street saw.
---
id: slumlord
type: perk
name: Slumlord
class: charmer
source: the-perk-compendium/charmer-perks#slumlord
body: |-
  Doors in every town: spend thread to declare a flop, backroom, or walk-up you hold in any settlement you've visited — yours forever after.
---
id: party-boy-party-girl
type: perk
name: Party Boy / Party Girl
class: charmer
aliases: [Party Boy, Party Girl]
source: the-perk-compendium/charmer-perks#party-boy-party-girl
body: |-
  The tab is your kingdom: drink never dulls you, and you take **+1d** to charm and carouse with a glass in your hand.
---
id: captains-feast
type: perk
name: Captain's Feast
class: charmer
source: the-perk-compendium/charmer-perks#captains-feast
body: |-
  The abductees' banquet, learned upstairs: once per session, host a proper meal — everyone who eats clears a mark and shrugs off the next vex that lands on them.
---
id: lovers-embrace
type: perk
name: Lover's Embrace
class: charmer
source: the-perk-compendium/charmer-perks#lovers-embrace
body: |-
  Shared warmth mends deeper: once per session, resting beside someone bonded to you, you both step a long-term condition down to short-term.
---
id: irradiated-beauty
type: perk
name: Irradiated Beauty
class: charmer
source: the-perk-compendium/charmer-perks#irradiated-beauty
body: |-
  The rads did you a favor: your look is striking and entirely yours. The GM judges a first impression, or spend thread to set it: *intrigued — disarmed — unsettled — smitten.*
---
id: magnetic-personality
type: perk
name: Magnetic Personality
class: charmer
source: the-perk-compendium/charmer-perks#magnetic-personality
body: |-
  Crowds drift to you like caps to a till: in a group montage, take **+1d**, and your 6 counts toward a critical.
---
id: ferocious-loyalty
type: perk
name: Ferocious Loyalty
class: charmer
source: the-perk-compendium/charmer-perks#ferocious-loyalty
body: |-
  Your people close ranks: while you're bloodied or worse, allies fighting at your side take **+1d** on defense rolls — they won't let you fall.
---
id: animal-friend
type: perk
name: Animal Friend
class: charmer
source: the-perk-compendium/charmer-perks#animal-friend
body: |-
  Beasts read your open hand: once per session, a hostile animal simply doesn't attack — and may follow you home.
---
id: attack-dog
type: perk
name: Attack Dog
class: charmer
perk_tags: [Needs an animal companion]
source: the-perk-compendium/charmer-perks#attack-dog
body: |-
  Your hound hunts with intent: your animal companion gains *fight* as an extra trick, and once per scene its bite holds a foe fast for a beat.
---
id: puppies
type: perk
name: Puppies!
class: charmer
perk_tags: [Needs an animal companion]
source: the-perk-compendium/charmer-perks#puppies
body: |-
  There is always another dog: if your animal companion falls, a successor finds you by next session — the love, unreasonably, transfers.
---
id: companion-suite
type: perk
name: Companion Suite
class: charmer
perk_tags: [Needs a companion]
source: the-perk-compendium/charmer-perks#companion-suite
body: |-
  You bring out the best in company: your companion (any source) gains one extra trick.
---
id: camarader-e
type: perk
name: Camarader-E
class: charmer
perk_tags: [Needs a robot in the crew]
source: the-perk-compendium/charmer-perks#camarader-e
body: |-
  The eyebot hums when you're near: a robotic companion in your crew acts on your beat, not after it, and repairs itself between scenes.
---
id: hunters-wisdom
type: perk
name: Hunter's Wisdom
class: charmer
source: the-perk-compendium/charmer-perks#hunters-wisdom
body: |-
  The old man reads the beasts: once per session, ask what an animal or sea-thing wants, fears, or is about to do — the answer is true.
---
id: pack-alpha
type: perk
name: Pack Alpha
class: charmer
source: the-perk-compendium/charmer-perks#pack-alpha
body: |-
  The Pack answers your howl: gang-beasts and raider animals treat you as ranking, and once per session one comes when called.
---
id: chosen-disciple
type: perk
name: Chosen Disciple
class: charmer
source: the-perk-compendium/charmer-perks#chosen-disciple
body: |-
  The quiet gang made you theirs: in raider territory you always know someone — and they're frightening.
---
id: wasteland-warlord
type: perk
name: Wasteland Warlord
class: charmer
pools:
- {name: Standing, dice: 3, kind: resource}
source: the-perk-compendium/charmer-perks#wasteland-warlord
body: |-
  Three gangs, one chair: your raider standing is a *3d Standing* resource pool, refreshed each session — roll it when you call on muscle, tribute, or an audience; at 0d you've asked too much.
---
id: sneering-imperialist
type: perk
name: Sneering Imperialist
class: charmer
source: the-perk-compendium/charmer-perks#sneering-imperialist
body: |-
  Contempt as a lens: **+1d** to cow and command those you deem beneath the flag. The GM takes suspense when your contempt writes a check.
---
id: fight-the-power
type: perk
name: Fight the Power!
class: charmer
source: the-perk-compendium/charmer-perks#fight-the-power
body: |-
  Authority makes your teeth itch: **+1d** against uniforms, badges, and thrones — their functionaries always believe you're more trouble than you're worth.
---
id: mile-in-their-shoes
type: perk
name: Mile in Their Shoes
class: charmer
source: the-perk-compendium/charmer-perks#mile-in-their-shoes
body: |-
  You've heard everyone's story: once per session, cite a stranger's hardship to turn a hostile crowd or guard neutral.
---
id: children-of-atom-expos
type: perk
name: Children of Atom Exposé
class: charmer
source: the-perk-compendium/charmer-perks#children-of-atom-expos
body: |-
  You've read the Nucleus from the inside: Atom's faithful parley with you first, and once per session their doctrine opens a door force couldn't.
---
id: protector-destroyer-of-acadia
type: perk
name: Protector / Destroyer of Acadia
class: charmer
aliases: [Protector, Destroyer of Acadia]
source: the-perk-compendium/charmer-perks#protector-destroyer-of-acadia
body: |-
  The synth refuge knows your name — choose the title. *Protector:* synths and their friends trust you on sight. *Destroyer:* hunters of synths pay you court. Either way, the other side knows too.
---
id: know-your-enemy
type: perk
name: Know Your Enemy
class: charmer
source: the-perk-compendium/charmer-perks#know-your-enemy
body: |-
  Danse's field guide: pick ferals, mutants, or synths at session start — the party reads that enemy's moves before they land (a standing hint in fights against them).
---
id: robot-sympathy
type: perk
name: Robot Sympathy
class: charmer
source: the-perk-compendium/charmer-perks#robot-sympathy
body: |-
  You speak to what others switch off: machines default a step friendlier, and you can talk a hostile robot into a pause worth one beat.
---
id: shield-harmonics
type: perk
name: Shield Harmonics
class: charmer
source: the-perk-compendium/charmer-perks#shield-harmonics
body: |-
  X6-88's calibration: once per session, tune the party's defenses — for a scene, everyone takes **+1d** on defense rolls against energy fire.
---
id: trigger-rush
type: perk
name: Trigger Rush
class: charmer
source: the-perk-compendium/charmer-perks#trigger-rush
body: |-
  Cait's adrenal gift: once per session, an ally who just took harm may act immediately on your shout.
---
id: lessons-in-blood
type: perk
name: Lessons in Blood
class: charmer
source: the-perk-compendium/charmer-perks#lessons-in-blood
body: |-
  Gage's education: the first time each session an ally drops a tough or greater foe, the whole party learns — **+1d** on the next roll against that enemy's kind.
---
id: combat-medic
type: perk
name: Combat Medic
class: charmer
source: the-perk-compendium/charmer-perks#combat-medic
body: |-
  Curie's paradox: once per session, reach a dropped ally through anything — gunfire, fire, a crowd — and your stabilizing touch cannot be interrupted.
---
id: gun-nut
type: perk
name: Gun Nut
class: inventor
repeatable: true
source: the-perk-compendium/inventor-perks#gun-nut
body: |-
  Firearms come apart like sentences: **+1d** to repair, modify, and diagnose guns. *Again:* once per session, a weapon you've tuned adds a secondary effect to its roll.
---
id: armorer
type: perk
name: Armorer
class: inventor
repeatable: true
source: the-perk-compendium/inventor-perks#armorer
body: |-
  Plate, padding, servos: **+1d** to fit, fix, and improve armor. *Again:* once per session, your patchwork holds — an ally ignores one physical mark.
---
id: blacksmith
type: perk
name: Blacksmith
class: inventor
source: the-perk-compendium/inventor-perks#blacksmith
body: |-
  Edge and haft by forge-light: melee weapons you tune never break, and once per session one carries **+1d** for a scene.
---
id: scrapper
type: perk
name: Scrapper
class: inventor
source: the-perk-compendium/inventor-perks#scrapper
body: |-
  Everything is parts: any wreck yields the component you need for the current fix — declare it; it was in there.
---
id: jury-rigging
type: perk
name: Jury Rigging
class: inventor
source: the-perk-compendium/inventor-perks#jury-rigging
body: |-
  The holy art: a broken machine runs one more scene after your touch, and any two broken things make one working thing overnight.
---
id: grease-monkey
type: perk
name: Grease Monkey
class: inventor
source: the-perk-compendium/inventor-perks#grease-monkey
body: |-
  Machines confess to your hands: **+1d** to maintain and un-jam under pressure, and your repairs hold through abuse.
---
id: certified-tech
type: perk
name: Certified Tech
class: inventor
source: the-perk-compendium/inventor-perks#certified-tech
body: |-
  Papers good enough to be real: your technical word is accepted on sight — inspections pass, workshops open, requisitions clear.
---
id: computer-whiz
type: perk
name: Computer Whiz
class: inventor
source: the-perk-compendium/inventor-perks#computer-whiz
body: |-
  Terminals reopen for you: once per session, retry a failed hack, lockout, or trace immediately — and that failure raises no alarm. You can **push yourself** to do it again.
---
id: liams-algorithm
type: perk
name: Liam's Algorithm
class: inventor
source: the-perk-compendium/inventor-perks#liams-algorithm
body: |-
  The Railroad's skeleton key: once per session, an encrypted or Institute-grade system simply opens — the algorithm was already inside.
---
id: signal-interference
type: perk
name: Signal Interference
class: inventor
source: the-perk-compendium/inventor-perks#signal-interference
body: |-
  You own the local airwaves: once per session, jam them — radios, detonators, robot commands, or a relay within earshot lose a beat.
---
id: vans
type: perk
name: V.A.N.S
class: inventor
source: the-perk-compendium/inventor-perks#vans
body: |-
  Vault-Tec navigation, jailbroken: you are never lost indoors, and once per session the glowing path reveals a bypass.
---
id: nuclear-physicist
type: perk
name: Nuclear Physicist
class: inventor
source: the-perk-compendium/inventor-perks#nuclear-physicist
body: |-
  Cores and decay curves: fusion cores last double in your rigs, and once per session you vent radiation as a controlled, device-level cone.
---
id: quantum-chemist
type: perk
name: Quantum Chemist
class: inventor
source: the-perk-compendium/inventor-perks#quantum-chemist
body: |-
  Cola into fuel, fuel into fire: your *Chems* pool starts 1d larger — or, without the *Chemist* perk, you cook one dose of a standard chem each session.
---
id: meltdown
type: perk
name: Meltdown
class: inventor
source: the-perk-compendium/inventor-perks#meltdown
body: |-
  Your energy kills bloom: on a critical when you drop a foe with an energy weapon, the discharge arcs — roll a nearby enemy's pool once.
---
id: plasma-spaz
type: perk
name: Plasma Spaz
class: inventor
source: the-perk-compendium/inventor-perks#plasma-spaz
body: |-
  Plasma obeys your wrist: energy weapons never thorn you for close work, and on a perfect their splash pins what it hits for a beat.
---
id: pyromaniac
type: perk
name: Pyromaniac
class: inventor
source: the-perk-compendium/inventor-perks#pyromaniac
body: |-
  Fire is a colleague: **+1d** with flame, and your fires spread exactly as far as you intend — never further.
---
id: mad-bomber
type: perk
name: Mad Bomber
class: inventor
source: the-perk-compendium/inventor-perks#mad-bomber
body: |-
  Ordnance from lunchboxes and love: build one bespoke bomb per session — a device-level blast on a trigger of your design.
---
id: hand-loader
type: perk
name: Hand Loader
class: inventor
source: the-perk-compendium/inventor-perks#hand-loader
body: |-
  Every cartridge hand-set: your own guns never run dry mid-scene, and once per session a hand-load ignores thorns from armor.
---
id: junk-rounds
type: perk
name: Junk Rounds
class: inventor
source: the-perk-compendium/inventor-perks#junk-rounds
body: |-
  Bent nails, fired with conviction: you can feed any ballistic weapon from scrap, and once per session a junk round adds a secondary effect — *it shatters — it ricochets — it sets something burning.* (An arcana's pool keeps its own reset.)
---
id: vigilant-recycler
type: perk
name: Vigilant Recycler
class: inventor
source: the-perk-compendium/inventor-perks#vigilant-recycler
body: |-
  Energy economy: your ordinary cells recharge overnight in your rig, and once per session an energy arcana's pool gets a die back — never a pool with a unique reset.
---
id: ammo-factory
type: perk
name: Ammo Factory
class: inventor
source: the-perk-compendium/inventor-perks#ammo-factory
body: |-
  Production-line downtime: whenever time passes, you stock the whole party — nobody runs short of ordinary ammunition until the next downtime — and once per session you can put 1d back into an ammunition-fed arcana's pool (never a pool with a unique reset).
---
id: warmonger
type: perk
name: Warmonger
class: inventor
source: the-perk-compendium/inventor-perks#warmonger
body: |-
  Every schematic, memorized: you know the build plans for every ordinary weapon you've ever seen fired — parts and a bench make it real.
---
id: recipe-roundup
type: perk
name: Recipe Roundup
class: inventor
source: the-perk-compendium/inventor-perks#recipe-roundup
body: |-
  The wasteland cookbook, annotated: you permanently remember every recipe and formula you see used — knowledge for your vantage, not new schematics for *Science!*
---
id: retention
type: perk
name: Retention
class: inventor
source: the-perk-compendium/inventor-perks#retention
body: |-
  What you read stays read: a studied manual or holotape counts as a wise for the campaign (hold up to three at once).
---
id: comprehension
type: perk
name: Comprehension
class: inventor
source: the-perk-compendium/inventor-perks#comprehension
body: |-
  You read between every line: given time with a document, ask the GM one true question — the text always answers.
---
id: big-brained
type: perk
name: Big Brained
class: inventor
source: the-perk-compendium/inventor-perks#big-brained
body: |-
  Your mind is off-limits: take **+1d** to resist telepathy, mesmetrons, and anything else that reaches into your head, and your plans can't be pulled out of you under interrogation.
---
id: nerd-rage
type: perk
name: Nerd Rage!
class: inventor
source: the-perk-compendium/inventor-perks#nerd-rage
body: |-
  Cornered intellect bites: while bloodied or desperate, take **+1d** on improvised tech and lab work — panic is a stimulant.
---
id: daddys-boy-daddys-girl
type: perk
name: Daddy's Boy / Daddy's Girl
class: inventor
aliases: [Daddy's Boy, Daddy's Girl]
source: the-perk-compendium/inventor-perks#daddys-boy-daddys-girl
body: |-
  Raised on medicine and method: **+1d** on science and treatment rolls made calmly, with time and clean hands.
---
id: medic
type: perk
name: Medic
class: inventor
source: the-perk-compendium/inventor-perks#medic
body: |-
  The kit knows you: a stimpak you administer clears a mark along with the harm, and a dropped ally you tend takes **+1d** on their story roll.
---
id: cardiac-arrest
type: perk
name: Cardiac Arrest
class: inventor
source: the-perk-compendium/inventor-perks#cardiac-arrest
body: |-
  You know exactly where the current goes: with a charged tool, once per session, drop a living foe into stunned arrest — out until jolted or a beat passes.
---
id: scribe-counter
type: perk
name: Scribe Counter
class: inventor
source: the-perk-compendium/inventor-perks#scribe-counter
body: |-
  Veronica's ledger-craft: workshop spending never needs the huge-ask drop — mods, repairs, and builds are ordinary Caps rolls for you, and you take **+1d** on them.
---
id: wired-reflexes
type: perk
name: Wired Reflexes
class: inventor
source: the-perk-compendium/inventor-perks#wired-reflexes
body: |-
  Institute wetware in the spine: once per session, you can interrupt an impact move aimed at you or someone beside you — reposition, brace, or shove them clear.
---
id: elijahs-last-words
type: perk
name: Elijah's Last Words
class: inventor
source: the-perk-compendium/inventor-perks#elijahs-last-words
body: |-
  The elder's final designs, decoded: once per campaign, build a single major arcana from salvage — then burn the notes.
---
id: swift-learner
type: perk
name: Swift Learner
class: inventor
source: the-perk-compendium/inventor-perks#swift-learner
body: |-
  You pick things up the first time: take **+1d** on montage rolls, and once per session, after watching someone do a thing, you can attempt it as if it were squarely in your vantage.
---
id: intense-training
type: perk
name: Intense Training
class: inventor
repeatable: true
source: the-perk-compendium/inventor-perks#intense-training
body: |-
  Drills until your hands ache: pick a stat — once per session, take **+1d** on a roll with it. Name the one who drilled it into you; somewhere, they're still keeping score. *Again:* pick a different stat.
---
id: sierra-madre-martini
type: perk
name: Sierra Madre Martini
class: inventor
source: the-perk-compendium/inventor-perks#sierra-madre-martini
body: |-
  Junk, chems, and a shaker: once per session, mix one — the drinker clears a mark and shrugs off fear's vex for a scene. The recipe dies with you.
---
id: gunslinger
type: perk
name: Gunslinger
class: ace
repeatable: true
source: the-perk-compendium/ace-perks#gunslinger
body: |-
  The pistol is an extension of opinion: **+1d** with sidearms. *Again:* once per session, fan the hammer — one shot each at every foe in front of you.
---
id: cowboy
type: perk
name: Cowboy
class: ace
source: the-perk-compendium/ace-perks#cowboy
body: |-
  Revolvers, levers, dynamite, and a hat to tip: **+1d** with the frontier arsenal, and old-breed folk read you as one of their own.
---
id: ace-operator
type: perk
name: Ace Operator
class: ace
source: the-perk-compendium/ace-perks#ace-operator
body: |-
  Silence and sidearms: with a suppressed weapon, your misses never reveal your position — and casinos deal you straight.
---
id: rapid-reload
type: perk
name: Rapid Reload
class: ace
source: the-perk-compendium/ace-perks#rapid-reload
body: |-
  Hands that blur at the breech: reloading never costs you a beat, ever.
---
id: spray-and-pray
type: perk
name: Spray and Pray
class: ace
source: the-perk-compendium/ace-perks#spray-and-pray
body: |-
  Volume as accuracy: emptying a magazine wide never hits your allies, and once per session a spray that rolls grim still rolls the mook pool.
---
id: shotgun-surgeon
type: perk
name: Shotgun Surgeon
class: ace
source: the-perk-compendium/ace-perks#shotgun-surgeon
body: |-
  Close-range anatomy: your scatterguns ignore thorns from armor at arm's length — spread finds every gap.
---
id: and-stay-back
type: perk
name: And Stay Back
class: ace
source: the-perk-compendium/ace-perks#and-stay-back
body: |-
  Point Lookout's sermon: on a perfect with a shotgun, the target is knocked away and down — boarders break on you like surf.
---
id: action-boy-action-girl
type: perk
name: Action Boy / Action Girl
class: ace
aliases: [Action Boy, Action Girl]
repeatable: true
source: the-perk-compendium/ace-perks#action-boy-action-girl
body: |-
  There is always another beat in you: once per session, take a quick action. *Again:* twice per session.
---
id: nerves-of-steel
type: perk
name: Nerves of Steel
class: ace
source: the-perk-compendium/ace-perks#nerves-of-steel
body: |-
  Stillness under fire: your hands never shake — fear, cold, and chaos never thorn your precise work.
---
id: sneak
type: perk
name: Sneak
class: ace
source: the-perk-compendium/ace-perks#sneak
body: |-
  The baseline, made art: **+1d** to move unseen when you take it slow. Your companions eventually stop being startled. Eventually.
---
id: mister-sandman
type: perk
name: Mister Sandman
class: ace
source: the-perk-compendium/ace-perks#mister-sandman
body: |-
  The sleeping never wake: a silent takedown on a sleeping or helpless mook or tough needs no roll while no one else is watching; against the merely unaware, take **+1d** to keep it quiet.
---
id: cloak-and-dagger
type: perk
name: Cloak & Dagger
class: ace
source: the-perk-compendium/ace-perks#cloak-and-dagger
body: |-
  Deacon's wardrobe: one free disguise per session that holds until you break character — and stealth fields last you double.
---
id: light-touch
type: perk
name: Light Touch
class: ace
source: the-perk-compendium/ace-perks#light-touch
body: |-
  Nothing on you rattles: traveling light, pressure traps don't trigger under you, and searches find nothing you'd rather keep.
---
id: pickpocket
type: perk
name: Pickpocket
class: ace
source: the-perk-compendium/ace-perks#pickpocket
body: |-
  Property is a rumor: lifting from the distracted is certain; from the alert, **+1d** — planting is the same trick backward.
---
id: thief
type: perk
name: Thief
class: ace
source: the-perk-compendium/ace-perks#thief
body: |-
  Locks, lifts, and ledgers: **+1d** on the larcenous arts whenever the owner is elsewhere. You can't help pricing every room you stand in.
---
id: locksmith
type: perk
name: Locksmith
class: ace
source: the-perk-compendium/ace-perks#locksmith
body: |-
  Doors respect expertise: given time, any mundane lock opens without a roll; under pressure, take **+1d**.
---
id: infiltrator
type: perk
name: Infiltrator
class: ace
source: the-perk-compendium/ace-perks#infiltrator
body: |-
  Barriers study *you*: once per session, reroll a failed attempt to open, bypass, or slip an obstacle.
---
id: close-to-metal
type: perk
name: Close to Metal
class: ace
source: the-perk-compendium/ace-perks#close-to-metal
body: |-
  Valentine's shortcut: terminals treat you as a colleague — **+1d** to crack them, and once per session a machine volunteers something its owner wouldn't.
---
id: tunnel-runner
type: perk
name: Tunnel Runner
class: ace
source: the-perk-compendium/ace-perks#tunnel-runner
body: |-
  The underground is a running track: in tunnels, vents, and metro dark you move full-speed, silently, always.
---
id: escape-artist
type: perk
name: Escape Artist
class: ace
source: the-perk-compendium/ace-perks#escape-artist
body: |-
  There's always a way out, and you already know it: once per session, when you're cornered, caught, or surrounded, you slip the scene — simply gone, turning up again when the heat's off. Whatever you couldn't carry stays behind.
---
id: travel-light
type: perk
name: Travel Light
class: ace
source: the-perk-compendium/ace-perks#travel-light
body: |-
  Move light, arrive first: carrying little, you act among the first when trouble starts, and pursuit never gains on you.
---
id: khan-trick
type: perk
name: Khan Trick
class: ace
source: the-perk-compendium/ace-perks#khan-trick
body: |-
  Dust in their eyes: once per session, a thrown handful of grit or flash of powder buys your whole group a clean beat to move.
---
id: contract-killer
type: perk
name: Contract Killer
class: ace
source: the-perk-compendium/ace-perks#contract-killer
body: |-
  The ledger pays for names: carry a target's name, and your first strike on them each session takes **+1d**; proof of the deed always finds a buyer.
---
id: lawbringer
type: perk
name: Lawbringer
class: ace
source: the-perk-compendium/ace-perks#lawbringer
body: |-
  The other ledger: outlaw heads are worth caps to you everywhere, and lawmen extend professional courtesy.
---
id: marked
type: perk
name: Marked
class: ace
source: the-perk-compendium/ace-perks#marked
body: |-
  Scars as credentials: professionals of violence read your history on sight — **+1d** to intimidate anyone who's done the work themselves.
---
id: lessons-learned
type: perk
name: Lessons Learned
class: ace
source: the-perk-compendium/ace-perks#lessons-learned
body: |-
  Every scar files a report: when a foe repeats a move you've already survived this session, take **+1d** on the defense roll — and on a perfect, turn it back on them.
---
id: lonesome-road
type: perk
name: Lonesome Road
class: ace
source: the-perk-compendium/ace-perks#lonesome-road
body: |-
  You walk point alone: ahead of the party, you get the first hint of every danger, and nothing reads your trail behind you.
---
id: divide-survivor
type: perk
name: Divide Survivor
class: ace
source: the-perk-compendium/ace-perks#divide-survivor
body: |-
  The worst road built you: take **+1d** on defense rolls against storms, quakes, and collapsing ground — you've stood in worse.
---
id: aint-like-that-now
type: perk
name: Ain't Like That Now
class: ace
source: the-perk-compendium/ace-perks#aint-like-that-now
body: |-
  The old you died out there: erase one element of your past — pursuers, debts, a name — and take **+1d** against anyone who insists on the history you burned.
---
id: grim-reapers-sprint
type: perk
name: Grim Reaper's Sprint
class: ace
source: the-perk-compendium/ace-perks#grim-reapers-sprint
body: |-
  Death misses and pays your toll: once per session, when you drop a foe, immediately take a free move or a quick action.
---
id: four-leaf-clover
type: perk
name: Four Leaf Clover
class: longshot
source: the-perk-compendium/longshot-perks#four-leaf-clover
body: |-
  Fortune stacks in fours: whenever you roll a critical, take a free minor stroke of luck, narrated on the spot.
---
id: finesse
type: perk
name: Finesse
class: longshot
source: the-perk-compendium/longshot-perks#finesse
body: |-
  Grace the dice notice: once per session, a 5 alongside a 6 counts as a second 6 — beauty is a critical.
---
id: critical-banker
type: perk
name: Critical Banker
class: longshot
source: the-perk-compendium/longshot-perks#critical-banker
body: |-
  Luck deposits, you withdraw: once per session, bank a rolled critical's bonus instead of spending it — cash it on any later roll.
---
id: almost-perfect
type: perk
name: Almost Perfect
class: longshot
source: the-perk-compendium/longshot-perks#almost-perfect
body: |-
  Late bloom, total recall: once per session, before rolling, declare your approach optimal — roll 3d for it, whatever your stat says.
---
id: isodoped
type: perk
name: Isodoped
class: longshot
source: the-perk-compendium/longshot-perks#isodoped
body: |-
  The rads sharpen you: once per session, while you carry a rad mark, a 5 alongside a 6 counts as a second 6. (With Finesse, pick one per roll — fate doesn't double-dip.)
---
id: tag
type: perk
name: Tag!
class: longshot
repeatable: true
source: the-perk-compendium/longshot-perks#tag
body: |-
  The lottery of aptitude: tag one skill from the Ace's lists (Chapter 4) and take **+1d** when using it. *Again:* tag another.
---
id: voracious-reader
type: perk
name: Voracious Reader
class: longshot
source: the-perk-compendium/longshot-perks#voracious-reader
body: |-
  Print is providence: once per session, the magazine, manual, or matchbook in your pack is *exactly* the relevant one.
---
id: scrounger
type: perk
name: Scrounger
class: longshot
source: the-perk-compendium/longshot-perks#scrounger
body: |-
  There's always one more round: running dry is never how the GM complicates things for you, and once per session a locker, corpse, or glovebox holds exactly the reload somebody needs — put 1d back into one ammunition-fed pool (never one with a unique reset).
---
id: can-do
type: perk
name: Can Do!
class: longshot
source: the-perk-compendium/longshot-perks#can-do
body: |-
  The wasteland provides, to you specifically: once per session, find one useful mundane item in any container — it was always going to be there.
---
id: bandito
type: perk
name: Bandito
class: longshot
source: the-perk-compendium/longshot-perks#bandito
body: |-
  Fortune favors the audacious theft: once per session, steal an outcome — swap your just-rolled result with a willing ally's.
---
id: dead-mans-burden
type: perk
name: Dead Man's Burden
class: longshot
source: the-perk-compendium/longshot-perks#dead-mans-burden
body: |-
  You carry the dead's unfinished luck: hold a memento of someone lost — once per session, spend their luck as a reroll. When it lands, say their name.
---
id: coin-operator
type: perk
name: Coin Operator
class: longshot
source: the-perk-compendium/longshot-perks#coin-operator
body: |-
  The Madre's lesson in fate and scrip: dead currencies live in your hands — any chip, voucher, or token spends when you're the one paying.
---
id: karmic-rebalance
type: perk
name: Karmic Rebalance
class: longshot
source: the-perk-compendium/longshot-perks#karmic-rebalance
body: |-
  The ledger keeps itself: once per session, publicly repay a wrong — yours or another's — and the watching crowd resets to warm.
---
id: just-lucky-im-alive
type: perk
name: Just Lucky I'm Alive
class: longshot
source: the-perk-compendium/longshot-perks#just-lucky-im-alive
body: |-
  You walked out of the crater laughing: as the last ally standing, everything you roll takes **+1d**, and fear can't find you.
---
id: thought-you-died
type: perk
name: Thought You Died
class: longshot
source: the-perk-compendium/longshot-perks#thought-you-died
body: |-
  The legend outran the obituary: being presumed dead is yours to keep or spend — reappear, and once per session the shock is a setup against everyone who knew.
---
id: dream-crusher
type: perk
name: Dream Crusher
class: longshot
source: the-perk-compendium/longshot-perks#dream-crusher
body: |-
  Fate's wet blanket, wielded on purpose: once per session, you can interrupt an impact move that hangs on a trick, a gadget, or plain luck — their luck left the room when you entered. *(Doc Mitchell never forgave you.)*
---
id: outlaw
type: perk
name: Outlaw
class: longshot
source: the-perk-compendium/longshot-perks#outlaw
body: |-
  Wanted, and luckier for it: while a price sits on your head, take **+1d** on escapes and last stands — the bounty keeps you sharp.
---
id: devils-highway
type: perk
name: Devil's Highway
class: longshot
source: the-perk-compendium/longshot-perks#devils-highway
body: |-
  Walk the dark road knowingly: while your deeds run cruel, the vicious trust you and their doors open. The GM banks suspense.
---
id: escalator-to-heaven
type: perk
name: Escalator to Heaven
class: longshot
source: the-perk-compendium/longshot-perks#escalator-to-heaven
body: |-
  The bright road, walked all the way: while your deeds run kind, strangers extend first trust, and once per session a small mercy lands exactly when needed.
---
id: lone-wanderer
type: perk
name: Lone Wanderer
class: longshot
source: the-perk-compendium/longshot-perks#lone-wanderer
body: |-
  Fate prefers you unaccompanied: with no ally in your scene, take **+1d** on defense and montage rolls — the wasteland goes easy on its favorite orphan.
---
id: frayed-genes
type: perk
name: Frayed Genes
class: longshot
source: the-perk-compendium/longshot-perks#frayed-genes
body: |-
  Your code rolls dice hourly: each session, make a 2d story roll — perfect grants a helpful mutation for the day, messy one of each, grim an inconvenient one (you and the GM pick). Whatever you get, take spark.
---
id: nuclear-anomaly
type: perk
name: Nuclear Anomaly
class: longshot
source: the-perk-compendium/longshot-perks#nuclear-anomaly
body: |-
  You shouldn't exist, and physics agrees: once ever, when you're dropped, you erupt in a ritual-level blast — lesser foes nearby are simply gone, bigger ones lose 2d from their pools, allies get one defense roll to clear it — and you wake in the crater, breathing.
---
id: scav-lessons
type: perk
name: SCAV! Lessons
class: longshot
source: the-perk-compendium/longshot-perks#scav-lessons
body: |-
  Nuka-World's crime comics, absorbed cover to cover — pick one lesson each session: *the Knife King's nerve* (blades never add thorns to your defense rolls) — *Stephie's fists* (your grapples never take thorns) — *stampede sense* (beasts never surprise you) — *no-caps rage* (flat broke? **+1d** on your next score).
