id: unstoppable-force
type: perk
name: Unstoppable Force
class: sledge
core: true
growth: At levels 3 and 6, gain +1 Might per scene.
growth_levels: [3, 6]
source: the-classes/the-sledge#unstoppable-force
body: |-
  Anything heavy enough is a weapon in your hands: you never take thorns for an improvised, oversized, or outmatched weapon. Each scene you have **4 Might**. Spend 1 to:
  - **Heave** — pull off a **potent feat of raw force** against the world: tear a door off its track, flip a car, hold up a sagging ceiling, carry two friends out at a run. Turning that force on a foe — hurling them across the room, dropping the car on them — costs **2 Might**.
  - **Follow through** — before a melee, thrown, or charging roll, declare you also: *send them flying — pin them down — wreck their gear — drive them back.* On a perfect or messy, it happens too.
  - **Bull through** — ignore all thorns on one roll from being outnumbered, outsized, or grabbed.

  *Pain is fuel:* Whenever a blow leaves you bloodied or worse, gain 1 Might — even past your limit.
---
id: pain-train
type: perk
name: Pain Train
class: sledge
signature: true
source: the-classes/the-sledge#pain-train
body: |-
  Once you're moving, you don't stop. When you charge, you ignore thorns from whatever lies in your path — rubble, furniture, a crowd, a flimsy wall — though not from cover or foes. The first time each scene you lead the way in, the first ally to follow you is set up.
---
id: strong-back
type: perk
name: Strong Back
class: sledge
signature: true
source: the-classes/the-sledge#strong-back
body: |-
  Encumbrance is never your problem: you carry, drag, or wield what no one else can manage — a minigun one-handed, a sheet of steel as a shield, a friend over each shoulder — and you take **+1d** on any roll of pure muscle: lifting, holding, bending, breaking, grappling.
---
id: terrifying-presence
type: perk
name: Terrifying Presence
class: sledge
signature: true
source: the-classes/the-sledge#terrifying-presence
body: |-
  Your sheer physicality unsettles people. The GM judges an NPC's response, or spend thread to set it: *cowed — wary — respectful — hostile.* You can **push yourself** to pull off a potent feat of intimidation — staring down a super mutant, backing off a mob with one cracked knuckle.
---
id: bloody-mess
type: perk
name: Bloody Mess
class: sledge
signature: true
source: the-classes/the-sledge#bloody-mess
body: |-
  On a critical when you bring violence, threats, or destruction to bear, choose: *cause an extra secondary effect — roll the related task pool twice.* Somehow, it's always spectacular.
---
id: wrecking-ball
type: perk
name: Wrecking Ball
class: sledge
signature: true
source: the-classes/the-sledge#wrecking-ball
body: |-
  You can always destroy gear, cover, and ordinary structure you can get your hands on — it only costs noise. And when you would deal harm, you can instead **break what protects them** — the weapon, the armor, the crate they're hiding behind — leaving them exposed: the next ally to strike is set up.
---
id: adrenaline
type: perk
name: Adrenaline
class: sledge
signature: true
source: the-classes/the-sledge#adrenaline
body: |-
  Once per session — or any time you get bloodied — you can let your blood come up for the rest of the scene. While it's up, you can take only **aggressive, forward actions**; you **ignore thorns from your harm**; and each time you take a foe out of the fight or empty a pool, you're **set up** for your next roll. It ends when no threat remains, when you're dropped, or when you **push yourself** to stand down. *(A chem rush, pure rage, a mutation kicking in.)*
---
id: power-armor-training
type: perk
name: Power Armor Training
class: sledge
signature: true
perk_tags: [Works suited up]
pools:
- {name: Plating, dice: 3, kind: resource}
source: the-classes/the-sledge#power-armor-training
body: |-
  You own a battered powered frame and know how to run it (Chapter 8's named suits add a rider). Suited up, you ignore thorns from heavy weapons, recoil, and rough ground, wield mounted or two-person weapons solo, and have a *3d Plating* resource pool each session: when physical harm would land on you, roll Plating and the frame eats the hit. The frame is loud, wide, and hungry — no sneaking, no swimming, and when the GM complicates things, the fusion core is why. Roll a disaster while suited and it's **breached**: Plating is 0d until it's repaired with parts and a day's work — or a device patches it back to 1d. Out of the suit, this perk does nothing.
---
id: awareness
type: perk
name: Awareness
class: pathfinder
core: true
growth: At levels 3 and 6, study +1 more foe per session.
growth_levels: [3, 6]
source: the-classes/the-pathfinder#awareness
body: |-
  Once per session, when you get a good look at a foe — a creature, a machine, a person, a vehicle — you can **study** it and name its **weak point**: the GM tells you the one it has, or you invent one that fits (an invented one pays out through the die, and only the die). The gap in the power armor's seals. The knee the raider boss favors. That foe is your **quarry** for the rest of the session, and you have a **Weak Point die**, a special d6: whenever you or an ally researches, tracks, or strikes your quarry, add the die to the roll. When it lands a **6**, add a **critical bonus** — the weakness tears wider.

  *Keen eye:* You always get at least a **hint** on vigilance — hidden trouble never simply lands on you — and you take **+1d** when scouting, tracking, and defending against the land itself: sandstorms, rockfalls, the ground giving way.
---
id: living-anatomy
type: perk
name: Living Anatomy
class: pathfinder
signature: true
source: the-classes/the-pathfinder#living-anatomy
body: |-
  You read bodies like open books. Given a moment's look at a living creature, ask one and get a true answer (once per creature each session): *How badly is it hurt? — What is it about to do? — What is it hiding on its body? — What would make it back down?* You can also pull off **potent feats of observing the living** — reading lips across a room, tracking a wounded animal by a single drop, catching a sniper's breath fogging the glass a mile out.
---
id: concentrated-fire
type: perk
name: Concentrated Fire
class: pathfinder
signature: true
source: the-classes/the-pathfinder#concentrated-fire
body: |-
  Given time to settle, breathe, and aim, you can pull off **potent feats of ranged precision** — shooting a grenade off a belt, threading a round through a gunslit, hitting well beyond a weapon's reach. You can **push yourself** to do it on the spot.
---
id: light-step
type: perk
name: Light Step
class: pathfinder
signature: true
source: the-classes/the-pathfinder#light-step
body: |-
  Traps are never *your* problem. You always get a **reveal** on vigilance against traps, mines, and tripwires, and you can disarm or repurpose what you find. Define three rigs you favor, each an effect (*frag — gas — stun — incendiary — pulse*) and a trigger (*tripwire — pressure plate — proximity — bait — remote*). Given time, you can set **potent** traps; **push yourself** to deploy one on the spot. On a perfect when one of yours springs on a foe, take spark.
---
id: spotter
type: perk
name: Spotter
class: pathfinder
signature: true
source: the-classes/the-pathfinder#spotter
body: |-
  You always have a read on where trouble will come from. You can **push yourself** to shout a warning and goad the GM into spending suspense on a move you declare against the party — everyone who heeds you takes **+1d** on the defense roll and on their follow-up against the source.
---
id: sniper
type: perk
name: Sniper
class: pathfinder
signature: true
source: the-classes/the-pathfinder#sniper
body: |-
  Once per session, lock down a sightline: declare a kill-zone that enemies can't cross in the open without dealing with you. If they try, you can **interrupt** them; on a perfect, take spark. You can **push yourself** to do it again. Some things are too big to pin — but even a behemoth might eat a parting shot.
---
id: explorer
type: perk
name: Explorer
class: pathfinder
signature: true
source: the-classes/the-pathfinder#explorer
body: |-
  You've walked this ground, or ground just like it. You gain **1 thread per session**, and can spend thread to flash back to having scouted ahead: *find a way out — learn a patrol's rhythm — stash something useful — survey the place (ask 2 questions) — take out a lone danger.* Make a 3d montage roll; the GM always takes suspense in place of an impact move.
---
id: gun-fu
type: perk
name: Gun Fu
class: pathfinder
signature: true
source: the-classes/the-pathfinder#gun-fu
body: |-
  Time crawls when you line up the shot. You can **push yourself** to make one ranged roll and apply it to up to **three targets** — a row of mooks, a string of called shots, two toughs before either clears leather — with no thorns for the extra targets or for moving while you do it. *(A V.A.T.S. rig, combat chems, or battlefield calm.)*
---
id: toughness
type: perk
name: Toughness
class: everlast
core: true
growth: At levels 2, 4, and 6, gain +1 Grit per session.
growth_levels: [2, 4, 6]
source: the-classes/the-everlast#toughness
body: |-
  There is simply more of you to spend — scar tissue, a ghoul's hide, a metabolism that laughs at poison, or sheer refusal. *(Your call — re-skin it freely.)* Each session you have **6 Grit**:
  - **Dig deep.** Whenever you would **mark a stat** — from damage, *or from pushing yourself* — you can spend 1 Grit instead, even when that mark would have stacked into harm.
  - **Walk it off.** Whenever you would take **harm** — even harm that would drop you — you can spend 2 Grit and shrug it off entirely.
  - ***Is that all?*** When Grit turns aside something a foe did to you, you're **set up** against that foe: take +1d on your next roll against them.
---
id: life-giver
type: perk
name: Life Giver
class: everlast
signature: true
source: the-classes/the-everlast#life-giver
body: |-
  There's a lot of you to get through. When you would get bloodied, you can instead take a **Flesh Wound** — a condition that puts +1t on all your rolls and clears when the scene ends. You can carry only one, and on a disaster you take the harm as normal.
---
id: lead-belly
type: perk
name: Lead Belly
class: everlast
signature: true
source: the-classes/the-everlast#lead-belly
body: |-
  Radiation, toxins, disease, foul water, and brutal weather land one step lighter on you: exposure that would mark you is +1t for a beat instead, a condition it would give you arrives as a mark, and a lethal dose arrives as a bad one. (A venomous bite or a gas grenade is an attack, not exposure.) You can **push yourself** to pull off a potent feat of survival — wading an irradiated river bare-skinned, holding your breath through a gas cloud.
---
id: pack-rat
type: perk
name: Pack Rat
class: everlast
signature: true
pools:
- {name: Pack, dice: 3, kind: resource}
source: the-classes/the-everlast#pack-rat
body: |-
  Crushing loads and long marches never wear you down, and your pack holds everything. Each session you have a *3d Pack* resource pool: roll it to produce the ordinary gear the moment needs — rope and pitons, a gas mask, antivenom, a spare fusion cell, rations for six. It was in there all along. *(Gear and supplies — never chems, stimpaks, or relics.)*
---
id: stonewall
type: perk
name: Stonewall
class: everlast
signature: true
source: the-classes/the-everlast#stonewall
body: |-
  You take **+1d** when you assist on a defense roll. You can also make a defense roll **in an ally's place** when an impact move targets them — the trouble comes at you instead — or **push yourself** to shield several nearby allies from one big hit: an explosion, a sentry bot's barrage, a collapsing ceiling.
---
id: rooted
type: perk
name: Rooted
class: everlast
signature: true
source: the-classes/the-everlast#rooted
body: |-
  When your life — or someone you're shielding — is truly on the line and you plant your feet, **5s count as 6s, but 4s count as 1s** on your own dice — and, if you choose, on the story roll you make when dropped. You do your best work with nothing left to lose.
---
id: superior-defender
type: perk
name: Superior Defender
class: everlast
signature: true
source: the-classes/the-everlast#superior-defender
body: |-
  Once per session, plant yourself and call them out — goad the GM into spending suspense on an impact move aimed at you alone. You take **+1d** on the defense roll, and on a perfect your foe: *keeps coming at you — leaves an opening (an ally is set up) — loses its nerve.*
---
id: ghoulish
type: perk
name: Ghoulish
class: everlast
signature: true
source: the-classes/the-everlast#ghoulish
body: |-
  Radiation doesn't poison you — it feeds you. In a hot zone the rads never mark or sicken you — each time they would mark you, clear a mark instead — and when a scene ends in the rads, one harm fades to a mark. You no longer age or sicken normally, and the truly far-gone barely register you as a threat. The cost: you look the part, and clean, rad-free places leave you feeling thin — the GM may inflict +1t where there's nothing to draw on. *(A ghoul, a Glowing One, or just a freak of adaptation.)*
---
id: gift-of-gab
type: perk
name: Gift of Gab
class: charmer
core: true
growth: At levels 2, 4, and 6, gain +1 Sway per session.
growth_levels: [2, 4, 6]
source: the-classes/the-charmer#gift-of-gab
body: |-
  Anything that can understand you will **always hear you out** once before it comes to blows — unless you struck first. Each session you have **3 Sway**, the currency of a voice people listen to. Spend 1, no roll needed, to: *raise an ally's die result by 1 (a 3 becomes a 4) — calm or provoke someone's vex — talk an ally down from a mark (clear it).*

  Or spend 1 **and roll Presence** to: *pull off a potent feat of social influence — interrupt an impact move that hinges on someone's decision (a finger on a trigger, a hand on the alarm) — talk an ally out of being rattled (clear it).* A potent feat takes an approach that shapes it: *charm — threaten — deceive — inspire — barter.* Sway works on others, never on yourself.
---
id: local-leader
type: perk
name: Local Leader
class: charmer
signature: true
source: the-classes/the-charmer#local-leader
body: |-
  In any settlement, outpost, or camp, once per visit, you can always: *be recognized by an old contact — know someone useful — make a fast friend.* They'll do you a reasonable favor; take spark if you promise to pay them back (and you will owe them). A community that calls you its own pays one extra die toward its next asset whenever its Stockpile rolls (Chapter 9).
---
id: scoundrel
type: perk
name: Scoundrel
class: charmer
signature: true
source: the-classes/the-charmer#scoundrel
body: |-
  Takes one to know one. You always know when someone's lying to you, though not the truth behind it, and you take **+1d** on your follow-up if you reveal you caught them.
---
id: hard-bargain
type: perk
name: Hard Bargain
class: charmer
signature: true
source: the-classes/the-charmer#hard-bargain
body: |-
  Caps, favors, and goods flow toward you. You take **+1d** on barter and bribery, you can always find a buyer or a seller for anything, and whenever you roll your Caps pool, one die that would drop stays (unless it's the last).
---
id: intimidation
type: perk
name: Intimidation
class: charmer
signature: true
source: the-classes/the-charmer#intimidation
body: |-
  Your presence commands the room — nobody needs to see the gun to know it's there. The GM judges an NPC's response, or spend thread to set it: *cowed — compliant — respectful — defiant.* You can **push yourself** to pull off a potent feat of command — ordering mercs to stand down, holding a panicking crowd together with your voice alone.
---
id: inspirational
type: perk
name: Inspirational
class: charmer
signature: true
source: the-classes/the-charmer#inspirational
body: |-
  You travel with a fiercely loyal companion — a hired gun, a scrappy mutt, a patched-up robot, a settler you saved — and you bring out their best. Each PC adds a reciprocal bond with them. Choose 3 tricks (*distract — fight — guard — perform — rescue — retrieve — scout — search — track — warn*) and 2 flaws (*aggressive — clumsy — grumpy — insatiable — jumpy — noisy — overprotective — scary — unruly*). You roll **3d** for their tricks, **1d** otherwise. They have two damage boxes — *marked* (any mark) and *hurt* (any harm) — and can always exit a scene when hurt. If you lose them, you can bond with another. The GM may let you take this perk again for 3 more tricks and another hurt box.
---
id: here-and-now
type: perk
name: Here and Now
class: charmer
signature: true
source: the-classes/the-charmer#here-and-now
body: |-
  You can always arrive in a scene exactly where and when you want, limited only by what's physically possible. Make a 3d story roll to set your entrance and its effect — done right, it can even work as an interrupt. *(The saloon doors bang open. The Vertibird's dust parts. You were in the crowd the whole time.)*
---
id: wasteland-whisperer
type: perk
name: Wasteland Whisperer
class: charmer
signature: true
source: the-classes/the-charmer#wasteland-whisperer
body: |-
  Beasts and simple minds bend to your presence. When you meet a feral or non-sentient creature — dogs, brahmin, mole rats, a lone feral, even a wary deathclaw — make a story roll for its mood, or spend thread to set it: *calm — cowed — curious — on your side a while.* You can **push yourself** to roll Presence against an enraged or attacking creature: on a success, a tough or lesser one breaks off, and a greater one hesitates — roll its pool. You always sense how an animal is likely to react.
---
id: science
type: perk
name: Science!
class: inventor
core: true
growth: At levels 2, 4, and 6, gain +1 device and +1 potent device per session, and learn 1 new 
  schematic.
growth_levels: [2, 4, 6]
source: the-classes/the-inventor#science
body: |-
  You know **4 schematics** (build them with the Schematic Crucible below), kept in your Pip-Boy or a grease-stained notebook. Each session you can rig **4 devices** and **2 potent devices** from parts on hand — jury-rigged weapons, hacks, field medicine, breaching charges, deployable turrets. You roll **Wits**, and the schematic you rig from is the touchstone (Chapter 2, *Science, Not Sorcery*). A device rigged **without risk** needs no roll and doesn't count against the session — unless it's potent, or it mends someone. You learn new schematics by studying salvaged tech or another tinker's notes (this consumes the source).
---
id: hacker
type: perk
name: Hacker
class: inventor
signature: true
source: the-classes/the-inventor#hacker
body: |-
  Terminals, locks, robots, and security systems are an open book. You always get a hint or reveal on vigilance involving technology, and can **push yourself** to pull off a potent feat of hacking or repair — reprogramming a sentry bot mid-fight, reviving dead pre-war tech, talking a malfunctioning AI off a ledge.
---
id: field-surgeon
type: perk
name: Field Surgeon
class: inventor
signature: true
source: the-classes/the-inventor#field-surgeon
body: |-
  You take **+1d** when treating wounds, conditions, rads, or addiction; on a critical, you both take spark. You can **push yourself** to reach a **dropped (not dead)** ally in the thick of it, before their story roll — a stimpak jammed home, a defibrillator kludge: they make that roll at **+1d**, and on a perfect they're back in the scene, desperate but standing. **One time only,** you can bring back the recently dead. Common sense takes precedence.
---
id: chemist
type: perk
name: Chemist
class: inventor
signature: true
pools:
- {name: Chems, dice: 4, kind: resource}
source: the-classes/the-inventor#chemist
body: |-
  Each session you have a *4d Chems* resource pool — your stash, cooked fresh. Roll it to hand over a dose of any standard chem (Chapter 6) or of one of your two signature recipes (build them with the Chem Crucible; the name is the touchstone). Drop 1d before rolling to make the dose **potent** — enough for the whole crew, or strong enough to bend the rules. Your batches go flat when the session ends, and the kick still comes due.
---
id: robotics-expert
type: perk
name: Robotics Expert
class: inventor
signature: true
source: the-classes/the-inventor#robotics-expert
body: |-
  You built and bonded with a small robot or drone — an eyebot, a cut-down Mister Handy, a homemade protectron. You direct it through a linked rig, see through its sensors, and send it on simple tasks (a story roll says how it goes). You can **push yourself** to work through it at a distance — your hands, your hack, your device. If it's wrecked, you rebuild it by next session.
---
id: demolition-expert
type: perk
name: Demolition Expert
class: inventor
signature: true
source: the-classes/the-inventor#demolition-expert
body: |-
  Explosives are tools of your trade — there's always a charge or two in your kit. Given time, you can rig them for **potent feats of destruction** — dropping a bridge, breaching a vault door, clearing a nest of mooks in one blast. You can **push yourself** to do it on the spot.
---
id: educated
type: perk
name: Educated
class: inventor
signature: true
source: the-classes/the-inventor#educated
body: |-
  You're a walking pre-war database. You gain **any 3 wises** and **1 extra thread per session**, and take **+1d** on story rolls about science, history, tech, or how things work — the ones your own story details call for included.
---
id: math-wrath
type: perk
name: Math Wrath
class: inventor
signature: true
source: the-classes/the-inventor#math-wrath
body: |-
  You fight with arithmetic, not reflexes. You can roll **Wits** in place of Brawn or Agility to attack with any weapon slaved to a targeting rig you've tuned, and range, wind, and movement never thorn its math. Once per session, the solution comes up clean: add a **secondary effect** to a shot, as a critical would. Lose the rig and you lose the link until you rebuild it. *(A Pip-Boy targeting mod, a recon visor, a smart gun, an implanted HUD.)*
---
id: the-professional
type: perk
name: The Professional
class: ace
core: true
growth: At levels 3 and 6, gain +1 Cool per session and tag +1 skill.
growth_levels: [3, 6]
source: the-classes/the-ace#the-professional
body: |-
  **Tag three skills** as your trade; take **+1d** when using them.
  **Clean hands:** *blend in* (keep a low profile) — *charm* (persuade with personality) — *investigate* (study, observe, connect the dots) — *negotiate* (bargain and settle terms) — *network* (work contacts and favors) — *parkour* (run, climb, leap).
  **Dirty hands:** *ambush* (plan and strike unseen) — *deception* (lie, disguise, act) — *dismantle* (pick locks, sabotage, disable) — *provoke* (needle, incite, manipulate) — *sleight of hand* (lift, palm, plant) — *stealth* (hide, move unseen).

  Each session you have **2 Cool** — nerve under pressure, the plan B in your boot. Spend 1 to pull off a **potent feat within your tagged skills**: the lock that opens like it loves you, the lie that holds up under a spotlight, the vanishing act in an empty hallway.
---
id: silent-running
type: perk
name: Silent Running
class: ace
signature: true
source: the-classes/the-ace#silent-running
body: |-
  On a perfect sneaking past or watching someone unseen, they also: *let something slip — give you a golden opening.* If you're caught sneaking, you can **push yourself** to freeze and go unnoticed after all — but you must leave the area right after. *(Raw stealth, a Stealth Boy, or both.)*
---
id: quick-draw
type: perk
name: Quick Draw
class: ace
signature: true
source: the-classes/the-ace#quick-draw
body: |-
  You can always **act first**, unless completely surprised, and you ignore thorns on Agility defense rolls — except thorns from damage.
---
id: moving-target
type: perk
name: Moving Target
class: ace
signature: true
source: the-classes/the-ace#moving-target
body: |-
  You can pull off **potent feats of movement** — wall-running, rooftop leaps, falling harmlessly, slipping a grapple — and can always move at full speed across any terrain, unhindered by what's in your way.
---
id: quick-hands
type: perk
name: Quick Hands
class: ace
signature: true
source: the-classes/the-ace#quick-hands
body: |-
  Your hands are faster than the eye. Given a moment's cover, lifting a keycard, planting a bug, or palming a grenade needs no roll. And once per session, if you're caught red-handed or in a lie, you can slip or talk your way out — *for now.* Make a story roll to see when they realize. You can **push yourself** to do it again.
---
id: ninja
type: perk
name: Ninja
class: ace
signature: true
source: the-classes/the-ace#ninja
body: |-
  When you strike a target who doesn't know you're there, you find the vital spot: ignore thorns from its armor, size, and toughness. You can **push yourself** to make the strike potent. On a critical — pushed or not — you take a tough or lesser foe out of the fight in silence.
---
id: covert-ops
type: perk
name: Covert Ops
class: ace
signature: true
source: the-classes/the-ace#covert-ops
body: |-
  Somebody did the homework, and it was you. You gain **1 thread per session**, and can spend thread to flash back to the prep: *a bribed guard — a planted decoy — a stashed tool or weapon — a forged pass — a cut fence and a way out.* Make a 3d montage roll; the GM always takes suspense in place of an impact move.
---
id: blitz
type: perk
name: Blitz
class: ace
signature: true
source: the-classes/the-ace#blitz
body: |-
  You move between heartbeats. You can **push yourself** to take a **quick action** — or to strike across any gap you could sprint as if you'd been standing there all along: the distance costs you no roll and no thorns. *(Raw speed, a Jet rush, reflex wetware.)*
---
id: luck-of-the-draw
type: perk
name: Luck of the Draw
class: longshot
core: true
growth: At levels 3 and 6, gain +1 Luck die per session.
growth_levels: [3, 6]
source: the-classes/the-longshot#luck-of-the-draw
body: |-
  Fate owes you, and it pays in advance. Before each session, roll **3d** and write down the results: that's your **Luck**. During the session, you can **replace any d6 just rolled** — yours, an ally's, a story die, one the GM rolls for a pool — with one of your Luck results, then cross it off. A 6 saves a roll, or makes a critical. A 5 holds the last stimpak in the pool. A 2 puts one more raider on the floor. *(Your Luck is whatever you rolled — fate giveth.)*

  *Charmed life:* Take **+1d** on story rolls that test your own luck — what's in the locker, whether the floor holds, who comes over the ridge, whether you wake up after being dropped.
  *The wheel turns:* When you roll a disaster, you take spark as usual — and roll a fresh Luck die too, if you're short of your full count.
---
id: mysterious-stranger
type: perk
name: Mysterious Stranger
class: longshot
signature: true
source: the-classes/the-longshot#mysterious-stranger
body: |-
  When things look grim, a figure in a long coat appears, does something improbably helpful, and is gone before anyone can thank them. **Once per session**, in real trouble, invoke the Stranger: they lend **outside help** on a roll you or an ally just made (the GM rolls 1d and adds it), or — if no roll fits — do one thing a single well-placed shot could do: *drop a lesser foe — put a round into something bigger (roll its pool) — cut you loose — shoot out the lights.* No one ever quite catches their face.
---
id: idiot-savant
type: perk
name: Idiot Savant
class: longshot
signature: true
pools:
- {name: Winging It, dice: 3, kind: power}
source: the-classes/the-longshot#idiot-savant
body: |-
  Somehow you're passable at everything — fate's been drilling you when you weren't looking. Take **+1d** on montage rolls, and each session you have a *3d Winging It* power pool: roll it in place of a stat when you attempt something you've no business knowing how to do. When it turns up something surprising, say where you picked that up. *(You didn't. That's the joke.)*
---
id: fortune-finder
type: perk
name: Fortune Finder
class: longshot
signature: true
source: the-classes/the-longshot#fortune-finder
body: |-
  The wasteland provides. You gain **1 thread per session**, and can spend thread to turn up exactly what you need *right now* — a working weapon, the right key, a full clip, a stash of caps — whether or not it fits your vantage. Make a 2d story roll; the better it goes, the better the find. It's always a little improbable. That's the point.
---
id: better-criticals
type: perk
name: Better Criticals
class: longshot
signature: true
source: the-classes/the-longshot#better-criticals
body: |-
  Fortune rides your shots — when you let it. Once per scene, declare you're going **all in** before a roll: **5s count as 6s, but 4s count as 1s** on your own dice. If you crit while all in, take an **extra critical bonus**.
---
id: ricochet
type: perk
name: Ricochet
class: longshot
signature: true
source: the-classes/the-longshot#ricochet
body: |-
  What was meant for you finds someone else. On a perfect defense roll against an attack, you can push your luck — **push yourself** — to send it home: the round comes back, the swing finds their friend. A lesser foe drops; anything bigger rolls its pool.
---
id: serendipity
type: perk
name: Serendipity
class: longshot
signature: true
pools:
- {name: Serendipity, dice: 2, kind: resource}
source: the-classes/the-longshot#serendipity
body: |-
  Luck shows up when you're already in trouble. Each session you have a *2d Serendipity* resource pool: when you would take harm while you're already carrying harm, roll it — and the blow just... misses. You also take **+1d** at games of chance, and can always find a game.
---
id: miss-fortune
type: perk
name: Miss Fortune
class: longshot
signature: true
source: the-classes/the-longshot#miss-fortune
body: |-
  You can roll **Presence** to hex a target with raw misfortune: *a jam — a stumble — a misfire — a dropped guard.* Decide when it lands: *now — soon — on a trigger.* It only works on someone once. Not magic, exactly — just fate turning its back on them, and never fully under your control.
