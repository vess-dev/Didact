  label: Optional
  text: Choose 2 to combine, and 1 you have disdain for
  choices:
  - hard labor in the wastes
  - a body remade by FEV or rads
  - relentless training
  - chem-fueled muscle
  - born big and mean
  - you genuinely don't know
  tables: [sledge-strength-source]
- title: Marks of Violence
  label: Optional
  text: Choose 3
  choices:
  - a flattened nose
  - knuckles like gravel
  - a web of old knife scars
  - burn-slick forearms
