core_perk: awareness
growth: At levels 3 and 6, study +1 more foe per session.
growth_levels: [3, 6]
perks:
- living-anatomy
- concentrated-fire
- light-step
- spotter
- sniper
- explorer
- gun-fu
options:
- title: Tell-Tale Weakness
  label: Optional
  text: When you name a quarry, describe the tell
  choices:
  - favors one side
  - flinches at light
  - sluggish in the cold
  - armor gap at the joint
  - reloads on a tic
  - fixates on one target
  - heavy, dragging tracks
  - panics at fire
  tables: [pathfinder-tells]
- title: What You Watch Through
  label: Optional
  text: Choose 1
  choices:
  - a cracked rifle scope
  - pre-war binoculars
  - one good eye
  - a Pip-Boy's amber grid
