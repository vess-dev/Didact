id: pathfinder
type: class
name: The Pathfinder
special: P
attribute: Perception
aka: [Deadeye, Scout, Spotter, Tracker]
tagline: see it first, end it first
engine: a quarry and its Weak Point die
role: the eyes — never blindsided, and the whole crew shoots straighter at what you've read
