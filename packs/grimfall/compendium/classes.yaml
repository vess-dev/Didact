id: sledge
type: class
name: The Sledge
special: S
attribute: Strength
aka: [Bruiser, Reaver, Slab, Warboss]
tagline: the world is soft, and you are not
engine: Might, fresh every scene
role: the wrecking ball — you move what shouldn't move, and what you hit stays hit
first_perk: strong-back
core_perk: unstoppable-force
growth: At levels 3 and 6, gain +1 Might per scene.
growth_levels: [3, 6]
perks:
- pain-train
- strong-back
- terrifying-presence
- bloody-mess
- wrecking-ball
- adrenaline
- power-armor-training
options:
