  label: Optional
  text: Choose 3
  choices:
  - skin bleached or peeling from rads
  - a cough that never fully clears
  - eyes that don't dilate right
  - a limb that's mostly scar
  - fingers lost to frostbite or worse
  - a gut that digests anything
  - a heartbeat you can't kill
  - too stubborn to show any of it
  tables: [everlast-marks]
- title: What Keeps You Walking
  label: Optional
  text: Choose 1
  choices:
  - a promise
  - a grudge
