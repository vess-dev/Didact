touchstones: [two centuries of service, please and thank you, a gleaming finish]
limit: politeness is the mechanism — bark at one and the whole house goes cold.
source: the-armory/minor-relics#codsworths-service-ring
body: |-
  A polishing-cloth ring from a faithful Mister Handy. Domestic robots read you as a trusted member of the household: they default friendly, and they'll tell you what they've seen.
---
id: alien-captains-key
type: arcana
name: Alien Captain's Key
tier: minor
kind: relic
touchstones: [Zetan alloy, stolen clearances, a quiet hum]
limit: every use logs somewhere above the sky.
source: the-armory/minor-relics#alien-captains-key
body: |-
  A sliver of humming alloy. Once per session it unlocks a pre-war military terminal — the Zetans had everyone's passwords all along.
---
id: presidential-metro-access-key
type: arcana
name: Presidential Metro Access Key
tier: minor
kind: relic
touchstones: [the buried line, federal clearance, a smooth ride]
limit: the line has other riders.
source: the-armory/minor-relics#presidential-metro-access-key
body: |-
  A federal transit pass that still works. Once per session, ride the buried presidential line between downtown and the airbase — one free crossing of the city.
---
id: tribal-war-paint
type: arcana
name: Tribal War Paint
tier: minor
kind: relic
touchstones: [Zion ceremony, painted purpose, the tribes' regard]
limit: one blessing at a time, and it must be earned, not bought.
source: the-armory/minor-relics#tribal-war-paint
body: |-
  Zion's blessing in ochre and ash. Applied in ceremony: for a week, choose its gift — fear's vex can't stick, or nothing outdoors takes you by surprise.
---
id: pre-war-card-deck
type: arcana
name: Pre-War Card Deck
tier: minor
kind: relic
touchstones: [a full deck, steady hands, the flourish]
limit: it's the flourish that works. Fumble it and buy the drinks.
source: the-armory/minor-relics#pre-war-card-deck
body: |-
  Fifty-two survivors, uncreased. Present it with a flourish: the next first impression warms considerably.
---
id: vault-22-seed-packets
type: arcana
name: Vault 22 Seed Packets
tier: minor
expendable: true
kind: relic
touchstones: [Vault 22, miracle yield, read the fine print]
limit: plant them far from where people sleep. Trust the fine print.
source: the-armory/minor-relics#vault-22-seed-packets
body: |-
  Pre-war agriculture's best, from the vault that grew too well. Delivered to a farming settlement, harvests double for good.
---
id: spore-resistance-inoculant
type: arcana
name: Spore-Resistance Inoculant
tier: minor
expendable: true
kind: relic
touchstones: [Vault 22 antidote, clean lungs, one dose]
limit: exactly one; the second sufferer is a quarrel waiting.
source: the-armory/minor-relics#spore-resistance-inoculant
body: |-
  One dose against the green. For a session, spore clouds and fungal sickness pass you by.
---
id: pre-war-cookbook
type: arcana
name: Pre-War Cookbook
tier: minor
kind: relic
touchstones: [comfort food, the Before's kitchens, marginal notes]
limit: needs real ingredients — courage is not made from radroach alone.
source: the-armory/minor-relics#pre-war-cookbook
body: |-
  Comfort food, annotated. At a cook-fire, its rations steady the eaters: the next fear or despair that lands on them softens a step.
---
id: pre-war-medical-ledger
type: arcana
name: Pre-War Medical Ledger
tier: minor
kind: relic
touchstones: [patient files, a name that matches, doctor's shorthand]
limit: one name per reading; the ledger is thick, and heavy with implications.
source: the-armory/minor-relics#pre-war-medical-ledger
body: |-
  Patient files that never closed. A downtime's reading yields one true name of someone now alive in the wasteland — and what they were treated for.
---
id: addiction-recovery-manual
type: arcana
name: Addiction Recovery Manual
tier: minor
kind: relic
touchstones: [the twelve steps, one day at a time, a sponsor's patience]
limit: works once per addiction; after that it's you.
source: the-armory/minor-relics#addiction-recovery-manual
body: |-
  Twelve pre-war steps, still standing. Carried through a clean stretch, your next attempt to shake a Hooked condition simply succeeds.
---
id: genetic-sequencer-chip
type: arcana
name: Genetic Sequencer Chip
tier: minor
kind: relic
touchstones: [gene sequence, clinical certainty, an answer you can't unhear]
limit: one truth per subject. Some truths bill later.
source: the-armory/minor-relics#genetic-sequencer-chip
body: |-
  A clinic-grade sequencing wafer. Installed in a friendly auto-doc, it reads any willing subject's hidden bloodline — synth, FEV-touched, pre-war line, the GM knows.
---
id: weather-machine-schematic
type: arcana
name: Weather Machine Schematic
tier: minor
kind: relic
touchstones: [Vault 51's storm-maker, condensation at scale, blueprint blue]
limit: occasional electrical storms are part of the yield. Ask the Lost.
source: the-armory/minor-relics#weather-machine-schematic
body: |-
  A settlement-scale condenser blueprint. Built, it waters a settlement's crops year-round.
---
id: reactor-regulator
type: arcana
name: Reactor Regulator
tier: minor
kind: relic
touchstones: [reactor-grade, the missing part, a steady green light]
limit: one settlement's lights; every neighbor with a dead generator knows you had it.
source: the-armory/minor-relics#reactor-regulator
body: |-
  An intact pre-war regulator board — the missing heart of any settlement generator.
---
id: child-prodigys-schematic
type: arcana
name: Child Prodigy's Schematic
tier: minor
kind: relic
touchstones: [a child's hand, impossible elegance, Vault 40's best]
limit: it works exactly as drawn; improve it and it doesn't.
source: the-armory/minor-relics#child-prodigys-schematic
body: |-
  A reactor tune drawn in crayon and genius. A technician studying it builds a settlement generator for half the cost.
---
id: pale-ghoul-eye-lens
type: arcana
name: Pale Ghoul Eye Lens
tier: minor
kind: relic
touchstones: [the pale strain, dark-sight, a borrowed eye]
limit: full daylight blinds you through it — the sun costs +1t while it's in.
source: the-armory/minor-relics#pale-ghoul-eye-lens
body: |-
  A preserved lens from the dark vault's strain. Worn, you see in darkness like noon.
---
id: tinkers-tool-kit
type: arcana
name: Tinker's Tool Kit
tier: minor
kind: relic
touchstones: [the tinker ghoul's kit, every tool worn right, a shift never ended]
limit: bulky, beloved, and the ghoul who kept it may want visitation rights.
source: the-armory/minor-relics#tinkers-tool-kit
body: |-
  Two centuries of hand-kept tools. Modding, patching, and installing never need a Caps roll — the kit already has what the job takes.
---
id: the-long-poem
type: arcana
name: The Long Poem
tier: minor
kind: relic
touchstones: [a hundred years of verse, the honest parts, the last stanza is blank]
limit: the blank stanza is for whoever finishes it.
source: the-armory/minor-relics#the-long-poem
body: |-
  A century of one ghoul's stanzas. Read it, and once per session despair simply doesn't land — you have read worse and kept going.
---
id: pre-war-joke-book
type: arcana
name: Pre-War Joke Book
tier: minor
kind: relic
touchstones: [the worst jokes ever printed, endurance training, one good one hidden]
limit: the one funny joke in it belongs to the Comedian. Give it back.
source: the-armory/minor-relics#pre-war-joke-book
body: |-
  Genuinely, historically unfunny. Endure the full read once; after that, once per session, shrug off one mental mark or vex from tedium, boredom, or grind.
---
id: the-suites-collected-diaries
type: arcana
name: The Suite's Collected Diaries
tier: minor
kind: relic
touchstones: [the sealed suite, a lifetime observed, the slid-through notes]
limit: a Followers scholar pays 2,000 caps — and then you've sold her life. The pressed rose stays 
  with the diaries or the deal is off.
source: the-armory/minor-relics#the-suites-collected-diaries
body: |-
  A sealed resident's lifetime in longhand. Read them all over a downtime: gain a bond to her story, and once per session loneliness, despair, and imprisonment can't hold you.
---
id: hand-written-constitution
type: arcana
name: Hand-Written Constitution
tier: minor
kind: relic
touchstones: [Vault 69, a working draft, signatures that meant it]
limit: adoption is politics; the paper only wins the argument once.
source: the-armory/minor-relics#hand-written-constitution
body: |-
  Vault 69's working democracy, in one careful hand. A settlement that adopts it stands harder: take +1d on the party's next roll defending it.
---
id: hand-puppet
type: arcana
name: Hand Puppet
tier: minor
kind: relic
touchstones: [the puppet stage, a beloved cast, timing is everything]
limit: the same room never laughs twice — and its six holotape scripts, brilliant against all odds, 
  keep asking to be performed.
source: the-armory/minor-relics#hand-puppet
body: |-
  One of the resident-playwright's cast, worn soft. Produced at the right tense moment, once per session, it takes the heat out of a standoff: take +1d to defuse it.
---
id: bottoms-up-tap
type: arcana
name: Bottoms-Up Tap
tier: minor
kind: relic
touchstones: [the vault bar, house special, one for the road]
limit: the house special is always a little hot — every glass comes with a rad mark.
source: the-armory/minor-relics#bottoms-up-tap
body: |-
  A vault bar's miracle fixture. Once per session, it pours a chem-grade pick-me-up: clear a mark and shake off vex.
---
id: lucky-slot-amulet
type: arcana
name: Lucky Slot Amulet
tier: minor
kind: relic
touchstones: [house odds, the skim, a gambler's saint]
limit: chance only — aimed dice are honest work.
source: the-armory/minor-relics#lucky-slot-amulet
body: |-
  A slot-machine charm that skims fate. Once per session, reroll a pure-chance story roll.
---
id: the-phoropter
type: arcana
name: The Phoropter
tier: minor
kind: relic
touchstones: ['better one, or two?', lens logic, Vault 88's gift]
limit: a two-handed instrument; nobody wears it into a firefight.
source: the-armory/minor-relics#the-phoropter
body: |-
  An optometrist's rig rebuilt for suspicion. Looking through it, hidden triggers, traps, and buried programs in pre-war terminals resolve plainly — a standing reveal on vigilance against machine treachery.
---
id: power-cycle-1000
type: arcana
name: Power Cycle 1000
tier: minor
kind: relic
touchstones: [Vault-Tec fitness, pedal power, the burn]
unique_reset: true
limit: someone has to pedal. It is never who suggested it.
source: the-armory/minor-relics#power-cycle-1000
body: |-
  An exercise bike that charges the house. Installed at a settlement, a scene of hard pedaling recharges one fusion-cell weapon, or puts one die back into a cell-fed arcana's pool — never a pool with a unique reset.
---
id: fog-condenser-part
type: arcana
name: Fog Condenser Part
tier: minor
kind: relic
touchstones: [Far Harbor engineering, the hum the Fog hates, salt-proof]
limit: one settlement, one installation; the Fog is patient.
source: the-armory/minor-relics#fog-condenser-part
body: |-
  The Island's answer to the Fog, crated. Installed at a settlement, it holds the rad-fog and rad-storms off for a session at a time.
---
id: memory-holotape
type: arcana
name: Memory Holotape
tier: minor
expendable: true
kind: relic
touchstones: [the memory den, borrowed joy, a stranger's best day]
limit: one playback; after that it's static and longing.
source: the-armory/minor-relics#memory-holotape
body: |-
  Someone's best hour, recorded whole. Played for any PC, it lands like a lived memory — they gain a bond born of it.
---
id: robobrain-chassis-plans
type: arcana
name: Robobrain Chassis Plans
tier: minor
kind: relic
touchstones: [chassis schematics, the jar's plumbing, questions unasked]
limit: the plans never say where brains come from. That's the point.
source: the-armory/minor-relics#robobrain-chassis-plans
body: |-
  Full fabrication schematics, morally silent. At a workshop, a felled robobrain becomes a mount, a porter, or a companion — brain sold separately.
---
id: nuka-dark-rum-recipe
type: arcana
name: Nuka-Dark Rum Recipe
tier: minor
kind: relic
touchstones: [Nuka-Dark, the real recipe, a bar's reputation]
limit: brand enforcement survived the apocalypse; the society will hear.
source: the-armory/minor-relics#nuka-dark-rum-recipe
body: |-
  The original formula, embossed and notarized. A chem station brews bottles that sell steady and pour better.
---
id: pre-war-cake-intact
type: arcana
name: Pre-War Cake (Intact)
tier: minor
expendable: true
kind: relic
touchstones: [birthday sugar, 'the Before, unspoiled', shared slices]
limit: worth 400 caps uneaten, and eating it is the only right answer.
source: the-armory/minor-relics#pre-war-cake-intact
body: |-
  Under glass, impossibly whole. Eat it together: for the rest of the session, the taste of the Before holds — nobody's nerve breaks.
---
id: pre-war-bank-seal
type: arcana
name: Pre-War Bank Seal
tier: minor
expendable: true
kind: relic
touchstones: [Treasury crest, one authorized transaction, old money]
limit: the first faction to hear you carry it will make an appointment.
source: the-armory/minor-relics#pre-war-bank-seal
body: |-
  Treasury brass under glass. Presented to any still-running automated bank or corporate kiosk, it authorizes one transaction of the GM's choosing — a withdrawal, a deposit box, an account nobody closed.
---
id: meditation-garden-stone
type: arcana
name: Meditation Garden Stone
tier: minor
kind: relic
touchstones: [the garden vault, a smooth weight, breath practice]
limit: it steadies minds, not walls.
source: the-armory/minor-relics#meditation-garden-stone
body: |-
  River-smooth, vault-blessed. Once per session, hold it and one blow to your nerve simply passes — ignore a single mental mark or a beat of fear.
---
id: declaration-of-independence
type: arcana
name: Declaration of Independence
tier: minor
kind: relic
touchstones: [the Archives, founding ink, what it still means]
limit: the Enclave wants it; the Legion wants it burning. Neither asks twice.
source: the-armory/minor-relics#declaration-of-independence
body: |-
  The founding argument, under glass. Believers in the old flag treat the bearer with genuine reverence, and collectors pay like it's a major haul.
---
id: the-platinum-chip
type: arcana
name: The Platinum Chip
tier: major
kind: relic
touchstones: [platinum data, sealed protocols, the House always wins]
limit: one exists. Its original owner has been waiting two hundred years for the delivery, and he 
  bills interest.
source: the-armory/major-relics#the-platinum-chip
body: |-
  A poker chip that is also a key to a kingdom. In a pre-war computer you control, it unlocks the sealed protocols; in the *right* machine beneath the Fort, it upgrades an entire Securitron army to Mk II.
---
id: courser-chip
type: arcana
name: Courser Chip
tier: major
expendable: true
kind: relic
touchstones: [Institute encryption, relay frequency, still warm]
limit: one entry, then the frequency burns. Until then, you are being followed.
source: the-armory/major-relics#courser-chip
body: |-
  Cut warm from a hunter's skull, still whispering to a receiver nobody can find. Decoded over a downtime, it yields the relay frequency — the only door into the Institute, open exactly once.
---
id: the-krivbeknih
type: arcana
name: The Krivbeknih
tier: major
kind: relic
touchstones: [the deep quarry, a dead language, Ug-Qualtoth]
limit: every reading costs — a mark, poor dreams, the GM takes suspense. Burning it frees one marked
  site, and the fire must be fed something holy or a reader's blood.
source: the-armory/major-relics#the-krivbeknih
body: |-
  A facsimile of something much older, cold in the hand. Study it over a downtime to learn one true thing about what waits under the Dunwich sites.
---
id: kelloggs-brain-augmenter
type: arcana
name: Kellogg's Brain Augmenter
tier: major
expendable: true
kind: relic
touchstones: [cybernetic recall, a mercenary's century, the chair and the smoke]
limit: the memories are vivid, curated, and not always true. He was like that alive, too.
source: the-armory/major-relics#kelloggs-brain-augmenter
body: |-
  A century of a killer's memories in a dark implant. Played through a memory lounger: learn one specific secret its owner knew.
---
id: big-mt-transportalponder
type: arcana
name: Big MT Transportalponder
tier: major
kind: relic
touchstones: [Big MT, the red button, matter in transit]
limit: press it there to come back — to wherever you last pressed it. Nobody reads that line in 
  time.
source: the-armory/major-relics#big-mt-transportalponder
body: |-
  A palm-sized teleporter with one red button. Press: you and everything you carry arrive at a research facility you'd rather not visit.
---
id: institute-relay-grenade
type: arcana
name: Institute Relay Grenade
tier: major
expendable: true
kind: relic
touchstones: [relay flash, a borrowed hunter, the red seal]
pools:
- {name: Power, dice: 6, kind: power}
pool: 6
limit: then it leaves — and the Institute knows your face now.
source: the-armory/major-relics#institute-relay-grenade
body: |-
  A black sphere under a red seal. Pull, drop, step back: a courser arrives in blue light and fights for you for one scene — a *6d* power pool you direct.
---
id: vault-81-cure
type: arcana
name: Vault 81 Cure
tier: major
expendable: true
kind: relic
touchstones: [Vault 81, the secret wing, one ampoule]
limit: there is no second dose, and everyone sick knows it.
source: the-armory/major-relics#vault-81-cure
body: |-
  The only dose the hidden lab ever produced. Cures any one disease, infection, or mutation-in-progress — even a long-term condition.
---
id: genetic-sample-cylinder-v108
type: arcana
name: Genetic Sample Cylinder (V108)
tier: major
expendable: true
kind: relic
touchstones: [Vault 108, cloning stock, a clean restart]
limit: once, finally, forever spent — and the Gary clones notice the scar it leaves.
source: the-armory/major-relics#genetic-sample-cylinder-v108
body: |-
  Cold steel, heavy with second chances. Plugged into an auto-doc: pull one dying survivor back from dropped, whole.
---
id: virgils-serum
type: arcana
name: Virgil's Serum
tier: major
expendable: true
kind: relic
touchstones: [the rogue researcher, FEV undone, a cold vial]
limit: one dose, one chance, no bargaining with the dice.
source: the-armory/major-relics#virgils-serum
body: |-
  Cold-chain retroviral hope, smuggled out by its inventor. Injected into a super mutant: a 2d story roll — on any success they begin turning human again over three days, memories intact.
---
id: fev-sample
type: arcana
name: FEV Sample
tier: major
expendable: true
kind: relic
touchstones: [the vats' seed, biohazard tape, a slosh you can hear]
limit: cannot be resealed. Everyone who hears you have it comes looking.
source: the-armory/major-relics#fev-sample
body: |-
  A thermos of the thing that made the wasteland's giants. Injected: a 2d story roll — on a perfect, you gain *Strong Back* as a permanent feature; on a messy, the same, plus a visible mutation (a permanent condition); on a grim, only the mutation. Gray-green skin either way, and it counts as your one lifetime bump.
---
id: mothman-feather
type: arcana
name: Mothman Feather
tier: major
expendable: true
kind: relic
touchstones: [the Wise Mothman, a question carried, an answer delivered]
limit: the feather is consumed; the answer is true, not kind.
source: the-armory/major-relics#mothman-feather
body: |-
  Ten inches of black that never sits still. Speak one question to it; before your next rest the true answer arrives — a dream, a note, a carving on the nearest tree.
---
id: harolds-sprout
type: arcana
name: Harold's Sprout
tier: major
expendable: true
kind: relic
touchstones: [Harold's canopy, patient green, a gift that spreads]
limit: pilgrims follow. They do not ask permission.
source: the-armory/major-relics#harolds-sprout
body: |-
  Half root already, cut from a man becoming a forest. Planted at a settlement: a season later the land is green, clean, faintly luminous — a half-strength G.E.C.K.
---
id: heart-stopper-tape
type: arcana
name: Heart-Stopper Tape
tier: major
expendable: true
kind: relic
touchstones: [Tranquility Lane, a red stripe, laughter into static]
limit: outside the sim it's a curiosity; the static sounds like a name.
source: the-armory/major-relics#heart-stopper-tape
body: |-
  A red-striped holotape for a machine that dreams people. Played inside a Tranquility-type simulation: one simulated resident's heart quietly stops, out in the real pod.
---
id: the-cure-maries-blood
type: arcana
name: The Cure (Marie's Blood)
tier: major
expendable: true
kind: relic
touchstones: [the Pitt's hope, a baby's immunity, the price of taking it]
limit: spoils in a season unless stabilized at an auto-doc. Everyone in the Pitt knows exactly what 
  left the crib.
source: the-armory/major-relics#the-cure-maries-blood
body: |-
  One vial from the Pitt's miracle child. A full week's treatment cures rad-rot and one radiation-born mutation for good.
---
id: the-geck
type: arcana
name: The G.E.C.K.
tier: mythic
expendable: true
kind: relic
touchstones: [Vault-Tec, genesis, a second Eden]
needs: a ruined-but-redeemable place · time and protection to complete the work · someone who knows 
  how to run it
limit: spent forever. The blessed settlement becomes a regional power in a season, and every faction
  within a week's travel comes. A damaged G.E.C.K. component on its own is worth 1,500 caps to 
  scribes and scientists — and a war to whoever assembles a whole one.
source: the-armory/mythic-relics#the-geck
body: |-
  The Garden of Eden Creation Kit — terraforming in a suitcase. A ritual-level act of creation: turn a dead zone green and watered, raise a settlement overnight, purge a region of rads.
---
id: the-water-chip
type: arcana
name: The Water Chip
tier: mythic
kind: relic
touchstones: [vault-grade purification, vacuum tubes, 150 days]
limit: as cargo it's the most valuable repair part in the wastes; selling it means somewhere a 
  purifier stays broken.
source: the-armory/mythic-relics#the-water-chip
body: |-
  A dull circuit board with a vault's whole life on it. Installed in any vault-grade purifier, clean water flows indefinitely — a ritual-level salvation for one community.
---
id: the-nuclear-keycard
type: arcana
name: The Nuclear Keycard
tier: mythic
expendable: true
kind: relic
touchstones: [launch authority, the silo network, a single swipe]
needs: a live silo terminal · a valid launch code (its own campaign) · a target you're willing to 
  answer for
limit: every faction in the region responds within days. The Divide's launch codes play the same and
  degrade after one attempt — and holding either makes you a career for every spy alive.
source: the-armory/mythic-relics#the-nuclear-keycard
body: |-
  Launch authority under laminate. With a live silo terminal and a valid code, one swipe delivers a ritual-level strike that erases a map point and leaves a permanent glowing scar.
---
id: youre-special
type: arcana
name: You're SPECIAL!
tier: mythic
expendable: true
kind: relic
touchstones: [Vault-Tec, seven virtues, a child's first lesson]
limit: the book crumbles as you close it. You remember every page. Once in a lifetime.
source: the-armory/mythic-relics#youre-special
body: |-
  A child's board book, bright as printing day, teaching the seven virtues. Read aloud, cover to cover, in a quiet place: permanently raise one stat by 1 (max 3) — or, if you've already had your one lifetime bump (Stat Progression, the Sink, a lucky FEV dose), only re-assign 2 points among your stats.
---
id: the-vertibird
type: arcana
name: The Vertibird
tier: mythic
kind: relic
touchstones: [Vertibird, rotor-wash, air superiority]
pools:
- {name: Upkeep, dice: 8}
pool: 8
unique_reset: true
limit: an 8d Upkeep pool (fuel, parts, a pilot); unique reset — hard use grounds it until 
  resupplied. Loud, unmissable, irreplaceable.
source: the-armory/mythic-relics#the-vertibird
body: |-
  A flight-worthy tilt-rotor gunship — the rarest machine alive. Cross the map in hours, insert under fire, and bring a door-gunner's answer to any argument.
---
id: the-zeta-saucer
type: arcana
name: The Zeta Saucer
tier: mythic
kind: relic
touchstones: [Zetan hull, the silent climb, anywhere at all]
limit: one hop, a rad mark for everyone aboard on re-entry — and everything with a telescope saw 
  where you landed.
source: the-armory/mythic-relics#the-zeta-saucer
body: |-
  A scout craft that still answers the helm. Once per campaign, one orbital hop: rise over the world and come down anywhere you can name.
---
id: the-sink
type: arcana
name: The Sink
tier: mythic
kind: relic
touchstones: [Big MT, sentient appliances, home base]
limit: a stronghold asset, not portable; uprooted, it sulks silent until reinstalled. Its auto-doc 
  will also fit one permanent upgrade per survivor — a stat's worth of tuned muscle or nerves (raise
  a 1 to a 2) — and that counts as the survivor's one lifetime bump (see You're SPECIAL!).
source: the-armory/mythic-relics#the-sink
body: |-
  The salvaged brain of a research home — bickering appliance minds you reinstall at your base: ritual-grade fabrication, an auto-doc that mends almost anything, a haven that talks back.
