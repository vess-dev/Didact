id: quantum-x-01
type: arcana
name: Quantum X-01
tier: mythic
kind: armor
touchstones: [Star Core lattice, Quantum coolant, the Galactic Zone's prize]
plating: 4
power_armor: true
needs: twenty cores to wake the display · all thirty-five to open it · a party willing to carry a 
  glowing legend home
limit: it glows, always — sneaking is over, and every gang, chapter, and collector on the map knows 
  exactly who has it.
source: the-armory/mythic-armors#quantum-x-01
body: |-
  Nuka-World's crown jewel: an X-01 suit rebuilt around glowing Quantum coolant, displayed behind thirty-five scattered Star Cores. *(4d Plating — the only frame that runs cold enough to hold it.)* Once per session, vent the Quantum: take a quick action.
