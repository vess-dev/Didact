source: the-armory/major-armors#prototype-medic-power-armor
body: |-
  The MP-47/A — a suit that worries about you. *(3d Plating.)* It carries its own *3d Doses* pool: when you're dropped, it jabs you (+1d on the story roll), and given a breather, a dose clears one harm like any stimpak. Refill it at a chem station.
