id: slasher-knife
type: arcana
name: Slasher Knife
tier: minor
kind: weapon
touchstones: [the quiet suburb, a tacky grip, moving unheard]
limit: the quiet follows the knife, not the hand. Put it down sometimes.
source: the-armory/minor-weapons#slasher-knife
body: |-
  From the dog house in the quiet suburb. In vents and crawlspaces, sound itself won't betray you.
---
id: toy-knife
type: arcana
name: Toy Knife
tier: minor
kind: weapon
touchstones: [bright paint, a detention camp bush, unexplainable]
limit: using it feels wrong because it is.
source: the-armory/minor-weapons#toy-knife
body: |-
  A real blade in a toy's paint, left where a child could reach. The wounded genuinely can't explain what cut them.
---
id: trench-knife
type: arcana
name: Trench Knife
tier: minor
kind: weapon
touchstones: [officer's issue, brass knuckles, trench manners]
limit: it teaches a fighting style your dentist will recognize.
source: the-armory/minor-weapons#trench-knife
body: |-
  Knuckles and blade in one antique. +1d on anyone you've already grabbed or disarmed.
---
id: the-dismemberer
type: arcana
name: The Dismemberer
tier: minor
kind: weapon
touchstones: [the safari, a ghoul's humor, follow-through]
limit: winning it means surviving the hunt. Ask the last customer. You can't.
source: the-armory/minor-weapons#the-dismemberer
body: |-
  Plik's safari prize, edge like a bad ending. +1d against anything already bleeding.
---
id: chopper
type: arcana
name: Chopper
tier: minor
kind: weapon
touchstones: [the ranch house, kitchen patience, always clean]
limit: nobody can explain the clean. Stop asking.
source: the-armory/minor-weapons#chopper
body: |-
  The ranch-stove cleaver, still clean. +1d on the unarmored, and it stays clean.
---
id: figaro
type: arcana
name: Figaro
tier: minor
kind: weapon
touchstones: [the King's barber, a steady wrist, closest cut in Freeside]
limit: it works best mid-anecdote.
source: the-armory/minor-weapons#figaro
body: |-
  A barber's straight razor with a century of small talk in the handle. Armor never matters; a good shave opens doors caps can't.
---
id: knock-knock
type: arcana
name: Knock-Knock
tier: minor
kind: weapon
touchstones: [firehouse red, the punchline, doors mean nothing]
limit: "\"who's there\" stopped being funny in Searchlight."
source: the-armory/minor-weapons#knock-knock
body: |-
  The Searchlight fire axe, veteran of doors nobody wanted opened. Any ordinary locked door or barrier opens in one beat of committed work; vault doors, blast doors, and safes still take a potent feat.
---
id: the-break
type: arcana
name: The Break
tier: minor
kind: weapon
touchstones: [the slavers' table, felt and chalk, house rules]
limit: it remembers Paradise Falls. Former merchandise recognize it.
source: the-armory/minor-weapons#the-break
body: |-
  A pool cue from Paradise Falls with a stain by the rack. The first swing in any barroom takes +1d — house rules.
---
id: highwaymans-friend
type: arcana
name: Highwayman's Friend
tier: minor
kind: weapon
touchstones: [the saddlebag, road patience, a driver's loyalty]
limit: it fits one hand best. The hand's not yours.
source: the-armory/minor-weapons#highwaymans-friend
body: |-
  A tire iron polished by one long partnership. It takes +1d in any fight on the road, and it pries open anything with a seam.
---
id: the-board-of-education
type: arcana
name: The Board of Education
tier: minor
kind: weapon
touchstones: [the principal's office, nailed policy, corrective action]
limit: alumni react badly.
source: the-armory/minor-weapons#the-board-of-education
body: |-
  Nails, a name plate, a disciplinary record. It takes +1d against anyone who mouthed off first — and the lesson is retained.
---
id: fertilizer-shovel
type: arcana
name: Fertilizer Shovel
tier: minor
kind: weapon
touchstones: [the Ark & Dove, punga rites, honest dirt]
limit: it's also just an excellent shovel. The Brethren consider that the point.
source: the-armory/minor-weapons#fertilizer-shovel
body: |-
  The punga keeper's gift, ritual included. +1d against everything that grows where it shouldn't.
---
id: electro-suppressor
type: arcana
name: Electro-Suppressor
tier: minor
kind: weapon
touchstones: [riot issue, the crackle, crowd logic]
limit: the crack in the housing bites the wielder on a disaster.
source: the-armory/minor-weapons#electro-suppressor
body: |-
  A riot baton with a cracked housing and a working charge. On a perfect, the target stalls for a beat; machines hate it double.
---
id: repellent-stick
type: arcana
name: Repellent Stick
tier: minor
kind: weapon
touchstones: [Moira's method, the red stripe, confidence-based science]
limit: nobody knows why it works. Moira knows. She won't say.
source: the-armory/minor-weapons#repellent-stick
body: |-
  A stick with a red stripe, issued as a joke that works. Vermin won't strike the carrier first.
---
id: nephis-golf-driver
type: arcana
name: Nephi's Golf Driver
tier: minor
kind: weapon
touchstones: [Driver Nephi, the follow-through, fore]
limit: the Fiends consider it a religious artifact. They tithe in bullets.
source: the-armory/minor-weapons#nephis-golf-driver
body: |-
  The Fiend chieftain's golf driver, tape and residue. On a perfect, it puts them on the ground.
---
id: nuka-breaker
type: arcana
name: Nuka-Breaker
tier: minor
kind: weapon
touchstones: [cap-wrapped, the rattle, jackpot hits]
limit: stealth retired the day it was built.
source: the-armory/minor-weapons#nuka-breaker
body: |-
  Rebar wrapped in bottle caps — every swing rattles like a jackpot. The first swing of a fight takes +1d, and everything in earshot knows the fight started.
---
id: the-humble-cudgel
type: arcana
name: The Humble Cudgel
tier: minor
kind: weapon
touchstones: [the sealed sewer, careful years, humility]
limit: it dislikes showing off, and shows it.
source: the-armory/minor-weapons#the-humble-cudgel
body: |-
  A blind man's sewer pipe, used carefully for years. While you hold it, your nerve simply doesn't break — fear's vex slides off.
---
id: x-2-antenna
type: arcana
name: X-2 Antenna
tier: minor
kind: weapon
touchstones: [the array, signal steel, dead air]
limit: Big MT tracks its silhouettes. All of them.
source: the-armory/minor-weapons#x-2-antenna
body: |-
  A transmitter mast pried off a Big MT array. It takes +1d against machines, and on a perfect it kills the target's radios and rigs for a scene.
---
id: pushy
type: arcana
name: Pushy
tier: minor
kind: weapon
touchstones: [displacement, the extra coil, goodbye]
limit: walls, windows, and bystanders are all downrange.
source: the-armory/minor-weapons#pushy
body: |-
  A displacer glove tuned past the manual. What you hit leaves the conversation horizontally: on a perfect, you send it flying.
---
id: the-shocker
type: arcana
name: The Shocker
tier: minor
kind: weapon
touchstones: [the flooded metro, a taped warning, unstable joy]
limit: the label was right — it dies on a disaster, loudly.
source: the-armory/minor-weapons#the-shocker
body: |-
  The FSGv118-b, with its own warning label. +1d against machines.
---
id: plunketts-valid-points
type: arcana
name: Plunkett's Valid Points
tier: minor
kind: weapon
touchstones: [the family plot, four arguments, case closed]
limit: the family's lawyers survived as ghouls. Naturally.
source: the-armory/minor-weapons#plunketts-valid-points
body: |-
  Grave-robbed spiked knuckles with a legal history. The first punch of any fight takes +1d, and every point leaves a lasting impression.
---
id: cram-opener
type: arcana
name: Cram Opener
tier: minor
kind: weapon
touchstones: [Freeside alley, tin logic, the joke that worked]
limit: mirelurks have learned the shape. They hold grudges.
source: the-armory/minor-weapons#cram-opener
body: |-
  A can opener welded into a gauntlet as a joke that killed people. +1d against shells, plates, and anything tinned.
---
id: dr-kleins-glove
type: arcana
name: Dr. Klein's Glove
tier: minor
kind: weapon
touchstones: [Big MT etiquette, the thumb etching, subject management]
limit: Klein wants it back and will monologue about it.
source: the-armory/minor-weapons#dr-kleins-glove
body: |-
  Lab-issue static for "irate subjects." On a perfect, the slap scatters a thinker's concentration for a beat.
---
id: dr-mobius-glove
type: arcana
name: Dr. Mobius' Glove
tier: minor
kind: weapon
touchstones: [the scratched name, a mercy misfiled, Big MT]
limit: it hums happily near its twin. The twins disagree about everything else.
source: the-armory/minor-weapons#dr-mobius-glove
body: |-
  The matched twin, used for something gentler. A solid hit steadies *you* — clear a mark on a perfect.
---
id: golden-gloves
type: arcana
name: Golden Gloves
tier: minor
kind: weapon
touchstones: [title night, gold leather, the crowd's roar]
limit: they only work bare-knuckle honest. No knives in the wraps.
source: the-armory/minor-weapons#golden-gloves
body: |-
  Championship leather from the Lucky 38's shelf. Once per session, reroll one swing — the crowd remembers.
---
id: greased-lightning
type: arcana
name: Greased Lightning
tier: minor
kind: weapon
touchstones: [the readable name, fresh grease, shop pride]
limit: the grease is irreplaceable. The mechanic isn't sure she is either.
source: the-armory/minor-weapons#greased-lightning
body: |-
  A mechanic's power fist re-packed with pre-war grease. The first punch of every fight takes +1d.
---
id: love-and-hate
type: arcana
name: Love and Hate
tier: minor
kind: weapon
touchstones: [the lettered spikes, a Viper's sermon, both hands]
limit: the third punch is just you.
source: the-armory/minor-weapons#love-and-hate
body: |-
  Spiked knuckles lettered for both moods. First punch +1d (LOVE), second wild (+1t, HATE) — pace yourself.
---
id: paladin-toaster
type: arcana
name: Paladin Toaster
tier: minor
kind: weapon
touchstones: [breakfast issue, the joke that stuck, crumbs in the servos]
limit: the toast is genuinely good. This has caused problems.
source: the-armory/minor-weapons#paladin-toaster
body: |-
  A toaster grafted to a gauntlet as an initiate's joke. +1d against robots and power armor, plus toast.
---
id: recompense-of-the-fallen
type: arcana
name: Recompense of the Fallen
tier: minor
kind: weapon
touchstones: [dog tags, debts of the dead, Cottonwood's shame]
limit: speak a name you didn't earn and the glove goes cold for the fight.
source: the-armory/minor-weapons#recompense-of-the-fallen
body: |-
  A weighted glove stitched with dead soldiers' tags. Once per fight, name a dead ally as you strike and take +1d — they're owed.
---
id: bear-trap-fist
type: arcana
name: Bear Trap Fist
tier: minor
kind: weapon
touchstones: [the Villa special, sprung steel, the click]
limit: on a disaster, it remembers it's a bear trap. You're the bear.
source: the-armory/minor-weapons#bear-trap-fist
body: |-
  A re-sprung trap over the knuckles — the cocking-back is the threat. +1d on anyone you've already got hold of.
---
id: gatorclaw-gauntlet
type: arcana
name: Gatorclaw Gauntlet
tier: minor
kind: weapon
touchstones: [Safari Adventure, cured claw, a souvenir with opinions]
limit: gatorclaws recognize their own. It doesn't calm them.
source: the-armory/minor-weapons#gatorclaw-gauntlet
body: |-
  The cured foreclaw, lashed to a welder's glove. It takes +1d against anything with scales or a shell — the claw is the whole argument.
---
id: the-mysterious-magnum
type: arcana
name: The Mysterious Magnum
tier: major
kind: weapon
touchstones: [the long coat, fate, a magnum opus]
limit: only when the cause is just (the GM judges) — and it has a way of going missing.
source: the-armory/major-weapons#the-mysterious-magnum
body: |-
  A heavy, pristine revolver that turns up when it is needed. Once per session, spend spark to fire a potent shot at a foe who *deserves* it — the round finds the one gap. Arrive in the nick of time to save a life, and that shot costs no spark.
---
id: a-light-shining-in-darkness
type: arcana
name: A Light Shining in Darkness
tier: major
kind: weapon
touchstones: [the Burned Man's hand, engraved scripture, mercy and wrath]
limit: every time you draw it, it asks whether this one could be spared — and the Legion knows the 
  pistol on sight.
source: the-armory/major-weapons#a-light-shining-in-darkness
body: |-
  Joshua Graham's .45 — blued steel, scripture engraved along the slide. It takes +1d against those who prey on the helpless, and once per session a shot lands potent: two to the body, one to the head.
---
id: alien-blaster
type: arcana
name: Alien Blaster
tier: major
kind: weapon
touchstones: [alien tech, disintegration, impossible energy]
pools:
- {name: Cells, dice: 4}
pool: 4
unique_reset: true
limit: 4d Cells; unique reset — inert at 0d until you find its strange ammo. The captain's corpse 
  carried one full box. There is no second box.
source: the-armory/major-weapons#alien-blaster
body: |-
  A palm-sized weapon that disintegrates what it hits — armor, cover, and power plate mean nothing. Roll the Cells pool for a potent shot; mooks are simply gone.
---
id: firelance
type: arcana
name: Firelance
tier: major
kind: weapon
touchstones: [the falling star, alien fire, 'found, never kept']
pools:
- {name: Cells, dice: 3}
pool: 3
unique_reset: true
limit: 3d Cells; unique reset — alien ammunition only. It has never stayed with one owner longer 
  than a story.
source: the-armory/major-weapons#firelance
body: |-
  The falling star — the blaster's wilder cousin, arriving by meteor. Potent bolts that ignore armor and leave the target burning.
---
id: captains-sidearm
type: arcana
name: Captain's Sidearm
tier: major
kind: weapon
touchstones: [command issue, finer tolerance, the bridge's key]
pools:
- {name: Cells, dice: 4}
pool: 4
unique_reset: true
limit: 4d Cells; unique reset — alien ammunition only. Every Zetan alive recognizes mutiny when they
  see it.
source: the-armory/major-weapons#captains-sidearm
body: |-
  The mothership captain's own blaster, machined to a finer tolerance. Potent shots that ignore armor; once per session, one shot silences every alien device in the room for a scene.
---
id: mplx-novasurge
type: arcana
name: MPLX Novasurge
tier: major
kind: weapon
touchstones: [classified stamping, oversized capacitor, test-fire logs]
pools:
- {name: Cells, dice: 3, kind: power}
pool: 3
unique_reset: true
limit: unique reset — it only charges from a fresh fusion core. Every trigger pull gives you a rad 
  mark.
source: the-armory/major-weapons#mplx-novasurge
body: |-
  A classified plasma prototype with a capacitor like a small sun. *3d Cells* power pool for shots that hit like field artillery — every one of them potent.
---
id: grognaks-axe
type: arcana
name: Grognak's Axe
tier: major
kind: weapon
touchstones: [Grognak, savage fury, pulp-comic glory]
pools:
- {name: Fury, dice: 4, kind: power}
pool: 4
limit: it only swings with the Fury for someone who shouts the name of the blow first.
source: the-armory/major-weapons#grognaks-axe
body: |-
  A ridiculous, glorious comic-book battleaxe crackling with borrowed rage. *4d Fury* power pool: roll it to cleave — through mooks, armor, a tough's guard — and once per session, a blow lands potent and sends a tough flying.
---
id: fat-man
type: arcana
name: Fat Man
tier: major
kind: weapon
touchstones: [mini-nuke, catapult, mushroom cloud]
pools:
- {name: Mini-Nukes, dice: 2}
pool: 2
unique_reset: true
limit: 2d Mini-Nukes; unique reset — scavenge warheads. Collateral includes you.
source: the-armory/major-weapons#fat-man
body: |-
  A shoulder catapult for miniature suns. Roll the Mini-Nukes pool for a potent area blast that levels a battlefield — and everything else nearby.
---
id: esther
type: arcana
name: Esther
tier: major
kind: weapon
touchstones: [the crew chief's name, a wide bloom, ignored cover]
pools:
- {name: Mini-Nukes, dice: 2}
pool: 2
unique_reset: true
limit: 2d Mini-Nukes; unique reset — and she expects to be spoken to kindly.
source: the-armory/major-weapons#esther
body: |-
  The pampered Fat Man — named, strapped, maintained like a daughter. Her potent blasts throw wider and ignore cover entirely.
---
id: gauss-rifle
type: arcana
name: Gauss Rifle
tier: major
kind: weapon
touchstones: [magnetic coil, armor-piercing slug, charge and release]
pools:
- {name: Cells, dice: 4, kind: power}
pool: 4
limit: recharge with microfusion cells. Its graveyard siblings — the frost-bitten Anchorage original
  and the double-hungry YCS/186 — each add a story and a quirk.
source: the-armory/major-weapons#gauss-rifle
body: |-
  An Anchorage-cache coilgun that puts one slug through armor, cover, and whatever stood behind them: its shots ignore thorns from both. *4d Cells* power pool, and once per session a potent shot punches a line through everything in it.
---
id: the-auto-axe
type: arcana
name: The Auto Axe
tier: major
kind: weapon
touchstones: [shrieking motor, saw-teeth, industrial fury]
pools:
- {name: Motor, dice: 4, kind: power}
pool: 4
limit: deafening; refuel to recharge. The Mauler, the steelyard's ingot-prize, runs quieter and 
  bites deeper once a fight.
source: the-armory/major-weapons#the-auto-axe
body: |-
  "The Man Opener" — saw-teeth and pistons out of the Pitt. *4d Motor* power pool: roll it to shred mooks, walls, or armor — and once per session, the shredding is potent.
---
id: tesla-cannon
type: arcana
name: Tesla Cannon
tier: major
kind: weapon
touchstones: [arcing lightning, capacitor whine, anti-armor]
pools:
- {name: Charge, dice: 4, kind: power}
pool: 4
limit: recharge with electron packs. Elijah's jury-rigged field version arcs its overload into every
  machine in the scene.
source: the-armory/major-weapons#tesla-cannon
body: |-
  A shoulder-fired thunderbolt built to swat Vertibirds. *4d Charge* power pool: roll it for a strike that overloads one machine, vehicle, or armored target — and once per session, a potent strike knocks the Vertibird out of the sky.
---
id: alien-disintegrator
type: arcana
name: Alien Disintegrator
tier: major
kind: weapon
touchstones: [alien alloys, streaming bolts, mothership ordnance]
pools:
- {name: Cells, dice: 4, kind: power}
pool: 4
unique_reset: true
limit: unique reset — ammunition comes only from the ship. The Vault-Tec copy — the Destabilizer — 
  leaves no corpse and no proof.
source: the-armory/major-weapons#alien-disintegrator
body: |-
  The Zetan service rifle — a stream of crackling bolts across a whole area. *4d Cells* power pool for a potent burst that suppresses or shreds a group.
---
id: the-holorifle
type: arcana
name: The Holorifle
tier: major
kind: weapon
touchstones: [hard light, jury-rigged genius, the Sierra Madre]
pools:
- {name: Focus, dice: 4, kind: power}
pool: 4
limit: microfusion cells; an Inventor can re-tune it between sessions.
source: the-armory/major-weapons#the-holorifle
body: |-
  Elijah's masterwork: hard light that clings and burns. *4d Focus* power pool, and once per session a potent shot. Any shot from it kills a hologram emitter in line of sight.
---
id: the-red-glare
type: arcana
name: The Red Glare
tier: major
kind: weapon
touchstones: [a banner of the old world, rolling thunder, the Divide]
pools:
- {name: Rockets, dice: 3}
pool: 3
unique_reset: true
limit: unique reset — find rockets to reload; collateral follows wherever it points.
source: the-armory/major-weapons#the-red-glare
body: |-
  Ulysses's rocket repeater, walking a line of thunder downrange. *3d Rockets*: each roll a potent barrage across an area or onto one boss.
---
id: anti-materiel-rifle
type: arcana
name: Anti-Materiel Rifle
tier: major
kind: weapon
touchstones: [fifty caliber, the long silence, 'materiel, meaning everything']
pools:
- {name: Rounds, dice: 4, kind: power}
pool: 4
unique_reset: true
limit: unique reset — .50 BMG doesn't grow on trees. Every shot is county news.
source: the-armory/major-weapons#anti-materiel-rifle
body: |-
  Ulysses's other argument — a .50 that treats cover as a suggestion: its shots ignore thorns from armor and cover. *4d Rounds* power pool, and once per session a potent shot through the wall itself.
---
id: this-machine
type: arcana
name: This Machine
tier: major
kind: weapon
touchstones: [the inscription, rifleman's pride, the people's gun]
limit: it shoots straight for anyone; it shoots true for the oppressed.
source: the-armory/major-weapons#this-machine
body: |-
  A battle rifle with its purpose carved on the barrel. +1d against tyrants, slavers, and their uniformed muscle — and once per session, one shot lands potent, and armor doesn't save the deserving.
---
id: lincolns-repeater
type: arcana
name: Lincoln's Repeater
tier: major
kind: weapon
touchstones: [the museum case, an honest man's rifle, sixteen stars]
limit: it jams — every time, insultingly — for anyone the current owner doesn't trust.
source: the-armory/major-weapons#lincolns-repeater
body: |-
  A museum-polished lever-action from an honest man's hand. In a worthy grip it takes +1d — and once per session, an opening shot lands potent.
---
id: paciencia
type: arcana
name: Paciencia
tier: major
kind: weapon
touchstones: [patience spelled out, one round chambered, the long wait]
limit: it does not fire for the restless. It's not jammed. It's disappointed.
source: the-armory/major-weapons#paciencia
body: |-
  A hunting rifle that waits better than you do. Given a full, undisturbed beat, the shot takes +1d and range never thorns it — and once per session, that waited shot lands potent.
---
id: medicine-stick
type: arcana
name: Medicine Stick
tier: major
kind: weapon
touchstones: [the feathers, big medicine, a rite that shoots]
limit: loud enough to wake the map the first time it speaks in any region.
source: the-armory/major-weapons#medicine-stick
body: |-
  A feathered big-bore lever gun, every feather a kill. It hits like a rite: +1d — and its once-a-session potent shot puts big game, any size of big, on the ground.
---
id: christines-cos-silencer-rifle
type: arcana
name: Christine's COS Silencer Rifle
tier: major
kind: weapon
touchstones: [Circle of Steel, a stolen voice, returned favors]
limit: its history is a Brotherhood purge; carrying it is picking a side in it.
source: the-armory/major-weapons#christines-cos-silencer-rifle
body: |-
  The Circle of Steel's memory, in the hands of a woman returning favors. Silenced and range-proof: distance never thorns it. Once per session, the first shot from hiding lands potent.
---
id: reservists-rifle
type: arcana
name: Reservist's Rifle
tier: major
kind: weapon
touchstones: [the chapel window, an officer's zero, no name given]
limit: three men died learning what it does. The chapel keeps the count.
source: the-armory/major-weapons#reservists-rifle
body: |-
  A chapel drifter's rifle and his unshared name. Range never thorns it, and once per session, a first shot from ambush can drop a tough outright on a perfect.
---
id: victory-rifle
type: arcana
name: Victory Rifle
tier: major
kind: weapon
touchstones: [the shack, walnut and patience, a dated inscription]
limit: the date means something to somebody still alive.
source: the-armory/major-weapons#victory-rifle
body: |-
  Locked in a sniper's shack with a name and a date on the grip. Range-proof, +1d — and once per session an opening shot lands potent.
---
id: gobi-campaign-scout-rifle
type: arcana
name: Gobi Campaign Scout Rifle
tier: major
kind: weapon
touchstones: [the Gobi expedition, desert glass, sand that stays]
pools:
- {name: Rounds, dice: 4, kind: power}
pool: 4
unique_reset: true
limit: unique reset — its caliber died with its war.
source: the-armory/major-weapons#gobi-campaign-scout-rifle
body: |-
  Sand in the bolt, murder in the glass — the expedition's only survivor. Range never thorns it. *4d Rounds* power pool, and once per session a potent long shot.
---
id: bozar
type: arcana
name: Bozar
tier: major
kind: weapon
touchstones: [match barrel, belt feed, contradiction in steel]
limit: the reload is a scene. Bring a friend and a bench.
source: the-armory/major-weapons#bozar
body: |-
  A sport rifle gone belt-fed. It takes +1d on sustained fire, and once per session, one potent sweep chews through a whole squad — and the whole belt.
---
id: kiloton-radium-rifle
type: arcana
name: Kiloton Radium Rifle
tier: major
kind: weapon
touchstones: [Atom's blessing, the clicking receiver, Division delivered]
limit: the Children hear every shot as a hymn — and know who's singing it.
source: the-armory/major-weapons#kiloton-radium-rifle
body: |-
  Blessed at the Nucleus, rebuilt around an explosive payload. It takes +1d, what it hits keeps ticking with rads, and once per session a potent shot blasts a whole knot of them.
---
id: a3-21s-plasma-rifle
type: arcana
name: A3-21's Plasma Rifle
tier: major
kind: weapon
touchstones: [the runaway, dampened flash, a bought freedom]
limit: the Institute lists it as stolen property. So is the owner.
source: the-armory/major-weapons#a3-21s-plasma-rifle
body: |-
  A runaway's plasma rifle, stealth-worked barrel and all. It takes +1d from hiding, and once per session a shot from hiding is potent. Every synth who sees it understands.
---
id: the-terrible-shotgun
type: arcana
name: The Terrible Shotgun
tier: major
kind: weapon
touchstones: [Smiling Jack's pride, sawn regret, the muzzle's opinion]
limit: it kicks hard enough to mark you on a messy or worse. Jack smiled through it.
source: the-armory/major-weapons#the-terrible-shotgun
body: |-
  Sawed past all safety by a raider legend. It takes +1d up close, and once per session a point-blank blast is potent.
---
id: dinner-bell
type: arcana
name: Dinner Bell
tier: major
kind: weapon
touchstones: [behind the bar, both barrels, the second time]
limit: reloading mid-course is the whole skill.
source: the-armory/major-weapons#dinner-bell
body: |-
  A restaurant's shotgun that went off twice. It takes +1d up close; once per session, both barrels at once make a potent blast that announces dinner to the county.
---
id: metal-blaster
type: arcana
name: Metal Blaster
tier: major
kind: weapon
touchstones: [split lens, steelyard genius, five answers]
limit: double cells per pull; the Pitt wants its lunatic back.
source: the-armory/major-weapons#metal-blaster
body: |-
  A laser split five ways by a Pitt lunatic. It takes +1d against groups, and once per session a potent fan of beams fills a corridor.
---
id: q-35-matter-modulator
type: arcana
name: Q-35 Matter Modulator
tier: major
kind: weapon
touchstones: [REPCONN's secret, exposed wiring, unstable brilliance]
limit: fragile as its paperwork — a disaster while carrying it cracks the trick until repaired.
source: the-armory/major-weapons#q-35-matter-modulator
body: |-
  An unfinished prototype, wires and promise. Its plasma bolts take +1d, and once per session one destabilizes into a potent blast.
---
id: aer14-prototype
type: arcana
name: AER14 Prototype
tier: major
kind: weapon
touchstones: [sealed installation, test foam, the green line]
limit: the installation that sealed it had reasons.
source: the-armory/major-weapons#aer14-prototype
body: |-
  Still in the test-crate foam, green beam and all. It takes +1d on standard cells, and once per session a shot is potent.
---
id: tesla-beaton-prototype
type: arcana
name: Tesla-Beaton Prototype
tier: major
kind: weapon
touchstones: [the hum, incompatible genius, chained lightning]
limit: your fillings ache carrying it; everything metal is downrange.
source: the-armory/major-weapons#tesla-beaton-prototype
body: |-
  Two incompatible technologies in one humming chassis. It takes +1d against anything metal, and once per session a potent bolt arcs target to target through anything conductive.
---
id: van-graff-plasma-rifle
type: arcana
name: Van Graff Plasma Rifle
tier: major
kind: weapon
touchstones: [family tuning, showroom shine, a standing offer]
limit: the family's buyback offer is not entirely optional.
source: the-armory/major-weapons#van-graff-plasma-rifle
body: |-
  The family's matching plasma frame, tuned across generations. It takes +1d, what it finishes cools as green glass, and once per session a hit is potent.
---
id: yk42b-pulse-rifle
type: arcana
name: YK42B Pulse Rifle
tier: major
kind: weapon
touchstones: [Yuma Flats, the ringing report, 'wrong war, right day']
limit: your ears ring after every shot. So does every radio nearby.
source: the-armory/major-weapons#yk42b-pulse-rifle
body: |-
  The consortium's second, better answer to robots. Against machines and power armor it takes +1d, and once per session a pulse is potent; against meat, it's a shrug.
---
id: lorenzos-artifact-gun
type: arcana
name: Lorenzo's Artifact Gun
tier: major
kind: weapon
touchstones: [the Cabot estate, the crown fragment, pressure without powder]
pools:
- {name: Charges, dice: 3, kind: power}
pool: 3
limit: the charges come back only with a night's sleep near the gem — and repeated use writes 
  strange dreams.
source: the-armory/major-weapons#lorenzos-artifact-gun
body: |-
  A revolver frame around a pulsing alien gem. It fires no bullet: *3d Charges* power pool for an unseen blow that hurls the target flat — and once per session, the blow is potent.
---
id: vengeance
type: arcana
name: Vengeance
tier: major
kind: weapon
touchstones: [the carved name, blackened housing, a cave full of reasons]
limit: four cells a burst — and the name asks a question every time you spin it up.
source: the-armory/major-weapons#vengeance
body: |-
  A Gatling laser with its dead owner's name carved deep. It takes +1d on sustained fire, and once per session a potent burst.
---
id: eugene
type: arcana
name: Eugene
tier: major
kind: weapon
touchstones: [the name, belt discipline, spoken-to steel]
limit: belts by the crate; speak kindly or jam bitterly.
source: the-armory/major-weapons#eugene
body: |-
  A minigun somebody loved enough to name. It takes +1d to suppress on the move, and once per session a potent burst pins a whole line.
---
id: annabelle
type: arcana
name: Annabelle
tier: major
kind: weapon
touchstones: [the nightkin's sniper perch, glowing script, guided grace]
pools:
- {name: Rockets, dice: 2}
pool: 2
unique_reset: true
limit: unique reset — rockets are rockets; the mountain's voices miss her.
source: the-armory/major-weapons#annabelle
body: |-
  A guided launcher off Black Mountain's tower, glowing markings and all. Range never thorns her. *2d Rockets*: each roll a potent blast.
---
id: cleansing-flame
type: arcana
name: Cleansing Flame
tier: major
kind: weapon
touchstones: [the order's scripture, a dead language, purpose-built fire]
limit: the order's last chapter is still looking for it.
source: the-armory/major-weapons#cleansing-flame
body: |-
  A purifier's flamer, scripture on the tank. It takes +1d with fire, and once per session a potent gout; ferals and mutant flora burn like they owe it money.
---
id: drone-cannon-ex-b
type: arcana
name: Drone Cannon Ex-B
tier: major
kind: weapon
touchstones: [turret-born, shoulder-rigged, borrowed sky]
pools:
- {name: Cells, dice: 3}
pool: 3
unique_reset: true
limit: unique reset — alien cells only, and the mothership audits.
source: the-armory/major-weapons#drone-cannon-ex-b
body: |-
  Alien ordnance re-rigged for human shoulders. *3d Cells*: each roll a potent arcing blast.
---
id: precision-gatling-laser
type: arcana
name: Precision Gatling Laser
tier: major
kind: weapon
touchstones: [Enclave refit, narrowed lens, 'longer, hotter, straighter']
limit: four cells a burst; precision draws precise enemies.
source: the-armory/major-weapons#precision-gatling-laser
body: |-
  An armory refit tuned for accuracy over suppression. Range never thorns it, it takes +1d on sustained fire, and once per session a potent burst.
---
id: microwave-emitter
type: arcana
name: Microwave Emitter
tier: major
kind: weapon
touchstones: [St. Aubin, the lighthouse basement, inside-out heat]
limit: you take a rad mark each scene it runs. The lab called that acceptable.
source: the-armory/major-weapons#microwave-emitter
body: |-
  The lighthouse lab's prize — it boils from the inside. Armor never helps against it, and once per session a potent blast cooks a target from the inside out, corpse optional.
---
id: atomic-pulverizer
type: arcana
name: Atomic Pulverizer
tier: major
kind: weapon
touchstones: [black project, copied homework, corporate ambition]
limit: fusion-cell hungry; both originals' owners consider it an insult.
source: the-armory/major-weapons#atomic-pulverizer
body: |-
  Vault-Tec's black-project copy of the atomizer. Against power armor it takes +1d and ignores the plate, and once per session a potent shot cracks a frame open.
---
id: cz57-avenger
type: arcana
name: CZ57 Avenger
tier: major
kind: weapon
touchstones: [the blue truck, factory oil, a camp gone quiet]
limit: belts per scene; the prospectors' story is the price of asking.
source: the-armory/major-weapons#cz57-avenger
body: |-
  A prototype minigun from a truck full of dead prospectors. It takes +1d on sustained fire when you plant your feet, and once per session a potent burst.
---
id: sprtel-wood-9700
type: arcana
name: Sprtel-Wood 9700
tier: major
kind: weapon
touchstones: [two family names, factory stencil, the last shift's pride]
limit: the factory's ruins hold its warranty cards. And its guards.
source: the-armory/major-weapons#sprtel-wood-9700
body: |-
  A Gatling laser named for the families that built it. It takes +1d on sustained fire — on cheap standard cells — and once per session a potent burst.
---
id: the-smitty-special
type: arcana
name: The Smitty Special
tier: major
kind: weapon
touchstones: [the chord, generational tuning, glass gardens]
limit: parts exist in one shop's memory, and the shop is a rumor.
source: the-armory/major-weapons#the-smitty-special
body: |-
  A plasma caster tuned across generations to a three-tone chord. Its bolts take +1d, what it drops cools as green glass, and once per session a bolt is potent.
---
id: mercy
type: arcana
name: Mercy
tier: major
kind: weapon
touchstones: [the deep cave, a Paladin's end, half a box]
pools:
- {name: Belts, dice: 3}
pool: 3
unique_reset: true
limit: unique reset — 40mm belts by the crate; the name was hers, not a promise.
source: the-armory/major-weapons#mercy
body: |-
  A dead Paladin's grenade machine gun, half a box left. *3d Belts*: each roll a potent salvo that turns a warband into a memory.
---
id: final-judgment
type: arcana
name: Final Judgment
tier: major
kind: weapon
touchstones: [the Elder's hand, bridge steel, the Brotherhood watching]
limit: carrying it is a claim. The Brotherhood collects on claims.
source: the-armory/major-weapons#final-judgment
body: |-
  Elder Maxson's own Gatling laser, down from the Prydwen's bridge. It takes +1d on sustained fire, and once per session a potent burst. Every knight on the coast knows it on sight.
---
id: admirals-friend
type: arcana
name: Admiral's Friend
tier: major
kind: weapon
touchstones: [the shipwright's wall, fog-oiled, bigger than boats]
limit: harpoons are hand-forged; the Mariner's ghost audits your throws.
source: the-armory/major-weapons#admirals-friend
body: |-
  The last shipwright's harpoon gun — it has put down things bigger than boats. It takes +1d against anything bigger than you, and once per session its first strike on a big target whose pool is still full is potent.
---
id: jingweis-shocksword
type: arcana
name: Jingwei's Shocksword
tier: major
kind: weapon
touchstones: [the general's surrender, capacitor edge, Anchorage remembered]
limit: it ends fights the way the war ended — expensively.
source: the-armory/major-weapons#jingweis-shocksword
body: |-
  The general's capacitor blade, out of the sim and into the world. It takes +1d, sparking, and once per session a potent strike shorts out a machine or a suit of power armor.
---
id: gehenna
type: arcana
name: Gehenna
tier: major
kind: weapon
touchstones: [artisan fire, the perfect handle, a name from scripture]
limit: fuel-fed; the name is a place you're building one burn at a time.
source: the-armory/major-weapons#gehenna
body: |-
  The artisan's shishkebab — ceramic throat, chromed tank, perfect handle. It takes +1d with flame, what it lights keeps burning until someone rolls in the dirt, and once per session a potent blaze.
---
id: vampires-edge
type: arcana
name: Vampire's Edge
tier: major
kind: weapon
touchstones: [the family's cabinet, borrowed hunger, a believer's edge]
limit: sheathe it unfed after a fight and take vex (hunger). The family believes it needs feeding. 
  Increasingly, so do you.
source: the-armory/major-weapons#vampires-edge
body: |-
  A Chinese officer's sword from a cabinet of very committed believers. It takes +1d, and you can push yourself to let it drink: the cut lands potent.
---
id: pickmans-blade
type: arcana
name: Pickman's Blade
tier: major
kind: weapon
touchstones: [the gallery, a thank-you note, art supplies]
limit: it wants you to make art; the GM takes suspense each session you keep it.
source: the-armory/major-weapons#pickmans-blade
body: |-
  The painter's knife — silent, bleeding, disturbingly clean. It takes +1d, its cuts keep bleeding, and once per session a potent cut.
---
id: protonic-inversal-axe
type: arcana
name: Protonic Inversal Axe
tier: major
kind: weapon
touchstones: [Big MT demolition, proton edge, the hiss]
limit: one fusion cell per scene it's lit — and the axe is always slightly on.
source: the-armory/major-weapons#protonic-inversal-axe
body: |-
  An edge of inverted protons where steel should be. Machines' armor means nothing to it, and once per session a potent cut. The blade hisses at the air.
---
id: blade-of-bastet
type: arcana
name: Blade of Bastet
tier: major
kind: weapon
touchstones: [the Order's oath, molecular coating, a heroine's name]
limit: everyone who remembers the Order expects you to live up to it.
source: the-armory/major-weapons#blade-of-bastet
body: |-
  The Order of Mysteries' molecular edge, forged for a radio-serial oath. Power armor is canvas to it — plate never adds thorns — and once per session a potent cut.
---
id: blade-of-the-east
type: arcana
name: Blade of the East
tier: major
kind: weapon
touchstones: [the Legate's shadow, a car's worth of steel, terror made metal]
limit: you're a rumor by the next town — the Legion wants it back, or you in front of a cohort.
source: the-armory/major-weapons#blade-of-the-east
body: |-
  Legate Lanius's bumper sword, sized for the Monster and nobody else. In hands strong enough (Brawn 3), it takes +1d, scatters mooks like pins, and once per session cleaves with potency; anyone else fights the sword more than the enemy (+1t).
---
id: mesmetron
type: arcana
name: Mesmetron
tier: major
kind: weapon
touchstones: [the dish, loosened minds, Paradise Falls]
pools:
- {name: Mesmer, dice: 4, kind: power}
pool: 4
limit: loud, obvious, despised — being seen using it is a reputation.
source: the-armory/major-weapons#mesmetron
body: |-
  The slaver trade's pacifier — it loosens minds, not flesh. *4d Mesmer* power pool: a hit leaves one thinking target docile and suggestible for a beat — or memorably scrambled on a bad roll — and once per session, the docility lasts the scene.
---
id: k9000-cyberdog-gun
type: arcana
name: K9000 Cyberdog Gun
tier: major
kind: weapon
touchstones: [the brain in the tank, a good dog, Big MT]
limit: it will not fire on anyone it has decided is family.
source: the-armory/major-weapons#k9000-cyberdog-gun
body: |-
  A smartgun with a dog's brain in the tank — growls before you see them, loves one person at a time. It always growls before an ambush (a hint or reveal on vigilance against living threats), and once per session, speak a lost dog's name and its next shot is potent.
---
id: dunwich-bobber
type: arcana
name: Dunwich Bobber
tier: major
kind: weapon
touchstones: [the quarry's dark, cold lacquer, a whispering grain]
limit: past a week, the whisper uses your voice while you sleep — the GM takes suspense each session
  it stays.
source: the-armory/major-weapons#dunwich-bobber
body: |-
  A lacquered bat from the drill floors, cold and certain about who's next. Darkness never thorns you while you carry it, and once per session, a potent swing at something you can't see — the whisper calls the target.
---
id: oh-baby
type: arcana
name: Oh, Baby!
tier: major
kind: weapon
touchstones: [the tuned hammer, hydraulic joy, the name shouted]
limit: subtlety was traded in at purchase.
source: the-armory/major-weapons#oh-baby
body: |-
  A super sledge tuned to rupture instead of compress. It takes +1d, and once per session a potent blow sends a tough airborne.
---
id: fawkes-super-sledge
type: arcana
name: Fawkes' Super Sledge
tier: major
kind: weapon
touchstones: [a friend's gift, mutant-scaled, remembered kindness]
limit: swinging it is a Strength résumé. It reads them.
source: the-armory/major-weapons#fawkes-super-sledge
body: |-
  Built for a lucid mutant who remembers being smaller. In mighty hands (Brawn 3) it takes +1d and, once per session, lands a potent blow; in anyone else's, it's a back injury (+1t).
---
id: the-tenderizer
type: arcana
name: The Tenderizer
tier: major
kind: weapon
touchstones: [the killing floor, union label, a day's work]
limit: the name follows the wielder into every kitchen.
source: the-armory/major-weapons#the-tenderizer
body: |-
  Slaughterhouse-grade, polished by shifts that never ended. It takes +1d, whatever lives through it moves slower for good, and once per session a potent blow.
---
id: old-glory
type: arcana
name: Old Glory
tier: major
kind: weapon
touchstones: [the Old World's flag, the courier's staff, what it still means]
limit: carrying a nation's ghost invites its arguments.
source: the-armory/major-weapons#old-glory
body: |-
  Ulysses's flagstaff — heavier than it looks, older than it should be. It takes +1d against anyone in faction colors, and once per session a potent blow; old soldiers salute before deciding whether to shoot.
---
id: two-step-goodbye
type: arcana
name: Two-Step Goodbye
tier: major
kind: weapon
touchstones: [the delayed charge, a polite name, the second step]
limit: standing near your own victims is contraindicated.
source: the-armory/major-weapons#two-step-goodbye
body: |-
  A ballistic fist with a delayed research charge. It takes +1d, and once per session a potent hit — then, two beats later, the goodbye, wherever they ran.
---
id: fisto
type: arcana
name: Fisto!
tier: major
kind: weapon
touchstones: [the palm plate, assembly-line sincerity, please assume the position]
limit: it introduces itself. There is no setting for that.
source: the-armory/major-weapons#fisto
body: |-
  A manufacturing-grade power fist with its name in the palm. It takes +1d, what it hits relocates ten feet, and once per session a potent punch.
---
id: embrace-of-the-mantis-king
type: arcana
name: Embrace of the Mantis King!
tier: major
kind: weapon
touchstones: [the pulp serial, real chitin, the exclamation point]
limit: mantises take it personally.
source: the-armory/major-weapons#embrace-of-the-mantis-king
body: |-
  Chitin blades off a pulp cover, built for real. It takes +1d to grab, and once per session a potent grab holds a foe still for the whole party — a setup for everyone.
---
id: salt-upon-wounds-power-fist
type: arcana
name: Salt-Upon-Wounds' Power Fist
tier: major
kind: weapon
touchstones: [the sacking of New Canaan, piston fury, a warm trophy]
limit: wearing it is a confession or a challenge; the tribes decide which.
source: the-armory/major-weapons#salt-upon-wounds-power-fist
body: |-
  The warchief's piston fist, taken warm in Zion. It takes +1d, and once per session a potent blow — and every tribe from Zion out knows exactly whose it was.
---
id: shes-embrace
type: arcana
name: She's Embrace
tier: major
kind: weapon
touchstones: [the sow's claws, a rite of passage, earned fury]
limit: the tribe that grants it can revoke it. Bears hold opinions too.
source: the-armory/major-weapons#shes-embrace
body: |-
  A gauntlet from a mother yao guai's claws, given as a rite. Swing with everything (push yourself) for a potent maul.
---
id: jack
type: arcana
name: Jack
tier: major
kind: weapon
touchstones: [the deathclaw cave, industrial patience, a name tag that lies]
limit: one fusion cell per fight of grinding; the cave took the last owner.
source: the-armory/major-weapons#jack
body: |-
  An industrial ripper off a dead Enclave officer, still on its first cell. It takes +1d, armor sheds like bark, and once per session a potent grinding wound.
---
id: fist-of-the-north-rawr
type: arcana
name: Fist of the North Rawr
tier: major
kind: weapon
touchstones: [Rawr's talon, the Courier's Mile, tribal memory]
limit: the Divide remembers Rawr. Some nights, so does the talon.
source: the-armory/major-weapons#fist-of-the-north-rawr
body: |-
  Rawr's own talon on a workbench frame. It takes +1d against anything bigger than you — which, wearing this, is most things worth punching — and once per session a potent blow against one of them.
---
id: experimental-mirv
type: arcana
name: Experimental MIRV
tier: major
expendable: true
kind: weapon
touchstones: [five suns, classified R&D, no second demonstration]
limit: expendable in every sense — the payload, the target, and the neighborhood. It leaves a paper 
  trail.
source: the-armory/major-weapons#experimental-mirv
body: |-
  The Fat Man's classified sibling: five warheads, one trigger pull, one horizon rearranged — a ritual-level act of destruction.
---
id: euclids-c-finder
type: arcana
name: Euclid's C-Finder
tier: mythic
kind: weapon
touchstones: [ARCHIMEDES II, targeting laser, the sky falls]
needs: open sky overhead · the satellite's charge (once per day) · somewhere you don't mind a crater
limit: one ritual-level orbital strike per day; it erases what it touches and announces you to 
  everyone watching the horizon. The charge belongs to whoever holds HELIOS One.
source: the-armory/mythic-weapons#euclids-c-finder
body: |-
  A child's toy ray-gun wired to ARCHIMEDES II — point it at the world and the sky answers with a pillar of focused sunlight.
