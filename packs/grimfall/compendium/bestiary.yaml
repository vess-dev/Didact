  moves: Roboscorpion Bluster, Let the Truth Slip
- name: The Council
  dice: 6
  traits: bickering en masse; shields the lab
  moves: Talk in Circles, Vote to Dissect You
- name: The Lab
  dice: 6
  traits: locked until the Council yields
  moves: Unleash an Experiment, Reprogram a Captive
