body: |-
  A courier in an Old World flag-duster who blames you for the death of a home you never knew you doomed — philosopher, marksman, and keeper of the Divide's sleeping nukes.
---
id: the-think-tank
type: monster
name: The Think Tank
tier: elite
role: trickster
category: Named Threats & Legends
senses:
- hovering monitors with disembodied brains and waldo-claws
- shrill overlapping technobabble and feedback
- disinfectant and old ozone
pools:
- name: Dr. Klein
  dice: 6
  traits: domineering, drowns out all dissent
  moves: Bluster, Override a Colleague
- name: Dr. Mobius
  dice: 4
  traits: the exiled sixth, ranting over the speakers from his Forbidden Zone; addled, and secretly 
