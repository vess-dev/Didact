moves: [Spore Cloud (4d Spore Sickness), Rooted Grasp]
wants: to spread — burn the corpse or meet it again in a week
note: Elites root into the ground and lash with runners. Vault mold is the sessile cousin — a black 
  bloom in sealed rooms whose puff is the trap itself. Fire solves both, permanently.
source: the-bestiary/predators-and-horrors#spore-carrier
body: |-
  A body the fungus kept — it shambles until you're close, then bursts in a choking cloud and keeps coming.
---
id: wendigo
type: monster
name: Wendigo
tier: tough
role: predator
category: Predators & Horrors
senses:
- a starved silhouette in a doorway
- a scream like tearing sheet metal
- a cave that smells of marrow
traits: [horrifying speed, its shriek puts vex in the unready]
moves: [Wall-Crawling Rush, Frenzied Rake]
wants: to feed and to hoard the feeding dark — the hunger is all that's left steering
note: First sight hits the unready with vex (fear). The Colossus — a wendigo that kept eating for 
  decades — is an 8d boss with a behemoth's frame and a deathclaw's speed.
source: the-bestiary/predators-and-horrors#wendigo
body: |-
  What's left of a person who ate the wrong meat to survive — wire-thin, far too fast, and never full again.
