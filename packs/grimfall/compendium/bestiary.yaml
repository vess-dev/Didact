id: tunneler
type: monster
name: Tunneler
tier: tough
role: swarmer
category: Predators & Horrors
senses:
- huge dim-glowing eyes and digging claws
- skittering echoes and shrieks in the black
- damp earth and rot
traits:
- dark-adapted — bright light and loud noise rout them
- floods up from below in numbers
moves: [Tear from the Dark, Drag Under]
wants: to swarm, breed, and spread through the tunnels — not the open light of day
note: A 6d/8d pool in the dark; a true infestation is a ticking campaign pool, not a single fight. 
  An alpha's screech rattles a whole party (+1t for a beat); kill the queen and her hive routs for 
  good.
source: the-bestiary/predators-and-horrors#tunneler
body: |-
  Pale, clawed things that boiled up out of the Divide when its buried warheads tore the ground open — they move in waves through tunnels and dark, and they are spreading.
---
id: lakelurk
type: monster
name: Lakelurk
tier: tough
role: predator
category: Predators & Horrors
senses:
- a wake moving against the current
- one sharp bark, then the charge
- fish rot and wet stone
traits: [faster in the water, its screech staggers through any plate]
moves: [Sonic Screech, Drag to the Depths]
wants: the shoreline, and whatever stands on it — not a fight uphill from the water
note: Threes and fours make a 6d pool. Stagger, then drag — never fight them standing in the 
  shallows.
source: the-bestiary/predators-and-horrors#lakelurk
body: |-
  Fin-crested amphibians of the big lakes — piranha teeth, a barking roar, and a screech that ignores your armor entirely.
---
id: spore-carrier
type: monster
name: Spore Carrier
tier: tough
role: lurker
category: Predators & Horrors
