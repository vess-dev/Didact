- a deafening shriek and the patter of hatchlings
- rot, brine, acid
pools:
- name: The Queen
  dice: 8
  traits: armored bulk, anchored to the nest
  moves: Caustic Spit (ranged, area), Tail Sweep
- name: The Brood
  dice: 4
  traits: a renewing pool; replenishes each time she shrieks them up
  moves: Swarm, Overrun
