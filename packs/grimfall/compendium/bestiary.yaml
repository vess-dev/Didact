role: trickster
category: Machines of the Old World
senses:
- a domed brain-jar on a tracked chassis
- a flat monotone breaking into static and dark mutters
- formaldehyde and hot circuitry
traits:
- mind-scrambling beams (cover and armor don't help)
- erratic, unstable logic
- slow on its treads
moves: [Psychic Pulse (vex — fear or fury), Arm-Laser Fusillade]
wants: to carry out half-corrupted orders — "they could have programmed me to love, to forgive; but 
  noooooo"
note: 'A 6d challenge; its mind-attacks ignore walls and armor, but the brain-dome is the weak point —
  and an EMP or a hack scrambles it. A corrupted one has gone all the way mad: it laughs at wrong moments,
  and nothing you say lands.'
source: the-bestiary/machines-of-the-old-world#robobrain
body: |-
  A treaded pre-war robot crowned with a living human brain in a glass dome — built from prisoners and the mad, and it never lets you forget it.
---
id: sentry-bot
type: monster
name: Sentry Bot
tier: elite
role: blaster
category: Machines of the Old World
senses:
- a massive treaded chassis venting steam
- roaring rotary fire and a warning klaxon
- cordite, hot steel, coolant
traits:
- walking fortress (heavy armor, suppressing fire)
- overheats (vents at the joints under fire)
moves: [Minigun Barrage, Missile Volley]
wants: to hold its ground and grind you down — not to be flanked or to overheat
note: 'A 6d or 8d challenge. Force it to overheat and it vents open — a vulnerability that drops 1d from
  its pool before every roll until it cools. When it drops, clear the room: the reactor goes with it.'
source: the-bestiary/machines-of-the-old-world#sentry-bot
body: |-
  A walking tank bristling with miniguns and missiles — that cooks itself if pushed too hard.
---
id: assaultron
type: monster
name: Assaultron
tier: elite
role: blaster
category: Machines of the Old World
senses:
- a single red optic on a bladed frame
- servo-sprint and a charging head-laser's whine
- scorched metal
traits:
- terrifyingly fast in a straight line
- the head-laser must charge (the glow is the tell)
moves: ['Charging Head-Laser (devastating, telegraphed)', Blade Rush]
wants: to close the distance and carve — not to lose its legs or be kept behind cover
note: A 6d challenge. Cripple the legs to slow it, break the optic to blind it — and clear the room 
  when it drops; some self-destruct. Institute-refit pairs hunt in coordination — two optics, one 
  kill-box.
source: the-bestiary/machines-of-the-old-world#assaultron
body: |-
  A skeletal sprint-chassis combat robot whose face-mounted laser announces death with a slow, rising whine.
---
id: securitron
type: monster
name: Securitron
tier: tough
role: protector
category: Machines of the Old World
senses:
- a monitor face flickering between moods
- one rubber tire humming on tile
- warm electronics
traits: [military-grade shell, the face is a mask over a targeting suite]
moves: [SMG Arm Burst, 'Rocket (one, and it counts)']
wants: the house rules enforced — the house being whoever holds its command codes
note: One is a hard fight; a patrol is a 6d pool. A Mark II upgrade makes each chassis an elite — 
  rockets reload, and the cartoon smiles wider. An army of them is somebody's campaign.
source: the-bestiary/machines-of-the-old-world#securitron
body: |-
  A wheeled one-armed wall of armor with a cartoon face — cop, soldier, or croupier, depending on the screen.
---
id: power-armored-trooper
type: monster
name: Power-Armored Trooper
tier: elite
role: brute
category: Machines of the Old World
senses:
- hulking sealed armor and a glowing helm lamp
- servo-assisted strides and radio chatter
- recycled air, ozone, gun oil
traits: ['sealed frame (ignores small arms, hostile air, fire)', trained and coordinated]
moves: [Suppressing Fire, Power-Fist Charge]
wants: to complete the mission and recover the tech — not the frame breached or the core exposed
note: A 6d challenge; breach a seal or pull the fusion core (a fine setup) and the trooper is 
  suddenly just a person.
source: the-bestiary/machines-of-the-old-world#power-armored-trooper
body: |-
  A disciplined soldier sealed in a powered frame — Brotherhood, Enclave, an NCR heavy trooper, or worse.
---
id: synth-patrol
type: monster
name: Synth Patrol
tier: mook
role: predator
category: Synths & Strangers
senses:
- bare polymer faces and exposed actuators
- flat synthesized challenges — "halt"
- ozone from the relay and gun oil
traits: [feels no pain or fear, arrives in a flash of blue light]
moves: [Laser Crossfire, Call in a Relay]
wants: to complete the retrieval and report back — nothing else registers
note: Gen-1 chrome frames are a 4d pool; Gen-2s crawl even after they should stop. A Gen-3 
  infiltrator is indistinguishable from a person — sometimes even to itself — and plays as an NPC 
  until the reveal. The wreckage marks the Institute's interest, and someone always notices.
source: the-bestiary/synths-and-strangers#synth-patrol
body: |-
  The Institute's retrieval details — chrome skeletons, plastic-faced frames, and the ones you can't tell from people.
---
id: courser
type: monster
name: Courser
tier: elite
role: predator
category: Synths & Strangers
senses:
- a black coat at the edge of your vision
- a calm, level voice giving you one chance
- faint ozone where it just stood
traits:
- stealth-field flicker (thorns to find or hit)
- teleport relay (arrives and leaves in blue light)
moves: ['Institute Laser, Aimed', Drop the Stealth Field Behind You, Recall a Captive]
wants: the target, alive or wiped — not collateral, not conversation, not to lose the chip in its 
  skull
note: 'A 6d challenge with a cold opening: it always offers terms once. The courser chip in its head is
  the prize — and the proof.'
source: the-bestiary/synths-and-strangers#courser
body: |-
  The Institute's hunter-killer synth in a long black coat — patient, polite, and very close to unstoppable.
---
id: zetan
type: monster
name: Zetan
tier: elite
role: trickster
category: Synths & Strangers
senses:
- huge black eyes in gray skin
- clicking, warbling speech
- ozone and sterile cold
traits: [alien energy weapons (disintegrate), teleported in and out by the mothership]
moves: [Atomizer Volley, Paralyze and Abduct]
wants: undamaged specimens — not to lose its tech to primitives
note: Workers are fragile 4d pools with weapons that ignore any armor; guardians in sleek plate are 
  toughs (a squad is a 6d pool); a captain reads your surface thoughts aloud while it decides your 
  shelf. Stasis wardens flash-freeze rather than kill. The abominations on the lower decks — 
  abductees the experiments unmade — attack everything, including their makers. The Flatwoods 
  Monster of Appalachia is one of their scouts, out of uniform.
source: the-bestiary/synths-and-strangers#zetan
body: |-
  Wiry gray beings from a mothership older than the bombs, armed with disintegrators and a casual contempt for the cattle they harvest.
---
id: sierra-madre-hologram
type: monster
name: Sierra Madre Hologram
tier: elite
role: protector
category: Synths & Strangers
senses:
- a flickering figure of light
- a warning chime, then a searing whine
- nothing — light has no smell
traits: ['cannot be harmed, at all', bound to its emitter and route]
moves: ['Emitter Pulse (line of sight, wall to wall)', Escalate to Lethal]
wants: the Villa's order kept — it has no wants; that's the horror
note: 'Weapons pass straight through: the fight is finding the emitter panel (a 4d task hidden in the
  scene) or staying out of the light. The Holorifle kills them in one shot, which is a story in itself.'
source: the-bestiary/synths-and-strangers#sierra-madre-hologram
body: |-
  A hard-light security ghost in gala blue, walking its patrol through walls, bullets, and centuries.
---
id: lobotomite
type: monster
name: Lobotomite
tier: mook
role: swarmer
category: Synths & Strangers
senses:
- surgical scars under a torn patient hood
- grunted half-words — "die… stop you…"
- antiseptic and burnt hair
traits: [no sense of self-preservation, jury-rigged cybernetics]
moves: [Wild Swing, Lob a Grenade (badly)]
wants: to obey half-remembered commands — not that it can truly want anything
note: A 4d pool; the rank-and-file of Big MT, played for grim comedy.
source: the-bestiary/synths-and-strangers#lobotomite
body: |-
  Wastelanders with their brains swapped for Tesla coils by a glitched auto-doc, lurching through Big MT to do the Think Tank's bidding.
---
id: deathclaw
type: monster
name: Deathclaw
tier: boss
role: predator
category: Bosses of the Wasteland
senses:
- hooked claws and predatory stillness
- a low growl, then the crack of a charge
- musk, blood, hot reptile
pools:
- name: The Deathclaw
  dice: 8
  traits: armored hide, frightful presence; only the soft belly is open
  moves: Disemboweling Rake
- name: Slashing Claws
  dice: 6
  traits: shield the belly; get past them first
  moves: Grapple & Gut
- name: Charging Legs
  dice: 6
  traits: pin them or it closes any gap at will
  moves: Lightning Charge, Toss
fail: It drags off a downed PC and vanishes into the dark.
wants: to rule its territory and feed — not to bare its belly or be swarmed and slowed
note: "A linked challenge (6d + 6d + 8d): The Deathclaw itself is locked behind its Claws and Legs — expose
  the belly to reach it. Young run as toughs (a 6d pool) beside a parent; an Alpha leads a pack; the Matriarch
  guards the nest to the death; Enclave-collared ones turn on their handlers the moment the collar breaks;
  the Divide's wind-flayed strain shrugs off the first wound of every fight — the first time its pool
  would drop, it doesn't."
source: the-bestiary/bosses-of-the-wasteland#deathclaw
body: |-
  The apex terror of the wastes — a horned, scaled killing machine faster than anything that big has any right to be.
---
id: super-mutant-behemoth
type: monster
name: Super Mutant Behemoth
tier: boss
role: brute
category: Bosses of the Wasteland
senses:
- a wall of gray-green muscle with a caged hoard of loot
- earthquake footfalls and a window-rattling roar
- carrion, sweat, ruin
pools:
- name: The Behemoth
  dice: 8
  traits: titanic, smashes through cover and walls; the head is the only opening, and only once it's
    brought down or scaled
  moves: Hydrant Sweep (collateral), Boulder Hurl
- name: Its Footing
  dice: 6
  traits: trip, cripple, or blind it to topple the giant and bare the head
  moves: Ground-Shaking Stomp
- name: Climb the Cage
  dice: 4
  traits: scale the loot-cage on its back to reach the head the hard way
  moves: (a traversal route to the weak point)
fail: It brings the building — or the bridge, or the cliffside — down on top of you.
wants: to crush and add your gear to its cage — not to be toppled, scaled, or fought in tight ground
note: A linked challenge — you can't just shoot a two-story giant down; topple it (Footing) or climb
  it (Cage) to crack the locked head.
source: the-bestiary/bosses-of-the-wasteland#super-mutant-behemoth
body: |-
  A super mutant grown monstrous over decades — two stories of fury swinging a fire-hydrant club.
---
id: mirelurk-queen
type: monster
name: Mirelurk Queen
tier: boss
role: blaster
category: Bosses of the Wasteland
