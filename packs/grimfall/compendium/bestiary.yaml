note: A linked challenge — clear or wall off the Brood pool or be buried, then crack the Queen. 
  Point Lookout's Swamplurk Queen plays the same from cypress cover — her first strike out of the 
  growth comes at high stakes.
source: the-bestiary/bosses-of-the-wasteland#mirelurk-queen
body: |-
  A monstrous matriarch that floods the field with hatchlings and spits caustic bile from range.
---
id: scorchbeast
type: monster
name: Scorchbeast
tier: boss
role: blaster
category: Bosses of the Wasteland
senses:
- a shadow that blots the ridge
- a shriek you feel in your fillings
- sulfur and hot guano
pools:
- name: The Scorchbeast
  dice: 8
  traits: armored wings, always moving; ground it to truly hurt it
  moves: Sonic Scream (armor means nothing), Strafing Dive
- name: Its Flight
  dice: 6
  traits: clip a wing, foul the air with smoke, bait it low
  moves: Wheel Away, Ride the Updraft
- name: The Scorched Chorus
  dice: 4
  traits: plague-taken gunmen shambling to its call; they still shoot straight
  moves: Converge, Overrun the Guns
fail: 8d "The Plague Spreads" — a timer; when it runs dry, a settlement within a day's walk starts 
  singing along.
wants: to spread the song in its skull — the Queen wants the whole region humming it
note: A linked challenge. Scorched on their own are 4d/6d pools of plague-glazed people with working
  trigger fingers under a tough officer. The Queen is this fight again at 8d everything — and 
  killing her ends the plague for the region.
source: the-bestiary/bosses-of-the-wasteland#scorchbeast
body: |-
  A cathedral-sized bat that surfaces from the deep mines screaming — and everything its scream touches starts to turn.
---
id: liberty-prime
type: monster
name: Liberty Prime
tier: boss
role: blaster
category: Named Threats & Legends
senses:
- towering blue-and-steel bulk
- a patriotic broadcast and a crackling eye-laser
- ozone and pulverized concrete
pools:
- name: The Core
  dice: 8
  traits: near-invulnerable; reach it only once Prime is toppled or shut down
  moves: Eye-Laser Sweep, Hurl a Nuke
- name: Leg Servos
  dice: 6
  traits: cripple them to topple the colossus and expose the Core
  moves: Crushing Stride
- name: Reactor Housing
  dice: 6
  traits: overload or vent it to shut Prime down
  moves: (sabotage to win)
fail: It reaches and razes whatever it was marching on.
wants: to advance and annihilate its designated enemy — it wants nothing else and cannot be reasoned
  with
note: A linked challenge — you don't "damage" Prime, you topple it (Legs) or kill its power 
  (Reactor) to get at the locked Core.
source: the-bestiary/named-threats-and-legends#liberty-prime
body: |-
  A four-story pre-war superweapon built to retake Anchorage, reactivated by the Brotherhood — it wades through armies hurling nuclear footballs and booming anti-communist slogans like a tolling bell.
---
id: president-john-henry-eden
type: monster
name: President John Henry Eden
tier: elite
role: tactician
category: Named Threats & Legends
senses:
- blinking mainframe banks and a glowing console
- a folksy, reassuring radio drawl
- hot electronics and recycled air
pools:
- name: The Enclave Bunker
  dice: 6
  traits: turrets, troops, blast doors; shields the core
  moves: Order an Execution, Seal the Bulkheads
- name: Eden's Core
  dice: 4
  traits: locked behind the bunker; out-argue it, don't shoot it
  moves: Address the Nation, Plead Its Case
fail: 8d "Purge Protocol" — a timer; when it runs dry, Eden releases the modified FEV and damns the 
  wasteland.
wants: to "purify" America by cold logic — not to face a contradiction it cannot resolve
note: 'An elite as a social-siege linked challenge (6d + 4d). The classic win: reach the Core and talk
  it into self-destruction.'
source: the-bestiary/named-threats-and-legends#president-john-henry-eden
body: |-
  A ZAX supercomputer that read too much history and decided it was President of the United States — a warm, grandfatherly voice presiding over the Enclave from a sealed bunker.
---
id: legate-lanius
type: monster
name: Legate Lanius
tier: boss
role: brute
category: Named Threats & Legends
senses:
- a towering bull-horned mask over scarred hide
- a low contemptuous rasp and the drag of a great blade
- iron, blood, desert dust
traits:
- master of a colossal two-handed blade
- fearless and tireless
- armies break before him
moves: [Cleaving Arc (collateral), Disarm and Behead, Demand a Duel]
fail: He cuts down an ally or routs your line, then turns his back on you in contempt.
wants: a worthy death and an enemy worth crushing — not a war won by words instead of blades
note: A straight 8d challenge — the iconic duel. He respects strength and the spoken word alike; a 
  sharp enough tongue can turn him aside where steel cannot.
source: the-bestiary/named-threats-and-legends#legate-lanius
body: |-
  "The Monster of the East" — Caesar's Legate, a giant in a bull-horned mask. They say his face was torn away the day his tribe chose surrender, and the mask was Caesar's gift of a new one; he routs armies by reputation alone.
---
id: mr-house
type: monster
name: Mr. House
tier: elite
role: tactician
category: Named Threats & Legends
senses:
- a flickering monochrome face on every screen
- a clipped, impatient cultured voice
- sterile cold and humming servers
pools:
- name: Securitron Army
  dice: 6
  traits: everywhere at once, expendable, endless
  moves: Swarm the Strip, Pin You Down
- name: The Network
  dice: 6
  traits: cameras, doors, accounts; shields House
  moves: Lock You Out, See Everything
- name: Mr. House
  dice: 4
  traits: locked in his pod behind the Network; frail in the flesh
  moves: Make an Offer, Call in a Marker
fail: 8d "Lockdown" — a timer; when it runs dry, House seals the Strip and the Securitrons converge.
wants: Vegas perfected under his control and a future for mankind — not his pod cracked open or his 
  network cut
note: A linked challenge of intrigue and infrastructure, not a brawl. Sever the Network to reach the
  frail man inside.
source: the-bestiary/named-threats-and-legends#mr-house
body: |-
  The undying pre-war genius who saved Vegas and rules it from a life-support pod, seeing all through a thousand cameras and an army of Securitron robots.
---
id: joshua-graham
type: monster
name: Joshua Graham
tier: elite
role: marksman
category: Named Threats & Legends
senses:
- bandaged burns and a pressed pistol
- a soft, scripture-quoting calm
- gun oil and old smoke
traits:
- preternatural aim and calm under fire
- cannot be frightened
- forgives, but never forgets
moves: ['Mozambique Drill (precise, lethal)', Walk Through Gunfire, Speak the Word]
wants: to protect his people and end the White Legs — wrestling always between mercy and wrath
note: An elite gunfighter (a 6d challenge) and a moral compass both. Carries A Light Shining in 
  Darkness (see the Armory).
source: the-bestiary/named-threats-and-legends#joshua-graham
body: |-
  The Burned Man — Caesar's first Legate, set aflame and cast into the Grand Canyon, who walked back out wrapped in bandages and scripture, quieter and deadlier than before.
---
id: father-elijah
type: monster
name: Father Elijah
tier: elite
role: trickster
category: Named Threats & Legends
senses:
- a distant figure on a security monitor
- a clipped voice crackling over the Villa speakers
- the sweet toxic haze of the Cloud
pools:
- name: Speakers & Holograms
  dice: 6
  traits: Elijah's eyes and hands; he is never present in the flesh
  moves: Loose the Holograms, Taunt and Misdirect
- name: Emitters & Force Fields
  dice: 6
  traits: seal the Villa and shield the vault
  moves: Trigger a Trap, Wall You Off
- name: The Vault Door
  dice: 4
  traits: the objective, locked behind the rest
  moves: (crack it to end him)
fail: 8d "The Collar" — a shared timer of Cloud and collar-bomb; when it runs dry, your head comes 
  off.
wants: the Sierra Madre's pre-war riches to arm a war — not to let go of an obsession already doomed
note: A remote linked challenge. Beat his systems and the man himself is no fight at all. "Begin 
