# The Canyon Junction Powderkeg and its story kit, The Door Under Junction (Running the
# Wasteland): drop-in pieces the book gives whole. The factions, battlegrounds and faces are
# compendium entries (compendium/powderkeg.yaml); these put them in play with their pools.
generator: powderkeg
title: The Canyon Junction Powderkeg
help: >-
  A drop-in sandbox: Canyon Junction, a water-rich crossroads town that everyone wants and no one
  can hold, and its six factions, each goal a faction pool (listed as pool_1, pool_2 for `didact
  faction turn`), rolled between sessions or whenever the story triggers them; in downtime, roll
  them all, then pick one and run it dry. When one empties, the goal lands on screen, or the
  faction moves against a rival, with a story roll in its favor deciding how it goes. Every other
  faction reacts.
source: running-the-wasteland/the-canyon-junction-powderkeg
