generator: door-under-junction
title: "Story kit: The Door Under Junction"
help: >-
  A first session for the Powderkeg: Canyon Junction's well is failing, and the only pre-war
  purifier for a hundred miles sits behind the vault door the town was built on. Its pressure
  pools (6d The Well Runs Dry, roll it each dawn and whenever water is wasted or fought over; 4d
  The Jackal Boys Come for the Tanks, roll it whenever the town looks weak), its faces, its site
  (6d Crack Vault 113, the Overseer's deputy and a 4d Security Detail), its fail state and its
  question: who gets the water?
source: running-the-wasteland/story-kit-the-door-under-junction
steps:
  - entity:
      key: pressure
      type: track
      name: The Well Runs Dry
      fields: {kind: pool, pool: pressure, value: {value: 6, max: 6}, note: "Roll it each dawn, and whenever water is wasted or fought over. Fail state: at 0d the town turns on itself, and the Garrison declares martial law."}
  - entity:
      key: pressure
      type: track
      name: The Jackal Boys Come for the Tanks
      fields: {kind: pool, pool: pressure, value: {value: 4, max: 4}, note: "Roll it whenever the town looks weak."}
  - entity: {key: face, from: mayor-odalys-reyes}
  - entity: {key: face, from: lt-cass-whitlow}
  - entity: {key: face, from: mother}
  - entity: {key: face, from: splint}
  - entity:
      key: door
      type: track
      name: Crack Vault 113
      fields: {kind: pool, pool: task, value: {value: 6, max: 6}, suspense: 2, traits: [two centuries of corrosion], moves: [Lockout Protocol, Wake the Turrets]}
  - entity: {key: deputy, from: the-overseers-deputy}
  - entity:
      key: detail
      type: track
      name: Security Detail
      fields: {kind: pool, pool: task, value: {value: 4, max: 4}, note: "They believe it's still 2077."}
  - prompt: "The hook, three ways: the Council hires you to open the door before the water quits; the NCR lieutenant wants to know what's down there before the Legion does; a Jackal runner sells you a stolen keycard and a bad feeling."
  - prompt: "The site (a 5-point vault): The Door, 6d Crack Vault 113 (trait: two centuries of corrosion; moves: Lockout Protocol, Wake the Turrets). The Experiment: rationing, every chamber dispenses exactly enough for one fewer person than is standing in it. The Twist: the dwellers never died; they sleep in shifts, and the next shift is due. The Confrontation: the Overseer's deputy (elite · tactician) and a 4d Security Detail who believe it's still 2077. What Vault-Tec Left: a working purifier core, a major haul, and three hundred sleepers who will need the water too."
  - prompt: "Fail state: the well hits 0d, the town turns on itself, and the Garrison declares martial law. The question the night is about: who gets the water?"
