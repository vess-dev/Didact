[project]
name = "didact"
version = "0.1.0.dev0"
description = "Rules engine, dice, oracles and memory for LLM-run solo tabletop RPGs."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "markdown-it-py>=4.2.0",
    "pdoc>=16.0.0",
    "pydantic>=2.14.3",
    "ruamel-yaml>=0.19.1",
    "wn>=1.1.1",
]

[project.scripts]
didact = "didact.cli.main:main"
didact-mcp = "didact.mcp.server:main"

[project.optional-dependencies]
odds = [
    "icepool>=2.2.2,<2.3",  # the odds adapter follows its API; review before widening
]
mcp = [
    "mcp>=2.3.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installed, Didact finds these in didact/shipped (`packs.library.bundled_dir`): core and the
# published .didactpack files, never the other pack folders, which may be private.
include = ["src/didact", "packs/core", "packs/*.didactpack"]
sources = { "src" = "", "packs" = "didact/shipped" }

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "hypothesis>=6.170.15",
    "icepool>=2.2.2,<2.3",  # the odds adapter follows its API; review before widening
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters (…, →, ×) in strings and docs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: timing-sensitive or subprocess-heavy tests"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests", "tools"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
