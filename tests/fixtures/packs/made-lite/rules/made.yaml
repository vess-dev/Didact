# Records a rule makes at once, as a draft's `entity` describes them, bound for later steps;
# one of that type and name already here is taken as it is.
action: bleed
title: Bleeding out
params: {who: ref}
steps:
  - entity:
      type: track
      name: "{@who.name}: Bleeding Out"
      fields: {kind: pool, pool: timer, value: {value: 4, max: 4}, note: dropped}
      links: [{rel: of, to: "@who"}]
    as: bleeding
  - set: who.bleeding
    value: "@bleeding"
  - pool: "@bleeding"
    as: drain
  - "{@who.name} bleeds: {@drain.left}d left on {@bleeding.name}."
---
action: stock
title: The party's shared stimpaks
steps:
  - entity: {key: stimpaks, type: track, name: Party Stimpaks, fields: {kind: pool, pool: resource, value: {value: 3, max: 3}}}
  - for: pcs
    steps:
      - set: member.stimpaks
        value: "@stimpaks"
---
procedure: summon
title: A wolf answers
steps:
  - entity: {from: wolf, tags: [summoned]}
  - "{@npc.name} answers the call with {@npc.hp} HP."
---
action: mistake
title: A record its sheet refuses
steps:
  - entity: {type: npc, name: Shade, fields: {hp: lots}}
