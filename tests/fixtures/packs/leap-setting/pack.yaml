id: leap-setting
name: Leap (test pack)
kind: setting
version: 0.1.0
description: The real calendar, leap years and all, from a Tuesday in October.
requires: {packs: [core]}
license: {spdx: CC0-1.0}
settings:
  # February is a day longer every 4th year, but not every 100th, but every 400th; the week is
  # listed in its own order, and the start says which day of it the start is.
  calendar:
    hours: 24
    week: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
    months:
      - {name: January, days: 31}
      - {name: February, days: 28, leap: [4, 100, 400]}
      - {name: March, days: 31}
      - {name: April, days: 30}
      - {name: May, days: 31}
      - {name: June, days: 30}
      - {name: July, days: 31}
      - {name: August, days: 31}
      - {name: September, days: 30}
      - {name: October, days: 31}
      - {name: November, days: 30}
      - {name: December, days: 31}
    start: {year: 2277, month: 10, day: 23, weekday: Tuesday}
    seasons:
      - {name: spring, month: 3, day: 20}
      - {name: summer, month: 6, day: 21}
      - {name: fall, month: 9, day: 22}
      - {name: winter, month: 12, day: 21}
    holidays:
      - {name: Leap Day, month: 2, day: 29}
